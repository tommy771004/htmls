<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'Segoe UI','Microsoft JhengHei','PingFang TC',sans-serif">
<title>點燈人 · 美術規格 C · 介面</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0f1726"/><stop offset=".45" stop-color="#2a4152"/><stop offset=".8" stop-color="#6b8791"/><stop offset="1" stop-color="#cdb29a"/>
  </linearGradient>
  <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5f7b83"/><stop offset=".2" stop-color="#34515b"/><stop offset="1" stop-color="#0c161d"/>
  </linearGradient>
  <radialGradient id="warm" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff1c9" stop-opacity=".95"/><stop offset=".18" stop-color="#ffb04a" stop-opacity=".6"/><stop offset=".55" stop-color="#ff7a2e" stop-opacity=".15"/><stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="cyan" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#dcffff" stop-opacity=".9"/><stop offset=".3" stop-color="#8ff6ff" stop-opacity=".35"/><stop offset="1" stop-color="#8ff6ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx=".5" cy=".5" r=".72"><stop offset=".6" stop-color="#05090d" stop-opacity="0"/><stop offset="1" stop-color="#05090d" stop-opacity=".75"/></radialGradient>
  <radialGradient id="hurt" cx=".5" cy=".5" r=".72"><stop offset=".55" stop-color="#1b1426" stop-opacity="0"/><stop offset="1" stop-color="#3a2f55" stop-opacity=".85"/></radialGradient>
  <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#070b10" stop-opacity=".88"/><stop offset=".55" stop-color="#070b10" stop-opacity=".35"/><stop offset="1" stop-color="#070b10" stop-opacity="0"/></linearGradient>
  <filter id="mist" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".004 .03" numOctaves="3" seed="7"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .78  0 0 0 0 .85  0 0 0 0 .84  0 0 0 1.7 -.7"/>
  </filter>
  <filter id="blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="bgBlur"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="5"/><feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .07"/></feComponentTransfer>
  </filter>

  <!-- simplified key-art scene, 1600x900 -->
  <symbol id="mini" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <rect width="1600" height="500" fill="url(#sky)"/>
    <circle cx="1150" cy="170" r="240" fill="#bcd0cf" opacity=".12"/>
    <circle cx="1150" cy="170" r="40" fill="#f2ead7"/>
    <path d="M0 450 90 420 200 440 320 395 420 430 540 410 660 452 780 420 900 450 1020 400 1140 436 1260 412 1380 448 1500 410 1600 430V500H0Z" fill="#7f959c"/>
    <path d="M0 480 120 460 260 475 380 452 520 480 660 462 820 488 960 464 1100 486 1240 462 1400 484 1600 466V500H0Z" fill="#5f7a85"/>
    <rect y="500" width="1600" height="400" fill="url(#lake)"/>
    <rect y="380" width="1600" height="220" filter="url(#mist)" opacity=".7"/>
    <path fill-rule="evenodd" d="M650 330H950V520H650ZM800 336A84 84 0 1 0 800 504A84 84 0 1 0 800 336Z" fill="#435f6c"/>
    <path d="M636 320H964L952 334H648Z" fill="#344d59"/><rect x="620" y="516" width="360" height="14" fill="#3a525d"/>
    <circle cx="800" cy="420" r="84" fill="#a9b8b2" opacity=".3"/>
    <g fill="#4f6b77"><rect x="230" y="420" width="24" height="120"/><rect x="298" y="436" width="24" height="104"/><rect x="214" y="404" width="124" height="16"/></g>
    <g><rect x="1076" y="470" width="44" height="90" fill="#3c4e55"/><path d="M1060 470H1136L1126 452H1070Z" fill="#56676b"/>
      <circle cx="1098" cy="430" r="170" fill="url(#warm)"/><path d="M1082 452C1078 430 1092 424 1096 404 1102 420 1112 428 1108 452Z" fill="#fff1c9"/></g>
    <g><ellipse cx="620" cy="760" rx="100" ry="24" fill="#5f6763"/><ellipse cx="770" cy="700" rx="78" ry="18" fill="#5a6461"/><ellipse cx="890" cy="650" rx="60" ry="14" fill="#5c6663"/><ellipse cx="990" cy="606" rx="46" ry="11" fill="#646c67"/></g>
    <path d="M0 740 300 726 540 744 560 900H0Z" fill="#26343a"/><path d="M0 740 300 726 540 744 520 756 0 758Z" fill="#6f7874"/>
    <g transform="translate(400 740)">
      <path d="M-20-6C-18-34-12-54-2-64 10-54 18-34 20-6 8-2-8-2-20-6Z" fill="#9b4636"/>
      <path d="M-11-54C-12-72-4-84 4-90 2-76 14-70 11-54 4-50-4-50-11-54Z" fill="#8a3a2e"/>
      <path d="M8-48 58-100" stroke="#5a3d2a" stroke-width="4"/>
      <circle cx="58" cy="-84" r="90" fill="url(#warm)"/><rect x="50" y="-96" width="16" height="22" fill="#ffd98a"/>
    </g>
    <g transform="translate(700 620)"><circle r="46" fill="url(#cyan)" opacity=".4"/>
      <path d="M0-24C14-24 21-12 20 0 18 11 11 16 7 24L4 18 1 31-3 20-7 28-8 17C-15 13-20 7-20-1-20-14-13-24 0-24Z" fill="#1b1426"/>
      <ellipse cx="-6" cy="-4" rx="2.2" ry="3.2" fill="#e6ffff"/><ellipse cx="6" cy="-4" rx="2.2" ry="3.2" fill="#e6ffff"/></g>
  </symbol>

  <!-- icon set -->
  <symbol id="flame" viewBox="-12 -16 24 32"><path d="M0-14C6-6 10-2 10 5 10 11 5 15 0 15-5 15-10 11-10 5-10-1-6-4-4-9-2-4 0-3 0-14Z" fill="#ffb04a"/><path d="M0 1C3 4 4 6 4 9 4 12 2 13 0 13-2 13-4 12-4 9-4 6-2 5 0 1Z" fill="#fff1c9"/></symbol>
  <symbol id="flameEmpty" viewBox="-12 -16 24 32"><path d="M0-14C6-6 10-2 10 5 10 11 5 15 0 15-5 15-10 11-10 5-10-1-6-4-4-9-2-4 0-3 0-14Z" fill="none" stroke="#efe6d2" stroke-opacity=".35" stroke-width="1.6"/></symbol>
  <symbol id="beaconLit" viewBox="-12 -12 24 24"><path d="M0-10 10 0 0 10-10 0Z" fill="#ffb04a"/><path d="M0-5 5 0 0 5-5 0Z" fill="#fff1c9"/></symbol>
  <symbol id="beaconOff" viewBox="-12 -12 24 24"><path d="M0-10 10 0 0 10-10 0Z" fill="none" stroke="#efe6d2" stroke-opacity=".45" stroke-width="1.6"/></symbol>
  <symbol id="ember" viewBox="-10 -10 20 20"><path d="M0-9 2.4-2.4 9 0 2.4 2.4 0 9-2.4 2.4-9 0-2.4-2.4Z" fill="#ffb04a"/></symbol>
  <symbol id="ticks" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 8V0H8M92 0H100V8M100 92V100H92M8 100H0V92" fill="none" stroke="#efe6d2" stroke-width="1.5" vector-effect="non-scaling-stroke"/></symbol>
</defs>

<rect width="1600" height="1000" fill="#0c131c"/>
<g font-family="Georgia,'PMingLiU',serif" fill="#efe6d2">
  <text x="48" y="64" font-size="13" letter-spacing="4" fill="#ffb04a">LAMPLIGHTER · ART SPEC C</text>
  <text x="48" y="104" font-size="34">介面 · 墨色薄板與燈焰點綴</text>
  <text x="48" y="136" font-size="16" fill="#b8c6c6">HUD 只佔四角｜1px 骨白細框＋四角刻線｜數字一律襯線</text>
</g>
<g font-size="12" fill="#b8c6c6" transform="translate(852 60)">
  <text x="0" y="0" font-size="11" letter-spacing="3" fill="#ffb04a">HUD 配置</text>
  <text x="0" y="24">左上　燈焰＝生命（3）・餘燼收集數</text>
  <text x="0" y="44">中上　目標文字＋三座燈台進度（菱形）</text>
  <text x="0" y="64">右上　計時與區域名　　右下　技能冷卻環</text>
  <text x="0" y="84">場景中　下一個目標的菱形標記＋距離；影魅察覺時頭上出現青色「!」</text>
</g>

<!-- ============ 1 · START SCREEN ============ -->
<g transform="translate(48 180)">
  <text x="0" y="-12" font-size="12" letter-spacing="3" fill="#ffb04a">01 · 開始畫面 TITLE</text>
  <svg width="700" height="394" viewBox="0 0 700 394">
    <use href="#mini" width="700" height="394"/>
    <rect width="700" height="394" fill="url(#leftShade)"/>
    <rect width="700" height="394" fill="url(#vig)"/>
    <text x="44" y="96" font-size="10" letter-spacing="4" fill="#ffb04a">A LANTERN IN THE MIST</text>
    <text x="40" y="160" font-size="64" font-family="Georgia,'PMingLiU',serif" fill="#efe6d2" letter-spacing="6">點燈人</text>
    <text x="44" y="186" font-size="12" letter-spacing="9" fill="#b8c6c6" font-family="Georgia,serif">LAMPLIGHTER</text>
    <text x="44" y="220" font-size="12.5" fill="#d9d3c3">霧湖上的三座燈台熄滅了。提燈渡湖，</text>
    <text x="44" y="240" font-size="12.5" fill="#d9d3c3">點亮它們，打開月門。</text>
    <rect x="44" y="266" width="150" height="38" fill="#ffb04a"/>
    <text x="60" y="290" font-size="14" fill="#141c2b" font-weight="600">開始旅程</text><text x="150" y="290" font-size="10" fill="#5a3d22">Enter</text>
    <rect x="204" y="266" width="96" height="38" fill="#070b10" fill-opacity=".4" stroke="#efe6d2" stroke-opacity=".35"/>
    <text x="222" y="290" font-size="13" fill="#efe6d2">操作說明</text>
    <rect x="310" y="266" width="96" height="38" fill="#070b10" fill-opacity=".4" stroke="#efe6d2" stroke-opacity=".35"/>
    <text x="328" y="290" font-size="13" fill="#efe6d2">美術規格</text>
    <text x="44" y="360" font-size="10" fill="#8fa9b3" letter-spacing="1">WASD 移動 · SPACE 跳 · J／左鍵 揮燈 · SHIFT 閃避 · 滑鼠 視角</text>
  </svg>
  <use href="#ticks" width="700" height="394"/>
</g>

<!-- ============ 2 · HUD ============ -->
<g transform="translate(852 180)">
  <text x="0" y="-12" font-size="12" letter-spacing="3" fill="#ffb04a">02 · 遊戲中 HUD</text>
  <svg width="700" height="394" viewBox="0 0 700 394">
    <use href="#mini" width="700" height="394"/>
    <rect width="700" height="394" fill="url(#vig)" opacity=".7"/>
    <!-- top-left: flames + embers -->
    <use href="#flame" x="22" y="18" width="18" height="24"/><use href="#flame" x="44" y="18" width="18" height="24"/><use href="#flameEmpty" x="66" y="18" width="18" height="24"/>
    <use href="#ember" x="24" y="50" width="12" height="12"/><text x="42" y="61" font-size="14" font-family="Georgia,serif" fill="#efe6d2">24</text><text x="64" y="61" font-size="10" fill="#8fa9b3">/ 40</text>
    <!-- top-center: objective -->
    <rect x="240" y="16" width="220" height="44" fill="#070b10" fill-opacity=".55"/>
    <use href="#ticks" x="240" y="16" width="220" height="44"/>
    <text x="350" y="33" font-size="10" letter-spacing="3" fill="#8fa9b3" text-anchor="middle">目標 · 點亮燈台</text>
    <use href="#beaconLit" x="316" y="38" width="16" height="16"/><use href="#beaconOff" x="342" y="38" width="16" height="16"/><use href="#beaconOff" x="368" y="38" width="16" height="16"/>
    <!-- top-right: timer + zone -->
    <text x="678" y="40" font-size="22" font-family="Georgia,serif" fill="#efe6d2" text-anchor="end">02:14</text>
    <text x="678" y="58" font-size="10" letter-spacing="2" fill="#8fa9b3" text-anchor="end">II · 斷廊</text>
    <!-- world marker over beacon -->
    <g transform="translate(482 186)"><use href="#beaconOff" x="-9" y="-9" width="18" height="18"/><text y="24" font-size="10" fill="#efe6d2" text-anchor="middle">18 m</text></g>
    <!-- enemy alert -->
    <text x="307" y="252" font-size="16" font-weight="700" fill="#8ff6ff" text-anchor="middle">!</text>
    <!-- bottom-left toast -->
    <rect x="22" y="336" width="170" height="34" fill="#070b10" fill-opacity=".55"/><rect x="22" y="336" width="3" height="34" fill="#ffb04a"/>
    <text x="36" y="358" font-size="12" fill="#efe6d2">靠近燈台 · 按 E 點燈</text>
    <!-- bottom-right: actions with cooldown rings -->
    <g transform="translate(560 350)" font-size="9" fill="#efe6d2" text-anchor="middle">
      <circle r="17" fill="#070b10" fill-opacity=".55" stroke="#efe6d2" stroke-opacity=".25"/>
      <circle r="17" fill="none" stroke="#ffb04a" stroke-width="2.5" stroke-dasharray="70 107" transform="rotate(-90)"/>
      <text y="4">揮燈</text><text y="32" fill="#8fa9b3">J</text>
      <g transform="translate(48 0)"><circle r="17" fill="#070b10" fill-opacity=".55" stroke="#efe6d2" stroke-opacity=".25"/><circle r="17" fill="none" stroke="#8fa9b3" stroke-width="2.5"/><text y="4">閃避</text><text y="32" fill="#8fa9b3">SHIFT</text></g>
      <g transform="translate(96 0)"><circle r="17" fill="#070b10" fill-opacity=".55" stroke="#efe6d2" stroke-opacity=".25"/><text y="4">跳</text><text y="32" fill="#8fa9b3">SPACE</text></g>
    </g>
  </svg>
  <use href="#ticks" width="700" height="394"/>
</g>

<!-- ============ 3 · RESULT SCREEN ============ -->
<g transform="translate(48 604)">
  <text x="0" y="-12" font-size="12" letter-spacing="3" fill="#ffb04a">03 · 結算畫面 RESULTS</text>
  <svg width="700" height="394" viewBox="0 0 700 394">
    <g filter="url(#bgBlur)"><use href="#mini" width="700" height="394"/></g>
    <rect width="700" height="394" fill="#070b10" opacity=".45"/>
    <circle cx="560" cy="180" r="200" fill="url(#warm)" opacity=".35"/>
    <rect x="130" y="40" width="440" height="314" fill="#0b111a" fill-opacity=".78"/>
    <use href="#ticks" x="130" y="40" width="440" height="314"/>
    <text x="160" y="76" font-size="10" letter-spacing="4" fill="#ffb04a">THE GATE IS OPEN · 月門開啟</text>
    <text x="158" y="122" font-size="36" font-family="Georgia,'PMingLiU',serif" fill="#efe6d2">霧散了</text>
    <g transform="translate(486 104)"><circle r="40" fill="none" stroke="#ffb04a" stroke-width="2"/><circle r="46" fill="none" stroke="#ffb04a" stroke-opacity=".3"/>
      <text y="16" font-size="46" font-family="Georgia,serif" fill="#ffb04a" text-anchor="middle">A</text><text y="60" font-size="9" letter-spacing="3" fill="#8fa9b3" text-anchor="middle">評級</text></g>
    <g font-size="13" fill="#d9d3c3">
      <path d="M160 172H540M160 204H540M160 236H540M160 268H540" stroke="#efe6d2" stroke-opacity=".12"/>
      <text x="160" y="194">通關時間</text><text x="540" y="194" text-anchor="end" font-family="Georgia,serif" font-size="16" fill="#efe6d2">03:42</text>
      <text x="160" y="226">收集餘燼</text><text x="540" y="226" text-anchor="end" font-family="Georgia,serif" font-size="16" fill="#efe6d2">34 / 40</text>
      <text x="160" y="258">驅散影魅</text><text x="540" y="258" text-anchor="end" font-family="Georgia,serif" font-size="16" fill="#efe6d2">12</text>
      <text x="160" y="290">受傷次數</text><text x="540" y="290" text-anchor="end" font-family="Georgia,serif" font-size="16" fill="#efe6d2">2</text>
    </g>
    <rect x="160" y="306" width="120" height="32" fill="#ffb04a"/><text x="220" y="327" font-size="13" fill="#141c2b" text-anchor="middle" font-weight="600">再走一次</text>
    <rect x="290" y="306" width="100" height="32" fill="none" stroke="#efe6d2" stroke-opacity=".35"/><text x="340" y="327" font-size="13" fill="#efe6d2" text-anchor="middle">回到標題</text>
  </svg>
  <use href="#ticks" width="700" height="394"/>
</g>

<!-- ============ 4 · SPECIMEN ============ -->
<g transform="translate(852 604)">
  <text x="0" y="-12" font-size="12" letter-spacing="3" fill="#ffb04a">04 · 字體・色票・圖示</text>
  <rect width="700" height="394" fill="#0b111a" stroke="#8fa9b3" stroke-opacity=".2"/>
  <text x="24" y="58" font-size="40" font-family="Georgia,'PMingLiU',serif" fill="#efe6d2">點燈人 Aa 03:42</text>
  <text x="24" y="80" font-size="11" fill="#8fa9b3">標題與數字：Songti TC → Noto Serif TC → Georgia → PMingLiU（系統字，不載入網路字型）</text>
  <text x="24" y="112" font-size="16" fill="#efe6d2">靠近燈台 · 按 E 點燈　操作說明　再走一次</text>
  <text x="24" y="132" font-size="11" fill="#8fa9b3">介面內文：Segoe UI → 微軟正黑體 → PingFang TC；小標全大寫、字距 0.3em</text>
  <g transform="translate(24 160)" font-size="10" font-family="Consolas,monospace" fill="#d9d3c3">
    <rect width="54" height="34" fill="#0b111a" stroke="#efe6d2" stroke-opacity=".3"/><text y="48">--ink</text><text y="61" fill="#8b979a">#0B111A/.72</text>
    <rect x="92" width="54" height="34" fill="#efe6d2"/><text x="92" y="48">--bone</text><text x="92" y="61" fill="#8b979a">#EFE6D2</text>
    <rect x="184" width="54" height="34" fill="#ffb04a"/><text x="184" y="48">--amber</text><text x="184" y="61" fill="#8b979a">#FFB04A</text>
    <rect x="276" width="54" height="34" fill="#ff6a2b"/><text x="276" y="48">--ember</text><text x="276" y="61" fill="#8b979a">#FF6A2B</text>
    <rect x="368" width="54" height="34" fill="#8fa9b3"/><text x="368" y="48">--mist</text><text x="368" y="61" fill="#8b979a">#8FA9B3</text>
    <rect x="460" width="54" height="34" fill="#8ff6ff"/><text x="460" y="48">--wisp</text><text x="460" y="61" fill="#8b979a">#8FF6FF</text>
    <rect x="552" width="54" height="34" fill="#3a2f55"/><text x="552" y="48">--hurt</text><text x="552" y="61" fill="#8b979a">#3A2F55</text>
  </g>
  <g transform="translate(24 250)">
    <use href="#flame" x="0" y="0" width="24" height="32"/><use href="#flameEmpty" x="30" y="0" width="24" height="32"/>
    <use href="#beaconLit" x="80" y="4" width="24" height="24"/><use href="#beaconOff" x="110" y="4" width="24" height="24"/>
    <use href="#ember" x="160" y="6" width="20" height="20"/>
    <text x="206" y="26" font-size="22" font-weight="700" fill="#8ff6ff">!</text>
    <g transform="translate(250 16)"><circle r="14" fill="none" stroke="#efe6d2" stroke-opacity=".25"/><circle r="14" fill="none" stroke="#ffb04a" stroke-width="2.5" stroke-dasharray="58 88" transform="rotate(-90)"/></g>
    <g font-size="10" fill="#8fa9b3"><text y="50">生命</text><text x="80" y="50">燈台</text><text x="160" y="50">餘燼</text><text x="200" y="50">察覺</text><text x="238" y="50">冷卻</text></g>
  </g>
  <g transform="translate(330 250)" font-size="11.5" fill="#d9d3c3">
    <text y="10">✓ 半透明墨色薄板，下方可透出場景</text>
    <text y="30">✓ 燈焰色只用在「可行動／已點亮」</text>
    <text y="50">✓ 受傷：邊緣泛影墨紫＋短暫去飽和</text>
    <text y="70">✓ 命中：停頓 70 ms＋震動＋敵人白閃</text>
    <text y="90">✕ 不用純白、膠囊圓角、霓虹發光邊</text>
    <text y="110">✕ 中央不放常駐 UI，準心也不要</text>
  </g>
</g>
<rect width="1600" height="1000" filter="url(#grain)"/>
</svg>
