  <!-- lantern light pool (warm, only near the source) -->
  <ellipse cx="470" cy="820" rx="170" ry="30" fill="#ffb04a" opacity=".22" filter="url(#blur14)"/>
</g>

<!-- HERO (small, back-3/4, facing the path) -->
<g transform="translate(430 818)">
