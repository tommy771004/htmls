  </g>
</g>

<!-- WISPS (cold, jagged, lurking) -->
<g transform="translate(700 690) scale(.9)"><circle r="70" fill="url(#cyan)" opacity=".35"/><use href="#wisp"/></g>
<g transform="translate(1250 720) scale(1.05)"><circle r="80" fill="url(#cyan)" opacity=".3"/><use href="#wisp"/></g>
<g transform="translate(330 572) scale(.45)" opacity=".7"><circle r="80" fill="url(#cyan)" opacity=".3"/><use href="#wisp"/></g>

