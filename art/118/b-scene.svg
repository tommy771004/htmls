  <rect x="566" y="498" width="14" height="72"/><path d="M556 498H590L584 486H562Z"/><rect x="560" y="566" width="26" height="8"/>
</g>
<g opacity=".28" transform="translate(0 1196) scale(1 -1)" filter="url(#blur3)"><rect x="220" y="592" width="300" height="10" fill="#8aa1a8"/></g>

<!-- MOON GATE (destination) -->
<g>
  <path fill-rule="evenodd" d="M632 384H968V582H632ZM800 382A92 92 0 1 0 800 566A92 92 0 1 0 800 382Z" fill="#435f6c"/>
  <path d="M800 382A92 92 0 0 1 892 474" fill="none" stroke="#9fb4b7" stroke-width="2.5" opacity=".7"/>
  <path d="M620 372H980L966 388H634Z" fill="#344d59"/>
