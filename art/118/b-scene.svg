<g opacity=".25" filter="url(#blur6)"><path d="M632 596H968V760H632Z" fill="#415b66"/></g>
<rect x="0" y="540" width="1600" height="120" filter="url(#mist)" opacity=".6" mask="url(#bandB)"/>

