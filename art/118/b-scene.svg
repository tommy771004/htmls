  <path d="M-8-2V-14M10-2V-14" stroke="#23252b" stroke-width="9" stroke-linecap="round"/>
  <path d="M-30-10C-26-44-18-72-4-86C10-72 26-44 30-10C12-4-12-4-30-10Z" fill="url(#cloak)"/>
  <path d="M-30-10C-24-12-20-8-14-12-8-8-2-12 4-9 10-12 18-8 30-10" fill="none" stroke="#4c1d19" stroke-width="3"/>
  <path d="M-16-70C-10-80 12-82 18-68C10-62-6-62-16-70Z" fill="#e7d8b6"/>
  <path d="M16-70C22-66 26-58 22-48" stroke="#e7d8b6" stroke-width="6" fill="none" stroke-linecap="round"/>
