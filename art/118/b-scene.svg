<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'Segoe UI','Microsoft JhengHei','PingFang TC',sans-serif">
<title>點燈人 · 美術規格 B · 場景關鍵圖（霧湖遺跡・藍調時刻）</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="560" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0f1726"/>
    <stop offset=".42" stop-color="#2a4152"/>
    <stop offset=".76" stop-color="#6b8791"/>
    <stop offset=".93" stop-color="#b9a695"/>
    <stop offset="1" stop-color="#d4b69c"/>
  </linearGradient>
  <linearGradient id="lake" x1="0" y1="560" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#6f8a90"/>
    <stop offset=".12" stop-color="#3c5963"/>
    <stop offset=".5" stop-color="#1f3640"/>
    <stop offset="1" stop-color="#0c161d"/>
  </linearGradient>
  <radialGradient id="moonHalo" cx="1130" cy="190" r="300" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#e7eee6" stop-opacity=".55"/>
    <stop offset=".25" stop-color="#b9cfd0" stop-opacity=".22"/>
    <stop offset="1" stop-color="#8fb0b8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="warm" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fff1c9" stop-opacity=".95"/>
    <stop offset=".18" stop-color="#ffb04a" stop-opacity=".6"/>
    <stop offset=".55" stop-color="#ff7a2e" stop-opacity=".16"/>
    <stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="cyan" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#dcffff" stop-opacity=".9"/>
    <stop offset=".3" stop-color="#8ff6ff" stop-opacity=".35"/>
    <stop offset="1" stop-color="#8ff6ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="stoneTop" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7d8581"/>
    <stop offset="1" stop-color="#4f5a5b"/>
  </linearGradient>
  <linearGradient id="stoneFace" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3b4a50"/>
    <stop offset="1" stop-color="#141e24"/>
  </linearGradient>
  <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5e2621"/>
    <stop offset=".6" stop-color="#9b4636"/>
    <stop offset="1" stop-color="#d0704a"/>
  </linearGradient>
  <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="blur3"><feGaussianBlur stdDeviation="2.2"/></filter>
  <filter id="mist" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".0028 .018" numOctaves="4" seed="7"/>
    <feColorMatrix type="matrix" values="0 0 0 0 .78  0 0 0 0 .85  0 0 0 0 .84  0 0 0 1.8 -.72"/>
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer>
  </filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
  </filter>
  <radialGradient id="vig" cx=".5" cy=".48" r=".75">
    <stop offset=".55" stop-color="#05090d" stop-opacity="0"/>
    <stop offset="1" stop-color="#05090d" stop-opacity=".72"/>
  </radialGradient>
  <pattern id="stars" width="220" height="160" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="30" r="1" fill="#dfe8e6" opacity=".7"/><circle cx="130" cy="18" r=".8" fill="#dfe8e6" opacity=".5"/>
    <circle cx="180" cy="96" r="1.1" fill="#dfe8e6" opacity=".6"/><circle cx="70" cy="120" r=".7" fill="#dfe8e6" opacity=".45"/>
  </pattern>
  <linearGradient id="starFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="bandFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".35" stop-color="#fff"/><stop offset=".65" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <mask id="bandA"><rect x="0" y="420" width="1600" height="190" fill="url(#bandFade)"/></mask>
  <mask id="bandB"><rect x="0" y="540" width="1600" height="120" fill="url(#bandFade)"/></mask>
  <mask id="starMask"><rect width="1600" height="560" fill="url(#starFade)"/></mask>
  <g id="wisp">
    <path d="M0-34C20-34 30-18 28 0C26 16 16 22 10 34L6 26 2 44-4 28-10 40-12 24C-22 18-28 10-28-2C-28-20-18-34 0-34Z" fill="#1b1426"/>
    <path d="M-20-6C-14-24 10-30 22-16C8-24-10-20-20-6Z" fill="#3a2f55" opacity=".7"/>
    <circle cx="-9" cy="-6" r="12" fill="url(#cyan)"/><circle cx="9" cy="-6" r="12" fill="url(#cyan)"/>
    <ellipse cx="-9" cy="-6" rx="3" ry="4.4" fill="#e6ffff"/><ellipse cx="9" cy="-6" rx="3" ry="4.4" fill="#e6ffff"/>
  </g>
</defs>

<!-- SKY -->
<rect width="1600" height="560" fill="url(#sky)"/>
<rect width="1600" height="560" fill="url(#stars)" mask="url(#starMask)"/>
<circle cx="1130" cy="190" r="300" fill="url(#moonHalo)"/>
<circle cx="1130" cy="190" r="44" fill="#f2ead7"/>
