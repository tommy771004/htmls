    <rect x="1078" y="664" width="26" height="5" rx="2.5" fill="#ff8a3a" opacity=".6"/><rect x="1070" y="692" width="40" height="4" rx="2" fill="#ff8a3a" opacity=".45"/>
    <rect x="1080" y="726" width="22" height="4" rx="2" fill="#ff7a2e" opacity=".3"/>
  </g>
</g>

