    <rect x="690" y="14" width="36" height="36" fill="#7d8581"/><text x="734" y="30">石灰岩</text><text x="734" y="45" fill="#8b979a">#7D8581</text>
    <rect x="820" y="14" width="36" height="36" fill="#6f8a5b"/><text x="864" y="30">青苔</text><text x="864" y="45" fill="#8b979a">#6F8A5B</text>
    <rect x="950" y="14" width="36" height="36" fill="#9b4636"/><text x="994" y="30">鏽紅斗篷</text><text x="994" y="45" fill="#8b979a">#9B4636</text>
    <rect x="1080" y="14" width="36" height="36" fill="#ffb04a"/><text x="1124" y="30">燈焰</text><text x="1124" y="45" fill="#8b979a">#FFB04A</text>
    <rect x="1210" y="14" width="36" height="36" fill="#fff1c9"/><text x="1254" y="30">燈芯</text><text x="1254" y="45" fill="#8b979a">#FFF1C9</text>
    <rect x="1340" y="14" width="36" height="36" fill="#1b1426"/><text x="1384" y="30">影墨</text><text x="1384" y="45" fill="#8b979a">#1B1426</text>
    <rect x="1470" y="14" width="36" height="36" fill="#8ff6ff"/><text x="1514" y="30">魅眼</text><text x="1514" y="45" fill="#8b979a">#8FF6FF</text>
