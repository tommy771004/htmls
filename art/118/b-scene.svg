<!-- LAKE -->
<rect y="560" width="1600" height="440" fill="url(#lake)"/>
<!-- moon streak reflection -->
<g fill="#e9e6d6" opacity=".55" filter="url(#blur3)">
  <rect x="1106" y="572" width="48" height="3" rx="1.5"/><rect x="1098" y="590" width="62" height="3" rx="1.5" opacity=".8"/>
  <rect x="1112" y="610" width="40" height="3" rx="1.5" opacity=".7"/><rect x="1094" y="634" width="70" height="2.6" rx="1.3" opacity=".55"/>
  <rect x="1116" y="662" width="34" height="2.4" rx="1.2" opacity=".45"/><rect x="1100" y="698" width="58" height="2.4" rx="1.2" opacity=".35"/>
  <rect x="1120" y="740" width="30" height="2" rx="1" opacity=".25"/>
</g>

<!-- DISTANT UNLIT BEACON + COLONNADE (fogged) -->
<g fill="#4f6b77">
  <rect x="236" y="470" width="26" height="128"/><rect x="226" y="462" width="46" height="12"/>
  <rect x="306" y="486" width="26" height="112"/><rect x="296" y="478" width="46" height="12"/>
  <rect x="220" y="448" width="130" height="16"/>
  <path d="M376 598V512L384 500 392 516 402 506V598Z"/>
  <rect x="446" y="530" width="26" height="68"/><path d="M446 530 452 520 460 528 472 518V530Z"/>
  <rect x="200" y="592" width="300" height="14" fill="#435e6a"/>
