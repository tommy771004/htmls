</g>

<rect width="1600" height="1000" filter="url(#grain)"/>
<rect width="1600" height="1000" fill="url(#vig)"/>

<!-- ANNOTATIONS -->
<g font-size="15" fill="#efe6d2" paint-order="stroke" stroke="#0b1218" stroke-width="3" stroke-linejoin="round">
  <g font-family="Georgia,'PMingLiU',serif">
    <text x="48" y="64" font-size="13" letter-spacing="4" fill="#ffb04a">LAMPLIGHTER · ART SPEC B</text>
    <text x="48" y="104" font-size="34">場景關鍵圖 · 霧湖遺跡</text>
    <text x="48" y="136" font-size="16" fill="#b8c6c6">藍調時刻｜冷環境 × 暖光源｜霧中剪影</text>
  </g>
  <g stroke="#efe6d2" stroke-width="1" fill="none" opacity=".75" paint-order="normal">
    <path d="M1130 238V300H1300"/><path d="M968 420H1030V360H1300"/><path d="M1114 470H1300"/>
    <path d="M700 650V600H520V270H348"/><path d="M520 720H660"/><path d="M430 700V650H90V270H262"/>
  </g>
  <g>
    <text x="1308" y="304">月光＝主光源（前方右上・逆光，冷）</text>
    <text x="1308" y="324" fill="#b8c6c6" font-size="13">陰影朝鏡頭拉長，物件只勾冷邊</text>
    <text x="1308" y="364">月門＝終點，全場最大剪影</text>
    <text x="1308" y="384" fill="#b8c6c6" font-size="13">霧距 40–60 m 淡入天色</text>
    <text x="1308" y="474">燈台＝唯一飽和暖色 + bloom</text>
    <text x="1308" y="494" fill="#b8c6c6" font-size="13">點亮後照亮周圍石面與水面</text>
    <text x="348" y="236" text-anchor="start">影魅：黑紫剪影 + 冷青眼</text>
    <text x="348" y="256" fill="#b8c6c6" font-size="13">在暗處也要讀得出來</text>
    <text x="98" y="236">主角永遠帶一團暖光</text>
    <text x="98" y="256" fill="#b8c6c6" font-size="13">燈籠是畫面最亮點</text>
  </g>
</g>

