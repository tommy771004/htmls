<!-- FAR MOUNTAINS (atmospheric perspective: lighter + cooler with distance) -->
<path d="M0 500 70 470 150 488 260 430 350 470 420 452 520 492 600 470 700 505 820 468 930 498 1030 440 1120 476 1210 455 1320 492 1430 446 1520 478 1600 460V560H0Z" fill="#8499a0" opacity=".75"/>
