<g>
  <g transform="translate(1034 660)"><ellipse rx="40" ry="10" cy="8" fill="#1e2d33"/><ellipse rx="40" ry="10" fill="#6b706a"/><path d="M-40 0A40 10 0 0 0 40 0" fill="none" stroke="#f0a060" stroke-width="2" opacity=".55"/></g>
  <g transform="translate(962 700)"><ellipse rx="50" ry="12" cy="10" fill="#1d2b31"/><ellipse rx="50" ry="12" fill="#646c67"/><path d="M-50 0A50 12 0 0 0 50 0" fill="none" stroke="#e59a5e" stroke-width="2" opacity=".35"/></g>
  <g transform="translate(870 748)"><ellipse rx="62" ry="15" cy="13" fill="#1b282e"/><ellipse rx="62" ry="15" fill="#5c6663"/><ellipse rx="30" ry="6" cx="-10" cy="-2" fill="#6e8a59" opacity=".6"/></g>
  <g transform="translate(750 800)"><ellipse rx="76" ry="18" cy="16" fill="#18252b"/><ellipse rx="76" ry="18" fill="#5a6461"/><ellipse rx="38" ry="7" cx="14" cy="-3" fill="#6e8a59" opacity=".55"/></g>
  <g transform="translate(612 852)"><ellipse rx="92" ry="22" cy="20" fill="#16222a"/><ellipse rx="92" ry="22" fill="#626a64"/><ellipse rx="92" ry="22" fill="#ffb04a" opacity=".12"/></g>
  <g stroke="#9ab2b5" stroke-width="1.4" fill="none" opacity=".35">
