  <path d="M4-110C8-100 18-92 18-74" stroke="#d9794d" stroke-width="3" fill="none" opacity=".8"/>
  <!-- pole + lantern -->
  <path d="M14-66 86-138" stroke="#5a3d2a" stroke-width="5" stroke-linecap="round"/>
  <path d="M86-138V-118" stroke="#8a6a44" stroke-width="2"/>
  <circle cx="86" cy="-100" r="120" fill="url(#warm)"/>
  <path d="M74-118H98L102-108 100-84H72L70-108Z" fill="#6b4a2a"/>
  <path d="M76-110H96V-88H76Z" fill="#ffd98a"/>
  <path d="M80-106H92V-92H80Z" fill="#fff4d6"/>
  <path d="M72-84H100L96-78H76Z" fill="#6b4a2a"/>
</g>

<!-- FOREGROUND REEDS (framing, darkest values) -->
<g fill="#0a1217">
  <path d="M1600 1000V760C1580 800 1566 860 1560 1000Z"/>
  <path d="M1540 1000C1536 900 1520 820 1490 770 1508 830 1516 910 1516 1000Z"/>
  <path d="M1500 1000C1480 920 1448 870 1420 850 1442 890 1466 940 1474 1000Z"/>
