    <path d="M20-120 120-230" stroke="#5a3d2a" stroke-width="6" stroke-linecap="round"/>
    <path d="M120-230V-212" stroke="#8a6a44" stroke-width="2"/>
    <rect x="106" y="-212" width="28" height="40" fill="#ffd98a"/><path d="M104-214H136M104-172H136" stroke="#5a3d22" stroke-width="5"/>
  </g>
  <!-- back -->
  <g transform="translate(600 300)">
    <path d="M-16 0V-22M16 0V-22" stroke="#26262c" stroke-width="16" stroke-linecap="round"/>
    <path d="M-62-14C-56-80-40-132-22-152H22C40-132 56-80 62-14C30-2-30-2-62-14Z" fill="#7a3328"/>
    <path d="M-40-150C-48-196-26-236 0-252C26-236 48-196 40-150C20-140-20-140-40-150Z" fill="#84382b"/>
    <path d="M-44-150C-30-160 30-160 44-150C40-138-40-138-44-150Z" fill="#cdbf9f"/>
    <path d="M-8-146C-20-110-30-90-24-60-14-90-4-110 6-140Z" fill="#cdbf9f"/>
    <rect x="-18" y="-100" width="36" height="30" rx="7" fill="#5e4430"/>
  </g>
  <!-- height marker -->
  <g stroke="#efe6d2" stroke-opacity=".6"><path d="M50 300V48M44 48H56M44 300H56"/></g>
  <text x="60" y="176" font-size="13" fill="#efe6d2" transform="rotate(-90 60 176)" text-anchor="middle">1.2 m</text>
  <g font-size="13" fill="#b8c6c6" text-anchor="middle"><text x="140" y="328">正面</text><text x="360" y="328">側面（燈竿前傾 45°）</text><text x="600" y="328">背面（圍巾尾 + 餘燼袋）</text></g>
</g>

<!-- ============ LANTERN CLOSE-UP ============ -->
<g transform="translate(800 540)">
  <text x="0" y="0" font-size="12" letter-spacing="3" fill="#ffb04a">LANTERN · 燈籠</text>
  <rect x="0" y="16" width="230" height="330" fill="#0b111a" opacity=".45" stroke="#8fa9b3" stroke-opacity=".25"/>
  <g transform="translate(115 170) scale(1.25)">
    <circle r="110" fill="url(#warm)" opacity=".8"/>
    <path d="M-28-66H28L36-52H-36Z" fill="#5a3d22"/><circle cy="-80" r="9" fill="none" stroke="#8a6a44" stroke-width="4"/>
    <path d="M-34-52H34V44H-34Z" fill="url(#glass)"/><path d="M-12-52H12V44H-12Z" fill="#fff8e6" opacity=".85"/>
    <path d="M-34-52V44M34-52V44M-12-52V44M12-52V44" stroke="#6b4a2a" stroke-width="5"/>
    <path d="M-38 44H38L30 58H-30Z" fill="#5a3d22"/><path d="M-36-52H36" stroke="#c6934f" stroke-width="3"/>
  </g>
  <g font-size="12" fill="#d9d3c3"><text x="14" y="300">黃銅框 #6B4A2A｜玻璃 #FFD98A</text><text x="14" y="320">燈芯 #FFF1C9（HDR &gt; 1，觸發 bloom）</text></g>
</g>

<!-- ============ SHAPE NOTES ============ -->
<g transform="translate(1060 540)" fill="#efe6d2">
  <text x="0" y="0" font-size="12" letter-spacing="3" fill="#ffb04a">SHAPE LANGUAGE · 造型語彙</text>
  <g font-size="15">
    <text x="0" y="40">▲ 三角：兜帽錐＋鐘形斗篷</text>
    <text x="0" y="62" font-size="13" fill="#b8c6c6">穩定、好讀，遠看也認得出</text>
    <text x="0" y="100">● 圓：頭部開口、燈籠光暈</text>
    <text x="0" y="122" font-size="13" fill="#b8c6c6">柔和、友善；與敵人的尖刺相反</text>
    <text x="0" y="160">◐ 冷暖邊光</text>
    <text x="0" y="182" font-size="13" fill="#b8c6c6">背月側：冷青勾邊｜朝燈側：暖橘受光</text>
    <text x="0" y="220">✦ 動態</text>
    <text x="0" y="242" font-size="13" fill="#b8c6c6">燈籠以單擺晃動，斗篷落地會壓扁回彈</text>
    <text x="0" y="280">✕ 禁止</text>
    <text x="0" y="302" font-size="13" fill="#b8c6c6">寫實五官、金屬高光塑膠感、純黑陰影</text>
  </g>
</g>

<!-- ============ RIVALS ============ -->
<g transform="translate(1340 540)">
  <text x="0" y="0" font-size="12" letter-spacing="3" fill="#ffb04a">RIVALS · 對手</text>
  <rect x="0" y="16" width="220" height="330" fill="#0b111a" opacity=".45" stroke="#8fa9b3" stroke-opacity=".25"/>
  <g transform="translate(60 96) scale(1.15)"><circle r="60" fill="url(#cyan)" opacity=".35"/><use href="#wisp"/></g>
  <text x="112" y="100" font-size="15" fill="#efe6d2">影魅</text>
  <text x="112" y="120" font-size="12" fill="#b8c6c6">尖、碎、拖尾</text>
  <text x="112" y="138" font-size="12" fill="#b8c6c6">巡邏→察覺→撲擊</text>
  <!-- sentinel: stone lantern with cyan eye -->
  <g transform="translate(60 322)">
    <ellipse cy="2" rx="40" ry="8" fill="#05080b" opacity=".6"/>
    <path d="M-30 0H30L24-16H-24Z" fill="#4b5659"/>
    <rect x="-12" y="-60" width="24" height="44" fill="#56626a"/>
    <path d="M-34-60H34L26-74H-26Z" fill="#5f6c72"/>
    <rect x="-24" y="-110" width="48" height="36" fill="#49545a"/>
    <rect x="-10" y="-102" width="20" height="18" fill="#8ff6ff"/>
    <circle cy="-93" r="30" fill="url(#cyan)" opacity=".7"/>
    <path d="M-40-110H40L0-140Z" fill="#5f6c72"/><circle cy="-144" r="6" fill="#5f6c72"/>
  </g>
  <text x="112" y="246" font-size="15" fill="#efe6d2">石燈守</text>
  <text x="112" y="266" font-size="12" fill="#b8c6c6">不動，蓄力射出</text>
  <text x="112" y="284" font-size="12" fill="#b8c6c6">冷光彈，可被揮燈打散</text>
</g>

