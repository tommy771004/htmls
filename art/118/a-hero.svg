  <path d="M-34-52V44M34-52V44M-12-52V44M12-52V44" stroke="#6b4a2a" stroke-width="5"/>
  <path d="M-6 30C-10 10 0 0 2-16 8 0 14 10 8 30Z" fill="#ff8a3a"/>
  <path d="M-2 28C-4 18 0 12 2 4 6 14 8 20 4 28Z" fill="#fff1c9"/>
  <path d="M-38 44H38L30 58H-30Z" fill="#5a3d22"/>
  <path d="M-36-52H36" stroke="#c6934f" stroke-width="3"/>
</g>

<!-- shape-language guides on the big hero -->
<g fill="none" stroke="#efe6d2" stroke-width="1.2" stroke-dasharray="6 6" opacity=".45">
  <path d="M382 212 520 870H244Z"/>
  <circle cx="698" cy="510" r="96"/>
  <circle cx="402" cy="410" r="84"/>
</g>

<!-- ============ HEADER ============ -->
<g font-family="Georgia,'PMingLiU',serif" fill="#efe6d2">
  <text x="48" y="64" font-size="13" letter-spacing="4" fill="#ffb04a">LAMPLIGHTER · ART SPEC A</text>
  <text x="48" y="104" font-size="34">主角 · 點燈人</text>
  <text x="48" y="136" font-size="16" fill="#b8c6c6">身高 1.2 m｜圓 + 三角｜燈籠＝視覺重心</text>
</g>

<!-- ============ TURNAROUND ============ -->
<g transform="translate(800 160)">
  <text x="0" y="0" font-size="12" letter-spacing="3" fill="#ffb04a">TURNAROUND · 三視圖（同比例）</text>
  <rect x="0" y="16" width="760" height="330" fill="#0b111a" opacity=".45" stroke="#8fa9b3" stroke-opacity=".25"/>
  <path d="M20 300H740" stroke="#8fa9b3" stroke-opacity=".4"/>
  <!-- front -->
  <g transform="translate(140 300)"><use href="#heroFront"/></g>
  <!-- side -->
  <g transform="translate(360 300)">
    <path d="M-10 0V-22M10 0V-22" stroke="#26262c" stroke-width="16" stroke-linecap="round"/>
    <path d="M-44-14C-40-80-30-132-18-152H18C34-132 48-80 50-14C20-2-20-2-44-14Z" fill="#8c3d30"/>
