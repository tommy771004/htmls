  <path d="M60-190 290-470" stroke="#5a3d2a" stroke-width="12" stroke-linecap="round"/>
  <path d="M60-190 290-470" stroke="#8a6444" stroke-width="3" stroke-linecap="round" transform="translate(-3 -1)"/>
  <path d="M290-470C302-484 318-480 318-464" fill="none" stroke="#8a6a44" stroke-width="5" stroke-linecap="round"/>
  <path d="M318-464V-434" stroke="#8a6a44" stroke-width="3"/>
</g>
<!-- lantern (big) -->
<g transform="translate(698 510)">
  <circle r="170" fill="url(#warm)"/>
  <path d="M-28-66H28L36-52H-36Z" fill="#5a3d22"/>
  <path d="M-12-80H12V-66H-12Z" fill="#7a5832"/>
