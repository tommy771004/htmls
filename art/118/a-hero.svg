  <!-- moon rim light (cool, left) -->
  <path d="M-130-30C-120-170-96-300-60-386" fill="none" stroke="#9fc0c8" stroke-width="4" opacity=".8" stroke-linecap="round"/>
  <!-- belt + ember pouch -->
  <path d="M-106-178C-40-164 40-164 110-180" fill="none" stroke="#3a2a22" stroke-width="10"/>
  <rect x="44" y="-190" width="46" height="44" rx="10" fill="#5e4430"/>
  <path d="M46-186H88V-172C70-166 60-166 46-172Z" fill="#735638"/>
  <circle cx="67" cy="-160" r="6" fill="#ffb04a"/><circle cx="67" cy="-160" r="18" fill="url(#warm)"/>
  <!-- scarf wrap at neck -->
  <path d="M-72-392C-40-420 44-420 76-392 70-370 40-360 0-360-40-360-66-368-72-392Z" fill="url(#scarf)"/>
  <path d="M-60-380C-30-392 30-392 64-380" fill="none" stroke="#a99d86" stroke-width="3"/>
  <!-- hood: rounded cone, tip bends back -->
  <path d="M-80-392C-100-470-80-552-30-600-8-622 10-640 2-668 40-640 58-600 70-560 92-500 94-440 80-392 40-374-40-374-80-392Z" fill="url(#hood)" filter="url(#cloth)"/>
  <path d="M-80-392C-100-470-80-552-30-600" fill="none" stroke="#9fc0c8" stroke-width="3.5" opacity=".7" stroke-linecap="round"/>
  <path d="M70-560C92-500 94-440 80-392" fill="none" stroke="#ffc07a" stroke-width="5" opacity=".8" stroke-linecap="round"/>
  <!-- hood opening + mask -->
  <ellipse cx="18" cy="-470" rx="60" ry="72" fill="#150f14"/>
  <ellipse cx="24" cy="-466" rx="40" ry="52" fill="#efe3c8"/>
  <path d="M24-518C48-514 64-490 64-466 58-490 44-508 24-518Z" fill="#fff6e2" opacity=".8"/>
  <rect x="6" y="-486" width="9" height="24" rx="4.5" fill="#241a1a"/><rect x="34" y="-486" width="9" height="24" rx="4.5" fill="#241a1a"/>
  <path d="M-12-500C0-520 30-530 50-520" fill="none" stroke="#3a1814" stroke-width="10" opacity=".5"/>
  <!-- arm + mitten -->
  <path d="M70-300C96-300 120-290 134-270" fill="none" stroke="#7c3529" stroke-width="30" stroke-linecap="round"/>
