<body>
<div class="app">
<header class="top"><div class="identity"><span class="icon" aria-hidden="true"></span><div><b>THREAD</b><small>THE DIGITAL EMBROIDERY STUDIO</small></div></div><div class="top-actions"><button id="undo" type="button" title="復原 Ctrl/⌘ + Z">↶ 復原</button><button id="redo" type="button" title="重做 Ctrl/⌘ + Shift + Z">↷ 重做</button><span class="sep"></span><button id="template" type="button">✿ 範本</button><button id="reset" type="button">重設</button><button id="save" type="button">儲存 JSON</button><button id="export" class="export" type="button">↓ 匯出 PNG</button><a href="index.html">返回作品集 ↗</a></div></header>
<aside class="left"><p class="kicker">01 / MAKE</p><h1 class="panel-title">一針一線，畫下來。</h1><section class="group"><h2>工具</h2><div class="tool-list"><button class="tool active" data-tool="needle" type="button"><span class="symbol">♢</span>繡針</button><button class="tool" data-tool="eraser" type="button"><span class="symbol">⌫</span>橡皮擦</button><button class="tool" data-tool="pan" type="button"><span class="symbol">✥</span>平移畫布</button></div></section><section class="group"><h2>針法 / 7 STITCHES</h2><div class="stitch-list">
<button class="stitch active" data-stitch="running" type="button"><span class="symbol">╍</span><span>平針<small>RUNNING</small></span></button><button class="stitch" data-stitch="back" type="button"><span class="symbol">⌁</span><span>回針<small>BACK</small></span></button><button class="stitch" data-stitch="cross" type="button"><span class="symbol">×</span><span>十字繡<small>CROSS</small></span></button><button class="stitch" data-stitch="chain" type="button"><span class="symbol">♧</span><span>鎖鏈繡<small>CHAIN</small></span></button><button class="stitch" data-stitch="satin" type="button"><span class="symbol">▥</span><span>緞面繡<small>SATIN</small></span></button><button class="stitch" data-stitch="knot" type="button"><span class="symbol">·</span><span>法式結粒<small>FRENCH KNOT</small></span></button><button class="stitch" data-stitch="daisy" type="button"><span class="symbol">❀</span><span>雛菊繡<small>LAZY DAISY</small></span></button></div><p>按住繡針並拖曳，放開後會依選定針法落針。</p></section></aside>
<main class="canvas-area" id="canvasArea"><canvas id="mainCanvas" aria-label="刺繡畫布；拖曳繪製，滾輪縮放"></canvas><div class="canvas-head"><span class="canvas-chip" id="stitchLabel">RUNNING STITCH · 平針</span><span class="canvas-chip" id="count">000 STITCHES</span></div><div class="canvas-foot"><span id="zoomText">100% · CANVAS 2D</span><div class="zoom-controls"><button id="zoomOut" type="button" aria-label="縮小">−</button><button id="zoomIn" type="button" aria-label="放大">+</button></div></div><div class="toast" id="toast" role="status"></div></main>
<aside class="right"><p class="kicker">02 / MATERIALS</p><h2 class="panel-title">線與布的選擇</h2><section class="group"><h2>線色色票</h2><div class="palette" id="palette"></div><label class="color-picker">自訂線色 <input type="color" id="color" value="#a95442"></label></section><section class="group"><h2>繡線細節</h2><div class="field"><label for="spacing">針距 <output id="spacingVal">18 px</output></label><input id="spacing" type="range" min="8" max="40" value="18"></div><div class="field"><label for="thickness">線粗 <output id="thicknessVal">5 px</output></label><input id="thickness" type="range" min="2" max="11" value="5"></div><label class="toggle">顯示對位格線 <input id="grid" type="checkbox"></label></section><section class="group"><h2>即時縮圖預覽</h2><div class="preview-frame"><canvas id="miniCanvas" aria-label="刺繡縮圖預覽"></canvas></div><div class="stat"><span>針數</span><b id="statCount">0</b></div><div class="stat"><span>筆畫</span><b id="statStroke">0</b></div><p class="note">布紋由兩道正弦高度場逐像素生成；每一針依序疊六層線色、撚紋與高光。所有內容只在瀏覽器內運算。</p></section></aside>
</div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const canvas=$('#mainCanvas'),ctx=canvas.getContext('2d'),mini=$('#miniCanvas'),mctx=mini.getContext('2d'),area=$('#canvasArea');
const names={running:'RUNNING STITCH · 平針',back:'BACK STITCH · 回針',cross:'CROSS STITCH · 十字繡',chain:'CHAIN STITCH · 鎖鏈繡',satin:'SATIN STITCH · 緞面繡',knot:'FRENCH KNOT · 法式結粒',daisy:'LAZY DAISY · 雛菊繡'};
const swatches=['#a95442','#d08e60','#bdad68','#6b846f','#5e7f91','#8b7897','#9d6d80','#554c46','#e3c8a0','#f2eee2'];
let tool='needle',stitch='running',color='#a95442',spacing=18,thickness=5,grid=false,zoom=1,pan={x:0,y:0},strokes=[],history=[],future=[],activePath=null,pointer=null,dragMode=null,dragStart=null,dirty=true,toastTimer;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),P=(x,y)=>({x,y}),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function rgb(hex){const h=hex.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function shade(hex,f){return '#'+rgb(hex).map(v=>Math.round(clamp(v*f,0,255)).toString(16).padStart(2,'0')).join('')}
function cloth(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),img=x.createImageData(256,256),d=img.data,k=Math.PI*2/9,light=[-.38,-.54,.75];for(let y=0;y<256;y++)for(let xx=0;xx<256;xx++){const ax=k*xx,ay=k*y,sx=Math.sin(ax),sy=Math.sin(ay),cx=Math.cos(ax),cy=Math.cos(ay);const height=.55*sx+.55*sy+.15*sx*sy;const dx=k*(.55*cx+.15*cx*sy),dy=k*(.55*cy+.15*sx*cy);let nx=-dx*1.4,ny=-dy*1.4,nz=1;const inv=1/Math.hypot(nx,ny,nz);nx*=inv;ny*=inv;nz*=inv;const lightness=clamp((nx*light[0]+ny*light[1]+nz*light[2])*.56+.55,0,1);const cross=(Math.cos(ax*2)*Math.cos(ay*2))*.03;const variation=(height*.018+cross+lightness-.5)*52;const i=(y*256+xx)*4;d[i]=clamp(213+variation,0,255);d[i+1]=clamp(201+variation*.95,0,255);d[i+2]=clamp(181+variation*.8,0,255);d[i+3]=255}x.putImageData(img,0,0);return c}
const clothTile=cloth();
function setupCanvas(c){const r=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,Math.round(r.width*dpr));c.height=Math.max(1,Math.round(r.height*dpr));return {w:r.width,h:r.height,dpr}}
function pathLength(path){let total=0;for(let i=1;i<path.length;i++)total+=dist(path[i-1],path[i]);return total}
function sample(path,step){if(!path.length)return [];if(path.length===1)return [path[0]];const result=[path[0]];let next=step,walk=0;for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i],len=dist(a,b);while(walk+len>=next){const t=(next-walk)/len;result.push(P(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t));next+=step}walk+=len}if(dist(result.at(-1),path.at(-1))>step*.35)result.push(path.at(-1));return result}
function tangent(points,i){const a=points[Math.max(0,i-1)],b=points[Math.min(points.length-1,i+1)],l=Math.hypot(b.x-a.x,b.y-a.y)||1;return P((b.x-a.x)/l,(b.y-a.y)/l)}
function polyline(points){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y)}
function shifted(points,offset){return points.map((p,i)=>{const t=tangent(points,i);return P(p.x-t.y*offset,p.y+t.x*offset)})}
// A thread is built in six visible passes: shadow, body, diagonal twist, dark edge, and two light-facing highlights.
function thread(points,hex,width){if(points.length<2)return;ctx.lineCap='round';ctx.lineJoin='round';polyline(shifted(points,width*.24));ctx.strokeStyle='rgba(55,42,35,.22)';ctx.lineWidth=width+2;ctx.stroke();polyline(points);ctx.strokeStyle=hex;ctx.lineWidth=width;ctx.stroke();const L=pathLength(points),marks=sample(points,Math.max(3,width*.9));ctx.strokeStyle=shade(hex,1.25);ctx.globalAlpha=.28;ctx.lineWidth=Math.max(.55,width*.18);for(let i=1;i<marks.length-1;i++){const t=tangent(marks,i),p=marks[i],n=P(-t.y,t.x);ctx.beginPath();ctx.moveTo(p.x-n.x*width*.3-t.x*width*.2,p.y-n.y*width*.3-t.y*width*.2);ctx.lineTo(p.x+n.x*width*.3+t.x*width*.2,p.y+n.y*width*.3+t.y*width*.2);ctx.stroke()}ctx.globalAlpha=1;polyline(shifted(points,width*.38));ctx.strokeStyle=shade(hex,.57);ctx.lineWidth=Math.max(.7,width*.18);ctx.stroke();const side=(tangent(points,0).x*-.54-tangent(points,0).y*-.38)>0?-1:1;polyline(shifted(points,-side*width*.22));ctx.strokeStyle=shade(hex,1.5);ctx.globalAlpha=.68;ctx.lineWidth=Math.max(.8,width*.17);ctx.stroke();polyline(shifted(points,-side*width*.06));ctx.strokeStyle='#fff9e8';ctx.globalAlpha=.2;ctx.lineWidth=Math.max(.55,width*.1);ctx.stroke();ctx.globalAlpha=1}
function bezierLoop(a,b,spread){const t=P((b.x-a.x)/(dist(a,b)||1),(b.y-a.y)/(dist(a,b)||1)),n=P(-t.y,t.x),out=[];for(let i=0;i<=10;i++){const u=i/10;out.push(P(a.x+(b.x-a.x)*u+n.x*Math.sin(Math.PI*u)*spread,a.y+(b.y-a.y)*u+n.y*Math.sin(Math.PI*u)*spread))}return out}
// Each stitch type creates a different needle path, rather than changing only the paint color.
function geometry(stroke){const {path,type,spacing:s,width:w}=stroke,parts=[];if(!path.length)return parts;const pts=sample(path,s);if(type==='running'){for(let i=0;i<pts.length-1;i+=2)parts.push([pts[i],pts[i+1]])}
else if(type==='back'){for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];parts.push([b,a])}}
else if(type==='cross'){for(let i=0;i<pts.length;i++){const p=pts[i],t=tangent(pts,i),n=P(-t.y,t.x),r=s*.36;parts.push([P(p.x-t.x*r-n.x*r,p.y-t.y*r-n.y*r),P(p.x+t.x*r+n.x*r,p.y+t.y*r+n.y*r)]);parts.push([P(p.x-t.x*r+n.x*r,p.y-t.y*r+n.y*r),P(p.x+t.x*r-n.x*r,p.y+t.y*r-n.y*r)])}}
else if(type==='chain'){for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],r=Math.min(s*.36,w*1.7);parts.push(bezierLoop(a,b,r));parts.push(bezierLoop(b,a,r));const t=tangent(pts,i+1);parts.push([b,P(b.x+t.x*r*.38,b.y+t.y*r*.38)])}}
else if(type==='satin'){const fine=sample(path,Math.max(2,w*.65));for(let i=0;i<fine.length;i++){const p=fine[i],t=tangent(fine,i),n=P(-t.y,t.x),r=s*.52;parts.push([P(p.x-n.x*r,p.y-n.y*r),P(p.x+n.x*r,p.y+n.y*r)])}}
else if(type==='knot'){for(const p of pts){const spiral=[];const r=Math.max(w*.75,s*.19);for(let i=0;i<=22;i++){const u=i/22,a=u*Math.PI*4.4,rad=r*(.22+.78*u);spiral.push(P(p.x+Math.cos(a)*rad,p.y+Math.sin(a)*rad))}parts.push(spiral)}}
else if(type==='daisy'){const flowers=sample(path,s*1.7);for(let i=0;i<flowers.length;i++){const a=flowers[i],t=tangent(flowers,i),tip=P(a.x+t.x*s*1.05,a.y+t.y*s*1.05),n=P(-t.y,t.x),r=s*.32;parts.push(bezierLoop(a,tip,r));parts.push(bezierLoop(tip,a,r));parts.push([P(tip.x-n.x*r*.3,tip.y-n.y*r*.3),P(tip.x+n.x*r*.3,tip.y+n.y*r*.3)])}}return parts}
function paintFabric(c,w,h,view){const {scale=1,x=0,y=0}=view;c.save();c.translate(w/2+x,h/2+y);c.scale(scale,scale);const pat=c.createPattern(clothTile,'repeat');c.fillStyle=pat;c.fillRect((-w/2-x)/scale,(-h/2-y)/scale,w/scale,h/scale);c.restore()}
function render(){dirty=false;const r=setupCanvas(canvas),{w,h,dpr}=r;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);paintFabric(ctx,w,h,{scale:zoom,x:pan.x,y:pan.y});ctx.save();ctx.setTransform(dpr*zoom,0,0,dpr*zoom,dpr*(w/2+pan.x),dpr*(h/2+pan.y));if(grid){const left=(-w/2-pan.x)/zoom,top=(-h/2-pan.y)/zoom,right=left+w/zoom,bottom=top+h/zoom;ctx.strokeStyle='rgba(103,83,63,.16)';ctx.lineWidth=1/zoom;ctx.beginPath();for(let x=Math.floor(left/24)*24;x<right;x+=24){ctx.moveTo(x,top);ctx.lineTo(x,bottom)}for(let y=Math.floor(top/24)*24;y<bottom;y+=24){ctx.moveTo(left,y);ctx.lineTo(right,y)}ctx.stroke()}for(const stroke of strokes)for(const part of geometry(stroke))thread(part,stroke.color,stroke.width);if(activePath?.length>1){ctx.globalAlpha=.7;for(const part of geometry({path:activePath,type:stitch,color,spacing,width:thickness}))thread(part,color,thickness);ctx.globalAlpha=1}ctx.restore();if(pointer){const p=pointer;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-.48);ctx.strokeStyle='#403c35';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(0,21);ctx.stroke();ctx.strokeStyle='#f5eee0';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,-26,3,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#a95442';ctx.beginPath();ctx.moveTo(-3,22);ctx.lineTo(3,22);ctx.lineTo(0,29);ctx.fill();ctx.restore()}updateStats();renderMini()}
function renderMini(){const r=setupCanvas(mini),w=r.w,h=r.h,dpr=r.dpr;mctx.setTransform(dpr,0,0,dpr,0,0);paintFabric(mctx,w,h,{scale:.55,x:0,y:0});let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;for(const stroke of strokes)for(const p of stroke.path){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)}const fit=strokes.length?Math.min(1.2,(w-25)/Math.max(60,maxX-minX),(h-25)/Math.max(60,maxY-minY)):.55,cx=strokes.length?(minX+maxX)/2:0,cy=strokes.length?(minY+maxY)/2:0;mctx.save();mctx.setTransform(dpr*fit,0,0,dpr*fit,dpr*(w/2-cx*fit),dpr*(h/2-cy*fit));for(const stroke of strokes){const parts=geometry(stroke);for(const part of parts){mctx.lineCap='round';mctx.lineJoin='round';mctx.strokeStyle=stroke.color;mctx.lineWidth=stroke.width; mctx.beginPath();mctx.moveTo(part[0].x,part[0].y);for(let i=1;i<part.length;i++)mctx.lineTo(part[i].x,part[i].y);mctx.stroke()}}mctx.restore()}
function request(){if(dirty)return;dirty=true;requestAnimationFrame(render)}
function updateStats(){const n=strokes.reduce((a,s)=>a+geometry(s).length,0);$('#count').textContent=String(n).padStart(3,'0')+' STITCHES';$('#statCount').textContent=n;$('#statStroke').textContent=strokes.length;$('#zoomText').textContent=Math.round(zoom*100)+'% · CANVAS 2D';$('#undo').disabled=history.length===0;$('#redo').disabled=future.length===0}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function snapshot(){history.push(JSON.parse(JSON.stringify(strokes)));if(history.length>80)history.shift();future=[]}function commit(stroke){snapshot();strokes.push(stroke);request()}
function point(e){const r=canvas.getBoundingClientRect();return P((e.clientX-r.left-r.width/2-pan.x)/zoom,(e.clientY-r.top-r.height/2-pan.y)/zoom)}
function screenPoint(e){const r=canvas.getBoundingClientRect();return P(e.clientX-r.left,e.clientY-r.top)}
function nearStroke(p,s){const pts=s.path;let best=Infinity;for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],dx=b.x-a.x,dy=b.y-a.y,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1),0,1);best=Math.min(best,dist(p,P(a.x+dx*t,a.y+dy*t)))}return best}
function erase(p){let idx=-1,best=Infinity;strokes.forEach((s,i)=>{const d=nearStroke(p,s);if(d<best){best=d;idx=i}});if(idx>=0&&best<Math.max(14,spacing*.65)){snapshot();strokes.splice(idx,1);request()}}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;canvas.setPointerCapture(e.pointerId);pointer=screenPoint(e);dragMode=tool;if(tool==='needle'){activePath=[point(e)]}else if(tool==='pan'){dragStart={screen:screenPoint(e),pan:{...pan}}}else erase(point(e));request()});
canvas.addEventListener('pointermove',e=>{pointer=screenPoint(e);if(canvas.hasPointerCapture(e.pointerId)){if(dragMode==='needle'&&activePath){const p=point(e);if(dist(p,activePath.at(-1))>2/zoom)activePath.push(p)}else if(dragMode==='pan'&&dragStart){const p=screenPoint(e);pan.x=dragStart.pan.x+p.x-dragStart.screen.x;pan.y=dragStart.pan.y+p.y-dragStart.screen.y}else if(dragMode==='eraser')erase(point(e))}request()});
function release(e){if(dragMode==='needle'&&activePath){const p=point(e);if(dist(p,activePath.at(-1))>2/zoom)activePath.push(p);if(pathLength(activePath)<4)activePath.push(P(activePath[0].x+spacing,activePath[0].y));commit({path:activePath,type:stitch,color,spacing,width:thickness})}activePath=null;dragMode=null;dragStart=null;request()}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('pointerleave',()=>{pointer=null;request()});
function setZoom(v){zoom=clamp(v,.4,3);request()}canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*(e.deltaY<0?1.1:1/1.1))},{passive:false});$('#zoomIn').onclick=()=>setZoom(zoom*1.25);$('#zoomOut').onclick=()=>setZoom(zoom/1.25);
$$('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;$$('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));toast({needle:'繡針：拖曳繪製',eraser:'橡皮擦：點選筆畫移除',pan:'平移：拖曳移動布料'}[tool])});
$$('[data-stitch]').forEach(b=>b.onclick=()=>{stitch=b.dataset.stitch;$$('[data-stitch]').forEach(x=>x.classList.toggle('active',x===b));$('#stitchLabel').textContent=names[stitch]});
function selectColor(c){color=c;$('#color').value=c;$$('.swatch').forEach(b=>b.classList.toggle('active',b.dataset.color===c))}swatches.forEach((c,i)=>{const b=document.createElement('button');b.className='swatch'+(i===0?' active':'');b.type='button';b.style.background=c;b.dataset.color=c;b.setAttribute('aria-label','選擇線色 '+c);b.onclick=()=>selectColor(c);$('#palette').append(b)});$('#color').oninput=e=>selectColor(e.target.value);
$('#spacing').oninput=e=>{spacing=+e.target.value;$('#spacingVal').textContent=spacing+' px'};$('#thickness').oninput=e=>{thickness=+e.target.value;$('#thicknessVal').textContent=thickness+' px'};$('#grid').onchange=e=>{grid=e.target.checked;request()};
function undo(){if(!history.length)return;future.push(JSON.parse(JSON.stringify(strokes)));strokes=history.pop();request()}function redo(){if(!future.length)return;history.push(JSON.parse(JSON.stringify(strokes)));strokes=future.pop();request()}$('#undo').onclick=undo;$('#redo').onclick=redo;
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}});
function heart(){const p=[];for(let i=0;i<=90;i++){const t=i/90*Math.PI*2;p.push(P(9*16*Math.sin(t)**3,-(8*13*Math.cos(t)-5*13*Math.cos(2*t)-2*13*Math.cos(3*t)-13*Math.cos(4*t))*1.35))}return p}
function template(){snapshot();strokes=[];const h=heart();strokes.push({path:h,type:'chain',color:'#a95442',spacing:15,width:5});for(let i=0;i<5;i++){const a=i*.64-.8,base=P(0,130),tip=P(Math.sin(a)*135,130-Math.cos(a)*160),path=[base,P(tip.x*.46,base.y+(tip.y-base.y)*.48),tip];strokes.push({path,type:'daisy',color:i%2?'#b58e55':'#72886a',spacing:30,width:4})}request();toast('已套用程序生成的心形花束範本')}
$('#template').onclick=template;$('#reset').onclick=()=>{snapshot();strokes=[];pan={x:0,y:0};zoom=1;request();toast('畫布已重設')};
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
$('#save').onclick=()=>{download(new Blob([JSON.stringify({format:'thread-embroidery-v1',strokes},null,2)],{type:'application/json'}),'thread-project.json');toast('已儲存專案 JSON')};
$('#export').onclick=()=>{const out=document.createElement('canvas');out.width=1800;out.height=1400;const o=out.getContext('2d'),f=Math.min(out.width/area.clientWidth,out.height/area.clientHeight);paintFabric(o,out.width,out.height,{scale:f*zoom,x:pan.x*f,y:pan.y*f});o.save();o.translate(out.width/2+pan.x*f,out.height/2+pan.y*f);o.scale(f*zoom,f*zoom);for(const s of strokes){for(const part of geometry(s)){paintExportThread(o,part,s.color,s.width)}}o.restore();out.toBlob(blob=>{if(blob){download(blob,'thread-embroidery.png');toast('PNG 已匯出 · 1800 × 1400')}},'image/png')};
function paintExportThread(c,points,hex,width){if(points.length<2)return;const trace=arr=>{c.beginPath();c.moveTo(arr[0].x,arr[0].y);for(let i=1;i<arr.length;i++)c.lineTo(arr[i].x,arr[i].y)};c.lineCap='round';c.lineJoin='round';trace(shifted(points,width*.24));c.strokeStyle='rgba(55,42,35,.22)';c.lineWidth=width+2;c.stroke();trace(points);c.strokeStyle=hex;c.lineWidth=width;c.stroke();const marks=sample(points,Math.max(3,width*.9));c.strokeStyle=shade(hex,1.25);c.globalAlpha=.28;c.lineWidth=Math.max(.55,width*.18);for(let i=1;i<marks.length-1;i++){const t=tangent(marks,i),p=marks[i],n=P(-t.y,t.x);c.beginPath();c.moveTo(p.x-n.x*width*.3-t.x*width*.2,p.y-n.y*width*.3-t.y*width*.2);c.lineTo(p.x+n.x*width*.3+t.x*width*.2,p.y+n.y*width*.3+t.y*width*.2);c.stroke()}c.globalAlpha=1;trace(shifted(points,width*.38));c.strokeStyle=shade(hex,.57);c.lineWidth=Math.max(.7,width*.18);c.stroke();const side=(tangent(points,0).x*-.54-tangent(points,0).y*-.38)>0?-1:1;trace(shifted(points,-side*width*.22));c.strokeStyle=shade(hex,1.5);c.globalAlpha=.68;c.lineWidth=Math.max(.8,width*.17);c.stroke();trace(shifted(points,-side*width*.06));c.strokeStyle='#fff9e8';c.globalAlpha=.2;c.lineWidth=Math.max(.55,width*.1);c.stroke();c.globalAlpha=1}
new ResizeObserver(()=>request()).observe(area);window.addEventListener('resize',request);render();
})();
</script>
