<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WALLSPACE — Open Wall, Bring Your Own Cans</title>
<meta name="description" content="磚牆噴漆畫布：粒子噴霧、停留滴流、模板字與市府灰漆 Buff。收錄於 100 Creative HTML Works（088・街頭塗鴉）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/088-graffiti.html">
<style>
:root{--ink:#111;--paper:#f1ede4;--hazard:#ffd21f;--f:Impact,"Haettenschweiler","Arial Black","Arial Narrow Bold",sans-serif;--b:"Arial Black","Arial Bold",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#3a2620;font-family:var(--b);color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#paint{touch-action:none;cursor:none}
.cursor{position:fixed;left:0;top:0;pointer-events:none;border:1.5px dashed rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5);transform:translate(-50%,-50%);z-index:6;display:none}

.sticker{position:fixed;left:clamp(12px,2vw,26px);top:clamp(12px,2vw,26px);z-index:5;background:var(--paper);padding:10px 16px 12px;transform:rotate(-3deg);
  box-shadow:2px 3px 0 rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.35);max-width:min(330px,calc(100vw - 24px))}
.sticker::before,.sticker::after{content:"";position:absolute;width:64px;height:20px;background:rgba(255,255,240,.55);top:-9px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sticker::before{left:-14px;transform:rotate(-28deg)}.sticker::after{right:-14px;transform:rotate(24deg)}
.sticker h1{margin:0;font-family:var(--f);font-weight:400;font-size:clamp(30px,4vw,48px);line-height:.9;letter-spacing:.01em}
.sticker h1 span{background:var(--ink);color:var(--hazard);padding:0 .1em}
.sticker p{margin:6px 0 0;font-family:Arial,sans-serif;font-size:12px;line-height:1.35;font-weight:700}
.sticker small{display:block;font-family:"Courier New",monospace;font-size:11px;margin-top:6px;font-weight:700}

.dock{position:fixed;left:50%;bottom:clamp(10px,2vh,20px);transform:translateX(-50%);z-index:5;display:flex;align-items:flex-end;gap:10px;
  background:rgba(17,17,17,.88);padding:10px 12px 10px;border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.5);max-width:calc(100vw - 20px)}
.cans{display:flex;gap:4px;align-items:flex-end}
.can{all:unset;cursor:pointer;width:34px;height:74px;display:block;position:relative;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.can svg{width:100%;height:100%;display:block}
.can[aria-checked="true"]{transform:translateY(-10px)}
.can:focus-visible{outline:2px solid #fff;outline-offset:2px}
.can.shake{animation:shake .35s steps(6)}
@keyframes shake{0%,100%{rotate:0deg}25%{rotate:-12deg}50%{rotate:10deg}75%{rotate:-8deg}}
.sep{width:1px;align-self:stretch;background:#444}
.tools{display:grid;grid-template-columns:repeat(3,auto);gap:4px}
.t{all:unset;cursor:pointer;min-width:44px;height:34px;padding:0 8px;background:#262626;color:#eee;font-family:var(--f);font-size:14px;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:3px;text-transform:uppercase}
.t:hover{background:#333}
.t[aria-pressed="true"]{background:var(--hazard);color:#111}
.t:focus-visible{outline:2px solid #fff;outline-offset:1px}
.caps{display:flex;gap:4px}
.caps .t{min-width:40px}
.caps i{display:block;border-radius:50%;background:currentColor}
.stencil{display:flex;gap:4px;grid-column:1/-1}
.stencil input{height:34px;width:150px;border:0;border-radius:3px;background:#f1ede4;font-family:var(--f);font-size:17px;padding:0 8px;letter-spacing:.04em;text-transform:uppercase;min-width:0}
.stencil input:focus{outline:2px solid var(--hazard)}
.hint{position:fixed;right:clamp(12px,2vw,26px);top:clamp(14px,2vw,28px);z-index:5;font-family:"Courier New",monospace;font-weight:700;font-size:12px;color:#111;background:var(--hazard);padding:6px 10px;transform:rotate(2deg);box-shadow:2px 2px 0 rgba(0,0,0,.4);max-width:260px;line-height:1.35}
.hint b{font-family:var(--f);font-weight:400;font-size:15px;letter-spacing:.04em}

@media (max-width:760px){
  .hint{display:none}
  .dock{left:8px;right:8px;transform:none;flex-direction:column;align-items:stretch;gap:8px;padding:8px}
  .cans{overflow-x:auto;padding-top:12px;margin-top:-12px;-webkit-overflow-scrolling:touch}
  .can{flex:none;width:32px;height:62px}
  .sep{display:none}
  .tools{grid-template-columns:auto auto 1fr;align-items:center}
  .stencil{grid-column:auto}
  .stencil input{width:100%}
  .sticker p{display:none}
}
@media (prefers-reduced-motion:reduce){.can{transition:none}.can.shake{animation:none}}
</style>
</head>
<body>
<canvas id="wall" aria-hidden="true"></canvas>
<canvas id="paint" aria-label="Brick wall you can spray paint on"></canvas>
<div class="cursor" id="cur"></div>

<div class="sticker">
  <h1>WALL<span>SPACE</span></h1>
  <p>Legal wall. Open 24/7. The city buffs it on Mondays, so don’t get attached.</p>
  <small>// hold to spray · linger for drips</small>
</div>
<div class="hint"><b>KEYS</b> 1–0 colours · [ ] cap size · S stencil · B buff · Z undo</div>

<div class="dock" role="toolbar" aria-label="Spray tools">
  <div class="cans" id="cans" role="radiogroup" aria-label="Paint colour"></div>
  <div class="sep"></div>
  <div class="tools">
    <div class="caps" role="radiogroup" aria-label="Cap size">
      <button class="t" type="button" data-cap="10" aria-pressed="false" aria-label="Skinny cap"><i style="width:5px;height:5px"></i></button>
      <button class="t" type="button" data-cap="24" aria-pressed="true" aria-label="Standard cap"><i style="width:10px;height:10px"></i></button>
      <button class="t" type="button" data-cap="46" aria-pressed="false" aria-label="Fat cap"><i style="width:16px;height:16px"></i></button>
    </div>
    <button class="t" type="button" id="buff" aria-label="Buff the wall">Buff</button>
    <button class="t" type="button" id="undo" aria-label="Undo">Undo</button>
    <div class="stencil"><button class="t" type="button" id="stBtn" aria-pressed="false">Stencil</button><input id="stTxt" value="WET PAINT" maxlength="14" aria-label="Stencil text"></div>
  </div>
</div>

<script>
(function(){
"use strict";
var wall=document.getElementById('wall'),paint=document.getElementById('paint');
if(!wall||!paint||!wall.getContext) return;
var wc=wall.getContext('2d'),pc=paint.getContext('2d');
var W=0,H=0,DPR=1;
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var COLORS=[['Blackout','#141414'],['Chalk','#f4f1ea'],['Chrome','#c4c8cc'],['Fire Red','#e3262e'],['Blood Orange','#ff6a13'],['Hazard','#ffd21f'],['Acid','#7ed321'],['Sky','#27c0ff'],['Ultraviolet','#8e44ff'],['Bubblegum','#ff4fa3']];
var S={color:'#ff6a13',cap:24,stencil:false};

// seeded rng for the wall so it looks the same every visit
var seed=88;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}

function size(){
  var oldW=paint.width,oldH=paint.height,copy=null;
  if(oldW&&oldH){copy=document.createElement('canvas');copy.width=oldW;copy.height=oldH;copy.getContext('2d').drawImage(paint,0,0);}
  DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;
  [wall,paint].forEach(function(c){c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);});
  wc.setTransform(DPR,0,0,DPR,0,0);pc.setTransform(DPR,0,0,DPR,0,0);
  drawWall();
  if(copy){pc.save();pc.setTransform(1,0,0,1,0,0);pc.drawImage(copy,0,0);pc.restore();}
}

function drawWall(){
  seed=88;
  var bh=Math.max(26,Math.min(36,H/26)),bw=bh*2.55,mortar=4;
  wc.fillStyle='#8f8a80';wc.fillRect(0,0,W,H);
  var rows=Math.ceil(H/bh)+1;
  for(var r=0;r<rows;r++){
    var off=(r%2)*bw/2;
    for(var x=-bw;x<W+bw;x+=bw){
      var hue=8+rnd()*14,sat=38+rnd()*22,lig=28+rnd()*14;
      if(rnd()<.06){lig+=10;sat-=10;}
      wc.fillStyle='hsl('+hue+','+sat+'%,'+lig+'%)';
      var bx=x+off+mortar/2,by=r*bh+mortar/2,w=bw-mortar,h=bh-mortar;
      wc.fillRect(bx,by,w,h);
      // brick face texture
      for(var k=0;k<14;k++){wc.fillStyle='rgba('+(rnd()<.5?'0,0,0':'255,230,210')+','+(rnd()*.08).toFixed(3)+')';wc.fillRect(bx+rnd()*w,by+rnd()*h,1+rnd()*6,1+rnd()*3);}
      wc.fillStyle='rgba(0,0,0,.18)';wc.fillRect(bx,by+h-2,w,2);
      wc.fillStyle='rgba(255,255,255,.07)';wc.fillRect(bx,by,w,1.5);
      if(rnd()<.05){wc.fillStyle='rgba(0,0,0,.25)';wc.beginPath();wc.moveTo(bx+rnd()*w,by);wc.lineTo(bx+rnd()*w,by+h);wc.lineTo(bx+rnd()*w+3,by+h);wc.fill();}
    }
  }
  // old buffed patches (city grey paint over old pieces)
  for(var p=0;p<3;p++){
    var px=rnd()*W*.9,py=H*.08+rnd()*H*.6,pw=160+rnd()*240,ph=70+rnd()*110,col=[128+rnd()*20|0,122+rnd()*14|0,112+rnd()*14|0];
    for(var q=0;q<ph;q+=3){wc.fillStyle='rgba('+col[0]+','+col[1]+','+col[2]+','+(.8+rnd()*.15).toFixed(2)+')';wc.fillRect(px+(rnd()-.5)*8,py+q,pw+(rnd()-.5)*14,3);}
    wc.fillStyle='rgba(0,0,0,.08)';for(var q2=0;q2<30;q2++) wc.fillRect(px+rnd()*pw,py+rnd()*ph,10+rnd()*40,1);
  }
  // grime: soot gradient at the bottom, water stains down the top
  var g=wc.createLinearGradient(0,H*.55,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(10,6,4,.55)');
  wc.fillStyle=g;wc.fillRect(0,0,W,H);
  for(var s=0;s<6;s++){var sx=rnd()*W,sw=30+rnd()*60,sh=H*(.2+rnd()*.4);wc.save();wc.translate(sx,0);wc.scale(1,sh/sw);var gr=wc.createRadialGradient(0,0,0,0,0,sw);gr.addColorStop(0,'rgba(20,14,10,.28)');gr.addColorStop(1,'rgba(20,14,10,0)');wc.fillStyle=gr;wc.beginPath();wc.arc(0,0,sw,0,6.283);wc.fill();wc.restore();}
  var v=wc.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');
  wc.fillStyle=v;wc.fillRect(0,0,W,H);
}

// ---------- spray engine ----------
var GRID=10,acc={};
var drips=[];
function gauss(){var u=Math.random()||1e-6,v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283*v);}
function sprayAt(x,y,r,color,dt){
  var n=Math.round(r*r*.11*(dt*60));
  pc.fillStyle=color;
  // soft core builds opacity
  var g=pc.createRadialGradient(x,y,0,x,y,r*.75);g.addColorStop(0,hexA(color,.16*dt*60));g.addColorStop(1,hexA(color,0));
  pc.fillStyle=g;pc.beginPath();pc.arc(x,y,r*.75,0,6.283);pc.fill();
  pc.fillStyle=color;
  for(var i=0;i<n;i++){
    var a=Math.random()*6.283,d=Math.min(r*1.4,Math.abs(gauss())*r*.42),dx=Math.cos(a)*d,dy=Math.sin(a)*d;
    pc.globalAlpha=.3+Math.random()*.6;
    var s=(.35+Math.random()*1.1)*(r>30?1.3:1);
    pc.fillRect(x+dx,y+dy,s,s);
  }
  pc.globalAlpha=1;
  // paint accumulates -> drips
  var key=Math.round(x/GRID)+','+Math.round(y/GRID);
  acc[key]=(acc[key]||0)+dt*60*(r<14?1.6:1);
  if(acc[key]>34+r*.35){acc[key]=-40;addDrip(x+gauss()*r*.2,y+r*.3,color,r);}
}
function hexA(hex,a){var n=parseInt(hex.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+Math.min(1,a).toFixed(3)+')';}
function addDrip(x,y,color,r){
  drips.push({x:x,y:y,w:Math.max(1.4,r*.09+Math.random()*1.6),len:30+Math.random()*(60+r*2.4),t:0,v:40+Math.random()*60,c:color});
  if(drips.length>80) drips.shift();
}
function stepDrips(dt){
  for(var i=drips.length-1;i>=0;i--){
    var d=drips[i],ny=d.y+d.v*dt;
    pc.strokeStyle=d.c;pc.lineCap='round';pc.lineWidth=d.w;
    pc.beginPath();pc.moveTo(d.x,d.y);d.x+=(Math.random()-.5)*.25;pc.lineTo(d.x,ny);pc.stroke();
    d.t+=ny-d.y;d.y=ny;d.v*=Math.pow(.55,dt);d.w*=Math.pow(.9,dt);
    if(d.t>=d.len||d.v<4){pc.fillStyle=d.c;pc.beginPath();pc.arc(d.x,d.y+d.w*.3,d.w*.85,0,6.283);pc.fill();drips.splice(i,1);}
  }
}

// ---------- stencils (masked spraying) ----------
var jobs=[];
function stencilJob(text,cx,cy,opts){
  opts=opts||{};
  var fs=opts.size||Math.min(W*.8/Math.max(4,text.length*.55),H*.3,220);
  var m=document.createElement('canvas'),mc=m.getContext('2d');
  mc.font=(opts.font||'400 '+fs+'px Impact, "Arial Black", sans-serif');
  var tw=mc.measureText(text).width,pad=fs*.25;
  m.width=Math.ceil(tw+pad*2);m.height=Math.ceil(fs*1.3+pad*2);
  mc.font=(opts.font||'400 '+fs+'px Impact, "Arial Black", sans-serif');
  mc.textAlign='center';mc.textBaseline='middle';
  if(opts.skew){mc.setTransform(1,0,-opts.skew,1,opts.skew*m.height/2,0);}
  if(opts.stroke){mc.lineWidth=opts.stroke;mc.lineJoin='round';mc.strokeStyle='#000';mc.strokeText(text,m.width/2,m.height/2);}
  else{mc.fillStyle='#000';mc.fillText(text,m.width/2,m.height/2);}
  var data=mc.getImageData(0,0,m.width,m.height).data;
  var x0=cx-m.width/2+(opts.dx||0),y0=cy-m.height/2+(opts.dy||0);
  var col=opts.color||S.color,band=opts.band||[0,1];
  var tint=document.createElement('canvas');tint.width=m.width;tint.height=m.height;
  var tc=tint.getContext('2d');tc.drawImage(m,0,0);tc.globalCompositeOperation='source-in';tc.fillStyle=col;tc.fillRect(0,0,m.width,m.height);
  if(band[0]>0||band[1]<1){tc.globalCompositeOperation='destination-in';var gb=tc.createLinearGradient(0,0,0,m.height);
    gb.addColorStop(0,'rgba(0,0,0,'+(band[0]>0?0:1)+')');gb.addColorStop(Math.max(0,band[0]-.04),'rgba(0,0,0,'+(band[0]>0?0:1)+')');gb.addColorStop(Math.min(1,band[0]+.06),'rgba(0,0,0,1)');
    gb.addColorStop(Math.max(0,band[1]-.06),'rgba(0,0,0,1)');gb.addColorStop(Math.min(1,band[1]+.04),'rgba(0,0,0,'+(band[1]<1?0:1)+')');gb.addColorStop(1,'rgba(0,0,0,'+(band[1]<1?0:1)+')');
    tc.fillStyle=gb;tc.fillRect(0,0,m.width,m.height);}
  jobs.push({data:data,tint:tint,w:m.width,h:m.height,x0:x0,y0:y0,color:col,dur:opts.dur||.7,t:0,band:band,drips:opts.drips||0,dot:opts.dot||1,halo:false});
}
function stepJobs(dt){
  if(!jobs.length) return;
  var j=jobs[0];
  if(!j.halo){j.halo=true;pc.save();pc.globalAlpha=.35;try{pc.filter='blur('+Math.max(2,j.h*.018).toFixed(1)+'px)';}catch(e){}pc.drawImage(j.tint,j.x0,j.y0);pc.restore();}
  j.t+=dt;
  pc.save();pc.globalAlpha=Math.min(1,dt/j.dur*2.2);pc.drawImage(j.tint,j.x0,j.y0);pc.restore();
  var n=Math.round(j.w*j.h*.012*dt/j.dur*6);
  pc.fillStyle=j.color;
  var yb0=j.band[0]*j.h,yb1=j.band[1]*j.h;
  for(var i=0;i<n;i++){
    var x=Math.random()*j.w|0,y=(yb0+Math.random()*(yb1-yb0))|0,a=j.data[(y*j.w+x)*4+3];
    if(a>100){pc.globalAlpha=.55+Math.random()*.45;var s=(1+Math.random()*1.6)*j.dot;pc.fillRect(j.x0+x,j.y0+y,s,s);}
    else if(Math.random()<.03){pc.globalAlpha=.25*Math.random();pc.fillRect(j.x0+x,j.y0+y,1,1);}
  }
  pc.globalAlpha=1;
  if(j.t>=j.dur){
    // drips from the lowest painted pixels
    for(var k=0;k<j.drips;k++){
      var cx=Math.random()*j.w|0;
      for(var yy=j.h-1;yy>=0;yy--){if(j.data[(yy*j.w+cx)*4+3]>100){addDrip(j.x0+cx,j.y0+yy,j.color,18+Math.random()*16);break;}}
    }
    jobs.shift();
  }
}

// ---------- intro piece ----------
function introPiece(){
  var cx=W*(W<760?.5:.56),cy=H*(W<760?.42:.46);
  var word=W<560?'WALL':'WALLSPACE';
  var fs=Math.min(W*.8/(word.length*.55),H*.3,230);
  var sk=.18;
  var base={size:fs,skew:sk};
  function o(extra){var r={};for(var k in base) r[k]=base[k];for(var k2 in extra) r[k2]=extra[k2];return r;}
  stencilJob(word,cx,cy,o({color:'#141414',dx:fs*.07,dy:fs*.07,dur:.07,stroke:fs*.14}));
  stencilJob(word,cx,cy,o({color:'#f4f1ea',dur:.07,stroke:fs*.12}));
  stencilJob(word,cx,cy,o({color:'#ff6a13',dur:.16}));
  stencilJob(word,cx,cy,o({color:'#ff4fa3',dur:.14,band:[.52,1]}));
  stencilJob(word,cx,cy,o({color:'#ffd21f',dur:.1,band:[0,.36]}));
  stencilJob(word,cx,cy,o({color:'#141414',dur:.12,stroke:fs*.035,drips:9}));
  stencilJob('EST. 2026 · NO TOYS',W<760?W/2:cx+fs*1.1,cy+fs*.85,{size:Math.max(16,fs*.16),color:'#27c0ff',dur:.1});
}

// ---------- input ----------
var cur=document.getElementById('cur');
var down=false,px=0,py=0,lx=0,ly=0,undo=[];
function setCursor(){if(!cur) return;var d=S.stencil?60:S.cap*2;cur.style.width=d+'px';cur.style.height=d+'px';cur.style.borderRadius=S.stencil?'4px':'50%';}
function snapshot(){try{undo.push(pc.getImageData(0,0,paint.width,paint.height));if(undo.length>5) undo.shift();}catch(e){}}
paint.addEventListener('pointerdown',function(e){
  ensureAudio();
  if(S.stencil){
    snapshot();
    var t=(document.getElementById('stTxt').value||'WET PAINT').toUpperCase().slice(0,14);
    stencilJob(t,e.clientX,e.clientY,{color:S.color,dur:.55,drips:4,size:Math.min(W*.8/Math.max(3,t.length*.55),150)});
    hiss(true);setTimeout(function(){hiss(false);},550);
    return;
  }
  snapshot();
  down=true;px=lx=e.clientX;py=ly=e.clientY;
  try{paint.setPointerCapture(e.pointerId);}catch(_){}
  hiss(true);
});
paint.addEventListener('pointermove',function(e){
  px=e.clientX;py=e.clientY;
  if(cur&&e.pointerType==='mouse'){cur.style.display='block';cur.style.left=px+'px';cur.style.top=py+'px';}
});
function up(){if(down){down=false;hiss(false);}}
paint.addEventListener('pointerup',up);paint.addEventListener('pointercancel',up);
paint.addEventListener('pointerleave',function(){if(cur) cur.style.display='none';});

// cans
var cansEl=document.getElementById('cans'),canBtns=[];
COLORS.forEach(function(c,i){
  var b=document.createElement('button');b.type='button';b.className='can';b.setAttribute('role','radio');b.setAttribute('aria-label',c[0]);b.title=c[0]+' ('+((i+1)%10)+')';
  b.innerHTML='<svg viewBox="0 0 34 74" aria-hidden="true"><rect x="12" y="2" width="10" height="7" rx="2" fill="#ddd"/><rect x="13.5" y="0" width="7" height="4" rx="1" fill="'+c[1]+'"/><path d="M6 20 Q6 10 17 9 Q28 10 28 20Z" fill="'+c[1]+'"/><rect x="5" y="19" width="24" height="52" rx="3" fill="#2a2a2a"/><rect x="5" y="30" width="24" height="26" fill="'+c[1]+'"/><rect x="5" y="19" width="24" height="3" fill="#555"/><rect x="8" y="22" width="3" height="46" fill="rgba(255,255,255,.18)"/><text x="17" y="46" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="8" fill="'+(i===0?'#eee':'#111')+'" transform="rotate(-90 17 43)">'+c[0].split(' ')[0].toUpperCase().slice(0,6)+'</text></svg>';
  b.addEventListener('click',function(){pickColor(i);});
  cansEl.appendChild(b);canBtns.push(b);
});
function pickColor(i){
  S.color=COLORS[i][1];
  canBtns.forEach(function(b,k){b.setAttribute('aria-checked',String(k===i));b.tabIndex=k===i?0:-1;});
  var b=canBtns[i];b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
  rattle();
}
function setCap(c){S.cap=c;Array.prototype.forEach.call(document.querySelectorAll('[data-cap]'),function(b){b.setAttribute('aria-pressed',String(+b.dataset.cap===c));});setCursor();}
Array.prototype.forEach.call(document.querySelectorAll('[data-cap]'),function(b){b.addEventListener('click',function(){setCap(+b.dataset.cap);});});
var stBtn=document.getElementById('stBtn');
function setStencil(on){S.stencil=on;if(stBtn) stBtn.setAttribute('aria-pressed',String(on));setCursor();}
if(stBtn) stBtn.addEventListener('click',function(){setStencil(!S.stencil);});
var stTxt=document.getElementById('stTxt');if(stTxt){stTxt.addEventListener('focus',function(){setStencil(true);});}
var buffBtn=document.getElementById('buff');
function buff(){
  snapshot();
  var greys=['#8b857a','#938d82','#7f7a70'],y=0;
  (function roll(){
    if(y>H){return;}
    var h=H/5+10;
    pc.fillStyle=greys[(y/h|0)%3];pc.globalAlpha=.93;
    pc.fillRect(-10,y,W+20,h);
    pc.globalAlpha=.25;pc.fillStyle='#000';for(var i=0;i<40;i++) pc.fillRect(Math.random()*W,y+Math.random()*h,2+Math.random()*30,1);
    pc.globalAlpha=1;y+=h-8;
    setTimeout(roll,reduce?0:70);
  })();
  drips=[];jobs=[];acc={};
}
if(buffBtn) buffBtn.addEventListener('click',buff);
var undoBtn=document.getElementById('undo');
function doUndo(){var im=undo.pop();if(im){pc.save();pc.setTransform(1,0,0,1,0,0);pc.putImageData(im,0,0);pc.restore();drips=[];jobs=[];}}
if(undoBtn) undoBtn.addEventListener('click',doUndo);

document.addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='INPUT'){if(e.key==='Enter') e.target.blur();return;}
  var k=e.key;
  if(k>='0'&&k<='9'){pickColor((+k+9)%10);}
  else if(k==='['){setCap(S.cap===46?24:10);}
  else if(k===']'){setCap(S.cap===10?24:46);}
  else if(k==='s'||k==='S'){setStencil(!S.stencil);}
  else if(k==='b'||k==='B'){buff();}
  else if(k==='z'||k==='Z'){doUndo();}
});

// ---------- sound: hiss & rattle ----------
var ac=null,noise=null,hissG=null;
function ensureAudio(){
  if(ac) {if(ac.state==='suspended') ac.resume();return;}
  try{var A=window.AudioContext||window.webkitAudioContext;if(!A) return;ac=new A();}catch(e){return;}
  var len=ac.sampleRate*2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
  noise=ac.createBufferSource();noise.buffer=buf;noise.loop=true;
  var bp=ac.createBiquadFilter();bp.type='highpass';bp.frequency.value=3200;
  var pk=ac.createBiquadFilter();pk.type='peaking';pk.frequency.value=7000;pk.gain.value=6;
  hissG=ac.createGain();hissG.gain.value=0;
  noise.connect(bp);bp.connect(pk);pk.connect(hissG);hissG.connect(ac.destination);noise.start();
}
function hiss(on){if(!ac||!hissG) return;var t=ac.currentTime;hissG.gain.cancelScheduledValues(t);hissG.gain.setTargetAtTime(on?.07:0,t,on?.02:.05);}
function rattle(){
  if(!ac) return;
  for(var i=0;i<5;i++){
    var t=ac.currentTime+i*.06,o=ac.createOscillator(),g=ac.createGain();
    o.type='triangle';o.frequency.setValueAtTime(2400+Math.random()*900,t);
    g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.05);
  }
}

// ---------- loop ----------
var last=0;
function frame(t){
  var raw=last?(t-last)/1000:0,dt=Math.min(.05,raw);last=t;
  if(down){
    var dx=px-lx,dy=py-ly,dist=Math.hypot(dx,dy),steps=Math.max(1,Math.ceil(dist/(S.cap*.35)));
    for(var i=1;i<=steps;i++) sprayAt(lx+dx*i/steps,ly+dy*i/steps,S.cap,S.color,dt/steps+(dist>0?0:0));
    lx=px;ly=py;
  }
  stepJobs(Math.min(.25,raw));
  stepDrips(dt);
  requestAnimationFrame(frame);
}
var rz=0;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(size,150);});
size();pickColor(4);setCap(24);
introPiece();
requestAnimationFrame(frame);
})();
</script>
