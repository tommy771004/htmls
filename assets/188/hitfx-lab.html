<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打擊特效實驗室 · 彩筆曠野</title>
<meta name="description" content="彩筆曠野的命中特效預覽：按一下假目標播放命中特效，逐項開關、調整參數、A／B 並排比較，最後印出參數給遊戲使用。">
<link rel="icon" href="../../favicon.svg">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script>
<style>
:root{--bg:#16141d;--panel:#211e2b;--line:#34304a;--ink:#f1eef8;--dim:#a39db8;--acc:#ffd23f;--a:#ff8a5a;--b:#5ab8ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 "PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
body{display:grid;grid-template-columns:1fr 360px;height:100vh;overflow:hidden}
#stage{position:relative;overflow:hidden;cursor:pointer}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.lane{position:absolute;top:0;bottom:0;overflow:hidden;pointer-events:none}
.lane .tag{position:absolute;left:12px;top:10px;padding:2px 10px;border-radius:99px;font-weight:800;font-size:13px;color:#16141d}
.hp{position:absolute;width:120px;height:12px;margin-left:-60px;border-radius:7px;background:#2a2238;border:2px solid #2a2238;overflow:hidden}
.hp i{position:absolute;left:0;top:0;bottom:0;display:block}
.hp .w{background:#fff}.hp .r{background:#ff4d5e}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:6px 14px;border-radius:99px;background:rgba(0,0,0,.45);font-size:13px;color:#e8e4f4;pointer-events:none;white-space:nowrap}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 14px 30px}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--dim);font-size:12px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
button{font:inherit;color:var(--ink);background:#2e2a3d;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{background:#3a3550}
button.on{background:var(--acc);color:#16141d;border-color:var(--acc);font-weight:700}
button.big{padding:9px 14px;font-weight:800}
button.a{box-shadow:inset 0 -3px 0 var(--a)}button.b{box-shadow:inset 0 -3px 0 var(--b)}
.sec{margin:14px 0 6px;font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.08em}
.fxlist{display:grid;grid-template-columns:1fr;gap:3px}
.fx{display:grid;grid-template-columns:22px 1fr 34px;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.fx:hover{background:#2a2637}
.fx.sel{border-color:var(--acc);background:#2c2838}
.fx input{width:16px;height:16px;accent-color:var(--acc);margin:0}
.fx .n{font-size:13px}.fx .n small{color:var(--dim);margin-left:4px}
.fx button{padding:2px 0;font-size:12px}
.sl{display:grid;grid-template-columns:96px 1fr 58px;align-items:center;gap:8px;margin:6px 0}
.sl label{font-size:12px;color:var(--dim)}
.sl input[type=range]{width:100%;accent-color:var(--acc)}
.sl output{font-variant-numeric:tabular-nums;font-size:12px;text-align:right}
.edit{padding:10px;border-radius:10px;background:#1b1924;border:1px solid var(--line)}
.edit h3{margin:0 0 4px;font-size:14px}
.edit p{margin:0 0 6px;color:var(--dim);font-size:12px}
.sw{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid #16141d;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--acc)}
textarea{width:100%;height:190px;background:#12101a;color:#d8f5c8;border:1px solid var(--line);border-radius:8px;font:11px/1.45 ui-monospace,Menlo,monospace;padding:8px;resize:vertical}
.note{color:var(--dim);font-size:12px}
@media (max-width:820px){body{grid-template-columns:1fr;grid-template-rows:48vh 1fr;height:auto;min-height:100vh;overflow:auto}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="hint">按畫面：揮筆，命中那一格才放特效</div>
</div>
<aside>
  <h1>打擊特效實驗室</h1>
  <p class="sub">彩筆曠野 188 用的命中特效。調好後按「印出參數」，把那段文字貼回遊戲。</p>
  <div class="row">
    <button class="big" id="bSwing">▶ 揮筆命中</button>
    <button class="big" id="bNow">✦ 直接命中</button>
  </div>
  <div class="row">
    <button id="bHeavy">重擊（第三段）</button>
    <button id="bKill">擊殺這一下</button>
    <button id="bSplit">並排比較 A／B</button>
    <button id="bAll" class="on">全部特效：開</button>
  </div>
  <div class="row" id="laneRow" hidden>
    <span class="note" style="align-self:center">正在調整：</span>
    <button id="eA" class="a on">A 組</button><button id="eB" class="b">B 組</button>
    <button id="cAB">A 複製到 B</button><button id="cBA">B 複製到 A</button>
  </div>
  <div class="sec">顏料顏色（「跟著顏料色」的效果會用這個）</div>
  <div class="row" id="paints"></div>
  <div class="sec">最常調的兩個</div>
  <div id="quick"></div>
  <div class="sec">效果清單（勾選＝開啟；▶ 只播這一種；點名稱調參數）</div>
  <div class="fxlist" id="list"></div>
  <div class="sec">參數</div>
  <div class="edit" id="edit"></div>
  <div class="sec">輸出</div>
  <div class="row"><button class="big" id="bPrint">印出參數</button><button id="bCopy">複製</button><button id="bReset">這組恢復預設</button></div>
  <textarea id="out" spellcheck="false" placeholder="按「印出參數」後會出現在這裡，也會印在瀏覽器主控台。"></textarea>
  <p class="note">參數也會自動記在這個瀏覽器裡，下次打開還在。</p>
</aside>
<script type="module">
import * as THREE from 'three';

/* ───────── 打擊特效模組（預覽頁 assets/188/hitfx-lab.html 與遊戲共用同一份程式與參數格式）─────────
   每種效果：on 開關、dur 秒數、radius 擴散半徑／強度（單位依效果而定）、count 數量、color 顏色（'auto' 跟著當下顏料色）
   時間：畫面上的特效用真實時間跑（頓幀時也看得到）；擊退用遊戲時間（頓幀結束才被推開）。 */
const HITFX_DEFAULT = {
  flash:   { on: 1, dur: .09, radius: 1.8, color: '#fff4d6' },
  ring:    { on: 1, dur: .28, radius: 2.4, color: 'auto' },
  sparks:  { on: 1, dur: .32, radius: 3.6, count: 16, color: '#fff0b8' },
  splat:   { on: 1, dur: .55, radius: 2.6, count: 12, color: 'auto' },
  slash:   { on: 0, dur: .16, radius: 2.2, color: '#ffffff' },
  trail:   { on: 0, dur: .18, radius: .35, color: 'auto' },
  dust:    { on: 0, dur: .7, radius: 1.8, count: 6, color: '#e9e2d2' },
  star:    { on: 0, dur: .22, radius: 1.5, color: 'auto' },
  lines:   { on: 0, dur: .14, radius: .5, count: 28, color: '#ffffff' },
  frame:   { on: 0, dur: .05, radius: 0, color: '#ffffff' },
  numbers: { on: 1, dur: .8, radius: 1.2, color: '#ffffff' },
  tflash:  { on: 1, dur: .16, radius: 1.6, color: '#ffffff' },
  squash:  { on: 1, dur: .18, radius: .22 },
  tshake:  { on: 1, dur: .1, radius: .1 },
  knock:   { on: 1, dur: .22, radius: .9 },
  hitstop: { on: 1, dur: .07 },
  shake:   { on: 1, dur: .25, radius: .28 },
  fov:     { on: 0, dur: .2, radius: 5 },
  slowmo:  { on: 0, dur: .45, radius: .25 },
  hpbar:   { on: 1, dur: .35, radius: .3 },
  heavy:   { mul: 1.5 },
};
// 每種效果的中文名稱與「radius」這個滑桿在該效果代表什麼
const HITFX_INFO = {
  flash:   ['命中閃光', '大小（公尺）'],
  ring:    ['衝擊波環', '擴散半徑（公尺）'],
  sparks:  ['火花噴濺', '噴射距離（公尺）'],
  splat:   ['顏料飛濺', '噴射距離（公尺）'],
  slash:   ['刀光弧線', '弧線大小（公尺）'],
  trail:   ['殘影拖尾', '拖尾寬度（公尺）'],
  dust:    ['煙塵', '擴散半徑（公尺）'],
  star:    ['漫畫爆炸星', '大小（公尺）'],
  lines:   ['放射集中線', '中央留空（比例）'],
  frame:   ['全螢幕閃白', '（反色：大於 0.5）'],
  numbers: ['傷害數字', '上升高度（公尺）'],
  tflash:  ['目標閃白', '亮度'],
  squash:  ['擠壓回彈', '壓扁程度'],
  tshake:  ['受擊抖動', '抖動幅度（公尺）'],
  knock:   ['擊退位移', '擊退距離（公尺）'],
  hitstop: ['頓幀', ''],
  shake:   ['鏡頭震動', '震動幅度（公尺）'],
  fov:     ['視角衝擊', '放大角度（度）'],
  slowmo:  ['慢動作（擊殺時）', '時間倍率'],
  hpbar:   ['血條白色殘影', '延遲（秒）'],
};
function createHitFX(o) {
  const THREE = o.THREE, scene = o.scene;
  const fx = { enabled: true, params: o.params, live: [], hitstop: 0, slow: 0, slowK: 1, timeScale: 1, shake: 0, shakeT: 0, shakeDur: .25, shakeDir: new THREE.Vector3(1, 0, 0), fovAdd: 0, fovT: 0, fovDur: .2, fovAmp: 0, camOff: new THREE.Vector3(), trail: [], trailMesh: null };
  const V = () => new THREE.Vector3();
  const cl = (v, a, b) => v < a ? a : v > b ? b : v;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const backOut = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  // ── 貼圖（程式畫）──
  const tex = (w, draw) => { const c = document.createElement('canvas'); c.width = c.height = w; draw(c.getContext('2d'), w); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
  const flareTex = tex(128, (g, w) => {
    const r = w / 2, grd = g.createRadialGradient(r, r, 0, r, r, r);
    grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(.18, 'rgba(255,255,255,.9)'); grd.addColorStop(.45, 'rgba(255,255,255,.25)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.fillRect(0, 0, w, w);
    g.fillStyle = '#fff';
    for (let k = 0; k < 4; k++) { g.save(); g.translate(r, r); g.rotate(k * Math.PI / 4); g.beginPath(); g.moveTo(-r, 0); g.lineTo(0, -3.5 + (k % 2)); g.lineTo(r, 0); g.lineTo(0, 3.5 - (k % 2)); g.closePath(); g.globalAlpha = k % 2 ? .45 : .95; g.fill(); g.restore(); }
  });
  const softTex = tex(64, (g, w) => { const r = w / 2, grd = g.createRadialGradient(r, r, 0, r, r, r); grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(.6, 'rgba(255,255,255,.55)'); grd.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = grd; g.fillRect(0, 0, w, w); });
  const starShape = (() => { const s = new THREE.Shape(); for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, r = i % 2 ? .42 : 1 - (i % 4 === 0 ? 0 : .18); const x = Math.cos(a) * r, y = Math.sin(a) * r; i ? s.lineTo(x, y) : s.moveTo(x, y); } return s; })();
  const starGeo = new THREE.ShapeGeometry(starShape);
  const ringGeo = new THREE.RingGeometry(.84, 1, 56);
  const arcGeo = new THREE.RingGeometry(.72, 1, 40, 1, 0, Math.PI);
  const streakGeo = new THREE.BoxGeometry(1, 1, 1);
  const blobGeo = new THREE.IcosahedronGeometry(1, 1);
  const addMat = (color, map) => new THREE.MeshBasicMaterial({ color, map: map || null, transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
  // ── 螢幕層：放射線、閃白、傷害數字 ──
  const layer = o.overlay;
  const lc = document.createElement('canvas'); lc.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none';
  const flashDiv = document.createElement('div'); flashDiv.style.cssText = 'position:absolute;inset:0;pointer-events:none;opacity:0';
  layer.append(lc, flashDiv);
  const lg = lc.getContext('2d');
  const colOf = (c, auto) => new THREE.Color(c === 'auto' || !c ? auto : c);
  const cssOf = (c, auto) => '#' + colOf(c, auto).getHexString();
  function project(p) {
    const v = p.clone().project(o.camera), r = layer.getBoundingClientRect();
    return { x: (v.x * .5 + .5) * r.width, y: (-v.y * .5 + .5) * r.height, w: r.width, h: r.height, front: v.z < 1 };
  }
  function billboard(m) { m.quaternion.copy(o.camera.quaternion); }
  function add(e) { fx.live.push(e); return e; }

  fx.hit = function (h) {
    if (!fx.enabled) return;
    const P = h.params || fx.params;
    const k = (h.heavy ? P.heavy.mul : 1) * (h.light ? .6 : 1);
    const pos = h.pos.clone(), dir = (h.dir ? h.dir.clone() : new THREE.Vector3(1, 0, 0)).setY(0);
    if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0);
    dir.normalize();
    const auto = h.color ?? 0xffffff;
    const T = h.target;
    // 1 命中閃光
    if (P.flash.on) {
      const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: flareTex, color: colOf(P.flash.color, auto), blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false, transparent: true }));
      m.position.copy(pos); m.material.rotation = Math.random() * 3; m.renderOrder = 20; scene.add(m);
      const R = P.flash.radius * k, D = P.flash.dur;
      add({ t: 0, D, m, u(t) { const q = t / D; m.scale.setScalar(R * (q < .35 ? .4 + q / .35 * .6 : 1)); m.material.opacity = q < .35 ? 1 : 1 - (q - .35) / .65; } });
    }
    // 2 衝擊波環
    if (P.ring.on) {
      const m = new THREE.Mesh(ringGeo, addMat(colOf(P.ring.color, auto)));
      m.position.copy(pos); m.renderOrder = 19; scene.add(m);
      const R = P.ring.radius * k, D = P.ring.dur;
      add({ t: 0, D, m, u(t) { const q = t / D; billboard(m); m.scale.setScalar(R * (.15 + .85 * easeOut(q))); m.material.opacity = (1 - q) * .9; } });
    }
    // 3 火花：沿打擊方向的錐形噴出，細長亮條朝速度方向
    if (P.sparks.on) {
      const n = Math.round(P.sparks.count * (h.light ? .6 : 1)), D = P.sparks.dur, R = P.sparks.radius * k;
      const im = new THREE.InstancedMesh(streakGeo, addMat(colOf(P.sparks.color, auto)), n);
      im.renderOrder = 21; im.frustumCulled = false; scene.add(im);
      const ps = [], vs = [];
      for (let i = 0; i < n; i++) {
        const v = dir.clone().multiplyScalar(.6 + Math.random() * .6).add(new THREE.Vector3(Math.random() - .5, Math.random() * .9 - .1, Math.random() - .5).multiplyScalar(1.3)).normalize();
        vs.push(v.multiplyScalar(R / D * (1.2 + Math.random() * 1.2))); ps.push(pos.clone());
      }
      const d = new THREE.Object3D(), up = new THREE.Vector3(1, 0, 0);
      add({ t: 0, D, m: im, u(t, dt) {
        const q = t / D;
        for (let i = 0; i < n; i++) {
          vs[i].multiplyScalar(Math.exp(-dt * 3.2)); vs[i].y -= 14 * dt; ps[i].addScaledVector(vs[i], dt);
          const sp = vs[i].length();
          d.position.copy(ps[i]); d.quaternion.setFromUnitVectors(up, vs[i].clone().normalize());
          d.scale.set(cl(sp * .045, .05, .9) * (1 - q * .6), .05 * (1 - q), .05 * (1 - q)); d.updateMatrix(); im.setMatrixAt(i, d.matrix);
        }
        im.instanceMatrix.needsUpdate = true; im.material.opacity = 1 - q * q;
      } });
    }
    // 4 顏料飛濺：一團團往打擊方向噴，落地留下斑點
    if (P.splat.on) {
      const n = Math.round(P.splat.count * (h.light ? .6 : 1)), D = P.splat.dur, R = P.splat.radius * k, c = colOf(P.splat.color, auto);
      const im = new THREE.InstancedMesh(blobGeo, new THREE.MeshBasicMaterial({ color: c }), n);
      im.frustumCulled = false; im.renderOrder = 18; scene.add(im);
      const ps = [], vs = [], ss = [], landed = [];
      for (let i = 0; i < n; i++) {
        const v = dir.clone().multiplyScalar(.9).add(new THREE.Vector3(Math.random() - .5, Math.random() * 1.2, Math.random() - .5)).normalize();
        vs.push(v.multiplyScalar(R / D * (.7 + Math.random() * .9))); ps.push(pos.clone()); ss.push(.06 + Math.random() * .12); landed.push(false);
      }
      const d = new THREE.Object3D();
      add({ t: 0, D, m: im, u(t, dt) {
        const q = t / D;
        for (let i = 0; i < n; i++) {
          if (!landed[i]) { vs[i].y -= 22 * dt; ps[i].addScaledVector(vs[i], dt); const gy = o.groundAt ? o.groundAt(ps[i]) : -1e9; if (ps[i].y <= gy) { ps[i].y = gy; landed[i] = true; if (o.onSplat && Math.random() < .5) o.onSplat(ps[i].clone(), c.getHex(), ss[i] * 4); } }
          d.position.copy(ps[i]); const s = ss[i] * (1 - q * .7) * k; d.scale.set(s * (landed[i] ? 1.6 : 1), s * (landed[i] ? .25 : 1), s * (landed[i] ? 1.6 : 1)); d.updateMatrix(); im.setMatrixAt(i, d.matrix);
        }
        im.instanceMatrix.needsUpdate = true;
      } });
    }
    // 5 刀光弧線：垂直於打擊方向的新月
    if (P.slash.on) {
      const m = new THREE.Mesh(arcGeo, addMat(colOf(P.slash.color, auto)));
      m.position.copy(pos); m.renderOrder = 22; scene.add(m);
      const R = P.slash.radius * k, D = P.slash.dur, sp = project(pos), sp2 = project(pos.clone().add(dir)), ang = Math.atan2(-(sp2.y - sp.y), sp2.x - sp.x) + (Math.random() - .5) * .5;
      add({ t: 0, D, m, u(t) { const q = t / D; billboard(m); m.rotateZ(ang - Math.PI / 2); m.scale.set(R * (.7 + .3 * easeOut(q)), R * (.7 + .3 * easeOut(q)) * (1 - q * .5), 1); m.material.opacity = 1 - q; } });
    }
    // 7 煙塵
    if (P.dust.on) {
      const n = P.dust.count, D = P.dust.dur, R = P.dust.radius * k;
      for (let i = 0; i < n; i++) {
        const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: softTex, color: colOf(P.dust.color, auto), transparent: true, depthWrite: false, opacity: .7 }));
        const a = Math.random() * Math.PI * 2, v = new THREE.Vector3(Math.cos(a), .25 + Math.random() * .4, Math.sin(a)).multiplyScalar(R);
        const base = pos.clone().setY(pos.y - .3); m.position.copy(base); scene.add(m);
        add({ t: 0, D: D * (.8 + Math.random() * .4), m, u(t) { const q = t / this.D; m.position.copy(base).addScaledVector(v, easeOut(q)); m.scale.setScalar(R * (.35 + .65 * easeOut(q))); m.material.opacity = .75 * (1 - q); } });
      }
    }
    // 8 漫畫爆炸星：彩色星形外圈＋白色內星，彈出後縮回
    if (P.star.on) {
      const g = new THREE.Group(); g.position.copy(pos); g.renderOrder = 23; scene.add(g);
      const a = new THREE.Mesh(starGeo, new THREE.MeshBasicMaterial({ color: colOf(P.star.color, auto), transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide }));
      const b = new THREE.Mesh(starGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, depthTest: false, depthWrite: false, side: THREE.DoubleSide }));
      b.scale.setScalar(.55); b.position.z = .01; a.renderOrder = 23; b.renderOrder = 24; g.add(a, b);
      const R = P.star.radius * k, D = P.star.dur, rot = Math.random() * 3;
      add({ t: 0, D, m: g, u(t) { const q = t / D; billboard(g); g.rotateZ(rot + q * .6); const s = q < .45 ? backOut(q / .45) : 1 - (q - .45) / .55; g.scale.setScalar(Math.max(.001, R * s)); } });
    }

  const h = document.createElement('h3'); h.textContent = HITFX_INFO[k][0]; E.append(h);
  const d = document.createElement('p'); d.textContent = DESC[k]; E.append(d);
  if ('dur' in p) slider(E, k === 'hpbar' ? '追上時間' : '持續時間', () => p.dur, v => p.dur = v, k === 'hitstop' ? 0 : .02, k === 'dust' || k === 'numbers' ? 2 : k === 'slowmo' ? 1.5 : 1, .01, v => Math.round(v * 1000) + ' ms');
  if ('radius' in p && HITFX_INFO[k][1]) {
    const lim = { lines: [.1, 1, .01], frame: [0, 1, 1], tflash: [0, 4, .05], squash: [0, .6, .01], tshake: [0, .5, .01], knock: [0, 4, .05], shake: [0, 1, .01], fov: [0, 20, .5], slowmo: [.05, 1, .01], hpbar: [0, 1, .01], trail: [.05, 1, .01], numbers: [0, 3, .05] }[k] || [.1, 8, .05];
    slider(E, HITFX_INFO[k][1].replace(/（.*）/, ''), () => p.radius, v => p.radius = v, lim[0], lim[1], lim[2], v => v.toFixed(2));
  }
  if ('count' in p) slider(E, '粒子數量', () => p.count, v => p.count = v, 1, k === 'lines' ? 80 : 60, 1, v => v);
  if ('color' in p && k !== 'frame' || (k === 'frame')) {
    const row = document.createElement('div'); row.className = 'sl';
    row.innerHTML = '<label>顏色</label><span style="display:flex;gap:8px;align-items:center"><input type="color"><label style="font-size:12px;display:flex;gap:4px;align-items:center"><input type="checkbox">跟著顏料色</label></span><span></span>';
    const ci = row.querySelector('input[type=color]'), au = row.querySelector('input[type=checkbox]');
    ci.value = p.color === 'auto' ? '#' + PAINTS[ST.paint].toString(16).padStart(6, '0') : p.color; au.checked = p.color === 'auto';
    ci.oninput = () => { p.color = ci.value; au.checked = false; save(); };
    au.onchange = () => { p.color = au.checked ? 'auto' : ci.value; save(); };
    if ('color' in p) E.append(row);
  }
  if (k === 'heavy') {}
  const hm = document.createElement('div'); E.append(hm);
  if (k === 'hitstop' || k === 'shake' || k === 'knock') slider(hm, '重擊倍率（全部）', () => P().heavy.mul, v => P().heavy.mul = v, 1, 3, .05, v => '×' + v.toFixed(2));
}
function renderPaints() {
  const r = $('paints'); r.innerHTML = '';
  PAINTS.forEach((c, i) => { const s = document.createElement('span'); s.className = 'sw' + (i === ST.paint ? ' on' : ''); s.style.background = '#' + c.toString(16).padStart(6, '0'); s.title = ['紅', '藍', '黃', '綠'][i]; s.onclick = () => { ST.paint = i; lanes.forEach(L => L.tipM.color.setHex(c)); renderPaints(); renderEdit(); save(); }; r.append(s); });
}
function renderAll() { renderQuick(); renderList(); renderEdit(); renderPaints(); $('eA').classList.toggle('on', ST.edit === 'A'); $('eB').classList.toggle('on', ST.edit === 'B'); }
const tog = (id, key, fn) => $(id).onclick = () => { ST[key] = !ST[key]; $(id).classList.toggle('on', ST[key]); if (fn) fn(); };
tog('bHeavy', 'heavy'); tog('bKill', 'kill');
tog('bSplit', 'split', () => { $('laneRow').hidden = !ST.split; if (!ST.split) ST.edit = 'A'; resize(); renderAll(); });
$('bAll').onclick = () => { ST.all = !ST.all; lanes.forEach(L => { L.fx.enabled = ST.all; if (!ST.all) L.fx.clear(); }); $('bAll').classList.toggle('on', ST.all); $('bAll').textContent = '全部特效：' + (ST.all ? '開' : '關'); };
$('bSwing').onclick = () => playAll('swing');
$('bNow').onclick = () => playAll('now');
$('eA').onclick = () => { ST.edit = 'A'; renderAll(); };
$('eB').onclick = () => { ST.edit = 'B'; renderAll(); };
$('cAB').onclick = () => { ST.params.B = clone(ST.params.A); lanes[1].fx.params = ST.params.B; save(); renderAll(); };
$('cBA').onclick = () => { ST.params.A = clone(ST.params.B); lanes[0].fx.params = ST.params.A; save(); renderAll(); };
$('bReset').onclick = () => { const k = ST.split ? ST.edit : 'A'; ST.params[k] = clone(HITFX_DEFAULT); lanes[k === 'A' ? 0 : 1].fx.params = ST.params[k]; save(); renderAll(); };
function round(o) { return JSON.parse(JSON.stringify(o, (k, v) => typeof v === 'number' ? Math.round(v * 1000) / 1000 : v)); }
$('bPrint').onclick = () => {
  const k = ST.split ? ST.edit : 'A', p = round(ST.params[k]);
  const lines = Object.keys(p).map(n => '  ' + n + ': ' + JSON.stringify(p[n]).replace(/"(\w+)":/g, '$1: ').replace(/,/g, ', ') + ',');
  const txt = '// 打擊特效參數（' + k + ' 組，' + new Date().toLocaleString('zh-TW') + '）\nconst HITFX_PARAMS = {\n' + lines.join('\n') + '\n};';
  $('out').value = txt; console.log(txt);
};
$('bCopy').onclick = () => { if (!$('out').value) $('bPrint').onclick(); navigator.clipboard?.writeText($('out').value).then(() => { $('bCopy').textContent = '已複製'; setTimeout(() => $('bCopy').textContent = '複製', 1200); }, () => { $('out').select(); }); };
$('stage').addEventListener('pointerdown', e => {
  if (!ST.split) { play(lanes[0], 'swing'); return; }
  const r = $('stage').getBoundingClientRect();
  play(lanes[e.clientX - r.left < r.width / 2 ? 0 : 1], 'swing');
});
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playAll('swing'); } });

function resize() {
  const r = $('stage').getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  lanes.forEach((L, i) => {
    const w = ST.split ? r.width / 2 : r.width;
    L.rect = { x: ST.split ? i * w : 0, w, h: r.height };
    L.el.style.left = L.rect.x + 'px'; L.el.style.width = w + 'px';
    L.el.style.display = i === 0 || ST.split ? '' : 'none';
    L.el.querySelector('.tag').style.display = ST.split ? '' : 'none';
    L.cam.aspect = w / r.height; L.cam.updateProjectionMatrix();
  });
}
addEventListener('resize', resize);
resize(); renderAll();
lanes[1].fx.params = ST.params.B; lanes[0].fx.params = ST.params.A;

const _t = new THREE.Vector3();
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  lanes.forEach((L, i) => {
    if (i === 1 && !ST.split) return;
    const ts = L.fx.update(dt), gd = dt * ts;
    // 揮筆：命中那一格（揮到一半）才放特效
    if (L.swing) {
      const s = L.swing; s.t += gd; const k = Math.min(1, s.t / s.dur);
      L.brush.visible = true;
      L.pivot.rotation.set(0, -1.9 + k * 3.4, ST.heavy ? .25 : -.1);
      L.brush.rotation.x = -.15;
      if (!s.done && k >= .5) { s.done = true; doHit(L, s.only); }
      L.fx.trackTip(L.tip.getWorldPosition(_t), true);
      if (k >= 1) { L.swing = null; setTimeout(() => { if (!L.swing) L.brush.visible = false; }, 250); }
    } else L.fx.trackTip(null, false);
    // 目標：擊退、回原位、擠壓與抖動
    L.kbPos.add(L.TF.kb); L.TF.kb.set(0, 0, 0);
    L.kbPos.multiplyScalar(Math.exp(-gd * 1.4));
    L.target.position.copy(L.kbPos).add(L.TF.off);
    L.inner.scale.copy(L.TF.scale);
    if (L.respawn > 0) { L.respawn -= gd; L.inner.visible = L.respawn > .8 ? Math.sin(now / 30) > 0 : false; if (L.respawn <= 0) { L.hp = 1; L.inner.visible = true; } }
    // 兩層血條
    const shown = L.fx.barStep(L.bar, L.hp, gd);
    const hp = L.el.querySelector('.hp'), p = L.target.position.clone(); p.y += 2.1; p.project(L.cam);
    hp.style.left = ((p.x * .5 + .5) * L.rect.w) + 'px'; hp.style.top = ((-p.y * .5 + .5) * L.rect.h) + 'px';
    hp.querySelector('.r').style.width = (L.hp * 100) + '%'; hp.querySelector('.w').style.width = (shown * 100) + '%';
    for (let j = L.splats.length - 1; j >= 0; j--) { const s = L.splats[j]; s.t -= dt; s.m.material.opacity = Math.min(1, s.t); if (s.t <= 0) { L.scene.remove(s.m); L.splats.splice(j, 1); } }
    // 鏡頭：類似遊戲的第三人稱
    L.cam.position.set(1.2, 3.1, 7.2); L.cam.lookAt(0, 1.1, 0);
    L.fx.applyCamera(L.cam, 55);
    renderer.setViewport(L.rect.x, 0, L.rect.w, L.rect.h); renderer.setScissor(L.rect.x, 0, L.rect.w, L.rect.h);
    renderer.render(L.scene, L.cam);
  });
}
requestAnimationFrame(frame);
window.hitfxLab = { ST, lanes, play, playAll };
</script>
</body>
</html>
