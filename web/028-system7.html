<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio OS 7.0.1 — Ada Bitwise</title>
<meta name="description" content="1-bit 桌面式作品集：縮放框動畫、拖曳外框、下拉選單、15 格拼圖。收錄於 100 Creative HTML Works（028・經典 Mac OS）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/web/028-system7.html">
<style>
:root{--f:Tahoma,Geneva,"Segoe UI","Helvetica Neue",Verdana,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:12px/1.35 var(--f);color:#000;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:none;
  background:#000}
.screen{position:fixed;inset:0;background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/2px 2px;overflow:hidden}
.corner{position:fixed;width:8px;height:8px;z-index:999;pointer-events:none}
.corner::before{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 10px #000}
.corner.tl{left:0;top:0;clip-path:inset(0 4px 4px 0)} .corner.tl::before{left:0;top:0;width:16px;height:16px}
.corner.tr{right:0;top:0;clip-path:inset(0 0 4px 4px)} .corner.tr::before{left:-8px;top:0;width:16px;height:16px}
.corner.bl{left:0;bottom:0;clip-path:inset(4px 4px 0 0)} .corner.bl::before{left:0;top:-8px;width:16px;height:16px}
.corner.br{right:0;bottom:0;clip-path:inset(4px 0 0 4px)} .corner.br::before{left:-8px;top:-8px;width:16px;height:16px}

/* menubar */
.menubar{position:fixed;left:0;right:0;top:0;height:22px;background:#fff;border-bottom:1px solid #000;display:flex;align-items:stretch;z-index:500;padding:0 8px}
.mt{position:relative;padding:0 10px;display:flex;align-items:center;font-weight:700;cursor:default;border:0;background:none;font:700 12px var(--f);color:#000}
.mt.open,.mt:focus-visible{background:#000;color:#fff;outline:none}
.mt.open img{filter:invert(1)}
.mt img{width:16px;height:16px;image-rendering:pixelated}
.clock{margin-left:auto;display:flex;align-items:center;font-weight:700;padding:0 6px}
/* Application menu (current app icon) sits at the far right of the System 7 menu bar */
.mt.app{padding:0 8px}
.mt.app .menu{left:auto;right:0}
.menu{position:absolute;top:21px;left:0;min-width:200px;background:#fff;border:1px solid #000;box-shadow:2px 2px 0 #000;padding:2px 0;display:none;z-index:600;font-weight:400}
.mt.open .menu{display:block}
.mi{display:flex;justify-content:space-between;gap:24px;padding:2px 16px;white-space:nowrap;cursor:default;color:#000}
.mi:hover:not(.dis),.mi.hl{background:#000;color:#fff}
.mi.dis{color:#999;background:repeating-conic-gradient(transparent 0 25%,rgba(255,255,255,.0) 0 50%)}
.mi kbd{font:inherit}
.sepm{height:1px;margin:2px 0;background:repeating-linear-gradient(90deg,#000 0 1px,#fff 1px 2px)}

/* icons */
.icons{position:absolute;right:14px;top:36px;display:flex;flex-direction:column;gap:6px;align-items:center;z-index:1}
.icon{width:84px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:default;padding:4px 0;border:0;background:none;font:12px var(--f)}
.icon img{width:32px;height:32px;image-rendering:pixelated}
.icon span{background:#fff;padding:0 3px;white-space:nowrap}
.icon.sel img{filter:invert(1)}
.icon.sel span{background:#000;color:#fff}
.icon:focus-visible{outline:none}
.icon:focus-visible span{outline:1px dotted #000;outline-offset:1px}
/* the Trash always lives in the bottom-right corner of the desktop */
.icon.trashdesk{position:fixed;right:14px;bottom:12px}
.icon.open img{opacity:.55;filter:none;background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/2px 2px}

/* windows */
.win{position:absolute;background:#fff;border:1px solid #000;box-shadow:1px 1px 0 #000;display:flex;flex-direction:column;min-width:200px;min-height:120px;max-width:calc(100vw - 8px)}
.tb{height:20px;flex:0 0 auto;position:relative;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #000;cursor:default;touch-action:none;
  background:linear-gradient(#fff,#fff) padding-box}
.win.active .tb{background:repeating-linear-gradient(#fff 0 3px,#000 3px 4px) 0 3px/100% 13px no-repeat,#fff;background-clip:content-box;padding:0 2px}
.ttl{background:#fff;padding:0 8px;font-weight:700;position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.box{position:absolute;top:3px;width:13px;height:13px;border:1px solid #000;background:#fff;padding:0;cursor:default;display:none}
.win.active .box{display:block}
.box::after{content:"";position:absolute;inset:-14px}
.close{left:8px}
.zoom{right:8px}
.zoom::before{content:"";position:absolute;left:0;top:0;width:6px;height:6px;border-right:1px solid #000;border-bottom:1px solid #000}
.box:active{background:#000}
.infobar{flex:0 0 auto;display:flex;justify-content:space-between;padding:2px 8px;border-bottom:1px solid #000;font-size:11px;box-shadow:0 1px 0 #000}
.infobar + .body{margin-top:2px}
.body{flex:1;overflow:auto;position:relative;padding:10px 12px;user-select:text;-webkit-user-select:text}
.body::-webkit-scrollbar{width:16px;height:16px}
.body::-webkit-scrollbar-track{background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/2px 2px;border-left:1px solid #000}
.body::-webkit-scrollbar-thumb{background:#fff;border:1px solid #000}
.body::-webkit-scrollbar-button{display:none}
.grow{position:absolute;right:0;bottom:0;width:15px;height:15px;border-left:1px solid #000;border-top:1px solid #000;background:#fff;cursor:nwse-resize;touch-action:none;display:none}
.grow::before{content:"";position:absolute;left:3px;top:3px;width:5px;height:5px;border:1px solid #000;background:#fff}
.grow::after{content:"";position:absolute;left:5px;top:5px;width:7px;height:7px;border:1px solid #000;border-left:0;border-top:0}
.win.active .grow{display:block}
.grow i{position:absolute;inset:-14px}
.folder{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px 4px}
.folder .icon{width:auto}
.hl1{font:700 18px/1.1 var(--f);margin:2px 0 6px}
.body p{margin:0 0 8px}
.meter{display:grid;grid-template-columns:110px 1fr 40px;gap:6px;align-items:center;margin:4px 0}
.bar{height:12px;border:1px solid #000;background:#fff;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/2px 2px;border-right:1px solid #000}
.bar.solid i{background:#000}
.aboutrow{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid #000;padding-bottom:10px;margin-bottom:8px}
.aboutrow img{width:64px;height:64px;image-rendering:pixelated;flex:0 0 auto}
.dither{display:block;width:100%;max-width:420px;image-rendering:pixelated;border:1px solid #000;margin:4px 0 10px}
.btn{font:700 12px var(--f);background:#fff;border:1px solid #000;border-radius:8px;padding:0 16px;height:24px;box-shadow:0 0 0 1px #fff,0 0 0 2px #000;margin:6px 4px}
.btn:active{background:#000;color:#fff}
.tt{font-family:Monaco,"Lucida Console",Consolas,monospace;font-size:12px;white-space:pre-wrap}
.pz{display:grid;grid-template-columns:repeat(4,44px);grid-template-rows:repeat(4,44px);gap:0;border:1px solid #000;width:max-content;margin:4px auto}
.pz button{border:1px solid #000;background:#fff;font:700 16px var(--f);margin:0;padding:0;width:44px;height:44px;cursor:default}
.pz button.hole{background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/2px 2px;border-color:transparent}
.pz button:focus-visible{outline:2px solid #000;outline-offset:-5px}
.center{text-align:center}

/* drag outline + zoom rects */
.ghost{position:absolute;border:1px dotted #000;outline:1px dotted #fff;outline-offset:-2px;pointer-events:none;z-index:900}
.zr{position:absolute;border:1px dotted #000;pointer-events:none;z-index:900;box-shadow:0 0 0 1px rgba(255,255,255,.7);opacity:0;animation:zr 70ms steps(1,end) both}
@keyframes zr{0%{opacity:1}100%{opacity:0}}
.win.pop{animation:pop 1ms steps(1,end) 150ms both}
@keyframes pop{from{visibility:hidden}to{visibility:visible}}

.welcome{position:fixed;inset:0;background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/2px 2px;z-index:990;display:none;place-items:center}
.welcome.on{display:grid}
.welcome .card{background:#fff;border:1px solid #000;box-shadow:2px 2px 0 #000;padding:22px 40px;text-align:center;font:700 14px var(--f)}
.welcome .card img{width:64px;height:64px;image-rendering:pixelated;display:block;margin:0 auto 10px}
.hint{position:absolute;left:12px;bottom:10px;background:#fff;border:1px solid #000;padding:4px 8px;font-size:11px;box-shadow:1px 1px 0 #000;z-index:1}

@media (pointer:coarse),(max-width:600px){
  .mi{padding:10px 18px}
  .menubar{height:40px}
  .menu{top:39px}
  .icons{top:52px;right:6px;gap:2px}
  .icon{min-height:60px}
  .hint{display:none}
}
@media (max-width:600px){
  .mt{padding:0 8px}
  .clock{display:none}
  .mt.app{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){
  .zr{display:none}
}
</style>
</head>
<body>
<div class="screen" id="screen">
  <nav class="menubar" id="menubar" aria-label="Menu bar"></nav>
  <div class="icons" id="icons" role="list"></div>
  <div class="hint">Double-click an icon · drag title bars · the grow box resizes · ⌘W / Esc closes</div>
</div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<div class="welcome" id="welcome"><div class="card"><img id="happy" alt="">Welcome to Portfolio OS</div></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const screen = $('#screen'); if (!screen) return;

/* ---------- 1-bit pixel icons ---------- */
const PIX = {
  hd:['','','','..############..','.#wwwwwwwwwwww#.','################','#wwwwwwwwwwwwww#','#wwwwwwwwwwww#w#','#w###wwwwwwwwww#','#wwwwwwwwwwwwww#','################','.##..........##.'],
  folder:['','','..#####','.#wwwww#','################','#wwwwwwwwwwwwww#','#wwwwwwwwwwwwww#','#wwwwwwwwwwwwww#','#wwwwwwwwwwwwww#','#wwwwwwwwwwwwww#','#wwwwwwwwwwwwww#','#wwwwwwwwwwwwww#','################'],
  doc:['..#########.....','..#wwwwwww##....','..#wwwwwww#w#...','..#wwwwwww####..','..#wwwwwwwwww#..','..#w####wwwww#..','..#wwwwwwwwww#..','..#w######www#..','..#wwwwwwwwww#..','..#w#####wwww#..','..#wwwwwwwwww#..','..#w######www#..','..#wwwwwwwwww#..','..#wwwwwwwwww#..','..############..'],
  trash:['......####......','..############..','..#wwwwwwwwww#..','..############..','...#ww#ww#ww#...','...#ww#ww#ww#...','...#ww#ww#ww#...','...#ww#ww#ww#...','...#ww#ww#ww#...','...#ww#ww#ww#...','...#ww#ww#ww#...','...##########...'],
  trashfull:['...#.##..#......','..#.####.#.#....','..############..','..#wwwwwwwwww#..','..############..','...#ww#ww#ww#...','...#ww#ww#ww#...','...#ww#ww#ww#...','...#ww#ww#ww#...','...#ww#ww#ww#...','...#ww#ww#ww#...','...##########...'],
  person:['......####......','.....#wwww#.....','....#wwwwww#....','....#w#ww#w#....','....#wwwwww#....','....#ww##ww#....','.....#wwww#.....','......####......','....########....','...#wwwwwwww#...','..#wwwwwwwwww#..','..#wwwwwwwwww#..','..#wwwwwwwwww#..','..############..'],
  mail:['','','################','##wwwwwwwwwwww##','#w#wwwwwwwwww#w#','#ww#wwwwwwww#ww#','#www#wwwwww#www#','#wwww#wwww#wwww#','#wwwww####wwwww#','#wwwwwwwwwwwwww#','#wwwwwwwwwwwwww#','################'],
  puzzle:['################','#wwww#wwww#wwww#','#w##w#ww#w#w##w#','#wwww#wwww#wwww#','################','#wwww#wwww#wwww#','#w#ww#w##w#ww#w#','#wwww#wwww#wwww#','################','#wwww#wwww######','#ww#w#w#ww######','#wwww#wwww######','################'],
  logo:['.......##.......','......#ww#......','.....#wwww#.....','....#ww##ww#....','...#ww####ww#...','..#ww######ww#..','...#ww####ww#...','....#ww##ww#....','.....#wwww#.....','......#ww#......','.......##.......'],
  happy:['..############..','.#wwwwwwwwwwww#.','.#w##########w#.','.#w#wwwwwwww#w#.','.#w#ww#ww#ww#w#.','.#w#wwwwwwww#w#.','.#w#wwww#www#w#.','.#w#ww#wwww##w#.','.#w#www####w#w#.','.#w##########w#.','.#wwwwwwwwwwww#.','.#ww######wwww#.','.#wwwwwwwwwwww#.','..############..','..#wwwwwwwwww#..','..############..']
};
const ICON = {};
for (const k in PIX) {
  const rows = PIX[k], c = document.createElement('canvas'); c.width = 16; c.height = 16;
  const g = c.getContext('2d'); const off = Math.floor((16 - rows.length)/2);
  rows.forEach((row, y) => { [...row].forEach((ch, x) => { if (ch==='#') { g.fillStyle='#000'; g.fillRect(x,y+off,1,1); } else if (ch==='w') { g.fillStyle='#fff'; g.fillRect(x,y+off,1,1); } }); });
  ICON[k] = c.toDataURL();
}

/* ---------- 1-bit dithered artwork (Bayer 4×4) ---------- */
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function dither(w, h, fn){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  const img = g.createImageData(w, h);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){ const v = fn(x/w, y/h); const t = (BAYER[(y%4)*4 + x%4] + .5)/16; const on = v > t ? 255 : 0; const i=(y*w+x)*4; img.data[i]=img.data[i+1]=img.data[i+2]=on; img.data[i+3]=255; }
  g.putImageData(img,0,0); return c.toDataURL();
}
const ART = {
  kettle: dither(210,120,(u,v) => { const cx=.5, cy=.55, dx=(u-cx)*1.75, dy=(v-cy); const r=Math.hypot(dx,dy); if (r<.36){ const nz=Math.sqrt(Math.max(0,.36*.36-r*r))/.36; return .15 + .85*Math.max(0,(-dx*.6 - dy*.6 + nz*.8)/1.4); } if (v>.84) return .35; if (Math.abs(dx+.5) < .06 && v>.35 && v<.6) return .1; return .92 - v*.35; }),
  zoo: dither(210,120,(u,v) => { const hills = .62 + .08*Math.sin(u*9) + .05*Math.sin(u*23+1); if (v > hills) return .18 + (v-hills)*.8; const sun = Math.hypot(u-.72,(v-.3)*.6); if (sun < .08) return 1; return .55 + v*.35 - Math.max(0,.2-sun)*1.5; }),
  type: dither(210,120,(u,v) => { const s = Math.sin(u*40)*.5+.5; const band = Math.floor(v*6); return band%2 ? s*.3+.1 : 1 - u*.8; }),
  floppy: dither(210,120,(u,v) => { const x=(u-.5)*1.75, y=v-.5; if (Math.abs(x)<.4 && Math.abs(y)<.42){ if (y<-.2 && Math.abs(x)<.2) return .75; if (y>.05 && Math.abs(x)<.3) return 1; return .12; } return .6 + .4*Math.sin((u+v)*14)*.3; })
};

/* ---------- content ---------- */
const PROJECTS = [
  { id:'kettle', name:'Kettle.app', art:'kettle', size:'400K', title:'Kettle — tea timer', year:1992, text:'A steeping timer for a tea company that measured everything in “ish”. The whole UI is one spout; the lid bounces when your tea is ready. 12,000 floppies shipped; 11,400 still in drawers.' },
  { id:'zoo', name:'Card Zoo', art:'zoo', size:'1.2M', title:'Card Zoo — a stack of 200 animals', year:1993, text:'A hypermedia stack where every animal card links to its least favourite neighbour. Won a regional award and one very long letter from a pedantic ornithologist.' },
  { id:'type', name:'Specimen 91', art:'type', size:'88K', title:'Specimen 91 — bitmap type', year:1991, text:'Nine bitmap faces hand-placed pixel by pixel at 9, 10 and 12 points. The lowercase g took three weeks and a small crisis of faith.' },
  { id:'floppy', name:'Label Maker', art:'floppy', size:'56K', title:'Floppy Label Maker', year:1994, text:'Prints tidy labels for 3.5″ disks. Includes a “DO NOT ERASE” preset used by 94% of customers, usually too late.' }
];
const W = {};  // window registry
let zTop = 10;

function about(){ return `<div class="aboutrow"><img src="${ICON.person}" alt=""><div><div class="hl1">Ada Bitwise</div>Interaction designer · pixels since 1989<br>Portfolio OS 7.0.1 · Built-in memory: 4,096K</div></div>
  <div class="meter"><span>Coffee</span><span class="bar solid"><i style="width:87%"></i></span><span>87%</span></div>
  <div class="meter"><span>Kerning</span><span class="bar"><i style="width:100%"></i></span><span>100%</span></div>
  <div class="meter"><span>Patience</span><span class="bar"><i style="width:14%"></i></span><span>14%</span></div>
  <div class="meter"><span>Largest unused idea</span><span class="bar"><i style="width:62%"></i></span><span>2.6M</span></div>
  <p style="margin-top:10px">Designs friendly software for serious people and serious software for friendly people. Believes every interface deserves one good joke and a working Undo.</p>`; }
function projects(){ return `<div class="folder">${PROJECTS.map(p => `<button class="icon" data-open="${p.id}"><img src="${ICON.doc}" alt=""><span>${p.name}</span></button>`).join('')}<button class="icon" data-open="puzzle"><img src="${ICON.puzzle}" alt=""><span>Puzzle</span></button></div>`; }
function doc(p){ return `<div class="hl1">${p.title}</div><img class="dither" src="${ART[p.art]}" alt="1-bit dithered artwork for ${p.name}"><p>${p.text}</p><p><b>Role</b> interaction design · <b>Year</b> ${p.year} · <b>Size</b> ${p.size}</p>`; }
function contact(){ return `<div class="tt">To: anyone with a nice problem
From: Ada Bitwise

Currently accepting:
  • interfaces that need to feel calm
  • icons, 16×16 and up
  • arguments about serif fonts

Response time: 1–2 business days
(3 if the modem is busy)

ada@bitwise.example   ·   555-0199</div>`; }
function trash(){ return trashFull ? `<div class="folder"><button class="icon"><img src="${ICON.doc}" alt=""><span>bad ideas.txt</span></button><button class="icon"><img src="${ICON.doc}" alt=""><span>logo v47 FINAL</span></button><button class="icon"><img src="${ICON.doc}" alt=""><span>skeuo toaster</span></button></div><p style="margin-top:10px">3 items. Special ▸ Empty Trash to let go.</p>` : '<p class="center" style="margin-top:30px">The Trash is empty.<br>Very zen. Very spacious.</p>'; }
function hd(){ return `<div class="folder"><button class="icon" data-open="projects"><img src="${ICON.folder}" alt=""><span>Projects</span></button><button class="icon" data-open="about"><img src="${ICON.person}" alt=""><span>About Me</span></button><button class="icon" data-open="contact"><img src="${ICON.mail}" alt=""><span>Contact</span></button><button class="icon"><img src="${ICON.folder}" alt=""><span>System Folder</span></button></div>`; }
let pz = [];
function puzzleHTML(){ return `<div class="pz" id="pz">${pz.map((n,i) => `<button data-i="${i}" class="${n?'':'hole'}" aria-label="${n||'empty'}">${n||''}</button>`).join('')}</div><p class="center" id="pzmsg">${solved()?'Solved! You may now return to work.':'Slide tiles into order.'}</p>`; }
function solved(){ return pz.every((n,i) => n === (i===15 ? 0 : i+1)); }
function shuffle(){ pz = [...Array(15)].map((_,i)=>i+1).concat(0); let h = 15; for (let k=0;k<160;k++){ const nb = [h-4,h+4,(h%4)?h-1:-1,(h%4<3)?h+1:-1].filter(x=>x>=0&&x<16); const j = nb[Math.floor(Math.random()*nb.length)]; [pz[h],pz[j]]=[pz[j],pz[h]]; h=j; } }
shuffle();

const DEFS = {
  hd:{ title:'Macintosh HD', icon:'hd', w:380, h:220, info:['4 items','38.2M in disk','1.8M available'], html:hd },
  projects:{ title:'Projects', icon:'folder', w:440, h:250, info:['5 items','1.8M in disk','1.8M available'], html:projects },
  about:{ title:'About This Designer', icon:'person', w:420, h:300, html:about },
  contact:{ title:'Contact — TeachText', icon:'mail', w:340, h:300, html:contact },
  trash:{ title:'Trash', icon:'trash', w:340, h:200, info:()=>[trashFull?'3 items':'0 items','',''], html:trash },
  puzzle:{ title:'Puzzle', icon:'puzzle', w:220, h:260, html:puzzleHTML }
};
PROJECTS.forEach(p => DEFS[p.id] = { title:p.name, icon:'doc', w:460, h:340, html:() => doc(p) });
let trashFull = true;

/* ---------- desktop icons ---------- */
const DESK = [['hd','Macintosh HD','hd'],['projects','Projects','folder'],['about','About Me','person'],['contact','Contact','mail'],['trash','Trash','trashfull']];
const iconsEl = $('#icons');
DESK.forEach(([id,label,ic]) => { const b = document.createElement('button'); b.className='icon'; b.dataset.open=id; b.dataset.desk=id; b.setAttribute('role','listitem');
  if (id === 'trash') b.classList.add('trashdesk');
  b.innerHTML = `<img src="${ICON[ic]}" alt=""><span>${label}</span>`; iconsEl.appendChild(b); });

/* icon interaction: select on press, open on double-click (single tap on touch) */
let lastTap = { el:null, t:0 };
screen.addEventListener('pointerdown', e => {
  const ic = e.target.closest('.icon');
  closeMenus();
  if (!ic) { if (!e.target.closest('.win')) document.querySelectorAll('.icon.sel').forEach(x => x.classList.remove('sel')); return; }
  document.querySelectorAll('.icon.sel').forEach(x => x.classList.remove('sel'));
  ic.classList.add('sel');
  const now = performance.now();
  if ((lastTap.el === ic && now - lastTap.t < 450) || e.pointerType === 'touch') { if (ic.dataset.open) openWin(ic.dataset.open, ic); lastTap = { el:null, t:0 }; }
  else lastTap = { el:ic, t:now };
});
screen.addEventListener('keydown', e => { const ic = e.target.closest && e.target.closest('.icon'); if (ic && e.key==='Enter' && ic.dataset.open) { e.preventDefault(); openWin(ic.dataset.open, ic); } });

/* ---------- zoom rects ---------- */
// the classic zoom rectangles: CSS-timed outlines so they never stall
const RM = matchMedia('(prefers-reduced-motion: reduce)');
function zoomRects(from, to, cb){
  if (RM.matches) { if (cb) cb(); return; } // no zooming outlines under reduced motion
  const n = 8, made = [];
  for (let k=0;k<=n;k++){ const t = k/n;
    const d = document.createElement('div'); d.className='zr';
    Object.assign(d.style, { left:(from.left + (to.left-from.left)*t)+'px', top:(from.top + (to.top-from.top)*t)+'px', width:(from.width + (to.width-from.width)*t)+'px', height:(from.height + (to.height-from.height)*t)+'px', animationDelay:(k*18)+'ms' });
    screen.appendChild(d); made.push(d); }
  made[n].addEventListener('animationend', () => made.forEach(m => m.remove()));
  setTimeout(() => made.forEach(m => m.remove()), 1200);
  if (cb) cb();
}

/* ---------- windows ---------- */
function bounds(){ return { w: innerWidth, h: innerHeight, top: document.querySelector('.menubar').offsetHeight + 4 }; }
let cascade = 0;
function openWin(id, fromEl, pos){
  const def = DEFS[id]; if (!def) return;
  if (W[id]) { focusWin(W[id]); return; }
  const B = bounds();
  const w = Math.min(def.w, B.w - (B.w < 600 ? 100 : 16)), h = Math.min(def.h, B.h - B.top - 20);
  const p = pos || { x: Math.max(8, Math.min(B.w - w - 8, 40 + (cascade%6)*26)), y: Math.min(B.h - h - 8, B.top + 18 + (cascade%6)*22) };
  cascade++;
  const el = document.createElement('section'); el.className='win'; el.setAttribute('role','dialog'); el.setAttribute('aria-label', def.title);
  Object.assign(el.style, { left:p.x+'px', top:p.y+'px', width:w+'px', height:h+'px' });
  const info = typeof def.info === 'function' ? def.info() : def.info;
  el.innerHTML = `<div class="tb"><button class="box close" aria-label="Close ${def.title}"></button><span class="ttl">${def.title}</span><button class="box zoom" aria-label="Zoom"></button></div>` +
    (info ? `<div class="infobar"><span>${info[0]}</span><span>${info[1]}</span><span>${info[2]}</span></div>` : '') +
    `<div class="body">${def.html()}</div><div class="grow"><i></i></div>`;
  const rec = { id, el, fromEl, def };
  W[id] = rec;
  const src = fromEl ? fromEl.getBoundingClientRect() : { left:p.x + w/2, top:p.y + h/2, width:0, height:0 };
  el.classList.add('pop'); screen.appendChild(el);
  zoomRects(src, { left:p.x, top:p.y, width:w, height:h });
  if (fromEl && fromEl.dataset.desk) fromEl.classList.add('open');
  wire(rec); focusWin(rec);
}
function focusWin(rec){ Object.values(W).forEach(r => r.el.classList.remove('active')); rec.el.classList.add('active'); rec.el.style.zIndex = ++zTop; }
function closeWin(rec){
  if (!rec) return; const r = rec.el.getBoundingClientRect();
  const deskIcon = document.querySelector(`.icon[data-desk="${rec.id}"]`);
  const tgt = (deskIcon || rec.fromEl) ? (deskIcon || rec.fromEl).getBoundingClientRect() : { left:r.left + r.width/2, top:r.top + r.height/2, width:0, height:0 };
  rec.el.remove(); delete W[rec.id];
  if (deskIcon) deskIcon.classList.remove('open');
  zoomRects(r, tgt);
  const rest = Object.values(W).sort((a,b) => (+b.el.style.zIndex) - (+a.el.style.zIndex)); if (rest[0]) focusWin(rest[0]);
}
function topWin(){ return Object.values(W).sort((a,b) => (+b.el.style.zIndex) - (+a.el.style.zIndex))[0]; }
function wire(rec){
  const el = rec.el, tb = el.querySelector('.tb');
  el.addEventListener('pointerdown', () => focusWin(rec));
  el.querySelector('.close').addEventListener('click', e => { e.stopPropagation(); closeWin(rec); });
  el.querySelector('.zoom').addEventListener('click', e => {
    e.stopPropagation(); const B = bounds(); const r = el.getBoundingClientRect();
    let to;
    if (rec.saved) { to = rec.saved; rec.saved = null; }
    else { rec.saved = { left:r.left, top:r.top, width:r.width, height:r.height }; to = { left:4, top:B.top, width:B.w - 8 - (B.w > 600 ? 100 : 0), height:B.h - B.top - 6 }; }
    zoomRects(r, to, () => Object.assign(el.style, { left:to.left+'px', top:to.top+'px', width:to.width+'px', height:to.height+'px' }));
  });
  // drag: dotted outline follows, window jumps on release (as it should)
  tb.addEventListener('pointerdown', e => {
    if (e.target.closest('.box')) return;
    e.preventDefault(); const r = el.getBoundingClientRect(); const ox = e.clientX - r.left, oy = e.clientY - r.top;
    const gh = document.createElement('div'); gh.className='ghost'; Object.assign(gh.style, { left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px' }); screen.appendChild(gh);
    try { tb.setPointerCapture(e.pointerId); } catch(_){}
    const B = bounds();
    const mv = ev => { const x = Math.max(-r.width + 60, Math.min(B.w - 60, ev.clientX - ox)); const y = Math.max(B.top, Math.min(B.h - 24, ev.clientY - oy)); gh.style.left = x+'px'; gh.style.top = y+'px'; };
    const up = () => { el.style.left = gh.style.left; el.style.top = gh.style.top; gh.remove(); tb.removeEventListener('pointermove', mv); tb.removeEventListener('pointerup', up); tb.removeEventListener('pointercancel', up); };
    tb.addEventListener('pointermove', mv); tb.addEventListener('pointerup', up); tb.addEventListener('pointercancel', up);
  });
  const grow = el.querySelector('.grow');
  grow.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); focusWin(rec); const r = el.getBoundingClientRect();
    const gh = document.createElement('div'); gh.className='ghost'; Object.assign(gh.style, { left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px' }); screen.appendChild(gh);
    try { grow.setPointerCapture(e.pointerId); } catch(_){}
    const mv = ev => { gh.style.width = Math.max(200, Math.min(innerWidth - r.left - 4, ev.clientX - r.left)) + 'px'; gh.style.height = Math.max(120, Math.min(innerHeight - r.top - 4, ev.clientY - r.top)) + 'px'; };
    const up = () => { el.style.width = gh.style.width; el.style.height = gh.style.height; gh.remove(); grow.removeEventListener('pointermove', mv); grow.removeEventListener('pointerup', up); };
    grow.addEventListener('pointermove', mv); grow.addEventListener('pointerup', up);
  });
  // icons inside folders
  el.addEventListener('pointerdown', e => {
    const ic = e.target.closest('.body .icon'); if (!ic) return;
    el.querySelectorAll('.icon.sel').forEach(x => x.classList.remove('sel')); ic.classList.add('sel');
  });
  el.addEventListener('dblclick', e => { const ic = e.target.closest('.body .icon'); if (ic && ic.dataset.open) openWin(ic.dataset.open, ic); });
  el.addEventListener('pointerup', e => { if (e.pointerType !== 'touch') return; const ic = e.target.closest('.body .icon'); if (ic && ic.dataset.open) openWin(ic.dataset.open, ic); });
  el.addEventListener('keydown', e => { const ic = e.target.closest && e.target.closest('.body .icon'); if (ic && e.key==='Enter' && ic.dataset.open) { e.preventDefault(); e.stopPropagation(); openWin(ic.dataset.open, ic); } });
  if (rec.id === 'puzzle') el.addEventListener('click', e => {
    const b = e.target.closest('.pz button'); if (!b) return; const i = +b.dataset.i, h = pz.indexOf(0);
    const adj = (Math.abs(i-h)===4) || (Math.abs(i-h)===1 && Math.floor(i/4)===Math.floor(h/4));
    if (adj) { [pz[i],pz[h]]=[pz[h],pz[i]]; el.querySelector('.body').innerHTML = puzzleHTML(); const nb = el.querySelector(`.pz button[data-i="${h}"]`); if (nb) nb.focus(); beep(adj ? 880 : 220); }
    else beep(180);
  });
}
function refreshWin(id){ const rec = W[id]; if (!rec) return; const body = rec.el.querySelector('.body'); if (body) body.innerHTML = rec.def.html(); const ib = rec.el.querySelector('.infobar'); if (ib && typeof rec.def.info === 'function') { const i = rec.def.info(); ib.innerHTML = `<span>${i[0]}</span><span>${i[1]}</span><span>${i[2]}</span>`; } }

/* ---------- sound: the famous simple beep ---------- */
let actx = null;
function beep(f=880){ try { if (!actx) { const AC = window.AudioContext||window.webkitAudioContext; if (!AC) return; actx = new AC(); } if (actx.state==='suspended') actx.resume();
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain(); o.type='square'; o.frequency.value=f; g.gain.setValueAtTime(.06,t); g.gain.exponentialRampToValueAtTime(.0001,t+.12); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+.13); } catch(_){} }

/* ---------- menus ---------- */
const MENUS = [
  { label:`<img src="${ICON.logo}" alt="Portfolio menu">`, items:[['About Portfolio OS…', () => openWin('about')], '-', ['Puzzle', () => openWin('puzzle')], ['Contact', () => openWin('contact')]] },
  { label:'File', items:[['Open', () => { const s = document.querySelector('.icon.sel'); if (s && s.dataset.open) openWin(s.dataset.open, s); else beep(); }, '⌘O'], ['Close Window', () => closeWin(topWin()), '⌘W'], '-', ['Get Info', () => openWin('about'), '⌘I'], ['Print…', null], '-', ['Put Away', null]] },
  { label:'Edit', items:[['Undo', null, '⌘Z'], '-', ['Cut', null, '⌘X'], ['Copy', null, '⌘C'], ['Paste', null, '⌘V'], ['Show Clipboard', () => beep()]] },
  { label:'View', items:[['by Small Icon', () => beep(660)], ['by Icon', () => beep(660)], ['by Name', () => beep(660)], ['by Vibe', () => beep(990)]] },
  { label:'Label', items:[['None', () => beep(660)], '-', ['Essential', () => beep(700)], ['Hot', () => beep(740)], ['In Progress', () => beep(780)], ['Cool', () => beep(820)], ['Personal', () => beep(860)], ['Project 1', () => beep(900)], ['Project 2', () => beep(940)]] },
  { label:'Special', items:[['Clean Up Desktop', cleanUp], ['Empty Trash', emptyTrash], '-', ['Restart', restart], ['Shut Down', shutDown]] }
];
// Application menu: the frontmost app is the Finder
MENUS.push({ app:true, label:`<img src="${ICON.happy}" alt="Application menu: Finder">`, items:[['Hide Finder', null], ['Hide Others', () => beep()], ['Show All', null], '-', ['✓ Finder', () => beep(660)]] });
const mb = $('#menubar'); let appMenu = null;
MENUS.forEach(m => {
  const t = document.createElement('button'); t.className='mt'; t.innerHTML = m.label; t.setAttribute('aria-haspopup','true');
  const menu = document.createElement('div'); menu.className='menu'; menu.setAttribute('role','menu');
  m.items.forEach(it => { if (it === '-') { const s = document.createElement('div'); s.className='sepm'; menu.appendChild(s); return; }
    const d = document.createElement('div'); d.className = 'mi' + (it[1] ? '' : ' dis'); d.setAttribute('role','menuitem'); d.innerHTML = `<span>${it[0]}</span><kbd>${it[2]||''}</kbd>`;
    if (it[1]) d.addEventListener('click', ev => { ev.stopPropagation(); if (RM.matches) { closeMenus(); it[1](); return; } let n = 0; const fl = setInterval(() => { d.classList.toggle('hl'); if (++n >= 4) { clearInterval(fl); closeMenus(); it[1](); } }, 50); });
    menu.appendChild(d); });
  t.appendChild(menu);
  const openIt = () => { const was = t.classList.contains('open'); closeMenus(); if (was) return; t.classList.add('open');
    // keep pulled-down menus on screen on narrow displays
    menu.style.left = ''; const r = menu.getBoundingClientRect(); if (r.right > innerWidth - 4 && !m.app) menu.style.left = Math.round(innerWidth - 4 - r.right) + 'px'; };
  t.addEventListener('pointerdown', e => { e.stopPropagation(); openIt(); });
  t.addEventListener('keydown', e => { if (e.key==='Enter' || e.key===' ') { e.preventDefault(); openIt(); } });
  if (m.app) t.classList.add('app');
  if (m.app) appMenu = t; else mb.appendChild(t);
});
const clk = document.createElement('div'); clk.className='clock'; mb.appendChild(clk);
if (appMenu) mb.appendChild(appMenu);
const tick = () => { const d = new Date(); clk.textContent = d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }; tick(); setInterval(tick, 10000);
function closeMenus(){ document.querySelectorAll('.mt.open').forEach(m => m.classList.remove('open')); }
document.addEventListener('pointerdown', e => { if (!e.target.closest('.menubar')) closeMenus(); });

function cleanUp(){ Object.values(W).forEach((r,i) => { const B = bounds(); const w = r.el.offsetWidth; const x = Math.max(8, Math.min(B.w - w - 8, 30 + i*24)), y = B.top + 14 + i*22; const from = r.el.getBoundingClientRect(); zoomRects(from, { left:x, top:y, width:from.width, height:from.height }, () => { r.el.style.left = x+'px'; r.el.style.top = y+'px'; }); }); }
function emptyTrash(){ trashFull = false; const t = document.querySelector('.icon[data-desk="trash"] img'); if (t) t.src = ICON.trash; refreshWin('trash'); beep(440); }
function restart(){ const w = $('#welcome'); if (!w) return; Object.values(W).forEach(r => r.el.remove()); for (const k in W) delete W[k]; document.querySelectorAll('.icon.open').forEach(i => i.classList.remove('open'));
  w.classList.add('on'); setTimeout(() => { w.classList.remove('on'); boot(); }, 1600); }
function shutDown(){ const w = $('#welcome'); if (!w) return; const card = w.querySelector('.card'); const old = card.innerHTML; card.innerHTML = 'It is now safe to switch off<br>your portfolio.<br><button class="btn" id="restartBtn">Restart</button>'; w.classList.add('on');
  const rb = $('#restartBtn'); if (rb) rb.addEventListener('click', () => { card.innerHTML = old; restart(); }); }

addEventListener('keydown', e => {
  if ((e.key === 'w' || e.key === 'W') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); closeWin(topWin()); }
  else if (e.key === 'Escape') { if (document.querySelector('.mt.open')) closeMenus(); else closeWin(topWin()); }
});

const happy = $('#happy'); if (happy) happy.src = ICON.happy;
function boot(){
  const small = innerWidth < 600;
  const hdIcon = document.querySelector('.icon[data-desk="projects"]');
  setTimeout(() => openWin('about', document.querySelector('.icon[data-desk="about"]'), small ? { x:8, y:60 } : { x:60, y:60 }), 150);
  setTimeout(() => openWin('projects', hdIcon, small ? { x:8, y:380 } : { x:420, y:250 }), 450);
  if (!small) setTimeout(() => openWin('kettle', null, { x:230, y:420 }), 750);
}
boot();
})();
</script>
