<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sabrina Residences · 逐字進場的房產落地頁</title>
<meta name="description" content="Sabrina Residences：藍天漸層上的房產落地頁，房子從底部緩緩升起，標題、標語與說明逐字模糊浮現，左下角影片卡片永不停播，進度條跟著影片走。">
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.sceneai.art" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Manrope:wght@400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: #fff;
  font-family: "Archivo", system-ui, sans-serif;
  color: #fff;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
img, video, svg { display: block; }

:root {
  --gutter: clamp(16px, 2.2vw, 40px);
  --ease-line: cubic-bezier(.65, 0, .35, 1);
  --ease-word: cubic-bezier(.2, .7, .2, 1);
  --ease-rise: cubic-bezier(.22, .61, .24, 1);
  --glass: rgba(255, 255, 255, .16);
}

/* ---------- STEP 2: page background ---------- */
.page {
  position: relative;
  overflow-x: clip;
  background:
    radial-gradient(40% 18% at 30% 12%, rgba(120, 170, 255, .35), transparent 70%),
    radial-gradient(35% 14% at 78% 26%, rgba(130, 175, 255, .28), transparent 70%),
    radial-gradient(30% 10% at 55% 3%, rgba(110, 160, 255, .3), transparent 70%),
    linear-gradient(180deg, #1150ef 0%, #135af3 30%, #3c7af6 52%, #76a2fa 64%, #86acfb 70%, #b9cffd 84%, #ffffff 100%);
}
.gridlines { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.gridlines i {
  position: absolute; top: 0; bottom: 0; width: 1px;
  background: rgba(255, 255, 255, .28);
  transform-origin: 50% 0;
  animation: lineGrow 1.6s var(--ease-line) both;
}
.gridlines i:nth-child(1) { left: 4.8%; }
.gridlines i:nth-child(2) { left: 35.45%; animation-delay: .1s; }
.gridlines i:nth-child(3) { left: 64.7%; animation-delay: .2s; }
.gridlines i:nth-child(4) { left: 95.2%; animation-delay: .3s; }
@keyframes lineGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

/* ---------- STEP 3: hero ---------- */
.hero {
  position: relative;
  overflow: hidden;
  min-height: clamp(760px, 75vw, 1300px);
  display: flex;
  flex-direction: column;
}
.house {
  position: absolute;
  right: 4.8vw;
  bottom: 0;
  width: max(83vw, 640px);
  height: auto;
  z-index: 1;
  transform-origin: 50% 100%;
  animation: houseRise 4.2s var(--ease-rise) .2s both;
  pointer-events: none;
  user-select: none;
}
@keyframes houseRise {
  0% { opacity: 0; transform: translateY(70%) scale(1.06); }
  25% { opacity: 1; }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* ---------- STEP 4: header ---------- */
.header {
  position: relative;
  z-index: 10;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  padding: 24px var(--gutter) 0;
}
.logo { justify-self: start; display: inline-flex; }
.logo svg { width: 40px; height: 30px; }

.nav { display: flex; gap: 1px; }
.pill {
  display: inline-flex; align-items: center; justify-content: center;
  height: 40px; padding: 0 18px; border-radius: 999px;
  font-size: 13px; letter-spacing: -.035em; line-height: 1; white-space: nowrap;
  background: var(--glass);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  transition: background-color .3s ease, color .3s ease;
}
.pill:hover { background: rgba(255, 255, 255, .3); }
.pill.is-home, .pill.is-home:hover { background: #fff; color: #161616; gap: 10px; }
.pill svg { width: 15px; height: 15px; flex: none; }

.actions { justify-self: end; display: flex; align-items: center; gap: 10px; }
.lang {
  display: flex; align-items: center; height: 40px; padding: 3px; border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.lang button {
  height: 34px; min-width: 40px; padding: 0 12px; border-radius: 999px;
  font-size: 13px; letter-spacing: -.035em; line-height: 1;
  transition: background-color .3s ease, color .3s ease;
}
.lang button[aria-pressed="true"] { background: #fff; color: #161616; }
.signin {
  display: inline-flex; align-items: center; height: 41px; padding: 0 19px; border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, .9);
  font-size: 13px; letter-spacing: -.035em; line-height: 1; white-space: nowrap;
  transition: background-color .3s ease, color .3s ease;
}
.signin:hover { background: #fff; color: #1150ef; }
.burger {
  display: none; width: 44px; height: 44px; border-radius: 50%;
  align-items: center; justify-content: center;
  background: var(--glass);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  transition: background-color .3s ease;
}
.burger:hover { background: rgba(255, 255, 255, .3); }
.burger svg { width: 20px; height: 20px; }
.burger path { transition: transform .35s var(--ease-word), opacity .2s ease; transform-origin: 12px 12px; }
.burger[aria-expanded="true"] .b1 { transform: translateY(6px) rotate(45deg); }
.burger[aria-expanded="true"] .b2 { opacity: 0; }
.burger[aria-expanded="true"] .b3 { transform: translateY(-6px) rotate(-45deg); }

.menu {
  position: absolute; top: 78px; right: var(--gutter);
  width: min(300px, calc(100vw - 2 * var(--gutter)));
  display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 24px;
  background: rgba(255, 255, 255, .18);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  border: 1px solid rgba(255, 255, 255, .3);
  opacity: 0; visibility: hidden; transform: translateY(-8px);
  transition: opacity .3s ease, transform .35s var(--ease-word), visibility 0s linear .35s;
}
.menu.open { opacity: 1; visibility: visible; transform: none; transition: opacity .3s ease, transform .35s var(--ease-word), visibility 0s; }
.menu .pill { height: 48px; justify-content: flex-start; padding: 0 20px; font-size: 14px; }

/* nav entrance */
.fd { animation: fadeDown .8s var(--ease-word) both; }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }

/* ---------- STEP 8: wordIn ---------- */
.w { display: inline-block; animation: wordIn .7s var(--ease-word) both; animation-delay: var(--d, 0s); }
@keyframes wordIn {
  from { opacity: 0; transform: translateY(.45em); filter: blur(10px); }
  to { opacity: 1; transform: none; filter: blur(0); }
}

/* ---------- STEP 5: headline + tagline ---------- */
.intro {
  position: relative; z-index: 3;
  display: flex; flex-wrap: wrap; column-gap: 24px;
  padding: clamp(28px, 3.4vw, 60px) var(--gutter) 0;
}
.title {
  margin: 0;
  font-family: "Playfair Display", Georgia, serif; font-weight: 400;
  text-transform: uppercase;
  font-size: min(clamp(40px, calc(39px + 4.9vw), 170px), 15vw); /* 15vw cap keeps RESIDENCES inside ~360px screens */
  line-height: .87; letter-spacing: -.005em;
}
.title > span { display: block; }
.title > span:first-child { padding-left: .92em; }
.title .w { animation-duration: 1s; }
.tagline {
  margin: clamp(24px, 4.3vw, 80px) 0 0 auto;
  font-size: clamp(13px, 1.66vw, 26px); line-height: 1.02; letter-spacing: -.045em;
  text-transform: uppercase; text-indent: 3.6em; font-weight: 400;
}
.tagline .w { text-indent: 0; } /* text-indent inherits into inline-blocks */

/* ---------- STEP 6: explore ---------- */
.explore-row { position: relative; z-index: 3; padding: clamp(36px, 5.6vw, 100px) var(--gutter) 0; }
.explore {
  display: inline-flex; align-items: center; gap: clamp(18px, 2.4vw, 34px);
  font-size: clamp(13px, 1.3vw, 20px); letter-spacing: -.01em; text-transform: uppercase;
  transition: opacity .3s ease;
}
.explore:hover { opacity: .8; }
.explore svg { width: 18px; height: 18px; }
.explore .w { animation-duration: .8s; }

/* ---------- STEP 7: video card ---------- */
.card {
  position: absolute; z-index: 3;
  left: var(--gutter); bottom: clamp(36px, 8.6vw, 140px);
  width: clamp(150px, 17vw, 290px);
  animation: cardIn 1s var(--ease-word) 2s both;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(30px) scale(.97); } to { opacity: 1; transform: none; } }
.vbox {
  aspect-ratio: 1.7; border-radius: clamp(8px, .9vw, 14px); overflow: hidden;
  background: rgba(255, 255, 255, .2);
}
.vbox video { width: 100%; height: 100%; object-fit: cover; }
.caption {
  margin: 8px 0 0;
  font-family: "Manrope", system-ui, sans-serif;
  font-size: clamp(13px, 1.4vw, 22px); line-height: 1.02; letter-spacing: .035em;
}
.bars {
  display: flex; gap: 5px; margin-top: 12px;
  transform-origin: 0 50%;
  animation: barsIn .9s var(--ease-word) 2.55s both;
}
@keyframes barsIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.bar {
  flex: 1; height: 14px; display: flex; align-items: center;
  transition: flex-grow .6s var(--ease-word);
}
.bar::before {
  content: ""; width: 100%; height: 3px; border-radius: 2px;
  background: rgba(255, 255, 255, .4);
  transition: background-color .6s ease;
}
.bar.on { flex-grow: 1.7; }
.bar.on::before { background: #fff; }
.bar:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 3px; }

/* ---------- STEP 9: latest houses ---------- */
.latest {
  position: relative; z-index: 2;
  display: flex; flex-wrap: wrap; row-gap: 32px;
  padding: clamp(56px, 9.9vw, 170px) clamp(16px, 4vw, 70px) clamp(40px, 4.4vw, 80px) clamp(16px, 2.8vw, 48px);
}
.latest h2 {
  flex: 1 1 max(200px, 24.5vw);
  margin: clamp(0px, .9vw, 16px) 0 0;
  font-family: "Playfair Display", Georgia, serif; font-weight: 400;
  font-size: clamp(40px, 4.6vw, 80px); line-height: 1.2; color: #0d0d0d;
}
.latest h2 .w {
  display: table; /* one word per line; keeps the underline on the word itself */
  text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: .06em;
  animation: none;
}
.gallery {
  flex: 999 1 540px; min-width: 0;
  display: grid; grid-auto-flow: column;
  grid-template-columns: repeat(3, minmax(170px, 1fr));
  gap: clamp(10px, 1.25vw, 20px);
  overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
  scrollbar-width: none;
}
.gallery::-webkit-scrollbar { display: none; }
.house-card {
  display: block; aspect-ratio: .79; border-radius: clamp(6px, .8vw, 12px); overflow: hidden;
  scroll-snap-align: start; background: rgba(17, 80, 239, .08);
}
.house-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 1s var(--ease-rise); }
.house-card:hover img { transform: scale(1.05); }
.house-card:focus-visible { outline: 2px solid #1150ef; outline-offset: 3px; }

/* scroll-triggered: only hidden once JS confirms IntersectionObserver works */
.latest.wait h2 .w, .latest.wait .house-card { opacity: 0; }
.latest.in h2 .w { animation: wordIn .9s var(--ease-word) both; animation-delay: var(--d, 0s); }
.latest.in .house-card { animation: cardRise 1.1s var(--ease-word) both; animation-delay: var(--d, 0s); }
@keyframes cardRise { from { opacity: 0; transform: translateY(30px) scale(.97); } to { opacity: 1; transform: none; } }

/* ---------- STEP 10: responsive ---------- */
@media (max-width: 860px) {
  .nav { display: none; }
  .burger { display: inline-flex; }
}
@media (min-width: 861px) {
  .menu { display: none; }
}
@media (max-width: 360px) {
  .actions { gap: 6px; }
  .signin { padding: 0 14px; }
}

@media (prefers-reduced-motion: reduce) {
  .gridlines i, .house, .fd, .w, .card, .bars,
  .latest.in h2 .w, .latest.in .house-card { animation: none !important; }
  .latest.wait h2 .w, .latest.wait .house-card { opacity: 1; }
  .house-card img, .bar, .bar::before, .menu, .burger path { transition: none; }
}
</style>
</head>

<script>
(function () {
  'use strict';

  // Language switch (BA / EN): a real toggle that also updates the document language.
  var langBtns = document.querySelectorAll('.lang button');
  langBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      langBtns.forEach(function (b) { b.setAttribute('aria-pressed', String(b === btn)); });
      document.documentElement.lang = btn.dataset.lang;
    });
  });

  // Mobile menu
  var burger = document.querySelector('.burger');
  var menu = document.getElementById('menu');
  function setMenu(open) {
    menu.classList.toggle('open', open);
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  }
  burger.addEventListener('click', function (e) {
    e.stopPropagation();
    setMenu(!menu.classList.contains('open'));
  });
  menu.addEventListener('click', function (e) { if (e.target.closest('a')) setMenu(false); });
  document.addEventListener('click', function (e) {
    if (menu.classList.contains('open') && !menu.contains(e.target)) setMenu(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && menu.classList.contains('open')) { setMenu(false); burger.focus(); }
  });
  matchMedia('(min-width: 861px)').addEventListener('change', function (m) { if (m.matches) setMenu(false); });

  // Video that never stops, with 4 chapter bars following its progress.
  var video = document.getElementById('clip');
  var bars = Array.prototype.slice.call(document.querySelectorAll('.bar'));
  var active = 0;
  function play() {
    if (!video.paused && !video.ended) return;
    var p = video.play();
    if (p && p.catch) p.catch(function () {});
  }
  function setActive(i) {
    if (i === active) return;
    bars[active].classList.remove('on');
    bars[active].removeAttribute('aria-current');
    bars[i].classList.add('on');
    bars[i].setAttribute('aria-current', 'true');
    active = i;
  }
  function sync() {
    var d = video.duration;
    if (!d || !isFinite(d)) return;
    setActive(Math.min(3, Math.floor(video.currentTime / d * 4)));
  }
  video.muted = true;
  ['pause', 'ended', 'stalled', 'suspend', 'canplay'].forEach(function (ev) {
    video.addEventListener(ev, function () { if (ev !== 'suspend' || video.paused) play(); });
  });
  video.addEventListener('timeupdate', sync);
  video.addEventListener('seeked', sync);
  setInterval(play, 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) play(); });
  ['pointerdown', 'touchstart'].forEach(function (ev) {
    window.addEventListener(ev, play, { once: true, passive: true });
  });
  bars.forEach(function (bar, i) {
    bar.addEventListener('click', function () {
      var d = video.duration;
      if (d && isFinite(d)) video.currentTime = d * i / 4 + 0.01;
      setActive(i);
      play();
    });
  });
  play();

  // Section 2: reveal on scroll. Content stays visible unless the observer is available.
  var latest = document.getElementById('latest');
  if ('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    latest.classList.add('wait');
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          latest.classList.remove('wait');
          latest.classList.add('in');
          io.disconnect();
        }
      });
    }, { threshold: 0.15 });
    io.observe(latest);
    window.addEventListener('beforeprint', function () { latest.classList.remove('wait'); latest.classList.add('in'); });
  }
})();
</script>
