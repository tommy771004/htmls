<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>趕稿看板 — 新粗獷 Kanban</title>
<meta name="description" content="硬陰影 Kanban：卡片拖曳跨欄、進行中上限警示、完成欄蓋章。收錄於 100 Creative HTML Works（039・新粗獷）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/web/039-neo-brutal.html">
<style>
:root{
  --ink:#000; --bg:#fff6d9; --yel:#ffe14d; --pink:#ff90c8; --blue:#79c5ff; --green:#7dffa8; --orange:#ff9f43; --white:#fff;
  --h:"Arial Black","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  --b:Verdana,"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  --sh:6px 6px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--b);color:var(--ink);background:var(--bg);background-image:radial-gradient(var(--ink) 1px,transparent 1.4px);background-size:24px 24px;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.app{max-width:1280px;margin:0 auto;padding:26px 28px 60px}

/* header */
.top{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin-bottom:22px}
h1{margin:0;font:900 clamp(38px,6vw,80px)/.95 var(--h);letter-spacing:-.02em}
h1 span{display:inline-block;background:var(--pink);border:4px solid var(--ink);box-shadow:var(--sh);padding:0 .15em;transform:rotate(-2deg);margin-left:.15em}
.sub{margin:10px 0 0;font-size:14px;font-weight:700}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.chip{border:3px solid var(--ink);background:var(--white);box-shadow:4px 4px 0 var(--ink);padding:8px 12px;font:900 13px/1.1 var(--h)}
.chip b{display:block;font-size:26px}
.chip.g{background:var(--green)}

/* add form */
.add{display:grid;grid-template-columns:1fr auto auto auto auto;gap:12px;margin-bottom:26px;border:4px solid var(--ink);background:var(--white);box-shadow:var(--sh);padding:12px}
.add input{min-width:0;min-height:48px;border:3px solid var(--ink);padding:0 14px;font-size:16px;background:#fffdf2;outline:none}
.add input:focus{background:var(--yel)}
.add select{min-height:48px;border:3px solid var(--ink);padding:0 10px;background:var(--white);font-weight:700}
.btn{min-height:48px;padding:0 20px;border:3px solid var(--ink);background:var(--yel);font:900 16px var(--h);box-shadow:4px 4px 0 var(--ink);cursor:pointer;transition:none}
.btn:hover{background:var(--orange)}
.btn:active,.btn.press{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}

/* board */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start}
.col{border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:0 0 14px;min-height:320px}
.col[data-c="todo"]{background:var(--yel)}
.col[data-c="doing"]{background:var(--pink)}
.col[data-c="done"]{background:var(--blue)}
.col header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:4px solid var(--ink);background:rgba(255,255,255,.35)}
.col h2{margin:0;font:900 22px/1 var(--h)}
.count{font:900 16px var(--h);background:var(--ink);color:var(--white);min-width:36px;height:36px;display:grid;place-items:center;padding:0 8px}
.col.over .count{background:#ff3b30;animation:jolt .3s steps(3) 2}
@keyframes jolt{33%{transform:translate(-3px,1px)}66%{transform:translate(3px,-1px)}}
.limit{font-size:11px;font-weight:700;padding:6px 14px 0;min-height:20px}
.list{list-style:none;margin:0;padding:10px 14px 0;display:grid;gap:14px;min-height:140px}
.list.hot{outline:4px dashed var(--ink);outline-offset:-8px}

.card{position:relative;background:var(--white);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px 12px 10px 44px;cursor:grab;user-select:none;-webkit-user-select:none}
.card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.card:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.card.lift{opacity:.25}
.grip{position:absolute;left:0;top:0;bottom:0;width:32px;border-right:3px solid var(--ink);display:grid;place-items:center;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(0,0,0,.9) 5px 7px) center/10px 40px no-repeat;touch-action:none;cursor:grab}
.card .t{font:700 15px/1.45 var(--b);margin:0 0 10px;word-break:break-word}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;font-weight:700}
.tag{border:2px solid var(--ink);padding:2px 7px;font-weight:700}
.who{width:28px;height:28px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:900 12px var(--h);background:var(--yel)}
.due{margin-left:auto}
.x,.mv{position:absolute;top:-3px;right:-3px;width:40px;height:40px;border:3px solid var(--ink);background:var(--white);font:900 18px/1 var(--h);cursor:pointer;display:none;padding:0}
.card:hover .x,.card:focus-within .x{display:block}
.x:hover{background:#ff3b30;color:#fff}
.x:active{transform:translate(2px,2px)}
.col[data-c="done"] .due{visibility:hidden}
.stamp{position:absolute;right:10px;bottom:6px;font:900 15px var(--h);border:3px solid var(--ink);background:var(--green);padding:2px 8px;transform:rotate(-8deg);display:none}
.col[data-c="done"] .stamp{display:block}
.col[data-c="done"] .t{text-decoration:line-through;text-decoration-thickness:3px}
.slam{animation:slam .28s steps(2)}
@keyframes slam{0%{transform:scale(1.15) rotate(-3deg)}100%{transform:none}}

.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(3deg);box-shadow:12px 12px 0 var(--ink)!important;opacity:.97;margin:0}
.ph{border:3px dashed var(--ink);background:rgba(255,255,255,.5);min-height:60px}

.banner{margin-top:28px;border:4px solid var(--ink);background:var(--green);box-shadow:var(--sh);padding:18px 22px;font:900 clamp(22px,3vw,34px)/1.2 var(--h);display:none}
.banner.on{display:block;animation:slam .3s steps(2)}
.keys{margin-top:24px;font-size:12px;font-weight:700;display:flex;gap:12px;flex-wrap:wrap}
.keys kbd{display:inline-block;border:2px solid var(--ink);background:var(--white);box-shadow:2px 2px 0 var(--ink);padding:1px 6px;font:900 11px var(--h);margin-right:4px}

@media (max-width:860px){
  .app{padding:18px 16px 50px}
  .top{grid-template-columns:1fr}
  .stats{justify-content:flex-start}
  .add{grid-template-columns:1fr 1fr}
  .add input{grid-column:1/-1}
  .add .btn{grid-column:1/-1}
  .board{grid-template-columns:1fr;gap:22px}
  .col{box-shadow:6px 6px 0 var(--ink);min-height:0}
  .list{min-height:70px}
  .x{display:block}
  .card{padding-right:44px}
}
/* Poster pass (SiteInspire typographic / unusual layout: Love and Money, Viktor Horvath):
   the sprint name becomes a slab of type that owns the fold, the board runs full width
   and every column is a tall drop target instead of a small box in the corner. */
.app{max-width:none;padding:24px clamp(16px,3vw,48px) 64px}
.top{display:grid;grid-template-columns:1fr auto;grid-template-areas:"h h" "s st";gap:0 24px;align-items:end;background:var(--orange);border:5px solid var(--ink);box-shadow:12px 12px 0 var(--ink);padding:clamp(20px,2.4vw,34px) clamp(20px,2.6vw,40px) clamp(20px,2vw,28px);margin-bottom:38px}
.top > div:first-child{display:contents}
h1{grid-area:h;font-size:clamp(64px,14vw,230px);line-height:.9;letter-spacing:0;white-space:nowrap;padding-bottom:.12em;border-bottom:6px solid var(--ink)}
h1 span{font-size:.9em;border-width:6px;box-shadow:12px 12px 0 var(--ink);padding:0 .12em;margin-left:.1em;transform:rotate(-4deg);vertical-align:.04em}
.sub{grid-area:s;margin:22px 0 0;font:900 clamp(15px,1.35vw,20px)/1.35 var(--h)}
.stats{grid-area:st;margin-top:22px;gap:14px}
.chip{border-width:4px;box-shadow:6px 6px 0 var(--ink);padding:10px 16px 8px;font-size:14px;min-width:118px}
.chip b{font-size:clamp(30px,2.8vw,44px);line-height:1;margin-top:4px}
.add{margin-bottom:34px;padding:14px}
.board{gap:clamp(22px,2.4vw,36px);align-items:stretch}
.col{display:flex;flex-direction:column;min-height:min(64vh,660px);border-width:5px;box-shadow:12px 12px 0 var(--ink)}
.col header{padding:14px 18px;border-bottom-width:5px}
.col h2{font-size:clamp(24px,2.3vw,34px)}
.count{min-width:52px;height:52px;font-size:26px}
.limit{font-size:12px;padding:8px 18px 0}
.list{flex:1;padding:12px 18px 4px;gap:16px;align-content:start}
.card{padding:14px 14px 12px 48px}
.card .t{font-size:16px}
.banner{margin-top:36px;border-width:5px;box-shadow:12px 12px 0 var(--ink);font-size:clamp(26px,4vw,56px);padding:22px 28px}
.keys{margin-top:30px}
@media (max-width:860px){
  .top{grid-template-columns:1fr;grid-template-areas:"h" "s" "st";box-shadow:8px 8px 0 var(--ink);margin-bottom:30px}
  h1{font-size:19vw;white-space:normal}
  h1 span{margin:.08em 0 0;box-shadow:8px 8px 0 var(--ink)}
  .stats{justify-content:stretch}
  .chip{flex:1;min-width:0;padding:8px 10px 6px}
  .chip b{font-size:26px}
  .col{min-height:0;box-shadow:8px 8px 0 var(--ink)}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <h1>趕稿看板<span>26</span></h1>
      <p class="sub">第 26 次衝刺 · 截稿：週五 17:59（不是 18:00）</p>
    </div>
    <div class="stats">
      <div class="chip">總卡片<b id="sTotal">0</b></div>
      <div class="chip">進行中<b id="sDoing">0</b></div>
      <div class="chip g">完成率<b id="sPct">0%</b></div>
    </div>
  </div>

  <form class="add" id="add" autocomplete="off">
    <input id="newT" maxlength="60" placeholder="新任務，例如：把按鈕再做大一點" aria-label="新任務">
    <select id="newTag" aria-label="標籤">
      <option value="設計">設計</option><option value="前端">前端</option><option value="行政">行政</option><option value="雜事">雜事</option>
    </select>
    <select id="newWho" aria-label="負責人">
      <option>明</option><option>美</option><option>虎</option>
    </select>
    <select id="newDue" aria-label="期限">
      <option value="未設定">期限未設定</option><option value="今天">今天</option><option value="明天">明天</option><option value="本週">本週</option>
    </select>
    <button class="btn" type="submit">新增 +</button>
  </form>

  <main class="board" id="board">
    <section class="col" data-c="todo"><header><h2>待辦</h2><span class="count">0</span></header><div class="limit">先丟這，晚點再煩惱</div><ul class="list" aria-label="待辦"></ul></section>
    <section class="col" data-c="doing"><header><h2>進行中</h2><span class="count">0</span></header><div class="limit" id="wip">上限 3 張。人只有一顆腦。</div><ul class="list" aria-label="進行中"></ul></section>
    <section class="col" data-c="done"><header><h2>完成</h2><span class="count">0</span></header><div class="limit">蓋章了就不准反悔</div><ul class="list" aria-label="完成"></ul></section>
  </main>

  <div class="banner" id="banner">全部搞定！可以下班了。（請先確認真的有存檔）</div>

  <div class="keys">
    <span><kbd>拖曳</kbd>抓左側條紋移動卡片</span>
    <span><kbd>←</kbd><kbd>→</kbd>移到隔壁欄</span>
    <span><kbd>↑</kbd><kbd>↓</kbd>調整順序</span>
    <span><kbd>Del</kbd>刪除</span>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var COLS = ["todo","doing","done"], WIP = 3;
  var TAGC = {"設計":"var(--pink)","前端":"var(--blue)","行政":"var(--orange)","雜事":"var(--green)"};
  var WHOC = {"明":"var(--yel)","美":"var(--pink)","虎":"var(--blue)"};
  var SEED = [
    {c:"todo", t:"把 logo 放大一點（第 7 次）", g:"設計", w:"美", d:"週二"},
    {c:"todo", t:"回覆那封「快速問一下」的信", g:"雜事", w:"明", d:"今天"},
    {c:"todo", t:"寫週報，語氣要像很忙", g:"行政", w:"虎", d:"週四"},
    {c:"todo", t:"替 !important 寫一封道歉信", g:"前端", w:"明", d:"週三"},
    {c:"doing", t:"修掉只在週五下午出現的 bug", g:"前端", w:"虎", d:"週五"},
    {c:"doing", t:"開會討論要不要開會", g:"行政", w:"美", d:"今天"},
    {c:"done", t:"把茶水間的咖啡機修好", g:"雜事", w:"虎", d:"昨天"},
    {c:"done", t:"變數改名：temp2_final_real", g:"前端", w:"明", d:"週一"}
  ];
  var store = { get:function(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set:function(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
  var data = store.get("brutal-kanban");
  if(!Array.isArray(data)) data = SEED.map(function(x, i){ x.id = "k" + i; return x; });
  var uid = data.length + 100;

  var lists = {};
  COLS.forEach(function(c){ var col = document.querySelector('.col[data-c="'+c+'"]'); lists[c] = col ? col.querySelector(".list") : null; });
  if(!lists.todo || !lists.doing || !lists.done) return;

  function makeCard(x){
    var li = document.createElement("li");
    li.className = "card"; li.tabIndex = 0; li.dataset.id = x.id;
    li.innerHTML = '<span class="grip" aria-hidden="true"></span><p class="t"></p><div class="meta"><span class="tag"></span><span class="who"></span><span class="due"></span></div><span class="stamp">搞定！</span><button class="x" type="button" aria-label="刪除卡片">×</button>';
    li.querySelector(".t").textContent = x.t;
    var tag = li.querySelector(".tag"); tag.textContent = "#" + x.g; tag.style.background = TAGC[x.g] || "#fff";
    var who = li.querySelector(".who"); who.textContent = x.w; who.style.background = WHOC[x.w] || "#fff";
    li.querySelector(".due").textContent = "期限 " + x.d;
    li.setAttribute("aria-label", x.t + "，" + x.g + "，負責：" + x.w);
    li.querySelector(".x").addEventListener("click", function(e){ e.stopPropagation(); removeCard(li); });
    li.addEventListener("pointerdown", startDrag);
    li.addEventListener("keydown", keyCard);
    return li;
  }
  function render(){
    COLS.forEach(function(c){ lists[c].innerHTML = ""; });
    data.forEach(function(x){ var l = lists[x.c] || lists.todo; l.appendChild(makeCard(x)); });
    sync(false);
  }
  /* read order back from the DOM into data */
  function sync(save){
    var next = [];
    COLS.forEach(function(c){
      lists[c].querySelectorAll(".card").forEach(function(li){
        var x = data.filter(function(d){ return d.id === li.dataset.id; })[0];
        if(x){ x.c = c; next.push(x); }
      });
    });
    data = next;
    var n = {todo:0, doing:0, done:0}; data.forEach(function(x){ n[x.c]++; });
    COLS.forEach(function(c){ var col = lists[c].parentNode; var ct = col.querySelector(".count"); if(ct) ct.textContent = n[c]; });
    var doing = lists.doing.parentNode, over = n.doing > WIP;
    doing.classList.toggle("over", over);
    var wip = $("#wip"); if(wip) wip.textContent = over ? "超過上限！" + n.doing + " / " + WIP + "，先完成一張再說。" : "上限 3 張。人只有一顆腦。";
    var set = function(id, v){ var e = $(id); if(e) e.textContent = v; };
    set("#sTotal", data.length); set("#sDoing", n.doing); set("#sPct", data.length ? Math.round(n.done / data.length * 100) + "%" : "0%");
    var banner = $("#banner"); if(banner) banner.classList.toggle("on", data.length > 0 && n.todo === 0 && n.doing === 0);
    if(save) store.set("brutal-kanban", data);
  }
  function removeCard(li){
    var next = li.nextElementSibling || li.previousElementSibling;
    li.remove(); data = data.filter(function(d){ return d.id !== li.dataset.id; }); sync(true);
    if(next && next.focus) next.focus();
  }
  function slam(li){ li.classList.remove("slam"); void li.offsetWidth; li.classList.add("slam"); }

  /* ---------- add ---------- */
  var form = $("#add");
  if(form) form.addEventListener("submit", function(e){
    e.preventDefault();
    var t = $("#newT"), g = $("#newTag"), w = $("#newWho"), d = $("#newDue");
    if(!t || !t.value.trim()){ if(t) t.focus(); return; }
    var x = {id:"k" + (uid++), c:"todo", t:t.value.trim(), g:g ? g.value : "雜事", w:w ? w.value : "明", d:d ? d.value : "未設定"};
    data.push(x); var li = makeCard(x); lists.todo.appendChild(li); slam(li); sync(true); t.value = "";
  });

  /* ---------- keyboard ---------- */
  function keyCard(e){
    var li = e.currentTarget; if(e.target !== li) return;
    var col = li.parentNode.parentNode.dataset.c, ci = COLS.indexOf(col);
    if(e.key === "ArrowRight" || e.key === "ArrowLeft"){
      var ni = ci + (e.key === "ArrowRight" ? 1 : -1); if(ni < 0 || ni > 2) return;
      e.preventDefault(); lists[COLS[ni]].appendChild(li); li.focus(); slam(li); sync(true);
    } else if(e.key === "ArrowUp" && li.previousElementSibling){ e.preventDefault(); li.parentNode.insertBefore(li, li.previousElementSibling); li.focus(); sync(true); }
    else if(e.key === "ArrowDown" && li.nextElementSibling){ e.preventDefault(); li.parentNode.insertBefore(li.nextElementSibling, li); li.focus(); sync(true); }
    else if(e.key === "Delete" || e.key === "Backspace"){ e.preventDefault(); removeCard(li); }
  }

  /* ---------- pointer drag (mouse anywhere on card, touch via the grip) ---------- */
  var drag = null;
  function startDrag(e){
    if(e.button !== undefined && e.button !== 0) return;
    if(e.target.closest && e.target.closest(".x")) return;
    var li = e.currentTarget, onGrip = e.target.classList && e.target.classList.contains("grip");
    if(e.pointerType !== "mouse" && !onGrip) return;
    var r = li.getBoundingClientRect();
    drag = {li:li, sx:e.clientX, sy:e.clientY, ox:e.clientX - r.left, oy:e.clientY - r.top, w:r.width, h:r.height, on:false, id:e.pointerId};
    try{ li.setPointerCapture(e.pointerId); }catch(err){}
    li.addEventListener("pointermove", moveDrag); li.addEventListener("pointerup", endDrag); li.addEventListener("pointercancel", endDrag);
    if(onGrip) e.preventDefault();
  }
  function begin(){
    var li = drag.li;
    drag.ghost = li.cloneNode(true); drag.ghost.classList.add("ghost"); drag.ghost.style.width = drag.w + "px";
    document.body.appendChild(drag.ghost);
    drag.ph = document.createElement("li"); drag.ph.className = "ph"; drag.ph.style.height = drag.h + "px";
    li.parentNode.insertBefore(drag.ph, li); li.classList.add("lift"); li.style.display = "none";
    drag.on = true;
  }
  function moveDrag(e){
    if(!drag) return;
    if(!drag.on){ if(Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) < 6) return; begin(); }
    drag.ghost.style.left = (e.clientX - drag.ox) + "px"; drag.ghost.style.top = (e.clientY - drag.oy) + "px";
    var el = document.elementFromPoint(e.clientX, e.clientY), col = el && el.closest ? el.closest(".col") : null;
    document.querySelectorAll(".list.hot").forEach(function(l){ l.classList.remove("hot"); });
    if(col){
      var list = col.querySelector(".list"); list.classList.add("hot");
      var cards = Array.prototype.filter.call(list.children, function(c){ return c.classList.contains("card") && c !== drag.li; });
      var before = null;
      for(var i=0;i<cards.length;i++){ var r = cards[i].getBoundingClientRect(); if(e.clientY < r.top + r.height/2){ before = cards[i]; break; } }
      if(before) list.insertBefore(drag.ph, before); else list.appendChild(drag.ph);
    }
    /* auto-scroll near viewport edges (mobile: columns are stacked) */
    if(e.clientY > window.innerHeight - 60) window.scrollBy(0, 12); else if(e.clientY < 60) window.scrollBy(0, -12);
  }
  function endDrag(){
    if(!drag) return;
    var li = drag.li;
    li.removeEventListener("pointermove", moveDrag); li.removeEventListener("pointerup", endDrag); li.removeEventListener("pointercancel", endDrag);
    if(drag.on){
      drag.ph.parentNode.insertBefore(li, drag.ph); drag.ph.remove(); drag.ghost.remove();
      li.classList.remove("lift"); li.style.display = "";
      document.querySelectorAll(".list.hot").forEach(function(l){ l.classList.remove("hot"); });
      slam(li); sync(true);
    }
    drag = null;
  }

  render();
})();
</script>
</body>
</html>
