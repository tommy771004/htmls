<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DC-07 黑五尖峰中控 · 倉庫營運俯瞰儀表板</title>
<meta name="description" content="Black Friday 尖峰的倉庫營運俯瞰儀表板：等角倉庫平面上 320 台揀貨機器人、93 名員工、堆高機、堆垛吊車與進出碼頭的卡車由模擬器即時驅動，右側是每小時出貨量、在途訂單、機隊使用率、各區人數、QA 與儲位使用率，底部碼頭與告警清單。">
<meta name="theme-color" content="#0d0e10">
<style>
:root{
  --bg:#0d0e10; --s1:#121316; --s2:#191b1f; --s3:#22252a; --hair:#23262b; --hair2:#30343a;
  --ink:#ecebe6; --ink2:#a7abb2; --mute:#767b83; --dim:#4f545b;
  --yel:#f2c230; --org:#f59f2a; --red:#ff4d40; --grn:#4cc38a; --teal:#3fb6a8; --blu:#5b9cf0; --idle:#6f747c;
  --num:"DIN Alternate","Bahnschrift","D-DIN","Roboto Condensed","Arial Narrow","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --zh:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
  --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --eo:cubic-bezier(.22,1,.36,1);
  --dur-enter:.32s;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--zh);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yel);outline-offset:-2px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 548px;grid-template-rows:52px minmax(0,1fr);height:100vh;height:100dvh}

/* ── 頂列 ── */
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--hair);min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.mark{width:28px;height:28px;flex:none;border-radius:5px;background:var(--yel);color:#111;font:700 13px/28px var(--num);text-align:center}
.brand b{font-size:14px;font-weight:600}
.brand span{font-size:12px;color:var(--mute)}
.bf{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);white-space:nowrap}
.bf b{background:var(--yel);color:#111;font:700 11px/1 var(--num);letter-spacing:.14em;padding:5px 8px 4px;border-radius:3px}
.grow{flex:1}
.clock{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
#dt{font-size:12px;color:var(--mute)}
#tm{font:600 20px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.speed{display:flex;gap:2px;background:var(--s2);border-radius:7px;padding:3px;flex:none}
.speed button{border:0;background:none;color:var(--ink2);font:600 12px/1 var(--num);padding:6px 9px;border-radius:5px;cursor:pointer;min-width:32px}
.speed button:hover{color:var(--ink)}
.speed button[aria-pressed="true"]{background:var(--ink);color:#111}

/* ── 左欄：地圖＋碼頭 ── */
.left{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--hair)}
.map{position:relative;flex:1;min-height:0;background:#0f1012;overflow:hidden}
.map canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.map canvas.drag{cursor:grabbing}
.map-h{position:absolute;left:16px;top:12px;pointer-events:none}
.map-h b{display:block;font-size:13px;font-weight:600}
.map-h div{font:500 11.5px var(--num);color:var(--mute);margin-top:1px}
.tools{position:absolute;right:12px;top:12px;display:flex;gap:6px}
.seg{display:flex;gap:2px;background:rgba(25,27,31,.92);border-radius:7px;padding:3px}
.seg button{border:0;background:none;color:var(--ink2);font-size:12px;padding:5px 9px;border-radius:5px;cursor:pointer;min-width:30px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#111}
.legend{position:absolute;left:16px;bottom:12px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--ink2);pointer-events:none;max-width:calc(100% - 32px);text-shadow:0 1px 2px #000}
.legend span{white-space:nowrap;display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px;flex:none}
.legend i.o{border-radius:50%;background:#f4efe4}
.tip{position:absolute;z-index:3;pointer-events:none;background:rgba(10,11,12,.96);border:1px solid var(--hair2);padding:7px 10px;font-size:12px;border-radius:6px;max-width:250px;display:none;line-height:1.5;color:var(--ink2)}
.tip b{display:block;color:var(--ink);font-weight:600}

.docks{flex:none;height:184px;border-top:1px solid var(--hair);padding:11px 16px 13px;display:flex;flex-direction:column;gap:8px;background:var(--s1);min-width:0}
h2{margin:0;font-size:12.5px;font-weight:600;display:flex;align-items:baseline;gap:10px;min-width:0;white-space:nowrap}
h2 .meta{margin-left:auto;font:500 11.5px var(--num);color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.keys{display:flex;gap:12px;font-size:11px;color:var(--mute);font-weight:400}
.keys span{display:flex;align-items:center;gap:5px}
.keys i{width:8px;height:8px;border-radius:2px}
.dwrap{flex:1;display:flex;gap:16px;min-height:0;min-width:0}
.dgrp{display:flex;flex-direction:column;gap:5px;min-width:0}
.dgrp>span{font-size:11px;color:var(--mute)}
.drow{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;min-height:0}
.dock{background:var(--s2);border-radius:6px;padding:6px 7px 6px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer;transition:background .2s}
.dock:hover{background:var(--s3)}
.dock .dh{display:flex;align-items:center;justify-content:space-between;font:700 12px/1.2 var(--num);letter-spacing:.03em}
.dock .dh i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.gauge{flex:1;min-height:20px;margin:3px 0 2px;background:var(--s3);border-radius:3px;position:relative;overflow:hidden}
.gauge i{position:absolute;left:0;right:0;bottom:0;background:var(--yel);transition:height .5s var(--eo)}
.dock .dv{font:600 12.5px/1.2 var(--num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .dt{font:500 10.5px/1.3 var(--mono);color:var(--ink2);white-space:nowrap}
.dock .dc{font:500 10.5px/1.3 var(--num);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock.s-work .dh i{background:var(--yel)}
.dock.k-in .gauge i,.dock.k-ret .gauge i{background:var(--blu)}
.dock.k-in.s-work .dh i,.dock.k-ret.s-work .dh i{background:var(--blu)}
.dock.s-in .dh i,.dock.s-out .dh i{background:var(--teal)}
.dock.s-in .gauge i,.dock.s-out .gauge i{background:repeating-linear-gradient(-45deg,rgba(63,182,168,.7) 0 4px,rgba(63,182,168,.35) 4px 8px)}
.dock.s-empty .dv,.dock.s-empty .dt{color:var(--mute)}
.dock.late .gauge i{background:var(--red)}
.dock.late .dh i{background:var(--red)}
.dock.late .dt{color:var(--red)}

/* ── 右欄：指標＋告警 ── */
.right{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto auto auto minmax(158px,1fr);min-height:0;min-width:0;background:var(--s1);overflow:auto;scrollbar-width:thin;scrollbar-color:#30343a transparent}
.sec{padding:10px 16px 11px;border-bottom:1px solid var(--hair);min-width:0}
.sec.full{grid-column:1/-1}
.sec.l{border-right:1px solid var(--hair)}
.sec h2{margin-bottom:8px}

.ship{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px}
.lbl{font-size:11.5px;color:var(--mute)}
.big{font:600 38px/1.05 var(--num);letter-spacing:-.01em;margin:3px 0 6px;white-space:nowrap}
.delta{display:inline-block;font:600 11.5px/1 var(--num);padding:4px 6px;border-radius:4px;background:var(--s3);color:var(--ink2)}
.delta.up{color:var(--grn);background:rgba(76,195,138,.12)}
.delta.wn{color:var(--org);background:rgba(245,159,42,.12)}
.delta.dn{color:var(--red);background:rgba(255,77,64,.12)}
.mini{margin:12px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini dt{font-size:11px;color:var(--mute);white-space:nowrap}
.mini dd{margin:1px 0 0;font:600 15px/1.2 var(--num)}
.mini small{display:block;font:500 10.5px var(--num);color:var(--dim);white-space:nowrap}
.cbox{position:relative;min-width:0}
.ch-h{display:flex;align-items:baseline;gap:12px;font-size:12.5px;font-weight:600}
.lk{margin-left:auto;display:flex;gap:12px;font-size:11px;color:var(--ink2);font-weight:400}
.lk span{display:flex;align-items:center;gap:6px}
.lk i{width:14px;height:0;border-top:2px solid var(--yel)}
.lk i.f{border-top:2px dashed #8f949b}
#chart{display:block;width:100%;height:118px;margin-top:6px;cursor:crosshair}
#chart .gl{stroke:#22252a;stroke-width:1}
#chart text{font:10px var(--num);fill:#6a6f77}
#chart .yl{text-anchor:end}
#chart .xl{text-anchor:middle}
#chart .fc{fill:none;stroke:#8f949b;stroke-width:1.5;stroke-dasharray:4 3}
#chart .ac{fill:none;stroke:var(--yel);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
#chart .aa{fill:rgba(242,194,48,.1)}
#chart .pj{fill:none;stroke:var(--yel);stroke-width:1.5;stroke-dasharray:2 3}
#chart .nw{stroke:#3a3e45;stroke-width:1}
#chart .hv{stroke:#6a6f77;stroke-width:1}
.ctip{position:absolute;pointer-events:none;display:none;background:rgba(10,11,12,.96);border:1px solid var(--hair2);border-radius:6px;padding:6px 9px;font:500 11.5px/1.5 var(--num);color:var(--ink2);white-space:nowrap;z-index:2}
.ctip b{color:var(--ink);font-weight:600}
.ctip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.stg{padding:0 10px;border-left:1px solid var(--hair);min-width:0}
.stg:first-child{padding-left:0;border-left:0}
.stg:last-child{padding-right:0}
.stg span{display:block;font-size:11px;color:var(--mute);white-space:nowrap}
.stg b{display:block;font:600 18px/1.2 var(--num);white-space:nowrap;margin-top:1px}
.stg em{display:block;font:500 10.5px/1.3 var(--num);font-style:normal;color:var(--mute);white-space:nowrap}
.meter{height:4px;border-radius:2px;background:var(--s3);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:2px;background:#9aa0a8;transition:width .5s var(--eo)}
.meter.hi i{background:var(--org)}
.meter.ov i{background:var(--red)}

.stack{display:flex;gap:2px;height:10px}
.stack i{height:100%;border-radius:2px;transition:width .5s var(--eo);min-width:2px}
.fleg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.fleg div{min-width:0}
.fleg span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mute);white-space:nowrap}
.fleg span i{width:8px;height:8px;border-radius:2px;flex:none}
.fleg b{display:block;font:600 16px/1.3 var(--num)}
.fleg small{font:500 10.5px var(--num);color:var(--dim);margin-left:3px}
.eq{display:flex;flex-direction:column;gap:5px}
.eq+.eq{margin-top:9px}
.eq-h{display:flex;align-items:center;gap:10px;min-width:0}
.eq-h>span{font-size:11px;color:var(--ink2);flex:none}
.cells{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px}
.cell{height:11px;border-radius:2px;background:var(--dim)}
.cell.fault{animation:blink 1s steps(2,end) infinite}
.eqsum{display:flex;gap:9px;font:500 10.5px var(--num);color:var(--mute);overflow:hidden;white-space:nowrap}
.eqsum span{display:flex;align-items:center;gap:4px;white-space:nowrap}
.eqsum i{width:6px;height:6px;border-radius:50%}

.heads{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px 16px}
.hd{position:relative;padding-bottom:5px;min-width:0}
.hd span{display:block;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd b{display:block;font:600 15px/1.15 var(--num)}
.hd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:1px;background:var(--s3)}
.hd i{position:absolute;left:0;bottom:0;height:2px;border-radius:1px;background:#8a9098;transition:width .5s var(--eo);z-index:1}
.hd.br i{background:var(--grn)}
.qa-n{font:600 28px/1.1 var(--num)}
.qa-n small{font-size:13px;color:var(--mute);margin-left:2px}
.qa-s{font:500 11px/1.4 var(--num);color:var(--mute);margin-top:2px}
#qaSpark{display:block;width:100%;height:32px;margin-top:6px}

.slots{display:grid;gap:5px}
.sl{display:grid;grid-template-columns:62px minmax(0,1fr) 34px;align-items:center;gap:8px}
.sl span{font-size:11px;color:var(--ink2);white-space:nowrap}
.sl b{font:600 12.5px var(--num);text-align:right}
.sl .meter{margin:0}
.aw{display:grid;grid-template-columns:62px minmax(0,1fr) 34px;align-items:end;gap:8px}
.aisles{display:flex;align-items:flex-end;gap:3px;height:16px}
.aisles i{flex:1;border-radius:2px 2px 0 0;background:#5c6168;transition:height .5s var(--eo)}
.aisles i.hi{background:var(--org)}
.al-cap{font-size:11px;color:var(--ink2);white-space:nowrap}

.alerts{display:flex;flex-direction:column;min-height:0;border-bottom:0;padding-bottom:6px}
.acount{display:flex;gap:6px;font-weight:400}
.acount b{font:600 11px/1 var(--num);padding:3px 6px;border-radius:4px;background:var(--s3);color:var(--mute)}
.acount b.c{background:rgba(255,77,64,.14);color:var(--red)}
.acount b.w{background:rgba(245,159,42,.14);color:var(--org)}
.inj{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mute);font-weight:400}
.inj button{background:none;border:1px solid var(--hair2);border-radius:5px;color:var(--ink2);font-size:11px;padding:3px 7px;cursor:pointer}
.inj button:hover{color:var(--ink);border-color:var(--mute)}
.alist{list-style:none;margin:0 -16px;padding:0;overflow:auto;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:#30343a transparent}
.al{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 16px;border-top:1px solid var(--hair);cursor:pointer;animation:alin var(--dur-enter) var(--eo) both}
.al:hover{background:var(--s2)}
.al .ic{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font:700 11px/1 var(--num);background:var(--s3);color:var(--mute);margin-top:1px}
.al.crit .ic{background:rgba(255,77,64,.16);color:var(--red)}
.al.warn .ic{background:rgba(245,159,42,.16);color:var(--org)}
.al.info .ic{background:rgba(91,156,240,.14);color:var(--blu)}
.al.crit:not(.done){background:linear-gradient(90deg,rgba(255,77,64,.08),transparent 60%)}
.al.crit:not(.done) .ic{animation:blink 1.2s steps(2,end) infinite}
.al-t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al-w{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al-r{text-align:right;font:500 11px/1.5 var(--num);white-space:nowrap}
.al-r time{color:var(--ink2);font-family:var(--mono);font-size:10.5px}
.al-r em{display:block;font-style:normal;color:var(--red)}
.al.warn .al-r em{color:var(--org)}
.al.done .al-r em,.al.info .al-r em{color:var(--mute)}
.al.done .al-t{color:var(--ink2);font-weight:500}
@keyframes alin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.35}}

/* ── 響應式 ── */
@media (max-width:1360px){ .app{grid-template-columns:minmax(0,1fr) 480px} .ship{grid-template-columns:136px minmax(0,1fr)} .big{font-size:33px} }
@media (max-width:1180px){ .top .bf span,.top #dt{display:none} .keys{display:none} }
@media (max-width:980px){
  body{overflow:auto}
  .app{display:flex;flex-direction:column;height:auto;min-height:100vh}
  .top{flex-wrap:wrap;row-gap:8px;padding:10px 14px;height:auto}
  .top .grow{display:none}
  .clock{margin-left:auto}
  .left{border-right:0}
  .map{flex:none;height:min(86vw,620px);min-height:320px}
  .docks{height:auto}
  .dwrap{overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .dgrp{flex:none!important}
  .drow{grid-auto-columns:66px;height:128px;flex:none}
  .right{overflow:visible;grid-template-rows:none}
  .alerts{max-height:380px}
}
@media (max-width:620px){
  .top{gap:8px 12px;padding:10px 12px}
  .brand span{display:none}
  .speed{order:5;width:100%;justify-content:space-between}
  .speed button{flex:1}
  .right{grid-template-columns:1fr}
  .sec.l{border-right:0}
  .sec{padding:12px 14px 14px}
  .ship{grid-template-columns:1fr;gap:12px}
  .mini{grid-template-columns:1fr 1fr;gap:10px 16px}
  .flow{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:12px}
  .stg:nth-child(4){padding-left:0;border-left:0}
  .heads{grid-template-columns:repeat(3,minmax(0,1fr))}
  .legend{font-size:10.5px;gap:3px 10px;left:12px;bottom:10px}
  .map-h div{display:none}
  .alist{margin:0 -14px}
  .al{padding:8px 14px}
  .inj>span{display:none}
}
@media (prefers-reduced-motion:reduce){
  .al,.cell.fault,.al.crit:not(.done) .ic{animation:none}
  .gauge i,.meter i,.stack i,.hd i,.aisles i{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="mark" aria-hidden="true">07</div><b>DC-07 北區履約中心</b><span>倉庫營運中控</span></div>
    <div class="bf"><b id="bfName">BLACK FRIDAY</b><span id="bfSub">尖峰第 1 日</span></div>
    <div class="grow"></div>
    <div class="clock"><span id="dt">2026/11/27 週五</span><span id="tm">14:19:20</span></div>
    <div class="speed" role="group" aria-label="模擬速度">
      <button type="button" data-s="0" aria-pressed="false" title="暫停（空白鍵）" aria-label="暫停">❚❚</button>
      <button type="button" data-s="1" aria-pressed="false">1×</button>
      <button type="button" data-s="10" aria-pressed="false">10×</button>
      <button type="button" data-s="60" aria-pressed="true">60×</button>
      <button type="button" data-s="240" aria-pressed="false">240×</button>
    </div>
  </header>

  <div class="left">
    <section class="map" aria-label="倉庫平面俯瞰">
      <canvas id="map" role="img" aria-label="等角倉庫平面：高架儲區、機器人揀貨區、充電區、收貨與退貨、揀貨站、包裝、分揀、出貨碼頭與休息室，機器人、員工、堆高機、吊車與卡車即時移動"></canvas>
      <div class="map-h"><b>1F 作業區</b><div id="mapSub">—</div></div>
      <div class="tools">
        <div class="seg" role="group" aria-label="視角"><button type="button" id="vIso" aria-pressed="true">等角</button><button type="button" id="vTop" aria-pressed="false">俯視</button></div>
        <div class="seg" role="group" aria-label="縮放"><button type="button" id="zIn" aria-label="放大">＋</button><button type="button" id="zOut" aria-label="縮小">－</button><button type="button" id="zFit" aria-label="重設視野">⤢</button></div>
      </div>
      <div class="legend">

  {id:'RT',n:'退貨',e:'RETURNS',x:100,y:51,w:18,h:28.6,c:'#2a2527',lx:101.4,ly:55}
];
var ZBY={};ZONES.forEach(function(z){ZBY[z.id]=z;});
function zoneAt(x,y){for(var i=0;i<ZONES.length;i++){var z=ZONES[i];if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h)return z;}return null;}

/* 機器人網格 */
var GX0=47,GY0=3,CELL=1,GC=71,GR=36,RBC=51;

var PADS=[];for(var pj=1;pj<=10;pj+=3)for(var pi=55;pi<=68;pi++)PADS.push({i:pi,j:pj,own:-1,off:false});
var isPad=new Int16Array(GC*GR).fill(-1);PADS.forEach(function(p,k){isPad[gi(p.i,p.j)]=k;});

/* 揀貨站 */
var STATIONS=[];[3,7,11,15,19,23,27,31,35,39,43,47].forEach(function(i,k){STATIONS.push({k:k,i:i,x:gx(i),q:0,open:true,n:0,code:'PS-'+p2(k+1)});});

/* 高架貨架 */
var RACK_H=5.2, LV=5, LH=RACK_H/LV;
var ROWY=[],AISLE=[];for(var rk=0;rk<8;rk++)ROWY.push(4+rk*4.6);for(var ak=0;ak<7;ak++)AISLE.push(7.3+ak*4.6);
var BAYS=[];
for(var r=0;r<8;r++)for(var b=0;b<9;b++){var o=new Uint8Array(20);for(var s=0;s<20;s++)o[s]=rnd()<.87?1:0;BAYS.push({r:r,b:b,x0:6+b*4,x1:10+b*4,y0:ROWY[r],y1:ROWY[r]+2,occ:o,tone:RI(0,3)});}
var rackCount=0;BAYS.forEach(function(B){for(var s=0;s<20;s++)rackCount+=B.occ[s];});
function bayAt(r,b){return BAYS[r*9+b];}

/* 分揀環線（跑道形） */
var LOOP_L=2*22+2*Math.PI*3;
function loopPos(s){s=((s%LOOP_L)+LOOP_L)%LOOP_L;
  if(s<22)return [12+s,55];s-=22;
  var arc=Math.PI*3;if(s<arc){var a=-Math.PI/2+s/3;return [34+3*Math.cos(a),58+3*Math.sin(a)];}s-=arc;
  if(s<22)return [34-s,61];s-=22;var a2=Math.PI/2+s/3;return [12+3*Math.cos(a2),58+3*Math.sin(a2)];}
var CHUTES=[];for(var ck=0;ck<7;ck++){CHUTES.push({x:13.5+ck*3,top:true,lv:R(.3,.7),w:R(.6,1.3)});CHUTES.push({x:13.5+ck*3,top:false,lv:R(.3,.7),w:R(.6,1.3)});}
var BENCHES=[];for(var bk=0;bk<9;bk++){BENCHES.push({x:50.5+bk*4.9,y:54.2,row:0});BENCHES.push({x:50.5+bk*4.9,y:61.8,row:1});}
var QA_BENCH={x:94.6,y:54.2};

/* ═════════ 路網（人與堆高機共用） ═════════ */
function entry(p){
  if(p[0]>99.5&&(p[1]>49||p[1]<19))return {l:'V',x:99.2,y:p[1]};
  if(p[1]<=47.6)return {l:'M',x:p[0],y:47.5};
  if(p[0]>98)return {l:'V',x:99.2,y:p[1]};
  return {l:'S',x:p[0],y:67};
}
function route(p,q){
  var a=entry(p),c=entry(q),out=[[a.x,a.y]];
  if(a.l!==c.l){
    if(a.l==='V'||c.l==='V'){var o=a.l==='V'?c:a;out.push([99.2,o.l==='M'?47.5:67]);}
    else{var cx=(Math.abs(a.x-45.5)+Math.abs(c.x-45.5)<=Math.abs(a.x-99.2)+Math.abs(c.x-99.2))?45.5:99.2;
      if(a.l==='M'){out.push([cx,47.5]);out.push([cx,67]);}else{out.push([cx,67]);out.push([cx,47.5]);}}
  }
  out.push([c.x,c.y]);out.push([q[0],q[1]]);return out;
}
function walkPath(o,spd,dv){var d=spd*dv;while(d>0&&o.pi<o.path.length){var t=o.path[o.pi],dx=t[0]-o.x,dy=t[1]-o.y,L=Math.hypot(dx,dy);if(L<1e-6){o.pi++;continue;}o.ang=Math.atan2(dy,dx);if(L<=d){o.x=t[0];o.y=t[1];o.pi++;d-=L;}else{o.x+=dx/L*d;o.y+=dy/L*d;d=0;}}return o.pi>=o.path.length;}
function setPath(o,path){o.path=path;o.pi=0;}

/* ═════════ 機器人 ═════════ */
var ST={IDLE:0,PARK:1,GO:2,LIFT:3,TO:4,AT:5,RET:6,DROP:7,TOCH:8,CHG:9};
var CAT=[2,1,1,0,0,0,0,0,1,3]; /* 0 搬運 1 行駛 2 待命 3 充電 */
var CATN=['搬運','行駛','待命','充電'], CATC=['#f2c230','#3fb6a8','#6f747c','#5b9cf0'];
var STN=['待命','前往停放','前往取架','頂升貨架','送往揀貨站','揀貨站呈現','歸還貨架','放下貨架','前往充電','充電中'];
var NR=320, ROB=[], RSPD=6.8, fleetCnt=[0,0,0,0], busyN=0, frozenN=0, batAvg=0, util=.85;
function randStorage(){for(var k=0;k<20;k++){var i=RI(0,RBC-1),j=RI(0,GR-8),c=gi(i,j);if(!closed[c]&&!inDL(i,j)&&occ[c]<0)return [i,j];}return [RI(0,RBC-1),RI(0,GR-8)];}
function randPark(){for(var k=0;k<20;k++){var i=RI(0,RBC-1),j=RI(0,14),c=gi(i,j);if(!closed[c]&&!inDL(i,j)&&occ[c]<0)return [i,j];}return [RI(0,RBC-1),RI(0,14)];}
function setT(r,t){r.ti=t[0];r.tj=t[1];r.xf=true;r.wait=0;}
(function initRobots(){
  var cells=[];for(var j=0;j<=GR-4;j++)for(var i=0;i<RBC;i++)cells.push([i,j]);
  for(var k=cells.length-1;k>0;k--){var m=Math.floor(rnd()*(k+1)),t=cells[k];cells[k]=cells[m];cells[m]=t;}
  var ci=0;
  for(var n=0;n<NR;n++){
    var r={id:n,code:'AMR-'+String(n+1).padStart(3,'0'),i:0,j:0,ni:-1,nj:-1,t:0,st:ST.IDLE,ti:0,tj:0,s:-1,wait:0,pat:R(.4,1),tm:0,bat:R(30,100),frz:false,xf:true,pad:-1};
    if(n<36){var p=PADS[n];r.i=p.i;r.j=p.j;r.st=ST.CHG;r.pad=n;p.own=n;r.bat=R(4,50);}
    else{var c=cells[ci++];r.i=c[0];r.j=c[1];}
    r.ti=r.i;r.tj=r.j;occ[gi(r.i,r.j)]=n;ROB.push(r);
  }
})();
function dirH(j){return j===GR-1?1:(j&1?-1:1);}
var CDIR=new Int8Array(GC);for(var ci_=0;ci_<GC;ci_++)CDIR[ci_]=ci_&1?-1:1;
STATIONS.forEach(function(st){CDIR[st.i]=1;CDIR[st.i+1]=-1;});
function isWall(i,j){return i<0||j<0||i>=GC||j>=GR||wall[gi(i,j)]===1;}
function freeCell(i,j,r){if(i<0||j<0||i>=GC||j>=GR)return false;var c=gi(i,j);if(wall[c]||occ[c]>=0)return false;if(closed[c]&&!closed[gi(r.i,r.j)])return false;if(DL&&inDL(i,j)&&!inDL(r.i,r.j))return false;return true;}
function tryMove(r,dx,dy){var ni=r.i+dx,nj=r.j+dy;if(!freeCell(ni,nj,r))return false;occ[gi(ni,nj)]=r.id;r.ni=ni;r.nj=nj;r.t=0;r.wait=0;return true;}
function chooseStation(r){var best=-1,bq=1e9;for(var s=0;s<STATIONS.length;s++){var S_=STATIONS[s];if(!S_.open)continue;var q=S_.q*1.6+(r?Math.abs(S_.i-r.i)/3:0)+rnd()*1.5;if(q<bq){bq=q;best=s;}}return best;}
function toStation(r){var s=chooseStation(r);if(s<0){r.tm=.5;return;}r.s=s;STATIONS[s].q++;r.st=ST.TO;setT(r,[STATIONS[s].i,GR-1]);}
function freePad(){var best=-1;for(var k=0;k<PADS.length;k++){if(PADS[k].own<0&&!PADS[k].off){best=k;if(rnd()<.35)break;}}return best;}
function goCharge(r){var k=freePad();if(k<0)return false;PADS[k].own=r.id;r.pad=k;r.st=ST.TOCH;setT(r,[PADS[k].i,PADS[k].j]);return true;}
function goPark(r){r.st=ST.PARK;setT(r,randPark());}
function afterDrop(r){
  if(r.bat<24&&goCharge(r))return;
  if(busyN>targetBusy+2){goPark(r);return;}
  r.st=ST.GO;setT(r,randStorage());
}
function arrive(r){
  switch(r.st){
    case ST.GO:r.st=ST.LIFT;r.tm=.35;break;
    case ST.TO:r.st=ST.AT;r.tm=R(.5,.8);STATIONS[r.s].n++;break;
    case ST.RET:r.st=ST.DROP;r.tm=.3;break;
    case ST.PARK:r.st=ST.IDLE;break;
    case ST.TOCH:r.st=ST.CHG;break;
  }
}
var targetBusy=200;
function stepRobot(r,dv){
  if(r.ni>=0){
    r.t+=dv*RSPD;r.bat-=dv*(CAT[r.st]===0?.5:.38);
    if(r.t<1)return;
    occ[gi(r.i,r.j)]=-1;r.i=r.ni;r.j=r.nj;r.ni=-1;r.t=0;
  }
  if(DL&&inDL(r.i,r.j)){r.frz=true;return;}
  r.frz=false;
  var st=r.st;
  if(st===ST.IDLE)return;
  if(st===ST.LIFT||st===ST.DROP||st===ST.AT){
    r.tm-=dv;if(r.tm>0)return;
    if(st===ST.LIFT)toStation(r);
    else if(st===ST.AT){STATIONS[r.s].q--;r.s=-1;r.st=ST.RET;setT(r,randStorage());}
    else afterDrop(r);
    return;
  }
  if(st===ST.CHG){
    var pd=PADS[r.pad];
    if(pd&&pd.off){pd.own=-1;r.pad=-1;goPark(r);return;}
    r.bat+=dv*2.2;if(r.bat>=96){r.bat=96;if(pd)pd.own=-1;r.pad=-1;goPark(r);}return;
  }
  if(st===ST.TO&&!STATIONS[r.s].open){STATIONS[r.s].q--;var s2=chooseStation(r);if(s2<0){r.s=-1;r.st=ST.RET;setT(r,randStorage());}else{r.s=s2;STATIONS[s2].q++;setT(r,[STATIONS[s2].i,GR-1]);}}
  if(r.i===r.ti&&r.j===r.tj){arrive(r);return;}
  /* 單行道：偶數列往右、奇數列往左；揀貨站那一欄往下、站右側一欄往上 */
  /* 前往揀貨站：先到站欄上方的排隊入口，再沿站欄直下 */
  var tj=r.tj;if(st===ST.TO&&r.i!==r.ti)tj=GR-6;
  var dx=r.ti-r.i,dy=tj-r.j,h=dirH(r.j),v=CDIR[r.i],sx=Math.sign(dx),sy=Math.sign(dy);
  var ax=0,ay=0,bx=0,by=0,gh=sx!==0&&sx===h,gv=sy!==0&&sy===v;
  if(Math.abs(dx)+Math.abs(dy)<=1){ax=sx;ay=sy;}
  else if(gh&&gv){if(Math.abs(dx)>=Math.abs(dy)){ax=h;by=v;}else{ay=v;bx=h;}}
  else if(gh){ax=h;by=v;}
  else if(gv){ay=v;bx=h;}
  else if(dx===0)ax=h;
  else if(dy===0)ay=v;
  else{ay=v;bx=h;}
  if(tryMove(r,ax,ay))return;
  var hitWall=isWall(r.i+ax,r.j+ay);
  if(hitWall&&(bx||by)&&tryMove(r,bx,by))return;
  r.wait+=dv;
  var bc=occ[gi(clamp(r.i+ax,0,GC-1),clamp(r.j+ay,0,GR-1))];
  if(st===ST.TO&&bc>=0){var o=ROB[bc];if((o.st===ST.TO||o.st===ST.AT)&&o.s===r.s&&r.wait<4)return;}
  if(r.wait>r.pat){
    r.wait=0;r.pat=R(.35,1.1);
    var tc=gi(r.ti,r.tj);
    if((Math.abs(dx)+Math.abs(dy)===1&&(st===ST.GO||st===ST.RET||st===ST.PARK))||closed[tc]||(DL&&inDL(r.ti,r.tj))){
      if(st===ST.GO||st===ST.RET){setT(r,randStorage());return;}
      if(st===ST.PARK){setT(r,randPark());return;}
    }
    if((bx||by)&&tryMove(r,bx,by))return;
    if(tryMove(r,h,0)||tryMove(r,0,v))return;
    var d0=Math.floor(rnd()*4);
    for(var k=0;k<4;k++){var d=(d0+k)&3,ddx=d===0?1:d===1?-1:0,ddy=d===2?1:d===3?-1:0;if(tryMove(r,ddx,ddy))return;}
  }
}
function robotXY(r){if(r.ni<0)return [gx(r.i),gy(r.j)];return [lerp(gx(r.i),gx(r.ni),r.t),lerp(gy(r.j),gy(r.nj),r.t)];}

function newPlan(f){
  if(f.mnt){f.st='mnt';f.plan=[];return;}
  if(f.bat<25){f.plan=[{to:flSpot(f),act:'charge'}];return;}
  var u=rnd();
  if(u<.38)f.plan=[{to:[R(103,116),R(30,42.5)],act:'load'},{to:ioPt(),act:'unload'}];
  else if(u<.68)f.plan=[{to:ioPt(),act:'load'},{to:[R(6,79),R(70.4,72)],act:'unload'}];
  else if(u<.86)f.plan=[{to:[R(103,116),R(56,77)],act:'load'},{to:ioPt(),act:'unload'}];

function stepFL(f,dv){
  if(f.st==='mnt')return;

    if(f.st==='chg'){f.bat+=dv*3;if(f.bat<92)return;f.st='idle';f.tm=R(.5,2);}
    f.tm-=dv;if(f.tm>0)return;

    var stp=f.plan[0];setPath(f,route([f.x,f.y],stp.to));f.st='move';return;
  }

    f.bat-=dv*.32;

}

var ICON={crit:'!',warn:'▲',info:'i'};

  if(dragStart){var dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;if(Math.abs(dx)+Math.abs(dy)>3){dragStart.moved=true;cv.classList.add('drag');V.ox=dragStart.ox+dx;V.oy=dragStart.oy+dy;V.user=true;staticDirty=true;PAN=null;hideTip();}return;}

var tip=$('#tip');
function hideTip(){tip.style.display='none';hoverObj=null;}
function hover(mx,my){
  var best=null,bd=10;

  ROB.forEach(function(r){var p=robotXY(r);test(P(p[0],p[1],.5),r,'r');});
  WK_.forEach(function(w){test(P(w.x,w.y,1.15),w,'w');});

    else if(best.kind==='f')html='<b>'+o.code+' 堆高機</b>'+flState(o)+(o.load?' · 載棧板':'')+'<br>電量 '+Math.round(o.bat)+'%';
    else if(best.kind==='c')html='<b>'+o.code+' 堆垛吊車</b>走道 '+(o.k+1)+' · '+CRN[o.st]+'<br>載具高度 第 '+(Math.floor(o.z/LH)+1)+' 層';
    else{var t=o.tr;html='<b>'+o.id+' · '+(t?t.code:'')+'</b>'+(t?t.car:'')+'<br>'+(o.kind==='out'?'裝載 '+(t?Math.round(t.load/t.cap*100):0)+'%':'剩 '+(t?Math.round(t.load):0)+(o.kind==='in'?' 板':' 箱'));}
  } else {var wp=unproject(mx,my),z=zoneAt(wp[0],wp[1]);
    if(z){var c=zoneCount();html='<b>'+z.n+' · '+z.e+'</b>在場 '+c[z.id]+' 人';
      if(z.id==='RB')html+='<br>機器人 '+(fleetCnt[0]+fleetCnt[1])+' 台作業 · 受阻 '+frozenN;
      if(z.id==='PS')html+='<br>開站 '+STATIONS.filter(function(s){return s.open;}).length+' / 12 · 產能 '+fmt(CAPS.pick)+' 件/時';
      if(z.id==='PK')html+='<br>產能 '+fmt(CAPS.pack)+' 件/時 · 在製 '+fmt(F.K);
      if(z.id==='SO')html+='<br>'+(ACT.jam?'<span style="color:#ff4a3d">卡件停線</span>':'分揀 '+fmt(rates.sort)+' 件/時')+' · 槽內 '+fmt(F.S);
      if(z.id==='HB')html+='<br>儲位 '+Math.round(rackCount/1440*100)+'% · 吊車故障 '+ACT.crane;
      if(z.id==='CH')html+='<br>充電中 '+fleetCnt[3]+' 台 · 離線樁 '+PADS.filter(function(p){return p.off;}).length;
      if(z.id==='OB')html+='<br>待裝車 '+fmt(F.D)+' 件 · 裝車 '+fmt(rates.load)+' 件/時';}}
