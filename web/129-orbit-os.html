<script>
(()=>{'use strict';

function updateDock(){$$('.dock-item').forEach(b=>b.classList.toggle('running',!!wins[b.dataset.app]))}
function raise(w){const top=Math.max(0,...Object.values(wins).map(x=>+x.style.zIndex||0));if(top&&+w.style.zIndex===top)return;if(z>=600){z=30;for(const x of Object.values(wins).sort((a,b)=>(+a.style.zIndex||0)-(+b.style.zIndex||0)))x.style.zIndex=++z}w.style.zIndex=++z}

function openApp(id){if(wins[id]){wins[id].hidden=false;focusWin(id);updateDock();if(id==='game')drawGame();return}const a=apps[id],w=document.createElement('section');w.className='win';w.dataset.app=id;w.setAttribute('role','dialog');w.setAttribute('aria-label',a.name);w.style.width=Math.min(a.w,innerWidth-24)+'px';w.style.height=Math.min(a.h,innerHeight-115)+'px';w.style.left=Math.max(8,Math.round((innerWidth-a.w)/2)+(launchCount%5)*25)+'px';w.style.top=Math.max(43,Math.round((innerHeight-a.h)/2)-25+(launchCount%5)*22)+'px';launchCount++;
const bar=document.createElement('div');bar.className='titlebar';bar.innerHTML=`<div class="traffic"><button class="close" aria-label="關閉"></button><button class="min" aria-label="最小化"></button><button class="maxi" aria-label="最大化"></button></div><span class="win-title">${a.name}</span><span class="win-icon">${icon(a.icon)}</span>`;
const body=document.createElement('div');body.className='win-body';const status=document.createElement('div');status.className='statusline';status.textContent='ORBIT OS  ·  離線可用';w.append(bar,body,status);$('#windowLayer').append(w);wins[id]=w;focusWin(id);updateDock();w.addEventListener('pointerdown',()=>focusWin(id));bar.querySelector('.close').onclick=()=>{if(id==='music')stopMusic();w.remove();delete wins[id];if(active===id){active=null;$('#activeMenu').textContent='ORBIT OS'}updateDock()};bar.querySelector('.min').onclick=()=>{w.hidden=true;updateDock()};bar.querySelector('.maxi').onclick=()=>{w.classList.toggle('max');if(id==='game')setTimeout(drawGame,50)};bar.ondblclick=e=>{if(!e.target.closest('button')){w.classList.toggle('max');if(id==='game')setTimeout(drawGame,50)}};
bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||w.classList.contains('max')||innerWidth<650)return;const startX=e.clientX,startY=e.clientY,rect=w.getBoundingClientRect();bar.setPointerCapture(e.pointerId);const move=ev=>{w.style.left=Math.max(0,Math.min(innerWidth-80,rect.left+ev.clientX-startX))+'px';w.style.top=Math.max(35,Math.min(innerHeight-85,rect.top+ev.clientY-startY))+'px'};bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',()=>bar.removeEventListener('pointermove',move),{once:true})});
if(id==='finder')renderFinder();if(id==='terminal')renderTerminal();if(id==='browser')renderBrowser();if(id==='settings')renderSettings();if(id==='music')renderMusic();if(id==='game')renderGame();return w}
function status(id,text){if(wins[id])wins[id].querySelector('.statusline').textContent=text}
$('#noticeBtn').onclick=$('#clock').onclick=()=>{$('#notice').hidden=!$('#notice').hidden;$('#menuPop').hidden=true};$('#audioIndicator').onclick=()=>openApp('music');

$('#systemMenu').onclick=e=>showMenu([['關於 Orbit OS',()=>notify('Orbit OS 1.0','一個 HTML 檔，沒有外部圖片、音訊或程式庫。')],['系統設定',()=>openApp('settings')],['重新啟動畫面',()=>{boot.style.display='grid';boot.classList.remove('done');setTimeout(()=>boot.classList.add('done'),1600)}]],e.target.getBoundingClientRect().left);

$('#viewMenu').onclick=e=>showMenu([['顯示桌面',()=>{Object.values(wins).forEach(w=>w.hidden=true);updateDock()}],['全部顯示',()=>{Object.values(wins).forEach(w=>w.hidden=false);updateDock()}]],e.target.getBoundingClientRect().left);
$('#helpMenu').onclick=e=>showMenu([['鍵盤與操作指南',()=>openApp('browser')],['終端機 help',()=>{openApp('terminal');runTerm('help')}]],e.target.getBoundingClientRect().left);
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.menu-pop,.menubar'))$('#menuPop').hidden=true;if(!e.target.closest('.notice,.menu-right'))$('#notice').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#menuPop').hidden=true;$('#notice').hidden=true}if((e.metaKey||e.ctrlKey)&&e.key===' '){e.preventDefault();openApp('terminal')}});
// Finder and Terminal share the same small, persistent filesystem.
const starter={type:'dir',children:{Desktop:{type:'dir',children:{'Welcome.txt':{type:'file',content:'Welcome to Orbit OS!\n\nEverything here lives in one HTML file.\nOpen Finder, type help in Terminal, make music, and build in Block Valley.'}}},Documents:{type:'dir',children:{'Field Notes.txt':{type:'file',content:'A little universe is still a universe.\n\nTry making a folder or editing this note.'},'Ideas.txt':{type:'file',content:'1. Build a tiny house in Block Valley\n2. Listen to Orbit Music\n3. Explore the offline browser'}}},Projects:{type:'dir',children:{'Block Valley.txt':{type:'file',content:'Move: WASD or arrows\nClick a block: mine\nRight-click or Shift-click: place selected block\nCollect all six glowing crystals.'}}}}};
let fs;try{fs=JSON.parse(pref('fs',''))||structuredClone(starter);if(!fs||fs.type!=='dir'||!fs.children)throw Error()}catch{fs=structuredClone(starter)}
let finderPath=['Desktop'],selectedFile=null,termCwd=['Desktop'],termHistory=[],termHistoryPos=0;
function saveFs(){savePref('fs',JSON.stringify(fs))}
function nodeAt(parts){let n=fs;for(const p of parts){if(!n||n.type!=='dir')return null;n=n.children[p]}return n||null}
function pathString(parts){return '/'+parts.join('/')}
function cleanPath(input,cwd){let parts=input.startsWith('/')?[]:cwd.slice();for(let x of input.split('/')){if(!x||x==='.')continue;if(x==='..')parts.pop();else parts.push(x)}return parts}
function validName(s){return !!s&&s.length<=40&&!/[\\/]/.test(s)&&s!=='.'&&s!=='..'}
function uniqueName(base,dir){if(!dir.children[base])return base;let ext=base.match(/(\.[^.]+)$/)?.[1]||'',stem=base.slice(0,base.length-ext.length),i=2;while(dir.children[`${stem} ${i}${ext}`])i++;return `${stem} ${i}${ext}`}
function renderFinder(){const w=wins.finder;if(!w)return;if(finderPath[0]==='.Trash')ensureTrash();let body=w.querySelector('.win-body'),dir=nodeAt(finderPath);if(!dir||dir.type!=='dir'){finderPath=['Desktop'];dir=nodeAt(finderPath)}body.innerHTML=`<div class="finder"><aside class="finder-side"><p class="section-label">FAVORITES</p><div id="findSide"></div></aside><div class="finder-main"><div class="appbar"><button class="toolbtn" id="findBack" aria-label="上一層">←</button><span class="finder-path" id="findPath"></span><button class="toolbtn" id="findHome" aria-label="回到桌面">⌂</button></div><div class="finder-grid" id="findGrid"></div><div class="finder-actions"><button class="pillbtn" data-fact="folder">＋ 資料夾</button><button class="pillbtn" data-fact="file">＋ 筆記</button><button class="pillbtn" data-fact="rename">重新命名</button><button class="pillbtn" data-fact="delete">移到垃圾桶</button></div></div></div>`;let side=body.querySelector('#findSide');for(const name of ['Desktop','Documents','Projects']){let b=document.createElement('button');b.className='side-link'+(finderPath[0]===name?' active':'');b.innerHTML=icon('folder')+`<span>${name}</span>`;b.onclick=()=>{finderPath=[name];selectedFile=null;renderFinder()};side.append(b)}let trash=document.createElement('button');trash.className='side-link';trash.innerHTML=icon('trash')+'<span>垃圾桶</span>';trash.onclick=()=>{finderPath=['.Trash'];selectedFile=null;renderFinder()};side.append(trash);body.querySelector('#findPath').textContent=pathString(finderPath);body.querySelector('#findBack').onclick=()=>{if(finderPath.length)finderPath.pop();selectedFile=null;renderFinder()};body.querySelector('#findHome').onclick=()=>{finderPath=['Desktop'];selectedFile=null;renderFinder()};body.querySelectorAll('[data-fact]').forEach(b=>b.onclick=()=>fileAction(b.dataset.fact));let grid=body.querySelector('#findGrid'),entries=Object.entries(dir.children||{}).sort((a,b)=>Number(b[1].type==='dir')-Number(a[1].type==='dir')||a[0].localeCompare(b[0]));if(!entries.length){let e=document.createElement('div');e.className='empty';e.textContent='這個資料夾是空的。';grid.append(e)}for(const [name,node] of entries){let b=document.createElement('button');b.className='file'+(selectedFile===name?' selected':'');b.innerHTML=icon(node.type==='dir'?'folder':'note');let label=document.createElement('span');label.textContent=name;b.append(label);b.onclick=()=>{selectedFile=name;grid.querySelectorAll('.file').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');status('finder',node.type==='dir'?'資料夾 · '+name:'文字檔 · '+name)};b.ondblclick=()=>{if(node.type==='dir'){finderPath.push(name);selectedFile=null;renderFinder()}else openEditor(finderPath.concat(name))};grid.append(b)}status('finder',`${entries.length} 個項目  ·  ${pathString(finderPath)}`)}
function ensureTrash(){if(!fs.children['.Trash'])fs.children['.Trash']={type:'dir',children:{}}}
function newItem(type){let dir=nodeAt(finderPath);if(!dir||dir.type!=='dir')return;let name=prompt(type==='dir'?'新資料夾名稱':'新筆記名稱',type==='dir'?'未命名資料夾':'新筆記.txt');if(name===null)return;name=name.trim();if(!validName(name)){toast('名稱不能為空或包含 /');return}name=uniqueName(name,dir);dir.children[name]=type==='dir'?{type:'dir',children:{}}:{type:'file',content:''};saveFs();selectedFile=name;renderFinder();notify(type==='dir'?'已建立資料夾':'已建立筆記',name)}
function fileAction(action){let dir=nodeAt(finderPath);if(action==='folder'||action==='file'){newItem(action==='folder'?'dir':'file');return}if(!selectedFile||!dir?.children[selectedFile]){toast('先選取一個檔案');return}if(action==='rename'){let next=prompt('重新命名',selectedFile);if(next===null)return;next=next.trim();if(!validName(next)){toast('名稱不能為空或包含 /');return}if(next!==selectedFile&&dir.children[next]){toast('同名項目已存在');return}dir.children[next]=dir.children[selectedFile];if(next!==selectedFile)delete dir.children[selectedFile];selectedFile=next;saveFs();renderFinder()}if(action==='delete'){ensureTrash();let old=selectedFile;let trash=fs.children['.Trash'];if(finderPath[0]==='.Trash'){delete dir.children[old]}else{trash.children[uniqueName(old,trash)]=dir.children[old];delete dir.children[old]}selectedFile=null;saveFs();renderFinder();toast(finderPath[0]==='.Trash'?'已刪除':'已移到垃圾桶')}}

try{let state=JSON.parse(pref('game',''));if(state.world?.length===SIZE&&state.world.every(r=>r.length===SIZE)){world=state.world;player=state.player||player;inventory=state.inventory||inventory;collected=state.collected||0}else throw Error()}catch{world=initialWorld()}
function saveGame(){savePref('game',JSON.stringify({world,player,inventory,collected}))}
function renderGame(){let body=wins.game.querySelector('.win-body');body.innerHTML='<div class="game"><div class="game-top"><strong>BLOCK VALLEY</strong><span>✦ 晶體 <b id="crystals">0 / 6</b></span><span>位置 <b id="coords">8, 8</b></span><button class="pillbtn" id="gameMode">模式：挖掘</button><button class="pillbtn" id="gameReset">重建世界</button></div><div class="game-canvas-wrap"><canvas id="voxelCanvas" aria-label="可玩的體素世界"></canvas></div><div class="game-bottom"><div id="blockPalette" style="display:flex;gap:5px;flex-wrap:wrap"></div><div class="mobile-move"><button data-move="0,-1" aria-label="向上">↑</button><button data-move="-1,0" aria-label="向左">←</button><button data-move="0,1" aria-label="向下">↓</button><button data-move="1,0" aria-label="向右">→</button></div><span class="hint">WASD / 方向鍵移動 · 左鍵挖掘 · 右鍵或 Shift 點擊放置</span></div></div>';let canvas=body.querySelector('#voxelCanvas');gameCtx=canvas.getContext('2d');for(const [id,name] of Object.entries(blockNames)){let b=document.createElement('button');b.className='block-btn';b.dataset.block=id;b.innerHTML=`<i class="block-chip" style="background:${blockColors[id][0]}"></i><span>${name}</span><span class="amount"></span>`;b.onclick=()=>{block=id;updateGameUI()};body.querySelector('#blockPalette').append(b)}body.querySelector('#gameMode').onclick=()=>{gameMode=gameMode==='mine'?'place':'mine';updateGameUI()};body.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{focusWin('game');movePlayer(...b.dataset.move.split(',').map(Number))});body.querySelector('#gameReset').onclick=()=>{if(!confirm('重新生成世界並清除目前的建造進度？'))return;world=initialWorld();player={x:8,y:8};inventory={grass:8,stone:8,sand:8,wood:8};collected=0;saveGame();updateGameUI();drawGame();notify('新世界已建立','六顆晶體散落在方塊山谷中。')};canvas.addEventListener('pointermove',e=>{let r=canvas.getBoundingClientRect(),p={x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};let hit=pickTile(p.x,p.y);if(hit?.x!==hover?.x||hit?.y!==hover?.y){hover=hit;drawGame()}});canvas.addEventListener('pointerleave',()=>{hover=null;drawGame()});canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('pointerdown',e=>{if(e.button!==0&&e.button!==2)return;focusWin('game');let r=canvas.getBoundingClientRect(),hit=pickTile((e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height);if(!hit)return;editTile(hit,(e.button===2||e.shiftKey||gameMode==='place')?'place':'mine')});new ResizeObserver(drawGame).observe(canvas);updateGameUI();requestAnimationFrame(drawGame)}
function updateGameUI(){if(!wins.game)return;let b=wins.game.querySelector('.win-body');b.querySelector('#crystals').textContent=collected+' / 6';b.querySelector('#coords').textContent=`${player.x}, ${player.y}`;b.querySelector('#gameMode').textContent='模式：'+(gameMode==='mine'?'挖掘':'放置');b.querySelectorAll('.block-btn').forEach(x=>{x.classList.toggle('active',x.dataset.block===block);x.querySelector('.amount').textContent=inventory[x.dataset.block]||0});status('game',collected===6?'已找到全部晶體！你可以繼續自由建造。':'探索山谷，尋找六顆發光晶體 · 世界自動保存')}
function iso(x,y,h){let {tw,ox,oy,step}=gameMetrics;return {x:ox+(x-y)*tw/2,y:oy+(x+y)*tw/4-h*step}}
function poly(ctx,pts,fill,stroke){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function drawGame(){if(!wins.game||wins.game.hidden||!gameCtx)return;let canvas=wins.game.querySelector('#voxelCanvas');if(!canvas||!canvas.clientWidth||!canvas.clientHeight)return;let dpr=Math.min(devicePixelRatio||1,2),w=Math.round(canvas.clientWidth*dpr),h=Math.round(canvas.clientHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}const ctx=gameCtx;ctx.clearRect(0,0,w,h);let tw=Math.min(w/19.6,h/10.8,48*dpr),step=tw*.34,ox=w/2,oy=Math.max(25*dpr,h*.10);gameMetrics={tw,step,ox,oy};let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#a5d0e3');sky.addColorStop(.65,'#d6dfc1');sky.addColorStop(1,'#86bfa2');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);ctx.fillStyle='#eef8e68c';ctx.beginPath();ctx.arc(w*.78,h*.19,Math.min(w,h)*.065,0,Math.PI*2);ctx.fill();ctx.fillStyle='#659f91';ctx.beginPath();ctx.moveTo(0,h*.66);ctx.lineTo(w*.15,h*.31);ctx.lineTo(w*.36,h*.64);ctx.lineTo(w*.59,h*.38);ctx.lineTo(w,h*.72);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();ctx.fillStyle='#81afa0';ctx.fillRect(0,h*.74,w,h*.26);
for(let sum=0;sum<=2*(SIZE-1);sum++){for(let y=0;y<SIZE;y++){let x=sum-y;if(x<0||x>=SIZE)continue;let tile=world[y][x],p=iso(x,y,tile.h),base=iso(x,y,0),half=tw/2,quarter=tw/4,c=blockColors[tile.type]||blockColors.grass,top=[[p.x,p.y],[p.x+half,p.y+quarter],[p.x,p.y+quarter*2],[p.x-half,p.y+quarter]];poly(ctx,[[p.x-half,p.y+quarter],[p.x,p.y+quarter*2],[base.x,base.y+quarter*2],[base.x-half,base.y+quarter]],c[1],'#405a5344');poly(ctx,[[p.x,p.y+quarter*2],[p.x+half,p.y+quarter],[base.x+half,base.y+quarter],[base.x,base.y+quarter*2]],c[2],'#405a5344');poly(ctx,top,c[0],'#ffffff45');if(tile.type==='grass'){ctx.fillStyle='#cce9a180';ctx.fillRect(p.x-tw*.13,p.y+quarter*.45,tw*.15,Math.max(1,dpr))}if(tile.crystal){ctx.save();ctx.shadowColor='#fff6ad';ctx.shadowBlur=18*dpr;poly(ctx,[[p.x,p.y-quarter*.8],[p.x+tw*.11,p.y],[p.x,p.y+quarter*.5],[p.x-tw*.11,p.y]],'#fdf4aa','#fff');ctx.restore()}if(hover&&hover.x===x&&hover.y===y){ctx.beginPath();ctx.moveTo(...top[0]);top.slice(1).forEach(pt=>ctx.lineTo(...pt));ctx.closePath();ctx.fillStyle='#ffffff4d';ctx.fill();ctx.strokeStyle='#ffffff';ctx.lineWidth=2*dpr;ctx.stroke()}if(player.x===x&&player.y===y){drawPlayer(ctx,p,tw,dpr)}}}
// Tiny orientation label on the rendered world.
ctx.fillStyle='#173752a8';ctx.fillRect(12*dpr,12*dpr,107*dpr,27*dpr);ctx.fillStyle='#f2fff7';ctx.font=`${11*dpr}px ui-monospace,monospace`;ctx.fillText('✦  BLOCK VALLEY',20*dpr,30*dpr)}
function drawPlayer(ctx,p,tw,dpr){let x=p.x,y=p.y-tw*.46,s=tw*.31;ctx.fillStyle='#193c56';ctx.beginPath();ctx.ellipse(x,p.y+tw*.38,s*.8,s*.32,0,0,Math.PI*2);ctx.fill();poly(ctx,[[x,y],[x+s,y+s*.42],[x,y+s*.82],[x-s,y+s*.42]],'#f3e2c4','#d5c39c');poly(ctx,[[x-s,y+s*.42],[x,y+s*.82],[x,y+s*1.65],[x-s,y+s*1.22]],'#428ca2','#2a6479');poly(ctx,[[x,y+s*.82],[x+s,y+s*.42],[x+s,y+s*1.22],[x,y+s*1.65]],'#23617b','#1c4e63');ctx.fillStyle='#20354b';ctx.fillRect(x-s*.48,y+s*.40,Math.max(2,dpr),Math.max(2,dpr));ctx.fillRect(x+s*.18,y+s*.40,Math.max(2,dpr),Math.max(2,dpr))}
function pickTile(px,py){let {tw}=gameMetrics;let result=null;for(let sum=0;sum<=2*(SIZE-1);sum++)for(let y=0;y<SIZE;y++){let x=sum-y;if(x<0||x>=SIZE)continue;let p=iso(x,y,world[y][x].h),cy=p.y+tw/4;if(Math.abs(px-p.x)/(tw/2)+Math.abs(py-cy)/(tw/4)<=1)result={x,y}}return result}
function editTile(pos,mode){let t=world[pos.y][pos.x];if(mode==='mine'){if(pos.x===player.x&&pos.y===player.y){toast('不能挖掉腳下的方塊');return}if(t.h<=1){toast('已經挖到地基');return}t.h--;inventory[t.type]=(inventory[t.type]||0)+1;toast('挖到 '+blockNames[t.type]);if(t.crystal){t.crystal=false;collected++;notify('找到晶體！',`${collected} / 6 顆已找到`)}if(t.h===1)t.type='grass'}else{if(pos.x===player.x&&pos.y===player.y){toast('不能在自己身上放方塊');return}if(t.h>=5){toast('方塊已堆到最高');return}if(!inventory[block]){toast('沒有更多 '+blockNames[block]+'，先挖一些');return}t.h++;t.type=block;inventory[block]--}saveGame();updateGameUI();drawGame()}
function movePlayer(dx,dy){let nx=player.x+dx,ny=player.y+dy;if(nx<0||ny<0||nx>=SIZE||ny>=SIZE)return;let here=world[player.y][player.x],there=world[ny][nx];if(there.h-here.h>1){toast('前面太高，先挖開或繞路');return}player={x:nx,y:ny};if(there.crystal){there.crystal=false;collected++;notify(collected===6?'六顆晶體都找到了！':'找到晶體！',collected===6?'山谷任你繼續建造。':`${collected} / 6 顆已找到`)}saveGame();updateGameUI();drawGame()}
document.addEventListener('keydown',e=>{if(active!=='game'||!wins.game||wins.game.hidden||e.target.closest('input,textarea'))return;let moves={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};if(moves[e.code]){e.preventDefault();movePlayer(...moves[e.code])}if(['Digit1','Digit2','Digit3','Digit4'].includes(e.code)){block=Object.keys(blockNames)[Number(e.code.slice(-1))-1];updateGameUI()}});
window.addEventListener('resize',()=>{if(wins.game)drawGame()});
})();
</script>
