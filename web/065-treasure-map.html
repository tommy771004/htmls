<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Isle of Mild Regret — a Treasure Map</title>
<meta name="description" content="依線索點地標，紅虛線路徑描出航程，最後挖開寶箱。收錄於 100 Creative HTML Works（065・藏寶圖）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/web/065-treasure-map.html">
<style>
:root{
  --parch:#ead8ad;
  --parch-2:#d9bf86;
  --ink:#4e3218;
  --ink-2:#7a5430;
  --red:#b0261c;
  --papyrus: Papyrus, Herculanum, "Palatino Linotype", Palatino, "Book Antiqua", serif;
  --pal: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;color:var(--ink);font-family:var(--pal);
  background-color:#2a1b10;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='300'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='.004 .14' numOctaves='3' seed='3'/><feColorMatrix values='0 0 0 0 .22  0 0 0 0 .13  0 0 0 0 .07  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23w)'/></svg>"),
    radial-gradient(90% 70% at 50% 40%, #4a311d, #22160c);
  background-blend-mode:overlay,normal;
}
.wrap{max-width:1280px;margin:0 auto;padding:clamp(16px,3vw,36px) clamp(16px,3vw,36px) 50px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;color:#e9d6a8;margin-bottom:16px}
header h1{margin:0;font-family:var(--papyrus);font-weight:normal;font-size:clamp(28px,4.4vw,52px);line-height:1;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.4)}
header p{margin:0;font-style:italic;font-size:15px;color:#cdb68a;max-width:36em;line-height:1.5}
header p b{font-style:normal;font-family:var(--papyrus);color:#f0dcae;font-weight:normal}

.table{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:0;align-items:start}
.mapcard{position:relative;transform:rotate(-.5deg);filter:drop-shadow(0 18px 24px rgba(0,0,0,.55)) drop-shadow(0 2px 2px rgba(0,0,0,.4))}
svg#map{display:block;width:100%;height:auto;touch-action:manipulation}

/* svg styling */
.lbl{font-family:var(--papyrus);fill:var(--ink);font-size:22px;letter-spacing:.02em;pointer-events:none;paint-order:stroke;stroke:#e8d4a4;stroke-width:5px;stroke-linejoin:round}
.lbl.small{font-size:15px;font-family:var(--pal);font-style:italic;fill:var(--ink-2)}
.loc{cursor:pointer}
.loc .hit{fill:transparent}
.loc .ico{transition:transform .25s;transform-box:fill-box;transform-origin:50% 100%}
.loc:hover .ico,.loc:focus .ico{transform:scale(1.15) rotate(-3deg)}
.loc:focus{outline:none}
.loc:focus-visible .hit{stroke:var(--red);stroke-width:2;stroke-dasharray:4 4}
.loc.seen .lbl{fill:#2e1c0c}
.loc .tick{opacity:0;transition:opacity .4s}
.loc.seen .tick{opacity:1}
.trail{fill:none;stroke:var(--red);stroke-width:3.2;stroke-dasharray:9 8;stroke-linecap:round}
.trail.wrong{stroke:var(--ink-2);opacity:.75}
.xmark{cursor:pointer}
.xmark path.x{stroke:var(--red);stroke-width:9;stroke-linecap:round;fill:none}
.xmark.ready path.x{animation:throb 1.6s ease-in-out infinite}
@keyframes throb{50%{stroke-width:12}}
.compass-needle{transform-origin:880px 125px;animation:wob 7s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.serpent{animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.chest{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
.chest.open{transform:scale(1)}
.chest .lid{transform-box:fill-box;transform-origin:50% 100%;transition:transform .6s .5s ease-out}
.chest.open .lid{transform:rotate(-24deg) translate(-4px,-6px)}
.glint{opacity:0}
.chest.open .glint{animation:glint 1.4s 1s ease-in-out infinite}
@keyframes glint{50%{opacity:1}}

/* log scrap */
.log{
  position:relative;margin:40px 0 0 -30px;z-index:2;transform:rotate(1.4deg);
  background:
    radial-gradient(120% 90% at 50% 40%, rgba(255,250,230,.35), transparent 70%),
    linear-gradient(180deg,#efdfb7,#e1c893);
  padding:26px 26px 22px;color:var(--ink);
  box-shadow:0 14px 26px rgba(0,0,0,.5), inset 0 0 40px rgba(120,70,20,.35);
  clip-path:polygon(2% 1%,20% 0,38% 2%,57% 0,78% 1.5%,99% 0,100% 22%,98.5% 47%,100% 71%,98% 99%,74% 100%,51% 98%,29% 100%,8% 98.5%,0 100%,1.5% 70%,0 44%,1.2% 20%);
}
.pin{position:absolute;top:-2px;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e05a4a,#8d160f 70%);box-shadow:0 3px 4px rgba(0,0,0,.5);z-index:3}
.log h2{margin:0 0 2px;font-family:var(--papyrus);font-weight:normal;font-size:28px;text-align:center}
.log .sub{text-align:center;font-style:italic;font-size:13px;color:var(--ink-2);border-bottom:1px solid rgba(78,50,24,.4);padding-bottom:10px;margin-bottom:10px}
.entries{list-style:none;margin:0;padding:0;max-height:48vh;overflow:auto;scrollbar-width:thin}
.entries li{font-style:italic;font-size:15.5px;line-height:1.5;padding:8px 0;border-bottom:1px dashed rgba(78,50,24,.3);animation:ink 1.2s ease-out}
.entries li b{font-style:normal;font-family:var(--papyrus);font-weight:normal;display:block;font-size:17px;color:#2e1c0c}
.entries li.good b::after{content:" ✓";color:var(--red)}
.entries li.bad{color:var(--ink-2)}
.entries li.win b{color:var(--red)}
@keyframes ink{from{opacity:0;filter:blur(2px)}to{opacity:1;filter:none}}
.stats{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;font-size:13px;flex-wrap:wrap}
.stats span{font-variant:small-caps;letter-spacing:.1em}
.stats b{font-family:var(--papyrus);font-weight:normal;font-size:18px}
.seal{
  width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;flex:none;
  background:radial-gradient(circle at 40% 35%,#d9483a,#9e1d14 60%,#6e0f09);
  box-shadow:0 3px 5px rgba(0,0,0,.45), inset 0 -3px 6px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.25);
  color:#f5cfb5;font-family:var(--papyrus);font-size:11px;line-height:1.1;letter-spacing:.04em;
  clip-path:polygon(50% 0,62% 4%,74% 2%,82% 12%,94% 16%,96% 30%,100% 42%,96% 56%,99% 70%,88% 80%,82% 94%,68% 96%,56% 100%,44% 96%,30% 99%,20% 88%,8% 84%,5% 70%,0 56%,4% 42%,1% 28%,12% 18%,18% 6%,32% 4%)
}
.seal:active{transform:scale(.95)}
.seal:focus-visible{outline:2px dashed #f0dcae;outline-offset:4px}

@media (max-width:640px){ .lbl{font-size:27px} .lbl.small{font-size:18px} }
@media (max-width:900px){
  .table{grid-template-columns:1fr}
  .log{margin:-10px 6px 0;transform:rotate(.8deg)}
  .mapcard{transform:none}
}
@media (prefers-reduced-motion:reduce){
  .compass-needle,.serpent,.xmark.ready path.x{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>The Isle of Mild Regret</h1>
    <p>Surveyed badly by <b>Capt. Edmund Winnow</b>, 1718. Follow the clues from the ship — tap a landmark to walk there. The trail is drawn in red ink; mistakes in brown.</p>
  </header>

  <div class="table">
    <div class="mapcard">
      <svg id="map" viewBox="0 0 1000 700" role="application" aria-label="Treasure map of the Isle of Mild Regret">
        <defs>
          <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
            <feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="3" seed="2" result="t"/>
            <feDisplacementMap in="SourceGraphic" in2="t" scale="18" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
          <filter id="stain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency=".008" numOctaves="4" seed="8"/>
            <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .28  0 0 0 0 .1  0 0 0 -1.6 1.05"/>
          </filter>
          <filter id="grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5"/>
            <feColorMatrix values="0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .45 -.05"/>
          </filter>
          <filter id="inkbleed"><feTurbulence type="fractalNoise" baseFrequency=".6" numOctaves="1" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter>
          <radialGradient id="burn" cx="50%" cy="50%" r="72%">
            <stop offset="55%" stop-color="#6b3d12" stop-opacity="0"/>
            <stop offset="86%" stop-color="#6b3d12" stop-opacity=".35"/>
            <stop offset="100%" stop-color="#3a1d06" stop-opacity=".9"/>
          </radialGradient>
          <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0v8" stroke="#6a4724" stroke-width="1" opacity=".45"/></pattern>
          <mask id="trailmask"><g id="maskpaths"></g></mask>
        </defs>

        <!-- parchment -->
        <g filter="url(#rough)">
          <rect x="14" y="14" width="972" height="672" fill="#ead8ad"/>
          <rect x="14" y="14" width="972" height="672" filter="url(#stain)" opacity=".55"/>
          <rect x="14" y="14" width="972" height="672" fill="url(#burn)"/>
        </g>
        <rect x="14" y="14" width="972" height="672" filter="url(#grain)" opacity=".7" pointer-events="none"/>

        <!-- rhumb lines -->
        <g id="rhumbs" stroke="#6a4724" stroke-width=".8" opacity=".28"></g>
        <!-- sea marks -->
        <g id="waves" fill="none" stroke="#6a4724" stroke-width="1.4" stroke-linecap="round" opacity=".55"></g>

        <!-- island -->
        <g id="island" filter="url(#inkbleed)"></g>
        <g id="decor" filter="url(#inkbleed)"></g>

        <!-- compass rose -->
        <g id="compass" transform="translate(880 125)">
          <circle r="62" fill="none" stroke="#4e3218" stroke-width="1.5"/>
          <circle r="56" fill="none" stroke="#4e3218" stroke-width=".8" stroke-dasharray="2 4"/>
          <g class="compass-needle" style="transform-origin:0 0">
            <path d="M0-72 9-9 0 0-9-9Z" fill="#4e3218"/><path d="M0-72 0 0-9-9Z" fill="#b0261c"/>
            <path d="M0 72 9 9 0 0-9 9Z" fill="#ead8ad" stroke="#4e3218"/>
            <path d="M72 0 9 9 0 0 9-9Z" fill="#ead8ad" stroke="#4e3218"/><path d="M-72 0-9 9 0 0-9-9Z" fill="#4e3218"/>
            <path d="M34-34 5 0 0-5Z M-34 34-5 0 0 5Z M34 34 0 5 5 0Z M-34-34 0-5-5 0Z" fill="#7a5430"/>
          </g>
          <circle r="4" fill="#ead8ad" stroke="#4e3218"/>
          <text y="-80" text-anchor="middle" class="lbl" style="font-size:20px">N</text>
        </g>

        <!-- cartouche -->
        <g transform="translate(40 36)">
          <path d="M0 18Q0 0 18 0H282Q300 0 300 18V72Q300 90 282 90H18Q0 90 0 72Z" fill="#efdfb7" stroke="#4e3218" stroke-width="2"/>
          <path d="M8 22Q8 8 22 8H278Q292 8 292 22V68Q292 82 278 82H22Q8 82 8 68Z" fill="none" stroke="#4e3218" stroke-width=".8"/>
          <text x="150" y="44" text-anchor="middle" class="lbl" style="font-size:24px">Insula Paenitentiae</text>
          <text x="150" y="67" text-anchor="middle" class="lbl small">— the Isle of Mild Regret —</text>
        </g>

        <!-- scale -->
        <g transform="translate(70 640)" font-family="Palatino Linotype, Palatino, serif" font-size="12" fill="#4e3218">
          <rect width="60" height="7" fill="#4e3218"/><rect x="60" width="60" height="7" fill="none" stroke="#4e3218"/><rect x="120" width="60" height="7" fill="#4e3218"/>
          <text y="-6">0</text><text x="56" y="-6">1</text><text x="116" y="-6">2</text><text x="176" y="-6">3</text>
          <text x="0" y="24" font-style="italic">Leagues (approximate, optimistic)</text>
        </g>

        <!-- ship -->
        <g id="ship" transform="translate(150 560)">
          <path d="M-40 10Q0 30 42 10L36 22Q0 36-34 22Z" fill="#7a5430" stroke="#4e3218" stroke-width="1.5"/>
          <path d="M-2 10V-50M18 10V-34" stroke="#4e3218" stroke-width="2"/>
          <path d="M-2-48Q-26-30-2-10ZM-2-46Q20-30-2-12Z" fill="#efdfb7" stroke="#4e3218" stroke-width="1.3"/>
          <path d="M18-32Q34-20 18-6Z" fill="#efdfb7" stroke="#4e3218" stroke-width="1.3"/>
          <path d="M-2-50l14 5-14 4Z" fill="#b0261c"/>
          <path d="M-60 30q10-6 20 0t20 0M26 32q10-6 20 0t20 0" stroke="#6a4724" fill="none" stroke-width="1.3"/>
          <text x="0" y="56" text-anchor="middle" class="lbl small">the Merry Mistake</text>
        </g>

        <!-- sea serpent -->
        <g transform="translate(830 600)"><g class="serpent" fill="none" stroke="#4e3218" stroke-width="2.2" stroke-linecap="round">
          <path d="M-70 10q15-40 30 0M-30 10q15-44 30 0M10 10q14-34 28 0" fill="#d9bf86"/>
          <path d="M38 10q10-40 30-30q12 6 4 16l-8-2" fill="#d9bf86"/>
          <circle cx="62" cy="-16" r="1.8" fill="#4e3218"/>
          <path d="M-90 16q10-6 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0" stroke-width="1.3"/>
          <text x="-6" y="46" text-anchor="middle" class="lbl small" stroke="none" fill="#7a5430">here be a Serpent (friendly)</text>
        </g></g>

        <!-- trail -->
        <g id="trail" mask="url(#trailmask)"></g>
        <circle id="nib" r="5" fill="#b0261c" opacity="0"/>

        <!-- locations -->
        <g id="locs"></g>

        <!-- X and chest -->
        <g id="xmark" class="xmark" tabindex="0" role="button" aria-label="The X — dig here">
          <circle cx="648" cy="532" r="36" fill="transparent"/>
          <path class="x" d="M628 512 668 552"/><path class="x" d="M668 510 630 554"/>
          <g id="chest" class="chest">
            <rect x="620" y="508" width="58" height="34" rx="4" fill="#7a4a1e" stroke="#3a220e" stroke-width="2"/>
            <path d="M620 520h58M620 532h58" stroke="#3a220e" stroke-width="1.2"/>
            <rect x="644" y="514" width="10" height="12" fill="#d6a938" stroke="#3a220e"/>
            <g class="lid"><path d="M620 508q29-24 58 0Z" fill="#8c5a26" stroke="#3a220e" stroke-width="2"/><path d="M632 500q17-10 34 0" stroke="#3a220e" fill="none"/></g>
            <g class="glint" fill="#f6d86b"><path d="M640 494l2-8 2 8 8 2-8 2-2 8-2-8-8-2Z"/><path d="M666 488l1.5-6 1.5 6 6 1.5-6 1.5-1.5 6-1.5-6-6-1.5Z"/></g>
          </g>
        </g>
      </svg>
    </div>

    <aside class="log" aria-label="Captain's log">
      <i class="pin" aria-hidden="true"></i>
      <h2>Captain’s Log</h2>
      <div class="sub">kept in the margin of the map, in a hurry</div>
      <ol class="entries" id="entries" aria-live="polite"></ol>
      <div class="stats">
        <div><span>Paces walked</span><br><b id="paces">0</b></div>
        <div><span>Clues found</span><br><b id="clues">0 / 5</b></div>
        <button class="seal" id="reset" type="button" aria-label="Burn the map and start over">start<br>over</button>
      </div>
    </aside>
  </div>
</div>

<script>
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function(id){ return document.getElementById(id); };
  var map = $('map'), island = $('island'), decor = $('decor'), locsG = $('locs'), trailG = $('trail'), maskG = $('maskpaths'),
      nib = $('nib'), entries = $('entries'), xmark = $('xmark'), chest = $('chest');
  if (!map || !island || !decor || !locsG || !trailG || !maskG || !entries || !xmark || !chest) return;
  function el(tag, a, p){ var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
  function rng(s){ return function(){ s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
  var R = rng(1718);

  /* ---------- rhumb lines ---------- */
  var rh = $('rhumbs');
  for (var i=0;i<16;i++){ var a = i/16 * Math.PI*2; el('line', {x1:880, y1:125, x2:880 + Math.cos(a)*1400, y2:125 + Math.sin(a)*1400}, rh); }

  /* ---------- coastline ---------- */
  function smooth(pts){
    var d = '', n = pts.length;
    for (var i=0;i<n;i++){
      var p0 = pts[(i-1+n)%n], p1 = pts[i], p2 = pts[(i+1)%n], p3 = pts[(i+2)%n];
      if (i === 0) d += 'M' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1);
      var c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6, c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
      d += 'C' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    return d + 'Z';
  }
  function blob(cx, cy, rx, ry, n, bays){
    var pts = [];
    var s1 = R()*6, s2 = R()*6, s3 = R()*6;
    for (var i=0;i<n;i++){
      var a = i/n * Math.PI*2;
      var r = 1 + .11*Math.sin(3*a + s1) + .08*Math.sin(5*a + s2) + .05*Math.sin(8*a + s1*2) + .03*Math.sin(13*a + s3) + (R()-.5)*.04;
      (bays || []).forEach(function(b){ var d = Math.atan2(Math.sin(a-b[0]), Math.cos(a-b[0])); r -= b[1] * Math.exp(-(d*d)/(2*b[2]*b[2])); });
      pts.push([cx + Math.cos(a)*rx*r, cy + Math.sin(a)*ry*r]);
    }
    return smooth(pts);
  }
  var coast = blob(505, 355, 330, 225, 64, [[Math.PI*0.86, .26, .16], [Math.PI*1.6, .08, .1]]);
  var islet = blob(250, 205, 46, 30, 18);
  var islet2 = blob(820, 520, 30, 20, 14);
  [coast, islet, islet2].forEach(function(d, idx){
    var rings = idx ? [[16,.18],[8,.28]] : [[46,.12],[34,.16],[22,.22],[11,.3]];
    rings.forEach(function(r){
      el('path', {d:d, fill:'none', stroke:'#6a4724', 'stroke-width':r[0] + 2, opacity:r[1]}, island);
      el('path', {d:d, fill:'none', stroke:'#e6d2a2', 'stroke-width':r[0], opacity:1}, island);
    });
    el('path', {d:d, fill:'#e3cb95', stroke:'#4e3218', 'stroke-width':2.6}, island);
    el('path', {d:d, fill:'url(#hatch)', opacity:.25}, island);
  });

  /* ---------- sea marks ---------- */
  var waves = $('waves');
  var wavePts = [[120,300],[90,420],[330,640],[520,650],[700,660],[940,300],[930,420],[620,70],[430,60],[200,120],[980,560],[60,520]];
  wavePts.forEach(function(p){ el('path', {d:'M' + p[0] + ' ' + p[1] + 'q6-6 12 0t12 0M' + (p[0]+10) + ' ' + (p[1]+10) + 'q6-6 12 0t12 0'}, waves); });

  /* ---------- decor: mountains, forest, river ---------- */
  function mountain(x, y, s, big){
    var g = el('g', {}, decor);
    el('path', {d:'M' + (x-26*s) + ' ' + y + ' L' + x + ' ' + (y-40*s) + ' L' + (x+26*s) + ' ' + y, fill:'#e3cb95', stroke:'#4e3218', 'stroke-width':2, 'stroke-linejoin':'round'}, g);
    for (var k=1;k<6;k++){ var t = k/6; el('path', {d:'M' + (x + 26*s*t*.9) + ' ' + (y - 40*s*(1-t)) + ' l' + (-6*s) + ' ' + (10*s), stroke:'#4e3218', 'stroke-width':1.2}, g); }
    if (big){ el('path', {d:'M' + (x-6) + ' ' + (y-40*s) + ' q-6-14 4-20 q10-6 4-18 M' + (x+4) + ' ' + (y-42*s) + ' q8-10 0-18', stroke:'#7a5430', fill:'none', 'stroke-width':1.6, 'stroke-linecap':'round'}, g); }
  }
  [[640,268,.8],[675,232,1],[738,262,.85],[610,236,.7],[770,300,.7],[712,300,.75]].forEach(function(m){ mountain(m[0], m[1], m[2]); });
  function tree(x, y, s){
    var g = el('g', {}, decor);
    el('path', {d:'M' + x + ' ' + y + 'v-' + (10*s), stroke:'#4e3218', 'stroke-width':1.6}, g);
    el('path', {d:'M' + x + ' ' + (y-26*s) + 'c-9 0-11 10-6 14c-6 3-2 10 6 8c8 2 12-5 6-8c5-4 3-14-6-14z', fill:'#d9bf86', stroke:'#4e3218', 'stroke-width':1.4}, g);
  }
  for (var t=0;t<34;t++){
    var tx = 290 + R()*200, ty = 270 + R()*170;
    if (Math.hypot(tx-372, ty-320) < 46 || Math.hypot(tx-470, ty-470) < 50) continue;
    if (ty > 336 && ty < 404 && Math.abs(tx - 372) < 105) continue;
    if (((tx-390)/110)*((tx-390)/110) + ((ty-355)/95)*((ty-355)/95) > 1) continue;
    tree(tx, ty, .75 + R()*.4);
  }
  // river from the falls to the south-east coast
  el('path', {d:'M765 438 q-20 30 6 52 t-10 60 q-8 24 10 40', fill:'none', stroke:'#4e3218', 'stroke-width':2.2}, decor);
  el('path', {d:'M775 438 q-18 30 8 52 t-10 60 q-6 24 12 40', fill:'none', stroke:'#4e3218', 'stroke-width':1.2}, decor);
  // marsh marks
  [[560,380],[590,410],[545,425]].forEach(function(p){ el('path', {d:'M' + p[0] + ' ' + p[1] + 'h18M' + (p[0]+4) + ' ' + (p[1]-4) + 'v4M' + (p[0]+9) + ' ' + (p[1]-7) + 'v7M' + (p[0]+14) + ' ' + (p[1]-4) + 'v4', stroke:'#6a4724', 'stroke-width':1.2}, decor); });
  var ml = el('text', {x:640, y:446, 'text-anchor':'end', class:'lbl small'}, decor); ml.textContent = 'Bog of Second Guessing';

  /* ---------- locations ---------- */
  var ICONS = {
    anchor:'<circle cx="0" cy="-30" r="5" fill="none" stroke="#4e3218" stroke-width="2.4"/><path d="M0-25V2M-10-16h20M-17-8q2 12 17 12q15 0 17-12" fill="none" stroke="#4e3218" stroke-width="2.6" stroke-linecap="round"/>',
    tree:'<path d="M0 0V-22M0-14l-10-8M0-18l9-7" stroke="#4e3218" stroke-width="3" stroke-linecap="round"/><path d="M-18-26c-6-14 10-24 18-18c8-10 26-2 20 12c8 6-2 16-10 12c-6 8-22 6-24-2c-8 0-10-4-4-4z" fill="#d9bf86" stroke="#4e3218" stroke-width="1.8"/><path d="M-26-10h52" stroke="#4e3218" stroke-width="1"/><path d="M-20-10v8h7v-8M4-10l2 9 7-1-2-8" fill="#efdfb7" stroke="#4e3218" stroke-width="1.2"/>',
    skull:'<path d="M-16-12c0-22 32-22 32 0c0 8-5 10-6 14h-20c-1-4-6-6-6-14z" fill="#efdfb7" stroke="#4e3218" stroke-width="2.2"/><circle cx="-6" cy="-12" r="4.5" fill="#4e3218"/><circle cx="6" cy="-12" r="4.5" fill="#4e3218"/><path d="M0-6l-2.5 4h5z" fill="#4e3218"/><path d="M-8 2v5M-3 2v5M3 2v5M8 2v5" stroke="#4e3218" stroke-width="1.5"/><path d="M-26 8q26-8 52 0" fill="none" stroke="#4e3218" stroke-width="2"/>',
    volcano:'<path d="M-30 4 -8-30h16L30 4Z" fill="#d9bf86" stroke="#4e3218" stroke-width="2.2" stroke-linejoin="round"/><path d="M-8-30q8 6 16 0" fill="none" stroke="#4e3218" stroke-width="1.5"/><path d="M-2-34q-10-10 0-18q10-8 2-18M6-34q10-8 4-18" fill="none" stroke="#7a5430" stroke-width="2" stroke-linecap="round"/><path d="M-20-6l6-12M-10-4l4-14M14-8l-4-14" stroke="#4e3218" stroke-width="1.2"/>',
    falls:'<path d="M-22-30h44v8h-44z" fill="#d9bf86" stroke="#4e3218" stroke-width="2"/><path d="M-12-22v24M-4-22v28M4-22v24M12-22v26" stroke="#4e3218" stroke-width="1.6" stroke-dasharray="5 3"/><path d="M-22 8q6-6 11 0t11 0t11 0t11 0" fill="none" stroke="#4e3218" stroke-width="1.8"/>',
    parrot:'<path d="M0-34c10 0 14 8 12 14c8 6 8 18 2 26l-6-6c-8 2-14-4-14-12c0-10-2-22 6-22z" fill="#d9bf86" stroke="#4e3218" stroke-width="2"/><path d="M11-28q8 0 7 8l-6-3" fill="#b0261c" stroke="#4e3218" stroke-width="1.4"/><circle cx="5" cy="-26" r="2" fill="#4e3218"/><path d="M-2 0l-10 14M4 2l-4 14" stroke="#4e3218" stroke-width="2" stroke-linecap="round"/><path d="M-22 6h40" stroke="#4e3218" stroke-width="2.4" stroke-linecap="round"/>'
  };
  var LOCS = [
    {id:'cove', name:'Cove of Second Thoughts', x:232, y:430, icon:'anchor', lx:26, ly:40},
    {id:'tree', name:'The Laundry Tree', x:372, y:335, icon:'tree', lx:0, ly:34},
    {id:'skull', name:'Skull Rock', x:520, y:176, icon:'skull', lx:0, ly:36},
    {id:'grumble', name:'Mount Grumble', x:690, y:176, icon:'volcano', lx:0, ly:-86},
    {id:'falls', name:'Whispering Falls', x:770, y:414, icon:'falls', lx:0, ly:38},
    {id:'parrot', name:'Parrot Parliament', x:474, y:496, icon:'parrot', lx:-6, ly:36}
  ];
  var ORDER = ['cove','tree','skull','falls','parrot'];
  var TEXT = {
    start:['Day 1 · aboard the Merry Mistake','We drop anchor. The old map says: “Begin where the sand is least sure of itself.” That will be the Cove of Second Thoughts.'],
    cove:['The Cove of Second Thoughts','A bottle in the shallows. The note inside: “Go to the tree where the laundry hangs. Nobody has collected it since 1702.”'],
    tree:['The Laundry Tree','Carved in the bark: “North, to the rock that grins.” Beneath it, smaller: “Stop reading tree bark.”'],
    skull:['Skull Rock','The left eye looks east, toward falling water. The right eye looks at you, judgmentally.'],
    falls:['Whispering Falls','The falls whisper mostly gossip. Behind the curtain of water, painted on the stone: “Ask the Parliament.”'],
    parrot:['Parrot Parliament','The parrots have voted, four to three: “Go south-east, to the red X. Obviously. Why is it always the red X.”'],
    grumble:['Mount Grumble','Mount Grumble grumbles. No treasure — only a fine view and a strong sense you should have followed the clues.'],
    wrong:['Not yet','Pretty spot. But the last clue pointed elsewhere, so you write “interesting” in the margin and move on.'],
    again:['Been here','You have been here already. The locals are starting to recognise you.'],
    dig:['You dig at the X','You find sand, then more sand, then a crab who seems disappointed in you. Perhaps follow the clues first.'],
    win:['Treasure!','Inside the chest: three doubloons, a pocket watch stopped at 4:17, an IOU signed by Blackbeard, and a coupon — 10% off at the Rusty Anchor (expired 1719). Worth it.']
  };
  var locEls = {};
  LOCS.forEach(function(L){
    var g = el('g', {class:'loc', tabindex:'0', role:'button', 'aria-label':L.name, 'data-id':L.id}, locsG);
    el('circle', {cx:L.x, cy:L.y - 12, r:42, class:'hit'}, g);
    var ico = el('g', {class:'ico', transform:'translate(' + L.x + ' ' + L.y + ')'}, g);
    ico.innerHTML = ICONS[L.icon];
    var t = el('text', {x:L.x + L.lx, y:L.y + L.ly, 'text-anchor':'middle', class:'lbl'}, g); t.textContent = L.name;
    var tk = el('path', {d:'M' + (L.x + 26) + ' ' + (L.y - 36) + 'l5 6 10-13', class:'tick', stroke:'#b0261c', 'stroke-width':3, fill:'none', 'stroke-linecap':'round'}, g);
    locEls[L.id] = g;
  });
  function locById(id){ for (var i=0;i<LOCS.length;i++) if (LOCS[i].id === id) return LOCS[i]; return null; }

  /* ---------- state ---------- */
  var pos = [196, 548], step = 0, paces = 0, visited = {}, busy = false, won = false;
  var pacesEl = $('paces'), cluesEl = $('clues');
  function log(key, cls){
    var li = document.createElement('li'); if (cls) li.className = cls;
    li.innerHTML = '<b>' + TEXT[key][0] + '</b>' + TEXT[key][1];
    entries.appendChild(li);
    entries.scrollTop = entries.scrollHeight;
  }
  function updateStats(){ if (pacesEl) pacesEl.textContent = String(Math.round(paces)); if (cluesEl) cluesEl.textContent = Math.min(step, 5) + ' / 5'; }

  function walk(to, cls, done){
    busy = true;
    var from = pos.slice(), dx = to[0]-from[0], dy = to[1]-from[1], len = Math.hypot(dx, dy) || 1;
    var bend = (R() - .5) * .5 * len;
    var cx = (from[0]+to[0])/2 - dy/len*bend, cy = (from[1]+to[1])/2 + dx/len*bend;
    var d = 'M' + from[0] + ' ' + from[1] + ' Q' + cx.toFixed(1) + ' ' + cy.toFixed(1) + ' ' + to[0] + ' ' + to[1];
    el('path', {d:d, class:'trail' + (cls ? ' ' + cls : '')}, trailG);
    var m = el('path', {d:d, fill:'none', stroke:'#fff', 'stroke-width':10, 'stroke-linecap':'round'}, maskG);
    var L = m.getTotalLength();
    m.style.strokeDasharray = L + ' ' + L; m.style.strokeDashoffset = L;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dur = reduce ? 1 : Math.max(500, L * 3.2), t0 = null;
    nib.setAttribute('opacity', 1);
    function f(ts){
      if (t0 === null) t0 = ts;
      var k = Math.min(1, (ts - t0) / dur), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
      m.style.strokeDashoffset = L * (1 - e);
      var p = m.getPointAtLength(L * e); nib.setAttribute('cx', p.x); nib.setAttribute('cy', p.y);
      if (k < 1) requestAnimationFrame(f);
      else { nib.setAttribute('opacity', 0); pos = to.slice(); paces += L / 1.4; updateStats(); busy = false; if (done) done(); }
    }
    requestAnimationFrame(f);
  }

  function visit(id){
    if (busy || won) return;
    var L = locById(id); if (!L) return;
    var target = [L.x, L.y + 6];
    if (visited[id] && ORDER.indexOf(id) < step){ walk(target, 'wrong', function(){ log('again', 'bad'); }); return; }
    if (id === ORDER[step]){
      walk(target, '', function(){ visited[id] = 1; locEls[id].classList.add('seen'); step++; updateStats(); log(id, 'good'); if (step >= ORDER.length) xmark.classList.add('ready'); });
    } else if (id === 'grumble'){
      walk(target, 'wrong', function(){ log('grumble', 'bad'); });
    } else {
      walk(target, 'wrong', function(){ log('wrong', 'bad'); });
    }
  }
  function dig(){
    if (busy || won) return;
    walk([648, 548], step >= ORDER.length ? '' : 'wrong', function(){
      if (step >= ORDER.length){ won = true; chest.classList.add('open'); xmark.classList.remove('ready'); log('win', 'win'); fanfare(); }
      else log('dig', 'bad');
    });
  }

  /* ---------- a small sea shanty flourish ---------- */
  var ac = null;
  function fanfare(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      if (!ac) ac = new AC(); if (ac.state === 'suspended') ac.resume();
      var notes = [392, 494, 587, 784, 587, 784], t = ac.currentTime + .05;
      notes.forEach(function(f, i){
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        var st = t + i * .14, dur = i === notes.length-1 ? .6 : .16;
        g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(.12, st + .02); g.gain.exponentialRampToValueAtTime(.001, st + dur);
        o.connect(g); g.connect(ac.destination); o.start(st); o.stop(st + dur + .05);
      });
    }catch(e){}
  }
  function unlockAudio(){ try{ var AC = window.AudioContext || window.webkitAudioContext; if (AC && !ac) ac = new AC(); if (ac && ac.state === 'suspended') ac.resume(); }catch(e){} }

  /* ---------- events ---------- */
  locsG.addEventListener('click', function(e){ unlockAudio(); var g = e.target.closest ? e.target.closest('.loc') : null; if (g) visit(g.getAttribute('data-id')); });
  locsG.addEventListener('keydown', function(e){ if (e.key !== 'Enter' && e.key !== ' ') return; var g = e.target.closest ? e.target.closest('.loc') : null; if (g){ e.preventDefault(); unlockAudio(); visit(g.getAttribute('data-id')); } });
  xmark.addEventListener('click', function(){ unlockAudio(); dig(); });
  xmark.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); unlockAudio(); dig(); } });

  function reset(){
    if (busy) return;
    trailG.innerHTML = ''; maskG.innerHTML = ''; entries.innerHTML = '';
    pos = [196, 548]; step = 0; paces = 0; visited = {}; won = false;
    chest.classList.remove('open'); xmark.classList.remove('ready');
    Object.keys(locEls).forEach(function(k){ locEls[k].classList.remove('seen'); });
    updateStats(); log('start');
  }
  var rb = $('reset'); if (rb) rb.addEventListener('click', reset);

  /* ---------- responsive crop for narrow screens ---------- */
  function fit(){ map.setAttribute('viewBox', window.innerWidth < 640 ? '84 70 836 590' : '0 0 1000 700'); }
  fit(); window.addEventListener('resize', fit);

  reset();
  // an opening stroll so the trail is visible straight away
  setTimeout(function(){ visit('cove'); }, 350);
})();
