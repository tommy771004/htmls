function prepareRoll(){collisionEvents=0;const targets=layout(count);for(let i=0;i<dice.length;i++){const d=dice[i],p=targets[i],angle=(Math.random()-.5)*.42,cs=Math.cos(angle),sn=Math.sin(angle);d.target=p;d.start=[p[0]*cs-p[1]*sn+(Math.random()-.5)*.32,p[0]*sn+p[1]*cs+(Math.random()-.5)*.32];d.result=1+Math.floor(Math.random()*6);d.startQuat=randomQuat();d.axis.set(Math.random()-.5,1+Math.random(),Math.random()-.5).normalize();d.spin=(2.1+Math.random()*1.5)*Math.PI*2;spinQuat.setFromAxisAngle(d.axis,d.spin);d.impactQuat.copy(d.startQuat).multiply(spinQuat);const align=new THREE.Quaternion().setFromUnitVectors(faceNormals[d.result],up),yaw=new THREE.Quaternion().setFromAxisAngle(up,Math.floor(Math.random()*4)*Math.PI/2);d.targetQuat.copy(yaw).multiply(align);d.impact1=false;d.impact2=false;d.wobble=0;d.poke=0;d.stretchTarget=0}}
function showResults(){const values=dice.map(d=>{let best=1,bestDot=-Infinity;for(const [v,n] of Object.entries(faceNormals)){let dot=n.clone().applyQuaternion(d.group.quaternion).dot(up);if(dot>bestDot){bestDot=dot;best=Number(v)}}return best});$('result').innerHTML=values.map(v=>`<span class="pill">${v}</span>`).join('')+`<span>合計 <b>${values.reduce((a,b)=>a+b,0)}</b></span>`;$('result').dataset.phase='settled';$('roll').disabled=false;$('rollText').textContent='再擲一次';rolling=false}
function roll(){if(rolling)return;prepareRoll();rollNumber++;if(reduced){for(const d of dice){d.x=d.target[0];d.z=d.target[1];d.y=1;d.group.position.set(d.x,1,d.z);d.group.quaternion.copy(d.targetQuat);d.wobble=0;d.poke=0;d.stretch=0}showResults();return}rolling=true;rollStarted=performance.now();$('roll').disabled=true;$('rollText').textContent='果凍翻滾中';$('result').textContent='咕嚕、咕嚕……';$('result').dataset.phase='rolling'}
function ease(t){t=THREE.MathUtils.clamp(t,0,1);return t*t*(3-2*t)}
function animateRoll(now){let finished=true;for(let i=0;i<dice.length;i++){const d=dice[i],duration=1750+i*90,t=THREE.MathUtils.clamp((now-rollStarted-i*70)/duration,0,1);if(t<1)finished=false;const glide=ease(Math.min(1,t/.66)),inward=t<.58?Math.sin(Math.PI*t/.58)*.18:0;d.x=THREE.MathUtils.lerp(d.start[0],d.target[0],glide)*(1-inward);d.z=THREE.MathUtils.lerp(d.start[1],d.target[1],glide)*(1-inward);if(t<.58){let u=t/.58;d.y=1+3.3*Math.sin(Math.PI*u);spinQuat.setFromAxisAngle(d.axis,d.spin*u);d.group.quaternion.copy(d.startQuat).multiply(spinQuat)}else if(t<.78){let u=(t-.58)/.20;d.y=1+.59*Math.sin(Math.PI*u);d.group.quaternion.copy(d.impactQuat).slerp(d.targetQuat,ease((t-.58)/.35));if(!d.impact1){d.impact1=true;d.wobble=Math.max(d.wobble,1)}}else if(t<.93){let u=(t-.78)/.15;d.y=1+.24*Math.sin(Math.PI*u);d.group.quaternion.copy(d.impactQuat).slerp(d.targetQuat,ease((t-.58)/.35));if(!d.impact2){d.impact2=true;d.wobble=Math.max(d.wobble,.62)}}else{d.y=1;d.group.quaternion.copy(d.targetQuat)}d.group.position.set(d.x,d.y,d.z)}resolveCollisions();if(finished)showResults()}
function resolveCollisions(){const minDist=2.35,minAxis=2.13;for(let pass=0;pass<4;pass++){for(let i=0;i<dice.length;i++)for(let j=i+1;j<dice.length;j++){const a=dice[i],b=dice[j];if(Math.abs(a.y-b.y)>1.8)continue;let dx=b.x-a.x,dz=b.z-a.z,dist=Math.hypot(dx,dz),hit=false;if(Math.abs(dx)<minAxis&&Math.abs(dz)<minAxis){const overlapX=minAxis-Math.abs(dx),overlapZ=minAxis-Math.abs(dz);if(overlapX<overlapZ){const push=overlapX/2+.001,sign=dx>=0?1:-1;a.x-=sign*push;b.x+=sign*push}else{const push=overlapZ/2+.001,sign=dz>=0?1:-1;a.z-=sign*push;b.z+=sign*push}hit=true}else if(dist<minDist){if(dist<.0001){dx=.001;dz=0;dist=.001}const push=(minDist-dist)/2,nx=dx/dist,nz=dz/dist;a.x-=nx*push;b.x+=nx*push;a.z-=nz*push;b.z+=nz*push;hit=true}if(hit){collisionEvents++;if(!reduced){a.wobble=Math.max(a.wobble,.45);b.wobble=Math.max(b.wobble,.45)}}}for(const d of dice){const dist=Math.hypot(d.x,d.z),limit=3.01;if(dist>limit){d.x*=limit/dist;d.z*=limit/dist;d.wobble=Math.max(d.wobble,.25)}}}for(const d of dice){d.group.position.x=d.x;d.group.position.z=d.z;d.shadow.position.x=d.x;d.shadow.position.z=d.z;d.shadow.material.opacity=.13*Math.max(.25,1-(d.y-1)/4)}}
function deform(d,dt,now){if(reduced)return;d.wobble*=Math.exp(-dt*5.3);d.poke*=Math.exp(-dt*8);d.stretch+=(d.stretchTarget-d.stretch)*Math.min(1,dt*12);if(d.wobble<.002&&d.poke<.002&&Math.abs(d.stretch)<.002)return;const attr=d.geometry.getAttribute('position'),arr=attr.array,axis=d.stretchAxis,pp=d.pokePoint,px=pp.x,py=pp.y,pz=pp.z,plen=Math.hypot(px,py,pz)||1,pulse=d.wobble*Math.sin(now*.017);for(let i=0;i<arr.length;i+=3){const x=basePositions[i],y=basePositions[i+1],z=basePositions[i+2],along=x*axis.x+y*axis.y+z*axis.z,stretch=d.stretch*along;let nx=x*(1+.065*pulse)+axis.x*stretch,ny=y*(1-.14*pulse)+axis.y*stretch,nz=z*(1+.065*pulse)+axis.z*stretch;let dd=(x-px)**2+(y-py)**2+(z-pz)**2,indent=d.poke*Math.exp(-dd/0.26);nx-=px/plen*indent;ny-=py/plen*indent;nz-=pz/plen*indent;arr[i]=nx;arr[i+1]=ny;arr[i+2]=nz}attr.needsUpdate=true;d.geometry.computeBoundingSphere()}
function restoreGeometry(d){const a=d.geometry.getAttribute('position');a.array.set(basePositions);a.needsUpdate=true;d.geometry.computeBoundingSphere()}
function render(now){const dt=Math.min(.05,(now-lastFrame)/1000||.016);lastFrame=now;if(rolling)animateRoll(now);for(const d of dice){const toCamera=camera.position.clone().sub(d.group.position).normalize();for(const pip of d.pipMeshes)pip.visible=pip.userData.normal.clone().applyQuaternion(d.group.quaternion).dot(toCamera)>.16;const active=d.wobble>.002||d.poke>.002||Math.abs(d.stretch)>.002||d.stretchTarget>.002;if(active)deform(d,dt,now);else if(d.mesh.userData.deformed){restoreGeometry(d);d.mesh.userData.deformed=false}if(active)d.mesh.userData.deformed=true}renderer.render(scene,camera);frameCount++;if(now-frameClock>1200){perfFps=Math.round(frameCount*1000/(now-frameClock));frameClock=now;frameCount=0;if(perfFps<53)lowWindows++;else lowWindows=0;if(lowWindows>=2&&quality!=='lite'){setQuality('lite');lowWindows=0}}requestAnimationFrame(render)}
const interaction={die:null,startX:0,startY:0,dragging:false,point:new THREE.Vector3()};function hitDie(e){const rect=canvas.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-((e.clientY-rect.top)/rect.height*2-1));raycaster.setFromCamera(pointer,camera);return raycaster.intersectObjects(dice.map(d=>d.mesh),false)[0]}
canvas.addEventListener('pointerdown',e=>{if(rolling)return;const hit=hitDie(e);if(!hit)return;interaction.die=dice[hit.object.userData.index];interaction.startX=e.clientX;interaction.startY=e.clientY;interaction.dragging=false;interaction.point.copy(hit.point);interaction.die.pokePoint.copy(hit.point).sub(interaction.die.group.position).applyQuaternion(interaction.die.group.quaternion.clone().invert());canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing'});
canvas.addEventListener('pointermove',e=>{if(!interaction.die){canvas.style.cursor=hitDie(e)?'pointer':'default';return}const dx=e.clientX-interaction.startX,dy=e.clientY-interaction.startY,dist=Math.hypot(dx,dy);if(dist>6)interaction.dragging=true;if(interaction.dragging){const d=interaction.die;d.stretchTarget=Math.min(.72,dist/155);d.stretchAxis.set(dx,-dy,0).normalize().applyQuaternion(d.group.quaternion.clone().invert());d.wobble=Math.max(d.wobble,.1)}});
function release(e){if(!interaction.die)return;const d=interaction.die;if(!interaction.dragging){d.poke=.43;d.wobble=Math.max(d.wobble,.65)}else{d.stretchTarget=0;d.wobble=Math.max(d.wobble,.9)}interaction.die=null;canvas.style.cursor='default';if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId)}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
$('flavors').addEventListener('click',e=>{const b=e.target.closest('[data-flavor]');if(b)setFlavor(b.dataset.flavor)});$('countPicker').addEventListener('click',e=>{const b=e.target.closest('[data-count]');if(b)setCount(Number(b.dataset.count))});$('roll').addEventListener('click',roll);
window.__jellyDiagnostics=()=>({phase:$('result').dataset.phase,count,rollNumber,collisionEvents,results:dice.map(d=>d.result),dice:dice.map(d=>({x:d.x,y:d.y,z:d.z,poke:d.poke,stretch:d.stretch,wobble:d.wobble,topUp:Math.max(...Object.values(faceNormals).map(n=>n.clone().applyQuaternion(d.group.quaternion).dot(up)))})),fps:perfFps,quality,reduced});
setCount(1);setFlavor('strawberry');requestAnimationFrame(render);
</script>
</body>
