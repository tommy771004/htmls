function setFlavor(name){if(!flavors[name])return;current=name;const f=flavors[name],root=document.documentElement;for(const prop of ['paper','ink','muted','accent','soft','line','btn'])root.style.setProperty('--'+prop,f[prop]);document.querySelector('meta[name="theme-color"]').content=f.paper;document.querySelectorAll('[data-flavor]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.flavor===name)));scene.background=new THREE.Color(f.paper);jellyMat.color.set(f.jelly).lerp(new THREE.Color('#ffffff'),.2);jellyMat.attenuationColor.set(f.jelly);jellyMat.transmission=Math.min(.78,f.trans+.4);jellyMat.opacity=1;jellyMat.needsUpdate=true;rimMat.color.set(f.soft);trayMat.color.set('#fffaf6');shadowMat.color.set(f.jelly).lerp(new THREE.Color('#3a2a2e'),.55);for(const d of dice)d.shadow.material.color.copy(shadowMat.color);renderer.shadowMap.needsUpdate=true;wake()}
// The landing is a real tumble: each die touches down one edge-roll short of its spot (about 1.88 units for this rounded 2-unit cube) and tips a quarter turn over the leading edge onto its final face, so the turn and the slide are one motion. The airborne spin is worked backwards from that touchdown pose.
const ROLL_STEP=1.88,ROLL_DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function prepareRoll(){collisionEvents=0;const targets=layout(count);for(let i=0;i<dice.length;i++){const d=dice[i],p=targets[i];d.target=p;let best=null,bestScore=-Infinity;for(const [dx,dz] of ROLL_DIRS){const ix=p[0]-dx*ROLL_STEP,iz=p[1]-dz*ROLL_STEP,r=Math.hypot(ix,iz);let clear=4;targets.forEach((q,j)=>{if(j!==i)clear=Math.min(clear,Math.hypot(q[0]-ix,q[1]-iz))});const score=(r<=3.05?100:-r*10)+clear+Math.random()*.6;if(score>bestScore){bestScore=score;best=[dx,dz,ix,iz]}}
 const [dx,dz,ix,iz]=best;d.impact=[ix,iz];d.rollAxis.set(dz,0,-dx);const sx=ix-dx*1.4+(Math.random()-.5)*.5,sz=iz-dz*1.4+(Math.random()-.5)*.5,sr=Math.hypot(sx,sz),k=sr>3?3/sr:1;d.start=[sx*k,sz*k];

 d.axis.set(Math.random()-.5,1+Math.random(),Math.random()-.5).normalize();d.spin=(2.1+Math.random()*1.5)*Math.PI*2;spinQuat.setFromAxisAngle(d.axis,d.spin).invert();d.startQuat.copy(d.impactQuat).multiply(spinQuat);d.impact1=false;d.impact2=false;d.wobble=0;d.poke=0;d.stretchTarget=0}}
function showResults(){const values=dice.map(d=>{let best=1,bestDot=-Infinity;for(const [v,n] of Object.entries(faceNormals)){let dot=n.clone().applyQuaternion(d.group.quaternion).dot(up);if(dot>bestDot){bestDot=dot;best=Number(v)}}return best});$('result').innerHTML=values.map(v=>`<span class="pill">${v}</span>`).join('')+`<span>合計 <b>${values.reduce((a,b)=>a+b,0)}</b></span>`;$('result').dataset.phase='settled';$('roll').disabled=false;$('rollText').textContent='再擲一次';rolling=false}
function roll(){if(rolling)return;cancelStretch();prepareRoll();rollNumber++;if(reduced){for(const d of dice){d.x=d.target[0];d.z=d.target[1];d.y=1;d.group.position.set(d.x,1,d.z);d.group.quaternion.copy(d.targetQuat);d.wobble=0;d.poke=0;d.stretch=0}showResults();wake();return}rolling=true;rollStarted=performance.now();wake();$('roll').disabled=true;$('rollText').textContent='果凍翻滾中';$('result').textContent='咕嚕、咕嚕……';$('result').dataset.phase='rolling'}
function ease(t){t=THREE.MathUtils.clamp(t,0,1);return t*t*(3-2*t)}
function animateRoll(now){let finished=true;for(let i=0;i<dice.length;i++){const d=dice[i],duration=1750+i*90,t=THREE.MathUtils.clamp((now-rollStarted-i*70)/duration,0,1);if(t<1)finished=false;if(t<.58){const u=t/.58,glide=ease(u),inward=Math.sin(Math.PI*u)*.18;d.x=THREE.MathUtils.lerp(d.start[0],d.impact[0],glide)*(1-inward);d.z=THREE.MathUtils.lerp(d.start[1],d.impact[1],glide)*(1-inward);d.y=1+3.3*Math.sin(Math.PI*u);spinQuat.setFromAxisAngle(d.axis,d.spin*u);d.group.quaternion.copy(d.startQuat).multiply(spinQuat)}else{
  // Tumble phase: a decelerating quarter turn about the leading bottom edge; the centre rises over the edge (pivot lift ≈ .29) while it slides the same distance the turn rolls, plus a small jelly rebound right after touchdown.
  const u=Math.min(1,(t-.58)/.35),p=1-(1-u)*(1-u);d.x=THREE.MathUtils.lerp(d.impact[0],d.target[0],p);d.z=THREE.MathUtils.lerp(d.impact[1],d.target[1],p);d.y=1+.29*Math.sin(Math.PI*p)+(u<.4?.38*Math.sin(Math.PI*u/.4):0);tmpQuat.setFromAxisAngle(d.rollAxis,(p-1)*Math.PI/2);d.group.quaternion.copy(tmpQuat).multiply(d.targetQuat);if(!d.impact1){d.impact1=true;d.wobble=Math.max(d.wobble,1)}if(u>=1&&!d.impact2){d.impact2=true;d.wobble=Math.max(d.wobble,.62)}}d.group.position.set(d.x,d.y,d.z)}resolveCollisions();if(finished)showResults()}
function resolveCollisions(){const minDist=2.35,minAxis=2.13;for(let pass=0;pass<4;pass++){for(let i=0;i<dice.length;i++)for(let j=i+1;j<dice.length;j++){const a=dice[i],b=dice[j];if(Math.abs(a.y-b.y)>1.8)continue;let dx=b.x-a.x,dz=b.z-a.z,dist=Math.hypot(dx,dz),hit=false;if(Math.abs(dx)<minAxis&&Math.abs(dz)<minAxis){const overlapX=minAxis-Math.abs(dx),overlapZ=minAxis-Math.abs(dz);if(overlapX<overlapZ){const push=overlapX/2+.001,sign=dx>=0?1:-1;a.x-=sign*push;b.x+=sign*push}else{const push=overlapZ/2+.001,sign=dz>=0?1:-1;a.z-=sign*push;b.z+=sign*push}hit=true}else if(dist<minDist){if(dist<.0001){dx=.001;dz=0;dist=.001}const push=(minDist-dist)/2,nx=dx/dist,nz=dz/dist;a.x-=nx*push;b.x+=nx*push;a.z-=nz*push;b.z+=nz*push;hit=true}if(hit){collisionEvents++;if(!reduced){a.wobble=Math.max(a.wobble,.45);b.wobble=Math.max(b.wobble,.45)}}}for(const d of dice){const dist=Math.hypot(d.x,d.z),limit=3.01;if(dist>limit){d.x*=limit/dist;d.z*=limit/dist;d.wobble=Math.max(d.wobble,.25)}}}for(const d of dice){d.group.position.x=d.x;d.group.position.z=d.z;d.shadow.position.x=d.x;d.shadow.position.z=d.z;d.shadow.material.opacity=.3/(1+Math.max(0,d.y-1)*.7);d.shadow.scale.setScalar(1+Math.max(0,d.y-1)*.18)}}
function deform(d,dt,now){
 if(reduced)return;
 d.wobble*=Math.exp(-dt*5.3);if(interaction.die===d&&!interaction.dragging)d.poke+=(.36-d.poke)*(1-Math.exp(-dt*16));else d.poke*=Math.exp(-dt*8);d.stretch+=(d.stretchTarget-d.stretch)*(1-Math.exp(-dt*12));
 const axis=d.stretchAxis,pp=d.pokePoint,plen=pp.length()||1,pulse=d.wobble*Math.sin(now*.017),compression=1/Math.sqrt(1+d.stretch);
 function update(geometry,base){
  const attr=geometry.getAttribute('position'),arr=attr.array;
  for(let i=0;i<arr.length;i+=3){const x=base[i],y=base[i+1],z=base[i+2],along=x*axis.x+y*axis.y+z*axis.z;
   const stretch=along*(1+d.stretch-compression),dd=(x-pp.x)**2+(y-pp.y)**2+(z-pp.z)**2,indent=d.poke*Math.exp(-dd/.26);
   arr[i]=x*compression*(1+.065*pulse)+axis.x*stretch-pp.x/plen*indent;
   arr[i+1]=y*compression*(1-.14*pulse)+axis.y*stretch-pp.y/plen*indent;
   arr[i+2]=z*compression*(1+.065*pulse)+axis.z*stretch-pp.z/plen*indent;
  }
  attr.needsUpdate=true;geometry.computeVertexNormals();geometry.computeBoundingSphere();
 }
 update(d.geometry,basePositions);
 for(const pip of d.pipMeshes)update(pip.geometry,pip.userData.basePositions);
}
function restoreGeometry(d){
 function restore(g,positions,normals){g.getAttribute('position').array.set(positions);g.getAttribute('normal').array.set(normals);g.getAttribute('position').needsUpdate=true;g.getAttribute('normal').needsUpdate=true;g.computeBoundingSphere();}
 restore(d.geometry,basePositions,baseNormals);
 for(const pip of d.pipMeshes)restore(pip.geometry,pip.userData.basePositions,pip.userData.baseNormals);
}
// The transmission material costs an extra scene pass per frame, so the loop only runs while something moves: a roll, a poke or stretch, a settling wobble, or a couple of frames after a flavour, count or size change. Events call wake() to restart it.
function wake(frames=2){frameBudget=Math.max(frameBudget,frames);if(loopOn)return;loopOn=true;lastFrame=frameClock=performance.now();frameCount=0;requestAnimationFrame(render)}
function render(now){const dt=Math.min(.05,Math.max(0,(now-lastFrame)/1000)||.016);lastFrame=now;if(rolling)animateRoll(now);let moving=rolling||!!interaction.die;for(const d of dice){const toCamera=scratchToCam.copy(camera.position).sub(d.group.position).normalize();for(const pip of d.pipMeshes)pip.visible=scratchPipN.copy(pip.userData.normal).applyQuaternion(d.group.quaternion).dot(toCamera)>.16;const active=interaction.die===d||d.wobble>.002||d.poke>.002||Math.abs(d.stretch)>.002||d.stretchTarget>.002;if(active){deform(d,dt,now);if(!reduced)moving=true}else if(d.mesh.userData.deformed){restoreGeometry(d);d.mesh.userData.deformed=false}if(active)d.mesh.userData.deformed=true}renderer.render(scene,camera);frameCount++;if(now-frameClock>1200){perfFps=Math.round(frameCount*1000/(now-frameClock));frameClock=now;frameCount=0;if(perfFps<53)lowWindows++;else lowWindows=0;if(lowWindows>=2&&quality!=='low'){setQuality(quality==='balanced'?'lite':'low');lowWindows=0}}if(frameBudget>0)frameBudget--;if(moving||frameBudget>0)requestAnimationFrame(render);else loopOn=false}
const interaction={pointerId:null,die:null,startX:0,startY:0,dragging:false,point:new THREE.Vector3()};function hitDie(e){const rect=canvas.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-((e.clientY-rect.top)/rect.height*2-1));raycaster.setFromCamera(pointer,camera);return raycaster.intersectObjects(dice.map(d=>d.mesh),false)[0]}
canvas.addEventListener('pointerdown',e=>{if(rolling||interaction.die||e.button!==0)return;const hit=hitDie(e);if(!hit)return;interaction.pointerId=e.pointerId;interaction.die=dice[hit.object.userData.index];interaction.startX=e.clientX;interaction.startY=e.clientY;interaction.dragging=false;interaction.point.copy(hit.point);interaction.die.pokePoint.copy(hit.point).sub(interaction.die.group.position).applyQuaternion(interaction.die.group.quaternion.clone().invert());canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing';wake()});
canvas.addEventListener('pointermove',e=>{if(interaction.die&&e.pointerId!==interaction.pointerId)return;if(!interaction.die){canvas.style.cursor=hitDie(e)?'pointer':'default';return}const dx=e.clientX-interaction.startX,dy=e.clientY-interaction.startY,dist=Math.hypot(dx,dy);if(dist>6)interaction.dragging=true;if(interaction.dragging){const d=interaction.die;d.stretchTarget=Math.min(.72,dist/155);d.stretchAxis.set(dx,-dy,0).normalize().applyQuaternion(camera.quaternion).applyQuaternion(d.group.quaternion.clone().invert());d.wobble=Math.max(d.wobble,.1)}});
function release(e){if(!interaction.die||e.pointerId!==interaction.pointerId)return;const d=interaction.die;if(!interaction.dragging){if(d.poke<.3)d.poke=.43;d.wobble=Math.max(d.wobble,.65)}else{d.stretchTarget=0;d.wobble=Math.max(d.wobble,.9)}interaction.die=null;interaction.pointerId=null;canvas.style.cursor='default';if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId)}canvas.addEventListener('pointerup',release);function cancelStretch(){if(interaction.die){interaction.die.stretchTarget=0;interaction.die=null;}const id=interaction.pointerId;interaction.pointerId=null;if(id!==null&&canvas.hasPointerCapture(id))canvas.releasePointerCapture(id);canvas.style.cursor='default';}
window.addEventListener('blur',cancelStretch);document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelStretch()});canvas.addEventListener('pointercancel',cancelStretch);canvas.addEventListener('lostpointercapture',cancelStretch);
canvas.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||rolling)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();if(e.repeat)return;for(const d of dice){d.pokePoint.set(0,1,0);d.poke=.43;d.wobble=Math.max(d.wobble,.65);}if($('result').dataset.phase!=='settled')$('result').textContent=reduced?'已碰觸果凍；依減少動態效果設定保持靜止。':'輕戳果凍，放開後慢慢回彈。';wake()}});
$('flavors').addEventListener('click',e=>{const b=e.target.closest('[data-flavor]');if(b)setFlavor(b.dataset.flavor)});$('countPicker').addEventListener('click',e=>{const b=e.target.closest('[data-count]');if(b)setCount(Number(b.dataset.count))});$('roll').addEventListener('click',roll);
window.__jellyDiagnostics=()=>({phase:$('result').dataset.phase,count,rollNumber,collisionEvents,results:dice.map(d=>d.result),dice:dice.map(d=>({x:d.x,y:d.y,z:d.z,poke:d.poke,stretch:d.stretch,wobble:d.wobble,topUp:Math.max(...Object.values(faceNormals).map(n=>n.clone().applyQuaternion(d.group.quaternion).dot(up)))})),fps:perfFps,quality,reduced});
setCount(1);setFlavor('strawberry');wake();
