float h(vec2 p){p=fract(p*vec2(443.897,441.423));p+=dot(p,p.yx+19.19);return fract((p.x+p.y)*p.x);}
void main(){vec2 u=gl_FragCoord.xy/R,d=u-.5;float ca=.0015+C*.006;
 vec3 c=D(vec3(texture(I,u-d*ca).r,texture(I,u).g,texture(I,u+d*ca).b))+D(texture(B,u).rgb)*.6;
 c*=1.-dot(d,d)*.8;c=clamp((c*(2.51*c+.03))/(c*(2.43*c+.59)+.14),0.,1.);c=pow(c,vec3(1./2.2));
 c=mix(c,vec3(step(0.,F)),abs(F));o=vec4(c+(h(gl_FragCoord.xy+G)-.5)*.03,1);}`;

/* ---------- 執行 ---------- */
const QS=new URLSearchParams(location.search),CAP=QS.has('cap');
const cv=$('#c'),gl=cv.getContext('webgl2',{antialias:false,alpha:false,depth:false,preserveDrawingBuffer:CAP,powerPreference:'high-performance'});
let HF=false,PR=[],PB,PL,PP,FA,FB1,FB2,scale=1,budget=CAP?1e9:matchMedia('(pointer:coarse)').matches?.3e6:1.1e6;
const pext=gl&&gl.getExtension('KHR_parallel_shader_compile');
function mk(fs){const p=gl.createProgram();for(const[t,s]of[[gl.VERTEX_SHADER,'#version 300 es\nvoid main(){gl_Position=vec4(vec2(gl_VertexID&1,gl_VertexID>>1)*4.-1.,0,1);}'],[gl.FRAGMENT_SHADER,fs.replace('float;',`float;const float HS=${HF?'1.':'.25'};`)]]){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);gl.attachShader(p,sh);p[t]=sh}gl.linkProgram(p);p.u={};return p}
function ok(p){if(p.ok)return true;if(pext&&!gl.getProgramParameter(p,pext.COMPLETION_STATUS_KHR))return false;if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.warn(gl.getShaderInfoLog(p[gl.FRAGMENT_SHADER])||gl.getProgramInfoLog(p));p.bad=1;return false}return p.ok=true}
function u(p,n){return n in p.u?p.u[n]:p.u[n]=gl.getUniformLocation(p,n)}
function fbo(w,h){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,HF?gl.RGBA16F:gl.RGBA8,w,h,0,gl.RGBA,HF?gl.HALF_FLOAT:gl.UNSIGNED_BYTE,null);
 for(const k of[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,k,gl.LINEAR);for(const k of[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE);
 const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);return{t,f,w,h}}
function size(){if(!gl)return;const W=innerWidth,H=innerHeight,d=Math.min(devicePixelRatio||1,2),k=Math.min(d,Math.sqrt(budget/(W*H)))*scale,w=Math.max(64,Math.round(W*k)),h=Math.max(64,Math.round(H*k));
 if(FA&&FA.w==w&&FA.h==h)return;for(const b of[FA,FB1,FB2])if(b){gl.deleteTexture(b.t);gl.deleteFramebuffer(b.f)}cv.width=w;cv.height=h;FA=fbo(w,h);FB1=fbo(w>>2||1,h>>2||1);FB2=fbo(w>>2||1,h>>2||1)}
if(gl){HF=!!gl.getExtension('EXT_color_buffer_float');PR=[SEED,LATT,CATH,SEA,BLOOM].map(s=>mk(HEAD+s));PB=mk(BRIGHT);PL=mk(BLUR);PP=mk(POST);size();addEventListener('resize',size)}else $('#err').style.display='block';

let CMP=compose($('#tx').value),AC,BUF,SRC,t0=0,live=false,typed=[];
const ub=(a,t)=>{let lo=0,hi=a.length;while(lo<hi){const m=lo+hi>>1;if(a[m]<=t)lo=m+1;else hi=m}return lo};
const age=(a,t)=>{const i=ub(a,t);return i?t-a[i-1]:99};
const Ub=new Float32Array(128),hsh=n=>{const x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x)};
const camZ=T=>{const x=T-64;return x*1.1+(x>16?(x-16)**2*.055:0)};
function uni(T,gate){
 const sc=gate?0:SCN(T),s0=gate?0:sc==0&&T>=128?128:SECS[[0,1,2,3,4][sc]][0],Lc=T-s0,U=Ub;U.fill(0);let N=0,P=0;
 if(sc==0){const out=T>=128;
  if(gate){const ib=Math.floor(T/3.4),ev=[...typed];for(let k=ib-5;k<=ib;k++){const th=k*2.39,z=Math.sin(k*1.7)*.6,r=Math.sqrt(1-z*z);ev.push({d:[r*Math.cos(th),z,r*Math.sin(th)],t:k*3.4})}ev.sort((a,b)=>a.t-b.t);for(let j=0;j<6;j++){const b=ev[ev.length-1-j];if(b&&T>=b.t)U.set([...b.d,T-b.t],j*4);else U[j*4+3]=-1}U.set([1,0,4.6,0],24)}
  else{const i=ub(CMP.bt,T)-1;for(let j=0;j<6;j++){const k=i-j;if(k>=0)U.set([...CMP.bd[k],T-CMP.bt[k]],j*4);else U[j*4+3]=-1}
   if(!out)U.set([.03+.97*sm((T-1.5)/8),sm((T-12.5)/3.5),4.4+1.4*sm((T-11)/5),1-.9*sm((T-3)/6)],24);
   else{const x=T-128;U.set([1-.97*sm((x-9)/7),0,4.8-.6*sm(x/16),sm((x-12)/4)*(1-sm((x-17)/3))],24)}}
  U.set([out?2:0,1,...(gate?innerWidth>innerHeight?[.4,.16]:[0,.26]:[0,0])],28)}
 else if(sc==1){P=Lc/16;const i=ub(CMP.at,T)-1;for(let j=0;j<4;j++){const k=i-j;U.set(k>=0?[CMP.as[k],T-CMP.at[k]]:[0,99],j*4)}U[16]=age(CMP.K,T);U[20]=CMP.h%61;U[21]=CMP.h&1?1:-1}
 else if(sc==2){const s=Math.min(3,Lc/8|0);N=s<3?(s+CMP.h)%3:3;U[0]=age(CMP.K,T)}
 else if(sc==3){const b=sm((T-80)/16),oy=4.4,oz=camZ(96)+2.6,oR=.9+1.3*b*b,cy=1.5+2.9*b*b;
  CMP.ld.slice(0,28).forEach((tb,j)=>{const a=T-tb;if(a<0)return;let x=(hsh(j+.1)-.5)*8+Math.sin(a*.4+j)*.25,y=.15+a*.25,z=camZ(tb)+6+hsh(j+9)*10;
   const k=sm((T-83)/11)**2,w=(2.2*Math.exp(-a*2.5)+.55)*sm(a/.05)*(1-k*.7);U.set([x+(hsh(j+3)*2-1)*oR*.7*k-x*k,y+(oy-y)*k,z+(oz-z)*k,w],j*4)});
  U.set([(CMP.h%7)*.4,(CMP.h%5-2)*.03],116);U.set([cy,.55+.45*b,oR,1+5*b*b*b],120);U.set([camZ(T),cy*.55+(oy-cy*.55)*b,oy,oz],124)}
 else{N=Lc<16?Lc/8|0:2+((Lc-16)/4|0);U.set([1.16+.04*Math.sin(T*.3)+.09*Math.exp(-age(CMP.K,T)*6),Math.exp(-age(CMP.S,T)*9),(CMP.h%97)/9,0],0)}
 return{sc,L:Lc,P,N}}
function fade(T){const fl=(a,k,m)=>T>=a&&T<a+4?m*Math.exp(-(T-a)*k):0;let f=-(1-sm(T/3))+fl(16,4,.35)+fl(32,3,.6)+fl(96,1.8,1)+fl(128,1.2,1);
 if(T>94.5&&T<96)f=((T-94.5)/1.5)**2;if(T>126&&T<128)f=((T-126)/2)**2;if(T>146)f=-Math.min(1,(T-146)/3.5);return Math.max(-1,Math.min(1,f))}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(T,gate){if(!gl)return;const st=uni(T,gate),p=PR[st.sc];if(!ok(p))return;
 const K=gate?0:Math.exp(-age(CMP.K,T)*7),S=gate?0:Math.exp(-age(CMP.S,T)*9);
 gl.bindFramebuffer(gl.FRAMEBUFFER,FA.f);gl.viewport(0,0,FA.w,FA.h);gl.useProgram(p);
 gl.uniform2f(u(p,'R'),FA.w,FA.h);for(const[k,v]of[['T',T],['L',st.L],['P',st.P],['K',K],['S',S],['N',st.N]])gl.uniform1f(u(p,k),v);gl.uniform4fv(u(p,'U'),Ub);gl.drawArrays(gl.TRIANGLES,0,3);
 const pass=(pr,src,dst,fn)=>{gl.bindFramebuffer(gl.FRAMEBUFFER,dst?dst.f:null);const w=dst?dst.w:cv.width,h=dst?dst.h:cv.height;gl.viewport(0,0,w,h);gl.useProgram(pr);gl.uniform2f(u(pr,'R'),w,h);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,src.t);gl.uniform1i(u(pr,'I'),0);fn&&fn(pr);gl.drawArrays(gl.TRIANGLES,0,3)};
 if(ok(PB)&&ok(PL)){pass(PB,FA,FB1);for(const[a,b,x,y]of[[FB1,FB2,1,0],[FB2,FB1,0,1],[FB1,FB2,2.2,0],[FB2,FB1,0,2.2]])pass(PL,a,b,pr=>gl.uniform2f(u(pr,'D'),x/a.w,y/a.h))}
 if(!ok(PP))return;let F=gate?0:fade(T);if(RM&&F>0)F*=.35;
 pass(PP,FA,null,pr=>{gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,FB1.t);gl.uniform1i(u(pr,'B'),1);gl.uniform1f(u(pr,'F'),F);gl.uniform1f(u(pr,'C'),RM?0:S*.8+Math.max(F,0)*.5);gl.uniform1f(u(pr,'G'),(T*60|0)%97*1.7)})}

/* 字幕：旋律唱到哪個字，那個字才出現 */
const sub=$('#sub');let spans=[];
function buildSub(){sub.textContent='';spans=CMP.ch.map(c=>{const s=document.createElement('span');s.textContent=c;sub.append(s);return s})}
function subs(T){const ph=T>=64&&T<95?0:T>=128?1:-1;if(ph<0){sub.style.opacity=0;return}const rv=ph?CMP.r2:CMP.r1;sub.style.opacity=ph?1-sm((T-146.5)/2.5):1-sm((T-91)/3);
 spans.forEach((s,i)=>{const a=sm((T-rv[i])/.22),k=sm((T-rv[i]-.15)/1.4);s.style.opacity=a;s.style.transform=`translateY(${((1-a)*.3).toFixed(3)}em)`;s.style.color=`rgb(${227+11*k|0},${144+85*k|0},${102+115*k|0})`})}

/* 作曲 Worker */
let WK,ready=false,want=false;const gl_=$('#gl'),go=$('#go');
function build(){CMP=compose($('#tx').value);ready=false;go.disabled=true;gl_.textContent='作曲中';WK&&WK.terminate();
 const SR=matchMedia('(pointer:coarse)').matches?32000:44100,msg={E:CMP.E,A:CMP.A,SR,DUR:END};
 const done=(L,R)=>{try{BUF=new AudioBuffer({numberOfChannels:2,length:L.length,sampleRate:SR})}catch(_){unlock();BUF=AC.createBuffer(2,L.length,SR)}BUF.copyToChannel(L,0);BUF.copyToChannel(R,1);ready=true;go.disabled=false;gl_.textContent=live?'繼續':'播放';if(want)start()};
 try{WK=new Worker(URL.createObjectURL(new Blob([`const synth=${synth};onmessage=e=>{const d=e.data,r=synth(d.E,d.A,d.SR,d.DUR,p=>postMessage({p}));postMessage({L:r[0],R:r[1]},[r[0].buffer,r[1].buffer])}`],{type:'text/javascript'})));
  WK.onmessage=e=>{if(e.data.L)done(e.data.L,e.data.R);else gl_.textContent='作曲中 '+Math.round(e.data.p*100)+'%'};WK.postMessage(msg)}
 catch(_){setTimeout(()=>{const r=synth(msg.E,msg.A,msg.SR,msg.DUR,()=>{});done(r[0],r[1])},30)}}
function unlock(){if(!AC)AC=new AudioContext();if(AC.state!='running')AC.resume()}
function start(){if(!ready){want=true;return}want=false;unlock();buildSub();play(0);live=true;$('#pp').textContent='暫停';$('#gate').classList.add('off');$('#hud').classList.add('on');poke()}
function play(from){if(SRC){SRC.onended=null;try{SRC.stop()}catch(_){}}SRC=AC.createBufferSource();SRC.buffer=BUF;SRC.connect(AC.destination);SRC.start(0,Math.max(0,Math.min(END-.01,from)));t0=AC.currentTime-from}
function stop(){if(SRC){try{SRC.stop()}catch(_){}SRC=null}live=false;sub.style.opacity=0;$('#gate').classList.remove('off');$('#hud').classList.remove('on');gl_.textContent='再看一次';$('#tx').focus({preventScroll:true})}
const clock=()=>AC.currentTime-t0-(AC.outputLatency||AC.baseLatency||0);
function ping(m){unlock();const t=AC.currentTime,fr=440*2**((m-69)/12),o=AC.createOscillator(),mo=AC.createOscillator(),mg=AC.createGain(),g=AC.createGain();
 o.frequency.value=fr;mo.frequency.value=fr*3;mg.gain.setValueAtTime(fr*2.4,t);mg.gain.exponentialRampToValueAtTime(1,t+.9);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.1,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+2.2);
 mo.connect(mg).connect(o.frequency);o.connect(g).connect(AC.destination);o.start(t);mo.start(t);o.stop(t+2.3);mo.stop(t+2.3)}
let deb;$('#tx').addEventListener('input',e=>{const c=compose(e.target.value),n=c.snd[c.snd.length-1];if(n&&e.inputType&&e.inputType.startsWith('insert')){ping(n.m);typed.push({d:c.bd[0]?[Math.sin(n.m*2.4),Math.cos(n.m*1.7)*.8,Math.cos(n.m*2.4)]:[0,1,0],t:performance.now()/1000});typed=typed.slice(-6)}clearTimeout(deb);deb=setTimeout(build,450)});
$('#tx').addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.isComposing){e.preventDefault();unlock();start()}});
go.addEventListener('click',()=>{unlock();start()});
/* 時間軸 */
const tl=$('#tl'),ph=$('#ph'),tm=$('#tm');for(const[a,b,n]of SECS){const d=document.createElement('div');d.style.flex=b-a;d.textContent=n;tl.append(d)}
const seekX=e=>{const r=tl.getBoundingClientRect();play(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*END)};
tl.addEventListener('pointerdown',e=>{tl.setPointerCapture(e.pointerId);seekX(e)});tl.addEventListener('pointermove',e=>{if(e.buttons)seekX(e)});
let idle;function poke(){$('#hud').classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>$('#hud').classList.add('idle'),2200)}
addEventListener('pointermove',()=>live&&poke());addEventListener('pointerdown',()=>live&&poke());
const pause=()=>{AC.state=='running'?AC.suspend().then(()=>$('#pp').textContent='繼續'):AC.resume().then(()=>$('#pp').textContent='暫停');poke()};
$('#pp').addEventListener('click',pause);$('#xx').addEventListener('click',()=>stop());
addEventListener('keydown',e=>{if(!live)return;if(e.key==' '){e.preventDefault();pause()}else if(e.key=='Escape')stop();else if(e.key=='ArrowRight'||e.key=='ArrowLeft'){play(Math.max(0,clock()+(e.key=='ArrowRight'?5:-5)));poke()}});
/* 迴圈與自動畫質 */
let last=0,acc=0,cnt=0;
function loop(now){requestAnimationFrame(loop);const dt=now-last;last=now;
 if(live){const T=Math.max(0,clock());if(T>=END){stop();return}draw(T);subs(T);ph.style.left=(T/END*100).toFixed(2)+'%';tm.textContent=`${T/60|0}:${String(T%60|0).padStart(2,'0')}`}else draw(now/1000,true);
 if(dt>0&&dt<200){acc+=dt;if(++cnt==40){const a=acc/cnt;if(a>24&&scale>.4){scale*=.84;size()}else if(a<17.2&&scale<1){scale=Math.min(1,scale*1.08);size()}acc=cnt=0}}}
if(CAP){CMP=compose(QS.get('s')||$('#tx').value);buildSub();$('#gate').style.display='none';
 window.__seek=T=>{for(const p of[...PR,PB,PL,PP])while(!ok(p)&&!p.bad);draw(T);subs(T);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(4))};window.__cmp=CMP;window.__compose=compose;window.__synth=synth}
else{build();requestAnimationFrame(loop)}
</script>
