    var bl = el('g', { 'class':'bloom', style:'transition:opacity 1.2s' }, can);
    for(var k = 0; k < 16; k++){ el('circle', { cx:rr(-85, 85), cy:rr(-235, -115), r:rr(5, 10), fill:k % 3 ? '#fff4f6' : '#e98aa3' }, bl); }
    var snow = el('g', { 'class':'snowb', style:'transition:opacity 1.2s' }, g);
    el('path', { d:'M-60 -163 Q-40 -170 -20 -150 M20 -150 Q40 -172 56 -172 M40 -114 Q56 -120 72 -116 M-40 -100 Q-58 -104 -74 -100', fill:'none', stroke:'#fff', 'stroke-width':6, 'stroke-linecap':'round' }, snow);
  });
  el('path', { d:smoothPath(near, 1000), style:'fill:var(--l5)' }, L5);

  /* L6 foreground: grass + fox */
  var L6 = $('L6'), fg = ridge(860, 40, 8);
  var grass = el('g', {}, L6);
  for(x = -100; x < 1720; x += rr(10, 22)){
    var edge = Math.min(1, Math.abs(x - 800) / 800), gh = rr(20, 60) + edge * edge * 120;
    var gy2 = yAt(fg, x) + 8, lean = rr(-18, 18);
    el('path', { d:'M' + (x - 5) + ' ' + gy2 + ' Q' + (x + lean * .4) + ' ' + (gy2 - gh * .6) + ' ' + (x + lean) + ' ' + (gy2 - gh) + ' Q' + (x + lean * .2 + 3) + ' ' + (gy2 - gh * .5) + ' ' + (x + 6) + ' ' + gy2 + ' Z', style:'fill:var(--l6)' }, grass);
  }
  el('path', { d:smoothPath(fg, 1000), style:'fill:var(--l6)' }, L6);
  var fox = el('g', { transform:'translate(1010 ' + (yAt(fg, 1060) - 58) + ') scale(1.15)', id:'fox' }, L6);
  el('path', { d:'M34 38 Q6 22 -6 40 Q6 52 34 44 Z', fill:'#d9662b' }, fox);
  el('path', { d:'M-6 40 Q-2 44 6 46 Q0 36 -6 40 Z', fill:'#fffaf0' }, fox);
  el('ellipse', { cx:60, cy:38, rx:30, ry:12, fill:'#d9662b' }, fox);
  el('path', { d:'M82 32 L100 22 L120 32 L100 42 Z', fill:'#d9662b' }, fox);
  el('path', { d:'M100 42 L120 32 L108 40 Z', fill:'#fffaf0' }, fox);
  el('path', { d:'M90 27 L93 10 L100 24 Z M98 24 L104 9 L108 27 Z', fill:'#b04f1f' }, fox);
  el('circle', { cx:105, cy:30, r:2, fill:'#2a1a12' }, fox);
  [[40, 44], [50, 44], [70, 44], [80, 44]].forEach(function(l){ el('rect', { x:l[0], y:l[1], width:5, height:16, rx:2, fill:'#8a3a18' }, fox); });

  /* ---------- seasons ---------- */
  var SEASONS = {
    spring:{ n:'春', en:'Spring', line:'把冬天摺好收進抽屜，拿出一張粉色的紙。', fx:'petal', terms:[['立春','2/4','風先醒了，樹還在賴床。'],['雨水','2/19','雨開始比雪多，傘開始比帽子多。'],['驚蟄','3/5','第一聲春雷，把土裡的蟲叫醒。'],['春分','3/20','晝夜各半，公平得剛剛好。'],['清明','4/4','天清地明，適合想念一個人。'],['穀雨','4/20','雨生百穀，田裡的東西在偷偷長。']] },
    summer:{ n:'夏', en:'Summer', line:'剪下一整片綠，光從紙縫裡漏進來。', fx:'firefly', terms:[['立夏','5/5','冷氣遙控器重新被找到。'],['小滿','5/21','麥粒漸滿，但還沒有滿。'],['芒種','6/5','有芒的作物該下田了。'],['夏至','6/21','一年裡白晝最長的一天。'],['小暑','7/7','熱，但還只是小熱。'],['大暑','7/22','熱到紙的邊角都捲起來了。']] },
    autumn:{ n:'秋', en:'Autumn', line:'每一片落葉，都是剪刀多走的一步。', fx:'leaf', terms:[['立秋','8/7','秋天來了，但熱還沒有走。'],['處暑','8/23','暑氣到此為止，說好的。'],['白露','9/7','清晨草葉上有一顆一顆的露水。'],['秋分','9/23','晝夜又一次平分，月亮開始變亮。'],['寒露','10/8','露水變涼，要多帶一件外套。'],['霜降','10/23','第一道霜，楓葉紅透了。']] },
    winter:{ n:'冬', en:'Winter', line:'白紙本來的顏色，就是雪。', fx:'snow', terms:[['立冬','11/7','冬天開始，棉被升級。'],['小雪','11/22','雪還很小，還很害羞。'],['大雪','12/7','雪下得認真了。'],['冬至','12/21','夜最長，湯圓最圓。'],['小寒','1/5','冷，但還有更冷的在後面。'],['大寒','1/20','一年中最冷的時候，快過年了。']] }
  };
  var ORDER = ['spring','summer','autumn','winter'];
  var cur = 'autumn', termIdx = 3;
  var layers = Array.prototype.slice.call(stage.querySelectorAll('.layer'));
  var termsEl = $('terms'), tdesc = $('tdesc');

  function applyDecor(s){
    var capsE = $('caps'); if(capsE) capsE.style.opacity = s === 'winter' ? 1 : (s === 'spring' ? .35 : 0);
    var ge = $('geese'); if(ge) ge.style.opacity = s === 'autumn' || s === 'spring' ? 1 : 0;
    document.querySelectorAll('.canopy').forEach(function(c){ c.style.opacity = s === 'winter' ? 0 : 1; c.style.transform = s === 'winter' ? 'scale(.85)' : 'scale(1)'; });
    document.querySelectorAll('.bloom').forEach(function(b){ b.style.opacity = s === 'spring' ? 1 : 0; });
    document.querySelectorAll('.snowb').forEach(function(b){ b.style.opacity = s === 'winter' ? 1 : 0; });
    document.querySelectorAll('.win').forEach(function(w){ w.setAttribute('fill', s === 'winter' ? '#ffcf5a' : '#f5c451'); });
  }
  function placeSun(i){
    var sg = $('sunG'); if(!sg) return;
    var t = i / 5, x = 420 + t * 820, y = 370 - Math.sin(t * Math.PI) * 120;
    sg.setAttribute('transform', 'translate(' + x.toFixed(0) + ' ' + y.toFixed(0) + ')');
    sg.style.transform = 'translate(' + x.toFixed(0) + 'px,' + y.toFixed(0) + 'px)';
  }
  function renderTerms(){
    var S = SEASONS[cur]; if(!termsEl) return;
    termsEl.innerHTML = '';
    S.terms.forEach(function(t, i){
      var b = document.createElement('button'); b.type = 'button'; b.className = 'term'; b.setAttribute('aria-pressed', i === termIdx ? 'true' : 'false');
      b.innerHTML = '<b>' + t[0] + '</b><small>' + t[1] + '</small>';
      b.addEventListener('click', function(){ setTerm(i); });
      termsEl.appendChild(b);
    });
  }
  function setTerm(i){
    termIdx = i; var t = SEASONS[cur].terms[i];
    if(termsEl) termsEl.querySelectorAll('.term').forEach(function(b, k){ b.setAttribute('aria-pressed', k === i ? 'true' : 'false'); });
    if(tdesc) tdesc.innerHTML = '<b>' + t[0] + '</b>　' + t[2];
    placeSun(i);
  }
  function setSeason(s, keepTerm){
    if(!SEASONS[s]) return;
    var changed = s !== cur;
    cur = s;
    ORDER.forEach(function(k){ document.body.classList.toggle('season-' + k, k === s); });
    document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-pressed', t.getAttribute('data-s') === s ? 'true' : 'false'); });
    var S = SEASONS[s];
    var set = function(id, v){ var e = $(id); if(e) e.textContent = v; };
    set('sName', S.n); set('sEn', S.en); set('sLine', S.line);
    if(!keepTerm) termIdx = 0;
    renderTerms(); setTerm(termIdx);
    applyDecor(s);
    if(changed && !reduce){
      layers.forEach(function(L, i){ L.classList.remove('flip'); void L.offsetWidth; L.querySelector('svg').style.animationDelay = (i * 70) + 'ms'; L.classList.add('flip'); });
    }
    resetParticles();
  }
  document.querySelectorAll('.tab').forEach(function(t){ t.addEventListener('click', function(){ setSeason(t.getAttribute('data-s')); }); });
  document.addEventListener('keydown', function(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    var i = ORDER.indexOf(cur);
    if(e.key === 'ArrowRight'){ e.preventDefault(); setSeason(ORDER[(i + 1) % 4]); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); setSeason(ORDER[(i + 3) % 4]); }
    else if(/^[1-6]$/.test(e.key)){ setTerm(+e.key - 1); }
  });

  /* today's solar term */
  (function(){
    var d = new Date(), md = (d.getMonth() + 1) * 100 + d.getDate(), best = null;
    ORDER.forEach(function(s){ SEASONS[s].terms.forEach(function(t, i){ var p = t[1].split('/'), v = +p[0] * 100 + +p[1]; if(v <= md && (!best || v > best.v)) best = { s:s, i:i, v:v }; }); });
    if(!best) best = { s:'winter', i:4 };
    cur = best.s; termIdx = best.i;
    var td = $('today'); if(td) td.textContent = '今天 · ' + SEASONS[best.s].terms[best.i][0];
  })();

  /* ---------- parallax ---------- */
  var tx = 0, ty = 0, cx = 0, cy = 0, lastMove = 0, hintEl = $('hint');
  if(hintEl && window.matchMedia && window.matchMedia('(hover: none)').matches) hintEl.textContent = '手指左右拖過畫面，看紙片的層次';
  stage.addEventListener('pointermove', function(e){
    var r = stage.getBoundingClientRect();
    tx = ((e.clientX - r.left) / r.width - .5) * 2; ty = ((e.clientY - r.top) / r.height - .5) * 2;
    lastMove = performance.now();
    if(hintEl) hintEl.style.opacity = 0;
  });
  stage.addEventListener('pointerleave', function(){ lastMove = 0; });
  var depths = layers.map(function(L){ return +L.getAttribute('data-d') || 0; });

  /* ---------- particles ---------- */
  var fx = $('fx'), fctx = fx && fx.getContext ? fx.getContext('2d') : null, W = 0, H = 0, DPR = 1, parts = [];
  function sizeFx(){ if(!fx) return; DPR = Math.min(window.devicePixelRatio || 1, 2); W = stage.clientWidth; H = stage.clientHeight; fx.width = Math.round(W * DPR); fx.height = Math.round(H * DPR); }
  function spawn(kind, init){
    var p = { x:Math.random() * W, y:init ? Math.random() * H : -20, r:0, vr:(Math.random() - .5) * .06, a:Math.random() * 6.28 };
    if(kind === 'snow'){ p.s = 1.5 + Math.random() * 3.5; p.vy = .35 + p.s * .18; p.vx = (Math.random() - .5) * .3; }
    else if(kind === 'petal'){ p.s = 4 + Math.random() * 4; p.vy = .5 + Math.random() * .6; p.vx = .3 + Math.random() * .6; }
    else if(kind === 'leaf'){ p.s = 7 + Math.random() * 6; p.vy = .6 + Math.random() * .7; p.vx = -.2 + Math.random() * .7; p.c = ['#d9542b','#e9893a','#b8402a','#f0b23e'][Math.floor(Math.random() * 4)]; }
    else { p.y = H * (.45 + Math.random() * .5); p.s = 1.6 + Math.random() * 2; p.vy = (Math.random() - .5) * .2; p.vx = (Math.random() - .5) * .3; p.ph = Math.random() * 6.28; }
    return p;
  }
  function resetParticles(){
    var k = SEASONS[cur].fx, n = k === 'snow' ? 90 : k === 'firefly' ? 34 : k === 'leaf' ? 26 : 38;
    if(W < 600) n = Math.round(n * .6);
    parts = []; for(var i = 0; i < n; i++) parts.push(spawn(k, true));
  }
  function leafPath(c, s){
    c.beginPath(); c.moveTo(0, -s);
    c.quadraticCurveTo(s * .75, -s * .2, 0, s * .8);
    c.quadraticCurveTo(-s * .75, -s * .2, 0, -s);
    c.closePath();
  }
  function drawParts(t, k){
    if(!fctx) return;
    k = k || 1; // frame-time factor: 1 = one 60 fps frame
    fctx.setTransform(DPR, 0, 0, DPR, 0, 0); fctx.clearRect(0, 0, W, H);
    var k = SEASONS[cur].fx;
    for(var i = 0; i < parts.length; i++){
      var p = parts[i];
      p.a += .02 * k; p.r += p.vr * k;
      if(k === 'firefly'){
        p.x += (p.vx + Math.sin(t / 900 + p.ph) * .3) * k; p.y += (p.vy + Math.cos(t / 1100 + p.ph) * .2) * k;
        if(p.x < -10) p.x = W + 10; if(p.x > W + 10) p.x = -10; if(p.y < H * .35) p.vy = Math.abs(p.vy); if(p.y > H) p.vy = -Math.abs(p.vy);
        var gl = .45 + .55 * Math.max(0, Math.sin(t / 500 + p.ph * 3));
        var g = fctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.s * 6); g.addColorStop(0, 'rgba(255,240,150,' + (.9 * gl) + ')'); g.addColorStop(1, 'rgba(255,240,150,0)');
        fctx.fillStyle = g; fctx.beginPath(); fctx.arc(p.x, p.y, p.s * 6, 0, 6.29); fctx.fill();
        fctx.fillStyle = 'rgba(255,255,220,' + gl + ')'; fctx.beginPath(); fctx.arc(p.x, p.y, p.s, 0, 6.29); fctx.fill();
        continue;
      }
      p.x += (p.vx + Math.sin(p.a) * .4) * k; p.y += p.vy * k;
      if(p.y > H + 20 || p.x > W + 30 || p.x < -30){ parts[i] = spawn(k, false); parts[i].x = Math.random() * W * 1.1 - W * .1; continue; }
      fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r);
      fctx.shadowColor = 'rgba(40,25,15,.25)'; fctx.shadowBlur = 3; fctx.shadowOffsetY = 2;
      if(k === 'snow'){ fctx.fillStyle = '#ffffff'; fctx.beginPath(); fctx.arc(0, 0, p.s, 0, 6.29); fctx.fill(); }
      else if(k === 'petal'){ fctx.fillStyle = '#f7b9c8'; fctx.scale(1, .55 + Math.abs(Math.sin(p.a)) * .45); fctx.beginPath(); fctx.ellipse(0, 0, p.s, p.s * .6, 0, 0, 6.29); fctx.fill(); }
      else { fctx.fillStyle = p.c; fctx.scale(.6 + Math.abs(Math.sin(p.a)) * .4, 1); leafPath(fctx, p.s); fctx.fill(); fctx.shadowColor = 'transparent'; fctx.strokeStyle = 'rgba(90,40,20,.55)'; fctx.lineWidth = 1; fctx.beginPath(); fctx.moveTo(0, -p.s * .7); fctx.lineTo(0, p.s * 1.15); fctx.stroke(); }
      fctx.restore();
    }
  }

  var lastT = 0;
  function loop(t){
    var k = lastT ? Math.min(3, (t - lastT) / 16.667) : 1; lastT = t;
    if(!document.hidden){
      var idle = !lastMove || t - lastMove > 2500;
      var gx = idle ? Math.sin(t / 3200) * .35 : tx, gy = idle ? Math.cos(t / 4100) * .15 : ty;
      if(reduce){ gx = idle ? 0 : gx; gy = idle ? 0 : gy; }
      var ease = 1 - Math.pow(.94, k);
      cx += (gx - cx) * ease; cy += (gy - cy) * ease;
      for(var i = 0; i < layers.length; i++){ var d = depths[i]; layers[i].style.transform = 'translate3d(' + (-cx * d * 34).toFixed(2) + 'px,' + (-cy * d * 12).toFixed(2) + 'px,0)'; }
      if(!reduce) drawParts(t, k);
    }
    requestAnimationFrame(loop);
  }
  window.addEventListener('resize', function(){ sizeFx(); resetParticles(); });
  sizeFx();
  setSeason(cur, true);
  if(reduce && fctx) drawParts(0);
  requestAnimationFrame(loop);
})();
</script>
