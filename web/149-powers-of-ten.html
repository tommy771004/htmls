// ---------- formatting ----------
var SUPD={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
function supN(n){return String(n).split('').map(function(c){return SUPD[c]||c;}).join('');}
function sig(x){return x>=100?Math.round(x).toLocaleString('en-US'):x>=10?x.toFixed(0):x.toFixed(1).replace(/\.0$/,'');}
function cn(v){if(v>=1e12)return sig(v/1e12)+' 兆';if(v>=1e8)return sig(v/1e8)+' 億';if(v>=1e4)return sig(v/1e4)+' 萬';return sig(v);}
function sci(v,unit){var e=Math.floor(Math.log10(v)),m=v/Math.pow(10,e);return m.toFixed(1)+' × 10'+supN(e)+' '+unit;}
function fmtLen(m){var ly=m/9.461e15;if(ly>=.1)return(ly<1?ly.toFixed(2):cn(ly))+' 光年';if(m>=1000)return cn(m/1000)+' 公里';if(m>=1)return sig(m)+' 公尺';if(m>=.01)return sig(m*100)+' 公分';if(m>=1e-3)return sig(m*1e3)+' 毫米';if(m>=1e-6)return sig(m*1e6)+' 微米';if(m>=1e-9)return sig(m*1e9)+' 奈米';if(m>=1e-12)return sig(m*1e12)+' 皮米';if(m>=1e-15)return sig(m*1e15)+' 飛米';return sci(m,'公尺');}
function fmtTime(s){var y=s/3.15576e7;if(y>=1)return cn(y)+' 年';if(s>=86400)return sig(s/86400)+' 天';if(s>=3600)return sig(s/3600)+' 小時';if(s>=60)return sig(s/60)+' 分鐘';if(s>=1)return sig(s)+' 秒';if(s>=1e-3)return sig(s*1e3)+' 毫秒';if(s>=1e-6)return sig(s*1e6)+' 微秒';if(s>=1e-9)return sig(s*1e9)+' 奈秒';if(s>=1e-12)return sig(s*1e12)+' 皮秒';if(s>=1e-15)return sig(s*1e15)+' 飛秒';if(s>=1e-18)return sig(s*1e18)+' 阿秒';return sci(s,'秒');}

  for(var n=ZMAX;n>=ZMIN;n--){var y=yOf(n).toFixed(1),mj=n%5===0,c=sc[n]?'sc':mj?'mj':'';s+='<line class="'+c+'" x1="'+(sc[n]?4:mj?9:15)+'" x2="22" y1="'+y+'" y2="'+y+'"/>';}

  var best=lastCap,bd=Math.abs(z-CAPS[lastCap][0]);for(var i=0;i<CAPS.length;i++){var d=Math.abs(z-CAPS[i][0]);if(d<bd-.08){bd=d;best=i;}}
  if(best!==lastCap){lastCap=best;elTitle.textContent=CAPS[best][1];elFact.textContent=CAPS[best][2];
    var ls=labs.children;for(var j=0;j<ls.length;j++)ls[j].classList.toggle('on',ls[j].textContent===RLABS.filter(function(r){return Math.abs(r[0]-CAPS[best][0])<.01;}).map(function(r){return r[1];})[0]);}

// ---------- motion ----------
function stopAuto(){tour=null;flight=null;$('goOut').classList.remove('on');$('goIn').classList.remove('on');}
function flyTo(v){tour=null;$('goOut').classList.remove('on');$('goIn').classList.remove('on');var d=Math.abs(v-zt);flight={from:zt,to:v,t:0,dur:clamp(d*.3,.7,7)};seen();}
function startTour(dir){if(tour&&tour.dir===dir){stopAuto();return;}flight=null;tour={dir:dir};$('goOut').classList.toggle('on',dir>0);$('goIn').classList.toggle('on',dir<0);seen();}
function tourSpeed(v){if(v<-19.3&&v>-33.4)return 3.4;if(v<-11.4&&v>-13.3)return 1.2;var d=9;for(var i=0;i<CAPS.length;i++)d=Math.min(d,Math.abs(v-CAPS[i][0]));return .3+.62*Math.min(1,d/1.1);}
var seenOnce=false;function seen(){if(!seenOnce){seenOnce=true;hint.classList.add('gone');}}
var last=0,hashT=0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt=Math.min(.05,(ts-last)/1000||.016);last=ts;time+=dt;
  if(flight){flight.t+=dt;var u=clamp(flight.t/flight.dur,0,1),e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;zt=flight.from+(flight.to-flight.from)*e;if(u>=1)flight=null;}
  if(tour){zt+=tour.dir*tourSpeed(z)*dt;if(zt>=ZMAX||zt<=ZMIN){zt=clamp(zt,ZMIN,ZMAX);stopAuto();}}
  zt=clamp(zt,ZMIN,ZMAX);
  var kf=(flight||tour)?1-Math.exp(-dt*14):1-Math.exp(-dt*8);z+=(zt-z)*kf;if(Math.abs(zt-z)<1e-4)z=zt;
  if(Math.abs(z)>1.3)seen();
  render();updateUI();if(snd.on)padUpdate();
  if(ts-hashT>700&&!flight&&!tour&&Math.abs(zt-z)<.002){hashT=ts;var hs='#z='+z.toFixed(2);if(location.hash!==hs)try{history.replaceState(null,'',hs);}catch(err){}}
}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);S=Math.min(W,H);
  var narrow=W<760;CX=Math.round(W/2-(narrow?22:0));CY=Math.round(H*(narrow?.4:.47));layoutRuler();}

  else if(drag){zt=clamp(drag.z+(e.clientY-drag.y)/S*4,ZMIN,ZMAX);if(Math.abs(e.clientY-drag.y)>4)seen();}});
