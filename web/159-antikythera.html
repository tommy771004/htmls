<style>
:root{
  --ink:#ecdfc3; --ink-2:#bcae8e; --ink-3:#8b7f66;
  --bronze:#b98545; --bronze-hi:#e3b577; --bronze-lo:#5e3f1f;
  --verd:#7fbba5; --rust:#cf7a4e;
  --sea-panel:rgba(4,24,28,.88); --wood-panel:rgba(22,13,7,.9);
  --ease-out:cubic-bezier(.2,.7,.2,1);
  --dur-hover:160ms; --dur-enter:520ms;
  --serif:"Songti TC","Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","PMingLiU",serif;
  --greek:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#041a1f;color:var(--ink);overflow:hidden;font-family:var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#gl{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:default}
#boot{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:#041a1f;color:var(--ink-2);font-family:var(--serif);font-size:15px;letter-spacing:.08em;transition:opacity 600ms var(--ease-out)}
#boot.off{opacity:0;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.btn{font-family:var(--serif);font-size:16px;letter-spacing:.04em;padding:11px 20px 12px;background:#6d4824;color:#f6e9cc;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  transition:background var(--dur-hover) var(--ease-out),color var(--dur-hover) var(--ease-out)}
.btn:hover{background:#855a2e}
.btn:active{background:#5a3a1b}
.btn:focus-visible{outline:none;box-shadow:inset 0 0 0 2px #f2d196}
.btn[disabled]{background:#3a2c1f;color:#8a7c63;cursor:default}
.btn.sea{background:#1f5a58;color:#e7f1e6}
.btn.sea:hover{background:#2a6e6a}
.btn.sea.ready{background:#b98545;color:#1c1106}
.quiet{font-family:var(--serif);font-size:15px;color:var(--ink-2);padding:10px 6px;transition:color var(--dur-hover) var(--ease-out)}
.quiet:hover{color:var(--ink)}
.quiet:focus-visible{outline:1px dotted var(--ink-2);outline-offset:2px}

#titleUi{position:fixed;left:max(20px,7vw);max-width:min(520px,calc(100vw - 40px));z-index:3}
#titleUi .lede{font-family:var(--serif);font-size:clamp(15px,1.6vw,18px);line-height:1.75;color:#d7ece6;text-shadow:0 1px 2px rgba(0,20,24,.8)}
#titleUi .acts{display:flex;gap:14px;align-items:center;margin-top:22px;flex-wrap:wrap}
#titleUi .fine{margin-top:16px;font-size:13px;color:#8fb8b0}

.panel{position:fixed;z-index:4;left:16px;top:16px;width:318px;max-height:calc(100% - 32px);overflow:auto;
  padding:20px 22px 34px 22px;background:var(--wood-panel);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 30px),calc(100% - 7px) calc(100% - 22px),calc(100% - 15px) calc(100% - 9px),calc(100% - 31px) calc(100% - 4px),calc(100% - 40px) 100%,0 100%);
  box-shadow:inset 0 1px 0 rgba(255,220,170,.08)}
.panel.sea{background:var(--sea-panel);box-shadow:inset 0 1px 0 rgba(180,240,225,.08)}
.panel h2{font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:.06em;line-height:1.3}
.panel h2 small{display:block;font-size:14px;font-weight:400;letter-spacing:.02em;color:var(--ink-2);margin-top:3px}

#mini{display:block;margin-top:12px}

#bDig{font-size:17px;padding:16px 26px}
#cap{position:fixed;z-index:5;left:0;right:0;top:15vh;text-align:center;pointer-events:none;opacity:0;transform:translateY(6px);
  transition:opacity var(--dur-enter) var(--ease-out),transform var(--dur-enter) var(--ease-out);padding:0 20px}
#cap.on{opacity:1;transform:none}
#cap b{display:block;font-family:var(--serif);font-size:clamp(22px,3vw,32px);letter-spacing:.08em;color:#f3e8cf;text-shadow:0 1px 2px rgba(0,12,16,.9),0 2px 14px rgba(0,12,16,.6)}
#cap span{display:block;margin-top:8px;font-size:15px;color:#e0eee8;text-shadow:0 1px 2px rgba(0,12,16,.95),0 1px 10px rgba(0,12,16,.7)}
#toast{position:fixed;z-index:6;left:50%;bottom:max(92px,calc(env(safe-area-inset-bottom) + 92px));transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px));
  font-size:14.5px;line-height:1.55;color:#f1e6cc;background:rgba(10,20,20,.88);padding:10px 16px;pointer-events:none;opacity:0;transition:opacity 260ms var(--ease-out);text-align:center}

#fade.on{opacity:1}
[hidden]{display:none!important}

@media (max-width:760px){
  .panel{left:8px;right:8px;top:max(8px,env(safe-area-inset-top));width:auto;max-height:40vh;padding:14px 16px 30px}

  .panel h2 small{display:inline;margin:0 0 0 8px;font-size:13px}
  .panel p{font-size:13.5px;margin-top:8px;line-height:1.6}
  .panel .fx{font-size:13.5px;margin-top:8px}
  .panel .read{margin-top:8px;font-size:13px}
  .panel .read b{font-size:15px}
  .panel .acts{margin-top:10px}
  .btn{font-size:15px;padding:10px 16px 11px}
  #toast{bottom:auto;top:max(96px,calc(env(safe-area-inset-top) + 96px))}
  body.dv #toast{top:auto;bottom:max(88px,calc(env(safe-area-inset-bottom) + 88px))}
  #hud{bottom:max(14px,env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){
  #cap,#toast,#fade{transition-duration:1ms}
}
</style>

<body>
<canvas id="gl" hidden aria-hidden="true"></canvas>
<canvas id="cv" aria-label="遊戲畫面"></canvas>
<div id="boot">潮水退去中…</div>
<h1 class="sr">沉星機：安提基特拉機械</h1>
<div id="titleUi" hidden>
  <p class="lede">1900 年春，錫米島的採海綿潛水夫在安提基特拉島外海 45 公尺深處，撞見一艘兩千年前的沉船。船骸裡有幾團鏽成綠色的青銅。</p>
  <div class="acts"><button class="btn" id="bStart">潛入海底</button><button class="quiet" id="bCont" hidden></button></div>
  <p class="fine">方向鍵、WASD，或按住畫面移動　·　建議開聲音</p>
</div>
<aside id="panel" class="panel" hidden></aside>
<div id="hud" hidden><button class="btn sea" id="bDig" hidden>撥沙</button><button class="btn sea" id="bUp">上升</button></div>
<div id="cap" aria-live="polite"><b></b><span></span></div>
<div id="toast" role="status" aria-live="polite"></div>
<button id="bSnd" class="quiet">聲音：開</button>
<div id="fade"></div>
<script>
'use strict';
(()=>{
// ======================================================================
// 基本工具
// ======================================================================
const TAU=Math.PI*2, DEG=Math.PI/180;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function hash2(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^h>>>13,1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function vnoise(x,y,s,P){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  let X0=xi,X1=xi+1,Y0=yi,Y1=yi+1;if(P){X0=((X0%P)+P)%P;X1=((X1%P)+P)%P;Y0=((Y0%P)+P)%P;Y1=((Y1%P)+P)%P;}
  return lerp(lerp(hash2(X0,Y0,s),hash2(X1,Y0,s),u),lerp(hash2(X0,Y1,s),hash2(X1,Y1,s),u),v);}
function fbm(x,y,s,o,P){let v=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){v+=a*vnoise(x*f,y*f,s+i*31,P?P*f:0);n+=a;f*=2;a*=.5;}return v/n;}
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
function tile(size,fn){const c=mk(size,size),g=c.getContext('2d'),im=g.createImageData(size,size),d=im.data;
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){const i=(y*size+x)*4,p=fn(x,y);d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];d[i+3]=p[3];}
  g.putImageData(im,0,0);return c;}
function patt(g,t,s=1,ox=0,oy=0){const p=g.createPattern(t,'repeat');if(p&&p.setTransform&&window.DOMMatrix)p.setTransform(new DOMMatrix().translate(ox,oy).scale(s));return p;}
function mixc(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
const css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const SERIF='"Songti TC","Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","PMingLiU",serif';
const GREEK='"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif';
const SANS='system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif';

// ======================================================================
// 畫布
// ======================================================================
const cv=$('#cv'),ctx=cv.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=1,scene=null,rsT=0;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  clearTimeout(rsT);rsT=setTimeout(()=>{scene&&scene.layout&&scene.layout();},60);scene&&scene.layout&&scene.layout();}
addEventListener('resize',resize);

// ======================================================================
// 程序材質（開場時一次產生）
// ======================================================================
const TEX={};
function buildTextures(){
  TEX.grain=tile(256,(x,y)=>{const n=fbm(x/8,y/8,3,4,32),s=hash2(x,y,9);return[40,22,8,n*n*120+(s>.94?55:0)];});
  TEX.lite=tile(256,(x,y)=>{const n=fbm(x/4,y/4,5,3,64),s=hash2(x,y,4);return[255,228,176,(n>.63?(n-.63)*240:0)+(s>.988?110:0)];});
  TEX.patina=tile(512,(x,y)=>{const wx=fbm(x/128,y/128,71,3,4)*2.2,wy=fbm(x/128,y/128,72,3,4)*2.2,n=fbm(x/64+wx,y/64+wy,7,5,8),m=fbm(x/16,y/16,8,3,32),q=hash2(x,y,17),a=smooth(.5,.68,n+m*.14-.07);
    let c=mixc([62,120,100],[126,176,150],m);if(q>.985)c=mixc(c,[30,40,30],.6);return[c[0],c[1],c[2],a*200+(q>.985?60:0)];});
  const hC=(x,y)=>fbm(x/32,y/32,11,5,8)*.65+fbm(x/8,y/8,12,3,32)*.35;
  TEX.crust=tile(256,(x,y)=>{const h=hC(x,y),sh=(h-hC(x+2,y+2))*420,q=hash2(x,y,13);
    let c=mixc([70,78,50],[132,116,76],h);c=mixc(c,[88,140,112],smooth(.56,.72,fbm(x/16,y/16,14,3,16))*.65);if(q>.975)c=mixc(c,[204,190,150],.65);if(q<.02)c=mixc(c,[20,24,14],.6);
    return[c[0]+sh,c[1]+sh,c[2]+sh*.8,255];});
  TEX.sand=tile(256,(x,y)=>{const n=fbm(x/16,y/16,21,4,16),q=hash2(x,y,22),w=fbm(x/4,y/4,23,2,64);let v=146+n*38+w*14;if(q>.965)v+=36;if(q<.03)v-=44;return[v*1.03,v*.93,v*.72,255];});
  TEX.dune=tile(256,(x,y)=>{const n=fbm(x/64,y/64,24,4,4);return n>.5?[255,240,205,(n-.5)*90]:[10,24,22,(.5-n)*150];});
  TEX.rock=tile(256,(x,y)=>{const n=fbm(x/16,y/16,31,5,16),m=fbm(x/4,y/4,32,2,64),q=hash2(x,y,33);let v=62+n*62+m*18;if(q>.97)v+=30;const gg=v*(1.04+(fbm(x/32,y/32,34,3,8)-.5)*.3);return[v*.92,gg,v*.9,255];});
  const P=16,cell=32,pts=[];for(let j=0;j<P;j++)for(let i=0;i<P;i++)pts.push([(i+.15+hash2(i,j,31)*.7)*cell,(j+.15+hash2(i,j,32)*.7)*cell]);
  TEX.caustic=tile(512,(x,y)=>{const ci=Math.floor(x/cell),cj=Math.floor(y/cell);let f1=1e9,f2=1e9;
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){const ii=ci+di,jj=cj+dj,q=pts[((jj+P)%P)*P+((ii+P)%P)];
      const px=q[0]+Math.floor(ii/P)*512,py=q[1]+Math.floor(jj/P)*512,d=Math.hypot(px-x,py-y);if(d<f1){f2=f1;f1=d;}else if(d<f2)f2=d;}
    const e=1-smooth(0,6,f2-f1);return[210,255,240,e*e*255];});
  // 海底的鏽塊：露出一截齒緣
  TEX.lumps=[];for(let k=0;k<6;k++){const S=128,c=mk(S,S),g=c.getContext('2d');g.translate(S/2,S/2+6);
    const f=a=>40*(.8+fbm(Math.cos(a)*1.3+k*9,Math.sin(a)*1.3,40+k,3)*.42);
    g.beginPath();for(let i=0;i<=48;i++){const a=i/48*TAU,r=f(a),X=Math.cos(a)*r*1.15,Y=Math.sin(a)*r*.78;i?g.lineTo(X,Y):g.moveTo(X,Y);}g.closePath();
    g.fillStyle=patt(g,TEX.crust,.55,k*40,k*13);g.fill();g.save();g.clip();
    const lg=g.createRadialGradient(-16,-22,4,0,0,56);lg.addColorStop(0,'rgba(236,240,205,.36)');lg.addColorStop(.55,'rgba(0,0,0,0)');lg.addColorStop(1,'rgba(0,12,10,.6)');g.fillStyle=lg;g.fillRect(-64,-70,128,128);
    const R0=22+k*2.5,a0=-2.7+k*.35;g.strokeStyle='rgba(168,112,56,.9)';g.lineWidth=3.4;g.beginPath();g.arc(4,5,R0,a0,a0+1.4);g.stroke();
    for(let i=0;i<10;i++){const a=a0+i/9*1.4;g.save();g.translate(4+Math.cos(a)*(R0+1.6),5+Math.sin(a)*(R0+1.6));g.rotate(a);g.fillStyle=i%3?'rgba(190,132,66,.95)':'rgba(96,150,122,.9)';g.beginPath();g.moveTo(0,-2.2);g.lineTo(4.2,0);g.lineTo(0,2.2);g.fill();g.restore();}
    g.strokeStyle='rgba(255,226,170,.4)';g.lineWidth=1;g.beginPath();g.arc(4,5,R0-1.8,a0+.1,a0+1.2);g.stroke();
    for(let i=0;i<14;i++){g.fillStyle=`rgba(${hash2(i,k,1)>.5?'214,200,160':'30,34,22'},.6)`;g.beginPath();g.arc((hash2(i,k,2)-.5)*80,(hash2(i,k,3)-.5)*56,.8+hash2(i,k,4)*1.6,0,TAU);g.fill();}
    g.restore();TEX.lumps.push(c);}
}

// ======================================================================
// 聲音：全部以 WebAudio 即時合成
// ======================================================================
const AU={c:null,on:true,bus:{},mood:'title',next:0,step:0,idx:6,ks:{},amb:{},scr:null,dig:null,lastTick:0,swell:0};
const SCALE=[38,45,50,52,53,55,57,59,60,62,64,65,67,69,71,72,74,76];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function auInit(){
  if(AU.c){if(AU.c.state==='suspended'&&!document.hidden)AU.c.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  let c;try{c=new AC();}catch(e){return;}
  AU.c=c;const sr=c.sampleRate;
  const master=c.createGain();master.gain.value=AU.on?.9:0;AU.master=master;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-15;comp.knee.value=10;comp.ratio.value=3.2;master.connect(comp);comp.connect(c.destination);
  const uw=c.createBiquadFilter();uw.type='lowpass';uw.frequency.value=16000;uw.Q.value=.5;uw.connect(master);AU.uw=uw;

const WW=2600,BED=1000,PXM=22,BOATX=880;
const bedS=[];const WORLD={};
function bedY(x){const i=clamp(x/8,0,bedS.length-1.001),i0=Math.floor(i);return lerp(bedS[i0],bedS[i0+1],i-i0);}
function waveY(x,t){return 3*Math.sin(x*.012+t*1.1)+2*Math.sin(x*.031-t*1.7)+1.1*Math.sin(x*.07+t*2.3);}
function buildWorld(){
  for(let x=0;x<=WW+16;x+=8){let y=BED+(fbm(x*.0024,.5,3,3)-.5)*110+(fbm(x*.02,3.3,5,2)-.5)*12;const dw=(x-1360)/380;y-=Math.max(0,1-dw*dw)*30;bedS.push(y);}
  const R=rng(1900);
  WORLD.rocks=[];for(let i=0;i<34;i++){let x=R()*WW;if(x>1060&&x<1680)x+=R()<.5?-640:640;const r=14+R()*42,pts=[];
    for(let k=0;k<9;k++){const a=Math.PI+k/8*Math.PI;pts.push([Math.cos(a)*r*(.8+R()*.35),Math.sin(a)*r*(.55+R()*.4)]);}
    WORLD.rocks.push({x,y:bedY(x)+r*.25,r,pts,s:.7+R()*.3});}
  WORLD.far=[];for(let x=-200;x<WW+400;x+=60)WORLD.far.push([x,BED-120-fbm(x*.003,9,9,3)*260]);
  WORLD.ribs=[];for(let i=0;i<14;i++){const x=1100+i*40+R()*8,h=(i%4===1?40:70)+R()*120,br=R()<.35;WORLD.ribs.push({x,h:br?h*.5:h,lean:(R()-.5)*.35,back:false});
    WORLD.ribs.push({x:x+18,h:h*.8+30,lean:(R()-.5)*.3,back:true});}
  WORLD.planks=[];for(let i=0;i<7;i++){const x=1040+R()*660;WORLD.planks.push({x,len:60+R()*110,a:(R()-.5)*.5,w:6+R()*4});}
  WORLD.amph=[];for(let i=0;i<22;i++){let x=980+R()*860;if(i>17)x=R()<.5?700+R()*200:1900+R()*220;WORLD.amph.push({x,a:(R()<.5?1:-1)*(Math.PI/2+(R()-.5)*.5)+(R()<.15?Math.PI/2:0),s:.9+R()*.35,c:R()});}
  WORLD.statues=[{x:1790,kind:'marble',a:-.1},{x:1235,kind:'bronze',a:.25},{x:960,kind:'marble2',a:.2}];
  WORLD.grass=[];for(let x=40;x<WW;x+=5){if(x>1020&&x<1720)continue;const d=fbm(x*.006,7,17,3);if(d<.46)continue;const n=1+(d>.58?2:0);
    for(let k=0;k<n;k++)WORLD.grass.push({x:x+R()*5,h:26+R()*46*d,ph:R()*TAU,w:1.6+R()*1.2});}
  WORLD.fish=[];for(let s=0;s<3;s++){const school={bx:500+s*800,by:BED-170-s*40,sp:.6+s*.25,ph:s*2,f:[]};for(let i=0;i<13;i++)school.f.push({ox:(R()-.5)*90,oy:(R()-.5)*44,ph:R()*TAU,s:.7+R()*.5});WORLD.fish.push(school);}
  WORLD.ripples=[];for(let x=20;x<WW;x+=11+R()*9){if(R()<.25)continue;WORLD.ripples.push({x,w:8+R()*14,o:2+R()*10});}
  WORLD.pebbles=[];for(let i=0;i<280;i++)WORLD.pebbles.push({x:R()*WW,o:1+R()*14,r:1+R()*3.4,c:R(),sh:R()<.12});
  WORLD.sponges=[];for(const r of WORLD.rocks){if(R()<.6)WORLD.sponges.push({rock:r,ox:(R()-.5)*r.r*.9,s:4+R()*6,c:R()});if(R()<.35)WORLD.sponges.push({rock:r,ox:(R()-.5)*r.r*.8,urchin:true});}
  WORLD.snow=[];for(let i=0;i<140;i++)WORLD.snow.push({x:R(),y:R(),z:.4+R()*.9,r:.5+R()*1.4});
}
const SPOTS=[930,1010,1085,1150,1215,1290,1360,1430,1500,1565,1640,1720,1800,1180,1395,1612,870,1850];

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawAmphora(g,a){const s=a.s;g.save();g.translate(a.x,bedY(a.x)-7*s);g.rotate(a.a);g.scale(s,s);
  const base=a.c<.5?[132,82,56]:[112,72,50],lit=mixc(base,[255,210,170],.25),dk=mixc(base,[20,10,6],.55);
  const body=()=>{g.beginPath();g.moveTo(-3.4,-27);g.bezierCurveTo(-12.5,-24,-13,-8,-7.4,8);g.quadraticCurveTo(-3.2,20,0,31);g.quadraticCurveTo(3.2,20,7.4,8);g.bezierCurveTo(13,-8,12.5,-24,3.4,-27);g.closePath();};
  body();const lg=g.createLinearGradient(-13,0,13,0);lg.addColorStop(0,css(lit));lg.addColorStop(.35,css(base));lg.addColorStop(1,css(dk));g.fillStyle=lg;g.fill();
  g.save();body();g.clip();g.globalAlpha=.5;g.fillStyle=patt(g,TEX.crust,.22,a.x,0);g.fillRect(-14,-4+a.c*8,28,40);g.globalAlpha=1;
  g.strokeStyle='rgba(236,230,212,.7)';g.lineWidth=.7;g.lineCap='round';for(let i=0;i<4;i++){const yy=-18+i*9+a.c*4,xx=-6+((i*37+a.c*50)%12);g.beginPath();g.moveTo(xx,yy);g.bezierCurveTo(xx+3,yy-3,xx+5,yy+2,xx+7,yy-1);g.stroke();}
  g.strokeStyle='rgba(255,232,200,.18)';g.lineWidth=1.6;g.beginPath();g.moveTo(-7,-20);g.bezierCurveTo(-10,-8,-7,4,-3.5,14);g.stroke();g.restore();
  const ng=g.createLinearGradient(-4,0,4,0);ng.addColorStop(0,css(lit));ng.addColorStop(1,css(dk));g.fillStyle=ng;g.fillRect(-3.4,-35,6.8,9);
  g.fillStyle=css(mixc(base,[255,215,175],.2));g.beginPath();g.ellipse(0,-35.5,4.8,1.8,0,0,TAU);g.fill();g.fillStyle='#1c100a';g.beginPath();g.ellipse(0,-35.8,3,1,0,0,TAU);g.fill();
  g.strokeStyle=css(mixc(base,[20,10,6],.3));g.lineWidth=1.8;g.lineCap='round';g.beginPath();g.moveTo(-3.4,-32);g.bezierCurveTo(-9,-32,-9.4,-27,-8.4,-21.5);g.moveTo(3.4,-32);g.bezierCurveTo(9,-32,9.4,-27,8.4,-21.5);g.stroke();
  g.restore();}
function drawStatue(g,s){const y=bedY(s.x);g.save();g.translate(s.x,y-9);g.rotate(s.a);
  if(s.kind==='bronze'){
    const lim=(x0,y0,x1,y1,w0,w1)=>{const a=Math.atan2(y1-y0,x1-x0),nx=-Math.sin(a),ny=Math.cos(a);g.beginPath();g.moveTo(x0+nx*w0,y0+ny*w0);g.lineTo(x1+nx*w1,y1+ny*w1);g.arc(x1,y1,w1,a+Math.PI/2,a-Math.PI/2,true);g.lineTo(x0-nx*w0,y0-ny*w0);g.arc(x0,y0,w0,a-Math.PI/2,a+Math.PI/2,true);g.closePath();
      const lg=g.createLinearGradient(0,-14,0,10);lg.addColorStop(0,'#8a9660');lg.addColorStop(.45,'#4b5733');lg.addColorStop(1,'#1f2615');g.fillStyle=lg;g.fill();g.save();g.clip();g.globalAlpha=.55;g.fillStyle=patt(g,TEX.patina,.3);g.fillRect(-80,-30,160,60);g.restore();};
    lim(-40,2,-4,-2,9,8);lim(-4,-2,26,-8,8,6.5);lim(26,-8,44,-5,6.5,5);
    g.fillStyle='#3d4a2a';for(let i=0;i<4;i++){g.beginPath();g.ellipse(48+i*.5,-8+i*2.4,4.5,1.3,.2,0,TAU);g.fill();}
    g.strokeStyle='rgba(220,236,180,.32)';g.lineWidth=1.2;g.lineCap='round';g.beginPath();g.moveTo(-38,-5);g.lineTo(-4,-9);g.lineTo(24,-13);g.stroke();}
  else{const lg=g.createLinearGradient(0,-16,0,14);lg.addColorStop(0,'#dcd8ca');lg.addColorStop(.5,'#aaa696');lg.addColorStop(1,'#5c5a4f');
    g.fillStyle=lg;g.beginPath();g.moveTo(-46,6);g.bezierCurveTo(-50,-12,-30,-16,-10,-14);g.bezierCurveTo(12,-18,34,-12,48,-4);g.quadraticCurveTo(56,4,44,10);g.lineTo(-40,12);g.closePath();g.fill();
    g.strokeStyle='rgba(80,78,68,.45)';g.lineWidth=1.1;for(let i=0;i<6;i++){g.beginPath();g.moveTo(-26+i*12,-12+i%2*2);g.quadraticCurveTo(-20+i*12,0,-28+i*12,10);g.stroke();}
    g.strokeStyle='rgba(255,255,245,.35)';g.lineWidth=1;g.beginPath();g.moveTo(-40,-8);g.bezierCurveTo(-26,-15,10,-16,40,-6);g.stroke();
    g.fillStyle='rgba(110,150,110,.35)';g.beginPath();g.ellipse(-12,-10,10,3,0,0,TAU);g.ellipse(22,-10,6,2,0,0,TAU);g.fill();
    if(s.kind==='marble2'){const hg=g.createRadialGradient(-57,-3,1,-54,0,10);hg.addColorStop(0,'#e0dccf');hg.addColorStop(1,'#77746a');g.fillStyle=hg;g.beginPath();g.arc(-54,0,9,0,TAU);g.fill();}}
  g.restore();}
function drawRib(g,r){const y=bedY(r.x)+4,ex=r.x-4+r.lean*r.h,ey=y-r.h,c1x=r.x-24,c1y=y-r.h*.5,c2x=r.x-14+r.lean*r.h,c2y=y-r.h*.85;g.save();g.lineCap='round';
  const path=(o)=>{g.beginPath();g.moveTo(r.x+o,y);g.bezierCurveTo(c1x+o,c1y,c2x+o,c2y,ex+o,ey);};
  const w=r.back?6:9;path(0);g.strokeStyle=r.back?'#1d2019':'#2a2419';g.lineWidth=w;g.stroke();
  if(!r.back){path(.6);g.strokeStyle='#4b3d28';g.lineWidth=w*.5;g.stroke();path(-1.8);g.strokeStyle='rgba(150,182,128,.34)';g.lineWidth=w*.24;g.stroke();
    g.fillStyle='#5f4c33';g.beginPath();g.ellipse(ex,ey,w*.46,w*.3,r.lean,0,TAU);g.fill();g.fillStyle='rgba(20,14,8,.5)';g.beginPath();g.ellipse(ex+.6,ey+.4,w*.25,w*.15,r.lean,0,TAU);g.fill();
    for(let i=1;i<6;i++){const t=i/6,bx=bz(r.x,c1x,c2x,ex,t),by=bz(y,c1y,c2y,ey,t);
      if(i%2){g.strokeStyle='rgba(226,222,202,.55)';g.lineWidth=.7;g.beginPath();g.arc(bx+2,by,2.2,.4,3.6);g.stroke();}
      else{g.fillStyle='rgba(98,132,84,.7)';g.beginPath();g.ellipse(bx-1,by,3.4,1.8,.3,0,TAU);g.fill();}
      g.fillStyle='rgba(40,30,18,.9)';g.beginPath();g.arc(bx+.5,by+3,.9,0,TAU);g.fill();}}
  g.restore();}
function drawRock(g,r){g.save();g.translate(r.x,r.y);g.beginPath();r.pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();
  g.fillStyle=patt(g,TEX.rock,.45,r.x,r.r);g.fill();
  const lg=g.createLinearGradient(-r.r*.4,-r.r*.7,r.r*.35,r.r*.4);lg.addColorStop(0,'rgba(200,232,212,.26)');lg.addColorStop(.5,'rgba(0,0,0,.08)');lg.addColorStop(1,'rgba(4,14,14,.72)');g.fillStyle=lg;g.fill();
  g.save();g.clip();for(let i=0;i<7;i++){const x=(i/6-.5)*r.r*1.4,yy=-r.r*.55*Math.sqrt(Math.max(0,1-(x/r.r)**2));g.fillStyle=i%2?'rgba(96,120,62,.5)':'rgba(120,112,60,.4)';g.beginPath();g.ellipse(x,yy+1,r.r*.2,r.r*.08,0,0,TAU);g.fill();}g.restore();
  g.strokeStyle='rgba(215,238,224,.2)';g.lineWidth=1;g.beginPath();r.pts.slice(2,7).forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.stroke();
  g.restore();}
// 採海綿的潛水夫要找的就是這些
function drawSponge(g,sp){const r=sp.rock,x=r.x+sp.ox,y=r.y-r.r*.55*Math.sqrt(Math.max(0,1-(sp.ox/r.r)**2))+2;
  if(sp.urchin){g.strokeStyle='#221519';g.lineWidth=.7;for(let i=0;i<15;i++){const a=Math.PI+i/14*Math.PI;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*6.5,y+Math.sin(a)*6.5);g.stroke();}g.fillStyle='#2e1d24';g.beginPath();g.arc(x,y,3.2,Math.PI,TAU);g.fill();return;}
  const s=sp.s,col=sp.c<.5?[152,112,62]:[122,98,70],lg=g.createRadialGradient(x-s*.3,y-s*.9,1,x,y-s*.4,s*1.3);lg.addColorStop(0,css(mixc(col,[236,208,160],.38)));lg.addColorStop(1,css(mixc(col,[20,14,8],.5)));
  g.fillStyle=lg;g.beginPath();g.moveTo(x-s,y);g.bezierCurveTo(x-s*1.15,y-s*1.35,x+s*1.15,y-s*1.45,x+s,y);g.closePath();g.fill();
  g.fillStyle='rgba(40,26,14,.6)';for(let i=0;i<5;i++){g.beginPath();g.arc(x+(i-2)*s*.34,y-s*.55-(i%2)*s*.22,s*.08+.4,0,TAU);g.fill();}}
// 1900 年的標準潛水服：銅頭盔、帆布潛水衣、前後鉛塊與鉛靴
function drawDiver(g,d,t){const DS=1.2;g.save();g.translate(d.x,d.y);g.scale(d.face*DS,DS);g.translate(0,Math.sin(t*1.7)*.5);
  const w=Math.sin(d.walk),fan=d.fan;g.lineCap='round';g.lineJoin='round';
  const cloth=dark=>{const lg=g.createLinearGradient(-12,-20,12,10);lg.addColorStop(0,dark?'#6a6350':'#978d72');lg.addColorStop(.55,dark?'#4a4538':'#6c6450');lg.addColorStop(1,dark?'#2b2820':'#3d392d');return lg;};
  const leg=(sw,dark)=>{const kx=Math.sin(sw)*9,ky=14,ax=kx+Math.sin(sw*.4)*3-1,ay=23;
    g.strokeStyle=cloth(dark);g.lineWidth=7.5;g.beginPath();g.moveTo(0,4);g.lineTo(kx,ky);g.lineTo(ax,ay);g.stroke();
    g.strokeStyle=dark?'rgba(28,24,18,.85)':'rgba(44,38,28,.85)';g.lineWidth=7.8;g.beginPath();g.moveTo(kx-.2,ky-1.8);g.lineTo(kx+.2,ky+1.8);g.stroke();
    g.save();g.translate(ax,ay);g.fillStyle=dark?'#141311':'#25231e';rr(g,-5,-1.5,13,6.6,2);g.fill();g.fillStyle=dark?'#5b4322':'#a87e44';rr(g,4.8,-1,3.8,5.2,1.6);g.fill();
    g.fillStyle='#0b0a09';g.fillRect(-5.4,4.4,14,1.4);g.strokeStyle=dark?'#3a3020':'#6a5838';g.lineWidth=.9;g.beginPath();g.moveTo(-3.6,-1.2);g.lineTo(3.4,-1.2);g.moveTo(-3.6,1.6);g.lineTo(3.4,1.6);g.stroke();g.restore();};
  const armF=(a,dark)=>{const sx=2,sy=-13,ex=sx+Math.cos(a)*8,ey=sy+Math.sin(a)*8+2,hx=ex+Math.cos(a-.5)*7,hy=ey+Math.sin(a-.5)*7;
    g.strokeStyle=cloth(dark);g.lineWidth=6.4;g.beginPath();g.moveTo(sx,sy);g.lineTo(ex,ey);g.lineTo(hx,hy);g.stroke();
    g.strokeStyle='#1a1813';g.lineWidth=5.4;g.beginPath();g.moveTo(hx-Math.cos(a-.5)*1.6,hy-Math.sin(a-.5)*1.6);g.lineTo(hx,hy);g.stroke();
    g.fillStyle=dark?'#6d5a4c':'#9c7c64';g.beginPath();g.ellipse(hx+Math.cos(a-.5)*2.6,hy+Math.sin(a-.5)*2.6,2.9,2.2,a,0,TAU);g.fill();};
  const arm=fan>0?Math.sin(fan)*.9+.2:.55+Math.sin(t*1.3)*.08;
  leg(-w*.5,true);armF(fan>0?arm+.6:1.25+Math.sin(t*1.3+1)*.08,true);
  const bw=g.createLinearGradient(-14,-16,-9,-4);bw.addColorStop(0,'#6a6e72');bw.addColorStop(1,'#2e3134');g.fillStyle=bw;rr(g,-14.5,-16,5,12,1.6);g.fill();
  g.fillStyle=cloth(false);g.beginPath();g.moveTo(-11,-18);g.quadraticCurveTo(-14,-4,-10,6);g.lineTo(9,6);g.quadraticCurveTo(13,-4,11,-18);g.closePath();g.fill();
  g.strokeStyle='rgba(30,26,18,.45)';g.lineWidth=.8;g.beginPath();g.moveTo(-6,-12);g.quadraticCurveTo(-8,-4,-5,3);g.moveTo(1,-10);g.quadraticCurveTo(3,-4,1,4);g.moveTo(-2,-16);g.lineTo(-2,5);g.stroke();
  g.strokeStyle='rgba(255,240,210,.2)';g.lineWidth=1.2;g.beginPath();g.moveTo(-10.5,-16);g.quadraticCurveTo(-13,-6,-10,4);g.stroke();
  leg(w*.5,false);
  g.fillStyle='#29241b';g.fillRect(-11,1,21,4);g.fillStyle='#bd8f4e';rr(g,3,1.3,4,3.4,.8);g.fill();
  const lw=g.createLinearGradient(8,-16,13,-4);lw.addColorStop(0,'#848a8e');lw.addColorStop(1,'#33373a');g.fillStyle=lw;rr(g,7.5,-16,5.6,11,1.8);g.fill();
  g.fillStyle='rgba(255,255,255,.25)';g.fillRect(8.3,-15,1,9);
  if(d.bag>0){g.save();g.translate(-12,2);g.fillStyle='rgba(60,52,36,.6)';g.beginPath();g.ellipse(0,4,5.6,7.6,0,0,TAU);g.fill();
    for(let i=0;i<Math.min(4,d.bag);i++){g.fillStyle=i%2?'#6f8f72':'#7c7250';g.beginPath();g.arc(-1.5+(i%2)*3,1+i*2.6,2,0,TAU);g.fill();}
    g.save();g.beginPath();g.ellipse(0,4,5.6,7.6,0,0,TAU);g.clip();g.strokeStyle='#8a7a58';g.lineWidth=.55;for(let k=-8;k<12;k+=2.6){g.beginPath();g.moveTo(-6,k);g.lineTo(6,k+6);g.moveTo(-6,k+6);g.lineTo(6,k);g.stroke();}g.restore();g.restore();}
  armF(arm,false);
  const cg=g.createLinearGradient(-12,-26,12,-15);cg.addColorStop(0,'#e6ab70');cg.addColorStop(.5,'#9d5d2e');cg.addColorStop(1,'#56300f');g.fillStyle=cg;
  g.beginPath();g.moveTo(-13,-16.5);g.quadraticCurveTo(0,-14.5,13,-16.5);g.lineTo(9,-23.5);g.quadraticCurveTo(0,-25.5,-9,-23.5);g.closePath();g.fill();
  for(let i=0;i<6;i++){const bx=-11+i*4.4,by=-16.4+Math.abs(i-2.5)*.25;g.fillStyle='#f3cc94';g.beginPath();g.arc(bx,by-.8,.95,0,TAU);g.fill();g.fillStyle='rgba(40,20,6,.6)';g.beginPath();g.arc(bx+.3,by-.45,.5,0,TAU);g.fill();}
  const hx=.5,hy=-32,hr=11.5;
  g.strokeStyle='#8a5a2c';g.lineWidth=3.2;g.beginPath();g.moveTo(-9,-31);g.quadraticCurveTo(-15,-32,-14,-26);g.stroke();g.strokeStyle='rgba(255,220,170,.35)';g.lineWidth=1;g.stroke();
  const hg=g.createRadialGradient(hx-4,hy-5,1,hx,hy,hr);hg.addColorStop(0,'#f4c68f');hg.addColorStop(.35,'#c27f45');hg.addColorStop(.8,'#7c451e');hg.addColorStop(1,'#3d1f0a');g.fillStyle=hg;g.beginPath();g.arc(hx,hy,hr,0,TAU);g.fill();

  g.fillStyle='#9a6a34';g.beginPath();g.ellipse(hx+1,hy-hr+.8,3.6,1.6,0,0,TAU);g.fill();
  const px=hx-.5,py=hy+.5,pr=5.4;g.fillStyle='#d8ab6a';g.beginPath();g.arc(px,py,pr+1.7,0,TAU);g.fill();g.fillStyle='#5c3a18';g.beginPath();g.arc(px+.4,py+.4,pr+.3,0,TAU);g.fill();
  const gl=g.createRadialGradient(px-2,py-2,.5,px,py,pr);gl.addColorStop(0,'#3e6e6b');gl.addColorStop(1,'#0b1d1e');g.fillStyle=gl;g.beginPath();g.arc(px,py,pr,0,TAU);g.fill();

      lines.forEach((ln,i)=>{const y=y0+i*Rp*.155+Rp*.02,ch=String.fromCharCode(0x391+i+k*5);g.fillStyle='rgba(255,228,176,.28)';g.fillText(ch+'  '+ln,x0+1.5,y+2);g.fillStyle='#1a0e04';g.fillText(ch+'  '+ln,x0,y);});});
    const tex=(cv2)=>{const t=new T3.CanvasTexture(cv2);t.colorSpace=T3.SRGBColorSpace;t.anisotropy=GL.r.capabilities.getMaxAnisotropy();return t;};
    for(const [m,cv2] of [[SHOP.frontM,c],[SHOP.backM,bc]]){if(m.map)m.map.dispose();m.map=tex(cv2);m.bumpMap=m.map;m.bumpScale=2.2;m.needsUpdate=true;}},
  draw(){const T=T3,g=ctx,i=this.info(G.days),L=this.lv(),F=this.F,mob=W<760;this.mkTex();glMode('shop');shopTick(1/60);SHOP.mach.visible=true;SHOP.props.visible=!mob;SHOP.lamp.visible=true;
    const bk=this.flip>.5?-1:1;SHOP.lamp.position.set(-.3,0,.26*bk);SHOP.props.position.set(.34,0,.12*bk);SHOP.props.rotation.y=bk>0?0:Math.PI;SHOP.spot.position.set(-.3,.25,.26*bk);SHOP.spot.target.position.set(0,.17,0);SHOP.pl.position.set(-.3,.27,.26*bk);
    // 鏡頭：正面或背面，翻面時繞到後方
    const tgt=this.face==='front'?0:1;this.flip=lerp(this.flip,tgt,1-Math.exp(-(1/60)*(RM?60:3.2)));const e=ease(clamp(this.flip,0,1));
    this.autoT+=1/60;const drift=this.free&&!this.drag?Math.sin(this.autoT*.15)*.22:0;
    const yaw=lerp(.3,Math.PI-.3,e)+drift,pitch=.1,c=GL.cam,fov=30;if(c.fov!==fov){c.fov=fov;c.updateProjectionMatrix();}
    const back=e>.5,Rw=BOX.R,sz=back?[BOX.w*1.12,BOX.h*1.02]:[Rw*2.6,Rw*3.1],tn=Math.tan(fov/2*DEG);
    const dist=Math.max(sz[1]*H/(2*tn*F.h*.94),sz[0]*H/(2*tn*F.w*.94)*1.05);const cy=SHOP.mach.position.y;
    const tz=lerp(BOX.d/2,-BOX.d/2,e);c.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,cy+Math.sin(pitch)*dist,tz+Math.cos(yaw)*Math.cos(pitch)*dist);c.up.set(0,1,0);c.lookAt(0,cy,tz);
    c.setViewOffset(W,H,W/2-(F.x+F.w/2),H/2-(F.y+F.h/2),W,H);c.updateMatrixWorld();
    // 指針
    const ang=lon=>-(lon-90)*DEG;SHOP.sunP.rotation.z=ang(i.sun);SHOP.moonP.visible=L>=2;SHOP.moonP.rotation.z=ang(i.moon);SHOP.ball.rotation.x=L>=3?Math.PI-i.phase*DEG:Math.PI/2;
    const glowK=this.done&&!this.free?.75+.25*Math.sin(this.autoT*4):.55;SHOP.sunS.material.opacity=glowK;SHOP.sun.material.emissiveIntensity=this.done?1.6:1;
    SHOP.sol.visible=!this.free&&this.stageI===0;SHOP.wedge.visible=!this.free&&this.stageI===3;SHOP.wedge.rotation.z=0;
    const s=BOX.R/SHOP.Rp,lun=G.days/SYN,lf=lun-Math.floor(lun);
    const spi=(o,sp,idx)=>{const th=(idx+lf)*sp.D,a=th-Math.PI/2,r=spiralR(sp.r0,sp.gw,th+Math.PI)*s;o.p.rotation.z=-a;o.bead.position.set(r,0,.003);};
    spi(SHOP.met,SHOP.sp1,i.met);SHOP.met.sub.rotation.z=-((i.oly/4)*TAU-Math.PI/2);
    SHOP.sar.p.visible=SHOP.sar.sub.visible=L>=5;if(L>=5){spi(SHOP.sar,SHOP.sp2,i.sar);SHOP.sar.sub.rotation.z=-((((i.lunI%669)+669)%669+lf)/669*TAU-Math.PI/2);}
    SHOP.arm.rotation.x=-G.days/CRANK_DAYS*TAU;

    const P=(o,x,y,z)=>{const v=o.localToWorld(new T.Vector3(x,y,z)).project(c);return[(v.x*.5+.5)*W,(-v.y*.5+.5)*H];};

    if(back){this.c1=P(SHOP.met.g,0,0,0);this.c2=P(SHOP.sar.g,0,0,0);this.R=Math.hypot(...P(SHOP.met.g,BOX.R,0,0).map((v,k)=>v-this.c1[k]));}
    this.hub=P(SHOP.crank,0,0,0);this.knob=P(SHOP.arm,.028,.064,0);this.crankR=Math.max(22,Math.hypot(this.knob[0]-this.hub[0],this.knob[1]-this.hub[1]));
    shopDraw();
    if(SHOP.sol.visible&&!back){const [x,y]=P(SHOP.F,BOX.R*.66,BOX.R*.13,.004);g.font=`600 ${Math.max(12,this.R*.07)}px ${SERIF}`;g.textAlign='center';g.textBaseline='middle';g.fillStyle=this.done?'#cfe7c4':'#f3dca4';g.shadowColor='rgba(0,0,0,.8)';g.shadowBlur=4;g.fillText('夏至',x,y);g.shadowColor='transparent';g.textAlign='left';}
    this.drawSky(g,i);},
  down(x,y){auInit();this.snap=null;const [hx,hy]=this.hub,k=this.knob||this.hub;
    if(Math.hypot(x-k[0],y-k[1])<30||Math.hypot(x-hx,y-hy)<this.crankR*1.2){this.drag={type:'crank',a:Math.atan2(y-hy,x-hx),acc:0};return;}
    const c=this.face==='front'?[this.cx,this.cy]:this.nearestDial(x,y);if(c&&Math.hypot(x-c[0],y-c[1])<this.R*1.05)this.drag={type:'face',c,a:Math.atan2(y-c[1],x-c[0]),acc:0};}
};


// ======================================================================
// 指標事件與主迴圈
// ======================================================================
let ptrId=null;
cv.addEventListener('pointerdown',e=>{auInit();if(ptrId!==null&&ptrId!==e.pointerId)return;ptrId=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(_){}scene&&scene.down&&scene.down(e.clientX,e.clientY,e);});
cv.addEventListener('pointermove',e=>{if(ptrId!==null&&e.pointerId!==ptrId)return;scene&&scene.move&&scene.move(e.clientX,e.clientY,e);});
const endP=e=>{if(e.pointerId!==ptrId)return;ptrId=null;scene&&scene.up&&scene.up(e.clientX,e.clientY,e);};
cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);
cv.addEventListener('wheel',e=>{if(scene===Dials){e.preventDefault();Dials.nudge(e.deltaY>0?1:-1);}},{passive:false});
document.addEventListener('pointerdown',()=>auInit(),{capture:true});

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!document.hidden&&scene){scene.update(dt);scene.draw();audioTick();}requestAnimationFrame(frame);}

$('#bStart').onclick=()=>{auInit();G.stage=0;G.days=0;G.found=new Set();G.finds=[];save();fadeTo(()=>go(DIVE));};
$('#bCont').onclick=()=>{auInit();const s=load();if(!s)return;G.stage=s.stage;G.days=s.days||0;G.finds=s.finds||[];G.found=new Set();fadeTo(()=>go(s.stage>=5?Dials:DIVE));};

async function boot(){resize();buildTextures();initAstro();buildWorld();
  const ok=await load3D();DIVE=ok?Dive3:Dive;TITLE=ok?Title3:Title;
  if(ok){Object.assign(D0,{enter:Dials.enter,prerender:Dials.prerender,layout:Dials.layout,draw:Dials.draw,down:Dials.down});Object.assign(Dials,DIALS3);Dials.gl=Bench.gl=true;}
  const bootEl=$('#boot');bootEl.classList.add('off');setTimeout(()=>bootEl.remove(),700);
  if(!ok&&GL.why)setTimeout(()=>toast(GL.why,6),900);
  const m=/^#(dive|bench|dials)-?(\d)?/.exec(location.hash);
  if(/debug/.test(location.hash))window.__ak={G,Bench,Dive,Dials,go,STAGES,AST,GL,get DIVE(){return DIVE;},get ST(){return ST;},get scene(){return scene;}};
  if(m){const s=Math.max(0,Math.min(5,(+m[2]||1)-1));G.stage=m[1]==='dials'&&+m[2]===6?5:s;
    if(m[1]==='bench'){buildWood();go(Bench);}else if(m[1]==='dials'){buildWood();go(Dials);}else go(DIVE);}
  else go(TITLE);
  requestAnimationFrame(frame);}
boot();
})();
