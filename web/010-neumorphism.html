<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>密碼工坊 — 柔軟的密碼產生器</title>
<meta name="description" content="凹陷字元磚與 neumorphic 滑桿，隨機或好記詞組兩種密碼、中文化破解時間。收錄於 100 Creative HTML Works（010・新擬物 Soft UI）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/web/010-neumorphism.html">
<style>
:root{
  --bg:#e0e5ec; --txt:#4a5568; --mut:#8a94a6; --lt:rgba(255,255,255,.85); --dk:rgba(163,177,198,.75);
  --dig:#5b6fd6; --sym:#d4697c; --ok:#3fae8c;
  --f:"Segoe UI","Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
  --up:9px 9px 18px var(--dk),-9px -9px 18px var(--lt);
  --upS:5px 5px 10px var(--dk),-5px -5px 10px var(--lt);
  --in:inset 6px 6px 12px var(--dk),inset -6px -6px 12px var(--lt);
  --inS:inset 3px 3px 6px var(--dk),inset -3px -3px 6px var(--lt);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;background:var(--bg);color:var(--txt);font-family:var(--f);font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(18px,4vw,48px) clamp(14px,3vw,32px);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:var(--bg);cursor:pointer;-webkit-tap-highlight-color:transparent}

.top{display:flex;align-items:center;gap:14px;margin-bottom:28px;width:min(100%,900px)}
.logo{width:52px;height:52px;border-radius:16px;box-shadow:var(--upS);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
.top h1{font-size:clamp(22px,2.4vw,28px);font-weight:600;letter-spacing:.06em}
.top p{font-size:13px;color:var(--mut);font-weight:400;letter-spacing:.02em}
.top .sp{flex:1}

.card{width:min(100%,900px);border-radius:36px;box-shadow:var(--up);padding:clamp(20px,3.4vw,40px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(22px,3.4vw,44px)}

/* display well */
.well{border-radius:24px;box-shadow:var(--in);padding:22px 22px 18px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.lab{font-size:12px;letter-spacing:.2em;color:var(--mut);display:flex;justify-content:space-between;align-items:center;font-weight:600}
.pw{font-size:clamp(20px,2.5vw,30px);letter-spacing:.06em;line-height:1.35;word-break:break-all;min-height:2.7em;color:#3a4356;font-weight:600}
.pw .d{color:var(--dig)}
.pw .s{color:var(--sym)}
.pw span.roll{opacity:.45}
.pw.hide{letter-spacing:.2em}
.acts{display:flex;gap:14px;margin-top:22px}
.btn{min-height:56px;border-radius:18px;box-shadow:var(--upS);display:flex;align-items:center;justify-content:center;gap:10px;padding:0 20px;font-size:15px;letter-spacing:.06em;transition:box-shadow .16s ease,transform .16s ease,color .2s}
.btn:hover{color:#2f3748}
.btn:active,.btn.pressed{box-shadow:var(--inS);transform:scale(.985)}
.btn:focus-visible,.tile:focus-visible,.seg button:focus-visible,.eye:focus-visible,.hist button:focus-visible{outline:2px solid rgba(91,111,214,.5);outline-offset:4px}
.btn svg{width:20px;height:20px}
.btn.main{flex:1.4}
.btn.main svg{transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.btn.main.spin svg{transform:rotate(360deg)}
.btn.copy{flex:1}
.btn.copy.done{color:var(--ok)}
.eye{width:44px;height:44px;border-radius:14px;box-shadow:var(--upS);display:grid;place-items:center;transition:box-shadow .16s}
.eye[aria-pressed="true"]{box-shadow:var(--inS)}
.eye svg{width:20px;height:20px}

/* strength */
.str{margin-top:26px}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-radius:14px;box-shadow:var(--inS);padding:8px;margin-top:10px}
.meter i{height:10px;border-radius:6px;background:transparent;transition:background .4s,box-shadow .4s}
.meter.l1 i:nth-child(-n+1){background:#e38b8b;box-shadow:0 0 8px rgba(227,139,139,.6)}
.meter.l2 i:nth-child(-n+2){background:#e3b36b;box-shadow:0 0 8px rgba(227,179,107,.6)}
.meter.l3 i:nth-child(-n+3){background:#7fc4a8;box-shadow:0 0 8px rgba(127,196,168,.6)}
.meter.l4 i{background:#4fb391;box-shadow:0 0 8px rgba(79,179,145,.6)}
.verdict{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:14px;flex-wrap:wrap}
.verdict small{color:var(--mut);font-weight:400;font-size:13px}

/* controls */
.ctrls{display:flex;flex-direction:column;gap:22px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;border-radius:18px;box-shadow:var(--inS);padding:6px}
.seg button{min-height:44px;border-radius:13px;font-size:14px;background:transparent;color:var(--mut);transition:box-shadow .2s,color .2s,background .2s}
.seg button[aria-pressed="true"]{background:var(--bg);box-shadow:var(--upS);color:var(--txt)}

.len{display:flex;flex-direction:column;gap:12px}
.len .row{display:flex;justify-content:space-between;align-items:center}
.len .num{width:64px;height:44px;border-radius:14px;box-shadow:var(--inS);display:grid;place-items:center;font-size:20px;color:#3a4356}
.slider{position:relative;height:44px;touch-action:none;cursor:pointer;outline:none}
.slider .track{position:absolute;left:0;right:0;top:50%;height:14px;margin-top:-7px;border-radius:10px;box-shadow:var(--inS)}
.slider .fill{position:absolute;left:4px;top:50%;height:6px;margin-top:-3px;border-radius:4px;background:linear-gradient(90deg,#9aa8e8,var(--dig))}
.slider .knob{position:absolute;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--bg);box-shadow:var(--upS);transition:box-shadow .15s}
.slider .knob::after{content:"";position:absolute;inset:11px;border-radius:50%;box-shadow:var(--inS)}
.slider.drag .knob{box-shadow:3px 3px 6px var(--dk),-3px -3px 6px var(--lt)}
.slider:focus-visible .knob{outline:2px solid rgba(91,111,214,.5);outline-offset:4px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{aspect-ratio:1;border-radius:18px;box-shadow:var(--upS);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:19px;transition:box-shadow .18s ease,color .2s;min-height:56px}
.tile small{font-size:11px;color:var(--mut);font-weight:400;letter-spacing:.04em}
.tile[aria-pressed="true"]{box-shadow:var(--in);color:var(--dig)}
.tile[aria-pressed="true"] small{color:var(--dig)}
.tile.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.sw small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.tg{width:62px;height:34px;border-radius:20px;box-shadow:var(--inS);position:relative;flex:none;background:var(--bg)}
.tg::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--bg);box-shadow:3px 3px 6px var(--dk),-3px -3px 6px var(--lt);transition:left .35s cubic-bezier(.4,1.5,.5,1),background .3s}
.tg[aria-checked="true"]::after{left:32px;background:radial-gradient(circle,var(--dig) 0 4px,#e9edf4 5px)}
.tg[aria-checked="true"]{box-shadow:var(--inS),inset 0 0 0 20px rgba(91,111,214,.08)}

/* history */
.hist{grid-column:1 / -1;border-radius:22px;box-shadow:var(--inS);padding:14px 16px}
.hist ul{list-style:none;display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.hist button{min-height:40px;padding:0 14px;border-radius:12px;box-shadow:var(--upS);font-size:13px;letter-spacing:.04em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:box-shadow .16s}
.hist button:active{box-shadow:var(--inS)}
.hist .empty{font-size:13px;color:var(--mut);font-weight:400}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;padding:14px 22px;border-radius:18px;background:var(--bg);box-shadow:var(--up);font-size:14px;transition:opacity .3s,transform .4s cubic-bezier(.3,1.4,.5,1);pointer-events:none;z-index:5;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.foot{margin-top:26px;font-size:12px;color:var(--mut);font-weight:400;text-align:center;line-height:1.7;max-width:640px}

@media (max-width:760px){
  .card{grid-template-columns:minmax(0,1fr);border-radius:28px}
  .tiles{gap:10px}
  .tile{border-radius:14px;font-size:17px}
  .top{margin-bottom:20px}
  .top .sp,.top .kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#5b6fd6" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.6" fill="#5b6fd6"/></svg></div>
  <div><h1>密碼工坊</h1><p>軟軟的外表，硬硬的密碼</p></div>
  <span class="sp"></span>
  <p class="kbd">按 <b>R</b> 重新產生 · <b>C</b> 複製</p>
</header>

<main class="card">
  <section>
    <div class="well">
      <div class="lab"><span>你的新密碼</span><button class="eye" id="eye" aria-pressed="false" aria-label="隱藏密碼"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" id="eyeIc"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <div class="pw" id="pw" aria-live="polite"></div>
    </div>
    <div class="acts">
      <button class="btn main" id="gen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>重新產生</button>
      <button class="btn copy" id="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span id="copyT">複製</span></button>
    </div>
    <div class="str">
      <div class="lab"><span>強度</span><span id="bits">— bits</span></div>
      <div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="verdict"><span id="vword">—</span><small id="vtime">—</small></div>
    </div>
  </section>

  <section class="ctrls">
    <div class="seg" role="group" aria-label="模式"><button id="mChars" aria-pressed="true">隨機字元</button><button id="mWords" aria-pressed="false">好記詞組</button></div>

    <div class="len">
      <div class="row"><span class="lab" id="lenLab" style="margin:0">長度</span><span class="num" id="lenN">20</span></div>
      <div class="slider" id="slider" role="slider" tabindex="0" aria-labelledby="lenLab" aria-valuemin="8" aria-valuemax="64" aria-valuenow="20"><div class="track"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
    </div>

    <div class="tiles" id="tiles" role="group" aria-label="字元種類">
      <button class="tile" data-k="upper" aria-pressed="true">AZ<small>大寫</small></button>
      <button class="tile" data-k="lower" aria-pressed="true">az<small>小寫</small></button>
      <button class="tile" data-k="digit" aria-pressed="true">09<small>數字</small></button>
      <button class="tile" data-k="symbol" aria-pressed="false">#%<small>符號</small></button>
    </div>

    <div class="sw"><span>排除易混淆字元<small>不要 0 O o 1 l I | 這些分不清的傢伙</small></span><button class="tg" role="switch" aria-checked="true" id="amb" aria-label="排除易混淆字元"></button></div>
  </section>

  <section class="hist" aria-label="最近產生">
    <div class="lab"><span>最近產生 · 點一下即複製</span><span>只存在這個分頁，關掉就忘</span></div>
    <ul id="hist"><li class="empty">還沒有紀錄。按「重新產生」試試看。</li></ul>
  </section>
</main>

<p class="foot">所有密碼都在你的瀏覽器裡用 <b>crypto.getRandomValues</b> 產生，不會上傳到任何地方。<br>破解時間以每秒一百億次猜測估算——大約是一整櫃顯示卡加上一位很有耐心的壞人。</p>
<div class="toast" id="toast" role="status" aria-live="polite"><i></i><span id="toastT">已複製</span></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var SETS={upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',lower:'abcdefghijklmnopqrstuvwxyz',digit:'0123456789',symbol:'!@#$%^&*-_=+?~;:'};
  var AMB=/[0Oo1lI|]/g;
  var WORDS=('tofu lantern velvet mango typhoon scooter noodle harbor pepper cactus kettle ferry lychee pagoda sesame orbit comet tundra marble walnut badger panda bamboo cobalt copper falcon glacier hammock jasmine kiwi lemur magnet nectar oyster parrot quartz radish saddle tulip umbra violin waffle yogurt zephyr anchor biscuit candle dragon ember fig ginger honey igloo jungle koala ladder meadow nimbus olive pickle quiver rocket silver tempo unicorn vapor willow xylo yarrow zigzag dumpling bubble teapot scallion ').trim().split(/\s+/);
  var S={mode:'chars',len:20,upper:true,lower:true,digit:true,symbol:false,amb:true,hide:false,pw:''};
  var hist=[];

  function rnd(n){var a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n,x;do{crypto.getRandomValues(a);x=a[0];}while(x>=lim);return x%n;}
  function pool(){var p='';['upper','lower','digit','symbol'].forEach(function(k){if(S[k])p+=SETS[k];});if(S.amb)p=p.replace(AMB,'');return p;}
  function generate(){
    if(S.mode==='words'){
      var n=Math.max(3,Math.min(8,Math.round(S.len/6))),w=[];
      for(var i=0;i<n;i++){var x=WORDS[rnd(WORDS.length)];if(S.upper&&rnd(2))x=x.charAt(0).toUpperCase()+x.slice(1);w.push(x);}
      if(S.digit) w.splice(rnd(w.length+1),0,String(10+rnd(90)));
      return w.join(S.symbol?['-','.','_','~'][rnd(4)]:'-');
    }
    var p=pool(),out=[];
    /* guarantee at least one of each chosen class */
    ['upper','lower','digit','symbol'].forEach(function(k){if(S[k]){var set=S.amb?SETS[k].replace(AMB,''):SETS[k];out.push(set.charAt(rnd(set.length)));}});
    while(out.length<S.len) out.push(p.charAt(rnd(p.length)));
    for(var j=out.length-1;j>0;j--){var r=rnd(j+1),t=out[j];out[j]=out[r];out[r]=t;}
    return out.slice(0,S.len).join('');
  }
  function entropy(){
    if(S.mode==='words'){var n=Math.max(3,Math.min(8,Math.round(S.len/6)));return n*Math.log2(WORDS.length)+(S.upper?n:0)+(S.digit?Math.log2(90*(n+1)):0)+(S.symbol?2:0);}
    return S.len*Math.log2(Math.max(2,pool().length));
  }
  function human(bits){
    var sec=Math.pow(2,bits-1)/1e10;
    var units=[[1,'秒'],[60,'分鐘'],[3600,'小時'],[86400,'天'],[31557600,'年']],u=units[0];
    for(var i=0;i<units.length;i++) if(sec>=units[i][0]) u=units[i];
    var v=sec/u[0];
    if(u[1]==='年'){var big=[[1e16,'京'],[1e12,'兆'],[1e8,'億'],[1e4,'萬']];for(var k=0;k<big.length;k++){if(v>=big[k][0]){var q=v/big[k][0];if(q>=1e4&&k===0) return '比宇宙年齡還久上好幾輪';return '約 '+(q<10?q.toFixed(1):Math.round(q))+' '+big[k][1]+'年';}}}
    if(sec<1) return '一眨眼就被猜中';
    return '約 '+(v<10?v.toFixed(1):Math.round(v))+' '+u[1];
  }
  function esc(c){return c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':c;}
  function paint(str,rolling){
    var el=$('pw'); if(!el) return;
    if(S.hide){el.classList.add('hide');el.textContent=str.replace(/./g,'•');return;}
    el.classList.remove('hide');
    el.innerHTML=str.split('').map(function(c,i){var cls=/[0-9]/.test(c)?'d':/[A-Za-z]/.test(c)?'':'s';if(rolling&&rolling[i])cls+=' roll';return '<span class="'+cls+'">'+esc(c)+'</span>';}).join('');
  }
  var rollT=null;
  function regen(animate){
    var target=generate(); S.pw=target;
    var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    clearInterval(rollT);
    if(!animate||reduce||S.hide){paint(target);after();return;}
    var p=pool()||'abc',frame=0,total=12;
    rollT=setInterval(function(){
      frame++; var settled=Math.floor(target.length*frame/total), roll={};
      var s=target.split('').map(function(c,i){if(i<settled)return c;roll[i]=1;return p.charAt(rnd(p.length));}).join('');
      paint(s,roll);
      if(frame>=total){clearInterval(rollT);paint(target);}
    },38);
    after();
  }
  function after(){
    var b=entropy(),lvl=b<40?1:b<60?2:b<90?3:4;
    var m=$('meter'); if(m) m.className='meter l'+lvl;
    if($('bits')) $('bits').textContent=Math.round(b)+' bits';
    if($('vword')) $('vword').textContent=['','脆弱，像豆腐','普通，像饅頭','強壯，像牛軋糖','非常強，像鑽石'][lvl];
    if($('vtime')) $('vtime').textContent='暴力破解 '+human(b);
    hist.unshift(S.pw); hist=hist.filter(function(v,i,a){return a.indexOf(v)===i;}).slice(0,6);
    renderHist();
  }
  function renderHist(){
    var h=$('hist'); if(h) h.innerHTML=hist.slice(1).length?hist.slice(1).map(function(p){return '<li><button data-p="'+p.replace(/"/g,'&quot;')+'">'+(S.hide?p.slice(0,3)+'•••••':p.replace(/</g,'&lt;'))+'</button></li>';}).join(''):'<li class="empty">還沒有紀錄。按「重新產生」試試看。</li>';
  }

  /* copy */
  var tt;
  function toast(t){var el=$('toast');if(!el)return;if($('toastT'))$('toastT').textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('show');},1800);}
  function copy(text){
    var ok=function(){toast('已複製到剪貼簿');var b=$('copy');if(b){b.classList.add('done');if($('copyT'))$('copyT').textContent='已複製';setTimeout(function(){b.classList.remove('done');if($('copyT'))$('copyT').textContent='複製';},1500);}thud(520);};
    var fallback=function(){try{var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var r=document.execCommand&&document.execCommand('copy');document.body.removeChild(ta);if(r)ok();else toast('瀏覽器不讓複製，請手動選取');}catch(e){toast('瀏覽器不讓複製，請手動選取');}};
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,fallback);} else fallback(); }catch(e){fallback();}
  }

  /* soft click sound */
  var ac=null;
  function thud(f){try{if(!ac){var A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();}if(ac.state==='suspended')ac.resume();var t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;o.type='sine';o.frequency.setValueAtTime(f||220,t);o.frequency.exponentialRampToValueAtTime((f||220)*.5,t+.09);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(lp);lp.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.16);}catch(e){}}

  /* wiring */
  var gen=$('gen');
  if(gen) gen.addEventListener('click',function(){gen.classList.remove('spin');void gen.offsetWidth;gen.classList.add('spin');setTimeout(function(){gen.classList.remove('spin');},650);regen(true);thud(240);});
  if($('copy')) $('copy').addEventListener('click',function(){copy(S.pw);});
  var h=$('hist'); if(h) h.addEventListener('click',function(e){var b=e.target.closest('button');if(b)copy(b.getAttribute('data-p'));});
  if($('eye')) $('eye').addEventListener('click',function(){S.hide=!S.hide;var e=$('eye');e.setAttribute('aria-pressed',S.hide);e.setAttribute('aria-label',S.hide?'顯示密碼':'隱藏密碼');var ic=$('eyeIc');if(ic)ic.innerHTML=S.hide?'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><path d="M4 4l16 16"/>':'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';paint(S.pw);renderHist();thud(300);});
  var tiles=$('tiles');
  if(tiles) tiles.addEventListener('click',function(e){
    var b=e.target.closest('.tile'); if(!b) return; var k=b.dataset.k;
    var on=['upper','lower','digit','symbol'].filter(function(x){return S[x];});
    if(S[k]&&on.length===1&&S.mode==='chars'){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');toast('至少要留一種字元');return;}

  if($('amb')) $('amb').addEventListener('click',function(){S.amb=!S.amb;$('amb').setAttribute('aria-checked',S.amb);thud(260);regen(true);});
  function setMode(m){S.mode=m;$('mChars').setAttribute('aria-pressed',m==='chars');$('mWords').setAttribute('aria-pressed',m==='words');thud(250);regen(true);}
  if($('mChars')) $('mChars').addEventListener('click',function(){setMode('chars');});
  if($('mWords')) $('mWords').addEventListener('click',function(){setMode('words');});

  /* custom slider */
  var sl=$('slider'),knob=$('knob'),fill=$('fill'),MIN=8,MAX=64,dragging=false,lastLen=S.len;
  function setLen(v,regenerate){
    v=Math.max(MIN,Math.min(MAX,Math.round(v))); S.len=v;
    var p=(v-MIN)/(MAX-MIN);
    if(knob) knob.style.left='calc(17px + '+p+' * (100% - 34px))';
    if(fill) fill.style.width='calc('+p+' * (100% - 34px) + 13px)';
    if($('lenN')) $('lenN').textContent=v; if(sl) sl.setAttribute('aria-valuenow',v);
    if(regenerate&&v!==lastLen){lastLen=v;regen(false);}
  }
  function fromX(x){var r=sl.getBoundingClientRect();var p=(x-r.left-17)/(r.width-34);setLen(MIN+p*(MAX-MIN),true);}
  if(sl){
    sl.addEventListener('pointerdown',function(e){dragging=true;sl.classList.add('drag');try{sl.setPointerCapture(e.pointerId);}catch(er){}fromX(e.clientX);});
    sl.addEventListener('pointermove',function(e){if(dragging)fromX(e.clientX);});
    ['pointerup','pointercancel'].forEach(function(t){sl.addEventListener(t,function(){if(dragging){dragging=false;sl.classList.remove('drag');thud(200);}});});
    sl.addEventListener('keydown',function(e){var d={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1,PageUp:8,PageDown:-8}[e.key];if(d){e.preventDefault();setLen(S.len+d,true);}else if(e.key==='Home'){e.preventDefault();setLen(MIN,true);}else if(e.key==='End'){e.preventDefault();setLen(MAX,true);}});
  }
  document.addEventListener('keydown',function(e){
    if(e.ctrlKey||e.metaKey||e.altKey) return; var t=e.target; if(t&&t.tagName==='INPUT') return;
    if(e.key==='r'||e.key==='R'){ if(gen) gen.click(); }
    else if(e.key==='c'||e.key==='C'){ copy(S.pw); }
  });

  setLen(20,false); regen(true);
})();
