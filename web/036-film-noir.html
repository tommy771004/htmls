:root{

*{box-sizing:border-box}
html,body{margin:0}

.screen{position:relative;width:min(1180px,94vw,calc(64vh * 2.39));aspect-ratio:2.39;background:#000;overflow:hidden;box-shadow:0 0 0 1px #1a1a1a,0 30px 80px rgba(0,0,0,.9)}
.scene{position:absolute;inset:0;width:100%;height:100%;filter:contrast(1.08)}
.scene svg{width:100%;height:100%;display:block}
.blinds{position:absolute;inset:-20%;pointer-events:none;mix-blend-mode:screen;opacity:1;
  background:repeating-linear-gradient(180deg,rgba(236,232,220,.2) 0 20px,rgba(0,0,0,0) 20px 40px);

@keyframes drift{from{translate:-10px 0}to{translate:14px 6px}}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 80% at 50% 45%,transparent 45%,rgba(0,0,0,.85));}
canvas.grain,canvas.rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
canvas.grain{mix-blend-mode:overlay;opacity:.22}
.flicker{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0;animation:flick 7s infinite}
@keyframes flick{0%,93%,100%{opacity:0}94%{opacity:.05}95%{opacity:0}97%{opacity:.035}}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s}
.fade.on{opacity:1}
.slate{position:absolute;left:3%;top:5%;font-size:clamp(9px,1vw,12px);letter-spacing:.3em;color:rgba(236,232,222,.7);text-shadow:0 1px 2px #000}

.narr .cursor{display:inline-block;width:.55em;height:1.05em;background:var(--paper);vertical-align:-.15em;margin-left:2px;animation:cur .9s steps(1) infinite}
@keyframes cur{50%{opacity:0}}
.narr em{font-style:normal;color:#fff;border-bottom:1px solid rgba(255,255,255,.4)}
.narr .r{color:#e0242e}

.deck{width:min(1180px,94vw);display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;margin:18px 0 30px}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.choice{min-height:44px;padding:10px 16px 10px 14px;background:transparent;border:1px solid #4a4945;color:var(--silver);font-size:14px;letter-spacing:.06em;text-align:left;display:flex;gap:10px;align-items:baseline;transition:background .15s,color .15s,border-color .15s;opacity:0;transform:translateY(6px);animation:rise .35s forwards}
.choice b{color:#6f6e69;font-weight:400}
.choice:hover,.choice:focus-visible{background:var(--paper);color:#000;border-color:var(--paper);outline:none}
.choice:hover b,.choice:focus-visible b{color:#555}
.choice.done{color:#6f6e69;border-style:dashed}
.choice.accuse{border-color:var(--red);color:#e7c9c9}
.choice.accuse:hover{background:var(--red);color:#fff;border-color:var(--red)}
@keyframes rise{to{opacity:1;transform:none}}
.nb{min-height:44px;padding:0 16px;border:1px solid #4a4945;background:#111;color:var(--silver);font-size:13px;letter-spacing:.14em;white-space:nowrap}
.nb span{color:#fff}
.nb.ping{animation:ping .6s}
@keyframes ping{30%{background:var(--paper);color:#000}}
.hint{grid-column:1/-1;font-size:11px;color:#5d5c58;letter-spacing:.14em}

.notebook{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}
.notebook[hidden]{display:none}
.card{width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--paper);color:#1a1a1a;padding:26px 28px;box-shadow:0 20px 60px #000;position:relative;

.card::before{content:"";position:absolute;top:0;bottom:0;left:40px;width:1px;background:rgba(179,18,27,.45)}
.card h3{margin:0 0 14px 26px;font-size:16px;letter-spacing:.3em}
.card ol{margin:0;padding:0 0 0 26px;list-style:none;font-size:14px;line-height:28px}
.card li{margin-bottom:0}
.card li b{letter-spacing:.06em}
.card .empty{margin-left:26px;font-size:14px;line-height:28px;color:#555}
.card .close{position:absolute;right:10px;top:8px;min-width:44px;min-height:44px;border:0;background:none;font-size:22px;color:#1a1a1a}
.redtxt{color:var(--red)}

.stamp{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-8deg) scale(2.2);border:5px solid var(--red);color:var(--red);font-size:clamp(22px,4.4vw,56px);font-weight:700;letter-spacing:.2em;padding:.1em .5em;opacity:0;transition:transform .3s cubic-bezier(.6,0,.9,.4),opacity .1s;pointer-events:none;background:rgba(0,0,0,.25)}
.stamp.on{opacity:.95;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}

@media (max-width:760px){

}

    flat:{art:"flat", slate:"SCENE 4 · NICK CORSO'S ROOM", text:"Nick Corso lived above a hotel sign that had given up on the L. The door was the kind you open with a credit card, and I had excellent credit.", ch:[
      ["Go through the wastebasket","@pawn"],["Rub a pencil over the phone pad","@combo"],["Feel the coat on the chair","@coat"],["Back to the car","hub"]]},
    precinct:{art:"precinct", slate:"SCENE 5 · 9TH PRECINCT", text:"Lieutenant Brannigan had a face like a closed file. \"It's a suicide, Vale. I've got four hundred open cases and one of them isn't this one.\"", ch:[
      ["\"What did the coroner say?\"","@coroner"],["Ask about the night watchman","@gus"],["Back to the car","hub"]]},
    accuse:{art:"precinct", slate:"THE ACCUSATION", text:"I laid my hat on Brannigan's desk. He looked at it like it owed him money. \"All right, Vale. Who did it?\"", ch:[
      ["Vera Marsh, the widow","who:vera"],["Nick Corso, the partner","who:nick"],["Gus, the night watchman","who:gus"],["Nobody. It was suicide.","who:none"],["Not yet — back to the car","hub"]]},
    evidence:{art:"precinct", slate:"THE ACCUSATION", text:"\"Corso?\" Brannigan leaned back. \"Prove it. One thing, Vale. Put one thing on this desk that I can't argue with.\"", ch:"evidence"}
  };
  var EXTRA = {
    coat:"The coat on the chair was soaked through — somebody had walked a long way in this rain tonight. Wherever Nick went, it wasn't next door.",
    gus:"\"Gus? Slept through it with a pint of rye for a pillow. Couldn't hear a tuba in a phone booth.\" The watchman wasn't a killer. He was barely a witness."
  };
  var REVEAL = {
    debt:"\"Nick Corso. Leo's partner.\" She said the name like it was stuck to her shoe. \"He owed Leo twenty thousand dollars. Leo gave him until Friday.\"",
    stage:"\"On stage at the Blue Gardenia until midnight. Two hundred witnesses and a piano player.\" She paused. \"One break. Quarter past eleven. Fifteen minutes. Powder room.\"",
    lefty:"Leo's left fingers were stained with fountain-pen ink; a lefty's hand. The police found the gun in his right. Dead men don't switch hands.",
    clock:"The wall clock was smashed at 11:40, the glass in a neat star. Clocks don't break that tidy on their own. Somebody wanted that minute on the record.",
    safe:"The safe door hung open like a mouth with nothing to say. No drill marks, no blown lock. Whoever opened it knew the numbers by heart.",
    lipstick:"A whiskey glass, one finger left, a half-moon of lipstick on the rim. <span class='r'>Cherry Noir.</span> I'd seen that shade twelve hours ago, walking into my office.",
    cuff:"The bartender polished the same glass for a full minute. \"Corso? Came in at five to midnight, new suit, smelling like a haircut. Had a <span class='r'>red stain</span> on his cuff. Said he cut himself shaving. At midnight.\"",
    pawn:"Under the cigarette ends: a pawn ticket from Sully's Loans, stamped 11:50 p.m. \"One <span class='r'>red stone</span>, costume.\" Sully never sleeps, and never asks.",
    combo:"I shaded the phone pad with a pencil. Pressed into the paper, heavy-handed: 12 · 7 · 40. The same numbers that open the Marsh safe.",
    coroner:"\"Coroner's a romantic,\" Brannigan grunted. \"Says it was fired from two feet away, between eleven and midnight.\" Nobody holds a gun two feet from his own head."
  };
  var ENDINGS = {
    good:{art:"good", slate:"THE END", stamp:"CASE CLOSED", text:"Nick Corso folded like a cheap umbrella. The Marsh Ruby came back from Sully's in an evidence envelope, and Vera paid me in cash and a look I'll remember longer than the money. Outside, for the first time in eleven days, it had stopped raining."},
    weak:{art:"precinct", slate:"NOT ENOUGH", text:"Brannigan pushed it back across the desk. \"That's a hunch with a hat on, Vale. Bring me something that puts Corso in that shop.\" He was right, and I hated him for it.", retry:1},
    end_vera:{art:"bad", slate:"THE END", stamp:"WRONG MAN", text:"They gave Vera the chair in March. In April, the Marsh Ruby turned up around the neck of Nick Corso's girlfriend. Some cases you solve too fast, and then they solve you."},
    end_gus:{art:"bad", slate:"THE END", stamp:"WRONG MAN", text:"Gus got ten years for sleeping on the job. Nick Corso sent him a fruit basket. I still can't look at a pear."},
    end_none:{art:"good", slate:"THE END", stamp:"FILE CLOSED", text:"I let it go. Suicide, the file said, and files don't argue. Nick Corso bought a new car in June. It was red. It rained for another week, and I didn't mind."}
  };

  /* ---------------- engine ---------------- */
  var sceneEl = $("#scene"), slate = $("#slate"), choicesEl = $("#choices"), fade = $("#fade"), stamp = $("#stamp"), blinds = $("#blinds");
  var narrIn = $("#narrIn"), narrOut = $("#narrOut");
  function narrEl(){ return window.innerWidth <= 760 ? narrOut : narrIn; }
  var typing = null, full = "", cur = "start";

  function typeText(html){
    var el = narrEl(), other = el === narrIn ? narrOut : narrIn;
    if(other) other.innerHTML = "";
    if(!el) return;
    clearInterval(typing); full = html;
    if(reduce){ el.innerHTML = html; return; }
    var plain = html, i = 0;
    typing = setInterval(function(){
      i += 2;
      if(plain[i-1] === "<" || plain[i-2] === "<"){ var close = plain.indexOf(">", i - 2); if(close > 0) i = close + 1; }
      if(i >= plain.length){ clearInterval(typing); typing = null; el.innerHTML = plain; return; }
      el.innerHTML = safeSlice(plain, i) + '<span class="cursor"></span>';
    }, 22);
  }
  function safeSlice(s, n){ /* avoid cutting inside a tag and close open spans */
    var out = s.slice(0, n), open = (out.match(/<span/g) || []).length - (out.match(/<\/span>/g) || []).length;
    var lt = out.lastIndexOf("<"), gt = out.lastIndexOf(">"); if(lt > gt) out = out.slice(0, lt);
    for(var k=0;k<open;k++) out += "</span>";
    return out;
  }
  function skip(){ if(typing){ clearInterval(typing); typing = null; var el = narrEl(); if(el) el.innerHTML = full; } }
  [narrIn, narrOut].forEach(function(n){ if(n) n.addEventListener("click", skip); });

  function count(){ var n = 0; for(var k in have) if(have[k]) n++; return n; }
  function updateNb(ping){ var c = $("#nbCount"), b = $("#nbBtn"); if(c) c.textContent = count(); if(ping && b){ b.classList.remove("ping"); void b.offsetWidth; b.classList.add("ping"); } }

  function setArt(key){
    var a = ART[key] || ART.office; if(sceneEl) sceneEl.innerHTML = a.svg;
    if(blinds) blinds.style.setProperty("--bx", a.bx);
    rainOn = key === "office" || key === "title" || key === "flat";
  }
  var moving = false;
  function go(id, text){
    if(moving) return; moving = true;
    skip();
    if(fade) fade.classList.add("on");
    setTimeout(function(){ render(id, text); moving = false; if(fade) fade.classList.remove("on"); }, reduce ? 0 : 420);
  }
  function hubText(){
    var n = count();
    if(n === 0) return "I had a widow, a dead jeweler and a missing ruby. The rain had the rest. Where to first?";
    if(n < 4) return "Rain on the windshield, "+n+" things in my notebook and not one of them was a friend. Where next?";
    if(n < 7) return "The notebook was getting heavy — "+n+" entries. A shape was forming in the rain, and I didn't like its face.";
    return "Nine out of ten detectives would have gone home. I had "+n+" entries and one name I kept underlining.";
  }
  function render(id, textOverride){
    cur = id;
    if(stamp) stamp.classList.remove("on");
    var isEnd = !!ENDINGS[id] && !SCENES[id], sc = isEnd ? ENDINGS[id] : SCENES[id];
    setArt(sc.art);
    if(slate) slate.textContent = sc.slate;
    typeText(textOverride || (id === "hub" ? hubText() : sc.text));
    if(sc.stamp && stamp){ stamp.textContent = sc.stamp; setTimeout(function(){ stamp.classList.add("on"); }, reduce ? 0 : 1600); }
    var list = [];
    if(isEnd){
      if(sc.retry) list = [["Back to the car","hub"]];
      else list = [["Run it back from the top","restart"], ["Read the notebook","notebook"]];
    } else if(sc.ch === "hub"){
      list = [["Drive to Marsh & Corso, Pell Street","shop"],["The Blue Gardenia","club"],["Nick Corso's room over the Hotel","flat"],["9th Precinct","precinct"]];
      if(count() >= 4) list.push(["Make the accusation","accuse", "accuse"]);
    } else if(sc.ch === "evidence"){
      for(var k in CLUES) if(have[k]) list.push([shortName(k), "ev:" + k]);
      list.push(["Not yet — back to the car","hub"]);
    } else list = sc.ch;
    drawChoices(list, id);
    visited[id] = true;
  }
  function shortName(k){
    return {debt:"The $20,000 debt",stage:"Vera's stage alibi",lefty:"The gun in the wrong hand",clock:"The smashed clock",safe:"The safe opened, not cracked",lipstick:"The lipstick glass",cuff:"Nick's stained cuff",pawn:"Sully's pawn ticket",combo:"The phone-pad numbers",coroner:"The coroner's two feet"}[k];
  }
  function drawChoices(list, id){
    if(!choicesEl) return;
    choicesEl.innerHTML = "";
    list.forEach(function(c, i){
      var b = document.createElement("button"); b.className = "choice" + (c[2] === "accuse" ? " accuse" : "");
      var tgt = c[1];
      if(tgt[0] === "@" && (used[id + tgt] )) b.classList.add("done");
      b.style.animationDelay = (i * 70) + "ms";
      b.innerHTML = "<b>" + (i + 1) + "</b><span>" + c[0] + "</span>";
      b.addEventListener("click", function(){ choose(tgt, id); });
      choicesEl.appendChild(b);
    });
  }
  function choose(tgt, from){
    if(moving) return;
    if(tgt === "restart"){ have = {}; used = {}; visited = {}; updateNb(); go("start"); return; }
    if(tgt === "notebook"){ openNb(); return; }
    if(tgt[0] === "@"){
      var key = tgt.slice(1); used[from + tgt] = true;
      skip();
      if(REVEAL[key]){ var isNew = !have[key]; have[key] = true; updateNb(isNew); typeText(REVEAL[key] + (isNew ? "" : "")); }
      else if(EXTRA[key]) typeText(EXTRA[key]);
      drawChoices(SCENES[from].ch, from);
      return;
    }
    if(tgt.indexOf("who:") === 0){
      var w = tgt.slice(4);
      if(w === "nick"){ go("evidence"); return; }
      go("end_" + w); return;
    }
    if(tgt.indexOf("ev:") === 0){
      var e = tgt.slice(3);
      go(e === "pawn" || e === "combo" || e === "cuff" ? "good" : "weak"); return;
    }
    go(tgt);
  }

  /* notebook */
  var nb = $("#notebook"), nbList = $("#nbList");
  function openNb(){
    if(!nb || !nbList) return;
    var items = [];
    for(var k in CLUES) if(have[k]) items.push('<li><b>'+shortName(k).toUpperCase()+'.</b> <span class="'+(CLUES[k].red ? "redtxt" : "")+'">'+CLUES[k].t+'</span></li>');
    nbList.innerHTML = items.length ? "<ol>" + items.join("") + "</ol>" : '<p class="empty">Nothing yet but coffee rings.</p>';
    nb.hidden = false; var c = $("#nbClose"); if(c) c.focus();
  }
  function closeNb(){ if(nb) nb.hidden = true; }
  var nbBtn = $("#nbBtn"); if(nbBtn) nbBtn.addEventListener("click", openNb);
  var nbClose = $("#nbClose"); if(nbClose) nbClose.addEventListener("click", closeNb);
  if(nb) nb.addEventListener("click", function(e){ if(e.target === nb) closeNb(); });
  document.addEventListener("keydown", function(e){
    if(nb && !nb.hidden){ if(e.key === "Escape" || e.key === "n" || e.key === "N") closeNb(); return; }
    if(e.key === "n" || e.key === "N"){ openNb(); return; }
    if(/^[1-9]$/.test(e.key)){ var bs = choicesEl ? choicesEl.querySelectorAll(".choice") : []; var b = bs[+e.key - 1]; if(b) b.click(); }
    if(e.key === " " && e.target === document.body){ e.preventDefault(); skip(); }
  });

  /* ---------------- grain + rain ---------------- */
  var grain = $("#grain"), rain = $("#rain"), gctx = grain && grain.getContext ? grain.getContext("2d") : null, rctx = rain && rain.getContext ? rain.getContext("2d") : null;
  var rainOn = true, drops = [], gw = 420, gh = 176, gimg = null;
  function sizeCanvases(){
    if(grain){ grain.width = gw; grain.height = gh; if(gctx) gimg = gctx.createImageData(gw, gh); }
    if(rain){ var r = rain.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2); rain.width = Math.max(1, Math.round(r.width * d)); rain.height = Math.max(1, Math.round(r.height * d)); }
    drops = []; for(var i=0;i<90;i++) drops.push({x:Math.random(), y:Math.random(), v:.012 + Math.random()*.02, l:.03 + Math.random()*.05});
  }
  window.addEventListener("resize", sizeCanvases);
  var last = 0;
  function loop(t){
    requestAnimationFrame(loop);
    if(document.hidden || t - last < 42) return; last = t;
    if(gctx && gimg && !reduce){
      var d = gimg.data;
      for(var i=0;i<d.length;i+=4){ var v = 128 + (Math.random() - .5) * 200 | 0; d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255; }
      gctx.putImageData(gimg, 0, 0);
    }
    if(rctx && rain){
      var W = rain.width, H = rain.height; rctx.clearRect(0, 0, W, H);
      if(!rainOn || reduce) return;
      rctx.strokeStyle = "rgba(220,220,215,.22)"; rctx.lineWidth = Math.max(1, W / 900);
      rctx.beginPath();
      drops.forEach(function(p){ p.y += p.v; p.x -= p.v * .18; if(p.y > 1){ p.y = -.1; p.x = Math.random() * 1.1; } rctx.moveTo(p.x*W, p.y*H); rctx.lineTo((p.x - p.l*.18)*W, (p.y + p.l)*H); });
      rctx.stroke();
    }
  }
  sizeCanvases(); requestAnimationFrame(loop);
  render("start");
})();
</script>
