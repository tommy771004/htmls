<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>兩城漫步 · 齋浦爾與瓦拉納西</title>
<meta name="description" content="第一人稱走進兩座印度城市：午後的粉紅之城齋浦爾，和黃昏晚禱的恆河河階瓦拉納西。建築、人群、鴿子、晚禱油燈與市聲全部由程式即時生成。">
<style>
:root{
  --ink:#2b120d; --lime:#fff4ea; --dim:#f2cdbf; --tone:#7a2f22; --ticket:#f3c3b3; --ticket-ink:#4a1a12; --hole:#3a1812;
  --ease-out:cubic-bezier(.2,.8,.2,1);
  --deva:"Kohinoor Devanagari","Devanagari Sangam MN","Nirmala UI","Mangal","Noto Sans Devanagari",sans-serif;
  --serif:"Songti TC","STSong","Noto Serif CJK TC","Source Han Serif TC","PMingLiU",serif;
}
body[data-city="varanasi"]{ --ink:#1c120a; --lime:#fff0d6; --dim:#f1d2a0; --tone:#8a4a14; --ticket:#f1c77c; --ticket-ink:#3d2208; --hole:#22160c; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#3a1812;color:var(--lime);
  font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
body[data-city="varanasi"]{background:#22160c}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;z-index:3;pointer-events:none;text-shadow:0 1px 2px rgba(30,10,4,.7),0 0 4px rgba(30,10,4,.55),0 0 18px rgba(30,10,4,.4)}
.hud a,.hud button{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer}

#back{top:max(14px,env(safe-area-inset-top));left:18px;font-size:13px}
#back a{color:var(--lime);text-decoration:none;opacity:.86;padding:6px 0;display:inline-block}
#back a:hover{opacity:1}

#place{top:calc(max(14px,env(safe-area-inset-top)) + 34px);left:18px;max-width:min(520px,calc(100vw - 36px))}
#place .deva{font-family:var(--deva);font-weight:600;font-size:clamp(40px,7vw,78px);line-height:1.05;letter-spacing:.01em;margin:0}
#place .zh{font-family:var(--serif);font-size:clamp(17px,2vw,22px);margin:4px 0 2px;letter-spacing:.08em}
#place .sub{font-size:13px;color:var(--dim);margin:0}

#tools{top:max(14px,env(safe-area-inset-top));right:18px;display:flex;gap:10px;align-items:flex-start}
.ticket{position:relative;border:0;background:var(--ticket);color:var(--ticket-ink);text-shadow:none;
  padding:10px 20px 10px 22px;border-radius:3px;text-align:left;line-height:1.25;
  -webkit-mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
  transition:background-color var(--dur-hover,.18s) var(--ease-out)}
.ticket::after{content:"";position:absolute;top:8px;bottom:8px;right:44px;border-right:2px dotted color-mix(in srgb,var(--ticket-ink) 40%,transparent)}
.ticket small{display:block;font-size:11px;opacity:.72;letter-spacing:.04em}
.ticket b{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.06em}
.ticket .go{position:absolute;right:14px;top:50%;translate:0 -50%;width:16px;height:16px;transition:translate .2s var(--ease-out)}
.ticket:hover{background:color-mix(in srgb,var(--ticket) 86%,#fff)}
.ticket:hover .go{translate:3px -50%}
.ticket{padding-right:62px}
#sound{background:none;border:0;padding:8px 2px;font-size:13px;color:var(--lime);opacity:.86;display:flex;gap:6px;align-items:center}
#sound:hover{opacity:1}
#sound svg{width:18px;height:18px}

#caption{padding:12px 18px 13px;border-radius:4px;background:color-mix(in srgb,var(--ink) 72%,transparent);text-shadow:none;left:50%;bottom:calc(max(22px,env(safe-area-inset-bottom)) + 8px);translate:-50% 0;width:min(560px,calc(100vw - 36px));text-align:center;
  transition:opacity .5s var(--ease-out),translate .5s var(--ease-out)}
#caption.off{opacity:0;translate:-50% 8px}
#caption h2{font-family:var(--serif);font-size:24px;margin:0;letter-spacing:.1em;font-weight:700}
#caption .en{font-size:12px;color:var(--dim);margin:2px 0 6px;letter-spacing:.06em}
#caption p{margin:0;font-size:14px;line-height:1.6}

#mapbox{right:18px;bottom:calc(max(18px,env(safe-area-inset-bottom)));text-align:right}
#map{width:150px;height:150px;display:block;border-radius:50%;background:var(--hole)}
#tally{font-size:12px;margin-top:6px;color:var(--dim)}
#tally b{color:var(--lime);font-weight:600}

#hint{left:18px;bottom:calc(max(18px,env(safe-area-inset-bottom)));font-size:12px;color:var(--dim);line-height:1.7}
#hint kbd{font:inherit;color:var(--lime);font-weight:600}

#stick{position:fixed;z-index:3;width:120px;height:120px;border-radius:50%;left:24px;bottom:calc(max(26px,env(safe-area-inset-bottom)) + 10px);
  border:2px solid color-mix(in srgb,var(--lime) 45%,transparent);display:none;touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:color-mix(in srgb,var(--lime) 70%,transparent)}
body.touch #stick{display:block}
body.touch #hint{display:none}

#intro{position:fixed;inset:0;z-index:5;display:grid;align-content:end;justify-items:start;gap:18px;
  padding:0 max(24px,6vw) max(48px,10vh);
  background:linear-gradient(to top,rgba(43,18,13,.82),rgba(43,18,13,.35) 45%,rgba(43,18,13,0) 70%)}
#intro[hidden]{display:none}
#intro h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,5.4vw,64px);line-height:1.12;margin:0;letter-spacing:.06em;max-width:15em}
#intro p{margin:0;max-width:34em;color:var(--dim);font-size:15px;line-height:1.7}
#intro .row{display:flex;gap:14px;flex-wrap:wrap}
#intro .ticket{min-width:230px;padding-top:14px;padding-bottom:14px}
#intro .ticket .deva{font-family:var(--deva);font-size:22px;font-weight:600;display:block;line-height:1.2}
#intro .ticket[data-city="varanasi"]{--ticket:#f1c77c;--ticket-ink:#3d2208}
#intro .ticket[data-city="jaipur"]{--ticket:#f3c3b3;--ticket-ink:#4a1a12}

#travel{position:fixed;inset:0;z-index:6;background:#140c08;color:#f4dcc0;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .6s ease}
#travel.on{opacity:1;pointer-events:auto}
#travel div{text-align:center;font-family:var(--serif);letter-spacing:.14em}
#travel b{display:block;font-size:26px;margin-bottom:8px}
#travel span{font-size:14px;color:#c9a88a;letter-spacing:.06em;font-family:system-ui,sans-serif}
#travel svg{width:min(360px,70vw);height:24px;margin-top:18px}

#boot{position:fixed;inset:0;z-index:7;display:grid;place-items:center;background:#3a1812;color:#fff0e4;text-align:center;padding:24px}
#boot[hidden]{display:none}
#boot b{display:block;font-family:var(--serif);font-size:22px;margin-bottom:8px;letter-spacing:.1em}
#boot span{font-size:14px;color:#f0c8b8}

body.pre .hud:not(#back),body.pre #stick{display:none}
@media (max-width:640px){
  #place{top:calc(max(12px,env(safe-area-inset-top)) + 30px)}
  #place .sub{font-size:12px}
  #tools{flex-direction:column-reverse;align-items:flex-end;gap:4px}
  #tools .ticket{padding:8px 50px 8px 16px}
  #tools .ticket b{font-size:14px}
  #tools .ticket::after{right:36px}
  #tools .ticket .go{right:11px}
  #map{width:112px;height:112px}
  #caption{bottom:calc(max(18px,env(safe-area-inset-bottom)) + 150px)}
  #caption h2{font-size:20px}
  #caption p{font-size:13px}
  #intro{padding-bottom:max(36px,6vh)}
  #intro .ticket{min-width:0;flex:1 1 150px}
}
@media (prefers-reduced-motion:reduce){
  #caption,#travel,.ticket,.ticket .go{transition:none}
}
</style>

<script type="module">
let T;
try { T = await import('https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js'); }
catch (e) { try { T = await import('../vendor/three-0.186.0/three.module.js'); } catch (e2) { T = null; } }
const $ = id => document.getElementById(id);
if (!T) {
  $('boot').innerHTML = '<div><b>城市沒能搭起來</b><span>需要網路連線到 cdn.jsdelivr.net 載入 Three.js，請重新整理再試一次。</span></div>';
  throw new Error('three unavailable');
}

// ---------- 共用小工具 ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const col = hex => new T.Color(hex);
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window && innerWidth < 900;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (isTouch) document.body.classList.add('touch');

// ---------- 合併幾何：同一材質的所有牆面收成一個 draw call ----------
class Builder {
  constructor() { this.p = []; this.n = []; this.u = []; this.c = []; }
  tri(a, b, c, na, nb, nc, ua, ub, uc, k) {
    this.p.push(...a, ...b, ...c); this.n.push(...na, ...nb, ...nc); this.u.push(...ua, ...ub, ...uc);
    for (let i = 0; i < 3; i++) this.c.push(k.r, k.g, k.b);
  }
  quad(a, b, c, d, nrm, ua, ub, uc, ud, k) { this.tri(a, b, c, nrm, nrm, nrm, ua, ub, uc, k); this.tri(a, c, d, nrm, nrm, nrm, ua, uc, ud, k); }
  // 盒子：(x,z) 為中心、y 為底；側面 UV 以公尺計，tw/th 為一格紋理代表的寬高，會自動調整到整數格
  box(x, y, z, sx, sy, sz, k, o = {}) {
    const ry = o.ry || 0, cs = Math.cos(ry), sn = Math.sin(ry), tw = o.tw || 4, th = o.th || 4;
    const P = (lx, ly, lz) => [x + lx * cs + lz * sn, y + ly, z - lx * sn + lz * cs];
    const N = (lx, lz) => [lx * cs + lz * sn, 0, -lx * sn + lz * cs];
    const hx = sx / 2, hz = sz / 2, top = o.topUV || null;
    const side = (a, b, nx, nz, w) => {
      const cols = Math.max(1, Math.round(w / tw)), vt = o.vScale === 0 ? 0 : sy / th, v0 = o.v0 || 0;
      const A = P(a[0], 0, a[1]), B = P(b[0], 0, b[1]), C = P(b[0], sy, b[1]), D = P(a[0], sy, a[1]);
      if (o.flat) { const f = o.flat; this.quad(A, B, C, D, N(nx, nz), f, f, f, f, k); return; }
      this.quad(A, B, C, D, N(nx, nz), [0, v0], [cols, v0], [cols, v0 + vt], [0, v0 + vt], k);
    };
    if (!o.noSides) {
      side([-hx, hz], [hx, hz], 0, 1, sx); side([hx, -hz], [-hx, -hz], 0, -1, sx);
      side([hx, hz], [hx, -hz], 1, 0, sz); side([-hx, -hz], [-hx, hz], -1, 0, sz);
    }
    if (!o.noTop) {
      const A = P(-hx, sy, hz), B = P(hx, sy, hz), C = P(hx, sy, -hz), D = P(-hx, sy, -hz);
      if (top) this.quad(A, B, C, D, [0, 1, 0], top, top, top, top, k);
      else this.quad(A, B, C, D, [0, 1, 0], [A[0] / tw, A[2] / tw], [B[0] / tw, B[2] / tw], [C[0] / tw, C[2] / tw], [D[0] / tw, D[2] / tw], k);
    }
    if (o.bottom) { const A = P(-hx, 0, -hz), B = P(hx, 0, -hz), C = P(hx, 0, hz), D = P(-hx, 0, hz); const f = top || [0, 0]; this.quad(A, B, C, D, [0, -1, 0], f, f, f, f, k); }
  }
  // 任意 three 幾何（先轉成非索引），可指定整塊用同一個 UV 點
  geo(g, m, k, flatUV) {
    const q = g.index ? g.toNonIndexed() : g; q.applyMatrix4(m);
    const P = q.attributes.position.array, Nn = q.attributes.normal.array, U = q.attributes.uv ? q.attributes.uv.array : null;
    for (let i = 0; i < P.length / 3; i++) {
      this.p.push(P[i * 3], P[i * 3 + 1], P[i * 3 + 2]); this.n.push(Nn[i * 3], Nn[i * 3 + 1], Nn[i * 3 + 2]);
      if (flatUV) this.u.push(flatUV[0], flatUV[1]); else this.u.push(U ? U[i * 2] : 0, U ? U[i * 2 + 1] : 0);
      this.c.push(k.r, k.g, k.b);
    }
    q.dispose(); if (q !== g) g.dispose();
  }
  mesh(mat, shadow = true) {
    const g = new T.BufferGeometry();
    g.setAttribute('position', new T.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal', new T.Float32BufferAttribute(this.n, 3));
    g.setAttribute('uv', new T.Float32BufferAttribute(this.u, 2));
    g.setAttribute('color', new T.Float32BufferAttribute(this.c, 3));
    g.computeBoundingSphere();
    const m = new T.Mesh(g, mat); m.castShadow = shadow; m.receiveShadow = true; m.matrixAutoUpdate = false; return m;
  }
}
const M4 = new T.Matrix4(), Q4 = new T.Quaternion(), V3 = new T.Vector3(), S3 = new T.Vector3(), E3 = new T.Euler();
const mtx = (x, y, z, ry = 0, s = 1, sy, sz, rx = 0, rz = 0) => M4.compose(V3.set(x, y, z), Q4.setFromEuler(E3.set(rx, ry, rz)), S3.set(s, sy ?? s, sz ?? s)).clone();

// ---------- Canvas 紋理 ----------
function canvasTex(w, h, draw, repeat = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = T.RepeatWrapping; }
  t.generateMipmaps = true; t.minFilter = T.LinearMipmapLinearFilter; return t;
}
function grain(g, w, h, amt, seed = 7) {
  const r = rng(seed), d = g.getImageData(0, 0, w, h), a = d.data;
  for (let i = 0; i < a.length; i += 4) { const n = (r() - .5) * amt; a[i] += n; a[i + 1] += n; a[i + 2] += n; }
  g.putImageData(d, 0, 0);
}
// 尖拱窗輪廓（齋浦爾常見的多瓣拱）
function cuspArch(g, cx, top, w, h, lobes = 5) {
  const r = w / 2, sy = top + r;
  g.beginPath(); g.moveTo(cx - r, top + h); g.lineTo(cx - r, sy);
  for (let i = 0; i < lobes; i++) {
    const a0 = Math.PI + i * Math.PI / lobes, a1 = Math.PI + (i + 1) * Math.PI / lobes, am = (a0 + a1) / 2;
    const ex = cx + Math.cos(a1) * r, ey = sy + Math.sin(a1) * r * 1.05;
    const mx = cx + Math.cos(am) * r * 1.18, my = sy + Math.sin(am) * r * 1.2;
    g.quadraticCurveTo(mx, my, ex, ey);
  }
  g.lineTo(cx + r, top + h); g.closePath();
}
const TEX = {};
function makeTextures() {
  // 齋浦爾立面：一格 = 一開間一層樓
  TEX.jFacade = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#d98670'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#f4e4d2';
    g.fillRect(0, 0, w, 7); g.fillRect(0, h - 16, w, 16); g.fillRect(0, h - 26, w, 4);
    g.fillRect(0, 0, 6, h); g.fillRect(w - 6, 0, 6, h);
    // 拱窗外框
    g.save(); g.lineWidth = 7; g.strokeStyle = '#f4e4d2'; cuspArch(g, 128, 60, 96, 150); g.stroke();
    g.fillStyle = '#3a211b'; cuspArch(g, 128, 66, 84, 142); g.fill();
    g.fillStyle = '#4f6b4a'; g.fillRect(90, 150, 76, 54); g.fillStyle = '#2d3f2b'; g.fillRect(127, 150, 2, 54);
    for (let i = 0; i < 4; i++) { g.fillStyle = '#3e5a3a'; g.fillRect(94, 156 + i * 12, 30, 5); g.fillRect(132, 156 + i * 12, 30, 5); }
    g.restore();
    // 白灰花點與飾帶
    g.fillStyle = '#f4e4d2';
    for (const [x, y] of [[40, 70], [216, 70], [40, 150], [216, 150]]) { g.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; g.moveTo(x, y); g.arc(x + Math.cos(a) * 7, y + Math.sin(a) * 7, 4, 0, TAU); } g.fill(); g.beginPath(); g.arc(x, y, 3, 0, TAU); g.fillStyle = '#d98670'; g.fill(); g.fillStyle = '#f4e4d2'; }
    for (let x = 12; x < w; x += 16) { g.beginPath(); g.arc(x, 19, 3, 0, TAU); g.fill(); }
    // 頂部留一塊素牆：屋頂面取這一點的顏色
    g.fillStyle = '#d98670'; g.fillRect(96, 26, 64, 16);

function makeSky(o) {
  const m = new T.ShaderMaterial({
    side: T.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: col(o.top) }, mid: { value: col(o.mid) }, hor: { value: col(o.hor) }, low: { value: col(o.low) }, sun: { value: o.sunDir.clone() }, sunCol: { value: col(o.sunCol) }, glow: { value: o.glow }, opp: { value: col(o.opp || o.hor) } },
    vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); vec4 p = modelViewMatrix*vec4(position,1.); gl_Position = projectionMatrix*p; gl_Position.z = gl_Position.w; }',
    fragmentShader: `uniform vec3 top,mid,hor,low,sunCol,opp; uniform vec3 sun; uniform float glow; varying vec3 vD;
      float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
      void main(){ vec3 d = normalize(vD); float y = d.y;
        float facing = dot(normalize(d.xz+1e-4), normalize(sun.xz+1e-4))*.5+.5;
        vec3 horz = mix(opp, hor, smoothstep(0.,1.,facing));
        vec3 c = y > 0. ? mix(horz, mix(mid, top, smoothstep(.25,.9,y)), smoothstep(0.,.35,y)) : mix(horz, low, smoothstep(0.,-.12,y));
        float s = max(dot(d, normalize(sun)), 0.);
        c += sunCol * (pow(s, 900.)*6. + pow(s, 12.)*glow*.35 + pow(s,3.)*glow*.12);
        c += (h(gl_FragCoord.xy)-.5)/255.*2.;
        gl_FragColor = vec4(c,1.);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  });
  const s = new T.Mesh(new T.SphereGeometry(900, 32, 16), m); s.frustumCulled = false; s.renderOrder = -1; return s;
}

class World {
  constructor() { this.cells = new Map(); this.rects = []; this.circles = []; this.heights = []; this.base = 0; }
  key(i, j) { return i * 4096 + j; }
  addRect(x0, z0, x1, z1, tag) {
    const r = { x0: Math.min(x0, x1), z0: Math.min(z0, z1), x1: Math.max(x0, x1), z1: Math.max(z0, z1), tag }; this.rects.push(r);
    for (let i = Math.floor(r.x0 / 8); i <= Math.floor(r.x1 / 8); i++) for (let j = Math.floor(r.z0 / 8); j <= Math.floor(r.z1 / 8); j++) { const k = this.key(i, j); if (!this.cells.has(k)) this.cells.set(k, []); this.cells.get(k).push(r); }
    return r;
  }
  addCircle(x, z, rad) { const c = { x, z, r: rad, circle: true }; this.circles.push(c); const i = Math.floor(x / 8), j = Math.floor(z / 8); for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) { const k = this.key(i + a, j + b); if (!this.cells.has(k)) this.cells.set(k, []); this.cells.get(k).push(c); } }
  // 高度區：回傳 undefined 表示不在此區
  addHeight(x0, z0, x1, z1, fn, over = false) { this.heights.push({ x0, z0, x1, z1, fn, over }); }
  heightAt(x, z) {
    let h = this.base;
    for (const r of this.heights) if (x >= r.x0 && x <= r.x1 && z >= r.z0 && z <= r.z1) { const v = r.fn(x, z); if (v !== undefined) h = r.over ? v : Math.max(h, v); }
    return h;
  }
  push(p, rad) {
    const i = Math.floor(p.x / 8), j = Math.floor(p.z / 8), seen = new Set();
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const list = this.cells.get(this.key(i + a, j + b)); if (!list) continue;
      for (const s of list) {
        if (seen.has(s)) continue; seen.add(s);
        if (s.circle) { const dx = p.x - s.x, dz = p.z - s.z, d = Math.hypot(dx, dz), m = s.r + rad; if (d < m && d > 1e-6) { p.x = s.x + dx / d * m; p.z = s.z + dz / d * m; } continue; }
        const cx = clamp(p.x, s.x0, s.x1), cz = clamp(p.z, s.z0, s.z1), dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
        if (d2 < rad * rad) {
          if (d2 > 1e-9) { const d = Math.sqrt(d2); p.x = cx + dx / d * rad; p.z = cz + dz / d * rad; }
          else { const l = p.x - s.x0, r = s.x1 - p.x, t = p.z - s.z0, btm = s.z1 - p.z, m = Math.min(l, r, t, btm);
            if (m === l) p.x = s.x0 - rad; else if (m === r) p.x = s.x1 + rad; else if (m === t) p.z = s.z0 - rad; else p.z = s.z1 + rad; }
        }
      }
    }
  }
}

const CLOTH = ['#c2185b', '#e8a317', '#1f7a8c', '#e25822', '#6d9f3a', '#9b1d20', '#f2ead3', '#2e5e9e', '#d9468f', '#f5c518', '#7b3f8c', '#ffffff', '#ffffff', '#e0d6c2', '#3b7d4f'];
const SKIN = ['#8d5a3b', '#a8704a', '#6e4329', '#9a6242', '#7c4d31', '#b5805a'];

class Crowd {
  constructor(scene, n, seed) {
    const { body, head } = personGeos();
    this.body = new T.InstancedMesh(body, new T.MeshStandardMaterial({ map: TEX.plain, roughness: 1 }), n);
    this.head = new T.InstancedMesh(head, new T.MeshStandardMaterial({ map: TEX.plain, roughness: .8 }), n);
    for (const m of [this.body, this.head]) { m.castShadow = true; m.receiveShadow = true; m.instanceMatrix.setUsage(T.DynamicDrawUsage); m.frustumCulled = false; scene.add(m); }
    this.a = []; this.r = rng(seed); this.n = 0; this.max = n;
  }
  // 沿一段路來回走
  add(ax, az, bx, bz, o = {}) {
    if (this.n >= this.max) return; const r = this.r, i = this.n++;
    this.body.setColorAt(i, col(o.cloth || CLOTH[(r() * CLOTH.length) | 0]));
    this.head.setColorAt(i, col(r() < .35 && !o.bare ? ['#f0ece2', '#c0392b', '#e8a317', '#2c3e50'][(r() * 4) | 0] : SKIN[(r() * SKIN.length) | 0]));
    this.a.push({ ax, az, bx, bz, t: r(), dir: r() < .5 ? 1 : -1, sp: (o.speed ?? (.9 + r() * .6)) / Math.max(.1, Math.hypot(bx - ax, bz - az)), side: 0, ph: r() * TAU, idle: o.idle || false, face: o.face, s: .92 + r() * .16, y: o.y });
  }
  update(dt, t, P, heightAt) {
    const m = new T.Matrix4(), q = new T.Quaternion(), p = new T.Vector3(), s = new T.Vector3(), up = new T.Vector3(0, 1, 0);
    for (let i = 0; i < this.n; i++) {
      const a = this.a[i];
      let x, z, yaw, bob = 0;
      if (a.idle) { x = a.ax; z = a.az; yaw = a.face ?? 0; bob = Math.sin(t * 1.3 + a.ph) * .01; }
      else {
        a.t += a.dir * a.sp * dt; if (a.t > 1) { a.t = 1; a.dir = -1; } if (a.t < 0) { a.t = 0; a.dir = 1; }
        const dx = a.bx - a.ax, dz = a.bz - a.az, L = Math.hypot(dx, dz) || 1, nx = -dz / L, nz = dx / L;
        x = a.ax + dx * a.t; z = a.az + dz * a.t;
        // 讓路給玩家
        const px = x + nx * a.side - P.x, pz = z + nz * a.side - P.z, d = Math.hypot(px, pz);
        const want = d < 1.4 ? (px * nx + pz * nz >= 0 ? 1.2 : -1.2) : 0; a.side = lerp(a.side, want, 1 - Math.exp(-dt * 3));
        x += nx * a.side; z += nz * a.side;
        yaw = Math.atan2(dx * a.dir, dz * a.dir); bob = Math.abs(Math.sin(t * 7 + a.ph)) * .045;
      }
      const y = (a.y ?? heightAt(x, z)) + bob;
      m.compose(p.set(x, y, z), q.setFromAxisAngle(up, yaw), s.set(a.s, a.s, a.s));
      this.body.setMatrixAt(i, m); this.head.setMatrixAt(i, m);
    }
    this.body.count = this.head.count = this.n;
    this.body.instanceMatrix.needsUpdate = this.head.instanceMatrix.needsUpdate = true;
    if (!this.painted && this.body.instanceColor) { this.body.instanceColor.needsUpdate = this.head.instanceColor.needsUpdate = true; this.painted = true; }
  }
}

function chhatri(b, x, y, z, s, h, k, ry = 0) {
  const p = s / 2 - .12;
  for (const [a, c] of [[-p, -p], [p, -p], [-p, p], [p, p]]) b.box(x + a * Math.cos(ry) + c * Math.sin(ry), y, z - a * Math.sin(ry) + c * Math.cos(ry), .18, h, .18, k, { flat: [.5, .5] });
  b.box(x, y + h, z, s + .3, .16, s + .3, k, { flat: [.5, .5], ry, bottom: true });
  b.geo(new T.SphereGeometry(s * .46, 12, 6, 0, TAU, 0, Math.PI / 2), mtx(x, y + h + .16, z, 0, 1, .9, 1), k, [.5, .5]);
  b.geo(new T.ConeGeometry(.07, .5, 6), mtx(x, y + h + .16 + s * .42 + .22, z), k, [.5, .5]);
}
function tree(b, x, z, h, r, seed, trunk = '#6b4f3a', leaf = '#4d6b2e') {
  const R = rng(seed);
  b.geo(new T.CylinderGeometry(.16, .28, h, 6), mtx(x, h / 2, z), col(trunk), [.5, .5]);
  for (let i = 0; i < 6; i++) {
    const a = R() * TAU, d = R() * r * .55, s = r * (.45 + R() * .3);
    const k = col(leaf).offsetHSL((R() - .5) * .04, 0, (R() - .5) * .08);
    b.geo(new T.IcosahedronGeometry(s, 0), mtx(x + Math.cos(a) * d, h + R() * r * .6, z + Math.sin(a) * d, R() * 3, 1, .75, 1), k, [.5, .5]);
  }
}
function cow(b, x, z, ry, k = '#eeeae2', seed = 1) {
  const c = col(k), dark = col('#3b3029'), m = (lx, ly, lz, sx, sy, sz, kk = c) => { const g = new T.BoxGeometry(sx, sy, sz); b.geo(g, mtx(x + lx * Math.cos(ry) + lz * Math.sin(ry), ly, z - lx * Math.sin(ry) + lz * Math.cos(ry), ry), kk, [.5, .5]); };
  m(0, 1.05, 0, .62, .62, 1.55); m(0, 1.42, -.35, .34, .22, .3); m(0, 1.1, .95, .3, .34, .48); m(0, 1.02, 1.2, .24, .22, .16, dark);
  for (const [a, bb] of [[-.22, -.55], [.22, -.55], [-.22, .55], [.22, .55]]) m(a, .38, bb, .14, .76, .14);

}
function crenels(b, x0, z0, x1, z1, y, k, step = 1.3, w = .7, h = .7, t = .4) {
  const L = Math.hypot(x1 - x0, z1 - z0), n = Math.max(1, Math.floor(L / step)), ry = Math.atan2(x1 - x0, z1 - z0);
  for (let i = 0; i < n; i++) { const f = (i + .5) / n; b.box(lerp(x0, x1, f), y, lerp(z0, z1, f), t, h, w, k, { flat: [.5, .5], ry }); }

// 尖拱形板（拱廊與城門用）
function archPanel(w, h, iw, spring, depth, lobes = 5) {
  const s = new T.Shape(), r = iw / 2;
  s.moveTo(-w / 2, 0); s.lineTo(-r, 0); s.lineTo(-r, spring);
  for (let i = 0; i < lobes; i++) {
    const a0 = Math.PI - i * Math.PI / lobes, a1 = Math.PI - (i + 1) * Math.PI / lobes, am = (a0 + a1) / 2;
    s.quadraticCurveTo(Math.cos(am) * r * 1.16, spring + Math.sin(am) * r * 1.2, Math.cos(a1) * r, spring + Math.sin(a1) * r * 1.05);
  }
  s.lineTo(r, 0); s.lineTo(w / 2, 0); s.lineTo(w / 2, h); s.lineTo(-w / 2, h); s.closePath();
  const g = new T.ExtrudeGeometry(s, { depth, bevelEnabled: false, curveSegments: 3 }); g.translate(0, 0, -depth / 2); return g;
}

function buildJaipur() {
  const scene = new T.Scene(), W = new World(), R = rng(1727), MT = mats();
  const sunDir = new T.Vector3(-.77, .57, .28).normalize();
  const B = { fac: new Builder(), shop: new Builder(), plain: new Builder(), jali: new Builder(), cloth: new Builder() };
  const LIME = col('#f4e4d2'), PINK = col('#d4806a'), PINK2 = col('#c96e58'), mapRects = [];
  const tint = () => col('#ffffff').lerp(col(R() < .2 ? '#ffd9b8' : '#f0cfc4'), R());
  const ST = 3.6, GF = 4.2; // 樓高、一樓高
  const FACE = { S: 0, N: Math.PI, E: Math.PI / 2, W: -Math.PI / 2 };
  const fwd = f => ({ S: [0, 1], N: [0, -1], E: [1, 0], W: [-1, 0] })[f];

  // 一棟臨街房子：(cx,cz) 為地面中心、w 沿街寬、d 進深、face 朝向街道

  const W = city.world;
  P.yaw -= look.dx * .0022; P.pitch = clamp(P.pitch - look.dy * .0022, -1.3, 1.3); look.dx = look.dy = 0;
  if (keys.has('KeyQ')) P.yaw += dt * 1.8; if (keys.has('KeyE')) P.yaw -= dt * 1.8;
  let f = 0, s = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) f += 1; if (keys.has('KeyS') || keys.has('ArrowDown')) f -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) s += 1; if (keys.has('KeyA') || keys.has('ArrowLeft')) s -= 1;
  f -= stick.y; s += stick.x;
  const m = Math.hypot(f, s); if (m > 1) { f /= m; s /= m; }
  const run = keys.has('ShiftLeft') || keys.has('ShiftRight') || Math.hypot(stick.x, stick.y) > .92;
  const sp = (run ? 6.4 : 3.3) * dt, sy = Math.sin(P.yaw), cy = Math.cos(P.yaw);
  const dx = (-sy * f + cy * s) * sp, dz = (-cy * f - sy * s) * sp;
  const ground = W.heightAt(P.x, P.z), ok = (x, z) => W.heightAt(x, z) - Math.max(ground, P.y) <= STEP;
  const ox = P.x, oz = P.z;
  if (ok(P.x + dx, P.z + dz)) { P.x += dx; P.z += dz; } else if (ok(P.x + dx, P.z)) P.x += dx; else if (ok(P.x, P.z + dz)) P.z += dz;
  W.push(P, RAD);
  for (const mv of city.movers()) { const ex = P.x - mv.x, ez = P.z - mv.z, d = Math.hypot(ex, ez), mm = mv.r + RAD; if (d < mm && d > 1e-4) { P.x = mv.x + ex / d * mm; P.z = mv.z + ez / d * mm; } }
  if (!ok(P.x, P.z)) { P.x = ox; P.z = oz; }
  const h = W.heightAt(P.x, P.z);
  if (h >= P.y - .02) { P.y = P.y + (h - P.y) * Math.min(1, dt * 16); P.vy = 0; }
  else { P.vy -= 18 * dt; P.y = Math.max(h, P.y + P.vy * dt); if (P.y === h) P.vy = 0; }
  const moving = m > .05; P.bob += moving ? dt * (run ? 11 : 7.5) : 0;
  const bob = reduced ? 0 : moving ? Math.sin(P.bob) * (run ? .05 : .035) : 0;
  camera.position.set(P.x, P.y + EYE + bob, P.z); camera.rotation.set(P.pitch, P.yaw, 0);
}

// ---------- 景點說明與小地圖 ----------
let near = null;
function landmarks() {
  let best = null, bd = 1e9;
  for (const l of city.landmarks) { const d = Math.hypot(P.x - l.x, P.z - l.z); if (d < l.r && d < bd) { bd = d; best = l; } }
  if (best !== near) {
    near = best; const cap = $('caption');
    if (best) {
      $('cTitle').textContent = best.zh; $('cEn').textContent = best.en; $('cText').textContent = best.text; cap.classList.remove('off');
      const v = visited[city.id] || (visited[city.id] = []); if (!v.includes(best.id)) { v.push(best.id); try { localStorage.setItem('twoCities.visited', JSON.stringify(visited)); } catch (e) { } updateTally(); }
    } else cap.classList.add('off');
  }
}
const mapC = $('map'), mg = mapC.getContext('2d');
function drawMap() {
  const Wd = mapC.width, c = city, [x0, z0] = c.bounds, k = 2, v = visited[c.id] || [];
  mg.save(); mg.clearRect(0, 0, Wd, Wd); mg.beginPath(); mg.arc(Wd / 2, Wd / 2, Wd / 2, 0, TAU); mg.clip();
  mg.fillStyle = c.mapCol.bg; mg.fillRect(0, 0, Wd, Wd);
  const sx = (P.x - x0) * k - Wd / 2, sz = (P.z - z0) * k - Wd / 2;
  mg.drawImage(c.mapImg, -sx, -sz);
  for (const l of c.landmarks) {
    const x = (l.x - x0) * k - sx, y = (l.z - z0) * k - sz, seen = v.includes(l.id);
    const cx = clamp(x, 14, Wd - 14), cy = clamp(y, 14, Wd - 14), dx = cx - Wd / 2, dy = cy - Wd / 2, dd = Math.hypot(dx, dy), lim = Wd / 2 - 14;
    const px = dd > lim ? Wd / 2 + dx / dd * lim : cx, py = dd > lim ? Wd / 2 + dy / dd * lim : cy;
    mg.beginPath(); mg.moveTo(px, py - 9); mg.lineTo(px + 7, py); mg.lineTo(px, py + 9); mg.lineTo(px - 7, py); mg.closePath();
    mg.fillStyle = seen ? c.mapCol.seen : c.mapCol.todo; mg.fill(); mg.lineWidth = 2.5; mg.strokeStyle = seen ? c.mapCol.todo : c.mapCol.seen; mg.stroke();
  }
  mg.translate(Wd / 2, Wd / 2); mg.rotate(-P.yaw);
  mg.beginPath(); mg.moveTo(0, -16); mg.lineTo(10, 11); mg.lineTo(0, 5); mg.lineTo(-10, 11); mg.closePath();
  mg.fillStyle = c.mapCol.ink; mg.fill(); mg.lineWidth = 3; mg.strokeStyle = c.mapCol.todo; mg.stroke();
  mg.restore();
}

// ---------- 介面 ----------
document.body.classList.add('pre');
for (const b of document.querySelectorAll('#intro .ticket')) b.addEventListener('click', () => {
  const id = b.dataset.city; started = true; $('intro').hidden = true; document.body.classList.remove('pre');
  audio.start();
  if (id !== city.id) travel(id); else { applyCity(id); canvas.focus({ preventScroll: true }); }
});
$('swap').addEventListener('click', () => { audio.start(); travel(city.id === 'jaipur' ? 'varanasi' : 'jaipur'); });
$('sound').addEventListener('click', () => {
  const on = !audio.on; audio.setOn(on); if (on) audio.start();
  $('sound').setAttribute('aria-pressed', on); $('soundLabel').textContent = on ? '聲音開' : '聲音關'; $('wave').style.display = on ? '' : 'none';
});
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

// ---------- 迴圈 ----------
let last = performance.now(), T0 = last;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000), t = (now - T0) / 1000; last = now;
  if (started && !travelling) movePlayer(dt);
  else if (!started) { const ic = city.introCam; camera.position.set(ic.x, ic.y + city.world.heightAt(ic.x, ic.z), ic.z); camera.rotation.set(ic.pitch, ic.yaw + Math.sin(t * .12) * .25, 0); P.x = ic.x; P.z = ic.z; P.yaw = camera.rotation.y; }
  city.update(dt, t, P, audio.ctx ? audio : null);
  const sun = city.sun; sun.position.set(P.x + city.sunDir.x * 160, P.y + city.sunDir.y * 160, P.z + city.sunDir.z * 160); sun.target.position.set(P.x, P.y, P.z);
  if (started) { landmarks(); audio.tick(dt, city.id, P); }
  drawMap();
  renderer.render(city.scene, camera);
  requestAnimationFrame(frame);
}
try {
  applyCity('jaipur');
  renderer.render(city.scene, camera);
  $('boot').hidden = true;
  requestAnimationFrame(frame);
  // 預先在閒置時蓋好另一座城，換城時不用等
  (window.requestIdleCallback || (f => setTimeout(f, 1500)))(() => { try { getCity('varanasi'); } catch (e) { console.warn(e); } }, { timeout: 4000 });
} catch (e) {
  $('boot').hidden = false; $('boot').innerHTML = '<div><b>城市沒能搭起來</b><span>這個瀏覽器可能不支援 WebGL，換一個瀏覽器或裝置試試。</span></div>';
  console.warn(e);
}
window.__walk = { P, travel, get city() { return city.id; }, get started() { return started; } };
</script>
