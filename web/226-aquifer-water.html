  var tb=el('g',{},gMark); el('rect',{x:lx-4,y:ly-14,width:s.zh.length*15+70,height:20,fill:'#262421'},tb); el('text',{x:lx+2,y:ly+1,'font-size':13,'font-family':'PingFang TC, sans-serif',fill:'#f1ece0'},tb,s.zh+' · '+s.time);
  // 數值
  var tds=0; IONS.forEach(function(k){ tds+=s.ion[k]; }); tds=Math.round(tds-s.ion.HCO3*.49); // 蒸乾時碳酸氫根約一半變成二氧化碳逸散
  var hard=Math.round(s.ion.Ca*2.497+s.ion.Mg*4.118);
  count($('tds'),tds,'mg/L'); count($('hard'),hard,'mg/L'); $('ph').textContent=s.ph.toFixed(1);
  $('srcName').textContent=s.zh+(hard<60?' · 軟水':hard<120?' · 中等硬度':hard<180?' · 硬水':' · 極硬水');
  $('srcTime').textContent='地下停留：'+s.time;
  $('story').innerHTML=s.story;
  Array.prototype.forEach.call($('bars').children,function(b,k){ var v=s.ion[IONS[k]]; b.querySelector('u').style.width=logw(v)+'%'; b.querySelector('s').style.left=logw(TAP[IONS[k]])+'%'; b.querySelector('em').textContent=v<10?v.toFixed(1):Math.round(v); });
  var icons={0:'<svg viewBox="0 0 22 22"><path d="M5 6h12l-2 13H7z" fill="none" stroke="#262421" stroke-width="1.5"/><path d="M6.5 10h9" stroke="#2f6fb3" stroke-width="3"/></svg>',1:'<svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="8" fill="none" stroke="#262421" stroke-width="1.5"/><path d="M7 11h8" stroke="#2f6fb3" stroke-width="2"/></svg>'};
  $('pair').innerHTML=s.pair.map(function(p,k){ return '<li>'+icons[k]+'<span><b>'+p[0]+'</b><br>'+p[1]+'</span></li>'; }).join('');
  drip();
}
function count(node,to,unit){ var from=parseFloat(node.textContent)||0, t0=performance.now(); (function f(now){ var q=Math.min(1,(now-t0)/600), e=1-Math.pow(1-q,3); node.innerHTML=Math.round(from+(to-from)*e)+'<small>'+unit+'</small>'; if(q<1) requestAnimationFrame(f); })(t0); }
$('sources').addEventListener('click',function(e){ var b=e.target.closest('.src'); if(b) pick(+b.dataset.i); });
// 懸停地層
var tip=$('tip'), map=$('map');
gL.addEventListener('mousemove',function(e){ var t=e.target; if(!t.dataset||!t.dataset.zh) return; var b=map.getBoundingClientRect(); tip.textContent=t.dataset.zh+' · '+t.dataset.en; tip.style.left=(e.clientX-b.left+12)+'px'; tip.style.top=(e.clientY-b.top+12)+'px'; tip.style.opacity=1; });
gL.addEventListener('mouseleave',function(){ tip.style.opacity=0; });
// 氣泡沿斷層上升
(function bub(now){ Array.prototype.forEach.call(document.querySelectorAll('.co2'),function(c,i){ var y=540-((now/40+i*23)%330); c.setAttribute('cy',y); c.setAttribute('cx',762+(540-y)*.085+Math.sin(y*.1)*1.5); }); requestAnimationFrame(bub); })(0);
var ac=null; function drip(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; } if(ac.state!=='running') return; var t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(); o.frequency.setValueAtTime(1400,t); o.frequency.exponentialRampToValueAtTime(600,t+.09); g.gain.setValueAtTime(.06,t); g.gain.exponentialRampToValueAtTime(.0001,t+.14); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+.15); }
document.addEventListener('pointerdown',function(){ try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){} },{once:true});
pick(0);
})();
