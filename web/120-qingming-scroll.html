<!doctype html>
<!--
可調參數（在下方 CONFIG 修改）：
  scrollSpeed    自動展卷速度（場景單位／秒），預設 2.3，約 3 分鐘看完全卷
  crowd          人物、牲口與車轎數量倍率，0.4–1.5，預設 1
  inkLine        墨線濃度，0–1.5，預設 1
  maxPixelRatio  渲染解析度上限，預設 1.5
  startTime      初始時辰：mao 卯、wu 午、you 酉、xu 戌
所有屋舍、橋、船、人物、樹木、山巒、紙紋與聲音都由程式生成；唯一外部依賴為 CDN Three.js。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2c251c">
<meta name="description" content="3D 立體版《清明上河圖》：沿汴河展卷橫移，郊野、漕運、虹橋、城郭四章；絹本水墨調、時辰光影與合成市聲水聲風聲。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/web/120-qingming-scroll.html">
<title>汴河長卷｜3D 清明上河圖</title>
<style>
:root{--mount:#3b3326;--mount2:#29231a;--gold:#b59868;--silk:#ece2c9;--ink:#2a251f;--seal:#a8382b;--top:58px;--bot:96px;
  --kai:"Kaiti TC","BiauKai","DFKai-SB","標楷體","STKaiti","KaiTi","Noto Serif TC","Songti TC",serif;
  --ming:"Noto Serif TC","Songti TC","PMingLiU","新細明體","Source Han Serif TC",serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--mount2);color:var(--silk);font-family:var(--ming);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.band{position:fixed;left:0;right:0;z-index:4;background:
  radial-gradient(circle at 30% 40%,rgba(214,184,124,.075) 0 1.4px,transparent 1.9px) 0 0/13px 13px,
  radial-gradient(circle at 70% 60%,rgba(0,0,0,.2) 0 1.4px,transparent 1.9px) 6px 6px/13px 13px,
  linear-gradient(180deg,#453a2b,#2b241b)}
.top{top:0;height:calc(var(--top) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:inset 0 -1px 0 #0007}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.seal{flex:none;width:30px;height:30px;background:var(--seal);color:#f3e6cf;font-family:var(--kai);font-size:17px;display:grid;place-items:center;border-radius:3px;box-shadow:inset 0 0 0 2px #f3e6cf38,inset 0 0 7px #5a100a;line-height:1}
h1{margin:0;font-family:var(--kai);font-weight:400;font-size:22px;letter-spacing:.3em;white-space:nowrap;line-height:1.1}
.brand small{display:block;font-size:11px;letter-spacing:.28em;color:#bda77f;margin-top:3px;white-space:nowrap}
.ctrls{display:flex;align-items:center;gap:16px}
.grp{display:flex;align-items:center;gap:4px}
.cap{font-size:11px;color:#bda77f;letter-spacing:.2em;margin-right:5px;white-space:nowrap}
.note{font-size:11px;color:#bda77f;letter-spacing:.14em;margin-left:6px;min-width:5.2em;white-space:nowrap}
.tb{appearance:none;border:1px solid #b5986859;background:#0000002b;border-radius:2px;min-width:30px;height:30px;padding:0 6px;font-family:var(--kai);font-size:16px;cursor:pointer;color:#e6d8b8;transition:background .2s,border-color .2s,color .2s,opacity .2s;line-height:1}
.tb:hover{border-color:var(--gold)}
.tb[aria-pressed="true"]{background:var(--silk);color:var(--ink);border-color:var(--silk)}
.tb:focus-visible,.play:focus-visible,.ch:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#sndBtn{min-width:40px}
#sndBtn[aria-pressed="true"]{background:var(--seal);border-color:var(--seal);color:#f7ead2}
.snd.off .chip{opacity:.42}
.stage{position:fixed;left:0;right:0;top:calc(var(--top) + env(safe-area-inset-top,0px));bottom:calc(var(--bot) + env(safe-area-inset-bottom,0px));background:#e3d8bf;overflow:hidden}
.stage::before,.stage::after{content:"";position:absolute;left:0;right:0;height:5px;z-index:2;pointer-events:none;background:linear-gradient(#7d653f,#c8ad76 45%,#6f5a39)}
.stage::before{top:0}.stage::after{bottom:0}
#scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
#scene.drag{cursor:grabbing}
.inscr{position:absolute;top:24px;right:clamp(18px,3vw,46px);z-index:1;writing-mode:vertical-rl;display:flex;gap:12px;align-items:flex-start;color:var(--ink);pointer-events:none;font-family:var(--kai);text-shadow:0 0 9px rgba(241,233,214,.95),0 0 3px rgba(241,233,214,.95);transition:opacity .55s ease,filter .55s ease,color .9s,text-shadow .9s}
.inscr.swap{opacity:0;filter:blur(7px)}
.inscr .no{font-size:13px;letter-spacing:.42em;color:#5f5040}
.inscr h2{margin:0;font-weight:400;font-size:clamp(34px,4.3vw,62px);letter-spacing:.2em;line-height:1}
.inscr .sub{margin:0;font-size:clamp(14px,1.35vw,18px);letter-spacing:.22em;line-height:1.55;max-height:min(22em,62vh)}
.inscr .stamp{align-self:flex-start;background:var(--seal);color:#f5e8d0;font-size:13px;letter-spacing:.1em;padding:5px 3px;border-radius:2px;text-shadow:none;box-shadow:inset 0 0 0 1.5px #f5e8d040}
body.night .inscr{color:#efe4c8;text-shadow:0 0 10px rgba(18,20,28,.95),0 0 3px rgba(18,20,28,.9)}
body.night .inscr .no{color:#cdb88e}
.unroll{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:
  radial-gradient(ellipse at 50% 50%,#ece3cd 30%,#d9cba9 100%);clip-path:inset(0 0 0 0);transition:clip-path 2.9s cubic-bezier(.55,.05,.25,1)}
.unroll.open{clip-path:inset(0 100% 0 0)}
.unroll p{margin:0;font-family:var(--kai);font-size:18px;letter-spacing:.5em;color:#5a4b39;text-align:center;line-height:1.9;padding:0 24px}
.unroll.err p{letter-spacing:.12em;color:#7a2a20;max-width:30em}
/* The rod box spans the stage so translateX(%) moves it by the stage width (compositor-only); the wooden bar is ::before at its left edge. */
.rod{position:absolute;top:-6px;bottom:-6px;left:0;right:0;z-index:4;pointer-events:none;transform:translateX(100%);transition:transform 2.9s cubic-bezier(.55,.05,.25,1),opacity .6s 2.9s}
.rod::before{content:"";position:absolute;top:0;bottom:0;left:-10px;width:20px;border-radius:10px;
  background:linear-gradient(90deg,#3b2a1d,#8c6b47 38%,#b08a5c 50%,#6d5035 70%,#2e2117);box-shadow:0 0 14px #0008}
.rod.open{transform:translateX(0);opacity:0}
.bot{bottom:0;height:calc(var(--bot) + env(safe-area-inset-bottom,0px));padding:10px max(18px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:16px;box-shadow:inset 0 1px 0 #0007}
.play{flex:none;width:56px;height:56px;border-radius:50%;border:1px solid var(--gold);background:radial-gradient(circle at 35% 30%,#5d4b33,#2a2219);font-family:var(--kai);color:#f0e2c4;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;gap:3px}
.play b{font-weight:400;font-size:21px}.play small{font-size:9px;letter-spacing:.12em;color:#bda77f}
.tl{flex:1;min-width:0;position:relative;height:74px}
#mini{position:absolute;left:0;top:0;width:100%;height:42px;cursor:pointer;box-shadow:0 0 0 1px #b598687a,0 2px 7px #0007;touch-action:none;border-radius:1px}
.view{position:absolute;top:-3px;height:48px;border:1.5px solid rgba(176,58,44,.92);background:rgba(176,58,44,.09);pointer-events:none;border-radius:1px;min-width:6px}
.mk{position:absolute;top:36px;width:12px;height:12px;margin-left:-6px;background:var(--seal);border-radius:2px;pointer-events:none;box-shadow:0 0 0 1.5px #f1e3c7}
.chs{position:absolute;left:0;right:0;top:48px;height:26px}
.ch{position:absolute;top:0;height:26px;appearance:none;background:none;border:0;border-right:1px solid #b5986844;color:#b9a27a;font-family:var(--kai);font-size:14px;letter-spacing:.18em;cursor:pointer;white-space:nowrap;overflow:hidden;padding:0 4px;display:flex;align-items:center;justify-content:center;gap:.35em;transition:color .3s}
.ch b{font-weight:400;color:#c9705e}
.ch:hover,.ch[aria-current="true"]{color:#f4e7cb}
.ch[aria-current="true"] b{color:#ff9d84}
.hint{flex:none;font-size:11px;color:#a8946f;letter-spacing:.12em;line-height:1.75;text-align:right;white-space:nowrap}
.hint kbd{font:inherit;color:#d9c7a1}
@media (max-width:980px){.note,.cap{display:none}}
@media (max-width:780px){.hint{display:none}.brand small{display:none}}
@media (max-width:560px){:root{--top:52px;--bot:86px}
  .top{padding-left:12px;padding-right:12px;gap:8px}.brand{gap:7px}h1{font-size:16px;letter-spacing:.14em}
  .seal{width:25px;height:25px;font-size:14px}.ctrls{gap:8px}.grp{gap:3px}
  .tb{min-width:26px;height:28px;font-size:14px;padding:0 3px}#sndBtn{min-width:32px}
  .bot{gap:10px;padding-left:12px;padding-right:12px}.play{width:48px;height:48px}.play b{font-size:18px}
  .ch{font-size:12px;letter-spacing:.04em;gap:.2em}.inscr{top:14px;right:12px;gap:8px}.inscr .sub{font-size:13px}}
@media (max-width:370px){.brand h1{display:none}}
@media (prefers-reduced-motion:reduce){.unroll,.rod,.inscr{transition:none}}
</style>
</head>
<body>
<header class="band top">
  <div class="brand"><span class="seal" aria-hidden="true">汴</span><div><h1>汴河長卷</h1><small>清明上河 · 立體展卷</small></div></div>
  <div class="ctrls">
    <div class="grp" role="group" aria-label="時辰">
      <span class="cap">時辰</span>
      <button class="tb tod" data-t="mao" aria-pressed="false" title="卯時 · 晨霧初開">卯</button>
      <button class="tb tod" data-t="wu" aria-pressed="false" title="午時 · 日正當中">午</button>
      <button class="tb tod" data-t="you" aria-pressed="false" title="酉時 · 夕照西斜">酉</button>
      <button class="tb tod" data-t="xu" aria-pressed="false" title="戌時 · 華燈初上">戌</button>
      <span class="note" id="todNote" aria-live="polite"></span>
    </div>
    <div class="grp snd off" id="sndGrp" role="group" aria-label="環境音">
      <button class="tb" id="sndBtn" aria-pressed="false" title="環境音開關">聲</button>
      <button class="tb chip" data-layer="crowd" aria-pressed="true" title="市集人聲">市</button>
      <button class="tb chip" data-layer="water" aria-pressed="true" title="汴河水聲">水</button>
      <button class="tb chip" data-layer="wind" aria-pressed="true" title="郊野風聲">風</button>
    </div>
  </div>
</header>

<main class="stage" id="stage">
  <canvas id="scene" tabindex="0" aria-label="3D 汴河長卷。拖曳可環視，滾輪縮放，左右方向鍵沿河移動"></canvas>
  <div class="inscr" id="inscr" aria-live="polite">
    <span class="no" id="cNo">第壹章</span>
    <h2 id="cTitle">郊野</h2>
    <p class="sub" id="cSub"></p>
    <span class="stamp" id="cSeal">春寒</span>
  </div>
  <div class="unroll" id="unroll"><p id="loadMsg">研墨鋪絹…</p></div>
  <div class="rod" id="rod" aria-hidden="true"></div>
</main>

<footer class="band bot">
  <button class="play" id="play" aria-label="展卷"><b id="playK">展</b><small id="playS">展卷</small></button>
  <div class="tl" role="group" aria-label="章節時間軸（由右往左展讀）">
    <canvas id="mini" aria-label="全卷縮圖，點擊或拖曳可跳到該處"></canvas>
    <div class="view" id="view"></div>
    <div class="mk" id="mk"></div>
    <div class="chs" id="chs"></div>
  </div>
  <div class="hint">拖曳環視 · 滾輪縮放 · <kbd>Shift</kbd>＋滾輪移卷<br><kbd>空白鍵</kbd> 展停 · <kbd>1</kbd>–<kbd>4</kbd> 章節 · <kbd>←</kbd><kbd>→</kbd> 沿河</div>
</footer>

<script type="module">
const CONFIG={scrollSpeed:2.3,crowd:1,inkLine:1,maxPixelRatio:1.5,startTime:'wu'};
const $=id=>document.getElementById(id);
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function fail(msg){const u=$('unroll');u.classList.add('err');$('loadMsg').textContent=msg}
let THREE;
try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js')}
catch(e){try{THREE=await import('../vendor/three-0.186.0/three.module.js')}catch(e2){fail('無法載入 Three.js。請確認網路連線後重新整理。');throw e2}}
const canvas=$('scene'),stageEl=$('stage');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'})}
catch(e){fail('此瀏覽器無法建立 WebGL，請改用支援 WebGL 的瀏覽器。');throw e}
const small=Math.min(innerWidth,innerHeight)<700;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;

// ─── 基本工具 ───────────────────────────────────────────
const TAU=Math.PI*2,V3=THREE.Vector3,UP=new V3(0,1,0),C=c=>new THREE.Color(c);
let sd=20260924;
const rnd=()=>{sd=(sd*1664525+1013904223)>>>0;return sd/4294967296};
const R=(a,b)=>a+(b-a)*rnd(),pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
const h1=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const n1=x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(h1(i),h1(i+1),u)};
const fbm1=(x,o=4)=>{let s=0,a=.5,f=1,t=0;for(let i=0;i<o;i++){s+=a*n1(x*f+i*17.3);t+=a;f*=2.07;a*=.5}return s/t};
const h2=(x,z)=>{const s=Math.sin(x*127.1+z*311.7)*43758.5453;return s-Math.floor(s)};
const n2=(x,z)=>{const i=Math.floor(x),j=Math.floor(z),fx=x-i,fz=z-j,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);return lerp(lerp(h2(i,j),h2(i+1,j),u),lerp(h2(i,j+1),h2(i+1,j+1),u),v)};
const rot=(lx,lz,ry)=>[lx*Math.cos(ry)+lz*Math.sin(ry),-lx*Math.sin(ry)+lz*Math.cos(ry)];

// ─── 汴河、道路與章節（p 為展卷進度，世界座標 x = -p，鏡頭由右往左）───
const RZ=[-42,-40,-38,-34,-26,-14,-5,-2,0,-2,-30,-66,-80,-84,-86,-86,-86];
const RW=[8,8,9,10,13,20,25,27,26,24,20,16,14,14,14,14,14];
const DZ=[22,20,18,17,17,18,20,23,25,23,16,10,10,10,10,10,10];
function cat(arr,p){const f=(p+80)/40,i=Math.floor(f),t=f-i,g=k=>arr[clamp(k,0,arr.length-1)],a=g(i-1),b=g(i),c=g(i+1),d=g(i+2);return .5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t)}
const riverZ=p=>cat(RZ,p),riverW=p=>cat(RW,p),roadZ=p=>cat(DZ,p),focusZ=p=>cat(DZ,p)-4;
const backRoad=p=>riverZ(p)-riverW(p)/2-6;
const slope=(f,p)=>f(p+.5)-f(p-.5);
const PSTART=16,PEND=404,BRIDGE_P=262,WALL_P=338,CROSS=[362,395,428];
const BX=-BRIDGE_P,BZ=riverZ(BRIDGE_P),BW=riverW(BRIDGE_P),AS=BW/2+.6,BS=AS+2.4,BH=5.5;
const archY=s=>(BH-.5)*(1-(s/AS)**2)-.2;
const deckY=s=>{const a=Math.abs(s);return a<=AS?archY(s)+.5:a<=BS?lerp(.3,0,(a-AS)/(BS-AS)):0};
const WATER=-.95;
const CH=[
  {k:'壹',name:'郊野',tag:'春寒',line:'寒林漠漠春猶淺，驢隊馱薪入汴京。',from:0,to:110,at:24},
  {k:'貳',name:'汴河',tag:'漕運',line:'千帆銜尾泊長堤，縴夫聲裡米船西。',from:110,to:215,at:150},
  {k:'參',name:'虹橋',tag:'市聲',line:'飛梁無柱跨長波，橋上行人似水多。',from:215,to:312,at:BRIDGE_P},
  {k:'肆',name:'城郭',tag:'街市',line:'譙樓高處角聲遠，十里長街酒旆斜。',from:312,to:420,at:352},
];
const inRiver=(p,z,m=0)=>Math.abs(z-riverZ(p))<riverW(p)/2+m;
const onWall=(p,z,m=0)=>Math.abs(p-WALL_P)<4.6+m&&z>-44&&z<96;
function onStreet(p,z,m=0){
  if(Math.abs(z-roadZ(p))<2.7+m)return true;
  if(p>122&&p<306&&Math.abs(z-backRoad(p))<2+m)return true;
  if(p>341){if(Math.abs(z+16)<2+m||Math.abs(z-34)<2+m)return true;for(const c of CROSS)if(Math.abs(p-c)<2+m&&z>-46&&z<60)return true}
  if(Math.abs(p-BRIDGE_P)<4.6+m&&z>BZ-BS-2.5&&z<roadZ(p))return true;
  return false}
const landOK=(p,z,m=0)=>!inRiver(p,z,m+.9)&&!onStreet(p,z,m)&&!onWall(p,z,m);

// ─── 幾何工具（程序建模、頂點色、合併）───────────────────
function paint(g,col){if(g.index)g=g.toNonIndexed();const c=C(col),n=g.attributes.position.count,a=new Float32Array(n*3);for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b}g.setAttribute('color',new THREE.BufferAttribute(a,3));if(!g.attributes.normal)g.computeVertexNormals();return g}
const O=new THREE.Object3D();
function pose(g,p=[0,0,0],r=[0,0,0],s=1){O.position.fromArray(p);O.rotation.set(r[0],r[1],r[2]);typeof s==='number'?O.scale.setScalar(s):O.scale.fromArray(s);O.updateMatrix();return g.applyMatrix4(O.matrix)}
const part=(g,col,p,r,s)=>paint(pose(g,p,r,s),col);
function merge(list){let n=0;for(const g of list)n+=g.attributes.position.count;const P=new Float32Array(n*3),N=new Float32Array(n*3),Cc=new Float32Array(n*3);let o=0;
  for(const g of list){P.set(g.attributes.position.array,o);N.set(g.attributes.normal.array,o);Cc.set(g.attributes.color.array,o);o+=g.attributes.position.count*3}
  const m=new THREE.BufferGeometry();m.setAttribute('position',new THREE.BufferAttribute(P,3));m.setAttribute('normal',new THREE.BufferAttribute(N,3));m.setAttribute('color',new THREE.BufferAttribute(Cc,3));m.computeBoundingSphere();return m}
function sheet(rows){const a=[];for(let i=0;i<rows.length-1;i++){const A=rows[i],B=rows[i+1];for(let j=0;j<A.length-1;j++){const p=A[j],q=A[j+1],r=B[j],s=B[j+1];a.push(p.x,p.y,p.z,r.x,r.y,r.z,q.x,q.y,q.z,q.x,q.y,q.z,r.x,r.y,r.z,s.x,s.y,s.z)}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));g.computeVertexNormals();return g}
function tris(a){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));g.computeVertexNormals();return g}
const TILE='#56624f',RIDGE='#2f342e',GABLE='#d4c8ab';
// 懸山頂：中國屋面的凹曲線，兩端微微生起
function gableGeo(steep,lift,tile,ridge,gable){
  const side=sg=>{const rows=[];for(let i=0;i<=6;i++){const t=i/6,row=[];for(let j=0;j<=6;j++){const s=j/3-1;row.push(new V3(s*.5,Math.pow(t,steep)+lift*Math.abs(s)**3*(1-t),sg*.5*(1-t)))}rows.push(row)}return rows};
  const parts=[paint(sheet(side(1)),tile),paint(sheet(side(-1)),tile)];
  for(const sx of [-.44,.44]){const a=[];for(let i=0;i<12;i++){const z1=.46-i*.0767,z2=.46-(i+1)*.0767,y1=Math.pow(1-Math.abs(z1)/.5,steep)-.02,y2=Math.pow(1-Math.abs(z2)/.5,steep)-.02;a.push(sx,0,z1,sx,Math.max(0,y1),z1,sx,Math.max(0,y2),z2,sx,0,z1,sx,Math.max(0,y2),z2,sx,0,z2)}parts.push(paint(tris(a),gable))}
  parts.push(part(new THREE.BoxGeometry(1.02,.09,.08),ridge,[0,1.01,0]));
  for(const sx of [-.5,.5])parts.push(part(new THREE.BoxGeometry(.07,.2,.1),ridge,[sx,1.07,0],[0,0,-sx*.7]));
  return merge(parts)}
// 廡殿頂：四坡凹曲面，翼角起翹
function hipGeo(steep,lift,rx,tile,ridge){
  const K=6,M=6,parts=[],Y=(t,s)=>Math.pow(t,steep)+lift*Math.abs(s)**3*Math.pow(1-t,1.5);
  for(const sg of [1,-1]){const rows=[];for(let i=0;i<=K;i++){const t=i/K,hx=.5-(.5-rx)*t,row=[];for(let j=0;j<=M;j++){const s=j/M*2-1;row.push(new V3(s*hx,Y(t,s),sg*.5*(1-t)))}rows.push(row)}parts.push(paint(sheet(rows),tile))}
  for(const sg of [1,-1]){const rows=[];for(let i=0;i<=K;i++){const t=i/K,hz=.5*(1-t),x=sg*(.5-(.5-rx)*t),row=[];for(let j=0;j<=M;j++){const s=j/M*2-1;row.push(new V3(x,Y(t,s),s*hz))}rows.push(row)}parts.push(paint(sheet(rows),tile))}
  parts.push(part(new THREE.BoxGeometry(rx*2+.04,.08,.07),ridge,[0,1,0]));
  for(const sx of [-rx,rx])parts.push(part(new THREE.BoxGeometry(.06,.18,.09),ridge,[sx,1.06,0],[0,0,-Math.sign(sx)*.55]));
  return merge(parts)}

function hull(L,W,D,cH,cD){const N=14,rows=[],deck=[];
  for(let i=0;i<=N;i++){const t=i/N,z=(t-.5)*L,e=Math.abs(2*t-1),hw=W/2*Math.max(.16,Math.sqrt(Math.max(0,1-e**2.6))),top=.45+.6*e**3,bot=-D+D*.8*e**2.2;
    rows.push([new V3(-hw,top,z),new V3(-hw*.9,(top+bot)/2,z),new V3(-hw*.4,bot,z),new V3(hw*.4,bot,z),new V3(hw*.9,(top+bot)/2,z),new V3(hw,top,z)]);
    deck.push([new V3(-hw*.97,top-.1,z),new V3(hw*.97,top-.1,z)])}
  const g=[paint(sheet(rows),cH),paint(sheet(deck),cD)];
  for(const r of [rows[0],rows[N]]){const a=[],c0=r[0];for(let j=1;j<r.length-1;j++)a.push(c0.x,c0.y,c0.z,r[j].x,r[j].y,r[j].z,r[j+1].x,r[j+1].y,r[j+1].z);g.push(paint(tris(a),cH))}
  return g}

class Batch{
  constructor(geo,mat,shadow=true){this.g=geo;this.m=mat;this.sh=shadow;this.items=[];ALLB.push(this)}
  add(x,y,z,ry=0,sx=1,sy=sx,sz=sx,col='#ffffff',rx=0,rz=0){D.position.set(x,y,z);D.rotation.set(rx,ry,rz);D.scale.set(sx,sy,sz);D.updateMatrix();this.items.push([D.matrix.clone(),C(col)])}
  addM(m,col){this.items.push([m.clone(),C(col)])}
  build(){const groups=new Map();for(const it of this.items){const k=Math.floor(it[0].elements[12]/CHUNK);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(it)}

    this.items=null}

}

  for(const b of boats){if(b.tow||b.p<lo||b.p>hi)continue;
    if(b.v){b.p+=b.dir*b.v*dt;if(b.p>b.b)b.dir=-1;else if(b.p<b.a)b.dir=1;b.h+=angDiff(boatYaw(b.p,b.dir),b.h)*Math.min(1,dt*.6)}
