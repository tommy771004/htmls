<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VELORA · REGAL DRIVE</title>
<meta name="description" content="Dark luxury car-rental hero built around transparency: a background video that never stops, frosted-glass letters that let the road show through, and a glass dock holding the copy.">
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow-x: hidden; max-width: 100vw; }
body { background: #0a0a0b; color: #fff; font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
a { text-decoration: none; color: inherit; }
a:hover { color: #fff; }

:root {
  --gutter: 40px;
  --glass-fill: rgba(255,255,255,0.07);
  --glass-edge: rgba(255,255,255,0.16);
  --glass-lip: rgba(255,255,255,0.45);
  --glass-shadow: rgba(8,8,10,0.28);
}

.hero { position: relative; width: 100%; height: 100vh; min-height: 720px; overflow: hidden; background: #0a0a0b; }
.hero__video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 60%; pointer-events: none; z-index: 0; }
/* Lighter than a plain scrim on purpose: the video has to stay readable through the glass. */
.hero__shade { position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, rgba(8,8,10,0.42) 0%, rgba(8,8,10,0.06) 28%, rgba(8,8,10,0.10) 60%, rgba(8,8,10,0.58) 100%); }

/* One glass material, shared by the bar, the dock and the buttons. */
.glass {
  background: var(--glass-fill);
  -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5);
  border: 1px solid var(--glass-edge);
  box-shadow: inset 0 1px 0 var(--glass-lip), inset 0 -1px 0 rgba(255,255,255,0.05), 0 2px 3px var(--glass-shadow);
}

/* Floating bar, inset from every edge. */
.bar { position: absolute; top: var(--gutter); left: var(--gutter); right: var(--gutter); z-index: 3;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 12px 14px 12px 26px; border-radius: 16px; }
.bar__links { display: flex; align-items: center; gap: 30px; list-style: none; }
.bar__links a { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.78); }
.bar__links a.is-active { color: #fff; }
.bar__logo { color: #fff; font-size: 24px; font-weight: 700; letter-spacing: 0.06em; text-align: center; }
.bar__right { display: flex; justify-content: flex-end; }
.btn { display: inline-flex; align-items: center; gap: 10px; color: #fff; font: inherit; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; padding: 11px 20px; border-radius: 11px; cursor: pointer; transition: background .22s ease, color .22s ease, border-color .22s ease; }
.btn span { font-size: 15px; }
.btn:hover { background: rgba(255,255,255,0.92); color: #0a0a0b; border-color: #fff; box-shadow: inset 0 1px 0 #fff, 0 2px 3px var(--glass-shadow); }

/* Glass letters. The outline and the mask text live in the same SVG, so they share one set of coordinates.
   The h1 stays in the DOM for semantics but is visually hidden. */
.mark { position: absolute; left: 0; width: 100%; top: 40%; transform: translateY(-50%); z-index: 2; height: 1em; font-size: 13.3vw; line-height: 1; pointer-events: none; }
.mark__stroke { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mark__fill { display: none; position: absolute; inset: 0; }
.mark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.mark svg text { font-family: 'Archivo', system-ui, sans-serif; font-weight: 800; font-size: 13.3vw; letter-spacing: -0.03em; }
.mark__outline { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.55); stroke-width: 1.5px; paint-order: stroke; }
@supports ((-webkit-mask: url(#x)) or (mask: url(#x))) and ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .mark__fill { display: block;
    -webkit-backdrop-filter: blur(14px) saturate(1.6) brightness(1.35); backdrop-filter: blur(14px) saturate(1.6) brightness(1.35);
    background: linear-gradient(180deg, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0.10) 42%, rgba(255,255,255,0.04) 100%);
    -webkit-mask: url(#letters); mask: url(#letters); }
  .mark__outline { fill: none; stroke: rgba(255,255,255,0.7); stroke-width: 1px; }
}

/* The dock: one wide glass slab at the foot, two columns inside. */
.dock { position: absolute; left: var(--gutter); right: var(--gutter); bottom: var(--gutter); z-index: 3;
  display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; align-items: end; padding: 34px 40px; border-radius: 22px; }
.dock h2 { color: #fff; font-weight: 600; text-wrap: balance; font-size: clamp(34px, 4.6vw, 60px); line-height: 0.98; letter-spacing: -0.02em; }
.dock__side { display: flex; flex-direction: column; align-items: flex-start; gap: 22px; }
.dock p { color: rgba(255,255,255,0.82); font-size: 15px; font-weight: 400; line-height: 1.5; max-width: 440px; }
.dock .btn { letter-spacing: 0.04em; padding: 13px 24px; gap: 12px; }

@media (max-width: 900px) {
  :root { --gutter: 20px; }
  .bar { grid-template-columns: auto 1fr auto; padding: 10px 10px 10px 18px; }
  .bar__logo { order: -1; text-align: left; font-size: 20px; }
  .bar__links { justify-content: center; gap: 18px; }
  .bar__links a { font-size: 13px; }
  .mark { top: 42%; }
  .dock { grid-template-columns: 1fr; gap: 18px; padding: 24px 22px; border-radius: 18px; }
}
@media (max-width: 560px) {
  :root { --gutter: 14px; }
  .bar { grid-template-columns: 1fr auto; row-gap: 10px; }
  .bar__links { grid-column: 1 / -1; justify-content: flex-start; }
  .dock h2 { font-size: clamp(30px, 8.6vw, 40px); }
}
</style>
</head>
<body>
<section class="hero">
  <video class="hero__video" id="bg" autoplay muted loop playsinline preload="auto" aria-hidden="true"
    src="https://cdn.sceneai.art/Hero%20section%20video%20file%20(2)/37091057-3719-4207-815c-745ebf57aeb4.mp4"></video>
  <div class="hero__shade"></div>

  <nav class="bar glass" aria-label="Primary">
    <ul class="bar__links">
      <li><a href="#" class="is-active" aria-current="page">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Cars</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <a href="#" class="bar__logo">VELORA</a>
    <div class="bar__right"><button type="button" class="btn glass">Browse cars <span aria-hidden="true">→</span></button></div>
  </nav>

  <div class="mark">
    <h1 class="mark__stroke">REGAL DRIVE</h1>
    <div class="mark__fill" aria-hidden="true"></div>
    <svg aria-hidden="true" focusable="false">
      <defs>
        <mask id="letters" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
          <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="#fff">REGAL DRIVE</text>
        </mask>
      </defs>
      <text class="mark__outline" x="50%" y="50%" text-anchor="middle" dominant-baseline="central">REGAL DRIVE</text>
    </svg>
  </div>

  <div class="dock glass">
    <h2>Rent Your Dream Luxury Car Today</h2>
    <div class="dock__side">
      <p>Enjoy a premium rental experience with exclusive cars, seamless booking, and honest pricing.</p>
      <button type="button" class="btn glass">DISCOVER NOW <span aria-hidden="true">↗</span></button>
    </div>
  </div>
</section>

<script>
(function () {
  var v = document.getElementById('bg');
  if (!v) return;
  v.muted = true;
  v.defaultMuted = true;
  v.loop = true;
  function resume() {
    if (v.paused) {
      try { var p = v.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    }
  }
  resume();
  ['pause', 'ended', 'loadedmetadata', 'canplay'].forEach(function (ev) { v.addEventListener(ev, resume); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) resume(); });
  var watchdog = setInterval(resume, 1000);
  window.addEventListener('pagehide', function () { clearInterval(watchdog); });
})();
</script>
</body>
</html>
