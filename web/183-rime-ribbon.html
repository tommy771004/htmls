<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>冰帶 · RIME RIBBON</title>
<meta name="description" content="騎著單車在懸浮太空的莫比烏斯冰帶上漂移：捲浪冰管、半扭翻面、金環連擊、隕石與空中迴旋。騎完一圈會發現自己在冰帶背面，再一圈才回到起點。">
<meta name="theme-color" content="#030507">
<link rel="icon" href="../favicon.svg">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"}}</script>
<style>
:root{
  --ink:#f3f7f6;
  --ink-dim:rgba(233,244,242,.62);
  --ink-faint:rgba(233,244,242,.34);
  --gold:#f5c542;
  --gold-soft:#e9c872;
  --teal:#3fc3c1;
  --mauve:#a9809c;
  --glass:rgba(6,16,18,.46);
  --glass-edge:rgba(160,220,216,.16);
  --ease-out:cubic-bezier(.22,1,.36,1);
  --gut:max(16px, env(safe-area-inset-left));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#030507;color:var(--ink);overflow:hidden;
  font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;transition:opacity .5s var(--ease-out)}
body.title #hud{opacity:0}
body.title #hud *{pointer-events:none!important}
body.overlay #touch,body.overlay #keys,body.overlay #toast,body.overlay #gauge,body.overlay #pops,body.overlay #chain{visibility:hidden}
.ib{pointer-events:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:var(--glass);box-shadow:inset 0 0 0 1px var(--glass-edge),inset 0 1px 0 rgba(255,255,255,.08);
  -webkit-backdrop-filter:blur(8px) saturate(1.2);backdrop-filter:blur(8px) saturate(1.2);transition:background .18s}
.ib:hover{background:rgba(20,44,46,.6)}
button:focus{outline:none}
button:focus-visible{outline:2px solid rgba(233,244,242,.75);outline-offset:3px}
.ib:active{background:rgba(40,80,80,.66)}
.ib svg{width:20px;height:20px;display:block}
#bMap[aria-pressed="true"]{background:rgba(233,244,242,.86);color:#07292a}
#bCam{position:absolute;left:var(--gut);top:max(16px,env(safe-area-inset-top))}
.tr{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));display:flex;gap:8px}

#stat{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);text-align:center;
  text-shadow:0 1px 2px rgba(0,20,22,.55)}
#stat .r1{display:inline-flex;align-items:baseline;justify-content:center;gap:6px;white-space:nowrap}
#spd{font-size:28px;font-weight:650;letter-spacing:.01em;min-width:2.1em;text-align:right}
#stat i{font-style:normal;font-size:11px;color:var(--ink-dim);margin-right:10px}
#stat .sep{width:1.5px;height:18px;border-radius:1px;background:var(--ink-faint);align-self:center;margin-right:10px}
#tm{font-size:17px;font-weight:550;min-width:4.2em;text-align:left}
#stat .r2{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:3px;font-size:12.5px;white-space:nowrap}
#rg{color:var(--gold-soft);display:inline-flex;align-items:center;gap:4px}
#rg svg{width:14px;height:12px}
#sc{font-size:14.5px;font-weight:600;min-width:4.5em}
#mu{color:var(--gold);font-weight:650;min-width:2.6em;text-align:left;transition:color .3s}
#mu.bump{color:#fff}
#pg{position:relative;width:132px;height:3px;margin:7px auto 0;display:flex;gap:3px}
#pg .h{flex:1;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
#pg .h b{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);border-radius:2px}
#pg .a b{background:var(--teal)}
#pg .b b{background:var(--mauve)}
#side{font-size:11px;color:var(--ink-dim);margin-top:5px;letter-spacing:.04em}
#chain{height:16px;margin-top:3px;font-size:12.5px;font-weight:650;color:var(--gold-soft);opacity:0;transition:opacity .2s}
#chain.show{opacity:1}
#count{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(.9);font-size:clamp(72px,10vw,128px);font-weight:800;letter-spacing:.03em;
  text-shadow:0 2px 20px rgba(0,30,32,.4);opacity:0;transition:opacity .15s,transform .35s var(--ease-out)}
#count.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.pop{position:absolute;left:0;top:0;font-weight:700;font-size:14px;color:var(--gold);text-shadow:0 1px 3px rgba(0,20,22,.7);white-space:nowrap;will-change:transform,opacity;opacity:0}
.pop.w{color:#eefcfb}

#keys{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;align-items:center}
kbd{font:600 10px/1 system-ui,sans-serif;min-width:22px;height:22px;padding:0 6px;display:grid;place-items:center;border-radius:4px;
  color:var(--ink-dim);background:rgba(6,16,18,.42);box-shadow:inset 0 0 0 1px rgba(200,240,236,.18),inset 0 -2px 0 rgba(0,0,0,.25);
  transition:background .08s,color .08s}
kbd.wide{padding:0 12px;margin-left:6px;letter-spacing:.06em}
kbd.on{background:rgba(236,248,246,.92);color:#0a2b2c;box-shadow:inset 0 0 0 1px #fff}
#bReset{pointer-events:auto;width:26px;height:26px;border-radius:50%;margin-left:8px;display:grid;place-items:center;color:var(--ink-dim);
  background:rgba(6,16,18,.42);box-shadow:inset 0 0 0 1px rgba(200,240,236,.18)}
#bReset svg{width:14px;height:14px}
#bReset:hover{color:var(--ink)}

#gauge{position:absolute;left:0;top:0;width:46px;height:3px;border-radius:2px;background:rgba(0,0,0,.25);opacity:0;transition:opacity .2s;will-change:transform}
#gauge span{position:absolute;inset:0;border-radius:2px;background:var(--gold);transform-origin:left;transform:scaleX(0)}
#gauge.t2 span{background:#ffd98a}
#gauge.t3 span{background:#fff6e0}
#gauge.show{opacity:1}

#toast{position:absolute;left:50%;top:28%;transform:translate(-50%,0);font-size:15px;font-weight:600;letter-spacing:.03em;white-space:nowrap;
  text-shadow:0 1px 3px rgba(0,20,22,.7);opacity:0;transition:opacity .25s,transform .45s var(--ease-out)}
#toast small{display:block;font-size:12px;font-weight:500;color:var(--ink-dim);margin-top:3px;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,-6px)}

#map{position:absolute;right:max(16px,env(safe-area-inset-right));top:68px;width:150px;height:150px;border-radius:12px;
  background:rgba(4,12,14,.5);box-shadow:inset 0 0 0 1px var(--glass-edge);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#map[hidden]{display:none}

#touch{display:none}
body.touch #keys{display:none}
body.touch #touch{display:block}
#touch button{pointer-events:auto;position:absolute;bottom:max(20px,env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;
  background:rgba(6,16,18,.42);box-shadow:inset 0 0 0 1px rgba(200,240,236,.2);font-size:14px;font-weight:600;color:var(--ink);
  display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
#touch button.on{background:rgba(236,248,246,.9);color:#0a2b2c}
#touch svg{width:22px;height:22px}
#tL{left:var(--gut)} #tR{left:calc(var(--gut) + 76px)}
#tD{right:calc(max(16px,env(safe-area-inset-right)) + 76px)} #tJ{right:max(16px,env(safe-area-inset-right))}

/* 卡片 */
.card{position:fixed;left:0;right:0;bottom:0;padding:0 var(--gut) max(34px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:flex-start;pointer-events:none}
.card[hidden]{display:none}
.card > *{pointer-events:auto}
.card .veil{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(to top,rgba(2,6,8,.78) 0%,rgba(2,6,8,.52) 22%,rgba(2,6,8,.18) 44%,rgba(2,6,8,0) 62%)}
#title{padding-left:max(6vw,var(--gut))}
.wm{display:flex;align-items:baseline;gap:.35em;flex-wrap:wrap}
.wm h1{font-size:clamp(64px,11vw,148px);font-weight:800;line-height:.92;letter-spacing:.02em;
  text-shadow:0 2px 24px rgba(0,30,32,.35)}
.wm span{font-size:clamp(13px,1.3vw,17px);font-weight:600;letter-spacing:.42em;color:var(--ink-dim);text-transform:uppercase}
.lead{max-width:34em;margin-top:18px;font-size:15.5px;line-height:1.7;color:rgba(236,246,244,.84)}
.ctl{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;font-size:13px;color:var(--ink-dim)}
.ctl b{font-weight:600;color:var(--ink);margin-right:5px}
.go{margin-top:26px;display:flex;align-items:center;gap:20px}
.btn{pointer-events:auto;height:48px;padding:0 30px 0 26px;border-radius:3px 24px 24px 3px;background:#e8f7f5;color:#062a2b;font-weight:700;font-size:16px;letter-spacing:.08em;
  display:inline-flex;align-items:center;gap:12px;box-shadow:0 2px 3px rgba(0,40,40,.25);transition:background .18s}
.btn:hover{background:#fff}
.btn svg{width:16px;height:16px;transition:transform .25s var(--ease-out)}
.btn:hover svg{transform:translateX(4px)}
.best{font-size:13px;color:var(--ink-dim)}
.stats{display:flex;flex-wrap:wrap;gap:10px 34px;margin-top:22px}
.stats div{display:flex;flex-direction:column;gap:4px}
.stats dt{font-size:12.5px;color:var(--ink-dim)}
.stats dd{font-size:30px;font-weight:650}
#pause h2,#done h2{font-size:clamp(34px,5vw,56px);font-weight:800;letter-spacing:.02em}
.row{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn.alt{background:none;box-shadow:none;color:var(--ink-dim);padding:0 10px;letter-spacing:.04em;font-weight:600}
.btn.alt:hover{background:none;color:var(--ink)}

#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:15px;line-height:1.7;background:#030507}
#load{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;color:var(--ink-dim);letter-spacing:.1em}

@media (max-width:640px){
  #spd{font-size:22px}
  #tm{font-size:14px}
  #stat .r2{gap:10px;font-size:11.5px}
  #sc{font-size:12.5px}
  #pg{width:108px}
  .ib{width:36px;height:36px}
  .tr{gap:6px}
  #stat{top:max(12px,env(safe-area-inset-top))}
  #bCam{top:max(12px,env(safe-area-inset-top))}
  .tr{top:max(12px,env(safe-area-inset-top))}
  #map{top:58px;width:120px;height:120px}
  .lead{font-size:14.5px}
  .stats dd{font-size:24px}
  .ctl{display:none}
  #toast{font-size:14px;top:24%}
}
@media (max-width:420px){
  #stat{left:auto;right:auto;transform:none;width:100%;pointer-events:none}
  .tr .ib:first-child{display:none}
}
@media (max-height:520px){
  .card{padding-bottom:max(16px,env(safe-area-inset-bottom))}
  .wm h1{font-size:clamp(44px,8vh,60px)}
  .lead{margin-top:8px;font-size:13.5px;line-height:1.55}
  .ctl{display:none}
  .go,.row{margin-top:14px}
  .btn{height:42px}
  .stats{margin-top:12px}
  .stats dd{font-size:22px}
  #pause h2,#done h2{font-size:30px}
  #map{width:110px;height:110px;top:58px}
  #touch button{width:56px;height:56px;bottom:max(12px,env(safe-area-inset-bottom))}
  #tR{left:calc(var(--gut) + 66px)} #tD{right:calc(max(16px,env(safe-area-inset-right)) + 66px)}
}
@media (prefers-reduced-motion:reduce){
  .btn svg,#toast,#hud{transition:none}
}
</style>
</head>
<body class="title">
<canvas id="gl"></canvas>
<div id="load">冰帶成形中…</div>

<div id="hud" aria-live="off">
  <button class="ib" id="bCam" aria-label="切換視角" title="切換視角（C）">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 6.5V3.5h3M17.5 6.5V3.5h-3M2.5 13.5v3h3M17.5 13.5v3h-3"/><circle cx="10" cy="10" r="2.6"/></svg>
  </button>
  <div id="stat">
    <div class="r1"><b id="spd" class="num">0</b><i>km/h</i><span class="sep"></span><span id="tm" class="num">0:00.0</span></div>
    <div class="r2">
      <span id="rg" class="num"><svg viewBox="0 0 14 12" fill="none" stroke="currentColor" stroke-width="1.9"><ellipse cx="7" cy="6" rx="5.4" ry="2.9" transform="rotate(-24 7 6)"/></svg><span id="rgN">0</span></span>
      <span id="sc" class="num">0</span>
      <span id="mu" class="num">×1.0</span>
    </div>
    <div id="pg"><span class="h a"><b id="pgA"></b></span><span class="h b"><b id="pgB"></b></span></div>

  <div class="tr">
    <button class="ib" id="bMap" aria-label="路線圖" aria-pressed="false" title="路線圖（M）">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 3.2c2.6 0 3.4 3.4 1.6 6.2-1.9 2.9-5.6 5.2-7.4 3.6-1.7-1.5.6-4.6 5.8-4.6s7.5 3.1 5.8 4.6c-1.8 1.6-5.5-.7-7.4-3.6C6.6 6.6 7.4 3.2 10 3.2z"/></svg>
    </button>
    <button class="ib" id="bSnd" aria-label="聲音" aria-pressed="false" title="聲音（N）">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8h3l4-3.2v10.4l-4-3.2h-3z"/><path id="sndW" d="M13.4 7.4a3.6 3.6 0 0 1 0 5.2M15.6 5.4a6.4 6.4 0 0 1 0 9.2"/><path id="sndX" d="M13.5 7.8l4 4.4M17.5 7.8l-4 4.4" style="display:none"/></svg>
    </button>
    <button class="ib" id="bPause" aria-label="暫停" title="暫停（P）">
      <svg viewBox="0 0 20 20" fill="currentColor"><rect x="5.2" y="4.2" width="3.2" height="11.6" rx="1.2"/><rect x="11.6" y="4.2" width="3.2" height="11.6" rx="1.2"/></svg>
    </button>
  </div>
  <canvas id="map" width="300" height="300" hidden></canvas>
  <div id="gauge"><span></span></div>
  <div id="toast"></div>
  <div id="count" class="num"></div>
  <div id="pops"></div>
  <div id="keys">
    <kbd data-k="w">W</kbd><kbd data-k="a">A</kbd><kbd data-k="s">S</kbd><kbd data-k="d">D</kbd>
    <kbd data-k="space" class="wide">SPACE</kbd><kbd data-k="shift" class="wide">SHIFT</kbd>
    <button id="bReset" aria-label="回到冰帶中央" title="回到冰帶中央（R）"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3.5v4h4"/><path d="M4.8 7.3A5 5 0 1 1 4 10"/></svg></button>
  </div>
  <div id="touch">
    <button id="tL" aria-label="左轉"><svg viewBox="0 0 22 22" fill="currentColor"><path d="M14.5 4.5v13L5.5 11z"/></svg></button>
    <button id="tR" aria-label="右轉"><svg viewBox="0 0 22 22" fill="currentColor"><path d="M7.5 4.5v13l9-6.5z"/></svg></button>
    <button id="tD" aria-label="甩尾">甩尾</button>
    <button id="tJ" aria-label="跳躍">跳</button>
  </div>
</div>

<section class="card" id="title">
  <div class="veil"></div>
  <div class="wm"><h1>冰帶</h1><span>Rime Ribbon</span></div>
  <p class="lead">一條首尾反接的冰帶懸在土星旁。騎完一圈，你會停在它的背面；要再騎一圈，才回得到起點。</p>
  <div class="ctl"><span><b>W / S</b>加速、煞車</span><span><b>A / D</b>轉向</span><span><b>SHIFT</b>按住甩尾，放開加速</span><span><b>SPACE</b>跳，空中按 A / D 迴旋</span></div>
  <div class="go">
    <button class="btn" id="bGo">出發<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13L13 3M6 3h7v7"/></svg></button>
    <span class="best num" id="best"></span>
  </div>
</section>

<section class="card" id="pause" hidden>
  <div class="veil"></div>
  <h2>暫停</h2>
  <div class="row">
    <button class="btn" id="bResume">繼續<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13L13 3M6 3h7v7"/></svg></button>
    <button class="btn alt" id="bRestart">從頭再騎</button>
  </div>
</section>

<section class="card" id="done" hidden>
  <div class="veil"></div>
  <h2>繞完兩面，回到原點</h2>
  <dl class="stats">
    <div><dt>時間</dt><dd class="num" id="dT">0:00.0</dd></div>
    <div><dt>金環</dt><dd class="num" id="dR">0</dd></div>
    <div><dt>分數</dt><dd class="num" id="dS">0</dd></div>
    <div><dt>最高時速</dt><dd class="num" id="dV">0</dd></div>
  </dl>
  <div class="row">
    <button class="btn" id="bAgain">再騎一次<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13L13 3M6 3h7v7"/></svg></button>
    <button class="btn alt" id="bFree">繼續滑行</button>
  </div>
</section>

<div id="err">這件作品需要 WebGL 與網路連線（載入 Three.js）。<br>請改用較新的瀏覽器開啟。</div>

<script type="module">
let THREE;
{
  // CDN 太慢（9 秒）或失敗就改用站內的 vendor 模組；vendor 也載不到時再等 CDN
  const cdn = import('three');
  const vendor = () => import('../vendor/three-0.186.0/three.module.js');
  try { THREE = await Promise.race([cdn, new Promise((_, rej) => setTimeout(() => rej(new Error('slow')), 9000))]); }
  catch (e) {
    try { THREE = await vendor(); }
    catch (e2) { try { THREE = await cdn; } catch (e3) { document.getElementById('err').style.display = 'grid'; throw e3; } }
  }
}
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const sm5 = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * t * (t * (t * 6 - 15) + 10); };
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const TAU = Math.PI * 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const COARSE = matchMedia('(pointer:coarse)').matches;
if (COARSE) document.body.classList.add('touch');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── 渲染器 ───────── */
const canvas = $('gl');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: !COARSE, powerPreference: 'high-performance' });
} catch (e) { $('err').style.display = 'grid'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, COARSE ? 1.5 : 1.75));
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020306);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.25, 14000);
const SUN = new THREE.Vector3(0.52, 0.62, 0.34).normalize();

// 浮字：撿金環、擦身而過、完美落地
const popPool = Array.from({ length: 8 }, () => { const el = document.createElement('div'); el.className = 'pop num'; $('pops').appendChild(el); return { el, t: 1, p: V3(0, 0, 0) }; });
let popI = 0;
function popText(p, text, cls = '') { // 浮字跟著騎士頭頂往上飄

/* ───────── HUD ───────── */
const hudEls = { chain: $('chain'), count: $('count'), spd: $('spd'), tm: $('tm'), rg: $('rgN'), sc: $('sc'), mu: $('mu'), pgA: $('pgA'), pgB: $('pgB'), side: $('side'), gauge: $('gauge'), gs: $('gauge').firstElementChild };
const fmtT = t => { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); };
const last = {};
function setText(k, v) { if (last[k] !== v) { last[k] = v; hudEls[k].textContent = v; } }
const _proj = V3(0, 0, 0);

/* ───────── 路線圖 ───────── */
const mapC = $('map'), mctx = mapC.getContext('2d');
const mapPts = [];
{
  let minx = 1e9, maxx = -1e9, minz = 1e9, maxz = -1e9;
  for (let i = 0; i <= NS; i += 4) { const x = CEN[i * 3], z = CEN[i * 3 + 2]; minx = Math.min(minx, x); maxx = Math.max(maxx, x); minz = Math.min(minz, z); maxz = Math.max(maxz, z); mapPts.push([x, z]); }
  const sc = 250 / Math.max(maxx - minx, maxz - minz);
  mapPts.forEach(p => { p[0] = 150 + (p[0] - (minx + maxx) / 2) * sc; p[1] = 150 + (p[1] - (minz + maxz) / 2) * sc; });

}
function drawMap() {
  if (mapC.hidden) return;

  const front = S.s2 < L, f = (S.s2 % L) / L, n = mapPts.length - 1, cut = Math.round(f * n);

/* ───────── 流程 ───────── */
function setMode(m) {
  S.mode = m;
  document.body.classList.toggle('title', m === 'title');
  document.body.classList.toggle('overlay', m === 'paused' || m === 'done');
  $('title').hidden = m !== 'title';
  $('pause').hidden = m !== 'paused';
  $('done').hidden = m !== 'done';
}
let pausedFrom = 'play';
function start(skipCount) {

  S.attract = false; resetRun();
  if (skipCount === true) setMode('play');
  else { setMode('count'); S.countT = 2.4; S.V = 0; pose.foot = 1; sfx.beep(false); }
  if (skipCount === true) introToast();
}
function introToast() { toast('先沿著金環騎', COARSE ? '按住「甩尾」再轉向蓄力，放開就加速' : 'SHIFT 甩尾蓄力，放開就加速', 2400); }
function pause() { if (S.mode !== 'play' && S.mode !== 'fall' && S.mode !== 'count') return; pausedFrom = S.mode; setMode('paused'); }

  let best = null; try { best = JSON.parse(localStorage.getItem('rr-best') || 'null'); } catch (e) {}

  showBest();

  sfx.fanfare(); pose.pump = 0;

  for (let k = 0; k < 160; k++) { const gold = k % 3 === 0; emit(RF.p, V3(0, 0, 0).addScaledVector(RF.up, 4 + Math.random() * 9).addScaledVector(RF.right, (Math.random() - .5) * 12).addScaledVector(RF.fwd, (Math.random() - .2) * 10), 1.2 + Math.random() * 0.9, gold ? 1 : .8, gold ? .8 : .95, gold ? .4 : 1, 0.05 + Math.random() * 0.04); }

$('bGo').onclick = () => start();

{ let on = true; try { on = localStorage.getItem('rr-sound') !== '0'; } catch (e) {} setSound(on, false); }

const KEYMAP = { ' ': 'space', 'shift': 'shift' };

/* ───────── 主迴圈 ───────── */
const clock = { last: performance.now(), t: 0 };

window.__rr = {

  },

};
