    const heroEl = page.querySelector('.co-hero'), tabbarEl = page.querySelector('.co-tabbar'), panelEl = page.querySelector('.co-panel');

    /* 頁首：字塊、名稱、資料、動作、近三個月劃記 */
    function drawHero() {
      const c = cur();
      const rep = store.rep(c.owner);
      const w = store.warmth({ companyId: id });
      const t = U.today();
      const months = [2, 1, 0].map((i) => {
        const d = new Date(t.getFullYear(), t.getMonth() - i, 1);
        const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        const n = store.all('activities').filter((a) => a.companyId === id && store.TOUCH_TYPES.has(a.type) && a.at.slice(0, 7) === key).length;
        return { label: `${d.getMonth() + 1} 月`, n, current: i === 0 };
      });
      const total = months.reduce((s, m) => s + m.n, 0);
      const tel = String(c.phone || '').replace(/[^\d#]/g, '');
      heroEl.innerHTML = String(html`
        <div class="co-hero-id">
          ${UI.companyMark(c, { size: 72, title: false, cls: 'co-hero-cm' })}
          <div class="co-hero-text">
            <h2 class="co-name">${c.name}</h2>
            <p class="co-role"><span>${c.industry}</span><span class="co-dot" aria-hidden="true">·</span><span>${c.city}</span>${c.region ? html`<span class="co-dot" aria-hidden="true">·</span><span>${c.region}</span>` : ''}</p>
            <p class="co-facts">
              ${rep ? html`<span class="co-fact">${UI.nameBlock(rep, { size: 20, title: false })}<span>${rep.name}負責</span></span>` : ''}
              <button type="button" class="tag${STATUS_TONE[c.status] ? ' tag--' + STATUS_TONE[c.status] : ''} co-status" data-act="status" aria-haspopup="menu" aria-label="客戶狀態：${c.status}，點選變更"><i></i>${c.status}${UI.icon('chevronDown', { size: 12 })}</button>
            </p>
            <dl class="co-meta">
              <div><dt>統編</dt><dd class="co-tnum">${c.taxId || '未填'}</dd></div>
              <div><dt>網址</dt><dd title="示範用虛構網域">${c.domain || '未填'}</dd></div>
              <div><dt>員工</dt><dd class="co-tnum">${c.size ? U.num(c.size) + ' 人' : '未填'}</dd></div>
            </dl>
          </div>
        </div>
        <div class="co-hero-acts">
          ${tel ? html`<a class="btn btn--tonal btn--sm" href="tel:${tel}">${UI.icon('phone', { size: 16 })}<span>撥打</span></a>` : ''}
          ${UI.btn({ label: '記一筆', icon: 'plus', size: 'sm', variant: 'primary', attrs: { 'data-act': 'log' } })}
          ${UI.btn({ label: '新增聯絡人', icon: 'contacts', size: 'sm', attrs: { 'data-act': 'new-contact' } })}
          ${UI.btn({ label: '新增交易', icon: 'deals', size: 'sm', attrs: { 'data-act': 'new-deal' } })}
          ${UI.iconBtn('edit', { label: '編輯公司', size: 'sm', attrs: { 'data-act': 'edit' } })}
          ${UI.iconBtn('more', { label: '更多動作', size: 'sm', attrs: { 'data-act': 'more-menu', 'aria-haspopup': 'menu' } })}
        </div>
        <div class="co-hero-side">
          <div class="co-months" role="group" aria-label="近三個月往來 ${total} 次">
            ${months.map((m) => html`<div class="co-month${m.current ? ' is-current' : ''}"><span class="co-month-l">${m.label}</span>${UI.tally(m.n, { size: 20, key: m.current ? 'company:' + id : '', label: `${m.label}往來 ${m.n} 次`, cls: m.current ? 'co-tally-now' : '' })}</div>`)}
          </div>
          <div class="co-hero-foot"><p class="co-hero-sum"><b>${total}</b><span>次往來 · 近三個月</span></p>
          <div class="co-hero-warm">${UI.warmth(w)}<span class="t-12 t-3">${w.days == null ? '尚無往來' : w.days === 0 ? '今天' : `${w.days} 天前`}</span></div></div>
        </div>`);
    }

    function companyActivities() {
      const dealIds = new Set(store.dealsFor({ companyId: id }).map((d) => d.id));
      return store.all('activities').filter((a) => a.companyId === id || (a.dealId && dealIds.has(a.dealId))).sort((a, b) => (a.at < b.at ? 1 : a.at > b.at ? -1 : 0));
    }

    function drawTabbar() {
      const contacts = store.contactsOf(id);
      tabbarEl.innerHTML = String(UI.tabs({
        name: 'co-tab', value: tab, cls: 'tabs--line co-tabs',
        items: [
          { value: 'overview', label: '概覽' },
          { value: 'org', label: '組織圖' },
          { value: 'deals', label: '交易', count: store.dealsFor({ companyId: id }).length },
          { value: 'contacts', label: '聯絡人', count: contacts.length },
          { value: 'activity', label: '往來', count: companyActivities().length },
        ],
      }));
    }

    /* ── 共用片段 ── */
    function evView(a, { compact = false } = {}) {
      const rep = store.rep(a.owner);
      const deal = a.dealId ? store.get('deals', a.dealId) : null;
      const who = a.contactId ? store.get('contacts', a.contactId) : null;
      const meta = [];
      if (a.type === 'call' && a.duration) meta.push(U.duration(a.duration));
      if (a.type === 'meeting') { if (a.location) meta.push(a.location); if (a.duration) meta.push(U.duration(a.duration)); }
      let bodyView = html`<p class="co-ev-text">${a.body}</p>`;
      if (a.type === 'email') bodyView = html`<p class="co-ev-subj">${a.subject || '（無主旨）'}</p>${a.body ? html`<p class="co-ev-text">${a.body}</p>` : ''}`;
      if (a.type === 'meeting' && a.title && a.title !== a.body) bodyView = html`<p class="co-ev-subj">${a.title}</p><p class="co-ev-text">${a.body}</p>`;
      if (a.type === 'stage') bodyView = html`<p class="co-ev-text co-ev-stage">${a.from ? UI.stageTag(a.from) : ''}${UI.icon('arrowRight', { size: 14 })}${UI.stageTag(a.to)}</p>`;
      return html`<li class="co-ev" data-type="${a.type}">
        <span class="co-ev-ic" aria-hidden="true">${UI.icon(TYPE_ICON[a.type] || 'note', { size: 18 })}</span>
        <div class="co-ev-main">
          <p class="co-ev-head"><span class="co-ev-type">${TYPE_NAME[a.type] || '活動'}</span>${meta.length ? html`<span class="co-ev-meta">${meta.join(' · ')}</span>` : ''}${compact ? html`<span class="co-ev-time">${UI.relTime(a.at)}</span>` : html`<time class="co-ev-time" datetime="${a.at}">${U.time(a.at)}</time>`}</p>
          ${bodyView}
          <p class="co-ev-foot">${who ? html`<a class="co-ev-who" href="${router.href('/contacts/' + who.id)}">${UI.nameBlock(who, { size: 18, title: false })}${who.name}</a>` : ''}${rep ? html`<span class="co-ev-rep">${who ? '由' : ''}${rep.name}${who ? '記錄' : ''}</span>` : ''}${deal ? html`<button type="button" class="co-ev-deal" data-deal="${deal.id}">${UI.icon('deals', { size: 14 })}<span>${deal.name}</span></button>` : ''}</p>
        </div>
      </li>`;
    }
    function taskItem(t) {
      const who = t.contactId ? store.get('contacts', t.contactId) : null;
      return html`<li class="co-task">${UI.checkbox({ attrs: { 'data-task': t.id, 'aria-label': '完成：' + t.title } })}<span class="co-task-text"><span class="co-task-title">${t.priority === 'high' ? html`<span class="co-task-hi" data-tip="高優先">${UI.icon('flag', { size: 14 })}</span>` : ''}${t.title}</span><span class="co-task-meta">${UI.due(t.due, t.dueTime)}${who ? html`<span>${who.name}</span>` : ''}</span></span></li>`;
    }
    const secHead = (title, extra = '', action = '') => html`<header class="co-sec-h"><h3 class="co-sec-t">${title}</h3>${extra ? html`<span class="co-sec-n">${extra}</span>` : ''}${action}</header>`;
    const moreLink = (label, goto) => html`<button type="button" class="co-sec-more" data-goto="${goto}">${label}${UI.icon('chevronRight', { size: 14 })}</button>`;

    /* ── 概覽 ── */
    function overviewView() {
      const c = cur();
      const st = store.companyStats(id);
      const perf = companyPerf(id);
      const hist = store.revenueHistory(id);
      const past = hist.slice(0, -1).slice(-4);
      const current = hist[hist.length - 1];
      const tasks = U.sortBy(store.tasksFor({ companyId: id }, { open: true }), (t) => t.due + (t.dueTime || '99'));
      const recent = companyActivities().slice(0, 5);
      const openDeals = U.sortBy(st.openDeals, (d) => d.closeDate);
      const kpi = (k, v, s) => html`<div class="co-kpi"><p class="co-kpi-k">${k}</p><p class="co-kpi-v">${v}</p><p class="co-kpi-s">${s}</p></div>`;
      panelEl.innerHTML = String(html`
        <div class="co-kpis" role="group" aria-label="關鍵數字">
          ${kpi('累計成交', st.wonTotal ? U.moneyCompact(st.wonTotal) : '尚無', perf.wonN ? `${perf.wonN} 筆成交 · 近五季` : '還沒有成交紀錄')}
          ${kpi('進行中加權', st.openDeals.length ? U.moneyCompact(store.weighted(st.openDeals)) : '–', st.openDeals.length ? `${st.openDeals.length} 筆 · 總額 ${U.moneyCompact(st.openAmount)}` : '沒有進行中的交易')}
          ${kpi('贏單率', perf.winRate == null ? '–' : U.pct(perf.winRate), perf.closed ? `${perf.wonN} 勝 ${perf.lostN} 敗` : '結案後才會計算')}
          ${kpi('平均成交週期', perf.avgCycle == null ? '–' : html`${perf.avgCycle}<small> 天</small>`, perf.avgCycle == null ? '尚無成交' : '從建立到成交')}
        </div>
        <div class="co-ov">
          <div class="co-ov-main">
            <section class="co-sec" aria-label="近四季成交">
              ${secHead('近四季成交', '', html`<p class="co-sec-note">本季至今 <b>${current && current.amount ? U.money(current.amount) : '尚無'}</b></p>`)}
              ${revenueChart(past)}
            </section>
            <section class="co-sec" aria-label="近期往來">
              ${secHead('近期往來', '', recent.length ? moreLink('全部往來', 'activity') : '')}
              ${recent.length ? html`<ol class="co-evs co-evs--compact">${recent.map((a) => evView(a, { compact: true }))}</ol>` : UI.emptyState({ compact: true, title: '還沒有往來', body: '記下第一通電話或會議，劃記就會開始累積。' })}
            </section>
          </div>
          <aside class="co-ov-side">
            <section class="co-sec" aria-label="下一步">
              ${secHead('下一步', tasks.length ? tasks.length + ' 件' : '', UI.iconBtn('plus', { label: '新增任務', size: 'sm', cls: 'co-sec-add', attrs: { 'data-act': 'task' } }))}
              ${tasks.length ? html`<ul class="co-task-list">${tasks.slice(0, 5).map(taskItem)}</ul>${tasks.length > 5 ? html`<p class="co-side-empty">另有 ${tasks.length - 5} 件，見任務頁</p>` : ''}` : html`<p class="co-side-empty">沒有待辦，要不要排下一步？</p>`}
            </section>
            <section class="co-sec" aria-label="進行中交易">
              ${secHead('進行中交易', openDeals.length ? U.moneyCompact(st.openAmount) : '', UI.iconBtn('plus', { label: '新增交易', size: 'sm', cls: 'co-sec-add', attrs: { 'data-act': 'new-deal' } }))}
              ${openDeals.length ? html`<ul class="co-mdeals">${openDeals.slice(0, 4).map((d) => html`<li><button type="button" class="co-mdeal" data-deal="${d.id}"><span class="co-mdeal-top"><span class="co-mdeal-name">${d.name}</span>${UI.money(d.amount, { compact: true, cls: 'co-mdeal-amt' })}</span><span class="co-mdeal-bot">${UI.stageTag(d.stage)}<span class="t-12 t-3">預計 ${U.fmtDate(d.closeDate)}</span><span class="co-mdeal-code">${d.code}</span></span></button></li>`)}</ul>${openDeals.length > 4 ? moreLink(`全部 ${openDeals.length} 筆交易`, 'deals') : ''}` : html`<p class="co-side-empty">沒有進行中的交易。</p>`}
            </section>
          </aside>
        </div>`);
    }

    function revenueChart(rows) {
      const max = Math.max(0, ...rows.map((r) => r.amount));
      if (!rows.length || !max) return html`<div class="co-rev-empty">${UI.emptyState({ title: '近四季沒有成交', body: '第一筆成交後，這裡會顯示每季金額。', compact: true })}</div>`;
      const tip = (r) => `${r.label}：${U.money(r.amount)}`;
      return html`<div class="co-bars" role="img" aria-label="近四季成交：${rows.map(tip).join('、')}">
        ${rows.map((r) => {
          const hh = r.amount ? Math.max(3, (r.amount / max) * 100) : 0;
          const [y, q] = r.label.split(' ');
          return html`<div class="co-bar" data-tip="${tip(r)}"><span class="co-bar-plot"><span class="co-bar-v">${r.amount ? U.moneyCompact(r.amount) : '0'}</span><i style="height:${hh.toFixed(1)}%"></i></span><span class="co-bar-k"><b>${q || r.label}</b>${y && q ? html`<span>${y}</span>` : ''}</span></div>`;
        })}
      </div>
      <table class="sr-only"><caption>近四季成交金額</caption><tbody>${rows.map((r) => html`<tr><th scope="row">${r.label}</th><td>${U.money(r.amount)}</td></tr>`)}</tbody></table>`;
    }

    /* ── 組織圖 ── */
    function orgView() {
      const contacts = store.contactsOf(id);
      if (!contacts.length) {
        panelEl.innerHTML = String(UI.emptyState({ title: '還沒有聯絡人', body: '新增聯絡人並填「直屬主管」，組織圖就會自動長出來。', action: UI.btn({ label: '新增聯絡人', icon: 'plus', size: 'sm', variant: 'primary', attrs: { 'data-act': 'new-contact' } }) }));
        return;
      }
      const forest = orgForest(contacts);
      const node = (t) => {
        const p = t.c;
        const w = store.warmth({ contactId: p.id });
        const decider = (p.tags || []).includes('決策者');
        return html`<li><a class="co-node${decider ? ' is-decider' : ''}" href="${router.href('/contacts/' + p.id)}" data-contact="${p.id}">
          ${UI.nameBlock(p, { size: 32, title: false })}
          <span class="co-node-text"><span class="co-node-name">${p.name}</span><span class="co-node-title">${p.title || '未填職稱'}</span></span>
          ${UI.warmth(w, { label: false, cls: 'co-node-w' })}
        </a>${t.children.length ? html`<ul>${t.children.map(node)}</ul>` : ''}</li>`;
      };
      const loose = forest.filter((t) => !t.children.length && forest.length > 1 && t.c.level !== 'top');
      const trees = forest.filter((t) => !loose.includes(t));
      const lines = trees.length;
      panelEl.innerHTML = String(html`
        <section class="co-sec co-org" aria-label="組織圖">
          ${secHead('組織圖', `${contacts.length} 位`, html`<p class="co-sec-note">依「直屬主管」排列${lines > 1 ? `，共 ${lines} 條匯報線` : ''}。點人名開啟聯絡人。</p>`)}
          <div class="co-org-scroll"><div class="co-tree">${trees.map((t) => html`<ul class="co-tree-root">${node(t)}</ul>`)}</div></div>
          ${loose.length ? html`<div class="co-org-loose"><p class="co-org-loose-h">未指定主管</p><ul class="co-loose">${loose.map(node)}</ul></div>` : ''}
        </section>`);
    }

    /* ── 交易（依階段分組） ── */
    function dealsView() {
      const deals = store.dealsFor({ companyId: id });
      if (!deals.length) {
        panelEl.innerHTML = String(UI.emptyState({ title: '這家公司還沒有交易', body: '從場勘或報價開始，建立第一筆交易。', action: UI.btn({ label: '新增交易', icon: 'plus', size: 'sm', variant: 'primary', attrs: { 'data-act': 'new-deal' } }) }));
        return;
      }
      const groups = store.STAGES.map((s) => ({
        s,
        list: s.closed ? deals.filter((d) => d.stage === s.id).sort((a, b) => (b.closedAt || '').localeCompare(a.closedAt || '')) : U.sortBy(deals.filter((d) => d.stage === s.id), (d) => d.closeDate),
      })).filter((g) => g.list.length);
      panelEl.innerHTML = String(html`<div class="co-dgroups">${groups.map(({ s, list }) => html`
        <section class="co-dgroup" aria-label="${s.name}">
          <header class="co-dgroup-h">${UI.stageTag(s.id, { cls: 'co-dgroup-stage' })}<span class="co-sec-n">${list.length} 筆</span><span class="co-dgroup-sum">${UI.money(U.sum(list, (d) => d.amount), { compact: true, lost: s.id === 'lost' })}</span></header>
          <ul class="co-dlist">${list.map((d) => {
            const lead = d.contactIds && d.contactIds[0] ? store.get('contacts', d.contactIds[0]) : null;
            const overdue = !d.closedAt && U.daysFromToday(d.closeDate) < 0;
            const dateLabel = d.closedAt ? `${s.id === 'won' ? '成交' : '結案'} ${U.fmtDate(d.closedAt)}` : `${overdue ? '逾期 · ' : '預計 '}${U.fmtDate(d.closeDate)}`;
            const sub = [lead && lead.name, d.closedAt ? d.lostReason : d.next].filter(Boolean).join(' · ');
            return html`<li><button type="button" class="co-drow" data-deal="${d.id}">
              <span class="co-drow-main"><span class="co-drow-name">${d.name}</span><span class="co-drow-sub"><span class="co-drow-code">${d.code}</span>${sub ? html`<span class="co-drow-next">${sub}</span>` : ''}</span></span>
              <span class="co-drow-date${overdue ? ' is-overdue' : ''}">${dateLabel}</span>
              <span class="co-drow-owner">${UI.nameBlock(d.owner, { size: 26 })}</span>
              <span class="co-drow-amt">${UI.money(d.amount, { compact: true, lost: d.stage === 'lost' })}</span>
            </button></li>`;
          })}</ul>
        </section>`)}</div>`);
    }

    /* ── 聯絡人 ── */
    function contactsView() {
      const contacts = store.contactsOf(id);
      panelEl.innerHTML = String(html`<section class="co-sec co-ctable" aria-label="聯絡人">${secHead('聯絡人', `${contacts.length} 位`, UI.btn({ label: '新增聯絡人', icon: 'plus', size: 'sm', cls: 'co-sec-btn', attrs: { 'data-act': 'new-contact' } }))}<div class="co-ctable-body"></div></section>`);
      const box = panelEl.querySelector('.co-ctable-body');
      if (!contacts.length) { box.innerHTML = String(UI.emptyState({ title: '還沒有聯絡人', compact: true })); subTable = null; return; }
      const rows = contacts.map((p) => {
        const w = store.warmth({ contactId: p.id });
        const series = store.touchSeries({ contactId: p.id }, 8);
        return { id: p.id, p, w, series, touches: U.sum(series), boss: p.reportsTo ? store.get('contacts', p.reportsTo) : null };
      });
      subTable = UI.table(box, {
        rows, caption: cur().name + '的聯絡人', sort: { key: 'level', dir: 1 }, cls: 'co-ctbl',
        onRowClick: (r) => UI.openContact(r.id),
        columns: [
          { key: 'level', label: '姓名', m: 'primary', width: '26%', sort: (r) => (LEVEL[r.p.level] ?? 3) * 1000 + (r.boss ? 1 : 0), render: (r) => UI.personCell(r.p, { size: 36, sub: r.p.title, href: router.href('/contacts/' + r.id) }) },
          { key: 'boss', label: '直屬主管', m: 'hide', cls: 'co-ccol-boss', sort: (r) => (r.boss ? r.boss.name : null), render: (r) => (r.boss ? html`<span class="co-rep">${UI.nameBlock(r.boss, { size: 22, title: false })}<span>${r.boss.name}</span></span>` : html`<span class="co-none">–</span>`) },
          { key: 'mobile', label: '手機', m: 'hide', cls: 'co-ccol-mobile', render: (r) => html`<span class="co-tnum co-nowrap">${r.p.mobile || ''}</span>` },
          { key: 'touches', label: '近 8 週往來', m: 'hide', sort: (r) => r.touches, defaultDir: -1, render: (r) => html`<span class="co-touch">${UI.activityBars(r.series)}<span class="co-touch-n">${r.touches || ''}</span></span>` },
          { key: 'warmth', label: '關係溫度', m: 'meta', sort: (r) => (r.w.days == null ? 99999 : r.w.days), render: (r) => UI.warmth(r.w) },
          { key: 'life', label: '生命週期', m: 'end', sort: (r) => r.p.lifecycle, render: (r) => UI.tag(r.p.lifecycle, { 潛在: 'sky', 洽談中: 'lemon', 客戶: 'mint', 合作夥伴: 'lilac' }[r.p.lifecycle] || '', { dot: true }) },
        ],
      });
    }

    /* ── 往來時間軸 ── */
    function dayLabel(dateIso) {
      const diff = U.daysFromToday(dateIso);
      const base = `${U.fmtDate(dateIso)} ${U.weekday(U.parse(dateIso))}`;
      return diff === 0 ? `今天 · ${base}` : diff === -1 ? `昨天 · ${base}` : base;
    }
    function activityView() {
      const all = companyActivities();
      const counts = Object.fromEntries(TL_TYPES.map((t) => [t.id, t.id === 'all' ? all.length : all.filter((a) => a.type === t.id).length]));
      const items = TL_TYPES.filter((t) => t.id === 'all' || counts[t.id] || t.id === tlType).map((t) => ({ value: t.id, label: t.name, count: counts[t.id] }));
      const list = tlType === 'all' ? all : all.filter((a) => a.type === tlType);
      const shown = list.slice(0, tlLimit);
      const groups = [];
      shown.forEach((a) => { const d = a.at.slice(0, 10); const g = groups[groups.length - 1]; if (g && g.d === d) g.items.push(a); else groups.push({ d, items: [a] }); });
      panelEl.innerHTML = String(html`<section class="co-sec co-tl" aria-label="往來紀錄">

    searchEl.addEventListener('input', () => { st.q = searchEl.value; draw(); pushQ(); });
    searchEl.addEventListener('keydown', (e) => { if (e.key === 'Escape' && searchEl.value) { e.stopPropagation(); searchEl.value = ''; st.q = ''; draw(); syncUrl(); } });

    /* 檢視 */
    page.addEventListener('tab-change', (e) => {
      if (e.detail.name !== 'ct-view') return;
      st.view = e.detail.value;
      table.clearSelection();
      syncUrl();
      draw();
      const b = viewsEl.querySelector(`[data-value="${st.view}"]`);
      b && b.focus({ preventScroll: true });
    });

    /* 篩選選單 */
    page.addEventListener('click', (e) => {
      const fb = e.target.closest('[data-filter]');
      if (fb) {
        const f = FILTERS.find((x) => x.key === fb.dataset.filter);
        const base = apply(vms, st, { skipFilter: f.key });
        const items = [
          { label: f.all, checked: !st[f.key], hint: String(base.length), value: '' },
          { divider: true },
          ...f.options().map((o) => ({ label: o.label, lead: o.lead, value: o.value, checked: st[f.key] === o.value, hint: String(base.filter((vm) => f.match(vm, o.value)).length) })),
        ];
        UI.menu(fb, items, {
          label: f.label, cls: 'ct-fmenu',
          onSelect: (it) => {
            st[f.key] = it.value;
            table.clearSelection();
            syncUrl();
            draw();
            const again = filtersEl.querySelector(`[data-filter="${f.key}"]`);
            again && again.focus({ preventScroll: true });
          },
        });
        return;
      }
      const act = e.target.closest('[data-act]');
      if (act && act.dataset.act === 'clear') { clearAll(); searchEl.focus({ preventScroll: true }); return; }
      const co = e.target.closest('[data-co]');
      if (co && !e.metaKey && !e.ctrlKey) { e.preventDefault(); UI.openCompany(co.dataset.co); return; }
      const bb = e.target.closest('[data-bulk]');
      if (bb) bulk(bb.dataset.bulk, bb);
    });

    /* 批次 */
    function bulk(kind, anchor) {
      const ids = table.selected();
      if (!ids.length) return;
      if (kind === 'clear') { table.clearSelection(); return; }
      if (kind === 'assign') {
        UI.menu(anchor, [{ heading: `指派 ${ids.length} 位聯絡人給` }, ...store.all('reps').map((r) => ({
          label: r.name + (r.me ? '（我）' : ''), lead: UI.nameBlock(r, { size: 20, title: false }), hint: r.region,
          onSelect: () => {
            const { undo } = store.batch(() => ids.forEach((id) => store.update('contacts', id, { owner: r.id })));
            table.clearSelection();
            UI.toast(`已將 ${ids.length} 位指派給${r.name}`, { undo });
          },
        }))], { label: '指派負責人' });
      } else if (kind === 'tag') {
        UI.menu(anchor, [{ heading: `為 ${ids.length} 位加上標籤` }, ...store.TAGS.map((t) => {
          const have = ids.filter((id) => (store.get('contacts', id).tags || []).includes(t)).length;
          return {
            label: t, icon: 'tag', hint: have === ids.length ? '都已有' : have ? `${have} 位已有` : '', disabled: have === ids.length,
            onSelect: () => {
              const { undo } = store.batch(() => ids.forEach((id) => { const c = store.get('contacts', id); if (!(c.tags || []).includes(t)) store.update('contacts', id, { tags: [...(c.tags || []), t] }); }));
              table.clearSelection();
              UI.toast(`已為 ${ids.length - have} 位加上「${t}」`, { undo });
            },
          };
        })], { label: '加標籤' });
      } else if (kind === 'delete') {
        const first = store.get('contacts', ids[0]);
        const { undo } = store.batch(() => ids.forEach((id) => CRM.actions.deleteRecord('contacts', id, { silent: true })));
        table.clearSelection();
        UI.toast(ids.length === 1 ? `已刪除「${first.name}」` : `已刪除 ${ids.length} 位聯絡人`, { undo });
      }
    }
    const onKey = (e) => {
      if (e.key === 'Escape' && !UI.layers.length && table.selected().length && !U.isTyping(e)) table.clearSelection();
    };
    document.addEventListener('keydown', onKey);

    const off = store.subscribe((evt) => {
      if (!evt.has('contacts', 'activities', 'deals', 'companies', 'reps')) return;
      vms = buildVMs();
      draw();
      const cnt = el.querySelector('.ph-count');
      if (cnt) cnt.textContent = store.all('contacts').length;
    });
    return () => { alive = false; off(); document.removeEventListener('keydown', onKey); };
  }

  /* ════════ 詳細頁 ════════ */
  const TL_TYPES = [
    { id: 'all', name: '全部' },
    { id: 'call', name: '通話' },
    { id: 'email', name: 'Email' },
    { id: 'meeting', name: '會議' },
    { id: 'note', name: '筆記' },
    { id: 'task', name: '任務完成' },
    { id: 'stage', name: '階段變更' },

  const TYPE_NAME = { call: '通話', email: 'Email', meeting: '會議', note: '筆記', task: '完成任務', stage: '階段變更' };
  const PLACEHOLDER = {
    call: '通話重點、對方的疑慮、下一步。例如：採購說預算要等 11 月董事會',
    email: '信件摘要。例如：寄出 PoC 兩週數據與報價草案',
    meeting: '會議結論與待辦。例如：場勘三號廠房，12 台主軸馬達需加裝 VB-3',
    note: '寫下觀察或提醒，只有團隊看得到',
  };

  function mountDetail(el, ctx, id) {

    /* 頁首：姓名、職稱、動作、近三個月劃記、溫度 */
    function drawHero() {

          ${UI.btn({ label: '記一筆', icon: 'plus', size: 'sm', variant: 'primary', attrs: { 'data-act': 'log' } })}

        </div>`);
    }

    /* 活動輸入器 */
    function drawCompose() {
      const deals = store.openDealsFor({ contactId: id });
      composeEl.innerHTML = String(html`<form class="ct-compose-form" data-type="${composeType}" novalidate>
        <div class="ct-compose-head">
          <h2 class="section-title">記一筆</h2>
          ${UI.segmented({ name: 'ct-type', value: composeType, size: 'sm', label: '活動類型', options: CRM.forms.LOG_TYPES })}
        </div>
        <input class="input ct-c-subject only-email" name="subject" placeholder="主旨，例如：報價單 Q-2026-0412" aria-label="Email 主旨" autocomplete="off">

        <div class="ct-compose-row">

          <label class="ct-c-field ct-c-dur only-call only-meeting"><span>時長</span><input class="input" type="number" name="duration" min="1" inputmode="numeric" value="${composeType === 'meeting' ? 60 : 10}"><span>分</span></label>
          ${deals.length ? html`<label class="ct-c-field ct-c-deal"><span>交易</span><span class="select-wrap"><select class="input select" name="dealId"><option value="">不關聯</option>${deals.map((d, i) => html`<option value="${d.id}"${i === 0 && deals.length === 1 ? raw(' selected') : ''}>${d.name}</option>`)}</select>${UI.icon('chevronDown', { size: 16, cls: 'select-caret' })}</span></label>` : ''}
          <span class="ct-c-hint">${UI.kbd('⌘')}${UI.kbd('Enter')}</span>
          ${UI.btn({ label: '記下', variant: 'primary', size: 'sm', type: 'submit', cls: 'ct-c-submit' })}
        </div>
        <p class="ct-c-err" role="alert" hidden>先寫下內容再記。</p>
      </form>`);
    }
    function setComposeType(t) {
      composeType = t;
      const form = composeEl.querySelector('form');
      form.dataset.type = t;
      form.querySelector('[name="body"]').placeholder = PLACEHOLDER[t];
      const dur = form.querySelector('[name="duration"]');
      if (t === 'meeting' && +dur.value < 30) dur.value = 60;
      if (t === 'call' && +dur.value >= 30) dur.value = 10;
    }
    composeEl.addEventListener('seg-change', (e) => { if (e.detail.name === 'ct-type') setComposeType(e.detail.value); });
    function submitCompose() {
      const form = composeEl.querySelector('form');
      const f = Object.fromEntries(new FormData(form).entries());
      const body = (f.body || '').trim();
      const err = form.querySelector('.ct-c-err');
      if (!body) { err.hidden = false; form.querySelector('[name="body"]').focus(); return; }
      err.hidden = true;
      const data = { type: composeType, contactId: id, dealId: f.dealId || null, body };
      if (composeType === 'call') data.duration = Math.max(1, +f.duration || 5);
      if (composeType === 'meeting') { data.duration = Math.max(1, +f.duration || 60); data.location = (f.location || '').trim() || '未填地點'; data.title = body.split(/[，。\n]/)[0].slice(0, 24) || '會議'; }
      if (composeType === 'email') data.subject = (f.subject || '').trim() || '（無主旨）';
      CRM.actions.logActivity(data);
      form.querySelector('[name="body"]').value = '';
      const s = form.querySelector('[name="subject"]'); if (s) s.value = '';
      const l = form.querySelector('[name="location"]'); if (l) l.value = '';
    }
    composeEl.addEventListener('submit', (e) => { e.preventDefault(); submitCompose(); });
    composeEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitCompose(); }
    });
    composeEl.addEventListener('input', (e) => { if (e.target.name === 'body') composeEl.querySelector('.ct-c-err').hidden = true; });

    /* 往來時間軸 */
    function contactActivities() {
      const dealIds = new Set(store.dealsFor({ contactId: id }).map((d) => d.id));
      return store.all('activities').filter((a) => a.contactId === id || (a.type === 'stage' && dealIds.has(a.dealId))).sort((a, b) => cmp(a.at, b.at));
    }
    function evView(a) {
      const rep = store.rep(a.owner);
      const deal = a.dealId ? store.get('deals', a.dealId) : null;
      let head = TYPE_NAME[a.type] || a.type;
      const meta = [];
      if (a.type === 'call' && a.duration) meta.push(U.duration(a.duration));
      if (a.type === 'meeting') { if (a.location) meta.push(a.location); if (a.duration) meta.push(U.duration(a.duration)); }
      let bodyView = html`<p class="ct-ev-text">${a.body}</p>`;
      if (a.type === 'email') bodyView = html`<p class="ct-ev-subj">${a.subject || '（無主旨）'}</p>${a.body ? html`<p class="ct-ev-text">${a.body}</p>` : ''}`;
      if (a.type === 'meeting' && a.title && a.title !== a.body) bodyView = html`<p class="ct-ev-subj">${a.title}</p><p class="ct-ev-text">${a.body}</p>`;
      if (a.type === 'stage') bodyView = html`<p class="ct-ev-text ct-ev-stage">${a.from ? UI.stageTag(a.from) : ''}${UI.icon('arrowRight', { size: 14 })}${UI.stageTag(a.to)}</p>`;
      return html`<li class="ct-ev" data-type="${a.type}">
        <span class="ct-ev-ic" aria-hidden="true">${UI.icon(TYPE_ICON[a.type] || 'note', { size: 18 })}</span>

          <p class="ct-ev-head"><span class="ct-ev-type">${head}</span>${meta.length ? html`<span class="ct-ev-meta">${meta.join(' · ')}</span>` : ''}<time class="ct-ev-time t-mono" datetime="${a.at}">${U.time(a.at)}</time></p>
          ${bodyView}
          <p class="ct-ev-foot">${rep ? html`<span class="ct-ev-who">${UI.nameBlock(rep, { size: 18, title: false })}${rep.name}</span>` : ''}${deal ? html`<button type="button" class="ct-ev-deal" data-deal="${deal.id}">${UI.icon('deals', { size: 14 })}<span>${deal.name}</span></button>` : ''}</p>
        </div>
      </li>`;
    }
    function dayLabel(dateIso) {
      const diff = U.daysFromToday(dateIso);
      const base = `${U.fmtDate(dateIso)} ${U.weekday(U.parse(dateIso))}`;
      return diff === 0 ? `今天 · ${base}` : diff === -1 ? `昨天 · ${base}` : base;
    }
    function drawTimeline() {
      const all = contactActivities();
      const counts = Object.fromEntries(TL_TYPES.map((t) => [t.id, t.id === 'all' ? all.length : all.filter((a) => a.type === t.id).length]));
      const items = TL_TYPES.filter((t) => t.id === 'all' || counts[t.id] || t.id === tlType).map((t) => ({ value: t.id, label: t.name, count: counts[t.id] }));
      const list = tlType === 'all' ? all : all.filter((a) => a.type === tlType);

      const groups = [];
      shown.forEach((a) => {

      });
      tlEl.innerHTML = String(html`

        ${shown.length ? html`<div class="ct-tl-body">${groups.map((g) => html`<section class="ct-day"><h3 class="ct-day-h">${dayLabel(g.d)}</h3><ol class="ct-evs">${g.items.map(evView)}</ol></section>`)}</div>` : UI.emptyState({ compact: true, title: all.length ? '這個類型還沒有紀錄' : '還沒有往來', body: all.length ? '換個類型看看，或在上方記一筆。' : '記下第一通電話或會議，劃記就會開始累積。' })}
        ${list.length > shown.length ? html`<div class="ct-more">${UI.btn({ label: `顯示更早的 ${Math.min(30, list.length - shown.length)} 筆`, size: 'sm', variant: 'quiet', attrs: { 'data-act': 'more' } })}<span class="t-12 t-3">共 ${list.length} 筆</span></div>` : ''}`);
    }
    tlEl.addEventListener('tab-change', (e) => { if (e.detail.name !== 'ct-tl') return; tlType = e.detail.value; tlLimit = 30; drawTimeline(); const b = tlEl.querySelector(`.ct-tl-tabs [data-value="${tlType}"]`); b && b.focus({ preventScroll: true }); });

    /* 聯絡資料（就地編輯） */
    const PROPS = [
      { key: 'email', label: 'Email', kind: 'text', type: 'email' },
      { key: 'mobile', label: '手機', kind: 'text', type: 'tel' },
      { key: 'phone', label: '公司電話', kind: 'text', type: 'tel' },
      { key: 'title', label: '職稱', kind: 'text', type: 'text' },
      { key: 'companyId', label: '公司', kind: 'readonly' },
      { key: 'lifecycle', label: '生命週期', kind: 'menu' },
      { key: 'tags', label: '標籤', kind: 'tags' },
      { key: 'owner', label: '負責人', kind: 'menu' },
      { key: 'reportsTo', label: '直屬主管', kind: 'menu' },
      { key: 'createdAt', label: '建立於', kind: 'readonly' },
    ];
    function propValue(p, c) {
      if (p.key === 'companyId') { const co = store.get('companies', c.companyId); return co ? html`<a class="ct-pv-link" href="${router.href('/companies/' + co.id)}" data-co="${co.id}">${co.name}</a>` : html`<span class="t-3">無</span>`; }
      if (p.key === 'createdAt') return c.createdAt ? html`<span>${U.fmtDateLong(c.createdAt).replace(/ 週.$/, '')}</span>` : html`<span class="t-3">不明</span>`;

      if (p.key === 'reportsTo') { const b = c.reportsTo && store.get('contacts', c.reportsTo); return b ? html`<span class="ct-pv-person">${UI.nameBlock(b, { size: 20, title: false })}${b.name}<span class="t-3">${b.title}</span></span>` : html`<span class="t-3">無</span>`; }
      if (p.key === 'tags') return (c.tags || []).length ? html`<span>${c.tags.join('、')}</span>` : html`<span class="t-3">新增標籤</span>`;
      const v = c[p.key];
      return v ? html`<span class="ct-pv-text">${v}</span>` : html`<span class="t-3">新增${p.label}</span>`;

    function drawProps() {
      const c = cur();
      propsEl.innerHTML = String(html`${PROPS.map((p) => html`<div class="ct-prop" data-key="${p.key}"><dt>${p.label}</dt><dd>${p.kind === 'readonly' ? html`<span class="ct-pv is-ro">${propValue(p, c)}</span>` : html`<button type="button" class="ct-pv" data-edit="${p.key}" aria-label="編輯${p.label}"${p.kind !== 'text' ? raw(' aria-haspopup="menu"') : ''}>${propValue(p, c)}${UI.icon('edit', { size: 14, cls: 'ct-pv-ic' })}</button>`}</dd></div>`)}`);
    }
    function commit(patch, label) {
      const { undo } = store.batch(() => store.update('contacts', id, patch));
      UI.toast(`已更新${label}`, { undo });
    }
    const refocus = (key) => requestAnimationFrame(() => { const b = propsEl.querySelector(`[data-edit="${key}"]`); b && b.focus({ preventScroll: true }); });
    function editText(btn, p) {
      const c = cur();
      const old = c[p.key] || '';
      editing = true;
      const input = h(html`<input class="input ct-pin" type="${p.type}" name="ct-${p.key}" value="${old}" aria-label="${p.label}" autocomplete="off">`);
      btn.replaceWith(input);
      input.focus();
      input.select();
      let done = false;
      const finish = (save) => {
        if (done) return;
        const v = input.value.trim();
        if (save && p.key === 'email' && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) {
          if (document.activeElement === input) { input.setAttribute('aria-invalid', 'true'); input.title = 'Email 格式不正確'; UI.toast('Email 格式不正確，請再檢查'); return; }
          save = false;
          UI.toast('Email 格式不正確，沒有儲存');
        }
        done = true;
        editing = false;
        if (save && v !== old) commit({ [p.key]: v }, p.label);
        else drawProps();
        refocus(p.key);
      };
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
      });
      input.addEventListener('blur', () => finish(true));
    }
    function editMenu(btn, p) {
      const c = cur();
      let items = [];
      if (p.key === 'lifecycle') items = store.LIFECYCLES.map((l) => ({ label: l, checked: c.lifecycle === l, onSelect: () => l !== c.lifecycle && commit({ lifecycle: l }, '生命週期') }));
      if (p.key === 'owner') items = store.all('reps').map((r) => ({ label: r.name + (r.me ? '（我）' : ''), lead: UI.nameBlock(r, { size: 20, title: false }), hint: r.region, checked: c.owner === r.id, onSelect: () => r.id !== c.owner && commit({ owner: r.id }, '負責人') }));
      if (p.key === 'reportsTo') {
        const peers = store.contactsOf(c.companyId).filter((x) => x.id !== id && x.reportsTo !== id);
        items = [{ label: '無', checked: !c.reportsTo, onSelect: () => c.reportsTo && commit({ reportsTo: null }, '直屬主管') }, { divider: true },
          ...peers.map((x) => ({ label: x.name, lead: UI.nameBlock(x, { size: 20, title: false }), hint: x.title, checked: c.reportsTo === x.id, onSelect: () => x.id !== c.reportsTo && commit({ reportsTo: x.id }, '直屬主管') }))];
      }
      if (p.key === 'tags') {
        items = [{ heading: '點選加上或移除' }, ...store.TAGS.map((t) => {
          const on = (c.tags || []).includes(t);
          return { label: t, checked: on, onSelect: () => commit({ tags: on ? c.tags.filter((x) => x !== t) : [...(c.tags || []), t] }, `標籤（${on ? '移除' : '加上'}「${t}」）`) };
        })];
      }
      UI.menu(btn, items, { label: p.label, align: 'end', onSelect: () => refocus(p.key) });
    }
    propsEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-edit]');
      if (!b) return;
      const p = PROPS.find((x) => x.key === b.dataset.edit);
      if (p.kind === 'text') editText(b, p); else editMenu(b, p);
    });

    /* 側欄：交易、任務、同事 */
    function drawDeals() {
      const deals = store.openDealsFor({ contactId: id }).slice().sort((a, b) => a.closeDate.localeCompare(b.closeDate));
      dealsEl.innerHTML = String(html`<header class="ct-side-h"><h2 class="section-title">進行中交易</h2><span class="ct-side-n">${deals.length ? UI.money(deals.reduce((s, d) => s + d.amount, 0), { compact: true }) : ''}</span>${UI.iconBtn('plus', { label: '新增交易', size: 'sm', attrs: { 'data-act': 'deal' } })}</header>
        ${deals.length ? html`<ul class="ct-deal-list">${deals.map((d) => html`<li><button type="button" class="ct-deal" data-deal="${d.id}"><span class="ct-deal-top"><span class="ct-deal-name">${d.name}</span>${UI.money(d.amount, { compact: true, cls: 'ct-deal-amt' })}</span><span class="ct-deal-bot">${UI.stageTag(d.stage)}<span class="t-12 t-3">預計 ${U.fmtDate(d.closeDate)}</span><span class="t-mono t-12 t-3 ct-deal-code">${d.code}</span></span></button></li>`)}</ul>` : html`<p class="ct-side-empty">沒有進行中的交易。</p>`}`);
    }
    function drawTasks() {
      const tasks = store.tasksFor({ contactId: id }, { open: true }).slice().sort((a, b) => (a.due + (a.dueTime || '')).localeCompare(b.due + (b.dueTime || '')));
      tasksEl.innerHTML = String(html`<header class="ct-side-h"><h2 class="section-title">待辦任務</h2><span class="ct-side-n">${tasks.length ? tasks.length + ' 件' : ''}</span>${UI.iconBtn('plus', { label: '新增任務', size: 'sm', attrs: { 'data-act': 'task' } })}</header>
        ${tasks.length ? html`<ul class="ct-task-list">${tasks.map((t) => html`<li class="ct-task">${UI.checkbox({ attrs: { 'data-task': t.id, 'aria-label': '完成：' + t.title } })}<span class="ct-task-text"><span class="ct-task-title">${t.priority === 'high' ? html`<span class="ct-task-hi" data-tip="高優先">${UI.icon('flag', { size: 14 })}</span>` : ''}${t.title}</span>${UI.due(t.due, t.dueTime)}</span></li>`)}</ul>` : html`<p class="ct-side-empty">沒有待辦，要不要排下一步？</p>`}`);
    }
    function drawPeers() {
      const c = cur();
      const co = store.get('companies', c.companyId);
      const peers = co ? store.contactsOf(co.id).filter((x) => x.id !== id) : [];
      const lv = { top: 0, mid: 1, low: 2 };
      peers.sort((a, b) => (lv[a.level] ?? 3) - (lv[b.level] ?? 3));
      peersEl.innerHTML = String(html`<header class="ct-side-h"><h2 class="section-title">同公司的其他人</h2><span class="ct-side-n">${peers.length ? peers.length + ' 位' : ''}</span></header>

    }

    function drawAll() {

      if (!editing) drawProps();

      const deal = e.target.closest('[data-deal]');
      if (deal) { CRM.ui.openDeal(deal.dataset.deal); return; }
      const act = e.target.closest('[data-act]');
      if (!act) return;
      const c = cur();
      const a = act.dataset.act;
      if (a === 'log') {
        const ta = composeEl.querySelector('[name="body"]');
        composeEl.scrollIntoView({ block: 'center', behavior: U.reducedMotion() ? 'auto' : 'smooth' });

      else if (a === 'edit') UI.edit('contact', id);
      else if (a === 'deal') UI.create('deal', { companyId: c.companyId || '', contactIds: [id] });
      else if (a === 'more') { tlLimit += 30; drawTimeline(); }
    });
    tasksEl.addEventListener('change', (e) => {
      const cb = e.target.closest('[data-task]');
      if (cb && cb.checked) CRM.actions.completeTask(cb.dataset.task);
    });

    const off = store.subscribe((evt) => {
      if (!cur()) {
        page.innerHTML = String(html`<section class="panel ct-missing">${UI.emptyState({ title: '這位聯絡人已刪除', body: '可以按通知上的「復原」救回來。', action: html`<a class="btn btn--primary btn--sm" href="${back.href}">${UI.icon('chevronLeft', { size: 16 })}<span>回到聯絡人清單</span></a>` })}</section>`);
        return;
      }
      if (!page.querySelector('.ct-hero')) { router.refresh(); return; }
      if (evt.has('contacts', 'activities', 'deals', 'tasks', 'companies', 'reps')) drawAll();
      if (evt.has('deals')) {
        const form = composeEl.querySelector('form');
        const names = ['body', 'subject', 'location', 'duration'];
        const keep = form ? names.map((n) => form.querySelector(`[name="${n}"]`).value) : null;
        drawCompose();
        if (keep) { const f2 = composeEl.querySelector('form'); names.forEach((n, i) => { f2.querySelector(`[name="${n}"]`).value = keep[i]; }); }
      }
    });
    return () => off();
  }

  /* ── 註冊 ─────────────────────────────────────────── */
  let cleanup = null;
  CRM.pages.contacts = {
    route: /^\/contacts(?:\/([\w-]+))?$/,
    title: (ctx) => {
      const id = ctx.params && ctx.params[0];
      if (!id) return '聯絡人';
      const c = ctx.store.get('contacts', id);
      return c ? c.name + ' · 聯絡人' : '找不到聯絡人';
    },
    nav: 'contacts',
    mount(el, ctx) {
      const id = ctx.params && ctx.params[0];
      cleanup = id ? mountDetail(el, ctx, id) : mountList(el, ctx);
    },
    unmount() {
      if (cleanup) { try { cleanup(); } catch (err) { console.error(err); } }
      cleanup = null;
    },
  };
})();

/* pages/tasks · 任務（#/tasks?view=list|week）
   query：view=list|week  who=all|me|u2…  due=overdue|today|tomorrow|week|later|done  pri=high|normal|low
          rel=deal|contact|company|none  q=  wk=-1|1（週曆位移）  day=YYYY-MM-DD（手機週曆選的日）  focus=t012 */
(function () {
  'use strict';
  const CRM = window.CRM;
  const U = CRM.util;
  const { html, raw, h } = U;

  const S = () => CRM.store;
  const ui = () => CRM.ui;
  const todayIso = () => U.iso(U.today());

  /* ════════ 自然語言快速新增 ════════ */
  const CN = { 零: 0, 〇: 0, 一: 1, 二: 2, 兩: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
  const NUM = '\\d{1,2}|[一二兩三四五六七八九十]{1,3}';
  function cnInt(s) {
    if (s == null) return NaN;
    if (/^\d+$/.test(s)) return +s;
    if (s === '十') return 10;
    const m = /^([一二兩三四五六七八九])?十([一二三四五六七八九])?$/.exec(s);
    if (m) return (m[1] ? CN[m[1]] : 1) * 10 + (m[2] ? CN[m[2]] : 0);
    return s.length === 1 && s in CN ? CN[s] : NaN;
  }
  const WD = { 一: 0, 二: 1, 三: 2, 四: 3, 五: 4, 六: 5, 日: 6, 天: 6 };
  const PM = new Set(['下午', '晚上', '傍晚', 'pm']);
  const AM = new Set(['上午', '早上', '凌晨', 'am']);

  /**
   * parseQuick('明天下午3點 打給陳怡君 確認報價 !')
   * → { title, due, dueTime, priority, contact, company, hasDate, marks:[{ a, b, kind }] }
   * 日期、時間、優先度會從標題移除；聯絡人姓名保留在標題裡（讀起來才通順）。
   */
  function parseQuick(text) {
    const store = S();
    const T = U.today();
    const out = { raw: text, title: '', due: U.iso(T), dueTime: null, priority: 'normal', contact: null, company: null, hasDate: false, marks: [] };
    const used = [];
    const free = (a, b) => used.every(([x, y]) => b <= x || a >= y);
    /** 找第一個（或全部）沒被佔用的符合，fn 回傳 false 表示不接受 */
    function take(src, kind, fn, all = false) {
      const re = new RegExp(src, 'g');
      let m, hit = false;
      while ((m = re.exec(text))) {
        if (!m[0]) { re.lastIndex++; continue; }
        const lead = m[0].length - m[0].replace(/^\s+/, '').length;
        const a = m.index + lead, b = m.index + m[0].length;
        if (!free(a, b)) continue;
        if (fn && fn(m) === false) continue;
        used.push([a, b]);
        out.marks.push({ a, b, kind });
        hit = true;
        if (!all) break;
      }
      return hit;
    }
    // 優先度
    take('[!！]+|(?:^|\\s)(?:急件|緊急|急|高優先)(?=\\s|$)', 'pri', () => { out.priority = 'high'; }, true);
    // 日期（依序只取第一種）
    let hint = null;
    const setDay = (d) => { out.due = U.iso(d); out.hasDate = true; };
    const datePatterns = [
      ['(今|明)(晚|早)', (m) => { setDay(U.addDays(T, m[1] === '明' ? 1 : 0)); hint = m[2] === '晚' ? 'pm' : 'am'; }],
      ['大後天|後天|明天|明日|今天|今日', (m) => { setDay(U.addDays(T, { 大後天: 3, 後天: 2, 明天: 1, 明日: 1, 今天: 0, 今日: 0 }[m[0]])); }],
      ['(下下|下)?(?:週|周|星期|禮拜)([一二三四五六日天])', (m) => {
        const mon = U.startOfWeek(T);
        let d = U.addDays(mon, (m[1] === '下下' ? 14 : m[1] ? 7 : 0) + WD[m[2]]);
        if (!m[1] && d < T) d = U.addDays(d, 7);
        setDay(d);
      }],
      ['(\\d{1,2})\\s*[/月]\\s*(\\d{1,2})\\s*[日號]?', (m) => {
        const mo = +m[1], da = +m[2];
        if (mo < 1 || mo > 12 || da < 1 || da > 31) return false;
        let d = new Date(T.getFullYear(), mo - 1, da);
        if (d.getMonth() !== mo - 1) return false;
        if (U.daysBetween(d, T) > 60) d = new Date(T.getFullYear() + 1, mo - 1, da);
        setDay(d);
      }],
      [`(${NUM})\\s*天(?:後|之後)`, (m) => { const n = cnInt(m[1]); if (!(n >= 0 && n <= 90)) return false; setDay(U.addDays(T, n)); }],
      ['下(?:週|周|星期|禮拜)(?![一二三四五六日天])', () => { setDay(U.addDays(U.startOfWeek(T), 7)); }],
    ];
    for (const [src, fn] of datePatterns) if (take(src, 'date', fn)) break;
    // 時間
    take(`(上午|早上|中午|下午|晚上|傍晚|凌晨)?\\s*(${NUM})\\s*(?:[:：]\\s*(\\d{2})|點(?:鐘)?\\s*(?:(半)|(${NUM})\\s*分)?|時)`, 'time', (m) => {
      let hh = cnInt(m[2]);
      const mm = m[3] ? +m[3] : m[4] ? 30 : m[5] ? cnInt(m[5]) : 0;
      const p = m[1] || hint;
      if (PM.has(p)) { if (hh < 12) hh += 12; }
      else if (p === '中午') { if (hh < 6) hh += 12; }
      else if (AM.has(p)) { if (hh === 12) hh = 0; }
      else if (hh >= 1 && hh <= 7) hh += 12; // 沒寫上下午：「3點」視為下午三點（上班時段）
      if (!(hh >= 0 && hh <= 23 && mm >= 0 && mm <= 59)) return false;
      out.dueTime = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
    });
    // 標題：拿掉日期、時間、優先度
    const cut = [...used].sort((x, y) => x[0] - y[0]);
    let title = '', pos = 0;
    cut.forEach(([a, b]) => { title += text.slice(pos, a) + ' '; pos = b; });
    title += text.slice(pos);
    out.title = title.replace(/\s+/g, ' ').replace(/^[\s,，、。:：]+|[\s,，、:：]+$/g, '').trim();
    // 關聯：最長的聯絡人姓名；找不到再找公司
    let best = null;
    store.all('contacts').forEach((c) => { if (c.name && c.name.length >= 2 && out.title.includes(c.name) && (!best || c.name.length > best.name.length)) best = c; });
    const markName = (name, kind) => {
      let i = text.indexOf(name);
      while (i >= 0 && !free(i, i + name.length)) i = text.indexOf(name, i + 1);
      if (i >= 0) out.marks.push({ a: i, b: i + name.length, kind });
    };
    if (best) {
      out.contact = best;
      out.company = store.get('companies', best.companyId);
      markName(best.name, 'contact');
    } else {
      let bestCo = null, bestKey = '';
      store.all('companies').forEach((co) => {
        [co.name, co.name.replace(/(股份有限公司|有限公司)$/, ''), co.short].forEach((k) => {
          if (k && k.length >= 2 && out.title.includes(k) && k.length > bestKey.length) { bestCo = co; bestKey = k; }
        });
      });
      if (bestCo) { out.company = bestCo; markName(bestKey, 'company'); }
    }
    out.marks.sort((x, y) => x.a - y.a);
    return out;
  }

  /** 「本週」的範圍：後天到週日；週末剩不到兩天時改成下週 */
  function weekSpan() {

      match: (t, v) => (v === 'deal' ? !!t.dealId : v === 'contact' ? !!t.contactId : v === 'company' ? !!t.companyId && !t.contactId : !t.contactId && !t.companyId && !t.dealId),
