/* ── styles/tokens.css ── */
/* 劃記 TALLY CRM · design tokens
   風格：概念稿式的卡片介面。深色浮動側欄＋柔和畫布＋白色大圓角卡片，柿色為品牌色，粉彩色做分類。
   頁面 CSS 只能用這裡的 token，不寫死色碼。 */

:root {
  color-scheme: light;

  /* surfaces */
  --bg: #f3f1ec;            /* 畫布 */
  --sheet: #ffffff;         /* 卡片 */
  --panel: #ffffff;
  --raised: #ffffff;        /* 浮層 */
  --subtle: #f8f7f4;        /* 卡片內的次要區塊、表頭 */
  --inset: #f1efea;         /* 輸入框、軌道 */
  --hover: rgba(28, 26, 23, .04);
  --press: rgba(28, 26, 23, .075);
  --select: rgba(224, 102, 42, .07);
  --tonal: #f1efea;

  /* sidebar（深色浮動卡） */
  --side-bg: #1d1b18;
  --side-ink: #f3efe8;
  --side-ink-2: #b9b3a8;
  --side-ink-3: #8a847a;
  --side-line: rgba(255, 250, 240, .08);
  --side-hover: rgba(255, 250, 240, .06);
  --side-active: rgba(236, 118, 58, .16);
  --side-active-ink: #ffb68d;

  /* ink */
  --ink: #1c1a17;
  --ink-2: #57534c;
  --ink-3: #736e66;         /* 白底 ≥ 4.9:1 */
  --ink-4: #b3aea5;         /* 只做裝飾 */
  --line: rgba(28, 26, 23, .07);
  --line-strong: rgba(28, 26, 23, .13);
  --edge: rgba(28, 26, 23, .06);

  /* brand & signals */
  --accent: #e0662a;
  --accent-strong: #c9531b;
  --accent-ink: #ffffff;
  --accent-soft: #fdebe0;
  --pine: #1f8a57;
  --pine-soft: #dcf3e6;
  --ochre: #a86d0a;
  --ochre-soft: #fbefcf;
  --primary: var(--accent);
  --primary-ink: #ffffff;
  --primary-hover: var(--accent-strong);
  --primary-press: #b3481a;
  --focus: #e0662a;

  /* 粉彩色（底 / 字）：分類、徽章、頭像、階段 */
  --peach-bg: #fde6d8;  --peach: #b4541f;
  --mint-bg: #dcf3e6;   --mint: #1f7a4b;
  --sky-bg: #dde9fb;    --sky: #2c5fa3;
  --lemon-bg: #fbf0c8;  --lemon: #86660a;
  --lilac-bg: #ebe5fa;  --lilac: #634aa8;
  --rose-bg: #fbe1e7;   --rose: #ab3857;
  --teal-bg: #d8f1ee;   --teal: #1d756d;
  --sand-bg: #efe7da;   --sand: #6b583b;
  --tone-1-bg: var(--peach-bg); --tone-1-fg: var(--peach);
  --tone-2-bg: var(--mint-bg);  --tone-2-fg: var(--mint);
  --tone-3-bg: var(--sky-bg);   --tone-3-fg: var(--sky);
  --tone-4-bg: var(--rose-bg);  --tone-4-fg: var(--rose);
  --tone-5-bg: var(--lemon-bg); --tone-5-fg: var(--lemon);
  --tone-6-bg: var(--teal-bg);  --tone-6-fg: var(--teal);
  --tone-7-bg: var(--sand-bg);  --tone-7-fg: var(--sand);
  --tone-8-bg: var(--lilac-bg); --tone-8-fg: var(--lilac);

  /* pipeline stages */
  --st-lead: #9aa6b8;
  --st-qual: #5b8fd6;
  --st-poc: #8a6fd1;
  --st-prop: #e0a526;
  --st-nego: #e0662a;
  --st-won: #1f9a60;
  --st-lost: #c7515f;

  /* charts */
  --chart-track: var(--inset);
  --chart-grid: var(--line);

  /* type */
  --font-ui: -apple-system, BlinkMacSystemFont, system-ui, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --font-display: var(--font-ui);
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --fs-11: 11px;
  --fs-12: 12px;
  --fs-13: 13px;
  --fs-14: 14px;
  --fs-16: 16px;
  --fs-20: 20px;
  --fs-26: 26px;
  --fs-34: 34px;
  --lh-body: 1.5;
  --lh-title: 1.25;

  /* spacing */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 20px;
  --s6: 24px;
  --s8: 32px;
  --s10: 40px;
  --s14: 56px;

  /* radius */
  --r-xs: 6px;
  --r-ctl: 10px;
  --r-panel: 18px;
  --r-sheet: 22px;
  --r-block: 10px;
  --r-pill: 999px;

  /* elevation：柔和、方向朝下、帶一點暖色 */
  --shadow-1: 0 1px 2px rgba(60, 45, 30, .05);
  --shadow-card: 0 1px 2px rgba(60, 45, 30, .04), 0 8px 24px -14px rgba(60, 45, 30, .16);
  --shadow-pop: 0 0 0 1px rgba(28, 26, 23, .06), 0 4px 8px rgba(60, 45, 30, .05), 0 20px 40px -12px rgba(60, 45, 30, .22);
  --scrim: rgba(28, 24, 20, .32);

  /* motion */
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --dur-hover: 140ms;
  --dur-press: 90ms;
  --dur-enter: 240ms;
  --dur-exit: 160ms;

  /* layout */
  --side-w: 248px;
  --rail-w: var(--side-w);
  --header-h: 76px;
  --tabbar-h: 62px;
  --gutter: 28px;
  --frame: 14px;
}

    --shadow-pop: 0 0 0 1px rgba(255, 250, 240, .08), 0 4px 8px rgba(0, 0, 0, .3), 0 20px 44px -12px rgba(0, 0, 0, .7);

  }
}

/* ── styles/base.css ── */
/* base · reset, type, focus, utilities */

*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: var(--fs-14);
  line-height: var(--lh-body);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum";
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

h1, h2, h3, h4, p, ul, ol, figure, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
h1, h2, h3, h4 { font-weight: 600; line-height: var(--lh-title); }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
img, svg { display: block; }
svg { flex: none; }
table { border-collapse: collapse; }
[hidden] { display: none !important; }

::selection { background: var(--accent-soft); }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: var(--r-ctl);
}

/* type helpers */
.t-display { font-family: var(--font-display); font-weight: 700; line-height: var(--lh-title); }
.t-mono { font-family: var(--font-mono); font-size: .92em; letter-spacing: 0; }
.t-12 { font-size: var(--fs-12); }
.t-13 { font-size: var(--fs-13); }
.t-16 { font-size: var(--fs-16); }
.t-20 { font-size: var(--fs-20); }
.t-2 { color: var(--ink-2); }
.t-3 { color: var(--ink-3); }
.t-accent { color: var(--accent); }
.t-pine { color: var(--pine); }
.t-ochre { color: var(--ochre); }
.t-strong { font-weight: 600; }
.t-num { font-variant-numeric: tabular-nums; }
.t-right { text-align: right; }
.t-ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* layout helpers */
.row { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.row-3 { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.stack { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
.stack-4 { display: flex; flex-direction: column; gap: var(--s4); min-width: 0; }
.grow { flex: 1 1 auto; min-width: 0; }
.push { margin-left: auto; }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* surfaces */
.panel {
  background: var(--panel);
  border-radius: var(--r-panel);
  box-shadow: 0 0 0 1px var(--edge);
}
.panel-pad { padding: var(--s5); }
.section-title {
  font-size: var(--fs-14);
  font-weight: 600;
  line-height: var(--lh-title);
}
.label {
  font-size: var(--fs-12);
  color: var(--ink-3);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}

/* ── styles/components.css ── */
/* components · ui.js 元件的樣式。頁面 CSS 只用 token。 */

/* ── buttons ─────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 38px;
  padding: 0 14px;
  border-radius: var(--r-ctl);
  font-size: var(--fs-14);
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
  user-select: none;
  -webkit-user-select: none;
  transition: background-color var(--dur-hover) var(--ease-out), color var(--dur-hover) var(--ease-out), box-shadow var(--dur-hover) var(--ease-out);
}
.btn .ic { margin-left: -2px; }
.btn--primary {
  background: var(--primary);
  color: var(--primary-ink);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 1px 2px rgba(180, 70, 20, .25), 0 6px 14px -8px rgba(224, 102, 42, .6);
}
.btn--primary:hover { background: var(--primary-hover); }
.btn--primary:active { background: var(--primary-press); transition-duration: var(--dur-press); }
/* 次要：白底細框（不是 ghost 外框鈕，框線是同色系的淡邊） */
.btn--tonal {
  background: var(--sheet);
  color: var(--ink);
  box-shadow: 0 0 0 1px var(--line-strong), var(--shadow-1);
}
.btn--soft { background: var(--accent-soft); color: var(--accent-strong); }
.btn--soft:hover { background: color-mix(in srgb, var(--accent) 20%, var(--sheet)); }
.btn--tonal:hover { background: var(--subtle); }
.btn--tonal:active { background: var(--inset); transition-duration: var(--dur-press); }
.btn--quiet { color: var(--ink-2); }
.btn--quiet:hover { background: var(--hover); color: var(--ink); }
.btn--quiet:active { background: var(--press); }
.btn--danger { color: var(--accent); }
.btn--danger:hover { background: var(--accent-soft); }
.btn--danger:active { background: var(--accent-soft); }
.btn--danger-solid { background: var(--accent); color: var(--accent-ink); }
.btn--danger-solid:hover { background-image: linear-gradient(rgba(0, 0, 0, .08), rgba(0, 0, 0, .08)); }
.btn--sm { height: 32px; padding: 0 12px; font-size: var(--fs-13); gap: 6px; border-radius: 9px; }
.btn--sm .ic { margin-left: -3px; }
.btn:disabled, .icon-btn:disabled { opacity: .45; cursor: not-allowed; background-image: none; }
.btn .kbd-group { margin-left: 4px; }
.btn--primary .kbd { background: rgba(255, 255, 255, .14); color: inherit; box-shadow: none; }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: var(--r-ctl);
  color: var(--ink-3);
  transition: background-color var(--dur-hover) var(--ease-out), color var(--dur-hover) var(--ease-out);
}
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.icon-btn:active { background: var(--press); transition-duration: var(--dur-press); }
.icon-btn--sm { width: 30px; height: 30px; border-radius: 9px; }
.icon-btn[aria-pressed="true"] { background: var(--inset); color: var(--ink); }

/* ── kbd ─────────────────────────────────────────── */
.kbd-group { display: inline-flex; gap: 2px; flex: none; }
.kbd {
  display: inline-grid;
  place-items: center;
  min-width: 20px;
  height: 20px;
  padding: 0 4px;
  border-radius: var(--r-xs);
  background: var(--subtle);
  color: var(--ink-3);
  font: 500 var(--fs-11)/1 var(--font-ui);
  box-shadow: inset 0 0 0 1px var(--line), inset 0 -1px 0 var(--line);
}

/* ── fields ──────────────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; margin: 0; padding: 0; border: 0; }
.field-label { font-size: var(--fs-12); font-weight: 500; color: var(--ink-2); padding: 0; }
.field-req { color: var(--accent); margin-left: 2px; font-weight: 400; }
.field-hint { font-size: var(--fs-12); color: var(--ink-3); }
.field--full { grid-column: 1 / -1; }
.input {
  display: block;
  width: 100%;
  height: 40px;
  padding: 0 12px;
  border: 0;
  border-radius: var(--r-ctl);
  background: var(--inset);
  box-shadow: inset 0 0 0 1px transparent;
  color: var(--ink);
  font-size: var(--fs-14);
  transition: box-shadow var(--dur-hover) var(--ease-out);
}
.input::placeholder { color: var(--ink-3); opacity: 1; }
.input:hover { box-shadow: inset 0 0 0 1px var(--line-strong); }
.input:focus, .input:focus-visible { outline: none; background: var(--sheet); box-shadow: inset 0 0 0 1.5px var(--focus), 0 0 0 4px var(--accent-soft); border-radius: var(--r-ctl); }
.textarea { height: auto; min-height: 72px; padding: 8px 10px; line-height: var(--lh-body); resize: vertical; }
.select-wrap { position: relative; display: block; min-width: 0; }
.select { appearance: none; -webkit-appearance: none; padding-right: 30px; text-overflow: ellipsis; }
.select-caret { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--ink-3); pointer-events: none; }
input[type="number"].input, input[type="date"].input, input[type="time"].input { font-variant-numeric: tabular-nums; }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); }
.form-error { margin-top: var(--s3); color: var(--accent); font-size: var(--fs-13); }
.form .field--full > .seg { width: 100%; }
.form .field--full > .seg > button { flex: 1; }
.check-row { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); padding-top: 2px; }

/* ── checkbox ────────────────────────────────────── */
.check { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: var(--fs-13); color: var(--ink); line-height: 1.3; }
.check input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.check-box {
  display: grid;
  place-items: center;
  width: 18px;
  height: 18px;
  flex: none;
  border-radius: 6px;
  box-shadow: inset 0 0 0 1px var(--line-strong), 0 1px 1px rgba(20, 18, 15, .04);
  background: var(--sheet);
  color: transparent;
  transition: background-color var(--dur-hover) var(--ease-out), box-shadow var(--dur-hover) var(--ease-out);
}
.check-box .ic { grid-area: 1 / 1; stroke-width: 2.4; }
.check-dash { grid-area: 1 / 1; width: 8px; height: 2px; border-radius: 1px; background: transparent; }
.check:hover .check-box { box-shadow: inset 0 0 0 1px var(--ink-4); }
.check input:checked + .check-box { background: var(--primary); box-shadow: none; color: var(--primary-ink); }
.check input:indeterminate + .check-box { background: var(--primary); box-shadow: none; }
.check input:indeterminate + .check-box .check-dash { background: var(--primary-ink); }
.check input:indeterminate + .check-box .ic { display: none; }
.check input:focus-visible + .check-box { outline: 2px solid var(--focus); outline-offset: 2px; }
.check-label { min-width: 0; }

/* ── segmented ───────────────────────────────────── */
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--inset); max-width: 100%; }
.seg > button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 30px;
  padding: 0 12px;
  border-radius: 9px;
  color: var(--ink-3);
  font-size: var(--fs-13);
  font-weight: 600;
  white-space: nowrap;
  transition: background-color var(--dur-hover) var(--ease-out), color var(--dur-hover) var(--ease-out);
}
.seg > button:hover { color: var(--ink); }
.seg > button[aria-checked="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 0 0 1px var(--edge), var(--shadow-1); }
.seg > button:focus-visible { outline-offset: 0; }
.seg--sm > button { height: 26px; padding: 0 10px; font-size: var(--fs-12); border-radius: 8px; }

/* ── tabs（檢視切換：文字＋計數，當前項有白底） ───── */
.tabs { display: flex; gap: 2px; min-width: 0; flex-wrap: wrap; }
.tabs > button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 14px;
  border-radius: var(--r-pill);
  color: var(--ink-2);
  font-size: var(--fs-14);
  font-weight: 600;
  white-space: nowrap;
  transition: color var(--dur-hover) var(--ease-out), background-color var(--dur-hover) var(--ease-out);
}
.tabs > button:hover { color: var(--ink); background: var(--hover); }
.tabs > button[aria-selected="true"] { color: var(--primary-ink); background: var(--ink); }
:root[data-theme="dark"] .tabs > button[aria-selected="true"] { color: var(--bg); }
.tabs-count { min-width: 22px; height: 20px; padding: 0 6px; border-radius: var(--r-pill); background: var(--inset); color: var(--ink-3); font-size: var(--fs-11); font-weight: 700; line-height: 20px; text-align: center; font-variant-numeric: tabular-nums; }
.tabs > button[aria-selected="true"] .tabs-count { background: rgba(255, 255, 255, .16); color: inherit; }

/* 底線式分頁（詳細頁的區段切換） */
.tabs--line { gap: var(--s5); box-shadow: inset 0 -1px 0 var(--line); flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.tabs--line > button { position: relative; height: 44px; padding: 0; border-radius: 0; background: none !important; color: var(--ink-3) !important; }
.tabs--line > button[aria-selected="true"] { color: var(--ink) !important; }
.tabs--line > button[aria-selected="true"] .tabs-count { background: var(--accent-soft); color: var(--accent-strong); }
.tabs--line > button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }

/* ── toolbar（頁首下方的工具列） ────────────────── */
.toolbar {
  display: flex;
  align-items: center;
  gap: var(--s2);
  min-height: 64px;
  padding: 12px var(--s6);
  flex-wrap: wrap;
}
.toolbar > * { min-width: 0; }
.toolbar-sep { width: 1px; height: 18px; margin: 0 4px; border-radius: 1px; background: var(--line-strong); }
/* 工具列按鈕：篩選、排序、顯示 */
.tbtn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 12px;
  border-radius: var(--r-pill);
  color: var(--ink-2);
  font-size: var(--fs-13);
  font-weight: 600;
  white-space: nowrap;
  background: var(--inset);
  transition: background-color var(--dur-hover) var(--ease-out), color var(--dur-hover) var(--ease-out), box-shadow var(--dur-hover) var(--ease-out);
}
.tbtn .ic { color: var(--ink-3); }
.tbtn:hover { background: var(--hover); color: var(--ink); }
.tbtn[aria-expanded="true"] { background: var(--hover); color: var(--ink); }
.tbtn:hover { background: var(--press); }
.tbtn.is-on { background: var(--accent-soft); color: var(--accent-strong); }
.tbtn.is-on .ic { color: var(--accent); }
.tbtn b { font-weight: 600; }
/* 搜尋框（工具列內） */
.tsearch { position: relative; display: flex; align-items: center; min-width: 0; }
.tsearch .ic { position: absolute; left: 13px; color: var(--ink-3); pointer-events: none; }
.tsearch .input { height: 38px; padding-left: 38px; width: 280px; border-radius: 12px; }

/* ── avatar（name block） / company mark ─────────── */
.tone-1 { --t-bg: var(--tone-1-bg); --t-fg: var(--tone-1-fg); }
.tone-2 { --t-bg: var(--tone-2-bg); --t-fg: var(--tone-2-fg); }
.tone-3 { --t-bg: var(--tone-3-bg); --t-fg: var(--tone-3-fg); }
.tone-4 { --t-bg: var(--tone-4-bg); --t-fg: var(--tone-4-fg); }
.tone-5 { --t-bg: var(--tone-5-bg); --t-fg: var(--tone-5-fg); }
.tone-6 { --t-bg: var(--tone-6-bg); --t-fg: var(--tone-6-fg); }
.tone-7 { --t-bg: var(--tone-7-bg); --t-fg: var(--tone-7-fg); }
.tone-8 { --t-bg: var(--tone-8-bg); --t-fg: var(--tone-8-fg); }
.nb {
  --nb: 28px;
  display: inline-grid;
  place-items: center;
  flex: none;
  width: var(--nb);
  height: var(--nb);
  border-radius: 50%;
  background: var(--t-bg, var(--inset));
  color: var(--t-fg, var(--ink-2));
  font-weight: 600;
  font-size: calc(var(--nb) * .46);
  line-height: 1;
  user-select: none;
}
.nb-ch { display: block; line-height: 1; transform: translateY(.02em); }
.nb--rep { box-shadow: 0 0 0 2px var(--sheet); }
.nb--empty { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); }

.cm {
  --cm: 24px;
  display: inline-grid;
  place-items: center;
  flex: none;
  width: var(--cm);
  height: var(--cm);
  border-radius: calc(var(--cm) * .3);
  background: var(--t-bg, var(--inset));
  color: var(--t-fg, var(--ink-2));
  font-weight: 650;
  font-size: calc(var(--cm) * .5);
  line-height: 1;
  user-select: none;
}
.cm--empty { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); }

/* ── activity bars（近 8 週往來） ────────────────── */
.abars { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; vertical-align: middle; }
.abars i { display: block; width: 3px; min-height: 2px; border-radius: 1.5px; background: var(--ink-4); }
.abars i[style*="height:0%"] { height: 2px !important; background: var(--line-strong); }
.abars i.is-now { background: var(--accent); }
.abars i.is-now[style*="height:0%"] { background: var(--line-strong); }

/* ── warmth ──────────────────────────────────────── */
.warmth { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; height: 26px; padding: 0 10px 0 9px; border-radius: var(--r-pill); background: var(--inset); }
.warmth[data-lvl="hot"] { background: var(--peach-bg); }
.warmth[data-lvl="warm"] { background: var(--lemon-bg); }
.warmth[data-lvl="cool"] { background: var(--sky-bg); }
.warmth-bare { height: auto; padding: 0; background: none !important; }
.warmth-bar { display: inline-flex; align-items: center; gap: 2px; }
.warmth-bar i { display: block; width: 4px; height: 10px; border-radius: 2px; background: color-mix(in srgb, currentColor 22%, transparent); }
.warmth-bar i.on { background: currentColor; }
.warmth { color: var(--ink-3); }
.warmth[data-lvl="hot"] { color: var(--peach); }
.warmth[data-lvl="warm"] { color: var(--lemon); }
.warmth[data-lvl="cool"] { color: var(--sky); }
.warmth-label { font-size: var(--fs-12); font-weight: 700; color: inherit; }

/* ── stage tag / tag ─────────────────────────────── */
.stage-tag { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-13); color: var(--ink-2); white-space: nowrap; }
.stage-tag i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 10px;
  border-radius: var(--r-pill);
  background: var(--inset);
  color: var(--ink-2);
  font-size: var(--fs-12);
  font-weight: 700;
  white-space: nowrap;
}
.tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.tag--peach { background: var(--peach-bg); color: var(--peach); }
.tag--mint { background: var(--mint-bg); color: var(--mint); }
.tag--sky { background: var(--sky-bg); color: var(--sky); }
.tag--lemon { background: var(--lemon-bg); color: var(--lemon); }
.tag--lilac { background: var(--lilac-bg); color: var(--lilac); }
.tag--rose { background: var(--rose-bg); color: var(--rose); }
.tag--teal { background: var(--teal-bg); color: var(--teal); }
.tag--sand { background: var(--sand-bg); color: var(--sand); }
.tag--line { background: none; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-2); font-weight: 600; }

/* ── stat card（頁首下方的統計卡） ───────────────── */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s4); }
.stat {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "label ic" "value value" "foot foot";
  gap: 6px 12px;
  padding: 18px 20px 16px;
  border-radius: var(--r-panel);
  background: var(--sheet);
  box-shadow: var(--shadow-card);
  min-width: 0;
}
a.stat:hover { box-shadow: var(--shadow-card), 0 0 0 1px var(--line-strong); }
.stat-label { grid-area: label; align-self: center; font-size: var(--fs-13); font-weight: 600; color: var(--ink-2); }
.stat-ic { grid-area: ic; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--t-bg, var(--inset)); color: var(--t-fg, var(--ink-2)); }
.stat-value { grid-area: value; display: flex; align-items: baseline; gap: 6px; font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.stat-unit { font-size: var(--fs-14); font-weight: 600; color: var(--ink-3); letter-spacing: 0; }
.stat-foot { grid-area: foot; display: flex; align-items: center; gap: 8px; min-width: 0; font-size: var(--fs-12); color: var(--ink-3); }
.stat-foot .spark { margin-left: auto; }
.delta { display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 7px; border-radius: var(--r-pill); font-size: var(--fs-12); font-weight: 700; font-variant-numeric: tabular-nums; }
.delta--up { background: var(--mint-bg); color: var(--mint); }
.delta--down { background: var(--rose-bg); color: var(--rose); }
.delta--flat { background: var(--inset); color: var(--ink-3); }

/* ── money / time ────────────────────────────────── */
.money { font-variant-numeric: tabular-nums; white-space: nowrap; }
.money--lost { position: relative; display: inline-block; color: var(--ink-3); line-height: 1.2; }
.money--lost::after {
  content: "";
  position: absolute;
  left: -2px;
  right: -2px;
  top: calc(50% - .06em);
  height: 1.5px;
  border-radius: 1px;
  background: currentColor;
  transform: translateY(-50%);
}
.rel, .due { white-space: nowrap; font-variant-numeric: tabular-nums; }
.due.is-overdue { color: var(--accent); font-weight: 500; }
.due.is-today { color: var(--ochre); font-weight: 500; }

/* ── cells ───────────────────────────────────────── */
.cell-person { display: flex; align-items: center; gap: 12px; min-width: 0; }
.cell-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.cell-name { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a.cell-name:hover { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.cell-sub { font-size: var(--fs-12); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── tally ───────────────────────────────────────── */
.tally { display: inline-flex; align-items: center; gap: 4px; vertical-align: middle; color: var(--ink); white-space: nowrap; }
.tally-g path { stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; }
.tally-g path.is-new { stroke: var(--accent); }
.tally-num { font-size: var(--fs-13); font-weight: 600; margin-right: 2px; }
.tally-zero { font-size: var(--fs-12); color: var(--ink-3); }

.brand-mark path { stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; }
.brand-mark .bm-ghost { stroke: var(--line-strong); }

/* ── charts ──────────────────────────────────────── */
.spark { overflow: visible; }
.spark-line { fill: none; stroke: var(--ink-2); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.spark-area { fill: var(--ink-2); opacity: .08; }
.spark-dot { fill: var(--ink); stroke: var(--sheet); stroke-width: 2; }

.barh { display: grid; gap: 10px; --barh-label: 96px; }
.barh-row { display: grid; grid-template-columns: var(--barh-label) minmax(0, 1fr) auto; align-items: center; gap: var(--s3); }
.barh-label { font-size: var(--fs-13); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a.barh-label:hover { color: var(--ink); }
.barh-track { display: flex; gap: 2px; height: 10px; min-width: 0; }
.barh-seg { display: block; height: 100%; min-width: 2px; flex: none; }
.barh-seg:first-child { border-radius: 2px 0 0 2px; }
.barh-seg.is-end { border-radius: 0 3px 3px 0; }
.barh-seg:only-child { border-radius: 2px 3px 3px 2px; }
.barh-value { font-size: var(--fs-13); color: var(--ink); text-align: right; min-width: 64px; font-variant-numeric: tabular-nums; }
.barh--track .barh-track { background: var(--inset); border-radius: 3px; }

/* ── empty ───────────────────────────────────────── */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: var(--s10) var(--s4); }
.empty--compact { padding: var(--s8) var(--s4); }
.empty-mark { margin-bottom: var(--s2); }
.empty-mark path { stroke: var(--line-strong); stroke-width: 2; stroke-linecap: round; }
.empty-mark path.on { stroke: var(--ink-3); }
.empty-title { font-size: var(--fs-14); font-weight: 600; color: var(--ink); }
.empty-body { max-width: 36ch; font-size: var(--fs-13); color: var(--ink-3); }
.empty-action { margin-top: var(--s2); }

/* ── table ───────────────────────────────────────── */
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--fs-13); }
.tbl th {
  position: sticky;
  top: var(--header-h);
  z-index: 5;
  height: 44px;
  padding: 0 12px;
  text-align: left;
  font-size: var(--fs-12);
  font-weight: 600;
  color: var(--ink-3);
  white-space: nowrap;
  background: var(--subtle);
  box-shadow: inset 0 -1px 0 var(--line), inset 0 1px 0 var(--line);
}
.tbl { font-size: var(--fs-14); }
.tbl td { height: 64px; padding: 0 12px; vertical-align: middle; box-shadow: inset 0 -1px 0 var(--line); min-width: 0; }
.tbl tbody tr:last-child td { box-shadow: none; }
.tbl .is-right { text-align: right; }
.tbl .is-center { text-align: center; }
.tbl tbody tr { transition: background-color var(--dur-hover) var(--ease-out); }
.tbl tbody tr.is-clickable { cursor: pointer; }
.tbl tbody tr:not(.tbl-empty):hover { background: var(--hover); }
.tbl tbody tr.is-selected { background: var(--select); }
.tbl tbody tr:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 0; }
.tbl .tbl-sel { width: 44px; padding-right: 0; }
.tbl th:first-child, .tbl td:first-child { padding-left: var(--s6); }
.tbl th:last-child, .tbl td:last-child { padding-right: var(--s6); }
.tbl-sort { display: inline-flex; align-items: center; gap: 4px; height: 24px; margin: 0 -6px; padding: 0 6px; border-radius: var(--r-xs); color: inherit; font: inherit; }
.tbl-sort:hover { color: var(--ink); background: var(--hover); }
.tbl-sort.is-active { color: var(--ink); }
.tbl-sort-ic { opacity: 0; transition: opacity var(--dur-hover); }
.tbl-sort:hover .tbl-sort-ic, .tbl-sort.is-active .tbl-sort-ic { opacity: 1; }
.tbl th.is-right .tbl-sort { flex-direction: row-reverse; }
.tbl-empty td { padding: 0; height: auto; }

/* ── floating layers ─────────────────────────────── */
.layers { position: relative; z-index: 50; }
.pop {
  position: fixed;
  z-index: 60;
  min-width: 200px;
  max-width: calc(100vw - 16px);
  max-height: min(70vh, 520px);
  overflow: auto;
  padding: 6px;
  border-radius: 14px;
  background: var(--raised);
  box-shadow: var(--shadow-pop);
}
.menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 36px;
  padding: 0 10px;
  border-radius: 9px;
  color: var(--ink);
  font-size: var(--fs-14);
  text-align: left;
  white-space: nowrap;
}
.menu-item:hover, .menu-item:focus { background: var(--hover); outline: none; }
.menu-item:focus-visible { box-shadow: inset 0 0 0 2px var(--focus); }
.menu-item:disabled { color: var(--ink-3); cursor: not-allowed; background: none; }
.menu-icon { color: var(--ink-3); }
.menu-item.is-danger, .menu-item.is-danger .menu-icon { color: var(--accent); }
.menu-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.menu-hint { font-size: var(--fs-12); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.menu-check { color: var(--ink); }
.menu-sep { height: 1px; margin: 5px 4px; border-radius: 1px; background: var(--line); }
.menu-heading { padding: 7px 8px 4px; font-size: var(--fs-12); color: var(--ink-3); }

.scrim { position: absolute; inset: 0; background: var(--scrim); }
.drawer-root, .modal-root { position: fixed; inset: 0; z-index: 50; }
.drawer {
  position: absolute;
  top: 8px;
  right: 8px;
  bottom: 8px;
  display: flex;
  flex-direction: column;
  width: min(var(--drawer-w, 560px), calc(100vw - 16px));
  border-radius: var(--r-sheet);
  background: var(--raised);
  box-shadow: var(--shadow-pop);
  overflow: hidden;
}
.drawer:focus { outline: none; }
.drawer-head { display: flex; align-items: flex-start; gap: var(--s3); padding: var(--s5) var(--s4) var(--s3) var(--s6); box-shadow: inset 0 -1px 0 var(--line); }
.drawer-titles { flex: 1; min-width: 0; }
.drawer-title { font-size: var(--fs-16); font-weight: 600; line-height: var(--lh-title); }
.drawer-sub { margin-top: 3px; font-size: var(--fs-13); color: var(--ink-3); }
.drawer-body { flex: 1; min-height: 0; overflow: auto; padding: var(--s5) var(--s6) var(--s6); overscroll-behavior: contain; }
.drawer-foot { display: flex; align-items: center; justify-content: flex-end; gap: var(--s2); padding: var(--s3) var(--s6) calc(var(--s3) + env(safe-area-inset-bottom)); background: var(--subtle); box-shadow: inset 0 1px 0 var(--line); }

.modal-root { display: grid; place-items: start center; padding: 12vh var(--s4) var(--s4); overflow: auto; }
.modal {
  position: relative;
  width: 100%;
  max-width: 520px;
  border-radius: var(--r-sheet);
  background: var(--raised);
  box-shadow: var(--shadow-pop);
}
.modal:focus { outline: none; }
.modal--sm { max-width: 420px; }
.modal--lg { max-width: 760px; }
.modal--palette { max-width: 620px; }
.modal--palette .modal-head { display: none; }
.modal--palette .modal-body { padding: 0; }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); padding: var(--s5) var(--s4) var(--s1) var(--s6); }
.modal-title { font-size: var(--fs-16); font-weight: 600; line-height: var(--lh-title); }
.modal-sub { margin-top: 3px; font-size: var(--fs-13); color: var(--ink-3); }
.modal-body { padding: var(--s3) var(--s6) var(--s5); }
.modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: var(--s2); padding: var(--s3) var(--s6); background: var(--subtle); box-shadow: inset 0 1px 0 var(--line); border-radius: 0 0 var(--r-sheet) var(--r-sheet); }
.modal-foot .btn--danger { margin-right: auto; margin-left: -10px; }
html.is-locked, html.is-locked body { overflow: hidden; }

/* ── toast ───────────────────────────────────────── */
.toasts {
  position: fixed;
  left: 50%;
  bottom: var(--s6);
  z-index: 70;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s2);
  width: max-content;
  max-width: calc(100vw - 32px);
  transform: translateX(-50%);
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 2px;
  min-height: 40px;
  max-width: 100%;
  padding: 4px 4px 4px 14px;
  border-radius: var(--r-panel);
  background: var(--primary);
  color: var(--primary-ink);
  box-shadow: var(--shadow-pop);
  font-size: var(--fs-13);
  pointer-events: auto;
}
.toast-msg { padding-right: var(--s2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast-btn, .toast-x {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  border-radius: 6px;
  color: inherit;
  font-weight: 600;
  white-space: nowrap;
}
.toast-x { width: 30px; padding: 0; opacity: .7; }
.toast-btn:hover, .toast-x:hover { background: color-mix(in srgb, var(--primary-ink) 14%, transparent); opacity: 1; }
.toast :focus-visible { outline-color: var(--primary-ink); }

/* ── tooltip ─────────────────────────────────────── */
.tip {
  position: fixed;
  z-index: 80;
  max-width: 260px;
  padding: 5px 8px;
  border-radius: 6px;
  background: var(--primary);
  color: var(--primary-ink);
  font-size: var(--fs-12);
  line-height: 1.4;
  pointer-events: none;
}

/* ── book-in ─────────────────────────────────────── */
.bookin {
  position: fixed;
  z-index: 90;
  padding: 4px 10px;
  border-radius: 6px;
  background: var(--pine);
  color: var(--sheet);
  font-size: var(--fs-13);
  font-weight: 650;
  white-space: nowrap;
  box-shadow: var(--shadow-pop);
  pointer-events: none;
  will-change: transform;
}

/* ── forms：報價品項 ─────────────────────────────── */
.lines { display: flex; flex-direction: column; gap: 6px; }
.lines-head, .lines-row { display: grid; grid-template-columns: minmax(0, 1fr) 76px 104px 116px 28px; gap: var(--s2); align-items: center; }
.lines-head { font-size: var(--fs-12); color: var(--ink-3); }
.lines-body { display: flex; flex-direction: column; gap: 6px; }
.lines-total { text-align: right; font-size: var(--fs-13); font-variant-numeric: tabular-nums; }
.lines-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
.lines-sum { font-size: var(--fs-13); color: var(--ink-2); }
.lines-sum-val { margin-left: 6px; font-size: var(--fs-16); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.form[data-type] .only-email, .form[data-type] .only-meeting, .form[data-type] .only-call { display: none; }
.form[data-type="email"] .only-email, .form[data-type="meeting"] .only-meeting, .form[data-type="call"] .only-call { display: flex; }

/* ── mobile ──────────────────────────────────────── */
@media (max-width: 760px) {
  .btn, .input { height: 38px; }
  .btn--sm { height: 32px; }
  .icon-btn { width: 38px; height: 38px; }
  .input { font-size: var(--fs-16); }
  .textarea { height: auto; }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .drawer { inset: 0; width: 100%; border-radius: 0; }
  .modal-root { padding: var(--s4) var(--s2) var(--s2); place-items: start stretch; }
  .modal { max-width: none; }
  .toasts { bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + var(--s3)); }
  .toolbar { padding: 8px var(--gutter); }
  .tsearch { flex: 1 1 100%; }
  .tsearch .input { width: 100%; height: 36px; }
  .lines-head { display: none; }
  .lines-row { grid-template-columns: minmax(0, 1fr) 64px 30px; grid-template-areas: "sku qty rm" "price total total"; row-gap: 6px; padding-bottom: 6px; }
  .lines-row .select-wrap { grid-area: sku; }
  .lines-row [name="qty"] { grid-area: qty; }
  .lines-row [name="price"] { grid-area: price; }
  .lines-row .lines-total { grid-area: total; }
  .lines-row .icon-btn { grid-area: rm; }

  /* 表格改成清單列 */
  .tbl, .tbl tbody { display: block; }
  .tbl thead { display: none; }
  .tbl tbody tr {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px var(--s3);
    padding: 12px var(--gutter);
    box-shadow: inset 0 -1px 0 var(--line);
  }
  .tbl.tbl--select tbody tr { padding-left: 48px; }
  .tbl td { display: block; height: auto; padding: 0; box-shadow: none; }
  .tbl th:first-child, .tbl td:first-child { padding-left: 0; }
  .tbl th:last-child, .tbl td:last-child { padding-right: 0; }
  .tbl td.tbl-sel { position: absolute; left: var(--gutter); top: 16px; width: auto; }
  .tbl tbody tr::after { content: ""; flex: 0 0 100%; height: 0; order: 2; }
  .tbl tbody tr.tbl-empty::after { display: none; }
  .tbl td[data-m="primary"] { flex: 1 1 0; min-width: 0; order: 0; }
  .tbl td[data-m="end"] { flex: none; max-width: 132px; margin-left: auto; order: 1; text-align: right; }
  .tbl td[data-m="meta"] { order: 3; font-size: var(--fs-12); color: var(--ink-2); }
  .tbl td[data-m="meta"][data-label]:not([data-label=""])::before { content: attr(data-label) " "; color: var(--ink-3); }
  .tbl td[data-m="hide"] { display: none; }
  .tbl-empty { display: block; }
  .tbl-empty td { width: 100%; }
}

/* ── styles/shell.css ── */
/* shell · 深色浮動側欄、畫布上的頁首、手機分頁列、使用者選單、命令面板 */

.app { min-height: 100vh; }

/* ── sidebar：浮在畫布上的深色卡 ─────────────────── */
.side {
  position: fixed;
  top: var(--frame);
  bottom: var(--frame);
  left: var(--frame);
  z-index: 30;
  display: flex;
  flex-direction: column;
  width: var(--side-w);
  border-radius: var(--r-sheet);
  background: var(--side-bg);
  color: var(--side-ink);
  box-shadow: 0 12px 32px -18px rgba(28, 20, 12, .55);
}
.side-top { padding: 22px 18px 10px 22px; }
.side-brand { display: flex; align-items: center; gap: 12px; height: 40px; }
.side-brand .brand-mark .bm-ghost { stroke: rgba(255, 250, 240, .14); }
.side-brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.side-brand-text b { font-size: 17px; font-weight: 700; letter-spacing: .04em; color: var(--side-ink); }
.side-brand-text span { font-size: var(--fs-11); font-weight: 600; letter-spacing: .12em; color: var(--side-ink-3); }

.side-scroll { flex: 1; min-height: 0; overflow: auto; padding: 8px 14px 12px; scrollbar-width: none; }
.side-scroll::-webkit-scrollbar { display: none; }
.side-heading { margin: 18px 0 8px; padding: 0 12px; font-size: var(--fs-12); font-weight: 500; color: var(--side-ink-3); }
.side-heading:first-child { margin-top: 6px; }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 42px;
  padding: 0 12px;
  border-radius: 12px;
  color: var(--side-ink-2);
  font-size: var(--fs-14);
  font-weight: 500;
  transition: background-color var(--dur-hover) var(--ease-out), color var(--dur-hover) var(--ease-out);
}
.side-item .ic { color: var(--side-ink-3); transition: color var(--dur-hover) var(--ease-out); }
.side-item:hover { background: var(--side-hover); color: var(--side-ink); }
.side-item:hover .ic { color: var(--side-ink-2); }
.side-item[aria-current="page"] { background: var(--side-active); color: var(--side-active-ink); font-weight: 600; }
.side-item[aria-current="page"] .ic { color: var(--side-active-ink); }
.side-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-count {
  min-width: 24px;
  height: 20px;
  padding: 0 7px;
  border-radius: var(--r-pill);
  background: rgba(255, 250, 240, .07);
  color: var(--side-ink-2);
  font-size: var(--fs-11);
  font-weight: 600;
  line-height: 20px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.side-item[aria-current="page"] .side-count { background: rgba(255, 182, 141, .16); color: var(--side-active-ink); }
.side-count.is-warn { background: var(--accent); color: #fff; }
.side-item--view { height: 36px; font-size: var(--fs-13); }
.side-swatch { width: 10px; height: 10px; margin: 0 5px; border-radius: 3px; flex: none; }
.sw-1 { background: #f5a878; }
.sw-2 { background: #9cc0f2; }
.sw-3 { background: #f0a0b5; }
.sw-4 { background: #7fd8a9; }

.side-foot { display: flex; flex-direction: column; gap: 10px; padding: 10px 14px 14px; }
.side-user {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 52px;
  padding: 0 10px 0 8px;
  border-radius: 14px;
  text-align: left;
  color: var(--side-ink-3);
}
.side-user:hover { background: var(--side-hover); color: var(--side-ink); }
.side-user .nb { box-shadow: 0 0 0 2px var(--side-bg), 0 0 0 3.5px rgba(255, 182, 141, .5); }
.side-user-text { display: flex; flex-direction: column; flex: 1; min-width: 0; line-height: 1.3; }
.side-user-text b { font-size: var(--fs-14); font-weight: 600; color: var(--side-ink); }
.side-user-text span { font-size: var(--fs-12); color: var(--side-ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── quarter meter（側欄底部；成交入帳飛進這裡） ── */
.qmeter {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px;
  border-radius: 16px;
  background: rgba(255, 250, 240, .05);
  box-shadow: inset 0 0 0 1px var(--side-line);
  color: var(--side-ink);
  transition: background-color var(--dur-hover) var(--ease-out);
}
.qmeter:hover { background: rgba(255, 250, 240, .08); }
.qmeter-top { display: flex; align-items: center; justify-content: space-between; line-height: 1; }
.qmeter-label { font-size: var(--fs-12); color: var(--side-ink-3); font-weight: 500; }
.qmeter-pct { height: 20px; padding: 0 7px; border-radius: var(--r-pill); background: rgba(95, 207, 150, .16); color: #7fd8a9; font-size: var(--fs-11); font-weight: 700; line-height: 20px; font-variant-numeric: tabular-nums; }
.qmeter-val { display: flex; align-items: baseline; gap: 6px; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.qmeter-won { font-size: 24px; font-weight: 700; color: var(--side-ink); letter-spacing: -.01em; }
.qmeter-of { font-size: var(--fs-12); color: var(--side-ink-3); }
.qmeter-track { position: relative; display: block; height: 8px; border-radius: 4px; background: rgba(255, 250, 240, .08); overflow: hidden; }
.qmeter-fill, .qmeter-fore { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.qmeter-fore { background: repeating-linear-gradient(-45deg, rgba(255, 250, 240, .16) 0 2px, transparent 2px 5px); }
.qmeter-fill { background: linear-gradient(90deg, #e0662a, #f5a36a); }
.qmeter-fill.is-anim { transition: width 760ms var(--ease-out); }
@keyframes qmeter-flash { 0%, 30% { color: #7fd8a9; } 100% { color: var(--side-ink); } }
.qmeter.is-flash .qmeter-won { animation: qmeter-flash 1400ms var(--ease-out); }

/* ── content column ──────────────────────────────── */
.frame {
  min-height: 100vh;
  margin-left: calc(var(--side-w) + var(--frame));
  padding: 0 var(--s2) 0 var(--s2);
}
.sheet { position: relative; min-width: 0; padding-bottom: var(--s10); }
.sheet:focus { outline: none; }
.page { display: flex; flex-direction: column; gap: var(--s5); min-width: 0; padding: 0 var(--gutter); }
.page-pad { padding: var(--s6) var(--gutter); }

/* 卡片（頁面的基本容器） */
.card {
  min-width: 0;
  border-radius: var(--r-panel);
  background: var(--sheet);
  box-shadow: var(--shadow-card);
}
.card-pad { padding: var(--s5) var(--s6); }
.card-head { display: flex; align-items: center; gap: var(--s3); min-height: 32px; margin-bottom: var(--s4); }
.card-title { font-size: var(--fs-16); font-weight: 650; }
.card-sub { font-size: var(--fs-13); color: var(--ink-3); }
.card-head .push, .card-head > :last-child:not(:first-child) { margin-left: auto; }

/* ── page header（畫布上的大標題） ─────────────── */
.ph-sentinel { height: 1px; margin-bottom: -1px; }
.ph {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: var(--s4);
  min-height: var(--header-h);
  padding: 22px var(--gutter) 14px;
  background: var(--bg);
  transition: box-shadow var(--dur-hover) var(--ease-out);
}
.ph.is-stuck { box-shadow: 0 1px 0 var(--line); }
.ph-main { display: flex; align-items: center; gap: var(--s3); flex: 1 1 auto; min-width: 0; }
.ph-titles { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ph-crumb {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  flex: none;
  border-radius: 12px;
  background: var(--sheet);
  box-shadow: var(--shadow-card);
  color: var(--ink-2);
}
.ph-crumb span { display: none; }
.ph-crumb:hover { color: var(--ink); background: var(--subtle); }
.ph-title { display: flex; align-items: baseline; gap: 10px; font-size: var(--fs-26); font-weight: 700; line-height: 1.2; color: var(--ink); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-count { font-size: var(--fs-16); font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ph-sub { font-size: var(--fs-13); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-global { display: flex; align-items: center; gap: 10px; flex: none; }
.ph-actions { display: flex; align-items: center; gap: var(--s2); }
.ph-search {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 300px;
  height: 42px;
  padding: 0 10px 0 14px;
  border-radius: 14px;
  background: var(--sheet);
  box-shadow: var(--shadow-card);
  color: var(--ink-3);
  font-size: var(--fs-13);
  transition: color var(--dur-hover) var(--ease-out);
}
.ph-search:hover { color: var(--ink-2); }
.ph-search-text { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-new { height: 42px; padding: 0 16px; border-radius: 14px; font-size: var(--fs-14); }
.ph--own-new .ph-new { display: none; }
.ph-actions .btn { height: 42px; padding: 0 16px; border-radius: 14px; font-size: var(--fs-14); }
.ph-user { display: none; place-items: center; width: 40px; height: 40px; border-radius: 50%; }

/* ── user menu ───────────────────────────────────── */
.pop--user { width: 272px; padding: 8px; }
.usermenu { display: flex; flex-direction: column; gap: 12px; }
.usermenu-who { display: flex; align-items: center; gap: 12px; padding: 8px 8px 0; }
.usermenu-name { font-weight: 650; font-size: var(--fs-14); }
.usermenu-sub { font-size: var(--fs-12); color: var(--ink-3); }
.usermenu-block { display: flex; flex-direction: column; gap: 8px; padding: 0 8px; }
.usermenu-block .seg { width: 100%; }
.usermenu-block .seg > button { flex: 1; }
.usermenu-label { font-size: var(--fs-12); color: var(--ink-3); }
.usermenu-list { display: flex; flex-direction: column; padding-top: 8px; box-shadow: 0 -1px 0 var(--line); }
.usermenu-note { font-size: var(--fs-12); color: var(--ink-3); padding: 0 8px 4px; }

/* ── shortcuts ───────────────────────────────────── */
.keys { display: flex; flex-direction: column; }
.keys-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s4); padding: 9px 0; }
.keys-row + .keys-row { box-shadow: 0 -1px 0 var(--line); }
.keys dt { font-size: var(--fs-13); color: var(--ink-2); }

/* ── palette ─────────────────────────────────────── */
.palette { display: flex; flex-direction: column; max-height: min(580px, 76vh); }
.palette-bar { display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s5); height: 60px; box-shadow: 0 1px 0 var(--line); }
.palette-ic { color: var(--ink-3); }
.palette-input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; font-size: var(--fs-16); color: var(--ink); }
.palette-input::placeholder { color: var(--ink-3); }
.palette-input:focus, .palette-input:focus-visible { outline: none; }
.palette-list { flex: 1; min-height: 0; overflow: auto; padding: 8px; overscroll-behavior: contain; }
.palette-group + .palette-group { margin-top: 6px; }
.palette-group-label { padding: 8px 12px 4px; font-size: var(--fs-12); color: var(--ink-3); }
.palette-item { display: flex; align-items: center; gap: var(--s3); min-height: 46px; padding: 4px 12px; border-radius: 12px; cursor: pointer; }
.palette-item[aria-selected="true"] { background: var(--accent-soft); }
.palette-lead { display: grid; place-items: center; width: 30px; flex: none; color: var(--ink-3); }
.palette-text { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; line-height: 1.35; }
.palette-label { font-size: var(--fs-14); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-sub { font-size: var(--fs-12); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-hint { font-size: var(--fs-12); color: var(--ink-3); flex: none; }
.palette-foot { display: flex; align-items: center; gap: 6px; padding: 12px var(--s5); font-size: var(--fs-12); color: var(--ink-3); box-shadow: 0 -1px 0 var(--line); background: var(--subtle); border-radius: 0 0 var(--r-sheet) var(--r-sheet); }
.palette-foot span:not(.kbd-group) { margin-right: var(--s2); }

/* ── placeholder pages ───────────────────────────── */
.placeholder-panel { display: grid; place-items: center; min-height: 420px; border-radius: var(--r-panel); background: var(--sheet); box-shadow: var(--shadow-card); }

/* ── tab bar (mobile) ────────────────────────────── */
.tabbar { display: none; }

@media (max-width: 1180px) {
  .ph-search { width: 42px; padding: 0; justify-content: center; }
  .ph-search-text, .ph-search .kbd-group { display: none; }
}
@media (max-width: 1080px) {
  :root { --side-w: 220px; }
}

@media (max-width: 760px) {
  .side { display: none; }
  .frame { margin-left: 0; padding: 0; }
  .sheet { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + var(--s8)); }
  .page { gap: var(--s4); }
  .ph { padding: 10px var(--gutter) 8px; gap: var(--s2); min-height: var(--header-h); }
  .ph-title { font-size: 22px; }
  .ph-count { font-size: var(--fs-14); }
  .ph-sub { display: none; }
  .ph-global { gap: 6px; }
  .ph-actions { display: none; }
  .ph--own-new .ph-new { display: inline-flex; }
  .ph-search, .ph-new { width: 40px; height: 40px; padding: 0; border-radius: 12px; justify-content: center; }
  .ph-new span { display: none; }
  .ph-new .ic { margin: 0; }
  .ph-user { display: grid; }
  .ph-crumb { width: 36px; height: 36px; }

  .tabbar {
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 30;
    display: block;
    height: var(--tabbar-h);
    padding: 0 6px;
    border-radius: 20px;
    background: var(--side-bg);
    box-shadow: 0 12px 28px -12px rgba(28, 20, 12, .5);
  }
  .tabbar-list { display: flex; height: 100%; }
  .tabbar-list li { flex: 1; min-width: 0; display: grid; place-items: center; }
  .tabbar-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    width: 100%;
    height: 50px;
    border-radius: 14px;
    color: var(--side-ink-3);
    font-size: var(--fs-11);
    font-weight: 500;
  }
  .tabbar-item[aria-current="page"] { background: var(--side-active); color: var(--side-active-ink); font-weight: 600; }
  .palette { max-height: calc(100vh - 32px); }
}

/* ── styles/pages/companies.css ── */
/* pages/companies · 公司清單與詳細頁（版面語彙跟聯絡人頁一致） */

/* ── 清單 ─────────────────────────────────────────── */
.co-card { overflow: visible; }
.co-viewbar { justify-content: space-between; padding-top: 16px; padding-bottom: 8px; }
.co-views { min-width: 0; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.co-views::-webkit-scrollbar { display: none; }
.co-views .tabs { flex-wrap: nowrap; }
.co-vtools { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.co-viewseg .seg { height: 38px; align-items: center; }
.co-bar { min-height: 56px; padding-top: 4px; padding-bottom: 14px; }
.co-filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
.co-fbtn .nb { margin-left: -4px; }
.co-fbtn .warmth { margin-left: -6px; height: 22px; }
.co-bar-end { display: flex; align-items: center; gap: 12px; margin-left: auto; }
.co-sortslot:empty { display: none; }
.co-sortdir { margin-left: 6px; font-weight: 500; color: var(--ink-3); }
.co-sortbtn.tbtn { background: none; }

.co-count { font-size: var(--fs-13); color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.co-indent { display: inline-block; width: 12px; flex: none; }
.pg-companies.is-cards .co-bar { padding-bottom: 12px; }

.co-num, .co-tnum { font-variant-numeric: tabular-nums; }

.co-people { display: inline-flex; align-items: center; gap: 10px; }
.co-stack { display: inline-flex; align-items: center; }

.co-stack.is-empty { display: none; }
.co-people-n { font-size: var(--fs-13); font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pg-companies .tbl tbody tr:hover .co-stack .nb { box-shadow: 0 0 0 2px var(--hover); }
.co-touch { display: inline-flex; align-items: center; gap: 8px; }
.co-touch .abars { height: 20px; gap: 3px; }
.co-touch .abars i { width: 4px; border-radius: 2px; }
.co-touch-n { min-width: 2ch; font-size: var(--fs-13); font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.co-rep { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); white-space: nowrap; }
.co-open { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 1.3; }
.co-open-amt { font-weight: 700; color: var(--ink); }
.co-open-n { font-size: var(--fs-12); color: var(--ink-3); }
.co-won { font-weight: 600; color: var(--ink-2); }
.co-none { color: var(--ink-4); }
.co-nowrap { white-space: nowrap; }
.co-empty { padding: var(--s6) 0; }

/* 卡片檢視 */
.co-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--s5); }
.co-grid > li { display: flex; min-width: 0; }
.co-grid-empty { grid-column: 1 / -1; }
.co-tile {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  min-width: 0;
  padding: 20px;
  border-radius: var(--r-panel);

}
.co-tile:hover { background: var(--hover); }

.co-tile:hover .co-stack .nb { box-shadow: 0 0 0 2px var(--hover); }
.co-tile:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.co-tile-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
.co-tile-titles { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; line-height: 1.3; }
.co-tile-name { font-size: var(--fs-16); font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.co-tile-sub { font-size: var(--fs-12); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.co-tile-status { align-self: flex-start; flex: none; }
.co-tile-figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 14px; border-radius: 14px; background: var(--subtle); transition: background-color var(--dur-hover) var(--ease-out); }
.co-fig { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.co-fig-k { font-size: var(--fs-12); font-weight: 600; color: var(--ink-3); }
.co-fig-v { font-size: 20px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; white-space: nowrap; }
.co-fig-s { font-size: var(--fs-12); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.co-tile-people { display: flex; align-items: center; gap: 10px; min-width: 0; }
.co-tile-pn { flex: 1; min-width: 0; font-size: var(--fs-13); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.co-tile-bars { height: 20px; gap: 3px; flex: none; }
.co-tile-bars i { width: 4px; border-radius: 2px; }
.co-tile-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }

@media (max-width: 1280px) {
  .co-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}
@media (max-width: 1100px) {
  .co-viewbar { flex-wrap: wrap; }
}
@media (max-width: 960px) {

}
@media (max-width: 760px) {
  .co-stats { gap: 10px; }
  .co-stats .stat { padding: 14px 14px 12px; }
  .co-stats .stat-value { font-size: 24px; }
  .co-stats .stat-ic { width: 32px; height: 32px; border-radius: 10px; }
  .co-stats .stat-foot .spark { display: none; }
  .co-viewbar { flex-direction: column-reverse; flex-wrap: nowrap; align-items: stretch; gap: 10px; padding: 14px 14px 6px; }
  .co-views { margin: 0 -14px; padding: 2px 14px; }
  .co-vtools { margin-left: 0; }
  .co-search { flex: 1 1 0; min-width: 0; }
  .co-viewseg .seg { height: 36px; }
  .co-viewseg .seg > button { padding: 0 10px; }
  .co-viewseg .seg > button span { display: none; }
  .co-bar { padding: 4px 14px 12px; flex-wrap: wrap; }
  .co-filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px; flex: 0 0 calc(100% + 28px); width: calc(100% + 28px); }
  .co-filters::-webkit-scrollbar { display: none; }
  .co-bar-end { margin-left: 0; width: 100%; justify-content: space-between; }
  .co-sortslot:empty + .co-count { margin-left: 0; }
  .pg-companies .tbl tbody tr { padding-left: 14px; padding-right: 14px; }
  .pg-companies .tbl td[data-m="meta"] { display: inline-flex; }
  .pg-companies .tbl td.co-col-people { padding-left: 48px; }
  .pg-companies .tbl td.co-col-people .co-stack { display: none; }
  .pg-companies .tbl td.co-col-people .co-people-n::after { content: "聯絡人"; margin-left: 2px; font-weight: 500; color: var(--ink-3); }
  .co-grid { grid-template-columns: minmax(0, 1fr); gap: var(--s4); }
  .co-tile { padding: 16px; gap: 14px; }
}

/* ── 詳細頁：頁首 ─────────────────────────────────── */
.co-hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "id side" "acts side";
  gap: var(--s4) var(--s8);
  padding: var(--s6);
}
.co-hero-id { grid-area: id; display: flex; align-items: center; gap: var(--s5); min-width: 0; }
.co-hero-cm { box-shadow: 0 0 0 4px var(--sheet), 0 0 0 5px var(--line); }
.co-hero-text { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.co-name { font-size: 26px; font-weight: 700; letter-spacing: .01em; line-height: 1.2; }
.co-role { font-size: var(--fs-14); color: var(--ink-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.co-dot { color: var(--ink-4); }
.co-facts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.co-fact { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 3px; border-radius: var(--r-pill); background: var(--inset); font-size: var(--fs-12); font-weight: 600; color: var(--ink-2); }
.co-status { cursor: pointer; gap: 5px; padding-right: 7px; transition: box-shadow var(--dur-hover) var(--ease-out); }
.co-status:hover { box-shadow: inset 0 0 0 1px currentColor; }
.co-status .ic { opacity: .8; }
.co-meta { display: flex; align-items: baseline; gap: 6px 20px; flex-wrap: wrap; margin-top: 8px; font-size: var(--fs-13); }
.co-meta > div { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.co-meta dt { color: var(--ink-3); }
.co-meta dd { color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.co-hero-acts { grid-area: acts; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-left: 92px; }

.co-hero-side {
  grid-area: side;
  align-self: stretch;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: var(--s3);
  min-width: 340px;
  padding: 18px 20px;
  border-radius: 16px;
  background: var(--accent-soft);
  color: var(--ink);
}
.co-months { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
.co-month { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.co-month-l { font-size: var(--fs-12); font-weight: 600; color: var(--ink-3); }
.co-month.is-current .co-month-l { color: var(--accent-strong); }
.co-month .tally { min-height: 24px; flex-wrap: wrap; row-gap: 4px; color: var(--ink-2); }
.co-month.is-current .tally { color: var(--ink); }
.co-hero-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding-top: 12px; box-shadow: inset 0 1px 0 color-mix(in srgb, var(--accent) 22%, transparent); }
.co-hero-sum { display: flex; align-items: baseline; gap: 6px; font-size: var(--fs-12); color: var(--ink-2); }
.co-hero-sum b { font-size: 22px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.co-hero-warm { display: flex; align-items: center; gap: 8px; }
.co-hero-warm .warmth { background: var(--sheet); }

/* ── 詳細頁：分頁卡 ───────────────────────────────── */
.co-body { overflow: hidden; }
.co-tabbar { padding: 0 var(--s6); box-shadow: inset 0 -1px 0 var(--line); }
.co-tabs.tabs--line { box-shadow: none; }
.co-tabs.tabs--line > button { height: 56px; font-size: var(--fs-14); }
.co-panel { padding: var(--s6); min-height: 280px; }

.co-sec { display: flex; flex-direction: column; min-width: 0; }
.co-sec-h { display: flex; align-items: center; gap: 8px; min-height: 30px; margin-bottom: 12px; }
.co-sec-t { font-size: var(--fs-16); font-weight: 650; }
.co-sec-n { height: 22px; padding: 0 8px; border-radius: var(--r-pill); background: var(--inset); font-size: var(--fs-12); font-weight: 700; line-height: 22px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.co-sec-note { margin-left: auto; font-size: var(--fs-13); color: var(--ink-3); }
.co-sec-note b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.co-sec-add { margin-left: auto; margin-right: -6px; background: var(--inset); }
.co-sec-btn { margin-left: auto; }
.co-sec-more { display: inline-flex; align-items: center; gap: 2px; margin-left: auto; font-size: var(--fs-13); font-weight: 600; color: var(--accent-strong); }
.co-sec-more:hover { color: var(--accent); }
.co-sec > .co-sec-more { margin: 10px 0 0; align-self: flex-start; }
.co-side-empty { font-size: var(--fs-13); color: var(--ink-3); padding: 2px 0 4px; }

/* 概覽 */
.co-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s3); margin-bottom: var(--s6); }
.co-kpi { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 14px 16px; border-radius: 14px; background: var(--subtle); }
.co-kpi-k { font-size: var(--fs-13); font-weight: 600; color: var(--ink-2); }
.co-kpi-v { font-size: 24px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
.co-kpi-v small { font-size: var(--fs-14); font-weight: 600; color: var(--ink-3); }
.co-kpi-s { font-size: var(--fs-12); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.co-ov { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--s8); align-items: start; }
.co-ov-main, .co-ov-side { display: flex; flex-direction: column; gap: var(--s8); min-width: 0; }

/* 近四季成交（單一數列：墨色柱、4px 圓頂、底線對齊） */
.co-bars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s4); padding: 4px 0 0; }
.co-bar { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.co-bar-plot { position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; width: 100%; height: 168px; box-shadow: inset 0 -2px 0 var(--line-strong); }
.co-bar-plot i { display: block; width: min(56px, 60%); border-radius: 4px 4px 0 0; background: var(--ink-2); transition: background-color var(--dur-hover) var(--ease-out); }
.co-bar:hover .co-bar-plot i { background: var(--ink); }
.co-bar-v { margin-bottom: 6px; font-size: var(--fs-13); font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.co-bar-k { display: flex; align-items: baseline; gap: 4px; margin-top: 8px; font-size: var(--fs-12); color: var(--ink-3); }
.co-bar-k b { font-weight: 650; color: var(--ink-2); }
.co-rev-empty { border-radius: 14px; background: var(--subtle); }

/* 任務、交易小清單 */
.co-task-list, .co-mdeals { display: flex; flex-direction: column; gap: 8px; }
.co-task { display: flex; align-items: flex-start; gap: 12px; padding: 4px 0; }
.co-task .check { margin-top: 2px; }
.co-task-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: var(--fs-14); }
.co-task-title { display: flex; align-items: center; gap: 4px; }
.co-task-hi { color: var(--accent); display: inline-grid; }
.co-task-meta { display: flex; align-items: center; gap: 8px; font-size: var(--fs-12); color: var(--ink-3); }
.co-task-meta .due { color: var(--ink-3); }
.co-task-meta .due.is-overdue { color: var(--accent); }
.co-task-meta .due.is-today { color: var(--ochre); }
.co-mdeal { display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 12px 14px; border-radius: 14px; background: var(--subtle); text-align: left; transition: background-color var(--dur-hover) var(--ease-out); }
.co-mdeal:hover { background: var(--inset); }
.co-mdeal-top { display: flex; align-items: baseline; gap: 8px; }
.co-mdeal-name { flex: 1; min-width: 0; font-size: var(--fs-14); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.co-mdeal-amt { font-size: var(--fs-14); font-weight: 700; }
.co-mdeal-bot { display: flex; align-items: center; gap: 10px; }
.co-mdeal-bot .stage-tag { font-size: var(--fs-12); font-weight: 600; }
.co-mdeal-code { margin-left: auto; font-family: var(--font-mono); font-size: var(--fs-11); color: var(--ink-3); }

/* 往來時間軸（與聯絡人詳細頁同一套） */
.co-tl-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; margin-bottom: var(--s4); }
.co-tl-tabs > button { height: 30px; padding: 0 12px; font-size: var(--fs-13); }
.co-day + .co-day { margin-top: var(--s5); }
.co-day-h { display: inline-flex; height: 24px; align-items: center; padding: 0 10px; margin: 0 0 6px 42px; border-radius: var(--r-pill); background: var(--inset); font-size: var(--fs-12); font-weight: 600; color: var(--ink-2); }
.co-evs { position: relative; }
.co-evs::before { content: ""; position: absolute; left: 15px; top: 18px; bottom: 18px; width: 2px; border-radius: 1px; background: var(--line); }
.co-ev { position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 14px; padding: 8px 0; }
.co-ev-ic { position: relative; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--t-bg, var(--inset)); color: var(--t-fg, var(--ink-2)); box-shadow: 0 0 0 4px var(--sheet); }
.co-ev-ic .ic { width: 16px; height: 16px; }
.co-ev[data-type="call"] .co-ev-ic { --t-bg: var(--peach-bg); --t-fg: var(--peach); }
.co-ev[data-type="email"] .co-ev-ic { --t-bg: var(--sky-bg); --t-fg: var(--sky); }
.co-ev[data-type="meeting"] .co-ev-ic { --t-bg: var(--lilac-bg); --t-fg: var(--lilac); }
.co-ev[data-type="note"] .co-ev-ic { --t-bg: var(--lemon-bg); --t-fg: var(--lemon); }
.co-ev[data-type="task"] .co-ev-ic { --t-bg: var(--mint-bg); --t-fg: var(--mint); }
.co-ev-main { min-width: 0; padding: 12px 16px; border-radius: 14px; background: var(--subtle); }
.co-ev-head { display: flex; align-items: baseline; gap: 8px; font-size: var(--fs-14); }
.co-ev-type { font-weight: 650; }
.co-ev-meta { color: var(--ink-3); font-size: var(--fs-12); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.co-ev-time { margin-left: auto; flex: none; color: var(--ink-3); font-size: var(--fs-12); font-variant-numeric: tabular-nums; }
.co-ev-subj { margin-top: 4px; font-weight: 600; font-size: var(--fs-14); }
.co-ev-text { margin-top: 4px; font-size: var(--fs-14); color: var(--ink-2); line-height: 1.6; max-width: 70ch; }
.co-ev-stage { display: flex; align-items: center; gap: 8px; color: var(--ink-3); }
.co-ev-foot { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: var(--fs-12); color: var(--ink-3); flex-wrap: wrap; }
.co-ev-foot:empty { display: none; }
.co-ev-who { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink-2); }
.co-ev-who:hover { color: var(--ink); }
.co-ev-deal { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: var(--r-pill); color: var(--ink-2); background: var(--sheet); font-size: var(--fs-12); font-weight: 600; min-width: 0; max-width: 100%; }
.co-ev-deal span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.co-ev-deal:hover { color: var(--accent-strong); }
.co-evs--compact .co-ev-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.co-more { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s3); padding-left: 46px; }

/* 組織圖：由上而下，圓角接點 */
.co-org-scroll { overflow-x: auto; margin: 0 calc(-1 * var(--s6)); padding: 8px var(--s6) 4px; scrollbar-width: thin; }
.co-tree { display: flex; justify-content: center; gap: var(--s8); min-width: max-content; }
.co-tree ul { position: relative; display: flex; justify-content: center; padding-top: 24px; }
.co-tree li { position: relative; display: flex; flex-direction: column; align-items: center; padding: 24px 8px 0; }
.co-tree li::before, .co-tree li::after { content: ""; position: absolute; top: 0; width: 50%; height: 24px; border-top: 2px solid var(--line-strong); }
.co-tree li::before { right: calc(50% - 1px); }
.co-tree li::after { left: calc(50% - 1px); border-left: 2px solid var(--line-strong); }
.co-tree li:first-child::before, .co-tree li:last-child::after { border: 0; }
.co-tree li:last-child::before { border-right: 2px solid var(--line-strong); border-radius: 0 12px 0 0; }
.co-tree li:first-child::after { border-radius: 12px 0 0 0; }
.co-tree li:only-child::before { display: none; }
.co-tree li:only-child::after { border-top: 0; border-radius: 0; }
.co-tree ul ul::before { content: ""; position: absolute; top: 0; left: calc(50% - 1px); height: 24px; border-left: 2px solid var(--line-strong); }
.co-tree > .co-tree-root { padding-top: 0; }
.co-tree > .co-tree-root > li { padding-top: 0; }
.co-tree > .co-tree-root > li::before, .co-tree > .co-tree-root > li::after { display: none; }

.co-node {
  position: relative;
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  width: 224px;
  padding: 10px 12px 10px 10px;
  border-radius: 14px;
  background: var(--sheet);
  box-shadow: inset 0 0 0 1px var(--line-strong);
  color: var(--ink);
  transition: background-color var(--dur-hover) var(--ease-out), box-shadow var(--dur-hover) var(--ease-out);
}
.co-node:hover { background: var(--hover); }
.co-node:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.co-node.is-decider { background: var(--subtle); box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.co-node.is-decider:hover { background: var(--hover); }
.co-node-text { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.co-node-name { font-size: var(--fs-14); font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.co-node-title { font-size: var(--fs-12); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.co-node-w { height: 22px; padding: 0 7px; }

/* ── styles/pages/contacts.css ── */

/* ── 詳細頁 ───────────────────────────────────────── */
.ct-hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "id side" "acts side";
  gap: var(--s4) var(--s8);
  padding: var(--s6);
}
.ct-hero-id { grid-area: id; display: flex; align-items: center; gap: var(--s5); min-width: 0; }
.ct-hero-nb { box-shadow: 0 0 0 4px var(--sheet), 0 0 0 5px var(--line); }
.ct-hero-text { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ct-name { font-size: 26px; font-weight: 700; letter-spacing: .01em; line-height: 1.2; }
.ct-role { font-size: var(--fs-14); color: var(--ink-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ct-role a { color: var(--ink); font-weight: 600; }
.ct-role a:hover { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.ct-dot { color: var(--ink-4); }
.ct-facts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.ct-fact { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 3px; border-radius: var(--r-pill); background: var(--inset); font-size: var(--fs-12); font-weight: 600; color: var(--ink-2); }
.ct-hero-acts { grid-area: acts; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-left: 92px; }

.ct-hero-side {
  grid-area: side;
  align-self: stretch;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: var(--s3);
  min-width: 340px;
  padding: 18px 20px;
  border-radius: 16px;
  background: var(--accent-soft);
  color: var(--ink);
}
.ct-months { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
.ct-month { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ct-month-l { font-size: var(--fs-12); font-weight: 600; color: var(--ink-3); }
.ct-month.is-current .ct-month-l { color: var(--accent-strong); }
.ct-month .tally { min-height: 24px; flex-wrap: wrap; row-gap: 4px; color: var(--ink-2); }
.ct-month.is-current .tally { color: var(--ink); }
.ct-hero-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding-top: 12px; box-shadow: inset 0 1px 0 color-mix(in srgb, var(--accent) 22%, transparent); }
.ct-hero-sum { display: flex; align-items: baseline; gap: 6px; font-size: var(--fs-12); color: var(--ink-2); }
.ct-hero-sum b { font-size: 22px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.ct-hero-warm { display: flex; align-items: center; gap: 8px; }
.ct-hero-warm .warmth { background: var(--sheet); }

.ct-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: var(--s5); align-items: start; }
.ct-main { display: flex; flex-direction: column; gap: var(--s5); min-width: 0; }
.ct-side { display: flex; flex-direction: column; gap: var(--s5); min-width: 0; }

/* 記一筆 */
.ct-compose { overflow: hidden; }
.ct-compose-form { display: flex; flex-direction: column; }
.ct-compose-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); padding: 16px 16px 12px 24px; }
.ct-compose-head .section-title { font-size: var(--fs-16); font-weight: 650; }

.ct-c-subject { margin-bottom: 8px !important; font-weight: 500; }
.ct-c-body { min-height: 96px; padding: 12px 14px; resize: none; font-size: var(--fs-14); }
.ct-compose-row { display: flex; align-items: center; gap: var(--s2); padding: 12px 16px 16px 24px; flex-wrap: wrap; }

.ct-compose-form[data-type="email"] .only-email { display: block; }

.ct-tl { padding: 20px 24px 24px; }

.ct-tl-head .section-title { font-size: var(--fs-16); font-weight: 650; }
.ct-tl-tabs > button { height: 30px; padding: 0 12px; font-size: var(--fs-13); }

.ct-day-h { display: inline-flex; height: 24px; align-items: center; padding: 0 10px; margin: 0 0 6px 42px; border-radius: var(--r-pill); background: var(--inset); font-size: var(--fs-12); font-weight: 600; color: var(--ink-2); }
.ct-evs { position: relative; }

.ct-more { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s3); padding-left: 46px; }

/* 側欄卡 */

/* ── styles/pages/tasks.css ── */

/* ── 快速新增 ─────────────────────────────────────── */

.tk-qa-go { flex: none; }

.tk-gsub { font-size: var(--fs-13); color: var(--ink-2); font-variant-numeric: tabular-nums; }
summary.tk-ghead { cursor: pointer; list-style: none; user-select: none; -webkit-user-select: none; }

summary.tk-ghead:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.tk-gtoggle { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px; border-radius: 9px; font-size: var(--fs-13); font-weight: 600; color: var(--ink-2); transition: background-color var(--dur-hover) var(--ease-out); }

.tk-check { display: grid; place-items: center; width: 28px; height: 28px; margin: -2px; border-radius: 50%; flex: none; }
.tk-check:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; }
.tk-check-svg { display: block; overflow: visible; }
.tk-check-ring { fill: transparent; stroke: var(--ink-4); stroke-width: 1.6; transition: fill var(--dur-hover) var(--ease-out), stroke var(--dur-hover) var(--ease-out); }
.tk-check-mark { fill: none; stroke: var(--pine); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset var(--dur-enter) var(--ease-out); }
[data-pri="high"] > .tk-check .tk-check-ring, [data-pri="high"] .tk-wtop .tk-check-ring { stroke: var(--rose); }

.is-settling .tk-check-svg { animation: tk-pop 420ms var(--ease-out); }

@keyframes tk-pop { 0% { transform: scale(.78); } 55% { transform: scale(1.14); } 100% { transform: scale(1); } }

.tk-main { min-width: 0; }
.tk-title { display: block; max-width: 100%; padding: 2px 0; text-align: left; color: var(--ink); font-size: var(--fs-14); font-weight: 600; line-height: 1.45; border-radius: 6px; }
.tk-title-t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: transparent; transition: color var(--dur-enter) var(--ease-out), text-decoration-color var(--dur-enter) var(--ease-out); }

.tk-mmeta { display: none; }

.tk-link { min-width: 0; }
.tk-rec { display: inline-flex; align-items: center; gap: 10px; min-width: 0; max-width: 100%; margin-left: -6px; padding: 4px 10px 4px 6px; border-radius: 12px; color: var(--ink); transition: background-color var(--dur-hover) var(--ease-out); }

.tk-flag { display: grid; place-items: center; width: 20px; height: 20px; }
