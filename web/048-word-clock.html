<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>字鐘 · 用一百一十個字報時</title>
<meta name="description" content="11×10 中文字格精確報時到分，還會提醒「該喝茶了」。收錄於 100 Creative HTML Works（048・文字時鐘）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/web/048-word-clock.html">
<style>
:root{
  --light:"Microsoft JhengHei Light","Microsoft JhengHei UI Light","Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
  --warm:#fff1d6; --glow:rgba(255,196,120,.55); --off:#27231f; --bg:#080706;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:#8a8074;font-family:var(--light);font-weight:300;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(16px,3vw,40px) 16px;
  background-image:radial-gradient(circle at 50% 46%,rgba(255,190,110,.10),transparent 55%)}
.face{position:relative;width:min(86vmin,640px);aspect-ratio:1;padding:clamp(18px,4.2vmin,40px);border-radius:6px;
  background:linear-gradient(145deg,#141210,#0b0a09 60%);box-shadow:0 0 0 1px #1c1a17,0 40px 80px -30px #000,inset 0 1px 0 rgba(255,255,255,.04);cursor:pointer}
@media (max-width:520px){.face{width:100%}}
.grid{display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(10,1fr);width:100%;height:100%;user-select:none}
.c{display:grid;place-items:center;font-size:clamp(17px,4.1vmin,38px);color:var(--off);transition:color 1.1s ease,text-shadow 1.1s ease;line-height:1}
.c.on{color:var(--warm);text-shadow:0 0 10px var(--glow),0 0 26px rgba(255,170,90,.28)}
.c.egg{color:#ffd9a0;text-shadow:0 0 12px rgba(255,200,120,.7)}
.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--off);transition:background .8s,box-shadow .8s}
.dot.on{background:var(--warm);box-shadow:0 0 8px var(--glow)}
.d0{left:12px;top:12px}.d1{right:12px;top:12px}.d2{right:12px;bottom:12px}.d3{left:12px;bottom:12px}
.say{margin:clamp(18px,3vw,28px) 0 6px;font-size:clamp(16px,2.2vw,20px);color:#c9bba6;letter-spacing:.2em;text-align:center;min-height:1.6em;line-height:1.6}
.sub{font-size:13px;color:#6f665c;letter-spacing:.14em;text-align:center}
.ctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:center;margin-top:18px;width:min(640px,100%)}
.ctl input[type=range]{flex:1 1 220px;accent-color:#e8b77a;min-height:40px}
.btn{min-height:42px;padding:0 18px;border-radius:21px;border:1px solid #3a342d;background:#12100e;color:#d8c9b2;font-family:var(--light);font-size:15px;letter-spacing:.15em;cursor:pointer;transition:border-color .3s,color .3s}
.btn:hover,.btn:focus-visible{border-color:#e8b77a;color:#fff1d6;outline:none}
.btn[aria-pressed="true"]{border-color:#e8b77a;color:#fff1d6;box-shadow:0 0 12px rgba(232,183,122,.25)}
.tm{font-variant-numeric:tabular-nums;font-size:15px;color:#b8a992;min-width:5.5em;text-align:center;letter-spacing:.1em}
.foot{margin-top:22px;font-size:12px;color:#5a534b;letter-spacing:.12em;text-align:center;line-height:1.7}
@media (prefers-reduced-motion:reduce){.c,.dot{transition:none}}
</style>
</head>
<body>
<div class="face" id="face" role="img" aria-label="字鐘">
  <div class="grid" id="grid"></div>
  <i class="dot d0"></i><i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i>
</div>
<div class="say" id="say" aria-live="polite"></div>
<div class="sub">四角的小點是秒：每十五秒亮一顆 · 點鐘面看彩蛋</div>
<div class="ctl">
  <button class="btn" id="liveBtn" type="button" aria-pressed="true">現在</button>
  <input type="range" id="scrub" min="0" max="1439" step="1" aria-label="撥動時間">
  <span class="tm" id="tm">00:00</span>
  <button class="btn" id="eggBtn" type="button">光陰</button>
</div>
<p class="foot">一百一十個字，每分鐘只亮其中十幾個。<br>拖動滑桿撥時間 · 鍵盤 ← → 一分鐘、Shift 一小時 · 空白鍵回到現在</p>

<script>
(function(){
  'use strict';
  var ROWS = [
    '今天星期一二三四五六日',
    '現在是凌晨清晨上午中午',
    '下午傍晚晚上歲月靜好也',
    '十一兩二三四五六七八九',
    '點整半零二三四五十慢慢',
    '一二三四五六七八九分來',
    '該起床吃飯喝茶睡覺了吧',
    '一寸光陰一寸金春夏秋冬',
    '寸金難買寸光陰日月星辰',
    '晴雨風雪早安午安晚安喔'
  ];
  var grid = document.getElementById('grid'); if(!grid) return;
  var cells = [];
  ROWS.forEach(function(r, y){ Array.from(r).forEach(function(ch, x){ var s = document.createElement('span'); s.className = 'c'; s.textContent = ch; s.setAttribute('aria-hidden', 'true'); grid.appendChild(s); cells.push(s); }); });
  var W = 11;
  function at(r, c){ return r * W + c; }
  function find(ch, from, rowLimit){ for(var i = from; i < cells.length; i++){ if(rowLimit !== undefined && Math.floor(i / W) !== rowLimit) continue; if(cells[i].textContent === ch) return i; } return -1; }
  var NUM = '零一二三四五六七八九';
  var DOW = '日一二三四五六';

  function compose(d){
    var on = [], text = '';
    var h = d.getHours(), m = d.getMinutes(), dow = d.getDay(), mon = d.getMonth() + 1;
    // 今天星期X
    [0, 1, 2, 3].forEach(function(c){ on.push(at(0, c)); });
    on.push(find(DOW[dow], at(0, 4), 0));
    text += '今天星期' + DOW[dow] + '，';
    // 現在是 + period
    on.push(at(1, 0), at(1, 1), at(1, 2));
    var P = h < 5 ? ['凌晨', [at(1, 3), at(1, 4)]] : h < 8 ? ['清晨', [at(1, 5), at(1, 6)]] : h < 12 ? ['上午', [at(1, 7), at(1, 8)]] : h < 13 ? ['中午', [at(1, 9), at(1, 10)]] : h < 17 ? ['下午', [at(2, 0), at(2, 1)]] : h < 19 ? ['傍晚', [at(2, 2), at(2, 3)]] : ['晚上', [at(2, 4), at(2, 5)]];
    on = on.concat(P[1]); text += '現在是' + P[0];
    // hour
    var h12 = h % 12 || 12, hs = '';
    if(h12 === 2){ on.push(at(3, 2)); hs = '兩'; }
    else if(h12 < 10){ on.push(h12 === 1 ? at(3, 1) : find(NUM[h12], at(3, 3), 3)); hs = NUM[h12]; }
    else { on.push(at(3, 0)); hs = '十'; if(h12 === 11){ on.push(at(3, 1)); hs += '一'; } if(h12 === 12){ on.push(at(3, 3)); hs += '二'; } }
    on.push(at(4, 0)); text += hs + '點';
    // minutes
    if(m === 0){ on.push(at(4, 1)); text += '整'; }
    else if(m === 30){ on.push(at(4, 2)); text += '半'; }
    else {
      var t = Math.floor(m / 10), u = m % 10, ms = '';
      if(t === 0){ on.push(at(4, 3)); ms = '零'; }
      else { if(t > 1){ on.push(find(NUM[t], at(4, 4), 4)); ms += NUM[t]; } on.push(at(4, 8)); ms += '十'; }
      if(u){ on.push(at(5, u - 1)); ms += NUM[u]; }
      on.push(at(5, 9)); text += ms + '分';
    }
    text += '。';
    // nudge
    var N = null;
    if(h === 7) N = ['起床', [1, 2]]; else if(h === 12 || h === 18) N = ['吃飯', [3, 4]]; else if(h === 15) N = ['喝茶', [5, 6]]; else if(h >= 23 || h < 2) N = ['睡覺', [7, 8]];
    if(N){ on.push(at(6, 0)); N[1].forEach(function(c){ on.push(at(6, c)); }); on.push(at(6, 9)); text += '該' + N[0] + '了。'; }
    // season
    var si = mon >= 3 && mon <= 5 ? 0 : mon <= 8 && mon >= 6 ? 1 : mon >= 9 && mon <= 11 ? 2 : 3;
    on.push(at(7, 7 + si)); text += '春夏秋冬'[si] + '天，';
    // greeting
    var G = h >= 5 && h < 12 ? ['早安', [4, 5]] : h >= 12 && h < 18 ? ['午安', [6, 7]] : ['晚安', [8, 9]];
    G[1].forEach(function(c){ on.push(at(9, c)); }); text += G[0] + '。';
    return { on:on.filter(function(i){ return i >= 0; }), text:text };
  }

  var first = true, lit = {}, say = document.getElementById('say'), egg = false, eggTimer = null;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function apply(set, text){
    var next = {}; set.forEach(function(i){ next[i] = true; });
    // fade out first
    Object.keys(lit).forEach(function(k){ if(!next[k]){ cells[k].style.transitionDelay = '0s'; cells[k].classList.remove('on'); } });
    var order = set.slice().sort(function(a, b){ return a - b; }), n = 0;
    order.forEach(function(i){
      if(!lit[i]){ cells[i].style.transitionDelay = reduce ? '0s' : (first ? .1 + n * .035 : .35 + n * .06).toFixed(2) + 's'; n++; cells[i].classList.add('on'); }
    });
    lit = next; first = false;
    if(say && text) say.textContent = text;
    var face = document.getElementById('face'); if(face && text) face.setAttribute('aria-label', '字鐘：' + text);
  }

  var live = true, simMin = 0, lastKey = '';
  var scrub = document.getElementById('scrub'), tm = document.getElementById('tm'), liveBtn = document.getElementById('liveBtn');
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function currentDate(){
    var d = new Date();
    if(!live){ d.setHours(Math.floor(simMin / 60), simMin % 60, live ? d.getSeconds() : 0, 0); }
    return d;
  }
  function render(force){
    if(egg) return;
    var d = currentDate(), key = d.getDay() + '-' + d.getHours() + '-' + d.getMinutes();
    if(tm) tm.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
    if(scrub && live) scrub.value = d.getHours() * 60 + d.getMinutes();
    if(key !== lastKey || force){ lastKey = key; var c = compose(d); apply(c.on, c.text); }
    var s = live ? new Date().getSeconds() : 0;
    document.querySelectorAll('.dot').forEach(function(dt, i){ dt.classList.toggle('on', live && s >= i * 15); });
  }
  function setLive(v){
    live = v; if(liveBtn) liveBtn.setAttribute('aria-pressed', v ? 'true' : 'false');
    if(v){ lastKey = ''; }
    render(true);
  }
  if(scrub){
    scrub.addEventListener('input', function(){ simMin = +scrub.value; live = false; if(liveBtn) liveBtn.setAttribute('aria-pressed', 'false'); render(false); });
  }
  if(liveBtn) liveBtn.addEventListener('click', function(){ setLive(true); });
  function showEgg(){
    if(egg) return; egg = true;
    Object.keys(lit).forEach(function(k){ cells[k].style.transitionDelay = '0s'; cells[k].classList.remove('on'); });
    lit = {};
    var ids = []; for(var c = 0; c < 7; c++){ ids.push(at(7, c)); } for(c = 0; c < 7; c++){ ids.push(at(8, c)); }
    ids.forEach(function(i, n){ cells[i].style.transitionDelay = (.3 + n * .09) + 's'; cells[i].classList.add('egg'); });
    if(say) say.textContent = '一寸光陰一寸金，寸金難買寸光陰。';
    clearTimeout(eggTimer);
    eggTimer = setTimeout(function(){ ids.forEach(function(i){ cells[i].style.transitionDelay = '0s'; cells[i].classList.remove('egg'); }); egg = false; lastKey = ''; setTimeout(function(){ render(true); }, 500); }, 4200);
  }
  var face = document.getElementById('face'); if(face) face.addEventListener('click', showEgg);
  var eb = document.getElementById('eggBtn'); if(eb) eb.addEventListener('click', showEgg);
  document.addEventListener('keydown', function(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.target && e.target.tagName === 'INPUT' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) return;
    if(e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'ArrowDown'){
      e.preventDefault();
      if(live){ var d = new Date(); simMin = d.getHours() * 60 + d.getMinutes(); live = false; if(liveBtn) liveBtn.setAttribute('aria-pressed', 'false'); }
      var step = (e.shiftKey ? 60 : 1) * (e.key === 'ArrowRight' || e.key === 'ArrowUp' ? 1 : -1);
      simMin = (simMin + step + 1440) % 1440; if(scrub) scrub.value = simMin; render(false);
    } else if(e.key === ' ' && !(e.target && e.target.tagName === 'BUTTON')){ e.preventDefault(); setLive(true); }
  });
  render(true);
  setInterval(function(){ if(!document.hidden) render(false); }, 1000);
})();
</script>
</body>
</html>
