<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>港上疊樓 · HARBOUR STACK</title>
<link rel="icon" href="../favicon.svg">
<meta name="description" content="港上疊樓：一棟蓋在海上樁柱之間、越加越高的小樓。全程式建模的 Three.js 立體場景，水面有真實倒影，黃昏、白日、落雨、深夜四種天候，可環繞、上岸走甲板或駕船出海。">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
<style>
:root{
  --mist:rgba(224,234,232,.9);--mist-2:rgba(224,234,232,.66);--ink:#183a3b;--ink-2:#3c5f60;--dim:#6f8d8d;
  --sea:#2b5356;--kai:"Kaiti TC","BiauKai","DFKai-SB","Noto Serif TC","Songti TC",serif;
  --ease-out:cubic-bezier(.2,.7,.2,1);--dur-hover:.18s;--dur-press:.1s;--dur-enter:.5s;--dur-exit:.3s;
  --cut:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--sea);color:var(--ink);font:14px/1.6 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
#gl.dragging{cursor:grabbing}
body.walk #gl,body.boat #gl{cursor:crosshair}

/* 霧灰色斜角面板：右上與左下切一刀 */
.panel{background:var(--mist);color:var(--ink);
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.ui{position:fixed;z-index:5;transition:opacity var(--dur-exit) var(--ease-out),transform var(--dur-exit) var(--ease-out)}
body.frame .ui{opacity:0;pointer-events:none;transform:translateY(6px)}

.brand{top:22px;left:22px;padding:14px 26px 14px 20px;display:flex;flex-direction:column;gap:2px}
.brand h1{margin:0;font:400 27px/1.15 var(--kai);letter-spacing:.14em;color:var(--ink)}
.brand p{margin:0;font-size:11px;letter-spacing:.06em;color:var(--ink-2)}
.brand p b{font-weight:600;letter-spacing:.16em;color:var(--ink)}

.tools{top:22px;right:22px;display:flex;padding:6px 8px 6px 14px;gap:2px}
.tools button{font:inherit;font-size:13px;letter-spacing:.08em;color:var(--ink-2);background:none;border:0;padding:8px 12px;cursor:pointer;border-radius:3px;
  transition:color var(--dur-hover) var(--ease-out),background-color var(--dur-hover) var(--ease-out)}
.tools button:hover{color:var(--ink);background:rgba(24,58,59,.08)}
.tools button[aria-pressed="true"]{color:#e3ecea;background:var(--ink)}
.tools button:focus-visible,.gauge button:focus-visible,.modes button:focus-visible,.views button:focus-visible,.nav button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

/* 天候：右側潮位尺 */
.gauge{right:22px;top:50%;transform:translateY(-50%);padding:18px 18px 18px 22px;display:flex;flex-direction:column;gap:4px;width:118px}
.gauge .lab{font-size:10px;letter-spacing:.3em;color:var(--dim);margin:0 0 6px 8px}
.gauge button{position:relative;display:flex;align-items:center;justify-content:space-between;width:100%;font:inherit;font-size:14px;letter-spacing:.14em;color:var(--ink-2);background:none;border:0;padding:8px 6px 8px 10px;cursor:pointer;text-align:left;
  transition:color var(--dur-hover) var(--ease-out)}
.gauge button small{font-size:10px;letter-spacing:.08em;color:var(--dim);font-variant-numeric:tabular-nums}
.gauge button:hover{color:var(--ink)}
.gauge button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.gauge .rail{position:absolute;left:0;top:0;bottom:0;width:4px}
.gauge .rail i{position:absolute;left:0;width:4px;height:36px;background:var(--ink);border-radius:2px;top:var(--y,0);transition:top .45s var(--ease-out)}
.gauge .rail:before{content:"";position:absolute;left:1px;top:6px;bottom:16px;width:2px;background:rgba(24,58,59,.14);border-radius:1px}
body.frame .gauge{transform:translateY(calc(-50% + 6px))}

/* 底部：視角名稱與模式 */
.bottom{left:22px;right:22px;bottom:22px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;pointer-events:none}
.bottom>*{pointer-events:auto}
.view{padding:16px 26px 18px 22px;max-width:520px}
.view .n{font-size:11px;letter-spacing:.3em;color:var(--dim);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px}
.view .n .nav{display:inline-flex;gap:2px;margin-left:2px}
.nav button{font:inherit;font-size:18px;line-height:1;color:var(--ink-2);background:none;border:0;width:26px;height:22px;cursor:pointer;border-radius:3px;transition:color var(--dur-hover),background-color var(--dur-hover)}
.nav button:hover{color:var(--ink);background:rgba(24,58,59,.08)}
.view h2{margin:4px 0 2px;font:400 32px/1.15 var(--kai);letter-spacing:.12em;color:var(--ink)}
.view p{margin:0;font-size:13px;color:var(--ink-2);min-height:1.6em}
.views{display:flex;gap:2px;margin:10px 0 0 -8px;flex-wrap:wrap}
.views button{font:inherit;font-size:12px;letter-spacing:.1em;color:var(--dim);background:none;border:0;padding:4px 8px;cursor:pointer;border-radius:3px;font-variant-numeric:tabular-nums;transition:color var(--dur-hover)}
.views button:hover{color:var(--ink)}
.views button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.views button i{font-style:normal;font-size:10px;margin-right:4px;color:var(--dim)}

.modes{display:flex;padding:8px;gap:4px}
.modes button{font:inherit;font-size:14px;letter-spacing:.18em;color:var(--ink-2);background:none;border:0;padding:10px 18px 10px 20px;cursor:pointer;border-radius:3px;transition:color var(--dur-hover) var(--ease-out),background-color var(--dur-hover) var(--ease-out)}
.modes button:hover{color:var(--ink);background:rgba(24,58,59,.08)}
.modes button[aria-pressed="true"]{color:#e3ecea;background:var(--ink)}

/* 手機天候列（桌機隱藏） */
.wx-row{display:none}

/* 取景模式的回程鍵 */
#unframe{position:fixed;z-index:6;right:22px;bottom:22px;font:inherit;font-size:12px;letter-spacing:.14em;color:#e3ecea;background:rgba(24,58,59,.7);border:0;padding:10px 16px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity var(--dur-enter) var(--ease-out);border-radius:3px}
body.frame #unframe{opacity:1;pointer-events:auto}

/* 觸控：搖桿與舵鍵 */
#stick{position:fixed;z-index:6;left:26px;bottom:150px;width:120px;height:120px;border-radius:50%;background:rgba(224,234,232,.22);border:1px solid rgba(224,234,232,.45);display:none;touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(224,234,232,.85)}
#helm{position:fixed;z-index:6;left:50%;bottom:150px;transform:translateX(-50%);display:none;gap:8px}
#helm button{width:64px;height:54px;font:inherit;font-size:20px;color:var(--ink);background:rgba(224,234,232,.85);border:0;border-radius:4px;touch-action:none}
#helm button:active{background:#fff}
body.touch.walk:not(.frame) #stick{display:block}
body.touch.boat:not(.frame) #helm{display:flex}

/* 說明 */
#help{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(20,44,46,.55);padding:20px}
#help.on{display:flex}
#help .panel{max-width:440px;width:100%;padding:28px 34px 26px 30px}
#help h3{margin:0 0 10px;font:400 24px/1.2 var(--kai);letter-spacing:.14em}
#help dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px}
#help dt{color:var(--ink);font-weight:600;letter-spacing:.14em;white-space:nowrap}
#help dd{margin:0;color:var(--ink-2)}
#help button{margin-top:18px;font:inherit;font-size:13px;letter-spacing:.14em;color:#e3ecea;background:var(--ink);border:0;padding:10px 18px;cursor:pointer;border-radius:3px}

/* 載入 */
#boot{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:var(--sea);color:#dbe7e5;transition:opacity .6s var(--ease-out)}
#boot.gone{opacity:0;pointer-events:none}
#boot div{text-align:center;font-size:13px;letter-spacing:.14em;line-height:2}
#boot b{display:block;font:400 26px/1.3 var(--kai);letter-spacing:.2em}

@media (max-width:760px){
  :root{--cut:8px}
  .brand{top:14px;left:14px;padding:10px 20px 10px 14px}
  .brand h1{font-size:20px}
  .brand p{font-size:10px}
  .brand p span{display:none}
  .tools{top:14px;right:14px;padding:4px 6px 4px 8px}
  .tools button{font-size:12px;padding:8px 8px;letter-spacing:.04em}
  .gauge{display:none}
  .bottom{left:14px;right:14px;bottom:14px;flex-direction:column;align-items:stretch;gap:8px}
  .view{padding:12px 18px 12px 16px;max-width:none}
  .view h2{font-size:24px}
  .view p{font-size:12px}
  .views{display:none}
  .wx-row{display:flex;padding:6px;gap:2px}
  .wx-row button{flex:1;font:inherit;font-size:13px;letter-spacing:.12em;color:var(--ink-2);background:none;border:0;padding:9px 0;cursor:pointer;border-radius:3px}
  .wx-row button[aria-pressed="true"]{color:var(--ink);font-weight:600;background:rgba(24,58,59,.1)}
  .modes{padding:6px;gap:2px}
  .modes button{flex:1;padding:9px 0;font-size:13px;letter-spacing:.14em}
  #stick{bottom:250px;left:16px;width:104px;height:104px}
  #helm{bottom:250px}
  #unframe{right:14px;bottom:14px}
}
@media (prefers-reduced-motion:reduce){
  .ui,.gauge .rail i,.tools button,.modes button{transition:none}
}
</style>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="港上疊樓 3D 場景"></canvas>
<div id="boot"><div><b>港上疊樓</b>正在把樓一層一層蓋上去</div></div>

<header class="ui panel brand">
  <h1>港上疊樓</h1>
  <p><b>HARBOUR STACK</b><span> · 海上一棟越加越高的樓</span></p>
</header>

<div class="ui panel tools" role="group" aria-label="工具">
  <button id="bDrift" aria-pressed="false">漂流</button>
  <button id="bFrame">取景</button>
  <button id="bSound" aria-pressed="false">聲音</button>
  <button id="bHelp">說明</button>
</div>

<aside class="ui panel gauge" aria-label="天候">
  <p class="lab">天候</p>
  <div class="rail" aria-hidden="true"><i></i></div>
  <button data-wx="dusk" aria-pressed="true">黃昏<small>18:40</small></button>
  <button data-wx="day" aria-pressed="false">白日<small>13:10</small></button>
  <button data-wx="rain" aria-pressed="false">落雨<small>16:25</small></button>
  <button data-wx="night" aria-pressed="false">深夜<small>01:30</small></button>
</aside>

<div class="ui bottom">
  <section class="panel view" aria-live="polite">
    <div class="n"><span id="vN">01 / 06</span><span class="nav"><button id="vPrev" aria-label="上一個視角">‹</button><button id="vNext" aria-label="下一個視角">›</button></span></div>
    <h2 id="vT">原稿</h2>
    <p id="vD">畫稿上的那個角度：仰角三十度，轉四十六度半。</p>
    <div class="views" id="views" role="group" aria-label="視角"></div>
  </section>
  <div class="panel wx-row" role="group" aria-label="天候">
    <button data-wx="dusk" aria-pressed="true">黃昏</button>
    <button data-wx="day" aria-pressed="false">白日</button>
    <button data-wx="rain" aria-pressed="false">落雨</button>
    <button data-wx="night" aria-pressed="false">深夜</button>
  </div>
  <div class="panel modes" role="group" aria-label="模式">
    <button data-mode="orbit" aria-pressed="true">環繞</button>
    <button data-mode="walk" aria-pressed="false">上岸</button>
    <button data-mode="boat" aria-pressed="false">出海</button>
  </div>
</div>

<button id="unframe">顯示介面</button>
<div id="stick" aria-hidden="true"><i></i></div>
<div id="helm" aria-hidden="true"><button data-k="a">◀</button><button data-k="w">▲</button><button data-k="d">▶</button></div>

<div id="help" role="dialog" aria-modal="true" aria-label="操作說明">
  <div class="panel">
    <h3>怎麼看這棟樓</h3>
    <dl>
      <dt>環繞</dt><dd>拖曳轉動，滾輪或雙指縮放。按「漂流」它會自己慢慢轉。</dd>
      <dt>上岸</dt><dd>站上甲板。W A S D 或方向鍵走路，拖曳畫面轉頭；手機用左下角的搖桿。</dd>
      <dt>出海</dt><dd>接手那艘漁船。W／S 是油門，A／D 轉舵；手機用畫面下方三個鍵。樁柱撞不進去。</dd>
      <dt>視角</dt><dd>數字鍵 1 到 6 直接跳到六個預設視角，Esc 離開取景。</dd>
    </dl>
    <button id="bHelpClose">知道了</button>
  </div>
</div>

<script type="module">
const $ = id => document.getElementById(id);
let THREE = null, post = null;
try { THREE = await import('three'); }
catch (e) {
  try { THREE = await import('../vendor/three-0.186.0/three.module.js'); }
  catch (e2) { $('boot').innerHTML = '<div><b>3D 載入失敗</b>需要網路連線到 cdn.jsdelivr.net 載入 Three.js。</div>'; }
}
if (THREE) {
  try {
    const [a, b, c, d] = await Promise.all([
      import('three/addons/postprocessing/EffectComposer.js'),
      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),
      import('three/addons/postprocessing/OutputPass.js')]);
    post = { EffectComposer: a.EffectComposer, RenderPass: b.RenderPass, UnrealBloomPass: c.UnrealBloomPass, OutputPass: d.OutputPass };
  } catch (e) { post = null; }
  try { init(); }
  catch (err) { console.warn(err); $('boot').innerHTML = '<div><b>這個瀏覽器無法建立 WebGL</b>港上疊樓需要 WebGL 才能顯示。</div>'; }
}

function init() {
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;
const small = Math.min(innerWidth, innerHeight) < 700;
if (coarse) document.body.classList.add('touch');

// ---------- 種子亂數 ----------
let seed = 1690926;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + rnd() * (b - a);

// ---------- 渲染器 ----------
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !post, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, small ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x4f6c6d, 70, 260);
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.4, 5000);

// ---------- 材質工具 ----------
function tex(w, h, draw, opt = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  if (opt.repeat) t.repeat.set(opt.repeat[0], opt.repeat[1]);
  return t;
}
function speckle(g, w, h, n, alpha, lo = 0, hi = 255) {
  for (let i = 0; i < n; i++) { const v = Math.round(rr(lo, hi)); g.fillStyle = `rgba(${v},${v},${v},${alpha})`; g.fillRect(rnd() * w, rnd() * h, rr(1, 3), rr(1, 3)); }
}
const concreteTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#8ea19d'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 2600, .16, 60, 220);
  g.strokeStyle = 'rgba(40,60,58,.22)'; g.lineWidth = 1.5;
  for (let i = 0; i < 6; i++) { const x = rr(0, w); g.beginPath(); g.moveTo(x, rr(0, h * .4)); g.lineTo(x + rr(-3, 3), h); g.stroke(); }
  g.strokeStyle = 'rgba(30,50,48,.35)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(0, h / 2); g.lineTo(w, h / 2); g.moveTo(w / 2, 0); g.lineTo(w / 2, h); g.stroke();
  g.fillStyle = 'rgba(70,90,80,.25)'; for (let i = 0; i < 40; i++) g.fillRect(rr(0, w), rr(0, h), rr(4, 20), rr(2, 4));
}, { repeat: [1, 1] });
const yellowTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#d9b649'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 1800, .13, 90, 255);
  g.fillStyle = 'rgba(120,80,20,.18)'; for (let i = 0; i < 14; i++) g.fillRect(rr(0, w), rr(0, h), rr(2, 4), rr(10, 60));
});
const tealTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#6f8f8a'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 1800, .15, 60, 220);
  g.fillStyle = 'rgba(30,50,50,.25)'; for (let i = 0; i < 12; i++) g.fillRect(rr(0, w), rr(0, h), rr(2, 4), rr(20, 90));
});
const woodTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#7e5e3d'; g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 32) { g.fillStyle = `rgb(${rr(110, 140) | 0},${rr(78, 98) | 0},${rr(48, 62) | 0})`; g.fillRect(0, y, w, 30); g.fillStyle = 'rgba(30,18,8,.5)'; g.fillRect(0, y + 30, w, 2); }
  speckle(g, w, h, 900, .12, 40, 200);
});
const tinTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#5f6f6c'; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 16) { g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(x, 0, 5, h); g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(x + 9, 0, 5, h); }
  speckle(g, w, h, 700, .18, 80, 200); g.fillStyle = 'rgba(140,70,30,.35)'; for (let i = 0; i < 24; i++) g.fillRect(rr(0, w), rr(0, h), rr(3, 12), rr(3, 12));
});
const deckTex = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#c7bd9a'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 2200, .12, 70, 230);
  g.strokeStyle = 'rgba(80,70,50,.35)'; g.lineWidth = 2;
  for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke(); }
}, { repeat: [4, 4] });
const awningTex = tex(128, 64, (g, w, h) => {
  for (let x = 0; x < w; x += 16) { g.fillStyle = (x / 16) % 2 ? '#e9e2d2' : '#b0402f'; g.fillRect(x, 0, 16, h); }
}, { repeat: [3, 1] });

const M = (o) => new THREE.MeshStandardMaterial(o);
const mConcrete = M({ map: concreteTex, roughness: .92, metalness: 0 });
const mConcreteDark = M({ map: concreteTex, color: 0x8a9a97, roughness: .95 });
const mYellow = M({ map: yellowTex, roughness: .85 });
const mTeal = M({ map: tealTex, roughness: .9 });
const mWood = M({ map: woodTex, roughness: .8 });
const mTin = M({ map: tinTex, roughness: .6, metalness: .4 });
const mDeck = M({ map: deckTex, roughness: .95 });
const mIron = M({ color: 0x2a3634, roughness: .55, metalness: .7 });
const mRust = M({ color: 0x6e4a33, roughness: .9 });
const mWhite = M({ color: 0xe8e4d8, roughness: .6 });
const mRed = M({ color: 0xa63d2c, roughness: .8 });
const mGreen = M({ color: 0x4d7d43, roughness: .9 });
const mPot = M({ color: 0x8a5a3c, roughness: .9 });
const mAwning = M({ map: awningTex, roughness: .9, side: THREE.DoubleSide });
const mRobot = M({ color: 0xf1efe8, roughness: .45, metalness: .05 });

// ---------- 幾何合併 ----------
const _v = new THREE.Vector3(), _nm = new THREE.Matrix3();
function mergeGeos(list) {
  let n = 0;
  for (const it of list) { it.g = it.geo.index ? it.geo.toNonIndexed() : it.geo; n += it.g.attributes.position.count; }
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), uv = new Float32Array(n * 2);

  { const rel = { x: boat.x - 16.6, z: boat.z }; const d = Math.hypot(rel.x, rel.z); if (d < 5.2) { boat.x = 16.6 + rel.x / d * 5.2; boat.z = rel.z / d * 5.2; boat.v *= .4; } }

  boat.wakeT += dt; if (Math.abs(boat.v) > .6 && boat.wakeT > .16) { boat.wakeT = 0; const w = waterU.uWake.value[boat.wakeI]; w.set(boat.x - fwd.x * 2.6, boat.z - fwd.z * 2.6, time, Math.min(1, Math.abs(boat.v) / 4)); boat.wakeI = (boat.wakeI + 1) % WAKE_N; }

  // 居民與飛行物
  {
    const wt = (time * .35) % 2; const wx = wt < 1 ? -4 + wt * 10 : 6 - (wt - 1) * 10; walker.position.x = wx; walker.rotation.y = wt < 1 ? Math.PI / 2 : -Math.PI / 2; walker.position.y = DECK_Y + Math.abs(Math.sin(time * 6)) * .03;
    for (const d of drones) { const p = d.userData.p; const a = time * p.w + p.ph; d.position.set(Math.cos(a) * p.r, p.h + Math.sin(time * p.wob + p.ph) * 1.2, Math.sin(a) * p.r); d.rotation.y = -a + (p.w > 0 ? Math.PI : 0); d.rotation.z = Math.sin(time * p.wob) * .08; d.userData.r1.rotation.y += dt * 30; d.userData.r2.rotation.y -= dt * 30; }
    for (const g of gulls) { const p = g.userData.p; const a = time * p.w + p.ph; g.position.set(Math.cos(a) * p.r, p.h + Math.sin(time * .7 + p.ph) * 1.5, Math.sin(a) * p.r); g.rotation.y = -a - Math.PI / 2; const f = Math.sin(time * 7 + p.ph) * .6; g.userData.wr.rotation.z = f; g.userData.wl.rotation.z = -f; }
    bunting.children.forEach(f => { if (f.userData.ph !== undefined) f.rotation.x = Math.sin(time * 3 + f.userData.ph * .7) * .25 * (1 + cur.rain); });

  }

    let mz = (keys.has('w') || keys.has('arrowup') ? 1 : 0) - (keys.has('s') || keys.has('arrowdown') ? 1 : 0) - joy.y;

  } else {
    posDes.set(boat.x - fwd.x * 17, 5.6, boat.z - fwd.z * 17); lookDes.set(boat.x + fwd.x * 6, 1.4, boat.z + fwd.z * 6);
  }
  camera.position.lerp(posDes, kf); lookCur.lerp(lookDes, kf); camera.lookAt(lookCur);
  rain.position.set(lookCur.x, 0, lookCur.z);

  if (composer) composer.render(); else renderer.render(scene, camera);
  frameNo++;
}
