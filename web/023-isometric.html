<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>薄荷鎮建造計畫 — 等角小鎮建造器</title>
<meta name="description" content="等角小鎮建造器：建物彈跳升起、道路自動接線、小車行駛、日夜切換。收錄於 100 Creative HTML Works（023・等角視圖）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/web/023-isometric.html">
<style>
:root{
  --mint:#bfeadb; --mint2:#a6dfca; --mint3:#8fd1b9; --peach:#ffd8bf; --peach2:#ffb998; --coral:#ff8f7a;
  --cream:#fff7ee; --lav:#c9c3ef; --ink:#3b3950; --ink2:#6c6882;
  --f:"Segoe UI Semibold","Segoe UI","Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--f);font-weight:600;color:var(--ink);background:linear-gradient(180deg,#ffe9dc 0%,#fff3ea 45%,#e6f7f0 100%);overflow:hidden}
body.night{background:linear-gradient(180deg,#2e2b52 0%,#46406e 55%,#4d5f7a 100%);color:#f3eefe}
.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 22px 0;flex-wrap:wrap;position:relative;z-index:2}
.title h1{margin:0;font-size:clamp(22px,2.6vw,32px);letter-spacing:.04em;line-height:1.1}
.title h1 small{font-size:.45em;letter-spacing:.2em;color:var(--coral);display:block;margin-bottom:6px;text-transform:uppercase}
.title p{margin:6px 0 0;font-size:13px;color:var(--ink2);font-weight:400}
body.night .title p{color:#cfc8ea}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.75);border-radius:16px;padding:9px 14px 10px;min-width:92px;box-shadow:0 2px 0 rgba(59,57,80,.08),0 8px 18px -10px rgba(59,57,80,.35);backdrop-filter:blur(6px)}
body.night .chip{background:rgba(40,36,72,.7);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.chip span{display:block;font-size:11px;color:var(--ink2);letter-spacing:.08em;font-weight:400}
body.night .chip span{color:#bdb5e0}
.chip b{display:block;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.chip i{display:block;height:5px;border-radius:3px;background:rgba(59,57,80,.1);margin-top:5px;overflow:hidden}
.chip i::after{content:"";display:block;height:100%;width:var(--v,50%);background:linear-gradient(90deg,var(--peach2),var(--coral));border-radius:3px;transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.chip.g i::after{background:linear-gradient(90deg,var(--mint3),#52b893)}
.stage{position:relative;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;display:block}
.diary{position:absolute;left:22px;bottom:12px;max-width:min(360px,calc(100% - 44px));background:var(--cream);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:13px;line-height:1.5;
  box-shadow:0 10px 24px -12px rgba(59,57,80,.45);color:var(--ink);pointer-events:none;transition:opacity .4s,transform .4s}
.diary b{color:var(--coral);font-size:11px;letter-spacing:.14em;display:block}
.diary.swap{opacity:0;transform:translateY(6px)}
.tools{justify-self:center;display:flex;gap:6px;padding:8px;margin:0 16px 16px;background:rgba(255,255,255,.82);border-radius:24px;box-shadow:0 14px 30px -14px rgba(59,57,80,.5),0 2px 0 rgba(59,57,80,.06);backdrop-filter:blur(8px);max-width:calc(100vw - 32px);flex-wrap:wrap;justify-content:center}
body.night .tools{background:rgba(40,36,72,.82)}
.tool{border:0;background:transparent;border-radius:18px;min-width:64px;height:66px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font:600 12px/1 var(--f);color:inherit;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s}
.tool svg{width:36px;height:34px;overflow:visible}
.tool:hover{transform:translateY(-3px)}
.tool[aria-pressed=true]{background:var(--mint);transform:translateY(-4px)}
body.night .tool[aria-pressed=true]{background:#5a5392}
.tool kbd{font:400 9px/1 var(--f);opacity:.5}
.tool:focus-visible,.nightbtn:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.sep{width:1px;background:rgba(59,57,80,.12);margin:6px 2px}
.nightbtn{border:0;border-radius:18px;min-width:64px;height:66px;cursor:pointer;background:var(--lav);color:var(--ink);font:600 12px/1 var(--f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nightbtn svg{width:24px;height:24px}
.hint{position:absolute;right:22px;bottom:14px;font-size:11px;color:var(--ink2);font-weight:400;text-align:right;line-height:1.6;pointer-events:none}
body.night .hint{color:#bdb5e0}
@media (max-width:700px){
  header{padding:14px 16px 0;gap:10px}
  .title p{display:none}
  .stats{width:100%;gap:6px}
  .chip{flex:1;min-width:0;padding:7px 9px 8px;border-radius:12px}
  .chip b{font-size:17px}
  .chip span{font-size:10px;letter-spacing:0}
  .tools{gap:0;padding:6px;margin:0 8px 10px;border-radius:20px;max-width:calc(100vw - 16px);width:calc(100vw - 16px);flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
  .tool{min-width:42px;width:42px;height:58px;padding:2px;font-size:11px}
  .tool svg{width:30px;height:28px}
  .tool kbd{display:none}
  .nightbtn{min-width:42px;width:42px;height:58px;font-size:11px}
  .sep{display:none}
  .hint{display:none}
  .diary{left:12px;bottom:8px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){ .tool,.chip i::after,.diary{transition:none} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">
      <h1><small>Mint Town · 等角建造計畫</small>薄荷鎮</h1>
      <p>一座不需要經過都市計畫委員會的小鎮。點地塊蓋房子，拖曳可以一路鋪路。</p>
    </div>
    <div class="stats" aria-live="polite">
      <div class="chip"><span>人口</span><b id="sPop">0</b></div>
      <div class="chip"><span>幸福指數</span><b id="sHap">0</b><i id="bHap"></i></div>
      <div class="chip g"><span>綠覆率</span><b id="sGreen">0%</b><i id="bGreen"></i></div>
      <div class="chip"><span>每日拿鐵</span><b id="sLatte">0</b></div>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="等角小鎮地圖，點擊地塊放置建物；方向鍵移動游標，Enter 放置"></canvas>
    <div class="diary" id="diary"><b>鎮長日記</b><span id="dtext">今天薄荷鎮成立了。人口：一隻貓。</span></div>
    <div class="hint">1–7 切換工具 · 方向鍵移動 · Enter 放置<br>N 切換夜晚</div>
  </div>
  <nav class="tools" id="tools" aria-label="建造工具"></nav>
</div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#c'), stage = $('#stage');
if (!cv || !stage) return;
const g = cv.getContext('2d');
const N = 9;
const TOOLS = [
  { id:'house', name:'住宅', key:'1' },
  { id:'cafe',  name:'咖啡館', key:'2' },
  { id:'tower', name:'高塔', key:'3' },
  { id:'tree',  name:'樹', key:'4' },
  { id:'fount', name:'噴泉', key:'5' },
  { id:'road',  name:'道路', key:'6' },
  { id:'bull',  name:'拆除', key:'7' }
];
const ICONS = {
  house:'<path d="M18 30 6 24V14l12 6z" fill="#ffd8bf"/><path d="M18 30l12-6V14l-12 6z" fill="#ffb998"/><path d="M6 14l7-9 12 6-7 9z" fill="#ff8f7a"/><path d="M18 20l7-9 5 3-12 6z" fill="#e0715f"/>',
  cafe:'<path d="M18 31 5 24V12l13 7z" fill="#fff7ee"/><path d="M18 31l13-7V12l-13 7z" fill="#e8dccf"/><path d="M5 12l13-7 13 7-13 7z" fill="#c9c3ef"/><path d="M5 18l13 7v3L5 21z" fill="#ff8f7a"/><path d="M8 19.6l3 1.6v3l-3-1.6zM14 22.8l3 1.6v3l-3-1.6z" fill="#fff"/>',
  tower:'<path d="M18 33 9 28V8l9 5z" fill="#c9c3ef"/><path d="M18 33l9-5V8l-9 5z" fill="#a39ad8"/><path d="M9 8l9-5 9 5-9 5z" fill="#e3dff8"/><path d="M18 3V-3" stroke="#3b3950" stroke-width="1.4"/><circle cx="18" cy="-3.5" r="1.8" fill="#ff8f7a"/>',
  tree:'<path d="M17 30v-8h2v8z" fill="#b98a6a"/><circle cx="18" cy="15" r="9" fill="#8fd1b9"/><circle cx="15" cy="12" r="4" fill="#bfeadb"/>',
  fount:'<ellipse cx="18" cy="24" rx="13" ry="6.5" fill="#e8dccf"/><ellipse cx="18" cy="22" rx="11" ry="5" fill="#9fd8f0"/><path d="M18 22V8" stroke="#bfe8f6" stroke-width="2.4"/><path d="M18 9c-4 0-7 5-8 9M18 9c4 0 7 5 8 9" stroke="#9fd8f0" stroke-width="1.6" fill="none"/>',
  road:'<path d="M18 30 3 22l15-8 15 8z" fill="#aaa8c2"/><path d="M10 18l2 1M16 21l2 1M22 24l2 1" stroke="#fff" stroke-width="1.6"/>',
  bull:'<path d="M5 26h20v-8l-4-6H11l-2 6H5z" fill="#ffc86b"/><path d="M25 22l8 6-2 3-9-4" fill="#ff8f7a"/><circle cx="10" cy="28" r="3.4" fill="#3b3950"/><circle cx="20" cy="28" r="3.4" fill="#3b3950"/><path d="M12 12h8v5h-8z" fill="#fff7ee"/>'
};

/* ---------- world ---------- */
const grid = Array.from({length:N}, () => Array(N).fill(null));
let tool = 'house', night = false;
const motionQuery = matchMedia('(prefers-reduced-motion: reduce)');
let reduce = motionQuery.matches;
let hover = null, cursor = [4,4], dust = [];
const rnd = (i,j,k=0) => { const x = Math.sin(i*127.1 + j*311.7 + k*74.7)*43758.5453; return x - Math.floor(x); };
function put(i,j,type, delay=0, quiet=false){
  if (i<0||j<0||i>=N||j>=N) return false;
  const cur = grid[i][j];
  if (type === 'bull') {
    if (!cur) return false;
    if (reduce){grid[i][j]=null;return true;}
    cur.dying = performance.now(); puff(i,j,10); return true;
  }
  if (cur && !cur.dying && cur.type === type) return false;
  grid[i][j] = { type, born: performance.now() + (reduce ? -1000 : delay), seed: Math.floor(rnd(i,j,performance.now()%97)*1000) };
  if (type !== 'road' && !quiet) setTimeout(() => puff(i,j,8), delay + 60);
  return true;
}
function puff(i,j,n){ if(reduce) return; for (let k=0;k<n;k++) dust.push({ i:i+.5, j:j+.5, a:Math.random()*Math.PI*2, s:.4+Math.random()*.9, t:performance.now(), r:3+Math.random()*4 }); }

// seed the starter town
const START = [
  [4,0,'road'],[4,1,'road'],[4,2,'road'],[4,3,'road'],[4,4,'road'],[4,5,'road'],[4,6,'road'],[4,7,'road'],[4,8,'road'],
  [0,4,'road'],[1,4,'road'],[2,4,'road'],[3,4,'road'],[5,4,'road'],[6,4,'road'],[7,4,'road'],[8,4,'road'],
  [3,3,'house'],[3,5,'house'],[5,3,'cafe'],[5,5,'fount'],[2,3,'tree'],[3,2,'house'],[5,2,'tower'],[6,5,'tree'],[5,6,'tree'],[2,5,'house'],[6,3,'house'],[1,1,'tree'],[7,7,'tree'],[1,6,'tree'],[3,6,'tree']
];
START.forEach(([i,j,t],k) => put(i,j,t, t==='road' ? 0 : 150 + k*55, true));

/* ---------- geometry ---------- */
let W=0,H=0,TW=64,TH=32,ox=0,oy=0,dpr=1;
function resize(){
  const r = stage.getBoundingClientRect(); dpr = Math.min(2, devicePixelRatio||1);
  W = r.width; H = r.height; cv.width = Math.max(1,W*dpr); cv.height = Math.max(1,H*dpr);
  TW = Math.max(26, Math.min(W*(W<600?.98:.9)/N, (H*.94)/(N*.5 + 1.7)));
  TH = TW/2; ox = W/2; oy = H/2 - N*TH/2 + TW*.5;
  invalidate();
}
addEventListener('resize', resize);
const P = (u,v,z=0) => [ox + (u-v)*TW/2, oy + (u+v)*TH/2 - z*TW];
function poly(pts, fill, stroke){ g.beginPath(); pts.forEach((p,k)=> k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.closePath(); if (fill){ g.fillStyle=fill; g.fill(); } if (stroke){ g.strokeStyle=stroke; g.lineWidth=1; g.stroke(); } }
function shade(hex, f){ const n=parseInt(hex.slice(1),16); let r=n>>16,gg=n>>8&255,b=n&255; r=Math.round(r*f); gg=Math.round(gg*f); b=Math.round(b*f); return `rgb(${Math.min(255,r)},${Math.min(255,gg)},${Math.min(255,b)})`; }
function prism(u0,v0,u1,v1,z0,z1,top,left,right){
  poly([P(u0,v1,z0),P(u1,v1,z0),P(u1,v1,z1),P(u0,v1,z1)], left);   // front-left face (v=v1)
  poly([P(u1,v0,z0),P(u1,v1,z0),P(u1,v1,z1),P(u1,v0,z1)], right);  // front-right face (u=u1)
  poly([P(u0,v0,z1),P(u1,v0,z1),P(u1,v1,z1),P(u0,v1,z1)], top);
}
const glows = [];
function winL(u0,u1,v,z0,z1,day){ const pts=[P(u0,v,z0),P(u1,v,z0),P(u1,v,z1),P(u0,v,z1)]; poly(pts, day); glows.push(pts); }
function winR(u,v0,v1,z0,z1,day){ const pts=[P(u,v0,z0),P(u,v1,z0),P(u,v1,z1),P(u,v0,z1)]; poly(pts, day); glows.push(pts); }

/* ---------- building painters (h = rise factor 0..~1.1) ---------- */
function drawHouse(i,j,h,seed){
  const a=.2, u0=i+a, v0=j+a, u1=i+1-a, v1=j+1-a, z=.42*h, rh=.3*h;
  const walls = ['#ffe3cf','#fff1e0','#ffd6d0','#e9f3ff'][seed%4], roof = ['#ff8f7a','#8fb8f0','#f7a8c4','#7fcdb0'][(seed>>2)%4];
  prism(u0,v0,u1,v1,0,z, walls, shade(walls,.94), shade(walls,.82));
  // door + windows
  poly([P(i+.42,v1,0),P(i+.56,v1,0),P(i+.56,v1,z*.55),P(i+.42,v1,z*.55)], shade(roof,.8));
  winL(i+.28,i+.37,v1,z*.45,z*.78,'#9fd3ef'); winL(i+.63,i+.73,v1,z*.45,z*.78,'#9fd3ef');
  winR(u1,j+.35,j+.62,z*.4,z*.8,'#8cc6e4');
  // gable roof, ridge along u
  const vc=(v0+v1)/2, e=.05;
  poly([P(u0-e,v0-e,z),P(u1+e,v0-e,z),P(u1+e,vc,z+rh),P(u0-e,vc,z+rh)], shade(roof,1.08));
  poly([P(u0-e,v1+e,z),P(u1+e,v1+e,z),P(u1+e,vc,z+rh),P(u0-e,vc,z+rh)], roof);
  poly([P(u1,v0,z),P(u1,v1,z),P(u1,vc,z+rh)], shade(walls,.86));
  // chimney
  prism(i+.3,vc-.05,i+.4,vc+.05,z+rh*.5,z+rh*1.05,'#b8a2a0','#a38b88','#8d7471');
}
function drawCafe(i,j,h,seed,now){
  const a=.14, u0=i+a, v0=j+a, u1=i+1-a, v1=j+1-a, z=.5*h;
  prism(u0,v0,u1,v1,0,z,'#fff7ee','#f5ebe0','#e2d4c6');
  prism(u0-.02,v0-.02,u1+.02,v1+.02,z,z+.06*h,'#c9c3ef','#b3abe6','#9d94d6');
  // big windows
  winL(i+.22,i+.48,v1,z*.12,z*.62,'#bfe6f5'); winL(i+.56,i+.8,v1,z*.12,z*.62,'#bfe6f5');
  winR(u1,j+.25,j+.75,z*.2,z*.62,'#acd9ec');
  // striped awning on left face
  const aw0=z*.66, aw1=z*.86, stripes=6;
  for (let k=0;k<stripes;k++){ const ua=u0+(u1-u0)*k/stripes, ub=u0+(u1-u0)*(k+1)/stripes;
    poly([P(ua,v1+.12,aw0),P(ub,v1+.12,aw0),P(ub,v1,aw1),P(ua,v1,aw1)], k%2?'#fff':'#ff8f7a'); }
  // cup sign on the roof, gently spinning steam
  const [sx,sy] = P(i+.5,j+.5,z+.06*h);
  if (h>.6) { g.fillStyle='#fff'; g.beginPath(); g.ellipse(sx,sy-TW*.13,TW*.09,TW*.07,0,0,Math.PI*2); g.fill();
    g.fillStyle='#b98a6a'; g.beginPath(); g.ellipse(sx,sy-TW*.13-TW*.02,TW*.07,TW*.025,0,0,Math.PI*2); g.fill();
    g.strokeStyle='rgba(255,255,255,.85)'; g.lineWidth=Math.max(1.2,TW*.025); g.lineCap='round';
    for (let k=0;k<2;k++){ const ph = now*.004 + k*2; g.beginPath(); g.moveTo(sx-TW*.03+k*TW*.06, sy-TW*.22); g.quadraticCurveTo(sx+Math.sin(ph)*TW*.05+k*TW*.03, sy-TW*.3, sx-TW*.02+k*TW*.05, sy-TW*.38); g.stroke(); } }
}
function drawTower(i,j,h,seed,now){
  const a=.18, u0=i+a, v0=j+a, u1=i+1-a, v1=j+1-a, z=(1.5 + (seed%3)*.25)*h;
  const c = ['#c9c3ef','#bfe0f5','#ffd8bf'][seed%3];
  prism(u0,v0,u1,v1,0,z,shade(c,1.08),c,shade(c,.84));
  const floors = Math.max(1, Math.floor(z/.17));
  for (let f=0; f<floors-1; f++){ const za=.1+f*.17, zb=za+.08; if (zb>z-.05) break;
    for (let k=0;k<3;k++){ winL(u0+.06+k*.2, u0+.16+k*.2, v1, za, zb, '#f2f7ff'); winR(u1, v0+.06+k*.2, v0+.16+k*.2, za, zb, '#e2ecfa'); } }
  const [ax,ay] = P(i+.5,j+.5,z), [bx,by] = P(i+.5,j+.5,z+.35*h);
  g.strokeStyle='#3b3950'; g.lineWidth=Math.max(1,TW*.02); g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();
  const blink = (Math.sin(now*.005 + seed)>.2);
  g.fillStyle = blink ? '#ff5f5f' : '#9b4d5a'; g.beginPath(); g.arc(bx,by,Math.max(2,TW*.04),0,Math.PI*2); g.fill();
  if (blink){ g.fillStyle='rgba(255,95,95,.25)'; g.beginPath(); g.arc(bx,by,TW*.11,0,Math.PI*2); g.fill(); }
}
function drawTree(i,j,h,seed,now){
  const pine = seed%3===0, sway = Math.sin(now*.0016 + seed)*TW*.012;
  const cu = i+.5 + (rnd(i,j,1)-.5)*.2, cvv = j+.5 + (rnd(i,j,2)-.5)*.2;
  prism(cu-.04,cvv-.04,cu+.04,cvv+.04,0,.18*h,'#c9a283','#b98a6a','#9c7255');
  const [x,y] = P(cu,cvv,.18*h);
  if (pine){
    for (let k=0;k<3;k++){ const w=TW*(.28-k*.06), ht=TW*.26*h, yy=y-k*TW*.15*h;
      g.fillStyle = k%2?'#7cc7a8':'#62b492'; g.beginPath(); g.moveTo(x-w+sway*(k+1),yy); g.lineTo(x+sway*(k+2),yy-ht); g.lineTo(x+w+sway*(k+1),yy); g.closePath(); g.fill();
      g.fillStyle='rgba(255,255,255,.18)'; g.beginPath(); g.moveTo(x-w+sway*(k+1),yy); g.lineTo(x+sway*(k+2),yy-ht); g.lineTo(x-w*.2+sway,yy); g.closePath(); g.fill(); }
  } else {
    const r = TW*(.2 + (seed%5)*.015)*Math.max(.01,h);
    g.fillStyle = '#6fbe9d'; g.beginPath(); g.arc(x+sway, y-r*.9, r, 0, Math.PI*2); g.fill();
    g.fillStyle = '#8fd1b9'; g.beginPath(); g.arc(x+sway-r*.2, y-r*1.05, r*.78, 0, Math.PI*2); g.fill();
    g.fillStyle = '#c4ecdd'; g.beginPath(); g.arc(x+sway-r*.4, y-r*1.3, r*.28, 0, Math.PI*2); g.fill();
    if (seed%4===1){ g.fillStyle='#ff9f8a'; [[.3,-.7],[-.1,-1.4],[.45,-1.2]].forEach(([dx,dy])=>{ g.beginPath(); g.arc(x+sway+dx*r, y+dy*r, Math.max(1.5,r*.1), 0, Math.PI*2); g.fill(); }); }
  }
}
function drawFountain(i,j,h,seed,now){
  const [x,y] = P(i+.5,j+.5,0), rx = TW*.36, ry = TH*.36, bh = TW*.12*h;
  g.fillStyle='#d9ccbf'; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI); g.lineTo(x-rx,y-bh); g.ellipse(x,y-bh,rx,ry,0,Math.PI,0,true); g.closePath(); g.fill();
  g.fillStyle='#efe5da'; g.beginPath(); g.ellipse(x,y-bh,rx,ry,0,0,Math.PI*2); g.fill();
  g.fillStyle='#9fd8f0'; g.beginPath(); g.ellipse(x,y-bh,rx*.82,ry*.82,0,0,Math.PI*2); g.fill();
  g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=1.2; const rr=((now*.001)%1);
  g.beginPath(); g.ellipse(x,y-bh,rx*.8*rr,ry*.8*rr,0,0,Math.PI*2); g.stroke();
  const top = y - bh - TW*.5*h;
  g.fillStyle='#efe5da'; g.fillRect(x-TW*.03, y-bh-TW*.18*h, TW*.06, TW*.18*h);
  if (h > .5) {
    g.strokeStyle='rgba(160,220,245,.95)'; g.lineWidth=Math.max(1.5,TW*.03);
    for (let k=0;k<6;k++){ const ang = k/6*Math.PI*2 + now*.0006, ex = Math.cos(ang)*rx*.6, ey = Math.sin(ang)*ry*.6;
      g.beginPath(); g.moveTo(x, y-bh-TW*.18*h); g.quadraticCurveTo(x+ex*.5, top - TW*.05, x+ex, y-bh+ey); g.stroke(); }
    for (let k=0;k<5;k++){ const t=((now*.0015 + k/5)%1); g.fillStyle=`rgba(255,255,255,${1-t})`; g.beginPath(); g.arc(x+Math.sin(k*9)*rx*.5*t, top + t*TW*.3, 1.6, 0, Math.PI*2); g.fill(); }
  }
}
function drawRoad(i,j,h){
  const isR = (a,b) => a>=0&&b>=0&&a<N&&b<N&&grid[a][b]&&grid[a][b].type==='road'&&!grid[a][b].dying;
  const z=.012;
  poly([P(i,j,z),P(i+1,j,z),P(i+1,j+1,z),P(i,j+1,z)], night ? '#77738f' : '#aaa8c2');
  const nU = isR(i-1,j)||isR(i+1,j), nV = isR(i,j-1)||isR(i,j+1);
  g.strokeStyle='rgba(255,255,255,.9)'; g.lineWidth=Math.max(1.2,TW*.03); g.setLineDash([TW*.08,TW*.1]);
  if (nU && !nV || (!nU && !nV)) { const a=P(i,j+.5,z), b=P(i+1,j+.5,z); g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke(); }
  if (nV && !nU) { const a=P(i+.5,j,z), b=P(i+.5,j+1,z); g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke(); }
  g.setLineDash([]);
  if (nU && nV) { // crossing: zebra
    g.fillStyle='rgba(255,255,255,.75)';
    for (let k=0;k<4;k++){ const u=i+.18+k*.18; poly([P(u,j+.05,z),P(u+.08,j+.05,z),P(u+.08,j+.2,z),P(u,j+.2,z)], 'rgba(255,255,255,.75)'); }
  }
}
function drawCar(now){
  // little cars cruise along any road tile
  const roads = []; for (let i=0;i<N;i++) for (let j=0;j<N;j++) if (grid[i][j]&&grid[i][j].type==='road'&&!grid[i][j].dying) roads.push([i,j]);
  return roads;
}
const PAINT = { house:drawHouse, cafe:drawCafe, tower:drawTower, tree:drawTree, fount:drawFountain };

function elastic(t){ if (t<=0) return 0; if (t>=1) return 1; return Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI/3))+1; }

/* ---------- clouds ---------- */
const clouds = Array.from({length:4},(_,k)=>({ x: rnd(k,1)*1.2-.1, y: .08 + rnd(k,2)*.3, s: .6 + rnd(k,3)*.7, v: .006 + rnd(k,4)*.01 }));
function drawClouds(dt){
  clouds.forEach(c => { c.x += c.v*dt; if (c.x > 1.25) c.x = -.25;
    const x = c.x*W, y = c.y*H, s = c.s*TW;
    g.fillStyle = night ? 'rgba(210,205,255,.16)' : 'rgba(255,255,255,.85)';
    g.beginPath(); g.ellipse(x,y,s*1.2,s*.42,0,0,Math.PI*2); g.ellipse(x-s*.5,y-s*.22,s*.55,s*.4,0,0,Math.PI*2); g.ellipse(x+s*.35,y-s*.32,s*.6,s*.48,0,0,Math.PI*2); g.fill(); });
}

/* ---------- main render ---------- */
let last = performance.now(), frameId = 0;
const cars = Array.from({length:3},(_,k)=>({ idx:k*5, t:0, dir:1 }));
function render(now){
  frameId = 0;
  if(document.hidden) return;
  const dt = reduce ? 0 : Math.min(.05,(now-last)/1000); last = now;
  const visualTime = reduce ? 0 : now;
  g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  drawClouds(dt);
  glows.length = 0;
  // island slab
  const d = .32;
  poly([P(0,N,-d),P(N,N,-d),P(N,N,0),P(0,N,0)], night?'#8a6f7a':'#f7c3a4');
  poly([P(N,0,-d),P(N,N,-d),P(N,N,0),P(N,0,0)], night?'#6f5766':'#e9a888');
  // soil strata
  g.strokeStyle = night?'rgba(0,0,0,.15)':'rgba(255,255,255,.35)'; g.lineWidth=1;
  [.12,.22].forEach(z => { const a=P(0,N,-z), b=P(N,N,-z), c=P(N,0,-z); g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.lineTo(c[0],c[1]); g.stroke(); });
  // ground tiles
  for (let i=0;i<N;i++) for (let j=0;j<N;j++){
    const alt = (i+j)%2 ? (night?'#6f9c8f':'#bfeadb') : (night?'#679387':'#b3e4d2');
    poly([P(i,j),P(i+1,j),P(i+1,j+1),P(i,j+1)], alt, night?'rgba(0,0,0,.08)':'rgba(255,255,255,.55)');
    if (rnd(i,j,5) > .72) { const [x,y] = P(i+rnd(i,j,6)*.8+.1, j+rnd(i,j,7)*.8+.1); g.fillStyle = night?'rgba(255,255,255,.15)':'rgba(255,255,255,.7)'; g.fillRect(x-1,y-1,2,2); }
  }
  // roads first (flat)
  for (let i=0;i<N;i++) for (let j=0;j<N;j++){ const c=grid[i][j]; if (c && c.type==='road'){ if (c.dying && now-c.dying>250){ grid[i][j]=null; continue;} drawRoad(i,j,1); } }
  // cars
  const roads = drawCar(now);
  // hover tile
  const hv = hover || (kbdActive ? cursor : null);
  if (hv){ const [i,j]=hv; poly([P(i,j,.02),P(i+1,j,.02),P(i+1,j+1,.02),P(i,j+1,.02)], tool==='bull'?'rgba(255,143,122,.35)':'rgba(255,255,255,.45)');
    g.save(); g.setLineDash([5,4]); g.lineWidth=2; g.strokeStyle = tool==='bull' ? '#ff8f7a' : (night?'#fff':'#3b3950'); g.lineDashOffset = -visualTime*.02;
    poly([P(i,j,.02),P(i+1,j,.02),P(i+1,j+1,.02),P(i,j+1,.02)], null, g.strokeStyle); g.stroke(); g.restore(); }
  // buildings in painter's order
  for (let s=0; s<=2*(N-1); s++) for (let i=0;i<N;i++){ const j=s-i; if (j<0||j>=N) continue;
    const c = grid[i][j];
    if (c && c.type!=='road') {
      let h = reduce ? 1 : elastic((now - c.born)/750);
      if (c.dying) { const t=(now-c.dying)/320; if (t>=1){ grid[i][j]=null; continue; } h = 1 - t*t; }
      if (h > 0.001) PAINT[c.type](i,j,h,c.seed,visualTime);
    }
    // ghost preview
    if (hv && hv[0]===i && hv[1]===j && tool!=='bull' && tool!=='road' && !(c && c.type===tool)) { g.globalAlpha=.4; PAINT[tool](i,j,1,7,visualTime); g.globalAlpha=1; }
    // cars drawn on their tile in order
    cars.forEach(car => { if (!roads.length) return; const rt = roads[car.idx % roads.length]; if (rt[0]===i && rt[1]===j) drawOneCar(car, rt, now); });
  }
  cars.forEach(car => { car.t += dt*1.4; if (car.t>=1){ car.t=0; car.idx = (car.idx + 1) % Math.max(1, roads.length); } });
  // dust
  dust = dust.filter(p => now - p.t < 700);
  dust.forEach(p => { const k=(now-p.t)/700; const [x,y]=P(p.i+Math.cos(p.a)*p.s*.5*k, p.j+Math.sin(p.a)*p.s*.5*k, .05+k*.1);
    g.fillStyle = `rgba(255,255,255,${.8*(1-k)})`; g.beginPath(); g.arc(x,y,p.r*(1+k),0,Math.PI*2); g.fill(); });
  // night overlay + lit windows
  if (night){
    g.globalCompositeOperation='source-atop'; g.fillStyle='rgba(34,28,86,.42)'; g.fillRect(0,0,W,H); g.globalCompositeOperation='source-over';
    g.shadowColor='#ffd27a'; g.shadowBlur=8;
    glows.forEach((pts,k) => { if (rnd(k,3) > .3) poly(pts, '#ffe19a'); });
    g.shadowBlur=0;
  }
  if(!reduce) frameId=requestAnimationFrame(render);
}
function invalidate(){
  if(document.hidden) return;
  if(reduce) render(performance.now());
  else if(!frameId){last=performance.now();frameId=requestAnimationFrame(render);}
}
function drawOneCar(car, rt, now){
  const [i,j] = rt; const along = (car.idx%2) ? 'u' : 'v';
  const u = along==='u' ? i + car.t : i + .5 + .12, v = along==='u' ? j + .5 + .12 : j + car.t;
  const col = ['#ff8f7a','#8fb8f0','#ffc86b'][car.idx%3];
  const l=.14, w=.08;
  const u0 = along==='u'? u-l : u-w, u1 = along==='u'? u+l : u+w, v0 = along==='u'? v-w : v-l, v1 = along==='u'? v+w : v+l;
  prism(u0,v0,u1,v1,.02,.1,shade(col,1.1),col,shade(col,.8));
  prism(u0+(u1-u0)*.25,v0+(v1-v0)*.25,u1-(u1-u0)*.25,v1-(v1-v0)*.25,.1,.16,'#e9f6ff','#cfe6f5','#b4d2e6');
  if (night) { const [x,y]=P(along==='u'?u1:u, along==='u'?v:v1, .06); g.fillStyle='rgba(255,230,150,.9)'; g.beginPath(); g.arc(x,y,2,0,Math.PI*2); g.fill(); }
}

/* ---------- input ---------- */
function tileAt(cx, cy){
  const r = cv.getBoundingClientRect(); const x = cx - r.left - ox, y = cy - r.top - oy;
  const u = (x/(TW/2) + y/(TH/2))/2, v = (y/(TH/2) - x/(TW/2))/2;
  const i = Math.floor(u), j = Math.floor(v);
  return (i>=0&&j>=0&&i<N&&j<N) ? [i,j] : null;
}
let painting = false, lastPainted = '', kbdActive = false;
cv.addEventListener('pointermove', e => { hover = tileAt(e.clientX, e.clientY); kbdActive = false;
  if (painting && hover) { const k = hover.join(','); if (k!==lastPainted){ lastPainted=k; if (put(hover[0],hover[1],tool)) { blip(); update(); } } } invalidate(); });
cv.addEventListener('pointerleave', () => { hover = null; invalidate(); });
cv.addEventListener('pointerdown', e => { const t = tileAt(e.clientX, e.clientY); if (!t) return; painting = true; lastPainted = t.join(',');
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  if (put(t[0],t[1],tool)) { blip(); update(); invalidate(); } });
const endPaint = () => { painting = false; };
cv.addEventListener('pointerup', endPaint); cv.addEventListener('pointercancel', endPaint);

addEventListener('keydown', e => {
  const t = TOOLS.find(x => x.key === e.key); if (t) { setTool(t.id); return; }
  if (e.key==='n' || e.key==='N') { toggleNight(); return; }
  const mv = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0] }[e.key];
  if (mv) { e.preventDefault(); kbdActive = true; cursor = [Math.max(0,Math.min(N-1,cursor[0]+mv[0])), Math.max(0,Math.min(N-1,cursor[1]+mv[1]))]; invalidate(); return; }
  if ((e.key==='Enter' || e.key===' ') && (!document.activeElement || document.activeElement===document.body)) { e.preventDefault(); kbdActive = true; if (put(cursor[0],cursor[1],tool)) { blip(); update(); invalidate(); } }
});

/* ---------- sound: tiny pluck on place ---------- */
let actx = null;
function blip(){
  try {
    if (!actx) { const AC = window.AudioContext||window.webkitAudioContext; if (!AC) return; actx = new AC(); }
    if (actx.state==='suspended') actx.resume();
    const t = actx.currentTime, o = actx.createOscillator(), gg = actx.createGain();
    const base = { house:523, cafe:659, tower:392, tree:784, fount:880, road:330, bull:196 }[tool] || 523;
    o.type = tool==='bull' ? 'sawtooth' : 'triangle';
    o.frequency.setValueAtTime(base, t); o.frequency.exponentialRampToValueAtTime(tool==='bull'?90:base*1.5, t+.12);
    gg.gain.setValueAtTime(.0001,t); gg.gain.exponentialRampToValueAtTime(.12,t+.01); gg.gain.exponentialRampToValueAtTime(.0001,t+.22);
    o.connect(gg); gg.connect(actx.destination); o.start(t); o.stop(t+.25);
  } catch(_){}
}

/* ---------- toolbar ---------- */
const tb = $('#tools');
function setTool(id){ tool = id; if (tb) tb.querySelectorAll('.tool').forEach(b => b.setAttribute('aria-pressed', b.dataset.id===id)); invalidate(); }
if (tb) {
  TOOLS.forEach(t => { const b = document.createElement('button'); b.className='tool'; b.dataset.id=t.id; b.setAttribute('aria-pressed', t.id===tool);
    b.innerHTML = `<svg viewBox="0 0 36 34">${ICONS[t.id]}</svg>${t.name}<kbd>${t.key}</kbd>`; b.addEventListener('click', () => setTool(t.id)); tb.appendChild(b); });
  const sep = document.createElement('span'); sep.className='sep'; tb.appendChild(sep);
  const nb = document.createElement('button'); nb.className='nightbtn'; nb.id='nightbtn'; nb.setAttribute('aria-pressed','false');
  nb.innerHTML = '<svg viewBox="0 0 24 24"><path d="M15 3a9 9 0 1 0 6 13A7 7 0 0 1 15 3z" fill="#3b3950"/></svg>夜晚'; nb.addEventListener('click', toggleNight); tb.appendChild(nb);
}
function toggleNight(){ night = !night; document.body.classList.toggle('night', night);
  const nb = $('#nightbtn'); if (nb) { nb.setAttribute('aria-pressed', night); nb.lastChild.textContent = night ? '白天' : '夜晚'; } say(); invalidate(); }

/* ---------- stats + diary ---------- */
function count(){ const c = {house:0,cafe:0,tower:0,tree:0,fount:0,road:0}; let lonely=0;
  for (let i=0;i<N;i++) for (let j=0;j<N;j++){ const x=grid[i][j]; if (!x||x.dying) continue; c[x.type]++;
    if (x.type==='house'||x.type==='cafe'||x.type==='tower'){ const nb=[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>{ const y=grid[i+a]&&grid[i+a][j+b]; return y&&y.type==='road'&&!y.dying; }); if(!nb) lonely++; } }
  c.lonely = lonely; return c; }
let S = count();
function update(){
  S = count();
  const pop = S.house*4 + S.tower*22 + S.cafe*2;
  const hap = Math.max(0, Math.min(100, Math.round(42 + S.tree*3 + S.fount*9 + S.cafe*7 - S.tower*4 - S.lonely*5 - Math.max(0, pop/3 - S.cafe*12)/2)));
  const green = Math.round((S.tree + S.fount*.5)/(N*N)*100*3);
  const set = (id,v) => { const e=$(id); if (e) e.textContent = v; };
  set('#sPop', pop); set('#sHap', hap); set('#sGreen', Math.min(100,green)+'%'); set('#sLatte', Math.round(pop*1.3 + S.cafe*15));
  const bh=$('#bHap'); if (bh) bh.style.setProperty('--v', hap+'%'); const bg=$('#bGreen'); if (bg) bg.style.setProperty('--v', Math.min(100,green)+'%');
  S.pop = pop; S.hap = hap;
}
const dtext = $('#dtext'), diary = $('#diary'); let lastMsg = '';
function pick(){
  const m = [];
  if (night) m.push('夜深了，高塔頂端的紅燈替迷路的鴿子指路。','晚上的咖啡館只賣低咖啡因，居民表示抗議。');
  if (!S.cafe) m.push('陳小姐投訴：鎮上連一杯拿鐵都買不到。');
  if (S.cafe && S.pop/S.cafe > 40) m.push('咖啡館排隊排到第三條街，請再開一家。');
  if (S.lonely) m.push(`有 ${S.lonely} 棟建築沒接到道路，郵差正在考慮辭職。`);
  if (S.tree < 5) m.push('鎮上的鳥兒聯名要求：多種幾棵樹。');
  if (S.tree >= 12) m.push('綠覆率太高，松鼠開始收取過路費。');
  if (S.tower >= 3) m.push('高塔太多了，天際線開始變得很有野心。');
  if (S.fount) m.push('噴泉許願池今日收入：新台幣 37 元與一顆鈕扣。');
  if (S.hap >= 80) m.push('居民幸福到開始自組合唱團，請做好心理準備。');
  if (S.house >= 8) m.push('新住民湧入，里長忙著背名字。');
  m.push('貓咪巡邏完畢，本日無重大事故。','今日天氣：適合蓋房子，也適合什麼都不做。');
  let x; do { x = m[Math.floor(Math.random()*m.length)]; } while (m.length>1 && x===lastMsg);
  return lastMsg = x;
}
function say(){ if (!dtext || !diary) return; diary.classList.add('swap'); setTimeout(() => { dtext.textContent = pick(); diary.classList.remove('swap'); }, 380); }
setInterval(() => {if(!document.hidden) say();}, 5200);

resize(); update(); setTimeout(update, 2400);
motionQuery.addEventListener('change', e => { reduce=e.matches; if(reduce){if(frameId) cancelAnimationFrame(frameId);frameId=0;dust=[];for(let i=0;i<N;i++) for(let j=0;j<N;j++) if(grid[i][j]&&grid[i][j].dying) grid[i][j]=null;}last=performance.now();invalidate(); });
document.addEventListener('visibilitychange', () => {if(document.hidden){if(frameId) cancelAnimationFrame(frameId);frameId=0;}else{last=performance.now();invalidate();}});
invalidate();
})();
</script>
</body>
