<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X-16 · 四排十六缸剖面引擎</title>
<meta name="description" content="可互動的 X-16 概念引擎 3D 剖面模型：四排汽缸呈 X 形共用一根曲軸，主副連桿、凸輪與氣門依推導出的點火順序連動，外殼可切換實心、半透明與剖切。">
<meta name="theme-color" content="#16201b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%225%22 fill=%22%2316201b%22/%3E%3Cpath d=%22M8 8l16 16M24 8L8 24%22 stroke=%22%23e6eadf%22 stroke-width=%224%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%223.4%22 fill=%22%23c0391f%22/%3E%3C/svg%3E">

{ "imports": {

<style>
:root{
  --bg:#16201b; --bg-2:#1d2923; --panel:#1a251f; --panel-2:#223029; --edge:rgba(214,226,206,.08);
  --ink:#e6eadf; --ink-2:#aab4a6; --ink-3:#9aa58f;
  --cut:#c0391f; --fire:#ffac45;
  --s-pow:#ff9f43; --s-exh:#8c8178; --s-in:#78b9ab; --s-cmp:#cbc48c;
  --display:"DIN Condensed","DIN Alternate","Bahnschrift SemiBold Condensed","Bahnschrift","Arial Narrow",system-ui,sans-serif;
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --ease-out:cubic-bezier(.22,.8,.3,1);
  --dur-hover:140ms;
  --panel-w:328px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
#stage{position:fixed;inset:124px calc(var(--panel-w) + 32px) 148px 16px}
#gl{display:block;width:100%;height:calc(100% - 44px);touch-action:none;cursor:grab;outline:none}
#gl:active{cursor:grabbing}
#gl:focus-visible{outline:2px solid var(--ink-2);outline-offset:-3px}
.stage-tools{position:absolute;bottom:0;left:50%;transform:translateX(-50%);display:flex;gap:8px;white-space:nowrap}
.stage-tools .btn{padding:0 14px;background:#1a251fed;border:1px solid var(--edge);height:36px}
#gl:focus-visible{outline:2px solid var(--ink-2);outline-offset:-3px}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
/* Close views: the model dissolves into the page colour (= scene background) over the last 28px of the canvas
   instead of meeting a hard crop line. The mask also hides the canvas's inset focus ring, so the ring is drawn on an overlay. */
#gl{--fade:28px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 var(--fade),#000 calc(100% - var(--fade)),transparent),linear-gradient(180deg,transparent,#000 var(--fade),#000 calc(100% - var(--fade)),transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 var(--fade),#000 calc(100% - var(--fade)),transparent),linear-gradient(180deg,transparent,#000 var(--fade),#000 calc(100% - var(--fade)),transparent);mask-composite:intersect}
#stage::after{content:"";position:absolute;left:0;right:0;top:0;height:calc(100% - 44px);pointer-events:none}
#stage:has(#gl:focus-visible)::after{outline:2px solid var(--ink-2);outline-offset:-3px}
.bank-tag{position:absolute;left:0;top:0;font:600 26px/1 var(--display);color:var(--ink);letter-spacing:.02em;
  transform:translate(-50%,-50%);text-shadow:0 1px 2px rgba(10,16,13,.8);will-change:transform}
.bank-tag small{display:block;font:500 11px/1.2 var(--sans);color:var(--ink-2);text-align:center;margin-top:2px;
  padding:1px 5px;background:rgba(22,32,27,.72);border-radius:2px;text-shadow:none}

.mark{position:fixed;left:32px;top:26px;pointer-events:none;max-width:calc(100vw - var(--panel-w) - 80px)}
.mark h1{margin:0;font:600 clamp(64px,8vw,104px)/.82 var(--display);letter-spacing:.01em;color:var(--ink)}
.mark h1 span{color:var(--ink-3)}
.mark p{margin:10px 0 0;font-size:15px;color:var(--ink-2);letter-spacing:.04em}

.spec{position:fixed;left:32px;bottom:26px;margin:0;font-size:12.5px;line-height:1.75;color:var(--ink-2);text-shadow:0 1px 2px var(--bg),0 0 8px var(--bg);
  max-width:min(620px,calc(100vw - var(--panel-w) - 90px));pointer-events:none}
.spec b{font:600 15px/1 var(--display);color:var(--ink);letter-spacing:.03em;margin-right:2px}

.panel{position:fixed;top:16px;right:16px;bottom:16px;width:var(--panel-w);overflow:auto;overscroll-behavior:contain;
  background:var(--panel);box-shadow:inset 0 1px 0 rgba(230,240,220,.06),inset 0 0 0 1px var(--edge);
  clip-path:polygon(22px 0,100% 0,100% 100%,0 100%,0 22px);padding:24px 22px 16px;scrollbar-width:thin;scrollbar-color:#35443b transparent}
.sec{margin-top:12px}
.sec:first-child{margin-top:0}
.lab{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--ink-3);margin-bottom:8px}
.lab output,.lab span{color:var(--ink-2)}

/* degree wheel */
.wheelbox{position:relative;width:100%;max-width:204px;margin:0 auto}
#dial{display:block;width:100%;height:auto;touch-action:none;cursor:ew-resize;user-select:none}
#dial .face{fill:#101712}
#dial .tick{stroke:#8d9888;stroke-width:1;stroke-linecap:round}
#dial .tick.maj{stroke:var(--ink);stroke-width:1.6}
#dial .num{fill:var(--ink-2);font:600 12px var(--display);text-anchor:middle;dominant-baseline:central}
#dial .fm{fill:#55624f;transition:fill var(--dur-hover)}
#dial .fn{fill:var(--ink-2);font:600 13.5px var(--display);text-anchor:middle;dominant-baseline:central;transition:fill var(--dur-hover)}
#dial .hot .fm{fill:var(--fire)}
#dial .hot .fn{fill:var(--fire)}
#dial .band{fill:none;stroke-width:6}
#dial .ptr{fill:var(--ink)}
#dial .deg{fill:var(--ink);font:600 38px var(--display);text-anchor:middle;dominant-baseline:central}
#dial .sub{fill:var(--ink-2);font:500 12px var(--sans);text-anchor:middle;dominant-baseline:central}
.order{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-top:8px}
.order span{font:600 13px/24px var(--display);text-align:center;color:var(--ink-2);background:var(--panel-2);border-radius:2px;
  transition:background var(--dur-hover),color var(--dur-hover)}
.order span.hot{background:var(--fire);color:#1b1206}
.note{font-size:12px;color:var(--ink-3);margin:6px 0 0;line-height:1.55}

/* rpm */
.rpmrow{display:flex;align-items:center;gap:10px}
.rpmval{font:600 40px/1 var(--display);min-width:3.2ch;text-align:right;font-variant-numeric:tabular-nums}
.rpmval small{font:500 12px var(--sans);color:var(--ink-3);margin-left:4px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:30px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ink-2) var(--p,20%),#34423a var(--p,20%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#34423a}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--ink-2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:24px;margin-top:-10px;border-radius:3px;background:var(--ink);
  box-shadow:inset 0 -3px 0 #b9c0b2,0 1px 2px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{width:14px;height:24px;border:0;border-radius:3px;background:var(--ink);box-shadow:inset 0 -3px 0 #b9c0b2}
input[type=range]:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}
.btns{display:flex;gap:6px;margin-top:8px}
.btn{flex:1;height:34px;border:0;border-radius:3px;background:var(--panel-2);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:13px;transition:background var(--dur-hover),color var(--dur-hover)}
.btn:hover{background:#2c3b33}
.btn:focus-visible,.seg button:focus-visible,.cell:focus-visible,.chk:focus-within{outline:2px solid var(--ink-2);outline-offset:2px}
.btn svg{width:14px;height:14px;fill:currentColor}
.btn.play{flex:1.3}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel-2);border-radius:3px;padding:3px;gap:3px}
.seg button{height:30px;border:0;border-radius:2px;background:transparent;color:var(--ink-2);cursor:pointer;font-size:13px;transition:background var(--dur-hover),color var(--dur-hover)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:#16201b;font-weight:600}
.seg button[data-mode=section][aria-pressed=true]{background:var(--cut);color:#fff3ee}

/* stroke matrix */
.matrix{display:grid;grid-template-columns:22px repeat(4,1fr);gap:3px;align-items:center}
.matrix .rh,.matrix .ch{font:600 14px var(--display);color:var(--ink-3);text-align:center}
.cell{height:30px;border:0;border-radius:2px;cursor:pointer;font:600 13px var(--sans);color:#141a15;background:var(--c,#333);
  display:flex;align-items:center;justify-content:center;position:relative}
.cell::after{content:"";position:absolute;inset:-3px;border-radius:4px;box-shadow:0 0 0 2px var(--ink);opacity:0;transition:opacity var(--dur-hover)}
.cell.sel::after{opacity:1}
.key i{font-style:normal;font-weight:600;margin-left:6px}
.readout{margin-top:8px;font-size:13px;color:var(--ink-2);min-height:40px}
.readout b{font:600 20px/1 var(--display);color:var(--ink);margin-right:6px;letter-spacing:.02em}
.toggles{display:flex;gap:16px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);cursor:pointer;border-radius:3px}
.chk input{appearance:none;-webkit-appearance:none;width:30px;height:16px;border-radius:8px;background:#34423a;position:relative;margin:0;cursor:pointer;transition:background var(--dur-hover)}
.chk input::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--ink-2);transition:transform 180ms var(--ease-out),background var(--dur-hover)}
.chk input:checked{background:var(--ink-2)}
.chk input:checked::after{transform:translateX(14px);background:#16201b}
.chk input:focus-visible{outline:none}
.spec .kbd{color:var(--ink-3)}

#boot{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--ink-2);font-size:14px;text-align:center;padding:24px}
#boot b{display:block;font:600 22px var(--display);color:var(--ink);margin-bottom:6px}
#boot.gone{display:none}

@media (max-width:820px){
  :root{--panel-w:0px}
  body{overflow:auto}
  /* Phone: the engine spans almost the full width, so only the top and bottom edges fade. */
  #gl{-webkit-mask-image:linear-gradient(180deg,transparent,#000 var(--fade),#000 calc(100% - var(--fade)),transparent);mask-image:linear-gradient(180deg,transparent,#000 var(--fade),#000 calc(100% - var(--fade)),transparent)}
  #stage{position:relative;inset:auto;margin-top:108px;height:56svh;min-height:380px}
  .stage-tools{bottom:4px}
  .cell{height:36px}
  .mark{position:absolute;left:18px;top:16px;max-width:calc(100vw - 36px)}
  .mark h1{font-size:56px}
  .mark p{font-size:13px;margin-top:6px}
  .spec{position:static;max-width:none;margin:0 16px 28px}
  .panel{position:relative;inset:auto;width:auto;margin:0 12px 16px;clip-path:polygon(18px 0,100% 0,100% 100%,0 100%,0 18px);padding:22px 18px 18px;overflow:visible}
  .top2{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
  .wheelbox{max-width:250px}
  #boot{position:absolute;height:60svh}
}
@media (prefers-reduced-motion: reduce){
  *{transition-duration:0ms !important}
}

.btn,.seg button,.cell{min-height:44px}#dial:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>

<body>
<div id="stage"><canvas id="gl" tabindex="0" aria-label="X-16 引擎 3D 模型，拖曳旋轉、滾輪縮放；W A S D 旋轉、加減鍵縮放、Home 重設視角" aria-describedby="view-help"></canvas><div id="labels"></div><div class="stage-tools" aria-label="模型檢視"><button class="btn" id="focus-cylinder">聚焦選取汽缸</button><button class="btn" id="reset-view">重設視角</button></div></div>

<header class="mark">
  <h1>X<span>-</span>16</h1>
  <p>四排十六缸 · 單曲軸概念引擎</p>
</header>

<aside class="panel" aria-label="引擎控制">
  <div class="sec">
    <div class="lab"><span>視角</span></div>
    <div class="seg" id="views">
      <button data-view="front" aria-pressed="false">正面</button>
      <button data-view="quarter" aria-pressed="true">斜角</button>
      <button data-view="side" aria-pressed="false">側面</button>
    </div>
  </div>

  <div class="sec toggles">
    <label class="chk"><input type="checkbox" id="gas" checked>行程著色</label>
    <label class="chk"><input type="checkbox" id="snd">聲音</label>
  </div>

  <div class="sec">
    <div class="lab"><span>曲軸角度盤（一圈 = 720°，完整四行程）</span></div>
    <div class="wheelbox"><svg id="dial" viewBox="-124 -124 248 248" role="slider" aria-label="曲軸角度，拖曳轉動" aria-valuemin="0" aria-valuemax="719" aria-valuenow="0" tabindex="0"></svg></div>
    <div class="order" id="order" aria-label="點火順序"></div>
    <p class="note" id="intervals"></p>
  </div>

  <div class="sec">
    <div class="lab"><span>曲軸轉速（實際時間播放）</span></div>
    <div class="rpmrow"><div class="rpmval" id="rpmv">60<small>rpm</small></div><input id="rpm" type="range" min="0" max="300" step="5" value="60" aria-label="曲軸轉速"></div>
    <div class="btns">
      <button class="btn" id="prev" title="退到上一次點火（←）"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2.5v11L6 8z"/></svg>上一發</button>
      <button class="btn play" id="play" aria-pressed="false" title="播放／暫停（空白鍵）"></button>
      <button class="btn" id="next" title="進到下一次點火（→）">下一發<svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2.5v11L10 8z"/></svg></button>
    </div>
  </div>

  <div class="sec">
    <div class="lab"><span>外殼</span></div>
    <div class="seg" id="modes">
      <button data-mode="solid" aria-pressed="false">實心</button>
      <button data-mode="ghost" aria-pressed="true">半透明</button>
      <button data-mode="section" aria-pressed="false">剖切</button>
    </div>
  </div>


  <div class="sec">
    <div class="lab"><span>十六缸此刻的行程</span><span class="key"><i style="color:var(--s-in)">進氣</i><i style="color:var(--s-cmp)">壓縮</i><i style="color:var(--s-pow)">做功</i><i style="color:var(--s-exh)">排氣</i></span></div>
    <div class="matrix" id="matrix"></div>
    <div class="readout" id="readout"></div>
  </div>



</aside>
<p class="spec" id="spec"></p>

<div id="boot"><div><b>X-16</b>正在載入 Three.js 與建模…</div></div>

<script type="module">
const $ = id => document.getElementById(id);
let THREE, OrbitControls, RoundedBoxGeometry;
try {
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
  ({ RoundedBoxGeometry } = await import('three/addons/geometries/RoundedBoxGeometry.js'));
} catch (e) {
  $('boot').innerHTML = '<div><b>3D 模型載入失敗</b>無法載入本機 3D 模組，請透過網站伺服器開啟此頁。</div>';
}
if (THREE) {
  try { init(); $('boot').classList.add('gone'); }
  catch (err) { console.warn(err); $('boot').innerHTML = '<div><b>這個瀏覽器無法建立 WebGL</b>X-16 需要 WebGL 才能顯示 3D 模型。</div>'; }
}

function init() {
/* ------------------------------------------------------------------ *
 *  幾何：1 單位 = 100 mm。曲軸沿 X 軸，前端（皮帶盤）在 -X。
 *  截面平面上的角度 γ 從 +Y 量向 +Z（從正面看是順時針）。
 * ------------------------------------------------------------------ */
const D2R = Math.PI / 180, TAU = Math.PI * 2;
const R = 0.42;          // 曲柄半徑（行程 84 mm）
const LM = 1.55;         // 主連桿中心距
const RL = 0.40;         // 副連桿銷到曲柄銷的距離
const PITCH = 1.05;      // 缸距
const BORE = 0.39;       // 缸徑半徑（78 mm）
const CROWN = 0.2, SKIRT = 0.26, CLEAR = 0.1;
const XJ = [0, 1, 2, 3].map(j => (j - 1.5) * PITCH);
const PH = [0, 225, 45, 180];          // 四個曲拐的相位
const BANKS = [['A', 315], ['B', 45], ['C', 135], ['D', 225]].map(([id, deg], k) => ({
  id, k, deg, beta: deg * D2R, u: [Math.cos(deg * D2R), Math.sin(deg * D2R)]
}));
const DELTA = BANKS.map(b => b.beta - BANKS[0].beta);  // 副連桿銷相對主連桿軸線的角度
const LA = [LM, 0, 0, 0];
const LIFT = 0.07, CAM_BASE = 0.065, VALVE_HALF = 125;   // 氣門升程、凸輪基圓、開啟半寬（曲軸角）
const EXH_C = 270, INT_C = 450;                         // 排氣、進氣凸輪中心（循環角）

function slide(py, pz, u, L) {
  const al = py * u[0] + pz * u[1], pe = -py * u[1] + pz * u[0];
  return al + Math.sqrt(Math.max(0, L * L - pe * pe));
}
const K = { cy: 0, cz: 0, phi: 0, s: [0, 0, 0, 0], ly: [0, 0, 0, 0], lz: [0, 0, 0, 0] };
function kin(a) {
  const cy = R * Math.cos(a), cz = R * Math.sin(a), u = BANKS[0].u;
  const s0 = slide(cy, cz, u, LM);
  const phi = Math.atan2(s0 * u[1] - cz, s0 * u[0] - cy);
  K.cy = cy; K.cz = cz; K.phi = phi; K.s[0] = s0; K.ly[0] = cy; K.lz[0] = cz;
  for (let k = 1; k < 4; k++) {
    const ang = phi + DELTA[k];
    const ly = cy + RL * Math.cos(ang), lz = cz + RL * Math.sin(ang);
    K.ly[k] = ly; K.lz[k] = lz;
    K.s[k] = slide(ly, lz, BANKS[k].u, LA[k]);
  }
  return K;
}
function extreme(k, sign) {             // 回傳 [曲柄銷角, 活塞位置]，sign=1 找上死點
  let best = -Infinity, ba = 0;
  for (let i = 0; i < 360; i++) { const a = i / 360 * TAU, v = sign * kin(a).s[k]; if (v > best) { best = v; ba = a; } }
  let lo = ba - TAU / 360, hi = ba + TAU / 360;
  for (let i = 0; i < 40; i++) {
    const m1 = lo + (hi - lo) / 3, m2 = hi - (hi - lo) / 3;
    if (sign * kin(m1).s[k] < sign * kin(m2).s[k]) lo = m1; else hi = m2;
  }
  const a = (lo + hi) / 2;
  return [a, kin(a).s[k]];
}
// 讓每一排副連桿的上死點高度和主連桿一樣：二分搜尋副連桿長度
const TDC_S = LM + R;
const wrap180 = d => ((d + 180) % 360 + 360) % 360 - 180;
for (let k = 1; k < 4; k++) {
  let lo = 0.7, hi = 2.0;
  for (let i = 0; i < 36; i++) { LA[k] = (lo + hi) / 2; if (extreme(k, 1)[1] > TDC_S) hi = LA[k]; else lo = LA[k]; }
  LA[k] = (lo + hi) / 2;
}
const TDC_A = [], STROKE = [];
for (let k = 0; k < 4; k++) {
  const t = extreme(k, 1), b = extreme(k, -1);
  TDC_A[k] = ((t[0] / D2R) % 360 + 360) % 360;
  STROKE[k] = t[1] - b[1];
}
const deckS = TDC_S + CROWN + CLEAR;
const BASE_S = 0.95;
const camS = deckS + 0.5;

// 點火順序：每缸上死點的曲軸角 = 該排上死點的曲柄銷角 − 曲拐相位；同一個 45° 格子會有兩缸，
// 一缸在壓縮上死點點火，另一缸錯開 360°（排氣上死點）。副連桿隨主連桿擺動，B、D 排的上死點會偏離 45° 格線，
// 這裡照星型發動機補償式磁電機的做法，讓每一缸在自己真正的上死點點火
const mod = (a, n) => ((a % n) + n) % n;
const CYL = [];

  // 每個圓角 2 段：與弧面、側面的轉折都 <28°、兩段之間約 45°，半透明模式的 EdgesGeometry 每條長邊剛好一條線。

  const VA = 21, VR = 0.03, r0 = 0.98, r1 = 1.07;
  const valleyG = c => {
    const P = [], N = [], at = (r, d) => [r * Math.cos(d * D2R), r * Math.sin(d * D2R)];
    const add = (p, nd) => { P.push(p); N.push(at(1, nd)); };
    const round = (rc, dc, f0, f1) => { const [y, z] = at(rc, dc), f = (f0 + f1) / 2; add([y + VR * Math.cos(f * D2R), z + VR * Math.sin(f * D2R)], f); };
    const a0 = c - VA, a1 = c + VA, dO = Math.asin(VR / (r1 - VR)) / D2R, dI = Math.asin(VR / (r0 + VR)) / D2R;
    const sO = (r1 - VR) * Math.cos(dO * D2R), sI = (r0 + VR) * Math.cos(dI * D2R);
    for (let i = 0; i <= 16; i++) { const d = a0 + dO + (a1 - a0 - 2 * dO) * i / 16; add(at(r1, d), d); }
    round(r1 - VR, a1 - dO, a1 - dO, a1 + 90);
    add(at(sO, a1), a1 + 90); add(at(sI, a1), a1 + 90);
    round(r0 + VR, a1 - dI, a1 + 90, a1 - dI + 180);
    for (let i = 0; i <= 16; i++) { const d = a1 - dI - (a1 - a0 - 2 * dI) * i / 16; add(at(r0, d), d + 180); }
    round(r0 + VR, a0 + dI, a0 + dI + 180, a0 + 270);
    add(at(sI, a0), a0 - 90); add(at(sO, a0), a0 - 90);
    round(r1 - VR, a0 + dO, a0 - 90, a0 + dO);

  if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches) { camera.position.copy(to); controls.target.set(0, 0, 0); return; }
  camTween = { from: camera.position.clone(), fromT: controls.target.clone(), to, target: new THREE.Vector3(), t: 0 };
}
document.querySelectorAll('#views button').forEach(b => b.addEventListener('click', () => goView(b.dataset.view)));
controls.addEventListener('start', () => { camTween = null; document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', false)); });

$('reset-view').addEventListener('click', () => goView('quarter'));
$('focus-cylinder').addEventListener('click', () => {
  setPlaying(false); tween = null;
  if (mode === 'solid') setMode('ghost');
  const target = cylObjs[selected].piston.getWorldPosition(new THREE.Vector3());
  const to = camera.position.clone().sub(controls.target).normalize().multiplyScalar(6 * viewDist()).add(target);
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', false));
  if (reducedMotion.matches) { camTween = null; camera.position.copy(to); controls.target.copy(target); }
  else camTween = {from:camera.position.clone(), fromT:controls.target.clone(), to, target, t:0};
});
canvas.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const key = e.key.toLowerCase();
  if (!['w','a','s','d','+','=','-','home'].includes(key)) return;
  e.preventDefault(); camTween = null;
  if (key === 'home') { goView('quarter'); return; }
  const orbit = new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  const step = e.shiftKey ? 0.04 : 0.12;
  if (key === 'a') orbit.theta -= step;
  if (key === 'd') orbit.theta += step;
  if (key === 'w') orbit.phi -= step;
  if (key === 's') orbit.phi += step;
  if (key === '+' || key === '=') orbit.radius *= 0.9;
  if (key === '-') orbit.radius *= 1.1;
  orbit.phi = THREE.MathUtils.clamp(orbit.phi, 0.05, controls.maxPolarAngle);
  orbit.radius = THREE.MathUtils.clamp(orbit.radius, controls.minDistance, controls.maxDistance);
  camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(orbit));
  controls.update();
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', false));
});
reducedMotion.addEventListener('change', () => {
  if (reducedMotion.matches) { setPlaying(false); tween = null; camTween = null; }
});

// 點選汽缸
{
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let down = null;
  canvas.addEventListener('pointerdown', e => { down = e.isPrimary && e.button === 0 ? [e.clientX, e.clientY, e.pointerId] : null; });
  for (const type of ['pointercancel','lostpointercapture']) canvas.addEventListener(type, () => { down = null; });
  window.addEventListener('blur', () => { down = null; });
  canvas.addEventListener('pointerup', e => {
    if (!down || e.pointerId !== down[2] || e.button !== 0) return;
    const start = down; down = null;
    if (Math.hypot(e.clientX - start[0], e.clientY - start[1]) > 5) return;
    const r = canvas.getBoundingClientRect();
    ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const targets = [];
    cylObjs.forEach(o => { targets.push(o.piston.children[0]); if (o.gas.visible) targets.push(o.gas); });
    const hit = ray.intersectObjects(targets, false)[0];
    if (hit) select(hit.object.userData.cyl);
  });
  // 滑鼠停在活塞上時提示可點選（其餘時候維持拖曳游標）
  let hoverT = 0; const hoverTargets = [];
  canvas.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || e.buttons) { canvas.style.cursor = ''; return; }
    const now = performance.now(); if (now - hoverT < 80) return; hoverT = now;
    const r = canvas.getBoundingClientRect();
    ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
    ray.setFromCamera(ndc, camera);
    hoverTargets.length = 0; cylObjs.forEach(o => { hoverTargets.push(o.piston.children[0]); if (o.gas.visible) hoverTargets.push(o.gas); });
    canvas.style.cursor = ray.intersectObjects(hoverTargets, false).length ? 'pointer' : '';
  });
  canvas.addEventListener('pointerleave', () => { canvas.style.cursor = ''; });
}

// 聲音：每次點火一記低頻悶響（WebAudio 即時合成）
let actx = null, noise = null, bus = null;
$('snd').addEventListener('change', e => {
  if (e.target.checked && !actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    noise = actx.createBuffer(1, actx.sampleRate * 0.12, actx.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    bus = actx.createGain(); bus.gain.value = 0.55; bus.connect(actx.destination);
  }
  if (actx) e.target.checked ? actx.resume() : actx.suspend();
});
function thump(n) {
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noise;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 140 + rpm * 0.9; f.Q.value = 2.5;
  const g = actx.createGain(); const peak = 0.5 / Math.sqrt(n);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
  src.connect(f).connect(g).connect(bus); src.start(t); src.stop(t + 0.12);
}

/* ------------------------------------------------------------------ per-frame update */
const v3 = new THREE.Vector3(), camDir = new THREE.Vector3();
let lastUi = -1;
function pose() {
  crank.rotation.x = theta * D2R;
  XJ.forEach((x, j) => {
    const k = kin((theta + PH[j]) * D2R);
    masters[j].position.set(x, k.cy, k.cz); masters[j].rotation.x = k.phi;
    for (let b = 0; b < 4; b++) {
      const s = k.s[b], o = cylObjs[b * 4 + j];
      o.piston.position.y = s;
      o.gas.position.y = s + CROWN; o.gas.scale.y = Math.max(0.001, deckS - s - CROWN);
      if (b > 0) {
        const u = BANKS[b].u, a = arts[j][b];
        a.position.set(x, k.ly[b], k.lz[b]);
        a.rotation.x = Math.atan2(s * u[1] - k.lz[b], s * u[0] - k.ly[b]);
      }
    }
  });
  let recent = null, recentPsi = 1e9;
  CYL.forEach((c, i) => {
    const o = cylObjs[c.k * 4 + c.j], psi = mod(theta - c.F, 720);
    c.psi = psi;
    o.valves[0].position.y = deckS - LIFT * bell(wrapd(psi - EXH_C));
    o.valves[1].position.y = deckS - LIFT * bell(wrapd(psi - INT_C));
    o.springs.forEach((spring, j) => { spring.scale.y = o.valves[j].position.y + 0.355 - spring.position.y; });
    o.lobes[0].rotation.x = Math.PI + (theta - c.F - EXH_C) / 2 * D2R;
    o.lobes[1].rotation.x = Math.PI + (theta - c.F - INT_C) / 2 * D2R;
    const st = Math.floor(psi / 180);
    const gm = gasMats[c.k * 4 + c.j];
    const burn = psi < 150 ? Math.exp(-psi / 32) : 0;
    tmpC.copy(SC[st]); if (burn > 0) tmpC.lerp(FIRE, burn);
    gm.color.copy(tmpC); gm.emissive.copy(tmpC).multiplyScalar(0.25 + burn * 1.6);
    gm.opacity = 0.42 + burn * 0.4;
    o.spark.material.opacity = psi < 14 ? 1 - psi / 14 : 0;
    o.spark.visible = o.spark.material.opacity > 0;
    if (psi < recentPsi) { recentPsi = psi; recent = c; }
  });
  const rc = cylObjs[recent.k * 4 + recent.j];
  rc.spark.getWorldPosition(flashLight.position);
  flashLight.intensity = recentPsi < 90 ? 7 * Math.exp(-recentPsi / 26) : 0;
  return recent;
}

function updateUi(recent) {
  const cur = mod(theta, 720);
  wheel.setAttribute('transform', `rotate(${-cur / 2})`);
  degText.textContent = Math.round(cur) + '°';
  subText.textContent = '最近點火 ' + recent.name;
  dial.setAttribute('aria-valuenow', Math.round(cur));
  const key = Math.round(cur * 2);
  if (key === lastUi) return;
  lastUi = key;
  ORDER.forEach((c, i) => { const hot = c === recent; dialMarks[i].classList.toggle('hot', hot); orderSpans[i].classList.toggle('hot', hot); });
  CYL.forEach((c, i) => {
    const st = STROKES[Math.floor(c.psi / 180)];
    cells[i].style.setProperty('--c', `var(${st[2]})`);
    cells[i].textContent = st[1];
  });
  const c = CYL[selected], st = STROKES[Math.floor(c.psi / 180)];
  const s = kin((theta + PH[c.j]) * D2R).s[c.k];
  const pct = Math.round((TDC_S - s) / STROKE[c.k] * 100);
  const toFire = 720 - c.psi;
  $('readout').innerHTML = `<b>${c.name}</b>第 ${c.seq + 1} 個點火 · ${st[0]}行程<br>活塞離上死點 ${Math.max(0, pct)}% 行程 · 再轉 ${Math.round(toFire)}° 點火`;
}

/* ------------------------------------------------------------------ loop */

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // The canvas now occupies the clear area beside the control panel.
  camera.clearViewOffset();
  camera.updateProjectionMatrix();
  const activeView = document.querySelector('#views button[aria-pressed="true"]');
  if (activeView) goView(activeView.dataset.view, true);
}
new ResizeObserver(resize).observe(stage);
resize();
goView('quarter', true);
setMode('ghost');
select(0);

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(Math.max(0, (now - lastT) / 1000), 0.05); lastT = now;
  const prev = theta;
  if (tween) {
    tween.t += dt / tween.dur;
    const e = tween.t >= 1 ? 1 : 1 - Math.pow(1 - tween.t, 3);
    theta = tween.from + (tween.to - tween.from) * e;
    if (tween.t >= 1) tween = null;
  } else if (playing) theta += rpm / 60 * 360 * dt;
  if (theta > prev) {                   // 播放中經過的點火事件 → 聲音
    let n = 0;
    for (const c of CYL) if (Math.floor((theta - c.F) / 720) !== Math.floor((prev - c.F) / 720)) n++;
    for (let i = 0; i < Math.min(n, 3); i++) thump(Math.min(n, 3));
  }
  if (camTween) {
    camTween.t += dt / 0.7;
    const t = Math.min(1, camTween.t), e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    camera.position.lerpVectors(camTween.from, camTween.to, e);
    controls.target.lerpVectors(camTween.fromT, camTween.target, e);
    if (t >= 1) camTween = null;
  }
  controls.update();
  if (mode === 'section') {
    camDir.subVectors(controls.target, camera.position).normalize();
    clipPlane.setFromNormalAndCoplanarPoint(camDir, controls.target);
  }
  const recent = pose();
  updateUi(recent);
  renderer.render(scene, camera);
  const w = canvas.clientWidth, h = canvas.clientHeight, placed = [];
  bankLabels.forEach((l, k) => {
    l.pos.set(0, deckS + 1.05, 0); bankGroups[k].localToWorld(l.pos);
    l.pos.project(camera);
    const px = (l.pos.x + 1) / 2 * w, py = (1 - l.pos.y) / 2 * h;
    // A tag must sit wholly inside the canvas: near the bottom it would land on the focus/reset buttons.
    const vis = l.pos.z < 1 && px > 24 && px < w - 24 && py > 24 && py < h - 24 && !placed.some(([x, y]) => Math.abs(x - px) < 56 && Math.abs(y - py) < 44);
    l.el.style.display = vis ? '' : 'none';
    if (vis) { placed.push([px, py]); l.el.style.transform = `translate(${px}px,${py}px) translate(-50%,-50%)`; }
  });
  requestAnimationFrame(frame);
}
window.X16 = { CYL, ORDER, GAPS, LA, STROKE, TDC_A, get theta() { return theta; }, set theta(v) { theta = v; }, setMode, goView, select, setPlaying };
requestAnimationFrame(frame);
}
