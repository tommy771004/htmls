<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>元素週期表・一張會放大的桌子</title>
<meta name="description" content="118 元素魚眼放大、三種著色、Bohr 圖與約 60 則短評。收錄於 100 Creative HTML Works（082・元素週期表）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/web/082-periodic.html">
<style>
:root{
  --bg:#f3f4ef; --ink:#1d2129; --ink2:#5b616e; --line:#d9dbd2; --card:#fff;
  --ui:"Segoe UI","Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC","Helvetica Neue",Arial,sans-serif;
  --zh:"Microsoft JhengHei","微軟正黑體","PMingLiU-ExtB","MingLiU-ExtB","PingFang TC","Noto Sans TC","Segoe UI",sans-serif;
  --num:"Segoe UI","Bahnschrift","Helvetica Neue",Arial,sans-serif;
  --c-alkali:#ff6f61; --c-alkaline:#ffa94d; --c-transition:#7fb2f0; --c-post:#4fc4a8; --c-metalloid:#a8d160;
  --c-nonmetal:#f5d547; --c-halogen:#f67fae; --c-noble:#a98cf5; --c-lanth:#5ccfe0; --c-actin:#dc8ef0; --c-unknown:#c3c8cf;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
  background-image:linear-gradient(rgba(29,33,41,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(29,33,41,.035) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:1240px;margin:0 auto;padding:22px clamp(16px,3vw,40px) 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 30px;margin-bottom:18px}
.brand{display:flex;align-items:flex-end;gap:16px}
.brand .mini{display:grid;grid-template-columns:repeat(3,14px);gap:3px}
.brand .mini i{width:14px;height:14px;border-radius:3px;display:block}
h1{margin:0;font-family:var(--zh);font-weight:700;font-size:clamp(28px,3.6vw,44px);letter-spacing:.06em;line-height:1}
.sub{margin:6px 0 0;font-size:14px;color:var(--ink2);letter-spacing:.02em}
.modes{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.modes button{all:unset;cursor:pointer;font-size:14px;font-weight:600;padding:0 16px;height:40px;display:flex;align-items:center;border-radius:999px;color:var(--ink2);transition:background .2s,color .2s}
.modes button[aria-pressed="true"]{background:var(--ink);color:#fff}
.modes button:focus-visible{outline:2px solid var(--c-transition);outline-offset:2px}

/* ---------- table ---------- */
.scroller{position:relative}
.table{display:grid;grid-template-columns:repeat(18,minmax(0,1fr));grid-template-rows:auto repeat(7,auto) 14px repeat(2,auto);gap:4px;position:relative}
.cell{all:unset;box-sizing:border-box;position:relative;aspect-ratio:1/1.1;background:#fff;border-radius:6px;cursor:pointer;
  --c:var(--c-unknown);--s:1;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) var(--mix,30%),#fff),color-mix(in srgb,var(--c) calc(var(--mix,30%) - 12%),#fff));
  box-shadow:inset 0 -3px 0 var(--c),0 1px 1px rgba(0,0,0,.05);
  transform:scale(var(--s));transition:transform .18s cubic-bezier(.2,.8,.3,1),opacity .25s,filter .25s,box-shadow .2s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;overflow:hidden;will-change:transform}
.cell .z{position:absolute;left:5px;top:3px;font-family:var(--num);font-size:10px;font-weight:600;color:rgba(29,33,41,.62)}
.cell .sym{font-family:var(--num);font-weight:700;font-size:clamp(15px,1.7vw,22px);line-height:1;margin-top:6px;letter-spacing:-.01em}
.cell .nm{font-family:var(--zh);font-size:11px;margin-top:2px;line-height:1.1}
.cell .ms{font-family:var(--num);font-size:10px;letter-spacing:-.02em;color:rgba(29,33,41,.6);margin-top:1px}
.cell:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.cell.big{z-index:5;box-shadow:inset 0 -3px 0 var(--c),0 10px 24px -6px rgba(20,24,35,.35)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--ink),inset 0 -4px 0 var(--c),0 12px 26px -8px rgba(20,24,35,.4);z-index:6}
.table.mass .cell{--mix:62%}
.table.mass .cell .sym,.table.mass .cell .nm{color:var(--fg,#1d2129)}
.table.filtering .cell:not(.match){opacity:.18;filter:grayscale(1)}
.cell.ph{cursor:default;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 20%,#fff) 0 4px,#fff 4px 8px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 60%,#fff)}
.cell.ph .sym{font-size:11px;font-weight:600}
.glabel{font-family:var(--num);font-size:11px;color:var(--ink2);text-align:center;align-self:end;padding-bottom:1px;font-weight:600;line-height:1.2}
.glabel small{display:block;font-size:10px;font-weight:500;opacity:.7}
.plabel{position:absolute;left:-20px;top:50%;transform:translateY(-50%);font-family:var(--num);font-size:11px;color:var(--ink2);font-weight:600}
@keyframes cellin{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:scale(var(--s))}}
.cell.in{animation:cellin .45s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i) * 6ms)}

/* ---------- detail ---------- */
.detail{background:#fff;border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:auto 1fr auto;gap:14px 18px;padding:14px 16px;align-items:start;box-shadow:0 8px 24px -16px rgba(20,24,35,.35)}
.table .dslot{grid-column:3/13;grid-row:2/5;position:relative;margin:0 8px 10px}
.dslot .detail{position:absolute;inset:0;overflow:hidden;align-content:center}
.tile{--c:var(--c-unknown);width:104px;aspect-ratio:1/1.12;border-radius:10px;padding:8px 10px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c));color:#15181f;transition:background .3s}
.tile .tz{position:absolute;top:7px;left:10px;font-family:var(--num);font-weight:700;font-size:15px}
.tile .ts{font-family:var(--num);font-weight:800;font-size:44px;line-height:.95;letter-spacing:-.02em}
.tile .tm{font-family:var(--num);font-size:11px;font-weight:600;opacity:.75}
.info h2{margin:0;font-family:var(--zh);font-size:clamp(20px,2vw,26px);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.info h2 small{font-family:var(--num);font-size:13px;color:var(--ink2);font-weight:600;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#f0f1ec;color:var(--ink)}
.chip.cat{background:color-mix(in srgb,var(--c) 30%,#fff);box-shadow:inset 0 0 0 1px var(--c)}
.conf{font-family:Consolas,"Lucida Console",Menlo,monospace;font-size:13px;color:var(--ink)}
.conf sup{font-size:10px}
.note{margin:6px 0 0;font-size:13.5px;line-height:1.55;max-width:34em;color:#3a3f4a;font-family:var(--zh)}
.bohr{width:132px;height:132px;flex:none;align-self:center}
.stats{display:none;flex-direction:column;gap:6px;align-self:center;border-left:1px solid var(--line);padding-left:16px}
.stats div{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--ink2);white-space:nowrap}
.stats b{font-family:var(--num);font-size:22px;color:var(--ink);font-weight:700;min-width:2.2ch;text-align:right;line-height:1}
.bohr .orb{fill:none;stroke:#c9ccd4;stroke-width:.8}
.bohr .sh{transform-origin:60px 60px;transform-box:view-box;animation:rot var(--d) linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.bohr .e{fill:var(--ink)}
.dmobile{display:none;margin-bottom:12px}

/* ---------- legend ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:18px;align-items:center}
.legend .lh{font-size:12px;color:var(--ink2);margin-right:6px;font-weight:600;letter-spacing:.08em}
.lg{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:0 12px;height:40px;border-radius:8px;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--line);font-family:var(--zh)}
.lg i{width:14px;height:14px;border-radius:4px;background:var(--c);display:block}
.lg[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.lg:focus-visible{outline:2px solid var(--c-transition);outline-offset:2px}
.scale{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);font-weight:600}
.scale b{display:block;width:180px;height:12px;border-radius:6px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
.hint{font-size:12px;color:var(--ink2);margin:0 0 8px;display:none}
@media (prefers-reduced-motion:reduce){.cell.in{animation:none}.bohr .sh{animation:none}.cell{transition:none}}

@media (max-width:900px){
  .table .dslot{display:none}
  .dmobile{display:grid}
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:10px 16px 14px 36px;scroll-padding-left:36px;
    background:linear-gradient(90deg,var(--bg),transparent 16px) left/24px 100% no-repeat local}
  .table{width:1060px}
  .hint{display:flex;align-items:center;gap:6px}
}
@media (max-width:520px){
  .detail{grid-template-columns:auto 1fr;padding:12px}
  .bohr{display:none}
  .nchip{display:none}
  .stats{display:flex;grid-column:1/-1;flex-direction:row;justify-content:space-between;border-left:0;border-top:1px solid var(--line);padding:10px 0 0}
  .stats div{flex-direction:column;align-items:center;gap:2px}
  .tile{width:88px}
  .tile .ts{font-size:36px}
  .modes{width:100%}
  .modes button{flex:1;justify-content:center;padding:0 8px}
  .scale b{width:120px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">
        <div class="mini" aria-hidden="true"><i style="background:var(--c-alkali)"></i><i></i><i style="background:var(--c-noble)"></i><i style="background:var(--c-alkaline)"></i><i style="background:var(--c-transition)"></i><i style="background:var(--c-halogen)"></i></div>
        <h1>元素週期表</h1>
      </div>
      <p class="sub">一百一十八種原子，一張會放大的桌子。滑過去看看，點一下釘住。</p>
    </div>
    <div class="modes" role="group" aria-label="著色方式">
      <button type="button" data-mode="cat" aria-pressed="true">分類</button>

  <div class="detail dmobile" id="detailM" aria-live="polite"></div>

  <div class="scroller" id="scroller">
    <div class="table" id="table" role="grid" aria-label="元素週期表">
      <div class="dslot"><div class="detail" id="detailD" aria-live="polite"></div></div>
    </div>
  </div>

  <div class="legend" id="legend"></div>
  <div class="foot">
    <span>方向鍵移動・Enter 釘選・Esc 取消篩選</span>

  </div>
</div>

var CATS={

39:'瑞典小村伊特比一個村子就貢獻了四個元素名：釔、鋱、鉺、鐿。',
43:'第一個人造元素，名字來自希臘文的「人工」。',
47:'所有元素中導電性最好的，只是太貴，電線才改用銅。',
50:'低溫下會「生病」崩成灰色粉末，這種現象叫錫疫。',
53:'加進食鹽裡預防甲狀腺腫，台灣從 1967 年起全面供應加碘鹽。',
54:'汽車 HID 大燈的藍白光來自它，也是太空船離子推進器的燃料。',
55:'原子鐘的心跳：一秒被定義為銫-133 振盪 9,192,631,770 次。',
60:'世界上最強的永久磁鐵是釹鐵硼，就藏在你的耳機裡。',
63:'歐元紙鈔在紫外燈下發光的防偽油墨，用的就是銪。',
64:'MRI 顯影劑的主角，讓醫生看得更清楚。',
74:'熔點 3422 °C，所有金屬中最高，所以被拿來做燈絲。',
78:'汽車觸媒轉化器裡的主角，默默把廢氣變乾淨。',
79:'人類有史以來開採的黃金，全部熔在一起只夠填滿幾座奧運泳池。',
80:'常溫下唯一的液態金屬，古代煉丹師最愛的「水銀」。',
82:'古羅馬人用它做水管，英文 plumbing 就源自拉丁文 plumbum。',
84:'居禮夫人以祖國波蘭命名的元素。',
88:'1920 年代被塗在錶面上發光，也害慘了塗錶的女工。',
90:'以北歐雷神索爾（Thor）命名。',
92:'以天王星命名。一公斤鈾-235 完全分裂的能量，約等於燒掉三千噸煤。',
94:'以冥王星命名——後來冥王星被降級了，鈽倒是沒有。',
99:'以愛因斯坦命名，最早是在氫彈試爆的落塵裡找到的。',
101:'以門得列夫命名：週期表的發明人，終於住進了自己的表格。',
113:'日本理化學研究所發現，第一個由亞洲團隊命名的元素。',
118:'目前已知最重的元素，史上只做出過少數幾顆原子，壽命不到一毫秒。'
};

// electron configuration (aufbau + known exceptions)
var ORB=['1s','2s','2p','3s','3p','4s','3d','4p','5s','4d','5p','6s','4f','5d','6p','7s','5f','6d','7p'];
var CAP={s:2,p:6,d:10,f:14};
var EXC={24:[['4s','3d',1]],29:[['4s','3d',1]],41:[['5s','4d',1]],42:[['5s','4d',1]],44:[['5s','4d',1]],45:[['5s','4d',1]],46:[['5s','4d',2]],47:[['5s','4d',1]],
  57:[['4f','5d',1]],58:[['4f','5d',1]],64:[['4f','5d',1]],78:[['6s','5d',1]],79:[['6s','5d',1]],89:[['5f','6d',1]],90:[['5f','6d',2]],91:[['5f','6d',1]],92:[['5f','6d',1]],93:[['5f','6d',1]],96:[['5f','6d',1]],103:[['6d','7p',1]]};
var NOBLE=[2,10,18,36,54,86];
function config(z){
  var left=z,o={},i;
  for(i=0;i<ORB.length&&left>0;i++){var n=Math.min(CAP[ORB[i][1]],left);o[ORB[i]]=n;left-=n;}
  (EXC[z]||[]).forEach(function(e){o[e[0]]-=e[2];o[e[1]]=(o[e[1]]||0)+e[2];if(!o[e[0]])delete o[e[0]];});
  return o;
}
function sup(n){return '<sup>'+n+'</sup>';}
function confStr(z){
  var core=0;for(var i=NOBLE.length-1;i>=0;i--) if(NOBLE[i]<z){core=NOBLE[i];break;}
  var full=config(z),base=core?config(core):{},out=core?'['+SYM[core-1]+'] ':'';
  ORB.forEach(function(k){ if(full[k]&&full[k]!==(base[k]||0)) out+=k+sup(full[k])+' '; });
  return out.trim();
}
function shells(z){
  var c=config(z),s=[0,0,0,0,0,0,0];
  for(var k in c) s[+k[0]-1]+=c[k];
  while(s.length&&!s[s.length-1]) s.pop();
  return s;
}

// position in the 18-column grid
var PB=[2,10,18,36,54,86,118];
function pos(z){
  var p=0;while(z>PB[p])p++;
  var start=p?PB[p-1]+1:1,i=z-start,g;
  if(p===0) g=z===1?1:18;
  else if(p<=2) g=i<2?i+1:i+11;
  else if(p<=4) g=i+1;
  else{
    if(i<2) g=i+1;
    else if(i<17) return {row:p===5?9:10,col:i+1,period:p+1};
    else g=i-13;
  }
  return {row:p+1,col:g,period:p+1};
}

var massNum=MASS.map(function(m){return parseFloat(m.replace(/[\[\]]/g,''));});
// most abundant isotope (mass number), used for the neutron count; others: rounded standard weight / longest-lived isotope
var ISO=[1,4,7,9,11,12,14,16,19,20,23,24,27,28,31,32,35,40,39,40,45,48,51,52,55,56,59,58,63,64,69,74,75,80,79,84,85,88,89,90,93,98,98,102,103,106,107,114,115,120,121,130,127,132,133,138,139,140,141,142,145,152,153,158,159,164,165,166,169,174,175,180,181,184,187,192,193,195,197,202,205,208,209];
ISO[89]=232;ISO[90]=231;ISO[91]=238;
function neutrons(z){return (ISO[z-1]||Math.round(massNum[z-1]))-z;}
function massColor(z){
  var t=Math.pow(massNum[z-1]/294,.75);
  var a=[255,238,186],b=[196,64,86],c=[58,32,96];
  var u=t<.55?t/.55:(t-.55)/.45,from=t<.55?a:b,to=t<.55?b:c;
  return 'rgb('+from.map(function(v,j){return Math.round(v+(to[j]-v)*u);}).join(',')+')';
}

// build cells
var els=[],frag=document.createDocumentFragment(),mode='cat';
for(var z=1;z<=118;z++){
  var P=pos(z),b=document.createElement('button');
  b.type='button';b.className='cell in';b.setAttribute('role','gridcell');
  b.style.gridColumn=P.col;b.style.gridRow=P.row+1;b.style.setProperty('--i',z);
  b.dataset.z=z;b.dataset.cat=catOf(z);b.tabIndex=z===1?0:-1;
  b.setAttribute('aria-label',ZH[z-1]+' '+SYM[z-1]+'，原子序 '+z);
  b.innerHTML='<span class="z">'+z+'</span><span class="sym">'+SYM[z-1]+'</span><span class="nm">'+ZH[z-1]+'</span><span class="ms">'+MASS[z-1]+'</span>';
  frag.appendChild(b);els[z]=b;
}
[['57–71','鑭系',6,'lanth'],['89–103','錒系',7,'actin']].forEach(function(p){
  var d=document.createElement('div');d.className='cell ph';d.style.gridColumn=3;d.style.gridRow=p[2]+1;d.style.setProperty('--c',CATS[p[3]].c);
  d.innerHTML='<span class="sym">'+p[0]+'</span><span class="nm">'+p[1]+'</span>';d.setAttribute('aria-hidden','true');frag.appendChild(d);
});
// group numbers (IUPAC 1–18, with the old CAS A/B names underneath) and period numbers
var CAS=['IA','IIA','IIIB','IVB','VB','VIB','VIIB','VIIIB','VIIIB','VIIIB','IB','IIB','IIIA','IVA','VA','VIA','VIIA','VIIIA'];
for(var g=1;g<=18;g++){var gl=document.createElement('div');gl.className='glabel';gl.style.gridColumn=g;gl.style.gridRow=1;gl.innerHTML=g+'<small>'+CAS[g-1]+'</small>';gl.setAttribute('aria-hidden','true');frag.appendChild(gl);}
for(var pr=1;pr<=7;pr++){var pl=document.createElement('div');pl.className='plabel';pl.style.gridColumn='1 / span 1';pl.style.gridRow=(pr+1)+' / span 1';pl.textContent=pr;pl.setAttribute('aria-hidden','true');frag.appendChild(pl);}
table.appendChild(frag);
setTimeout(function(){for(var z=1;z<=118;z++) els[z].classList.remove('in');},1400);

function paint(){
  table.classList.toggle('mass',mode==='mass');
  for(var z=1;z<=118;z++){
    var c;
    if(mode==='cat') c=CATS[els[z].dataset.cat].c;
    else if(mode==='state') c=STATES[stateOf(z)].hex;
    else c=massColor(z);
    els[z].style.setProperty('--c',c);
    els[z].style.setProperty('--fg',mode==='mass'&&massNum[z-1]>150?'#fff':'#1d2129');
  }
  buildLegend();
}

// ---------- legend / filter ----------
var legend=document.getElementById('legend'),filter=null;
function buildLegend(){
  if(!legend) return;
  var h='';
  if(mode==='cat'){
    h='<span class="lh">分類</span>';
    for(var k in CATS) h+='<button class="lg" type="button" data-f="'+k+'" aria-pressed="'+(filter===k)+'" style="--c:'+CATS[k].c+'"><i></i>'+CATS[k].zh+'</button>';
  } else if(mode==='state'){
    h='<span class="lh">攝氏 25 度、一大氣壓下</span>';
    for(var s in STATES) h+='<button class="lg" type="button" data-f="'+s+'" aria-pressed="'+(filter===s)+'" style="--c:'+STATES[s].hex+'"><i></i>'+STATES[s].zh+'</button>';
  } else {
    h='<span class="scale">1.008<b style="background:linear-gradient(90deg,'+massColor(1)+','+massColor(40)+','+massColor(80)+','+massColor(118)+')"></b>294 u</span><span class="lh" style="margin-left:12px">顏色越深，原子越重</span>';
  }
  legend.innerHTML=h;
  applyFilter();
}
function applyFilter(){
  table.classList.toggle('filtering',!!filter);
  for(var z=1;z<=118;z++){
    var m=filter&&(mode==='cat'?els[z].dataset.cat===filter:stateOf(z)===filter);
    els[z].classList.toggle('match',!!m);
  }
}
if(legend) legend.addEventListener('click',function(e){
  var b=e.target.closest('.lg');if(!b) return;
  filter=filter===b.dataset.f?null:b.dataset.f;
  Array.prototype.forEach.call(legend.querySelectorAll('.lg'),function(x){x.setAttribute('aria-pressed',String(x.dataset.f===filter));});
  applyFilter();
});
Array.prototype.forEach.call(document.querySelectorAll('.modes button'),function(b){
  b.addEventListener('click',function(){
    mode=b.dataset.mode;filter=null;
    Array.prototype.forEach.call(document.querySelectorAll('.modes button'),function(x){x.setAttribute('aria-pressed',String(x===b));});
    paint();show(shown||pinned);
  });
});

// ---------- detail ----------
var dD=document.getElementById('detailD'),dM=document.getElementById('detailM');
var pinned=6,shown=6;
function bohr(z){
  var s=shells(z),h='<svg class="bohr" viewBox="0 0 120 120" aria-hidden="true">';
  s.forEach(function(n,i){
    var r=12+(i+1)*(46/s.length);h+='<circle class="orb" cx="60" cy="60" r="'+r+'"/>';
    h+='<g class="sh" style="--d:'+(6+i*4)+'s;animation-direction:'+(i%2?'reverse':'normal')+'">';
    for(var k=0;k<n;k++){var a=k/n*Math.PI*2-Math.PI/2;h+='<circle class="e" cx="'+(60+Math.cos(a)*r).toFixed(1)+'" cy="'+(60+Math.sin(a)*r).toFixed(1)+'" r="'+(n>18?1.1:1.6)+'"/>';}
    h+='</g>';
  });
  h+='<circle cx="60" cy="60" r="9" fill="'+currentHex(z)+'"/><text x="60" y="63.5" text-anchor="middle" font-size="9" font-weight="700" font-family="Segoe UI,Arial,sans-serif" fill="#1d2129">'+z+'</text></svg>';
  return h;
}
function currentHex(z){return mode==='cat'?CATS[catOf(z)].hex:mode==='state'?STATES[stateOf(z)].hex:massColor(z);}
function show(z){
  if(!z) return;shown=z;
  var k=catOf(z),C=CATS[k],P=pos(z),st=STATES[stateOf(z)];
  var col=currentHex(z);
  var note=NOTES[z]||C.d;
  var sh=shells(z).join('・');
  var html='<div class="tile" style="--c:'+col+'"><span class="tz">'+z+'</span><span class="ts">'+SYM[z-1]+'</span><span class="tm">'+MASS[z-1]+'</span></div>'+
    '<div class="info"><h2>'+ZH[z-1]+'<small>'+SYM[z-1]+' · 第 '+P.period+' 週期'+(P.row<8?' · 第 '+P.col+' 族':'')+'</small></h2>'+
    '<div class="chips"><span class="chip cat" style="--c:'+C.c+'">'+C.zh+'</span><span class="chip">'+st.zh+'</span><span class="chip nchip">中子 '+neutrons(z)+'</span><span class="chip">殼層 '+sh+'</span></div>'+
    '<div class="conf">'+confStr(z)+'</div><p class="note">'+note+'</p></div>'+
    '<div class="stats"><div><b>'+z+'</b>質子</div><div><b>'+neutrons(z)+'</b>中子（最常見）</div><div><b>'+z+'</b>電子</div></div>'+bohr(z);
  if(dD) dD.innerHTML=html;
  if(dM) dM.innerHTML=html;
}

// ---------- magnifier ----------
var centers=null,raf=0,px=0,py=0,finePointer=window.matchMedia&&window.matchMedia('(hover:hover) and (pointer:fine)').matches;
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function measure(){
  centers=[];
  for(var z=1;z<=118;z++){var r=els[z].getBoundingClientRect();centers[z]=[r.left+r.width/2,r.top+r.height/2,r.width];}
}
function lens(){
  raf=0;if(!centers) measure();
  var best=0,bd=1e9;
  for(var z=1;z<=118;z++){
    var c=centers[z],dx=(c[0]-px)/c[2],dy=(c[1]-py)/c[2],d2=dx*dx+dy*dy;
    var s=reduce?1:1+0.62*Math.exp(-d2/0.9);
    if(s<1.015) s=1;
    els[z].style.setProperty('--s',s.toFixed(3));
    els[z].classList.toggle('big',s>1.25);
    els[z].style.zIndex=s>1?String(Math.round(s*10)):'';
    if(d2<bd){bd=d2;best=z;}
  }
  if(bd<0.36&&best!==shown) show(best);
}
function resetLens(){
  for(var z=1;z<=118;z++){els[z].style.setProperty('--s',z===pinned&&!finePointer?'1.18':'1');els[z].classList.remove('big');els[z].style.zIndex='';}
  show(pinned);
}
table.addEventListener('pointermove',function(e){
  if(e.pointerType!=='mouse') return;
  px=e.clientX;py=e.clientY;if(!raf) raf=requestAnimationFrame(lens);
});
table.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse') centers=null;});
table.addEventListener('pointerleave',function(e){if(e.pointerType==='mouse'){if(raf){cancelAnimationFrame(raf);raf=0;}resetLens();}});
window.addEventListener('scroll',function(){centers=null;},{passive:true});
window.addEventListener('resize',function(){centers=null;});
var sc=document.getElementById('scroller');if(sc) sc.addEventListener('scroll',function(){centers=null;},{passive:true});

function pin(z){
  if(els[pinned]) els[pinned].classList.remove('sel');
  pinned=z;els[z].classList.add('sel');show(z);
  if(!finePointer){for(var k=1;k<=118;k++) els[k].style.setProperty('--s',k===z?'1.18':'1');}
}
table.addEventListener('click',function(e){
  var b=e.target.closest('.cell');if(!b||!b.dataset.z) return;
  pin(+b.dataset.z);
  if(dM&&getComputedStyle(dM).display!=='none'){var r=dM.getBoundingClientRect();if(r.top<0) dM.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});}
});

// keyboard: arrows move across the grid
var grid={};
for(var z2=1;z2<=118;z2++){var p2=pos(z2);grid[p2.row+','+p2.col]=z2;}
function find(row,col,dr,dc){
  for(var s=0;s<12;s++){row+=dr;col+=dc;if(row<1||row>10||col<1||col>18) return 0;if(row===8) continue;if(grid[row+','+col]) return grid[row+','+col];}
  return 0;
}
table.addEventListener('keydown',function(e){
  var b=e.target.closest&&e.target.closest('.cell');if(!b||!b.dataset.z) return;
  var z=+b.dataset.z,P=pos(z),n=0;
  if(e.key==='ArrowRight') n=find(P.row,P.col,0,1)||(z<118?z+1:0);
  else if(e.key==='ArrowLeft') n=find(P.row,P.col,0,-1)||(z>1?z-1:0);
  else if(e.key==='ArrowDown') n=find(P.row,P.col,1,0);
  else if(e.key==='ArrowUp') n=find(P.row,P.col,-1,0);
  else if(e.key==='Escape'){filter=null;buildLegend();return;}
  else return;
  e.preventDefault();
  if(n&&els[n]){b.tabIndex=-1;els[n].tabIndex=0;els[n].focus();show(n);}
});
table.addEventListener('focusin',function(e){var b=e.target.closest('.cell');if(b&&b.dataset.z) show(+b.dataset.z);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&filter){filter=null;buildLegend();}});

paint();pin(6);
})();
</script>
</body>
</html>
