<!doctype html>
<!--
WIND / 草原 — adjustable parameters (edit CONFIG below)
GRASS_COUNT: 120000 blades (60000 on touch or <=4-core devices); WIND_STRENGTH: 0.85; SUN_AZIMUTH_DEG: 44;
SUN_ELEVATION_DEG: 24. The scene uses only Three.js from its pinned CDN URL.
For best results use a WebGL2 browser. Pixel ratio is capped for a practical 60fps target;
actual frame rate depends on the device and browser.
-->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#d9e2d0">
  <title>WIND / 一片會呼吸的草原</title>
  <style>
    :root{color-scheme:light;--ink:#263c32;--milk:#f4f1e7}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Georgia,"Noto Serif TC","Songti TC",serif;color:var(--ink);background:#dae6dc}button,input{font:inherit}#scene{display:block;width:100vw;height:100dvh;touch-action:none}#flare{position:fixed;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;background:radial-gradient(circle at var(--sun-x,50%) var(--sun-y,50%),rgba(255,244,204,.42) 0,rgba(250,240,197,.13) 6%,rgba(255,255,255,0) 18%);transition:opacity .25s}
    .grain{position:fixed;inset:0;pointer-events:none;opacity:.1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E")}
    .top,.bottom{position:fixed;left:clamp(20px,4vw,68px);right:clamp(20px,4vw,68px);display:flex;justify-content:space-between;gap:20px;pointer-events:none}.top{top:clamp(20px,4vw,48px);align-items:flex-start}.bottom{bottom:clamp(20px,4vw,42px);align-items:flex-end;color:var(--milk);text-shadow:0 1px 2px rgba(18,32,24,.6),0 0 16px rgba(18,32,24,.5)}.top>* ,.bottom>*{pointer-events:auto}
    .control-label{font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}h1{font-size:clamp(35px,5vw,76px);font-weight:400;line-height:1.08;letter-spacing:-.055em;margin:0;text-shadow:0 1px 2px rgba(0,0,0,.15)}h1 em{font-style:italic;font-weight:400}.subtitle{font-size:clamp(12px,1.2vw,15px);letter-spacing:.09em;line-height:1.8;margin:17px 0 0;max-width:430px;text-shadow:0 1px 2px rgba(247,243,219,.7)}
    /* The controls sit straight on the sky: no card, just a soft light halo under the ink for legibility. */
    .panel{width:222px;padding:4px 0;text-shadow:0 1px 2px rgba(247,243,219,.8),0 0 10px rgba(247,243,219,.55);transition:width .62s cubic-bezier(.3,1.35,.45,1)}
    .panel-title{all:unset;box-sizing:border-box;width:100%;min-height:24px;cursor:pointer;font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;letter-spacing:.2em;font-weight:700;display:flex;justify-content:space-between;align-items:center}.panel-title span{opacity:.5;display:inline-block;transition:transform .45s cubic-bezier(.3,1.35,.45,1)}.panel-title:focus-visible{outline:2px solid var(--ink);outline-offset:6px;border-radius:4px}
    .controls{display:grid;grid-template-rows:1fr;transition:grid-template-rows .55s cubic-bezier(.3,1.2,.45,1)}.controls>div{overflow:hidden;min-height:0}.controls .control:first-child{margin-top:16px}
    .panel.collapsed{width:150px}.panel.collapsed .controls{grid-template-rows:0fr}.panel.collapsed .panel-title span{transform:rotate(180deg)}
    .control{display:block;margin:12px 0}.control-label{display:flex;justify-content:space-between;letter-spacing:.13em}.control-label output{letter-spacing:0;font-weight:500}input[type=range]{display:block;width:100%;height:24px;margin:2px 0 -3px;accent-color:#697e59;cursor:pointer}
    .note{display:flex;flex-direction:column;gap:9px}.note .serif{font-size:14px;letter-spacing:.04em}.readout{text-align:right}.hint{font-size:12px;letter-spacing:.06em}
    .error{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,calc(100% - 40px));padding:22px;text-align:center;background:var(--milk);border:1px solid #8f9a8c;line-height:1.7;display:none}.error.visible{display:block}
    @media(max-width:700px){.top,.bottom{left:18px;right:18px}.top{top:20px}.bottom{bottom:22px}.panel{width:min(180px,44vw);padding:4px 0}.panel.collapsed{width:min(150px,40vw)}.subtitle{max-width:190px}.control{margin:6px 0}.note .serif,.hint{font-size:11px}}@media(max-width:470px){h1{font-size:35px}.panel{width:150px}.subtitle{display:none}.note .serif{max-width:160px}}@media(prefers-reduced-motion:reduce){#flare,.panel,.controls,.panel-title span{transition:none}}
  .field-actions{display:flex;gap:6px;margin-top:12px}.field-actions button{flex:1;border:1px solid #5a715b;background:#f0eee4b8;color:#263c32;font:11px system-ui,sans-serif;min-height:36px;padding:6px;border-radius:6px;cursor:pointer}.field-actions button[aria-pressed=true]{background:#36543c;color:#f9f3e0}#scene:focus-visible,input:focus-visible,.field-actions button:focus-visible{outline:3px solid #e6bb65;outline-offset:3px}@media(pointer:coarse){input[type=range],.panel-title,.field-actions button{min-height:44px}}
  </style>
</head>
<body>
  <canvas id="scene" tabindex="0" aria-label="互動草原。方向鍵環視，W 和 S 前後移動，Home 回到起點。"></canvas><div id="flare"></div><div class="grain"></div>
  <header class="top">
    <div><h1>WIND<br><em>草原</em></h1><p class="subtitle">風走過的地方，草會先知道。<br>移動視線，蹲低穿過草間。</p></div>
    <section class="panel" id="panel" aria-label="環境控制">
      <button class="panel-title" id="panel-toggle" type="button" aria-expanded="true" aria-controls="controls">ATMOSPHERE <span aria-hidden="true">▴</span></button>
      <div class="controls" id="controls"><div>
      <label class="control"><span class="control-label">風力 <output id="wind-value">0.85</output></span><input id="wind" type="range" min="0" max="1.6" step="0.01" value="0.85" aria-label="風力"></label>
      <label class="control"><span class="control-label">日照方位 <output id="azimuth-value">44°</output></span><input id="azimuth" type="range" min="-90" max="90" step="1" value="44" aria-label="日照方位"></label>
      <label class="control"><span class="control-label">太陽高度 <output id="elevation-value">24°</output></span><input id="elevation" type="range" min="5" max="75" step="1" value="24" aria-label="太陽高度"></label>
      <div class="field-actions"><button id="motion-toggle" type="button" aria-pressed="false">暫停動態</button><button id="home-view" type="button">回到起點</button></div></div></div>
    </section>
  </header>
  <footer class="bottom"><div class="note"><span class="serif">滑鼠環視 · 滾輪前進 · 鍵盤 W / S 漫遊</span></div><div class="readout"><div class="hint" id="travel">漫遊中 · 0 m</div></div></footer>
  <div class="error" id="error" role="alert">此頁需要支援 WebGL2 的瀏覽器與網路連線，才能載入 Three.js 並呈現草原。</div>
  <script type="module">
    let THREE;
    try { THREE = await import('../vendor/three-0.186.0/three.module.js'); }
    catch { try { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js'); } catch (cause) { document.getElementById('error').classList.add('visible'); throw cause; } }

    // Touch devices and machines with four or fewer cores grow half the blades.
    const LIGHT_DEVICE = matchMedia('(pointer:coarse)').matches || (navigator.hardwareConcurrency||8) <= 4;
    const CONFIG = Object.freeze({ GRASS_COUNT:LIGHT_DEVICE?60000:120000, WIND_STRENGTH:0.85, SUN_AZIMUTH_DEG:44, SUN_ELEVATION_DEG:24, MAX_PIXEL_RATIO:1.25 });
    const canvas = document.getElementById('scene');
    const error = document.getElementById('error');
    const motionPreference=matchMedia('(prefers-reduced-motion: reduce)');let reducedMotion=motionPreference.matches,motionPaused=reducedMotion;
    let renderer;
    try { renderer = new THREE.WebGLRenderer({canvas,antialias:false,alpha:false,powerPreference:'high-performance'}); }
    catch (cause) { error.classList.add('visible'); throw cause; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,CONFIG.MAX_PIXEL_RATIO));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(65,1,.07,650);
    const sunDir = new THREE.Vector3();
    const sunUniform = {value:sunDir}, cloudUniform = {value:new THREE.Vector2(72,122)};
    function terrainHeight(x,z){return -.09 + .23*Math.sin(x*.047+z*.012)*Math.cos(z*.039) + .13*Math.sin(x*.105-z*.071);}
    const skyColor = new THREE.Color(0xc5dcd4);
    scene.background = skyColor;

    const commonNoise = `
      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
      // One thin cloud deck CLOUD_H up, drifting downwind. The sky draws it; the field samples it along the sun ray for its shadow.
      const float CLOUD_H=110.;
      float cloudCover(vec2 p){p=vec2(dot(p,vec2(.845,.534)),dot(p,vec2(-.534,.845))*1.7);float n=noise(p*.03)*.68+noise(p*.075+3.7)*.32;return smoothstep(.42,.7,n);}
    `;
    const bladeGeometry = new THREE.BufferGeometry();
    const bladePositions = [], bladeHeights = [];
    const sections = 3;
    for(let i=0;i<sections;i++){
      const a=i/sections,b=(i+1)/sections;
      const wa=(1-a)*.5,wb=(1-b)*.5;
      bladePositions.push(-wa,a,0, wa,a,0, -wb,b,0, wa,a,0, wb,b,0, -wb,b,0);
      for(let j=0;j<6;j++)bladeHeights.push(j===2||j===4||j===5?b:a);
    }
    bladeGeometry.setAttribute('position',new THREE.Float32BufferAttribute(bladePositions,3));
    bladeGeometry.setAttribute('bladeHeight',new THREE.Float32BufferAttribute(bladeHeights,1));
    bladeGeometry.computeBoundingSphere();
    const grassUniforms={uTime:{value:0},uWind:{value:CONFIG.WIND_STRENGTH},uSun:sunUniform,uCloud:cloudUniform,uCamera:{value:new THREE.Vector3()},uHorizon:{value:new THREE.Color(0xb6c9b3)}};
    const grassMaterial=new THREE.RawShaderMaterial({side:THREE.DoubleSide,transparent:false,depthWrite:true,uniforms:grassUniforms,
      vertexShader:`precision highp float;
        attribute vec3 position;attribute float bladeHeight;attribute mat4 instanceMatrix;attribute vec2 aTuft;
        uniform mat4 modelMatrix,viewMatrix,projectionMatrix;uniform float uTime,uWind;uniform vec3 uCamera,uSun;uniform vec2 uCloud;
        varying float vHeight,vSeed,vDistance,vFacing,vWave,vAcross,vTint,vShade;varying vec3 vWorld,vNormal;
        ${commonNoise}
        void main(){
          vec3 base=(modelMatrix*instanceMatrix*vec4(0.,0.,0.,1.)).xyz;
          vec4 wp=modelMatrix*instanceMatrix*vec4(position,1.);
          float broad=noise(base.xz*.055+vec2(uTime*.105,uTime*.045));
          float fine=noise(base.xz*.21-vec2(uTime*.29,uTime*.17));
          float front=smoothstep(.35,.72,broad);
          float wave=(broad*.65+fine*.35-.42)*(.45+front*.75);
          // Real blades arch under their own weight: a per-blade static lean along the blade's face normal.
          vec3 facing=(modelMatrix*instanceMatrix*vec4(0.,0.,1.,0.)).xyz;float tall=length((instanceMatrix*vec4(0.,1.,0.,0.)).xyz);
          float lean=(.12+.3*hash(base.xz*.71))*tall*aTuft.y;wp.xz+=normalize(facing.xz+1e-4)*lean*bladeHeight*bladeHeight;wp.y-=lean*.35*bladeHeight*bladeHeight;
          wp.xz+=vec2(.76,.48)*wave*uWind*pow(bladeHeight,1.7)*.45;
          vHeight=bladeHeight;vSeed=hash(base.xz*.137);vTint=aTuft.x;vDistance=distance(uCamera.xz,base.xz);vShade=cloudCover(base.xz+uSun.xz/max(uSun.y,.45)*CLOUD_H-uCloud);
          vAcross=position.x/max(.001,.5*(1.-bladeHeight));vNormal=normalize(vec3(facing.x,-2.*lean*bladeHeight/max(tall,.1),facing.z));vWorld=wp.xyz;vWave=wave;vFacing=dot(normalize(vec3(.76,0.,.48)),normalize(uCamera-base));
          gl_Position=projectionMatrix*viewMatrix*wp;
        }`,
      fragmentShader:`precision highp float;
        uniform vec3 uSun,uCamera,uHorizon;varying float vHeight,vSeed,vDistance,vFacing,vWave,vAcross,vTint,vShade;varying vec3 vWorld,vNormal;
        void main(){
          float density=1.-smoothstep(38.,108.,vDistance);
          if(vSeed>density)discard;
          vec3 root=vec3(.095,.20,.09), tip=vec3(.67,.70,.29);
          vec3 color=mix(root,tip,pow(vHeight,.83));
          color*=.84+.3*vSeed+.12*vWave;color*=1.+vTint*vec3(.07,.05,-.07);
          float dry=step(.9,fract(vSeed*7.31));color=mix(color,vec3(.62,.56,.34)*(.55+.45*vHeight),dry*.65);
          float back=max(0.,dot(normalize(uSun),normalize(vWorld-uCamera)));
          // Under a passing cloud the blades lose direct sun (glow-through, diffuse, glint) and keep only cool skylight.
          float sunVis=1.-.7*vShade;
          float transmit=pow(back,3.)*(.21+.45*vHeight)*sunVis;
          color+=vec3(.25,.29,.045)*transmit;
          float diffuse=abs(dot(normalize(vNormal),normalize(uSun)))*sunVis;color*=.65+.35*diffuse;color*=mix(vec3(1.),vec3(.64,.7,.8),vShade);color*=.86+.14*pow(1.-abs(vAcross),2.);color+=vec3(.025,.035,.008)*pow(1.-abs(vAcross),12.)*vHeight;color*=.8+.2*smoothstep(0.,.3,vHeight);
          // Waxy cuticle: a tight sun glint on some blades, strongest on the bent upper half, so gusts read as a travelling sheen.
          vec3 hv=normalize(normalize(uSun)+normalize(uCamera-vWorld));float glint=pow(abs(dot(normalize(vNormal),hv)),48.)*smoothstep(.35,1.,vHeight)*(.3+.7*vSeed);color+=vec3(.95,.9,.7)*glint*.14*sunVis*(1.-smoothstep(5.,16.,vDistance));
          float haze=smoothstep(30.,140.,vDistance)*.73;
          color=mix(color,uHorizon,haze);
          gl_FragColor=vec4(color,1.);
        }`});
    const grass=new THREE.InstancedMesh(bladeGeometry,grassMaterial,CONFIG.GRASS_COUNT);
    grass.frustumCulled=false;
    grass.instanceMatrix.setUsage(THREE.StaticDrawUsage);
    const dummy=new THREE.Object3D();
    // Stable scatter: each blade is positioned once. Animation updates shader uniforms only.
    function rand(i,s){let x=Math.sin(i*12.9898+s*78.233)*43758.5453;return x-Math.floor(x);}
    // Per blade: x = tuft colour shift, y = lean multiplier (1 for the open field).
    const tuftData=new Float32Array(CONFIG.GRASS_COUNT*2);let tufts=0,tuftLeft=0,tx=0,tz=0,tr=0,ts=0,tt=0;
    for(let i=0;i<CONFIG.GRASS_COUNT;i++){
      let x=(rand(i,1)-.5)*132,z=(rand(i,2)-.5)*160-25;
      // An additional near-camera belt keeps close blades dense without extending GPU cost to the horizon.
      if(i<CONFIG.GRASS_COUNT*.35){x=(rand(i,3)-.5)*38;z=(rand(i,4)-.5)*88-20;}
      let h=.44+rand(i,5)*.62, w=.022+rand(i,6)*.037, yaw=rand(i,7)*Math.PI*2, tint=0, lean=1;
      // The walk starts at z = 9 facing -z and turns at most ~75 degrees off axis, so blades past z = 12 or far out to the side
      // of the start are never on screen (about 34,600 of them at 120,000). They are regrown along the walk as low tufts:
      // 5-9 blades fanning out from one root, each tuft with its own height and colour, densest along the path.
      if(z>12||Math.abs(x)>3.5*(9.5-z)){
        if(!tuftLeft){tufts++;const g=Math.sqrt(-2*Math.log(1-.998*rand(tufts,21)))*Math.cos(6.2832*rand(tufts,22));
          tz=9-rand(tufts,23)*70;tx=Math.sin((9-tz)*.021)*.55+Math.max(-10,Math.min(10,g*3.2));
          tuftLeft=5+Math.floor(rand(tufts,24)*5);tr=.07+rand(tufts,25)*.13;ts=.75+rand(tufts,26)*.5;tt=rand(tufts,27)*2-1;}
        tuftLeft--;const a=rand(i,8)*6.2832,out=Math.sqrt(rand(i,9)),ox=Math.cos(a)*out*tr,oz=Math.sin(a)*out*tr;
        x=tx+ox;z=tz+oz;h=(.3+rand(i,5)*.34)*ts*(1.12-.4*out);w*=1.2;yaw=Math.atan2(ox,oz)+(rand(i,7)-.5)*.8;tint=tt;lean=.8+out*.9;
      }
      tuftData[i*2]=tint;tuftData[i*2+1]=lean;
      dummy.position.set(x,terrainHeight(x,z)-.015,z);
      dummy.rotation.set(0,yaw,0);
      dummy.scale.set(w,h,1);dummy.updateMatrix();grass.setMatrixAt(i,dummy.matrix);
    }
    bladeGeometry.setAttribute('aTuft',new THREE.InstancedBufferAttribute(tuftData,2));
    grass.instanceMatrix.needsUpdate=true;
    scene.add(grass);

    const groundUniforms={uTime:{value:0},uSun:sunUniform,uCloud:cloudUniform,uCamera:{value:new THREE.Vector3()},uHorizon:grassUniforms.uHorizon,uWind:grassUniforms.uWind};
    const groundGeometry=new THREE.PlaneGeometry(700,700,180,180);
    groundGeometry.rotateX(-Math.PI/2);
    const gp=groundGeometry.attributes.position;
    for(let i=0;i<gp.count;i++)gp.setY(i,terrainHeight(gp.getX(i),gp.getZ(i))-.03);
    gp.needsUpdate=true;groundGeometry.computeVertexNormals();
    const groundMaterial=new THREE.RawShaderMaterial({uniforms:groundUniforms,
      vertexShader:`precision highp float;
        attribute vec3 position;attribute vec3 normal;uniform mat4 modelMatrix,viewMatrix,projectionMatrix;uniform vec3 uCamera;uniform float uTime,uWind;
        varying vec3 vWorld;varying float vDistance,vSlope;
        ${commonNoise}
        void main(){vec4 w=modelMatrix*vec4(position,1.);vDistance=distance(w.xz,uCamera.xz);
          float far=smoothstep(42.,130.,vDistance);
          float wave=noise(w.xz*.028+vec2(uTime*.045,uTime*.017));
          w.y+=far*(wave-.5)*.15*uWind;vWorld=w.xyz;vSlope=normal.y;
          gl_Position=projectionMatrix*viewMatrix*w;}`,
      fragmentShader:`precision highp float;
        uniform vec3 uSun,uHorizon;uniform vec2 uCloud;varying vec3 vWorld;varying float vDistance,vSlope;
        ${commonNoise}
        void main(){float n=noise(vWorld.xz*.065)*.62+noise(vWorld.xz*.23)*.38;
          vec3 c=mix(vec3(.15,.27,.115),vec3(.31,.40,.19),n);
          c+=max(0.,dot(normalize(vec3(.12,1.,.1)),normalize(uSun)))*vec3(.05,.06,.015);
          c*=.82+.18*vSlope;
          // Near the walker the soil is a mat of short grass and dry thatch in the blades' shade, not a flat lawn colour.
          float thatchN=noise(vWorld.xz*3.1)*.55+noise(vWorld.xz*8.3)*.45,near=1.-smoothstep(6.,34.,vDistance);
          c=mix(c,c*(.66+.5*thatchN),near*.8);c=mix(c,vec3(.34,.33,.16)*(.55+.45*thatchN),near*smoothstep(.62,.8,thatchN)*.45);
          c*=mix(vec3(1.),vec3(.64,.7,.8),cloudCover(vWorld.xz+uSun.xz/max(uSun.y,.45)*CLOUD_H-uCloud));
          c=mix(c,uHorizon,smoothstep(32.,180.,vDistance)*.88);
          gl_FragColor=vec4(c,1.);}`});
    const ground=new THREE.Mesh(groundGeometry,groundMaterial);ground.frustumCulled=false;scene.add(ground);

    const skyUniforms={uSun:sunUniform,uCloud:cloudUniform,uTop:{value:new THREE.Color(0x8fb8bf)},uHorizon:{value:new THREE.Color(0xe7e4c7)}};
    const sky=new THREE.Mesh(new THREE.SphereGeometry(500,32,16),new THREE.RawShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:skyUniforms,
      vertexShader:`precision highp float;attribute vec3 position;uniform mat4 modelMatrix,viewMatrix,projectionMatrix;varying vec3 vRay;void main(){vRay=normalize(position);gl_Position=projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.);}`,
      fragmentShader:`precision highp float;uniform vec3 uSun,uTop,uHorizon;uniform vec2 uCloud;varying vec3 vRay;
        ${commonNoise}
        void main(){vec3 ray=normalize(vRay);float h=clamp(ray.y*.72+.18,0.,1.);
          vec3 c=mix(uHorizon,uTop,pow(h,.55));
          float rayleigh=pow(max(ray.y,0.),.52)*.08;
          float mie=pow(max(dot(ray,normalize(uSun)),0.),55.);
          float glow=pow(max(dot(ray,normalize(uSun)),0.),5.);
          c+=vec3(.07,.10,.09)*rayleigh+vec3(1.,.74,.38)*mie*.47+vec3(.31,.21,.1)*glow*.11;
          // The cloud deck from below: thin sunlit veils that thin out into the horizon haze.
          float cov=ray.y>0.?cloudCover(ray.xz/(ray.y+.04)*CLOUD_H-uCloud)*smoothstep(.03,.3,ray.y):0.;
          c=mix(c,mix(vec3(.97,.97,.93),uHorizon,.25)+vec3(.3,.22,.1)*glow,cov*.34);
          gl_FragColor=vec4(c,1.);}`}));
    sky.frustumCulled=false;scene.add(sky);

    // One inexpensive five-tap depth-based blur gives a subtle far-field depth of focus.
    const target=new THREE.WebGLRenderTarget(1,1,{depthBuffer:true,stencilBuffer:false});
    target.depthTexture=new THREE.DepthTexture(1,1,THREE.UnsignedIntType);
    const postUniforms={uColor:{value:target.texture},uDepth:{value:target.depthTexture},uTexel:{value:new THREE.Vector2(1,1)},uNear:{value:camera.near},uFar:{value:camera.far}};
    const postScene=new THREE.Scene(),postCamera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
    postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),new THREE.RawShaderMaterial({depthTest:false,depthWrite:false,uniforms:postUniforms,
      vertexShader:`precision highp float;attribute vec3 position;varying vec2 vUv;void main(){vUv=position.xy*.5+.5;gl_Position=vec4(position.xy,0.,1.);}`,
      fragmentShader:`precision highp float;uniform sampler2D uColor,uDepth;uniform vec2 uTexel;uniform float uNear,uFar;varying vec2 vUv;
        void main(){vec4 center=texture2D(uColor,vUv);float d=texture2D(uDepth,vUv).x;
          float z=(uNear*uFar)/(uFar+d*(uNear-uFar));
          float amount=smoothstep(18.,115.,z)*.42;
          vec2 p=uTexel*(1.+amount*2.);
          vec4 blur=(texture2D(uColor,vUv+vec2(p.x,0.))+texture2D(uColor,vUv-vec2(p.x,0.))+
            texture2D(uColor,vUv+vec2(0.,p.y))+texture2D(uColor,vUv-vec2(0.,p.y)))*.25;
          gl_FragColor=mix(center,blur,amount);}`})));

    function setSun(){const a=Number(document.getElementById('azimuth').value)*Math.PI/180,e=Number(document.getElementById('elevation').value)*Math.PI/180;
      sunDir.set(Math.cos(e)*Math.sin(a),Math.sin(e),-Math.cos(e)*Math.cos(a)).normalize();
      const warm=THREE.MathUtils.clamp((30-e*180/Math.PI)/28,0,1);
      skyUniforms.uHorizon.value.setRGB(.78+.1*warm,.83-.03*warm,.77-.12*warm);
      skyUniforms.uTop.value.setRGB(.45+.08*warm,.67-.08*warm,.71-.13*warm);
      grassUniforms.uHorizon.value.setRGB(.65+.07*warm,.75-.04*warm,.64-.07*warm);
    }
    for(const [id,value] of [['wind',CONFIG.WIND_STRENGTH],['azimuth',CONFIG.SUN_AZIMUTH_DEG],['elevation',CONFIG.SUN_ELEVATION_DEG]]){
      document.getElementById(id).value=value;
      document.getElementById(id+'-value').textContent=value+(id==='wind'?'':'°');
    }
    for(const id of ['wind','azimuth','elevation'])document.getElementById(id).addEventListener('input',e=>{
      document.getElementById(id+'-value').textContent=e.target.value+(id==='wind'?'':'°');
      if(id==='wind')grassUniforms.uWind.value=Number(e.target.value);else setSun();
      markInput();
    });
    setSun();

    const panel=document.getElementById('panel'),panelToggle=document.getElementById('panel-toggle');
    function setPanel(open){panel.classList.toggle('collapsed',!open);panelToggle.setAttribute('aria-expanded',String(open));document.getElementById('controls').inert=!open;}
    setPanel(innerWidth>470);
    panelToggle.addEventListener('click',()=>{setPanel(panel.classList.contains('collapsed'));lastInput=performance.now();});

    const state={yaw:0,pitch:-.035,dolly:0,targetYaw:0,targetPitch:-.035,targetDolly:0};
    let lastInput=performance.now(),last=lastInput,elapsed=0,needsRender=true;
    function markInput(){lastInput=performance.now();needsRender=true;}
    // The walk ends at 62 m: forward input eases off over the last ten metres instead of stopping dead.
    const END=62;function advance(delta){const slow=delta>0?Math.max(.12,1-THREE.MathUtils.smoothstep(state.targetDolly,END-10,END)):1;state.targetDolly=THREE.MathUtils.clamp(state.targetDolly+delta*slow,0,END);}
    // Mouse aims by pointer position; touch drags only walk forward/back (handled below).
    canvas.addEventListener('pointermove',e=>{
      if(e.pointerType!=='mouse')return;
      state.targetYaw=((e.clientX/innerWidth)-.5)*.38;
      state.targetPitch=-.04+(.5-e.clientY/innerHeight)*.18;
      markInput();
    });
    canvas.addEventListener('wheel',e=>{e.preventDefault();advance(e.deltaY*.013);markInput();},{passive:false});
    let touchY=null;
    canvas.addEventListener('pointerdown',e=>{canvas.focus({preventScroll:true});if(e.pointerType!=='mouse'){touchY=e.clientY;canvas.setPointerCapture(e.pointerId)}markInput();});
    canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'&&touchY!==null){advance((touchY-e.clientY)*.035);touchY=e.clientY;markInput();}});
    window.addEventListener('pointerup',()=>touchY=null);canvas.addEventListener('pointercancel',()=>touchY=null);canvas.addEventListener('lostpointercapture',()=>touchY=null);
    const motionButton=document.getElementById('motion-toggle');function syncMotion(){motionButton.setAttribute('aria-pressed',String(motionPaused));motionButton.textContent=motionPaused?'繼續動態':'暫停動態'}syncMotion();motionButton.addEventListener('click',()=>{motionPaused=!motionPaused;markInput();syncMotion()});motionPreference.addEventListener('change',e=>{reducedMotion=e.matches;if(reducedMotion)motionPaused=true;syncMotion();needsRender=true});function homeView(){Object.assign(state,{yaw:0,pitch:-.035,dolly:0,targetYaw:0,targetPitch:-.035,targetDolly:0});markInput()}document.getElementById('home-view').addEventListener('click',homeView);canvas.addEventListener('keydown',e=>{const key=e.key.toLowerCase();if(!['arrowleft','arrowright','arrowup','arrowdown','w','s','home'].includes(key))return;e.preventDefault();if(key==='home')homeView();else if(key==='w'||key==='s')advance(key==='w'?2:-2);else if(key==='arrowleft'||key==='arrowright')state.targetYaw=THREE.MathUtils.clamp(state.targetYaw+(key==='arrowleft'?-.05:.05),-.3,.3);else state.targetPitch=THREE.MathUtils.clamp(state.targetPitch+(key==='arrowup'?.03:-.03),-.2,.15);markInput()});
    function resize(){const w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,CONFIG.MAX_PIXEL_RATIO);
      renderer.setPixelRatio(dpr);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
      const tw=Math.max(1,Math.round(w*dpr)),th=Math.max(1,Math.round(h*dpr));target.setSize(tw,th);postUniforms.uTexel.value.set(1/tw,1/th);needsRender=true;
    }
    window.addEventListener('resize',resize);resize();
    const flare=document.getElementById('flare'),travel=document.getElementById('travel');
    const sunPoint=new THREE.Vector3(),lookDir=new THREE.Vector3(),lookAt=new THREE.Vector3();
    function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;if(!motionPaused){elapsed+=dt;
        // Cloud shadows travel downwind (the way the blades lean) at a pace set by the wind slider, and hold still while paused.
        const drift=dt*(1.5+5*grassUniforms.uWind.value);cloudUniform.value.x+=.76*drift;cloudUniform.value.y+=.48*drift;}
      const idle=now-lastInput>4500;
      if(idle&&!reducedMotion&&!motionPaused){state.targetYaw=Math.sin(elapsed*.09)*.15;state.targetPitch=-.04+Math.sin(elapsed*.055)*.035;advance(dt*.46);}
      // With motion paused and the view settled, the last frame stays on screen: nothing is redrawn until input arrives.
      const settled=Math.abs(state.targetYaw-state.yaw)<1e-4&&Math.abs(state.targetPitch-state.pitch)<1e-4&&Math.abs(state.targetDolly-state.dolly)<1e-3;
      if(motionPaused&&settled&&!needsRender)return;
      needsRender=false;
      const k=reducedMotion?1:1-Math.exp(-dt*2.1);
      state.yaw+= (state.targetYaw-state.yaw)*k;state.pitch+=(state.targetPitch-state.pitch)*k;state.dolly+=(state.targetDolly-state.dolly)*k;
      const x=Math.sin(state.dolly*.021)*.55,z=9-state.dolly;
      camera.position.set(x,terrainHeight(x,z)+1.05,z);
      const pitch=state.pitch+(camera.aspect<.8?-.13:0);lookDir.set(Math.sin(state.yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(state.yaw)*Math.cos(pitch));
      camera.lookAt(lookAt.copy(camera.position).add(lookDir));sky.position.copy(camera.position);
      grassUniforms.uTime.value=elapsed;groundUniforms.uTime.value=elapsed;
      grassUniforms.uCamera.value.copy(camera.position);groundUniforms.uCamera.value.copy(camera.position);
      const projected=sunPoint.copy(camera.position).addScaledVector(sunDir,200).project(camera);
      const onScreen=projected.z<1&&projected.x>-1.15&&projected.x<1.15&&projected.y>-1.15&&projected.y<1.15;
      flare.style.opacity=onScreen?'.8':'0';flare.style.setProperty('--sun-x',((projected.x+1)*50)+'%');flare.style.setProperty('--sun-y',((1-projected.y)*50)+'%');
      travel.textContent=(motionPaused?'動態已暫停':idle&&!reducedMotion?'自動巡遊':'漫遊中')+' · '+Math.round(state.dolly)+' m'+(state.dolly>END-1.5?' · 小徑盡頭':'');
      renderer.setRenderTarget(target);renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.render(postScene,postCamera);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
