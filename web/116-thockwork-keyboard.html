<!doctype html>
<!--
Thockwork / 客製化鍵盤工坊
Every keycap, switch, stabilizer, plate hole and the case are generated at runtime from the
layout tables below (60 / 65 / 75). Three.js and GSAP load from pinned jsDelivr URLs; WebGL required.
Checkout is a demo: nothing is charged and nothing leaves the browser (cart lives in localStorage).
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1916">
<meta name="description" content="Thockwork 客製化鍵盤工坊：每顆鍵帽、每個軸體都由程式即時生成的 3D 鍵盤。換配色、軸體與鍵帽高度，用實體鍵盤試打聽聲音，再加入購物車結帳。">
<title>Thockwork · 客製化鍵盤工坊</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 27 7 8q.4-2 2.4-2h13.2q2 0 2.4 2l3 19z' fill='%23e6e0d2'/%3E%3Cpath d='M9 9q7 2.4 14 0' fill='none' stroke='%231b1916' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --stage:#1b1916;--surface:#272421;--surface-2:#34302c;--edge:rgba(255,246,230,.06);
  --ink:#eee8dc;--ink-2:rgba(238,232,220,.72);--ink-3:rgba(238,232,220,.48);
  --cap-top:#e6e0d2;--cap-base:#a9a397;--cap-legend:#2a2826;--warn:#e7a47c;
  --display:"Avenir Next Condensed","Avenir Next","Arial Narrow","Roboto Condensed",sans-serif;
  --body:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  --bar:76px;--gut:28px;--ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--stage);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.num{font-variant-numeric:tabular-nums lining-nums}

/* ---------- top bar ---------- */
.bar{position:fixed;top:0;left:0;right:0;height:var(--bar);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:0 var(--gut);z-index:5;pointer-events:none}
.bar>*{pointer-events:auto}
.brand{justify-self:start;display:flex;align-items:center;gap:10px;font:600 24px/1 var(--display);letter-spacing:.005em;color:var(--ink);text-decoration:none}
.brand svg{width:28px;height:24px;flex:none}
.lines{display:flex;gap:2px;padding:4px;border-radius:15px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--edge)}
.lines button{display:grid;justify-items:center;padding:5px 16px 6px;border-radius:11px;color:var(--ink-3);transition:color .2s,background-color .2s}
.lines button:hover{color:var(--ink-2)}
.lines button[aria-pressed=true]{background:var(--surface-2);color:var(--ink)}
.lines b{font:600 23px/1 var(--display)}
.lines b i{font-style:normal;font-size:14px;margin-left:1px;opacity:.7}
.lines small{font-size:11px;line-height:1.2;margin-top:3px}
.buy{justify-self:end;display:flex;align-items:center;gap:18px}
.total{font:600 25px/1 var(--display);letter-spacing:.01em}
.total small{display:block;font:12px/1.3 var(--body);color:var(--ink-3);text-align:right;margin-top:3px;letter-spacing:0}
.cartbtn{display:flex;align-items:center;gap:10px;padding:7px 8px 7px 15px;border-radius:13px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--edge);font-weight:500;transition:background-color .2s}
.cartbtn:hover{background:var(--surface-2)}

/* mini keycap (cart count, qty steppers) */
.kc{position:relative;display:inline-grid;place-items:center;min-width:28px;height:26px;padding:0 7px;border-radius:7px;background:var(--cap-base);color:var(--cap-legend);font:700 13px/1 var(--display)}
.kc::before{content:"";position:absolute;inset:1.5px 3px 4px;border-radius:5px;background:linear-gradient(var(--cap-top),color-mix(in srgb,var(--cap-top) 88%,#000))}
.kc>span{position:relative;transform:translateY(-1px)}
.kc.bump::before,.kc.bump>span{transform:translateY(2px)}

/* ---------- bottom dock ---------- */
.dock{position:fixed;left:16px;right:16px;bottom:16px;z-index:5;display:flex;flex-direction:column;gap:14px;pointer-events:none}
.dock>*{pointer-events:auto}
.headline{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:0 12px;pointer-events:none}
.headline>*{pointer-events:auto}
.title{margin:0;font:600 46px/1 var(--display);letter-spacing:.004em;white-space:nowrap}
.title span{color:var(--ink-3);font-weight:500;margin-left:.18em}
.specs{margin:9px 0 0;color:var(--ink-2);font-size:14px}
.try{margin:6px 0 0;color:var(--ink-3);font-size:13px;display:flex;align-items:center;gap:8px}
.try .kc{height:22px;min-width:24px;font-size:11px}
.views{display:flex;flex:none;gap:2px;padding:4px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--edge)}
.views button{padding:8px 13px;border-radius:10px;color:var(--ink-3);font-size:14px;white-space:nowrap;transition:color .2s,background-color .2s}
.views button:hover{color:var(--ink-2)}
.views button[aria-pressed=true]{color:var(--ink);background:var(--surface-2)}
.views .gap{width:1px;margin:0 3px}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:11px;margin-right:6px;vertical-align:-1px}
.bars i{width:2px;border-radius:2px;background:currentColor;height:4px}
[aria-pressed=true] .bars i{animation:eq 1.1s ease-in-out infinite}
[aria-pressed=true] .bars i:nth-child(2){animation-delay:-.4s}
[aria-pressed=true] .bars i:nth-child(3){animation-delay:-.75s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

.console{border-radius:22px;background:var(--surface);box-shadow:inset 0 1px 0 rgba(255,246,230,.05),inset 0 0 0 1px var(--edge)}
.tray{overflow:hidden}
.tray-inner{display:flex;gap:6px;padding:10px 10px 0;overflow-x:auto;scrollbar-width:none}
.tray-inner::-webkit-scrollbar{display:none}
.opt{flex:0 0 138px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px 12px 11px;border-radius:15px;text-align:left;color:var(--ink-2);transition:background-color .2s,color .2s}
.opt:hover{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.opt[aria-pressed=true]{background:var(--surface-2);color:var(--ink)}
.opt svg{display:block;width:100%;height:44px;margin-bottom:6px;overflow:visible}
.opt b{font:600 17px/1.15 var(--display);color:var(--ink)}
.opt small{font-size:12px;color:var(--ink-3);line-height:1.35}
.opt[aria-pressed=false] svg{opacity:.78}
.rail{display:flex;align-items:center;gap:8px;padding:8px}
.segs{flex:1;display:flex;gap:4px;min-width:0}
.seg{flex:1 1 0;min-width:0;padding:9px 14px;border-radius:14px;text-align:left;transition:background-color .2s}
.seg:hover{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.seg[aria-expanded=true]{background:var(--surface-2)}
.seg small{display:block;font-size:12px;color:var(--ink-3);line-height:1.3}
.seg b{display:block;font:600 18px/1.25 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* the spacebar: the one primary action, built like a keycap from the current set */
.space{position:relative;flex:none;min-width:250px;height:58px;padding:0 26px;border-radius:14px;background:var(--cap-base);color:var(--cap-legend);font:600 19px/1 var(--display);letter-spacing:.01em}
.space::before{content:"";position:absolute;inset:2px 9px 8px;border-radius:10px;background:linear-gradient(color-mix(in srgb,var(--cap-top) 94%,#fff),var(--cap-top) 60%,color-mix(in srgb,var(--cap-top) 90%,#000));box-shadow:inset 0 1px 0 rgba(255,255,255,.28);transition:transform .08s,filter .2s}
.space>span{position:relative;display:inline-block;transform:translateY(-3px);transition:transform .08s}
.space:hover::before{filter:brightness(1.05)}
.space:active::before{transform:translateY(3px)}
.space:active>span{transform:translateY(0)}
.space .px{opacity:.62;margin-left:10px}

/* ---------- cart drawer ---------- */
.scrim{position:fixed;inset:0;z-index:9;background:rgba(8,7,6,.5);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:10;width:min(460px,100%);display:flex;flex-direction:column;background:var(--surface);box-shadow:-1px 0 0 var(--edge);transform:translateX(102%);visibility:hidden;transition:transform .5s var(--ease),visibility .5s}
body.cart-open .scrim{opacity:1;visibility:visible}
body.cart-open .drawer{transform:none;visibility:visible}
.dh{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 6px}
.dh h2{margin:0;font:600 30px/1 var(--display)}
.x{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--ink-2)}
.x:hover{background:var(--surface-2);color:var(--ink)}
.x svg{width:16px;height:16px}
.steps{display:flex;gap:18px;padding:6px 24px 16px;font-size:13px;color:var(--ink-3)}
.steps[hidden]{display:none}
.steps span[aria-current=step]{color:var(--ink);font-weight:600}
.db{flex:1;overflow-y:auto;padding:4px 24px 24px;overscroll-behavior:contain}
.df{padding:18px 24px 24px;background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
.df .space{width:100%;min-width:0}
.item{display:grid;grid-template-columns:118px 1fr;gap:16px;padding:14px 0}
.item img{width:118px;height:74px;border-radius:12px;object-fit:cover;background:var(--stage)}
.item h3{margin:0;font:600 19px/1.15 var(--display)}
.item p{margin:4px 0 0;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.item .row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}
.qty{display:flex;align-items:center;gap:8px}
.qty button.kc{min-width:30px;height:28px;font-size:15px}
.qty output{min-width:18px;text-align:center;font-weight:600}
.link{font-size:13px;color:var(--ink-3);padding:4px 2px}
.link:hover{color:var(--ink)}
.line-price{font:600 18px/1 var(--display)}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0 0 16px;font-size:14px;color:var(--ink-2)}
.sum dd{margin:0;text-align:right}
.sum .grand{font:600 24px/1.1 var(--display);color:var(--ink);padding-top:6px}
.empty{padding:40px 0 10px}
.empty p{margin:0 0 6px;font:600 24px/1.2 var(--display)}
.empty span{color:var(--ink-2);font-size:14px}
.form{display:grid;gap:14px;padding-top:6px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.field input,.field textarea{width:100%;height:46px;padding:0 14px;border-radius:12px;border:0;background:var(--stage);box-shadow:inset 0 0 0 1px var(--edge);color:var(--ink);font-size:15px}
.field textarea{height:76px;padding:11px 14px;resize:none}
.field input[aria-invalid=true]{box-shadow:inset 0 0 0 1px var(--warn)}
.field .err{display:block;min-height:0;font-size:12.5px;color:var(--warn);margin-top:5px}
.field .err:empty{display:none}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choose button{padding:12px 14px;border-radius:13px;text-align:left;background:var(--stage);box-shadow:inset 0 0 0 1px var(--edge);color:var(--ink-2);transition:background-color .2s,color .2s}
.choose button b{display:block;font:600 17px/1.2 var(--display);color:var(--ink)}
.choose button small{font-size:12px;color:var(--ink-3)}
.choose button[aria-pressed=true]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.review h4{margin:18px 0 6px;font:600 16px/1.2 var(--display);color:var(--ink-2)}
.review p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.6}
.note{margin:14px 0 0;font-size:12.5px;color:var(--ink-3);line-height:1.6}
.back{display:inline-block;margin-top:12px}
.done{padding:36px 0 8px}
.done .ordno{font:600 40px/1 var(--display);letter-spacing:.01em}
.done p{color:var(--ink-2);line-height:1.7;margin:14px 0 0}

.flyer{position:fixed;z-index:20;pointer-events:none;border-radius:12px;object-fit:cover}
.error{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100% - 40px));padding:26px;border-radius:18px;background:var(--surface);line-height:1.7;display:none;z-index:30}
.error.visible{display:block}
.error b{display:block;font:600 24px/1.2 var(--display);margin-bottom:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- phone ---------- */
@media (max-width:760px){
  :root{--bar:60px;--gut:14px}
  .bar{grid-template-columns:auto 1fr auto;gap:4px}
  .brand{font-size:17px;gap:6px}
  .brand svg{width:22px;height:19px}
  .lines{justify-self:center;padding:3px}
  .lines button{padding:5px 7px}
  .lines b{font-size:18px}
  .lines small{display:none}
  .total{display:none}
  .cartbtn{padding:5px 6px 5px 9px;gap:6px;font-size:13px;white-space:nowrap}
  .dock{left:10px;right:10px;bottom:10px;gap:10px}
  .headline{flex-direction:column;align-items:stretch;gap:10px;padding:0 6px}
  .title{font-size:30px}
  .specs{font-size:12.5px;margin-top:6px}
  .try{display:none}
  .views{overflow-x:auto;scrollbar-width:none;align-self:flex-start;max-width:100%}
  .views button{padding:7px 10px;font-size:13px}
  .console{border-radius:18px}
  .rail{flex-direction:column;align-items:stretch;gap:6px;padding:6px}
  .segs{overflow-x:auto;scrollbar-width:none}
  .segs::-webkit-scrollbar{display:none}
  .seg{flex:0 0 auto;padding:7px 12px}
  .seg b{font-size:16px}
  .space{width:100%;min-width:0;height:54px}
  .opt{flex-basis:122px;padding:10px}
  .opt svg{height:38px}
  .item{grid-template-columns:96px 1fr;gap:12px}
  .item img{width:96px;height:60px}
}
@media (max-height:720px) and (min-width:761px){
  .title{font-size:36px}
  .opt svg{height:36px}
}
@media (prefers-reduced-motion:reduce){
  .drawer,.scrim{transition:none}
  [aria-pressed=true] .bars i{animation:none;height:8px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="stage" aria-label="可旋轉的 3D 鍵盤預覽。拖曳旋轉、滾輪縮放，點擊鍵帽試打。" tabindex="-1"></canvas>

<header class="bar">
  <a class="brand" href="#" aria-label="Thockwork 首頁">
    <svg viewBox="0 0 28 24" aria-hidden="true"><path d="M2.5 22.5 5.2 4.6Q5.6 2.5 7.7 2.5h12.6q2.1 0 2.5 2.1l2.7 17.9z" fill="var(--cap-top)"/><path d="M7 5.6q7 2.6 14 0" fill="none" stroke="var(--stage)" stroke-width="1.6" stroke-linecap="round"/></svg>
    Thockwork
  </a>
  <nav class="lines" aria-label="鍵盤尺寸" id="lines"></nav>
  <div class="buy">
    <div class="total"><span class="num" id="total">NT$0</span><small>含組裝與調潤</small></div>
    <button class="cartbtn" id="openCart" aria-haspopup="dialog">購物車 <span class="kc" id="count"><span>0</span></span></button>
  </div>
</header>

<div class="dock" id="dock">
  <div class="headline">
    <div>
      <h1 class="title" id="title">TW65<span>墨與紙</span></h1>
      <p class="specs" id="specs"></p>
      <p class="try" id="try"><span class="kc"><span>A</span></span><span id="tryText">直接敲你的鍵盤試打，或點 3D 鍵帽</span></p>
    </div>
    <div class="views" role="group" aria-label="檢視">
      <button data-view="hero" aria-pressed="true">展示</button>
      <button data-view="top" aria-pressed="false">俯視</button>
      <button data-view="side" aria-pressed="false">側面</button>
      <span class="gap" aria-hidden="true"></span>
      <button id="explode" aria-pressed="false">拆解</button>
      <button id="sound" aria-pressed="true"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>聲音</button>
    </div>
  </div>
  <div class="console">
    <div class="tray" id="tray"><div class="tray-inner" id="trayInner" role="group"></div></div>
    <div class="rail">
      <div class="segs" id="segs"></div>
      <button class="space" id="add"><span>加入購物車<span class="px num" id="addPrice"></span></span></button>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="dh">
    <h2 id="dTitle">購物車</h2>
    <button class="x" id="closeCart" aria-label="關閉購物車"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div>
  <div class="steps" id="steps"><span data-s="cart">1 購物車</span><span data-s="ship">2 收件資訊</span><span data-s="review">3 確認訂單</span></div>
  <div class="db" id="dBody"></div>
  <div class="df" id="dFoot"></div>
</aside>

<div class="error" id="error" role="alert"><b>3D 預覽無法啟動</b>這個頁面需要 WebGL，以及能連到 jsDelivr 載入 Three.js 與 GSAP。請換用新版 Chrome、Edge、Safari 或 Firefox，確認連線後重新整理。</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.__thockworkBooted = true;
const gsap = window.gsap;

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = d => reduceMotion ? 0 : d;
const fmt = n => 'NT$' + Math.round(n).toLocaleString('en-US');
function fail() { $('#error').classList.add('visible'); }
if (!gsap) { fail(); throw new Error('GSAP unavailable'); }

/* =========================================================================
   Catalogue
   ========================================================================= */
const U = 19.05;                 // key pitch, mm
const P = 10;                    // plate top, deck space
const CAP_BASE = P + 6.8;        // keycap skirt at rest
const TRAVEL = 4;
const TILT = 6.5 * Math.PI / 180;

const LAYOUTS = {
  '60': { name: 'TW60', price: 3900 },
  '65': { name: 'TW65', price: 4600 },
  '75': { name: 'TW75', price: 5400 },
};
const CASES = [
  { id: 'silver',   name: '霧銀',   note: '噴砂陽極鋁',   color: '#bdbcb7', metal: .82, rough: .44, price: 0 },
  { id: 'graphite', name: '石墨',   note: '陽極鋁',       color: '#3d3c3a', metal: .78, rough: .4,  price: 0 },
  { id: 'oxide',    name: '氧化紅', note: '陽極鋁',       color: '#80352a', metal: .74, rough: .36, price: 300 },
  { id: 'moss',     name: '苔綠',   note: '陽極鋁',       color: '#58624b', metal: .74, rough: .4,  price: 300 },
  { id: 'bone',     name: '骨白',   note: '電泳塗裝',     color: '#dcd6ca', metal: .08, rough: .5,  price: 500 },
  { id: 'brass',    name: '黃銅',   note: '實心黃銅 +1.9kg', color: '#b89058', metal: 1, rough: .27, price: 1800 },
];
const SETS = [

function snapshot() {
  const w = innerWidth, h = innerHeight, dpr = renderer.getPixelRatio();

function readForm() {

function validate() {

    name: v => v ? '' : '請填收件人姓名',
    email: v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? '' : 'Email 格式看起來不對',
    phone: v => /^[0-9+\-\s()]{8,}$/.test(v) ? '' : '請填可以聯絡的手機號碼',
    addr: v => v ? '' : ship.method === 'home' ? '請填收件地址' : '請填取貨門市',

$('#drawer').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, i = +b.dataset.i;
  if (act === 'close') closeCart();
  else if (act === 'inc') { cart[i].qty = Math.min(9, cart[i].qty + 1); saveCart(); renderCart(); }
  else if (act === 'dec') { if (cart[i].qty > 1) { cart[i].qty--; saveCart(); renderCart(); } else { cart.splice(i, 1); saveCart(); renderCart(); } }
  else if (act === 'rm') { cart.splice(i, 1); saveCart(); renderCart(); }
  else if (act === 'to-ship') goStep('ship');
  else if (act === 'to-cart') { readForm(); goStep('cart'); }
  else if (act === 'method') { readForm(); ship.method = b.dataset.v; renderCart(); }
  else if (act === 'to-review') { readForm(); if (validate()) goStep('review'); }
  else if (act === 'submit') {

    ship.orderNo = `TW${String(d.getFullYear()).slice(2)}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${Math.floor(1000 + Math.random() * 9000)}`;
    const orders = store.get('thockwork-orders', []); orders.push({ no: ship.orderNo, at: d.toISOString(), items: cart.map(i => ({ title: i.title, qty: i.qty, unit: i.unit })) });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

function pick(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(KB.caps, false)[0];

    KB.keys.forEach((k, i) => {
      const a = k.a;
      k.g.position.y = CAP_BASE - a.p * TRAVEL + a.hop;
      k.g.rotation.x = a.tilt;
      k.g.scale.setScalar(Math.max(.001, a.s));
      if (a.p !== k.lastP) { k.lastP = a.p; KB.inst.stem.setMatrixAt(i, m4.makeTranslation(k.x, -a.p * TRAVEL, k.z)); dirty = true; }
    });
    if (dirty) KB.inst.stem.instanceMatrix.needsUpdate = true;
  }
  renderer.render(scene, camera);
}
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  measureUI(false);
  applyViewOffset();
  if (state.view || state.exploded) {
    const { pos, target } = fitPose(state.exploded ? 'explode' : state.view);
    camera.position.copy(pos); controls.target.copy(target);
  }
}
let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(resize, 60); });
new ResizeObserver(() => measureUI(true)).observe($('#dock'));

setInterval(() => {
  if (reduceMotion || ghost.busy || document.hidden || document.body.classList.contains('cart-open')) return;
  if (performance.now() - lastInput > 11000) ghost.run();
}, 1000);

/* =========================================================================
   Boot
   ========================================================================= */
if (coarse) $('#tryText').textContent = '點 3D 鍵帽試打，拖曳旋轉';
KB = buildKeyboard(state.layout);
applySet(0); applyCase(0); applyMaterial(0); applySwitch(0);
renderAll(); saveCart();
renderer.setSize(innerWidth, innerHeight, false);
camera.aspect = innerWidth / innerHeight;
measureUI(false); applyViewOffset();
{
  const { pos, target } = fitPose('hero');
  controls.target.copy(target);
  const start = target.clone().add(pos.clone().sub(target).applyAxisAngle(new THREE.Vector3(0, 1, 0), -.75).multiplyScalar(1.25));
  start.y = Math.max(60, start.y * .45);
  camera.position.copy(reduceMotion ? pos : start);
  gsap.to(camera.position, { x: pos.x, y: pos.y, z: pos.z, duration: T(2.4), ease: 'power3.inOut' });
  dropIn(.35);
}
renderer.setAnimationLoop(tick);
</script>

// 靜態 import 的 Three.js 附加模組若從 CDN 載入失敗，整個 module 不會執行：load 後仍沒啟動就顯示說明
addEventListener('load', function(){ if (!window.__thockworkBooted){ document.getElementById('error').classList.add('visible'); document.getElementById('dock').style.display = 'none'; } });
