<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>畫中村 · PAINTED VILLAGE</title>
<meta name="description" content="把賽璐璐風村莊概念圖變成可走動的 3D 場景：先用方塊在 Three.js 重建村莊，從固定相機截圖，依概念重繪成插畫，再用投影 shader 把畫投回幾何上；第三人稱角色、碰撞與進屋，室內走同一套流程。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M3 17 16 6l13 11v11H3z%22 fill=%22%23e2683a%22/%3E%3Cpath d=%22M8 18h16v10H8z%22 fill=%22%23f4e7cf%22/%3E%3Cpath d=%22M14 21h4v7h-4z%22 fill=%22%235a3520%22/%3E%3Cpath d=%22M3 17 16 6l13 11%22 fill=%22none%22 stroke=%22%233a2214%22 stroke-width=%222%22/%3E%3C/svg%3E">
<style>
:root{
  --ink:#2a190e; --ink-2:#4b2f1c; --paper:#f7ecd6; --paper-2:#e9d7b4; --leaf:#6f8f2e; --rust:#c4552c;
  --ease-out:cubic-bezier(.2,.8,.2,1); --dur-hover:140ms; --dur-press:90ms; --dur-enter:360ms; --dur-exit:220ms;
  --serif:"Songti TC","STSong","Noto Serif TC","Source Han Serif TC","PMingLiU",serif;
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a110a;color:var(--paper);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#sheet,#iris{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sheet{opacity:0;transition:opacity var(--dur-enter) var(--ease-out)}
#sheet.on{opacity:1}
#flash{position:fixed;inset:0;background:#fffaf0;opacity:0;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer}

/* 左上：作品名 */
#title{position:fixed;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));pointer-events:none;text-shadow:0 1px 0 rgba(42,25,14,.55),0 0 14px rgba(42,25,14,.45)}
#title b{display:block;font-family:var(--serif);font-weight:900;font-size:30px;letter-spacing:.14em;line-height:1.1}
#title small{display:block;margin-top:4px;font-size:12px;letter-spacing:.04em;opacity:.86}

/* 右上：工具 */
#tools{position:fixed;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;gap:6px}
.tool{display:flex;align-items:center;gap:7px;height:34px;padding:0 11px 0 9px;border:1px solid rgba(247,236,214,.16);border-radius:7px;background:rgba(42,25,14,.78);font-size:13px;transition:background-color var(--dur-hover) var(--ease-out),color var(--dur-hover) var(--ease-out)}
.tool kbd{font:600 11px/1 var(--sans);padding:3px 5px 2px;border-radius:4px;background:rgba(247,236,214,.14)}
.tool svg{width:16px;height:16px;flex:none}
.tool:hover{background:rgba(75,47,28,.92)}
.tool:active{background:rgba(30,18,10,.95)}
.tool[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.tool[aria-pressed="true"] kbd{background:rgba(42,25,14,.12)}

/* 下方：流程底片 */
#strip{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:9px;background:rgba(42,25,14,.82)}
.fr{position:relative;width:112px;padding:0;border:0;border-radius:5px;background:none;text-align:left}
.fr canvas{display:block;width:112px;height:70px;border-radius:4px;background:#3a2617;outline:2px solid transparent;outline-offset:-2px;transition:outline-color var(--dur-hover) var(--ease-out)}
.fr span{display:flex;gap:5px;align-items:baseline;padding:5px 3px 1px;font-size:12px;white-space:nowrap;opacity:.72;transition:opacity var(--dur-hover) var(--ease-out)}
.fr span b{font-weight:500}
.fr span i{font-style:normal;font-family:var(--serif);font-weight:900;font-size:14px;color:var(--paper-2)}
.fr:hover span{opacity:1}
.fr[aria-current="true"] canvas{outline-color:var(--paper)}
.fr[aria-current="true"] span{opacity:1}

/* 字卡（仿影片的說明牌） */
#caption{position:fixed;left:50%;top:max(70px,calc(env(safe-area-inset-top) + 64px));transform:translate(-50%,0);max-width:min(760px,calc(100vw - 32px));padding:11px 22px 12px;border:2.5px solid var(--ink);border-radius:12px;background:#fdf6e6;color:var(--ink);text-align:center;box-shadow:3px 4px 0 rgba(42,25,14,.85);transition:transform var(--dur-enter) var(--ease-out),visibility 0s}
#caption b{display:block;font-size:20px;font-weight:800;letter-spacing:.02em}
#caption small{display:block;margin-top:3px;font-size:13px;color:#7a5032;font-weight:600}
#caption.off{transform:translate(-50%,-180%);visibility:hidden;transition:transform var(--dur-exit) var(--ease-out),visibility 0s var(--dur-exit)}

/* 世界中的標籤與對話泡泡 */
#marks{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;left:0;top:0;padding:5px 11px 6px;border:2px solid var(--ink);border-radius:10px;background:#fffaf0;color:var(--ink);font-weight:800;font-size:15px;white-space:nowrap;transform:translate(-50%,-100%)}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;margin-left:-6px;background:#fffaf0;border:2px solid var(--ink);border-top:0;border-left:0;transform:rotate(45deg) skew(8deg,8deg);border-radius:0 0 3px 0}
.hint{position:absolute;left:0;top:0;display:flex;gap:6px;align-items:center;padding:4px 9px 4px 5px;border-radius:7px;background:rgba(42,25,14,.86);font-size:13px;white-space:nowrap;transform:translate(-50%,-100%)}
.hint kbd{font:700 11px/1 var(--sans);padding:3px 5px 2px;border-radius:4px;background:var(--paper);color:var(--ink)}

/* 對話框 */
#dialog{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 108px);width:min(620px,calc(100vw - 32px));transform:translateX(-50%);padding:14px 18px 16px;border-radius:10px;background:rgba(36,21,12,.94);border:1px solid rgba(247,236,214,.14);visibility:hidden}
#dialog.on{visibility:visible}
#dialog b{display:block;font-family:var(--serif);font-size:15px;letter-spacing:.12em;color:var(--paper-2);margin-bottom:5px}
#dialog p{margin:0;font-size:16px;line-height:1.65;min-height:3.3em}
#dialog em{position:absolute;right:14px;bottom:10px;font-style:normal;font-size:12px;opacity:.6}

/* 說明 */
#help{position:fixed;left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));font-size:12px;line-height:1.75;opacity:.88;text-shadow:0 1px 2px rgba(20,12,6,.9);pointer-events:none}
#help kbd{font:600 11px/1 var(--sans);padding:2px 4px 1px;margin-right:3px;border-radius:3px;background:rgba(247,236,214,.18)}

#skip{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));height:34px;padding:0 14px;border:1px solid rgba(247,236,214,.2);border-radius:7px;background:rgba(42,25,14,.8);font-size:13px}
#skip[hidden]{display:none}

/* 觸控 */
#joy,#act{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));display:none}
#joy{left:max(20px,env(safe-area-inset-left));width:118px;height:118px;border-radius:50%;background:rgba(42,25,14,.42);border:1px solid rgba(247,236,214,.18);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:rgba(247,236,214,.82)}
#act{right:max(20px,env(safe-area-inset-right));width:74px;height:74px;border-radius:50%;border:2px solid var(--ink);background:#fdf6e6;color:var(--ink);font-weight:800;font-size:16px;touch-action:none}
body.touch #joy,body.touch #act{display:block}
body.touch #help{display:none}

#boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:#1a110a;font-size:15px;line-height:1.8}
#boot b{display:block;font-family:var(--serif);font-size:34px;letter-spacing:.2em;margin-bottom:6px}
#boot[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:760px){
  #title b{font-size:23px}
  #title small{font-size:11px}
  .tool{padding:0 8px;height:32px}
  .tool span{display:none}
  .tool kbd{display:none}
  #strip{top:calc(max(14px,env(safe-area-inset-top)) + 58px);bottom:auto;left:auto;right:max(14px,env(safe-area-inset-right));transform:none;flex-direction:column;padding:4px}
  .fr{width:66px}
  .fr canvas{width:66px;height:41px}
  .fr span{font-size:10px;padding:3px 2px 1px}
  .fr span i{font-size:11px}
  .fr span b{display:none}
  .fr span{justify-content:center}
  #caption{top:calc(max(14px,env(safe-area-inset-top)) + 64px);left:16px;transform:none;max-width:calc(100vw - 118px);padding:9px 14px 10px;text-align:left}
  #caption b{font-size:16px}
  #caption small{font-size:12px}
  #caption.off{transform:translateY(-240%)}
  #dialog{bottom:calc(max(22px,env(safe-area-inset-bottom)) + 132px)}
  #dialog p{font-size:15px}
  #skip{bottom:auto;top:calc(max(14px,env(safe-area-inset-top)) + 58px);right:96px}
}
@media (prefers-reduced-motion:reduce){
  #caption,#caption.off,#sheet{transition:none}
}
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="sheet" aria-hidden="true"></canvas>
<div id="flash"></div>
<canvas id="iris" aria-hidden="true"></canvas>
<div id="marks"></div>

<div id="title"><b>畫中村</b><small>楓溪村 · 方塊、重繪、投影</small></div>

<div id="tools" role="toolbar" aria-label="檢視工具">
  <button class="tool" id="tWipe" aria-pressed="false" title="方塊與插畫對照（B）"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h6v10H2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 3h6v10H8z" fill="currentColor" opacity=".55"/><path d="M8 1.5v13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>對照</span><kbd>B</kbd></button>
  <button class="tool" id="tFree" aria-pressed="false" title="自由視角（V，或拖曳畫面）"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 9.5c0-3 2.3-5.5 5-5.5s5 2.5 5 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M10.6 2.6 13 4.2l-1.4 2.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 12.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>自由視角</span><kbd>V</kbd></button>
  <button class="tool" id="tCover" aria-pressed="false" title="顯示投影覆蓋範圍（P）"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5 8 8l6-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3.5 9.5h9l1 4h-11z" fill="currentColor" opacity=".55"/><circle cx="8" cy="3" r="1.6" fill="currentColor"/></svg><span>投影範圍</span><kbd>P</kbd></button>
  <button class="tool" id="tSnd" aria-pressed="true" title="聲音（M）"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6h2.5l3.5-3v10L5 10H2.5z" fill="currentColor"/><path d="M11 5.5c.9.7 1.4 1.6 1.4 2.5s-.5 1.8-1.4 2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>聲音</span><kbd>M</kbd></button>
</div>

<nav id="strip" aria-label="製作流程">
  <button class="fr" data-st="1"><canvas width="224" height="140"></canvas><span><i>一</i><b>方塊重建</b></span></button>
  <button class="fr" data-st="2"><canvas width="224" height="140"></canvas><span><i>二</i><b>固定相機截圖</b></span></button>
  <button class="fr" data-st="3"><canvas width="224" height="140"></canvas><span><i>三</i><b>重繪插畫</b></span></button>
  <button class="fr" data-st="4" aria-current="true"><canvas width="224" height="140"></canvas><span><i>四</i><b>投影回 3D</b></span></button>
</nav>

<div id="caption" class="off" role="status" aria-live="polite"><b></b><small></small></div>

<div id="dialog" aria-live="polite"><b></b><p></p><em>E / 點一下 繼續</em></div>

<div id="help"><kbd>WASD</kbd>移動　<kbd>Shift</kbd>跑　<kbd>E</kbd>交談 / 進屋<br><kbd>拖曳</kbd>轉動視角　<kbd>1–4</kbd>流程各階段　<kbd>B</kbd>方塊對照</div>
<button id="skip" hidden>跳過開場</button>

<div id="joy" aria-hidden="true"><i></i></div>
<button id="act" aria-label="交談或進屋">E</button>

<div id="boot"><div><b>畫中村</b><span id="bootMsg">正在搭方塊…</span></div></div>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;background:#1a110a;color:#f7ecd6">這件作品需要 JavaScript 與 WebGL。</p></noscript>
<p class="sr">把賽璐璐風村莊概念圖變成可走動 3D 場景的示範：方塊重建、固定相機截圖、重繪插畫、投影回 3D 幾何，並可進入兩間室內。</p>
<script type="module">
// ═══ 畫中村：方塊 → 截圖 → 重繪 → 投影 ═══
const $ = id => document.getElementById(id);
const bootMsg = t => { $('bootMsg').textContent = t; };
let T;
try { T = await import('https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js'); }
catch (e) { try { T = await import('../vendor/three-0.186.0/three.module.js'); } catch (e2) { T = null; } }
if (!T) { bootMsg('Three.js 載入失敗：需要網路連線到 cdn.jsdelivr.net。'); throw new Error('three'); }

const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let R;
try { R = new T.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' }); }
catch (e) { bootMsg('這個瀏覽器無法啟用 WebGL。'); throw e; }
R.outputColorSpace = T.LinearSRGBColorSpace; // 顏色直接以顯示空間撰寫
R.toneMapping = T.NoToneMapping;
R.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
R.autoClear = false;
$('stage').appendChild(R.domElement);
R.domElement.setAttribute('aria-label', '畫中村遊戲畫面');
R.domElement.tabIndex = 0;

const MAXT = R.capabilities.maxTextureSize || 4096;
const BAKE_W = Math.min(isTouch ? 2048 : 2560, MAXT), BAKE_H = Math.round(BAKE_W / 1.6);
const SUN_RES = 2048;

// ── 小工具 ──
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const v3 = a => new T.Vector3(a[0], a[1], a[2]);
const frame = () => new Promise(r => requestAnimationFrame(r));
const wait = ms => new Promise(r => setTimeout(r, ms));
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash3(x, y, z) { let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 2147483647); h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c = (a, b, d) => hash3(xi + a, yi + b, zi + d);
  return lerp(lerp(lerp(c(0, 0, 0), c(1, 0, 0), u), lerp(c(0, 1, 0), c(1, 1, 0), u), v), lerp(lerp(c(0, 0, 1), c(1, 0, 1), u), lerp(c(0, 1, 1), c(1, 1, 1), u), v), w);
}
const noise2 = (x, y) => noise3(x, y, 7.31);

// ── 材質種類（G-buffer 的 alpha 就是這個編號，重繪筆觸靠它分辨區域） ──
const K = { GRASS: 1, DIRT: 2, COBBLE: 3, STONE: 4, PLASTER: 5, WOOD: 6, TILE: 7, THATCH: 8, LEAF: 9, BARK: 10, AWNING: 11, WATER: 12, FRUIT: 13, FLOOR: 14, ISTONE: 15, RUG: 16, CLOTH: 17, PLAIN: 18, WINDOW: 19, EMIS: 20, FLOWERS: 21, BARREL: 22, GLASS: 23, FLAG: 24 };

// 全域 uniform（所有場景共用）
const GU = { uMode: { value: 3 }, uTime: { value: 0 }, uWipe: { value: -1 }, uCover: { value: 0 }, uTrust: { value: 1 } };

const VS = /* glsl */`
varying vec3 vW; varying vec3 vN; varying vec3 vL; varying vec3 vNL;
void main(){
  vL = position; vNL = normal;
  vec4 w = modelMatrix * vec4(position, 1.);
  vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal);
  gl_Position = projectionMatrix * viewMatrix * w;
}`;

const FS = /* glsl */`
varying vec3 vW; varying vec3 vN; varying vec3 vL; varying vec3 vNL;
uniform int uMode; uniform int uKind;
uniform vec3 uColA; uniform vec3 uColB; uniform vec3 uBlock;
uniform float uParam; uniform float uAxis; uniform float uLive; uniform float uCyl; uniform float uWrap;
uniform float uTime; uniform float uWipe; uniform float uCover; uniform float uTrust; uniform float uCloud; uniform float uOutdoor;
uniform sampler2D uSunDepth; uniform mat4 uSunVP; uniform vec3 uSunDir;
uniform vec3 uLightCol; uniform vec3 uShadeCol; uniform vec3 uAmb;
uniform vec3 uPt0; uniform vec3 uPtC0; uniform vec3 uPt1; uniform vec3 uPtC1; uniform float uFlick;
uniform sampler2D uPaint; uniform sampler2D uProjDepth; uniform mat4 uProjVP; uniform vec3 uProjPos; uniform vec2 uProjNF; uniform float uHasPaint;

float h21(vec2 p){ vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
vec2 h22(vec2 p){ vec3 q = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); q += dot(q, q.yzx + 33.33); return fract((q.xx + q.yz) * q.zy); }
float h31(vec3 p){ p = fract(p * .1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
vec3 h33(vec3 p){ p = fract(p * vec3(.1031, .1030, .0973)); p += dot(p, p.yxz + 33.33); return fract((p.xxy + p.yxx) * p.zyx); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(h21(i), h21(i + vec2(1., 0.)), f.x), mix(h21(i + vec2(0., 1.)), h21(i + vec2(1., 1.)), f.x), f.y); }
float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 4; i++){ s += a * vn(p); p = p * 2.03 + vec2(17.3, 5.1); a *= .5; } return s * 1.0667; }
vec3 vor(vec2 p, out vec2 rel){
  vec2 i = floor(p), f = fract(p); float d1 = 9., d2 = 9.; vec2 bc = vec2(0.); rel = vec2(0.);
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++){
    vec2 g = vec2(float(x), float(y)); vec2 o = h22(i + g) * .8 + .1; vec2 r = g + o - f; float d = dot(r, r);
    if (d < d1){ d2 = d1; d1 = d; rel = r; bc = i + g; } else if (d < d2) d2 = d;
  }
  return vec3(sqrt(d1), sqrt(d2) - sqrt(d1), h21(bc));
}
vec4 vor3(vec3 p){
  vec3 i = floor(p), f = fract(p); float d1 = 9., d2 = 9.; vec3 rel = vec3(0.);
  for (int z = -1; z <= 1; z++) for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++){
    vec3 g = vec3(float(x), float(y), float(z)); vec3 o = h33(i + g) * .8 + .1; vec3 r = g + o - f; float d = dot(r, r);
    if (d < d1){ d2 = d1; d1 = d; rel = r; } else if (d < d2) d2 = d;
  }
  return vec4(rel, sqrt(d2) - sqrt(d1));
}
float comp(vec3 v, float ax){ return ax < .5 ? v.x : (ax < 1.5 ? v.y : v.z); }

vec2 faceUV(vec3 N){
  vec3 a = abs(N);
  if (a.y > .6) return vW.xz;
  if (uCyl > 0.) return vec2(atan(vL.z, vL.x) * uCyl, vW.y);
  return a.x > a.z ? vec2(vW.z, vW.y) : vec2(vW.x, vW.y);
}
vec2 woodUV(){
  vec3 a = abs(vNL);
  float nax = (a.x > a.y && a.x > a.z) ? 0. : ((a.y > a.z) ? 1. : 2.);
  float al = uAxis;
  if (nax == al) return vec2(comp(vL, mod(al + 1., 3.)), comp(vL, mod(al + 2., 3.)));
  return vec2(comp(vL, al), comp(vL, 3. - al - nax));
}

vec3 stones(vec2 uv, vec3 a, vec3 b, vec3 mort, float rh, float w){
  uv += .05 * (vec2(vn(uv * 2.3), vn(uv * 2.3 + 9.)) - .5);
  float r = floor(uv.y / rh), fy = fract(uv.y / rh);
  float ww = w * (.75 + .5 * h21(vec2(r, 2.)));
  float x = uv.x / ww + h21(vec2(r, 5.)); float cx = floor(x), fx = fract(x);
  float id = h21(vec2(cx, r) + .37);
  float e = min(min(fx, 1. - fx) * ww, min(fy, 1. - fy) * rh);
  vec3 c = mix(a, b, id) * (.9 + .16 * vn(uv * 7. + id * 9.));
  c *= mix(.8, 1.07, smoothstep(.0, .8, fy));
  c *= mix(.86, 1., smoothstep(0., .06, min(fx, 1. - fx) * ww));
  return mix(mort, c, smoothstep(.012, .03, e));
}

vec3 kGrass(vec2 p){
  float n1 = fbm(p * .13), n2 = fbm(p * .55 + 7.1), n3 = vn(p * 2.7);
  vec3 c = mix(vec3(.31, .50, .16), vec3(.53, .69, .22), smoothstep(.3, .72, n1));
  c = mix(c, vec3(.76, .79, .31), smoothstep(.6, .86, n2) * .7);
  c *= .9 + .2 * n3;
  c *= .92 + .16 * vn(vec2(p.x * 13., p.y * 3.2) + n3);
  return c;
}
vec3 kDirt(vec2 p){
  float n1 = fbm(p * .22), n2 = fbm(p * 1.1 + 3.);
  vec3 c = mix(vec3(.80, .56, .30), vec3(.93, .73, .44), smoothstep(.35, .75, n1));
  c = mix(c, vec3(.67, .45, .24), smoothstep(.62, .8, n2) * .55);
  c *= .94 + .1 * vn(p * 9.);
  vec2 rel; vec3 v = vor(p * 2.6, rel);
  float peb = step(.8, v.z) * (1. - smoothstep(.15, .21, v.x));
  vec3 pc = mix(vec3(.74, .66, .56), vec3(.87, .81, .71), h21(vec2(v.z * 91.)));
  pc *= .82 + .3 * clamp(dot(-rel, vec2(-.7, -.7)) * 5. + .5, 0., 1.);
  return mix(c, pc, peb);
}
vec3 kCobble(vec2 p, vec3 a, vec3 b){
  vec2 rel; vec3 v = vor(p * 2.3, rel);
  vec3 sc = mix(a, b, v.z);
  sc *= .86 + .28 * clamp(dot(-rel, vec2(-.7, -.7)) * 2.2 + .5, 0., 1.);
  sc *= .93 + .1 * vn(p * 8.);
  vec3 gap = mix(vec3(.47, .38, .26), vec3(.40, .55, .2), step(.62, vn(p * 1.7)) * uOutdoor);
  return mix(gap, sc, smoothstep(.05, .11, v.y));
}
vec3 kPlaster(vec2 uv, float y){
  vec3 c = uColA * (.95 + .07 * fbm(uv * 1.3));
  c = mix(c, c * vec3(.93, .9, .84), smoothstep(.55, .8, fbm(uv * .5 + 3.)));
  float m = smoothstep(.58, .66, fbm(uv * .45 + 11.) + (1. - smoothstep(0., .9, y)) * .35);
  vec3 s = stones(uv, vec3(.70, .66, .6), vec3(.85, .8, .72), vec3(.55, .5, .45), .26, .42);
  return mix(c, s, m);
}
vec3 kWood(){
  vec2 w = woodUV(); float pw = uParam > 0. ? uParam : .22;
  float pl = floor(w.y / pw), fp = fract(w.y / pw);
  float g = vn(vec2(w.x * 1.4 + pl * 7., w.y * 28.)), g2 = vn(vec2(w.x * 5., w.y * 60.));
  vec3 c = uColA * (.82 + .3 * h21(vec2(pl, 1.3))) * (.86 + .2 * g) * (.95 + .08 * g2);
  return mix(c * .55, c, smoothstep(0., .07, fp) * smoothstep(1., .93, fp));
}
vec3 kTile(){
  if (abs(vNL.y) < .5) return uColA * .55;
  vec2 p = vL.xz; float rh = .42, tw = .5;
  float r = floor(p.y / rh), fy = fract(p.y / rh);
  float x = p.x / tw + .5 * mod(r, 2.); float cx = floor(x), fx = fract(x);
  float id = h21(vec2(cx, r));
  vec3 c = mix(uColA, uColB, id * .8);
  c *= .8 + .3 * sin(3.14159 * fx);
  float sc = fy - .16 * (1. - sin(3.14159 * fx));
  c *= mix(.58, 1., smoothstep(-.05, .25, sc));
  c *= 1. + .14 * smoothstep(.78, .95, fy);
  c *= .95 + .1 * vn(p * 9.);
  return mix(c, c * 1.12 + vec3(.05, .04, 0.), smoothstep(.7, .9, fbm(p * 1.1)) * .5);
}
vec3 kThatch(){
  vec2 p = vL.xz; float rh = .62; float r = floor(p.y / rh), fy = fract(p.y / rh);
  float s = vn(vec2(p.x * 16., p.y * 1.8 + r * 3.)), s2 = vn(vec2(p.x * 40., p.y * 3.));
  vec3 c = mix(vec3(.66, .47, .17), vec3(.94, .77, .35), s * .7 + s2 * .3);
  c *= mix(.62, 1., smoothstep(0., .3, fy + .12 * sin(p.x * 5. + r)));
  c = mix(c, vec3(.62, .53, .33), smoothstep(.65, .85, fbm(p * .7)) * .4);
  if (abs(vNL.y) < .5) c *= .72;
  return c;
}
vec3 kLeaf(vec3 N, out vec3 Np){
  vec4 v = vor3(vW * 2.1);
  vec3 cn = normalize(-v.xyz + N * .9);
  Np = normalize(mix(N, cn, .6));
  vec3 c = uColA * (.9 + .2 * h31(floor(vW * 2.1 - v.xyz * .01)));
  return c * mix(.86, 1., smoothstep(0., .2, v.w));
}
vec3 kBark(){
  if (vNL.y > .6){
    float r = length(vL.xz);
    float ring = fract(r * 10. + vn(vL.xz * 6.) * .6);
    vec3 c = mix(vec3(.87, .71, .47), vec3(.74, .55, .33), smoothstep(.6, .9, ring));
    return mix(c, vec3(.42, .26, .14), smoothstep(uParam - .08, uParam - .03, r));
  }
  float a = atan(vL.z, vL.x);
  return vec3(.47, .30, .17) * (.75 + .35 * vn(vec2(a * 6., vL.y * 1.8))) * (.9 + .15 * vn(vec2(a * 20., vL.y * 4.)));
}
vec3 kAwning(){
  vec3 c = mix(vec3(.86, .30, .21), vec3(.97, .92, .83), step(.5, fract(vL.x / .8 + .25)));
  c *= .9 + .1 * sin(vL.x / .8 * 12.566);
  c *= .95 + .07 * vn(vL.xz * 5.);
  if (abs(vNL.y) < .5 && abs(vNL.z) < .5) c *= .8;
  return c;
}
vec3 kWater(){
  float r = length(vL.xy) / max(uParam, .01);
  vec3 c = mix(vec3(.18, .45, .68), vec3(.08, .22, .42), smoothstep(.2, 1., r));
  float rip = vn(vL.xy * 7. + vec2(uTime * .6, uTime * .4)) * vn(vL.xy * 5. - vec2(uTime * .5, 0.));
  c += vec3(.55, .75, .9) * smoothstep(.33, .5, rip) * .6;
  return mix(c, vec3(.05, .1, .18), smoothstep(.8, 1., r));
}
vec3 kFloor(vec2 p){
  float pw = .34; float r = floor(p.y / pw), fy = fract(p.y / pw);
  float len = 1.7; float x = p.x / len + h21(vec2(r, 4.)); float cx = floor(x), fx = fract(x);
  float id = h21(vec2(cx, r));
  vec3 c = uColA * (.82 + .3 * id);
  c *= .88 + .18 * vn(vec2(p.x * 2.5 + id * 9., p.y * 40.));
  float e = min(min(fy, 1. - fy) * pw, min(fx, 1. - fx) * len);
  return mix(c * .45, c, smoothstep(.006, .02, e));
}
vec3 kRug(){
  vec2 q = abs(vL.xz); vec2 d = vec2(uParam, uAxis) - q; float e = min(d.x, d.y);
  vec3 c = mix(uColB, uColA, smoothstep(.1, .12, e));
  float pat = abs(fract((q.x + q.y) * 2.2) - .5);
  c = mix(c, uColB * 1.25, step(.2, e) * step(pat, .06) * .7);
  c = mix(c, vec3(.92, .72, .36), step(abs(e - .06), .013));
  return c * (.92 + .1 * vn(vL.xz * 30.));
}
vec3 kWindow(){
  vec2 hs = vec2(uParam, uAxis); vec2 q = vL.xy / hs;
  vec3 sky = mix(vec3(.62, .84, .98), vec3(.88, .96, 1.), q.y * .5 + .5);
  vec3 hill = vec3(.47, .71, .32) * (.9 + .2 * vn(vL.xy * 8.));
  vec3 c = mix(hill, sky, step(-.25 + .18 * sin(vL.x * 7.), q.y));
  c += .22 * step(abs(q.x - q.y * .6 - .2), .08);
  float fr = step(.8, abs(q.x)) + step(.78, abs(q.y)) + step(abs(q.x), .06) + step(abs(q.y + .05), .05);
  return mix(c, vec3(.42, .25, .12), clamp(fr, 0., 1.));
}
vec3 kGlass(){
  vec2 hs = vec2(uParam, uAxis); vec2 q = vL.xy / hs;
  vec3 c = mix(vec3(.16, .2, .27), vec3(.3, .38, .46), q.y * .5 + .5);
  c += .25 * step(abs(q.x + q.y * .7 - .1), .1) + .12 * step(abs(q.x + q.y * .7 - .42), .05);
  float fr = step(.8, abs(q.x)) + step(.78, abs(q.y)) + step(abs(q.x), .07) + step(abs(q.y), .06);
  return mix(c, vec3(.45, .28, .15), clamp(fr, 0., 1.));
}
vec3 kFlowers(vec2 p){
  vec2 rel; vec3 v = vor(p * 9., rel);
  vec3 g = vec3(.25, .45, .15) * (.8 + .3 * vn(p * 12.));
  vec3 pal = v.z < .33 ? vec3(.92, .25, .2) : (v.z < .66 ? vec3(.98, .62, .2) : vec3(.95, .45, .62));
  return mix(g, pal, 1. - smoothstep(.18, .26, v.x));
}
vec3 kBarrel(){
  if (vNL.y > .6) return vec3(.58, .38, .21) * (.85 + .2 * vn(vL.xz * 14.));
  float a = atan(vL.z, vL.x) * uParam;
  float st = fract(a / .17);
  vec3 c = vec3(.62, .40, .21) * (.85 + .25 * h21(vec2(floor(a / .17), 2.)));
  c *= mix(.62, 1., smoothstep(0., .1, st) * smoothstep(1., .9, st));
  float y = vL.y / uAxis;
  float band = step(abs(y - .25), .06) + step(abs(y + .25), .06) + step(abs(y - .8), .05) + step(abs(y + .8), .05);
  return mix(c, vec3(.34, .31, .3), clamp(band, 0., 1.));
}

vec3 albedo(vec3 N, inout vec3 Np, inout float unlit){
  if (uKind == 1) return kGrass(vW.xz);
  if (uKind == 2) return kDirt(vW.xz);
  if (uKind == 3) return kCobble(vW.xz, vec3(.60, .58, .53), vec3(.80, .76, .67));
  if (uKind == 4) return stones(faceUV(N), uColA, uColB, uColA * .62, .3, .5);
  if (uKind == 5) return kPlaster(faceUV(N), vW.y);
  if (uKind == 6) return kWood();
  if (uKind == 7) return kTile();
  if (uKind == 8) return kThatch();
  if (uKind == 9) return kLeaf(N, Np);
  if (uKind == 10) return kBark();
  if (uKind == 11) return kAwning();
  if (uKind == 12){ unlit = 1.; return kWater(); }
  if (uKind == 13) return uColA * (.88 + .24 * vn(vW.xz * 30.));
  if (uKind == 14) return kFloor(vW.xz);
  if (uKind == 15) return stones(faceUV(N), uColA, uColB, uColA * .78, .28, .46);
  if (uKind == 16) return kRug();
  if (uKind == 17) return uColA * (.84 + .26 * fbm(vL.xz * 3. + vL.y * 2.));
  if (uKind == 19){ unlit = 1.; return kWindow(); }
  if (uKind == 20){ unlit = 1.; return uColA * (.85 + .3 * vn(vL.xy * 6. + vec2(0., -uTime * 3.))); }
  if (uKind == 21) return kFlowers(vW.xz + vW.y);
  if (uKind == 22) return kBarrel();
  if (uKind == 23) return kGlass();
  if (uKind == 24) return kCobble(vW.xz * .55, uColA, uColB);
  if (uParam > 0. && vL.y > uParam) return uColB;
  return uColA * (.94 + .1 * vn(vL.xy * 9. + vL.z * 3.));
}

float sunVis(vec3 N){
  vec4 sc = uSunVP * vec4(vW + N * .035, 1.);
  vec3 s = sc.xyz / sc.w * .5 + .5;
  if (s.x < 0. || s.x > 1. || s.y < 0. || s.y > 1. || s.z > 1.) return 1.;
  float tx = 1. / 2048.;
  vec2 wob = (vec2(vn(vW.xz * 2.2 + vW.y), vn(vW.zx * 2.2 - vW.y + 4.)) - .5) * 4. * tx;
  float sum = 0.;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++)
    sum += step(s.z - .0011, texture2D(uSunDepth, s.xy + wob + vec2(float(x), float(y)) * 1.5 * tx).r);
  return sum / 9.;
}
float ptAtt(vec3 P){ vec3 d = P - vW; return 1. / (1. + dot(d, d) * .9); }
vec3 ptLight(vec3 P, vec3 C, vec3 N){ vec3 d = P - vW; float l2 = dot(d, d); return C * max(dot(N, d * inversesqrt(l2)) * .6 + .4, 0.) / (1. + l2 * .9); }

float linZ(float d){ float n = uProjNF.x, f = uProjNF.y; float z = d * 2. - 1.; return 2. * n * f / (f + n - z * (f - n)); }

void main(){
  vec3 N = normalize(vN);
  if (!gl_FrontFacing) N = -N;
  if (uMode == 2){ gl_FragColor = vec4(N * .5 + .5, float(uKind) / 255.); return; }
  float ao = abs(N.y) < .5 ? mix(.74, 1., smoothstep(0., .75, vW.y)) : 1.;
  bool block = uMode == 0 || (uMode == 3 && gl_FragCoord.x < uWipe);
  // 插畫視角：相機就在投影機上，畫面上每一點都看得到，直接取畫
  if (!block && uMode == 3 && uTrust > .5 && uHasPaint > .5 && uLive < .5){
    vec4 pc = uProjVP * vec4(vW, 1.); vec3 nd = pc.xyz / pc.w;
    if (abs(nd.x) < 1. && abs(nd.y) < 1.){
      vec3 col = texture2D(uPaint, nd.xy * .5 + .5).rgb;
      col *= 1. + uFlick * ptAtt(uPt0) * 2.2;
      if (uCloud > 0.) col *= 1. - uCloud * smoothstep(.5, .78, fbm(vW.xz * .035 + uTime * vec2(.016, .007)));
      if (uCover > .5) col = mix(col, vec3(.35, .85, .45), .42);
      gl_FragColor = vec4(col, 1.); return;
    }
  }
  float sh = sunVis(N);
  if (block){
    float ndl = max(dot(N, uSunDir), 0.);
    vec3 c = uBlock * (.58 + .42 * ndl * mix(.45, 1., sh)) * (.92 + .08 * N.y) * mix(1., ao, .6);
    c += uBlock * (ptLight(uPt0, uPtC0, N) + ptLight(uPt1, uPtC1, N)) * .5;
    if (uKind == 19 || uKind == 20) c = uBlock;
    gl_FragColor = vec4(c, 1.); return;
  }
  float unlit = 0.; vec3 Np = N;
  vec3 alb = albedo(N, Np, unlit);
  float lit = 1.; vec3 col = alb;
  if (unlit < .5){
    float ndl = dot(Np, uSunDir);
    float t = smoothstep(-.06 - uWrap * .35, .16, ndl + (vn(vW.xz * 4. + vW.y * 3.) - .5) * .12);
    lit = t * sh;
    vec3 L = mix(uShadeCol, uLightCol, lit);
    col = alb * (L + uAmb * (.6 + .4 * N.y)) * ao;
    col += alb * (ptLight(uPt0, uPtC0, Np) + ptLight(uPt1, uPtC1, Np));
    if (uKind == 13) col += vec3(.35) * smoothstep(.75, .95, dot(Np, normalize(uSunDir + vec3(0., .4, .6)))) * sh;
  }
  if (uMode == 1){ gl_FragColor = vec4(col, lit); return; }
  // 投影：從同一台相機把重繪的畫投回幾何
  float vis = 0.;
  if (uHasPaint > .5 && uLive < .5){
    vec4 pc = uProjVP * vec4(vW, 1.); vec3 nd = pc.xyz / pc.w; vec2 uv = nd.xy * .5 + .5;
    if (pc.w > 0. && abs(nd.x) < 1. && abs(nd.y) < 1.){
      if (uTrust > .5) vis = 1.;
      else {
        float bias = .05 + pc.w * .006; float tx = 1.25 / 2048.;
        vis  = step(pc.w, linZ(texture2D(uProjDepth, uv).r) + bias) * .4;
        vis += step(pc.w, linZ(texture2D(uProjDepth, uv + vec2(tx, 0.)).r) + bias) * .15;
        vis += step(pc.w, linZ(texture2D(uProjDepth, uv - vec2(tx, 0.)).r) + bias) * .15;
        vis += step(pc.w, linZ(texture2D(uProjDepth, uv + vec2(0., tx)).r) + bias) * .15;
        vis += step(pc.w, linZ(texture2D(uProjDepth, uv - vec2(0., tx)).r) + bias) * .15;
        vis = smoothstep(.45, .9, vis) * smoothstep(.02, .22, dot(N, normalize(uProjPos - vW)));
        vis *= smoothstep(1., .96, max(abs(nd.x), abs(nd.y)));
      }
      col = mix(col, texture2D(uPaint, uv).rgb, vis);
    }
  }
  col *= 1. + uFlick * ptAtt(uPt0) * 2.2;
  if (uCloud > 0.) col *= 1. - uCloud * smoothstep(.5, .78, fbm(vW.xz * .035 + uTime * vec2(.016, .007)));
  if (uCover > .5) col = mix(col, vis > .5 ? vec3(.35, .85, .45) : vec3(1., .48, .16), .42);
  gl_FragColor = vec4(col, 1.);
}`;

// 後製：描邊、接觸陰影（只在重繪時用）
const QUAD_VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`;
const INK_FS = /* glsl */`
varying vec2 vUv;
uniform sampler2D tPaint; uniform sampler2D tG; uniform sampler2D tD; uniform vec2 uTex; uniform vec2 uNF; uniform float uS;
float lin(float d){ float z = d * 2. - 1.; return 2. * uNF.x * uNF.y / (uNF.y + uNF.x - z * (uNF.y - uNF.x)); }
bool isFlat(float k){ return k == 1. || k == 2. || k == 3. || k == 14. || k == 24. || k == 16.; }
void main(){
  vec4 p = texture2D(tPaint, vUv); vec4 g = texture2D(tG, vUv);
  float d0 = texture2D(tD, vUv).r; float z0 = lin(d0);
  float k0 = floor(g.a * 255. + .5); vec3 n0 = g.rgb * 2. - 1.;
  if (k0 < .5){ gl_FragColor = p; return; }
  float edge = 0.;
  for (int i = 0; i < 8; i++){
    float a = float(i) * .7854;
    vec2 o = vec2(cos(a), sin(a)) * uTex * 1.6 * uS;
    vec4 gi = texture2D(tG, vUv + o); float ki = floor(gi.a * 255. + .5);
    float zi = lin(texture2D(tD, vUv + o).r);
    float dz = (zi - z0) / z0;
    if (dz > .012 || ki < .5) edge = max(edge, 1.);
    vec3 ni = gi.rgb * 2. - 1.;
    if (abs(dz) < .012 && ki == k0 && k0 != 9. && dot(n0, ni) < .5) edge = max(edge, .55);
    if (ki != k0 && ki > .5 && abs(dz) < .012 && !(isFlat(ki) && isFlat(k0))) edge = max(edge, .65);
  }
  float ao = 0.;
  for (int i = 0; i < 12; i++){
    float a = float(i) * 2.39996; float r = sqrt(float(i) + .5) / 3.46 * 15. * uS;
    float zi = lin(texture2D(tD, vUv + vec2(cos(a), sin(a)) * r * uTex).r);
    float dd = z0 - zi; ao += smoothstep(.05, .4, dd) * (1. - smoothstep(1.4, 3.2, dd));
  }
  vec3 col = p.rgb * (1. - .32 * ao / 12.);
  vec3 inkc = p.rgb * vec3(.34, .27, .22) + vec3(.05, .025, .01);
  col = mix(col, inkc, edge * .92);
  gl_FragColor = vec4(col, p.a);
}`;

// 移軸模糊＋暗角
const POST_FS = /* glsl */`
varying vec2 vUv;
uniform sampler2D tCol; uniform vec2 uRes; uniform float uWipe; uniform float uFocus; uniform float uBlur; uniform float uVig; uniform float uT; uniform float uFade;
float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main(){
  float d = abs(vUv.y - uFocus);
  float amt = smoothstep(.22, .65, d) * uBlur * .8;
  vec3 c = vec3(0.);
  if (amt < .02) c = texture2D(tCol, vUv).rgb;
  else {
    for (int i = 0; i < 16; i++){
      float a = float(i) * 2.39996; float r = sqrt(float(i) + .5) / 4.;
      c += texture2D(tCol, vUv + vec2(cos(a), sin(a)) * r * amt * vec2(uRes.y / uRes.x, 1.) * .011).rgb;
    }
    c /= 16.;
  }
  vec2 q = (vUv - .5) * vec2(1.05, 1.);
  c *= mix(1., .78, smoothstep(.42, .92, length(q)) * uVig);
  c += (h(vUv * uRes + uT) - .5) * .022;
  c = mix(c, vec3(1., .98, .93), (1. - smoothstep(1., 2.6, abs(gl_FragCoord.x - uWipe))) * step(1., uWipe) * step(uWipe, uRes.x - 2.));
  c *= uFade;
  gl_FragColor = vec4(c, 1.);

const SPR_VS = /* glsl */`
uniform vec3 uFeet; uniform vec2 uSize; uniform vec3 uCamR; uniform vec3 uCamU; uniform vec3 uHR;
varying vec2 vUv;
void main(){
  vUv = uv; vec2 q = vec2(uv.x - .5, uv.y);

  vec3 pv = uFeet + uHR * q.x * uSize.x + vec3(0., 1., 0.) * q.y * uSize.y;
  vec4 cf = projectionMatrix * viewMatrix * vec4(pf, 1.);

  cf.z = (cv.z / cv.w - .0004) * cf.w;

void main(){ vec4 c = texture2D(tMap, vUv); if (c.a < .45) discard; gl_FragColor = vec4(c.rgb * uTint, 1.); }`;

function makeScene(name, o) {
  const S = { name, title: o.title, scene: new T.Scene(), root: new T.Group(), col: [], doors: [], items: [], npcs: [], fx: [], tick: [],
    baked: false, clear: new T.Color(o.clear), zoom: o.zoom, bounds: o.bounds, outdoor: o.outdoor ? 1 : 0, foot: o.foot, tint: v3(o.tint || [1, 1, 1]) };
  S.scene.add(S.root);
  S.U = {
    uSunDepth: { value: null }, uSunVP: { value: new T.Matrix4() }, uSunDir: { value: v3(o.sun).normalize() },
    uLightCol: { value: v3(o.light) }, uShadeCol: { value: v3(o.shade) }, uAmb: { value: v3(o.amb) },
    uPt0: { value: v3(o.pt0 || [0, -99, 0]) }, uPtC0: { value: v3(o.ptc0 || [0, 0, 0]) },
    uPt1: { value: v3(o.pt1 || [0, -99, 0]) }, uPtC1: { value: v3(o.ptc1 || [0, 0, 0]) },
    uFlick: { value: 0 }, uCloud: { value: o.cloud || 0 }, uOutdoor: { value: S.outdoor },
    uPaint: { value: null }, uProjDepth: { value: null }, uProjVP: { value: new T.Matrix4() }, uProjPos: { value: new T.Vector3() },
    uProjNF: { value: new T.Vector2(o.near, o.far) }, uHasPaint: { value: 0 }
  };
  const P = S.proj = new T.PerspectiveCamera(o.fov, 1.6, o.near, o.far);
  P.position.copy(v3(o.cam)); P.lookAt(v3(o.look)); P.updateMatrixWorld(); P.updateProjectionMatrix();
  P.layers.set(0); P.layers.enable(3);
  S.U.uProjVP.value.multiplyMatrices(P.projectionMatrix, P.matrixWorldInverse);
  S.U.uProjPos.value.copy(P.position);
  const sc = S.sunCam = new T.OrthographicCamera(-o.sunR, o.sunR, o.sunR, -o.sunR, 1, 140);
  const c = v3(o.sunC); sc.position.copy(c).addScaledVector(S.U.uSunDir.value, 60); sc.lookAt(c); sc.updateMatrixWorld();
  sc.layers.set(0); sc.layers.enable(2);
  S.U.uSunVP.value.multiplyMatrices(sc.projectionMatrix, sc.matrixWorldInverse);
  S.sunRT = new T.WebGLRenderTarget(SUN_RES, SUN_RES); S.sunRT.depthTexture = new T.DepthTexture(SUN_RES, SUN_RES);
  S.U.uSunDepth.value = S.sunRT.depthTexture;

}

    uKind: { value: kind }, uColA: { value: v3(o.a || [1, 1, 1]) }, uColB: { value: v3(o.b || o.a || [1, 1, 1]) }, uBlock: { value: v3(o.k || [.8, .8, .8]) },
    uParam: { value: o.p || 0 }, uAxis: { value: o.ax || 0 }, uLive: { value: o.live ? 1 : 0 }, uCyl: { value: o.cyl || 0 }, uWrap: { value: o.wrap || 0 }

}

function room(S, o) {
  const W = o.w, D = o.d, H = o.h, t = .36, bz = -D / 2 - t / 2;
  box(S, o.floor, W + 2 * t, .14, D + t, 0, -.14, -t / 2);
  box(S, o.lip, W + 2 * t, .5, .3, 0, -.5, D / 2 + .15);
  // 後牆（挖窗）
  const wins = o.wins, ww = .9, y0 = 1.32, y1 = 2.18;
  box(S, o.wall, W + 2 * t, y0, t, 0, 0, bz);
  box(S, o.wall, W + 2 * t, H - y1, t, 0, y1, bz);
  let xs = -W / 2 - t;
  for (const wx of wins.concat([W / 2 + t + ww / 2])) {
    const xe = wx - ww / 2;
    if (xe - xs > .01) box(S, o.wall, xe - xs, y1 - y0, t, (xs + xe) / 2, y0, bz);
    xs = wx + ww / 2;
  }
  for (const wx of wins) {

    box(S, o.trim, ww + .16, .09, t + .12, wx, y0 - .09, bz);
  }
  for (const sx of [-1, 1]) box(S, o.wall, t, H, D + t, sx * (W / 2 + t / 2), 0, -t / 2);
  box(S, o.trim, W, .14, .05, 0, 0, -D / 2 + .025);
  add(S, new T.BoxGeometry(W + 2 * t, .2, D + 2 * t), o.wall, 0, H + .1, -t / 2, 0, 0, 2);
  S.exit = { x: 0, z: D / 2 - .3, r: .75 };
}

// ═══ 步驟二到四：截圖、重繪、投影 ═══
const quadScene = new T.Scene(), quadCam = new T.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quad = new T.Mesh(new T.PlaneGeometry(2, 2)); quad.frustumCulled = false; quadScene.add(quad);
const inkMat = new T.ShaderMaterial({ vertexShader: QUAD_VS, fragmentShader: INK_FS, depthTest: false, depthWrite: false,
  uniforms: { tPaint: { value: null }, tG: { value: null }, tD: { value: null }, uTex: { value: new T.Vector2() }, uNF: { value: new T.Vector2() }, uS: { value: 1 } } });
const copyMat = new T.ShaderMaterial({ vertexShader: QUAD_VS, fragmentShader: `varying vec2 vUv; uniform sampler2D t; void main(){ gl_FragColor = texture2D(t, vUv); }`,
  uniforms: { t: { value: null } }, depthTest: false, depthWrite: false });
const depthOnly = new T.MeshBasicMaterial({ colorWrite: false });

function readRT(rt) {
  const w = rt.width, h = rt.height, buf = new Uint8Array(w * h * 4);
  let src = rt;
  if (rt.samples > 0) {
    src = new T.WebGLRenderTarget(w, h); copyMat.uniforms.t.value = rt.texture; quad.material = copyMat;
    R.setRenderTarget(src); R.clear(); R.render(quadScene, quadCam);
  }
  R.readRenderTargetPixels(src, 0, 0, w, h, buf);
  if (src !== rt) src.dispose();
  return buf;
}
function toCanvas(buf, w, h, cvs) {
  cvs = cvs || document.createElement('canvas'); cvs.width = w; cvs.height = h;
  const ctx = cvs.getContext('2d'), img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) img.data.set(buf.subarray((h - 1 - y) * w * 4, (h - y) * w * 4), y * w * 4);
  for (let i = 3; i < img.data.length; i += 4) img.data[i] = 255;
  ctx.putImageData(img, 0, 0); return cvs;
}
function renderSun(S) {
  S.scene.overrideMaterial = depthOnly;
  R.setRenderTarget(S.sunRT); R.setClearColor(0, 1); R.clear(); R.render(S.scene, S.sunCam);
  S.scene.overrideMaterial = null;
}
// 從某台相機拍一張小圖（流程縮圖用）
function snap(S, camera, mode, w, h) {
  const rt = new T.WebGLRenderTarget(w, h, { samples: 4 });
  GU.uMode.value = mode; const tr = GU.uTrust.value; GU.uTrust.value = 0;
  R.setRenderTarget(rt); R.setClearColor(S.clear, 1); R.clear(); R.render(S.scene, camera);
  const c = toCanvas(readRT(rt), w, h); rt.dispose(); GU.uMode.value = 3; GU.uTrust.value = tr; R.setRenderTarget(null);
  return c;
}

  const outRT = new T.WebGLRenderTarget(W, H);

    let gx = 0, gz = 0;
    if (!talking) {
      if (c.goal) { gx = c.goal[0] - c.x; gz = c.goal[1] - c.z; if (Math.hypot(gx, gz) < .15) { c.goal = null; c.idle = 1.5 + Math.random() * 3.5; gx = gz = 0; } }
      else { c.idle -= dt; if (c.idle <= 0) { const a = Math.random() * 6.28, r = Math.random() * c.wander; c.goal = [c.home[0] + Math.cos(a) * r, c.home[1] + Math.sin(a) * r]; } }
      const pd = Math.hypot(player.x - c.x, player.z - c.z);
      if (pd < 1.8 && !c.goal) c.face = [player.x - c.x, player.z - c.z];
    }
    moveChar(c, gx * .5, gz * .5, 1.1, dt);
  }
  if (cur.outdoor) { st.birdT -= dt; if (st.birdT < 0) { SFX.bird(); st.birdT = 2.5 + Math.random() * 5; } }
  else if (cur.fire) { st.crackT -= dt; if (st.crackT < 0) { SFX.crackle(); st.crackT = .05 + Math.random() * .4; } }
  // 火光閃爍
  cur.U.uFlick.value = cur.fire ? (Math.sin(t * 9.3) * .5 + Math.sin(t * 23.1) * .3 + Math.sin(t * 4.1) * .4) * .06 : 0;
  if (cur.glow) cur.glow.material.uniforms.uI.value = .42 + cur.U.uFlick.value * 2.5;
  for (const f of cur.tick) f(dt);
  // 對照掃描線
  const w = postMat.uniforms.uRes.value.x;
  if (st.wipeT >= 0) { st.wipeT = Math.min(1, st.wipeT + dt / 1.1); st.wipe = st.wipeOn ? lerp(-1, w + 2, ease(st.wipeT)) : lerp(w + 2, -1, ease(st.wipeT)); if (st.wipeT >= 1) { st.wipeT = -1; st.wipe = st.wipeOn ? w + 2 : -1; } }
  else if (st.phase === 'play' && !st.lockPipe) st.wipe = st.wipeOn ? w + 2 : -1;
  GU.uWipe.value = st.wipe;
  // 對話打字
  if (st.dialog && st.typed < st.full.length) {
    const before = Math.floor(st.typed); st.typed = Math.min(st.full.length, st.typed + dt * 34);
    if (Math.floor(st.typed) > before) { $('dialog').querySelector('p').textContent = st.full.slice(0, Math.floor(st.typed)); if (Math.floor(st.typed) % 2) SFX.blip(); }
  }
}
function onDirt(c) { return Math.hypot(c.x, c.z + 3.2) < 5.6 || (Math.abs(c.x) < 2.4 && c.z > -1); }
function updateMarks() {
  const w = innerWidth, h = innerHeight;
  const cu = tmpV2.setFromMatrixColumn(cam.matrixWorld, 1);
  const place = (el, x, y, z) => { const p = tmpV.set(x + cu.x * y, cu.y * y, z + cu.z * y).project(cam); if (p.z > 1) { el.style.display = 'none'; return; } el.style.display = ''; el.style.transform = `translate(${(p.x * .5 + .5) * w}px,${(1 - (p.y * .5 + .5)) * h}px) translate(-50%,-100%)`; };
  for (const c of Object.values(chars)) {
    if (!c.bubble) continue;
    if (c.S !== cur || c.bubbleT <= 0) { c.bubble.style.display = 'none'; continue; }
    c.bubbleT -= 1 / 60; place(c.bubble, c.x, c.Hq * .97, c.z);
  }
  let hint = $('marks').querySelector('.hint');
  const t = st.phase === 'play' && !st.dialog && !st.transition && st.stage === 4 ? nearest() : null;
  if (t) {
    if (!hint) { hint = document.createElement('div'); hint.className = 'hint'; $('marks').appendChild(hint); }
    const lab = (isTouch ? '' : '<kbd>E</kbd>') + t.label;
    if (hint.dataset.l !== lab) { hint.innerHTML = lab; hint.dataset.l = lab; }
    place(hint, player.x, player.Hq * 1.0, player.z);
  } else if (hint) hint.style.display = 'none';
}
function render() {
  const S = cur;
  for (const c of Object.values(chars)) { const vis = c.S === S; c.mesh.visible = c.shadow.visible = vis; if (vis) drawSprite(c, cam); }
  ptPx.value = postMat.uniforms.uRes.value.y / (2 * Math.tan(T.MathUtils.degToRad(cam.fov) / 2));
  R.setRenderTarget(postRT); R.setClearColor(S.clear, 1); R.clear(); R.render(S.scene, cam);
  const pu = postMat.uniforms;
  pu.uFocus.value = st.focus; pu.uBlur.value = S.outdoor ? 1 : .7; pu.uVig.value = S.outdoor ? .8 : 1.15; pu.uT.value = (pu.uT.value + 1.7) % 100; pu.uFade.value = st.fade;
  quad.material = postMat; R.setRenderTarget(null); R.clear(); R.render(quadScene, quadCam);
}
function loop() {
  const tn = performance.now(), dt = Math.min((tn - lastT) / 1000, 1 / 20); lastT = tn;
  update(dt);
  if (!st.lockPipe || st.phase === 'intro' || st.phase === 'pipe') updateCamera(dt, false);
  render();
  updateMarks();
  if (st.iris < .999) drawIris();
  requestAnimationFrame(loop);
}

// ═══ 開場 ═══
async function start() {
  resize();
  bootMsg('正在編譯著色器…');
  [village, home, bakery].forEach(renderSun);
  await frame();
  updateCamera(0, true);
  GU.uMode.value = 0;
  render();
  $('boot').hidden = true;
  st.phase = 'intro'; $('skip').hidden = false;
  st.iris = 1;
  requestAnimationFrame(loop);
  await runPipeline(village, false);
  $('skip').hidden = true;
  st.phase = 'play'; st.skipNow = false;
  caption('楓溪村', isTouch ? '左下搖桿移動，右下按鈕交談或進屋。' : 'WASD 走動，E 交談或進屋。拖曳畫面可以轉視角。', 4200);
}
$('skip').onclick = () => skipIntro();

window.__pv = {
  st, chars, SCENES, get cur() { return cur.name; },
  tp(x, z) { player.x = x; player.z = z; updateCamera(0, true); },
  enter(n) { const S = SCENES[n]; const d = village.doors.find(d => d.to === n); return enterScene(n, d); },
  exit: () => exitScene(), free: v => { setFree(!!v); }, wipe: v => toggleWipe(!!v), stage: n => setStage(n), cover: () => toggleCover(),
  look(yaw, pitch) { st.fT = st.f = 1; st.yaw = yaw; st.pitch = pitch; updateCamera(0, true); }
};
start().catch(e => { console.warn(e); bootMsg('啟動失敗：' + e.message); $('boot').hidden = false; });
</script>
