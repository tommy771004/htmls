function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(innerWidth*DPR);cv.height=Math.round(innerHeight*DPR);
  const portrait=TOUCH&&innerHeight>innerWidth;
  const availH=portrait?cv.height*.58:cv.height;
  const fit=Math.min(cv.width/W,availH/H),fi=Math.floor(fit);
  S=(fi>=1&&fi/fit>=.8)?fi:fit;
  OX=Math.round((cv.width-W*S)/2);
  OY=portrait?Math.round(Math.max(8*DPR,(availH-H*S)/2+20*DPR)):Math.round((cv.height-H*S)/2);
}
addEventListener('resize',resize);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,sgn=v=>v<0?-1:v>0?1:0;
const approach=(v,t,d)=>v<t?Math.min(v+d,t):Math.max(v-d,t);
const R=Math.random,rr=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rr(a,b+1)),pick=a=>a[Math.floor(R()*a.length)];
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

const KEYMAP={ArrowLeft:['left'],KeyA:['left'],ArrowRight:['right'],KeyD:['right'],ArrowUp:['up'],KeyW:['up'],ArrowDown:['down'],KeyS:['down'],

// ---------------------------------------------------------------- audio
const AU={ctx:null,master:null,mus:null,sfx:null,noise:null,muted:false,waves:{}};
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{AU.ctx=new AC();}catch(e){return;}
  const c=AU.ctx;
  AU.master=c.createGain();AU.master.gain.value=AU.muted?0:.55;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
  AU.master.connect(comp);comp.connect(c.destination);
  AU.mus=c.createGain();AU.mus.gain.value=.3;AU.mus.connect(AU.master);
  AU.sfx=c.createGain();AU.sfx.gain.value=.7;AU.sfx.connect(AU.master);
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  AU.noise=nb;AU.waves.p25=pulseWave(.25);AU.waves.p12=pulseWave(.125);
  seq.next=c.currentTime+.08;
}
function pulseWave(d){const n=48,re=new Float32Array(n),im=new Float32Array(n);for(let i=1;i<n;i++)re[i]=2/(i*Math.PI)*Math.sin(i*Math.PI*d);return AU.ctx.createPeriodicWave(re,im);}
function osc(type,f0,f1,dur,vol,t,dest){
  const c=AU.ctx;if(!c)return;t=t||c.currentTime;
  const o=c.createOscillator(),gn=c.createGain();
  if(AU.waves[type])o.setPeriodicWave(AU.waves[type]);else o.type=type;
  o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(vol,t+.006);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(gn);gn.connect(dest||AU.sfx);o.start(t);o.stop(t+dur+.03);
}
function nz(dur,vol,ft,f0,f1,t,dest,q){
  const c=AU.ctx;if(!c)return;t=t||c.currentTime;
  const s=c.createBufferSource();s.buffer=AU.noise;
  const f=c.createBiquadFilter();f.type=ft||'lowpass';f.frequency.setValueAtTime(f0||2000,t);
  if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);if(q)f.Q.value=q;
  const gn=c.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(gn);gn.connect(dest||AU.sfx);s.start(t,Math.random()*.5);s.stop(t+dur+.03);
}

  bhit(){osc('square',180,55,.12,.24);nz(.1,.34,'lowpass',6000,300);},

  ok(){const t=now();osc('p25',660,660,.05,.11,t);osc('p25',990,990,.09,.11,t+.05);},
  back(){osc('p25',440,300,.08,.09);},
  warn(){osc('square',1320,1320,.05,.06);},
  shoot(){osc('p25',700,240,.09,.09);},
  beam(){nz(.35,.28,'highpass',1500,6000);osc('sawtooth',220,880,.3,.07);},
  commit(){const t=now();[523,784,1046,1568].forEach((f,i)=>osc('p25',f,f,.09,.11,t+i*.07));},
  gate(){osc('square',90,60,.25,.24);nz(.3,.34,'lowpass',600,80);},
  splash(){nz(.25,.24,'bandpass',1200,300,0,0,.7);},
  zap(){osc('sawtooth',1600,200,.18,.09);nz(.15,.14,'highpass',4000);},
  tick(){osc('p12',1500,1500,.03,.08);},
  stamp(){osc('square',196,98,.2,.24);nz(.2,.3,'lowpass',1200,100);},

function sfx(n){if(!AU.ctx||AU.muted)return;try{SFX[n]();}catch(e){}}

const SONGS={

    bass:['r.r.o.r.r.r.o.r.','r.r.o.r.f.f.o.f.'],drum:['k.hsk.hsk.hsk.hs','k.hsk.hsk.hsksss']},
  end:{bpm:116,root:48,scale:[0,2,4,5,7,9,11],prog:[0,3,4,0,5,3,1,4],arp:1,lv:.1,
    lead:['0-2-4-7---4-7-9-','7---5-4-3-------','4-5-7-9---7-9-b-','a---9-7-------..'],

const seq={name:null,s:null,step:0,next:0};
function music(name){
  if(seq.name===name)return;seq.name=name;seq.s=name?SONGS[name]:null;seq.step=0;
  if(AU.ctx){const t=AU.ctx.currentTime;seq.next=t+.1;const gm=AU.mus.gain;gm.cancelScheduledValues(t);gm.setValueAtTime(.0001,t);gm.exponentialRampToValueAtTime(.3,t+.5);}
}
function degM(s,d){const n=s.scale.length,o=Math.floor(d/n),i=((d%n)+n)%n;return s.root+o*12+s.scale[i];}
function mnote(type,m,t,dur,vol){
  const c=AU.ctx,o=c.createOscillator(),gn=c.createGain();
  if(AU.waves[type])o.setPeriodicWave(AU.waves[type]);else o.type=type;
  o.frequency.value=440*Math.pow(2,(m-69)/12);
  gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(vol,t+.008);gn.gain.setTargetAtTime(vol*.6,t+.02,.08);gn.gain.setTargetAtTime(.0001,t+dur,.03);
  o.connect(gn);gn.connect(AU.mus);o.start(t);o.stop(t+dur+.25);
}
function drum(k,t){const d=AU.mus;
  if(k==='k'||k==='x')osc('sine',160,42,.16,.5,t,d);
  if(k==='s'){nz(.14,.26,'highpass',1200,0,t,d);osc('triangle',220,140,.07,.14,t,d);}
  if(k==='h'||k==='x')nz(.035,.08,'highpass',7000,0,t,d);
}
function schedule(){
  const c=AU.ctx;if(!c||!seq.s||c.state!=='running')return;
  const s=seq.s,sd=60/s.bpm/4;
  if(seq.next<c.currentTime-.2)seq.next=c.currentTime+.05;
  while(seq.next<c.currentTime+.15){
    const st=seq.step%16,bar=seq.step/16|0,t=seq.next,cd=s.prog[bar%s.prog.length];
    const lb=s.lead[bar%s.lead.length],L=lb[st];
    if(L&&L!=='.'&&L!=='-'){let n=1;while(st+n<16&&lb[st+n]==='-')n++;mnote(s.lw||'p25',degM(s,DG.indexOf(L))+12,t,n*sd*.9,s.lv||.1);}
    const bb=s.bass[bar%s.bass.length],B=bb[st];
    if(B&&B!=='.'&&B!=='-'){let n=1;while(st+n<16&&bb[st+n]==='-')n++;mnote('triangle',degM(s,cd+({r:0,t:2,f:4,o:7}[B]||0))-12,t,n*sd*.9,.22);}
    if(s.arp&&st%2===0)mnote('p12',degM(s,cd+[0,2,4,7][(st/2)%4]),t,sd*1.6,.032);
    const dr=s.drum?s.drum[bar%s.drum.length][st]:'.';if(dr&&dr!=='.')drum(dr,t);
    seq.next+=sd;seq.step++;
  }
}
setInterval(schedule,30);

function ptext(s,x,y,col,sc,align,rows){
  sc=sc||1;s=String(s).toUpperCase();const cw=6*sc,w=s.length*cw-sc;
  if(align==='c')x-=w/2;else if(align==='r')x-=w;x=Math.round(x);y=Math.round(y);
  for(let i=0;i<s.length;i++){const gl=FONT[s[i]];if(!gl)continue;
    for(let r=0;r<7;r++){const b=gl[r];if(!b)continue;g.fillStyle=rows?rows[r]:col;
      for(let c=0;c<5;c++)if(b&(16>>c))g.fillRect(x+i*cw+c*sc,y+r*sc,sc,sc);}}
  return w;
}
// ---------------------------------------------------------------- drawing helpers

// ---------------------------------------------------------------- level build
function buildLevel(wi){
  const Wd=WORLDS[wi],cells=[];for(let r=0;r<ROWS;r++)cells.push([]);
  const L={wi,Wd,cols:0,grid:null,spawns:[],bits:[],cups:[],checks:[],signs:[],lamps:[],deco:[],arenaX:0,gateClosed:false,start:{x:24,y:150}};
  let x0=0;
  for(const name of Wd.chunks){
    const p=typeof name==='string'?CH[name]:name,w=Math.max(...p.map(s=>s.length)),off=ROWS-p.length;
    for(let r=0;r<ROWS;r++){const s=r>=off?p[r-off]:'';for(let c=0;c<w;c++)cells[r].push(s[c]||'.');}
    if(p.arena)L.arenaX=x0*T;
    x0+=w;
  }
  L.cols=x0;L.grid=new Uint8Array(x0*ROWS);
  for(let r=0;r<ROWS;r++)for(let c=0;c<x0;c++){
    const ch=cells[r][c],X=c*T,Y=r*T;let t=0;
    if(ch==='#')t=1;else if(ch==='=')t=2;else if(ch==='^')t=3;else if(ch==='G')t=5;
    else if(ch==='P')L.start={x:X+1,y:Y+T-9};
    else if(ch==='o')L.bits.push({x:X+3,y:Y+3,w:6,h:6,ph:R()*6});
    else if(ch==='c')L.cups.push({x:X+2,y:Y+4,w:8,h:8});
    else if(ch==='K')L.checks.push({x:X+2,y:Y-12,w:8,h:24,on:false});
    else if(ch>='1'&&ch<='9')L.signs.push({x:X,y:Y,n:+ch});
    else if(Wd.en[ch])L.spawns.push({k:Wd.en[ch],x:X,y:Y});
    L.grid[r*x0+c]=t;
  }
  G.lvl=L;L.canvas=renderTiles(L);
  return L;
}
function tile(c,r){const L=G.lvl;if(c<0||c>=L.cols)return 1;if(r<0||r>=ROWS)return 0;return L.grid[r*L.cols+c];}
function solid(c,r){const t=tile(c,r);return t===1||(t===5&&G.lvl.gateClosed);}
function solidPx(x,y){return solid(Math.floor(x/T),Math.floor(y/T));}

function renderTiles(L){
  const c=mk(L.cols*T,H),X=c.getContext('2d'),A=TILE[L.wi],rn=mulberry(L.wi*977+13);

  for(let col=0;col<L.cols;col++){
    if(L.wi===1&&col%13===6&&!isS(col,0)){L.lamps.push({x:col*T+6,y:34+(col*7%3)*6});}
    if(L.wi===2&&col%17===9){L.lamps.push({x:col*T+6,y:0,crystal:1});}

    if(L.wi===1){X.fillStyle='#4a3628';for(let y=0;y<l.y;y+=3)X.fillRect(l.x,y,1,2);X.fillStyle='#3a2a20';X.fillRect(l.x-3,l.y,7,2);X.fillStyle='#ffc46a';X.fillRect(l.x-2,l.y+2,5,4);X.fillStyle='#3a2a20';X.fillRect(l.x-3,l.y+6,7,1);}

    else if(t===2)A.plat(x,y,X);

function spawnEnemy(k,x,y,o){const K=KINDS[k],e=Object.assign({k,K,x,y,w:K.w,h:K.h,vx:0,vy:0,hp:K.hp,face:-1,t:ri(0,60),flash:0,hurt:0,kbx:0,dead:false,ground:false},o||{});
  e.sx=x;K.init&&K.init(e);if(o){if(o.vx!=null)e.vx=o.vx;if(o.vy!=null)e.vy=o.vy;if(o.face)e.face=o.face;}G.ens.push(e);return e;}
function updEnemies(){
  const cm=G.cam.x+W/2;
  for(const e of G.ens){if(e.dead)continue;
    if(Math.abs(e.sx-cm)>W/2+70&&Math.abs(e.x-cm)>W/2+70)continue;
    e.t++;if(e.flash>0)e.flash--;if(e.hurt>0)e.hurt--;e.K.upd(e);
    if(!e.dead&&!P.dead&&ov(e,P))hurtPlayer(1,sgn(P.x+5-(e.x+e.w/2))||1);}
  G.ens=G.ens.filter(e=>!e.dead);
}
function damageEnemy(e,d,dir){
  e.hp-=d;e.flash=7;e.hurt=10;e.kbx=dir*2.2;if(!e.K.fly&&e.ground)e.vy=-1.4;
  sfx('hit');hitstop(3);shake(2);burst(e.x+e.w/2,e.y+e.h/2,6,['#fff',e.K.col[0]],2.2);
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  const x=e.x+e.w/2,y=e.y+e.h/2;e.dead=true;G.kills++;G.score+=e.K.sc;popup(x,e.y-6,'+'+e.K.sc);sfx('kill');hitstop(5);shake(3);
  burst(x,y,16,e.K.col,2.8,{up:1});ringfx(x,y,4,e.K.col[1]);part({x,y,k:'glow',sz:22,col:e.K.col[0],life:16});
  for(let i=ri(1,2);i>0;i--)G.drops.push({x,y,vx:rr(-1.5,1.5),vy:rr(-3,-1.5),t:0});
  e.K.death&&e.K.death(e);
}
function drawEnemies(){for(const e of G.ens){if(e.x<G.cam.x-60||e.x>G.cam.x+W+60)continue;if(e.flash>0&&(e.flash>>1)%2===0)FL='#ffffff';e.K.draw(e);FL=null;}}

function shot(o){G.shots.push(Object.assign({x:0,y:0,vx:0,vy:0,g:0,r:3,life:420,col:'#ff6aa8',kind:'orb',brk:true,dead:false,t:0,tile:true},o));}
function shotBox(s){if(s.kind==='wave')return {x:s.x-5,y:s.y-11,w:10,h:11};if(s.kind==='bar')return {x:s.x-s.w/2,y:s.y-2,w:s.w,h:5};return {x:s.x-s.r,y:s.y-s.r,w:s.r*2,h:s.r*2};}
function explode(x,y,r,safe){sfx('thud');shake(3);burst(x,y,14,['#ffd060','#ff7030','#fff','#5a5068'],2.4,{up:1});ringfx(x,y,4,'#ffb040');part({x,y,k:'glow',sz:30,col:'#ff9040',life:14});
  if(!safe){const dx=P.x+5-x,dy=P.y+4-y;if(dx*dx+dy*dy<(r+5)*(r+5))hurtPlayer(1,sgn(dx));}}
function updShots(){
  for(const s of G.shots){s.t++;s.vy+=s.g;s.x+=s.vx;s.y+=s.vy;if(--s.life<=0)s.dead=true;
    if(s.upd)s.upd(s);
    if(s.tile&&s.t>2&&solidPx(s.x,s.y)){s.dead=true;if(s.kind==='bomb')explode(s.x,s.y-4,16);else burst(s.x,s.y,4,[s.col,'#fff'],1.2);}
    if(s.y>H+30||s.y<-80||s.x<G.cam.x-90||s.x>G.cam.x+W+90)s.dead=true;
    if(!s.dead&&!P.dead&&ov(shotBox(s),P)){hurtPlayer(1,sgn(s.vx)||sgn(P.x+5-s.x));if(!s.pierce){s.dead=true;if(s.kind==='bomb')explode(s.x,s.y,16);}}}
  G.shots=G.shots.filter(s=>!s.dead);
}

    case 'orb':glow(x,y,s.r*4,c,.5);pcirc(g,x,y,s.r,c);px('#fff',x-1,y-1,2,2);break;

const BOSS={};let uid=0;

function damageBoss(b,d,box){

function phaseUp(b,n){const D=BOSS[b.k];b.phase=n;b.inv=80;sfx('roar');shake(8);flash('#ffffff',.55);hitstop(10);
  for(const s of G.shots){burst(s.x,s.y,3,['#fff'],1);}G.shots.length=0;G.haz.length=0;bossSay([D.lines['p'+n]]);D.onPhase&&D.onPhase(b,n);}
function bossDie(b){b.hp=0;b.dying=200;b.inv=999;slowmo(110);music(null);sfx('roar');flash('#fff',.8);hitstop(22);shake(10);G.shots.length=0;G.haz.length=0;
  for(const e of G.ens)if(!e.K.armor&&!e.dead)killEnemy(e);bossSay([BOSS[b.k].lines.die]);G.score+=5000;popup(b.cx,b.cy-24,'+5000','#ffe9a0');}
function updBoss(){
  const b=G.boss;if(!b||b.dead)return;const D=BOSS[b.k];b.t++;b.stT++;if(b.flash>0)b.flash--;if(b.inv>0&&!b.dying)b.inv--;

    if(b.dying<=0){b.dead=true;G.clearT=100;}
    return;}
  D.upd(b);
  if(!P.dead&&b.st!=='intro')for(const bx of D.boxes(b))if(ov(bx,P)){hurtPlayer(1,sgn(P.x+5-(bx.x+bx.w/2))||1);break;}
}
function updHaz(){
  for(const h of G.haz){h.t++;

function drawHaz(){

    else{const k=h.t-h.warn,w=k<3?k*4:h.w*(1-(k-3)/(h.on*1.3));px('#ff5c9a',h.x-w/2-1,0,w+2,180);px('#ffffff',h.x-w/2+1,0,Math.max(1,w-2),180);glow(h.x,90,44,'#ff5c9a',.35);glow(h.x,178,18,'#ffffff',.6);}
  }
}
function trail(h,n,gap){const out=[];let acc=0,need=gap;for(let i=h.length-1;i>0&&out.length<n;i--){const a=h[i],c=h[i-1],d=Math.hypot(a.x-c.x,a.y-c.y);
  while(d>0&&acc+d>=need&&out.length<n){const t=(need-acc)/d;out.push({x:a.x+(c.x-a.x)*t,y:a.y+(c.y-a.y)*t});need+=gap;}acc+=d;}return out;}

function mkSer(i){return {i,side:i?1:-1,col:i?'#4fc3f7':'#ff5c8a',dark:i?'#1d6a9a':'#a02a52',light:i?'#c4ecff':'#ffc4d6',mark:i?'>>>>>>>':'<<<<<<<',st:'hidden',k:0,hist:[],hx:0,hy:0,u:0,cd:i*70,flash:0,dir:1,shot:0};}

  if(type==='arc'){const y0=rr(70,130),h=rr(40,80);s.ey=y0;s.spd=1/150;s.path=u=>({x:lerp(x0,x1,u),y:y0-Math.sin(clamp(u,0,1)*Math.PI)*h});}

    s.path=u=>{const e=u<.22?1-Math.pow(1-u/.22,2):u>.8?1-Math.pow((u-.8)/.2,2):1;return {x:lerp(x0,xin,clamp(e,0,1)),y:y0+Math.sin(u*12)*6};};}

const SAVE=(()=>{let s={unlock:1,best:[0,0,0,0],rank:['','','',''],done:0};try{const j=JSON.parse(localStorage.getItem('clawd202')||'null');if(j&&Array.isArray(j.best))s=Object.assign(s,j);}catch(e){}return s;})();

// ---------------------------------------------------------------- flow
function goto(fn){if(G.trans)return;G.trans={t:0,fn};}
function startLevel(wi,fromCheck){
  const L=buildLevel(wi);G.wi=wi;
  Object.assign(G,{ens:[],shots:[],parts:[],drops:[],after:[],slashes:[],haz:[],amb:[],boss:null,arena:false,say:null,sayQ:[],waterY:999,waterTo:999,clearT:0,lock:0,stop:0,slow:0,flashA:0,shk:0});
  L.totalBits=L.bits.length;
  const ck=fromCheck?G.check:null;let sx=L.start.x,sy=L.start.y;
  if(ck){sx=ck.x;sy=ck.y;Object.assign(G,{score:ck.score,bits:ck.bits,kills:ck.kills,dmg:ck.dmg,time:ck.time});
    L.bits=L.bits.filter(b=>b.x>ck.x+30);L.cups=L.cups.filter(c=>c.x>ck.x+30);L.checks.forEach(c=>{if(c.x<=ck.x+20)c.on=true;});}
  else{Object.assign(G,{score:0,bits:0,kills:0,dmg:0,time:0,check:null});}
  for(const s of L.spawns){if(ck&&s.x<ck.x+70)continue;const K=KINDS[s.k];spawnEnemy(s.k,s.x+(T-K.w)/2,s.y+T-K.h);}
  resetPlayer(sx,sy);G.cam.x=clamp(sx-W/2+40,0,L.cols*T-W);G.look=0;G.pathT=ck?0:320;
  G.state='play';G.stT=0;music(WORLDS[wi].song);
}

  burst(L.arenaX+6,120,20,['#ff5c9a','#fff'],2);
  G.check={x:L.arenaX+40,y:171,score:G.score,bits:G.bits,kills:G.kills,dmg:G.dmg,time:G.time};

function enterClear(){
  const wi=G.wi,Wd=WORLDS[wi],tsec=G.time/60|0,timeB=Math.max(0,(Wd.par-tsec)*20),hitB=G.dmg===0?3000:G.dmg<=2?1500:0,bitPct=Math.min(1,G.bits/Math.max(1,G.lvl.totalBits));

  G.res={tsec,timeB,hitB,bitPct,rank,newBest:G.score>SAVE.best[wi]};
  if(G.score>SAVE.best[wi])SAVE.best[wi]=G.score;
  if(!SAVE.rank[wi]||'CBAS'.indexOf(rank)>'CBAS'.indexOf(SAVE.rank[wi]))SAVE.rank[wi]=rank;

  if(P.dead&&--G.deadT<=0){G.state='over';G.menu=0;G.stT=0;sfx('over');}

function update(){
  G.t++;
  if(pressed.mute)toggleMute();
  if(G.toastT>0)G.toastT--;
  if(G.flashA>0)G.flashA=Math.max(0,G.flashA-.045);
  if(G.trans){G.trans.t++;if(G.trans.t===20)G.trans.fn();if(G.trans.t>=40)G.trans=null;clearPressed();return;}
  let consumed=true;G.stT++;
  switch(G.state){
    case 'title':updAmb(0,0);updParts();if(pressed.ok){sfx('ok');goto(()=>{G.state='select';G.sel=Math.min(SAVE.unlock-1,Math.max(0,G.sel));music('title');});}break;
    case 'select':
      if(pressed.left){G.sel=(G.sel+3)%4;sfx('ui');}if(pressed.right){G.sel=(G.sel+1)%4;sfx('ui');}
      if(pressed.ok){if(G.sel<SAVE.unlock){sfx('ok');goto(()=>{G.wi=G.sel;G.state='intro';G.stT=0;music(null);});}else{sfx('back');toast('先通過前一關才能解鎖');}}
      else if(pressed.back){sfx('back');goto(()=>{G.state='title';G.amb=[];});}
      break;
    case 'intro':if(G.stT===8)sfx('commit');if(G.stT>160||(G.stT>30&&pressed.ok))goto(()=>startLevel(G.wi,false));break;
    case 'play':consumed=updPlay();break;
    case 'pause':menuNav(3);
      if(pressed.back){G.state='play';sfx('back');if(AU.ctx)AU.mus.gain.setTargetAtTime(.3,AU.ctx.currentTime,.05);}
      else if(pressed.ok){sfx('ok');if(AU.ctx)AU.mus.gain.setTargetAtTime(.3,AU.ctx.currentTime,.05);
        if(G.menu===0)G.state='play';else if(G.menu===1)goto(()=>startLevel(G.wi,false));else goto(()=>{G.state='select';G.sel=G.wi;music('title');});}
      break;
    case 'over':updParts();menuNav(2);if(G.stT>40&&pressed.ok){sfx('ok');if(G.menu===0)goto(()=>startLevel(G.wi,!!G.check));else goto(()=>{G.state='select';G.sel=G.wi;music('title');});}break;
    case 'clear':updParts();
      if([30,48,66,84,102].includes(G.stT))sfx('tick');
      if(G.stT===135){sfx('stamp');shake(6);}
      if(G.shk>0){G.shk*=.86;if(G.shk<.3)G.shk=0;}
      if(G.stT>150&&pressed.ok){sfx('ok');if(G.wi<3)goto(()=>{G.wi++;G.sel=G.wi;G.state='intro';G.stT=0;});else goto(()=>{G.state='ending';G.stT=0;G.parts=[];music('end');});}
      else if(G.stT>150&&pressed.back){sfx('back');goto(()=>{G.state='select';G.sel=G.wi;music('title');});}
      break;
    case 'ending':updParts();if(G.stT%4===0)part({x:R()*W,y:-4,vx:rr(-.4,.4),vy:rr(.6,1.4),g:.01,life:240,col:pick(['#d97757','#7fe08a','#4fc3f7','#ff5c9a','#ffd75e','#f4f0ff']),sz:2,drag:1});
      if(G.stT>150&&pressed.ok){sfx('ok');goto(()=>{G.state='title';G.amb=[];G.parts=[];music('title');});}break;
  }
  if(consumed)clearPressed();
}

    lines.forEach((l,i)=>ht(l,W/2,64+i*10,i===5?9:6.5,i===5?'#ffb59a':'#e8eee8','center',i===5?800:500,clamp((s-20-i*12)/30,0,1)));
    ht('總分（各關最佳）'+SAVE.best.reduce((a,b)=>a+b,0),W/2,196,6.5,'#ffd75e','center',700,clamp((s-150)/30,0,1));
    if(s>150&&(t>>5)&1)ht('Enter 回到標題',W/2,207,5.5,'#8a93a6','center',500);}
  if(G.toastT>0){const a=Math.min(1,G.toastT/20);const w=tw(G.toastS,6.5)+14;hbox(W/2-w/2,30,w,13,'rgba(8,8,14,.8)','rgba(255,255,255,.15)',a);ht(G.toastS,W/2,36.5,6.5,'#fff','center',600,a);}
}
function y_(){return 44;}
function uiPlay(){
  const L=G.lvl,camx=Math.round(G.cam.x);
  if(G.pathT>0&&G.state==='play'){const a=Math.min(1,G.pathT/40),p=WORLDS[L.wi].path,w=tw(p,5.5)+10;hbox(8,24,w,11,'rgba(8,10,14,.75)','rgba(127,224,138,.35)',a);ht(p,13,29.5,5.5,'#9fe0a8','left',500,a);}
  if(L.Wd.signs)for(const s of L.signs){const d=Math.abs(P.x+5-(s.x+6));if(d>56)continue;const a=clamp((56-d)/16,0,1),txt=L.Wd.signs[s.n],w=tw(txt,6)+12,x=clamp(s.x+6-camx-w/2,4,W-4-w);
    hbox(x,s.y-30,w,13,'rgba(10,14,18,.85)','rgba(127,224,138,.5)',a);ht(txt,x+w/2,s.y-23.5,6,'#e8ffe8','center',600,a);}
  const b=G.boss;if(b&&!b.dead&&b.st!=='intro'&&!b.gone&&G.state!=='clear'){ht(WORLDS[L.wi].bossName,96,197,5,'#ffb0c8','left',700);}
  const s=G.say;if(s&&G.state==='play'){const n=Math.min(s.text.length,Math.floor(s.t*.7)),a=s.t<8?s.t/8:s.t>s.life-12?(s.life-s.t)/12:1;
    hbox(48,160,288,30,'rgba(8,8,14,.8)','rgba(255,255,255,.12)',a);ht(s.who,W/2,168,5.5,'#ff8fb0','center',700,a);ht(s.text.slice(0,n),W/2,180,7.5,'#f4f0ff','center',600,a);}
}
function uiClear(){
  const r=G.res,s=G.stT;hbox(0,0,W,H,'rgba(4,10,8,.72)');
  ht('BUILD PASSED ✓',W/2,30,14,'#7fe08a','center',800);ht(WORLDS[G.wi].cname+' · '+WORLDS[G.wi].name,W/2,46,6,'#9fb4b0','center',500);
  const mm=t=>(t/60|0)+':'+String(t%60).padStart(2,'0');
  const rows=[['擊退的 bug',String(G.kills)],['收集位元',G.bits+'（'+Math.round(r.bitPct*100)+'%）'],['受到傷害',G.dmg+(r.hitB?'　+'+r.hitB:'')],['用時',mm(r.tsec)+(r.timeB?'　+'+r.timeB:'')],['總分',String(G.score)+(r.newBest?'　NEW BEST':'')]];
  rows.forEach((row,i)=>{const a=clamp((s-30-i*18)/10,0,1);if(a<=0)return;const y=68+i*17;ht(row[0],86,y,7.5,'#c8d0c8','left',500,a);ht(row[1],250,y,7.5,i===4?'#ffd75e':'#ffffff','right',700,a);});
  if(s>=135){const k=clamp((s-135)/8,0,1),sz=lerp(40,22,k),rc={S:'#ffd75e',A:'#7fe08a',B:'#4fc3f7',C:'#c9c2e6'}[r.rank];
    cx.globalAlpha=k*UIA;cx.strokeStyle=rc;cx.lineWidth=2*S;cx.beginPath();cx.arc(OX+306*S,OY+108*S,sz*S*.9,0,Math.PI*2);cx.stroke();cx.globalAlpha=1;
    ht(r.rank,306,109,sz,rc,'center',900,k);ht('RANK',306,82,5,'#9fb4b0','center',600,k);}
  if(s>150&&(G.t>>5)&1)ht(G.wi<3?'Enter 下一關　Esc 關卡選單':'Enter 繼續',W/2,200,6.5,'#ffffff','center',600);
}
function render(){
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';FL=null;
  const st=G.state;
  if(st==='title')drawTitle();else if(st==='select')drawSelect();else if(st==='intro')drawIntro();else if(st==='ending')drawEnding();else drawPlay();
  if(st==='clear'||st==='over')drawParts();
  drawTrans();
  cx.setTransform(1,0,0,1,0,0);cx.globalAlpha=1;cx.fillStyle='#07090c';cx.fillRect(0,0,cv.width,cv.height);
  const dw=Math.round(W*S),dh=Math.round(H*S);
  cx.imageSmoothingEnabled=false;cx.drawImage(low,0,0,W,H,OX,OY,dw,dh);
  cx.imageSmoothingEnabled=true;cx.drawImage(VIG,OX,OY,dw,dh);
  if(G.flashA>0){cx.globalAlpha=Math.min(1,G.flashA);cx.fillStyle=G.flashC;cx.fillRect(OX,OY,dw,dh);cx.globalAlpha=1;}
  const tr=G.trans;UIA=tr?clamp(1-(tr.t<20?tr.t/12:(40-tr.t)/12),0,1):1;
  cx.save();cx.beginPath();cx.rect(OX,OY,dw,dh);cx.clip();drawUI();cx.restore();
}

// ---------------------------------------------------------------- loop & boot
let acc=0,last=performance.now();
function frame(nw){
  const dt=Math.min(100,nw-last);last=nw;acc+=dt;let n=0;
  while(acc>=1000/60&&n<5){update();acc-=1000/60;n++;}if(n>=5)acc=0;
  render();requestAnimationFrame(frame);
}
resize();music('title');
(()=>{const q=new URLSearchParams(location.search),w=+q.get('w');
  if(w>=1&&w<=4){startLevel(w-1,false);if(q.has('boss')){P.x=G.lvl.arenaX-30;G.cam.x=G.lvl.arenaX-W+60;}}
  if(q.has('god'))P.maxhp=P.hp=99;})();
window.__clawd={G,P,SAVE,start(w,boss){startLevel(w,false);if(boss){P.x=G.lvl.arenaX-30;P.y=171;G.cam.x=clamp(P.x-W/2,0,G.lvl.cols*T-W);}},god(){P.maxhp=P.hp=99;},press,release,boxes(b){return BOSS[b.k].boxes(b);}};
requestAnimationFrame(frame);
</script>
