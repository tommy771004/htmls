<style>
:root{
  --bg:#000;
  --glass:rgba(22,20,19,.74);
  --glass-2:rgba(30,27,26,.9);
  --edge:rgba(255,238,226,.07);
  --ink:#eeeae6; --ink-2:#aaa39d; --ink-3:#7f7873;
  --act:#4a1b1f; --act-ink:#f6ecea;
  --red:#d9404a;
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --ease-out:cubic-bezier(.22,.8,.3,1);
  --dur-hover:140ms; --dur-enter:220ms; --dur-exit:140ms;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

/* 上下兩條工具列：同一種玻璃材質 */
.bar{position:fixed;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:2px;padding:5px;
  background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15);
  border-radius:12px;box-shadow:inset 0 0 0 1px var(--edge),inset 0 1px 0 rgba(255,244,236,.05),0 2px 6px rgba(0,0,0,.35);white-space:nowrap}
.bar.top{top:14px}
.bar.bottom{bottom:16px}
.bar button{border:0;background:transparent;color:var(--ink-2);font-size:13.5px;line-height:1;padding:9px 11px;border-radius:8px;cursor:pointer;
  transition:background-color var(--dur-hover) var(--ease-out),color var(--dur-hover) var(--ease-out)}
.bar button:hover{color:var(--ink);background:rgba(255,236,226,.055)}
.bar button[aria-pressed="true"]{background:var(--act);color:var(--act-ink)}
.bar button:focus-visible,.legend button:focus-visible,.pop button:focus-visible,.card .act:focus-visible{outline:2px solid #e9d7cf;outline-offset:1px}
.bar .sep{flex:none;width:1px;height:18px;margin:0 7px;background:rgba(255,236,226,.11);border-radius:1px}
.bar .menu{display:inline-flex;align-items:center;gap:6px}
.bar .menu svg{width:9px;height:6px;opacity:.7;transition:transform var(--dur-hover) var(--ease-out)}
.bar .menu[aria-expanded="true"]{color:var(--ink);background:rgba(255,236,226,.07)}
.bar .menu[aria-expanded="true"] svg{transform:rotate(180deg)}

/* 爆炸程度滑桿 */
.slide{display:flex;align-items:center;gap:10px;padding:0 6px 0 10px}
.slide input{--p:0%;-webkit-appearance:none;appearance:none;width:104px;height:22px;margin:0;background:transparent;cursor:pointer}
.slide input::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--red) 0 var(--p),rgba(255,236,226,.15) var(--p) 100%)}
.slide input::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-6px;border-radius:50%;background:#f4f0ec;border:0;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.slide input::-moz-range-track{height:3px;border-radius:3px;background:rgba(255,236,226,.15)}
.slide input::-moz-range-progress{height:3px;border-radius:3px;background:var(--red)}
.slide input::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#f4f0ec;border:0}
.slide output{width:36px;text-align:right;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* 輪胎配方與塗裝 */
.tyre{display:inline-flex;align-items:center;gap:7px}
.tyre i{width:9px;height:9px;border-radius:50%;background:var(--tc,#d8262c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.bar button.swatch{width:34px;height:31px;padding:0;display:grid;place-items:center}
.swatch i{width:15px;height:15px;border-radius:50%;background:var(--lc,#5a161b);box-shadow:0 0 0 1.5px rgba(255,236,226,.28);transition:background-color .5s var(--ease-out)}

/* 左上角：作品名與操作提示 */
.brand{position:fixed;top:18px;left:22px;z-index:4;pointer-events:none}
.brand b{display:block;font-size:15px;font-weight:650;letter-spacing:.02em}
.brand span{display:block;margin-top:4px;font-size:12px;color:var(--ink-3)}

/* 右上角：規則類別圖例 */
.legend{position:fixed;top:14px;right:14px;z-index:4;display:flex;flex-direction:column;gap:1px;padding:4px}
.legend button{display:flex;align-items:center;gap:9px;border:0;background:transparent;color:var(--ink-2);font-size:12.5px;padding:4px 8px;border-radius:6px;cursor:pointer;text-align:left;
  transition:color var(--dur-hover) var(--ease-out),opacity var(--dur-hover) var(--ease-out),background-color var(--dur-hover) var(--ease-out)}
.legend button i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
.legend button:hover{color:var(--ink);background:rgba(255,236,226,.05)}
.legend.solo button{opacity:.45}
.legend.solo button[aria-pressed="true"]{opacity:1;color:var(--ink)}

/* 圖層與零件的下拉清單 */
.pop{position:fixed;z-index:8;min-width:220px;max-height:min(60vh,520px);overflow:auto;padding:6px;border-radius:12px;
  background:var(--glass-2);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:inset 0 0 0 1px var(--edge),0 6px 18px rgba(0,0,0,.45);
  opacity:0;transform:translateY(-4px);pointer-events:none;visibility:hidden;
  transition:opacity var(--dur-exit) var(--ease-out),transform var(--dur-exit) var(--ease-out),visibility 0s linear var(--dur-exit)}
.pop.on{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition:opacity var(--dur-enter) var(--ease-out),transform var(--dur-enter) var(--ease-out)}
.pop h3{margin:8px 8px 4px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.pop button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink-2);font-size:13px;padding:7px 8px;border-radius:7px;cursor:pointer;text-align:left;
  transition:background-color var(--dur-hover) var(--ease-out),color var(--dur-hover) var(--ease-out)}
.pop button:hover{background:rgba(255,236,226,.06);color:var(--ink)}
.pop button i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
.pop .chk{flex:none;width:15px;height:15px;border-radius:4px;box-shadow:inset 0 0 0 1.5px rgba(255,236,226,.25);display:grid;place-items:center;transition:background-color var(--dur-hover)}
.pop .chk svg{width:9px;height:9px;opacity:0}
.pop [aria-checked="true"] .chk{background:var(--act);box-shadow:none}
.pop [aria-checked="true"] .chk svg{opacity:1}
.pop button small{margin-left:auto;font-size:11px;color:var(--ink-3)}

/* 尺寸標註 */
#dims{position:fixed;inset:0;z-index:2;pointer-events:none}
.dim{position:absolute;left:0;top:0;padding:6px 9px 7px;border-radius:6px;background:rgba(20,18,17,.8);box-shadow:inset 0 0 0 1px rgba(255,236,226,.06);white-space:nowrap;will-change:transform,opacity}
.dim b{display:block;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.dim span{display:block;margin-top:2px;font-size:11px;color:var(--ink-3)}

/* 滑過零件時的說明卡與引線 */
#lead{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
#lead line{stroke:rgba(244,240,236,.62);stroke-width:1}
#lead circle{fill:#111;stroke:#f4f0ec;stroke-width:1.4}
.card{position:fixed;left:0;top:0;z-index:6;width:360px;padding:17px 19px 18px;border-radius:14px;
  background:rgba(21,19,18,.8);-webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2);
  box-shadow:inset 0 0 0 1px var(--edge),inset 0 1px 0 rgba(255,244,236,.05),0 4px 14px rgba(0,0,0,.4);
  opacity:0;visibility:hidden;pointer-events:none;transform:translate3d(var(--x,0),var(--y,0),0) scale(.985);transform-origin:var(--ox,0) 50%;
  transition:opacity var(--dur-exit) var(--ease-out),transform var(--dur-exit) var(--ease-out),visibility 0s linear var(--dur-exit)}
.card.on{opacity:1;visibility:visible;transform:translate3d(var(--x,0),var(--y,0),0);transition:opacity var(--dur-enter) var(--ease-out),transform var(--dur-enter) var(--ease-out)}
.card.pinned{pointer-events:auto}
.card .hd{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--ink-2)}
.card .hd i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.card .hd em{margin-left:auto;font-style:normal;font-weight:400;color:var(--ink-3)}
.card h2{margin:10px 0 9px;font-size:21px;font-weight:650;letter-spacing:.01em;line-height:1.25}
.card p{margin:0 0 9px;font-size:13.5px;line-height:1.6;color:#d7d1cc}
.card p b{color:var(--ink);font-weight:600}
.card .free{display:flex;align-items:center;gap:12px;margin:12px 0 12px;padding:11px 0;font-size:13px;color:var(--ink-3);
  background:linear-gradient(var(--edge),var(--edge)) top/100% 1px no-repeat,linear-gradient(var(--edge),var(--edge)) bottom/100% 1px no-repeat}
.card .meter{display:flex;gap:4px;margin-left:auto}
.card .meter i{width:15px;height:3px;border-radius:2px;background:rgba(255,236,226,.12)}
.card .meter i.on{background:var(--red)}
.card .free b{min-width:48px;color:var(--ink);font-weight:600}
.card ul{margin:0 0 10px;padding:0;list-style:none}
.card li{position:relative;padding-left:16px;margin:0 0 6px;font-size:13.5px;line-height:1.55;color:#d7d1cc}
.card li::before{content:"";position:absolute;left:2px;top:.78em;width:6px;height:1.5px;border-radius:1px;background:var(--ink-3)}
.card .act{display:none;margin-top:4px;border:0;border-radius:8px;padding:9px 13px;background:var(--act);color:var(--act-ink);font-size:13px;cursor:pointer;transition:background-color var(--dur-hover) var(--ease-out)}
.card .act:hover{background:#5b2227}
.card.has-act .act{display:inline-block}
.card .x{display:none}
.card .body{transition:opacity 120ms var(--ease-out)}
.card .body.swap{opacity:.25}

#boot{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--bg);transition:opacity .5s var(--ease-out)}
#boot div{max-width:320px;padding:0 24px;text-align:center;font-size:14px;line-height:1.7;color:var(--ink-2)}
#boot b{display:block;margin-bottom:6px;font-size:16px;color:var(--ink)}
#boot.gone{opacity:0;pointer-events:none}

@media (max-width:1060px){
  .brand{display:none}
  .legend{top:66px}
}
@media (max-width:760px){
  .bar{left:8px;right:8px;transform:none;flex-wrap:wrap;justify-content:center;row-gap:2px;border-radius:11px}
  .bar .sep{display:none}
  .bar.top{top:max(8px,env(safe-area-inset-top))}
  .bar.bottom{bottom:max(10px,env(safe-area-inset-bottom))}
  .bar button{font-size:13px;padding:9px 10px}
  .slide input{width:84px}
  .legend{top:calc(max(8px,env(safe-area-inset-top)) + 84px);left:8px;right:8px;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:0 2px;padding:0}
  .legend button{font-size:11.5px;padding:4px 6px;gap:6px}
  .card{width:auto;left:8px;right:8px;top:auto;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 84px);max-height:52vh;overflow:auto;transform:translate3d(0,10px,0);padding:15px 16px 16px}
  .card.on{transform:none}
  .card .x{display:block;position:absolute;right:8px;top:8px;border:0;background:transparent;color:var(--ink-2);font-size:13px;padding:6px 8px;border-radius:6px;cursor:pointer}
  .card .hd em{display:none}
  .card h2{font-size:19px}
  .dim{padding:5px 7px 6px}
  .dim b{font-size:12px}
  .dim span{font-size:10px}
}
@media (prefers-reduced-motion:reduce){
  .card,.card.on,.pop,.pop.on{transition-duration:1ms}
}
</style>
</head>

{

/* 地板：局部聚光打出光圈，外加手作的平面倒影 */
const reflRT = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
const reflMatrix = new THREE.Matrix4();
const mirrorCam = new THREE.PerspectiveCamera();
const floorMat = new THREE.MeshStandardMaterial({ color: 0x141211, roughness: .82, metalness: 0 });
floorMat.onBeforeCompile = sh => {
  sh.uniforms.tRefl = { value: reflRT.texture };
  sh.uniforms.uReflMat = { value: reflMatrix };
  sh.vertexShader = 'uniform mat4 uReflMat;\nvarying vec4 vRefl;\nvarying vec3 vWp;\n' + sh.vertexShader.replace('#include <project_vertex>',
    '#include <project_vertex>\nvRefl = uReflMat * vec4(position, 1.0);\nvWp = (modelMatrix * vec4(position, 1.0)).xyz;\n');
  sh.fragmentShader = 'uniform sampler2D tRefl;\nvarying vec4 vRefl;\nvarying vec3 vWp;\n' + sh.fragmentShader.replace('#include <opaque_fragment>', `
    vec2 ruv = vRefl.xy / vRefl.w;
    vec3 rc = texture2D(tRefl, ruv).rgb * .36;
    rc += texture2D(tRefl, ruv + vec2(.0035, 0.)).rgb * .16;
    rc += texture2D(tRefl, ruv - vec2(.0035, 0.)).rgb * .16;
    rc += texture2D(tRefl, ruv + vec2(0., .006)).rgb * .16;
    rc += texture2D(tRefl, ruv - vec2(0., .006)).rgb * .16;
    float fade = 1. - smoothstep(2.2, 6.5, length(vWp.xz * vec2(.72, 1.25)));
    outgoingLight += rc * .3 * fade;
    outgoingLight *= 1. - smoothstep(3.2, 8.5, length(vWp.xz * vec2(.8, 1.15)));
    #include <opaque_fragment>`);
};
const floor = new THREE.Mesh(new THREE.PlaneGeometry(70, 70), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

  floor.visible = camera.position.y > .02;
  under.intensity = clamp(-camera.position.y / 2.5, 0, 1) * 2.6;
  scene.environmentIntensity = .85 + (1 - clamp(camera.position.y / 1.5 + 1, 0, 1)) * .6;
  renderer.shadowMap.needsUpdate = true;
  if (floor.visible) renderReflection();
  renderer.setClearColor(0x000000, 1);
  renderer.render(scene, camera);

  const ids = outlineSet();
  const want = ids.size ? 1 : 0;
  st.outlineA += (want - st.outlineA) * (1 - Math.exp(-dt * (reduce ? 60 : 14)));
  if (ids.size) lastIds = ids;
  if (st.outlineA > .01 && lastIds.size) {
    renderMask(lastIds);
    outlineMat.uniforms.uAlpha.value = st.outlineA;
    renderer.autoClear = false; renderer.render(fsScene, fsCam); renderer.autoClear = true;
  }
  updateDims(dt);
  updateLeader();
  frameNo++;
  requestAnimationFrame(frame);
}

/* 手機畫面窄，尺寸標註預設關閉 */
if (innerWidth <= 760) { st.dim.to = 0; document.querySelector('[data-tog=dim]').setAttribute('aria-pressed', 'false'); }
/* 開場：相機從遠處滑入 3/4 視角 */
setCompound(0);
setLivery(0);
camera.position.copy(V(-7.5, 4.2, 9.5).multiplyScalar(fitScale() * 1.15));
camera.lookAt(HOME);
goView('q', 2.2, true);

Object.assign(window.__f1, {
  goView, setMode, focusPart, pin, unpin, camera,
  setE: v => { st.exTween = null; st.e = v; },
  hover: id => { const m = PARTS[id].meshes[0]; st.hover = { id, mesh: m, local: V(0, 0, 0) }; showCard(id, innerWidth * .5, innerHeight * .45); },
  snap: () => { if (camTween) { camTween.start = -1e9; stepCam(performance.now()); } st.rule.v = st.rule.to; st.xray.v = st.xray.to; st.dim.v = st.dim.to; st.nobody.v = st.nobody.to; st.aero.v = st.aero.to; st.liveryCol.copy(st.liveryTo); for (const id in PARTS) { PARTS[id].layerV = st.layers[PARTS[id].layer] ? 1 : 0; PARTS[id].soloV = !st.solo || st.solo === PARTS[id].cat ? 1 : .08; } },
  frames: () => frameNo,
});
requestAnimationFrame(frame);
}
</script>
