<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>明暗五十式 · 50 種材質的明暗開關</title>
<meta name="description" content="50 種材質各自運作的明暗模式開關展示集：WebGL 折射玻璃、黑洞重力透鏡、水銀表面張力、果凍彈簧網格、光圈葉片、輝光管、珠鍊拉繩、摺紙、細胞分裂、莫比烏斯環……每款都有自己的物理、音效與全頁過場。單檔、零外部資源。">
<style>
:root{
  --bg:#e8e8e4;--ink:#161616;--sub:rgba(22,22,22,.58);--line:rgba(22,22,22,.16);
  --glass:rgba(250,250,247,.62);--glassb:rgba(255,255,255,.75);--shadow:0 10px 30px rgba(0,0,0,.08);
  --acc:#e2561c;--ease-out:cubic-bezier(.2,.8,.2,1);--dur:.45s;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
body.dark{
  --bg:#111215;--ink:#ededE7;--sub:rgba(237,237,231,.6);--line:rgba(255,255,255,.16);
  --glass:rgba(22,23,28,.58);--glassb:rgba(255,255,255,.1);--shadow:0 10px 30px rgba(0,0,0,.35);--acc:#ffb25e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Hiragino Sans TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  -webkit-font-smoothing:antialiased;transition:background-color .6s,color .6s}
canvas{position:fixed;left:0;top:0;display:block}
#cv{z-index:0}
#gl{z-index:1;pointer-events:none;display:none}
#fx{z-index:2;touch-action:none;cursor:pointer}
#fx.grab{cursor:grabbing}
#lead{position:fixed;left:0;top:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
#lead path{fill:none;stroke:var(--ink);stroke-width:.8;opacity:.55}
#lead circle{fill:var(--bg);stroke:var(--ink);stroke-width:1;opacity:.8}
.tag{position:fixed;z-index:4;pointer-events:none;font-family:var(--mono);line-height:1.15;white-space:nowrap;
  padding:4px 7px;border-radius:6px;background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .3s}
.tag b{display:block;font-size:9.5px;letter-spacing:.08em;font-weight:600;color:var(--sub)}
.tag i{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.ui{transition:opacity .35s var(--ease-out),transform .35s var(--ease-out)}
#nav{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:6px;
  padding:6px;border-radius:16px;background:var(--glass);border:1px solid var(--glassb);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);max-width:calc(100% - 16px)}
#nav .brand{padding:0 10px 0 8px;line-height:1.1;white-space:nowrap}
#nav .brand b{display:block;font-size:13px;letter-spacing:.04em}
#nav .brand small{display:block;font:600 9px var(--mono);letter-spacing:.14em;color:var(--sub)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.nb{height:36px;min-width:36px;padding:0 10px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line);font-size:14px;transition:background-color var(--dur),transform .15s}
.nb:hover{background:var(--line)}
.nb:active{transform:scale(.96)}
.nb:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#pick{min-width:230px;justify-content:flex-start;font-size:13px;white-space:nowrap;overflow:hidden}
#pick .n{font:700 12px var(--mono);color:var(--acc)}
#pick .t{overflow:hidden;text-overflow:ellipsis}
#tg .sw{width:30px;height:16px;border-radius:9px;background:var(--ink);position:relative;opacity:.85}
#tg .sw:after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--bg);transition:transform .35s var(--ease-out)}
body.dark #tg .sw:after{transform:translateX(14px)}
#info{position:fixed;left:20px;bottom:16px;z-index:5;max-width:min(560px,calc(100% - 40px));pointer-events:none}
#info .cat{font:600 10px var(--mono);letter-spacing:.14em;color:var(--sub);text-transform:uppercase}
#info h1{margin:4px 0 4px;font-size:20px;line-height:1.2;font-weight:800;letter-spacing:.01em}
#info h1 .no{font:800 13px var(--mono);color:var(--acc);margin-right:8px;vertical-align:2px}
#info h1 em{font-style:normal;font-weight:500;color:var(--sub);font-size:15px;margin-left:6px}
#info p{margin:0;font-size:13px;line-height:1.55;color:var(--sub)}
#info .hint{margin-top:6px;font:600 11px var(--mono);color:var(--ink);opacity:.75}
#keys{position:fixed;right:20px;bottom:16px;z-index:5;font:600 10px var(--mono);color:var(--sub);text-align:right;line-height:1.9;pointer-events:none}
#keys kbd{font:inherit;border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:4px;color:var(--ink)}
#extras{position:fixed;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:6px;padding:5px;border-radius:12px;
  background:var(--glass);border:1px solid var(--glassb);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#extras:empty{display:none}
#extras button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);position:relative}
#extras button.on{outline:2px solid var(--ink);outline-offset:1px}
#extras button span{position:absolute;left:50%;top:-22px;transform:translateX(-50%);font:600 10px var(--mono);white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
#extras button:hover span{opacity:1}
#index{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.28);display:none;align-items:flex-start;justify-content:center;padding:70px 12px 12px;overflow:auto}
#index.open{display:flex}
#index .sheet{width:min(980px,100%);border-radius:18px;padding:16px;background:var(--glass);border:1px solid var(--glassb);
  -webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);box-shadow:var(--shadow)}
#index h2{margin:12px 4px 6px;font:700 10px var(--mono);letter-spacing:.14em;color:var(--sub)}
#index h2:first-child{margin-top:0}
#index .row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#index .row button{text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;line-height:1.3;min-height:48px}
#index .row button:hover{background:var(--line)}
#index .row button.cur{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
#index .row b{display:block;font:700 10px var(--mono);color:var(--acc)}
#restore{position:fixed;right:10px;top:10px;z-index:8;display:none;padding:6px 10px;border-radius:9px;font:600 11px var(--mono);
  background:var(--glass);border:1px solid var(--line);opacity:.55}
body.hideui .ui,body.hideui .tag,body.hideui #lead{opacity:0!important;pointer-events:none!important}
body.hideui #restore{display:block}
#note{position:fixed;right:20px;top:18px;z-index:5;font:600 9px var(--mono);color:var(--sub);letter-spacing:.06em;max-width:220px;text-align:right;pointer-events:none}
@media (max-width:760px){
  #nav{top:8px;gap:4px;padding:5px;width:calc(100% - 16px)}
  #nav .brand{display:none}
  #pick{min-width:0;flex:1}
  .nb{height:34px;min-width:34px;padding:0 8px}
  #info{left:14px;bottom:12px;max-width:calc(100% - 28px)}
  #info h1{font-size:17px}
  #info h1 em{display:block;margin:2px 0 0;font-size:13px}
  #info p{font-size:12px;line-height:1.5}
  #keys,#note{display:none}
  #index .row{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){
  .ui,.nb,#tg .sw:after,html,body{transition:none!important}
}
</style>

<body>

<script>
'use strict';
/* ================= 基礎工具 ================= */
const TAU=Math.PI*2,PI=Math.PI,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t)},eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,eo=t=>1-Math.pow(1-clamp(t,0,1),3);
const eob=t=>{const c1=1.70158,c3=c1+1;t=clamp(t,0,1);return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const HX={};
function hex(h){if(HX[h])return HX[h];let s=h.replace('#','');if(s.length===3)s=s.split('').map(c=>c+c).join('');const n=parseInt(s,16);return HX[h]=[n>>16&255,n>>8&255,n&255]}
function mixc(a,b,t,al=1){const A=hex(a),B=hex(b);t=clamp(t,0,1);return 'rgba('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+','+al+')'}
function mixh(a,b,t){const A=hex(a),B=hex(b);t=clamp(t,0,1);return '#'+[0,1,2].map(i=>Math.round(lerp(A[i],B[i],t)).toString(16).padStart(2,'0')).join('')}
function mixs(a,b,t){const P=x=>x.match(/[\d.]+/g).map(Number),A=P(a),B=P(b);t=clamp(t,0,1);return 'rgba('+[0,1,2].map(i=>Math.round(lerp(A[i],B[i],t))).join(',')+','+lerp(A[3],B[3],t).toFixed(3)+')'}
function rgba(h,a){const c=hex(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
function rr(c,x,y,w,h,r,keep){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);if(!keep)c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function cap(c,x,y,w,h){rr(c,x-w/2,y-h/2,w,h,h/2)}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PM=new Uint8Array(512);{const r=rng(7),p=[];for(let i=0;i<256;i++)p[i]=i;for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[p[i],p[j]]=[p[j],p[i]]}for(let i=0;i<512;i++)PM[i]=p[i&255]}
function vn(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),X=xi&255,Y=yi&255;
  const a=PM[PM[X]+Y]/255,b=PM[PM[X+1]+Y]/255,c=PM[PM[X]+Y+1]/255,d=PM[PM[X+1]+Y+1]/255;return lerp(lerp(a,b,u),lerp(c,d,u),v)}
function fbm(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vn(x*f,y*f);f*=2.03;a*=.5}return s}
function glow(c,x,y,r,col,a=1){if(r<=0)return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}
function spr(o,t,k,d,dt){const n=Math.max(1,Math.ceil(dt/.008)),h=dt/n;for(let i=0;i<n;i++){o.v+=(t-o.x)*k*h;o.v*=Math.exp(-d*h);o.x+=o.v*h}}
const MONO='ui-monospace,"SF Mono",Menlo,Consolas,monospace',SANS='-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif';
function txt(c,s,x,y,size,col,al='center',w=600,font=MONO){c.font=w+' '+size+'px '+font;c.textAlign=al;c.textBaseline='middle';c.fillStyle=col;c.fillText(s,x,y)}
function poly(c,pts){c.beginPath();c.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)c.lineTo(pts[i],pts[i+1]);c.closePath()}
const fmt=(v,n=2)=>(+v).toFixed(n);
/* 通用凹槽軌道：dk 0→1 */
function groove(c,w,h,dk,opt={}){
  c.save();cap(c,0,0,w,h);
  const g=c.createLinearGradient(0,-h/2,0,h/2);
  g.addColorStop(0,mixc(opt.l0||'#c9c9c3',opt.d0||'#08090b',dk));g.addColorStop(1,mixc(opt.l1||'#f2f2ee',opt.d1||'#25272c',dk));
  c.fillStyle=g;c.fill();c.clip();
  c.shadowColor='rgba(0,0,0,'+(.28+.3*dk)+')';c.shadowBlur=14;c.shadowOffsetY=5;c.lineWidth=10;c.strokeStyle='rgba(0,0,0,.35)';cap(c,0,0,w+10,h+10);c.stroke();
  c.restore();c.save();cap(c,0,0,w,h);c.lineWidth=1;c.strokeStyle=mixc('#ffffff','#5a5d66',dk,.8);c.stroke();c.restore();
}

/* ================= 音效（WebAudio 即時合成） ================= */
let AC=null,MG=null,muted=false,armed=false;
function au(){if(muted||!armed)return null;if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();MG=AC.createGain();MG.gain.value=.55;const cp=AC.createDynamicsCompressor();MG.connect(cp);cp.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.3,type='sine',g=.2,at=.005,w=0,f2){const a=au();if(!a)return;const t=a.currentTime+w,o=a.createOscillator(),G=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);G.gain.setValueAtTime(0,t);G.gain.linearRampToValueAtTime(g,t+at);G.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(G);G.connect(MG);o.start(t);o.stop(t+d+.05)}
let NB=null;
function noise(d=.1,ft='bandpass',f=2000,q=1,g=.2,w=0,f2){const a=au();if(!a)return;if(!NB){NB=a.createBuffer(1,a.sampleRate*2,a.sampleRate);const D=NB.getChannelData(0);for(let i=0;i<D.length;i++)D[i]=Math.random()*2-1}
  const t=a.currentTime+w,s=a.createBufferSource(),F=a.createBiquadFilter(),G=a.createGain();s.buffer=NB;s.loop=true;F.type=ft;F.frequency.setValueAtTime(f,t);F.Q.value=q;if(f2)F.frequency.exponentialRampToValueAtTime(f2,t+d);
  G.gain.setValueAtTime(0,t);G.gain.linearRampToValueAtTime(g,t+.004);G.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(F);F.connect(G);G.connect(MG);s.start(t,Math.random());s.stop(t+d+.05)}
const SFX={
  glass:d=>{[2093,3136,4186].forEach((f,i)=>tone(d?f*.75:f,1-i*.22,'sine',.07/(i+1),.002));noise(.03,'highpass',7000,1,.06)},
  click:(p=1,g=.32)=>{noise(.025,'bandpass',3200*p,5,g);tone(1700*p,.035,'square',.025)},
  clack:(p=1)=>{noise(.045,'bandpass',1300*p,2,.3);tone(200*p,.06,'triangle',.08)},
  thunk:(p=1)=>{tone(95*p,.35,'sine',.5,.003,0,38*p);noise(.07,'lowpass',700,1,.32)},
  zap:()=>{noise(.4,'highpass',2600,1,.24);tone(110,.32,'sawtooth',.08,.002,0,55);tone(1500,.16,'square',.03,.001,0,260)},
  hum:d=>{tone(d?55:110,.9,'sine',.22,.08);tone(d?82.5:165,.9,'triangle',.05,.1)},
  bubble:(p=1)=>{tone(420*p,.16,'sine',.2,.004,0,1100*p)},
  pop:()=>{noise(.05,'bandpass',2600,1.4,.45);tone(950,.05,'sine',.1,.001,0,260)},
  whoosh:(d,len=.7)=>{noise(len,'bandpass',d?380:1500,.8,.28,0,d?2600:260)},
  chime:d=>{const b=d?392:523.25;[1,1.5,2,3].forEach((m,i)=>tone(b*m,1.4,'sine',.06,.003,i*.06))},
  drip:(p=1)=>{tone(1250*p,.12,'sine',.15,.002,0,480*p)},
  bell:d=>{const f=d?330:660;tone(f,1.6,'sine',.14,.002);tone(f*2.76,.8,'sine',.04,.002);tone(f*5.4,.4,'sine',.02,.002)},
  thunder:()=>{noise(2.2,'lowpass',180,.7,.7);noise(.25,'bandpass',900,.6,.25)},
  crackle:(n=6)=>{for(let i=0;i<n;i++)noise(.012,'highpass',4000,1,.18*Math.random(),Math.random()*.4)},
  chord:(fs,g=.06,dur=2)=>{fs.forEach((f,i)=>{tone(f,dur,'triangle',g,.004,i*.015);tone(f*2,dur*.5,'sine',g*.4,.004,i*.015)})},
};

/* ================= 全域狀態 ================= */
const $=s=>document.querySelector(s);
const cv=$('#cv'),cx=cv.getContext('2d'),fx=$('#fx'),fc=fx.getContext('2d'),glc=$('#gl');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,DPR=1,box={cx:0,cy:0,s:1},dark=false,cur=null,ci=0,S=null,rev=null,uiHidden=false;
const TOGGLES=[];
const CATS=[['類別一','光學與進階著色器系','Optical & WebGL Shaders'],['類別二','流體與軟體物理系','Fluid & Soft-Body'],['類別三','經典工業設計與機械系','Industrial & Tactile'],
 ['類別四','復古硬體與類比電子系','Retro Hardware & Analog'],['類別五','自然天體與大氣現象系','Celestial & Atmospheric'],['類別六','日常直覺與生活器物系','Everyday & Domestic'],
 ['類別七','紙藝、印刷與平面構成系','Paper, Print & Swiss'],['類別八','科幻、賽博與未來介面系','Sci-Fi & HUD'],['類別九','生物、有機與微觀科學系','Bio-Organic & Microscopic'],['類別十','聲音、遊戲與抽象藝術系','Audio, Gaming & Abstract']];
const PAL={
  light:{bg:'#e8e8e4',grid:'rgba(20,20,20,.07)',major:'rgba(20,20,20,.15)',ink:'#151515',glow:['#ffb48a','#8fd0ff','#c9a8ff'],tex:'grid'},
  dark:{bg:'#111215',grid:'rgba(255,255,255,.045)',major:'rgba(255,255,255,.1)',ink:'#f0efe9',glow:['#ff6a3d','#3a8cff','#8a5cff'],tex:'grid'}
};
function pal(d){const T=cur||{};const o=Object.assign({},PAL[d?'dark':'light'],(T.pal&&T.pal[d?1:0])||{});return o}

/* ================= 舞台背景（每主題預先繪製） ================= */

  sfx:d=>{tone(d?196:294,1.8,'sine',.08,.1,0,d?147:392);tone(d?294:440,1.8,'sine',.04,.2)}
});


/* ================= 啟動 ================= */
(function boot(){
  const sh=$('#sheet');
  CATS.forEach((c,ci2)=>{const h=document.createElement('h2');h.textContent=c[0]+' · '+c[1]+' · '+c[2];sh.appendChild(h);const row=document.createElement('div');row.className='row';
    TOGGLES.slice(ci2*5,ci2*5+5).forEach((t,j)=>{const i=ci2*5+j,b=document.createElement('button');b.innerHTML='<b>'+String(i+1).padStart(2,'0')+'</b>'+t.zh;b.onclick=()=>{$('#index').classList.remove('open');use(i)};row.appendChild(b)});sh.appendChild(row)});
  buildTags();layout();
  const n=parseInt(location.hash.slice(1),10);use(n>=1&&n<=TOGGLES.length?n-1:0,true);
  setChrome();requestAnimationFrame(frame);
})();
</script>
