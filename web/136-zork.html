rs are open, and an exit to the south.","lit":true,"points":0,"exits":{"SOUTH":{"to":"DAM-R"},"NORTH":{"to":"MAINT","flag":"NOT-DROWNED","blocked":"The room is full of water:  if you enter, you'll drown."},"EAST":{"to":"MAINT","flag":"NOT-DROWNED","blocked":"The room is full of water:  if you enter, you'll drown."}}},"MAINT":{"name":"Maintenance Room","text":"You are in what appears to have been the maintenance room for Flood  Control Dam #3, judging by the assortment of tool chests around the  room.  Apparently, this room has been ransacked recently, for most of  the valuable equipment is gone. On the wall in front of you is a panel  of buttons, which are labelled in EBCDIC. However, they are of different  color: Red, Brown, Yellow, and Blue. The doors to this room are in the  west and south ends.","lit":false,"points":0,"exits":{"SOUTH":{"to":"LOBBY"},"WEST":{"to":"LOBBY"}}},"TREAS-R":{"name":"Treasure Room","text":"This is a large room, whose north wall is solid granite.  A number of  discarded bags, which crumble at your touch, are scattered about on the  floor.","lit":false,"points":25,"exits":{"DOWN":{"to":"CYCLO-R"}}}},"objects":{"WINDO":{"name":"","text":"","initial":"EHOUS","find":0,"deposit":0,"light":0,"read":""},"FOOD":{"name":".lunch","text":"Sack smelling of hot peppers, is here.","initial":"KITCH","find":0,"deposit":0,"light":0,"read":""},"BOTTL":{"name":"bottle","text":"A clear glass bottle is here.","initial":"KITCH","find":0,"deposit":0,"light":0,"read":""},"TROPH":{"name":"trophy case","text":"There is a trophy case here.","initial":"LROOM","find":0,"deposit":0,"light":0,"read":""},"WATER":{"name":"water","text":"Water","initial":"BOTTL","find":0,"deposit":0,"light":0,"read":""},"ROPE":{"name":"rope","text":"There is a large coil of rope here.","initial":"ATTIC","find":0,"deposit":0,"light":0,"read":""},"KNIFE":{"name":"knife","text":"There is a nasty-looking knife lying here.","initial":"ATTIC","find":0,"deposit":0,"light":0,"read":""},"DOOR":{"n ood Control Dam #3 (FCD#3) was constructed in year 783  of the Great Underground Empire to harness the destructive  power of the Frigid River.  This work was supported by a grant  of 37 million zorkmids from the Central Bureaucracy and  your omnipotent local tyrant Lord Dimwit Flathead the Excessive.  This impressive structure is composed of 3.7 cubic feet  of concrete, is 256 feet tall from the center, and 193 feet  wide at the top.  The reservoir created behind the dam has  a volume of 37 million cubic feet, an area of 12 million  square feet, and a shore line of 3.6 million feet.    The construction of FCD#3 took 112 days from ground  breaking to the dedication. It required a work force of  384 slaves, 34 slave drivers, 12 engineers, 2 turtle doves,  and a partridge in a pear tree. The work was managed by  a command team composed of 2345 bureaucrats, 2347 secretaries  (at least two of which can type), 12,256 paper shufflers,  52,469 rubber stampers, 245,193 red tape processors, and  nearly one million dead trees.    We will now point out some of the more interesting features  of FCD#3 as we conduct you on a guided tour of the facilities:          1) You start your tour here in the Dam Lobby.             You will notice on your right that ........."},"BUTTO":{"name":"","text":"","initial":"MAINT","find":0,"deposit":0,"light":0,"read":""},"LEAK":{"name":"","text":"","initial":"MAINT","find":0,"deposit":0,"light":0,"read":""},"SCREW":{"name":"screwdriver","text":"There is a screwdriver here.","initial":"MAINT","find":0,"deposit":0,"light":0,"read":""},"WRENC":{"name":"wrench","text":"There is a wrench here.","initial":"MAINT","find":0,"deposit":0,"light":0,"read":""},"PUTTY":{"name":"tube","text":"There is an object which looks like a tube of toothpaste here.","initial":"MAINT","find":0,"deposit":0,"light":0,"read":""},"CYCLO":{"name":"","text":"","initial":"CYCLO-R","find":0,"deposit":0,"light":0,"read":""},"CHALI":{"name":"chalice","text":"There is a silver chalic
