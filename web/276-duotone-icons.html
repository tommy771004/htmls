<!doctype html>
<html lang="zh-Hant" data-palette="multicolor">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>語意微動 · 48 枚雙層動態功能圖標集｜DUOTONE 24</title>
<meta name="description" content="48 枚建構於 24px 網格的圓角雙層動態功能圖標展示頁：內嵌純 SVG 與 CSS 語意微動畫、七組 CSS 變數配色切換與自動輪播演示模式，零外部素材。">
<style>
:root {
  --page-bg: #f5f6f9;
  --surface: #ffffff;
  --surface-subtle: #eef1f6;
  --ink: #161b26;
  --ink-2: #4c5568;
  --ink-3: #7b8499;
  --line: #e1e5ee;
  --line-strong: #cbd2e1;
  --accent: #2563eb;
  --accent-soft: #dbeafe;
  --theme-fg: #35526e;
  --theme-bg: #d9e6f2;
  --icon-size: 32px;
  --sans: "Avenir Next", "SF Pro Text", "Segoe UI", "PingFang TC", "Hiragino Sans", "Microsoft JhengHei", sans-serif;
  --mono: "SF Mono", "JetBrains Mono", "Menlo", "Consolas", ui-monospace, monospace;
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.45, 0, 0.55, 1);
}

/* ── 7 組頂部配色：全以 CSS 變數實作 ── */
html[data-palette="slate"] {
  --theme-fg: #36536e;
  --theme-bg: #d8e5f1;
  --accent: #36536e;
  --accent-soft: #e3ecf5;
}
html[data-palette="celadon"] {
  --theme-fg: #266b62;
  --theme-bg: #cfece6;
  --accent: #266b62;
  --accent-soft: #dcf2ee;
}
html[data-palette="mint"] {
  --theme-fg: #167c54;
  --theme-bg: #cbf2df;
  --accent: #167c54;
  --accent-soft: #daf6e8;
}
html[data-palette="lavender"] {
  --theme-fg: #5c479e;
  --theme-bg: #e4defb;
  --accent: #5c479e;
  --accent-soft: #ece8fc;
}
html[data-palette="apricot"] {
  --theme-fg: #c25624;
  --theme-bg: #fde1ce;
  --accent: #c25624;
  --accent-soft: #feeadd;
}
html[data-palette="mono"] {
  --theme-fg: #17191e;
  --theme-bg: #dfe2e8;
  --accent: #17191e;
  --accent-soft: #eaecf0;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--page-bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}

button, input {
  font: inherit;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
}

button {
  cursor: pointer;
  background: none;
  border: 0;
}

button:focus-visible, input:focus-visible, a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ── 頂部導覽與配色／演示控制列 ── */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(245, 246, 249, 0.9);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

.topbar-inner {
  max-width: 1320px;
  margin: 0 auto;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  text-decoration: none;
  font-size: 12.5px;
  font-weight: 500;
  white-space: nowrap;
  transition: border-color 0.18s, color 0.18s;
}
.back-link:hover {
  border-color: var(--line-strong);
  color: var(--ink);
}

.title-block {
  min-width: 0;
}
.title-block h1 {
  margin: 0;
  font-size: 16.5px;
  font-weight: 700;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.spec-pill {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 5px;
  background: var(--surface-subtle);
  color: var(--ink-2);
  border: 1px solid var(--line);
}

/* 配色切換器 */
.palette-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow-x: auto;
  max-width: 100%;
  scrollbar-width: none;
}
.palette-bar::-webkit-scrollbar { display: none; }

.pal-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 11px;
  border-radius: 8px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-2);
  white-space: nowrap;
  transition: background 0.18s, color 0.18s;
}
.pal-btn:hover {
  color: var(--ink);
  background: var(--page-bg);
}
.pal-btn[aria-pressed="true"] {
  background: var(--ink);
  color: #ffffff;
  font-weight: 600;
}

.swatch {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  position: relative;
  flex: none;
  background: var(--sw-bg, #dbeafe);
  border: 1.5px solid var(--sw-fg, #2563eb);
}
.swatch::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 2px;
  background: var(--sw-fg, #2563eb);
}
.swatch.multi {
  border: 0;
  background: conic-gradient(#ef4444, #f59e0b, #10b981, #0ea5e9, #6366f1, #ec4899, #ef4444);
}
.swatch.multi::after {
  inset: 3.5px;
  border-radius: 50%;
  background: #ffffff;
}

/* 右上角「演示」開關 */
.demo-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-left: auto;
}
.demo-ticker {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 4px 9px;
  border-radius: 6px;
  white-space: nowrap;
  display: none;
}
.demo-ticker.visible {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.demo-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.demo-switch {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 6px 12px 6px 13px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
  box-shadow: 0 1px 2px rgba(22, 27, 38, 0.04);
  transition: border-color 0.2s, background 0.2s;
}
.demo-switch:hover {
  border-color: var(--ink-2);
}
.demo-switch[aria-checked="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: #ffffff;
}
.switch-track {
  width: 34px;
  height: 19px;
  border-radius: 999px;
  background: #cfd6e4;
  position: relative;
  transition: background 0.22s var(--ease-out);
  flex: none;
}
.demo-switch[aria-checked="true"] .switch-track {
  background: #34d399;
}
.switch-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
  transition: transform 0.22s var(--ease-spring);
}
.demo-switch[aria-checked="true"] .switch-thumb {
  transform: translateX(15px);
}

/* ── 主內容區與標本規格頭標 ── */
.page-wrap {
  max-width: 1320px;
  margin: 0 auto;
  padding: 14px 24px 40px;
}

.hero-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
.hero-copy p {
  margin: 0;
  font-size: 13.5px;
  color: var(--ink-2);
  line-height: 1.6;
}
.hero-copy strong {
  color: var(--ink);
  font-weight: 600;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.search-box {
  position: relative;
  display: flex;
  align-items: center;
}
.search-box svg {
  position: absolute;
  left: 10px;
  width: 15px;
  height: 15px;
  color: var(--ink-3);
  pointer-events: none;
}
.search-box input {
  width: 196px;
  height: 34px;
  padding: 0 28px 0 31px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 12.5px;
  color: var(--ink);
}
.search-box input::placeholder {
  color: var(--ink-3);
}
.clear-q {
  position: absolute;
  right: 6px;
  width: 20px;
  height: 20px;
  border-radius: 5px;
  font-size: 13px;
  color: var(--ink-3);
  display: grid;
  place-items: center;
}
.clear-q[hidden] { display: none; }

.tool-seg {
  display: inline-flex;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 2px;
  height: 34px;
}
.tool-seg button {
  padding: 0 9px;
  height: 28px;
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--ink-2);
}
.tool-seg button[aria-pressed="true"] {
  background: var(--surface-subtle);
  color: var(--ink);
  font-weight: 600;
}

.grid-toggle {
  height: 34px;
  padding: 0 11px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.grid-toggle[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}

/* 分類膠囊列 */
.group-tabs {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 14px;
  scrollbar-width: none;
}
.group-tabs::-webkit-scrollbar { display: none; }
.grp-btn {
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line);
  white-space: nowrap;
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}
.grp-btn:hover {
  border-color: var(--line-strong);
  color: var(--ink);
}
.grp-btn[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: #ffffff;
}
.grp-count {
  font-family: var(--mono);
  font-size: 10.5px;
  opacity: 0.72;
  margin-left: 3px;
}

/* ── 48 枚圖標標本網格 ── */
.icon-grid {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 9px;
}

.ico-card {
  --ico-fg: var(--theme-fg);
  --ico-bg: var(--theme-bg);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 10px 8px 9px;
  min-height: 102px;
  border-radius: 13px;
  background: var(--surface);
  border: 1px solid var(--line);
  text-align: center;
  transition: border-color 0.18s, box-shadow 0.18s, background-color 0.18s;
}

html[data-palette="multicolor"] .ico-card {
  --ico-fg: var(--c-fg);
  --ico-bg: var(--c-bg);
}

.ico-card[hidden] {
  display: none;
}

.ico-card:hover,
.ico-card:focus-visible,
.ico-card.is-playing {
  border-color: var(--ico-fg);
  box-shadow: 0 6px 18px -10px rgba(22, 27, 38, 0.22), 0 0 0 1px var(--ico-bg);
}

.ico-card.is-selected {
  background: linear-gradient(180deg, #ffffff 0%, #f8faff 100%);
  border-color: var(--ink);
}

.card-meta {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1;
  color: var(--ink-3);
  pointer-events: none;
}

.card-verb {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  color: var(--ico-fg);
  opacity: 0;
  transition: opacity 0.16s;
}
.ico-card:hover .card-verb,
.ico-card:focus-visible .card-verb,
.ico-card.is-playing .card-verb {
  opacity: 1;
}

/* 24px 圖標畫布框 */
.glyph-stage {
  position: relative;
  width: calc(var(--icon-size) + 16px);
  height: calc(var(--icon-size) + 16px);
  display: grid;
  place-items: center;
  border-radius: 10px;
  margin: 2px 0;
}

/* 可選 24px 網格輔助線 */
.show-grid .glyph-stage {
  background-color: #fafbfd;
  background-image:
    linear-gradient(to right, rgba(37, 99, 235, 0.11) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(37, 99, 235, 0.11) 1px, transparent 1px);
  background-size: calc(var(--icon-size) / 6) calc(var(--icon-size) / 6);
  background-position: center;
  outline: 1px dashed rgba(37, 99, 235, 0.28);
  outline-offset: -9px;
}

.ico-svg {
  width: var(--icon-size);
  height: var(--icon-size);
  display: block;
  overflow: visible;
  pointer-events: none;
}

/* 統一雙層結構：淺色底塊 + 1.8px 圓角前景主色 */
.ico-svg .bg {
  fill: var(--ico-bg);
  stroke: none;
}
.ico-svg .fg {
  fill: none;
  stroke: var(--ico-fg);
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ico-svg .fg-dot {
  fill: var(--ico-fg);
  stroke: none;
}
.ico-svg .cutout {
  fill: var(--surface);
  stroke: none;
}

.ico-svg g,
.ico-svg path,
.ico-svg circle,
.ico-svg rect,
.ico-svg line {
  transform-box: view-box;
}

.card-name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 0.01em;
  line-height: 1.25;
}

.empty-state {
  padding: 48px 20px;
  text-align: center;
  background: var(--surface);
  border: 1px dashed var(--line-strong);
  border-radius: 14px;
  color: var(--ink-2);
  font-size: 14px;
}
.empty-state[hidden] { display: none; }
.empty-state button {
  margin-top: 10px;
  padding: 6px 14px;
  border-radius: 8px;
  background: var(--ink);
  color: #fff;
  font-size: 12.5px;
}

/* ── 底部即時標本檢視台（點選任一圖標檢視 24px 網格與複製 SVG+CSS） ── */
.inspector {
  margin-top: 20px;
  padding: 18px 22px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 22px;
}

.insp-canvas {
  --ico-fg: var(--theme-fg);
  --ico-bg: var(--theme-bg);
  width: 96px;
  height: 96px;
  border-radius: 14px;
  border: 1px solid var(--line-strong);
  background-color: #fbfcfe;
  background-image:
    linear-gradient(to right, rgba(22, 27, 38, 0.06) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(22, 27, 38, 0.06) 1px, transparent 1px),
    linear-gradient(to right, rgba(37, 99, 235, 0.16) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(37, 99, 235, 0.16) 1px, transparent 1px);
  background-size: 4px 4px, 4px 4px, 16px 16px, 16px 16px;
  display: grid;
  place-items: center;
  position: relative;
  cursor: pointer;
}
html[data-palette="multicolor"] .insp-canvas {
  --ico-fg: var(--c-fg);
  --ico-bg: var(--c-bg);
}
.insp-canvas::after {
  content: "24×24";
  position: absolute;
  right: 5px;
  bottom: 4px;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ink-3);
}
.insp-canvas .ico-svg {
  width: 64px;
  height: 64px;
}

.insp-info h2 {
  margin: 0 0 5px;
  font-size: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.insp-info h2 span.code {
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-3);
}
.insp-info p {
  margin: 0 0 10px;
  font-size: 13px;
  color: var(--ink-2);
}
.scale-strip {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.scale-item {
  --ico-fg: var(--theme-fg);
  --ico-bg: var(--theme-bg);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  border-radius: 7px;
  background: var(--page-bg);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-2);
}
html[data-palette="multicolor"] .scale-item {
  --ico-fg: var(--c-fg);
  --ico-bg: var(--c-bg);
}

.insp-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.act-btn {
  padding: 9px 14px;
  border-radius: 10px;
  font-size: 12.5px;
  font-weight: 600;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  transition: background 0.16s, border-color 0.16s;
}
.act-btn:hover {
  background: var(--page-bg);
}
.act-btn.primary {
  background: var(--ink);
  border-color: var(--ink);
  color: #ffffff;
}
.act-btn.primary:hover {
  opacity: 0.92;
}

.foot-note {
  margin-top: 18px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--ink-3);
}

/* ══════════════════════════════════════════════════════════════
   48 組貼合語意的 Hover / 演示 微動畫（0.65s – 0.95s）
   ══════════════════════════════════════════════════════════════ */

/* 01 資料夾：前袋外傾、內頁紙張上抽 */
.i-folder .p-flap { transform-origin: 50% 83.33%; }
.i-folder .p-doc  { transform-origin: 50% 50%; }
:is(.ico-card:hover, .ico-card:focus-visible, .ico-card.is-playing, .insp-canvas.is-playing) .i-folder .p-flap {
  animation: kf-folder-flap 0.78s var(--ease-out);
}
:is(.ico-card:hover, .ico-card:focus-visible, .ico-card.is-playing, .insp-canvas.is-playing) .i-folder .p-doc {
  animation: kf-folder-doc 0.78s var(--ease-spring);
}
@keyframes kf-folder-flap {
  0%, 100% { transform: scaleY(1) skewX(0deg); }
  40% { transform: scaleY(0.86) skewX(-7deg); }
  70% { transform: scaleY(0.96) skewX(-2deg); }
}
@keyframes kf-folder-doc {
  0%, 100% { transform: translateY(0); }
  42% { transform: translateY(-2.4px); }
  75% { transform: translateY(-0.5px); }
}

/* 02 文件：摺角輕翻、內文逐行描寫 */
.i-file .p-fold { transform-origin: 58.33% 33.33%; }
.i-file .p-l1, .i-file .p-l2, .i-file .p-l3 { stroke-dasharray: 10; stroke-dashoffset: 0; }
:is(.ico-card:hover, .ico-card:focus-visible, .ico-card.is-playing, .insp-canvas.is-playing) .i-file .p-fold {
  animation: kf-file-fold 0.75s var(--ease-spring);
}
:is(.ico-card:hover, .ico-card:focus-visible, .ico-card.is-playing, .insp-canvas.is-playing) .i-file .p-l1 {
  animation: kf-line-draw 0.75s ease-out;
}
:is(.ico-card:hover, .ico-card:focus-visible, .ico-card.is-playing, .insp-canvas.is-playing) .i-file .p-l2 {
  animation: kf-line-draw 0.75s 0.08s ease-out;
}
:is(.ico-card:hover, .ico-card:focus-visible, .ico-card.is-playing, .insp-canvas.is-playing) .i-file .p-l3 {
  animation: kf-line-draw 0.75s 0.16s ease-out;
}

:is(.ico-card:hover, .ico-card:focus-visible, .ico-card.is-playing, .insp-canvas.is-playing) .i-chart .p-b2 {

}
:is(.ico-card:hover, .ico-card:focus-visible, .ico-card.is-playing, .insp-canvas.is-playing) .i-chart .p-b3 {

}

/* 38 旗子：旗面迎風波浪飄揚 */

}
@keyframes kf-help-tilt {

.i-wifi .p-w1, .i-wifi .p-w2, .i-wifi .p-w3 { transform-origin: 50% 77%; }
:is(.ico-card:hover, .ico-card:focus-visible, .ico-card.is-playing, .insp-canvas.is-playing) .i-wifi .p-w1 {

}
:is(.ico-card:hover, .ico-card:focus-visible, .ico-card.is-playing, .insp-canvas.is-playing) .i-wifi .p-w2 {

/* 44 印表機：進紙微沉、列印紙張吐出 */

:is(.ico-card:hover, .ico-card:focus-visible, .ico-card.is-playing, .insp-canvas.is-playing) .i-printer .p-in {

/* 46 鬧鐘：雙耳急促響鈴跳動 */

:is(.ico-card:hover, .ico-card:focus-visible, .ico-card.is-playing, .insp-canvas.is-playing) .i-calc .p-k2 {

:is(.ico-card:hover, .ico-card:focus-visible, .ico-card.is-playing, .insp-canvas.is-playing) .i-calc .p-scr {

}

  0%, 100% { transform: scale(1); }
  40% { transform: scale(0.45); }
}
@keyframes kf-calc-scr {
  0%, 100% { transform: scaleX(1); }
  55% { transform: scaleX(1.06); }
}

/* 48 指南針：磁針阻尼擺動尋北 */
.i-compass .p-needle { transform-origin: 50% 50%; }
:is(.ico-card:hover, .ico-card:focus-visible, .ico-card.is-playing, .insp-canvas.is-playing) .i-compass .p-needle {

@keyframes kf-compass-seek {
  0%, 100% { transform: rotate(0deg); }
  26% { transform: rotate(38deg); }
  54% { transform: rotate(-22deg); }
  78% { transform: rotate(9deg); }

/* ── 尊重 prefers-reduced-motion：停用位移與搖擺，保留靜態色階回饋 ── */
@media (prefers-reduced-motion: reduce) {
  .switch-thumb,
  .ico-card {
    transition: none;

  :is(.ico-card:hover, .ico-card:focus-visible, .ico-card.is-playing, .insp-canvas.is-playing) .ico-svg *,
  .ico-svg * {
    animation: none !important;
    transition: none !important;

  :is(.ico-card:hover, .ico-card:focus-visible, .ico-card.is-playing) .ico-svg .bg {
    filter: brightness(0.93);

/* ── RWD 響應式網格（1440×900 桌機 8 欄、平板 4–6 欄、390×844 手機 3 欄零水平溢出） ── */
@media (max-width: 1120px) {

}

  .icon-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }

  .ico-card { min-height: 106px; padding: 10px 6px 9px; border-radius: 12px; }
  .inspector { grid-template-columns: 1fr; padding: 14px; gap: 14px; }
  .insp-canvas { margin: 0 auto; }
}

.toast {

  left: 50%;

  transform: translateX(-50%) translateY(0);
}

<script>
(() => {
  'use strict';

  const root = document.documentElement;
  const pageWrap = document.getElementById('pageWrap');
  const cards = Array.from(document.querySelectorAll('.ico-card'));
  const palBtns = Array.from(document.querySelectorAll('[data-set-palette]'));
  const sizeBtns = Array.from(document.querySelectorAll('[data-size]'));
  const grpBtns = Array.from(document.querySelectorAll('[data-group]'));
  const gridToggle = document.getElementById('gridToggle');
  const searchInput = document.getElementById('searchInput');
  const clearQ = document.getElementById('clearQ');
  const emptyState = document.getElementById('emptyState');
  const resetFilter = document.getElementById('resetFilter');

  const demoSwitch = document.getElementById('demoSwitch');
  const demoTicker = document.getElementById('demoTicker');
  const demoLabel = document.getElementById('demoLabel');

  const inspCanvas = document.getElementById('inspCanvas');
  const inspName = document.getElementById('inspName');
  const inspVerb = document.getElementById('inspVerb');
  const inspDesc = document.getElementById('inspDesc');
  const scaleStrip = document.getElementById('scaleStrip');
  const replayBtn = document.getElementById('replayBtn');
  const copySvgBtn = document.getElementById('copySvgBtn');
  const toastEl = document.getElementById('toast');

  let activeGroup = 'all';
  let query = '';
  let selectedCard = cards[0];
  let demoTimer = null;
  let demoIndex = 0;
  let toastTimer = null;

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  /* ── 1) 頂部七組配色切換（CSS 變數） ── */
  function setPalette(pal) {
    root.setAttribute('data-palette', pal);
    palBtns.forEach((btn) => {
      btn.setAttribute('aria-pressed', String(btn.dataset.setPalette === pal));
    });
  }
  palBtns.forEach((btn) => {
    btn.addEventListener('click', () => setPalette(btn.dataset.setPalette));
  });

  /* ── 2) 尺寸與 24px 網格線切換 ── */
  sizeBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      root.style.setProperty('--icon-size', btn.dataset.size);
      sizeBtns.forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
    });
  });

  gridToggle.addEventListener('click', () => {
    const next = gridToggle.getAttribute('aria-pressed') !== 'true';
    gridToggle.setAttribute('aria-pressed', String(next));
    pageWrap.classList.toggle('show-grid', next);
  });

  /* ── 3) 搜尋與語意分組篩選 ── */
  function visibleCards() {
    return cards.filter((c) => !c.hidden);
  }

  function applyFilter() {
    const q = query.trim().toLowerCase();
    let shown = 0;
    cards.forEach((card) => {
      const matchGroup = activeGroup === 'all' || card.dataset.group === activeGroup;
      const hay = `${card.dataset.idx} ${card.dataset.name} ${card.dataset.key} ${card.dataset.verb}`.toLowerCase();
      const matchQ = !q || hay.includes(q);
      const ok = matchGroup && matchQ;
      card.hidden = !ok;
      if (ok) shown++;
    });
    emptyState.hidden = shown > 0;
    clearQ.hidden = !query.length;
    if (demoTimer && shown === 0) stopDemo();
  }

  searchInput.addEventListener('input', () => {
    query = searchInput.value;
    applyFilter();
  });
  clearQ.addEventListener('click', () => {
    searchInput.value = '';
    query = '';
    applyFilter();
    searchInput.focus();
  });
  resetFilter.addEventListener('click', () => {
    searchInput.value = '';
    query = '';
    activeGroup = 'all';
    grpBtns.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.group === 'all')));
    applyFilter();
  });
  grpBtns.forEach((btn) => {
    btn.addEventListener('click', () => {
      activeGroup = btn.dataset.group;
      grpBtns.forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
      applyFilter();
    });
  });

  /* ── 4) 標本檢視台與單枚重播／複製 ── */
  function triggerPlay(el, duration = 920) {
    el.classList.remove('is-playing');
    void el.offsetWidth;
    el.classList.add('is-playing');
    clearTimeout(el._playT);
    el._playT = setTimeout(() => el.classList.remove('is-playing'), duration);
  }

  function selectCard(card, play = true) {
    selectedCard = card;
    cards.forEach((c) => c.classList.toggle('is-selected', c === card));
    const fg = card.style.getPropertyValue('--c-fg');
    const bg = card.style.getPropertyValue('--c-bg');
    inspCanvas.style.setProperty('--c-fg', fg);
    inspCanvas.style.setProperty('--c-bg', bg);

    const svgClone = card.querySelector('svg').cloneNode(true);
    inspCanvas.replaceChildren(svgClone);
    inspName.textContent = `${card.dataset.idx} · ${card.dataset.name}`;
    inspVerb.textContent = card.dataset.verb;
    inspDesc.textContent = card.dataset.desc;

    scaleStrip.innerHTML = '';
    [16, 20, 24, 32].forEach((px) => {
      const wrap = document.createElement('span');
      wrap.className = 'scale-item';
      wrap.style.setProperty('--c-fg', fg);
      wrap.style.setProperty('--c-bg', bg);
      const s = card.querySelector('svg').cloneNode(true);
      s.style.width = `${px}px`;
      s.style.height = `${px}px`;
      const lbl = document.createElement('span');
      lbl.textContent = `${px}px`;
      wrap.append(s, lbl);
      scaleStrip.appendChild(wrap);
    });

    if (play) {
      triggerPlay(card);
      triggerPlay(inspCanvas);
    }
  }

  cards.forEach((card) => {
    card.addEventListener('click', () => selectCard(card, true));
  });
  inspCanvas.addEventListener('click', () => triggerPlay(inspCanvas));
  replayBtn.addEventListener('click', () => {
    triggerPlay(selectedCard);
    triggerPlay(inspCanvas);
  });

  copySvgBtn.addEventListener('click', async () => {
    const cs = getComputedStyle(selectedCard);
    const fg = cs.getPropertyValue('--ico-fg').trim() || '#2563eb';
    const bg = cs.getPropertyValue('--ico-bg').trim() || '#dbeafe';
    const clone = selectedCard.querySelector('svg').cloneNode(true);
    clone.removeAttribute('class');
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('width', '24');
    clone.setAttribute('height', '24');
    clone.setAttribute('fill', 'none');
    clone.querySelectorAll('.bg').forEach((n) => { n.removeAttribute('class'); n.setAttribute('fill', bg); });
    clone.querySelectorAll('.cutout').forEach((n) => { n.removeAttribute('class'); n.setAttribute('fill', '#ffffff'); });
    clone.querySelectorAll('.fg-dot').forEach((n) => { n.removeAttribute('class'); n.setAttribute('fill', fg); });
    clone.querySelectorAll('.fg').forEach((n) => {
      n.removeAttribute('class');
      n.setAttribute('fill', 'none');
      n.setAttribute('stroke', fg);
      n.setAttribute('stroke-width', '1.8');
      n.setAttribute('stroke-linecap', 'round');
      n.setAttribute('stroke-linejoin', 'round');
    });
    clone.querySelectorAll('[class]').forEach((n) => n.removeAttribute('class'));
    const markup = `<!-- ${selectedCard.dataset.name} (24px Duotone) -->\n${clone.outerHTML}`;
    try {
      await navigator.clipboard.writeText(markup);
      showToast(`已複製「${selectedCard.dataset.name}」獨立 SVG`);
    } catch {
      showToast(`已選取「${selectedCard.dataset.name}」SVG`);
    }
  });

  /* ── 5) 右上角「演示」開關：所有圖標輪流自動播放動畫 ── */
  function stepDemo() {
    const list = visibleCards();
    if (!list.length) return;
    if (demoIndex >= list.length) demoIndex = 0;
    const current = list[demoIndex];
    cards.forEach((c) => {
      if (c !== current) c.classList.remove('is-playing');
    });
    triggerPlay(current, 880);
    selectCard(current, false);
    triggerPlay(inspCanvas, 880);
    demoLabel.textContent = `${current.dataset.idx} · ${current.dataset.name}`;
    demoIndex = (demoIndex + 1) % list.length;
  }

  function startDemo() {
    if (demoTimer) return;
    demoSwitch.setAttribute('aria-checked', 'true');
    demoTicker.classList.add('visible');
    const list = visibleCards();
    const curIdx = list.indexOf(selectedCard);
    demoIndex = curIdx >= 0 ? curIdx : 0;
    stepDemo();
    demoTimer = setInterval(stepDemo, 720);
  }

  function stopDemo() {
    clearInterval(demoTimer);
    demoTimer = null;
    demoSwitch.setAttribute('aria-checked', 'false');
    demoTicker.classList.remove('visible');
    cards.forEach((c) => c.classList.remove('is-playing'));
  }

  demoSwitch.addEventListener('click', () => {
    if (demoTimer) stopDemo();
    else startDemo();
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && document.activeElement !== searchInput && document.activeElement?.tagName !== 'BUTTON') {
      e.preventDefault();
      if (demoTimer) stopDemo();
      else startDemo();
    }
  });

  selectCard(cards[0], false);
})();
</script>
</body>
</html>
