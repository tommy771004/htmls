<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>酒標雕版室 · Atelier d'Étiquettes</title>
<meta name="description" content="鈔券雕版風格的葡萄酒標產生器：輸入酒莊、年份與產區，調整扭索紋花樣與油墨色，酒標即時貼在波爾多瓶上，可下載 SVG。">
<style>
:root{
  --cellar:#17110d; --cellar-2:#241a14; --paper:#f2ead8; --paper-2:#e7dcc4; --ink:#2a1d17; --mute:#8b7b66;
  --gold:#b8955a; --gold-2:#e2c88f;
  --didone:"Didot","Bodoni 72","Bodoni MT","Bodoni 72 Oldstyle","Hoefler Text","Songti TC",serif;
  --cap:"Copperplate","Copperplate Gothic Light","Optima","Songti TC",serif;
  --cjk:"Songti TC","Noto Serif TC","PMingLiU",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cellar);color:var(--paper);font-family:var(--didone);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(60vw 80vh at 34% 48%,rgba(255,214,150,.13),transparent 70%),radial-gradient(40vw 50vh at 34% 92%,rgba(0,0,0,.6),transparent 70%)}
.wrap{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,440px);min-height:100vh}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;perspective:1400px}
.mast{position:absolute;top:28px;left:36px;font-family:var(--cap);font-size:12px;letter-spacing:.42em;color:var(--gold);text-transform:uppercase}
.mast b{display:block;font-family:var(--didone);font-weight:400;font-size:30px;letter-spacing:.06em;text-transform:none;color:var(--paper);margin-top:6px;font-style:italic}
.bottle{width:min(360px,74vw,calc((100vh - 120px) * .4));transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.bottle svg{display:block;width:100%;height:auto;filter:drop-shadow(0 40px 40px rgba(0,0,0,.6))}
.views{display:flex;gap:6px;margin-top:22px;font-family:var(--cap);font-size:11px;letter-spacing:.3em}
.views button{font:inherit;background:transparent;border:0;border-bottom:1px solid transparent;color:var(--mute);padding:6px 8px;cursor:pointer;letter-spacing:.3em}
.views button.on{color:var(--gold-2);border-color:var(--gold)}
.flat{display:none;width:min(420px,86vw);box-shadow:0 30px 60px -20px rgba(0,0,0,.7)}
.flat svg{display:block;width:100%;height:auto}
.stage.flatmode .bottle{display:none}.stage.flatmode .flat{display:block}
/* 右側：雕版師的工作單 */
.sheet{background:var(--paper);color:var(--ink);padding:38px 34px 34px;position:relative;box-shadow:-30px 0 60px -30px rgba(0,0,0,.6);overflow:auto}
.sheet::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(120,90,50,.05) 0 1px,transparent 1px 4px);mix-blend-mode:multiply}
.sheet h2{font-family:var(--cap);font-weight:400;font-size:12px;letter-spacing:.34em;color:var(--mute);border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:18px;display:flex;justify-content:space-between}
.sheet h2 i{font-style:normal;font-family:var(--cjk);letter-spacing:.2em}
.f{display:grid;grid-template-columns:5.5em 1fr;align-items:center;gap:10px;margin-bottom:12px;font-family:var(--cjk);font-size:13px;letter-spacing:.1em}
.f input[type=text],.f input[type=number],.f select{font-family:var(--didone);font-size:17px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid rgba(42,29,23,.35);padding:4px 2px;width:100%;border-radius:0;outline:none;transition:border-color .2s}
.f input:focus,.f select:focus{border-color:var(--ink)}
.f select{-webkit-appearance:none;appearance:none;cursor:pointer}
.inks{display:flex;gap:10px}
.inks button{width:32px;height:32px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px rgba(42,29,23,.3);cursor:pointer;transition:transform .2s,box-shadow .2s}
.inks button.on{box-shadow:0 0 0 2px var(--ink);transform:scale(1.08)}
.inks button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;height:20px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 6px)}
input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-6px;background:var(--paper);border:1.5px solid var(--ink);transform:rotate(45deg)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--paper);border:1.5px solid var(--ink);border-radius:0}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.acts button{font-family:var(--cap);font-size:11px;letter-spacing:.28em;padding:12px 16px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:background .25s,color .25s}
.acts button:hover{background:var(--ink);color:var(--paper)}
.acts button.pri{background:var(--ink);color:var(--paper)}
.acts button.pri:hover{background:#4a3327}
.note{margin-top:22px;font-family:var(--cjk);font-size:12px;line-height:1.8;color:var(--mute);letter-spacing:.06em}
.plate{position:absolute;right:34px;top:14px;font-family:var(--cap);font-size:10px;letter-spacing:.2em;color:var(--mute)}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  .stage{min-height:auto;padding:110px 16px 30px}
  .mast{left:20px;top:22px}
  .sheet{padding:30px 20px}
}
@media (prefers-reduced-motion:reduce){.bottle{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <section class="stage" id="stage">
    <div class="mast">Atelier d'Étiquettes<b>酒標雕版室</b></div>
    <div class="bottle" id="bottle"><svg id="bsvg" viewBox="0 0 400 1000" aria-label="波爾多瓶與酒標"></svg></div>
    <div class="flat" id="flat"></div>
    <div class="views"><button class="on" data-v="b">瓶身</button><button data-v="f">平面</button></div>
  </section>
  <aside class="sheet">
    <div class="plate" id="plate">PL. Nº 001</div>
    <h2>Commande <i>雕版工作單</i></h2>
    <div class="f"><label for="estate">酒莊</label><input id="estate" type="text" maxlength="28" value="Château Ombrevigne"></div>
    <div class="f"><label for="cuvee">酒款</label><input id="cuvee" type="text" maxlength="24" value="Grand Vin"></div>
    <div class="f"><label for="vintage">年份</label><input id="vintage" type="number" min="1900" max="2030" value="2019"></div>
    <div class="f"><label for="aoc">產區</label><select id="aoc">
      <option>Pauillac</option><option>Margaux</option><option>Saint-Julien</option><option>Saint-Estèphe</option><option selected>Pessac-Léognan</option><option>Saint-Émilion Grand Cru</option><option>Pomerol</option><option>Graves</option></select></div>
    <div class="f"><label for="grape">品種</label><input id="grape" type="text" maxlength="40" value="Cabernet Sauvignon · Merlot"></div>
    <h2 style="margin-top:26px">Guillochis <i>扭索紋</i></h2>
    <div class="f"><label for="lobes">花瓣</label><input id="lobes" type="range" min="5" max="23" step="1" value="11"></div>
    <div class="f"><label for="wave">波幅</label><input id="wave" type="range" min="10" max="90" value="52"></div>
    <div class="f"><label for="lines">線數</label><input id="lines" type="range" min="10" max="44" value="26"></div>
    <div class="f"><label>油墨</label><div class="inks" id="inks">
      <button data-ink="#5a1a22" style="background:#5a1a22" class="on" aria-label="酒紅"></button>
      <button data-ink="#1f3a2c" style="background:#1f3a2c" aria-label="瓶綠"></button>
      <button data-ink="#1d2a4a" style="background:#1d2a4a" aria-label="鈔票藍"></button>
      <button data-ink="#2a221d" style="background:#2a221d" aria-label="墨黑"></button>
      <button data-ink="#9a7434" style="background:linear-gradient(135deg,#e5c98c,#9a7434 60%,#d8b876)" aria-label="燙金"></button>
    </div></div>
    <div class="acts"><button class="pri" id="rand">隨機酒莊</button><button id="dl">下載 SVG</button></div>
    <p class="note">扭索紋由多層內擺線疊成，與鈔券與股票的防偽底紋同一原理；城堡以程序生成，再以斜線排線模擬銅版雕刻。所有酒莊名稱皆為虛構。</p>
  </aside>
</div>

<script>
(function(){
'use strict';
var NS='http://www.w3.org/2000/svg';
var $=function(id){ return document.getElementById(id); };
var ink='#5a1a22', seed=1;
function rng(s){ return function(){ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
function hash(str){ var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0)%2147483646+1; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var gold=function(){ return ink==='#9a7434'; };

// 扭索紋：多層內擺線
function rosette(cx,cy,R,lobes,wave,lines,w){
  var out='';
  for(var L=0;L<lines;L++){
    var ph=L/lines*Math.PI*2/lobes, d='';
    var rr=R*(0.62+0.38*(L/lines));
    for(var i=0;i<=720;i++){
      var t=i/720*Math.PI*2;
      var r=rr*(1-wave*.0042*(0.6+0.4*Math.cos(L*.7)))+R*wave*.0042*Math.cos(lobes*t+ph*lobes)*(1+.35*Math.sin(t*2+L));
      var x=cx+Math.cos(t)*r, y=cy+Math.sin(t)*r*0.86;
      d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);
    }
    out+='<path d="'+d+'Z" fill="none" stroke-width="'+w+'"/>';
  }
  return out;
}
// 扭索紋飾帶（框）
function band(x,y,w,h,lobes,wave){
  var per=Math.round(w/(18-lobes*.35)), d1='',d2='';
  for(var k=0;k<2;k++){ var d='';
    for(var i=0;i<=400;i++){ var t=i/400; var yy=y+h/2+Math.sin(t*per*Math.PI*2+k*Math.PI)*h*.42*(wave/90+.3); d+=(i?'L':'M')+(x+t*w).toFixed(1)+' '+yy.toFixed(1); }
    if(k) d2=d; else d1=d; }
  var d3=''; for(var i=0;i<=400;i++){ var t=i/400; var yy=y+h/2+Math.sin(t*per*Math.PI*4)*h*.18; d3+=(i?'L':'M')+(x+t*w).toFixed(1)+' '+yy.toFixed(1); }
  return '<path d="'+d1+'" fill="none" stroke-width=".55"/><path d="'+d2+'" fill="none" stroke-width=".55"/><path d="'+d3+'" fill="none" stroke-width=".35"/>';
}
// 城堡：程序生成 + 排線
function chateau(cx,base,W,r){
  var s='', hw=W/2, bodyH=W*.26, roofH=W*.12;
  var towers=1+Math.floor(r()*2), wing=r()<.6;
  // 遠景：葡萄園的透視行
  for(var i=-9;i<=9;i++){ s+='<line x1="'+(cx+i*W*.06)+'" y1="'+(base+W*.02)+'" x2="'+(cx+i*W*.22)+'" y2="'+(base+W*.2)+'" stroke-width=".5"/>'; }
  for(i=0;i<6;i++){ var yy=base+W*.03+i*i*W*.0055; s+='<line x1="'+(cx-hw*1.2)+'" y1="'+yy+'" x2="'+(cx+hw*1.2)+'" y2="'+yy+'" stroke-width=".25" stroke-dasharray="1 2"/>'; }
  // 白楊樹
  [-1,1].forEach(function(sd){ for(var k=0;k<2;k++){ var tx=cx+sd*(hw*(1.02+k*.14)), th=W*(.36-k*.06);
    s+='<ellipse cx="'+tx+'" cy="'+(base-th*.5)+'" rx="'+(W*.035)+'" ry="'+(th*.5)+'" fill="url(#hatchB)" stroke-width=".5"/>'; } });
  // 主體
  var bx=cx-hw*.62, bw=hw*1.24, by=base-bodyH;
  if(wing){ s+='<rect x="'+(cx-hw*.95)+'" y="'+(base-bodyH*.7)+'" width="'+(hw*1.9)+'" height="'+(bodyH*.7)+'" fill="url(#hatchA)" stroke-width=".6"/>';
    s+='<path d="M'+(cx-hw*.98)+' '+(base-bodyH*.7)+'L'+(cx-hw*.8)+' '+(base-bodyH*.7-roofH*.6)+'L'+(cx+hw*.8)+' '+(base-bodyH*.7-roofH*.6)+'L'+(cx+hw*.98)+' '+(base-bodyH*.7)+'Z" fill="url(#hatchC)" stroke-width=".6"/>'; }
  s+='<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bodyH+'" fill="#f2ead8" stroke-width=".7"/>';
  s+='<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bodyH+'" fill="url(#hatchA)" stroke-width=".7"/>';
  s+='<path d="M'+(bx-3)+' '+by+'L'+(bx+bw*.12)+' '+(by-roofH)+'L'+(bx+bw*.88)+' '+(by-roofH)+'L'+(bx+bw+3)+' '+by+'Z" fill="url(#hatchC)" stroke-width=".7"/>';
  // 窗
  var cols=5+Math.floor(r()*3);
  for(var row=0;row<2;row++) for(var c=0;c<cols;c++){
    var wx=bx+bw*(c+.5)/cols-3.2, wy=by+bodyH*(.18+row*.45);
    s+='<rect x="'+wx+'" y="'+wy+'" width="6.4" height="'+(bodyH*.26)+'" fill="currentColor" stroke="none" opacity=".88"/>';
  }
  // 屋頂老虎窗
  for(c=1;c<cols-1;c+=2){ var dx=bx+bw*(c+.5)/cols; s+='<path d="M'+(dx-4)+' '+(by-roofH*.25)+'v-'+(roofH*.35)+'l4 -5l4 5v'+(roofH*.35)+'Z" fill="#f2ead8" stroke-width=".5"/>'; }
  // 塔
  var tp=towers===1?[0]:[-1,1];
  tp.forEach(function(t){
    var tx=cx+t*bw*.5, tw=W*.075, th=bodyH*1.35;
    s+='<rect x="'+(tx-tw/2)+'" y="'+(base-th)+'" width="'+tw+'" height="'+th+'" fill="#f2ead8" stroke-width=".7"/><rect x="'+(tx-tw/2)+'" y="'+(base-th)+'" width="'+tw+'" height="'+th+'" fill="url(#hatchD)" stroke-width=".7"/>';
    s+='<path d="M'+(tx-tw*.62)+' '+(base-th)+'L'+tx+' '+(base-th-W*.15)+'L'+(tx+tw*.62)+' '+(base-th)+'Z" fill="url(#hatchC)" stroke-width=".7"/>';
    s+='<line x1="'+tx+'" y1="'+(base-th-W*.15)+'" x2="'+tx+'" y2="'+(base-th-W*.18)+'" stroke-width=".7"/>';
    s+='<rect x="'+(tx-2.2)+'" y="'+(base-th*.7)+'" width="4.4" height="'+(th*.18)+'" fill="currentColor" stroke="none"/>';
  });
  // 門與台階
  s+='<path d="M'+(cx-5)+' '+base+'v-'+(bodyH*.34)+'a5 5 0 0 1 10 0v'+(bodyH*.34)+'Z" fill="currentColor" stroke="none"/>';
  s+='<line x1="'+(cx-hw*1.3)+'" y1="'+base+'" x2="'+(cx+hw*1.3)+'" y2="'+base+'" stroke-width=".9"/>';
  return s;
}

function label(o,forExport){
  var W=300,H=380, c=ink, r=rng(hash(o.estate+o.vintage)+o.lobes);
  var hatch='<defs>'+
   '<pattern id="hatchA" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="3" stroke="'+c+'" stroke-width=".55"/></pattern>'+
   '<pattern id="hatchB" width="2.2" height="2.2" patternUnits="userSpaceOnUse" patternTransform="rotate(70)"><line x1="0" y1="0" x2="0" y2="2.2" stroke="'+c+'" stroke-width=".7"/></pattern>'+
   '<pattern id="hatchC" width="1.8" height="1.8" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="1.8" y2="0" stroke="'+c+'" stroke-width=".8"/></pattern>'+
   '<pattern id="hatchD" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(90)"><line x1="0" y1="0" x2="0" y2="2.4" stroke="'+c+'" stroke-width=".6"/></pattern>'+
   (gold()?'<linearGradient id="foil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecd398"/><stop offset=".45" stop-color="#9a7434"/><stop offset=".7" stop-color="#e8cf91"/><stop offset="1" stop-color="#8a6428"/></linearGradient>':'')+
   '</defs>';
  var stroke=gold()?'url(#foil)':c;
  var s='<svg xmlns="'+NS+'" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" style="color:'+c+'">'+hatch+
   '<rect width="'+W+'" height="'+H+'" fill="#f2ead8"/>';
  // 紙纖維
  for(var i=0;i<40;i++){ var fx=r()*W, fy=r()*H; s+='<path d="M'+fx.toFixed(1)+' '+fy.toFixed(1)+'q'+(r()*8-4).toFixed(1)+' '+(r()*4-2).toFixed(1)+' '+(r()*14-7).toFixed(1)+' '+(r()*3).toFixed(1)+'" stroke="#c9b892" stroke-width=".3" fill="none" opacity=".6"/>'; }
  s+='<g stroke="'+stroke+'" fill="none">';
  // 外框 + 扭索紋飾帶
  s+='<rect x="10" y="10" width="'+(W-20)+'" height="'+(H-20)+'" stroke-width="1.2"/><rect x="14" y="14" width="'+(W-28)+'" height="'+(H-28)+'" stroke-width=".4"/>';
  s+=band(22,18,W-44,12,o.lobes,o.wave);
  s+='<g transform="rotate(180 '+(W/2)+' '+(H-24)+')">'+band(22,H-30,W-44,12,o.lobes,o.wave)+'</g>';
  // 中央扭索紋花環
  s+='<g opacity=".9">'+rosette(W/2,128,74,o.lobes,o.wave,o.lines,.32)+'</g>';
  s+='</g>';
  // 城堡置於花環之上
  s+='<g stroke="'+c+'" fill="none" color="'+c+'"><ellipse cx="'+(W/2)+'" cy="126" rx="62" ry="52" fill="#f2ead8" stroke="'+stroke+'" stroke-width=".8"/>';
  s+='<clipPath id="ov"><ellipse cx="'+(W/2)+'" cy="126" rx="61" ry="51"/></clipPath><g clip-path="url(#ov)">'+chateau(W/2,148,92,r)+'</g></g>';
  // 文字
  var fill=gold()?'url(#foil)':c;
  var est=o.estate.trim()||'Château', pre='', name=est;
  var m=/^(Château|Domaine|Clos)\s+(.*)$/i.exec(est); if(m){ pre=m[1]; name=m[2]; }
  var fs=Math.min(28, 440/Math.max(6,name.length));
  s+='<g fill="'+fill+'" text-anchor="middle" font-family="Didot, \'Bodoni 72\', \'Bodoni MT\', serif">';
  s+='<text x="'+W/2+'" y="208" font-size="10" letter-spacing="5" font-family="Copperplate, Optima, serif">'+esc((pre||'').toUpperCase())+'</text>';
  s+='<text x="'+W/2+'" y="'+(214+fs)+'" font-size="'+fs.toFixed(1)+'" letter-spacing="1.2">'+esc(name.toUpperCase())+'</text>';
  var y2=214+fs+18;
  s+='<text x="'+W/2+'" y="'+y2+'" font-size="13" font-style="italic">'+esc(o.cuvee)+'</text>';
  s+='<line x1="'+(W/2-46)+'" y1="'+(y2+11)+'" x2="'+(W/2-8)+'" y2="'+(y2+11)+'" stroke="'+stroke+'" stroke-width=".6"/><path d="M'+(W/2)+' '+(y2+7)+'l4 4l-4 4l-4 -4z" stroke="none"/><line x1="'+(W/2+8)+'" y1="'+(y2+11)+'" x2="'+(W/2+46)+'" y2="'+(y2+11)+'" stroke="'+stroke+'" stroke-width=".6"/>';
  s+='<text x="'+W/2+'" y="'+(y2+38)+'" font-size="28" letter-spacing="6">'+esc(o.vintage)+'</text>';
  s+='<text x="'+W/2+'" y="'+(y2+54)+'" font-size="8.5" letter-spacing="2.4" font-family="Copperplate, Optima, serif">'+esc(o.aoc.toUpperCase())+'</text>';
  s+='<text x="'+W/2+'" y="'+(y2+64)+'" font-size="6.5" letter-spacing="1.6" font-family="Copperplate, Optima, serif">APPELLATION '+esc(o.aoc.toUpperCase().replace(' GRAND CRU',''))+' CONTRÔLÉE</text>';
  s+='<text x="26" y="'+(H-36)+'" font-size="7.5" text-anchor="start" font-style="italic">'+esc(o.grape)+'</text>';
  s+='<text x="'+(W-26)+'" y="'+(H-36)+'" font-size="7.5" text-anchor="end" font-style="italic">Mis en bouteille au château</text>';
  s+='</g></svg>';
  return s;
}

function bottle(lbl){
  var g=gold();
  var cap = g ? ['#e7cf96','#8d6a2e'] : [shade(ink,1.25),shade(ink,.6)];
  var s='<defs>'+
   '<linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#050806"/><stop offset=".18" stop-color="#1b2a1f"/><stop offset=".3" stop-color="#2f4634"/><stop offset=".42" stop-color="#16231a"/><stop offset=".8" stop-color="#0a110c"/><stop offset="1" stop-color="#020302"/></linearGradient>'+
   '<linearGradient id="capG" x1="0" x2="1"><stop offset="0" stop-color="'+cap[1]+'"/><stop offset=".35" stop-color="'+cap[0]+'"/><stop offset=".6" stop-color="'+cap[1]+'"/><stop offset="1" stop-color="#0c0806"/></linearGradient>'+
   '<linearGradient id="lblShade" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset=".22" stop-color="#000" stop-opacity="0"/><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></linearGradient>'+
   '<radialGradient id="spec" cx=".28" cy=".4" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>'+
   '</defs>';
  var body='M162 40 h76 v250 q0 44 42 72 q40 26 40 76 v530 q0 22 -22 24 h-196 q-22 -2 -22 -24 v-530 q0 -50 40 -76 q42 -28 42 -72 z';
  s+='<ellipse cx="200" cy="990" rx="130" ry="10" fill="#000" opacity=".55"/>';
  s+='<path d="'+body+'" fill="url(#glass)"/>';
  s+='<path d="M157 28 h86 v222 q-4 10 -43 10 q-39 0 -43 -10 z" fill="url(#capG)"/>';
  s+='<rect x="157" y="28" width="86" height="10" fill="#000" opacity=".25"/>';
  for(var i=0;i<5;i++) s+='<line x1="157" x2="243" y1="'+(60+i*4)+'" y2="'+(60+i*4)+'" stroke="#000" stroke-opacity=".18"/>';
  s+='<g transform="translate(95 488) scale(.7)">'+lbl.replace(/^<svg[^>]*>/,'<svg viewBox="0 0 300 380" width="300" height="380" style="color:'+ink+'">')+'</g>';
  s+='<rect x="95" y="488" width="210" height="266" fill="url(#lblShade)"/>';
  s+='<path d="'+body+'" fill="url(#spec)"/>';
  s+='<path d="M104 470 q6 -60 52 -100" stroke="#fff" stroke-opacity=".18" stroke-width="5" fill="none" stroke-linecap="round"/>';
  s+='<rect x="100" y="480" width="7" height="450" rx="3.5" fill="#fff" opacity=".07"/>';
  return s;
}
function shade(hex,f){ var n=parseInt(hex.slice(1),16), r=(n>>16)&255,g=(n>>8)&255,b=n&255; r=Math.min(255,r*f)|0; g=Math.min(255,g*f)|0; b=Math.min(255,b*f)|0; return 'rgb('+r+','+g+','+b+')'; }

function read(){ return {estate:$('estate').value,cuvee:$('cuvee').value,vintage:$('vintage').value||'',aoc:$('aoc').value,grape:$('grape').value,lobes:+$('lobes').value,wave:+$('wave').value,lines:+$('lines').value}; }
var raf=0;
function render(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(function(){
  var o=read(), l=label(o);
  // 瓶身與平面兩份 SVG 各自帶 defs，id 需分開才不會互相覆蓋
  $('bsvg').innerHTML=bottle(l.replace(/id="(\w+)"/g,'id="b$1"').replace(/url\(#(\w+)\)/g,'url(#b$1)'));
  $('flat').innerHTML=l;
  $('plate').textContent='PL. Nº '+String(hash(o.estate+o.vintage)%997+1).padStart(3,'0');
}); }

['estate','cuvee','vintage','aoc','grape','lobes','wave','lines'].forEach(function(k){ $(k).addEventListener('input',render); });
$('inks').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; ink=b.dataset.ink; Array.prototype.forEach.call(this.children,function(x){ x.classList.toggle('on',x===b); }); render(); });
var A=['Ombre','Haut','Belle','Grand','Petit','Vieux','Rive','Croix','Lune','Pierre','Roche','Source'];
var B=['vigne','Sablon','Mirail','Brume','des Lucioles','de la Rive Grise','Tourmaline','Clairac','Bruyère','des Ormeaux','Saint-Aubry','Lavergne'];
$('rand').onclick=function(){
  var r=Math.random, pre=['Château','Château','Domaine','Clos'][r()*4|0], a=A[r()*A.length|0], b=B[r()*B.length|0];
  var name=b.indexOf(' ')>=0||b[0]===b[0].toUpperCase()&&r()<.5 ? (b.indexOf('de')===0?b.replace(/^de[s]? (la )?/,''):a+'-'+b) : a+b;
  if(b.indexOf(' ')>=0) name=b.charAt(0).toUpperCase()+b.slice(1);
  $('estate').value=pre+' '+name; $('vintage').value=1998+(r()*27|0);
  $('aoc').selectedIndex=r()*$('aoc').options.length|0;
  $('lobes').value=5+(r()*19|0); $('wave').value=10+(r()*80|0); $('lines').value=10+(r()*35|0);
  $('cuvee').value=['Grand Vin','Premier Vin','Cuvée Réservée','Second Vin','Vieilles Vignes'][r()*5|0];
  var inks=$('inks').children, k=r()*inks.length|0; inks[k].click();
};
$('dl').onclick=function(){
  var o=read(), blob=new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+label(o)],{type:'image/svg+xml'}), a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=(o.estate||'etiquette').replace(/[^\wÀ-ſ-]+/g,'-')+'-'+o.vintage+'.svg'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
};
Array.prototype.forEach.call(document.querySelectorAll('.views button'),function(b){ b.onclick=function(){ $('stage').classList.toggle('flatmode',b.dataset.v==='f'); Array.prototype.forEach.call(document.querySelectorAll('.views button'),function(x){ x.classList.toggle('on',x===b); }); }; });
// 瓶子隨滑鼠微微轉動
var bt=$('bottle'), stg=$('stage');
stg.addEventListener('pointermove',function(e){ var b=stg.getBoundingClientRect(); var x=(e.clientX-b.left)/b.width-.5, y=(e.clientY-b.top)/b.height-.5; bt.style.transform='rotateY('+(x*14).toFixed(2)+'deg) rotateX('+(-y*5).toFixed(2)+'deg)'; });
stg.addEventListener('pointerleave',function(){ bt.style.transform=''; });
render();
})();
</script>
