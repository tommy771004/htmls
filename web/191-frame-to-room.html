<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as CANNON from '../vendor/cannon-es-0.20.0/cannon-es.js';

const BASE = '../assets/191/';
const $ = (id) => document.getElementById(id);
const loadingEl = $('loading');
const fail = (msg) => { loadingEl.innerHTML = msg; loadingEl.hidden = false; };

let OBJ, PAR, CAM;
try {
  [OBJ, PAR, CAM] = await Promise.all(['objects.json', 'scene_params.json', 'cameras.json'].map((f) => fetch(BASE + f).then((r) => { if (!r.ok) throw new Error(f); return r.json(); })));
} catch (e) {
  fail('模型資料載入失敗。<small>請透過 HTTP 伺服器開啟此頁（例如在專案根目錄執行 npm start）。</small>');
  throw e;
}

// 平面座標（x 東、y 北、z 上）→ three（x、y 上、z 南）
const T = (a) => new THREE.Vector3(a[0], a[2], -a[1]);
const REC = Object.fromEntries(OBJ.objects.map((o) => [o.id, o]));
const dyn = OBJ.objects.filter((o) => o.kind === 'dynamic');
const kin = OBJ.objects.filter((o) => o.kind === 'door' || o.kind === 'drawer');
const { w: RW, d: RD, h: RH } = PAR.room;
const C = PAR.corridor;
const fmt = (v, d = 2) => Number(v).toFixed(d);
const areaM2 = RW * RD + (C.x1 - RW) * (C.y1 - C.y0);

$('meta').innerHTML = `<span>公共區<b>${fmt(RW)} × ${fmt(RD)} m</b></span><span>天花<b>${fmt(RH)} m</b></span><span>剛體<b>${dyn.length}</b></span>`;

// ════════════ three.js ════════════
const canvas = $('scene'), stage = $('stage');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { fail('這個瀏覽器無法建立 WebGL。'); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.localClippingEnabled = true;
renderer.setClearColor(new THREE.Color('#ece5da'), 1);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 80);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

{ // 室內反射環境
  const s = new THREE.Scene();
  const g = new THREE.BoxGeometry(1, 1, 1);
  const room = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0xd9d0c2, side: THREE.BackSide }));
  room.scale.set(14, 6, 18); room.position.y = 3; s.add(room);
  const panel = (c, k, p, sc) => { const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k) })); m.position.set(...p); m.scale.set(...sc); s.add(m); };
  panel(0xfff4e4, 3.2, [0, 2.5, -8.8], [6, 3, 0.2]);
  panel(0xffe6c8, 1.6, [0, 5.9, 0], [8, 0.2, 10]);
  panel(0xf2ece2, 0.9, [6.8, 2, 0], [0.2, 3, 12]);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(s, 0.04).texture;
  scene.environmentIntensity = 0.55;
}
scene.add(new THREE.HemisphereLight(0xfff6ea, 0xb9ac99, 1.15));
const sun = new THREE.DirectionalLight(0xfff0dc, 2.6);
sun.position.copy(T([2.6, 16.5, 7.5]));
sun.target.position.copy(T([2.3, 6.5, 0]));
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 9, bottom: -9, near: 1, far: 34 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.025;
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0xf3ede4, 0.45);
fillL.position.set(-4, 8, 6);
scene.add(fillL);
for (const p of PAR.pendants) {
  const l = new THREE.PointLight(0xffd9ad, 2.2, 4.5, 2);
  l.position.copy(T([p.x, p.y, p.z - 0.06]));
  scene.add(l);
}

// ── 程序貼圖（近白色紋理，乘上頂點色） ──
function canvasTex(draw, size = 512, repeatM = 1.2) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1 / repeatM, 1 / repeatM);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const TEX = {
  trav: () => canvasTex((g, s) => {
    g.fillStyle = '#f7f3ec'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 90; i++) { g.fillStyle = `rgba(${150 + rnd() * 40},${130 + rnd() * 30},${100 + rnd() * 20},${0.04 + rnd() * 0.07})`; g.fillRect(0, rnd() * s, s, 1 + rnd() * 6); }
    for (let i = 0; i < 520; i++) { g.fillStyle = `rgba(110,92,70,${0.18 + rnd() * 0.3})`; g.beginPath(); g.ellipse(rnd() * s, rnd() * s, 1 + rnd() * 9, 0.6 + rnd() * 1.6, 0, 0, 7); g.fill(); }
  }, 512, 0.9),
  vein: () => canvasTex((g, s) => {
    g.fillStyle = '#f9f8f5'; g.fillRect(0, 0, s, s);
    g.filter = 'blur(1.2px)';
    for (let i = 0; i < 14; i++) { g.strokeStyle = `rgba(120,116,110,${0.08 + rnd() * 0.16})`; g.lineWidth = 0.6 + rnd() * 2.2; g.beginPath(); let x = rnd() * s, y = 0; g.moveTo(x, y); while (y < s) { x += (rnd() - 0.5) * 60; y += 20 + rnd() * 40; g.lineTo(x, y); } g.stroke(); }
    g.filter = 'none';
  }, 512, 1.1),
  hair: () => canvasTex((g, s) => { g.fillStyle = '#d9d9d6'; g.fillRect(0, 0, s, s); for (let y = 0; y < s; y++) { const v = 200 + rnd() * 55; g.fillStyle = `rgba(${v},${v},${v - 2},0.55)`; g.fillRect(0, y, s, 1); } }, 256, 0.4),
  tile: () => canvasTex((g, s) => {
    g.fillStyle = '#f5f2ec'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 2200; i++) { g.fillStyle = `rgba(120,110,95,${rnd() * 0.05})`; g.fillRect(rnd() * s, rnd() * s, 2 + rnd() * 5, 2 + rnd() * 5); }
    g.fillStyle = 'rgba(95,85,72,0.28)'; g.fillRect(0, 0, s, 2); g.fillRect(0, 0, 2, s); g.fillRect(s / 2, 0, 2, s);
  }, 512, 1.2),
  cement: () => canvasTex((g, s) => {
    g.fillStyle = '#efebe4'; g.fillRect(0, 0, s, s);
    g.filter = 'blur(6px)';
    for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(${160 + rnd() * 40},${154 + rnd() * 30},${146 + rnd() * 20},${0.04 + rnd() * 0.06})`; g.beginPath(); g.arc(rnd() * s, rnd() * s, 8 + rnd() * 40, 0, 7); g.fill(); }
    g.filter = 'none';
  }, 512, 1.6),
  weave: () => canvasTex((g, s) => {
    g.fillStyle = '#f4f1ec'; g.fillRect(0, 0, s, s);
    for (let y = 0; y < s; y += 2) { g.fillStyle = `rgba(90,80,70,${0.03 + rnd() * 0.05})`; g.fillRect(0, y, s, 1); }

    const inner = inHall ? [px - 1.2, (C.y0 + C.y1) / 2] : [RW / 2, Math.min(Math.max(py, 1.4), RD - 1.4)];
    let hx = inner[0] - px, hy = inner[1] - py;
    const hl = Math.hypot(hx, hy) || 1; hx /= hl; hy /= hl;
    const dist = r * 2.2 + 0.7;
    const ex = inHall ? Math.min(Math.max(px + hx * dist, RW + 0.2), C.x1 - 0.2) : Math.min(Math.max(px + hx * dist, 0.25), RW - 0.25);
    const ey = inHall ? Math.min(Math.max(py + hy * dist, C.y0 + 0.2), C.y1 - 0.2) : Math.min(Math.max(py + hy * dist, 0.25), RD - 0.25);
    flyTo(T([ex, ey, Math.min(2.2, c.y + dist * 0.55)]), c, false);
    state.area = null;
    document.querySelectorAll('[data-area]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
  }
  flash(id);
}
function closeCard() { card.hidden = true; state.focus = null; document.querySelectorAll('[data-item]').forEach((b) => b.setAttribute('aria-pressed', 'false')); }
$('closeFocus').addEventListener('click', closeCard);
$('itemActs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-card]'); if (!b || !state.focus) return;
  const id = state.focus;
  if (b.dataset.card === 'push') pushBody(bodyOf[id].body, null);
  else if (b.dataset.card === 'toggle') { toggleKin(id); focusObject(id, false); }
  else { closeCard(); setArea('all'); }
});
const flashes = [];
function flash(id) {
  for (const m of meshesOf[id] || []) {
    if (m.userData.flash) continue;
    const mat = m.material.clone(); mat.emissive = new THREE.Color(0x9a6b4f); mat.emissiveIntensity = 0.5;
    m.material = mat; m.userData.flash = true;
    flashes.push({ m, t: 1.1 });
  }
}

// ════════════ 互動：抓、推、開抽屜與門 ════════════
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let grab = null, down = null;
const jointBody = new CANNON.Body({ mass: 0, type: CANNON.Body.KINEMATIC });
jointBody.collisionFilterGroup = 0; jointBody.collisionFilterMask = 0;
world.addBody(jointBody);
function setNdc(e) { const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); }
function hit(e) {
  setNdc(e);
  for (const h of ray.intersectObjects(pickable, false)) {
    if (renderer.clippingPlanes.length && h.point.y > cutPlane.constant) continue;
    if (h.object.userData.id) return { id: h.object.userData.id, point: h.point };
  }
  return null;
}
function pushBody(b, at) {
  const d = new THREE.Vector3(); camera.getWorldDirection(d); d.y = Math.max(d.y, -0.1); d.normalize();
  const k = 1.6 * Math.sqrt(b.mass) + 0.4;
  b.wakeUp();
  // 沒有指定施力點時推在物件高度的上段，高的東西才會被推倒而不是平移
  const hgt = (b.userData && b.userData.h) || 0.2;
  const p = at ? new CANNON.Vec3(at.x, at.y, at.z) : b.position.vadd(new CANNON.Vec3(0, hgt * 0.35, 0));
  b.applyImpulse(new CANNON.Vec3(d.x * k, d.y * k + 0.2, d.z * k), p);
}
canvas.addEventListener('pointerdown', (e) => {
  const h = hit(e);
  down = { x: e.clientX, y: e.clientY, t: performance.now(), h };
  if (h && bodyOf[h.id]) {
    const b = bodyOf[h.id].body;
    b.wakeUp();
    const lq = b.quaternion.inverse().vmult(new CANNON.Vec3(h.point.x, h.point.y, h.point.z).vsub(b.position));
    jointBody.position.set(h.point.x, h.point.y, h.point.z);
    const c = new CANNON.PointToPointConstraint(b, lq, jointBody, new CANNON.Vec3(0, 0, 0), 60 + b.mass * 20);
    world.addConstraint(c);
    const n = new THREE.Vector3(); camera.getWorldDirection(n);
    grab = { c, body: b, plane: new THREE.Plane().setFromNormalAndCoplanarPoint(n, h.point) };
    controls.enabled = false;
    canvas.setPointerCapture(e.pointerId);
    e.stopImmediatePropagation();
  } else if (h && kinematic[h.id]) e.stopImmediatePropagation();
}, { capture: true });
canvas.addEventListener('pointermove', (e) => {
  if (grab) {
    setNdc(e);
    const p = new THREE.Vector3();
    if (ray.ray.intersectPlane(grab.plane, p)) { p.y = Math.max(0.03, p.y); jointBody.position.set(p.x, p.y, p.z); }
    return;
  }
  if (e.pointerType === 'mouse' && !down) {
    const h = hit(e);
    canvas.style.cursor = h ? (bodyOf[h.id] ? 'grab' : kinematic[h.id] ? 'pointer' : 'help') : '';
  }
});
function endPointer(e) {
  const quick = down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 350;
  if (grab) {
    world.removeConstraint(grab.c);
    if (quick) pushBody(grab.body, jointBody.position);
    grab = null;
    controls.enabled = true;
  }
  if (quick && down.h) {
    if (kinematic[down.h.id]) toggleKin(down.h.id);
    focusObject(down.h.id, false);
  }
  down = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
function toggleKin(id, force) { const k = kinematic[id]; k.target = force !== undefined ? force : (k.target > 0.5 ? 0 : 1); }

// ── 掃地機器人：前進，卡住就轉向 ──
const robot = { heading: Math.PI / 2, turn: 0, check: 0, last: new CANNON.Vec3() };
function driveRobot(dt) {
  const b = bodyOf.robot_vacuum?.body; if (!b) return;
  b.linearDamping = state.robot ? 0 : 0.9;
  if (!state.robot) return;
  b.wakeUp();
  if (b.quaternion.vmult(new CANNON.Vec3(0, 1, 0)).y < 0.7) return;
  robot.check += dt;
  if (robot.check > 0.5) {
    if (b.position.vsub(robot.last).length() < 0.05 && robot.turn <= 0) robot.turn = 0.8 + Math.random() * 1.2;
    robot.last.copy(b.position); robot.check = 0;
  }
  if (robot.turn > 0) { robot.turn -= dt; robot.heading += dt * 2.2; b.velocity.x *= 0.5; b.velocity.z *= 0.5; }
  else { b.velocity.x = Math.cos(robot.heading) * 0.3; b.velocity.z = -Math.sin(robot.heading) * 0.3; }
  b.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), robot.heading);
  b.angularVelocity.set(0, 0, 0);
}
function resetPhysics() {
  for (const d of bodies) {
    d.body.position.copy(d.rest.p); d.body.quaternion.copy(d.rest.q);
    d.body.velocity.setZero(); d.body.angularVelocity.setZero(); d.body.force.setZero(); d.body.torque.setZero();
    d.body.sleep();
  }
  for (const k of Object.values(kinematic)) k.open = k.target = 0;
  state.robot = false; state.shakeT = 0;
  if (grab) { world.removeConstraint(grab.c); grab = null; controls.enabled = true; }
  syncActs();
}
const notice = $('notice');
let noticeT = 0;
function say(t) { notice.textContent = t; notice.hidden = false; noticeT = 2.2; }
function syncActs() {
  const allOpen = (kind) => Object.values(kinematic).filter((k) => k.rec.kind === kind).every((k) => k.target > 0.5);
  document.querySelector('[data-act="drawers"]').setAttribute('aria-pressed', allOpen('drawer'));
  document.querySelector('[data-act="doors"]').setAttribute('aria-pressed', allOpen('door'));
  document.querySelector('[data-act="robot"]').setAttribute('aria-pressed', state.robot);
}
function setAll(kind, open) {
  const ks = Object.values(kinematic).filter((k) => k.rec.kind === kind);
  ks.forEach((k) => (k.target = open ? 1 : 0));
  syncActs();
}
document.querySelector('.act-switch').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'drawers' || a === 'doors') {
    const kind = a === 'drawers' ? 'drawer' : 'door';
    const open = !Object.values(kinematic).filter((k) => k.rec.kind === kind).every((k) => k.target > 0.5);
    setAll(kind, open);
    if (open && a === 'drawers' && state.area !== 'kitchen') { stopTour(); setArea('kitchen'); }
  }
  else if (a === 'robot') { state.robot = !state.robot; syncActs(); if (state.robot) say('掃地機器人出門了'); }
  else if (a === 'shake') { state.shakeT = 1.6; bodies.forEach((d) => d.body.wakeUp()); say('地面晃了一下'); }
  else if (a === 'reset') { resetPhysics(); say('全部歸位'); }
  else if (a === 'full') { const ws = $('workspace'); try { if (document.fullscreenElement) await document.exitFullscreen(); else await ws.requestFullscreen(); } catch (err) { say('這個瀏覽器不支援全螢幕'); } }
});
document.addEventListener('fullscreenchange', () => document.querySelector('[data-act="full"]').setAttribute('aria-pressed', String(!!document.fullscreenElement)));

// ── 導覽：依序走過每個空間，途中開抽屜、晃地面、開門、放機器人出門 ──
const TOUR = [
  { area: 'entry' }, { area: 'dining' },
  { area: 'kitchen', act: () => setAll('drawer', true) },
  { area: 'living', act: () => { state.shakeT = 1.2; bodies.forEach((d) => d.body.wakeUp()); } },
  { area: 'hall', act: () => { setAll('door', true); state.robot = true; syncActs(); } },
  { area: 'all' },
];
let tourI = 0, tourT = 0, tourDone = false;
function stopTour() { if (!state.tour) return; state.tour = false; $('tour').setAttribute('aria-pressed', 'false'); $('tour').textContent = '播放導覽'; }
$('tour').addEventListener('click', () => {
  if (state.tour) return stopTour();
  state.tour = true; tourI = 0; tourT = 0; tourDone = false;
  $('tour').setAttribute('aria-pressed', 'true'); $('tour').textContent = '停止導覽';
  closeCard(); setArea(TOUR[0].area);
});
controls.addEventListener('start', stopTour);

// ── 時間軸：人物動線 ──
const playBtn = $('play'), prog = $('progress'), tOut = $('timeValue');
let speed = 1;
playBtn.addEventListener('click', () => { if (!action) return; action.paused = !action.paused; playBtn.textContent = action.paused ? '播放' : '暫停'; playBtn.setAttribute('aria-label', action.paused ? '播放人物走動' : '暫停人物走動'); });
$('speed').addEventListener('change', (e) => { speed = +e.target.value; });
prog.addEventListener('input', () => { if (!action) return; action.time = +prog.value / 10; mixer.update(0); });

// ── 鍵盤 ──
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, select, textarea')) return;
  if (e.key === 'Escape') closeCard();
  else if (e.key === 'r' || e.key === 'R') resetPhysics();
  else if (/^[1-6]$/.test(e.key)) { stopTour(); setArea(AREAS[+e.key - 1].id); }
});

// ════════════ 主迴圈 ════════════
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();
setArea('all', true);
renderTab('overview');
$('total').textContent = ' / ' + bodies.length;
if (new URLSearchParams(location.search).has('debug')) window.__dbg = { bodies, CANNON, camera, nodes, kinematic, state, THREE, world, setArea };

const timer = new THREE.Timer();
timer.connect(document);
const tmpV = new THREE.Vector3(), tmpA = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), up = new CANNON.Vec3(0, 1, 0);
const ease = (t) => t * t * (3 - 2 * t);
let uiT = 0;
renderer.setAnimationLoop(() => {
  timer.update();
  const rawDt = timer.getDelta();
  const dt = Math.min(rawDt, 1 / 20);
  if (tween.t < 1 && tween.to) {
    tween.t = Math.min(1, tween.t + Math.min(rawDt, 0.25) / 0.9);
    const k = ease(tween.t);
    camera.position.lerpVectors(tween.from.p, tween.to.p, k);
    controls.target.lerpVectors(tween.from.t, tween.to.t, k);
  }
  controls.update();
  if (state.tour) {
    tourT += rawDt;
    const step = TOUR[tourI];
    if (tourT > 1.2 && step.act && !tourDone) { step.act(); tourDone = true; }
    if (tourT > 4.2) { tourT = 0; tourDone = false; tourI++; if (tourI >= TOUR.length) stopTour(); else setArea(TOUR[tourI].area); }
  }
  if (mixer) {
    mixer.update(action.paused ? 0 : dt * speed);
    if (!action.paused) prog.value = Math.round(action.time * 10);
    tOut.textContent = fmt(action.time, 1) + ' s';
  }
  for (const h of hosts) {
    h.root.getWorldPosition(tmpV);
    h.body.velocity.set((tmpV.x - h.body.position.x) / Math.max(dt, 1e-3), 0, (tmpV.z - h.body.position.z) / Math.max(dt, 1e-3));
    h.body.position.set(tmpV.x, 0, tmpV.z);
  }
  for (const k of Object.values(kinematic)) {
    const moving = Math.abs(k.open - k.target) > 1e-4;
    if (moving) k.open += Math.sign(k.target - k.open) * Math.min(Math.abs(k.target - k.open), dt / 0.55);
    const e = ease(k.open);
    const px = k.body.position.x, py = k.body.position.y, pz = k.body.position.z;
    if (k.rec.kind === 'drawer') { const ax = k.rec.axis; k.node.position.copy(k.rest.p).add(tmpA.set(ax[0], ax[2], -ax[1]).multiplyScalar(k.rec.travel * e)); }
    else k.node.quaternion.copy(k.rest.q).multiply(tmpQ.setFromAxisAngle(tmpA.set(0, 1, 0), THREE.MathUtils.degToRad(k.rec.open_deg) * e));
    k.body.position.copy(k.node.position);
    k.body.quaternion.copy(k.node.quaternion);
    k.body.velocity.set((k.body.position.x - px) / dt, (k.body.position.y - py) / dt, (k.body.position.z - pz) / dt);
    if (moving) for (const d of bodies) if (d.body.position.distanceTo(k.body.position) < 1.4) d.body.wakeUp();
  }
  driveRobot(dt);
  if (state.shakeT > 0) {
    state.shakeT -= dt;
    const t = performance.now() / 1000, amp = Math.min(1, state.shakeT);
    for (const d of bodies) d.body.applyForce(new CANNON.Vec3(Math.sin(t * 17) * d.body.mass * 7 * amp, 0, Math.cos(t * 13) * d.body.mass * 5 * amp));
  }
  world.step(1 / 60, dt, 4);
  for (const d of bodies) {
    const b = d.body;
    if (b.position.y < -2) { b.position.copy(d.rest.p); b.velocity.setZero(); }
    d.node.position.set(b.position.x, b.position.y, b.position.z);
    d.node.quaternion.set(b.quaternion.x, b.quaternion.y, b.quaternion.z, b.quaternion.w);
  }
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i]; f.t -= dt;
    if (f.t <= 0) { f.m.material.dispose(); f.m.userData.flash = false; f.m.material = state.white ? whiteMat(f.m.userData.role) : roleMat(f.m.userData.role); flashes.splice(i, 1); }
    else f.m.material.emissiveIntensity = 0.5 * f.t / 1.1;
  }
  if (noticeT > 0) { noticeT -= rawDt; if (noticeT <= 0) notice.hidden = true; }
  if (state.names) {
    const W = stage.clientWidth, H = stage.clientHeight;
    for (const el of labelsEl.children) {
      const a = AREAS.find((x) => x.id === el.dataset.l);
      tmpV.copy(T([a.c[0], a.c[1], 1.1])).project(camera);
      const vis = tmpV.z < 1 && Math.abs(tmpV.x) < 1.05 && Math.abs(tmpV.y) < 1.05;
      el.style.display = vis ? '' : 'none';
      if (vis) { el.style.left = ((tmpV.x + 1) / 2) * W + 'px'; el.style.top = ((1 - tmpV.y) / 2) * H + 'px'; }
    }
  }
  uiT += rawDt;
  if (uiT > 0.25) {
    uiT = 0;
    let standing = 0;
    for (const d of bodies) if (d.body.quaternion.vmult(up).y > 0.55 || /pillow|ottoman|sculpture/.test(d.id)) standing++;
    const open = Object.values(kinematic).filter((k) => k.open > 0.5).length;
    $('standing').textContent = standing;
    $('stageText').textContent = `件物品站著 · 倒下 ${bodies.length - standing} · 打開 ${open}`;
  }
  renderer.render(scene, camera);
});
</script>
</body>
