<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>下坡 · FREEWHEEL</title>
<meta name="description" content="第一人稱登山車下坡：雨夜港城的濕亮山路、柳杉林的晨霧、高嶺的雪夜。自己拿捏煞車與轉向，聽著花鼓棘輪聲一路滑到山腳。">
<meta name="theme-color" content="#08090a">
<link rel="icon" href="../favicon.svg">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
<style>
:root{
  --ink:#efe8dc;
  --ink-2:rgba(239,232,220,.66);
  --ink-3:rgba(239,232,220,.38);
  --lamp:#e7b76e;
  --night:#08090a;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --r-s:6px;
  --r-m:10px;
  --gut:max(16px, env(safe-area-inset-left));
  --serif:"Songti TC","Noto Serif TC","Source Han Serif TC","PMingLiU",serif;
  --sans:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--night);color:var(--ink);overflow:hidden;font-family:var(--sans);
  -webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s var(--ease-out)}
#fade.on{opacity:1}

/* 標題 */
#title{position:fixed;inset:0;display:grid;pointer-events:none;
  grid-template-columns:1fr auto;grid-template-rows:1fr auto;padding:28px var(--gut) 26px}
#title::before{content:"";position:absolute;left:0;right:0;bottom:0;height:52%;pointer-events:none;
  background:linear-gradient(to top,rgba(4,4,5,.78),rgba(4,4,5,.5) 30%,rgba(4,4,5,.18) 62%,rgba(4,4,5,0))}
body:not(.title) #title{visibility:hidden}
body.shot #title,body.shot #hud{display:none}
.name{grid-column:2;grid-row:1;justify-self:end;align-self:start;display:flex;gap:14px;align-items:flex-start;position:relative}
.name h1{writing-mode:vertical-rl;font-family:var(--serif);font-weight:700;font-size:clamp(84px,17vh,190px);
  line-height:.92;letter-spacing:.06em;color:var(--ink);text-shadow:0 2px 24px rgba(0,0,0,.35)}
.name p{writing-mode:vertical-rl;font-size:13px;letter-spacing:.32em;color:var(--ink-2);margin-top:8px}
.pick{grid-column:1/3;grid-row:2;position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:22px;align-items:end;pointer-events:auto}
.stage{text-align:left;padding:10px 4px 6px;border-radius:var(--r-m);color:var(--ink-3);transition:color .2s}
.stage svg{display:block;width:100%;max-width:260px;height:46px;overflow:visible}
.stage svg path.line{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.stage svg path.end{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.stage svg circle{fill:currentColor}
.stage b{display:block;font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.08em;margin-top:10px;color:inherit}
.stage span{display:block;font-size:12.5px;margin-top:4px;line-height:1.5}
.stage i{font-style:normal;font-size:12px;color:var(--ink-3)}
.stage:hover{color:var(--ink-2)}
.stage[aria-pressed="true"]{color:var(--ink)}
.go{display:flex;flex-direction:column;align-items:flex-end;gap:10px;padding-bottom:8px}
#bGo{background:var(--ink);color:#141210;font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.3em;
  padding:13px 20px 13px 28px;border-radius:var(--r-s);transition:background .18s}
#bGo:hover{background:#fff8ec}
#bGo:disabled{opacity:.5;cursor:progress}
.keys{font-size:12px;color:var(--ink-3);line-height:1.7;text-align:right;white-space:nowrap}
.keys kbd{font:inherit;color:var(--ink-2)}
#best{font-size:12px;color:var(--ink-2)}

/* 行進中 HUD */
#hud{position:fixed;inset:0;pointer-events:none}
body.title #hud{display:none}
.tl{position:absolute;left:var(--gut);top:max(18px,env(safe-area-inset-top));line-height:1.25}
.tl b{display:block;font-family:var(--serif);font-size:15px;letter-spacing:.14em;color:var(--ink-2);font-weight:700}
.tl .t{font-size:30px;font-weight:600;letter-spacing:.02em;margin-top:4px}
.tl .v{font-size:14px;color:var(--ink-2);margin-top:2px;display:none}
body.touch .tl .v{display:block}
.tr{position:absolute;right:var(--gut);top:max(14px,env(safe-area-inset-top));display:flex;gap:6px;pointer-events:auto}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2);transition:color .15s,background .15s}
.ib:hover{color:var(--ink);background:rgba(255,255,255,.08)}
.ib svg{width:22px;height:22px}
.ib.off{color:var(--ink-3)}
#toast{position:absolute;left:50%;top:26%;transform:translateX(-50%);text-align:center;white-space:nowrap;
  font-family:var(--serif);font-size:clamp(22px,3.4vw,34px);font-weight:700;letter-spacing:.1em;color:var(--ink);
  text-shadow:0 2px 18px rgba(0,0,0,.55);transition:opacity .35s;opacity:0}
#toast small{display:block;font-family:var(--sans);font-size:14px;font-weight:500;letter-spacing:.04em;color:var(--ink-2);margin-top:6px}
#toast.on{opacity:1}
#count{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--serif);font-weight:700;
  font-size:clamp(70px,13vw,140px);color:var(--ink);text-shadow:0 4px 30px rgba(0,0,0,.4);opacity:0}
#count.pop{animation:pop .9s var(--ease-out) forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1}100%{opacity:0}}
#cruise{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:13px;color:var(--ink-2);
  letter-spacing:.08em;display:none}
body.auto #cruise{display:block}
body.touch #cruise{bottom:118px}

/* 觸控 */
#touch{position:fixed;left:0;right:0;bottom:0;height:0;display:none}
body.touch:not(.title):not(.overlay) #touch{display:block}
.tb{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));width:74px;height:74px;border-radius:50%;
  display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:26px;color:var(--ink);
  background:rgba(12,11,10,.34);box-shadow:inset 0 0 0 1.5px rgba(239,232,220,.34);touch-action:none;transition:background .1s}
.tb.on{background:rgba(239,232,220,.26)}
#tPedal{left:var(--gut)}
#tBrake{right:var(--gut)}
#steerHint{position:fixed;left:50%;bottom:max(50px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:13px;color:var(--ink);
  white-space:nowrap;transition:opacity .6s;text-shadow:0 1px 2px rgba(0,0,0,.8),0 0 12px rgba(0,0,0,.6)}

/* 覆蓋面板 */
.panel{position:fixed;inset:0;display:none;align-items:center;justify-content:flex-start;padding:24px var(--gut);
  background:linear-gradient(90deg,rgba(5,5,6,.82),rgba(5,5,6,.55) 50%,rgba(5,5,6,.1))}
.panel.on{display:flex}
.panel .in{max-width:460px;width:100%;margin-left:clamp(0px,6vw,90px)}
.panel h2{font-family:var(--serif);font-size:18px;letter-spacing:.2em;color:var(--ink-2);font-weight:700}
.panel .big{font-family:var(--serif);font-weight:700;font-size:clamp(64px,11vw,110px);line-height:1.05;letter-spacing:.02em;margin:6px 0 14px}
.panel dl{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;font-size:15px;margin-bottom:26px}
.panel dt{color:var(--ink-3)}
.panel dd{color:var(--ink)}
.panel .acts{display:flex;gap:10px;flex-wrap:wrap}
.panel .acts button{font-size:16px;padding:11px 18px;border-radius:var(--r-s);background:rgba(239,232,220,.1);transition:background .15s}
.panel .acts button:first-child{background:var(--ink);color:#141210;font-weight:600}
.panel .acts button:hover{background:rgba(239,232,220,.2)}
.panel .acts button:first-child:hover{background:#fff8ec}
.panel .acts kbd{font:inherit;font-size:12px;opacity:.6;margin-left:8px}
.qual{display:flex;align-items:center;flex-wrap:wrap;gap:4px 2px;margin-top:26px;font-size:14px;color:var(--ink-3)}
.qual span{margin-right:10px}
.qual button{padding:6px 10px;border-radius:var(--r-s);color:var(--ink-2);transition:color .15s,background .15s}
.qual button:hover{color:var(--ink);background:rgba(239,232,220,.08)}
.qual button[aria-pressed="true"]{color:#141210;background:var(--ink)}
.qual em{font-style:normal;margin-left:10px;font-size:13px}
body.overlay #toast,body.overlay #count,body.overlay #cruise{visibility:hidden}
body.touch .panel kbd{display:none}
@media (max-width:760px){
  .panel{align-items:flex-end;padding-bottom:max(40px,env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(5,5,6,.9),rgba(5,5,6,.78) 55%,rgba(5,5,6,.35))}
  .panel .in{margin-left:0}
}

#load{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--serif);font-size:18px;letter-spacing:.3em;color:var(--ink-2);display:none}
body.loading #load{display:block}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;line-height:1.8;color:var(--ink-2);background:var(--night)}

@media (max-width:760px){
  #title{padding:20px var(--gut) 18px}
  .name h1{font-size:clamp(72px,15vh,120px)}
  .pick{grid-template-columns:1fr;gap:4px}
  #title::before{height:62%;background:linear-gradient(to top,rgba(4,4,5,.86),rgba(4,4,5,.66) 45%,rgba(4,4,5,.2) 80%,rgba(4,4,5,0))}
  .stage{display:grid;grid-template-columns:92px 1fr;column-gap:14px;align-items:center;padding:7px 0}
  .stage svg{height:34px;grid-column:1;grid-row:1/4}
  .stage b,.stage span,.stage i{grid-column:2}
  .stage b{margin-top:0;font-size:19px}
  .stage span{margin-top:1px}
  .go{flex-direction:row;align-items:center;justify-content:space-between;margin-top:10px;padding-bottom:0}
  .keys{display:none}
  .tl .t{font-size:24px}
}
@media (prefers-reduced-motion:reduce){
  #count.pop{animation-duration:.01s}
  #fade{transition:none}
}
</style>
</head>
<body class="title loading">
<canvas id="gl" aria-label="第一人稱登山車下坡的 3D 畫面"></canvas>
<div id="fade"></div>

  <div class="pick" id="pick">
    <div class="go">
      <div id="best"></div>
      <button id="bGo">出發</button>

    </div>
  </div>
</section>

<div id="hud">
  <div class="tl"><b id="hStage"></b><div class="t num" id="hTime">0:00.0</div><div class="v num" id="hSpeed">0 km/h</div></div>

</div>

<section class="panel" id="pause" aria-label="暫停">
  <div class="in">
    <h2>暫停</h2>
    <div class="big">停一下</div>
    <div class="acts"><button id="bResume">繼續騎<kbd>Esc</kbd></button><button id="bRestart">從頭再騎<kbd>R</kbd></button><button id="bMenu">換路線</button></div>
    <div class="qual" role="group" aria-label="畫質"><span>畫質</span><button data-q="auto">自動</button><button data-q="0">高</button><button data-q="1">中</button><button data-q="2">低</button><button data-q="3">極簡</button><em id="qNow"></em></div>
  </div>
</section>

<section class="panel" id="result" aria-label="成績">
  <div class="in">
    <h2 id="rStage"></h2>
    <div class="big num" id="rTime"></div>
    <dl id="rStats"></dl>
    <div class="acts"><button id="bAgain">再騎一次<kbd>Enter</kbd></button><button id="bMenu2">換路線</button></div>
  </div>
</section>

<div id="load">鋪路中</div>
<div id="err">這件作品需要 WebGL 與網路連線（載入 Three.js）。<br>請改用較新的瀏覽器開啟。</div>

<script type="module">

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

const G = 9.81;

  const r = rng(seed), P = new Uint8Array(512), GR = new Float32Array(256);

const QS = new URLSearchParams(location.search);

if (COARSE) document.body.classList.add('touch');

const STAGES = [

function buildRoad(S) {

    const dx = X[j] - x0, dz = Z[j] - z0, c = Math.cos(a0), sn = Math.sin(a0);
    X[j] = dx * c + dz * sn; Z[j] = -dx * sn + dz * c; A[j] -= a0;
  }
  for (let j = 0; j < N; j++) {
    const s = j - PRE;
    let g = S.grade * (1 + 0.38 * nz(s / 190, 3.3) + 0.12 * nz(s / 55, 9.1));
    g = lerp(g, -0.012, sstep(L - 70, L + 10, s));
    g = lerp(g, -0.004, sstep(L + 40, L + 140, s));
    GR[j] = g;
  }
  Y[PRE] = S.y0;
  for (let j = PRE + 1; j < N; j++) Y[j] = Y[j - 1] + (GR[j - 1] + GR[j]) / 2;
  for (let j = PRE - 1; j >= 0; j--) Y[j] = Y[j + 1] - (GR[j] + GR[j + 1]) / 2;
  const KM = new Float32Array(N);
  for (let j = 0; j < N; j++) { let m = 0; for (let k = -28; k <= 28; k += 2) { const q = clamp(j + k, 0, N - 1); m = Math.max(m, Math.abs(K[q])); } KM[j] = m; }
  const road = { S, PRE, L, N, X, Y, Z, A, K, GR, KM };
  road.at = (s, o = 0) => {
    const f = clamp(s + PRE, 0, N - 1.001), j = Math.floor(f), t = f - j;
    const a = lerp(A[j], A[j + 1], t), x = lerp(X[j], X[j + 1], t), z = lerp(Z[j], Z[j + 1], t);
    return { x: x + Math.cos(a) * o, y: lerp(Y[j], Y[j + 1], t), z: z + Math.sin(a) * o, a, k: lerp(K[j], K[j + 1], t), g: lerp(GR[j], GR[j + 1], t) };
  };
  // 空間雜湊：每 2 m 一個取樣點，32 m 一格
  const CELL = 32, hash = new Map();
  for (let j = 0; j < N; j += 2) { const key = Math.floor(X[j] / CELL) * 73856 + Math.floor(Z[j] / CELL); let a = hash.get(key); if (!a) hash.set(key, a = []); a.push(j); }
  const refine = (x, z, bi, bd, w) => {
    const j0 = Math.max(0, bi - w), j1 = Math.min(N - 1, bi + w);
    for (let j = j0; j <= j1; j++) { const dx = x - X[j], dz = z - Z[j], d = dx * dx + dz * dz; if (d < bd) { bd = d; bi = j; } }
    const o = (x - X[bi]) * Math.cos(A[bi]) + (z - Z[bi]) * Math.sin(A[bi]);
    return { i: bi, o, dist: Math.sqrt(bd) };
  };
  road.nearest = (x, z) => {
    const cx = Math.floor(x / CELL), cz = Math.floor(z / CELL);
    let bi = -1, bd = 1e18;
    for (let r = 0; r <= 10; r++) {
      for (let ix = cx - r; ix <= cx + r; ix++) for (let iz = cz - r; iz <= cz + r; iz++) {
        if (Math.max(Math.abs(ix - cx), Math.abs(iz - cz)) !== r) continue;
        const a = hash.get(ix * 73856 + iz); if (!a) continue;
        for (const j of a) { const dx = x - X[j], dz = z - Z[j], d = dx * dx + dz * dz; if (d < bd) { bd = d; bi = j; } }
      }
      if (bi >= 0 && Math.sqrt(bd) < (r - 0.5) * CELL) break;
    }
    if (bi < 0) { for (let j = 0; j < N; j += 12) { const dx = x - X[j], dz = z - Z[j], d = dx * dx + dz * dz; if (d < bd) { bd = d; bi = j; } } return refine(x, z, bi, bd, 12); }
    return refine(x, z, bi, bd, 2);
  };
  return road;
}

      const y = heightAt(x, z);

    if (snowy) {
      // 紅白雪桿

      for (let s = -60; s < road.L + 360; s += 18) for (const side of [-1, 1]) {
        const p = road.at(s), o = side * (HW + 1.05), x = p.x + Math.cos(p.a) * o, z = p.z + Math.sin(p.a) * o;

      }

      // 山屋：終點前幾盞燈

      for (let v = 0; v < pa.count; v++) { const nx = Math.abs(na.getX(v)), nz = Math.abs(na.getZ(v)); if (Math.abs(na.getY(v)) > 0.3 || ca.getX(v) > 0.7) ua.setXY(v, 0.01, 0.01); else ua.setXY(v, (nx > nz ? pa.getZ(v) : pa.getX(v)) / 6, pa.getY(v) / 6); }

        const o = sd * (HW + (sd > 0 ? 1.1 : 1.0) + Math.pow(rnd(), 1.5) * 16);
        const x = p.x + Math.cos(p.a) * o, z = p.z + Math.sin(p.a) * o, y = heightAt(x, z);
        const sc = 0.35 + rnd() * 0.75;

  if (S.id === 'snow') { hemi.color.setRGB(0.2, 0.24, 0.42); hemi.groundColor.setRGB(0.22, 0.24, 0.32); }

  sun.color.setRGB(...(S.id === 'cedar' ? [1, 0.7, 0.42] : [0.62, 0.72, 1]));
  sun.castShadow = S.id === 'cedar';
  headlamp.intensity = S.id === 'snow' ? 260 : 0;
  for (const L of lampPool) { L.intensity = 0; L.color.set(S.id === 'snow' ? 0xffc27a : 0xffb366); }
  return W_;
}

function buildCity(W_, n, rnd, heightAt) {
  const P = [], C = [], SZ = [], TW = [];
  const F = FX.harbor;
  const add = (x, y, z, size, r, g, b, tw = 0) => { P.push(x, y, z); SZ.push(size); C.push(r, g, b); TW.push(tw); };
  const target = LOW ? 24000 : 46000;
  // 城市範圍的高度與離路距離先烘成網格
  const GX0 = -10000, GZ0 = -12000, GS = 40, GN = 300;
  const LH = new Float32Array(GN * GN), RD = new Float32Array(GN * GN);
  for (let iz = 0; iz < GN; iz++) for (let ix = 0; ix < GN; ix++) {
    const x = GX0 + ix * GS, z = GZ0 + iz * GS;
    LH[iz * GN + ix] = F.macro(x, z, n);
  }
  let rminX = 1e9, rmaxX = -1e9, rminZ = 1e9, rmaxZ = -1e9;
  for (let j = 0; j < road.N; j += 4) { rminX = Math.min(rminX, road.X[j]); rmaxX = Math.max(rmaxX, road.X[j]); rminZ = Math.min(rminZ, road.Z[j]); rmaxZ = Math.max(rmaxZ, road.Z[j]); }
  for (let iz = 0; iz < GN; iz++) for (let ix = 0; ix < GN; ix++) {
    const x = GX0 + ix * GS, z = GZ0 + iz * GS;
    RD[iz * GN + ix] = (x < rminX - 500 || x > rmaxX + 500 || z < rminZ - 500 || z > rmaxZ + 500) ? 1e4 : road.nearest(x, z).dist;
  }
  const bil = (A, x, z) => {
    const fx = clamp((x - GX0) / GS, 0, GN - 1.001), fz = clamp((z - GZ0) / GS, 0, GN - 1.001), ix = Math.floor(fx), iz = Math.floor(fz), tx = fx - ix, tz = fz - iz, k = iz * GN + ix;
    return lerp(lerp(A[k], A[k + 1], tx), lerp(A[k + GN], A[k + GN + 1], tx), tz);

const ST = { mode: 'title', t: 0, time: 0, s: 0, d: 0, psi: 0, v: 0, steer: 0, steerIn: 0, lean: 0, brake: 0, pedal: 0, auto: false, crashes: 0, top: 0,

const bestKey = i => 'fw186-best-' + STAGES[i].id;
const getBest = i => { try { const v = parseFloat(localStorage.getItem(bestKey(i))); return isFinite(v) ? v : null; } catch (e) { return null; } };

const fmt = t => { const m = Math.floor(t / 60), s = t - m * 60; return `${m}:${s < 10 ? '0' : ''}${s.toFixed(1)}`; };

  Object.assign(ST, { s, d: STAGES[SI].id === 'cedar' ? STAGES[SI].width * 0.22 : 0, psi: 0, v: 0, steer: 0, lean: 0, brake: 1, pedal: 0, slip: 0, slipT: 0, crashT: 0, edge: 0 });
}

  ST.auto = QS.get('auto') === '1';

  document.body.classList.toggle('auto', ST.auto);
  $('fade').classList.remove('on'); // 摔車淡出途中重騎時，不讓黑幕留著
  $('result').classList.remove('on'); $('pause').classList.remove('on');
  $('hStage').textContent = STAGES[SI].name;

let countTimer = [], hintT = 0;

  ['3', '2', '1'].forEach((n, i) => countTimer.push(setTimeout(() => { el.textContent = n; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); audio.tick(i === 2 ? 2 : 1); }, i * 800)));

let toastT = 0;

function autopilot(S) {
  const look = ST.v * 2.8 + 18;
  let kmax = 0, knear = 0;
  for (let q = 4; q < look; q += 3) { const k = road.at(ST.s + q).k; if (Math.abs(k) > Math.abs(kmax)) kmax = k; }

const cMax = v => 1 / (4.5 + v * 0.95);

function physics(dt) {

    ST.crashT += dt; ST.v = Math.max(0, ST.v - 14 * dt);

  if (ST.mode === 'title' || ST.auto) { const a = autopilot(S); steerT = a.steer; brake = a.brake; pedal = a.pedal; }
  else {
    steerT = clamp(input.right - input.left + input.touchSteer, -1, 1);

    lampPool.forEach((L, i) => {
      const c = cand[i];
      if (c) { L.position.set(c.l.x, c.l.y, c.l.z); L.intensity = S.id === 'harbor' ? 1700 : 900; }
      else L.intensity = 0;
    });
    // 車頭主光：最近的一盞燈
    const c = cand[0];
    if (c) {
      tmpV.set(c.l.x - camera.position.x, c.l.y - camera.position.y, c.l.z - camera.position.z);
      const d2 = tmpV.lengthSq(); tmpV.normalize().applyQuaternion(invQ);
      cockKey.position.copy(tmpV).multiplyScalar(5); cockKey.target.position.set(0, -0.5, -0.5);
      cockKey.intensity = clamp(90 / d2, 0.55, 3.2) * (S.id === 'harbor' ? 1 : 0.4);
      cockKey.color.set(0xffb56a);
    } else cockKey.intensity = 0;
  }
  if (S.id === 'cedar') {
    tmpV.copy(FOGU.uSunDir.value).applyQuaternion(invQ);
    cockKey.position.copy(tmpV).multiplyScalar(5); cockKey.target.position.set(0, -0.5, -0.5);
    const dapple = sstep(-0.2, 0.25, Math.sin(ST.s * 0.9) * 0.6 + Math.sin(ST.s * 2.3 + 1) * 0.4);
    cockKey.intensity = 0.6 + 2.6 * dapple; cockKey.color.setRGB(1, 0.8, 0.58);
    cockHemi.color.setRGB(0.6, 0.66, 0.78); cockHemi.groundColor.setRGB(0.2, 0.17, 0.12); cockHemi.intensity = 0.9;
    sun.position.set(p.x + FOGU.uSunDir.value.x * 150, p.y + FOGU.uSunDir.value.y * 150, p.z + FOGU.uSunDir.value.z * 150);
    sun.target.position.set(p.x - Math.sin(-p.a) * 20, p.y, p.z - Math.cos(p.a) * 20);
  } else if (S.id === 'snow') {
    tmpV.set(-0.35, 0.55, -0.76).normalize().applyQuaternion(invQ);
    if (!W_.lamps.length || cockKey.intensity < 0.3) { cockKey.position.copy(tmpV).multiplyScalar(5); cockKey.intensity = 0.5; cockKey.color.setRGB(0.6, 0.7, 1); }
    cockHemi.color.setRGB(0.18, 0.2, 0.34); cockHemi.groundColor.setRGB(0.4, 0.42, 0.5); cockHemi.intensity = 1.3;
    sun.position.set(p.x - 0.35 * 150, p.y + 0.55 * 150, p.z - 0.76 * 150); sun.target.position.set(p.x, p.y, p.z);
    // 頭燈掛在把手上
    headlamp.position.copy(camera.position).add(tmpV2.set(0, -0.45, 0));
    const hp = road.at(ST.s + 14, ST.d * 0.6);
    const hd = new THREE.Vector3(Math.sin(yaw), 0, -Math.cos(yaw));
    headlamp.target.position.set(camera.position.x + hd.x * 14, hp.y, camera.position.z + hd.z * 14);
    cockSpot.intensity = 0;
  } else {
    cockHemi.color.setRGB(0.5, 0.33, 0.2); cockHemi.groundColor.setRGB(0.3, 0.2, 0.12); cockHemi.intensity = 1;
  }
  updateShadows(p, S.id === 'cedar' ? sstep(-0.2, 0.25, Math.sin(ST.s * 0.9) * 0.6 + Math.sin(ST.s * 2.3 + 1) * 0.4) : 1);
  // 粒子
  if (W_.rain) { const u = W_.rain.material.uniforms; u.uCam.value.copy(camera.position); u.uTime.value = time; u.uVel.value.set(Math.sin(yaw) * v, 0, -Math.cos(yaw) * v);
    const near = W_.lamps.filter(l => Math.abs(l.s - ST.s) < 60).slice(0, 4); for (let i = 0; i < 4; i++) { const l = near[i]; u.uLamps.value[i].set(l ? l.x : 0, l ? l.y : -1e4, l ? l.z : 0); } }
  if (W_.snow) { const u = W_.snow.material.uniforms; u.uCam.value.copy(camera.position); u.uTime.value = time; u.uProj.value = projScale; u.uHead.value.copy(headlamp.position); u.uHeadDir.value.copy(headlamp.target.position).sub(headlamp.position).normalize(); }
  if (W_.motes) { const u = W_.motes.material.uniforms; u.uCam.value.copy(camera.position); u.uTime.value = time; u.uProj.value = projScale; }
  if (W_.city) for (const c of W_.city) { c.material.uniforms.uProj.value = projScale; c.material.uniforms.uTime.value = time; }
  if (W_.glows) { W_.glows.material.uniforms.uProj.value = projScale; W_.glows.material.uniforms.uTime.value = time; }
  skyMat.uniforms.uTime.value = time; RAIN_T.value = time;
  sky.position.copy(camera.position);
  // 碼錶（約 10 Hz）
  compAcc += dt;
  if (compAcc > 0.1) {
    compAcc = 0;
    if (!profCache || profCache.si !== SI) {
      const P = [], y0 = road.Y[road.PRE], y1 = road.Y[road.PRE + road.L];
      for (let i = 0; i <= 60; i++) P.push((road.Y[road.PRE + Math.round(i / 60 * road.L)] - y1) / (y0 - y1));
      profCache = { si: SI, P };
    }
    drawComputer({ kmh: ST.v * 3.6, grade: `${Math.round(p.g * 100)}%`, time: fmt(ST.time), left: `剩 ${(Math.max(0, road.L - ST.s) / 1000).toFixed(2)} km`, prof: profCache.P, frac: ST.s / road.L, flash: compFlash > 0 });
    compFlash = Math.max(0, compFlash - 0.34);
  }
}

/* ───────── 主迴圈 ───────── */
let last = performance.now(), T = 0, hudAcc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = now - last;
  let dt = Math.min(0.05, raw / 1000); last = now;
  watchFrame(raw);
  if (ST.paused || !world) dt = 0;
  T += dt;
  const sub = Math.max(1, Math.ceil(dt / (1 / 120)));
  for (let i = 0; i < sub; i++) physics(dt / sub);
  if (!world) return;
  updateCamera(dt, T);
  audio.update(dt);
  hudAcc += dt;
  if (hudAcc > 0.08) { hudAcc = 0; $('hTime').textContent = fmt(ST.time); $('hSpeed').textContent = `${Math.round(ST.v * 3.6)} km/h`; }
  render();
}
function render() {
  const F = FXC;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.setRenderTarget(rtScene); renderer.clear(); renderer.render(scene, camera);
  matBright.uniforms.tSrc.value = rtScene.texture; matBright.uniforms.uTexel.value.set(1 / rtScene.width, 1 / rtScene.height);
  matBright.uniforms.uTh.value = STAGES[SI].id === 'cedar' ? 2.6 : 1.1;
  pass(matBright, rtB[0]);
  const blur2 = (src, tmp, sc) => {
    matBlur.uniforms.tSrc.value = src.texture; matBlur.uniforms.uDir.value.set(sc / src.width, 0); pass(matBlur, tmp);
    matBlur.uniforms.tSrc.value = tmp.texture; matBlur.uniforms.uDir.value.set(0, sc / src.height); pass(matBlur, src);
  };
  blur2(rtB[0], rtB[1], 1);
  matBlur.uniforms.tSrc.value = rtB[0].texture; matBlur.uniforms.uDir.value.set(1 / rtB[0].width, 0); pass(matBlur, rtB[3]);
  matBlur.uniforms.tSrc.value = rtB[3].texture; matBlur.uniforms.uDir.value.set(0, 1 / rtB[2].height); pass(matBlur, rtB[2]);
  blur2(rtB[2], rtB[3], 1.5);
  matBlur.uniforms.tSrc.value = rtB[2].texture; matBlur.uniforms.uDir.value.set(1 / rtB[2].width, 0); pass(matBlur, rtB[5]);
  matBlur.uniforms.tSrc.value = rtB[5].texture; matBlur.uniforms.uDir.value.set(0, 1 / rtB[4].height); pass(matBlur, rtB[4]);
  blur2(rtB[4], rtB[5], 2);
  const u = matComp.uniforms;
  u.tScene.value = rtScene.texture; u.tB0.value = rtB[0].texture; u.tB1.value = rtB[2].texture; u.tB2.value = rtB[4].texture;
  u.uExpo.value = F.exposure; u.uBloom.value = F.bloom; u.uTime.value = T;
  pass(matComp, null);
  renderer.autoClear = false; renderer.clearDepth();
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = F.exposure;
  renderer.render(cockScene, cockCam);
  renderer.autoClear = true;
}

/* ───────── 標題畫面：路線剖面 ───────── */
const pick = $('pick');
const profiles = STAGES.map(S => buildRoad(S));
STAGES.forEach((S, i) => {
  const r = profiles[i], y0 = r.Y[r.PRE], y1 = r.Y[r.PRE + r.L];
  // 路線平面圖：起點在左、終點在右
  const pts = [];
  for (let k = 0; k <= 120; k++) { const j = r.PRE + Math.round(k / 120 * r.L); pts.push([-r.Z[j], r.X[j]]); }
  const u0 = Math.min(...pts.map(p => p[0])), u1 = Math.max(...pts.map(p => p[0])), v0 = Math.min(...pts.map(p => p[1])), v1 = Math.max(...pts.map(p => p[1]));
  const sc = Math.min(192 / (u1 - u0), 38 / Math.max(1, v1 - v0));
  const P = pts.map(([u, v]) => [4 + (u - u0) * sc, 23 + (v - (v0 + v1) / 2) * sc]);
  const line = P.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const e = P[P.length - 1];
  const b = document.createElement('button'); b.className = 'stage'; b.dataset.i = i;
  b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `<svg viewBox="0 0 200 46" aria-hidden="true"><path class="line" d="${line}"/><circle cx="${P[0][0].toFixed(1)}" cy="${P[0][1].toFixed(1)}" r="3.2"/><path class="end" d="M${e[0].toFixed(1)} ${(e[1] - 6).toFixed(1)}V${(e[1] + 6).toFixed(1)}"/></svg>
    <b>${S.name}</b><span>${S.note}</span><i class="num">${(S.len / 1000).toFixed(1)} km　落差 ${Math.round(y0 - y1)} m　${S.grip}</i>`;
  b.addEventListener('click', () => selectStage(i));
  pick.insertBefore(b, pick.querySelector('.go'));
});
function markStage(i) {
  pick.querySelectorAll('.stage').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i === i)));
  const best = getBest(i); $('best').textContent = best != null ? `這條路的最佳　${fmt(best)}` : '';
}
let building = false;
async function selectStage(i, force = false) {
  if (building) return;
  if (!force && i === SI && world) { markStage(i); return; }
  building = true; markStage(i);
  document.body.classList.add('loading'); $('bGo').disabled = true;
  $('fade').classList.add('on');
  await new Promise(r => setTimeout(r, world ? 380 : 30));
  buildWorld(i); applyLod(); fmon.cool = 3; fmon.ema = 16;
  resetRide(QS.has('s') ? +QS.get('s') : 40); ST.v = 9; ST.brake = 0;
  document.body.classList.remove('loading'); $('bGo').disabled = false;
  $('fade').classList.remove('on');
  building = false;
}
function toTitle() {
  countTimer.forEach(clearTimeout); countTimer = [];
  $('fade').classList.remove('on');
  ST.mode = 'title'; ST.paused = false; ST.auto = false;
  document.body.classList.add('title'); document.body.classList.remove('overlay', 'auto');
  $('result').classList.remove('on'); $('pause').classList.remove('on');
  resetRide(40); ST.v = 9; ST.brake = 0; markStage(SI);
}
function setPause(p) {
  if (ST.mode === 'title' || ST.mode === 'finish') return;
  if (p === ST.paused) return;
  ST.paused = p; $('pause').classList.toggle('on', p); document.body.classList.toggle('overlay', p);
  // 倒數是 setTimeout 排的：暫停時停掉，繼續時重新倒數，免得在暫停畫面後面偷偷開跑
  if (ST.mode === 'count') { countTimer.forEach(clearTimeout); countTimer = []; if (!p) countdown(); }
}

/* ───────── 輸入 ───────── */
$('bGo').addEventListener('click', () => { if (!building) startRide(); });
$('bAgain').addEventListener('click', startRide);
$('bRestart').addEventListener('click', () => { ST.paused = false; startRide(); });
$('bResume').addEventListener('click', () => setPause(false));
$('bMenu').addEventListener('click', toTitle);
$('bMenu2').addEventListener('click', toTitle);
$('bPause').addEventListener('click', () => setPause(!ST.paused));
const syncMute = () => { $('bSound').classList.toggle('off', audio.muted); $('muteX').style.display = audio.muted ? '' : 'none'; };
$('bSound').addEventListener('click', () => { audio.ensure(); audio.mute = !audio.muted; syncMute(); });
syncMute();
function syncQualityUI() {
  document.querySelectorAll('.qual button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.q === qMode)));
  $('qNow').textContent = qMode === 'auto' ? `目前：${QUALITY[qLevel].name}` : '';
}
document.querySelectorAll('.qual button').forEach(b => b.addEventListener('click', () => {
  qMode = b.dataset.q; try { localStorage.setItem('fw186-q', qMode); } catch (e) { }
  applyQuality(qMode === 'auto' ? (LOW ? 1 : 0) : +qMode);
}));
syncQualityUI();
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', Space: 'down' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k) {
    input[k] = 1; e.preventDefault();
    if (ST.auto && ST.mode === 'ride' && k !== 'up') { ST.auto = false; document.body.classList.remove('auto'); }
  }
  if (e.repeat) return;
  if (e.code === 'Enter') {
    if (document.body.classList.contains('title')) { if (!building) startRide(); }
    else if ($('result').classList.contains('on')) startRide();
  }
  if (e.code === 'Escape' || e.code === 'KeyP') setPause(!ST.paused);
  if (e.code === 'KeyR' && ST.mode !== 'title') { ST.paused = false; startRide(); }
  if (e.code === 'KeyM') { audio.ensure(); audio.mute = !audio.muted; syncMute(); }
  if (e.code === 'KeyC' && (ST.mode === 'ride' || ST.mode === 'count')) { ST.auto = !ST.auto; document.body.classList.toggle('auto', ST.auto); }
  if (ST.mode === 'title' && /^Digit[123]$/.test(e.code)) selectStage(+e.code.slice(5) - 1);
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) input[k] = 0; });
addEventListener('blur', () => { for (const k in input) input[k] = 0; });
// 觸控：拖曳轉向、按鈕煞車與踩踏
let steerId = null, steerX0 = 0;
canvas.addEventListener('pointerdown', e => {
  if (ST.mode === 'title') return;
  if (e.pointerType === 'mouse') return;
  steerId = e.pointerId; steerX0 = e.clientX; canvas.setPointerCapture(e.pointerId);
  if (ST.auto) { ST.auto = false; document.body.classList.remove('auto'); }
});
canvas.addEventListener('pointermove', e => { if (e.pointerId === steerId) input.touchSteer = clamp((e.clientX - steerX0) / (innerWidth * 0.16), -1, 1); });
const endSteer = e => { if (e.pointerId === steerId) { steerId = null; input.touchSteer = 0; } };
canvas.addEventListener('pointerup', endSteer); canvas.addEventListener('pointercancel', endSteer);
for (const [id, key] of [['tBrake', 'touchBrake'], ['tPedal', 'touchPedal']]) {
  const el = $(id);
  el.addEventListener('pointerdown', e => { e.preventDefault(); input[key] = 1; el.classList.add('on'); el.setPointerCapture(e.pointerId); });
  const up = () => { input[key] = 0; el.classList.remove('on'); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('lostpointercapture', up);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && (ST.mode === 'ride' || ST.mode === 'count')) setPause(true); });

/* ───────── 開始 ───────── */
resize();
const startSi = clamp(parseInt(QS.get('stage') || '1', 10) - 1, 0, 2);
const handsReady = loadHands();
await selectStage(startSi, true);
if (QS.has('ride')) startRide();
if (SHOT) document.body.classList.add('shot');
window.__fw = { ST, hands: glbHands, bars, get road() { return road; }, get world() { return world; }, get quality() { return { mode: qMode, level: qLevel, ema: fmon.ema, dpr: DPR }; }, applyQuality, get analyser() { return audio.tap(); }, selectStage, startRide, toTitle, setS: s => { ST.s = s; } };
requestAnimationFrame(t => { last = t; frame(t); });
</script>
