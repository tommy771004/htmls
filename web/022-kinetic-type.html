<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLEX — Type Is a Muscle</title>
<meta name="description" content="全螢幕巨字，游標附近的字母變粗變寬，閒置時自動跑字重波浪。收錄於 100 Creative HTML Works（022・動態字體）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/web/022-kinetic-type.html">
<style>
:root{
  --bg:#060606; --fg:#c8ff00; --dim:#4d6200; --line:rgba(200,255,0,.18);
  --f: Bahnschrift, "DIN Alternate", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
}
body.inv{ --bg:#c8ff00; --fg:#060606; --dim:#7a9a00; --line:rgba(0,0,0,.2); }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);overflow:hidden;transition:none;-webkit-font-smoothing:antialiased}
.stage{position:fixed;inset:0;touch-action:none;cursor:none;user-select:none;-webkit-user-select:none}
.lines{position:absolute;left:clamp(16px,3vw,48px);right:clamp(16px,3vw,48px);top:clamp(64px,10vh,110px);bottom:clamp(76px,11vh,110px);
  display:flex;flex-direction:column;justify-content:center;gap:0}
.ln{display:flex;justify-content:center;align-items:baseline;line-height:.8;white-space:nowrap;height:auto}
.ln span{display:inline-block;text-transform:uppercase;
  font-weight:300;font-stretch:75%;font-kerning:none}
.ln span.sp{width:.22em}

/* HUD */
.hud{position:fixed;font-weight:300;font-stretch:75%;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg);pointer-events:none}
.tl{top:16px;left:16px}
.tr{top:16px;right:16px;text-align:right}
.hud b{font-weight:700;font-stretch:100%;font-weight:normal}
.rule-y{position:fixed;left:0;top:clamp(64px,10vh,110px);bottom:clamp(76px,11vh,110px);width:10px;pointer-events:none;
  background:repeating-linear-gradient(180deg,var(--line) 0 1px,transparent 1px 10px)}
.rule-x{position:fixed;left:clamp(16px,3vw,48px);right:clamp(16px,3vw,48px);bottom:clamp(58px,8vh,84px);height:10px;pointer-events:none;
  background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10px)}
.mark-y{position:fixed;left:0;width:18px;height:2px;background:var(--fg);pointer-events:none}
.mark-x{position:fixed;bottom:clamp(58px,8vh,84px);width:2px;height:18px;background:var(--fg);pointer-events:none}
.lab-y{position:fixed;left:16px;top:clamp(64px,10vh,110px);font-size:10px;letter-spacing:.2em;writing-mode:vertical-rl;transform:rotate(180deg);color:var(--dim);pointer-events:none;font-weight:400;font-stretch:75%}
.foot{position:fixed;left:0;right:0;bottom:0;height:clamp(44px,6vh,56px);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px;z-index:5}
.ticker{flex:1;min-width:0;overflow:hidden;white-space:nowrap;font-size:13px;letter-spacing:.18em;font-weight:350;font-stretch:80%;color:var(--fg)}
.ticker span{display:inline-block;animation:tick 30s linear infinite}
@keyframes tick{to{transform:translateX(-50%)}}
.btn{flex:0 0 auto;height:40px;min-width:40px;padding:0 14px;border:1px solid var(--fg);background:transparent;color:var(--fg);font:inherit;font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
  font-weight:500;font-stretch:85%;border-radius:0}
.btn:hover,.btn:focus-visible{background:var(--fg);color:var(--bg);outline:none}
.cursor{position:fixed;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border:1px solid var(--fg);border-radius:50%;pointer-events:none;z-index:6;mix-blend-mode:difference}
.cursor::before,.cursor::after{content:"";position:absolute;background:var(--fg)}
.cursor::before{left:50%;top:-10px;bottom:-10px;width:1px}
.cursor::after{top:50%;left:-10px;right:-10px;height:1px}
.read{position:fixed;left:0;top:0;font-size:10px;letter-spacing:.14em;pointer-events:none;z-index:6;white-space:nowrap;font-weight:400;font-stretch:75%;color:var(--fg)}
.flash{position:fixed;inset:0;background:var(--fg);pointer-events:none;opacity:0;z-index:9}
.flash.go{animation:fl .18s steps(2,end)}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#typed{position:absolute;opacity:0;width:1px;height:1px;left:-10px;top:0;pointer-events:none}
@media (max-width:600px){
  .tr .ex{display:none}
  .tr{top:74px;right:auto;left:16px;text-align:left}
  .lines{top:110px}
  .lab-y{display:none}
  .btn{padding:0 10px;font-size:11px}
  .ticker{font-size:11px}
  .cursor{width:44px;height:44px;margin:-22px 0 0 -22px}
}
@media (hover:none){ .stage{cursor:auto} }
@media (prefers-reduced-motion:reduce){ .ticker span{animation:none} }
</style>
</head>
<body>
<div class="stage" id="stage" aria-label="Kinetic type field. Move the pointer to flex the letters.">
  <div class="lines" id="lines" role="heading" aria-level="1"></div>
</div>
<div class="rule-y" aria-hidden="true"></div>
<div class="rule-x" aria-hidden="true"></div>
<div class="mark-y" id="my" aria-hidden="true"></div>
<div class="mark-x" id="mx" aria-hidden="true"></div>
<div class="lab-y" aria-hidden="true">WGHT 300 ⟶ 700</div>
<div class="hud tl"><b>FLEX</b>/Vol.22 — A variable-font gym<br>Bahnschrift · 2 axes · 0 carbs<br>Set <b id="set">01</b> / 06</div>
<div class="hud tr"><span id="modeLbl"><b>ATTRACT</b></span> field<br><span class="ex">wght <b id="rw">300</b> · wdth <b id="rd">75</b></span></div>
<div class="cursor" id="cur" aria-hidden="true"></div>
<div class="read" id="read" aria-hidden="true"></div>
<div class="foot">
  <div class="ticker" aria-hidden="true"><span id="tick"></span></div>
  <button class="btn" id="bInv" aria-pressed="false">Invert</button>
  <button class="btn" id="bNext">Next ›</button>
</div>
<input id="typed" aria-label="Type to rewrite the last line" autocomplete="off" autocapitalize="characters" spellcheck="false">
<div class="flash" id="flash"></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const stage = $('#stage'), linesEl = $('#lines');
if (!stage || !linesEl) return;

const PHRASES = [
  ['TYPE','IS A','MUSCLE'],
  ['HEAVY','LIGHT','HEAVY'],
  ['SQUEEZE','ME','GENTLY'],
  ['WIDE','LOAD','AHEAD'],
  ['BOLD','MOVES','ONLY'],
  ['LEG DAY','FOR','LETTERS']
];
let pi = 0, lines = PHRASES[0].slice();
let letters = []; // {el, x, y, w, d, curW, curD}
const W_MIN=300, W_MAX=700, D_MIN=75, D_MAX=100;

function build(){
  linesEl.innerHTML = '';
  letters = [];
  lines.forEach(txt => {
    const ln = document.createElement('div'); ln.className='ln';
    [...txt].forEach(ch => {
      const s = document.createElement('span');
      if (ch === ' ') { s.className='sp'; s.innerHTML='&nbsp;'; }
      else { s.textContent = ch; letters.push({ el:s, cw:W_MIN+120, cd:D_MIN+6, vw:0, vd:0, cx:0, cy:0 }); }
      ln.appendChild(s);
    });
    linesEl.appendChild(ln);
  });
  fit();
}
// size each line so that its widest possible state (700/100) fits the width
function fit(){
  const r = linesEl.getBoundingClientRect();
  const lns = [...linesEl.children]; if (!lns.length) return;
  const maxH = r.height / lns.length / .8;
  lns.forEach(ln => {
    const spans = [...ln.children];
    const prev = spans.map(s => [s.style.fontWeight, s.style.fontStretch, s.style.webkitTextStroke]);
    spans.forEach(s => { s.style.fontWeight = 700; s.style.fontStretch = '100%'; s.style.webkitTextStroke = '0'; });
    ln.style.fontSize = '100px';
    let w = 0; spans.forEach(s => { w += s.getBoundingClientRect().width; }); w = w || 1;
    spans.forEach((s,i) => { s.style.fontWeight = prev[i][0]; s.style.fontStretch = prev[i][1]; s.style.webkitTextStroke = prev[i][2]; });
    ln.style.fontSize = Math.max(24, Math.min(maxH, r.width / w * 100 * .98)) + 'px';
  });
  measure();
}
function measure(){ letters.forEach(L => { const b = L.el.getBoundingClientRect(); L.cx = b.left + b.width/2; L.cy = b.top + b.height/2; }); }

// Bahnschrift ships 5 weight x 3 width named instances; Chrome on Windows snaps to them, so the
// in-between weight is filled with a same-colour stroke (continuous), width snaps like gears.
const INST = [300,350,400,600,700], STEM = [.010,.010,.034,.017];
function applyAxes(L, w, d){
  let i = 0; while (i < INST.length-1 && w >= INST[i+1]) i++;
  const frac = i < INST.length-1 ? (w - INST[i]) / (INST[i+1]-INST[i]) : 0;
  const inst = INST[i], stroke = i < INST.length-1 ? frac*STEM[i] : 0;
  const st = d < 81 ? 75 : d < 94 ? 87.5 : 100;
  const key = inst + "|" + st + "|" + stroke.toFixed(3);
  if (L.key === key) return; L.key = key;
  L.el.style.fontWeight = inst; L.el.style.fontStretch = st + "%";
  L.el.style.webkitTextStroke = stroke > .0005 ? stroke.toFixed(3) + "em currentColor" : "0";
}
let px = innerWidth/2, py = innerHeight/2, tx = px, ty = py, lastMove = -99999, vel = 0, attract = true;
const cur = $('#cur'), read = $('#read'), my = $('#my'), mx = $('#mx');
function onMove(e){
  const dx = e.clientX - tx, dy = e.clientY - ty;
  vel = Math.min(1, vel + Math.hypot(dx,dy)/400);
  tx = e.clientX; ty = e.clientY; lastMove = performance.now();
}
stage.addEventListener('pointermove', onMove);
stage.addEventListener('pointerdown', e => { onMove(e); });
let downAt = 0, downX = 0, downY = 0;
stage.addEventListener('pointerdown', e => { downAt = performance.now(); downX = e.clientX; downY = e.clientY; });
stage.addEventListener('pointerup', e => {
  if (performance.now() - downAt < 260 && Math.hypot(e.clientX-downX, e.clientY-downY) < 10) toggleField();
});
function toggleField(){
  attract = !attract;
  const m = $('#modeLbl'); if (m) m.innerHTML = '<b>' + (attract ? 'ATTRACT' : 'REPEL') + '</b>';
}
function invert(){
  document.body.classList.toggle('inv');
  const b = $('#bInv'); if (b) b.setAttribute('aria-pressed', document.body.classList.contains('inv'));
  const f = $('#flash'); if (f) { f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
}
function nextPhrase(){
  pi = (pi+1) % PHRASES.length; lines = PHRASES[pi].slice(); build();
  const se = $("#set"); if (se) se.textContent = String(pi+1).padStart(2,"0");
  letters.forEach((L,i) => { L.cw = W_MAX; L.cd = D_MAX; L.vw = -30 - i; });
}
const bi = $('#bInv'); if (bi) bi.addEventListener('click', invert);
const bn = $('#bNext'); if (bn) bn.addEventListener('click', nextPhrase);

// typing rewrites the last line
let typedBuf = '', typing = false;
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Enter') { if (document.activeElement && document.activeElement.tagName==='BUTTON') return; nextPhrase(); typedBuf=''; typing=false; return; }
  if (e.key === 'Escape') { typedBuf=''; typing=false; lines = PHRASES[pi].slice(); build(); return; }
  if (e.key === ' ' && !typing) { if (document.activeElement && document.activeElement.tagName==='BUTTON') return; e.preventDefault(); toggleField(); return; }
  if (e.key === 'Backspace') { if (typing) { typedBuf = typedBuf.slice(0,-1); applyTyped(); e.preventDefault(); } return; }
  if (e.key.length === 1 && /[a-z0-9 !?&.,'\-]/i.test(e.key)) {
    if (!typing) { typing = true; typedBuf = ''; }
    if (typedBuf.length < 9) typedBuf += e.key.toUpperCase();
    applyTyped(); e.preventDefault();
  }
});
function applyTyped(){ lines = PHRASES[pi].slice(); lines[lines.length-1] = typedBuf.trim() ? typedBuf : '_'; build(); }

// ticker
const tk = $('#tick');
if (tk) { const t = 'MOVE TO FLEX ✕ TAP TO FLIP THE FIELD ✕ TYPE TO REWRITE THE LAST LINE ✕ ENTER FOR THE NEXT SET ✕ NO LETTERS WERE HARMED ✕ REST 60 SECONDS BETWEEN SERIFS ✕ '; tk.textContent = t + t; }

// idle choreography: a virtual finger sweeping a lissajous path
function idlePoint(t){
  const w = innerWidth, h = innerHeight;
  return [w/2 + Math.sin(t*.00055 - 1.2)*w*.34, h/2 + Math.sin(t*.0011 + .4)*h*.22];
}
let last = performance.now(), msrT = 0;
const rw = $('#rw'), rd = $('#rd');
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  const idle = now - lastMove > 2200;
  let gx = tx, gy = ty;
  if (idle) { const p = idlePoint(now); gx = p[0]; gy = p[1]; }
  px += (gx - px) * (idle ? .08 : .25); py += (gy - py) * (idle ? .08 : .25);
  vel *= .94;
  msrT += dt; if (msrT > .5) { msrT = 0; measure(); }
  const R = Math.max(160, Math.min(innerWidth, innerHeight) * .42) * (1 + vel*.5);
  let nearest = null, nd = 1e9;
  const waveAmp = idle ? .8 : .22;
  letters.forEach((L, i) => {
    const d = Math.hypot(L.cx - px, (L.cy - py) * 1.3);
    let k = Math.max(0, 1 - d/R); k = k*k*(3-2*k);
    const wave = (.5 + .5*Math.sin(now*.0026 - i*.55)) * waveAmp;
    k = Math.max(k, wave * (attract ? 1 : .6));
    if (!attract) k = 1 - k;
    const wt = W_MIN + (W_MAX-W_MIN)*k, dt2 = D_MIN + (D_MAX-D_MIN)*Math.min(1, k*1.1 + vel*.2);
    // spring
    L.vw += (wt - L.cw) * .18; L.vw *= .72; L.cw += L.vw;
    L.vd += (dt2 - L.cd) * .14; L.vd *= .74; L.cd += L.vd;
    const cw = Math.max(W_MIN, Math.min(W_MAX, L.cw)), cd = Math.max(D_MIN, Math.min(D_MAX, L.cd));
    applyAxes(L, cw, cd);
    const a = (cw - W_MIN)/(W_MAX-W_MIN);
    L.el.style.opacity = (0.42 + a*0.58).toFixed(2);
    if (d < nd) { nd = d; nearest = [cw, cd]; }
  });
  if (cur) cur.style.transform = `translate(${px}px,${py}px) scale(${1+vel*.6})`;
  if (read && nearest) {
    read.style.transform = `translate(${Math.max(8, Math.min(px+40, innerWidth - (read.offsetWidth||140) - 8))}px,${py+28}px)`;
    read.textContent = `WGHT ${nearest[0].toFixed(0)} / WDTH ${nearest[1].toFixed(0)}` + (idle ? ' · AUTO' : '');
    if (rw) rw.textContent = nearest[0].toFixed(0); if (rd) rd.textContent = nearest[1].toFixed(0);
  }
  if (my) my.style.top = Math.max(0, py) + 'px';
  if (mx) mx.style.left = px + 'px';
  requestAnimationFrame(frame);
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(fit, 80); });
build();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit).catch(()=>{});
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
