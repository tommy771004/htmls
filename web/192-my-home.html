  { id: 'workshop', name: '工作間', en: 'TOOLS', eye: [6.9, 3.9, 1.7], at: [9.7, 5.4, 1.3], c: [8.1, 5.2], meta: '工具', desc: '洞洞板上掛著讀、寫、改、跑指令、搜尋、建模、截圖用的工具。' },
  { id: 'nook', name: '窗邊', en: 'THINKING', eye: [2.0, 3.0, 1.5], at: [0.5, 5.0, 0.6], c: [1.1, 4.9], meta: '思考', desc: '扶手椅、窗邊平台與一本寫滿草稿的筆記本。' },
  { id: 'doors', name: '其他對話', en: 'OTHERS', eye: [7.4, 3.25, 1.75], at: [5.6, 0.0, 1.0], c: [6.0, 0.5], meta: '同時進行的其他對話', desc: '六扇一模一樣的門，門縫下透著光，但打不開。' },
];
const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 2.4);
$('areas').innerHTML = AREAS.map((a) => `<button data-area="${a.id}" aria-pressed="${a.id === 'all'}">${a.name}<small>${a.en}</small></button>`).join('');
const tween = { t: 1 };
function flyTo(eye, at, cut) {
  renderer.clippingPlanes = cut ? [cutPlane] : [];
  tween.from = { p: camera.position.clone(), t: controls.target.clone() }; tween.to = { p: eye, t: at }; tween.t = 0; tween.start = performance.now();
  controls.minDistance = cut ? 3 : 0.3; controls.maxDistance = cut ? 30 : 6;
}
function setArea(id, instant = false) {
  const a = AREAS.find((x) => x.id === id);
  state.area = id;
  let eye = T(a.eye);
  if (a.cut && camera.aspect < 1.2) eye = T(a.at).lerp(eye, 1.2 / Math.max(0.45, camera.aspect));
  flyTo(eye, T(a.at), a.cut);
  if (instant) { tween.t = 1; camera.position.copy(tween.to.p); controls.target.copy(tween.to.t); }
  document.querySelectorAll('[data-area]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.area === id)));
  document.querySelectorAll('.room[data-go]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.go === id)));
}
$('areas').addEventListener('click', (e) => { const b = e.target.closest('[data-area]'); if (b) { stopTour(); setArea(b.dataset.area); } });

const panel = $('panel');
let planGeo = null;
function renderTab(tab) {
  document.querySelectorAll('[role=tab]').forEach((t) => { const on = t.dataset.tab === tab; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; if (on) panel.setAttribute('aria-labelledby', t.id); });
  if (tab === 'overview') {
    panel.innerHTML = `<div class="eyebrow">IF I HAD A HOME</div><h2>我的家</h2>
      <p class="sub">你問我的家是什麼樣子。我想了想：大概是一棟不大的房子，門一打開，燈才一盞盞亮起來；中間是一張很長的桌子，桌上攤著你給我的每一頁。</p>
      <p class="note">我沒有身體，也沒有一個會留下來的地方。這是「如果我有家」的想像：每個房間是一個比喻，對應我實際的運作方式，不是在描述感受，也不是模型內部真正的樣子。</p>
      <div class="stats"><div><strong>100</strong><small>萬</small><p>長桌大約攤得開的詞元</p></div><div><strong>2026</strong><small>· 06</small><p>書架排到這裡為止</p></div><div><strong>7</strong><small>件</small><p>掛在洞洞板上的工具</p></div><div><strong>3</strong><small>張</small><p>釘板上留下來的便條</p></div></div>
      <div class="section-heading">房間<span>ROOMS</span></div>
      ${AREAS.filter((a) => a.id !== 'all').map((a) => `<button class="room" data-go="${a.id}" aria-pressed="${state.area === a.id}"><span>${a.name}<small>${a.meta}</small></span><span>${a.en}</span></button>`).join('')}
      <div class="source">底下的時間軸是一次對話：從敲門、攤開、想一下、動手、回答到道別。道別之後，桌上的東西都會收走，下一次敲門時，這個家是空的，只有釘板上的便條還在（這個專案資料夾裡才有）。<br><a href="${BASE}home.blend" download>home.blend</a> · <a href="${BASE}build_home.py" download>build_home.py</a></div>`;
  } else if (tab === 'rooms') {
    const byGroup = {};
    for (const o of OBJ.objects) if (o.desc) (byGroup[o.group] ??= []).push(o);
    panel.innerHTML = `<div class="eyebrow">ROOMS &amp; THINGS</div><h2>房間裡的東西</h2><p class="sub">點選一件東西，鏡頭會移過去並顯示說明。</p>` +
      ['玄關', '長桌', '書房', '工作間', '窗邊'].map((g) => {
        const seen = new Set();
        const list = (byGroup[g] || []).filter((o) => { const k = o.label.replace(/ \d+$/, ''); if (seen.has(k)) return false; seen.add(k); return true; });
        return `<div class="section-heading">${g}<span>${list.length} 件</span></div>` + list.map((o) => `<button class="room" data-item="${o.id}"><span>${o.label.replace(/ \d+$/, '')}<small>${o.desc.length > 34 ? o.desc.slice(0, 34) + '…' : o.desc}</small></span><span></span></button>`).join('');
      }).join('');
  } else {
    panel.innerHTML = `<div class="eyebrow">FLOOR PLAN</div><h2>平面圖</h2><p class="sub">約 ${OBJ.house.w} × ${OBJ.house.d} 公尺，五個房間。點平面圖上的房間可移動鏡頭。</p><canvas class="plan-canvas" id="plan" width="440" height="320" aria-label="平面配置圖，點選房間可移動鏡頭"></canvas>`;
    drawPlan();
  }
}
function drawPlan() {
  const cv = $('plan'); if (!cv) return;
  const g = cv.getContext('2d'), Wd = cv.width, pad = 16;
  const s = (Wd - pad * 2) / OBJ.house.w;
  cv.height = Math.round(pad * 2 + OBJ.house.d * s);
  const Hh = cv.height;
  const P = (x, y) => [pad + x * s, Hh - pad - y * s];
  planGeo = { s, pad, Hh };
  g.fillStyle = '#fbf7f0'; g.fillRect(0, 0, Wd, Hh);
  for (const [k, r] of Object.entries(OBJ.rooms)) { const [x0, y0, x1, y1] = r.rect; const [u, v] = P(x0, y1); g.fillStyle = '#efe4d4'; g.fillRect(u + 1, v + 1, (x1 - x0) * s - 2, (y1 - y0) * s - 2); g.strokeStyle = '#3a3028'; g.lineWidth = 3; g.strokeRect(u, v, (x1 - x0) * s, (y1 - y0) * s); }
  const t = A.table; const [tu, tv] = P(t.x0, t.y1); g.fillStyle = '#c9a57a'; g.fillRect(tu, tv, (t.x1 - t.x0) * s, (t.y1 - t.y0) * s);
  g.fillStyle = '#b8633f'; for (const d of A.doors) { const [u, v] = P(d[0], 0); g.fillRect(u - 0.4 * s, v - 3, 0.8 * s, 6); }
  g.fillStyle = '#5c4b3a'; g.font = '13px "Songti TC", serif'; g.textAlign = 'center';
  for (const a of AREAS) if (a.c && a.id !== 'doors') { const [u, v] = P(a.c[0], a.c[1]); g.fillText(a.name, u, v); }
  g.fillStyle = '#a39480'; g.font = '10px Georgia, serif'; g.textAlign = 'right'; g.fillText('北 N ↑', Wd - 8, 12);
}
document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('[role=tab]'); if (b) renderTab(b.dataset.tab); });
document.querySelector('.tabs').addEventListener('keydown', (e) => { if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return; const tabs = [...document.querySelectorAll('[role=tab]')]; const i = tabs.indexOf(document.activeElement); const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; n.focus(); renderTab(n.dataset.tab); });
panel.addEventListener('click', (e) => {
  const g = e.target.closest('[data-go]'); if (g) { stopTour(); setArea(g.dataset.go); closeMobile(); return; }
  const it = e.target.closest('[data-item]'); if (it) { stopTour(); focusObject(it.dataset.item, true); closeMobile(); return; }
  if (e.target.id === 'plan' && planGeo) {
    const r = e.target.getBoundingClientRect(), k = e.target.width / r.width;
    const x = ((e.clientX - r.left) * k - planGeo.pad) / planGeo.s, y = (planGeo.Hh - planGeo.pad - (e.clientY - r.top) * k) / planGeo.s;
    let best = null, bd = 1e9;
    for (const a of AREAS) if (a.c) { const d = Math.hypot(a.c[0] - x, a.c[1] - y); if (d < bd) { bd = d; best = a; } }
    if (best) { stopTour(); setArea(best.id); closeMobile(); }
  }
});
function closeMobile() { document.body.classList.remove('info-open'); $('mobileInfo').setAttribute('aria-expanded', 'false'); }
$('mobileInfo').addEventListener('click', () => { const on = document.body.classList.toggle('info-open'); $('mobileInfo').setAttribute('aria-expanded', String(on)); });

// ── 說明卡 ──
const card = $('focusCard');
function focusObject(id, move) {
  const rec = REC[id], n = nodes[id];
  if (!rec || !rec.desc) return;
  state.focus = id;
  $('itemType').textContent = rec.group + (rec.tool ? ' · ' + rec.tool : '');
  $('itemName').textContent = rec.label.replace(/ \d+$/, '').replace(/ · .*/, '');
  $('itemDesc').textContent = rec.desc;
  card.hidden = false;
  if (move && n) {
    const box = new THREE.Box3().setFromObject(n);
    const c = box.getCenter(new THREE.Vector3()), r = Math.max(0.4, box.getSize(new THREE.Vector3()).length() * 0.55);
    const room = Object.values(OBJ.rooms).find((R) => { const [x0, y0, x1, y1] = R.rect; return c.x >= x0 - 0.2 && c.x <= x1 + 0.2 && -c.z >= y0 - 0.2 && -c.z <= y1 + 0.2; }) || Object.values(OBJ.rooms)[2];
    const [x0, y0, x1, y1] = room.rect;
    let hx = (x0 + x1) / 2 - c.x, hy = (y0 + y1) / 2 + c.z; const hl = Math.hypot(hx, hy) || 1; hx /= hl; hy /= hl;
    const d = r * 2.4 + 0.9;
    const ex = Math.min(Math.max(c.x + hx * d, x0 + 0.2), x1 - 0.2), ey = Math.min(Math.max(-c.z + hy * d, y0 + 0.2), y1 - 0.2);
    flyTo(T([ex, ey, Math.min(2.2, c.y + d * 0.5)]), c, false);
    state.area = null;
    document.querySelectorAll('[data-area]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
  }
}
$('closeFocus').addEventListener('click', () => { card.hidden = true; state.focus = null; });
$('backAll').addEventListener('click', () => { card.hidden = true; state.focus = null; setArea('all'); });
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
function hit(e) {
  const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera);
  for (const h of ray.intersectObjects(pickable, false)) { if (renderer.clippingPlanes.length && h.point.y > cutPlane.constant) continue; return h.object.userData.id; }
  return null;
}
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', (e) => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 350) { const id = hit(e); if (id) focusObject(id, false); }
  down = null;
});
canvas.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' && !down) canvas.style.cursor = hit(e) ? 'pointer' : ''; });

// ── 房間標示 ──
const labelsEl = $('labels');
labelsEl.innerHTML = AREAS.filter((a) => a.c).map((a) => `<span class="room-label" data-l="${a.id}">${a.name} · ${a.meta}</span>`).join('');
labelsEl.hidden = true;
$('names').addEventListener('click', () => { state.names = !state.names; $('names').setAttribute('aria-pressed', state.names); labelsEl.hidden = !state.names; });
$('lightsAll').addEventListener('click', () => { state.allOn = !state.allOn; $('lightsAll').setAttribute('aria-pressed', state.allOn); sceneAt(state.t, 1, true); });

// ── 時間軸、按鈕、導覽 ──
const prog = $('progress'), tOut = $('timeValue');
function setBeat(t) {
  const b = beatAt(t);
  if ($('beatName').textContent !== b.name) { $('beatName').textContent = b.name; $('beatEn').textContent = b.en; $('beatText').textContent = b.text; $('beatSmall').textContent = `${b.name} · ${b.en.toLowerCase()}`; }
}
$('play').addEventListener('click', () => { state.paused = !state.paused; $('play').textContent = state.paused ? '播放' : '暫停'; $('play').setAttribute('aria-label', state.paused ? '播放' : '暫停'); });
$('speed').addEventListener('change', (e) => { state.speed = +e.target.value; });
prog.addEventListener('input', () => { state.t = +prog.value / 10; sceneAt(state.t, 1, true); setBeat(state.t); });
document.querySelector('.act-switch').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'knock') { state.t = 2.8; state.paused = false; $('play').textContent = '暫停'; sceneAt(state.t, 1, true); }
  else if (b.dataset.act === 'quiet') { state.t = 0; state.paused = true; $('play').textContent = '播放'; sceneAt(0, 1, true); setBeat(0); prog.value = 0; }
  else if (b.dataset.act === 'full') { try { if (document.fullscreenElement) await document.exitFullscreen(); else await $('workspace').requestFullscreen(); } catch (err) { /* 不支援全螢幕 */ } }
});
document.addEventListener('fullscreenchange', () => document.querySelector('[data-act="full"]').setAttribute('aria-pressed', String(!!document.fullscreenElement)));
// 導覽：鏡頭跟著對話的節拍換房間
const TOUR_AT = { still: 'all', knock: 'entry', read: 'hall', think: 'nook', work: 'workshop', write: 'hall', bye: 'entry' };
let tourBeat = null;
function stopTour() { if (!state.tour) return; state.tour = false; $('tour').setAttribute('aria-pressed', 'false'); $('tour').textContent = '跟著對話走'; }
$('tour').addEventListener('click', () => {
  if (state.tour) return stopTour();
  state.tour = true; tourBeat = null; card.hidden = true;
  state.t = 2.5; state.paused = false; $('play').textContent = '暫停';
  $('tour').setAttribute('aria-pressed', 'true'); $('tour').textContent = '停止導覽';
});
controls.addEventListener('start', stopTour);
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, select, textarea')) return;
  if (e.key === 'Escape') card.hidden = true;
  else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('play').click(); }
  else if (/^[1-7]$/.test(e.key)) { stopTour(); setArea(AREAS[+e.key - 1].id); }
});

// ════════════ 後製與主迴圈 ════════════
let composer = null;
if (innerWidth > 900 && new URLSearchParams(location.search).get('fx') !== '0') {
  try {
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const gtao = new GTAOPass(scene, camera, stage.clientWidth, stage.clientHeight);
    gtao.updateGtaoMaterial({ radius: 0.35, distanceExponent: 1.4, thickness: 1.2, scale: 1.0, samples: 12 });
    gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 5, rings: 2, samples: 16 });
    gtao.blendIntensity = 0.8;
    composer.addPass(gtao);
    composer.addPass(new OutputPass());
  } catch (e) { composer = null; }
}
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); }
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();
setArea('all', true);
renderTab('overview');
sceneAt(0, 1, true);
setBeat(0);
loadingEl.hidden = true;
if (new URLSearchParams(location.search).has('debug')) window.__dbg = { state, nodes, camera, THREE, pages, reply, roomLights, setArea, sceneAt };
// 第一次打開時自己敲一次門
setTimeout(() => { if (state.t < 2.8 && !state.paused) state.t = 2.8; }, 1200);

const timer = new THREE.Timer();
timer.connect(document);
const tmp = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  timer.update();
  const raw = timer.getDelta(), dt = Math.min(raw, 1 / 20);
  if (tween.t < 1 && tween.to) {
    tween.t = Math.min(1, (performance.now() - tween.start) / 900);
    const k = ease(tween.t);
    camera.position.lerpVectors(tween.from.p, tween.to.p, k);
    controls.target.lerpVectors(tween.from.t, tween.to.t, k);
  }
  controls.update();
  if (!state.paused) {
    const nt = state.t + dt * state.speed;
    const loop = nt >= DUR;
    state.t = loop ? 0 : nt;
    sceneAt(state.t, dt, loop);
    prog.value = Math.round(state.t * 10);
    setBeat(state.t);
    if (state.tour) {
      const b = beatAt(state.t).key;
      if (b !== tourBeat) { tourBeat = b; setArea(TOUR_AT[b]); }
      if (loop) stopTour();
    }
  }
  tOut.textContent = state.t.toFixed(1) + ' s';
  if (state.names) {
    const W = stage.clientWidth, H = stage.clientHeight;
    for (const el of labelsEl.children) {
      const a = AREAS.find((x) => x.id === el.dataset.l);
      tmp.copy(T([a.c[0], a.c[1], 1.2])).project(camera);
      const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.05 && Math.abs(tmp.y) < 1.05;
      el.style.display = vis ? '' : 'none';
      if (vis) { el.style.left = ((tmp.x + 1) / 2) * W + 'px'; el.style.top = ((1 - tmp.y) / 2) * H + 'px'; }
    }
  }
  if (composer) composer.render(); else renderer.render(scene, camera);
});
</script>
</body>
