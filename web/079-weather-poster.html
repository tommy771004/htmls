<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高嶺市 一週天氣海報 · 第 39 週</title>
<meta name="description" content="一週經歷四季：巨大溫度滾動、雷雨閃電、霧中數字變模糊。收錄於 100 Creative HTML Works（079・天氣海報）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/web/079-weather-poster.html">
<style>
  @property --bg1{syntax:'<color>';inherits:true;initial-value:#ffb23f}
  @property --bg2{syntax:'<color>';inherits:true;initial-value:#ff6a2b}
  @property --fg{syntax:'<color>';inherits:true;initial-value:#2b1200}
  @property --ac{syntax:'<color>';inherits:true;initial-value:#fff3c4}
  :root{
    --bg1:#ffb23f;--bg2:#ff6a2b;--fg:#2b1200;--ac:#fff3c4;
    --black:"Segoe UI Black","Segoe UI","Arial Black","Helvetica Neue",Arial,sans-serif;
    --light:"Segoe UI Light","Segoe UI","Helvetica Neue",Arial,sans-serif;
    --zh:"Microsoft JhengHei Light","Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
    --zhb:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;color:var(--fg);font-family:var(--light),var(--zh);
    background:linear-gradient(170deg,var(--bg1),var(--bg2));
    transition:--bg1 1.1s ease,--bg2 1.1s ease,--fg 1.1s ease,--ac 1.1s ease;
    overflow-x:hidden;
  }
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0}
  .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
  .poster{position:relative;z-index:1;min-height:100vh;display:grid;grid-template-rows:auto 1fr auto;
    padding:clamp(16px,3vw,44px) clamp(16px,3.4vw,52px) clamp(14px,2.4vw,30px);gap:clamp(8px,1.6vw,20px)}

  header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-top:3px solid var(--fg);padding-top:10px}
  .city{font-family:var(--zhb);font-weight:700;font-size:clamp(22px,2.4vw,34px);letter-spacing:.2em;line-height:1.1}
  .city small{display:block;font-family:var(--light);font-weight:300;font-size:.42em;letter-spacing:.42em;margin-top:.5em}
  .meta{text-align:right;font-size:clamp(12px,1vw,14px);letter-spacing:.14em;line-height:1.7;font-family:var(--light),var(--zh)}
  .meta b{font-family:var(--black);font-weight:900;letter-spacing:.04em}

  main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(12px,3vw,48px);align-items:end}
  .hero{min-width:0}
  .temp{font-family:var(--black);font-weight:900;font-size:clamp(150px,min(36vw,62vh),600px);line-height:.78;letter-spacing:-.07em;margin:0 0 0 -.05em;
    display:flex;align-items:flex-start;white-space:nowrap;transition:filter 1s ease}
  .temp .deg{font-size:.42em;letter-spacing:0;margin-left:.04em;line-height:1}
  .temp .neg{font-size:.7em;margin-right:.02em;align-self:center}
  body.fog .temp{filter:blur(2.5px)}
  .cond{display:flex;align-items:baseline;gap:.5em;flex-wrap:wrap;margin-top:clamp(8px,1.4vw,18px)}
  .cond h1{margin:0;font-family:var(--zh);font-weight:300;font-size:clamp(40px,5.4vw,84px);letter-spacing:.12em;line-height:1}
  .cond .en{font-family:var(--light);font-size:clamp(14px,1.3vw,18px);letter-spacing:.34em;text-transform:uppercase}
  .quip{font-family:var(--zh);font-size:clamp(16px,1.5vw,21px);margin:.6em 0 0;max-width:30em;line-height:1.6}
  .quip::before{content:"";display:inline-block;width:2.2em;height:2px;background:currentColor;vertical-align:.35em;margin-right:.6em}

  .facts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid color-mix(in srgb,var(--fg) 40%,transparent)}
  .facts li{padding:12px 0 10px;border-bottom:1px solid color-mix(in srgb,var(--fg) 40%,transparent);display:flex;flex-direction:column;gap:2px}
  .facts li:nth-child(odd){padding-right:14px;border-right:1px solid color-mix(in srgb,var(--fg) 25%,transparent)}
  .facts li:nth-child(even){padding-left:14px}
  .facts span{font-size:12px;letter-spacing:.24em;font-family:var(--zh);opacity:.8}
  .facts b{font-family:var(--black);font-weight:900;font-size:clamp(22px,2.2vw,32px);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .facts b small{font-family:var(--light);font-weight:300;font-size:.5em;letter-spacing:.05em}
  .facts svg{width:22px;height:22px;transition:transform 1s cubic-bezier(.4,1.6,.5,1)}

  /* week strip */
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;border-top:3px solid var(--fg)}
  .day{background:transparent;border:0;border-right:1px solid color-mix(in srgb,var(--fg) 30%,transparent);color:inherit;cursor:pointer;
    padding:10px 10px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px;font-family:var(--zh);position:relative;transition:background .4s}
  .day:last-child{border-right:0}
  .day:hover{background:color-mix(in srgb,var(--fg) 7%,transparent)}
  .day[aria-pressed="true"]{background:var(--fg);color:var(--bg1)}
  .day:focus-visible{outline:3px solid var(--fg);outline-offset:-3px}
  .day .d{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;letter-spacing:.1em}
  .day .d b{font-family:var(--black);font-weight:900;font-size:20px;letter-spacing:-.02em}
  .day svg{width:32px;height:32px}
  .day .hl{font-family:var(--black);font-weight:900;font-size:17px;letter-spacing:-.02em}
  .day .hl small{font-family:var(--light);font-weight:300;opacity:.75;margin-left:4px}
  .range{position:relative;height:4px;border-radius:2px;background:color-mix(in srgb,currentColor 20%,transparent)}
  .range i{position:absolute;top:0;bottom:0;border-radius:2px;background:currentColor}
  .hint{font-size:12px;letter-spacing:.2em;text-align:right;margin:0;opacity:.75;font-family:var(--zh)}

  @media (max-width:860px){
    main{grid-template-columns:minmax(0,1fr)}
    .week{grid-template-columns:repeat(7,minmax(0,1fr))}
    .day{padding:8px 4px 10px;min-height:104px;gap:4px}
    .day .d{flex-direction:column;font-size:11px;letter-spacing:0}
    .day .d b{font-size:15px}
    .day svg{width:24px;height:24px}
    .day .hl{font-size:13px}
    .day .hl small{display:block;margin:0}
    .meta{letter-spacing:.06em}
  }
  @media (prefers-reduced-motion:reduce){ body{transition:none} }
</style>
</head>
<body class="sun">
<canvas id="fx" aria-hidden="true"></canvas>
<div class="flash" id="flash" aria-hidden="true"></div>
<div class="poster">
  <header>
    <div class="city">高嶺市<small>GAOLING · ALT. 1,840 M</small></div>
    <div class="meta">第 <b>39</b> 週天氣海報<br><b>2026.09.23 — 09.29</b><br>本週將體驗四季</div>
  </header>

  <main>
    <section class="hero" aria-live="polite">
      <div class="temp" id="temp" aria-label="現在溫度"><span id="tnum">28</span><span class="deg">°</span></div>
      <div class="cond"><h1 id="cname">晴</h1><span class="en" id="cen">Clear skies</span></div>
      <p class="quip" id="quip">今天適合把棉被拿出去曬，順便曬一下自己。</p>
    </section>
    <ul class="facts" id="facts"></ul>
  </main>

  <div>
    <nav class="week" id="week" aria-label="一週預報"></nav>
    <p class="hint">點選任一天 · 鍵盤 ← → 切換</p>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const root = document.documentElement;

  const ICON = {
    sun: '<circle cx="16" cy="16" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 2v4M16 26v4M2 16h4M26 16h4M6 6l3 3M23 23l3 3M26 6l-3 3M9 23l-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    cloud: '<path d="M9 24h15a6 6 0 0 0 0-12 8 8 0 0 0-15 2 5 5 0 0 0 0 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
    storm: '<path d="M9 20h15a6 6 0 0 0 0-12 8 8 0 0 0-15 2 5 5 0 0 0 0 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M17 20l-4 6h5l-3 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>',
    rain: '<path d="M9 18h15a6 6 0 0 0 0-12 8 8 0 0 0-15 2 5 5 0 0 0 0 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M11 22l-2 5M17 22l-2 5M23 22l-2 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    fog: '<path d="M4 11h20M8 16h20M4 21h18M10 26h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    snow: '<path d="M16 3v26M4.7 9.5l22.6 13M4.7 22.5l22.6-13M13 5l3 3 3-3M13 27l3-3 3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
    partly: '<circle cx="11" cy="11" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 2v2M2 11h2M4.5 4.5l1.4 1.4M17.5 4.5l-1.4 1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 27h13a5 5 0 0 0 0-10 7 7 0 0 0-13 2 4 4 0 0 0 0 8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'
  };
  const DAYS = [
    { w: '三', d: '9/23', k: 'sun', name: '晴', en: 'Clear skies', hi: 28, lo: 19, now: 28, feel: 31, hum: 48, wind: 6, dir: 120, pop: 0, uv: '9 過量', rise: '05:48', set: '17:56',
      c: ['#ffb23f', '#ff6a2b', '#2b1200', '#fff3c4'], quip: '今天適合把棉被拿出去曬，順便曬一下自己。' },
    { w: '四', d: '9/24', k: 'cloud', name: '多雲', en: 'Overcast', hi: 24, lo: 18, now: 22, feel: 22, hum: 71, wind: 14, dir: 200, pop: 20, uv: '4 中量', rise: '05:48', set: '17:55',
      c: ['#b5c1cc', '#7c8a99', '#121c27', '#eef2f6'], quip: '天空今天沒有意見，你也可以沒有。' },
    { w: '五', d: '9/25', k: 'storm', name: '雷陣雨', en: 'Thunderstorms', hi: 21, lo: 17, now: 19, feel: 18, hum: 92, wind: 32, dir: 250, pop: 90, uv: '1 低量', rise: '05:49', set: '17:54',
      c: ['#3a2d5c', '#140f24', '#f3eaff', '#ffe14d'], quip: '午後雷聲大、雨點也大。請把插頭拔掉，把情緒收好。' },
    { w: '六', d: '9/26', k: 'rain', name: '大雨', en: 'Heavy rain', hi: 18, lo: 14, now: 16, feel: 14, hum: 97, wind: 22, dir: 280, pop: 100, uv: '0 無', rise: '05:49', set: '17:53',
      c: ['#2a6293', '#0d2944', '#e6f3ff', '#9fd6ff'], quip: '樂觀的人看到彩虹，悲觀的人看到濕襪子。今天兩者都帶。' },
    { w: '日', d: '9/27', k: 'fog', name: '霧', en: 'Dense fog', hi: 15, lo: 11, now: 12, feel: 11, hum: 99, wind: 3, dir: 90, pop: 30, uv: '1 低量', rise: '05:50', set: '17:52',
      c: ['#e2e4e0', '#b5bab4', '#353b37', '#ffffff'], quip: '能見度五十公尺。適合慢慢走，也適合不回訊息。' },
    { w: '一', d: '9/28', k: 'snow', name: '初雪', en: 'First snow', hi: 3, lo: -2, now: -1, feel: -6, hum: 84, wind: 18, dir: 350, pop: 70, uv: '2 低量', rise: '05:50', set: '17:51',
      c: ['#f1f6fc', '#bcd2ea', '#12304f', '#5b8fc9'], quip: '九月的雪。氣象局表示：「我們也很驚訝。」' },
    { w: '二', d: '9/29', k: 'partly', name: '晴時多雲', en: 'Sun & clouds', hi: 22, lo: 12, now: 20, feel: 20, hum: 55, wind: 9, dir: 160, pop: 10, uv: '6 高量', rise: '05:51', set: '17:50',
      c: ['#9ad6f7', '#3f97d6', '#05243a', '#fff9d6'], quip: '一切回到正常。高嶺市民表示：「正常是什麼？」' }
  ];
  const MIN = Math.min(...DAYS.map(d => d.lo)), MAX = Math.max(...DAYS.map(d => d.hi));
  let cur = 0, shownT = DAYS[0].now;

  /* ---------------- week strip ---------------- */
  const week = $('week');
  const btns = DAYS.map((d, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'day'; b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    b.setAttribute('aria-label', `週${d.w} ${d.d} ${d.name} 高溫 ${d.hi} 度 低溫 ${d.lo} 度`);
    const l = (d.lo - MIN) / (MAX - MIN) * 100, r = (d.hi - MIN) / (MAX - MIN) * 100;
    b.innerHTML = `<span class="d">週${d.w}<b>${d.d}</b></span><svg viewBox="0 0 32 32" aria-hidden="true">${ICON[d.k]}</svg>` +
      `<span class="hl">${d.hi}°<small>${d.lo}°</small></span><span class="range"><i style="left:${l}%;width:${Math.max(4, r - l)}%"></i></span>`;
    b.addEventListener('click', () => show(i));
    if (week) week.appendChild(b);
    return b;
  });

  /* ---------------- facts ---------------- */
  function facts(d) {
    const f = $('facts'); if (!f) return;
    const dirs = ['北', '東北', '東', '東南', '南', '西南', '西', '西北'];
    const dn = dirs[Math.round(d.dir / 45) % 8];
    f.innerHTML = `
      <li><span>體感溫度</span><b>${d.feel}°</b></li>
      <li><span>濕度</span><b>${d.hum}<small>%</small></b></li>
      <li><span>風 · ${dn}風</span><b><svg viewBox="0 0 22 22" style="transform:rotate(${d.dir}deg)" aria-hidden="true"><path d="M11 2 17 18 11 14 5 18Z" fill="currentColor"/></svg>${d.wind}<small>km/h</small></b></li>
      <li><span>降雨機率</span><b>${d.pop}<small>%</small></b></li>
      <li><span>紫外線</span><b>${d.uv.split(' ')[0]}<small>${d.uv.split(' ')[1]}</small></b></li>
      <li><span>日出 / 日落</span><b style="font-size:clamp(18px,1.7vw,24px)">${d.rise}<small>/ ${d.set}</small></b></li>`;
  }

  /* ---------------- show a day ---------------- */
  let tAnim = 0;
  function show(i) {
    cur = (i + DAYS.length) % DAYS.length;
    const d = DAYS[cur];
    btns.forEach((b, k) => b.setAttribute('aria-pressed', k === cur ? 'true' : 'false'));
    root.style.setProperty('--bg1', d.c[0]); root.style.setProperty('--bg2', d.c[1]);
    root.style.setProperty('--fg', d.c[2]); root.style.setProperty('--ac', d.c[3]);
    document.body.className = d.k;
    const set = (id, v) => { const e = $(id); if (e) e.textContent = v; };
    set('cname', d.name); set('cen', d.en); set('quip', d.quip);
    facts(d);
    // count the giant number
    const from = shownT, to = d.now, t0 = performance.now();
    cancelAnimationFrame(tAnim);
    const step = now => {
      const k = reduce ? 1 : Math.min(1, (now - t0) / 800), e = 1 - Math.pow(1 - k, 3);
      shownT = Math.round(from + (to - from) * e);
      const tn = $('tnum'); if (tn) tn.innerHTML = shownT < 0 ? `<span class="neg">−</span>${Math.abs(shownT)}` : String(shownT);
      if (k < 1) tAnim = requestAnimationFrame(step);
    };
    tAnim = requestAnimationFrame(step);
    setFx(d.k);
  }

  /* ---------------- weather canvas ---------------- */
  const cv = $('fx'), ctx = cv ? cv.getContext('2d') : null;
  const flash = $('flash');
  let W = 0, H = 0, dpr = 1, kind = 'sun', fade = 1, parts = [], clouds = [], bolt = null, nextBolt = 0;
  function resize() {
    if (!cv) return;
    dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const R = (a, b) => a + Math.random() * (b - a);
  function setFx(k) {
    kind = k; fade = 0;
    const area = W * H / (1440 * 900);
    parts = [];
    if (k === 'rain' || k === 'storm') for (let i = 0; i < (k === 'rain' ? 420 : 300) * area; i++) parts.push({ x: R(-200, W), y: R(-H, H), l: R(14, 34), v: R(900, 1500), z: R(.4, 1) });
    if (k === 'snow') for (let i = 0; i < 260 * area; i++) parts.push({ x: R(0, W), y: R(-H, H), r: R(1, 4.2), v: R(30, 90), ph: R(0, 6.28), z: R(.4, 1) });
    if (k === 'sun' || k === 'partly') for (let i = 0; i < 40 * area; i++) parts.push({ x: R(0, W), y: R(0, H), r: R(1, 2.6), v: R(6, 18), ph: R(0, 6.28) });
    clouds = [];
    const nC = { cloud: 7, storm: 6, rain: 5, partly: 3, fog: 0, sun: 0, snow: 3 }[k] || 0;
    for (let i = 0; i < nC; i++) clouds.push({ x: R(-.2, 1.1) * W, y: R(-.05, k === 'partly' ? .35 : .45) * H, s: R(.7, 1.5) * Math.min(W, 900) / 900, v: R(6, 20) });
    nextBolt = performance.now() + 900;
  }
  const spriteCache = new Map();
  function cloudSprite(s, col) {
    const key = s.toFixed(2) + col;
    if (spriteCache.has(key)) return spriteCache.get(key);
    const c = document.createElement('canvas'), pad = 60;
    c.width = Math.ceil(520 * s + pad * 2); c.height = Math.ceil(300 * s + pad * 2);
    const x = c.getContext('2d');
    try { x.filter = `blur(${Math.round(10 * s + 6)}px)`; } catch (_) {}
    x.fillStyle = col;
    [[0, 0, 90], [80, -30, 110], [180, -5, 95], [260, 20, 70], [120, 35, 90], [-60, 30, 65]].forEach(([dx, dy, r]) => {
      x.beginPath(); x.arc(pad + (dx + 150) * s, pad + (dy + 140) * s, r * s, 0, Math.PI * 2); x.fill();
    });
    const o = { c, ox: pad + 150 * s, oy: pad + 140 * s };
    if (spriteCache.size > 40) spriteCache.clear();
    spriteCache.set(key, o); return o;
  }
  function cloudShape(x, y, s, col) {
    const sp = cloudSprite(Math.round(s * 20) / 20, col);
    ctx.drawImage(sp.c, x - sp.ox, y - sp.oy);
  }
  function mkBolt() {
    const pts = []; let x = R(W * .15, W * .85), y = 0;
    while (y < H * R(.5, .8)) { pts.push([x, y]); x += R(-40, 40); y += R(20, 60); }
    pts.push([x, y]); return { pts, t: performance.now() };
  }
  let last = performance.now(), running = true, raf = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    fade = Math.min(1, fade + dt * 1.4);
    ctx.clearRect(0, 0, W, H);
    ctx.globalAlpha = fade;
    const t = now / 1000;
    if (kind === 'sun' || kind === 'partly') {
      const cx = W * .82, cy = H * .16;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * .55);
      g.addColorStop(0, 'rgba(255,250,220,.75)'); g.addColorStop(.18, 'rgba(255,240,190,.25)'); g.addColorStop(1, 'rgba(255,240,190,0)');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * .03);
      for (let i = 0; i < 14; i++) {
        ctx.rotate(Math.PI * 2 / 14);
        ctx.fillStyle = 'rgba(255,248,215,.07)';
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.max(W, H), -40); ctx.lineTo(Math.max(W, H), 40); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,240,.6)';
      parts.forEach(p => { p.y -= p.v * dt; p.x += Math.sin(t + p.ph) * .2; if (p.y < -5) { p.y = H + 5; p.x = R(0, W); } ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); });
    }
    if (clouds.length) {
      const col = kind === 'storm' ? 'rgba(20,14,36,.55)' : kind === 'rain' ? 'rgba(10,30,52,.45)' : kind === 'snow' ? 'rgba(255,255,255,.55)' : kind === 'partly' ? 'rgba(255,255,255,.75)' : 'rgba(235,240,245,.45)';
      clouds.forEach(c => { c.x += c.v * dt; if (c.x > W + 300 * c.s) c.x = -400 * c.s; cloudShape(c.x, c.y, c.s, col); });
    }
    if (kind === 'fog') {
      for (let k = 0; k < 5; k++) {
        const y = H * (.15 + k * .19) + Math.sin(t * .2 + k) * 20, off = ((t * (8 + k * 4)) % (W * 2)) - W;
        const g = ctx.createLinearGradient(0, y - 120, 0, y + 120);
        g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.42)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.save(); ctx.translate(off, 0); ctx.fillRect(-W, y - 120, W * 3, 240); ctx.restore();
      }
    }
    if (kind === 'rain' || kind === 'storm') {
      ctx.strokeStyle = kind === 'storm' ? 'rgba(230,220,255,.45)' : 'rgba(210,235,255,.5)'; ctx.lineCap = 'round';
      const slant = kind === 'storm' ? .32 : .18;
      ctx.beginPath();
      parts.forEach(p => {
        p.y += p.v * dt * p.z; p.x += p.v * dt * slant * p.z;
        if (p.y > H) { if (Math.random() < .5) splash(p.x); p.y = R(-80, -10); p.x = R(-200, W); }
        ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.l * slant * p.z, p.y - p.l * p.z);
      });
      ctx.lineWidth = 1.3; ctx.stroke();
      drawSplashes(dt);
    }
    if (kind === 'storm' && !reduce) {
      if (now > nextBolt) { bolt = mkBolt(); nextBolt = now + R(2600, 6000); if (flash) { flash.style.transition = 'none'; flash.style.opacity = '.55'; requestAnimationFrame(() => { flash.style.transition = 'opacity .6s ease-out'; flash.style.opacity = '0'; }); } }
      if (bolt && now - bolt.t < 220) {
        ctx.strokeStyle = `rgba(255,250,210,${1 - (now - bolt.t) / 220})`; ctx.lineWidth = 3; ctx.shadowColor = '#fff6b0'; ctx.shadowBlur = 18;
        ctx.beginPath(); bolt.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.shadowBlur = 0;
      }
    }
    if (kind === 'snow') {
      ctx.fillStyle = 'rgba(255,255,255,.92)';
      parts.forEach(p => {
        p.y += p.v * dt * p.z; p.x += Math.sin(t * 1.2 + p.ph) * 18 * dt;
        if (p.y > H + 5) { p.y = -5; p.x = R(0, W); }
        ctx.globalAlpha = fade * (.45 + .55 * p.z);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.z, 0, 7); ctx.fill();
      });
    }
    ctx.globalAlpha = 1;
    if (running && !reduce) raf = requestAnimationFrame(frame);
  }
  let splashes = [];
  function splash(x) { if (splashes.length < 80) splashes.push({ x, t: 0 }); }
  function drawSplashes(dt) {
    ctx.strokeStyle = 'rgba(220,240,255,.5)'; ctx.lineWidth = 1;
    splashes = splashes.filter(s => (s.t += dt) < .3);
    splashes.forEach(s => { ctx.beginPath(); ctx.ellipse(s.x, H - 3, 3 + s.t * 30, 1 + s.t * 5, 0, Math.PI, 0); ctx.stroke(); });
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); show(cur + 1); btns[cur].focus({ preventScroll: true }); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); show(cur - 1); btns[cur].focus({ preventScroll: true }); }
  });
  document.addEventListener('visibilitychange', () => {
    running = !document.hidden; cancelAnimationFrame(raf);
    if (running && ctx) { last = performance.now(); raf = requestAnimationFrame(frame); }
  });
  window.addEventListener('resize', () => { resize(); setFx(kind); if (reduce && ctx) frame(performance.now()); });

  resize();
  show(0);
  if (ctx) { if (reduce) { fade = 1; frame(performance.now()); } else raf = requestAnimationFrame(frame); }
})();
</script>
