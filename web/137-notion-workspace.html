function subtree(i){let end=i+1,bs=page().blocks;while(end<bs.length&&bs[end].depth>bs[i].depth)end++;return end}
function insertAfter(id){remember();let bs=page().blocks,i=bs.findIndex(b=>b.id===id),b=block('text','',i>=0?bs[i].depth:0);bs.splice(i>=0?subtree(i):bs.length,0,b);save();renderBlocks();focusBlock(b.id);return b}
function openCommands(id,query=''){menuBlock=id;menuQuery=query;menuIndex=0;drawCommands();let r=$(`[data-id="${id}"]`).getBoundingClientRect();$('#commands').style.left=Math.max(8,Math.min(innerWidth-290,r.left))+'px';$('#commands').style.top=Math.max(8,Math.min(innerHeight-340,r.bottom+3))+'px'}
function filteredTypes(){return types.filter(t=>t.join(' ').toLowerCase().includes(menuQuery.toLowerCase()))}
function drawCommands(){const options=filteredTypes();$('#commands').hidden=false;$('#commands').innerHTML='<div class="popup-label">基本區塊 · ↑↓ 選擇，Enter 確認</div>'+options.map((t,i)=>`<button class="command ${i===menuIndex?'current':''}" data-type-pick="${t[0]}"><span class="command-icon">${t[2]}</span><span><strong>${t[1]}</strong><small>${t[3]}</small></span></button>`).join('')+(!options.length?'<p class="muted">沒有符合的區塊</p>':'')+`<div class="popup-actions"><button data-block-action="up">↑ 上移</button><button data-block-action="down">↓ 下移</button><button data-block-action="delete">刪除</button></div>`}
function closeCommands(){$('#commands').hidden=true;menuBlock=null}
function convert(type){const b=page().blocks.find(b=>b.id===menuBlock);if(!b)return;remember();b.type=type;if(b.text.startsWith('/'))b.text='';const id=b.id;closeCommands();save();renderBlocks();if(type==='image')imageDialog(id);else focusBlock(id)}
function indent(id,out=false){const bs=page().blocks,i=bs.findIndex(b=>b.id===id);if(i<0)return;const b=bs[i],end=subtree(i);let delta=out?-1:1;if(out?b.depth===0:i===0||b.depth>bs[i-1].depth||b.depth>=5){toast(out?'已在最外層':'需有前一個區塊才能縮排（最多 5 層）');return}remember();for(let n=i;n<end;n++)bs[n].depth+=delta;save();renderBlocks();focusBlock(id)}
function move(id,down){let bs=page().blocks,i=bs.findIndex(b=>b.id===id),end=subtree(i),target;if(down){if(end>=bs.length||bs[end].depth!==bs[i].depth)return;target=subtree(end)}else{target=i-1;while(target>=0&&bs[target].depth>bs[i].depth)target--;if(target<0||bs[target].depth!==bs[i].depth)return}remember();let part=bs.splice(i,end-i);bs.splice(down?target-part.length:target,0,...part);save();renderBlocks();focusBlock(id)}
function removeBlock(id){const bs=page().blocks,i=bs.findIndex(b=>b.id===id);if(i<0)return;remember();const depth=bs[i].depth,end=subtree(i);bs.splice(i,1);for(let n=i;n<end-1;n++)bs[n].depth=Math.max(depth,bs[n].depth-1);if(!bs.length)bs.push(block('text',''));save();renderBlocks();focusBlock(bs[Math.max(0,i-1)].id)}
function showDialog(html){closeCommands();$('#dialog').innerHTML=html;$('#dialog').showModal()}
function newPage(parent=null){showDialog(`<h2>${parent?'新增子頁面':'新增頁面'}</h2><form id="pageForm"><label>頁面名稱<input name="title" required autofocus placeholder="未命名頁面" maxlength="100"></label><div class="actions"><button type="button" data-close>取消</button><button class="primary">建立頁面</button></div></form>`);$('#pageForm').onsubmit=e=>{e.preventDefault();remember();const p={id:uid(),parent,title:e.target.title.value.trim()||'未命名',icon:'📄',expanded:true,blocks:[block('text','')]};state.pages.push(p);if(parent)state.pages.find(p=>p.id===parent).expanded=true;state.active=p.id;save();$('#dialog').close();render();focusBlock(p.blocks[0].id)}}
function imageDialog(id){const b=page().blocks.find(b=>b.id===id);showDialog(`<h2>新增圖片</h2><form id="imageForm"><label>選擇圖片（最多 2 MB）<input name="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" ${b.src?'':'required'}></label><label>替代文字與圖片說明<input name="caption" value="${esc(b.text)}" placeholder="描述這張圖片"></label><div class="actions"><button type="button" data-close>取消</button><button class="primary">儲存圖片</button></div><p id="imageError" role="alert"></p></form>`);$('#imageForm').onsubmit=async e=>{e.preventDefault();const file=e.target.file.files[0],caption=e.target.caption.value;if(file&&(file.size>2*1024*1024||!/^image\/(png|jpeg|webp|gif)$/.test(file.type))){$('#imageError').textContent='請選擇 2 MB 以下的 PNG、JPEG、WebP 或 GIF。';return}try{const src=file?await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)}):b.src;remember();b.src=src;b.text=caption;save();renderBlocks();$('#dialog').close()}catch{$('#imageError').textContent='無法讀取圖片，請重新選擇。'}}}
function statusTag(s){return `<span class="tag ${s==='進行中'?'progress':s==='已完成'?'done':''}">● ${s}</span>`}
function renderDB(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('selected',b.dataset.view===state.view);b.setAttribute('aria-pressed',b.dataset.view===state.view)});const q=$('#dbSearch').value.toLowerCase(),tasks=state.tasks.filter(t=>t.name.toLowerCase().includes(q));$('#dbCount').textContent=`${tasks.length} 個專案 · 表格與看板共用資料`;if(state.view==='table')$('#databaseView').innerHTML=`<div class="table-wrap"><table><thead><tr><th> Aa　專案名稱</th><th>◉　狀態</th><th>⚑　優先程度</th><th>▦　截止日期</th></tr></thead><tbody>${tasks.map(t=>`<tr><td><button data-task="${t.id}">▧　${esc(t.name)}</button></td><td>${statusTag(t.status)}</td><td><span class="tag priority">${t.priority}</span></td><td class="muted">${t.date||'—'}</td></tr>`).join('')}</tbody></table></div>`;else $('#databaseView').innerHTML=`<div class="board">${statuses.map(s=>`<div class="column" data-status="${s}"><div class="column-head">${statusTag(s)} <span>${tasks.filter(t=>t.status===s).length}</span></div>${tasks.filter(t=>t.status===s).map(t=>`<div class="card" draggable="true" data-task-drag="${t.id}"><button data-task="${t.id}">▧ ${esc(t.name)}</button><span class="tag priority">${t.priority}優先</span><small>▦ ${t.date||'未設定日期'}</small></div>`).join('')}<button class="column-add" data-new-status="${s}">＋ 新增專案</button></div>`).join('')}</div>`}
function taskDialog(id,status='待開始'){const t=state.tasks.find(t=>t.id===id);showDialog(`<h2>${t?'編輯專案':'新增專案'}</h2><form id="taskForm"><label>專案名稱<input name="name" value="${esc(t?.name||'')}" required maxlength="150" autofocus></label><label>狀態<select name="status">${statuses.map(s=>`<option ${s===(t?.status||status)?'selected':''}>${s}</option>`).join('')}</select></label><label>優先程度<select name="priority">${['高','中','低'].map(s=>`<option ${s===(t?.priority||'中')?'selected':''}>${s}</option>`).join('')}</select></label><label>截止日期<input type="date" name="date" value="${t?.date||''}"></label><div class="actions">${t?'<button type="button" id="deleteTask" style="margin-right:auto;color:#b44">刪除</button>':''}<button type="button" data-close>取消</button><button class="primary">儲存</button></div></form>`);$('#taskForm').onsubmit=e=>{e.preventDefault();const data=new FormData(e.target);if(!data.get('name').trim())return;remember();const item={id:t?.id||uid(),...Object.fromEntries(data)};if(t)Object.assign(t,item);else state.tasks.push(item);save();renderDB();$('#dialog').close()};if(t)$('#deleteTask').onclick=()=>{remember();state.tasks=state.tasks.filter(x=>x.id!==id);save();renderDB();$('#dialog').close();toast('已刪除專案，可按 ⌘/Ctrl Z 復原')}}
function searchDialog(){showDialog('<h2>搜尋頁面</h2><input id="pageSearch" aria-label="搜尋頁面名稱" placeholder="輸入頁面名稱…" autofocus style="width:100%"><div class="search-results" id="pageResults"></div><div class="actions"><button data-close>關閉</button></div>');const update=()=>{$('#pageResults').innerHTML=state.pages.filter(p=>p.title.toLowerCase().includes($('#pageSearch').value.toLowerCase())).map(p=>`<button data-page="${p.id}">${p.icon}　${esc(p.title)}</button>`).join('')||'<p class="muted">找不到符合的頁面</p>'};$('#pageSearch').oninput=update;update()}
function help(){showDialog('<h2>讓雙手留在鍵盤上</h2><div class="help-lines"><div><kbd>/</kbd>插入或轉換區塊</div><div><kbd>Enter</kbd>分割／新增區塊</div><div><kbd>Shift + Enter</kbd>區塊內換行</div><div><kbd>Tab / Shift + Tab</kbd>縮排／取消縮排</div><div><kbd>Alt + ↑ / ↓</kbd>移動區塊及子區塊</div><div><kbd>⌘/Ctrl + Z</kbd>復原</div><div><kbd>⌘/Ctrl + Shift + Z</kbd>重做</div><div><kbd>⌘/Ctrl + K</kbd>搜尋頁面</div><div><kbd>Backspace</kbd>刪除空白區塊</div><div><kbd># / ## / - / 1. / [] + 空白</kbd>快速轉換區塊</div></div><p class="muted">程式碼使用 Enter 換行。巢狀區塊會隨父區塊一起移動。看板也可點開卡片，以鍵盤修改狀態。</p><div class="actions"><button data-close>開始寫作</button></div>')}
function navigate(id){closeCommands();state.active=id;save();if($('#dialog').open)$('#dialog').close();toggleSidebar(false);render();window.scrollTo(0,0)}
function toggleSidebar(open){$('.sidebar').classList.toggle('open',open);$('#toggleSidebar').setAttribute('aria-expanded',open)}
$('#tree').onclick=e=>{const p=e.target.closest('[data-page]'),x=e.target.closest('[data-expand]'),a=e.target.closest('[data-parent]');if(p)navigate(p.dataset.page);if(x){const p=state.pages.find(p=>p.id===x.dataset.expand);p.expanded=!p.expanded;save();renderTree()}if(a)newPage(a.dataset.parent)};
$('#dialog').onclick=e=>{if(e.target.closest('[data-close]'))$('#dialog').close();const p=e.target.closest('[data-page]');if(p)navigate(p.dataset.page)};
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
$('#pageTitle').onbeforeinput=()=>remember(true);$('#pageTitle').oninput=()=>{page().title=$('#pageTitle').textContent;save();renderTree();$('#breadcrumb').textContent=page().icon+' '+page().title};$('#pageTitle').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();focusBlock(page().blocks[0].id,false)}};
$('#editor').addEventListener('beforeinput',e=>{if(e.target.matches('.editable'))remember(true)});
$('#editor').addEventListener('input',e=>{if(!e.target.matches('.editable'))return;const b=page().blocks.find(b=>b.id===e.target.closest('.block').dataset.id);b.text=e.target.innerText.replace(/\n$/,'');save();if(b.text.startsWith('/')&&!b.text.includes('\n'))openCommands(b.id,b.text.slice(1));else closeCommands()});
$('#editor').addEventListener('change',e=>{if(e.target.matches('.check')){remember();const b=page().blocks.find(b=>b.id===e.target.closest('.block').dataset.id);b.checked=e.target.checked;e.target.closest('.block').classList.toggle('checked',b.checked);save()}});
$('#editor').onclick=e=>{const insert=e.target.closest('[data-insert]'),menu=e.target.closest('[data-menu]'),img=e.target.closest('[data-image]');if(insert){const b=insertAfter(insert.dataset.insert);openCommands(b.id)}if(menu)openCommands(menu.dataset.menu);if(img)imageDialog(img.dataset.image)};
$('#commands').onmousedown=e=>e.preventDefault();$('#commands').onclick=e=>{const t=e.target.closest('[data-type-pick]'),a=e.target.closest('[data-block-action]');if(t)convert(t.dataset.typePick);if(a){const id=menuBlock;closeCommands();if(a.dataset.blockAction==='delete')removeBlock(id);else move(id,a.dataset.blockAction==='down')}};
$('#editor').addEventListener('keydown',e=>{if(e.isComposing||!e.target.matches('.editable'))return;const el=e.target,b=page().blocks.find(b=>b.id===el.closest('.block').dataset.id),bs=page().blocks,i=bs.indexOf(b);if(!$('#commands').hidden&&['ArrowUp','ArrowDown','Enter','Escape'].includes(e.key)){e.preventDefault();if(e.key==='Escape')closeCommands();else if(e.key==='Enter'){const t=filteredTypes()[menuIndex];if(t)convert(t[0])}else{const n=filteredTypes().length;menuIndex=(menuIndex+(e.key==='ArrowDown'?1:-1)+n)%Math.max(1,n);drawCommands();$('#commands .current')?.scrollIntoView({block:'nearest'})}return}if(e.key==='Tab'){e.preventDefault();indent(b.id,e.shiftKey);return}if(e.altKey&&['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();move(b.id,e.key==='ArrowDown');return}if(e.key===' '){const shortcuts={'#':'h1','##':'h2','-':'bullet','*':'bullet','1.':'number','[]':'todo','```':'code'};if(shortcuts[el.textContent]){e.preventDefault();menuBlock=b.id;const type=shortcuts[el.textContent];remember();b.text='';convert(type);return}}if(e.key==='Enter'&&!e.shiftKey&&b.type!=='code'){e.preventDefault();remember();if(!b.text&&['todo','bullet','number'].includes(b.type)){b.type='text';save();renderBlocks();focusBlock(b.id);return}const sel=getSelection();if(!sel.rangeCount)return;const range=sel.getRangeAt(0),before=range.cloneRange(),after=range.cloneRange();before.selectNodeContents(el);before.setEnd(range.startContainer,range.startOffset);after.selectNodeContents(el);after.setStart(range.endContainer,range.endOffset);b.text=before.toString();const next=block(['todo','bullet','number'].includes(b.type)?b.type:'text',after.toString(),b.depth);bs.splice(subtree(i),0,next);save();renderBlocks();focusBlock(next.id,false)}if(e.key==='Backspace'&&!el.textContent){e.preventDefault();if(b.depth)indent(b.id,true);else removeBlock(b.id)}});
$('#editor').addEventListener('dragstart',e=>{const h=e.target.closest('[data-menu]');if(!h)return;dragBlock=h.dataset.menu;e.dataTransfer.setData('text/plain',dragBlock);e.dataTransfer.effectAllowed='move';closeCommands()});
$('#editor').addEventListener('dragover',e=>{const t=e.target.closest('.block');if(!dragBlock||!t)return;e.preventDefault();document.querySelectorAll('.block.drop').forEach(x=>x.classList.remove('drop'));t.dataset.dropSide=e.clientY>t.getBoundingClientRect().top+t.offsetHeight/2?'after':'before';t.classList.add('drop')});
$('#editor').addEventListener('drop',e=>{const t=e.target.closest('.block');if(!dragBlock||!t)return;e.preventDefault();const bs=page().blocks,i=bs.findIndex(b=>b.id===dragBlock),j=bs.findIndex(b=>b.id===t.dataset.id),end=subtree(i);if(j<i||j>=end){remember();const depth=bs[j].depth,after=t.dataset.dropSide==='after';let target=after?subtree(j):j;const part=bs.splice(i,end-i),delta=depth-part[0].depth;part.forEach(b=>b.depth+=delta);if(target>i)target-=part.length;bs.splice(target,0,...part);save()}dragBlock=null;renderBlocks()});
document.addEventListener('dragend',()=>{dragBlock=null;dragTask=null;document.querySelectorAll('.drop,.over').forEach(x=>x.classList.remove('drop','over'))});
$('#databaseView').onclick=e=>{const t=e.target.closest('[data-task]'),n=e.target.closest('[data-new-status]');if(t)taskDialog(t.dataset.task);if(n)taskDialog(null,n.dataset.newStatus)};
$('#databaseView').ondragstart=e=>{const c=e.target.closest('[data-task-drag]');if(c){dragTask=c.dataset.taskDrag;e.dataTransfer.setData('text/plain',dragTask)}};
$('#databaseView').ondragover=e=>{const c=e.target.closest('.column');if(dragTask&&c){e.preventDefault();document.querySelectorAll('.column').forEach(x=>x.classList.toggle('over',x===c))}};
$('#databaseView').ondrop=e=>{const c=e.target.closest('.column');if(dragTask&&c){e.preventDefault();remember();state.tasks.find(t=>t.id===dragTask).status=c.dataset.status;save();renderDB();dragTask=null}};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;save();renderDB()});$('#dbSearch').oninput=renderDB;$('#newTask').onclick=()=>taskDialog();$('#addBlock').onclick=()=>{const b=insertAfter(page().blocks.at(-1)?.id);openCommands(b.id)};$('#newPage').onclick=$('#addPage').onclick=()=>newPage();$('#searchPages').onclick=searchDialog;$('#help').onclick=$('#shortcuts').onclick=help;$('#home').onclick=()=>navigate(state.pages[0].id);$('#toggleSidebar').onclick=()=>toggleSidebar(!$('.sidebar').classList.contains('open'));$('#shade').onclick=()=>toggleSidebar(false);$('#favorite').onclick=()=>{remember();page().favorite=!page().favorite;save();render()};
$('#export').onclick=()=>{const text='# '+page().title+'\n\n'+page().blocks.map(b=>'  '.repeat(b.depth)+({h1:'# ',h2:'## ',bullet:'- ',number:'1. ',todo:b.checked?'- [x] ':'- [ ] '}[b.type]||'')+(b.type==='code'?'```\n'+b.text+'\n```':b.type==='image'?'!['+b.text+']('+(b.src||'')+')':b.text)).join('\n\n')+'\n\n## 專案進度\n\n| 專案 | 狀態 | 優先 | 日期 |\n|---|---|---|---|\n'+state.tasks.map(t=>'| '+[t.name,t.status,t.priority,t.date].map(x=>x.replaceAll('|','\\|')).join(' | ')+' |').join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));a.download=(page().title||'未命名')+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已匯出 Markdown 文件')};
document.addEventListener('keydown',e=>{if(e.isComposing)return;const mod=e.metaKey||e.ctrlKey;if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();if(!$('#dialog').open)searchDialog();return}if(mod&&e.key.toLowerCase()==='z'&&!$('#dialog').open){e.preventDefault();const from=e.shiftKey?redo:undo,to=e.shiftKey?undo:redo;if(from.length){to.push(JSON.stringify(state));state=JSON.parse(from.pop());closeCommands();save();render();toast(e.shiftKey?'已重做':'已復原')}return}if(e.key==='Escape'){closeCommands();toggleSidebar(false)}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#commands,[data-menu],[data-insert],#addBlock,.editable'))closeCommands()});window.addEventListener('resize',closeCommands);render();
</script></body></html>
