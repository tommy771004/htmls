</style>

  }
  // 門
  for (const d of DOORS) { d.open += (d.target - d.open) * Math.min(1, dt * 4); d.pivot.rotation.y = d.open * (d.maxAngle ?? 1.4) * (d.maxAngle ? 1 : d.dir); }
  // 風：衣服、窗簾、樹葉
  const wind = REDUCED ? 0 : 1;
  ITEMS.laundry.group.userData.clothes.forEach((c, i) => { c.rotation.x = wind * (Math.sin(now * 0.0017 + i * 1.3) * 0.12 + Math.sin(now * 0.0041 + i) * 0.05); c.rotation.z = wind * Math.sin(now * 0.0011 + i * 2) * 0.04; });
  ITEMS.curtain.group.userData.panels.forEach((c, i) => { c.rotation.z = wind * Math.sin(now * 0.0009 + i * 2.1) * 0.015; });
  ITEMS.tree.group.userData.leaves.forEach((l, i) => { l.rotation.y = wind * Math.sin(now * 0.0006 + i) * 0.06; l.rotation.z = wind * Math.sin(now * 0.0009 + i * 1.7) * 0.03; });
  const cs = updateCat(hour, dt, now);
  if (selected === 'cat' && $('catNow')) $('catNow').textContent = cs.walk ? '走在路上' : { bed:'床尾', kitchen:'廚房', seat:'窗邊的座位', balcony:'陽台', sofa:'沙發' }[cs.stop];
  // 鏡頭
  if (camTween) {
    camTween.k = Math.min(1, camTween.k + dt / camTween.dur); const e = 1 - Math.pow(1 - camTween.k, 3);
    controls.target.lerpVectors(camTween.t0, camTween.t1, e); camera.position.lerpVectors(camTween.p0, camTween.p1, e);
    if (camTween.k >= 1) camTween = null;
  } else if (following) {
    tmpV.set(cat.g.position.x, cat.g.position.y + 0.2, cat.g.position.z);
    const delta = tmpV.clone().sub(controls.target).multiplyScalar(Math.min(1, dt * 2.5));
    controls.target.add(delta); camera.position.add(delta);
  }
  controls.update();
  updateCuts(dt);
  if (selected && highlight.visible) highlight.setFromObject(ITEMS[selected].group);
  // 指北針跟著鏡頭轉
  const az = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
  $('compassRot').setAttribute('transform', `rotate(${(-az * 180 / Math.PI + 180).toFixed(1)})`);
  if (showNames) for (const { el, p } of labelEls) { tmpV.copy(p).project(camera); el.style.left = ((tmpV.x + 1) / 2 * stage.clientWidth) + 'px'; el.style.top = ((1 - tmpV.y) / 2 * stage.clientHeight) + 'px'; el.style.display = tmpV.z < 1 ? '' : 'none'; }
  planTimer += dt; if (planTimer > 0.25 && panelTab === 'plan') { planTimer = 0; drawPlan(); }
  if (composer) composer.render(); else renderer.render(scene, camera);
  if (first) { first = false; $('loading').hidden = true; }
}
syncTimeUI();
requestAnimationFrame(frame);

// 除錯與截圖用
window.__home = {
  setTime: (h) => { hour = h; syncTimeUI(); }, pause: () => { playing = false; $('play').textContent = '播放'; },
  view: (a) => { setArea(a); if (camTween) camTween.dur = 0.001; }, select, THREE, camera, controls,
};
</script>
</body>
</html>
