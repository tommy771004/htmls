<body>
<canvas id="scene" tabindex="0" aria-label="山中咖啡館的 3D 承諾牆。拖曳環視，滾輪或雙指縮放，點擊便條閱讀。鍵盤方向鍵環視，加減鍵縮放。"></canvas>
<div class="shade" aria-hidden="true"></div>
<header class="top"><h1>山中留話</h1><p class="sub">在這面牆上，留下一句想對自己說的話。</p><span class="index" id="count">牆上已有 10 句承諾</span></header>
<div class="help"><div class="wall-actions"><select id="notePicker" aria-label="選擇便條閱讀"><option value="">選擇一張便條閱讀</option></select><button id="homeView" type="button">全景</button></div>拖曳環視　·　滾輪縮放　·　點一下便條細讀<span>手機可單指移動、雙指縮放</span></div>
<button class="mobile-open" id="mobileOpen" type="button">＋ 寫下一句承諾</button>
<section class="compose" id="compose" aria-label="新增承諾">
  <button class="mobile-close" id="mobileClose" type="button" aria-label="關閉新增表單">×</button>
  <h2>把這句話貼上牆</h2>
  <form id="form"><label class="field" for="promise">我的承諾<textarea id="promise" maxlength="90" required placeholder="例如：每個月留一天，走進山裡。"></textarea></label><p class="char"><span id="charCount">0</span> / 90</p>
  <span class="style-label" id="styleLabel">挑一張便條</span><div class="styles" role="group" aria-labelledby="styleLabel">
    <button class="style" type="button" data-style="strip" aria-pressed="false"><span class="swatch"></span>紙條</button>
    <button class="style" type="button" data-style="sticky" aria-pressed="true"><span class="swatch"></span>便利貼</button>
    <button class="style" type="button" data-style="card" aria-pressed="false"><span class="swatch"></span>卡片</button>
    <button class="style" type="button" data-style="wood" aria-pressed="false"><span class="swatch"></span>木牌</button>
  </div><button class="post" type="submit">貼上承諾牆</button><p class="feedback" id="feedback" role="status"></p><p class="fine">你寫的便條只保存在這台裝置的瀏覽器裡。</p></form>
</section>
<div class="detail" id="detail" hidden role="dialog" aria-modal="true" aria-labelledby="detailText"><div class="detail-card" id="detailCard"><button class="detail-x" id="detailClose" type="button" aria-label="關閉便條">×</button><span class="label" id="detailLabel"></span><blockquote id="detailText"></blockquote><div class="foot"><span id="detailDate"></span><span>山中留話</span></div><div class="detail-actions"><button id="removeNote" type="button" hidden>從這台裝置移除</button><button id="detailBack" type="button">返回牆面</button></div></div></div>
<div class="error" id="error" hidden role="alert">無法載入 3D 場景。請確認已連線且瀏覽器支援 WebGL，然後重新整理。</div>
<script type="module">
let THREE;
try { THREE = await import('../vendor/three-0.186.0/three.module.js'); }

function seeded(n){let x=Math.sin(n*127.1+18.8)*43758.5453;return x-Math.floor(x);}
function canvasTexture(canvas){const t=new THREE.CanvasTexture(canvas);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),8);return t;}

// The distant peaks are painted into one blurred canvas; the wall and notes stay sharp.
function landscapeTexture(){const c=document.createElement('canvas');c.width=1024;c.height=768;const g=c.getContext('2d');const grad=g.createLinearGradient(0,0,0,768);grad.addColorStop(0,'#b8c4b6');grad.addColorStop(.62,'#e3cdb0');grad.addColorStop(1,'#8b9e88');g.fillStyle=grad;g.fillRect(0,0,1024,768);g.filter='blur(7px)';for(let layer=0;layer<5;layer++){const base=350+layer*95;g.fillStyle=['#9aa998','#809584','#698270','#536b5a','#3d594a'][layer];g.beginPath();g.moveTo(0,768);for(let x=0;x<=1024;x+=8){const peak=Math.sin(x*.009+layer)*45+Math.sin(x*.021+layer*2)*20+Math.sin(x*.003+layer)*67;g.lineTo(x,base-peak);}g.lineTo(1024,768);g.fill();}g.filter='none';const mist=g.createLinearGradient(0,425,0,768);mist.addColorStop(0,'#f6ddbd00');mist.addColorStop(.55,'#f3e3c888');mist.addColorStop(1,'#f5e4ca00');g.fillStyle=mist;g.fillRect(0,425,1024,343);return canvasTexture(c);}
const mountain=new THREE.MeshBasicMaterial({map:landscapeTexture(),fog:false});
plane(scene,mountain,-7.3,3.4,-2.75,4.45,5.2);plane(scene,mountain,7.3,3.4,-2.75,4.45,5.2);
// Plaster wall, wood frame, surrounding cafe floor and two tall windows.
box(scene,plaster,0,3.25,-.42,10.25,6.35,.62);
box(scene,darkWood,0,6.52,-.08,11.1,.38,.95,true);
box(scene,darkWood,0,.05,.1,11.1,.42,1.05,true);
for(const x of [-5.35,5.35])box(scene,darkWood,x,3.25,.08,.35,6.45,.9,true);
box(scene,paleWood,0,5.98,.23,10.22,.11,.18);
box(scene,paleWood,0,.71,.23,10.22,.17,.22);
const floor=box(scene,floorMat,0,-.3,1.5,100,.25,100);floor.receiveShadow=true;
for(let i=-10;i<=10;i++)box(scene,darkWood,i*1.05,-.17,1.5,.018,.02,11);
// The cafe's own back wall, painted deep green, with the two windows cut into it; each window gets a head rail and a sill.
{const room=mat('#3b463a',.94);for(const [x0,x1,y0,y1] of [[-30,30,6.02,32],[-30,30,-.3,.78],[-30,-9.58,.78,6.02],[-5.12,5.12,.78,6.02],[9.58,30,.78,6.02]])box(scene,room,(x0+x1)/2,(y0+y1)/2,-2.66,x1-x0,y1-y0,.16);}
for(const x of [-7.35,7.35]){box(scene,darkWood,x,6.02,-2.42,4.72,.2,.34);box(scene,darkWood,x,.8,-2.4,4.9,.14,.42);box(scene,darkWood,x,3.4,-2.43,4.72,.25,.32);box(scene,darkWood,x,3.4,-2.42,.21,5.25,.33);box(scene,darkWood,x-2.25,3.4,-2.42,.21,5.25,.33);box(scene,darkWood,x+2.25,3.4,-2.42,.21,5.25,.33);box(scene,darkWood,x,3.45,-2.4,4.7,.09,.25);box(scene,darkWood,x,3.4,-2.4,.09,5.25,.25);}
// Wall grain is an actual canvas map with fine uneven plaster specks.
{const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle='#c7b293';g.fillRect(0,0,512,512);for(let i=0;i<15000;i++){const v=seeded(i+23);g.fillStyle=i%2?'rgba(90,70,48,.055)':'rgba(255,246,218,.07)';g.fillRect(seeded(i*3)*512,seeded(i*7)*512,1+v*3,1+v*2);}const t=canvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,2);plaster.map=t;plaster.needsUpdate=true;}

// Pendant shades on rods that run up out of frame, soft bulbs, and a low coffee table standing on four legs.
for(const x of [-6.25,6.25]){box(scene,darkWood,x,18.06,1.45,.028,23.87,.028);const shade=new THREE.Mesh(new THREE.CylinderGeometry(.2,.68,.42,24,1,true),new THREE.MeshStandardMaterial({color:'#4b5a4b',side:THREE.DoubleSide,roughness:.8}));shade.position.set(x,5.88,1.45);scene.add(shade);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.18,16,10),new THREE.MeshBasicMaterial({color:'#ffd89b'}));bulb.position.set(x,5.67,1.45);scene.add(bulb);}
const table=new THREE.Group();table.position.set(-5.8,0,5.8);table.rotation.y=.18;scene.add(table);box(table,walnut,0,.95,0,3.8,.14,2.1,true);for(const x of [-1.68,1.68])for(const z of [-.84,.84])box(table,darkWood,x,.39,z,.14,.98,.14,true);
cylinder(table,mat('#d7c8aa'),0,1.215,-.3,.23,.18,.32);
cylinder(table,mat('#473c32'),0,1.36,-.3,.16,.16,.015);
cylinder(table,mat('#d7c8aa'),0,1.038,-.3,.32,.32,.035);
const pot=cylinder(scene,mat('#876450'),5.5,-.03,5.1,.35,.25,.48);
for(let i=0;i<8;i++){const leaf=new THREE.Mesh(new THREE.SphereGeometry(1,8,6),mat(i%2?'#42644c':'#587451'));leaf.scale.set(.12,.36,.07);leaf.position.set(5.5+Math.sin(i*2.4)*.24,.48+seeded(i)*.26,5.1+Math.cos(i*2.4)*.22);leaf.rotation.z=Math.sin(i*2.4)*.55;scene.add(leaf);}

// Note sizes share the room's scale: a sticky note is about as wide as the coffee cup on the table, a card or a wooden tag a little larger.
const STYLES={strip:{name:'紙條',w:.68,h:.29,color:'#f4ead2',ink:'#554535'},sticky:{name:'便利貼',w:.55,h:.53,color:'#edc985',ink:'#54432e'},card:{name:'卡片',w:.69,h:.43,color:'#ced9ce',ink:'#3f5149'},wood:{name:'木牌',w:.73,h:.34,color:'#986a45',ink:'#fff2dc'}};
let selectedStyle='sticky', notes=[], saved=[], focused=null, focusedFrom=null;
const noteMeshes=[];
// The canvas takes the note's own proportions (512 px tall), so the handwriting is never squashed or stretched on the plane.
function textureForNote(note){const s=STYLES[note.style],c=document.createElement('canvas');c.height=512;c.width=Math.round(512*s.w/s.h);const W=c.width,H=c.height,g=c.getContext('2d');g.fillStyle=s.color;g.fillRect(0,0,W,H);
  if(note.style==='wood'){for(let i=0;i<80;i++){g.strokeStyle=i%3?'#704a31':'#b8885d';g.globalAlpha=.12+seeded(i)*.22;g.lineWidth=1+seeded(i+34)*3;const y=seeded(i*4)*H;g.beginPath();g.moveTo(0,y);g.bezierCurveTo(W*.33,y+seeded(i+2)*18,W*.66,y-15,W,y+seeded(i+11)*9);g.stroke();}g.globalAlpha=1;g.strokeStyle='#eacaa08c';g.lineWidth=4;g.strokeRect(23,23,W-46,H-46);}

  g.fillStyle=s.ink;
  // Wrap by measured canvas width, including CJK text and explicit newlines.
  const textW=W-118,wrap=(size)=>{g.font=`${note.style==='wood'?'600':'500'} ${size}px Georgia,"Noto Serif TC","PingFang TC",serif`;const out=[];for(const para of note.text.split('\n')){let line='';for(const ch of para){if(g.measureText(line+ch).width>textW&&line){out.push(line);line=ch;}else line+=ch;}out.push(line);}return out;};

function createNote(note,animate=false){const s=STYLES[note.style];note.restZ={wood:-.0105,sticky:-.097,card:-.089,strip:-.108}[note.style];const group=new THREE.Group();group.position.set(note.x,note.y,note.restZ);group.rotation.z=note.rot;scene.add(group);
  let backing;if(note.style==='wood'){backing=box(group,walnut,0,0,-.045,s.w,s.h,.105,true);for(const x of [-s.w*.43,s.w*.43]){const nail=new THREE.Mesh(new THREE.SphereGeometry(.022,8,6),bronze);nail.position.set(x,s.h*.36,.022);group.add(nail);}}
  // Paper sits flush on the plaster: a sticky pad keeps a thin darker stack under its top sheet, a card has card-stock thickness, a strip is a single taped sheet.
  else if(note.style!=='strip'){const th=note.style==='card'?.02:.012;backing=box(group,mat(new THREE.Color(note.style==='card'?'#9fb3a8':s.color).multiplyScalar(note.style==='card'?1:.8)),0,0,-th/2,s.w,s.h,th,true);}

  const front=new THREE.Mesh(frontGeo,new THREE.MeshStandardMaterial({map:textureForNote(note),roughness:note.style==='wood'?.83:.92,side:THREE.DoubleSide}));front.position.z=note.style==='wood'?.0095:.0015;front.castShadow=true;front.userData.note=note;group.add(front);noteMeshes.push(front);note.group=group;note.front=front;
  if(note.style==='strip'){const tape=new THREE.Mesh(new THREE.PlaneGeometry(.15,.08),new THREE.MeshStandardMaterial({color:'#c7b9a1',transparent:true,opacity:.77,side:THREE.DoubleSide,roughness:1}));tape.position.set(0,s.h*.48,.007);tape.rotation.z=-.08;group.add(tape);}else if(note.style==='card'){const pin=new THREE.Mesh(new THREE.SphereGeometry(.035,12,8),mat('#bd704d',.38));pin.scale.z=.6;pin.position.set(0,s.h*.43,.03);group.add(pin);}
  if(animate){group.position.set(note.x,note.y+.65,2.4);group.rotation.set(-.3,.28,note.rot+.27);group.scale.setScalar(.7);note.animation={t:0,duration:1.15};}notes.push(note);updateCount();return note;}
const examples=[
  ['下次上山，記得慢慢走。','strip',-3.65,4.92,-.07],['每週留一晚，陪家人吃飯。','sticky',-1.9,4.65,.045],['把說出口的謝謝，說得更勤一些。','card',.25,4.9,-.035],['好好睡覺，也是一種勇敢。','wood',2.8,4.83,.055],
  ['今年學會照顧一株植物。','sticky',-3.64,3.24,-.065],['每一個晴天，都出去曬太陽。','strip',1.48,3.47,-.045],['再試一次，哪怕很小步。','sticky',3.55,3.03,.065],
  ['留一杯咖啡的時間給自己。','wood',-3.5,1.65,.045],['去做一直想做的那件小事。','sticky',1.55,1.72,-.05],['讓心裡有一盞燈。','card',3.65,1.57,.035]

examples.forEach((a,i)=>createNote({id:'demo-'+i,text:a[0],style:a[1],x:a[2]+(seeded(i*13)-.5)*.12,y:a[3]+(seeded(i*17)-.5)*.1,rot:a[4],demo:true}));
const KEY='mountain-promise-wall:v1';
try {const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(data)){for(const raw of data.slice(0,80)){if(!raw||typeof raw.text!=='string'||!STYLES[raw.style])continue;const x=Number(raw.x),y=Number(raw.y),rot=Number(raw.rot);if(!Number.isFinite(x)||!Number.isFinite(y)||!Number.isFinite(rot))continue;const note={id:String(raw.id),text:raw.text.slice(0,90),style:raw.style,x:THREE.MathUtils.clamp(x,-4.2,4.2),y:THREE.MathUtils.clamp(y,1.2,5.3),rot:THREE.MathUtils.clamp(rot,-.2,.2),date:String(raw.date||''),demo:false};if(note.text.trim()){saved.push(note);createNote(note);}}}}catch(e){feedback.textContent='目前無法讀取這台裝置之前寫下的便條。';}
function updateCount(){$('count').textContent=`牆上已有 ${notes.length} 句承諾`;const picker=$('notePicker');picker.replaceChildren(new Option('選擇一張便條閱讀',''));for(const note of notes)picker.add(new Option(STYLES[note.style].name+' · '+note.text,note.id));}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved.map(({id,text,style,x,y,rot,date})=>({id,text,style,x,y,rot,date}))));return true;}catch(e){feedback.textContent='瀏覽器無法保存便條，請確認儲存空間或隱私設定。';return false;}}
function findSpot(style){const s=STYLES[style];let best=null;for(let i=0;i<170;i++){const x=-4.05+seeded(i*47+notes.length*8)*8.1,y=1.25+seeded(i*31+notes.length*5)*4.05;let nearest=Infinity;for(const n of notes){const nx=Math.abs(n.x-x)/(STYLES[n.style].w/2+s.w/2+.1),ny=Math.abs(n.y-y)/(STYLES[n.style].h/2+s.h/2+.08);nearest=Math.min(nearest,Math.max(nx,ny));}if(!best||nearest>best.score)best={x,y,score:nearest};if(nearest>1.12)break;}return best;}
function saveNew(text,style){const spot=findSpot(style);if(!spot||spot.score<.68){feedback.textContent='牆上暫時沒有空位了。';return;}const note={id:'n-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),text,style,x:spot.x,y:spot.y,rot:(Math.random()-.5)*.13,date:new Date().toLocaleDateString('zh-TW'),demo:false};saved.push(note);if(!persist()){saved.pop();return;}createNote(note,true);feedback.textContent='已把你的承諾貼上牆。';form.reset();$('charCount').textContent='0';if(matchMedia('(max-width:780px)').matches){$('compose').classList.remove('open');$('mobileOpen').focus();}}
form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(!text){feedback.textContent='先寫下一句承諾吧。';input.focus();return;}saveNew(text,selectedStyle);});
input.addEventListener('input',()=>{$('charCount').textContent=String(input.value.length);feedback.textContent='';});
document.querySelectorAll('.style').forEach(button=>button.addEventListener('click',()=>{selectedStyle=button.dataset.style;document.querySelectorAll('.style').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));
$('mobileOpen').addEventListener('click',()=>{$('compose').classList.add('open');input.focus();});
$('mobileClose').addEventListener('click',()=>{$('compose').classList.remove('open');$('mobileOpen').focus();});

// Restrained orbit around the wall, with damping on both mouse and touch.
const homeDistance=()=>Math.max(15,15.5/(stageWidth()/innerHeight)),maxDistance=()=>Math.max(24,homeDistance()*1.3);let targetYaw=0,yaw=0,targetPitch=.055,pitch=.055,targetDistance=homeDistance(),distance=targetDistance;
let center=new THREE.Vector3(0,3.2,0),targetCenter=center.clone();
const pointers=new Map();let pointerStart=null,dragged=false,pinchStart=0,pinchDistance=0;
function focusView(note){focusedFrom={yaw:targetYaw,pitch:targetPitch,distance:targetDistance,center:targetCenter.clone()};targetCenter.set(note.x,note.y,.2);targetDistance=1.7;targetYaw=THREE.MathUtils.clamp(note.x*.035,-.18,.18);targetPitch=.018;if(reduced)snapCam=true;}
function resetView(){if(focusedFrom){targetYaw=focusedFrom.yaw;targetPitch=focusedFrom.pitch;targetDistance=focusedFrom.distance;targetCenter.copy(focusedFrom.center);focusedFrom=null;}else{targetCenter.set(0,3.2,0);targetDistance=homeDistance();}focused=null;if(reduced)snapCam=true;}
function pointerPositions(){return [...pointers.values()];}
canvas.addEventListener('pointerdown',e=>{canvas.focus({preventScroll:true});canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){pointerStart={x:e.clientX,y:e.clientY};dragged=false;canvas.classList.add('dragging');}if(pointers.size===2){const p=pointerPositions();pinchStart=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);pinchDistance=targetDistance;dragged=true;}});
canvas.addEventListener('pointermove',e=>{const old=pointers.get(e.pointerId);if(!old)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const p=pointerPositions();const now=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);targetDistance=THREE.MathUtils.clamp(pinchDistance*pinchStart/Math.max(now,20),1.5,maxDistance());return;}if(pointerStart&&Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y)>5)dragged=true;if(dragged){if(focused)resetView();targetYaw=THREE.MathUtils.clamp(targetYaw-(e.clientX-old.x)*.0032,-.62,.62);targetPitch=THREE.MathUtils.clamp(targetPitch+(e.clientY-old.y)*.0027,-.25,.3);}});
function endPointer(e){const wasClick=pointers.size===1&&!dragged&&pointerStart&&Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y)<6;pointers.delete(e.pointerId);if(!pointers.size){canvas.classList.remove('dragging');pointerStart=null;}if(wasClick)pickNote(e.clientX,e.clientY);}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',cancelPointer);canvas.addEventListener('lostpointercapture',cancelPointer);function cancelPointer(e){pointers.delete(e.pointerId);if(!pointers.size)canvas.classList.remove('dragging');pointerStart=null;dragged=true;}
canvas.addEventListener('wheel',e=>{e.preventDefault();targetDistance=THREE.MathUtils.clamp(targetDistance*Math.exp(e.deltaY*.001),1.5,maxDistance());},{passive:false});
canvas.addEventListener('keydown',e=>{const step=.12;if(e.key==='ArrowLeft')targetYaw=THREE.MathUtils.clamp(targetYaw+step,-.62,.62);else if(e.key==='ArrowRight')targetYaw=THREE.MathUtils.clamp(targetYaw-step,-.62,.62);else if(e.key==='ArrowUp')targetPitch=THREE.MathUtils.clamp(targetPitch-step,-.25,.3);else if(e.key==='ArrowDown')targetPitch=THREE.MathUtils.clamp(targetPitch+step,-.25,.3);else if(e.key==='+'||e.key==='=')targetDistance=THREE.MathUtils.clamp(targetDistance*.85,1.5,maxDistance());else if(e.key==='-'||e.key==='_')targetDistance=THREE.MathUtils.clamp(targetDistance*1.15,1.5,maxDistance());else if(e.key==='Home'){fullView();}else if(e.key==='Enter'){const r=canvas.getBoundingClientRect();pickNote(r.left+r.width/2,r.top+r.height/2);}else return;e.preventDefault();});
const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
function intersect(x,y){const r=canvas.getBoundingClientRect();mouse.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1);raycaster.setFromCamera(mouse,camera);return raycaster.intersectObjects(noteMeshes,false)[0]?.object.userData.note||null;}
let hovered=null;function setHover(n){if(n!==hovered){hovered=n;canvas.classList.toggle('hovering',!!n);}}canvas.addEventListener('pointermove',e=>{if(!pointers.size&&e.pointerType==='mouse')setHover(intersect(e.clientX,e.clientY));});canvas.addEventListener('pointerdown',()=>setHover(null));canvas.addEventListener('pointerleave',()=>setHover(null));

function showNote(note){focused=note;focusView(note);$('detailCard').className='detail-card '+note.style;$('detailLabel').textContent=note.demo?'牆上原有的話 · '+STYLES[note.style].name:'我的承諾 · '+STYLES[note.style].name;$('detailText').textContent=note.text;$('detailDate').textContent=note.demo?'山中咖啡館':note.date||'今天';$('removeNote').hidden=note.demo;$('detail').hidden=false;$('detailClose').focus();}
function fullView(){focusedFrom=null;focused=null;targetYaw=0;targetPitch=.055;targetCenter.set(0,3.2,0);targetDistance=homeDistance();if(reduced)snapCam=true;}$('homeView').addEventListener('click',fullView);$('notePicker').addEventListener('change',e=>{const note=notes.find(n=>n.id===e.target.value);if(note)showNote(note);e.target.value='';});
function closeDetail(){$('detail').hidden=true;resetView();canvas.focus();}
$('detailClose').addEventListener('click',closeDetail);$('detailBack').addEventListener('click',closeDetail);$('detail').addEventListener('click',e=>{if(e.target===$('detail'))closeDetail();});
$('removeNote').addEventListener('click',()=>{if(!focused||focused.demo)return;const note=focused;const at=saved.findIndex(n=>n.id===note.id);if(at<0)return;saved.splice(at,1);if(!persist()){saved.splice(at,0,note);return;}scene.remove(note.group);note.front.material.map.dispose();note.front.material.dispose();noteMeshes.splice(noteMeshes.indexOf(note.front),1);notes.splice(notes.indexOf(note),1);updateCount();invalidated=true;closeDetail();});
document.addEventListener('keydown',e=>{if(e.key==='Tab'&&!$('detail').hidden){const buttons=[...$('detail').querySelectorAll('button')].filter(b=>!b.hidden);if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus()}}if(e.key==='Escape'){if(!$('detail').hidden)closeDetail();else $('compose').classList.remove('open');}});
function resize(){camera.aspect=stageWidth()/innerHeight;camera.updateProjectionMatrix();renderer.setSize(stageWidth(),innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));if(!focused)targetDistance=homeDistance();invalidated=true;}
addEventListener('resize',resize);

const lowPitch=(y,dist)=>Math.asin(THREE.MathUtils.clamp((.55-y)/dist,-1,1));
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;const d=snapCam?1:1-Math.exp(-7*dt);snapCam=false;targetPitch=Math.max(targetPitch,lowPitch(targetCenter.y,targetDistance));yaw+=(targetYaw-yaw)*d;pitch+=(targetPitch-pitch)*d;distance+=(targetDistance-distance)*d;center.lerp(targetCenter,d);pitch=Math.max(pitch,lowPitch(center.y,distance));camera.position.set(center.x+Math.sin(yaw)*Math.cos(pitch)*distance,center.y+Math.sin(pitch)*distance,center.z+Math.cos(yaw)*Math.cos(pitch)*distance);camera.lookAt(center);
  let busy=invalidated||Math.abs(targetYaw-yaw)>1e-4||Math.abs(targetPitch-pitch)>1e-4||Math.abs(targetDistance-distance)>1e-4||center.distanceToSquared(targetCenter)>1e-8;invalidated=false;

  if(busy)renderer.render(scene,camera);}
requestAnimationFrame(frame);
