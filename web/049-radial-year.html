<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一年三百六十五格 · 放射年曆</title>
<meta name="description" content="365 天放射熱度圖，懸停高亮同週與同星期幾，三組資料切換。收錄於 100 Creative HTML Works（049・放射狀年曆）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/web/049-radial-year.html">
<style>
:root{
  --sans:"Segoe UI","Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",Helvetica,Arial,sans-serif;
  --mono:Consolas,"Lucida Console",Menlo,monospace;
  --ink:#1c2340; --mute:#7a809a; --line:#e3e6ef;
  --s0:#f1f4fb; --s1:#dbe3f5; --s2:#bccbec; --s3:#98aee0; --s4:#728fd1; --s5:#5071bd; --s6:#3656a3; --s7:#243f84; --s8:#162a5e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:var(--sans);min-height:100vh}
.wrap{max-width:1320px;margin:0 auto;padding:clamp(18px,3vw,40px) clamp(16px,3vw,40px) 40px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:14px 30px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:14px}
h1{margin:0;font-weight:300;font-size:clamp(28px,4vw,50px);letter-spacing:.04em;line-height:1.1}
h1 b{font-weight:700}
.lede{margin:6px 0 0;color:var(--mute);font-size:clamp(13px,1.3vw,15px);max-width:42em;line-height:1.6}
.tabs{display:flex;border:1px solid var(--ink)}
.tabs button{min-height:42px;padding:0 16px;border:0;background:#fff;font-family:var(--sans);font-size:14px;color:var(--ink);cursor:pointer;border-right:1px solid var(--ink)}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff}
.tabs button:focus-visible{outline:2px solid var(--s5);outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:clamp(18px,3vw,44px);align-items:start;margin-top:clamp(12px,2vw,24px)}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.chart{position:relative;width:min(100%,760px,calc(100vh - 250px));min-width:min(100%,340px);margin:0 auto;aspect-ratio:1}
@media (max-width:600px){.chart .mlab{font-size:30px}.chart .wlab{display:none}}
.chart svg{width:100%;height:100%;display:block;overflow:visible;touch-action:manipulation}
.chart svg:focus{outline:none}
.chart svg:focus-visible .ringbg{stroke:var(--s5)}
.cell{stroke:#fff;stroke-width:1.2;transition:opacity .25s,stroke .2s;animation:rise .5s both;cursor:pointer}
@keyframes rise{from{opacity:0}}
.dim .cell{opacity:.22}
.dim .cell.rel{opacity:1}
.cell.act{opacity:1}
.mlab{font-family:var(--sans);font-size:17px;fill:var(--mute);text-anchor:middle;dominant-baseline:middle;transition:fill .2s,font-weight .2s}
.mlab.on{fill:var(--ink);font-weight:700}
.wlab{font-family:var(--mono);font-size:11px;fill:var(--mute);text-anchor:end;dominant-baseline:middle}
.mline{stroke:var(--line);stroke-width:1}
.spoke{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 4;opacity:0;transition:opacity .2s}
.spoke.on{opacity:1}
.pin{fill:var(--ink)}
.center{position:absolute;left:50%;top:50%;width:34%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.center .d{font-size:clamp(12px,1.7vw,16px);color:var(--mute);letter-spacing:.06em}
.center .v{font-family:var(--mono);font-size:clamp(26px,5.4vw,52px);line-height:1.05;letter-spacing:-.02em;margin:4px 0 2px}
.center .u{font-size:clamp(11px,1.4vw,14px);color:var(--mute)}
.center .n{font-size:clamp(11px,1.4vw,14px);margin-top:6px;line-height:1.4;color:var(--s7);min-height:1.4em}
@media (max-width:420px){.center .n{display:none}}
.panel{display:flex;flex-direction:column;gap:22px}
.legend .bar{display:grid;grid-template-columns:repeat(9,1fr);height:16px;margin:8px 0 4px}
.legend .bar i:nth-child(1){background:var(--s0)}.legend .bar i:nth-child(2){background:var(--s1)}.legend .bar i:nth-child(3){background:var(--s2)}.legend .bar i:nth-child(4){background:var(--s3)}.legend .bar i:nth-child(5){background:var(--s4)}.legend .bar i:nth-child(6){background:var(--s5)}.legend .bar i:nth-child(7){background:var(--s6)}.legend .bar i:nth-child(8){background:var(--s7)}.legend .bar i:nth-child(9){background:var(--s8)}
.legend .ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mute)}
.lbl{font-size:12px;letter-spacing:.16em;color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px 18px}
.stat b{display:block;font-family:var(--mono);font-weight:400;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:12.5px;color:var(--mute)}
.stat small{display:block;font-size:12px;color:var(--s6)}
.notes{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.notes button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:10px;width:100%;min-height:42px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px;line-height:1.4}
.notes button:hover,.notes button:focus-visible{background:var(--s0)}
.notes time{font-family:var(--mono);color:var(--s6)}
.wkbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:70px}
.wkbars div{background:var(--s4);position:relative;transition:height .4s,background .2s}
.wkbars div.on{background:var(--s7)}
.wkbars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--mute)}
foot,.foot{display:block;margin-top:34px;font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
@media (prefers-reduced-motion:reduce){.cell{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>一年，<b>三百六十五格</b></h1>
      <p class="lede">把 2025 年攤成一個圓：從正上方的一月一日開始，順時針走完一年。每一條放射線是一週，每一圈是星期幾（內圈週一、外圈週日）。顏色越深，數字越大。游標移上去，看同一週與同一個星期幾。</p>
    </div>
    <div class="tabs" role="group" aria-label="切換資料">
      <button type="button" data-k="steps" aria-pressed="true">步數</button>
      <button type="button" data-k="sleep" aria-pressed="false">睡眠</button>
      <button type="button" data-k="coffee" aria-pressed="false">咖啡</button>
    </div>
  </header>

  <div class="main">
    <div class="chart" id="chart">
      <svg id="svg" viewBox="0 0 1000 1000" tabindex="0" role="application" aria-label="2025 年放射熱度圖，使用方向鍵移動日期"></svg>
      <div class="center" aria-live="polite">
        <div class="d" id="cD">2025 全年</div>
        <div class="v" id="cV">—</div>
        <div class="u" id="cU">平均每日</div>
        <div class="n" id="cN"></div>
      </div>
    </div>
    <aside class="panel">
      <div class="legend"><div class="lbl" id="legLbl">色階 · 每日步數</div><div class="bar"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="ticks" id="ticks"></div></div>
      <div class="stats" id="stats"></div>
      <div><div class="lbl" style="margin-bottom:8px">星期幾的平均</div><div class="wkbars" id="wk"></div></div>
      <div><div class="lbl" style="margin:14px 0 6px">值得標記的日子</div><ul class="notes" id="notes"></ul></div>
    </aside>
  </div>
  <div class="foot"><span>資料為虛構的一個上班族 · 2025/1/1 – 2025/12/31</span><span>← → 一天 · ↑ ↓ 一週 · Esc 回到全年</span></div>
</div>

<script>
(function(){
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('svg'); if(!svg) return;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var YEAR = 2025, N = 365, CX = 500, CY = 500, R0 = 178, RW = 36, WEEKS = 53;
  var start = new Date(YEAR, 0, 1), off = (start.getDay() + 6) % 7; // Monday-based
  var DOWN = ['一','二','三','四','五','六','日'];
  function dateOf(i){ var d = new Date(YEAR, 0, 1 + i); return d; }
  function md(i){ var d = dateOf(i); return (d.getMonth() + 1) + '/' + d.getDate(); }
  function idxOf(m, d){ return Math.round((new Date(YEAR, m - 1, d) - start) / 864e5); }

  /* ---------- fictional data ---------- */
  var seed = 2025; function R(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  function gauss(){ return (R() + R() + R() - 1.5) / 1.5; }
  var EVENTS = [
    [2, 9, '爬七星山，腿到隔天還在抖', { steps:28431, sleep:9.1, coffee:1 }],
    [3, 10, '重感冒第一天，只走到冰箱', { steps:640, sleep:11.2, coffee:0 }],
    [3, 11, '', { steps:820, sleep:10.4, coffee:0 }], [3, 12, '', { steps:1310, sleep:10, coffee:0 }], [3, 13, '', { steps:2400, sleep:9.2, coffee:1 }],
    [4, 3, '清明連假，環島第一天', { steps:21980, sleep:6.1, coffee:2 }], [4, 4, '', { steps:19402, sleep:7.3, coffee:2 }], [4, 5, '', { steps:24110, sleep:7.8, coffee:1 }], [4, 6, '', { steps:17303, sleep:9.4, coffee:1 }],
    [6, 16, '專案死線週開始，咖啡開始論壺計', { steps:3920, sleep:4.6, coffee:6 }], [6, 17, '', { steps:3301, sleep:4.2, coffee:7 }], [6, 18, '', { steps:2988, sleep:3.9, coffee:8 }], [6, 19, '', { steps:3405, sleep:4.4, coffee:6 }], [6, 20, '上線了。睡了十一個小時', { steps:5120, sleep:11.3, coffee:3 }],
    [7, 28, '颱風假，一步都不想走', { steps:312, sleep:10.2, coffee:4 }], [7, 29, '', { steps:1104, sleep:9.6, coffee:3 }],
    [10, 10, '國慶日散步去看煙火', { steps:16021, sleep:6.4, coffee:2 }],
    [11, 16, '人生第一場半馬', { steps:38950, sleep:8.8, coffee:1 }],
    [12, 31, '跨年：走了一整晚，還在排捷運', { steps:26544, sleep:3.2, coffee:3 }]
  ];
  var ev = {}; EVENTS.forEach(function(e){ ev[idxOf(e[0], e[1])] = e; });
  var DATA = { steps:[], sleep:[], coffee:[] };
  for(var i = 0; i < N; i++){
    var d = dateOf(i), wd = (d.getDay() + 6) % 7, m = d.getMonth();
    var season = [0, 200, 900, 1200, 900, 300, -900, -1100, 400, 1100, 900, 0][m];
    var st = 6600 + season + (wd === 5 ? 3600 : wd === 6 ? 1800 : 0) + (wd === 2 ? 900 : 0) + gauss() * 2300;
    var sl = 6.7 + (wd >= 5 ? 1.3 : 0) + (wd === 4 ? -.4 : 0) + gauss() * .8;
    var cf = (wd >= 5 ? 1 : 2) + (R() < .35 ? 1 : 0) + (m === 11 ? 1 : 0);
    if(ev[i]){ st = ev[i][3].steps; sl = ev[i][3].sleep; cf = ev[i][3].coffee; }
    DATA.steps.push(Math.max(150, Math.round(st))); DATA.sleep.push(Math.max(3, Math.round(sl * 10) / 10)); DATA.coffee.push(Math.max(0, Math.round(cf)));
  }
  var META = {
    steps:{ unit:'步', lbl:'每日步數', avgLbl:'平均每日步數', fmt:function(v){ return v.toLocaleString('en-US'); }, stops:[0, 2000, 4000, 6000, 8000, 10000, 13000, 17000, 24000] },
    sleep:{ unit:'小時', lbl:'每晚睡眠', avgLbl:'平均每晚睡眠', fmt:function(v){ return v.toFixed(1); }, stops:[0, 4.5, 5.5, 6.2, 6.8, 7.4, 8, 9, 10] },
    coffee:{ unit:'杯', lbl:'每日咖啡', avgLbl:'平均每日咖啡', fmt:function(v){ return String(v); }, stops:[0, 1, 2, 3, 4, 5, 6, 7, 8] }
  };
  var key = 'steps';
  function bucket(v){ var s = META[key].stops, b = 0; for(var k = 0; k < s.length; k++) if(v >= s[k]) b = k; return b; }

  /* ---------- geometry ---------- */
  function pol(r, a){ return [CX + r * Math.cos(a), CY + r * Math.sin(a)]; }
  function angOfWeek(w){ return -Math.PI / 2 + w / WEEKS * Math.PI * 2; }
  function sector(r1, r2, a1, a2){
    var p1 = pol(r1, a1), p2 = pol(r2, a1), p3 = pol(r2, a2), p4 = pol(r1, a2), lg = (a2 - a1) > Math.PI ? 1 : 0;
    return 'M' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) + 'L' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2) + 'A' + r2 + ' ' + r2 + ' 0 ' + lg + ' 1 ' + p3[0].toFixed(2) + ' ' + p3[1].toFixed(2) + 'L' + p4[0].toFixed(2) + ' ' + p4[1].toFixed(2) + 'A' + r1 + ' ' + r1 + ' 0 ' + lg + ' 0 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) + 'Z';
  }
  function el(t, a, p){ var e = document.createElementNS(NS, t); for(var k in a) e.setAttribute(k, a[k]); (p || svg).appendChild(e); return e; }

  el('circle', { cx:CX, cy:CY, r:R0 + RW * 7 + 6, fill:'none', stroke:'#e3e6ef', 'class':'ringbg', 'stroke-width':1 });
  var monthG = el('g', {}), cellsG = el('g', { id:'cells' }), overG = el('g', {});
  var cells = [];
  for(i = 0; i < N; i++){
    var wd2 = (dateOf(i).getDay() + 6) % 7, w = Math.floor((i + off) / 7);
    var a1 = angOfWeek(w) + .004, a2 = angOfWeek(w + 1) - .004;
    var p = el('path', { d:sector(R0 + wd2 * RW, R0 + (wd2 + 1) * RW, a1, a2), 'class':'cell', 'data-i':i }, cellsG);
    p.style.animationDelay = reduce ? '0s' : (i * 1.5) + 'ms';
    cells.push({ el:p, w:w, wd:wd2, m:dateOf(i).getMonth() });
  }
  // month separators + labels
  var mlabs = [];
  for(var mm = 0; mm < 12; mm++){
    var fi = idxOf(mm + 1, 1), fw = (fi + off) / 7, a = -Math.PI / 2 + fw / WEEKS * Math.PI * 2;
    var q1 = pol(R0 - 8, a), q2 = pol(R0 + RW * 7 + 22, a);
    el('line', { x1:q1[0], y1:q1[1], x2:q2[0], y2:q2[1], 'class':'mline' }, monthG);
    var lastI = mm === 11 ? N : idxOf(mm + 2, 1), midW = ((fi + lastI) / 2 + off) / 7, am = -Math.PI / 2 + midW / WEEKS * Math.PI * 2, lp = pol(R0 + RW * 7 + 40, am);
    var t = el('text', { x:lp[0].toFixed(1), y:lp[1].toFixed(1), 'class':'mlab' }, monthG); t.textContent = (mm + 1) + '月'; mlabs.push(t);
  }
  // event pins
  EVENTS.forEach(function(e){ if(!e[2]) return; var ii = idxOf(e[0], e[1]), c = cells[ii], am2 = angOfWeek(c.w + .5), pp = pol(R0 + RW * 7 + 12, am2); el('circle', { cx:pp[0].toFixed(1), cy:pp[1].toFixed(1), r:3.2, 'class':'pin' }, overG); });
  var spoke = el('line', { 'class':'spoke' }, overG);
  var hi = el('path', { fill:'none', stroke:'#1c2340', 'stroke-width':3, 'pointer-events':'none', style:'opacity:0' }, overG);

  /* ---------- colour + panel ---------- */
  var cD = document.getElementById('cD'), cV = document.getElementById('cV'), cU = document.getElementById('cU'), cN = document.getElementById('cN');
  function paint(){
    var arr = DATA[key];
    cells.forEach(function(c, i){ c.el.style.fill = 'var(--s' + bucket(arr[i]) + ')'; });
    var M = META[key], ticks = document.getElementById('ticks');
    if(ticks) ticks.innerHTML = [M.stops[0], M.stops[4], M.stops[8]].map(function(v){ return '<span>' + M.fmt(v) + (v === M.stops[8] ? '+' : '') + '</span>'; }).join('');
    var ll = document.getElementById('legLbl'); if(ll) ll.textContent = '色階 · ' + M.lbl;
    var sum = 0, best = 0, worst = 0; arr.forEach(function(v, i){ sum += v; if(v > arr[best]) best = i; if(v < arr[worst]) worst = i; });
    var avg = sum / N;
    // streak of 'good' days
    var goodT = key === 'steps' ? 8000 : key === 'sleep' ? 7 : 2, streak = 0, cur = 0, good = 0;
    arr.forEach(function(v){ var ok = key === 'coffee' ? v <= goodT : v >= goodT; if(ok){ cur++; good++; if(cur > streak) streak = cur; } else cur = 0; });
    var st = document.getElementById('stats');
    var goodLbl = key === 'steps' ? '≥ 8,000 步的日子' : key === 'sleep' ? '睡滿 7 小時的日子' : '咖啡 ≤ 2 杯的日子';
    if(st) st.innerHTML =
      '<div class="stat"><b>' + (key === 'steps' ? (sum / 1e6).toFixed(2) + 'M' : key === 'sleep' ? Math.round(sum).toLocaleString('en-US') : sum) + '</b><span>全年總計（' + M.unit + '）</span></div>' +
      '<div class="stat"><b>' + M.fmt(key === 'coffee' ? Math.round(avg * 10) / 10 : key === 'steps' ? Math.round(avg) : avg) + '</b><span>' + M.avgLbl + '</span></div>' +
      '<div class="stat"><b>' + M.fmt(arr[best]) + '</b><span>最高 · ' + md(best) + '</span></div>' +
      '<div class="stat"><b>' + M.fmt(arr[worst]) + '</b><span>最低 · ' + md(worst) + '</span></div>' +
      '<div class="stat"><b>' + good + '</b><span>' + goodLbl + '</span></div>' +
      '<div class="stat"><b>' + streak + '</b><span>最長連續（天）</span></div>';
    var wk = document.getElementById('wk');
    if(wk){
      var sums = [0,0,0,0,0,0,0], cnt = [0,0,0,0,0,0,0]; cells.forEach(function(c, i){ sums[c.wd] += arr[i]; cnt[c.wd]++; });
      var avgs = sums.map(function(s, k){ return s / cnt[k]; }), mx = Math.max.apply(null, avgs);
      if(!wk.children.length){ for(var k = 0; k < 7; k++){ var dv = document.createElement('div'); dv.innerHTML = '<span>' + DOWN[k] + '</span>'; wk.appendChild(dv); } }
      Array.prototype.forEach.call(wk.children, function(dv, k){ dv.style.height = (avgs[k] / mx * 100).toFixed(1) + '%'; dv.title = '週' + DOWN[k] + ' 平均 ' + M.fmt(key === 'steps' ? Math.round(avgs[k]) : Math.round(avgs[k] * 10) / 10); });
    }
    overall();
    if(active >= 0) select(active, true);
  }
  function overall(){
    var M = META[key], arr = DATA[key], sum = arr.reduce(function(a, b){ return a + b; }, 0), avg = sum / N;
    if(cD) cD.textContent = '2025 全年';
    if(cV) cV.textContent = M.fmt(key === 'steps' ? Math.round(avg) : Math.round(avg * 10) / 10);
    if(cU) cU.textContent = M.avgLbl + '（' + M.unit + '）';
    if(cN) cN.textContent = key === 'steps' ? '大約是從台北走到屏東，再走回來兩次' : key === 'sleep' ? '還算及格，除了六月那一週' : '咖啡因含量：足以讓一匹馬寫完專案';
  }

  /* ---------- notes list ---------- */
  var notes = document.getElementById('notes');
  EVENTS.filter(function(e){ return e[2]; }).forEach(function(e){
    var li = document.createElement('li'), b = document.createElement('button'); b.type = 'button';
    b.innerHTML = '<time>' + e[0] + '/' + e[1] + '</time><span></span>'; b.lastChild.textContent = e[2];
    b.addEventListener('click', function(){ select(idxOf(e[0], e[1])); });
    li.appendChild(b); notes && notes.appendChild(li);
  });

  /* ---------- selection / radial highlight ---------- */
  var active = -1;
  function select(i, keep){
    if(i < 0 || i >= N) return;
    active = i; var c = cells[i];
    cellsG.classList.add('dim');
    cells.forEach(function(o){ var rel = o.w === c.w || o.wd === c.wd; o.el.classList.toggle('rel', rel); o.el.classList.toggle('act', o === c); });
    hi.setAttribute('d', c.el.getAttribute('d')); hi.style.opacity = 1;
    var a = angOfWeek(c.w + .5), s1 = pol(R0 - 14, a), s2 = pol(R0 + RW * 7 + 26, a);
    spoke.setAttribute('x1', s1[0]); spoke.setAttribute('y1', s1[1]); spoke.setAttribute('x2', s2[0]); spoke.setAttribute('y2', s2[1]); spoke.classList.add('on');
    mlabs.forEach(function(t, k){ t.classList.toggle('on', k === c.m); });
    var wk = document.getElementById('wk'); if(wk) Array.prototype.forEach.call(wk.children, function(dv, k){ dv.classList.toggle('on', k === c.wd); });
    var M = META[key], d = dateOf(i), v = DATA[key][i];
    if(cD) cD.textContent = (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 週' + DOWN[c.wd];
    if(cV) cV.textContent = M.fmt(v);
    if(cU) cU.textContent = M.unit + ' · 第 ' + (i + 1) + ' 天';
    if(cN) cN.textContent = ev[i] && ev[i][2] ? ev[i][2] : (ev[i] ? '（同一段日子）' : '');
  }
  function clear(){
    active = -1; cellsG.classList.remove('dim');
    cells.forEach(function(o){ o.el.classList.remove('rel', 'act'); });
    spoke.classList.remove('on'); hi.style.opacity = 0; mlabs.forEach(function(t){ t.classList.remove('on'); });
    var wk = document.getElementById('wk'); if(wk) Array.prototype.forEach.call(wk.children, function(dv){ dv.classList.remove('on'); });
    overall();
  }
  svg.addEventListener('pointerover', function(e){ var t = e.target; if(t && t.getAttribute && t.getAttribute('data-i') !== null) select(+t.getAttribute('data-i')); });
  svg.addEventListener('pointerdown', function(e){ var t = e.target; if(t && t.getAttribute && t.getAttribute('data-i') !== null) select(+t.getAttribute('data-i')); });
  svg.addEventListener('pointerleave', function(e){ if(e.pointerType === 'mouse') clear(); });
  document.addEventListener('keydown', function(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    var map = { ArrowRight:1, ArrowLeft:-1, ArrowDown:7, ArrowUp:-7 };
    if(map[e.key] !== undefined){ e.preventDefault(); var base = active < 0 ? (e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? N : -1) : active; select(Math.max(0, Math.min(N - 1, base + map[e.key]))); }
    else if(e.key === 'Escape') clear();
  });
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.addEventListener('click', function(){
      key = b.getAttribute('data-k');
      document.querySelectorAll('.tabs button').forEach(function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      paint();
    });
  });
  paint();
})();
</script>
