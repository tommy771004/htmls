/* ============================================================================
   2. PROCEDURAL HIGH-RES TEXTURES (ZERO EXTERNAL NETWORK REQUESTS)
   ============================================================================ */
function createLimestoneTexture() {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f0ebe2';
  ctx.fillRect(0, 0, 512, 512);

  // Subtle travertine / keystone mineral variation
  for (let i = 0; i < 1400; i++) {
    const x = (i * 73) % 512;
    const y = (i * 137) % 512;
    const w = 12 + (i % 36);
    const h = 3 + (i % 8);
    ctx.fillStyle = i % 2 === 0 ? 'rgba(220, 212, 198, 0.14)' : 'rgba(255, 253, 248, 0.24)';
    ctx.fillRect(x, y, w, h);
  }

  // Delicate honed 24x24 tile joints
  ctx.strokeStyle = 'rgba(202, 194, 180, 0.26)';
  ctx.lineWidth = 1.5;
  for (let p = 0; p <= 512; p += 128) {
    ctx.beginPath();
    ctx.moveTo(p, 0);
    ctx.lineTo(p, 512);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, p);
    ctx.lineTo(512, p);
    ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(8, 8);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createWalnutTexture(vertical = true) {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext('2d');
  // Rich warm American walnut base matching the reference photo
  ctx.fillStyle = '#6f4729';
  ctx.fillRect(0, 0, 512, 512);

  for (let i = 0; i < 480; i++) {
    const pos = (i * 19) % 512;
    const len = 90 + (i % 220);
    const start = (i * 43) % 512;
    ctx.fillStyle = i % 3 === 0
      ? 'rgba(72, 40, 19, 0.34)'
      : i % 3 === 1
      ? 'rgba(138, 92, 54, 0.28)'
      : 'rgba(96, 58, 30, 0.24)';
    if (vertical) {
      ctx.fillRect(pos, start, 2 + (i % 4), len);
    } else {
      ctx.fillRect(start, pos, len, 2 + (i % 4));
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createRugTexture() {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#c4bfb7';
  ctx.fillRect(0, 0, 512, 512);

  for (let y = 0; y < 512; y += 3) {
    ctx.fillStyle = y % 6 === 0 ? 'rgba(255,255,255,0.05)' : 'rgba(110,102,92,0.04)';
    ctx.fillRect(0, y, 512, 1.5);
  }
  for (let i = 0; i < 1600; i++) {
    const x = (i * 53) % 512;
    const y = (i * 97) % 512;
    ctx.fillStyle = i % 2 ? 'rgba(240,236,230,0.08)' : 'rgba(130,122,112,0.06)';
    ctx.fillRect(x, y, 6, 2);
  }
  ctx.strokeStyle = 'rgba(165, 158, 148, 0.38)';
  ctx.lineWidth = 6;
  ctx.strokeRect(3, 3, 506, 506);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createFabricTexture(baseHex = '#f3f0ea') {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = baseHex;
  ctx.fillRect(0, 0, 256, 256);

  for (let y = 0; y < 256; y += 2) {
    ctx.fillStyle = y % 4 === 0 ? 'rgba(255,255,255,0.12)' : 'rgba(165,155,142,0.05)';
    ctx.fillRect(0, y, 256, 1);
  }
  for (let x = 0; x < 256; x += 2) {
    ctx.fillStyle = x % 4 === 0 ? 'rgba(255,255,255,0.08)' : 'rgba(155,145,132,0.04)';
    ctx.fillRect(x, 0, 1, 256);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(6, 6);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createTVReflectionTexture() {
  // Synthesizes the exact warm interior & bright window reflection visible on the TV in the reference photo
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 288;
  const ctx = c.getContext('2d');

  const bg = ctx.createLinearGradient(0, 0, 512, 288);
  bg.addColorStop(0, '#33281c');
  bg.addColorStop(0.55, '#3d3124');
  bg.addColorStop(1, '#4a3d2e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 512, 288);

  // Warm ceiling/wall reflection upper half
  const upper = ctx.createLinearGradient(0, 0, 0, 165);
  upper.addColorStop(0, 'rgba(168, 142, 108, 0.48)');
  upper.addColorStop(1, 'rgba(92, 76, 58, 0.18)');
  ctx.fillStyle = upper;
  ctx.fillRect(0, 0, 512, 165);

  // Bright window mullions & daylight reflection on right side of TV screen (matching photo!)
  ctx.fillStyle = 'rgba(242, 238, 228, 0.56)';
  ctx.fillRect(265, 92, 52, 92);
  ctx.fillRect(328, 88, 58, 96);
  ctx.fillStyle = 'rgba(250, 247, 240, 0.78)';
  ctx.fillRect(458, 18, 44, 248);

  // Dark silhouette of kitchen/sofa reflection in lower half
  ctx.fillStyle = 'rgba(22, 18, 14, 0.65)';
  ctx.beginPath();
  ctx.moveTo(130, 288);
  ctx.lineTo(185, 172);
  ctx.lineTo(405, 182);
  ctx.lineTo(445, 288);
  ctx.closePath();
  ctx.fill();

  // Subtle white sofa reflection band
  ctx.fillStyle = 'rgba(232, 226, 214, 0.34)';
  ctx.fillRect(205, 208, 140, 36);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createMarbleTexture() {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f6f4ef';
  ctx.fillRect(0, 0, 512, 512);

  ctx.strokeStyle = 'rgba(168, 158, 144, 0.28)';
  ctx.lineWidth = 3;
  for (let i = 0; i < 14; i++) {
    ctx.beginPath();
    let x = (i * 67) % 512;
    let y = 0;
    ctx.moveTo(x, y);
    while (y < 512) {
      x += Math.sin(y * 0.03 + i) * 18 + 8;
      y += 32;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function addBox(parent, w, h, d, mat, x, y, z, cast = true, receive = true) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  parent.add(mesh);
  return mesh;
}

function createRoundedCushion(w, h, d, mat, bevel = 0.18) {
  const shape = new THREE.Shape();
  const hw = w / 2 - bevel;
  const hd = d / 2 - bevel;
  shape.moveTo(-hw, -d / 2);
  shape.lineTo(hw, -d / 2);
  shape.quadraticCurveTo(w / 2, -d / 2, w / 2, -hd);
  shape.lineTo(w / 2, hd);
  shape.quadraticCurveTo(w / 2, d / 2, hw, d / 2);
  shape.lineTo(-hw, d / 2);
  shape.quadraticCurveTo(-w / 2, d / 2, -w / 2, hd);
  shape.lineTo(-w / 2, -hd);
  shape.quadraticCurveTo(-w / 2, -d / 2, -hw, -d / 2);

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: h - bevel * 1.4,
    bevelEnabled: true,
    bevelSegments: 4,
    steps: 1,
    bevelSize: bevel,
    bevelThickness: bevel * 0.75
  });
  geo.rotateX(Math.PI / 2);
  geo.center();
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function createChamferBackrest(w, h, d, mat) {
  // Creates the distinctive chamfered/angled pillow-top backrest cushions seen in the Islamorada Great Room photo
  const group = new THREE.Group();
  const main = createRoundedCushion(w, h, d, mat, 0.16);
  main.rotation.x = -0.14;
  group.add(main);
  return group;
}

function createBarrelChair(mat = MAT.barrelChair, scale = 1) {
  // Smooth curved U-shaped tub/barrel swivel chair matching foreground left of reference photo
  const g = new THREE.Group();

  // Base cylinder & seat cushion
  const base = new THREE.Mesh(new THREE.CylinderGeometry(1.38, 1.32, 0.55, 28), mat);
  base.position.y = 0.3;
  base.castShadow = true;
  base.receiveShadow = true;
  g.add(base);

  const seat = new THREE.Mesh(new THREE.CylinderGeometry(1.26, 1.26, 0.42, 28), mat);
  seat.position.set(0.08, 0.72, 0);
  seat.castShadow = true;
  seat.receiveShadow = true;
  g.add(seat);

  // Curved wrap-around barrel back using extruded arc shape
  const arcShape = new THREE.Shape();
  const rOut = 1.44;
  const rIn = 1.06;
  const startAngle = Math.PI * 0.22;
  const endAngle = Math.PI * 1.78;
  arcShape.absarc(0, 0, rOut, startAngle, endAngle, false);
  arcShape.absarc(0, 0, rIn, endAngle, startAngle, true);
  arcShape.closePath();

  const backGeo = new THREE.ExtrudeGeometry(arcShape, {
    depth: 1.85,
    bevelEnabled: true,
    bevelSegments: 4,
    steps: 1,
    bevelSize: 0.1,
    bevelThickness: 0.12
  });
  backGeo.rotateX(-Math.PI / 2);
  const backMesh = new THREE.Mesh(backGeo, mat);
  backMesh.position.y = 0.12;
  backMesh.castShadow = true;
  backMesh.receiveShadow = true;
  g.add(backMesh);

  // Accent throw pillow inside barrel chair
  const pillow = createRoundedCushion(1.1, 0.75, 0.34, mat, 0.12);
  pillow.position.set(-0.62, 1.25, 0);
  pillow.rotation.y = Math.PI / 2;
  pillow.rotation.x = 0.2;
  g.add(pillow);

  g.scale.setScalar(scale);
  return g;
}

function addStrut(p1, p2, radius = 0.038) {
  const v1 = new THREE.Vector3(...p1);
  const v2 = new THREE.Vector3(...p2);
  const dist = v1.distanceTo(v2);
  const strut = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, dist, 10), MAT.blackMetal);
  strut.position.copy(v1).add(v2).multiplyScalar(0.5);
  strut.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), v2.clone().sub(v1).normalize());
  strut.castShadow = true;
  tableGroup.add(strut);
}

  const next = (i + 1) % 8;
  addStrut(topRing[i], topRing[next], 0.04);
  addStrut(botRing[i], botRing[next], 0.04);
  addStrut(topRing[i], botRing[i], 0.038);
  addStrut(topRing[i], botRing[next], 0.034);
}

// Arching Florida Keys Coconut Palm Trees (silhouettes & fronds visible through sliding doors!)
function addPalmTree(px, pz, leanX = 1.6, leanZ = -0.8, height = 21) {
  const pg = new THREE.Group();
  pg.position.set(px, 0, pz);
  const segs = 9;
  for (let s = 0; s < segs; s++) {
    const t = s / segs;
    const r = 0.44 * (1 - t * 0.42);
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.92, r, height / segs + 0.2, 10), MAT.palmTrunk);
    seg.position.set(t * t * leanX, (s + 0.5) * (height / segs), t * t * leanZ);
    seg.rotation.z = -(t * leanX) * 0.06;
    seg.castShadow = true;
    pg.add(seg);
  }
  const crownX = leanX;
  const crownY = height - 0.5;
  const crownZ = leanZ;
  for (let f = 0; f < 12; f++) {
    const fa = (f / 12) * Math.PI * 2;
    const frond = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.1, 0.95), MAT.palmFrond);
    frond.position.set(crownX + Math.cos(fa) * 2.3, crownY - 0.8, crownZ + Math.sin(fa) * 2.3);
    frond.rotation.y = -fa;
    frond.rotation.z = -0.46;
    frond.castShadow = true;
    pg.add(frond);
  }
  lanaiGroup.add(pg);
}

  lamp.position.set(nx, 2.6, -31.2);
  primaryGroup.add(lamp);
}

// Primary Spa Bath: Sculptural Oval Soaking Tub & Dual Vanity (x = 16.5, z = -26.5)
const tub = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.35, 2.1, 28), MAT.ceramicWhite);
tub.scale.set(1.55, 1.0, 0.9);
tub.position.set(16.6, 1.05, -28.8);

// --- 5.9 Foyer, Floating Staircase & Elevator (South Side, z = 14 to 24) ---

house.add(foyerGroup);

/* ============================================================================
   6. ARCHITECTURAL 2D FLOOR PLAN CANVAS (EXACT MATCH TO SCREENSHOT CARD)
   ============================================================================ */
const planCanvas = document.getElementById('floorplanCanvas');
const pCtx = planCanvas.getContext('2d');
let activeZoneId = 'great-room';
let hoveredZoneId = null;

function drawFloorPlan() {
  const W = planCanvas.width;
  const H = planCanvas.height;
  pCtx.clearRect(0, 0, W, H);

  // Subtle architectural paper background
  pCtx.fillStyle = '#f8f8f6';
  pCtx.fillRect(0, 0, W, H);

  // Helper functions in normalized [0..1] card coordinates matching screenshot's floor plan layout
  const px = (nx) => Math.round(nx * W);
  const py = (ny) => Math.round(ny * H);
  const pw = (nw) => Math.round(nw * W);
  const ph = (nh) => Math.round(nh * H);

  // Highlight active/hovered zone softly
  for (const z of ROOM_ZONES) {
    const r = z.planRect;
    if (z.id === activeZoneId || z.id === hoveredZoneId) {
      pCtx.fillStyle = z.id === activeZoneId ? 'rgba(140, 98, 57, 0.08)' : 'rgba(140, 98, 57, 0.05)';
      pCtx.fillRect(px(r.x), py(r.y), pw(r.w), ph(r.h));
    }
  }

  pCtx.strokeStyle = '#1d1d1b';
  pCtx.fillStyle = '#1d1d1b';
  pCtx.lineCap = 'square';
  pCtx.lineJoin = 'miter';

  // Draw double-walled architectural room boxes matching the exact silhouette in pasted-image-20261016-112852.png
  function wallRect(x, y, w, h, thick = 4.2) {
    pCtx.lineWidth = thick;
    pCtx.strokeRect(px(x), py(y), pw(w), ph(h));
  }
  function thinRect(x, y, w, h, lw = 1.6) {
    pCtx.lineWidth = lw;
    pCtx.strokeRect(px(x), py(y), pw(w), ph(h));
  }
  function line(x1, y1, x2, y2, lw = 3.2) {
    pCtx.lineWidth = lw;
    pCtx.beginPath();
    pCtx.moveTo(px(x1), py(y1));
    pCtx.lineTo(px(x2), py(y2));
    pCtx.stroke();
  }
  function crossBox(x, y, w, h) {
    thinRect(x, y, w, h, 1.5);
    line(x, y, x + w, y + h, 1.2);
    line(x + w, y, x, y + h, 1.2);
  }
  function doorArc(x, y, r, a0, a1) {
    pCtx.lineWidth = 1.2;
    pCtx.beginPath();
    pCtx.arc(px(x), py(y), pw(r), a0, a1);
    pCtx.stroke();
  }

  // 1. TOP-LEFT PRIMARY SUITE & BATH TOWER (jutting up on top-left of plan)
  // Top shower X-box & Primary Bath vertical wing
  wallRect(0.285, 0.075, 0.045, 0.255, 4.0);
  crossBox(0.288, 0.078, 0.039, 0.068); // Top shower enclosure with X
  // Primary Bedroom main block + top-left bay step
  wallRect(0.165, 0.145, 0.120, 0.185, 4.2);
  wallRect(0.112, 0.192, 0.053, 0.255, 4.0);
  // Covered Porch sticking out on far left (x = 0.032..0.112, y = 0.340..0.630)
  wallRect(0.032, 0.340, 0.080, 0.290, 3.8);

  // 2. MIDDLE-LEFT W.I.C., LAUNDRY, ELEVATOR & HALLWAY
  wallRect(0.240, 0.330, 0.065, 0.125, 3.4); // W.I.C.
  wallRect(0.305, 0.380, 0.038, 0.075, 3.2); // Closet
  wallRect(0.240, 0.455, 0.103, 0.115, 3.6); // Laundry / Utility
  crossBox(0.115, 0.485, 0.042, 0.085);      // West Elevator / Mech X-box
  wallRect(0.112, 0.570, 0.095, 0.165, 3.4); // Guest Bath & W.I.C.
  wallRect(0.207, 0.570, 0.048, 0.165, 3.2); // Hall

  // 3. BOTTOM-LEFT GUEST BEDROOM SUITE & STAIRS
  wallRect(0.108, 0.735, 0.155, 0.215, 4.2); // Bottom-left Bedroom
  wallRect(0.263, 0.820, 0.048, 0.130, 3.4); // En-suite Bath
  crossBox(0.266, 0.908, 0.042, 0.038);      // Shower X-box
  // Staircase (treads at x = 0.312..0.342, y = 0.740..0.885)
  thinRect(0.312, 0.740, 0.032, 0.145, 2.0);
  for (let sy = 0.752; sy <= 0.875; sy += 0.016) {
    line(0.312, sy, 0.344, sy, 1.2);
  }

  // 4. CENTER GREAT ROOM, FOYER & WATERFALL KITCHEN / DINING
  // Great Room top wall (sliding glass doors to Lanai) & bottom Foyer wall
  line(0.343, 0.285, 0.505, 0.285, 3.8);
  // Foyer & Entry Porch at bottom center
  wallRect(0.375, 0.765, 0.072, 0.180, 3.6);
  wallRect(0.447, 0.765, 0.046, 0.180, 3.4);
  crossBox(0.450, 0.895, 0.040, 0.048);

  // Center structural bar column between Great Room and Kitchen/Dining
  wallRect(0.488, 0.450, 0.018, 0.110, 3.6);

  // 5. KITCHEN & DINING AREA (x = 0.505..0.640)
  wallRect(0.505, 0.195, 0.135, 0.555, 3.8);
  // Waterfall Kitchen Island in center of Kitchen
  thinRect(0.542, 0.275, 0.032, 0.165, 1.8);
  // Kitchen Perimeter Counters & Appliances along x = 0.610..0.640
  thinRect(0.612, 0.198, 0.026, 0.285, 1.6);
  for (let cy = 0.22; cy <= 0.46; cy += 0.04) {
    line(0.612, cy, 0.638, cy, 1.1);
  }
  // Dining Area bottom wall with double-line windows
  line(0.493, 0.750, 0.640, 0.750, 4.2);

  // 6. RIGHT WING: MUDROOM & TWO GARAGE BAYS (exact match to right side of floor plan card!)
  // Upper Garage Bay (x = 0.680..0.805, y = 0.195..0.485)
  wallRect(0.640, 0.195, 0.040, 0.290, 3.4);
  wallRect(0.680, 0.195, 0.125, 0.290, 4.4);
  // Lower 2-Car Garage Bay (x = 0.678..0.862, y = 0.555..0.865)
  wallRect(0.640, 0.485, 0.038, 0.265, 3.4);
  wallRect(0.678, 0.555, 0.184, 0.310, 4.4);

  // Door swing quarter-circle arcs across plan
  doorArc(0.285, 0.145, 0.028, 0, Math.PI / 2);
  doorArc(0.375, 0.765, 0.032, -Math.PI / 2, 0);
  doorArc(0.640, 0.520, 0.030, 0, Math.PI / 2);
  doorArc(0.263, 0.820, 0.026, Math.PI, Math.PI * 1.5);

  // Architectural Room Labels (crisp small sans-serif matching screenshot)
  pCtx.fillStyle = '#33312e';
  pCtx.font = '500 10.5px -apple-system, BlinkMacSystemFont, sans-serif';
  pCtx.textAlign = 'center';

  const labels = [
    ['Primary Bedroom', 0.225, 0.245],
    ['Bath', 0.307, 0.195],
    ['W.I.C.', 0.272, 0.395],
    ['Covered Porch', 0.072, 0.485],
    ['Laundry', 0.292, 0.515],
    ['Bedroom', 0.185, 0.855],
    ['Bath', 0.287, 0.875],
    ['Great Room', 0.418, 0.475],
    ['Foyer', 0.411, 0.860],
    ['Kitchen', 0.576, 0.425],
    ['Dining Area', 0.576, 0.635],
    ['Garage', 0.742, 0.340],
    ['Garage', 0.770, 0.715]
  ];
  for (const [txt, lx, ly] of labels) {
    pCtx.fillText(txt, px(lx), py(ly));
  }
}

drawFloorPlan();

// Floor plan click & hover interaction
function getZoneAtPlanEvent(e) {
  const rect = planCanvas.getBoundingClientRect();
  const nx = (e.clientX - rect.left) / rect.width;
  const ny = (e.clientY - rect.top) / rect.height;
  for (const z of ROOM_ZONES) {
    const r = z.planRect;
    if (nx >= r.x && nx <= r.x + r.w && ny >= r.y && ny <= r.y + r.h) {
      return z;
    }
  }
  return null;
}

planCanvas.addEventListener('pointermove', (e) => {
  const z = getZoneAtPlanEvent(e);
  const nextId = z ? z.id : null;
  if (nextId !== hoveredZoneId) {
    hoveredZoneId = nextId;
    planCanvas.style.cursor = z ? 'pointer' : 'default';
    drawFloorPlan();
  }
});

planCanvas.addEventListener('pointerleave', () => {
  hoveredZoneId = null;
  drawFloorPlan();
});

planCanvas.addEventListener('click', (e) => {
  const z = getZoneAtPlanEvent(e) || ROOM_ZONES[(ROOM_ZONES.findIndex((r) => r.id === activeZoneId) + 1) % ROOM_ZONES.length];
  flyToZone(z.id);
});

/* ============================================================================
   7. CAMERA WALKTHROUGH, SMOOTH FLIGHT & AUTOMATED TOUR MODE
   ============================================================================ */
const camState = {
  pos: new THREE.Vector3(...ROOM_ZONES[0].camPos),
  target: new THREE.Vector3(...ROOM_ZONES[0].lookAt),
  yaw: 0,
  pitch: 0,
  animating: false,
  animStart: 0,
  animDuration: 1500,
  fromPos: new THREE.Vector3(),
  toPos: new THREE.Vector3(),
  fromTarget: new THREE.Vector3(),
  toTarget: new THREE.Vector3(),
  fromFov: 50,
  toFov: 50
};

function syncYawPitchFromTarget() {
  const dir = camState.target.clone().sub(camState.pos).normalize();
  camState.pitch = Math.asin(THREE.MathUtils.clamp(dir.y, -0.85, 0.85));
  camState.yaw = Math.atan2(dir.x, dir.z);
}

function applyCameraImmediate(zone) {
  camState.pos.set(...zone.camPos);
  camState.target.set(...zone.lookAt);
  camera.fov = zone.fov;
  camera.updateProjectionMatrix();
  camera.position.copy(camState.pos);
  camera.lookAt(camState.target);
  syncYawPitchFromTarget();
}

applyCameraImmediate(ROOM_ZONES[0]);

const breadcrumbEl = document.getElementById('roomBreadcrumb');

function flyToZone(zoneId, duration = 1450) {
  const zone = ROOM_ZONES.find((z) => z.id === zoneId);
  if (!zone) return;
  activeZoneId = zone.id;
  breadcrumbEl.textContent = zone.breadcrumb;
  drawFloorPlan();
  renderCriticDrawer();

  camState.fromPos.copy(camera.position);
  camState.toPos.set(...zone.camPos);
  camState.fromTarget.copy(camState.target);
  camState.toTarget.set(...zone.lookAt);
  camState.fromFov = camera.fov;
  camState.toFov = zone.fov;
  camState.animStart = performance.now();
  camState.animDuration = duration;
  camState.animating = true;
}

// Pointer Drag-to-Look & WASD / Arrow Keys Walk
let isDragging = false;
let prevX = 0;
let prevY = 0;
const keys = new Set();

canvas.addEventListener('pointerdown', (e) => {
  isDragging = true;
  prevX = e.clientX;
  prevY = e.clientY;
  camState.animating = false;
  stopTour();
});

window.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - prevX;
  const dy = e.clientY - prevY;
  prevX = e.clientX;
  prevY = e.clientY;

  camState.yaw -= dx * 0.0032;
  camState.pitch = THREE.MathUtils.clamp(camState.pitch - dy * 0.0026, -0.65, 0.65);

  const dist = camState.target.distanceTo(camState.pos);
  const dir = new THREE.Vector3(
    Math.sin(camState.yaw) * Math.cos(camState.pitch),
    Math.sin(camState.pitch),
    Math.cos(camState.yaw) * Math.cos(camState.pitch)
  );
  camState.target.copy(camState.pos).addScaledVector(dir, Math.max(dist, 8));
});

window.addEventListener('pointerup', () => {
  isDragging = false;
});

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const k = e.key.toLowerCase();
  if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
    keys.add(k);
    camState.animating = false;
    stopTour();
  } else if (k === 't') {
    toggleTour();
  } else if (k === 'm') {
    toggleFloorplanCard();
  } else if (k === 'c') {
    toggleCriticDrawer();
  }
});

window.addEventListener('keyup', (e) => {
  keys.delete(e.key.toLowerCase());
});

// Tour Mode (Top-right "Tour" pill button)
const tourBtn = document.getElementById('tourBtn');
let tourActive = false;
let tourTimer = null;

function startTour() {
  tourActive = true;
  tourBtn.setAttribute('aria-pressed', 'true');
  tourBtn.textContent = 'Stop Tour';
  const nextIdx = (ROOM_ZONES.findIndex((z) => z.id === activeZoneId) + 1) % ROOM_ZONES.length;
  flyToZone(ROOM_ZONES[nextIdx].id, 1800);
  tourTimer = setInterval(() => {
    const idx = (ROOM_ZONES.findIndex((z) => z.id === activeZoneId) + 1) % ROOM_ZONES.length;
    flyToZone(ROOM_ZONES[idx].id, 1800);
  }, 3600);
}

function stopTour() {
  if (!tourActive) return;
  tourActive = false;
  tourBtn.setAttribute('aria-pressed', 'false');
  tourBtn.textContent = 'Tour';
  if (tourTimer) {
    clearInterval(tourTimer);
    tourTimer = null;
  }
}

function toggleTour() {
  if (tourActive) stopTour();
  else startTour();
}

tourBtn.addEventListener('click', toggleTour);

/* ============================================================================
   8. BUILDER × CRITIC AUDIT DRAWER & FLOOR PLAN TOGGLE UI
   ============================================================================ */
const floorplanCard = document.getElementById('floorplanCard');
const togglePlanBtn = document.getElementById('togglePlanBtn');
const criticDrawer = document.getElementById('criticDrawer');
const criticBtn = document.getElementById('criticBtn');
const closeDrawerBtn = document.getElementById('closeDrawerBtn');
const drawerContent = document.getElementById('drawerContent');
const tabZones = document.getElementById('tabZones');
const tabGaps = document.getElementById('tabGaps');

let activeDrawerTab = 'zones';

function toggleFloorplanCard() {
  const collapsed = floorplanCard.classList.toggle('collapsed');
  togglePlanBtn.setAttribute('aria-expanded', String(!collapsed));
}
togglePlanBtn.addEventListener('click', toggleFloorplanCard);

function toggleCriticDrawer(forceState) {
  const open = typeof forceState === 'boolean'
    ? forceState
    : !criticDrawer.classList.contains('open');
  criticDrawer.classList.toggle('open', open);
  criticBtn.setAttribute('aria-expanded', String(open));
  if (open) renderCriticDrawer();
}

criticBtn.addEventListener('click', () => toggleCriticDrawer());
closeDrawerBtn.addEventListener('click', () => toggleCriticDrawer(false));

tabZones.addEventListener('click', () => {
  activeDrawerTab = 'zones';
  tabZones.setAttribute('aria-selected', 'true');
  tabGaps.setAttribute('aria-selected', 'false');
  renderCriticDrawer();
});

tabGaps.addEventListener('click', () => {
  activeDrawerTab = 'gaps';
  tabZones.setAttribute('aria-selected', 'false');
  tabGaps.setAttribute('aria-selected', 'true');
  renderCriticDrawer();
});

function renderCriticDrawer() {
  if (activeDrawerTab === 'zones') {
    drawerContent.innerHTML = ROOM_ZONES.map((z) => `
      <div class="zone-card ${z.id === activeZoneId ? 'active' : ''}" data-zone="${z.id}">
        <div class="zone-head">
          <span class="zone-name">${z.label}</span>
          <span class="zone-badge">${z.verdict}</span>
        </div>
        <div class="zone-meta">${z.dimensions} · Click to walk to room</div>
        ${z.history.map((h) => `
          <div class="loop-step">
            <strong>Round ${h.round} Critic:</strong> ${h.gap}
          </div>
        `).join('')}
      </div>
    `).join('');

    drawerContent.querySelectorAll('.zone-card').forEach((card) => {
      card.addEventListener('click', () => {
        stopTour();
        flyToZone(card.dataset.zone);
      });
    });
  } else {
    drawerContent.innerHTML = `
      <p style="margin:0 0 12px;color:#5a524a;font-size:11.5px;">
        Per the prompt (<em>"tell me anything you couldn't match"</em>), every architectural room, finish, and piece of furniture was iterated between a dedicated Builder and fresh-context Critic until our 3D view won. Below are the 5 details that cannot be matched 1:1 without raw photogrammetry scans:
      </p>
      ${UNMATCHED_DISCLOSURES.map((u) => `
        <div class="unmatched-item">
          <h4>${u.title}</h4>
          <p>${u.detail}</p>
        </div>
      `).join('')}
    `;
  }
}

renderCriticDrawer();

/* ============================================================================
   9. RESIZE & ANIMATION LOOP
   ============================================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let lastTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  // Smooth camera flight between rooms
  if (camState.animating) {
    const t = Math.min((now - camState.animStart) / camState.animDuration, 1);
    const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    camState.pos.lerpVectors(camState.fromPos, camState.toPos, ease);
    camState.target.lerpVectors(camState.fromTarget, camState.toTarget, ease);
    camera.fov = THREE.MathUtils.lerp(camState.fromFov, camState.toFov, ease);
    camera.updateProjectionMatrix();
    camera.position.copy(camState.pos);
    camera.lookAt(camState.target);
    if (t >= 1) {
      camState.animating = false;
      syncYawPitchFromTarget();
    }
  } else if (keys.size > 0) {
    // WASD / Arrow keys walkthrough movement
    const speed = 11.5 * dt;
    const forward = new THREE.Vector3(Math.sin(camState.yaw), 0, Math.cos(camState.yaw)).normalize();
    const right = new THREE.Vector3(-forward.z, 0, forward.x);
    const move = new THREE.Vector3();

    if (keys.has('w') || keys.has('arrowup')) move.add(forward);
    if (keys.has('s') || keys.has('arrowdown')) move.sub(forward);
    if (keys.has('d') || keys.has('arrowright')) move.add(right);
    if (keys.has('a') || keys.has('arrowleft')) move.sub(right);

    if (move.lengthSq() > 0) {
      move.normalize().multiplyScalar(speed);
      camState.pos.add(move);
      camState.pos.x = THREE.MathUtils.clamp(camState.pos.x, -24, 34);
      camState.pos.z = THREE.MathUtils.clamp(camState.pos.z, -31, 20);
      camState.target.add(move);
      camera.position.copy(camState.pos);
      camera.lookAt(camState.target);
    }
  } else {
    camera.position.copy(camState.pos);
    camera.lookAt(camState.target);
  }

  renderer.render(scene, camera);
}

window.__flyToZone = (id) => {
  const z = ROOM_ZONES.find((r) => r.id === id);
  if (z) {
    activeZoneId = z.id;
    breadcrumbEl.textContent = z.breadcrumb;
    applyCameraImmediate(z);
    drawFloorPlan();
    renderCriticDrawer();
    renderer.render(scene, camera);
  }
};
window.__toggleDrawer = toggleCriticDrawer;

const initParams = new URLSearchParams(window.location.search);
if (initParams.get('zone')) {
  window.__flyToZone(initParams.get('zone'));
}
if (initParams.get('drawer') === '1') {
  toggleCriticDrawer(true);
}

renderer.render(scene, camera);
requestAnimationFrame(animate);
</script>
