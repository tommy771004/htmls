const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const mix=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
const seg=(p,a,b)=>smooth((p-a)/(b-a));
const pulse=(p,a=.12,b=.36,c=.7,d=.95)=>seg(p,a,b)*(1-seg(p,c,d));
const f=n=>Number(n.toFixed(2));
function rect(x,y,w,h,fill=white,r=5,extra=''){return `<rect x="${f(x)}" y="${f(y)}" width="${f(Math.max(0,w))}" height="${f(Math.max(0,h))}" rx="${f(Math.max(0,r))}" fill="${fill}" ${extra}/>`}
function text(x,y,value,size=10,fill=ink,extra=''){return `<text x="${f(x)}" y="${f(y)}" fill="${fill}" font-size="${size}" ${extra}>${value}</text>`}
function path(d,stroke=ink,width=1.5,extra=''){return `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`}
function circle(x,y,r,fill,extra=''){return `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${fill}" ${extra}/>`}
const group=(s,attr='')=>`<g ${attr}>${s}</g>`;

const play=document.getElementById('play'),scrub=document.getElementById('scrub'),clock=document.getElementById('time'),status=document.getElementById('status');
// Only cards in (or near) the viewport are redrawn, and only when their markup actually changed — still frames of a pulse cost nothing.

function sync(){play.textContent=playing?'暫停':'播放';play.setAttribute('aria-pressed',String(playing))}
function tick(now){raf=0;if(!playing||document.hidden)return;const delta=last?Math.min(now-last,80):0;last=now;time=(time+delta*speed)%8000;if(now-lastDraw>=30){lastDraw=now;render()}raf=requestAnimationFrame(tick)}
function schedule(){last=0;lastDraw=0;if(playing&&!document.hidden&&!raf)raf=requestAnimationFrame(tick)}

play.addEventListener('click',()=>{setPlaying(!playing);status.textContent=playing?'16 格動效同步播放中。':'已暫停，可拖曳時間軸觀察轉場。'});
function clearSelection(){cards.forEach(c=>{c.start=null;c.el.classList.remove('selected')})}
