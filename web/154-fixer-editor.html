<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>定影 · FIXER 點陣影像編輯器</title>
<meta name="description" content="定影：瀏覽器裡的點陣影像編輯器。圖層、群組、遮色片與調整圖層，WebGL2 即時合成，PSD 讀寫與 PNG／JPG／WebP 匯出，並能經由本機 MCP 橋接讓 Claude Code 或 Codex 操作開著的文件。">
<meta name="theme-color" content="#1c1b19">
<style>
:root{
  --bg:#1c1b19; --panel:#242320; --raised:#2c2b27; --hover:#35332e; --press:#3e3b35;
  --well:#161513; --paste:#121110; --seam:#131210;
  --ink:#ebe6dd; --ink2:#aca598; --ink3:#878074; --ink4:#57534c;
  --edge:rgba(255,244,222,.055); --edge2:rgba(255,244,222,.10);
  --amber:#d8a767; --amber2:#b98a4f; --amber-dim:rgba(216,167,103,.15); --amber-ink:#1f1a12;
  --red:#dc7a62; --ok:#9fb98a;
  --ui:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  --serif:"Songti TC","STSong","Noto Serif TC","Source Han Serif TC","PMingLiU",serif;
  --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:12px/1.4 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}
.ic.s{width:16px;height:16px}
[hidden]{display:none!important}

#app{display:grid;grid-template-rows:32px 38px minmax(0,1fr) 24px;height:100vh;height:100dvh;background:var(--seam);gap:1px}

/* ── 選單列 ── */
#menubar{display:flex;align-items:center;gap:2px;padding:0 8px 0 12px;background:var(--bg);min-width:0}
.brand{font:700 15px/1 var(--serif);letter-spacing:.02em;margin-right:12px;display:flex;align-items:center;gap:7px;color:var(--ink);white-space:nowrap;flex:none}
.brand svg{width:15px;height:15px}
#menus{display:flex;gap:1px;min-width:0;overflow-x:auto;scrollbar-width:none}
#menus::-webkit-scrollbar{display:none}
.mb{border:0;background:none;padding:0 9px;height:24px;border-radius:4px;color:var(--ink2);white-space:nowrap}
.mb:hover,.mb.open{background:var(--hover);color:var(--ink)}
#agentChip{margin-left:auto;display:flex;align-items:center;gap:7px;border:0;background:none;color:var(--ink3);height:24px;padding:0 8px;border-radius:4px;white-space:nowrap}
#agentChip:hover{background:var(--hover);color:var(--ink2)}
#agentChip i{width:7px;height:7px;border-radius:2px;background:var(--ink4);transform:rotate(45deg)}
#agentChip.on{color:var(--ink2)} #agentChip.on i{background:var(--ok)}
#agentChip.wait i{background:var(--amber)}
#panelBtn{display:none}

.menu{position:fixed;z-index:50;min-width:236px;background:var(--raised);border-radius:7px;padding:5px;box-shadow:0 0 0 1px var(--edge2),0 14px 26px -16px rgba(0,0,0,.85)}
.mi{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:5px 10px;border-radius:4px;color:var(--ink);white-space:nowrap}
.mi kbd{font:inherit;color:var(--ink3);letter-spacing:.04em}
.mi:hover:not(:disabled),.mi.hot{background:var(--press);color:var(--ink)}
.mi:hover:not(:disabled) kbd,.mi.hot kbd{color:var(--ink2)}
.mi:disabled{color:var(--ink4);cursor:default}
.mi.sub::after{content:"";grid-column:2;grid-row:1;width:5px;height:5px;border:solid currentColor;border-width:1.5px 1.5px 0 0;transform:rotate(45deg);justify-self:end;margin-right:2px}
.mi .chk{display:inline-block;width:14px;color:var(--amber)}
.mi:hover .chk{color:inherit}
.msep{height:1px;background:var(--edge2);margin:4px 8px;border-radius:1px}

/* ── 選項列 ── */
#optbar{display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--panel);overflow-x:auto;white-space:nowrap;scrollbar-width:thin;min-width:0}
#optbar .tname{display:flex;align-items:center;gap:7px;color:var(--ink);font-weight:600;padding-right:4px}
#optbar .tname .ic{color:var(--amber)}
.opt{display:flex;align-items:center;gap:7px;color:var(--ink2)}
.opt .val{min-width:34px}
.seg{display:inline-flex;background:var(--well);border-radius:4px;padding:2px;gap:2px}
.seg button{border:0;background:none;color:var(--ink3);height:22px;min-width:24px;padding:0 7px;border-radius:3px;display:grid;place-items:center}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--press);color:var(--ink)}

/* ── 主區 ── */
#main{display:grid;grid-template-columns:46px minmax(0,1fr) 304px;min-height:0;gap:1px;background:var(--seam)}
#toolbar{background:var(--panel);display:flex;flex-direction:column;align-items:center;padding:8px 0 10px;gap:1px;overflow-y:auto;scrollbar-width:none;min-height:0}
#toolbar::-webkit-scrollbar{display:none}
.tool{position:relative;width:34px;height:32px;border:0;border-radius:5px;background:none;color:var(--ink2);display:grid;place-items:center;flex:none}
.tool:hover{background:var(--hover);color:var(--ink)}
.tool.on{background:var(--press);color:var(--ink)}
.tool.on::before{content:"";position:absolute;left:-6px;top:9px;width:4px;height:14px;background:var(--amber);clip-path:polygon(0 0,100% 3px,100% calc(100% - 3px),0 100%)}
.tool.more::after{content:"";position:absolute;right:3px;bottom:3px;border:3px solid transparent;border-right-color:var(--ink3);border-bottom-color:var(--ink3)}
.tgap{height:7px;flex:none}
#swatches{position:relative;width:38px;height:40px;margin-top:10px;flex:none}
#swatches .sw{position:absolute;width:22px;height:22px;border-radius:3px;border:0;padding:0;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 0 2px rgba(255,244,222,.2)}
#fgSw{left:2px;top:2px;z-index:1} #bgSw{left:14px;top:15px}
#swapSw,#defSw{position:absolute;border:0;background:none;color:var(--ink3);padding:0;width:12px;height:12px;display:grid;place-items:center}
#swapSw{right:-2px;top:0} #defSw{left:0;bottom:-3px}
#swapSw:hover,#defSw:hover{color:var(--ink)}
.flyout{position:fixed;z-index:40;background:var(--raised);border-radius:6px;padding:4px;box-shadow:0 0 0 1px var(--edge2),0 10px 22px -14px rgba(0,0,0,.9)}
.flyout button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:5px 10px 5px 6px;border-radius:4px;color:var(--ink);white-space:nowrap}
.flyout button:hover{background:var(--hover)}
.flyout button.on{color:var(--amber)}
.flyout kbd{font:inherit;color:var(--ink3);margin-left:auto;padding-left:18px}

#stage{display:grid;grid-template-rows:30px minmax(0,1fr);min-width:0;min-height:0;background:var(--paste)}
#tabs{display:flex;align-items:stretch;background:var(--bg);overflow-x:auto;scrollbar-width:none;min-width:0}
#tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;padding:0 6px 0 13px;color:var(--ink3);background:var(--bg);border:0;white-space:nowrap;max-width:260px;position:relative}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab.on{background:var(--paste);color:var(--ink)}
.tab:hover:not(.on){color:var(--ink2)}
.tab .x{width:18px;height:18px;border-radius:3px;display:grid;place-items:center;color:var(--ink3)}
.tab .x:hover{background:var(--hover);color:var(--ink)}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
#viewport{position:relative;overflow:hidden;touch-action:none;min-height:0;outline:none}
#viewport canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#overlay{pointer-events:none}
#textEdit{position:absolute;z-index:3;margin:0;padding:0;border:0;outline:1px dashed rgba(216,167,103,.9);outline-offset:3px;background:transparent;resize:none;overflow:hidden;white-space:pre;caret-color:var(--amber);user-select:text;-webkit-user-select:text;line-height:1.2}
#glFail{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink2);padding:24px;font-size:13px}
#dropHint{position:absolute;inset:14px;border-radius:10px;display:grid;place-items:center;background:rgba(18,17,16,.72);color:var(--ink);font-size:15px;box-shadow:inset 0 0 0 2px rgba(216,167,103,.7);pointer-events:none;z-index:5}

/* ── 右側面板 ── */
#panels{background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow:hidden;gap:1px;background:var(--seam)}
.pgroup{background:var(--panel);display:flex;flex-direction:column;min-height:0;flex:none}
#pgProps{flex:none;height:clamp(150px,36vh,350px)}
#pgProps .pbody{flex:1}
#pgProps.folded{height:auto}
.pgroup.grow{flex:1 1 auto;min-height:190px}
.phead{display:flex;align-items:center;gap:2px;height:30px;padding:0 6px 0 8px;flex:none}
.ptab{border:0;background:none;color:var(--ink3);height:24px;padding:0 8px;border-radius:4px;font-weight:600}
.ptab:hover{color:var(--ink2)}
.ptab.on{color:var(--ink);background:var(--raised)}
.ptab.plab{display:inline-flex;align-items:center;background:none;padding-left:4px;cursor:default}
.phead .fold{margin-left:auto;border:0;background:none;color:var(--ink3);width:22px;height:22px;border-radius:4px;display:grid;place-items:center}
.phead .fold:hover{background:var(--hover);color:var(--ink)}
.pbody{padding:4px 12px 12px;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--press) transparent}
.pgroup.folded .pbody{display:none}

/* 色彩 */
#colorBody{display:grid;grid-template-columns:1fr 14px;gap:8px 8px}
#svBox{position:relative;height:118px;border-radius:4px;overflow:hidden;cursor:crosshair;touch-action:none}
#svBox canvas,#hueBar canvas{width:100%;height:100%;display:block}
#svBox i{position:absolute;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px rgba(0,0,0,.6);pointer-events:none}
#hueBar{position:relative;border-radius:3px;overflow:hidden;cursor:ns-resize;touch-action:none}
#hueBar i{position:absolute;left:-1px;right:-1px;height:4px;margin-top:-2px;border-radius:1px;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px rgba(0,0,0,.55);pointer-events:none}
.crow{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr) auto 38px auto 38px auto 38px;align-items:center;gap:5px}
.crow input{width:100%;padding:0 4px}
.crow .num{text-align:center}
#recent{grid-column:1/-1;display:flex;gap:4px;min-height:14px}
#recent:empty{display:none}
#recent button{width:14px;height:14px;border-radius:2px;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}

/* 表單元件 */
.num,.txt,.sel{background:var(--well);border:0;border-radius:3px;height:22px;padding:0 6px;box-shadow:inset 0 0 0 1px var(--edge);outline:none;min-width:0}
.num{width:52px;text-align:right}
.num:focus,.txt:focus,.sel:focus,textarea.txt:focus{box-shadow:inset 0 0 0 1px var(--amber)}
.sel{padding-right:4px}
textarea.txt{height:auto;padding:6px;resize:vertical;user-select:text;-webkit-user-select:text}
input.txt,input.num{user-select:text;-webkit-user-select:text}
.row{display:flex;align-items:center;gap:8px;margin:7px 0}
.row>label:first-child,.row>.lab{color:var(--ink2);flex:none}
.slider{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:3px 8px;margin:9px 0}
.slider .lab{color:var(--ink2);cursor:ew-resize}
.slider .lab:hover{color:var(--ink)}
.slider .num{grid-row:1;grid-column:2;justify-self:end;height:20px;width:54px}
.slider input[type=range]{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;height:14px;background:transparent;margin:0;width:100%;--p:50%;--tr:linear-gradient(90deg,var(--amber2) var(--p),var(--well) var(--p))}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--tr)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--tr)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:7px;height:13px;margin-top:-5px;border-radius:2px;background:var(--ink);border:0;box-shadow:0 1px 2px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:7px;height:13px;border-radius:2px;background:var(--ink);border:0}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{background:var(--amber)}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);cursor:pointer}
.chk input{appearance:none;-webkit-appearance:none;width:13px;height:13px;margin:0;border-radius:3px;background:var(--well);box-shadow:inset 0 0 0 1px var(--edge2);display:grid;place-items:center}
.chk input:checked{background:var(--amber)}
.chk input:checked::after{content:"";width:6px;height:3px;border:solid var(--amber-ink);border-width:0 0 1.6px 1.6px;transform:translateY(-1px) rotate(-45deg)}
.btn{border:0;height:26px;padding:0 12px;border-radius:4px;background:var(--raised);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,244,222,.05);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:active{background:var(--press)}
.btn.go{background:var(--amber);color:var(--amber-ink);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.btn.go:hover{background:#e2b476}
.btn.plain{background:none;box-shadow:none;color:var(--ink2)}
.btn.plain:hover{color:var(--ink);background:var(--hover)}
.btn:disabled{opacity:.45;cursor:default}
.ibtn{border:0;background:none;color:var(--ink2);width:26px;height:26px;border-radius:4px;display:grid;place-items:center;flex:none}
.ibtn:hover{background:var(--hover);color:var(--ink)}
.ibtn:disabled{opacity:.35;cursor:default;background:none}
.note{color:var(--ink3);line-height:1.55;margin:6px 0}
.hint{color:var(--ink3)}

/* 屬性 */
#propsBody h4{margin:6px 0 4px;font-size:12px;font-weight:600;color:var(--ink)}
.plot{position:relative;width:100%;max-width:250px;margin:0 auto;aspect-ratio:1;background:var(--well);border-radius:4px;touch-action:none;cursor:crosshair}
.plot canvas{position:absolute;inset:0;width:100%;height:100%}
.lvl{position:relative;height:74px;background:var(--well);border-radius:4px 4px 0 0}
.lvl canvas{position:absolute;inset:0;width:100%;height:100%}
.tri{position:relative;height:14px;touch-action:none}
.tri b{position:absolute;top:1px;width:11px;height:11px;margin-left:-5.5px;clip-path:polygon(50% 0,100% 100%,0 100%);cursor:ew-resize}
.ramp{height:8px;border-radius:0 0 2px 2px;margin-top:0}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.trio .num{width:100%;text-align:center}

/* 圖層 */
#layerTop{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;padding:0 12px 8px}
#layerTop .sel{width:100%}
#layerTop .op{display:flex;align-items:center;gap:6px;color:var(--ink2)}
#layerList{flex:1;overflow:auto;min-height:60px;padding:0 6px;scrollbar-width:thin;scrollbar-color:var(--press) transparent}
.lr{display:flex;align-items:center;gap:6px;height:42px;padding:0 6px 0 2px;border-radius:5px;position:relative;cursor:default}
.lr:hover{background:rgba(255,244,222,.03)}
.lr.on{background:#3b352b}
.lr .eye{width:24px;height:26px;border:0;background:none;color:var(--ink2);display:grid;place-items:center;border-radius:4px;flex:none}
.lr .eye:hover{color:var(--ink)}
.lr.hid .eye{color:var(--ink4)}
.lr.hid .nm,.lr.hid .th{opacity:.45}
.lr .disc{width:14px;height:20px;border:0;background:none;color:var(--ink3);display:grid;place-items:center;padding:0;flex:none}
.lr .disc svg{transition:transform .15s var(--ease)}
.lr.closed .disc svg{transform:rotate(-90deg)}
.lr .th{width:34px;height:30px;border-radius:3px;flex:none;position:relative;overflow:hidden;display:grid;place-items:center;color:var(--ink2);background:var(--well)}
.lr .th canvas{width:100%;height:100%;display:block}
.lr .th.edit{box-shadow:0 0 0 1.5px var(--ink)}
.lr .th.off::after{content:"";position:absolute;inset:0;background:linear-gradient(45deg,transparent 46%,var(--red) 47%,var(--red) 53%,transparent 54%)}
.lr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.lr .nm input{width:100%;height:22px}
.lr .tag{color:var(--ink3);font-size:11px;flex:none}
.lr .blendTag{color:var(--ink3);font-size:11px;flex:none;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dropline{position:absolute;left:8px;right:8px;height:2px;border-radius:1px;background:var(--amber);pointer-events:none;z-index:2}
.lr.dropin{box-shadow:inset 0 0 0 1.5px var(--amber)}
#layerBar{display:flex;justify-content:flex-end;gap:2px;padding:4px 8px 6px;flex:none}

/* 歷史紀錄 */
.hr{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;text-align:left;padding:6px 8px;border-radius:4px;color:var(--ink)}
.hr:hover{background:var(--hover)}
.hr.on{background:#3b352b}
.hr.fut{color:var(--ink4)}
.hr svg{color:var(--ink3)}
.hr .ag{margin-left:auto;color:var(--amber);font-size:11px}

/* 代理 */
.agentState{display:flex;align-items:center;gap:8px;margin:4px 0 8px;color:var(--ink)}
.agentState i{width:8px;height:8px;border-radius:2px;background:var(--ink4);transform:rotate(45deg);flex:none}
.agentState.on i{background:var(--ok)} .agentState.wait i{background:var(--amber)}
pre.code{margin:6px 0;padding:8px 10px;background:var(--well);border-radius:4px;overflow:auto;font:11px/1.5 var(--num);color:var(--ink2);white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text}
.tools{display:grid;gap:5px;margin:6px 0}
.tools div{display:grid;grid-template-columns:auto 1fr;gap:8px}
.tools b{font:500 11px/1.5 var(--num);color:var(--amber)}
.tools span{color:var(--ink3)}
.log{display:grid;gap:4px;margin-top:6px}
.log div{display:grid;grid-template-columns:auto 1fr;gap:8px;color:var(--ink2);padding:3px 0}
.log time{color:var(--ink4);font:11px var(--num)}
.log .err{color:var(--red)}
.log code{font:11px var(--num);color:var(--ink)}
.agh{font-size:12px;font-weight:600;color:var(--ink);margin:14px 0 4px}

/* 狀態列 */
#status{display:flex;gap:18px;align-items:center;padding:0 12px;background:var(--bg);color:var(--ink3);white-space:nowrap;overflow:hidden;min-width:0}
#status b{font-weight:400;color:var(--ink2)}
#zoomField{width:58px;height:18px;text-align:right;background:var(--well);border:0;border-radius:3px;padding:0 5px;color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge);outline:none}
#zoomField:focus{box-shadow:inset 0 0 0 1px var(--amber)}
#stMsg{margin-left:auto;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
#stPix i{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}

/* 對話框 */
dialog{border:0;padding:0;background:var(--raised);color:var(--ink);border-radius:9px;box-shadow:0 0 0 1px var(--edge2),0 22px 40px -22px rgba(0,0,0,.9);max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(10,9,8,.5)}
.dlg{display:flex;flex-direction:column;min-width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
.dlg h3{margin:0;padding:15px 18px 4px;font:600 14px/1.3 var(--ui)}
.dlg .body{padding:6px 18px 4px;overflow:auto}
.dlg .foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:14px 18px 16px}
.dlg .foot .left{margin-right:auto}
.presets{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:6px 0 10px}
.presets button{border:0;background:var(--well);border-radius:5px;padding:8px 10px;text-align:left;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--edge)}
.presets button b{display:block;color:var(--ink);font-weight:500}
.presets button.on{box-shadow:inset 0 0 0 1.5px var(--amber);color:var(--ink)}
.grid2{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.grid2 label{color:var(--ink2)}

<script type="text/plain" id="bridgeSrc">
#!/usr/bin/env node
// 定影 FIXER：MCP 橋接程式（由編輯器頁面產生，零依賴，Node 18 以上）
//   Claude Code ── stdio (MCP) ──▶ 本程式 ◀── ws://127.0.0.1 ── 瀏覽器裡的定影
// 登記：claude mcp add fixer -- node /路徑/fixer-mcp.mjs
//       codex mcp add fixer -- node /路徑/fixer-mcp.mjs
// 然後在編輯器按「代理 › 連接代理」。換埠：FIXER_PORT=7200 node fixer-mcp.mjs
import http from 'node:http';
import crypto from 'node:crypto';
import fs from 'node:fs/promises';
import path from 'node:path';
import os from 'node:os';
import readline from 'node:readline';

const PORT = Number(process.env.FIXER_PORT || /*PORT*/7154);
const TOOLS = /*TOOLS*/[];
const ORIGINS = [/^https:\/\/htmls-ruddy\.vercel\.app$/, /^https?:\/\/(localhost|127\.0\.0\.1|\[::1\])(:\d+)?$/, /^null$/, /^file:\/\//];
const log = (...a) => process.stderr.write('[fixer] ' + a.join(' ') + '\n');

let page = null, seq = 0;
const pending = new Map();

// ── 最小的 WebSocket 伺服器（RFC 6455：文字訊框、分段、ping、close） ──
function frame(sock, op, payload) {
  const n = payload.length;
  let head;
  if (n < 126) head = Buffer.from([0x80 | op, n]);
  else if (n < 65536) { head = Buffer.alloc(4); head[0] = 0x80 | op; head[1] = 126; head.writeUInt16BE(n, 2); }
  else { head = Buffer.alloc(10); head[0] = 0x80 | op; head[1] = 127; head.writeBigUInt64BE(BigInt(n), 2); }
  sock.write(Buffer.concat([head, payload]));
}
const server = http.createServer((req, res) => {
  res.writeHead(200, { 'content-type': 'text/plain; charset=utf-8' });
  res.end(`定影 FIXER MCP 橋接程式運作中（埠 ${PORT}）。\n編輯器${page ? '已' : '尚未'}連線。\n`);
});
server.on('upgrade', (req, sock) => {
  const origin = String(req.headers.origin || 'null');
  if (!ORIGINS.some(r => r.test(origin))) { sock.end('HTTP/1.1 403 Forbidden\r\n\r\n'); log('拒絕來源', origin); return; }
  const key = req.headers['sec-websocket-key'];
  if (!key) { sock.destroy(); return; }
  const accept = crypto.createHash('sha1').update(key + '258EAFA5-E914-47DA-95CA-C5AB0DC85B11').digest('base64');
  sock.write('HTTP/1.1 101 Switching Protocols\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Accept: ' + accept + '\r\n\r\n');
  sock.setNoDelay(true);
  const conn = { sock, send: s => frame(sock, 1, Buffer.from(s, 'utf8')) };
  if (page) { try { frame(page.sock, 8, Buffer.alloc(0)); page.sock.end(); } catch { } }
  page = conn;
  log('編輯器已連線：' + origin);
  let buf = Buffer.alloc(0), parts = [];
  sock.on('data', chunk => {
    buf = buf.length ? Buffer.concat([buf, chunk]) : chunk;
    for (;;) {
      if (buf.length < 2) break;
      const fin = buf[0] & 0x80, op = buf[0] & 0x0f, masked = buf[1] & 0x80;
      let len = buf[1] & 0x7f, off = 2;
      if (len === 126) { if (buf.length < 4) break; len = buf.readUInt16BE(2); off = 4; }
      else if (len === 127) { if (buf.length < 10) break; len = Number(buf.readBigUInt64BE(2)); off = 10; }
      const mo = off; if (masked) off += 4;
      if (buf.length < off + len) break;
      let data = Buffer.from(buf.subarray(off, off + len));
      if (masked) for (let i = 0; i < data.length; i++) data[i] ^= buf[mo + (i & 3)];
      buf = buf.subarray(off + len);
      if (op === 8) { try { frame(sock, 8, Buffer.alloc(0)); } catch { } sock.end(); break; }
      if (op === 9) { frame(sock, 10, data); continue; }
      if (op === 10) continue;
      if (op === 0 || op === 1 || op === 2) {
        if (op !== 0) parts = [];
        parts.push(data);
        if (fin) { const text = Buffer.concat(parts).toString('utf8'); parts = []; onPage(text); }
      }
    }
  });
  const drop = () => {
    if (page !== conn) return;
    page = null; log('編輯器已中斷');
    for (const p of pending.values()) p.reject(new Error('編輯器連線中斷'));
    pending.clear();
  };
  sock.on('close', drop); sock.on('error', drop);
});
function onPage(text) {
  let m; try { m = JSON.parse(text); } catch { return; }
  if (m.type === 'hello') { log(`頁面 ${m.app} v${m.version}，${(m.tools || []).length} 個工具`); return; }
  if (m.type === 'result') { const p = pending.get(m.id); if (p) { pending.delete(m.id); p.resolve(m); } }
}
function callPage(tool, args, ms = 180000) {
  return new Promise((resolve, reject) => {
    if (!page) return reject(new Error(`定影編輯器沒有連線。請在瀏覽器開啟 https://htmls-ruddy.vercel.app/web/154-fixer-editor.html ，按選單「代理 › 連接代理」（埠 ${PORT}）。`));
    const id = ++seq;
    const t = setTimeout(() => { pending.delete(id); reject(new Error('編輯器沒有回應（逾時）')); }, ms);
    pending.set(id, { resolve: v => { clearTimeout(t); resolve(v); }, reject: e => { clearTimeout(t); reject(e); } });
    page.send(JSON.stringify({ type: 'call', id, tool, args }));
  });
}
server.on('error', e => log(e.code === 'EADDRINUSE' ? `埠 ${PORT} 已被占用（可能已有另一個橋接在跑）。設定 FIXER_PORT 換埠，並在編輯器的代理面板改成同一個埠。` : e.message));
server.listen(PORT, '127.0.0.1', () => log(`等待編輯器連線：ws://127.0.0.1:${PORT}`));

// ── MCP：stdio 上的 JSON-RPC 2.0，一行一則訊息 ──
const MIME = { '.png': 'image/png', '.jpg': 'image/jpeg', '.jpeg': 'image/jpeg', '.webp': 'image/webp', '.gif': 'image/gif', '.bmp': 'image/bmp', '.avif': 'image/avif', '.psd': 'image/vnd.adobe.photoshop' };
const expand = p => (p === '~' || p.startsWith('~/') || p.startsWith('~\\')) ? path.join(os.homedir(), p.slice(1)) : path.resolve(p);
async function runTool(name, args = {}) {

/* ═══════════════ 文件、圖層與歷史紀錄 ═══════════════ */
const DOCS = [];
let doc = null, docSeq = 1;

function makeDoc(w, hh, name) {
  const d = { id: docSeq++, name, w, h: hh, root: { type: 'group', children: [], id: 0, name: 'root' }, active: null, sel: null, lastSel: null, hist: [], hi: -1, nid: 1, layerN: 1, view: null, modified: false, dirty: true };

}

  if (type === 'group') { L.children = L.children || []; if (L.open == null) L.open = true; }
  if (!L.name) L.name = type === 'group' ? '群組 ' + d.layerN++ : type === 'adjust' ? ADJ[L.adj.kind].name + ' ' + d.layerN++ : '圖層 ' + d.layerN++;

}

  if (!node.children) return null;
  for (const c of node.children) { if (c === L) return node; const p = parentOf(L, c); if (p) return p; }
  return null;
}

  ref = ref === undefined ? doc.active : ref;
  if (!ref) { doc.root.children.push(L); return; }
  const p = parentOf(ref) || doc.root;
  p.children.splice(p.children.indexOf(ref) + 1, 0, L);

// 快照只記結構與屬性；像素以 canvas 參照保存（整張替換時保留舊 canvas，局部修改另存差異）
function ser(L) {
  const n = { ref: L, p: { type: L.type, name: L.name, visible: L.visible, opacity: L.opacity, blend: L.blend, ox: L.ox, oy: L.oy, canvas: L.canvas, mask: L.mask ? { ...L.mask } : null, maskOn: L.maskOn, open: L.open, adj: L.adj ? JSON.parse(JSON.stringify(L.adj)) : undefined, text: L.text ? { ...L.text } : undefined, locked: L.locked } };

}
function snap(d = doc) { return { w: d.w, h: d.h, active: d.active, sel: d.sel, tree: ser(d.root) }; }
function restore(s, d = doc) {
  d.w = s.w; d.h = s.h; d.active = s.active; d.sel = s.sel;
  (function rs(n) {
    const p = n.p;
    Object.assign(n.ref, p, { mask: p.mask ? { ...p.mask } : null, adj: p.adj ? JSON.parse(JSON.stringify(p.adj)) : undefined, text: p.text ? { ...p.text } : undefined });

const HIST_MAX = 60;
let pend = null;
function histBase(d, label) { d.hist = [{ label, after: snap(d), diffs: [] }]; d.hi = 0; }
function commit(label, before, diffs = [], opts = {}) {
  if (pend && pend !== opts.self) flushPending();
  const e = { label, before, after: snap(), diffs, agent: agentBusy, icon: opts.icon };
  doc.hist.length = doc.hi + 1;
  doc.hist.push(e); doc.hi++;
  while (doc.hist.length > HIST_MAX + 1) doc.hist.splice(0, 1), doc.hi--;
  doc.modified = true;
  changed();
}
// 滑桿這類連續調整合併成一筆
function liveEdit(label) {

  pend.t = setTimeout(flushPending, 700);
}
function flushPending() {
  if (!pend) return;
  const p = pend; clearTimeout(p.t);
  if (p.doc !== doc) { pend = null; return; }
  commit(p.label, p.before, [], { self: p });
  pend = null;

function applyDiffs(diffs, which) {
  for (const f of which === 'a' ? [...diffs].reverse() : diffs) { cx(f.c).putImageData(f[which], f.x, f.y); touch(f.c, { x: f.x, y: f.y, w: f[which].width, h: f[which].height }); }
}
function undo() {
  flushPending(); cancelTransient();
  if (doc.hi <= 0) { say('沒有可以還原的步驟'); return false; }
  const e = doc.hist[doc.hi];
  applyDiffs(e.diffs, 'a'); restore(e.before); doc.hi--;

}

  const e = doc.hist[doc.hi + 1];

}
function gotoHist(i) { flushPending(); while (doc.hi > i && undo()); while (doc.hi < i && redo()); }
function diffOf(c, rect, beforeData) {
  const r = rectClip(rect, c.width, c.height); if (!r) return null;
  return { c, x: r.x, y: r.y, a: beforeData || null, b: cx(c).getImageData(r.x, r.y, r.w, r.h) };
}

/* ═══════════════ 調整：參數、查表、著色器參數 ═══════════════ */
const ADJ = {
