<script type="module">

const $ = id => document.getElementById(id);
const canvas = $('c');
const isTouch = matchMedia('(pointer:coarse)').matches;

/* ---------- 亂數與雜訊 ---------- */
function mulberry(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function hash2(x, y){ let h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return h - Math.floor(h); }
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;

function plasterTex(base = [208, 199, 182], n = 256){
  const [c, g] = makeCanvas(n); const img = g.createImageData(n, n); const h = new Float32Array(n * n);

// 瓦（本瓦葺）
function tileTex(n = 256){
  const [c, g] = makeCanvas(n); const img = g.createImageData(n, n); const h = new Float32Array(n * n);

  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){

function groundTex(n = 256){

// 水面細波法線
function waterNormalTex(n = 256){
  const h = new Float32Array(n * n);

function hullGeo(L = 4.8){
  const S = 18, ring = [], pos = [], idx = [], uv = [];
  const prof = [[-1, .66], [-.98, .5], [-.86, .22], [-.7, .03], [.7, .03], [.86, .22], [.98, .5], [1, .66]];
  for (let k = 0; k <= S; k++){
    const u = k / S; let hw = u < .3 ? .22 + .78 * Math.pow(u / .3, .75) : u < .85 ? 1 : 1 - .32 * (u - .85) / .15; hw *= .92;
    const sheer = .28 * Math.pow(1 - u, 2.2) + .1 * Math.pow(u, 3); const z = (.5 - u) * L;
    prof.forEach(([px, py], j) => { pos.push(px * hw, py + sheer, z); uv.push(j / (prof.length - 1) * 2, u * 6); });
  }
  const P = prof.length;
  for (let k = 0; k < S; k++) for (let j = 0; j < P - 1; j++){ const a = k * P + j, b = (k + 1) * P + j; idx.push(a, a + 1, b, a + 1, b + 1, b); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
  return g;
}

  time: 0.70, daySpeed: 1 / 240, fast: false, // 一天 240 秒，從酉時開始
  rain: 0, fog: 0, cloud: .3, target: { rain: 0, fog: 0, cloud: .3 }, wxName: '晴', wxTimer: 55,
  night: 0, boatPos: new THREE.Vector3(), dist: 0, camMode: 0,
};
const WX = { '晴': { rain: 0, fog: 0, cloud: .3 }, '雨': { rain: 1, fog: .35, cloud: 1 }, '霧': { rain: 0, fog: 1, cloud: .7 } };
const NOTES = { '晴': '雲散了 · 晴', '雨': '下起雨來 · 雨', '霧': '川霧漫上來 · 霧' };
let noteT = 0;
function setWeather(name, quiet){ S.wxName = name; Object.assign(S.target, WX[name]); S.wxTimer = R(55, 95); $('wx').textContent = name; if (!quiet){ $('note').textContent = NOTES[name]; $('note').classList.add('show'); noteT = 3; } }
const KOKU = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
function kokuName(t){ const h = (t * 24 + 1) % 24; return KOKU[Math.floor(h / 2)] + 'の刻'; }

const C = { zenithDay: new THREE.Color(0x3d78b8), zenithDusk: new THREE.Color(0x3a4a7a), zenithNight: new THREE.Color(0x070c18), horizonDay: new THREE.Color(0xcfe0ea), horizonDusk: new THREE.Color(0xe8955a), horizonNight: new THREE.Color(0x141c2c),
  sunNoon: new THREE.Color(0xfff4e0), sunLow: new THREE.Color(0xff9a52), moon: new THREE.Color(0x8fa6d6), fogRain: new THREE.Color(0x9aa5aa), fogMist: new THREE.Color(0xd8dcd6) };
const _c = new THREE.Color(), _c2 = new THREE.Color(), _sunDir = new THREE.Vector3(), _moonDir = new THREE.Vector3();
let envTimer = 0, envTex = null;
function updateSky(dt){
  const th = (S.time - .25) * Math.PI * 2; _sunDir.set(-Math.cos(th) * .85, Math.sin(th), Math.cos(th) * .5).normalize();
  _moonDir.set(Math.cos(th) * .7, -Math.sin(th) * .9 + .05, -Math.cos(th) * .6).normalize();
  const el = _sunDir.y; const day = smooth(-.1, .18, el); const low = 1 - smooth(.05, .42, Math.abs(el)); const night = 1 - smooth(-.22, .02, el); S.night = night;
  const dusk = low * smooth(-.15, .05, el);
  _c.copy(C.zenithNight).lerp(C.zenithDay, day).lerp(C.zenithDusk, dusk * .6); _c2.copy(C.horizonNight).lerp(C.horizonDay, day).lerp(C.horizonDusk, dusk * .85);
  const wxGrey = Math.max(S.rain * .85, S.fog * .7); _c.lerp(_c2, wxGrey * .5); _c2.lerp(S.fog > S.rain ? C.fogMist : C.fogRain, wxGrey * .8 * (day * .7 + .3));
  skyUni.uZenith.value.copy(_c); skyUni.uHorizon.value.copy(_c2); skyUni.uSun.value.copy(_sunDir); skyUni.uMoon.value.copy(_moonDir);
  skyUni.uSunCol.value.copy(C.sunNoon).lerp(C.sunLow, low); skyUni.uNight.value = night; skyUni.uCloud.value = S.cloud; skyUni.uFogAmt.value = S.fog; skyUni.uGlow.value = day * (1 - wxGrey * .8);
  // 霧
  const fogCol = _c2.clone().lerp(_c, .25 * (1 - wxGrey)); scene.fog.color.copy(fogCol); scene.fog.density = .0022 + S.rain * .0035 + S.fog * .018; skyUni.uFog.value.copy(fogCol);
  waterUni.uFogCol.value.copy(fogCol); waterUni.uFogDen.value = scene.fog.density;
  // 主光：白天太陽，夜裡月亮
  const useMoon = el < -.02; const L = useMoon ? _moonDir : _sunDir; sun.position.copy(S.boatPos).addScaledVector(L, 110); sun.target.position.copy(S.boatPos);
  const strength = useMoon ? .55 * smooth(-.02, -.2, el) : 2.6 * smooth(-.02, .12, el) * (1 - .25 * low);
  sun.intensity = strength * (1 - S.rain * .75 - S.fog * .55); sun.color.copy(useMoon ? C.moon : skyUni.uSunCol.value);
  hemi.color.copy(_c).lerp(_c2, .5); hemi.groundColor.set(0x3d4a2c).lerp(_c2, .3); hemi.intensity = .32 + day * .45 - wxGrey * .1;
  waterUni.uLightDir.value.copy(L); waterUni.uLightCol.value.copy(sun.color).multiplyScalar(useMoon ? .5 : 1); waterUni.uSpec.value = (useMoon ? .6 : 1) * (1 - S.rain * .6 - S.fog * .7);
  waterUni.uAmbient.value.copy(hemi.color).lerp(skyUni.uHorizon.value, .4).multiplyScalar(.45 + day * .55).lerp(fogCol, wxGrey * .3);
  waterUni.uWaveAmp.value = 1 + S.rain * .6; waterUni.uRain.value = S.rain; windUni.uWind.value = .6 + S.rain * 1.2;
  renderer.toneMappingExposure = 1.0 + night * .5;
  // 燈籠
  const glow = (1 - day) * 2.6 + .12; for (const m of lanternMats) m.emissiveIntensity = glow;
  scene.environmentIntensity = .25 + day * .55;
  envTimer -= dt; if (envTimer <= 0){ envTimer = S.fast ? .5 : 2.5; const old = envTex; envTex = pmrem.fromScene(skyScene, 0, .1, 1000).texture; scene.environment = envTex; if (old) old.dispose(); }
}
function updateWeather(dt){
  const k = 1 - Math.exp(-dt * .35); S.rain += (S.target.rain - S.rain) * k; S.fog += (S.target.fog - S.fog) * k; S.cloud += (S.target.cloud - S.cloud) * k;
  S.wxTimer -= dt; if (S.wxTimer <= 0){ const names = Object.keys(WX).filter(n => n !== S.wxName); setWeather(names[Math.floor(rnd() * names.length)]); }
  rainUni.uRain.value = S.rain;
  if (noteT > 0){ noteT -= dt; if (noteT <= 0) $('note').classList.remove('show'); }
}

/* ---------- 船的物理 ---------- */
const B = { x: RIVER.P[0].x, z: RIVER.P[0].z, yaw: Math.atan2(RIVER.T[0].x, RIVER.T[0].z), v: 0, yawRate: 0, y: 0, vy: 0, pitch: 0, vp: 0, roll: 0, vr: 0, idx: 0, wakeT: 0, wakeK: 0 };
const input = { f: 0, s: 0 };
const wakes = waterUni.uWake.value;
function stepBoat(dt, t){
  const thr = input.f, steer = input.s;
  const maxV = thr > 0 ? 7.5 : 2.8; const acc = thr * (thr > 0 ? 3.2 : 2.0);
  B.v += acc * dt; B.v -= B.v * (.55 + Math.abs(B.v) * .09) * dt; B.v = clamp(B.v, -2.8, maxV);
  const turn = steer * 1.15 * clamp(Math.abs(B.v) / 3.5, .28, 1) * Math.sign(B.v || 1);
  B.yawRate += (turn - B.yawRate) * Math.min(1, dt * 4); B.yaw += B.yawRate * dt;
  const fx = Math.sin(B.yaw), fz = Math.cos(B.yaw); B.x += fx * B.v * dt; B.z += fz * B.v * dt; S.dist += Math.abs(B.v) * dt;
  // 河岸
  const q = RIVER.nearest(B.x, B.z, B.idx); B.idx = q.i; const P = RIVER.P[q.i], NL = RIVER.NL[q.i]; const sd = (B.x - P.x) * NL.x + (B.z - P.z) * NL.z; const lim = RIVER.W[q.i] - 2.2;
  if (Math.abs(sd) > lim){ const over = Math.abs(sd) - lim; B.x -= NL.x * Math.sign(sd) * over * Math.min(1, dt * 6); B.z -= NL.z * Math.sign(sd) * over * Math.min(1, dt * 6); B.v *= 1 - Math.min(.9, over * dt * 3); B.roll += Math.sign(sd) * over * .01; }
  for (const c of colliders){ const dx = B.x - c.x, dz = B.z - c.z, d = Math.hypot(dx, dz), min = c.r + 1.6; if (d < min && d > 1e-3){ const push = (min - d); B.x += dx / d * push * Math.min(1, dt * 8); B.z += dz / d * push * Math.min(1, dt * 8); B.v *= .8; } }
  // 浮力：四個角取波高
  const amp = waterUni.uWaveAmp.value; const hp = (lx, lz) => waveH(B.x + fx * lz - fz * lx * 0 + Math.cos(B.yaw) * lx, B.z + fz * lz - Math.sin(B.yaw) * lx, t) * amp;
  const hf = hp(0, 2.1), hb = hp(0, -2.1), hl = hp(-.85, 0), hr = hp(.85, 0); const hy = (hf + hb + hl + hr) / 4 - .12 + Math.abs(B.v) * .004;
  const tp = Math.atan2(hb - hf, 4.2) - thr * .025 * Math.min(1, Math.abs(B.v) / 3), tr = Math.atan2(hl - hr, 1.7) - B.yawRate * .12 * Math.min(1, Math.abs(B.v) / 3);
  const K = 28, D = 2 * Math.sqrt(K) * .8;
  B.vy += ((hy - B.y) * K - B.vy * D) * dt; B.y += B.vy * dt; B.vp += ((tp - B.pitch) * K - B.vp * D) * dt; B.pitch += B.vp * dt; B.vr += ((tr - B.roll) * K - B.vr * D) * dt; B.roll += B.vr * dt;
  boat.position.set(B.x, B.y, B.z); boat.rotation.set(B.pitch, B.yaw, B.roll, 'YXZ');
  S.boatPos.set(B.x, 0, B.z);
  // 船跡
  for (const w of wakes) w.z += dt;
  B.wakeT -= dt; const sp = Math.abs(B.v);
  if (sp > .7 && B.wakeT <= 0){ B.wakeT = clamp(1.6 / sp, .12, .5); const w = wakes[B.wakeK]; B.wakeK = (B.wakeK + 1) % WAKE_N; w.set(B.x - fx * 2.0, B.z - fz * 2.0, 0, clamp(sp / 7, .15, 1)); }
  waterUni.uBow.value.set(B.x + fx * 2.2, B.z + fz * 2.2, clamp(sp / 5, 0, 1) * (B.v > 0 ? 1 : .4), 0);
  // 船頭撐篙
  const ph = t * 1.6; pole.rotation.x = -.35 + Math.sin(ph) * .35 * clamp(thr, 0, 1) - .1 * thr; pole.rotation.z = .35; boatman.arms[1].rotation.x = -1.2 + Math.sin(ph) * .3 * thr; boatman.arms[0].rotation.x = -.9 - Math.sin(ph) * .2 * thr; boatman.g.rotation.z = -B.roll * .5; boatman.g.rotation.y = -steer * .3;
}

/* ---------- 攝影機 ---------- */
const camS = { yawOff: 0, pitchOff: 0, dragging: false, lx: 0, ly: 0, pos: new THREE.Vector3(), look: new THREE.Vector3() }; let camInit = false;
function stepCamera(dt){
  const fx = Math.sin(B.yaw), fz = Math.cos(B.yaw);
  let tx, ty, tz, lx, ly, lz;
  if (S.camMode === 0){ const yaw = B.yaw + camS.yawOff; const sx = Math.sin(yaw), sz = Math.cos(yaw); const back = 9.5, up = 3.6 + camS.pitchOff * 4; tx = B.x - sx * back; tz = B.z - sz * back; ty = up; lx = B.x + fx * 3; lz = B.z + fz * 3; ly = 1.0; }
  else if (S.camMode === 1){ tx = B.x + fx * 2.9; tz = B.z + fz * 2.9; ty = B.y + 1.45; ly = 1.0 + camS.pitchOff * 6; const yaw = B.yaw + camS.yawOff; lx = tx + Math.sin(yaw) * 30; lz = tz + Math.cos(yaw) * 30; }
  else { const yaw = B.yaw + camS.yawOff + Math.PI * .7; tx = B.x - Math.sin(yaw) * 26; tz = B.z - Math.cos(yaw) * 26; ty = 9 + camS.pitchOff * 6; lx = B.x; lz = B.z; ly = .8; }
  // 攝影機不鑽進河岸
  const gy = terrainH(tx, tz, B.idx) + 1.2; if (ty < gy) ty = gy;
  const k = camInit ? 1 - Math.exp(-dt * (S.camMode === 1 ? 14 : 4.5)) : 1; camInit = true;
  camS.pos.lerp(_v.set(tx, ty, tz), k); camS.look.lerp(_v2.set(lx, ly, lz), k);
  camera.position.copy(camS.pos); camera.lookAt(camS.look);
  if (!camS.dragging){ camS.yawOff *= Math.exp(-dt * 1.5); camS.pitchOff *= Math.exp(-dt * 1.5); }
}

/* ---------- 燈光池分配 ---------- */
function stepLights(){
  const glow = (1 - smooth(-.1, .18, _sunDir.y)) * 1 + .05;
  for (const ls of lightSources) if (ls.follow) ls.follow.getWorldPosition(ls.pos);
  lightSources.forEach(ls => { ls.d = ls.pos.distanceToSquared(camera.position); });
  const near = lightSources.slice().sort((a, b) => a.d - b.d).slice(0, POOL);
  lightPool.forEach((l, k) => { const ls = near[k]; if (!ls){ l.intensity = 0; return; } l.position.copy(ls.pos); l.color.set(ls.color); l.intensity = ls.k * 80 * glow * (1 - smooth(300, 900, ls.d)); });
}

/* ---------- 音效（WebAudio 合成） ---------- */
let audio = null;
function startAudio(){
  if (audio) return; const ctx = new (window.AudioContext || window.webkitAudioContext)(); const master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination);
  const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = noiseBuf.getChannelData(0); let b0 = 0, b1 = 0, b2 = 0; for (let i = 0; i < d.length; i++){ const w = Math.random() * 2 - 1; b0 = .997 * b0 + .0000003 * w; b1 = .99 * b1 + .01 * w; b2 = .95 * b2 + .05 * w; d[i] = (b0 * 30 + b1 * 3 + b2 + w * .3) * .35; }
  const mk = (type, freq, q, gain) => { const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true; const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q; const g = ctx.createGain(); g.gain.value = gain; src.connect(f); f.connect(g); g.connect(master); src.start(); return { g, f }; };
  const water = mk('lowpass', 420, .7, .18), wash = mk('bandpass', 900, .8, 0), rain = mk('highpass', 2400, .5, 0), wind = mk('lowpass', 180, 1.2, .05);
  const lfo = ctx.createOscillator(); lfo.frequency.value = .13; const lg = ctx.createGain(); lg.gain.value = 140; lfo.connect(lg); lg.connect(water.f.frequency); lfo.start();
  let bellT = 8;
  audio = { ctx, water, wash, rain, wind, tick(dt){ const t = ctx.currentTime; wash.g.gain.setTargetAtTime(.02 + Math.abs(B.v) / 7.5 * .16, t, .2); rain.g.gain.setTargetAtTime(S.rain * .14, t, .5); wind.g.gain.setTargetAtTime(.04 + S.rain * .06 + S.fog * .02, t, .5);
    bellT -= dt; if (bellT <= 0){ bellT = R(14, 30); const near = Math.hypot(B.x - RIVER.P[468].x, B.z - RIVER.P[468].z) < 90; if (near){ const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 660; o2.frequency.value = 660 * 2.76; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + 4.5); o.connect(g); o2.connect(g); g.connect(master); o.start(t); o2.start(t); o.stop(t + 4.6); o2.stop(t + 4.6); } } } };
}

/* ---------- 輸入 ---------- */
const keys = new Set();
let started = false;
function start(){ if (started) return; started = true; $('intro').classList.add('off'); startAudio(); if (audio && audio.ctx.state === 'suspended') audio.ctx.resume(); canvas.focus(); }
addEventListener('keydown', (e) => { if (e.metaKey || e.ctrlKey || e.altKey) return; const k = e.key.toLowerCase(); if (!started) start(); keys.add(k);
  if (k === '1') setWeather('晴'); if (k === '2') setWeather('雨'); if (k === '3') setWeather('霧'); if (k === 'h') document.body.classList.toggle('hide'); if (k === 'c'){ S.camMode = (S.camMode + 1) % 3; $('cam').textContent = ['追船', '船首', '遠眺'][S.camMode]; } if (k === 't') S.fast = true;
  if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault(); });
addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); keys.delete(k); if (k === 't') S.fast = false; });
addEventListener('blur', () => keys.clear());
$('intro').addEventListener('pointerdown', start);
// 拖曳看四周
canvas.addEventListener('pointerdown', (e) => { if (!started) start(); if (isTouch && e.clientX < innerWidth * .5) return; camS.dragging = true; camS.lx = e.clientX; camS.ly = e.clientY; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => { if (!camS.dragging) return; camS.yawOff -= (e.clientX - camS.lx) * .006; camS.pitchOff = clamp(camS.pitchOff + (e.clientY - camS.ly) * .003, -.5, .8); camS.lx = e.clientX; camS.ly = e.clientY; });
canvas.addEventListener('pointerup', () => { camS.dragging = false; }); canvas.addEventListener('pointercancel', () => { camS.dragging = false; });
// 手機搖桿與油門
const stick = $('stick'), knob = stick.querySelector('i'); let stickId = null; const touchIn = { s: 0, f: 0 };
stick.addEventListener('pointerdown', (e) => { if (!started) start(); stickId = e.pointerId; stick.setPointerCapture(e.pointerId); moveStick(e); });
stick.addEventListener('pointermove', (e) => { if (e.pointerId === stickId) moveStick(e); });
const endStick = (e) => { if (e.pointerId !== stickId) return; stickId = null; touchIn.s = 0; knob.style.transform = ''; };
stick.addEventListener('pointerup', endStick); stick.addEventListener('pointercancel', endStick);
function moveStick(e){ const r = stick.getBoundingClientRect(); let dx = (e.clientX - r.left - r.width / 2) / (r.width / 2), dy = (e.clientY - r.top - r.height / 2) / (r.height / 2); const l = Math.hypot(dx, dy); if (l > 1){ dx /= l; dy /= l; } touchIn.s = -dx; knob.style.transform = `translate(${dx * 34}px,${dy * 34}px)`; }
for (const [id, val] of [['fwd', 1], ['rev', -1]]){ const b = $(id); const on = (e) => { if (!started) start(); touchIn.f = val; b.classList.add('on'); b.setPointerCapture(e.pointerId); }; const off = () => { if (touchIn.f === val) touchIn.f = 0; b.classList.remove('on'); }; b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); }
function readInput(){ const f = (keys.has('w') || keys.has('arrowup') ? 1 : 0) - (keys.has('s') || keys.has('arrowdown') ? 1 : 0); const s = (keys.has('a') || keys.has('arrowleft') ? 1 : 0) - (keys.has('d') || keys.has('arrowright') ? 1 : 0); input.f = f || touchIn.f; input.s = s || touchIn.s; }

/* ---------- 主迴圈 ---------- */
let lastT = performance.now(); let simT = 0, fpsAcc = 0, fpsN = 0, fpsT = 0, slowFrames = 0, hudT = 0;
function frame(){
  requestAnimationFrame(frame);
  const now = performance.now(); const raw = (now - lastT) / 1000; lastT = now; const dt = Math.min(raw, .05); simT += dt;
  readInput(); S.time = (S.time + dt * S.daySpeed * (S.fast ? 24 : 1)) % 1;
  updateWeather(dt); stepBoat(dt, simT); stepCamera(dt); updateSky(dt); stepLights();
  for (const p of people) p.tick(simT, S, dt); for (const a of anim) a(dt, simT, S);
  if (audio) audio.tick(dt);
  waterUni.uTime.value = simT; skyUni.uTime.value = simT; windUni.uTime.value = simT; rainUni.uTime.value = simT; rainUni.tDepth.value = sceneRT.depthTexture;
  rainUni.uAnchor.value.set(Math.round(camera.position.x / 4) * 4, 0, Math.round(camera.position.z / 4) * 4);
  skyMesh.position.copy(camera.position);
  // 1) 倒影（半解析度，不含人物與雨）
  updateMirror(); renderer.setRenderTarget(reflRT); renderer.render(scene, mirrorCam);
  // 2) 主場景（不含水）到含深度的貼圖
  renderer.setRenderTarget(sceneRT); renderer.render(scene, camera);
  // 3) 貼到畫面，疊上水與雨
  renderer.setRenderTarget(null); renderer.render(compScene, camera);
  // HUD 與效能
  fpsAcc += raw; fpsN++; fpsT += raw; if (raw > .028) slowFrames++;
  if (fpsT >= 1){ const fps = Math.round(fpsN / fpsAcc); $('fps').textContent = fps; if (slowFrames > fpsN * .4 && REFL_SCALE > .3){ REFL_SCALE = .3; makeTargets(); } fpsAcc = fpsN = fpsT = slowFrames = 0; }
  hudT -= dt; if (hudT <= 0){ hudT = .5; $('koku').textContent = kokuName(S.time); const ri = S.dist / 3927; $('dist').textContent = (ri < .1 ? '〇' : ri.toFixed(1)) + ' 里'; }
}
frame();

/* ---------- 除錯／截圖用 ---------- */
window.__kawa = { S, B, setTime(t){ S.time = t; envTimer = 0; }, setWeather(n){ setWeather(n, true); S.rain = S.target.rain; S.fog = S.target.fog; S.cloud = S.target.cloud; }, teleport(i, off = 0){ B.x = RIVER.P[i].x + RIVER.NL[i].x * off; B.z = RIVER.P[i].z + RIVER.NL[i].z * off; B.yaw = Math.atan2(RIVER.T[i].x, RIVER.T[i].z); B.idx = i; B.v = 0; camInit = false; }, start, camera, RIVER };
</script>
