<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trav · Begin Your Next Big Adventure</title>
<meta name="description" content="Cinematic travel-app hero: a fullscreen background video under a black scrim, a map pin that drops in, then the headline and subheading arrive word by word before the Download button fades up.">
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Helvetica', 'Arial', 'sans-serif'] } } } };
  // Marks the document as script-enabled. Only then may the entrance states hide anything,
  // so a reader without JS (or with a stalled script) still sees every word.
  document.documentElement.classList.add('js');
</script>
<style>
  html, body { overflow-x: hidden; max-width: 100vw; }
  body { background: #000; }

  /* One easing for every entrance. */
  :root { --ease: cubic-bezier(0.22, 1, 0.36, 1); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pin-drop {
    0%   { opacity: 0; transform: translateY(-28px) scale(0.92); }
    70%  { opacity: 1; transform: translateY(3px) scale(1); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Word-by-word: the spans are created by JS, so nothing is hidden without it. */
  .word-wrap {
    display: inline-block;
    opacity: 0;
    transform: translateY(15px);
    animation: rise 0.7s var(--ease) both;
    animation-delay: var(--d, 0ms);
    will-change: opacity, transform;
  }

  .js .hero-pin,
  .js .hero-cta { opacity: 0; }
  .js .hero-pin { animation: pin-drop 0.8s var(--ease) 0.15s both; }
  .js .hero-cta { animation: rise 0.8s var(--ease) both; animation-delay: var(--cta-delay, 2.4s); }

  .pin-shadow { filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45)); }

  /* CTA: a quiet white glow that grows on hover. */
  .cta {
    box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
    transition: box-shadow 0.35s var(--ease), background-color 0.35s var(--ease);
  }
  .cta:hover, .cta:focus-visible {
    background-color: #fff;
    box-shadow: 0 0 22px 2px rgba(255, 255, 255, 0.45), 0 0 60px 8px rgba(255, 255, 255, 0.18);
    outline: none;
  }

  /* Mobile menu. */
  .menu {
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.4s var(--ease), visibility 0s linear 0.4s;
  }
  .menu.is-open { opacity: 1; visibility: visible; pointer-events: auto; transition-delay: 0s; }
  .menu a { opacity: 0; transform: translateY(15px); transition: opacity 0.5s var(--ease), transform 0.5s var(--ease); }
  .menu.is-open a { opacity: 1; transform: translateY(0); }
  .menu.is-open a:nth-child(1) { transition-delay: 0.10s; }
  .menu.is-open a:nth-child(2) { transition-delay: 0.16s; }
  .menu.is-open a:nth-child(3) { transition-delay: 0.22s; }
  .menu.is-open a:nth-child(4) { transition-delay: 0.28s; }

  /* Hamburger to cross. */
  .burger span { display: block; width: 22px; height: 1.5px; background: #fff; transition: transform 0.35s var(--ease), opacity 0.25s var(--ease); transform-origin: center; }
  .burger span + span { margin-top: 6px; }
  .burger.is-open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  .burger.is-open span:nth-child(2) { opacity: 0; transform: scaleX(0.4); }
  .burger.is-open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

  .nav-link { transition: color 0.3s var(--ease); }
  .nav-link:hover { color: #fff; }

  @media (prefers-reduced-motion: reduce) {
    .word-wrap, .js .hero-pin, .js .hero-cta { animation-duration: 0.01ms !important; animation-delay: 0ms !important; }
    .menu, .menu a, .burger span, .cta { transition-duration: 0.01ms !important; transition-delay: 0ms !important; }
  }
</style>
</head>
<body class="min-h-screen bg-black text-white font-sans antialiased">

  <!-- Background video -->
  <div class="fixed inset-0 overflow-hidden" style="z-index:-1" aria-hidden="true">
    <video id="bg" class="absolute inset-0 w-full h-full" style="object-fit:cover"
           autoplay muted loop playsinline preload="auto">
      <source src="https://cdn.sceneai.art/Hero%20Section%20Video/0519be39-d8d1-48a5-84ee-f8a1ec038cd6.mp4" type="video/mp4">
    </video>
    <div class="absolute inset-0 bg-black/30"></div>
  </div>

  <!-- Header -->
  <header class="absolute top-0 inset-x-0 z-10 px-6 py-6 md:px-16 md:py-10">
    <div class="flex items-center justify-between">
      <a href="#" class="flex items-center gap-3" aria-label="Trav home">
        <span class="w-8 h-8 bg-white/20 backdrop-blur-md rounded-full flex items-center justify-center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <ellipse cx="12" cy="12" rx="3.8" ry="9"/>
            <path d="M3.6 9h16.8M3.6 15h16.8"/>
          </svg>
        </span>
        <span class="font-medium text-[16px] tracking-wide">Trav</span>
      </a>

      <nav class="hidden md:flex items-center space-x-10" aria-label="Primary">
        <a href="#" class="nav-link font-medium text-[14px] text-white/95">Home</a>
        <a href="#" class="nav-link font-medium text-[14px] text-white/95">Our Story</a>
        <a href="#" class="nav-link font-medium text-[14px] text-white/95">FAQ</a>
        <a href="#" class="nav-link font-medium text-[14px] text-white/95">Policies</a>
      </nav>

      <button id="burger" class="burger md:hidden relative w-10 h-10 -mr-2 flex flex-col items-center justify-center" type="button"
              aria-label="Open menu" aria-expanded="false" aria-controls="menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- Mobile menu overlay -->
  <div id="menu" class="menu fixed inset-0 z-[5] bg-black/80 backdrop-blur-xl md:hidden flex flex-col items-center justify-center gap-8" role="dialog" aria-modal="true" aria-label="Menu">
    <a href="#" class="font-medium text-[28px] text-white/95 tracking-[-0.01em]">Home</a>
    <a href="#" class="font-medium text-[28px] text-white/95 tracking-[-0.01em]">Our Story</a>
    <a href="#" class="font-medium text-[28px] text-white/95 tracking-[-0.01em]">FAQ</a>
    <a href="#" class="font-medium text-[28px] text-white/95 tracking-[-0.01em]">Policies</a>
  </div>

  <!-- Hero -->
  <main class="relative flex flex-col items-center justify-center text-center max-w-4xl mx-auto h-[100dvh] px-6">
    <svg class="hero-pin pin-shadow w-9 h-9 md:w-10 md:h-10 mb-7" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 22s7-6.2 7-12.2A7 7 0 0 0 5 9.8C5 15.8 12 22 12 22z"/>
      <circle cx="12" cy="9.8" r="2.6"/>
    </svg>

    <h1 id="headline" class="font-semibold text-[38px] md:text-[60px] tracking-[-0.02em] leading-[1.1]">Begin Your Next<br class="hidden md:block">Big Adventure</h1>

    <p id="sub" class="mt-6 max-w-[480px] text-[16px] md:text-[17px] font-medium text-white/95 leading-[1.6]">Discover hidden gems, plan unforgettable trips, and<br class="hidden md:block">explore the world — all in one seamless app.</p>

    <a href="#" class="hero-cta cta mt-10 inline-flex items-center justify-center rounded-full bg-white text-black font-medium text-[15px] px-8 py-3.5">Download Now</a>
  </main>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var STEP = 90;          // ms between words
  var PIN_START = 150;    // pin-drop delay in CSS
  var PIN_LEAD = 450;     // heading starts while the pin is still settling

  // Split every text node into words wrapped in <span class="word-wrap">, keep element nodes (the <br>s) intact.
  // Returns the number of words wrapped so the caller can schedule what follows.
  function wrapWords(el, startDelay) {
    var nodes = Array.prototype.slice.call(el.childNodes);
    var count = 0;
    nodes.forEach(function (node) {
      if (node.nodeType !== Node.TEXT_NODE) {                    // <br> and any other element survive untouched;
        el.insertBefore(document.createTextNode(' '), node);     // a space beside it keeps the words apart when the <br> is hidden
        return;
      }
      var text = node.nodeValue;
      if (!text.trim()) { el.removeChild(node); return; }
      var parts = text.split(/(\s+)/);
      var frag = document.createDocumentFragment();
      parts.forEach(function (part) {
        if (!part) return;
        if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(' ')); return; }
        var span = document.createElement('span');
        span.className = 'word-wrap';
        span.textContent = part;
        span.style.setProperty('--d', (startDelay + count * STEP) + 'ms');
        frag.appendChild(span);
        count++;
      });
      el.replaceChild(frag, node);
    });
    return count;
  }

  var headStart = PIN_START + PIN_LEAD;
  var headWords = wrapWords(document.getElementById('headline'), headStart);
  var subStart = headStart + headWords * STEP;          // right as the last heading word begins
  var subWords = wrapWords(document.getElementById('sub'), subStart);
  var ctaStart = subStart + subWords * STEP + 120;
  document.documentElement.style.setProperty('--cta-delay', ctaStart + 'ms');

  // Background video: keep it playing through autoplay refusals and tab switches.
  var v = document.getElementById('bg');
  function resume() {
    if (!v || !v.paused || document.hidden) return;
    try { var p = v.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  ['canplay', 'pause', 'ended', 'stalled'].forEach(function (ev) { v.addEventListener(ev, resume); });
  document.addEventListener('visibilitychange', resume);
  window.addEventListener('pointerdown', resume, { once: true });
  resume();

  // Mobile menu.
  var burger = document.getElementById('burger');
  var menu = document.getElementById('menu');
  function setMenu(open) {
    menu.classList.toggle('is-open', open);
    burger.classList.toggle('is-open', open);
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    document.body.style.overflow = open ? 'hidden' : '';
  }
  burger.addEventListener('click', function () { setMenu(!menu.classList.contains('is-open')); });
  menu.addEventListener('click', function (e) { if (e.target.tagName === 'A') setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && menu.classList.contains('is-open')) setMenu(false); });
  window.addEventListener('resize', function () { if (window.innerWidth >= 768 && menu.classList.contains('is-open')) setMenu(false); });
});
</script>
</body>
</html>
