<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trav · Begin Your Next Big Adventure</title>
<meta name="description" content="Cinematic travel-app hero: the whole screen is the background video itself, defocused into frosted glass, with one clear arched doorway cut through it. A map pin drops in, the headline and subheading arrive word by word across the doorway's edge, then the Download button fades up.">
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Marks the document as script-enabled. Only then may the entrance states hide anything,
  // so a reader without JS (or with a stalled script) still sees every word.
  document.documentElement.classList.add('js');
</script>
<style>
  /* Plain CSS, no runtime framework: the small reset the page relies on. */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  body {
    margin: 0; min-height: 100vh; background: #000; color: #fff; line-height: 1.5;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  h1, p { margin: 0; }
  h1 { font-size: inherit; font-weight: inherit; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg, video { display: block; }

  :root {
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    /* The doorway. JS keeps these in sync with the SVG mask; CSS fallback below uses them too. */
    --door-w: clamp(300px, 25vw, 380px);
    --door-top: 10vh;
  }
  /* Phones: a narrower arch, so a real band of frosted wall stays on both sides and the copy crosses it. */
  @media (max-width: 767px) { :root { --door-w: 62vw; --door-top: 16vh; } }

  /* The video stage. Its painted ground stands in for the video until it plays (or if it never loads),
     so the frosted wall always has colour to blur. */
  .stage {
    position: fixed; inset: 0; overflow: hidden; z-index: -1;
    background: linear-gradient(180deg, #3d5a73 0%, #8aa3b3 40%, #d6b38c 60%, #5b4a3e 78%, #1c1a19 100%);
  }
  .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .stage .shade { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.3); }

  .site-head { position: absolute; top: 0; left: 0; right: 0; z-index: 10; padding: 24px; }
  .site-head .row { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 16px; letter-spacing: 0.025em; }
  .primary { display: none; align-items: center; gap: 40px; }
  .nav-link { font-weight: 500; font-size: 14px; color: rgba(255, 255, 255, 0.95); }
  .burger { position: relative; width: 40px; height: 40px; margin-right: -8px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .burger:focus-visible, .nav-link:focus-visible, .brand:focus-visible, .menu a:focus-visible { outline: 2px solid #fff; outline-offset: 4px; border-radius: 4px; }

  .hero {
    position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; max-width: 56rem; margin: 0 auto; height: 100vh; height: 100dvh; padding: 0 24px;
  }
  .hero-copy { display: flex; flex-direction: column; align-items: center; padding-top: 6vh; }
  .hero-pin { width: 36px; height: 36px; margin-bottom: 32px; }
  .hero h1 { font-weight: 600; font-size: 34px; letter-spacing: -0.02em; line-height: 1.1; }
  .hero .sub { margin-top: 24px; max-width: 480px; font-size: 16px; font-weight: 500; color: rgba(255, 255, 255, 0.95); line-height: 1.6; }
  .br-md { display: none; }
  .hero-cta { margin-top: 48px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .hero .platforms { font-size: 13px; color: rgba(255, 255, 255, 0.8); }

  /* The frosted wall: the video itself, defocused and dimmed, with the doorway cut out of it.
     Before JS builds the arch mask, a soft radial hole keeps the idea intact. */
  .wall {
    position: fixed; inset: -24px; z-index: 0; pointer-events: none;   /* oversized so the parallax drift never shows the viewport edge */
    background: rgba(6, 7, 9, 0.30);
    -webkit-backdrop-filter: blur(24px) saturate(1.15) brightness(0.72);
    backdrop-filter: blur(24px) saturate(1.15) brightness(0.72);
    -webkit-mask-image: radial-gradient(ellipse 30% 44% at 50% 56%, transparent 58%, #000 100%);
    mask-image: radial-gradient(ellipse 30% 44% at 50% 56%, transparent 58%, #000 100%);
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    will-change: transform;
  }
  /* The glass lip along the doorway edge: one thin self-coloured stroke. */
  .lip { position: fixed; inset: 0; z-index: 0; pointer-events: none; width: 100%; height: 100%; will-change: transform; }
  .lip path { fill: none; stroke: rgba(255, 255, 255, 0.42); stroke-width: 1; }
  .lip .lip-in { stroke: rgba(255, 255, 255, 0.10); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pin-drop {
    0%   { opacity: 0; transform: translateY(-28px) scale(0.92); }
    70%  { opacity: 1; transform: translateY(3px) scale(1); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Word-by-word: the spans are created by JS, so nothing is hidden without it. */
  .word-wrap {
    display: inline-block;
    opacity: 0;
    transform: translateY(15px);
    animation: rise 0.7s var(--ease) both;
    animation-delay: var(--d, 0ms);
    will-change: opacity, transform;
  }
  .js .hero-pin,
  .js .hero-cta { opacity: 0; }
  .js .hero-pin { animation: pin-drop 0.8s var(--ease) 0.15s both; }
  .js .hero-cta { animation: rise 0.8s var(--ease) both; animation-delay: var(--cta-delay, 2.4s); }

  .pin-shadow { filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45)); }
  .hero-copy { will-change: transform; }
  /* Type that crosses from clear video onto frosted glass needs one quiet shadow to stay even. */
  .hero-copy h1, .hero-copy p { text-shadow: 0 1px 24px rgba(0, 0, 0, 0.35); }

  /* CTA: solid white on the clear video; hover only shifts the fill. */
  .cta {
    display: inline-flex; align-items: center; justify-content: center; border-radius: 9999px;
    background-color: #fff; color: #000; font-weight: 500; font-size: 15px; padding: 14px 32px;
    transition: background-color 0.35s var(--ease);
  }
  .cta:hover { background-color: #f2f2f2; }
  .cta:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }

  /* Mobile menu. */
  .menu {
    position: fixed; inset: 0; z-index: 5; background: rgba(0, 0, 0, 0.8);
    -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.4s var(--ease), visibility 0s linear 0.4s;
  }
  .menu.is-open { opacity: 1; visibility: visible; pointer-events: auto; transition-delay: 0s; }
  .menu a { font-weight: 500; font-size: 28px; color: rgba(255, 255, 255, 0.95); letter-spacing: -0.01em; }
  .menu a { opacity: 0; transform: translateY(15px); transition: opacity 0.5s var(--ease), transform 0.5s var(--ease); }
  .menu.is-open a { opacity: 1; transform: translateY(0); }
  .menu.is-open a:nth-child(1) { transition-delay: 0.10s; }
  .menu.is-open a:nth-child(2) { transition-delay: 0.16s; }
  .menu.is-open a:nth-child(3) { transition-delay: 0.22s; }
  .menu.is-open a:nth-child(4) { transition-delay: 0.28s; }

  .burger span { display: block; width: 22px; height: 1.5px; background: #fff; transition: transform 0.35s var(--ease), opacity 0.25s var(--ease); transform-origin: center; }
  .burger span + span { margin-top: 6px; }
  .burger.is-open span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  .burger.is-open span:nth-child(2) { opacity: 0; transform: scaleX(0.4); }
  .burger.is-open span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }

  .nav-link { transition: color 0.3s var(--ease); }
  .nav-link:hover { color: #fff; }

  @media (min-width: 768px) {
    .site-head { padding: 40px 64px; }
    .primary { display: flex; }
    .burger, .menu { display: none; }
    .hero-pin { width: 40px; height: 40px; }
    .hero h1 { font-size: 60px; white-space: nowrap; }
    .hero .sub { font-size: 17px; }
    .br-md { display: block; }
  }

  @media (prefers-reduced-motion: reduce) {
    .word-wrap, .js .hero-pin, .js .hero-cta { animation-duration: 0.01ms !important; animation-delay: 0ms !important; }
    .menu, .menu a, .burger span, .cta { transition-duration: 0.01ms !important; transition-delay: 0ms !important; }
  }
</style>
</head>
<body>

  <!-- Background video. No autoplay attribute: the script starts it, and leaves it on the first frame for reduced motion. -->
  <div class="stage" aria-hidden="true">
    <video id="bg" muted loop playsinline preload="metadata">
      <source src="https://cdn.sceneai.art/Hero%20Section%20Video/0519be39-d8d1-48a5-84ee-f8a1ec038cd6.mp4" type="video/mp4">
    </video>
    <div class="shade"></div>
  </div>

  <!-- Frosted wall with the doorway cut out, and the glass lip along its edge -->
  <div id="wall" class="wall" aria-hidden="true"></div>
  <svg id="lip" class="lip" aria-hidden="true" preserveAspectRatio="none">
    <path id="lipOut" d=""/>
    <path id="lipIn" class="lip-in" d=""/>
  </svg>

  <!-- Header -->
  <header class="site-head">
    <div class="row">
      <a href="#" class="brand" aria-label="Trav home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <ellipse cx="12" cy="12" rx="3.8" ry="9"/>
          <path d="M3.6 9h16.8M3.6 15h16.8"/>
        </svg>
        <span>Trav</span>
      </a>

      <nav class="primary" aria-label="Primary">
        <a href="#" class="nav-link">Home</a>
        <a href="#" class="nav-link">Our Story</a>
        <a href="#" class="nav-link">FAQ</a>
        <a href="#" class="nav-link">Policies</a>
      </nav>

      <button id="burger" class="burger" type="button"
              aria-label="Open menu" aria-expanded="false" aria-controls="menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- Mobile menu overlay: while it is open, focus moves into it, Tab cycles between the links and
       the close button, the hero behind is inert, and Esc hands focus back to the button. -->
  <nav id="menu" class="menu" aria-label="Menu">
    <a href="#">Home</a>
    <a href="#">Our Story</a>
    <a href="#">FAQ</a>
    <a href="#">Policies</a>
  </nav>

  <!-- Hero: the copy sits on the doorway, wider than it, so the words cross from clear video onto frosted glass -->
  <main class="hero">
    <div class="hero-copy">
      <svg class="hero-pin pin-shadow" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 22s7-6.2 7-12.2A7 7 0 0 0 5 9.8C5 15.8 12 22 12 22z"/>
        <circle cx="12" cy="9.8" r="2.6"/>
      </svg>

      <h1 id="headline">Begin Your Next<br class="br-md">Big Adventure</h1>

      <p id="sub" class="sub">Offline maps, an itinerary your friends can edit,<br class="br-md">and a daily budget that tracks every receipt.</p>

      <div class="hero-cta">
        <a href="#" class="cta">Download Now</a>
        <p class="platforms">Free on iOS and Android</p>
      </div>
    </div>
  </main>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var STEP = 90;          // ms between words
  var WORD_DUR = 700;     // matches .word-wrap animation-duration in CSS
  var SETTLE = 0.55;      // with this ease-out a word is visually in place at ~55% of its duration
  var PIN_START = 150;    // pin-drop delay in CSS
  var PIN_LEAD = 450;     // heading starts while the pin is still settling

  // Split every text node into words wrapped in <span class="word-wrap">, keep element nodes (the <br>s) intact.
  // Returns the number of words wrapped so the caller can schedule what follows.
  function wrapWords(el, startDelay) {
    var nodes = Array.prototype.slice.call(el.childNodes);
    var count = 0;
    nodes.forEach(function (node) {
      if (node.nodeType !== Node.TEXT_NODE) {                    // <br> and any other element survive untouched;
        el.insertBefore(document.createTextNode(' '), node);     // a space beside it keeps the words apart when the <br> is hidden
        return;
      }
      var text = node.nodeValue;
      if (!text.trim()) { el.removeChild(node); return; }
      var parts = text.split(/(\s+)/);
      var frag = document.createDocumentFragment();
      parts.forEach(function (part) {
        if (!part) return;
        if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(' ')); return; }
        var span = document.createElement('span');
        span.className = 'word-wrap';
        span.textContent = part;
        span.style.setProperty('--d', (startDelay + count * STEP) + 'ms');
        frag.appendChild(span);
        count++;
      });
      el.replaceChild(frag, node);
    });
    return count;
  }

  var headStart = PIN_START + PIN_LEAD;
  var headWords = wrapWords(document.getElementById('headline'), headStart);
  var subStart = headStart + (headWords - 1) * STEP + WORD_DUR * SETTLE;   // right as the last heading word lands
  var subWords = wrapWords(document.getElementById('sub'), subStart);
  var ctaStart = subStart + (subWords - 1) * STEP + WORD_DUR * SETTLE;     // then the button, from the bottom
  document.documentElement.style.setProperty('--cta-delay', ctaStart + 'ms');

  // The doorway: an arch-topped opening cut out of the frosted wall with an SVG alpha mask
  // (evenodd path, blurred so the edge feathers), and a thin stroke drawn along the same arch.
  var wall = document.getElementById('wall');
  var lip = document.getElementById('lip');
  var lipOut = document.getElementById('lipOut');
  var lipIn = document.getElementById('lipIn');
  var doorProbe = document.createElement('div');
  doorProbe.style.cssText = 'position:absolute;visibility:hidden;width:var(--door-w);top:var(--door-top);height:0';
  document.body.appendChild(doorProbe);

  function archPath(x, top, w, extend) {
    var r = w / 2, bottom = extend;
    return 'M' + x + ',' + bottom + ' V' + (top + r) + ' A' + r + ',' + r + ' 0 0 1 ' + (x + w) + ',' + (top + r) + ' V' + bottom;
  }
  function buildDoor() {
    var W = window.innerWidth, H = window.innerHeight;
    var w = doorProbe.offsetWidth, top = doorProbe.offsetTop;
    var x = (W - w) / 2;
    var PAD = 24;                                   // the wall's overhang past the viewport (matches .wall inset)
    var MW = W + 2 * PAD, MH = H + 2 * PAD;         // mask drawn in the wall's own box
    var pad = 80, blur = 12;
    var outer = 'M' + (-pad) + ',' + (-pad) + ' H' + (MW + pad) + ' V' + (MH + pad) + ' H' + (-pad) + ' Z ';
    var hole = archPath(x + PAD, top + PAD, w, MH + pad) + ' Z';
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + MW + '" height="' + MH + '" viewBox="0 0 ' + MW + ' ' + MH + '">' +
      '<filter id="f" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="' + blur + '"/></filter>' +
      '<path fill="#fff" fill-rule="evenodd" filter="url(#f)" d="' + outer + hole + '"/></svg>';
    var url = 'url("data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) + '")';
    wall.style.webkitMaskImage = url; wall.style.maskImage = url;
    lip.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    lipOut.setAttribute('d', archPath(x, top, w, H + 2));
    lipIn.setAttribute('d', archPath(x + 4, top + 4, w - 8, H + 2));
  }
  buildDoor();
  var resizeTimer;
  window.addEventListener('resize', function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(buildDoor, 80); });

  // Pointer parallax: the wall drifts against the pointer, the copy drifts with it, so the doorway reads as depth.
  var fine = window.matchMedia('(pointer: fine)').matches && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (fine) {
    var copy = document.querySelector('.hero-copy');
    var tx = 0, ty = 0, cx = 0, cy = 0, raf = 0;
    function tick() {
      cx += (tx - cx) * 0.08; cy += (ty - cy) * 0.08;
      var wallT = 'translate3d(' + (-cx * 14).toFixed(2) + 'px,' + (-cy * 10).toFixed(2) + 'px,0)';
      wall.style.transform = wallT; lip.style.transform = wallT;
      copy.style.transform = 'translate3d(' + (cx * 6).toFixed(2) + 'px,' + (cy * 4).toFixed(2) + 'px,0)';
      if (Math.abs(tx - cx) > 0.001 || Math.abs(ty - cy) > 0.001) raf = requestAnimationFrame(tick); else raf = 0;
    }
    window.addEventListener('pointermove', function (e) {
      tx = e.clientX / window.innerWidth - 0.5; ty = e.clientY / window.innerHeight - 0.5;
      if (!raf) raf = requestAnimationFrame(tick);
    });
    document.documentElement.addEventListener('pointerleave', function () { tx = 0; ty = 0; if (!raf) raf = requestAnimationFrame(tick); });
  }

  // Background video: started by script (no autoplay attribute) and restarted after autoplay refusals
  // and tab switches. Reduced motion leaves it on its first frame.
  var v = document.getElementById('bg');
  var motionMq = window.matchMedia('(prefers-reduced-motion: reduce)');
  function resume() {
    if (!v || motionMq.matches || !v.paused || document.hidden) return;
    try { var p = v.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  if (v) {
    if (!motionMq.matches) v.preload = 'auto';
    ['canplay', 'ended'].forEach(function (ev) { v.addEventListener(ev, resume); });
    if (motionMq.addEventListener) motionMq.addEventListener('change', function () { if (motionMq.matches) v.pause(); else resume(); });
  }
  document.addEventListener('visibilitychange', resume);
  window.addEventListener('pageshow', resume);
  window.addEventListener('pointerdown', resume, { once: true });
  resume();

  // Mobile menu: focus moves to the first link on open, Tab stays among the burger and the links,
  // the hero behind is inert, and closing returns focus to the burger.
  var burger = document.getElementById('burger');
  var menu = document.getElementById('menu');
  var hero = document.querySelector('main.hero');
  var menuLinks = Array.prototype.slice.call(menu.querySelectorAll('a'));
  function isOpen() { return menu.classList.contains('is-open'); }
  function setMenu(open, returnFocus) {
    menu.classList.toggle('is-open', open);
    burger.classList.toggle('is-open', open);
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    document.body.style.overflow = open ? 'hidden' : '';
    if (hero) hero.inert = open;
    if (open) menuLinks[0].focus();
    else if (returnFocus) burger.focus();
  }
  burger.addEventListener('click', function () { setMenu(!isOpen(), true); });
  menu.addEventListener('click', function (e) { if (e.target.tagName === 'A') setMenu(false, true); });
  document.addEventListener('keydown', function (e) {
    if (!isOpen()) return;
    if (e.key === 'Escape') { setMenu(false, true); return; }
    if (e.key !== 'Tab') return;
    var ring = [burger].concat(menuLinks);
    var i = ring.indexOf(document.activeElement);
    e.preventDefault();
    var next = i < 0 ? 0 : (i + (e.shiftKey ? -1 : 1) + ring.length) % ring.length;
    ring[next].focus();
  });
  window.addEventListener('resize', function () { if (window.innerWidth >= 768 && isOpen()) setMenu(false, false); });
});
</script>
</body>
</html>
