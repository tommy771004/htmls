<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>極光呼吸 · 4-7-8</title>
<meta name="description" content="4-7-8 呼吸引導：極光星空下的有機光球，合成音量隨呼吸起伏。收錄於 100 Creative HTML Works（040・極光冥想）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/web/040-aurora-breathe.html">
<style>
:root{
  --night:#050b1f; --night2:#0b1638; --green:#5cffc0; --teal:#3fd6d0; --violet:#a47cff; --rose:#ff8fd8; --ice:#dff6ff;
  --f:"Segoe UI Light","Segoe UI","Microsoft JhengHei Light","Microsoft JhengHei","PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--night);color:var(--ice);font-family:var(--f);font-weight:300;-webkit-font-smoothing:antialiased}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas#aur{position:fixed;inset:0;width:100%;height:100%;display:block;filter:blur(14px) saturate(1.2);mix-blend-mode:screen;opacity:.9}
.ridge{position:fixed;left:0;right:0;bottom:0;width:100%;height:24vh;display:block;pointer-events:none}
.ui{position:relative;z-index:2;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:22px 28px 26px}
.bar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.brand{font-size:13px;letter-spacing:.32em;opacity:.82}
.brand b{display:block;font-weight:300;font-size:26px;letter-spacing:.14em;margin-top:6px;opacity:1}
.set{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;border:1px solid rgba(223,246,255,.22);background:rgba(10,24,60,.35);backdrop-filter:blur(6px);border-radius:999px;padding:4px 6px 4px 14px;font-size:13px;letter-spacing:.1em}
.pill button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(223,246,255,.08);color:var(--ice);font:300 20px/1 var(--f);cursor:pointer}
.pill button:hover{background:rgba(223,246,255,.18)}
.pill output{min-width:1.6em;text-align:center;font-size:16px}
.snd{min-height:48px;padding:0 16px;border-radius:999px;border:1px solid rgba(223,246,255,.22);background:rgba(10,24,60,.35);color:var(--ice);font:300 13px var(--f);letter-spacing:.14em;cursor:pointer}
.snd[aria-pressed="true"]{border-color:rgba(92,255,192,.6);color:var(--green)}

.center{display:grid;place-items:center;position:relative}
.orb{position:relative;width:min(62vmin,440px);aspect-ratio:1;cursor:pointer;border:0;background:none;padding:0;color:inherit;border-radius:50%}
.orb:focus-visible{outline:1px dashed rgba(223,246,255,.5);outline-offset:10px}
.orb svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.blob{filter:drop-shadow(0 0 30px rgba(92,255,192,.45)) drop-shadow(0 0 80px rgba(164,124,255,.35))}
.label{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.phase{font-size:clamp(30px,5.4vmin,46px);letter-spacing:.3em;text-indent:.3em;color:#fff;text-shadow:0 0 24px rgba(5,11,31,.6)}
.count{font-size:clamp(56px,11vmin,96px);line-height:1;margin-top:6px;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 0 30px rgba(5,11,31,.5)}
.sub{margin-top:10px;font-size:14px;letter-spacing:.18em;opacity:.8;min-height:1.4em}
.fadeSwap{animation:swap .8s ease}
@keyframes swap{from{opacity:0;filter:blur(6px)}}

.foot{display:grid;justify-items:center;gap:14px}
.go{min-width:180px;min-height:54px;border-radius:999px;border:1px solid rgba(92,255,192,.5);background:linear-gradient(90deg,rgba(92,255,192,.18),rgba(164,124,255,.2));color:#fff;font:300 17px var(--f);letter-spacing:.4em;text-indent:.4em;cursor:pointer;box-shadow:0 0 40px rgba(92,255,192,.15);transition:box-shadow .6s,background .6s}
.go:hover{box-shadow:0 0 60px rgba(92,255,192,.35)}
.legend{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:13px;letter-spacing:.14em;opacity:.85}
.legend i{display:inline-block;width:22px;height:3px;border-radius:2px;vertical-align:middle;margin-right:8px}
.rounds{font-size:12px;letter-spacing:.3em;opacity:.7}
.rounds span{display:inline-block;width:8px;height:8px;border-radius:50%;border:1px solid rgba(223,246,255,.6);margin:0 4px;vertical-align:middle;transition:background .6s}
.rounds span.on{background:var(--green);border-color:var(--green);box-shadow:0 0 10px var(--green)}
.note{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:min(560px,90vw);text-align:center;font-size:14px;line-height:1.8;letter-spacing:.08em;opacity:0;transition:opacity 1.2s;pointer-events:none}
.note.on{opacity:.95}

@media (max-width:600px){
  .ui{padding:16px 16px 20px}
  .brand b{font-size:21px}
  .set{width:100%}
  .orb{width:min(78vw,340px)}
  .legend{gap:10px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){ canvas#aur{opacity:.6} .fadeSwap{animation:none} .note,.rounds span,.go{transition:none} }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="aur" aria-hidden="true"></canvas>
<svg class="ridge" viewBox="0 0 1440 240" preserveAspectRatio="none" aria-hidden="true">
  <defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1330"/><stop offset="1" stop-color="#02040c"/></linearGradient></defs>
  <path d="M0 150L90 110 170 140 260 70 330 120 420 60 520 130 610 100 700 150 780 90 880 140 960 80 1040 120 1130 50 1220 120 1310 90 1440 130V240H0z" fill="#0b1640" opacity=".8"/>
  <path d="M0 190L120 150 220 180 330 130 450 185 560 160 690 200 800 150 930 190 1050 145 1180 190 1300 160 1440 185V240H0z" fill="url(#rg)"/>
</svg>

<div class="ui">
  <div class="bar">
    <div class="brand">AURORA BREATH<b>極光呼吸 · 4-7-8</b></div>
    <div class="set">
      <div class="pill" aria-label="輪數">輪數
        <button id="minus" aria-label="減少一輪">−</button><output id="nRounds">4</output><button id="plus" aria-label="增加一輪">+</button>
      </div>
      <button class="snd" id="snd" aria-pressed="false">聲音 關</button>
    </div>
  </div>

  <div class="center">
    <button class="orb" id="orb" aria-label="開始或暫停呼吸練習">
      <svg viewBox="-220 -220 440 440" aria-hidden="true">
        <defs>
          <radialGradient id="bg1" cx="0" cy="0" r="200" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#e9fff6" stop-opacity=".95"/>
            <stop offset=".35" stop-color="#5cffc0" stop-opacity=".7"/>
            <stop offset=".75" stop-color="#3fb6d6" stop-opacity=".35"/>
            <stop offset="1" stop-color="#a47cff" stop-opacity=".15"/>
          </radialGradient>
        </defs>
        <circle r="206" fill="none" stroke="rgba(223,246,255,.08)" stroke-width="2"/>
        <g id="ring" transform="rotate(-90)"></g>
        <circle id="dot" r="6" fill="#fff" cx="0" cy="-206" style="filter:drop-shadow(0 0 6px #fff)"/>
        <path id="blob" class="blob" fill="url(#bg1)"/>
      </svg>
      <div class="label">
        <div class="phase" id="phase">靜下來</div>
        <div class="count" id="count">&nbsp;</div>
        <div class="sub" id="sub">點一下光，開始</div>
      </div>
    </button>
  </div>

  <div class="foot">
    <div class="note" id="note"></div>
    <div class="rounds" id="dots" aria-label="完成輪數"></div>
    <button class="go" id="go">開始</button>
    <div class="legend">
      <span><i style="background:#5cffc0"></i>吸氣 4 秒</span>
      <span><i style="background:#8fd3ff"></i>屏息 7 秒</span>
      <span><i style="background:#a47cff"></i>吐氣 8 秒</span>
      <span style="opacity:.7">空白鍵 開始 / 暫停</span>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var PH = [
    {k:"in",   n:"吸氣", d:4, sub:"閉上嘴，用鼻子安靜地吸", c:"#5cffc0"},
    {k:"hold", n:"屏息", d:7, sub:"停住，舌尖輕抵上門牙後方", c:"#8fd3ff"},
    {k:"out",  n:"吐氣", d:8, sub:"用嘴巴，呼——出來", c:"#a47cff"}
  ];
  var CYCLE = 19, rounds = 4;
  var state = "idle", t0 = 0, elapsed = 0, pausedAt = 0, lastPhase = -1, lastSec = -1;
  var breath = .62;            /* 0..1 size of the orb */
  var endMsgs = ["心跳慢下來了嗎？極光會替你記得這一刻。","今晚的天空很安靜，你也是。","吸進冷空氣，吐出一整天。","做得很好。現在，什麼都不用做。"];

  /* ---------- ring segments 4:7:8 ---------- */
  var ring = $("#ring"), R = 206, C = 2 * Math.PI * R;
  if(ring){
    var off = 0, gap = 6;
    PH.forEach(function(p){
      var len = p.d / CYCLE * C;
      var c = document.createElementNS("http://www.w3.org/2000/svg","circle");
      c.setAttribute("r", R); c.setAttribute("fill","none"); c.setAttribute("stroke", p.c); c.setAttribute("stroke-width","3"); c.setAttribute("stroke-linecap","round");
      c.setAttribute("stroke-dasharray", (len - gap) + " " + (C - len + gap)); c.setAttribute("stroke-dashoffset", -off); c.setAttribute("opacity",".55");
      ring.appendChild(c); off += len;
    });
  }
  function drawDots(done){
    var d = $("#dots"); if(!d) return;
    var h = ""; for(var i=0;i<rounds;i++) h += '<span class="'+(i < done ? "on" : "")+'"></span>'; d.innerHTML = h;
  }

  /* ---------- blob ---------- */
  var blob = $("#blob"), dot = $("#dot");
  function blobPath(scale, t){
    var pts = [], N = 64, base = 190 * scale;
    for(var i=0;i<N;i++){
      var a = i / N * Math.PI * 2;
      var r = base * (1 + .045 * Math.sin(3*a + t*.9) + .03 * Math.sin(5*a - t*1.3) + .02 * Math.sin(7*a + t*.5));
      pts.push([Math.cos(a) * r, Math.sin(a) * r]);
    }
    var d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
    for(var j=0;j<N;j++){
      var p1 = pts[(j+1)%N], p2 = pts[(j+2)%N];
      d += "Q" + p1[0].toFixed(1) + " " + p1[1].toFixed(1) + " " + ((p1[0]+p2[0])/2).toFixed(1) + " " + ((p1[1]+p2[1])/2).toFixed(1);
    }
    return d + "Z";
  }
  function ease(x){ return .5 - .5 * Math.cos(Math.PI * Math.max(0, Math.min(1, x))); }

  /* ---------- sound ---------- */
  var ac = null, pad = null, soundOn = false;
  function ensureAudio(){
    try{
      if(!ac){ var A = window.AudioContext || window.webkitAudioContext; if(!A) return null; ac = new A(); }
      if(ac.state === "suspended") ac.resume();
      if(!pad){
        var g = ac.createGain(); g.gain.value = 0;
        var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 700; f.Q.value = .5;
        [196, 293.66, 392.0, 587.3].forEach(function(fr, i){ var o = ac.createOscillator(); o.type = i % 2 ? "triangle" : "sine"; o.frequency.value = fr; o.detune.value = (i - 1.5) * 4; var og = ac.createGain(); og.gain.value = [.5,.28,.2,.08][i]; o.connect(og); og.connect(f); o.start(); });
        f.connect(g); g.connect(ac.destination); pad = {g:g, f:f};
      }
    }catch(e){ ac = null; }
    return ac;
  }
  function padTo(level, secs, bright){
    if(!pad || !ac) return; var t = ac.currentTime;
    pad.g.gain.cancelScheduledValues(t); pad.g.gain.setValueAtTime(pad.g.gain.value, t); pad.g.gain.linearRampToValueAtTime(soundOn ? level : 0, t + secs);
    pad.f.frequency.cancelScheduledValues(t); pad.f.frequency.setValueAtTime(pad.f.frequency.value, t); pad.f.frequency.linearRampToValueAtTime(bright, t + secs);
  }
  function chime(freq){
    if(!soundOn || !ac) return; var t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.value = freq; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.06, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + 2.2);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 2.3);
  }

  /* ---------- session control ---------- */
  var goBtn = $("#go"), orb = $("#orb"), phaseEl = $("#phase"), countEl = $("#count"), subEl = $("#sub"), note = $("#note");
  function setText(el, v, anim){ if(!el || el.textContent === v) return; el.textContent = v; if(anim){ el.classList.remove("fadeSwap"); void el.offsetWidth; el.classList.add("fadeSwap"); } }
  function start(){
    if(state === "run") return;
    if(soundOn) ensureAudio();
    if(state === "pause"){ t0 = performance.now() - pausedAt; state = "run"; lastPhase = -1; if(goBtn) goBtn.textContent = "暫停"; return; }
    state = "run"; t0 = performance.now(); lastPhase = -1; lastSec = -1;
    if(note) note.classList.remove("on");
    drawDots(0); if(goBtn) goBtn.textContent = "暫停";
  }
  function pause(){ if(state !== "run") return; state = "pause"; pausedAt = performance.now() - t0; if(goBtn) goBtn.textContent = "繼續"; setText(subEl, "暫停中 · 慢慢來", true); padTo(.015, 1.5, 500); }
  function finish(){
    state = "done"; if(goBtn) goBtn.textContent = "再來一次";
    setText(phaseEl, "完成", true); setText(countEl, rounds + "", false); setText(subEl, "共 " + rounds + " 輪 · 約 " + Math.round(rounds * CYCLE / 60 * 10) / 10 + " 分鐘", true);
    if(note){ note.textContent = endMsgs[Math.random() * endMsgs.length | 0]; note.classList.add("on"); }
    drawDots(rounds); padTo(0, 4, 400); chime(523.25); setTimeout(function(){ chime(784); }, 400);
  }
  function toggle(){ if(state === "run") pause(); else { if(state === "done") state = "idle"; start(); } }
  if(goBtn) goBtn.addEventListener("click", toggle);
  if(orb) orb.addEventListener("click", toggle);
  document.addEventListener("keydown", function(e){
    if(e.key === " " || e.code === "Space"){ e.preventDefault(); toggle(); }
    else if(e.key === "Escape" && state !== "idle"){ state = "idle"; if(goBtn) goBtn.textContent = "開始"; setText(phaseEl, "靜下來", true); setText(countEl, " ", false); setText(subEl, "點一下光，開始", true); drawDots(0); padTo(0, 1.5, 400); }
  });
  var nR = $("#nRounds");
  function setRounds(n){
    if(state === "run") return; rounds = Math.max(1, Math.min(8, n)); if(nR) nR.textContent = rounds; drawDots(0);
    /* Weil's own guidance: no more than 4 breaths at a time for the first month */
    if(state === "idle") setText(subEl, rounds > 4 ? "初學第一個月，建議一次 4 輪以內" : "點一下光，開始", true);
  }
  var mi = $("#minus"), pl = $("#plus");
  if(mi) mi.addEventListener("click", function(){ setRounds(rounds - 1); });
  if(pl) pl.addEventListener("click", function(){ setRounds(rounds + 1); });
  var snd = $("#snd");
  if(snd) snd.addEventListener("click", function(){
    soundOn = !soundOn; snd.setAttribute("aria-pressed", soundOn ? "true" : "false"); snd.textContent = soundOn ? "聲音 開" : "聲音 關";
    if(soundOn){ ensureAudio(); padTo(state === "run" ? .05 : .02, 1.5, 600); } else padTo(0, .6, 400);
  });

  /* ---------- per-frame breathing logic ---------- */
  var intensity = .5, lastNow = 0;
  function update(now){
    var t = now / 1000, dt = Math.min(.1, lastNow ? (now - lastNow) / 1000 : 1/60); lastNow = now;
    if(state === "run"){
      elapsed = (now - t0) / 1000;
      var cyc = Math.floor(elapsed / CYCLE);
      if(cyc >= rounds){ finish(); }
      else {
        var within = elapsed - cyc * CYCLE, pi = within < 4 ? 0 : within < 11 ? 1 : 2;
        var pStart = pi === 0 ? 0 : pi === 1 ? 4 : 11, p = PH[pi], prog = (within - pStart) / p.d;
        if(pi === 0) breath = .55 + .45 * ease(prog);
        else if(pi === 1) breath = 1 + (reduce ? 0 : .012 * Math.sin(t * 3));
        else breath = 1 - .45 * ease(prog);
        if(pi !== lastPhase){
          lastPhase = pi; setText(phaseEl, p.n, true); setText(subEl, p.sub, true); drawDots(cyc);
          if(pi === 0){ padTo(.06, 4, 1400); chime(392); }
          else if(pi === 1){ padTo(.05, 1, 1200); chime(440); }
          else { padTo(.012, 8, 380); chime(329.6); }
        }
        var sec = Math.ceil(p.d - (within - pStart)); if(sec !== lastSec){ lastSec = sec; setText(countEl, String(sec), false); }
        var ang = within / CYCLE * Math.PI * 2 - Math.PI / 2;
        if(dot){ dot.setAttribute("cx", (Math.cos(ang) * R).toFixed(1)); dot.setAttribute("cy", (Math.sin(ang) * R).toFixed(1)); }
      }
    } else if(state === "idle" || state === "done"){
      breath += ((.6 + (reduce ? 0 : .05 * Math.sin(t * 1.1))) - breath) * (1 - Math.pow(.95, dt * 60)); /* same settle speed at any refresh rate */
    }
    intensity = .35 + breath * .65;
    if(blob) blob.setAttribute("d", blobPath(breath, reduce ? 0 : t));
  }

  /* ---------- sky & aurora ---------- */
  var sky = $("#sky"), aur = $("#aur"), sctx = sky.getContext ? sky.getContext("2d") : null, actx = aur.getContext ? aur.getContext("2d") : null;
  var W = 0, H = 0, stars = [], AW = 0, AH = 0;
  function resize(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    sky.width = Math.round(W * dpr); sky.height = Math.round(H * dpr);
    AW = Math.max(160, Math.round(W / 3)); AH = Math.max(120, Math.round(H / 3)); aur.width = AW; aur.height = AH;
    stars = []; var n = Math.round(W * H / 5200);
    for(var i=0;i<n;i++) stars.push({x:Math.random(), y:Math.random() * .8, r:Math.random() * 1.3 + .2, p:Math.random() * 6.28, s:.5 + Math.random() * 1.5});
    if(sctx) sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  function drawSky(t){
    if(!sctx) return;
    var g = sctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#030716"); g.addColorStop(.55, "#0a1636"); g.addColorStop(1, "#132452");
    sctx.fillStyle = g; sctx.fillRect(0, 0, W, H);
    for(var i=0;i<stars.length;i++){
      var s = stars[i], a = .35 + .45 * (reduce ? .5 : (.5 + .5 * Math.sin(t * s.s + s.p)));
      sctx.fillStyle = "rgba(230,245,255," + a.toFixed(2) + ")"; sctx.beginPath(); sctx.arc(s.x * W, s.y * H, s.r, 0, 6.283); sctx.fill();
    }
  }
  var BANDS = [
    {y:.30, amp:.08, f:1.6, sp:.10, h:.34, c0:"rgba(92,255,192,", c1:"rgba(63,214,208,"},
    {y:.22, amp:.06, f:2.3, sp:-.07, h:.26, c0:"rgba(164,124,255,", c1:"rgba(255,143,216,"},
    {y:.40, amp:.05, f:3.1, sp:.05, h:.22, c0:"rgba(120,255,170,", c1:"rgba(143,211,255,"}
  ];
  function drawAurora(t){
    if(!actx) return;
    actx.clearRect(0, 0, AW, AH);
    actx.globalCompositeOperation = "lighter";
    var tt = reduce ? 0 : t;
    BANDS.forEach(function(b, bi){
      var steps = 60, lw = AW / steps + 1;
      for(var i=0;i<=steps;i++){
        var x = i / steps, px = x * AW;
        var y = (b.y + b.amp * Math.sin(x * b.f * 6.283 + tt * b.sp * 6) + .03 * Math.sin(x * 17 + tt * .7 + bi)) * AH;
        var hgt = b.h * AH * (.55 + .45 * Math.sin(x * 9 + tt * .5 + bi * 2)) * (.6 + intensity * .6);
        var flick = .55 + .45 * Math.sin(x * 40 + tt * 1.7 + bi);
        var a = (.18 + .22 * intensity) * flick;
        var g = actx.createLinearGradient(0, y - hgt, 0, y + 6);
        g.addColorStop(0, b.c1 + "0)"); g.addColorStop(.7, b.c0 + (a * .8).toFixed(3) + ")"); g.addColorStop(1, b.c0 + a.toFixed(3) + ")");
        actx.fillStyle = g; actx.fillRect(px, y - hgt, lw, hgt + 6);
      }
    });
    actx.globalCompositeOperation = "source-over";
  }

  var lastDraw = 0;
  function frame(now){
    requestAnimationFrame(frame);
    if(document.hidden) return;
    update(now);
    if(now - lastDraw < 33) return; lastDraw = now;
    var t = now / 1000; drawSky(t); drawAurora(t);
  }
  document.addEventListener("visibilitychange", function(){ if(document.hidden && state === "run") pause(); lastNow = 0; });
  resize(); drawDots(0); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
