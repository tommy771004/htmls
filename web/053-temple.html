<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天恩宮 · 擲筊求籤</title>
<meta name="description" content="稟告、擲筊、搖籤、確認、解籤全流程，12 首原創七言籤詩。收錄於 100 Creative HTML Works（053・台灣廟宇）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/web/053-temple.html">
<style>
:root{
  --red:#b3241b; --red2:#8e1a13; --red3:#d6452f; --gold:#e0ad4a; --gold2:#f7d98a; --gold3:#9c6f1f;
  --green:#1e3b32; --green2:#2c5446; --ink:#1b1310; --paper:#f4e7c6; --pink:#f1c9c0;
  --kai:"DFKai-SB","BiauKai","標楷體","Kaiti TC","STKaiti","KaiTi",serif;
  --ming:"PMingLiU","MingLiU","Songti TC","Noto Serif TC",serif;
}
*{box-sizing:border-box}
html{background:#2a0c09}
body{margin:0;color:var(--paper);font-family:var(--kai);
  background:
    radial-gradient(circle at 50% 0%,rgba(255,190,90,.18),transparent 55%),
    repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 2px,transparent 2px 64px),
    linear-gradient(#5a120d,#3a0c08 60%,#2a0c09)}
button{font:inherit;color:inherit}

/* ---------- roof & lintel ---------- */
.gate{max-width:1120px;margin:0 auto;padding:0 clamp(8px,2vw,24px)}
.roof{display:block;width:100%;height:auto;margin-top:6px}
.lintel{position:relative;margin:-2px clamp(10px,4vw,48px) 0;background:var(--green);border:3px solid var(--gold3);border-top:0;
  padding:clamp(12px,2vw,20px) 0;display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,40px)}
.lintel::before,.lintel::after{content:"";position:absolute;inset:6px;border:1px solid rgba(224,173,74,.5);pointer-events:none}
.lintel::after{inset:auto 0 -12px 0;height:12px;border:0;background:repeating-linear-gradient(90deg,var(--gold3) 0 10px,var(--red2) 10px 12px,var(--gold) 12px 22px,var(--red2) 22px 24px)}
.fret{flex:1;height:22px;max-width:230px;background:
  linear-gradient(90deg,transparent 0 0) ,
  repeating-linear-gradient(90deg,transparent 0 0);}
.fret svg{width:100%;height:100%;display:block}
.plaque{position:relative;background:linear-gradient(#0f231d,#18342b);border:4px solid var(--gold);outline:2px solid var(--gold3);outline-offset:4px;
  padding:clamp(6px,1vw,10px) clamp(18px,3vw,34px);display:flex;align-items:center;gap:clamp(8px,1.4vw,16px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.plaque .main{font:700 clamp(34px,6vw,64px)/1.05 var(--kai);letter-spacing:.14em;color:var(--gold2);text-shadow:0 2px 0 #7a5410,0 0 18px rgba(247,217,138,.3)}
.plaque .v{writing-mode:vertical-rl;font:400 clamp(10px,1.1vw,13px)/1 var(--kai);letter-spacing:.2em;color:var(--gold)}

/* ---------- door frame ---------- */
.frame{position:relative;display:grid;grid-template-columns:clamp(40px,7vw,86px) minmax(0,1fr) clamp(40px,7vw,86px);gap:clamp(6px,1.4vw,16px);margin-top:22px}
.pillar{background:linear-gradient(90deg,#6e140e,var(--red) 30%,var(--red3) 50%,var(--red) 70%,#6e140e);border:2px solid var(--gold3);position:relative;
  display:flex;justify-content:center;padding:16px 0;min-height:420px}
.pillar::before,.pillar::after{content:"";position:absolute;left:-6px;right:-6px;height:14px;background:var(--gold3);border:2px solid var(--gold)}
.pillar::before{top:-8px}.pillar::after{bottom:-8px}
.couplet{writing-mode:vertical-rl;font:700 clamp(18px,2.6vw,30px)/1 var(--kai);letter-spacing:.32em;color:#101010;
  background:var(--pink);padding:14px clamp(4px,.8vw,10px);border:2px solid var(--gold);box-shadow:inset 0 0 0 3px var(--pink),inset 0 0 0 4px var(--red2);
  text-shadow:0 0 1px rgba(0,0,0,.3)}
.lantern{position:absolute;z-index:3;top:-8px;width:clamp(44px,5vw,64px);transform-origin:50% 0;animation:sway 5s ease-in-out infinite}
.lantern.l{left:calc(clamp(40px,7vw,86px) + 18px)}.lantern.r{right:calc(clamp(40px,7vw,86px) + 18px);animation-delay:-2.3s}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

/* ---------- hall ---------- */
.hall{position:relative;background:linear-gradient(#26100c,#1a0b08);border:3px solid var(--gold3);box-shadow:inset 0 0 60px rgba(0,0,0,.7);padding:clamp(14px,2.4vw,26px) clamp(10px,2.4vw,28px) 22px;min-width:0}
.steps{display:flex;justify-content:center;flex-wrap:wrap;gap:4px clamp(6px,1.4vw,18px);margin:26px 0 10px;padding:0;list-style:none}
.steps li{font:400 clamp(13px,1.4vw,16px)/1 var(--kai);color:#8f6b52;display:flex;align-items:center;gap:6px}
.steps li b{display:inline-grid;place-items:center;width:24px;height:24px;border:1px solid currentColor;border-radius:50%;font:400 12px/1 var(--ming)}
.steps li.on{color:var(--gold2)}
.steps li.on b{background:var(--red);border-color:var(--gold)}
.steps li.done{color:var(--gold3)}

.stage{position:relative;height:clamp(300px,44vh,400px);border-radius:4px;overflow:hidden;
  background:radial-gradient(ellipse 70% 40% at 50% 100%,rgba(224,173,74,.16),transparent 70%),
  linear-gradient(#2b120d 0 46%,#4b1a12 46% 47%,#3a130d 47%),#3a130d}
.stage .floor{position:absolute;left:0;right:0;bottom:0;height:53%;background:
  repeating-linear-gradient(90deg,transparent 0 58px,rgba(0,0,0,.25) 58px 60px),
  repeating-linear-gradient(0deg,transparent 0 38px,rgba(0,0,0,.25) 38px 40px),
  linear-gradient(#5b2217,#43180f);transform:perspective(320px) rotateX(38deg);transform-origin:50% 100%;opacity:.9}
.altar{position:absolute;left:50%;top:6%;transform:translateX(-50%);width:min(560px,94%);height:auto}
.smoke{position:absolute;left:50%;top:6%;width:120px;height:90px;transform:translateX(-50%);pointer-events:none}
.smoke i{position:absolute;bottom:0;width:14px;height:14px;border-radius:50%;background:rgba(235,225,210,.35);filter:blur(5px);animation:rise 5s linear infinite;opacity:0}
.smoke i:nth-child(1){left:44px}.smoke i:nth-child(2){left:58px;animation-delay:-1.7s}.smoke i:nth-child(3){left:72px;animation-delay:-3.4s}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.8}100%{transform:translate(14px,-90px) scale(2.4);opacity:0}}
.lit .smoke i{background:rgba(245,235,220,.6)}

.jiao{position:absolute;left:0;top:0;width:clamp(70px,9vw,96px);height:auto;will-change:transform;filter:drop-shadow(0 6px 4px rgba(0,0,0,.5))}
.jiao .yin{display:none}
.jiao.convex .yang{display:none}.jiao.convex .yin{display:block}
.jlabel{position:absolute;font:700 14px/1 var(--kai);color:var(--gold2);transform:translate(-50%,0);opacity:0;transition:opacity .4s;text-shadow:0 1px 2px #000}
.jlabel.on{opacity:1}

.tube{position:absolute;right:6%;bottom:12%;width:clamp(74px,10vw,110px);transform-origin:50% 100%;transition:right .6s,bottom .6s,transform .6s}
.tube.center{right:calc(50% - clamp(37px,5vw,55px));bottom:14%}
.tube.shake{animation:shake .12s linear 10}
@keyframes shake{0%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-4px)}100%{transform:rotate(-7deg)}}
.stick{transition:transform .8s cubic-bezier(.2,1.4,.4,1)}

.verdict{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);font:700 clamp(50px,9vw,96px)/1 var(--kai);color:var(--gold2);letter-spacing:.1em;
  text-shadow:0 3px 0 #6d0f0a,0 0 30px rgba(247,217,138,.5);opacity:0;pointer-events:none;white-space:nowrap;transition:transform .5s cubic-bezier(.2,1.6,.4,1),opacity .3s}
.verdict.on{opacity:1;transform:translate(-50%,-62%) scale(1)}
.verdict.sheng{color:var(--gold2)}.verdict.xiao{color:#ffe6c8}.verdict.yin{color:#b9cbb8;text-shadow:0 3px 0 #0f231d,0 0 24px rgba(0,0,0,.6)}

.panel{margin-top:16px;display:grid;gap:14px;justify-items:center;text-align:center}
.msg{text-wrap:balance;font:400 clamp(17px,1.9vw,21px)/1.7 var(--kai);color:var(--paper);max-width:640px;min-height:3.4em;margin:0}
.msg em{font-style:normal;color:var(--gold2)}
.cats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.cats[hidden]{display:none}
.cat{min-height:44px;min-width:64px;padding:0 14px;background:transparent;border:1px solid var(--gold3);color:var(--gold);font:700 17px/1 var(--kai);cursor:pointer;letter-spacing:.1em}
.cat[aria-pressed="true"]{background:var(--gold);color:var(--red2);border-color:var(--gold2)}
.act{position:relative;min-height:54px;padding:0 34px;background:linear-gradient(var(--red3),var(--red) 50%,var(--red2));border:2px solid var(--gold);outline:1px solid var(--gold3);outline-offset:3px;
  color:var(--gold2);font:700 clamp(19px,2vw,22px)/1 var(--kai);letter-spacing:.3em;cursor:pointer;box-shadow:0 6px 0 #4a0c07,0 10px 20px rgba(0,0,0,.4);transition:transform .08s,box-shadow .08s}
.act:active{transform:translateY(4px);box-shadow:0 2px 0 #4a0c07}
.act:disabled{opacity:.5;cursor:wait}
.act:focus-visible,.cat:focus-visible{outline:2px solid var(--gold2);outline-offset:4px}
.log{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:26px;font:400 13px/1 var(--kai);color:#b58f70}
.log span{border:1px solid #6c3b28;padding:5px 8px}
.log span.s{color:var(--gold2);border-color:var(--gold3)}
.small{font:400 13px/1.6 var(--kai);color:#a98670;margin:0}

/* ---------- 籤詩 ---------- */
.slipwrap{max-width:1120px;margin:34px auto 0;padding:0 clamp(8px,2vw,24px) 50px;display:grid;justify-items:center}
.slipwrap[hidden]{display:none}
.slip{position:relative;background:linear-gradient(#f7e6bf,#efd9a8);color:var(--ink);width:min(760px,100%);padding:clamp(14px,2.4vw,26px);
  box-shadow:0 20px 40px rgba(0,0,0,.5);border:2px solid #b3241b;animation:unroll .9s cubic-bezier(.2,.9,.2,1)}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.slip::before{content:"";position:absolute;inset:6px;border:1px solid #b3241b;pointer-events:none}
.slip .top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--red);padding:4px 10px 10px;color:var(--red);font:700 clamp(16px,2vw,20px)/1 var(--kai);letter-spacing:.2em}
.slip .top .no{font-size:clamp(26px,3.4vw,36px)}
.slip .grade{border:2px solid var(--red);padding:6px 10px;letter-spacing:.3em}
.slip .body{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(12px,3vw,34px);padding:18px 8px 6px}
.poem{writing-mode:vertical-rl;font:700 clamp(21px,2.8vw,30px)/1.9 var(--kai);letter-spacing:.2em;margin:0;height:max-content;padding-left:6px;border-left:1px dashed #b98a6a}
.poem span{display:block}
.jie{writing-mode:horizontal-tb;font:400 16px/1.7 var(--kai)}
.jie h3{margin:0 0 6px;color:var(--red);font:700 18px/1.4 var(--kai);letter-spacing:.3em}
.jie .sy{font-size:18px;margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid #d5b58a}
.jie dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.jie dt{color:var(--red);font-weight:700}
.jie dd{margin:0}
.jie .hit{background:rgba(179,36,27,.12);outline:1px solid rgba(179,36,27,.4)}
.seal{position:absolute;right:18px;bottom:16px;width:74px;height:74px;border:3px solid var(--red);color:var(--red);font:700 17px/1.1 var(--kai);display:grid;place-items:center;
  text-align:center;transform:rotate(-8deg);opacity:.8;letter-spacing:.1em}
@media (max-width:620px){
  .lantern{display:none}
  .couplet{font-size:16px;letter-spacing:.2em;padding:10px 3px}
  .steps li:not(.on){font-size:0;gap:0}
  .slip .body{grid-template-columns:1fr}
  .poem{justify-self:center;border-left:0;padding:0 0 10px;border-bottom:1px dashed #b98a6a}
  .seal{width:60px;height:60px;font-size:14px;right:12px;bottom:12px}
  .pillar{min-height:300px}
}
footer{text-align:center;font:400 12px/1.8 var(--kai);color:#8b6a55;padding:10px 16px 30px}
@media (prefers-reduced-motion:reduce){.lantern,.smoke i{animation:none}}
</style>
</head>

    <defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a6b58"/><stop offset="1" stop-color="#173028"/></linearGradient></defs>

  <div class="lintel">
    <div class="fret"><svg viewBox="0 0 230 22" preserveAspectRatio="none" aria-hidden="true"><path d="M0 11 H10 V3 H24 V17 H16 V9 M24 11 H38 V3 H52 V17 H44 V9 M52 11 H66 V3 H80 V17 H72 V9 M80 11 H94 V3 H108 V17 H100 V9 M108 11 H122 V3 H136 V17 H128 V9 M136 11 H150 V3 H164 V17 H156 V9 M164 11 H178 V3 H192 V17 H184 V9 M192 11 H206 V3 H220 V17 H212 V9 M220 11 H230" fill="none" stroke="#e0ad4a" stroke-width="1.6"/></svg></div>

      <span class="v">歲次丙午</span><span class="main" aria-hidden="true">宮恩天</span><span class="v">信眾敬獻</span>
    </div>
    <div class="fret"><svg viewBox="0 0 230 22" preserveAspectRatio="none" aria-hidden="true" style="transform:scaleX(-1)"><path d="M0 11 H10 V3 H24 V17 H16 V9 M24 11 H38 V3 H52 V17 H44 V9 M52 11 H66 V3 H80 V17 H72 V9 M80 11 H94 V3 H108 V17 H100 V9 M108 11 H122 V3 H136 V17 H128 V9 M136 11 H150 V3 H164 V17 H156 V9 M164 11 H178 V3 H192 V17 H184 V9 M192 11 H206 V3 H220 V17 H212 V9 M220 11 H230" fill="none" stroke="#e0ad4a" stroke-width="1.6"/></svg></div>
  </div>

  <div class="frame">
    <svg class="lantern l" viewBox="0 0 64 110" aria-hidden="true"><line x1="32" y1="0" x2="32" y2="14" stroke="#e0ad4a" stroke-width="2"/><rect x="20" y="12" width="24" height="7" fill="#e0ad4a"/><ellipse cx="32" cy="50" rx="28" ry="32" fill="#c8281c"/><path d="M14 26 Q32 50 14 76 M50 26 Q32 50 50 76 M32 18 V82" stroke="#8e1a13" stroke-width="1.5" fill="none"/><text x="32" y="58" text-anchor="middle" font-family="DFKai-SB,BiauKai,serif" font-size="20" font-weight="700" fill="#f7d98a">福</text><rect x="20" y="80" width="24" height="7" fill="#e0ad4a"/><path d="M24 87 V106 M28 87 V108 M32 87 V110 M36 87 V108 M40 87 V106" stroke="#e0ad4a" stroke-width="1.5"/></svg>
    <svg class="lantern r" viewBox="0 0 64 110" aria-hidden="true"><line x1="32" y1="0" x2="32" y2="14" stroke="#e0ad4a" stroke-width="2"/><rect x="20" y="12" width="24" height="7" fill="#e0ad4a"/><ellipse cx="32" cy="50" rx="28" ry="32" fill="#c8281c"/><path d="M14 26 Q32 50 14 76 M50 26 Q32 50 50 76 M32 18 V82" stroke="#8e1a13" stroke-width="1.5" fill="none"/><text x="32" y="58" text-anchor="middle" font-family="DFKai-SB,BiauKai,serif" font-size="20" font-weight="700" fill="#f7d98a">安</text><rect x="20" y="80" width="24" height="7" fill="#e0ad4a"/><path d="M24 87 V106 M28 87 V108 M32 87 V110 M36 87 V108 M40 87 V106" stroke="#e0ad4a" stroke-width="1.5"/></svg>

    <div class="pillar"><div class="couplet">聖筊一擲見分明</div></div>

    <main class="hall">
      <ol class="steps" id="steps">
        <li data-s="0"><b>一</b>稟告</li><li data-s="1"><b>二</b>請示</li><li data-s="2"><b>三</b>抽籤</li><li data-s="3"><b>四</b>確認</li><li data-s="4"><b>五</b>解籤</li>
      </ol>
      <div class="stage" id="stage">

          <g fill="#f7d98a" font-family="DFKai-SB,BiauKai,serif" font-size="11" font-weight="700" text-anchor="middle"><text x="280" y="118">合 境 平 安</text></g>
          <!-- incense burner -->
          <path d="M238 60 h84 q-4 30 -42 32 q-38 -2 -42 -32z" fill="#9c6f1f" stroke="#f7d98a" stroke-width="1.2"/>
          <path d="M236 56 h88 v6 h-88z" fill="#e0ad4a"/>
          <path d="M226 62 q-10 4 -6 14 M334 62 q10 4 6 14" stroke="#e0ad4a" stroke-width="3" fill="none"/>
          <path d="M256 90 l-6 4 M304 90 l6 4 M280 92 v4" stroke="#9c6f1f" stroke-width="3"/>
          <g stroke="#6b3a1c" stroke-width="2.2"><path d="M272 56 V14 M280 56 V10 M288 56 V14"/></g>
          <g fill="#ff7a3a" class="embers"><circle cx="272" cy="14" r="2.2"/><circle cx="280" cy="10" r="2.2"/><circle cx="288" cy="14" r="2.2"/></g>
          <!-- candles + fruit -->
          <g><rect x="120" y="50" width="14" height="42" fill="#c8281c"/><path d="M127 50 q-6 -10 0 -18 q6 8 0 18z" fill="#ffc05a"/><rect x="426" y="50" width="14" height="42" fill="#c8281c"/><path d="M433 50 q-6 -10 0 -18 q6 8 0 18z" fill="#ffc05a"/></g>
          <g><path d="M160 92 h56 l-6 -8 h-44z" fill="#9c6f1f"/><circle cx="176" cy="76" r="10" fill="#f08a1c"/><circle cx="196" cy="76" r="10" fill="#f39a26"/><circle cx="186" cy="64" r="10" fill="#f5a531"/>
             <path d="M346 92 h56 l-6 -8 h-44z" fill="#9c6f1f"/><path d="M356 82 q18 -34 36 -12 q-16 -6 -36 12z" fill="#e8c43a"/><path d="M362 84 q16 -30 34 -8 q-14 -4 -34 8z" fill="#d9b12a"/></g>
        </svg>
        <div class="smoke" aria-hidden="true"><i></i><i></i><i></i></div>

        <svg class="tube" id="tube" viewBox="0 0 110 200" aria-hidden="true">
          <g id="sticks" fill="#d8b476" stroke="#8a6a3a" stroke-width="1">
            <rect x="24" y="16" width="6" height="90" transform="rotate(-8 27 100)"/><rect x="34" y="8" width="6" height="96" transform="rotate(-4 37 100)"/>
            <rect x="46" y="4" width="6" height="100"/><rect x="58" y="10" width="6" height="96" transform="rotate(3 61 100)"/>
            <rect x="70" y="14" width="6" height="92" transform="rotate(7 73 100)"/><rect x="80" y="22" width="6" height="84" transform="rotate(11 83 100)"/>
          </g>
          <g class="stick" id="stick"><rect x="50" y="30" width="10" height="90" fill="#f0cf8e" stroke="#8a6a3a"/><text id="sticknum" x="55" y="44" writing-mode="tb" font-family="DFKai-SB,BiauKai,serif" font-size="11" font-weight="700" fill="#b3241b" text-anchor="start"></text></g>
          <path d="M16 70 H94 L90 196 H20Z" fill="#8a4b1c"/>
          <path d="M16 70 H94 L90 196 H20Z" fill="url(#bamboo)" opacity=".5"/>
          <defs><linearGradient id="bamboo" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset=".35" stop-color="#fff" stop-opacity=".4"/><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000"/></linearGradient></defs>
          <rect x="14" y="66" width="82" height="10" fill="#e0ad4a"/><rect x="18" y="130" width="74" height="6" fill="#e0ad4a"/><rect x="20" y="184" width="70" height="8" fill="#e0ad4a"/>
          <rect x="36" y="90" width="38" height="34" fill="#b3241b" stroke="#e0ad4a"/><text x="55" y="113" text-anchor="middle" font-family="DFKai-SB,BiauKai,serif" font-size="16" font-weight="700" fill="#f7d98a">籤</text>
        </svg>

        <svg class="jiao" id="j0" viewBox="0 0 100 60" aria-hidden="true">
          <g class="yang"><path d="M6 44 Q14 6 50 6 Q86 6 94 44 Q72 34 50 34 Q28 34 6 44Z" fill="#7a150e" stroke="#4a0906" stroke-width="2"/><path d="M11 40 Q18 11 50 11 Q82 11 89 40 Q70 31 50 31 Q30 31 11 40Z" fill="#e8744d"/><path d="M20 34 Q26 17 50 17 M60 18 Q74 20 80 32 M30 30 Q40 24 52 24" stroke="#c4532f" stroke-width="1" fill="none"/></g>
          <g class="yin"><path d="M6 44 Q14 6 50 6 Q86 6 94 44 Q72 34 50 34 Q28 34 6 44Z" fill="url(#dome)" stroke="#6d0f0a" stroke-width="2"/><ellipse cx="42" cy="16" rx="18" ry="5" fill="#ffd0b8" opacity=".55"/></g>
          <defs><radialGradient id="dome" cx="45%" cy="25%" r="80%"><stop offset="0" stop-color="#f06a4a"/><stop offset=".5" stop-color="#b3241b"/><stop offset="1" stop-color="#5a0d08"/></radialGradient></defs>
        </svg>
        <svg class="jiao" id="j1" viewBox="0 0 100 60" aria-hidden="true">
          <g class="yang"><path d="M6 44 Q14 6 50 6 Q86 6 94 44 Q72 34 50 34 Q28 34 6 44Z" fill="#7a150e" stroke="#4a0906" stroke-width="2"/><path d="M11 40 Q18 11 50 11 Q82 11 89 40 Q70 31 50 31 Q30 31 11 40Z" fill="#e8744d"/><path d="M20 34 Q26 17 50 17 M60 18 Q74 20 80 32 M30 30 Q40 24 52 24" stroke="#c4532f" stroke-width="1" fill="none"/></g>
          <g class="yin"><path d="M6 44 Q14 6 50 6 Q86 6 94 44 Q72 34 50 34 Q28 34 6 44Z" fill="url(#dome)" stroke="#6d0f0a" stroke-width="2"/><ellipse cx="42" cy="16" rx="18" ry="5" fill="#ffd0b8" opacity=".55"/></g>
        </svg>
        <div class="jlabel" id="l0"></div><div class="jlabel" id="l1"></div>
        <div class="verdict" id="verdict" aria-hidden="true"></div>
      </div>

      <div class="panel">
        <p class="msg" id="msg" aria-live="polite">信士請先<em>擇一所問之事</em>，於心中默念姓名、生辰、住址，再上香稟告。</p>
        <div class="cats" id="cats" role="group" aria-label="所問之事">
          <button class="cat" data-c="事業" aria-pressed="true">事業</button><button class="cat" data-c="姻緣" aria-pressed="false">姻緣</button>
          <button class="cat" data-c="財運" aria-pressed="false">財運</button><button class="cat" data-c="健康" aria-pressed="false">健康</button>
          <button class="cat" data-c="學業" aria-pressed="false">學業</button><button class="cat" data-c="尋物" aria-pressed="false">尋物</button>
        </div>
        <button class="act" id="act">上香稟告</button>
        <div class="log" id="log" aria-label="擲筊紀錄"></div>
        <p class="small">一平一凸為<b>聖筊</b>（允）· 兩平面朝上為<b>笑筊</b>（笑而不答）· 兩凸面朝上為<b>陰筊</b>（不允）<br>鍵盤操作：按空白鍵或 Enter</p>
      </div>
    </main>

    <div class="pillar"><div class="couplet">誠心叩問千般事</div></div>
  </div>
</div>

<section class="slipwrap" id="slipwrap" hidden aria-live="polite">
  <article class="slip" id="slip"></article>
</section>
<footer>天恩宮為虛構廟宇，籤詩為本站原創，僅供娛樂參考；人生大事，仍請多方請益。</footer>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), j0 = $('#j0'), j1 = $('#j1'), l0 = $('#l0'), l1 = $('#l1'), verdict = $('#verdict'), msg = $('#msg'),
    act = $('#act'), cats = $('#cats'), log = $('#log'), tube = $('#tube'), stick = $('#stick'), sticknum = $('#sticknum'),
    slipwrap = $('#slipwrap'), slip = $('#slip'), steps = $('#steps');
  if (!stage || !j0 || !j1 || !act || !msg || !tube || !stick || !slip || !steps) return;

  const POEMS = [
    {g:'上上',z:'甲子',p:['春雷一響動山川','枯木逢時再發鮮','莫道前程多阻隔','順風帆滿到江天'],s:'時運已轉，宜積極進取，勿再觀望。',
     j:{事業:'貴人相助，可望升遷',姻緣:'良緣天定，可成',財運:'正財旺，偏財勿貪',健康:'舊疾漸癒',學業:'金榜有望',尋物:'往東南方尋之'}},
    {g:'上吉',z:'乙丑',p:['明月當空照小舟','一篙撐過舊溪頭','灘聲雖急終須靜','岸上桃花笑點頭'],s:'先難後易，守得雲開見月明。',
     j:{事業:'初有波折，後必順遂',姻緣:'有情人終成眷屬',財運:'秋後見財',健康:'留意腸胃，無大礙',學業:'勤讀可過',尋物:'在水邊或近門處'}},
    {g:'中平',z:'丙寅',p:['半畝田園半畝雲','耕耘莫問幾時豐','雨來自有溝渠引','何必登樓望遠峰'],s:'安分守己，順其自然，不宜妄動。',
     j:{事業:'守成為上，暫勿跳槽',姻緣:'緣分未到，莫強求',財運:'小有進帳，勿投機',健康:'作息規律即安',學業:'基礎為重',尋物:'家中自尋，勿外求'}},
    {g:'下下',z:'丁卯',p:['夜行山路霧迷津','燈火搖搖不見人','且把歸心收一半','待他明日再逢春'],s:'時機未熟，宜退守待時，不可強行。',
     j:{事業:'計畫暫緩，靜待時機',姻緣:'恐有變數，宜慎',財運:'有破財之兆，守財為要',健康:'宜就醫檢查，勿拖延',學業:'需加倍用功',尋物:'難尋，恐已遺失'}},
    {g:'上吉',z:'戊辰',p:['紅燈高掛照門庭','喜鵲枝頭報好音','千里故人今日至','一壺新茗話知心'],s:'喜事臨門，貴人自遠方而來。',
     j:{事業:'遇貴人提攜',姻緣:'喜訊近，可論嫁娶',財運:'遠方有財',健康:'心寬體健',學業:'得良師指點',尋物:'問親友可得'}},
    {g:'中吉',z:'己巳',p:['竹影橫窗月未圓','琴聲一曲待知音','花開七分猶含蓄','莫急攀枝損本根'],s:'凡事七分為妙，過急則敗。',
     j:{事業:'穩中求進',姻緣:'慢慢來，對方正在觀察',財運:'細水長流',健康:'切勿過勞',學業:'循序漸進',尋物:'在高處或書堆中'}},
    {g:'中平',z:'庚午',p:['風吹雲散又雲來','陰晴不定費疑猜','心中若有定盤針','任他東西南北開'],s:'外境多變，守心為要。',
     j:{事業:'眾說紛紜，自有主張',姻緣:'勿聽旁人閒言',財運:'起伏不定，宜保守',健康:'情緒傷身，宜放寬心',學業:'專心一志',尋物:'時隱時現，慢找可得'}},
    {g:'上上',z:'辛未',p:['金雞啼破曉天紅','萬里江山一望中','此去青雲無阻滯','腳踏實地步步通'],s:'大吉，所謀皆遂，惟須腳踏實地。',
     j:{事業:'大展鴻圖',姻緣:'佳偶天成',財運:'財源廣進',健康:'精神飽滿',學業:'名列前茅',尋物:'即刻可見'}},
    {g:'中下',z:'壬申',p:['井底觀天天自小','爭來爭去總徒勞','不如放下手中石','自有清泉湧出高'],s:'固執無益，放下方得。',
     j:{事業:'勿與人爭，退一步海闊天空',姻緣:'強求無緣',財運:'因爭失財',健康:'肝火旺，宜靜心',學業:'宜換方法',尋物:'放下不找，反而自現'}},
    {g:'中吉',z:'癸酉',p:['老樹新枝發嫩黃','春蠶夜織吐絲長','莫嫌今日功名小','他年結繭滿筐箱'],s:'勤耕必有收成，宜有耐心。',
     j:{事業:'累積之中，勿灰心',姻緣:'日久生情',財運:'積少成多',健康:'年長者宜多保養',學業:'厚積薄發',尋物:'在舊物之中'}},
    {g:'中平',z:'甲戌',p:['渡口無船且坐看','江風吹袖不知寒','船來自有船家喚','何須踮腳望雲端'],s:'時候未到，靜候為宜。',
     j:{事業:'等候消息，不宜催促',姻緣:'對的人自會出現',財運:'尚未到手，勿先花用',健康:'小恙自癒',學業:'放榜前勿焦慮',尋物:'他人會送回'}},
    {g:'上吉',z:'乙亥',p:['雪盡梅香滿故園','寒窗苦盡見春暄','一枝已報平安字','萬事從今漸次圓'],s:'苦盡甘來，諸事漸圓。',
     j:{事業:'轉機已現',姻緣:'破鏡可望重圓',財運:'漸有起色',健康:'康復在望',學業:'苦讀有成',尋物:'失而復得'}}
  ];
  const CN = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];

  let step = 0, busy = false, cat = '事業', current = -1, throws = 0;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function setStep(n){
    step = n;
    steps.querySelectorAll('li').forEach(li => { const s = +li.dataset.s; li.className = s === n ? 'on' : s < n ? 'done' : ''; });
    if (cats) cats.hidden = n !== 0;
    act.textContent = ['上香稟告','擲筊請示','搖籤筒','擲筊確認','再求一籤'][n];
  }

  // ---------- rest positions ----------
  function stageSize(){ const r = stage.getBoundingClientRect(); return {w:r.width, h:r.height}; }
  function jw(){ return j0.getBoundingClientRect().width || 80; }
  function place(el, x, y, rot){ el.style.transform = `translate(${x}px,${y}px) rotate(${rot}deg)`; }
  function rest(){
    const {w,h} = stageSize(), s = jw();
    place(j0, w*.34 - s/2, h*.72, -8); place(j1, w*.5 - s/2 + s*.2, h*.76, 14);
    j0.classList.remove('convex'); j1.classList.add('convex');
  }

  // ---------- sound: wooden clacks ----------
  let ac = null;
  function audio(){ try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e){ ac = null; } return ac; }
  function clack(vol, when){
    const a = ac; if (!a) return;
    const t = a.currentTime + (when||0), o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
    o.type = 'triangle'; o.frequency.setValueAtTime(900 + Math.random()*500, t); o.frequency.exponentialRampToValueAtTime(260, t + .08);
    f.type = 'bandpass'; f.frequency.value = 1500; f.Q.value = 3;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .12);
    o.connect(f).connect(g).connect(a.destination); o.start(t); o.stop(t + .14);
  }
  function rattle(){ const a = ac; if (!a) return; for (let i = 0; i < 10; i++) clack(.08 + Math.random()*.06, i*.12 + Math.random()*.04); }
  function bell(){
    const a = ac; if (!a) return; const t = a.currentTime;
    [1, 2.76, 5.4].forEach((m,k) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = 520*m; g.gain.setValueAtTime(.12/(k+1), t); g.gain.exponentialRampToValueAtTime(.0001, t + 2.2); o.connect(g).connect(a.destination); o.start(t); o.stop(t + 2.3); });
  }

  // ---------- throw ----------
  function outcome(){ return [Math.random() < .5, Math.random() < .5]; } // true = flat side up (陽)
  function throwJiao(){
    return new Promise(res => {
      const res2 = outcome();
      const {w,h} = stageSize(), s = jw();
      const land = [{x: w*.5 - s*1.25 + (Math.random()-.5)*w*.12, y: h*.6 + Math.random()*h*.07, r: -30 + Math.random()*60},
                    {x: w*.5 + s*.2 + (Math.random()-.5)*w*.12, y: h*.62 + Math.random()*h*.07, r: -30 + Math.random()*60}];
      const start = [{x: w*.5 - s*.9, y: h + 10}, {x: w*.5 - s*.1, y: h + 10}];
      const peak = h*.05 + Math.random()*h*.08;
      const spins = [5 + Math.floor(Math.random()*3), 6 + Math.floor(Math.random()*3)];
      const T = reduce ? 1 : 1150; const t0 = performance.now();
      [l0,l1].forEach(l => l && l.classList.remove('on'));
      if (verdict) verdict.className = 'verdict';
      let clacked = [false,false];
      function frame(now){
        const k = Math.min(1, (now - t0) / T);
        [j0,j1].forEach((el, i) => {
          const d = Math.min(1, k * (i ? 1 : 1.04));
          const x = start[i].x + (land[i].x - start[i].x) * d;
          // parabola through start -> peak -> land
          const y0 = start[i].y, y1 = land[i].y;
          const flight = Math.min(1, d/.8);
          let y = (1-flight)*(1-flight)*y0 + 2*(1-flight)*flight*(peak*2 - (y0+y1)/2) + flight*flight*y1;
          let flipAng, rot;
          if (d < .8){ flipAng = (1 - flight) * spins[i] * Math.PI + (res2[i] ? 0 : Math.PI); rot = land[i].r + (1-flight)*(i?420:-380); }
          else { // bounce & settle
            const b = (d - .8)/.2; y = y1 - Math.abs(Math.sin(b*Math.PI*2)) * 16 * (1-b); flipAng = res2[i] ? 0 : Math.PI; rot = land[i].r + Math.sin(b*9)*6*(1-b);
            if (!clacked[i]){ clacked[i] = true; clack(.25); setTimeout(() => clack(.12), 90); }
          }
          const sy = Math.cos(flipAng);
          el.classList.toggle('convex', sy < 0);
          el.style.transform = `translate(${x}px,${y}px) rotate(${rot}deg) scaleY(${Math.max(.08, Math.abs(sy)).toFixed(3)})`;
        });
        if (k < 1) requestAnimationFrame(frame);
        else {
          [j0,j1].forEach((el,i) => { el.classList.toggle('convex', !res2[i]); el.style.transform = `translate(${land[i].x}px,${land[i].y}px) rotate(${land[i].r}deg)`; });
          [l0,l1].forEach((l,i) => { if (!l) return; l.textContent = res2[i] ? '平（陽）' : '凸（陰）'; l.style.left = (land[i].x + s/2) + 'px'; l.style.top = (land[i].y + s*.75) + 'px'; l.classList.add('on'); });
          const r = res2[0] !== res2[1] ? 'sheng' : res2[0] ? 'xiao' : 'yin';
          if (verdict){ verdict.textContent = {sheng:'聖筊',xiao:'笑筊',yin:'陰筊'}[r]; verdict.className = 'verdict on ' + r; }
          throws++;
          if (log){ const sp = document.createElement('span'); sp.className = r === 'sheng' ? 's' : ''; sp.textContent = `第${throws}擲 · ${{sheng:'聖',xiao:'笑',yin:'陰'}[r]}`; log.appendChild(sp); while (log.children.length > 8) log.removeChild(log.firstChild); }
          setTimeout(() => res(r), 450);
        }
      }
      requestAnimationFrame(frame);
    });
  }

  // ---------- flow ----------
  async function primary(){
    if (busy) return; audio();
    busy = true; act.disabled = true;
    try {
      if (step === 0){
        stage.classList.add('lit'); bell();
        msg.innerHTML = `香已點上。弟子所問為<em>「${cat}」</em>。請擲筊，請示神明是否允許求籤。`;
        slipwrap.hidden = true; if (log) log.innerHTML = ''; throws = 0;
        setStep(1);
      } else if (step === 1){
        const r = await throwJiao();
        if (r === 'sheng'){ msg.innerHTML = '<em>聖筊！</em>神明應允。請捧起籤筒，誠心搖出一支籤。'; setStep(2); moveTube(true); }
        else if (r === 'xiao') msg.innerHTML = '<em>笑筊</em>——神明笑而不答。也許問題還不夠清楚，請在心中把事情再說明白一些，再擲一次。';
        else msg.innerHTML = '<em>陰筊</em>——神明不允。或許時機未到，或換個問法，靜心後再擲。';
      } else if (step === 2){
        current = Math.floor(Math.random() * POEMS.length);
        sticknum.textContent = '';
        stick.style.transform = 'translateY(0)';
        tube.classList.remove('shake'); void tube.getBoundingClientRect(); tube.classList.add('shake'); rattle();
        await wait(reduce ? 50 : 1250);
        tube.classList.remove('shake');
        sticknum.textContent = '第' + CN[current] + '籤';
        stick.style.transform = 'translateY(-38px)';
        clack(.2);
        msg.innerHTML = `搖出<em>第${CN[current]}籤</em>。還須擲筊確認，得聖筊方為神明所指之籤。`;
        await wait(reduce ? 50 : 900); moveTube(false);
        setStep(3);
      } else if (step === 3){
        const r = await throwJiao();
        if (r === 'sheng'){ msg.innerHTML = `<em>聖筊！</em>第${CN[current]}籤正是神明所賜。請往下看籤詩。`; setStep(4); showSlip(); }
        else { msg.innerHTML = `${r === 'xiao' ? '笑筊' : '陰筊'}——此籤非神明所指。請將籤放回籤筒，重新再搖。`; stick.style.transform = 'translateY(0)'; setStep(2); }
      } else if (step === 4){
        moveTube(false); stick.style.transform = 'translateY(0)'; sticknum.textContent = ''; stage.classList.remove('lit');
        if (verdict) verdict.className = 'verdict'; [l0,l1].forEach(l => l && l.classList.remove('on')); rest();
        msg.innerHTML = '信士請先<em>擇一所問之事</em>，於心中默念姓名、生辰、住址，再上香稟告。';
        setStep(0);
      }
    } finally { busy = false; act.disabled = false; }
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  function moveTube(c){ tube.classList.toggle('center', c); if (c){ [j0,j1].forEach(el => el.style.opacity = '.35'); } else [j0,j1].forEach(el => el.style.opacity = ''); }

  function showSlip(){
    const p = POEMS[current];
    slip.innerHTML = `<div class="top"><span>天恩宮 靈籤</span><span class="no">第${CN[current]}籤</span><span class="grade">${p.g}</span></div>
      <div class="body"><p class="poem">${p.p.map(l => '<span>' + l + '</span>').join('')}</p>
      <div class="jie"><h3>聖意</h3><p class="sy">${p.s}</p><h3>解曰 · ${p.z}</h3>
      <dl>${Object.keys(p.j).map(k => `<dt class="${k===cat?'hit':''}">${k}</dt><dd class="${k===cat?'hit':''}">${p.j[k]}</dd>`).join('')}</dl></div></div>
      <div class="seal" aria-hidden="true">天恩<br>宮印</div>`;
    slipwrap.hidden = false;
    setTimeout(() => { try { slipwrap.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'}); } catch(e){} }, 300);
  }

  act.addEventListener('click', primary);
  if (cats) cats.addEventListener('click', e => {
    const b = e.target.closest('.cat'); if (!b) return;
    cat = b.dataset.c; cats.querySelectorAll('.cat').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  });
  document.addEventListener('keydown', e => {
    if ((e.key === ' ' || e.key === 'Enter') && !(e.target && e.target.tagName === 'BUTTON')){ e.preventDefault(); primary(); }
  });
  window.addEventListener('resize', () => { if (!busy && step === 0) rest(); });

  setStep(0);
  rest();
})();
</script>
</body>
