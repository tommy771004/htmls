<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>暮港 · LAST LIGHT</title>
<meta name="description" content="第一人稱坐在小木船上，緩緩漂過傍晚的港灣，朝著低垂的夕陽前進。Gerstner 多層波浪、菲涅耳天空反射、長長的夕陽倒影，燈火隨天色漸暗逐一亮起。">
<meta name="theme-color" content="#3a2434">
<link rel="icon" href="../favicon.svg">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
<style>
:root{
  --ivory:#f4e9d8;
  --ivory-2:rgba(244,233,216,.72);
  --ivory-3:rgba(244,233,216,.42);
  --plum:rgba(46,28,42,.58);
  --plum-solid:#2d1c29;
  --apricot:#f2b47a;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --gut:max(16px, env(safe-area-inset-left));
  --sans:"Optima","Candara","Avenir Next","PingFang TC","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#2d1c29;color:var(--ivory);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#c.drag{cursor:grabbing}
#fade{position:fixed;inset:0;background:#1d1220;opacity:0;pointer-events:none;transition:opacity 2.6s ease-in-out}
#intro{position:fixed;inset:0;display:grid;place-items:center;padding:var(--gut);
  background:radial-gradient(120% 90% at 50% 62%,rgba(40,22,36,.18),rgba(28,15,28,.66));
  transition:opacity 1.6s var(--ease-out),visibility 0s 1.6s;z-index:5}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
.card{max-width:30rem;width:100%;text-align:center;padding:2.4rem 1.4rem 2rem;background:var(--plum);
  border:1px solid rgba(244,233,216,.16);border-radius:6px;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.kick{font-size:.78rem;letter-spacing:.62em;text-indent:.62em;font-variant-caps:all-small-caps;color:var(--apricot);margin-bottom:.9rem}
h1{font-size:clamp(2.6rem,9vw,3.8rem);font-weight:400;letter-spacing:.34em;text-indent:.34em;line-height:1.1;color:var(--ivory)}
.lead{margin:1.3rem auto 1.7rem;font-size:1rem;line-height:1.9;color:var(--ivory-2);letter-spacing:.08em}
#go{font:inherit;font-size:1.05rem;letter-spacing:.5em;text-indent:.5em;color:var(--ivory);background:transparent;
  border:1px solid rgba(244,233,216,.55);border-radius:3px;padding:.7rem 2.2rem;cursor:pointer;
  transition:background .3s var(--ease-out),border-color .3s var(--ease-out),transform .2s var(--ease-out)}
#go:hover,#go:focus-visible{background:rgba(244,233,216,.12);border-color:var(--ivory);outline:none}
#go:active{transform:translateY(1px)}
.hint{margin-top:1.4rem;font-size:.8rem;letter-spacing:.3em;text-indent:.3em;color:var(--ivory-3)}
#hud{position:fixed;left:var(--gut);bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:.2rem;
  padding:.25rem .35rem .25rem .8rem;background:var(--plum);border:1px solid rgba(244,233,216,.12);border-radius:5px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:.78rem;letter-spacing:.14em;
  opacity:0;visibility:hidden;transition:opacity .9s var(--ease-out),visibility 0s .9s;z-index:4}
#hud.on{opacity:1;visibility:visible;transition:opacity .6s var(--ease-out)}
#clock{font-variant-numeric:tabular-nums;letter-spacing:.2em;color:var(--ivory);margin-right:.5rem}
#hud button{font:inherit;letter-spacing:.14em;color:var(--ivory-2);background:transparent;border:0;border-radius:3px;padding:.45rem .6rem;cursor:pointer;
  transition:color .25s var(--ease-out),background .25s var(--ease-out)}
#hud button:hover,#hud button:focus-visible{color:var(--ivory);background:rgba(244,233,216,.1);outline:none}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:2rem;line-height:2;letter-spacing:.1em;background:var(--plum-solid);color:var(--ivory);z-index:9}
#load{position:fixed;inset:0;display:grid;place-items:center;letter-spacing:.5em;color:var(--ivory-3);background:var(--plum-solid);z-index:8;transition:opacity 1s}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01s!important;transition-delay:0s!important}
  #fade{transition-duration:.6s!important}
}
</style>
</head>
<body>
<canvas id="c" aria-label="傍晚港灣的第一人稱漂流場景"></canvas>
<div id="fade"></div>
<section id="intro" aria-labelledby="ttl">
  <div class="card">
    <p class="kick">LAST LIGHT</p>
    <h1 id="ttl">暮港</h1>
    <p class="lead">傍晚的港灣很安靜。<br>坐在船上，跟著最後一道光慢慢漂過去。</p>
    <button id="go" type="button">上船</button>
    <p class="hint">拖曳環顧 · 靜靜漂流</p>
  </div>
</section>
<nav id="hud" aria-label="控制">
  <span id="clock">18:20</span>
  <button id="bSnd" type="button" aria-pressed="false">聲音 開</button>
  <button id="bPause" type="button">暫停</button>
</nav>
<div id="load">收纜中</div>
<div id="err">這件作品需要 WebGL 與網路連線（載入 Three.js）。<br>請改用較新的瀏覽器開啟。</div>

<script type="module">
let THREE, THREE_VENDOR = false;
{
  // CDN 太慢（9 秒）或失敗就改用站內的 vendor 模組；vendor 也載不到時再等 CDN
  const cdn = import('three');
  const vendor = () => import('../vendor/three-0.186.0/three.module.js');
  try { THREE = await Promise.race([cdn, new Promise((_, rej) => setTimeout(() => rej(new Error('slow')), 9000))]); }
  catch (e) {
    try { THREE = await vendor(); THREE_VENDOR = true; }
    catch (e2) { try { THREE = await cdn; } catch (e3) { document.getElementById('err').style.display = 'grid'; throw e3; } }
  }
}
try { main(); } catch (e) { document.getElementById('err').style.display = 'grid'; document.getElementById('load').style.display = 'none'; console.warn(e); }

function main() {
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const params = new URLSearchParams(location.search);
const T0 = clamp(parseFloat(params.get('t')) || 0, 0, 1);
const AUTOSTART = params.has('autostart');
function rngMaker(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rnd = rngMaker(1870);

const canvas = $('c');
const coarse = matchMedia('(pointer:coarse)').matches;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
let PR = Math.min(window.devicePixelRatio || 1, coarse ? 1.5 : 2);
const PR_MAX = PR;
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
window.__r3info = () => ({ tri: renderer.info.render.triangles, calls: renderer.info.render.calls }); // 隱藏的 QA 掛鉤
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.05, 9000);
scene.add(camera);

/* ---------------- 波浪：GLSL 與 JS 用同一份設定 ---------------- */
// ang：傳播方向（度，0 = 朝 +z，也就是朝向船）；len：波長；A：振幅；q：Gerstner 尖銳度
const WAVES = [
  { ang: 8,   len: 46, A: 0.20,  q: 0.30 },
  { ang: -30, len: 21, A: 0.095, q: 0.32 },
  { ang: 44,  len: 11, A: 0.048, q: 0.30 },
  { ang: -68, len: 5.4, A: 0.022, q: 0.28 },
  { ang: 96,  len: 2.7, A: 0.010, q: 0.22 },
];
WAVES.forEach(w => {
  w.k = Math.PI * 2 / w.len; w.w = Math.sqrt(9.81 * w.k);
  const a = w.ang * Math.PI / 180; w.dx = Math.sin(a); w.dz = Math.cos(a);
});
const f6 = v => (v < 0 ? '-' : '') + Math.abs(v).toFixed(6);
const WAVE_GLSL = (() => {
  let s = 'void waves(vec2 p,float t,out vec3 d,out vec3 n){\n d=vec3(0.);float nx=0.,nz=0.,ny=0.;\n';
  for (const w of WAVES) {
    s += ` {float th=${f6(w.k)}*(${f6(w.dx)}*p.x+${f6(w.dz)}*p.y)-${f6(w.w)}*t;float c=cos(th),sn=sin(th);` +
      `d.x+=${f6(w.q / w.k * w.dx)}*c;d.z+=${f6(w.q / w.k * w.dz)}*c;d.y+=${f6(w.A)}*sn;` +
      `nx+=${f6(w.dx * w.k * w.A)}*c;nz+=${f6(w.dz * w.k * w.A)}*c;ny+=${f6(w.q)}*sn;}\n`;
  }
  return s + ' n=vec3(-nx,max(1.-ny,.2),-nz); // 疊加的尖銳度總和 > 1，浪尖交會處法線會翻面；夾住避免出現藍色破洞\n}\n';
})();
function waveAt(px, pz, t, out) { // 未位移座標 → 位移量
  let dx = 0, dy = 0, dz = 0;
  for (const w of WAVES) {
    const th = w.k * (w.dx * px + w.dz * pz) - w.w * t, c = Math.cos(th);
    dx += w.q / w.k * w.dx * c; dz += w.q / w.k * w.dz * c; dy += w.A * Math.sin(th);
  }
  out[0] = dx; out[1] = dy; out[2] = dz;
}
const _wo = [0, 0, 0];
function waterHeight(x, z, t) { // 世界座標的實際水面高度（反推 Gerstner 位移）
  let px = x, pz = z;
  for (let i = 0; i < 3; i++) { waveAt(px, pz, t, _wo); px = x - _wo[0]; pz = z - _wo[2]; }
  waveAt(px, pz, t, _wo);
  return _wo[1];
}

/* ---------------- 共用 uniforms 與 GLSL ---------------- */
const C = (h) => new THREE.Color(h);
const U = {
  uTime: { value: 0 }, uDusk: { value: 0 }, uSunVis: { value: 1 },
  uSunDir: { value: new THREE.Vector3(0, 0.1, -1).normalize() },
  uSunCol: { value: C('#ffd9a8') }, uHor: { value: C('#ffc58a') }, uMid: { value: C('#d98f86') }, uZen: { value: C('#5d5f88') },
  uGlow: { value: C('#ff9b50') }, uAmbTop: { value: C('#666') }, uAmbBot: { value: C('#333') }, uSunLight: { value: C('#fa8') },
  uCam: { value: new THREE.Vector3() },
  uLantP: { value: new THREE.Vector3(0, -50, 0) }, uLantC: { value: new THREE.Vector3() }, // 船上油燈：世界座標與（色 × 強度）
};

const COMMON_GLSL = `
uniform float uTime,uDusk,uSunVis;
uniform vec3 uSunDir,uSunCol,uHor,uMid,uZen,uGlow,uAmbTop,uAmbBot,uSunLight,uCam,uLantP,uLantC;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
float fbm3(vec2 p){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*vn(p);p=p*2.03+vec2(17.1,9.2);a*=.5;}return s;}
// 天空與水面反射共用這一支
vec3 skyColor(vec3 d,float clouds,float disc){
  float h=max(d.y,0.);
  float sd=max(dot(d,uSunDir),0.);
  vec3 c=mix(uHor,uMid,pow(smoothstep(0.,.2,h),.6));
  c=mix(c,uZen,smoothstep(.08,.75,h));
  c+=uGlow*(.28*pow(sd,8.)+.6*pow(sd,40.)+1.5*pow(sd,260.))*(1.-.55*smoothstep(0.,.5,h));
  c=mix(c,uHor*1.08,exp(-h*16.)*.38);
  c*=1.+.05*sin(h*110.+uTime*.015)*exp(-h*10.);
  if(clouds>0.&&h>.01){
    vec2 uv=d.xz/(h+.13);uv=vec2(uv.x*.42,uv.y*1.9)+vec2(uTime*.006,0.);
    float n=fbm3(uv*1.25),n2=fbm3(uv*3.3+7.3);
    float m=n*.68+n2*.32;
    float cl=smoothstep(.5,.76,m)*smoothstep(.02,.12,h)*(1.-smoothstep(.5,.92,h));
    vec3 lit=mix(uMid*.75,uGlow*1.25+uHor*.35,clamp(pow(sd,1.6)*.9+.28*(1.-h),0.,1.));
    lit+=uGlow*pow(sd,5.)*.9*smoothstep(.55,.78,m);
    c=mix(c,lit,cl*clouds*.72);
  }
  if(disc>0.){
    float dsc=smoothstep(.99988,.99997,sd);
    c+=uSunCol*dsc*22.*uSunVis*disc;
  }
  return c;
}
vec3 hazeCol(vec3 d){d.y=.03;return skyColor(normalize(d),0.,0.);}
float fogF(float dist,float y,float k){return clamp(1.-exp(-dist*k*(1.+1.4*exp(-max(y,0.)*.12))),0.,1.);}
`;

const TAIL_GLSL = `\n#include <tonemapping_fragment>\n#include <colorspace_fragment>\n`;

/* ---- 一般實體（含實例化）材質：暖光、背光邊緣、大氣霧 ---- */
function makeSil(tint, fogK, o = {}) {
  const defines = {}; if (o.hull) defines.HULL = ''; if (o.vcol) defines.VCOL = ''; if (o.boot) defines.BOOT = ''; if (o.planks) defines.PLANKS = o.planks === 'x' ? 1 : 2; if (o.stone) defines.STONE = ''; if (o.wall) defines.WALL = ''; if (o.tiles) defines.TILES = '';
  return new THREE.ShaderMaterial({
    defines, side: o.side ?? THREE.FrontSide,
    uniforms: { ...U, uTint: { value: C(tint) }, uTint2: { value: C(o.tint2 || tint) }, uFogK: { value: fogK }, uRim: { value: o.rim ?? 1 }, uBoot: { value: C(o.boot ? o.boot[0] : '#000') }, uStripe: { value: C(o.boot ? o.boot[1] : '#000') }, uStoneC: { value: new THREE.Vector3(...(o.stone || [0, 0, 0])) } },
    vertexShader: `
varying vec3 vW,vN,vC,vK;varying float vLY;
uniform vec3 uTint;
#ifdef VCOL
attribute vec3 aCol;
#endif
void main(){
  vec4 p=vec4(position,1.);vec3 n=normal;
  #ifdef USE_INSTANCING
   p=instanceMatrix*p;n=mat3(instanceMatrix)*n;
  #endif
  vec3 col=uTint;vK=vec3(1.);
  #ifdef USE_INSTANCING_COLOR
   col*=instanceColor;
  #endif
  #ifdef VCOL
   col*=aCol;vK=aCol;
  #endif
  vLY=position.y;
  vec4 w=modelMatrix*p;vW=w.xyz;vN=normalize(mat3(modelMatrix)*n);vC=col;
  gl_Position=projectionMatrix*viewMatrix*w;
}`,
    fragmentShader: COMMON_GLSL + `
varying vec3 vW,vN,vC,vK;varying float vLY;
uniform float uFogK,uRim;uniform vec3 uTint2,uBoot,uStripe,uStoneC;
void main(){
  vec3 Vv=uCam-vW;float dist=length(Vv);vec3 V=Vv/dist;
  vec3 n=normalize(vN);vec3 base=vC;
  #ifdef HULL
   bool outside=dot(n,V)>0.;
   if(!outside)n=-n;
   base=outside?mix(vC*.55,vC,smoothstep(-.05,.16,vLY)):uTint2*vK;
   #ifdef BOOT
    if(outside){ // 水線下的防污漆與水線上的一道細條紋
     base=mix(uBoot*vK,vC,smoothstep(.09,.105,vLY));
     base=mix(base,uStripe*vK,smoothstep(.12,.126,vLY)*(1.-smoothstep(.185,.191,vLY)));
    }
   #endif
  #else
   if(!gl_FrontFacing)n=-n;
  #endif
  #ifdef PLANKS
   if(n.y>.7){ // 甲板木板：縱向接縫與錯開的端接，遠處淡出成平均色以免閃爍
    #if PLANKS==1
     vec2 cl=vec2(vW.z,vW.x);
    #else
     vec2 cl=vec2(vW.x,vW.z);
    #endif
    float cu=cl.x/.26,id=floor(cu),f=fract(cu);
    float aa=clamp(fwidth(cu)*1.6,0.,1.);
    float seam=(1.-smoothstep(0.,.06,f))*(1.-smoothstep(.2,.7,aa));
    float lu=cl.y/3.3+h21(vec2(id,3.))*7.;
    float butt=(1.-smoothstep(0.,.014,fract(lu)))*(1.-smoothstep(.2,.7,clamp(fwidth(lu)*1.6,0.,1.)));
    float tone=.84+.3*h21(vec2(id,floor(lu)));
    base*=mix(1.,tone,1.-.75*aa)*mix(1.,.5,max(seam,butt));
   }
  #endif
  #ifdef STONE
   if(abs(n.y)<.5){ // 石砌：一層一層的石塊，錯縫，遠處淡成平均色
    vec2 tg=normalize(vec2(n.z,-n.x)+1e-4);
    float u=uStoneC.z>0.?atan(vW.z-uStoneC.y,vW.x-uStoneC.x)*uStoneC.z:dot(vW.xz,tg),v=vW.y/.42,row=floor(v);
    float uu=(u+h21(vec2(row,7.))*3.)/(1.1+.6*h21(vec2(row,2.))),cl=floor(uu);
    float aV=clamp(fwidth(v)*1.6,0.,1.),aU=clamp(fwidth(uu)*1.6,0.,1.);
    float jv=(1.-smoothstep(0.,.07,fract(v)))*(1.-smoothstep(.2,.7,aV)),ju=(1.-smoothstep(0.,.035,fract(uu)))*(1.-smoothstep(.2,.7,aU));
    base*=mix(1.,.8+.35*h21(vec2(cl,row)),1.-.7*max(aU,aV))*mix(1.,.55,max(jv,ju));
   }
  #endif
  #ifdef TILES
   if(n.y>.25&&n.y<.98){ // 屋瓦：一排排錯位的瓦片，每排下緣有陰影
    float v=vW.y/.17,row=floor(v),f=fract(v),uu=vW.z/.34+row*.5;
    float aV=clamp(fwidth(v)*1.6,0.,1.),aU=clamp(fwidth(uu)*1.6,0.,1.);
    float jv=(1.-smoothstep(0.,.12,f))*(1.-smoothstep(.2,.7,aV)),ju=(1.-smoothstep(0.,.07,fract(uu)))*(1.-smoothstep(.2,.7,aU))*.6;
    base*=mix(1.,.8+.4*h21(vec2(floor(uu),row)),1.-.7*max(aU,aV))*mix(1.,.5,max(jv,ju));
   }
  #endif
  #ifdef WALL
   if(abs(n.y)<.6){ // 牆面：淡淡的灰泥斑駁與近地面的潮痕
    float u=dot(vW.xz,vec2(n.z,-n.x)),m=fbm3(vec2(u*.5,vW.y*.6)+vec2(3.7,1.1)),aa=clamp(fwidth(u)*.6,0.,1.);
    base*=mix(.86+.28*m,1.,aa)*(1.-.22*smoothstep(2.2,.85,vW.y));
   }
  #endif
  float ndl=dot(n,uSunDir);float wr=clamp(ndl*.55+.45,0.,1.);wr*=wr;
  vec3 col=base*(mix(uAmbBot,uAmbTop,n.y*.5+.5)+uSunLight*wr*uSunVis);
  float rim=pow(1.-abs(dot(n,V)),3.)*pow(max(dot(-V,uSunDir),0.),2.);
  col+=uGlow*rim*.9*uRim*(.3+.7*uSunVis);
  col+=base*(uHor*.05+.012);
  if(uLantC.r>.001){ // 船上油燈：點光源，平方反比加上一點包覆
    vec3 Lv=uLantP-vW;float ld=length(Lv);
    if(ld<9.){float nl=max(dot(n,Lv/ld)*.75+.25,0.);col+=base*uLantC*nl/(1.+ld*ld*3.2)*(1.-smoothstep(5.,9.,ld));}
  }
  float f=fogF(dist,vW.y,uFogK);
  col=mix(col,hazeCol(-V),f);
  gl_FragColor=vec4(col,1.);
  ` + TAIL_GLSL + `
}`,
  });
}

/* ---- 發光體（燈罩、窗）與光暈 ---- */
const emitMat = new THREE.ShaderMaterial({
  uniforms: { ...U },
  vertexShader: `varying vec3 vW,vC;
void main(){vec4 p=instanceMatrix*vec4(position,1.);vC=instanceColor;vec4 w=modelMatrix*p;vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader: COMMON_GLSL + `varying vec3 vW,vC;
void main(){vec3 Vv=uCam-vW;float dist=length(Vv);vec3 col=vC;
 col=mix(col,hazeCol(-Vv),fogF(dist,vW.y,.0028)*.55);
 gl_FragColor=vec4(col,1.);` + TAIL_GLSL + `}`,
});
const haloMat = new THREE.ShaderMaterial({
  uniforms: { ...U }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `varying vec3 vC;varying vec2 vUv;varying float vF;
void main(){
  vec4 c=modelMatrix*instanceMatrix*vec4(0.,0.,0.,1.);

  gull(pan) {

};

/* ---------------- 日落進程：色盤 ---------------- */
const KEYS = [
  { hor: '#f4a361', mid: '#b06a7c', zen: '#4a4c7a', glow: '#ff8a3c', sun: '#ffe0b0' },
  { hor: '#e07a58', mid: '#84567c', zen: '#33385f', glow: '#ff6a3a', sun: '#ffb37a' },
  { hor: '#8c527a', mid: '#464474', zen: '#171d40', glow: '#a94660', sun: '#ff8a6a' },
].map(k => Object.fromEntries(Object.entries(k).map(([a, b]) => [a, C(b)])));
const _c1 = new THREE.Color();
function mixKey(name, d, out) {
  if (d < .5) out.copy(KEYS[0][name]).lerp(KEYS[1][name], d * 2); else out.copy(KEYS[1][name]).lerp(KEYS[2][name], (d - .5) * 2);
}
function applyDusk(d) {
  mixKey('hor', d, U.uHor.value); mixKey('mid', d, U.uMid.value); mixKey('zen', d, U.uZen.value); mixKey('glow', d, U.uGlow.value); mixKey('sun', d, U.uSunCol.value);
  const elev = (lerp(6.2, -3.6, d)) * Math.PI / 180;
  U.uSunDir.value.set(0, Math.sin(elev), -Math.cos(elev));
  const vis = sstep(-.05, .03, Math.sin(elev)); U.uSunVis.value = vis;
  U.uGlow.value.multiplyScalar(.45 + .55 * vis);
  U.uAmbTop.value.copy(U.uZen.value).lerp(U.uMid.value, .4).multiplyScalar(1.1);
  U.uAmbBot.value.copy(U.uHor.value).multiplyScalar(.28);
  U.uSunLight.value.copy(U.uSunCol.value).multiplyScalar(1.5 * vis + .0);
  U.uDusk.value = d;
  waterMat.uniforms.uDeep.value.copy(U.uMid.value).multiplyScalar(.075).add(_c1.setRGB(.004, .016, .022));
  MTN.forEach((m, i) => { const base = C(m.base); const f = 1 - Math.exp(-m.R * m.k * 1.1); mtnCols[i].set(base.r, base.g, base.b).lerp(new THREE.Vector3(U.uHor.value.r, U.uHor.value.g, U.uHor.value.b), f); });
  // 底層：天空色乘上一點暖光讓稜線帶暖邊
}
function clockText(d) { const m = Math.round(18 * 60 + 20 + d * 75); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }

/* ---------------- 輸入 ---------------- */
const QA_YAW = clamp(parseFloat(params.get('yaw')) || 0, -1.95, 1.95), QA_PITCH = clamp(parseFloat(params.get('pitch')) || 0, -.55, .75); // 隱藏的 QA 參數：固定視角
let yaw = QA_YAW, pitch = QA_PITCH, yawT = QA_YAW, pitchT = QA_PITCH, lastInput = (QA_YAW || QA_PITCH) ? Infinity : -99, dragging = false, px = 0, py = 0;
const keys = {};
canvas.addEventListener('pointerdown', e => { dragging = true; px = e.clientX; py = e.clientY; canvas.classList.add('drag'); try { canvas.setPointerCapture(e.pointerId); } catch (_) { } });
canvas.addEventListener('pointermove', e => {
  poke();
  if (!dragging) return;
  const s = .0042; yawT = clamp(yawT + (e.clientX - px) * s, -1.95, 1.95); pitchT = clamp(pitchT + (e.clientY - py) * s, -.55, .75);
  px = e.clientX; py = e.clientY; lastInput = clockNow;
});
const endDrag = () => { dragging = false; canvas.classList.remove('drag'); };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
addEventListener('keydown', e => {
  if (e.key in { ArrowLeft: 1, ArrowRight: 1, ArrowUp: 1, ArrowDown: 1 }) { keys[e.key] = true; e.preventDefault(); }
  if (e.key === 'm' || e.key === 'M') toggleSound();
  if (e.key === ' ' && started) { togglePause(); e.preventDefault(); }
});
addEventListener('keyup', e => { delete keys[e.key]; });

/* ---------------- 介面 ---------------- */
const hud = $('hud'); let hudTimer = 0, started = false, paused = false;
function poke() { if (!started) return; hud.classList.add('on'); clearTimeout(hudTimer); hudTimer = setTimeout(() => hud.classList.remove('on'), 4200); }
function toggleSound() { AU.setMuted(!AU.muted); $('bSnd').textContent = AU.muted ? '聲音 關' : '聲音 開'; $('bSnd').setAttribute('aria-pressed', AU.muted ? 'true' : 'false'); poke(); }
function togglePause() { paused = !paused; $('bPause').textContent = paused ? '繼續' : '暫停'; if (AU.ctx) { paused ? AU.ctx.suspend() : AU.ctx.resume(); } poke(); }
$('bSnd').addEventListener('click', toggleSound); $('bPause').addEventListener('click', togglePause);
hud.addEventListener('pointermove', poke);
function begin(withAudio) {
  if (started) return; started = true;
  $('intro').classList.add('gone');
  if (withAudio) { try { AU.init(); AU.resume(); } catch (e) { console.warn('audio', e); } }
  poke();
}
$('go').addEventListener('click', () => begin(true));

/* ---------------- 主迴圈 ---------------- */
const DUR = 270, SPEED = .75, TRAVEL_MAX = 330;
let simT = 0, waveT = 0, lookBase = .06, travel = clamp(parseFloat(params.get('travel')) || 0, 0, 400), // ?travel= 隱藏 QA 參數：從航程中途開始
   dusk = T0, clockNow = 0, last = performance.now(), running = true, fadeState = 0, fadeT = 0;
let heave = 0, heaveV = 0, pitchB = 0, pitchV = 0, rollB = 0, rollV = 0, prevHV = 0;
let frameAvg = 16, frameCnt = 0;
const camPos = new THREE.Vector3(), qBoat = new THREE.Quaternion(), qHead = new THREE.Quaternion(), qLook = new THREE.Quaternion(), tmpV = new THREE.Vector3();
const lightOrder = [];
function spring(x, v, target, k, c, dt) { v += ((target - x) * k - v * c) * dt; return [x + v * dt, v]; }
function sampleBoat(cx, cz, yawH, halfL, halfB, t) {
  const s = Math.sin(yawH), c = Math.cos(yawH);
  const at = (lx, lz) => waterHeight(cx + lx * c + lz * s, cz - lx * s + lz * c, t);
  return { bow: at(0, -halfL), stern: at(0, halfL), port: at(-halfB, 0), stb: at(halfB, 0), mid: at(0, 0) };
}
function updateDyn(t) {
  for (const r of dyn) {
    const hb = sampleBoat(r.x, r.z, r.yaw, r.half * .8, r.half * .2, t);
    const g = r.g;
    g.position.set(r.x, (hb.bow + hb.stern + hb.port + hb.stb) / 4 - .02, r.z);
    g.rotation.set(Math.atan2(hb.bow - hb.stern, r.half * 1.6), r.yaw, Math.atan2(hb.stb - hb.port, r.half * .4) * .6, 'YXZ');
    g.updateMatrixWorld(true);
    const cy = Math.abs(Math.cos(r.yaw)), sy = Math.abs(Math.sin(r.yaw));
    for (const q of r.parts) {
      tmpV.set(q.lx, q.ly, q.lz).applyMatrix4(g.matrixWorld); const o = q.o; o.x = tmpV.x; o.y = tmpV.y; o.z = tmpV.z;
      if (!q.cyl) { o.hx = q.hx * cy + q.hz * sy; o.hz = q.hx * sy + q.hz * cy; }
    }

}
const _fw = new THREE.Vector3();
function setProxy(i, o, fade) {
  const A = pA[i], B = pB[i], Cc = pC[i];
  A.set(o.x, o.y, o.z, o.kind); B.set(o.hx, o.hy, o.hz, o.roof); if (o.kind >= 2) B.x = o.hx; Cc.set(o.c.r, o.c.g, o.c.b, fade);
}
function updateProxies() { // 挑出離鏡頭最近的一批，送進水面 shader 做倒影
  camera.getWorldDirection(_fw);
  const cand = proxies;
  for (const o of cand) {
    const dx = o.x - camPos.x, dz = o.z - camPos.z, d = Math.hypot(dx, dz);
    const behind = (dx * _fw.x + dz * _fw.z) < -.3 * d;
    o.key = d * (behind ? 1.8 : 1) * (o.roof ? .9 : 1);
  }
  const sel = cand.slice().sort((a, b) => a.key - b.key).slice(0, NP - 1);
  const dmax = sel.length >= NP - 1 ? sel[sel.length - 1].key : 1e9;
  setProxy(0, LH.prox, 1);
  for (let i = 0; i < NP - 1; i++) {
    if (i < sel.length) setProxy(i + 1, sel[i], 1 - sstep(dmax * .6, dmax, sel[i].key)); else pA[i + 1].w = 0;
  }
}
function updateLights(t) {
  const c = new THREE.Color();
  for (let i = 0; i < lights.length; i++) {
    const L = lights[i], K = KIND[L.kind];
    if (!L.on && dusk >= L.thr) { L.on = true; L.tOn = t - (dusk - L.thr > .06 ? 99 : 0); }
    let b = 0;
    if (L.on) {
      const a = t - L.tOn;
      const fl = (Math.sin(Math.floor(a * 16) * 12.9898) * 43758.5453 % 1 + 1) % 1 > .42 ? 1 : .15;
      b = a < 0 ? 0 : (a > 1.5 ? 1 : lerp(fl, 1, sstep(.5, 1.4, a)));
      b *= 1 + .03 * Math.sin(t * 3.1 + i * 1.7);
    }
    if (L.kind === 'window' && b > 0) b *= .7 + .3 * ((i * 37) % 5) / 4;
    if (L === LANT && b > 0) b *= 1 + .05 * Math.sin(t * 9.1) + .04 * Math.sin(t * 15.7 + 1.3) + .05 * Math.sin(t * 3.3 + .4) + .03 * Math.sin(t * 23.9); // 火焰搖曳
    L.b = b;
    const on = K.on, off = K.off;
    if (K.size) _s.set(...K.size); else _s.set(L.side ? .06 : .6, .8, L.side ? 1.0 : .06);
    if (L.side) _s.set(.06, .8, .7);
    if (L.boatWin) _s.set(.62, .5, .06);
    _q.identity(); _m.compose(L.p, _q, _s); emitters.setMatrixAt(i, _m);
    emitters.setColorAt(i, c.setRGB(lerp(off[0], on[0], b), lerp(off[1], on[1], b), lerp(off[2], on[2], b)));

    _s.set(hs, hs, 1); _m.compose(L.p, _q, _s); halos.setMatrixAt(i, _m);

  }

  emitters.instanceMatrix.needsUpdate = halos.instanceMatrix.needsUpdate = true;
  emitters.instanceColor.needsUpdate = halos.instanceColor.needsUpdate = true;
}
function updateWaterLights() {
  const cand = [];
  for (const L of lights) { if (L.b < .02) continue; const dx = L.p.x - camPos.x, dz = L.p.z - camPos.z; const d2 = dx * dx + dz * dz; if (d2 < 9) continue; cand.push([d2, L]); }
  cand.sort((a, b) => a[0] - b[0]);
  for (let i = 0; i < NL; i++) {
    const v = lampU[i];
    if (i < cand.length) { const [d2, L] = cand[i]; const K = KIND[L.kind]; v.set(L.p.x, Math.max(L.p.y - .0, .5), L.p.z, L.b * K.wat * (1 - sstep(NL - 7, NL, i)) * (L.kind === 'window' ? 1 : 1)); } else v.w = 0;
  }
}

function frame(now) {
  if (!running) return;
  requestAnimationFrame(frame);
  let dt = Math.min((now - last) / 1000, .1); last = now; clockNow += dt;
  // 效能自適應
  frameAvg = lerp(frameAvg, dt * 1000, .05); if (++frameCnt % 90 === 0 && frameAvg > 24 && PR > .7) { PR = Math.max(.7, PR - .15); renderer.setPixelRatio(PR); renderer.setSize(innerWidth, innerHeight, false); }
  const sdt = started && !paused ? dt : 0;
  simT += sdt;
  // 淡出重來
  let fadeOp = 0;
  if (started) {
    if (fadeState === 0 && travel > TRAVEL_MAX) { fadeState = 1; $('fade').style.opacity = 1; fadeT = clockNow; }
    else if (fadeState === 1 && clockNow - fadeT > 3.0) { travel = 0; fadeState = 2; fadeT = clockNow; $('fade').style.opacity = 0; }
    else if (fadeState === 2 && clockNow - fadeT > 3.0) fadeState = 0;
  }
  travel += sdt * SPEED * (fadeState === 1 ? .6 : 1);
  dusk = clamp(T0 + simT / DUR, 0, 1);
  if (!paused) waveT += dt; // 開場卡片後面的水面也要動
  const wt = waveT + 30 + T0 * 100;
  U.uTime.value = wt; applyDusk(dusk);
  $('clock').textContent = clockText(dusk);

  // 小船位置與姿態
  const bx = 3.2 * Math.sin(travel * .019 + .6), bz = -travel;
  const hdg = -Math.atan(3.2 * .019 * Math.cos(travel * .019 + .6)) + .03 * Math.sin(simT * .11);
  const hb = sampleBoat(bx, bz, hdg, 1.6, .6, wt);
  const tHeave = (hb.bow + hb.stern + hb.port + hb.stb) / 4 * 1.0 - .03, tPitch = Math.atan2(hb.bow - hb.stern, 3.0), tRoll = Math.atan2(hb.stb - hb.port, 1.2);
  const sdt2 = Math.min(dt, .05);
  [heave, heaveV] = spring(heave, heaveV, tHeave, 30, 8, sdt2); [pitchB, pitchV] = spring(pitchB, pitchV, tPitch, 26, 7, sdt2); [rollB, rollV] = spring(rollB, rollV, tRoll, 26, 7, sdt2);
  if (prevHV > .05 && heaveV < -.05 && started && !paused) AU.lap(Math.abs(heaveV - prevHV) * 3); prevHV = heaveV;
  boat.position.set(bx, heave, bz); boat.rotation.set(pitchB, hdg, rollB, 'YXZ');
  boat.updateMatrixWorld(true);

  // 視角
  if (keys.ArrowLeft) { yawT = clamp(yawT - dt * 1.1, -1.95, 1.95); lastInput = clockNow; } if (keys.ArrowRight) { yawT = clamp(yawT + dt * 1.1, -1.95, 1.95); lastInput = clockNow; }
  if (keys.ArrowUp) { pitchT = clamp(pitchT - dt * .8, -.55, .75); lastInput = clockNow; } if (keys.ArrowDown) { pitchT = clamp(pitchT + dt * .8, -.55, .75); lastInput = clockNow; }
  if (!dragging && clockNow - lastInput > 6) { const k = damp(.35, dt); yawT -= yawT * k; pitchT -= pitchT * k; }
  yaw += (yawT - yaw) * damp(6, dt); pitch += (pitchT - pitch) * damp(6, dt);
  qBoat.setFromEuler(_e.set(pitchB, hdg, rollB, 'YXZ'));
  qHead.setFromEuler(_e.set(0, hdg, 0, 'YXZ')).slerp(qBoat, .65);
  qLook.setFromEuler(_e.set(-pitch - lookBase, -yaw, 0, 'YXZ'));
  camPos.copy(EYE).applyQuaternion(qBoat).add(boat.position);
  camera.position.copy(camPos); camera.quaternion.copy(qHead).multiply(qLook);
  U.uCam.value.copy(camPos);
  sky.position.copy(camPos); sky.scale.setScalar(5000);
  waterMat.uniforms.uCenter.value.set(camPos.x, camPos.z);

  updateDyn(wt); updateRopes();
  updateProxies();
  lantern.localToWorld(LANT.p.set(0, .13, 0)); LANT.p.y += .0;
  updateLights(simT);
  updateWaterLights();
  beam.rotation.y = simT * .55;
  beamMat.uniforms.uBeam.value = sstep(.52, .85, dusk);

  // 海鷗
  if (started && !paused) { nextFlock -= dt; if (nextFlock < 0) { spawnFlock(camPos.x, camPos.z); nextFlock = 15 + Math.random() * 25; } updateGulls(dt, simT, camPos.x); }
  // 鐘聲
  if (AU.ctx && started && !paused) { if (AU.ctx.currentTime > AU.nextBell) { AU.bell(); AU.nextBell = AU.ctx.currentTime + 12 + Math.random() * 13; } }

  renderer.render(scene, camera);
  if (!frame.shown) { frame.shown = true; const l = $('load'); l.style.opacity = 0; setTimeout(() => l.remove(), 1100); }
}
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 1 ? 72 : 62; lookBase = w / h < 1 ? -.02 : .06; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
document.addEventListener('visibilitychange', () => {
  if (AU.ctx) { if (document.hidden) AU.ctx.suspend(); else if (!paused) AU.ctx.resume(); }
  if (document.hidden) running = false; else if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); }
});
applyDusk(dusk);
requestAnimationFrame(frame);
if (AUTOSTART) begin(false);
}
