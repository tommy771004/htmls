 const b=w.body;let cwd='root',commandHistory=[],cursor=0;b.innerHTML='<div class="terminal"><pre class="output"></pre><form class="command-line"><span></span><input aria-label="終端機指令" autocomplete="off" spellcheck="false"></form></div>';const output=$('.output',b),input=$('input',b),screen=$('.terminal',b);function print(s){output.textContent+=s+'\n';screen.scrollTop=screen.scrollHeight}function prompt(){if(!node(cwd)||isDeleted(node(cwd)))cwd='root';$('.command-line span',b).textContent='bloom:'+fsPath(cwd)+' $'}
 const help='可用指令（支援引號包住含空白的名稱）\n  help / clear / date / whoami / pwd\n  ls [路徑]           列出資料夾\n  cd <路徑>           切換位置，支援 /、..\n  cat <檔案>          讀取文字\n  mkdir <名稱>        建立資料夾\n  touch <檔名>        建立空文件\n  echo "文字" > 檔名  寫入；>> 附加\n  cp <來源> <目的>    複製至資料夾或新檔名\n  mv <來源> <目的>    移動或重新命名\n  rm <路徑>           移至資源回收筒\n  open <路徑>         開啟文件或資料夾\n  apps                顯示應用程式代號\n  launch <代號>       啟動應用程式\n  theme light|dark    切換主題\n  此為模擬 shell，無法執行主機程式。';
 function tokenize(s){let tokens=[],v='',quote=null,started=false;for(let i=0;i<s.length;i++){const c=s[i];if(quote){if(c===quote)quote=null;else v+=c;started=true}else if(c==='"'||c==="'"){quote=c;started=true}else if(/\s/.test(c)){if(started){tokens.push(v);v='';started=false}}else if(c==='>'){if(started){tokens.push(v);v='';started=false}tokens.push(s[i+1]==='>'?(i++,'>>'):'>')}else{v+=c;started=true}}if(quote)throw Error('引號未關閉');if(started)tokens.push(v);return tokens}

 function run(line){const args=tokenize(line),cmd=args.shift();if(!cmd)return;const get=i=>{if(args[i]===undefined)throw Error('缺少必要參數，輸入 help 查看語法');return args[i]};switch(cmd){case 'help':return help;case 'clear':output.textContent='';return '';case 'pwd':return fsPath(cwd);case 'whoami':return '本機使用者 / bloom';case 'date':return new Date().toLocaleString('zh-TW');case 'ls':{const f=args[0]?resolvePath(args[0],cwd):node(cwd);return f.type==='file'?f.name:children(f.id).map(n=>(n.type==='dir'?'[資料夾] ':'          ')+n.name).join('\n')||'（空資料夾）'}case 'cd':{const n=resolvePath(args[0]||'/',cwd);if(n.type!=='dir')throw Error('不是資料夾');cwd=n.id;break}case 'cat':{const f=resolvePath(get(0),cwd);if(f.type!=='file')throw Error('不是文字檔');return f.content||''}case 'mkdir':case 'touch':{const {parent,name}=target(get(0));if(cmd==='touch'&&children(parent).some(f=>f.name===name))break;createFile(parent,name,cmd==='mkdir'?'dir':'file');break}case 'echo':{let i=args.findIndex(s=>s==='>'||s==='>>');if(i<0)return args.join(' ');if(i!==args.length-2)throw Error('語法：echo "內容" > 檔名');const {parent,name}=target(args[i+1]);let f=children(parent).find(f=>f.name===name);if(!f)f=createFile(parent,name);if(f.type!=='file')throw Error('無法寫入資料夾');f.content=(args[i]==='>>'?f.content||'':'')+args.slice(0,i).join(' ')+'\n';fsChanged();break}case 'rm':trashFile(resolvePath(get(0),cwd));break;case 'cp':case 'mv':{const f=resolvePath(get(0),cwd),dest=get(1);let d;try{d=resolvePath(dest,cwd)}catch{}if(d){if(d.type!=='dir')throw Error('目的檔案已存在');transfer(f,d.id,cmd==='mv')}else{const {parent,name}=target(dest);validName(name,parent);if(protectedNode(f))throw Error('不可修改系統資料夾');for(let p=node(parent);p;p=node(p.parent))if(p.id===f.id)throw Error('不能移至自己的子資料夾');if(cmd==='mv'){f.parent=parent;f.name=name;fsChanged()}else{const oldIds=new Set(data.files.map(n=>n.id));// Copy with the target name without mutating the source.

builders.music=w=>{
 const b=w.body,tracks=[{name:'Blue hour',zh:'藍色時刻',bpm:88,root:48,wave:'sine',notes:[0,7,12,16,14,7,4,12],color:0},{name:'A small day',zh:'慢慢日常',bpm:106,root:53,wave:'triangle',notes:[0,4,7,11,7,4,2,7],color:45},{name:'Pixel meadow',zh:'像素草原',bpm:124,root:55,wave:'square',notes:[0,7,12,7,4,9,14,9],color:285}];
 let ctx,master,analyser,timer,raf,playing=false,index=0,beat=0,next=0,elapsed=0,startTime=0,voices=new Set();const duration=96;
 b.innerHTML=`<div class="music"><div class="album"><span class="sub">BLOOM SESSIONS / 01</span><strong>Blue<br>hour.</strong><span style="position:absolute;bottom:22px;left:23px;right:23px;font-size:9px;letter-spacing:1px">GENERATED, NOT RECORDED.</span></div><div class="music-controls"><span class="sub">NOW PLAYING</span><h2 class="track-name">Blue hour</h2><small class="track-detail">藍色時刻 · 即時聲音合成</small><div class="spectrum" aria-hidden="true">${'<i></i>'.repeat(32)}</div><input class="seek" type="range" min="0" max="96" value="0" step=".1" aria-label="播放進度"><div class="row spread muted" style="font-size:10px;margin-top:5px"><span class="elapsed">0:00</span><span>1:36</span></div><div class="playback"><button class="previous" aria-label="上一首">◀</button><button class="play-button" aria-label="播放">▶</button><button class="next" aria-label="下一首">▶</button></div><div class="row"><small>音量</small><input class="volume" type="range" min="0" max="100" value="55" aria-label="音量"></div><div class="tracks">${tracks.map((t,i)=>`<button data-track="${i}" class="${i===0?'selected':''}"><small>0${i+1}</small><span class="grow">${t.name}</span><small>${t.bpm} BPM</small></button>`).join('')}</div></div></div>`;
 function init(){if(ctx)return;ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=+$('.volume',b).value/100;analyser=ctx.createAnalyser();analyser.fftSize=128;master.connect(analyser);analyser.connect(ctx.destination)}
 function tone(freq,t,len,type,volume){const o=ctx.createOscillator(),g=ctx.createGain(),filter=ctx.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(freq,t);filter.type='lowpass';filter.frequency.value=type==='square'?1500:6000;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume,t+.014);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(filter);filter.connect(g);g.connect(master);o.start(t);o.stop(t+len+.03);voices.add(o);o.onended=()=>{voices.delete(o);o.disconnect();filter.disconnect();g.disconnect()}}
 function percussion(t,kick){if(kick){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(135,t);o.frequency.exponentialRampToValueAtTime(42,t+.16);g.gain.setValueAtTime(.26,t);g.gain.exponentialRampToValueAtTime(.001,t+.23);o.connect(g);g.connect(master);o.start(t);o.stop(t+.24);voices.add(o);o.onended=()=>{voices.delete(o);o.disconnect();g.disconnect()}}else{const buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.07),ctx.sampleRate),a=buffer.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const n=ctx.createBufferSource(),g=ctx.createGain(),filter=ctx.createBiquadFilter();n.buffer=buffer;filter.type='highpass';filter.frequency.value=7500;g.gain.value=.09;n.connect(filter);filter.connect(g);g.connect(master);n.start(t);voices.add(n);n.onended=()=>{voices.delete(n);n.disconnect();filter.disconnect();g.disconnect()}}}
 function schedule(){if(!playing)return;const tr=tracks[index],step=30/tr.bpm;while(next<ctx.currentTime+.12){const bar=Math.floor(beat/16)%4,chord=[0,5,9,7][bar],note=tr.root+12+tr.notes[beat%8]+chord;const hz=n=>440*2**((n-69)/12);tone(hz(note),next,step*1.6,tr.wave,.11);if(beat%4===0){tone(hz(tr.root-12+chord),next,step*3.8,'sine',.2);percussion(next,true)}if(beat%2===1)percussion(next,false);if(beat%16===0)[0,4,7].forEach(n=>tone(hz(tr.root+chord+n),next,step*13,'triangle',.035));next+=step;beat++}}
 function position(){return playing?Math.min(duration,elapsed+ctx.currentTime-startTime):elapsed}
