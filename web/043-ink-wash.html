<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>程序山水手卷 · 墨暈</title>
<meta name="description" content="橫幅手卷由右往左展讀：程序山水、直排唐詩、朱印，點紙滴墨擴散。收錄於 100 Creative HTML Works（043・水墨）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/web/043-ink-wash.html">
<style>
:root{
  --paper:#eee4cd; --paper-l:#f4ecda; --ink:#1c1a17; --ink-2:#3b3833; --seal:#b82a20; --table:#1b1916; --silk:#d9ccb0;
  --kai:"DFKai-SB","標楷體","BiauKai","Kaiti TC","STKaiti","Noto Serif TC","Songti TC",serif;
  --ming:"PMingLiU","新細明體","Noto Serif TC","Songti TC",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;background:var(--table);color:var(--paper);font-family:var(--kai);
  background-image:
    radial-gradient(ellipse 80% 60% at 50% 45%,rgba(90,80,64,.28),transparent 70%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 7px);
  display:flex;flex-direction:column;
}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 28px;flex-wrap:wrap;padding:clamp(16px,3vw,34px) clamp(16px,4vw,56px) 14px}
.head h1{margin:0;font-weight:normal;font-size:clamp(26px,3.4vw,44px);letter-spacing:.3em;color:var(--paper-l);line-height:1.1}
.head h1 .s{display:inline-block;vertical-align:middle;margin-left:.4em;width:1.05em;height:1.05em;background:var(--seal);color:var(--paper-l);font-size:.5em;line-height:1.05em;text-align:center;letter-spacing:0;border-radius:2px;transform:translateY(-.2em)}
.head p{margin:0;max-width:44em;font-size:clamp(13px,1.2vw,15px);line-height:1.8;color:#b9ad95;font-family:var(--ming)}
.head p b{color:var(--paper-l);font-weight:normal;font-family:var(--kai)}

/* ---------- the handscroll ---------- */
.frame{position:relative;margin:22px clamp(16px,3vw,48px) 0;height:clamp(380px,66vh,680px);filter:drop-shadow(0 18px 30px rgba(0,0,0,.55))}
.vp{position:absolute;inset:0 22px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;cursor:grab;outline:none;
  background:var(--silk)}
.vp::-webkit-scrollbar{display:none}
.vp.drag{cursor:grabbing}
.vp:focus-visible{box-shadow:0 0 0 2px var(--seal)}
.track{display:flex;height:100%;width:max-content;
  padding:clamp(14px,2.4vh,22px) 0;
  background:
    linear-gradient(to bottom,rgba(60,48,30,.35) 0 1px,transparent 1px calc(100% - 1px),rgba(60,48,30,.35) calc(100% - 1px)),
    radial-gradient(circle at 10px 10px,rgba(120,100,70,.14) 2px,transparent 3px) 0 0/22px 22px,
    var(--silk)}
.sep{flex:none;width:clamp(12px,1.6vw,20px);background:
  radial-gradient(circle at 6px 6px,rgba(120,100,70,.16) 1.5px,transparent 2.5px) 0 0/12px 12px,#d2c3a3;
  box-shadow:inset 1px 0 rgba(60,48,30,.35),inset -1px 0 rgba(60,48,30,.35)}
.panel{flex:none;height:100%;position:relative;background:var(--paper-l);
  background-image:radial-gradient(ellipse at 30% 40%,rgba(160,130,80,.08),transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(140,110,60,.1),transparent 50%)}
.painting{flex:none;height:100%;position:relative;background:var(--paper)}
.painting canvas{display:block;height:100%}

/* 引首 title */
.title{writing-mode:vertical-rl;padding:clamp(18px,4vh,40px) clamp(22px,3vw,44px);display:flex;flex-direction:row;align-items:flex-start;gap:clamp(10px,2vw,22px);color:var(--ink)}
.title .big{font-size:clamp(40px,min(10vh,15vw),96px);line-height:1.15;letter-spacing:.12em;text-shadow:0 0 1.5px rgba(28,26,23,.55),0 0 6px rgba(28,26,23,.12);margin:0;font-weight:normal}
.title .small{font-size:clamp(14px,2.2vh,18px);color:var(--ink-2);letter-spacing:.3em;margin-top:.5em}
.title .seal{margin-top:auto}

/* seals */
.seal{writing-mode:horizontal-tb;display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:1fr 1fr;width:clamp(40px,6.4vh,58px);aspect-ratio:1;background:var(--seal);color:var(--paper-l);
  font-family:var(--kai);font-size:clamp(15px,2.5vh,23px);line-height:1;padding:3px;gap:1px;opacity:.9;
  clip-path:polygon(2% 4%,30% 0,62% 3%,98% 1%,100% 36%,97% 70%,99% 97%,64% 100%,33% 97%,1% 99%,3% 62%,0 30%);
  box-shadow:inset 0 0 6px rgba(80,0,0,.4);mix-blend-mode:multiply}
.seal span{display:grid;place-items:center}
.seal.red-text{background:transparent;color:var(--seal);border:2.5px solid var(--seal);box-shadow:none;clip-path:none;border-radius:3px}
.seal.round{border-radius:50%;grid-template-columns:1fr;grid-template-rows:1fr 1fr;width:clamp(28px,4.4vh,40px);font-size:clamp(11px,1.8vh,16px);clip-path:none}
.seal.tall{grid-template-columns:1fr;grid-template-rows:1fr 1fr;width:clamp(24px,3.6vh,32px);aspect-ratio:1/2;font-size:clamp(13px,2vh,18px)}

/* 題跋 colophon */
.colo{writing-mode:vertical-rl;padding:clamp(20px,4vh,40px) clamp(20px,3vw,40px);color:var(--ink);font-size:clamp(17px,3vh,27px);line-height:1.75;letter-spacing:.08em}
.colo .ttl{font-size:1.05em;margin:0 0 0 .4em}
.colo .poem{margin:0 0 0 .5em}
.colo .poem span{display:block;text-shadow:0 0 1px rgba(28,26,23,.5)}
.colo .poem span:nth-child(even){padding-top:1.2em}
.colo .note{font-size:.6em;line-height:1.9;color:var(--ink-2);margin:0 .9em 0 0;max-block-size:calc(100% - 1em);font-family:var(--kai)}
.colo .stamps{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-right:.4em;block-size:auto}

.painter{position:absolute;display:flex;flex-direction:row;gap:8px;align-items:flex-start;writing-mode:vertical-rl;color:var(--ink);font-size:clamp(14px,2.2vh,19px);letter-spacing:.2em;text-shadow:0 0 1px rgba(28,26,23,.5);pointer-events:none}

/* rollers */
.roller{position:absolute;top:-16px;bottom:-16px;width:26px;z-index:3;pointer-events:none;
  background:linear-gradient(to right,#0c0b0a,#2e2a26 30%,#4b453e 45%,#1f1c19 70%,#090807);
  border-radius:6px;box-shadow:0 6px 12px rgba(0,0,0,.5)}
.roller::before,.roller::after{content:"";position:absolute;left:-2px;right:-2px;height:22px;border-radius:5px;
  background:linear-gradient(to right,#a89d86,#efe6d2 35%,#fffaf0 48%,#c7bca5 75%,#8a8069)}
.roller::before{top:-10px}.roller::after{bottom:-10px}
.roller.l{left:0}.roller.r{right:0}
.roller.l{box-shadow:10px 0 16px -6px rgba(0,0,0,.55),0 6px 12px rgba(0,0,0,.5)}
.roller.r{box-shadow:-10px 0 16px -6px rgba(0,0,0,.55),0 6px 12px rgba(0,0,0,.5)}

/* controls */
.bar{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:12px 18px;align-items:center;padding:22px clamp(16px,4vw,56px) 10px}
@media (max-width:760px){.bar{grid-template-columns:1fr 1fr}.mini{grid-column:1 / -1}}
.btn{min-height:44px;padding:0 20px;background:transparent;border:1px solid rgba(238,228,205,.45);color:var(--paper-l);font-family:var(--kai);font-size:17px;letter-spacing:.2em;cursor:pointer;transition:background .3s,border-color .3s}
.btn:hover,.btn:focus-visible{background:rgba(238,228,205,.08);border-color:var(--paper-l);outline:none}
.btn.primary{background:var(--seal);border-color:var(--seal)}
.btn.primary:hover,.btn.primary:focus-visible{background:#cf3528}
.mini{position:relative;height:52px;border:1px solid rgba(238,228,205,.3);cursor:pointer;touch-action:none;background:#2a2723}
.mini canvas{display:block;width:100%;height:100%;opacity:.85}
.mini .win{position:absolute;top:-3px;bottom:-3px;border:2px solid var(--seal);background:rgba(184,42,32,.08);pointer-events:none}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 20px;padding:4px clamp(16px,4vw,56px) 26px;font-size:13px;color:#8e846f;font-family:var(--ming);letter-spacing:.08em}
.foot b{color:var(--paper);font-weight:normal}
.hint{position:absolute;left:44px;bottom:16px;z-index:4;background:rgba(28,26,23,.78);color:var(--paper-l);padding:6px 14px;font-size:14px;letter-spacing:.2em;pointer-events:none;transition:opacity .8s}
.hint.gone{opacity:0}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}
</style>
</head>
<body>
<header class="head">
  <h1>程序山水手卷<span class="s">墨</span></h1>
  <p>一卷由亂數寫成的山水。手卷<b>由右往左</b>展讀：先看引首，再入山水，最後讀題跋。拖曳或滾動展卷；在紙上<b>點一下</b>，會滴下一滴墨，慢慢暈開。</p>
</header>

<div class="frame" id="frame">
  <div class="vp" id="vp" tabindex="0" aria-label="山水手卷，可左右捲動">
    <div class="track" id="track">
      <section class="panel colo" id="colo" aria-label="題跋"></section>
      <div class="sep"></div>
      <div class="painting" id="painting">
        <canvas id="cv" aria-label="程序生成的水墨山水"></canvas>
        <div class="painter" id="painter"></div>
      </div>
      <div class="sep"></div>
      <section class="panel title" id="title" aria-label="引首"></section>
    </div>
  </div>
  <div class="roller l" aria-hidden="true"></div>
  <div class="roller r" aria-hidden="true"></div>
  <div class="hint" id="hint">← 向左展卷</div>
</div>

<div class="bar">
  <button class="btn primary" id="newBtn" type="button">重新揮毫</button>
  <button class="btn" id="poemBtn" type="button">換一首詩</button>
  <div class="mini" id="mini" aria-label="卷軸縮圖，點擊跳轉" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><canvas id="mcv"></canvas><div class="win" id="win"></div></div>
</div>
<div class="foot"><span>第 <b id="seedNo">—</b> 卷 · 歲次<span id="gz">丙午</span> <span id="season">秋</span></span><span>神來之筆 <b id="blots">0</b> 滴</span><span>鍵盤：← → 展卷 · N 重新揮毫</span></div>

<script>
(function(){
  'use strict';
  var $ = function(s){ return document.getElementById(s); };
  var vp = $('vp'), cv = $('cv'), painting = $('painting'), colo = $('colo'), title = $('title'), painter = $('painter'), frame = $('frame');
  var mini = $('mini'), mcv = $('mcv'), win = $('win'), hint = $('hint');
  if(!vp || !cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var POEMS = [
    { t:'江雪', a:'柳宗元', head:'寒江獨釣', lines:['千山鳥飛絕','萬徑人蹤滅','孤舟蓑笠翁','獨釣寒江雪'], th:{ snow:1, boat:1, fisher:1 },
      note:'千山萬徑皆以亂數佈置，孤舟一葉則是作者堅持。' },
    { t:'鹿柴', a:'王維', head:'空山返景', lines:['空山不見人','但聞人語響','返景入深林','復照青苔上'], th:{ sun:1, forest:1, hut:1 },
      note:'畫中不見人，但若細聽，電腦風扇聲似人語。' },
    { t:'山居秋暝', a:'王維', head:'山居秋暝', lines:['空山新雨後','天氣晚來秋','明月松間照','清泉石上流','竹喧歸浣女','蓮動下漁舟','隨意春芳歇','王孫自可留'], th:{ moon:1, pines:1, fall:1, boat:1 },
      note:'松、月、泉、舟俱在，浣女去洗衣服了，故不入畫。' },
    { t:'獨坐敬亭山', a:'李白', head:'相看不厭', lines:['眾鳥高飛盡','孤雲獨去閒','相看兩不厭','只有敬亭山'], th:{ birds:1, bigpeak:1, hut:1 },
      note:'一座山被看了一千三百年，至今未見厭倦。' },
    { t:'楓橋夜泊', a:'張繼', head:'夜泊楓橋', lines:['月落烏啼霜滿天','江楓漁火對愁眠','姑蘇城外寒山寺','夜半鐘聲到客船'], th:{ night:1, moon:1, boat:1, lantern:1, temple:1, birds:1 },
      note:'漁火一點，是全卷唯一不用墨畫的東西。' }
  ];
  var poemIdx = 0, seed = 0, blotCount = 0;
  // 題跋落款用當下的干支紀年與季節（以國曆月份粗分四季）
  var NOW = new Date(), YR = NOW.getFullYear(), MO = NOW.getMonth() + 1;
  var GZ = '甲乙丙丁戊己庚辛壬癸'.charAt(((YR - 4) % 10 + 10) % 10) + '子丑寅卯辰巳午未申酉戌亥'.charAt(((YR - 4) % 12 + 12) % 12);
  var SEASON = MO >= 3 && MO <= 5 ? '春' : MO >= 6 && MO <= 8 ? '夏' : MO >= 9 && MO <= 11 ? '秋' : '冬';
  (function(){ var g = $('gz'), s = $('season'); if(g) g.textContent = GZ; if(s) s.textContent = SEASON; })();

  /* ---------- rng / noise ---------- */
  function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var R, rr = function(a, b){ return a + (b - a) * R(); };
  function noise1(){ var N = 1024, v = new Float32Array(N); for(var i = 0; i < N; i++) v[i] = R();
    return function(x){ var i = Math.floor(x), f = x - i, a = v[((i % N) + N) % N], b = v[(((i + 1) % N) + N) % N], t = f * f * (3 - 2 * f); return a + (b - a) * t; }; }
  function fbmOf(n){ return function(x){ return n(x) * .5 + n(x * 2.07 + 13) * .25 + n(x * 4.3 + 7) * .13 + n(x * 9.1 + 3) * .07; }; }

  var W = 2400, H = 520, DPR = 1, layers = [], anim = null;
  function mk(){ var c = document.createElement('canvas'); c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); var g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); return { c:c, g:g }; }
  function ink(a){ return 'rgba(28,26,23,' + a + ')'; }
  var PAPER = [238,228,205];
  function paperA(a){ return 'rgba(' + PAPER.join(',') + ',' + a + ')'; }

  /* ---------- painting ---------- */
  function paperLayer(th){
    var L = mk(), g = L.g;
    g.fillStyle = th.night ? '#e4d8bd' : '#eee4cd'; g.fillRect(0, 0, W, H);
    for(var i = 0; i < 14; i++){ var x = rr(0, W), y = rr(0, H), r = rr(80, 380); var gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(150,120,70,' + rr(.03, .08) + ')'); gr.addColorStop(1, 'rgba(150,120,70,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
    g.lineCap = 'round';
    for(i = 0; i < W * 0.9; i++){ var fx = rr(0, W), fy = rr(0, H), a = rr(0, Math.PI * 2), l = rr(3, 14); g.strokeStyle = 'rgba(120,95,55,' + rr(.03, .08) + ')'; g.lineWidth = rr(.3, .8); g.beginPath(); g.moveTo(fx, fy); g.quadraticCurveTo(fx + Math.cos(a) * l * .5 + rr(-2, 2), fy + Math.sin(a) * l * .5 + rr(-2, 2), fx + Math.cos(a) * l, fy + Math.sin(a) * l); g.stroke(); }
    return L;
  }
  function skyLayer(th, geo){
    var L = mk(), g = L.g, gr;
    if(th.night || th.snow){
      gr = g.createLinearGradient(0, 0, 0, H * .75);
      gr.addColorStop(0, ink(th.night ? .34 : .17)); gr.addColorStop(1, ink(th.night ? .08 : .03));
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    }
    if(th.moon){
      var mx = geo.moonX, my = H * rr(.14, .22), mr = H * .065;
      gr = g.createRadialGradient(mx, my, mr, mx, my, mr * 6); gr.addColorStop(0, ink(.14)); gr.addColorStop(.35, ink(.06)); gr.addColorStop(1, ink(0));
      g.fillStyle = gr; g.fillRect(mx - mr * 6, my - mr * 6, mr * 12, mr * 12);
      g.fillStyle = th.night ? '#f3ead6' : '#f5ecd9'; g.beginPath(); g.arc(mx, my, mr, 0, Math.PI * 2); g.fill();
    }
    if(th.sun){
      var sx = geo.moonX, sy = H * .2, sr = H * .06;
      g.fillStyle = 'rgba(184,42,32,.42)'; g.beginPath(); g.arc(sx, sy, sr, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(184,42,32,.12)'; g.beginPath(); g.arc(sx, sy, sr * 1.25, 0, Math.PI * 2); g.fill();
    }
    // drifting cloud washes
    for(var i = 0; i < 5; i++){ var cx = rr(0, W), cy = rr(H * .1, H * .35); gr = g.createRadialGradient(cx, cy, 0, cx, cy, 160); gr.addColorStop(0, ink(th.night ? .05 : .035)); gr.addColorStop(1, ink(0)); g.save(); g.translate(cx, cy); g.scale(3, .5); g.translate(-cx, -cy); g.fillStyle = gr; g.fillRect(cx - 160, cy - 160, 320, 320); g.restore(); }
    return L;
  }
  function ridgeOf(o){
    var peaks = [], x = -200 + rr(0, 100);
    while(x < W + 200){
      var w = rr(o.wmin, o.wmax);
      if(!o.sparse || R() < o.sparse) peaks.push({ cx:x + w * .5, w:w, h:rr(o.hmin, o.hmax) * (o.boost && Math.abs(x - o.boost.x) < o.boost.r ? o.boost.k : 1), kl:rr(.7, 1.5), kr:rr(.7, 1.5), pw:rr(1.3, 2.1) });
      x += w * rr(.45, .95);
    }
    var nz = fbmOf(noise1()), nz2 = fbmOf(noise1()), ys = new Float32Array(W + 1);
    for(var i = 0; i <= W; i++){
      var m = 0;
      for(var p = 0; p < peaks.length; p++){ var pk = peaks[p], d = (i - pk.cx) / pk.w; if(d > -2 && d < 2){ d *= d < 0 ? pk.kl : pk.kr; var v = pk.h * Math.exp(-Math.pow(Math.abs(d), pk.pw) * 3.2); if(v > m) m = v; } }
      var hn = m / (o.hmax || 1);
      ys[i] = o.base - m - (m > 2 || !o.sparse ? (nz(i * o.nf) * o.nAmp + nz2(i * o.nf * 4.5) * o.nAmp * .9 * hn) : 0);
    }
    return ys;
  }
  function mountainLayer(o, th, geo){
    var L = mk(), g = L.g, ys = ridgeOf(o), i;
    // mist band hiding the feet of farther ranges
    var mg = g.createLinearGradient(0, o.base - o.mist * 1.6, 0, o.base + 10);
    mg.addColorStop(0, paperA(0)); mg.addColorStop(.6, paperA(o.mistA)); mg.addColorStop(1, paperA(0));
    g.fillStyle = mg; g.fillRect(0, o.base - o.mist * 1.6, W, o.mist * 1.6 + 10);
    var top = o.base; for(i = 0; i <= W; i += 4) top = Math.min(top, ys[i]);
    g.beginPath(); g.moveTo(0, H); for(i = 0; i <= W; i += 2) g.lineTo(i, ys[i]); g.lineTo(W, H); g.closePath();
    var gr = g.createLinearGradient(0, top, 0, o.base + o.fade);
    if(th.snow){ gr.addColorStop(0, ink(o.a * .1)); gr.addColorStop(.45, ink(o.a * .45)); gr.addColorStop(.8, ink(o.a * .25)); gr.addColorStop(1, ink(0)); }
    else { gr.addColorStop(0, ink(o.a)); gr.addColorStop(.55, ink(o.a * .55)); gr.addColorStop(1, ink(0)); }
    g.fillStyle = gr; g.fill();
    // second, tighter wash just under the ridge (gives the brushed edge body)
    g.save(); g.clip();
    var en = fbmOf(noise1());
    for(i = 0; i <= W; i += 2){ var y = ys[i]; if(y > o.base - 1) continue; var d = (4 + en(i * .045) * 34 + rr(0, 3)) * o.edge; var lg = g.createLinearGradient(0, y, 0, y + d); lg.addColorStop(0, ink(o.a * (th.snow ? .5 : .55))); lg.addColorStop(1, ink(0)); g.fillStyle = lg; g.fillRect(i, y - 1, 2.2, d); }
    g.restore();
    // ridge line — dry brush
    g.lineCap = 'round';
    for(i = 0; i < W; i += 3){
      if(ys[i] > o.base - 1 && ys[i + 3 > W ? W : i + 3] > o.base - 1) continue;

  var drag = null;
  vp.addEventListener('pointerdown', function(e){
    if(e.button !== 0 && e.pointerType === 'mouse') return;
    drag = { x:e.clientX, y:e.clientY, sl:vp.scrollLeft, moved:false, id:e.pointerId, mouse:e.pointerType === 'mouse' };
  });
  vp.addEventListener('pointermove', function(e){
    if(!drag || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x;
    if(Math.abs(dx) > 5 || Math.abs(e.clientY - drag.y) > 5){ drag.moved = true; }
    if(drag.mouse && drag.moved){ vp.classList.add('drag'); vp.scrollLeft = drag.sl - dx; }
  });
  function endDrag(e){
    if(!drag) return;
    var d = drag; drag = null; vp.classList.remove('drag');
    if(e.type === 'pointerup' && !d.moved && e.target === cv){
      var r = cv.getBoundingClientRect();
      blot((e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height));
    }
  }
  vp.addEventListener('pointerup', endDrag);
  vp.addEventListener('pointercancel', endDrag);
  vp.addEventListener('pointerleave', function(e){ if(drag && drag.mouse) endDrag(e); });
  vp.addEventListener('wheel', function(e){
    if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    var before = vp.scrollLeft; vp.scrollLeft = before - e.deltaY;
    if(vp.scrollLeft !== before) e.preventDefault();
  }, { passive:false });

  document.addEventListener('keydown', function(e){
    if(e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = e.target && e.target.tagName;
    if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
      if(e.target === mini) return;
      e.preventDefault();
      vp.scrollBy({ left:(e.key === 'ArrowLeft' ? -1 : 1) * vp.clientWidth * .6, behavior:reduce ? 'auto' : 'smooth' });
    } else if((e.key === 'n' || e.key === 'N') && tag !== 'INPUT'){ newPainting(); }
  });

  function toStart(){ vp.scrollLeft = vp.scrollWidth; if(hint) hint.classList.remove('gone'); }
  function newPainting(){ seed = (Math.random() * 1e9) | 0; build(); toStart(); }
  var nb = $('newBtn'); if(nb) nb.addEventListener('click', newPainting);
  var pb = $('poemBtn'); if(pb) pb.addEventListener('click', function(){ poemIdx = (poemIdx + 1) % POEMS.length; newPainting(); });

  var lastH = 0, rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){
      var h = painting.clientHeight;
      if(Math.abs(h - lastH) > 40){ lastH = h; var f = vp.scrollLeft / Math.max(1, vp.scrollWidth - vp.clientWidth); build(); vp.scrollLeft = f * (vp.scrollWidth - vp.clientWidth); }
      else updateMini();
    }, 200);
  });

  poemIdx = Math.floor(Math.random() * POEMS.length);
  seed = (Math.random() * 1e9) | 0;
  lastH = painting.clientHeight;
  build();
  toStart();
  requestAnimationFrame(function(){ toStart(); syncWin(); });
})();
</script>
</body>
