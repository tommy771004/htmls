<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff8fb1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="存錢罐">
<title>存錢罐 · 存錢目標</title>
<meta name="description" content="一台扭蛋機造型的存錢目標：投幣進投幣口、轉把手讓錢掉進透明圓罩、存滿就轉出一顆扭蛋。收錄於 100 Creative HTML Works（App 027・日本扭蛋玩具）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/027-gacha-savings.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff8fb1'/%3E%3Ccircle cx='32' cy='26' r='19' fill='%23fff' fill-opacity='.85'/%3E%3Ccircle cx='25' cy='33' r='6' fill='%23ffd23f'/%3E%3Ccircle cx='37' cy='34' r='6' fill='%23ffd23f'/%3E%3Ccircle cx='31' cy='24' r='6' fill='%23e9b93a'/%3E%3Crect x='14' y='44' width='36' height='14' rx='4' fill='%23e8517a'/%3E%3Ccircle cx='32' cy='51' r='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --pink:#ff8fb1;
  --pink2:#f56f98;
  --pink3:#e8517a;
  --cherry:#5a1030;
  --cherry2:#8a2a4e;
  --yolk:#ffd23f;
  --yolk2:#e9b93a;
  --white:#ffffff;
  --blush:#ffe6ee;
  --maru:"Hiragino Maru Gothic ProN","Yuanti TC","PingFang TC",sans-serif;
  --spring:cubic-bezier(.3,1.5,.5,1);
  --out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.45 var(--maru);color:var(--cherry);background:var(--pink);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--cherry);outline-offset:2px;border-radius:12px}
svg{display:block}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;overflow:clip;isolation:isolate;display:flex;flex-direction:column;
  background:linear-gradient(90deg,rgba(255,255,255,0) 0,rgba(255,255,255,.28) 4%,rgba(255,255,255,0) 11%,rgba(255,255,255,0) 90%,rgba(255,255,255,.18) 95%,rgba(255,255,255,0) 100%),var(--pink)}
@media (min-width:521px){
  body{background:#ffc8d8}
  .stage{display:flex;align-items:center;justify-content:center;gap:64px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:60px;padding:12px;z-index:1;
    background:linear-gradient(100deg,#ffb5cb 0%,#ff7aa2 30%,#ffc2d4 52%,#f0608c 80%,#ff9dba 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(150,20,60,.25),2px 14px 20px -12px rgba(120,20,50,.5)}
  .screen{inset:12px;border-radius:48px}
  .caption{display:block;position:relative;z-index:1;max-width:250px}
  .caption h1{font:700 52px/1 var(--maru);color:var(--cherry);letter-spacing:.04em}
  .caption p{margin-top:14px;font-size:16px;line-height:1.7;color:var(--cherry2)}
}
@media (min-width:521px) and (max-width:880px){.caption{display:none}}

.status{flex:none;height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 32px;display:flex;align-items:center;justify-content:space-between;font:700 15px/1 var(--maru);color:var(--cherry);pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}

/* ---------- marquee ---------- */
.marq{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 16px 0 22px}
.marq .nm{min-width:0}
.marq h1{font:700 23px/1.15 var(--maru);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marq .tg{font-size:13px;color:var(--cherry2);margin-top:2px}
.book{flex:none;width:48px;height:48px;display:grid;place-items:center;border-radius:14px;transition:background-color .15s}
.book:active{background:rgba(90,16,48,.08)}
.book svg{width:30px;height:30px}

/* ---------- dome ---------- */
.dome{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:none}
.globe{position:relative;flex:none;width:var(--d,300px);height:var(--d,300px)}
.globe canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
.globe .glass{position:absolute;inset:0;pointer-events:none}
.neck{position:absolute;left:50%;bottom:-10px;width:62%;height:26px;margin-left:-31%;border-radius:10px 10px 4px 4px;background:var(--white);box-shadow:inset 0 -5px 0 #f1d6df,0 2px 0 rgba(90,16,48,.12)}
.pctmark{position:absolute;right:-6px;top:50%;transform:translateY(-50%);font:700 13px/1 var(--maru);color:var(--cherry2)}

/* ---------- plate ---------- */
.plate{flex:none;margin:14px 16px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:0 6px}
.plate .saved{font:800 34px/1 var(--maru);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.plate .saved small{font-size:15px;font-weight:700;margin-right:3px}
.plate .of{font-size:13px;color:var(--cherry2);margin-top:4px}
.plate .pct{font:800 22px/1 var(--maru);color:var(--white);text-shadow:0 1px 0 var(--pink3)}
.bar{margin:8px 22px 0;height:10px;border-radius:5px;background:rgba(90,16,48,.14);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:5px;background:var(--yolk);transform-origin:left;transition:transform .8s var(--spring)}

/* ---------- body panel ---------- */
.panel{flex:none;margin:12px 12px 0;border-radius:26px;background:var(--pink3);display:grid;grid-template-columns:1fr 112px 1fr;align-items:center;padding:12px 10px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.28),inset 0 -4px 0 rgba(90,16,48,.2)}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--white);font-size:12px;text-align:center}
.slot .mouth{width:74px;height:48px;border-radius:12px;background:var(--white);display:grid;place-items:center;box-shadow:inset 0 -4px 0 #f1d6df}
.slot .mouth i{display:block;width:8px;height:30px;border-radius:4px;background:var(--cherry)}
.slot b{font:800 15px/1 var(--maru);font-variant-numeric:tabular-nums}
.crank{width:112px;height:126px;touch-action:none;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px}
.crank svg{width:104px;height:104px;flex:none}
.crank .arm{transform-origin:56px 56px;transform-box:view-box;transition:transform .5s var(--spring)}
.crank.drag .arm{transition:none}
.crank .lbl{text-align:center;font-size:12px;line-height:1.2;color:var(--white)}
.outlet{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--white);text-align:center}
.door{position:relative;width:78px;height:62px;border-radius:14px 14px 20px 20px;background:var(--cherry);overflow:hidden;box-shadow:inset 0 6px 0 rgba(0,0,0,.25)}
.door .flap{position:absolute;left:0;right:0;top:0;height:22px;background:rgba(255,255,255,.55);border-radius:14px 14px 4px 4px;transform-origin:top;transition:transform .3s var(--spring)}
.door.has .flap{transform:rotateX(70deg)}
.door .cap{position:absolute;left:50%;bottom:6px;width:44px;height:44px;margin-left:-22px;transform:translateY(80px);transition:transform .7s var(--spring)}
.door.has .cap{transform:translateY(0)}
.door .cap svg{width:100%;height:100%}

/* ---------- coins ---------- */
.coins{flex:none;display:flex;justify-content:space-between;gap:4px;padding:12px 14px 0}
.coin{flex:1;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;font-size:12px;color:var(--cherry);transition:background-color .15s}
.coin:active{background:rgba(255,255,255,.28)}
.coin svg{width:40px;height:40px;transition:transform .25s var(--spring)}
.coin:active svg{transform:scale(.86)}

/* ---------- rack ---------- */
.rack{flex:none;position:relative;margin-top:10px;padding:0 0 calc(22px + env(safe-area-inset-bottom))}
.rack::before{content:"";position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom) + 30px);height:14px;background:var(--pink2);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 3px 0 rgba(90,16,48,.14)}
.shelf{position:relative;display:flex;gap:6px;overflow-x:auto;padding:0 14px;scroll-snap-type:x proximity;scrollbar-width:none;touch-action:pan-x}
.shelf::-webkit-scrollbar{display:none}
.cp{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;gap:2px;scroll-snap-align:center;padding-top:8px}
.cp svg{width:54px;height:54px;transition:transform .45s var(--spring)}
.cp[aria-pressed=true] svg{transform:translateY(-6px) scale(1.12)}
.cp:active svg{transform:scale(.9)}
.cp span{font-size:12px;line-height:1.25;max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cherry);margin-top:16px}
.cp[aria-pressed=true] span{font-weight:800}
.cp small{font-size:11px;color:var(--cherry2);font-variant-numeric:tabular-nums}
.home-ind{position:absolute;left:50%;bottom:calc(7px + env(safe-area-inset-bottom)*.3);width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--cherry);opacity:.7;z-index:40;pointer-events:none}

/* flying coin */
.fly{position:absolute;left:0;top:0;width:40px;height:40px;z-index:30;pointer-events:none}
.fly svg{width:100%;height:100%}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(90,16,48,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:51;max-height:88%;overflow-y:auto;background:var(--white);border-radius:34px;padding:10px 20px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(110%);visibility:hidden;transition:transform .55s var(--spring),visibility 0s .55s;touch-action:none;box-shadow:inset 0 -5px 0 #f6dbe4}
.sheet.on{transform:translateY(0);visibility:visible;transition:transform .55s var(--spring)}
.sheet.drag{transition:none}
.grip{width:42px;height:5px;border-radius:3px;background:#f2c3d3;margin:0 auto 14px}
.sheet h2{font:800 21px/1.25 var(--maru);text-align:center}
.sheet .sub{text-align:center;font-size:13px;color:var(--cherry2);margin-top:4px}
.field{margin-top:14px}
.field label{display:block;font-size:13px;color:var(--cherry2);margin-bottom:6px}
.field input{width:100%;height:52px;border:0;border-radius:16px;background:var(--blush);padding:0 16px;font:700 18px var(--maru);color:var(--cherry);outline:none}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{min-height:48px;padding:0 10px;border-radius:14px;display:flex;align-items:center;gap:6px;font-size:14px;background:var(--blush);transition:background-color .15s}
.pick svg{width:30px;height:30px}
.pick[aria-checked=true]{background:var(--yolk)}
.pick:active{background:#ffd9e5}
.big{margin-top:18px;width:100%;height:56px;border-radius:18px;background:var(--pink3);color:var(--white);font:800 18px/1 var(--maru);box-shadow:inset 0 -5px 0 rgba(90,16,48,.25);transition:transform .15s,background-color .15s}
.big:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(90,16,48,.25)}
.row2{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:10px}
.txtbtn{min-height:44px;padding:0 12px;font-size:15px;color:var(--cherry2);display:inline-flex;align-items:center;gap:6px}
.txtbtn svg{width:20px;height:20px}
.txtbtn:active{opacity:.6}
.ledger{margin-top:14px;list-style:none}
.ledger li{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;font-size:15px}
.ledger li+li{box-shadow:0 -2px 0 var(--blush)}
.ledger li b{font-variant-numeric:tabular-nums}
.ledger li.out b{color:var(--pink3)}
.ledger li span{color:var(--cherry2);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;text-align:center}
.stats b{display:block;font:800 21px/1.1 var(--maru);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--cherry2)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.keypad button{height:52px;border-radius:16px;background:var(--blush);font:700 21px var(--maru);transition:background-color .1s}
.keypad button:active{background:#ffd0de}
.amt{margin-top:12px;text-align:center;font:800 40px/1 var(--maru);font-variant-numeric:tabular-nums}
.amt small{font-size:17px;margin-right:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
.seg button{height:46px;border-radius:14px;background:var(--blush);font-size:15px}
.seg button[aria-checked=true]{background:var(--yolk);font-weight:800}
.prize{position:relative;height:210px;margin-top:6px}
.prize .half{position:absolute;left:50%;top:40px;width:140px;height:70px;margin-left:-70px;transition:transform .9s var(--spring)}
.prize .half svg{width:100%;height:100%}
.prize .top{transform:translateY(0)}
.prize .bot{top:110px}
.prize.open .top{transform:translate(-58px,-30px) rotate(-28deg)}
.prize.open .bot{transform:translate(58px,26px) rotate(22deg)}
.prize .toy{position:absolute;left:50%;top:50px;width:110px;height:110px;margin-left:-55px;transform:scale(.4);transition:transform .8s .2s var(--spring)}
.prize.open .toy{transform:scale(1)}
.prize .toy svg{width:100%;height:100%}
.shelfbook{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.shelfbook div{text-align:center;font-size:13px}
.shelfbook svg{width:64px;height:64px;margin:0 auto 4px}
.shelfbook small{display:block;color:var(--cherry2);font-size:12px}
.empty{text-align:center;color:var(--cherry2);font-size:14px;padding:18px 0}
.toast{position:absolute;left:50%;top:calc(52px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-190%);visibility:hidden;transition:transform .5s var(--spring),visibility 0s .5s;
  display:flex;align-items:center;gap:10px;padding:10px 10px 10px 18px;border-radius:20px;background:var(--white);font-size:14px;font-weight:700;white-space:nowrap;box-shadow:inset 0 -4px 0 #f6dbe4}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .5s var(--spring)}
.toast button{min-height:36px;padding:0 10px;border-radius:12px;background:var(--yolk);font-size:14px;font-weight:800}

@media (max-height:720px){
  .marq h1{font-size:20px}.plate{margin-top:8px}.plate .saved{font-size:28px}
  .panel{margin-top:8px;padding:8px 10px;grid-template-columns:1fr 96px 1fr}.crank{width:96px;height:108px}.crank svg{width:88px;height:88px}
  .slot .mouth{height:40px}.door{height:52px}.coins{padding-top:6px}.coin{height:54px}.coin svg{width:32px;height:32px}
  .rack{margin-top:4px}.cp{padding-top:4px}.cp svg{width:44px;height:44px}.cp span{margin-top:12px}
}
@media (prefers-reduced-motion:reduce){
  .bar i,.crank .arm,.door .flap,.door .cap,.cp svg,.sheet,.toast,.prize .half,.prize .toy,.coin svg{transition-duration:.01s!important}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><svg id="bd" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"></svg></div>
  <div class="device">
    <div class="screen" id="screen">
      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="g">
          <svg width="19" height="12" viewBox="0 0 19 12" fill="currentColor"><circle cx="2" cy="10" r="2"/><rect x="5" y="6" width="4" height="6" rx="2"/><rect x="10" y="3" width="4" height="9" rx="2"/><rect x="15" y="0" width="4" height="12" rx="2"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M1.5 4.5c3.8-3.4 9.2-3.4 13 0M4.3 7.4c2.2-1.9 5.2-1.9 7.4 0"/><circle cx="8" cy="10.2" r="1.3" fill="currentColor" stroke="none"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x="1" y="1" width="22" height="11" rx="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3.6" y="3.6" width="14" height="5.8" rx="2.9" fill="currentColor"/><path d="M24.6 4.8c1.2.4 1.2 3 0 3.4z" fill="currentColor"/></svg>
        </span>
      </div>

      <header class="marq">
        <div class="nm"><h1 id="gName">東京賞楓</h1><p class="tg" id="gTag">目標 NT$45,000・連續存 6 天</p></div>
        <button class="book" id="bookBtn" aria-label="扭蛋冊"><svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5c3.4-1.4 6.8-1.4 10 1 3.2-2.4 6.6-2.4 10-1v17c-3.4-1.4-6.8-1.4-10 1-3.2-2.4-6.6-2.4-10-1z"/><path d="M15 7.5v17"/><circle cx="9.8" cy="13.4" r="2.6" fill="#ffd23f"/><circle cx="20.2" cy="15.6" r="2.6" fill="#fff"/></svg></button>
      </header>

      <div class="dome" id="dome">
        <div class="globe" id="globe">
          <canvas id="cv" aria-label="存錢圓罩，點一下搖一搖" role="img"></canvas>
          <svg class="glass" viewBox="0 0 300 300" aria-hidden="true">
            <circle cx="150" cy="150" r="147" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity=".9"/>
            <path d="M58 92c16-34 48-58 88-64" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-opacity=".75"/>
            <path d="M44 132c1-8 3-16 6-23" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-opacity=".6"/>
            <path d="M232 238c16-14 28-32 34-52" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-opacity=".35"/>
          </svg>
          <div class="neck"></div>
        </div>
      </div>

      <div class="plate">
        <div><p class="saved" id="saved"><small>NT$</small>28,600</p><p class="of" id="of">還差 NT$16,400</p></div>
        <p class="pct" id="pct">64%</p>
      </div>
      <div class="bar"><i id="bar"></i></div>

      <div class="panel">
        <div class="slot"><div class="mouth" id="mouth"><i></i></div><span>投入 <b id="pend">NT$0</b></span></div>
        <div class="crank" id="crank" role="button" tabindex="0" aria-label="轉把手，把投入的錢存進去">
          <svg viewBox="0 0 112 112" aria-hidden="true">
            <circle cx="56" cy="56" r="50" fill="#fff"/><circle cx="56" cy="56" r="50" fill="none" stroke="#f1d6df" stroke-width="5" stroke-dasharray="3 9"/>
            <g class="arm" id="arm"><rect x="16" y="46" width="80" height="20" rx="10" fill="#ffd23f"/><rect x="16" y="46" width="80" height="7" rx="3.5" fill="#fff" fill-opacity=".5"/><circle cx="84" cy="56" r="7" fill="#e9b93a"/></g>
            <circle cx="56" cy="56" r="11" fill="#e8517a"/><circle cx="53" cy="53" r="3" fill="#fff" fill-opacity=".7"/>
          </svg>
          <span class="lbl" id="crankLbl">轉一圈</span>
        </div>
        <div class="outlet"><button class="door" id="door" aria-label="取出扭蛋"><span class="flap"></span><span class="cap" id="doorCap"></span></button><span id="doorLbl">存滿會掉扭蛋</span></div>
      </div>

      <div class="coins" id="coins"></div>

      <div class="rack"><div class="shelf" id="shelf" role="group" aria-label="目標扭蛋架"></div></div>
      <div class="home-ind"></div>

      <div id="flyLayer"></div>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT"><div class="grip"></div><div id="sheetBody"></div></div>
      <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="undoBtn">收回</button></div>
    </div>
  </div>
  <div class="caption">
    <h1>存錢罐</h1>
    <p>投幣、轉把手，錢掉進透明圓罩裡越堆越高。存滿那天，會轉出一顆扭蛋。</p>
  </div>

/* ---------- crank ---------- */

crank.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();autoTurn();}});
function autoTurn(){if(busy)return;var start=ang,t0=performance.now(),dur=RM.matches?1:700,ticks=0;busy=true;crank.classList.add('drag');
  (function step(t){var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);ang=start+360*e;setArm(ang);var tk=Math.floor(e*12);if(tk>ticks){ticks=tk;tick();}if(p<1)requestAnimationFrame(step);else{crank.classList.remove('drag');busy=false;commit();}})(performance.now());}
function commit(){var g=goal();if(!g){toast('先新增一個目標',null);return;}
  if(!pending){haptic([20,40,20]);toast('先投幣再轉',null);return;}
  var was=saved(g),v=pending;pending=0;g.log.unshift({t:Date.now(),a:v});persist();
  var before=balls.length,now=tokensFor(g),add=Math.max(1,now-before);drop(denomFor(v),Math.min(add,40));chaching();haptic([10,30,16]);
  if(was<g.target&&saved(g)>=g.target){g.done=Date.now();persist();setTimeout(function(){fanfare();haptic([30,60,30,60,60]);toast('存滿了！扭蛋掉出來了',null);},500);}
  else toast('存入 NT$'+money(v),function(){var i=g.log.indexOf(g.log.filter(function(x){return x.a===v;})[0]);if(i>=0)g.log.splice(i,1);persist();rebuild(true);render();kick();});
  render();}

/* ---------- capsule open ---------- */
$('door').addEventListener('click',function(){var g=goal();if(!g||saved(g)<g.target){haptic([20,40,20]);toast('存滿 '+(g?'NT$'+money(g.target):'')+' 才會掉扭蛋',null);return;}
  haptic(10);var c=CAPCOL[g.col]||CAPCOL.y;
  openSheet('<h2 id="sheetT">'+g.n+'</h2><p class="sub">NT$'+money(saved(g))+'・存了 '+Math.max(1,Math.round((Date.now()-g.log[g.log.length-1].t)/864e5))+' 天</p>'+
    '<div class="prize" id="prize"><div class="half top"><svg viewBox="0 0 140 70"><path d="M2 68a68 66 0 0 1 136 0z" fill="'+c[0]+'" stroke="#5a1030" stroke-width="3"/><path d="M26 30c10-12 24-18 40-20" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none" opacity=".8"/></svg></div>'+
    '<div class="toy"><svg viewBox="0 0 64 64">'+(ICON[g.ic]||ICON.gift)+'</svg></div>'+
    '<div class="half bot"><svg viewBox="0 0 140 70"><path d="M2 2a68 66 0 0 0 136 0z" fill="#fff" fill-opacity=".85" stroke="#5a1030" stroke-width="3"/></svg></div></div>'+
    '<button class="big" id="keepBtn">收進扭蛋冊</button>');
  setTimeout(function(){var p=$('prize');if(p)p.classList.add('open');fanfare();},250);});

/* ---------- shelf ---------- */
var pressT=null,longed=false;
$('shelf').addEventListener('pointerdown',function(e){var b=e.target.closest('.cp[data-id]');if(!b)return;longed=false;clearTimeout(pressT);pressT=setTimeout(function(){longed=true;haptic(14);openDetail(b.dataset.id);},520);});
['pointerup','pointercancel','pointerleave'].forEach(function(n){$('shelf').addEventListener(n,function(){clearTimeout(pressT);});});
$('shelf').addEventListener('scroll',function(){clearTimeout(pressT);},{passive:true});
$('shelf').addEventListener('click',function(e){var b=e.target.closest('.cp');if(!b)return;if(longed){longed=false;return;}
  if(b.id==='addGoal'){openAdd();return;}var id=b.dataset.id;if(id===cur){openDetail(id);return;}
  cur=id;pending=0;hideToast();persist();haptic(8);tick();rebuild(true);render();kick();});

/* ---------- sheets ---------- */
var sheet=$('sheet'),scrim=$('scrim'),lastFocus=null,form=null;
function openSheet(h){hideToast();lastFocus=document.activeElement;$('sheetBody').innerHTML=h;sheet.style.transform='';sheet.scrollTop=0;sheet.classList.add('on');scrim.classList.add('on');haptic(6);}
function closeSheet(){if(!sheet.classList.contains('on'))return;sheet.classList.remove('on','drag');sheet.style.transform='';scrim.classList.remove('on');form=null;if(lastFocus&&lastFocus.focus)try{lastFocus.focus({preventScroll:true});}catch(e){}}
scrim.addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
(function(){var sy=0,dy=0,t0=0,on=false;
  sheet.addEventListener('pointerdown',function(e){if(e.target.closest('button,input')||sheet.scrollTop>0)return;on=true;sy=e.clientY;dy=0;t0=e.timeStamp;sheet.classList.add('drag');try{sheet.setPointerCapture(e.pointerId);}catch(x){}});
  sheet.addEventListener('pointermove',function(e){if(!on)return;dy=e.clientY-sy;sheet.style.transform='translateY('+(dy>0?dy:dy/6).toFixed(1)+'px)';scrim.style.opacity=Math.max(0,1-dy/sheet.offsetHeight).toFixed(2);});
  function end(e){if(!on)return;on=false;sheet.classList.remove('drag');scrim.style.opacity='';if(dy>sheet.offsetHeight*.35||dy/Math.max(1,e.timeStamp-t0)>.6)closeSheet();else sheet.style.transform='';}
  sheet.addEventListener('pointerup',end);sheet.addEventListener('pointercancel',end);})();

function icPicks(sel){return Object.keys(ICON).filter(function(k){return k!=='wheel';}).map(function(k){return '<button class="pick" role="radio" data-ic="'+k+'" aria-checked="'+(k===sel)+'" aria-label="'+k+'"><svg viewBox="0 0 64 64">'+ICON[k]+'</svg></button>';}).join('');}
function colPicks(sel){return Object.keys(CAPCOL).map(function(k){return '<button class="pick" role="radio" data-col="'+k+'" aria-checked="'+(k===sel)+'" aria-label="扭蛋顏色">'+capsule(k,.4).replace('<svg ','<svg style="width:32px;height:32px" ')+'</button>';}).join('');}
function openAdd(){form={mode:'add',n:'',target:10000,ic:'gift',col:'y'};
  openSheet('<h2 id="sheetT">放一顆新扭蛋上架</h2><p class="sub">存滿就能轉出來</p>'+
    '<div class="field"><label for="fN">想存錢做什麼</label><input id="fN" maxlength="12" placeholder="例如：花蓮溯溪" autocomplete="off"></div>'+
    '<div class="field"><label for="fT">目標金額（NT$）</label><input id="fT" inputmode="numeric" value="10000"></div>'+
    '<div class="field"><label>扭蛋裡的玩具</label><div class="picks" role="radiogroup">'+icPicks('gift')+'</div></div>'+
    '<div class="field"><label>殼的顏色</label><div class="picks" role="radiogroup">'+colPicks('y')+'</div></div>'+
    '<button class="big" id="saveGoal">上架</button>');}
function openDetail(id){var g=G(id);if(!g)return;form={mode:'detail',id:id,wd:false};var s=saved(g);
  var L=g.log.slice(0,8).map(function(e){var d=new Date(e.t);return '<li class="'+(e.a<0?'out':'')+'"><span>'+(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+('0'+d.getMinutes()).slice(-2)+'</span><b>'+(e.a<0?'−':'+')+' NT$'+money(Math.abs(e.a))+'</b></li>';}).join('');
  var days=g.log.length?Math.max(1,Math.round((Date.now()-g.log[g.log.length-1].t)/864e5)):0;
  openSheet('<h2 id="sheetT">'+g.n+'</h2><p class="sub">目標 NT$'+money(g.target)+'</p>'+
    '<div class="stats"><div><b>'+Math.min(100,Math.round(s/g.target*100))+'%</b><span>進度</span></div><div><b>'+g.log.filter(function(e){return e.a>0;}).length+'</b><span>投幣次數</span></div><div><b>'+days+'</b><span>天</span></div></div>'+
    '<ul class="ledger">'+(L||'<li><span>還沒有紀錄</span><b></b></li>')+'</ul>'+
    '<div class="row2"><button class="txtbtn" id="wdBtn"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10M6 9l4 4 4-4M4 17h12"/></svg>領出一些</button><button class="txtbtn" id="delBtn" style="color:#e8517a"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M8 6V4h4v2M5.5 6.5l.8 10h7.4l.8-10"/></svg>下架這顆</button></div>');}
var amt='';
function openCustom(wd){amt='';form={mode:wd?'withdraw':'custom',id:cur};
  openSheet('<h2 id="sheetT">'+(wd?'從罐子領出':'投多少？')+'</h2><p class="amt" id="amt"><small>NT$</small>0</p><div class="keypad" id="kp">'+[1,2,3,4,5,6,7,8,9,'00',0,'⌫'].map(function(k){return '<button data-k="'+k+'" aria-label="'+(k==='⌫'?'刪除':k)+'">'+(k==='⌫'?'<svg viewBox="0 0 24 24" width="24" height="24" style="margin:auto" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h10v12H9l-5-6z"/><path d="M12 10l4 4M16 10l-4 4"/></svg>':k)+'</button>';}).join('')+'</div><button class="big" id="amtOk">'+(wd?'領出':'投進投幣口')+'</button>');}
sheet.addEventListener('click',function(e){var b=e.target.closest('button');if(!b||!form)return;
  if(b.dataset.ic){form.ic=b.dataset.ic;sheet.querySelectorAll('[data-ic]').forEach(function(x){x.setAttribute('aria-checked',String(x===b));});haptic(5);return;}
  if(b.dataset.col){form.col=b.dataset.col;sheet.querySelectorAll('[data-col]').forEach(function(x){x.setAttribute('aria-checked',String(x===b));});haptic(5);tick();return;}
  if(b.id==='saveGoal'){var n=($('fN').value||'').trim(),t=parseInt(($('fT').value||'').replace(/[^0-9]/g,''),10);
    if(!n||!(t>=100)){haptic([20,40,20]);(n?$('fT'):$('fN')).focus();toast(!n?'幫目標取個名字':'金額至少 NT$100',null);return;}
    var g={id:'g'+Date.now().toString(36),n:n,target:t,col:form.col,ic:form.ic,log:[]};goals.unshift(g);cur=g.id;pending=0;persist();closeSheet();rebuild(true);render();kick();chaching();haptic(12);
    var sh=$('shelf');sh.scrollTo({left:0,behavior:RM.matches?'auto':'smooth'});return;}
  if(b.id==='wdBtn'){closeSheet();setTimeout(function(){openCustom(true);},120);return;}
  if(b.id==='delBtn'){var id=form.id,gi=-1;goals.forEach(function(x,i){if(x.id===id)gi=i;});if(gi<0)return;var gone=goals.splice(gi,1)[0];if(cur===id){cur=(active()[0]||{}).id||null;}persist();closeSheet();rebuild(true);render();kick();haptic([10,40,10]);
    toast('下架「'+gone.n+'」',function(){goals.splice(gi,0,gone);cur=gone.id;persist();rebuild(true);render();kick();});return;}
  if(b.dataset.k!==undefined){var k=b.dataset.k;if(k==='⌫')amt=amt.slice(0,-1);else if(amt.length<7&&!(amt===''&&(k==='0'||k==='00')))amt+=k;$('amt').innerHTML='<small>NT$</small>'+money(+amt||0);haptic(3);tick();return;}
  if(b.id==='amtOk'){var v=+amt||0;if(!v){haptic([20,40,20]);return;}var mode=form.mode;closeSheet();
    if(mode==='custom'){insert(v,$('coins').lastChild);}
    else{var gg=goal();if(!gg)return;var mx=saved(gg);v=Math.min(v,mx);if(!v){toast('罐子是空的',null);return;}gg.log.unshift({t:Date.now(),a:-v});persist();rebuild(true);render();kick();haptic([10,30,10]);toast('領出 NT$'+money(v),null);}return;}
  if(b.id==='keepBtn'){var g2=goal();if(g2){g2.opened=true;g2.done=g2.done||Date.now();persist();}closeSheet();pending=0;rebuild(true);render();kick();setTimeout(openBook,300);return;}
});
function openBook(){form={mode:'book'};var done=goals.filter(function(g){return g.opened;}),total=0;goals.forEach(function(g){total+=saved(g);});
  openSheet('<h2 id="sheetT">扭蛋冊</h2><p class="sub">一共存了 NT$'+money(total)+'・連續 '+streak()+' 天</p>'+
    (done.length?'<div class="shelfbook">'+done.map(function(g){var d=new Date(g.done||Date.now());return '<div><svg viewBox="0 0 64 64">'+(ICON[g.ic]||ICON.gift)+'</svg>'+g.n+'<small>'+d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+'・NT$'+money(g.target)+'</small></div>';}).join('')+'</div>':'<p class="empty">還沒有轉出過扭蛋。存滿第一個目標吧。</p>'));}
$('bookBtn').addEventListener('click',function(){haptic(6);openBook();});

/* ---------- toast ---------- */
var toastT=null,undoFn=null;
/* a pending undo belongs to the screen it was raised on: drop it when switching goal or opening a sheet over it */
function hideToast(){clearTimeout(toastT);undoFn=null;var t=document.getElementById('toast');if(t)t.classList.remove('on');}
function toast(m,undo){$('toastMsg').textContent=m;undoFn=undo||null;$('undoBtn').style.display=undo?'':'none';var t=$('toast');t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');undoFn=null;},undo?4000:2000);}
$('undoBtn').addEventListener('click',function(){if(undoFn){var f=undoFn;undoFn=null;f();haptic(6);}$('toast').classList.remove('on');});

/* ---------- backdrop: a wall of machines ---------- */
(function(){var h='<rect width="1600" height="1000" fill="#ffc8d8"/>',cols=['#ff8fb1','#ffd23f','#ffffff','#e8517a'],k=0;
  for(var row=0;row<3;row++)for(var i=0;i<9;i++){var x=i*190-40+(row%2)*95,y=row*330-40,c=cols[(i+row*2)%4],c2=c==='#ffffff'?'#f6dbe4':c==='#ffd23f'?'#e9b93a':c==='#ff8fb1'?'#e8517a':'#b8325c';
    h+='<g opacity=".3"><rect x="'+(x+20)+'" y="'+(y+150)+'" width="130" height="150" rx="18" fill="'+c+'"/><rect x="'+(x+20)+'" y="'+(y+288)+'" width="130" height="12" fill="'+c2+'"/><circle cx="'+(x+85)+'" cy="'+(y+100)+'" r="68" fill="#fff" fill-opacity=".75"/>';
    for(var j=0;j<6;j++){var cc=cols[(j+i)%4];h+='<circle cx="'+(x+50+(j%3)*34)+'" cy="'+(y+120+Math.floor(j/3)*26)+'" r="14" fill="'+(cc==='#ffffff'?'#ff8fb1':cc)+'"/>';}
    h+='<circle cx="'+(x+85)+'" cy="'+(y+215)+'" r="22" fill="#fff"/><rect x="'+(x+67)+'" y="'+(y+209)+'" width="36" height="12" rx="6" fill="#ffd23f"/><rect x="'+(x+60)+'" y="'+(y+250)+'" width="50" height="30" rx="10" fill="#5a1030" fill-opacity=".6"/></g>';}
  $('bd').innerHTML=h;})();

/* ---------- clock ---------- */
function clock(){var d=new Date();$('clock').textContent=d.getHours()+':'+('0'+d.getMinutes()).slice(-2);}
clock();setTimeout(function(){clock();setInterval(clock,60000);},(60-new Date().getSeconds())*1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){clock();render();kick();}});

renderShelf();sizeDome();rebuild(true);render();draw();
if(window.ResizeObserver){var lastD=D;new ResizeObserver(function(){var o=D;sizeDome();if(Math.abs(D-o)>2)rebuild(true);draw();}).observe($('dome'));}
})();
</script>
</body>
