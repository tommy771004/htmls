<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8541c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="唱片箱">
<title>唱片箱 · 黑膠收藏</title>
<meta name="description" content="像在七〇年代唱片行翻木箱一樣整理黑膠：往下撥翻唱片、抽出放上唱盤、拖唱臂落針聽爆音與合成音樂，並管理收藏與想要清單。收錄於 100 Creative HTML Works（App 032・七〇年代唱片行）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/032-crate-vinyl.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c8541c'/%3E%3Cpath d='M0 22h64v7H0z' fill='%23e0a526'/%3E%3Cpath d='M0 29h64v6H0z' fill='%236b3417'/%3E%3Ccircle cx='32' cy='38' r='17' fill='%231a1411'/%3E%3Ccircle cx='32' cy='38' r='6' fill='%23e0a526'/%3E%3C/svg%3E">
<style>
:root{
  --orange:#c8541c;--rust:#9e3d14;--brown:#6b3417;--wood:#7a4522;--wood2:#5a2f16;--mustard:#e0a526;--black:#1a1411;--ink:#1a1411;--paper:#f6e6c6;
  --serif:Baskerville,"Baskerville Old Face","Songti TC",serif;
  --song:"Songti TC",Baskerville,serif;
  --sans:"PingFang TC",-apple-system,system-ui,sans-serif;
  --spring:cubic-bezier(.3,1.3,.5,1);--icA:#1a1411;--icB:#e0a526;
  --out:cubic-bezier(.2,.9,.3,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.45 var(--sans);background:#2a1a12;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--mustard);outline-offset:3px}
svg{display:block}
input{font:inherit;color:inherit}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--orange);isolation:isolate;-webkit-user-select:none;user-select:none}
.screen input{-webkit-user-select:text;user-select:text}
@media (min-width:521px){
  .stage{display:flex;align-items:center;justify-content:center;gap:60px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0;overflow:hidden;background:#3a2014}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:52px;padding:10px;z-index:1;
    background:#24150e;box-shadow:inset 0 0 0 2px #4d2d1c,0 16px 26px -18px rgba(10,4,0,.9)}
  .screen{inset:10px;border-radius:42px}
  .caption{display:block;position:relative;z-index:1;max-width:240px;color:var(--paper);padding:22px 24px;background:#1a1411}
  .caption h1{font:italic 700 44px/1 var(--serif)}
  .caption p{margin-top:12px;font-size:15px;line-height:1.7;color:rgba(246,230,198,.76)}
}
@media (min-width:521px) and (max-width:900px){.caption{display:none}}
.wall{position:absolute;inset:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px;padding:18px;opacity:.28}
.wall svg{width:100%;height:auto}
.bstripes{position:absolute;left:0;right:0;top:50%;height:120px;margin-top:-60px;background:linear-gradient(#e0a526 0 33%,#c8541c 33% 66%,#6b3417 66%)}

/* halftone print texture on the orange wall */
.screen::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.16;
  background-image:radial-gradient(circle at 50% 50%,#6b3417 1.1px,transparent 1.6px);background-size:7px 7px}
.status{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 32px;font:700 16px/1 var(--sans);color:var(--black);pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
.status svg *{fill:currentColor}
.screen.dark .status{color:var(--paper)}
.screen.dark{--icA:#f6e6c6;--icB:#c8541c}
.ic-a{fill:var(--icA)} .ic-b{fill:var(--icB)}
.screen.list .stripes{display:none}
@media (display-mode:standalone){.status{display:none}}

.head{position:absolute;z-index:10;left:0;right:0;top:calc(48px + env(safe-area-inset-top));height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 22px}
.mark{display:flex;align-items:baseline;gap:8px;color:var(--black)}
.mark b{font:700 27px/1 var(--song);letter-spacing:.06em}
.mark i{font:italic 700 22px/1 var(--serif);color:var(--black)}
.screen.dark .mark{color:var(--paper)} .screen.dark .mark i{color:var(--mustard)}
.iconbtn{width:48px;height:48px;display:grid;place-items:center;transition:transform .15s}
.iconbtn:active{transform:scale(.86)}
.stripes{position:absolute;z-index:1;left:0;right:0;top:calc(122px + env(safe-area-inset-top));height:54px;pointer-events:none;
  background:linear-gradient(#e0a526 0 33.3%,#c8541c 33.3% 66.6%,#6b3417 66.6%)}
.screen.dark .stripes{opacity:.9}

.views{position:absolute;inset:0;z-index:5}
.view{position:absolute;inset:0;padding-top:calc(110px + env(safe-area-inset-top));padding-bottom:calc(88px + env(safe-area-inset-bottom));transition:transform .5s var(--out)}
.view[hidden]{display:block;visibility:hidden;pointer-events:none}
.view.off-l{transform:translateX(-30%)} .view.off-r{transform:translateX(30%)}

/* ---------- dig view ---------- */
.dividers{position:relative;z-index:6;display:flex;gap:6px;padding:0 14px;height:56px;align-items:flex-end;overflow-x:auto;scrollbar-width:none}
.dividers::-webkit-scrollbar{display:none}
.dividers button{flex:none;height:46px;padding:0 14px;border-radius:9px 9px 0 0;background:#d6b98a;color:var(--black);font:600 15px/1 var(--sans);transition:transform .3s var(--spring),background-color .2s}
.dividers button[aria-pressed=true]{background:var(--black);color:var(--mustard);transform:translateY(-6px)}
.dividers button span{font:italic 700 13px/1 var(--serif);margin-left:4px;opacity:.7}
.crate{position:relative;height:calc(100% - 56px - 150px);touch-action:none;cursor:grab;perspective:950px;perspective-origin:50% -30%;container-type:size;overflow:hidden}
.stack{position:absolute;inset:0;transform-style:preserve-3d}
.sl{--sz:min(262px,70cqw,calc(100cqh - 110px));position:absolute;left:50%;bottom:36px;width:var(--sz);height:var(--sz);margin-left:calc(var(--sz)/-2);transform-origin:50% 100%;transition:transform .55s var(--spring);background:#111}
.sl svg{width:100%;height:100%}
.sl::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.4)}
.sl.gone{visibility:hidden}
.crate.drag .sl{transition:none}
.box{position:absolute;left:0;right:0;bottom:0;height:min(94px,23%);pointer-events:none;z-index:300}
.box svg{width:100%;height:100%}
.empty{position:absolute;left:0;right:0;top:30%;text-align:center;color:var(--black);font-size:15px;z-index:2}
.empty b{display:block;font:italic 700 26px/1.2 var(--serif)}
.info{position:absolute;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom));height:150px;padding:14px 22px 0;background:var(--black);color:var(--paper);z-index:4}
.info .t{font:700 22px/1.2 var(--song);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:96px}
.info .t.lat{font:italic 700 24px/1.15 var(--serif)}
.info .a{margin-top:3px;font-size:15px;color:rgba(246,230,198,.78);padding-right:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .meta{margin-top:6px;font-size:13px;color:rgba(246,230,198,.6)}
.info .price{position:absolute;right:22px;top:14px;text-align:right;font:italic 700 26px/1 var(--serif);color:var(--mustard)}
.info .price small{display:block;font:500 12px/1.4 var(--sans);font-style:normal;color:rgba(246,230,198,.6);margin-top:4px}
.info .row{position:absolute;left:14px;right:14px;bottom:10px;display:flex;gap:8px}
.play{flex:1;height:48px;background:var(--mustard);color:var(--black);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;transition:background-color .15s,transform .15s}
.play:active{transform:scale(.97);background:#f0b93a}
.toggle{flex:none;height:48px;padding:0 14px;color:var(--paper);font-weight:600;display:flex;align-items:center;gap:8px;background:#2c211b;transition:background-color .15s}
.toggle:active{background:#3a2c24}
.toggle[aria-pressed=true]{color:var(--mustard)}

/* ---------- turntable view ---------- */
.screen.dark{background:#1f1510}
.screen.dark::before{opacity:.07}
.deck{position:relative;margin:34px 12px 0;aspect-ratio:366/360;background:#5a2f16;touch-action:none}
.deck > svg{position:absolute;inset:0;width:100%;height:100%}
#armG{cursor:grab}
.deckbar{display:flex;align-items:center;justify-content:space-between;margin:12px 16px 0;color:var(--paper)}
.speed{display:flex;background:#2c211b}
.speed button{width:56px;height:44px;font:italic 700 18px/1 var(--serif);color:rgba(246,230,198,.55);transition:color .2s,background-color .2s}
.speed button[aria-pressed=true]{background:var(--mustard);color:var(--black)}
.lift{height:44px;padding:0 14px;color:var(--paper);font-weight:600;display:flex;align-items:center;gap:8px;background:#2c211b}
.lift:active{background:#3a2c24}
.lift[disabled]{opacity:.4}
.np{margin:14px 22px 0;color:var(--paper)}
.np .t{font:700 20px/1.2 var(--song);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np .s{font-size:13px;color:rgba(246,230,198,.62);margin-top:2px}
.tracks{margin:10px 12px 0;overflow:auto;flex:1;min-height:0;overscroll-behavior:contain}
#v-deck,#v-deck[hidden]{display:flex;flex-direction:column}
.deck{flex:none}
.tr{display:grid;grid-template-columns:36px 1fr auto;align-items:center;width:100%;min-height:44px;padding:0 10px;text-align:left;color:rgba(246,230,198,.8);transition:background-color .15s}
.tr:active{background:#2c211b}
.tr .n{font:italic 700 15px/1 var(--serif);color:rgba(224,165,38,.8)}
.tr .d{font-size:13px;font-variant-numeric:tabular-nums;color:rgba(246,230,198,.5)}
.tr.on{color:var(--mustard);background:#2a1d16}
.hint{margin:10px 22px 0;font-size:13px;color:rgba(246,230,198,.55)}

/* ---------- list view ---------- */
.listhead{padding:6px 22px 0;color:var(--black)}
.listhead .big{font:italic 700 46px/1 var(--serif);letter-spacing:-.01em}
.listhead .big small{font:700 17px/1 var(--song);margin-left:8px;letter-spacing:.04em;font-style:normal}
.listhead .sum{margin-top:6px;font-size:14px}
.filters{display:flex;gap:18px;padding:10px 22px 8px}
.filters button{height:44px;font-weight:700;font-size:16px;color:rgba(26,20,17,.55);position:relative}
.filters button[aria-pressed=true]{color:var(--black)}
.filters button[aria-pressed=true]::after{content:"";position:absolute;left:-4px;right:-4px;bottom:6px;height:8px;background:var(--mustard);z-index:-1;border-radius:1px}
.rows{position:absolute;left:0;right:0;top:calc(110px + env(safe-area-inset-top) + 142px);bottom:calc(88px + env(safe-area-inset-bottom));overflow:auto;background:var(--black);overscroll-behavior:contain}
.rw{position:relative;height:76px;overflow:hidden}
.rw .del{position:absolute;right:0;top:0;bottom:0;width:96px;background:#9e3d14;color:var(--paper);font-weight:700;display:flex;align-items:center;justify-content:center}
.rw .fr{position:absolute;inset:0;display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:0 14px 0 16px;background:var(--black);color:var(--paper);transition:transform .35s var(--out);touch-action:pan-y;text-align:left;width:100%}
.rw.drag .fr{transition:none}
.rw .fr svg{width:56px;height:56px}
.rw .tt{min-width:0}
.rw .tt b{display:block;font:700 16px/1.25 var(--song);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .tt span{display:block;font-size:13px;color:rgba(246,230,198,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .pr{text-align:right;font:italic 700 17px/1.2 var(--serif);color:var(--mustard)}
.rw .pr small{display:block;font:500 12px/1.3 var(--sans);color:rgba(246,230,198,.55)}
.rw + .rw .fr{box-shadow:inset 0 1px 0 #2c211b}
.none{padding:30px 22px;color:rgba(246,230,198,.6);font-size:15px}

/* ---------- dymo nav ---------- */
.nav{position:absolute;z-index:20;left:0;right:0;bottom:0;height:calc(88px + env(safe-area-inset-bottom));padding:12px 14px env(safe-area-inset-bottom);display:flex;justify-content:center;gap:10px;background:#2a1a12}
.nav::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,#3a2418 0 3px,#2a1a12 3px 9px)}
.tape{position:relative;height:46px;min-width:98px;padding:0 18px;color:#fff;font:700 17px/1 var(--sans);letter-spacing:.16em;background:#111;
  clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%);text-shadow:0 1px 0 rgba(0,0,0,.6),0 -1px 0 rgba(255,255,255,.25);transition:background-color .2s,transform .3s var(--spring)}
.tape:nth-child(1){transform:rotate(-2deg)} .tape:nth-child(2){transform:rotate(1.2deg)} .tape:nth-child(3){transform:rotate(-1deg)}
.tape[aria-selected=true]{background:#b8321a}
.tape::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);pointer-events:none}
.tape:active{filter:brightness(1.25)}

.homebar{position:absolute;z-index:70;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--paper);opacity:.7;pointer-events:none}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(26,20,17,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:92%;display:flex;flex-direction:column;background:var(--paper);color:var(--black);
  transform:translateY(calc(100% + 24px));transition:transform .5s var(--spring);touch-action:none;padding-bottom:env(safe-area-inset-bottom)}
.sheet::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px;background:linear-gradient(#e0a526 0 50%,#c8541c 50%)}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(26,20,17,.3);margin:10px auto 6px;flex:none}
.sbody{overflow:auto;padding:4px 22px 26px;overscroll-behavior:contain;touch-action:pan-y}
.sheet h3{font:italic 700 30px/1.1 var(--serif);margin:4px 0 12px}
.sheet h3 small{font:700 16px/1 var(--song);font-style:normal;margin-left:8px}
.prev{display:flex;gap:16px;align-items:center}
.prev svg{width:112px;height:112px;flex:none}
.prev p{font-size:13px;color:rgba(26,20,17,.64)}
.fld{display:block;margin-top:14px}
.fld span{display:block;font-size:13px;font-weight:600;color:rgba(26,20,17,.64)}
.fld input{width:100%;height:44px;border:0;border-bottom:2px solid var(--black);background:transparent;font-size:18px;font-family:var(--song);font-weight:700;padding:0;border-radius:0;outline:none}
.fld input:focus{border-bottom-color:var(--orange)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opts button{height:44px;padding:0 14px;font-weight:600;background:#e7d2ad;transition:background-color .15s}
.opts button[aria-pressed=true]{background:var(--black);color:var(--mustard)}
.inks{display:flex;gap:10px;margin-top:8px}
.inks button{width:56px;height:56px;padding:0;transition:transform .2s var(--spring)}
.inks button svg{width:100%;height:100%}
.inks button[aria-pressed=true]{transform:translateY(-6px);outline:3px solid var(--black);outline-offset:2px}
.save{margin-top:20px;width:100%;height:54px;background:var(--black);color:var(--mustard);font-weight:700;font-size:17px;transition:transform .15s}
.save:active{transform:scale(.98)}
.err{color:#9e3d14;font-size:13px;min-height:18px;margin-top:6px}

.toast{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-160px);transition:transform .45s var(--spring);
  display:flex;align-items:center;gap:12px;height:48px;padding:0 6px 0 16px;background:var(--black);color:var(--paper);font-size:14px;font-weight:600;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.toast button{height:40px;padding:0 12px;color:var(--mustard)}

@media (max-height:740px){
  .info{height:132px} .info .meta{display:none}
  .crate{height:calc(100% - 56px - 132px)}
  .deck{margin:18px 40px 0}
}
@media (prefers-reduced-motion:reduce){
  .sl,.view,.sheet,.toast,.dividers button,.tape,.rw .fr{transition-duration:.01s}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><div class="bstripes"></div><div class="wall" id="wall"></div></div>
  <div class="device">
    <div class="screen" id="screen">
      <div class="stripes"></div>
      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="g">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3.4" height="4"/><rect x="4.8" y="5.5" width="3.4" height="6.5"/><rect x="9.6" y="3" width="3.4" height="9"/><rect x="14.4" y="0" width="3.4" height="12"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 12 0 3.6C2.2 1.4 5 .2 8 .2s5.8 1.2 8 3.4z"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><path d="M0 0h23v12H0zm2 2v8h19V2z"/><rect x="3.5" y="3.5" width="13" height="5"/><rect x="24" y="4" width="2" height="4"/></svg>
        </span>
      </div>
      <div class="head">
        <div class="mark"><b>唱片箱</b><i>Crate</i></div>
        <button class="iconbtn" id="addBtn" aria-label="新增唱片"><svg width="30" height="30" viewBox="0 0 30 30"><path class="ic-b" d="M14 5h5v8h8v5h-8v8h-5v-8H6v-5h8z"/><path class="ic-a" d="M12 3h5v8h8v5h-8v8h-5v-8H4v-5h8z"/></svg></button>
      </div>

      <div class="views">
        <section class="view" id="v-dig" aria-label="翻箱">
          <div class="dividers" id="dividers" role="group" aria-label="類型隔板"></div>
          <div class="crate" id="crate" tabindex="0" aria-label="唱片箱，上下撥動翻唱片，點一下抽出">
            <div class="stack" id="stack"></div>
            <div class="box"><svg viewBox="0 0 390 180" preserveAspectRatio="none" aria-hidden="true">
              <path d="M0 22 L390 22 L390 180 L0 180Z" fill="#7a4522"/>
              <path d="M0 26h390v12H0z" fill="#8c5129"/>
              <path d="M0 38h390v4H0z" fill="#4a2410"/>
              <g fill="none" stroke="#5a2f16" stroke-width="2" stroke-linecap="round" opacity=".7">
                <path d="M16 62c60-6 120 4 190-2s120 6 170 0"/><path d="M8 96c80 8 140-6 210 0s110 4 164-4"/><path d="M20 132c70-8 150 6 230 0s90-4 130 2"/><path d="M40 164c90 4 170-6 250 0"/>
              </g>
              <path d="M0 102h390v6H0z" fill="#4a2410" opacity=".6"/>
              <path d="M150 56h90c6 0 10 4 10 10v10c0 6-4 10-10 10h-90c-6 0-10-4-10-10V66c0-6 4-10 10-10z" fill="#3a1d0c"/>
              <text x="195" y="77" text-anchor="middle" font-family="Baskerville,serif" font-style="italic" font-weight="700" font-size="17" fill="#e0a526">No.7</text>
            </svg></div>
            <div class="empty" id="empty" hidden><b>這格是空的</b>換個隔板，或按右上角新增一張。</div>
          </div>
                    <div class="info" id="info">
            <div class="t" id="iT"></div>
            <div class="a" id="iA"></div>
            <div class="meta" id="iM"></div>

  h += '<label class="fld"><span>專輯名稱</span><input id="fT" maxlength="30" placeholder="例如：童年" autocomplete="off"></label>';
  h += '<label class="fld"><span>歌手</span><input id="fA" maxlength="30" placeholder="例如：張艾嘉" autocomplete="off"></label>';
  h += '<div class="two"><label class="fld"><span>年份</span><input id="fY" inputmode="numeric" maxlength="4" value="1978"></label><label class="fld"><span>價格 NT$</span><input id="fP" inputmode="numeric" maxlength="6" value="1200"></label></div>';
  h += '<div class="fld"><span>類型</span><div class="opts" id="oG">'+GENRES.slice(1).map(function(g){ return '<button data-g="'+g[0]+'" aria-pressed="'+(draft.g===g[0])+'">'+g[1]+'</button>'; }).join('')+'</div></div>';
  h += '<div class="fld"><span>狀態</span><div class="opts" id="oO"><button data-o="1" aria-pressed="true">已收藏</button><button data-o="0" aria-pressed="false">想要</button></div></div>';
  h += '<div class="fld"><span>印版</span><div class="opts" id="oS">'+STYLES.map(function(s,i){ return '<button data-s="'+s+'" aria-pressed="'+(draft.st===s)+'">'+['放射','弧線','網點','斜紋','圓盤','大字','波浪'][i]+'</button>'; }).join('')+'</div></div>';
  h += '<div class="fld"><span>配色</span><div class="inks" id="oI">'+INKS.map(function(k,i){ return '<button data-i="'+i+'" aria-label="配色 '+(i+1)+'" aria-pressed="'+(draft.ink===i)+'"><svg viewBox="0 0 56 56"><rect width="56" height="56" fill="'+k[0]+'"/><rect x="0" y="20" width="56" height="12" fill="'+k[1]+'"/><circle cx="28" cy="40" r="9" fill="'+k[2]+'"/></svg></button>'; }).join('')+'</div></div>';
  h += '<div class="err" id="fErr"></div><button class="save" id="fSave">放進唱片箱</button>';
  lastFocus = document.activeElement;
  sbody.innerHTML = h; sbody.scrollTop = 0; pv();
  sheet.style.transform = ''; sheet.classList.add('on'); scrim.classList.add('on'); haptic(6);
}
function pv(){ var d = Object.assign({}, draft); if (!d.t) d.t = '新唱片'; $('pv').innerHTML = cover(d, true).replace('<svg ', '<svg width="112" height="112" '); }
function closeSheet(){ if (!sheet.classList.contains('on')) return; sheet.classList.remove('on','drag'); sheet.style.transform = ''; scrim.classList.remove('on'); scrim.style.opacity = ''; if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); }
$('addBtn').addEventListener('click', openAdd);
scrim.addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });
sbody.addEventListener('input', function(e){
  if (e.target.id === 'fT'){ draft.t = e.target.value.trim(); pv(); }
  if (e.target.id === 'fA') draft.a = e.target.value.trim();
});
sbody.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  var grp = b.parentNode;
  if (grp.id === 'oG') draft.g = b.dataset.g;
  if (grp.id === 'oO') draft.own = b.dataset.o === '1';
  if (grp.id === 'oS') draft.st = b.dataset.s;
  if (grp.id === 'oI') draft.ink = +b.dataset.i;
  if (grp.id && grp.id[0] === 'o'){ [].forEach.call(grp.children, function(x){ x.setAttribute('aria-pressed', x === b); }); pv(); haptic(4); return; }
  if (b.id === 'fSave'){
    var y = parseInt($('fY').value, 10), p = parseInt($('fP').value, 10);
    draft.t = $('fT').value.trim(); draft.a = $('fA').value.trim();
    if (!draft.t){ $('fErr').textContent = '唱片要有名字。'; $('fT').focus(); haptic([20,40,20]); return; }
    if (!draft.a) draft.a = '佚名';
    draft.y = y > 1900 && y < 2100 ? y : 1978; draft.p = p > 0 ? p : 0;
    if (!draft.own) draft.src = '想要';
    recs.unshift(draft); persist();
    genre = 'all'; save('genre', genre); cur = 0; save('cur', 0);
    refreshAll(); closeSheet(); setView('dig'); haptic([8,30,8]);
    toast('《'+(draft.t.length > 8 ? draft.t.slice(0,8)+'…' : draft.t)+'》放進箱子最前面');
  }
});
(function(){
  var sy = 0, dy = 0, t0 = 0, on = false;
  sheet.addEventListener('pointerdown', function(e){
    if (e.target.closest('button,input,label')) return;
    if (sbody.contains(e.target) && sbody.scrollTop > 0) return;
    on = true; sy = e.clientY; dy = 0; t0 = e.timeStamp; sheet.classList.add('drag');
  });
  sheet.addEventListener('pointermove', function(e){
    if (!on) return; dy = e.clientY - sy;
    if (Math.abs(dy) > 4 && !sheet.hasPointerCapture(e.pointerId)) try{ sheet.setPointerCapture(e.pointerId); }catch(er){}
    sheet.style.transform = 'translateY('+(dy > 0 ? dy : dy/6).toFixed(1)+'px)';
    scrim.style.opacity = Math.max(0, 1 - dy/sheet.offsetHeight).toFixed(2);
  });
  function end(e){ if (!on) return; on = false; sheet.classList.remove('drag'); scrim.style.opacity = ''; var v = dy/Math.max(1, e.timeStamp - t0); if (dy > sheet.offsetHeight*.35 || v > .6) closeSheet(); else sheet.style.transform = ''; }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();

/* ---------- clock, backdrop, boot ---------- */
function tick(){ var n = new Date(); $('clock').textContent = n.getHours()+':'+String(n.getMinutes()).padStart(2,'0'); }
tick(); setInterval(tick, 20000);
document.addEventListener('visibilitychange', function(){ if (document.hidden){ cancelAnimationFrame(raf); } else if (playing || spinDown){ lastT = performance.now(); loop(); } });
(function(){
  var w = "", list = SEED.concat(SEED, SEED);
  for (var i=0;i<list.length;i++) w += cover(list[i], true);
  $('wall').innerHTML = w;
})();
buildDeck();
renderDividers(); buildStack(); layout();
var li = load('loaded', null), lr = recs.filter(function(r){ return r.id === li; })[0];
if (lr) loadRecord(lr); else renderDeckInfo();
})();
</script>
</body>
</html>
