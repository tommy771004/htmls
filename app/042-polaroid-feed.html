<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2c86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="拍立得">
<title>拍立得 · 照片社群</title>
<meta name="description" content="朋友的拍立得散在一張群青色桌面上：雙擊貼愛心、看限時動態、在便條上留言，自己拍一張看它慢慢顯影。收錄於 100 Creative HTML Works（App 042・拍立得散在群青桌面）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/042-polaroid-feed.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b2c86'/%3E%3Cg transform='rotate(-8 32 32)'%3E%3Crect x='14' y='10' width='36' height='44' fill='%23faf7ef'/%3E%3Crect x='18' y='14' width='28' height='28' fill='%23e08a4a'/%3E%3Ccircle cx='32' cy='30' r='6' fill='%23fbe3a8'/%3E%3C/g%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
:root{
  --desk:#1b2c86;--desk-2:#16246f;--desk-3:#0f1a55;--paper:#faf7ef;--paper-2:#efe9dc;--ink:#26221c;--ink-2:#6b645a;
  --heart:#e2412f;--tape:#d9b25a;--tape-2:#c9a47d;--chalk:#eef0fb;--chalk-2:#b9c0e8;
  --hand:"Marker Felt","HanziPen TC","Hannotate TC","Wawati TC","PingFang TC",cursive;
  --ui:system-ui,-apple-system,"PingFang TC","Heiti TC",sans-serif;
  --spring:cubic-bezier(.3,1.35,.5,1);--out:cubic-bezier(.2,.8,.2,1);
}
body{font-family:var(--ui);background:var(--desk);color:var(--chalk);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--tape);outline-offset:3px;border-radius:4px}
input{font:inherit;color:inherit}
svg{display:block}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--desk);isolation:isolate}
.felt{position:absolute;inset:0;z-index:0;pointer-events:none}
.felt svg{width:100%;height:100%}
@media (min-width:521px){
  body{background:#0f1a55}
  .stage{display:flex;align-items:center;justify-content:center;gap:70px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:56px;padding:10px;z-index:1;background:#f2eee4;
    box-shadow:inset 0 0 0 1px #fffdf6,inset 0 -3px 0 1px #d8d1c2,0 3px 3px rgba(5,10,40,.35),0 20px 26px -16px rgba(5,10,40,.65)}
  .screen{inset:10px;border-radius:46px}
  .caption{display:block;position:relative;z-index:1;max-width:250px;color:var(--chalk)}
  .caption b{display:block;font:400 44px/1.05 var(--hand)}
  .caption span{display:block;margin-top:14px;font-size:15px;line-height:1.7;color:var(--chalk-2)}
}
@media (min-width:521px) and (max-width:860px){.caption{display:none}}

/* status */
.status{position:absolute;top:0;left:0;right:0;z-index:97;transition:color .3s;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 30px 0 34px;display:flex;align-items:center;justify-content:space-between;font:600 16px/1 var(--ui);color:var(--chalk);pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
.status svg{fill:currentColor}
.screen.lightbar .status{color:var(--ink)}
@media (display-mode:standalone){.status{display:none}}
.home{position:absolute;left:50%;bottom:calc(7px + env(safe-area-inset-bottom)*.3);width:132px;height:5px;margin-left:-66px;border-radius:3px;background:var(--ink);opacity:.75;z-index:66;pointer-events:none}

/* header */
.head{position:absolute;left:0;right:0;top:calc(48px + env(safe-area-inset-top));z-index:30;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 20px;background:linear-gradient(var(--desk) 70%,rgba(27,44,134,0))}
.head h1{font:400 30px/1 var(--hand);color:var(--paper);transform:rotate(-2deg);letter-spacing:.02em}
.head h1 small{font-size:15px;color:var(--chalk-2);margin-left:8px}
.hb{width:44px;height:44px;display:grid;place-items:center;color:var(--chalk)}
.hb svg{width:28px;height:28px}
.hb:active{transform:scale(.9) rotate(-4deg)}

/* pages */
.pages{position:absolute;inset:0}
.page{position:absolute;left:0;right:0;top:calc(100px + env(safe-area-inset-top));bottom:0;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(120px + env(safe-area-inset-bottom));transition:transform .45s var(--out);scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.page::-webkit-scrollbar{display:none}
#pMe{transform:translateX(100%)}
#pFeed{transition:transform .45s var(--out),opacity .35s}
.screen.me #pFeed{transform:translateX(-30%);opacity:0;pointer-events:none}
.screen.me #pMe{transform:none}
.screen:not(.me) #pMe{visibility:hidden;transition:transform .45s var(--out),visibility 0s .45s}

/* stories */
.stories{display:flex;gap:10px;overflow-x:auto;padding:10px 18px 18px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.sto{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:6px}
.sto .fr{position:relative;width:60px;height:70px;background:var(--paper);padding:4px 4px 14px;box-shadow:0 2px 2px rgba(5,10,40,.35);transition:transform .25s var(--spring)}
.sto:nth-child(odd) .fr{transform:rotate(-4deg)}
.sto:nth-child(even) .fr{transform:rotate(3deg)}
.sto:active .fr{transform:rotate(0) scale(.94)}
.sto .fr svg{width:52px;height:52px}
.sto .tp{position:absolute;left:50%;top:-6px;width:34px;height:12px;margin-left:-17px;background:var(--heart);opacity:.88;transform:rotate(-6deg);clip-path:polygon(0 10%,6% 0,12% 12%,18% 0,82% 0,88% 12%,94% 0,100% 10%,100% 90%,94% 100%,88% 88%,82% 100%,18% 100%,12% 88%,6% 100%,0 90%)}
.sto.seen .tp{background:var(--tape-2);opacity:.75}
.sto span{font:400 13px/1.1 var(--hand);color:var(--chalk);max-width:66px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sto.add .fr{display:grid;place-items:center;background:transparent;box-shadow:none;border:2px dashed var(--chalk-2);padding:0}
.sto.add .fr svg{width:28px;height:28px;color:var(--chalk)}

/* feed polaroids */
.post{position:relative;padding:4px 0 26px}
.by{display:flex;align-items:center;gap:10px;padding:0 26px 8px}
.by svg{width:34px;height:34px;flex:none}
.by b{display:block;font-size:15px;font-weight:600;color:var(--chalk)}
.by span{display:block;font-size:13px;color:var(--chalk-2);margin-top:1px}
.pol{position:relative;display:block;-webkit-user-select:none;user-select:none;width:calc(100% - 52px);margin:0 auto;background:var(--paper);padding:14px 14px 0;color:var(--ink);
  box-shadow:0 1px 1px rgba(5,10,40,.4),0 10px 12px -8px rgba(5,10,40,.55);transform:rotate(var(--r,0deg)) translateX(var(--x,0px));transition:transform .35s var(--spring)}
.pol .ph{position:relative;aspect-ratio:1;overflow:hidden;background:#2a2620;touch-action:manipulation}
.pol .ph svg{width:100%;height:100%}
.pol .cap{min-height:74px;padding:12px 4px 14px;font:400 21px/1.25 var(--hand);color:#2b2a6a}
.pol .tape{position:absolute;left:50%;top:-12px;width:96px;height:26px;margin-left:-48px;background:var(--tape);opacity:.82;transform:rotate(var(--tr,-3deg));
  clip-path:polygon(0 8%,4% 0,8% 10%,12% 0,88% 0,92% 10%,96% 0,100% 8%,100% 92%,96% 100%,92% 90%,88% 100%,12% 100%,8% 90%,4% 100%,0 92%)}
.pol .stick{position:absolute;right:-10px;bottom:52px;width:58px;height:58px;transform:rotate(14deg) scale(.95);opacity:0;transition:transform 160ms var(--out),opacity 160ms var(--out);pointer-events:none}
.pol.liked .stick{transform:rotate(14deg) scale(1);opacity:1}
.burst{position:absolute;left:50%;top:50%;width:130px;height:130px;margin:-65px 0 0 -65px;pointer-events:none;opacity:0}
.burst.go{animation:burst .9s var(--out)}
@keyframes burst{0%{opacity:1;transform:scale(.2) rotate(-20deg)}30%{opacity:1;transform:scale(1.15) rotate(6deg)}55%{transform:scale(.95) rotate(0)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translate(120px,150px) scale(.35) rotate(18deg)}}
.acts{display:flex;align-items:center;gap:4px;padding:10px 20px 0}
.act{display:flex;align-items:center;gap:6px;height:44px;padding:0 8px;color:var(--chalk);font:400 17px/1 var(--hand)}
.act svg{width:28px;height:28px;transition:transform .3s var(--spring)}
.act:active svg{transform:scale(.8) rotate(-8deg)}
.act.on svg .fill{fill:var(--heart)}
.act.on svg{color:var(--heart)}
.act .n{min-width:18px}
.act.time{margin-left:auto;font:13px/1 var(--ui);color:var(--chalk-2);pointer-events:none}
.preview{padding:0 28px;font-size:14px;line-height:1.5;color:var(--chalk-2)}
.preview b{color:var(--chalk);font-weight:600;margin-right:6px}
.preview button{display:block;min-height:32px;color:var(--chalk-2);font-size:14px;text-align:left}

/* me page */
.meh{display:flex;align-items:center;gap:16px;padding:6px 24px 10px}
.meh svg{width:76px;height:76px}
.meh h2{font:400 28px/1.1 var(--hand);color:var(--paper)}
.meh p{font-size:14px;color:var(--chalk-2);margin-top:4px}
.stats{display:flex;justify-content:space-around;padding:12px 20px 16px;text-align:center}
.stats b{display:block;font:400 26px/1 var(--hand);color:var(--paper)}
.stats span{font-size:13px;color:var(--chalk-2)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 12px;padding:8px 20px}
.mini{position:relative;background:var(--paper);padding:5px 5px 18px;box-shadow:0 2px 2px rgba(5,10,40,.4);transform:rotate(var(--r,0deg));transition:transform .3s var(--spring)}
.mini:active{transform:rotate(0) scale(.95)}
.mini svg{width:100%;height:auto;aspect-ratio:1}
.mini i{position:absolute;left:50%;top:-5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--heart)}
.mini i::after{content:"";position:absolute;left:3px;top:2px;width:4px;height:3px;border-radius:50%;background:rgba(255,255,255,.55)}
.empty{grid-column:1/-1;padding:40px 10px;text-align:center;font:400 20px/1.5 var(--hand);color:var(--chalk-2)}

/* bottom camera strip (the nav) */
.cam{position:absolute;left:0;right:0;bottom:0;z-index:40;height:calc(86px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:1fr 110px 1fr;align-items:center}
.cam .body{position:absolute;inset:0;z-index:-1}
.cam .body svg{width:100%;height:100%}
.tab{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#8b8577;font:400 15px/1 var(--hand)}
.tab svg{width:30px;height:30px}
.tab[aria-selected=true]{color:var(--ink)}
.tab:active svg{transform:scale(.88)}
.shutter{justify-self:center;width:74px;height:74px;margin-top:-30px;border-radius:50%;background:#ece6d8;display:grid;place-items:center;box-shadow:inset 0 -3px 0 #d3cbb8,0 2px 2px rgba(5,10,40,.25)}
.shutter i{width:54px;height:54px;border-radius:50%;background:var(--heart);box-shadow:inset 0 -4px 0 #b52d20,inset 0 3px 0 rgba(255,255,255,.28);transition:transform .1s,box-shadow .1s}
.shutter:active i{transform:scale(.92);box-shadow:inset 0 -1px 0 #b52d20,inset 0 2px 0 rgba(255,255,255,.2)}

/* sheet: a ruled note card */
.scrim{position:absolute;inset:0;z-index:80;background:rgba(8,14,48,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:8px;right:8px;bottom:0;z-index:81;max-height:78%;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border-radius:6px 6px 0 0;transform:translateY(104%);transition:transform .45s var(--spring);touch-action:none;
  background-image:linear-gradient(transparent 31px,#c9d3ee 31px,#c9d3ee 32px);background-size:100% 32px;background-position:0 58px}
.sheet::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:1.5px;background:rgba(226,65,47,.45)}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{flex:none;display:block;height:26px;position:relative}
.grab::before{content:"";position:absolute;left:50%;top:10px;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:#cfc7b6}
.sheet h3{flex:none;padding:0 20px 6px 50px;font:400 22px/32px var(--hand);color:#2b2a6a}
.clist{flex:1;overflow-y:auto;padding:0 18px 8px 50px;overscroll-behavior:contain}
.cm{display:flex;gap:10px;padding:4px 0;min-height:64px}
.cm svg{width:30px;height:30px;flex:none;margin-top:2px}
.cm p{font-size:15px;line-height:1.55}
.cm p b{font-weight:700;margin-right:6px}
.cm small{display:block;font-size:12px;color:var(--ink-2)}
.cm.mine p{color:#2b2a6a}
.cform{flex:none;display:flex;gap:8px;align-items:center;padding:10px 12px calc(12px + env(safe-area-inset-bottom)) 14px;background:var(--paper-2)}
.cform input{flex:1;height:46px;border:0;border-radius:23px;padding:0 16px;background:var(--paper);font-size:16px;outline:none;box-shadow:inset 0 0 0 1.5px #d9d0bd}
.cform input:focus{box-shadow:inset 0 0 0 2px #2b2a6a}
.send{width:46px;height:46px;display:grid;place-items:center;color:#2b2a6a}
.send svg{width:28px;height:28px}
.send:disabled{opacity:.3}
.send:active svg{transform:translate(3px,-3px)}
.big{padding:0 20px 8px 50px}
.big .mini{width:220px;margin:4px auto 10px;padding:8px 8px 30px;transform:rotate(-2deg)}
.big p{font:400 20px/1.4 var(--hand);color:#2b2a6a;text-align:center}
.dangerrow{flex:none;display:flex;justify-content:center;padding:10px 0 calc(18px + env(safe-area-inset-bottom))}
.dangerrow button{height:46px;padding:0 22px;font:400 19px/1 var(--hand);color:var(--heart)}
.dangerrow button:active{transform:rotate(-3deg)}

/* story viewer */
.story{position:absolute;inset:0;z-index:90;background:#0b0a08;visibility:hidden;transform:translateY(100%);transition:transform .4s var(--out),visibility 0s .4s;touch-action:none}
.story.on{visibility:visible;transform:none;transition:transform .4s var(--out)}
.story.drag{transition:none}
.story .img{position:absolute;inset:0}
.story .img svg{width:100%;height:100%}
.story .shade{position:absolute;left:0;right:0;top:0;height:170px;background:linear-gradient(rgba(0,0,0,.45),transparent);pointer-events:none}
.bars{position:absolute;left:12px;right:12px;top:calc(54px + env(safe-area-inset-top));display:flex;gap:4px;z-index:2}
.bars span{flex:1;height:3px;border-radius:1.5px;background:rgba(255,255,255,.35);overflow:hidden}
.bars i{display:block;height:100%;width:0;background:#fff}
.story .who{position:absolute;left:14px;right:8px;top:calc(66px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;z-index:2;color:#fff}
.story .who svg{width:34px;height:34px}
.story .who b{font-size:15px;font-weight:600}
.story .who span{font-size:13px;opacity:.8;margin-left:6px}
.story .x{margin-left:auto;width:44px;height:44px;display:grid;place-items:center;color:#fff}
.story .x svg{width:26px;height:26px}
.story .note{position:absolute;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%) rotate(-3deg);max-width:80%;padding:10px 16px 12px;background:var(--paper);color:#2b2a6a;font:400 22px/1.25 var(--hand);text-align:center;box-shadow:0 2px 2px rgba(0,0,0,.35);z-index:2}
.story .note::before{content:"";position:absolute;left:50%;top:-10px;width:60px;height:18px;margin-left:-30px;background:var(--tape);opacity:.85;transform:rotate(4deg)}
.story .react{position:absolute;right:16px;bottom:calc(36px + env(safe-area-inset-bottom));z-index:2;width:56px;height:56px;display:grid;place-items:center;color:#fff}
.story .react svg{width:34px;height:34px}
.story .react.on svg{color:var(--heart)}
.story .react.on svg .fill{fill:var(--heart)}
.story .paused{position:absolute;left:18px;bottom:calc(52px + env(safe-area-inset-bottom));z-index:2;font:400 16px/1 var(--hand);color:#fff;opacity:0;transition:opacity .2s}
.story.hold .paused{opacity:.85}

/* camera */
.camview{position:absolute;inset:0;z-index:92;background:#e9e3d5;color:var(--ink);visibility:hidden;transform:translateY(100%);transition:transform .45s var(--out),visibility 0s .45s;display:flex;flex-direction:column;padding-top:calc(48px + env(safe-area-inset-top))}
.camview.on{visibility:visible;transform:none;transition:transform .45s var(--out)}
.camtop{display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 14px;height:52px}
.camtop h2{font:400 24px/1 var(--hand)}
.camtop .x{width:44px;height:44px;display:grid;place-items:center}
.camtop .x svg{width:26px;height:26px}
.finder{position:relative;margin:6px auto 0;width:min(300px,78vw);aspect-ratio:1;border-radius:10px;overflow:hidden;background:#111;box-shadow:inset 0 0 0 6px #2a2721,inset 0 0 0 7px #4b463c;touch-action:pan-y}
.finder svg{width:100%;height:100%}
.finder .rim{position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 0 6px #2a2721;pointer-events:none}
.finder .corner{position:absolute;inset:18px;pointer-events:none;background:
  linear-gradient(#fff,#fff) 0 0/16px 2px no-repeat,linear-gradient(#fff,#fff) 0 0/2px 16px no-repeat,
  linear-gradient(#fff,#fff) 100% 0/16px 2px no-repeat,linear-gradient(#fff,#fff) 100% 0/2px 16px no-repeat,
  linear-gradient(#fff,#fff) 0 100%/16px 2px no-repeat,linear-gradient(#fff,#fff) 0 100%/2px 16px no-repeat,
  linear-gradient(#fff,#fff) 100% 100%/16px 2px no-repeat,linear-gradient(#fff,#fff) 100% 100%/2px 16px no-repeat;opacity:.8}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:95}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.sceneName{text-align:center;font:400 18px/1 var(--hand);margin-top:12px;color:var(--ink-2)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots i{width:6px;height:6px;border-radius:50%;background:#c4bca9}
.dots i.on{background:var(--ink);width:16px;border-radius:3px}
.expo{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.expo span{font:400 15px/1 var(--hand);color:var(--ink-2)}
.expo button{width:44px;height:44px;font:700 20px/1 var(--ui);color:var(--ink);display:grid;place-items:center}
.expo button:active{transform:scale(.85)}
.expo b{width:44px;text-align:center;font:400 20px/1 var(--hand)}
.modes{display:flex;justify-content:center;gap:24px;margin-top:auto;padding-bottom:6px}
.modes button{min-height:40px;font:400 18px/1 var(--hand);color:#9b9483}
.modes button[aria-pressed=true]{color:var(--heart)}
.camshut{align-self:center;width:84px;height:84px;margin:4px 0 calc(28px + env(safe-area-inset-bottom));border-radius:50%;background:#d8d0bf;display:grid;place-items:center;box-shadow:inset 0 -3px 0 #c2b9a5}
.camshut i{width:64px;height:64px;border-radius:50%;background:var(--heart);box-shadow:inset 0 -5px 0 #b52d20,inset 0 3px 0 rgba(255,255,255,.3);transition:transform .08s}
.camshut:active i{transform:scale(.9)}

/* developing */
.dev{position:absolute;inset:0;z-index:94;background:var(--desk);visibility:hidden;display:flex;flex-direction:column;align-items:center;padding-top:calc(70px + env(safe-area-inset-top));overflow-y:auto}
.dev.on{visibility:visible}
.dev .felt{position:fixed}
.dev .pol{width:270px;transform:rotate(-2deg);z-index:1}
.dev.on .pol{animation:eject .7s var(--out)}
@keyframes eject{from{transform:translateY(-60px) rotate(-2deg);clip-path:inset(0 0 100% 0)}to{transform:rotate(-2deg);clip-path:inset(0 0 0 0)}}
.dev .ph svg{filter:brightness(.18) sepia(1) saturate(.6) hue-rotate(40deg);transition:filter 4.2s ease-in}
.dev.developed .ph svg{filter:none}
.dev .cap input{width:100%;border:0;background:transparent;font:400 21px/1.3 var(--hand);color:#2b2a6a;outline:none}

  openSheet(`<h3 id="shT">給 ${esc(p.u)} 的便條</h3><div class="clist" id="clist">${cmList(p)}</div>
    <form class="cform" id="cform"><input id="cin" maxlength="60" placeholder="寫一句話…" autocomplete="off" aria-label="留言"><button class="send" id="csend" type="submit" aria-label="送出" disabled>${IC.send}</button></form>`);
  const l = $('clist'); l.scrollTop = l.scrollHeight;
}
sheet.addEventListener('input', e => { if (e.target.id === 'cin') $('csend').disabled = !e.target.value.trim(); });
sheet.addEventListener('submit', e => {
  e.preventDefault(); const v = $('cin').value.trim(); if (!v || !sheetPost) return;
  (extraCm[sheetPost] = extraCm[sheetPost] || []).push({u: ME, t: v, at: Date.now()}); persist();
  $('cin').value = ''; $('csend').disabled = true; haptic([6, 30, 6]); pluck();
  $('clist').innerHTML = cmList(findPost(sheetPost)); $('clist').scrollTop = $('clist').scrollHeight;
  const art = $('feed').querySelector(`.post[data-id="${sheetPost}"]`);
  if (art){ const i = allPosts().findIndex(x => x.id === sheetPost); art.outerHTML = postHTML(findPost(sheetPost), i); }
  renderMe();
});
sheet.addEventListener('click', e => {
  const d = e.target.closest('[data-del]'); if (!d) return;
  const i = mine.findIndex(p => p.id === d.dataset.del); if (i < 0) return;
  const gone = mine.splice(i, 1)[0]; persist(); haptic([10, 30, 10]); closeSheet(); renderFeed(); renderMe();
  toast(`撕下了「${gone.cap}」`);
});

/* ---------- me board ---------- */
$('board').addEventListener('click', e => {
  const m = e.target.closest('[data-mine]'); if (!m) return;
  const p = mine.find(x => x.id === m.dataset.mine); if (!p) return; haptic(6);
  openSheet(`<h3 id="shT">${esc(p.p)}</h3><div class="big"><div class="mini">${photo(p.sc, p.ex)}</div><p>${esc(p.cap)}</p></div>
    <div class="dangerrow"><button data-del="${p.id}">從桌上撕下來</button></div>`);
});

/* ---------- nav ---------- */
function go(t){
  screen.classList.toggle('me', t === 'me');
  $('tFeed').setAttribute('aria-selected', t === 'feed'); $('tMe').setAttribute('aria-selected', t === 'me');
  $('headT').firstChild.textContent = t === 'me' ? '我的桌角' : '拍立得';
  $('headS').textContent = t === 'me' ? `${mine.length} 張` : `桌上 ${allPosts().length} 張`;
}
$('tFeed').addEventListener('click', () => { haptic(6); if (!screen.classList.contains('me')) $('pFeed').scrollTo({top: 0, behavior: reduce ? 'auto' : 'smooth'}); go('feed'); });
$('tMe').addEventListener('click', () => { haptic(6); go('me'); });
$('toTop').addEventListener('click', () => { haptic(6); const p = screen.classList.contains('me') ? $('pMe') : $('pFeed'); p.scrollTo({top: 0, behavior: reduce ? 'auto' : 'smooth'}); });

/* ---------- stories ---------- */
let st = null, stRaf = 0;
const DUR = 5000;
function storyList(){ return (myStory.length ? [{u: ME, f: myStory.map(x => ({sc: x.sc, n: x.n, ex: x.ex}))}] : []).concat(STORIES); }
function openStory(u){
  const L = storyList(), ui = L.findIndex(s => s.u === u); if (ui < 0) return;
  st = {ui, fi: 0, t: 0, last: 0, hold: false}; showFrame();
  $('story').classList.add('on'); haptic(8);
  cancelAnimationFrame(stRaf); stRaf = requestAnimationFrame(stLoop);
}
function showFrame(){
  const L = storyList(), s = L[st.ui], f = s.f[st.fi];
  $('stImg').innerHTML = photo(f.sc, f.ex);
  $('stAv').innerHTML = avatar(s.u); $('stName').textContent = s.u === ME ? '你' : s.u;
  $('stAgo').textContent = `${(st.ui * 3 + st.fi * 2 + 1)} 小時`;
  $('stNote').textContent = f.n;
  $('stBars').innerHTML = s.f.map((_, i) => `<span><i style="width:${i < st.fi ? 100 : 0}%"></i></span>`).join('');
  $('stReact').classList.remove('on');
  st.t = 0;
  if (!seen.includes(s.u)){ seen.push(s.u); persist(); }
}
function stLoop(ts){
  if (!st) return;
  stRaf = requestAnimationFrame(stLoop);
  const dt = st.last ? Math.min(64, ts - st.last) : 0; st.last = ts;
  if (document.hidden || st.hold) return;
  st.t += dt;
  const bar = $('stBars').children[st.fi]; if (bar) bar.firstChild.style.width = Math.min(100, st.t / DUR * 100) + '%';
  if (st.t >= DUR) stepStory(1);
}
function stepStory(d){
  if (!st) return;
  const L = storyList(), s = L[st.ui];
  st.fi += d;
  if (st.fi >= s.f.length){ st.ui++; st.fi = 0; if (st.ui >= L.length){ closeStory(); return; } }
  else if (st.fi < 0){ st.ui--; if (st.ui < 0){ st.ui = 0; st.fi = 0; } else st.fi = L[st.ui].f.length - 1; }
  haptic(4); showFrame();
}
function closeStory(){
  st = null; cancelAnimationFrame(stRaf);
  const s = $('story'); s.classList.remove('on', 'hold', 'drag'); s.style.transform = '';
  renderStories();
}
$('stories').addEventListener('click', e => {
  const b = e.target.closest('.sto'); if (!b) return;
  if (b.id === 'addStory'){ haptic(8); openCam('story'); return; }
  openStory(b.dataset.s);
});
(function(){
  const el = $('story'); let x0 = 0, y0 = 0, dy = 0, t0 = 0, down = false, holdT = 0;
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    down = true; x0 = e.clientX; y0 = e.clientY; dy = 0; t0 = e.timeStamp;
    holdT = setTimeout(() => { if (st && down){ st.hold = true; el.classList.add('hold'); } }, 220);
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
  });
  el.addEventListener('pointermove', e => {
    if (!down) return; dy = Math.max(0, e.clientY - y0);
    if (dy > 8){ el.classList.add('drag'); el.style.transform = `translateY(${dy}px) scale(${1 - dy / 3000})`; if (st) st.hold = true; }
  });
  const up = e => {
    if (!down) return; down = false; clearTimeout(holdT);
    const wasHold = st && st.hold && e.timeStamp - t0 > 220;
    el.classList.remove('drag', 'hold'); if (st) st.hold = false;
    if (dy > 110){ haptic(6); closeStory(); return; }
    el.style.transform = '';
    if (dy > 8 || wasHold) return;
    const r = el.getBoundingClientRect();
    stepStory(e.clientX - r.left < r.width * .33 ? -1 : 1);
  };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
})();
$('stX').addEventListener('click', () => { haptic(6); closeStory(); });
$('stReact').addEventListener('click', () => { const b = $('stReact'); b.classList.toggle('on'); if (b.classList.contains('on')){ pluck(); haptic([6, 40, 12]); toast('送出一顆愛心'); } });

/* ---------- camera ---------- */
let cam = {sc: 0, ex: 0, mode: 'post'}, devShot = null, devPlace = '台北 大安';
const PLACES = ['台北 大安', '台北 大稻埕', '台中 審計新村', '台南 神農街', '花蓮 七星潭', '高雄 駁二'];
function renderFinder(){
  $('finderImg').innerHTML = photo(cam.sc, cam.ex);
  $('sceneName').textContent = SCENES[cam.sc].n;
  $('dots').innerHTML = SCENES.map((_, i) => `<i class="${i === cam.sc ? 'on' : ''}"></i>`).join('');
  $('exV').textContent = cam.ex > 0 ? '+' + cam.ex : cam.ex;
}
function openCam(mode){
  cam.mode = mode || 'post';
  document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === cam.mode));
  renderFinder(); $('camview').classList.add('on'); screen.classList.add('lightbar');
  setTimeout(() => $('camX').focus({preventScroll: true}), 60);
}
function closeCam(){ $('camview').classList.remove('on'); screen.classList.remove('lightbar'); }
$('shutter').addEventListener('click', () => { haptic(10); openCam('post'); });
$('camX').addEventListener('click', () => { haptic(6); closeCam(); });
$('exM').addEventListener('click', () => { cam.ex = Math.max(-2, cam.ex - 1); haptic(4); renderFinder(); });
$('exP').addEventListener('click', () => { cam.ex = Math.min(2, cam.ex + 1); haptic(4); renderFinder(); });
document.querySelector('.modes').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; cam.mode = b.dataset.m; haptic(4); document.querySelectorAll('.modes button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
(function(){
  const f = $('finder'); let x0 = 0, on = false;
  f.addEventListener('pointerdown', e => { on = true; x0 = e.clientX; });
  const up = e => { if (!on) return; on = false; const dx = e.clientX - x0; if (Math.abs(dx) > 40){ cam.sc = (cam.sc + (dx < 0 ? 1 : -1) + SCENES.length) % SCENES.length; haptic(5); renderFinder(); } else if (Math.abs(dx) < 6){ cam.sc = (cam.sc + 1) % SCENES.length; haptic(5); renderFinder(); } };
  f.addEventListener('pointerup', up); f.addEventListener('pointercancel', () => on = false);
})();
$('camShut').addEventListener('click', () => {
  audio(); shutterSound(); haptic([12, 60, 30, 30, 30]);
  const fl = $('flash'); fl.classList.remove('go'); fl.offsetWidth; fl.classList.add('go');
  devShot = {sc: cam.sc, ex: cam.ex, mode: cam.mode};
  setTimeout(() => { closeCam(); openDev(); }, reduce ? 0 : 260);
});
let devT = 0;
function openDev(){
  const d = $('dev');
  $('devPh').innerHTML = photo(devShot.sc, devShot.ex);
  $('devCap').value = ''; $('devPin').textContent = devShot.mode === 'story' ? '發成限動' : '貼到桌上';
  $('places').innerHTML = PLACES.map(p => `<button data-pl="${p}" aria-pressed="${p === devPlace}">${p}</button>`).join('');
  d.classList.remove('developed'); d.classList.add('on'); $('devHint').textContent = '正在顯影…輕輕甩一甩也沒用';
  d.offsetWidth;
  clearTimeout(devT);
  requestAnimationFrame(() => requestAnimationFrame(() => d.classList.add('developed')));
  devT = setTimeout(() => { $('devHint').textContent = '顯影好了'; haptic(6); }, reduce ? 0 : 4200);
}
function closeDev(){ $('dev').classList.remove('on', 'developed'); clearTimeout(devT); }
$('places').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; devPlace = b.dataset.pl; haptic(4); $('places').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
$('devRedo').addEventListener('click', () => { haptic(6); closeDev(); openCam(devShot ? devShot.mode : 'post'); });
$('devPin').addEventListener('click', () => {
  if (!devShot) return;
  const cap = $('devCap').value.trim() || SCENES[devShot.sc].n;
  if (devShot.mode === 'story'){
    myStory.push({sc: devShot.sc, ex: devShot.ex, n: cap}); seen = seen.filter(x => x !== ME); persist();
    closeDev(); renderStories(); go('feed'); $('pFeed').scrollTo({top: 0}); toast('限動發出去了'); haptic([6, 30, 6]);
  } else {
    const p = {id: 'm' + Date.now(), u: ME, p: devPlace, sc: devShot.sc, ex: devShot.ex, cap, likes: 0, at: Date.now(), cm: []};
    mine.unshift(p); persist(); closeDev(); go('feed'); renderFeed(); renderMe();
    $('pFeed').scrollTo({top: $('stories').offsetHeight, behavior: reduce ? 'auto' : 'smooth'});
    const art = $('feed').querySelector(`.post[data-id="${p.id}"] .pol`);
    if (art && !reduce) art.animate([{transform: 'translateY(-80px) rotate(-12deg) scale(1.08)'}, {transform: 'translateY(6px) rotate(calc(var(--r) + 1deg))', offset: .75}, {transform: 'rotate(var(--r)) translateX(var(--x))'}], {duration: 650, easing: 'cubic-bezier(.2,.8,.2,1)'});
    haptic([6, 50, 18]); toast('貼好了');
  }
});

/* ---------- toast ---------- */
let tT = 0;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), 2200); }

document.addEventListener('keydown', e => {
  if (st){ if (e.key === 'ArrowRight') stepStory(1); else if (e.key === 'ArrowLeft') stepStory(-1); }
  if (e.key !== 'Escape') return;
  if (sheet.classList.contains('on')) closeSheet();
  else if (st) closeStory();
  else if ($('dev').classList.contains('on')) closeDev();
  else if ($('camview').classList.contains('on')) closeCam();
});

/* ---------- desktop backdrop: the rest of the desk ---------- */
(function(){
  const pos = [[140, 120, -12, 0], [310, 640, 8, 3], [1200, 130, 10, 5], [1380, 560, -7, 6], [980, 760, 4, 7], [60, 520, 6, 1]];
  let g = `<filter id="bfib"><feTurbulence type="fractalNoise" baseFrequency=".5 .7" numOctaves="3" seed="3"/><feColorMatrix values="0 0 0 0 .75 0 0 0 0 .8 0 0 0 0 1 0 0 0 .2 0"/></filter><rect width="1600" height="1000" fill="#1b2c86"/><rect width="1600" height="1000" filter="url(#bfib)"/>`;
  pos.forEach(([x, y, r, s]) => { g += `<g transform="translate(${x} ${y}) rotate(${r})"><rect x="3" y="6" width="230" height="276" fill="#0c1648" opacity=".45"/><rect width="230" height="276" fill="#faf7ef"/><svg x="14" y="14" width="202" height="202" viewBox="0 0 100 100">${SCENES[s].d}<rect width="100" height="100" fill="url(#vig)"/></svg><rect x="80" y="-12" width="76" height="22" fill="#d9b25a" opacity=".8" transform="rotate(${-r / 2} 118 0)"/></g>`; });
  $('bigdesk').innerHTML = g;
})();

/* ---------- clock ---------- */
function tick(){ const d = new Date(); $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
tick(); setTimeout(function t(){ tick(); setTimeout(t, 60000 - Date.now() % 60000); }, 60000 - Date.now() % 60000);

renderStories(); renderFeed(); renderMe();
})();
</script>
</body>
</html>
