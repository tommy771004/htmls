<style>
:root{
  --bg:#000;--fg:#d6d6d0;--dim:#8a8a84;--faint:#4a4a46;
  --r:#ef5b52;--g:#71d15b;--y:#e8c547;--b:#5f95f2;--m:#d472d4;--c:#56cfd8;--W:#fff;
  --mono:Menlo,"SF Mono",Monaco,"PingFang TC","Heiti TC",monospace;
  --lh:18px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:13px/var(--lh) var(--mono);color:var(--fg);background:#000;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-variant-ligatures:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none;text-align:left;border-radius:0}
input{font:inherit;color:inherit}
:focus-visible{outline:1px dashed var(--c);outline-offset:-1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k0{color:#000}.kr{color:var(--r)}.kg{color:var(--g)}.ky{color:var(--y)}.kb{color:var(--b)}.km{color:var(--m)}.kc{color:var(--c)}.kW{color:var(--W);font-weight:700}.kd{color:var(--dim)}.kf{color:var(--faint)}
.mono-scheme .kr,.mono-scheme .kg,.mono-scheme .ky,.mono-scheme .kb,.mono-scheme .km,.mono-scheme .kc{color:var(--fg)}

/* ---------- stage ---------- */
.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:#000;display:flex;flex-direction:column}
@media (min-width:521px){
  .stage{display:flex;align-items:center;justify-content:center;gap:64px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;overflow:hidden;z-index:0}
  .blog{position:absolute;left:3vw;right:3vw;top:0;bottom:0;padding:8px 0;font:12px/19px var(--mono);white-space:pre;color:#3d3d3a;column-width:460px;column-gap:3vw;column-fill:auto;overflow:hidden}
  .blog span{opacity:.9}
  .blog .hot{color:#6c6c66}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:56px;padding:10px;background:#0b0b0a;z-index:1;
    box-shadow:inset 0 0 0 1px #2f2f2c,inset 0 0 0 3px #050505,0 1px 0 #3a3a36}
  .screen{inset:10px;border-radius:46px}
  .caption{display:block;position:relative;z-index:1;max-width:250px;background:#000;padding:14px 16px}
  .caption h1{font:700 26px/1.1 var(--mono);color:var(--g)}
  .caption h1 i{font-style:normal;color:var(--dim);font-weight:400}
  .caption p{margin-top:10px;font-size:13px;line-height:1.7;color:var(--dim)}
}
@media (min-width:521px) and (max-width:860px){.caption{display:none}}

/* ---------- status bar ---------- */
.sb{flex:none;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 26px 0 30px;display:flex;align-items:center;justify-content:space-between;color:var(--W);font-weight:700;font-size:14px}
.sb .gl{display:flex;gap:7px;align-items:center}
.sb svg{display:block;shape-rendering:crispEdges}
@media (display-mode:standalone){.sb{display:none}}

/* ---------- windows ---------- */
.wins{position:relative;flex:1;min-height:0}
.win{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:2px 8px 10px;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-y}
.win::-webkit-scrollbar{display:none}
.win[hidden]{display:none}
.win.paint{animation:paint .16s steps(8,end)}
@keyframes paint{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.ln{white-space:pre;overflow:hidden;height:var(--lh)}
.div{white-space:pre;overflow:hidden;color:var(--faint);height:var(--lh);margin:4px 0 2px}
.div.on{color:var(--g)}
.div b{font-weight:400;color:var(--fg)}
.div.on b{color:var(--g)}
.meter{display:block;width:100%;white-space:pre;overflow:hidden;height:22px;line-height:22px}
.meter *,.pr *,.row44 *{pointer-events:none}
.meter:active,.meter.pin{background:#1d1d1b}
.cores{display:grid;grid-template-columns:1fr 1fr;column-gap:1ch}
canvas{display:block;width:100%}
.hist{height:150px;margin-top:2px}
.pr{display:block;width:100%;white-space:pre;overflow:hidden;min-height:44px;padding:4px 0}
.pr .l2{color:var(--dim)}
.pr:active{background:#1d1d1b}
.pr.sel{background:var(--c);color:#000}
.pr.sel *{color:#000 !important}
.pr.dying{background:var(--r);color:#000}
.pr.dying *{color:#000 !important}
.hdr{flex:none;display:flex;white-space:pre;background:var(--g);color:#000;height:30px;line-height:30px;overflow:hidden}
.hdr button{height:30px;padding:0}
.hdr button.on{background:var(--c)}
.hdr button:active{background:var(--W)}
.proc{display:flex;flex-direction:column;padding:0}
.plist{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 8px 8px;scrollbar-width:none;overscroll-behavior:contain}
.plist::-webkit-scrollbar{display:none}
.hdrwrap{padding:0 8px}
.empty{padding:18px 0;color:var(--dim);white-space:pre-wrap}
.kbtn{display:inline-block;min-height:44px;line-height:44px;padding:0 1ch;color:var(--fg)}
.kbtn b{color:var(--y);font-weight:700}
.kbtn:active{background:var(--fg);color:#000}
.kbtn:active b{color:#000}
.row44{display:block;width:100%;min-height:44px;white-space:pre;overflow:hidden;padding:4px 0}
.row44:active{background:#1d1d1b}
.row44.off{color:var(--dim)}
.spark{height:44px;margin:2px 0 6px}
.memmap{height:54px;margin:6px 0 4px}
.memp{height:90px;margin:4px 0}

/* ---------- F-key bar ---------- */
.fkeys{flex:none;display:grid;grid-template-columns:repeat(7,1fr);height:44px;background:#000;white-space:pre;overflow:hidden}
.fkeys[hidden]{display:none}
.fkeys button{display:flex;align-items:center;justify-content:center;height:44px;overflow:hidden}
.fkeys button b{color:var(--W);font-weight:400;padding-right:1px}
.fkeys button span{background:var(--c);color:#000;padding:0 1px}
.fkeys button:active span,.fkeys button.on span{background:var(--W)}
.fline{flex:none;display:flex;align-items:center;height:44px;padding:0 8px;background:#000;white-space:pre}
.fline[hidden]{display:none}
.fline b{color:#000;background:var(--c);font-weight:400;padding:0 1ch}
.fline input{flex:1;min-width:0;background:none;border:0;outline:0;padding:0 1ch;height:44px;caret-color:var(--W)}
.fline button{height:44px;padding:0 1ch;color:var(--dim)}

/* ---------- tmux status line ---------- */
.tmux{flex:none;position:relative;display:flex;align-items:stretch;height:44px;background:var(--g);color:#000;white-space:pre;overflow:hidden}
.tmux button{height:44px;padding:0 .6ch}
.tmux button:active{background:#000;color:var(--g)}
.tmux .tw.on{background:#000;color:var(--g)}
.tmux .ses b{font-weight:700}
.tmux .rt{margin-left:auto;display:flex;align-items:center;padding-right:1ch}
.tmux .msg{position:absolute;inset:0;display:flex;align-items:center;padding:0 1ch;background:var(--y);color:#000;visibility:hidden}
.tmux .msg.on{visibility:visible}
.tmux form{position:absolute;inset:0;display:flex;align-items:center;background:var(--y);color:#000;padding-left:1ch}
.tmux form[hidden]{display:none}
.tmux form input{flex:1;min-width:0;height:44px;background:none;border:0;outline:0;padding:0;caret-color:#000;color:#000}
.tmux form button{padding:0 1.2ch}
.home{flex:none;height:calc(22px + env(safe-area-inset-bottom));position:relative;background:#000}
.home::after{content:"";position:absolute;left:50%;top:9px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#d6d6d0}

/* ---------- popup sheet (tmux display-popup) ---------- */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:6px;right:6px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:51;max-height:76%;display:flex;flex-direction:column;background:#000;
  border:1px solid var(--g);transform:translateY(calc(100% + 90px));transition:transform .32s cubic-bezier(.2,.9,.25,1);touch-action:none}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.sheet .grab{flex:none;height:26px;display:flex;justify-content:center;align-items:center;cursor:grab}
.sheet .grab i{width:44px;height:4px;background:var(--faint)}
.sheet .ttl{position:absolute;top:-10px;left:14px;background:#000;padding:0 1ch;color:var(--g);line-height:18px}
.sheet .body{overflow-y:auto;overflow-x:hidden;padding:0 12px 14px;touch-action:pan-y;scrollbar-width:none;overscroll-behavior:contain}
.sheet .body::-webkit-scrollbar{display:none}
.kv{white-space:pre-wrap;word-break:break-all}
.sig{display:flex;width:100%;min-height:44px;align-items:center;white-space:pre}
.sig:active,.sig.hl{background:var(--c);color:#000}
.sig:active *,.sig.hl *{color:#000}
.chk{display:flex;width:100%;min-height:44px;align-items:center;white-space:pre}
.chk:active{background:#1d1d1b}
.rng{display:flex;align-items:center;gap:1ch;min-height:44px}
.rng input{flex:1;-webkit-appearance:none;appearance:none;height:30px;background:none;touch-action:none}
.rng input::-webkit-slider-runnable-track{height:2px;background:var(--faint)}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:20px;margin-top:-9px;background:var(--c);border-radius:0}
.rng input::-moz-range-track{height:2px;background:var(--faint)}
.rng input::-moz-range-thumb{width:9px;height:20px;background:var(--c);border:0;border-radius:0}
.out{white-space:pre-wrap;word-break:break-all;min-height:40px}
.cursor{display:inline-block;width:1ch;background:var(--fg);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{background:transparent}}

@media (prefers-reduced-motion:reduce){
  .win.paint{animation:none}
  .sheet{transition:none}
  .cursor{animation:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><div class="blog" id="blog"></div></div>

  <div class="device">
    <div class="screen" id="screen">
      <header class="sb">
        <span id="clock">14:32</span>
        <span class="gl" aria-hidden="true">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" fill="#d6d6d0"/><rect x="5" y="5" width="3" height="7" fill="#d6d6d0"/><rect x="10" y="2" width="3" height="10" fill="#d6d6d0"/><rect x="15" y="0" width="3" height="12" fill="#4a4a46"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="0" width="16" height="2" fill="#d6d6d0"/><rect x="3" y="4" width="10" height="2" fill="#d6d6d0"/><rect x="6" y="8" width="4" height="4" fill="#d6d6d0"/></svg>
          <svg width="27" height="12" viewBox="0 0 27 12"><rect x="0" y="0" width="24" height="12" fill="none" stroke="#d6d6d0" stroke-width="2"/><rect x="24" y="4" width="3" height="4" fill="#d6d6d0"/><rect id="batt" x="3" y="3" width="14" height="6" fill="#71d15b"/></svg>
        </span>
      </header>

      <main class="wins" id="wins">
        <!-- 0:cpu -->
        <section class="win" id="w0" aria-label="CPU">
          <div class="cores" id="cores"></div>
          <button class="meter" id="memM" aria-label="記憶體，前往 1:mem"></button>
          <button class="meter" id="swpM" aria-label="置換空間"></button>
          <div class="ln" id="tasks"></div>
          <div class="ln" id="load"></div>
          <div class="ln" id="upt"></div>
          <div class="div on" id="d1"></div>
          <canvas class="hist" id="hist" aria-label="CPU 使用率歷史"></canvas>
          <div class="ln kd" id="histAx"></div>
          <div class="div" id="d2"></div>
          <div id="topcpu"></div>
        </section>
        <!-- 1:mem -->
        <section class="win" id="w1" aria-label="記憶體" hidden>
          <div class="ln"><span class="kc">記憶體</span> <span class="kd">16.0G 統一記憶體 · LPDDR5</span></div>
          <canvas class="memmap" id="memmap"></canvas>
          <div id="memleg"></div>
          <div class="div on" id="d3"></div>
          <canvas class="memp" id="memp" aria-label="記憶體壓力"></canvas>
          <div class="ln" id="memstat"></div>
          <div>
            <button class="kbtn" id="purgeBtn"><b>p</b>urge 快取</button>
            <button class="kbtn" id="swapBtn"><b>s</b>wap 細節</button>
          </div>
          <div class="div" id="d4"></div>
          <div id="topmem"></div>
        </section>
        <!-- 2:proc -->
        <section class="win proc" id="w2" aria-label="行程" hidden>
          <div class="hdrwrap"><div class="hdr" id="hdr" role="toolbar" aria-label="排序欄位"></div></div>
          <div class="plist" id="plist" role="listbox" aria-label="行程列表"></div>
        </section>
        <!-- 3:net -->
        <section class="win" id="w3" aria-label="網路" hidden>
          <div id="ifaces"></div>
          <div class="div on" id="d5"></div>
          <div id="conns"></div>
          <div>
            <button class="kbtn" id="unitBtn"><b>u</b>nits <span id="unitLbl">bytes</span></button>
            <button class="kbtn" id="pingBtn"><b>i</b> ping ptt.cc</button>
          </div>
        </section>
      </main>

      <div class="fline" id="fline" hidden>
        <b id="fmode">F4 篩選</b><input id="finput" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="篩選文字"><button id="fclose" aria-label="關閉篩選">Esc</button>
      </div>
      <div class="fkeys" id="fkeys" hidden>
        <button data-f="1" aria-label="F1 說明"><b>F1</b><span>說明</span></button>
        <button data-f="2" aria-label="F2 設定"><b>F2</b><span>設定</span></button>
        <button data-f="3" aria-label="F3 搜尋"><b>F3</b><span>搜尋</span></button>
        <button data-f="4" aria-label="F4 篩選"><b>F4</b><span>篩選</span></button>
        <button data-f="5" aria-label="F5 樹狀"><b>F5</b><span>樹狀</span></button>
        <button data-f="6" aria-label="F6 排序"><b>F6</b><span>排序</span></button>
        <button data-f="9" aria-label="F9 送出信號"><b>F9</b><span>結束</span></button>
      </div>

      <nav class="tmux" id="tmux" aria-label="tmux 視窗">
        <button class="ses" id="cmdBtn" aria-label="開啟指令列"><b>[:</b>sys<b>]</b></button>
        <button class="tw on" data-w="0" role="tab" aria-selected="true">0:cpu*</button>
        <button class="tw" data-w="1" role="tab" aria-selected="false">1:mem </button>
        <button class="tw" data-w="2" role="tab" aria-selected="false">2:proc</button>
        <button class="tw" data-w="3" role="tab" aria-selected="false">3:net </button>
        <span class="rt" id="tclock">14:32</span>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
        <form id="prompt" hidden autocomplete="off"><span>:</span><input id="pin" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="tmux 指令"><button type="button" id="pesc">Esc</button></form>
      </nav>
      <div class="home" aria-hidden="true"></div>

      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
        <span class="ttl" id="sheetT">popup</span>
        <div class="grab" aria-hidden="true"><i></i></div>
        <div class="body" id="sheetBody"></div>
      </div>
    </div>
  </div>

  <div class="caption">
    <h1>sysmon<i>_</i></h1>
    <p>htop 配色的口袋系統監控。每核 CPU、行程排序與送出信號、網路走勢，全在一條 tmux 狀態列下。</p>
  </div>
</div>

<script>
(function(){

      else { var ms = (base * rnd(.8, 1.6)).toFixed(3); o.innerHTML += '64 bytes from ' + esc(host) + ': icmp_seq=' + seq + ' ttl=54 time=' + sp(+ms > base * 1.4 ? 'ky' : 'kg', ms + ' ms') + '\n'; beep(1760, .03, 'sine', .03); }
      seq++; if (seq >= 6){ clearInterval(pingT); o.innerHTML += '\n' + sp('kc', '--- ' + esc(host) + ' ping statistics ---') + '\n6 packets transmitted' + (ifState.en0 ? ', 0.0% packet loss' : ', 100.0% packet loss'); }
      $('sheetBody').scrollTop = 9999;
    }, 520);
    return;
  }
  if (c === 'neofetch'){
    var m = memUse();
    openSheet('neofetch', '<div class="out">' + sp('kg', '   ▄▄▄    ') + sp('kW', 'tommy') + '@' + sp('kW', 'taipei-mbp') + '\n' + sp('kg', '  █████   ') + sp('kc', 'OS ') + 'macOS 17 Tahoe\n' + sp('ky', ' ██████▌  ') + sp('kc', 'Host ') + 'MacBook Pro 14\n' + sp('ky', ' ██████▌  ') + sp('kc', 'CPU ') + '8 核心 (4P + 4E)\n' + sp('kr', '  █████   ') + sp('kc', 'Memory ') + m.used.toFixed(1) + 'G / 16G\n' + sp('km', '   ▀█▀    ') + sp('kc', 'Shell ') + 'zsh 5.9 · tmux 3.5\n' + sp('kb', '          ') + sp('kc', 'Locale ') + 'zh_TW.UTF-8</div>', 'neo');
    return;
  }
  bell(); msg('unknown command: ' + c);
}

// ---------- keyboard ----------
document.addEventListener('keydown', function(e){
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape'){ if (sheet.classList.contains('on')) closeSheet(); else closeF(); return; }
  if (e.key === ':'){ e.preventDefault(); openPrompt(); return; }
  if (/^[0-3]$/.test(e.key)){ setWin(+e.key); return; }
  if (W === 2 && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){
    e.preventDefault(); var v = visibleProcs(), i = v.findIndex(function(p){ return p.pid === selPid; });
    i = Math.max(0, Math.min(v.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1))); if (v[i]){ selPid = v[i].pid; save('sel', selPid); renderProc(); scrollSel(); }
  }
  if (W === 2 && e.key === 'Enter' && !sheet.classList.contains('on')) openProc(selPid);
  if (e.key === 'F9'){ e.preventDefault(); openProc(selPid, true); }
});
