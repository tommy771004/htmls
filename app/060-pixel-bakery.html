canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--dk);isolation:isolate;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}

    box-shadow:inset 0 0 0 2px #5a3620,inset 0 3px 0 2px #6e4428,0 18px 26px -18px #000}
  .screen{inset:10px;border-radius:38px}
  .caption{display:block;position:relative;z-index:1;width:250px}

}
@media (min-width:521px) and (max-width:900px){.caption{display:none}}

.status .gl{display:flex;gap:6px;align-items:center}

.hud .gold{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.hud .rate{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

.scene{flex:1;min-height:250px;position:relative;margin:6px 8px 0;background:#3a200e;overflow:hidden;cursor:pointer;touch-action:manipulation}
.scene canvas{position:absolute;left:50%;top:0;transform:translateX(-50%)}
.scene:active canvas{filter:brightness(1.06)}

.dialog{flex:none;margin:6px 8px 0;height:96px;padding:17px 18px 0;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.dialog .line{clip-path:inset(0 0 0 0)}
.dialog .line.type{animation:type var(--dur,1s) steps(var(--n,12)) both}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.dialog .more{position:absolute;right:18px;bottom:12px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.cmds{flex:none;margin:6px 8px calc(24px + env(safe-area-inset-bottom));padding:14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.cmd{height:50px;display:flex;align-items:center;gap:6px;padding:0 8px}
.cmd .cur{visibility:hidden}
.cmd[aria-current=true] .cur{visibility:visible;animation:nudge .6s steps(2) infinite}
@keyframes nudge{50%{transform:translateX(3px)}}
.cmd:active{background:#3d2416}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;background:var(--cr);opacity:.6;z-index:30;pointer-events:none}

.scrim{position:absolute;inset:0;z-index:50;background:rgba(10,5,2,.55);opacity:0;pointer-events:none;transition:opacity .2s steps(3)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:6px;right:6px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:51;max-height:78%;display:flex;flex-direction:column;transform:translateY(calc(100% + 40px));transition:transform .36s var(--out);touch-action:none}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.sheet .th{flex:none;display:flex;align-items:center;justify-content:space-between;padding:18px 18px 8px;cursor:grab}
.sheet .th .x{width:44px;height:44px;display:grid;place-items:center;margin-right:-8px}
.sheet .th .x:active{background:#3d2416}
.sheet .grip{position:absolute;left:50%;top:13px;margin-left:-15px;width:30px;height:3px;background:#8a5630;box-shadow:0 5px 0 #8a5630}
.sheet .list{overflow-y:auto;padding:0 14px 18px;overscroll-behavior:contain}
.it{display:flex;align-items:center;gap:10px;width:100%;min-height:62px;padding:6px 6px;text-align:left}
.it+.it{box-shadow:0 -3px 0 -0px #3d2416}
.it:active{background:#3d2416}
.it .ic{flex:none;width:48px;height:48px;display:grid;place-items:center}
.it .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.it .co{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.it.no .tx,.it.no .co,.it.no .ic{opacity:.45}
.it.shake{animation:shake .3s steps(6)}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.it.flash{background:#4a2c16}

@media (prefers-reduced-motion:reduce){
  .dialog .line.type,.cmd[aria-current=true] .cur,.dialog .more,.it.shake{animation:none}
  .sheet{transition-duration:.01s}
}

  function end(e){ if(!on) return; on=false; sheet.classList.remove('drag'); scrim.style.opacity=''; if(dy > sheet.offsetHeight*.35 || dy/Math.max(1,e.timeStamp-t0) > .6) closeWin(); else sheet.style.transform=''; }

function row(opt){ var b = document.createElement('button'); b.className = 'it'+(opt.no?' no':''); if(opt.data) Object.keys(opt.data).forEach(function(k){ b.dataset[k] = opt.data[k]; }); b.setAttribute('aria-label', opt.aria);
  var ic = document.createElement('span'); ic.className = 'ic'; if(opt.icon) ic.appendChild(opt.icon); b.appendChild(ic);
  var tx = document.createElement('span'); tx.className = 'tx'; tx.appendChild(mk(opt.name, C.cr, {size:12, s:2})); if(opt.sub) tx.appendChild(mk(opt.sub, C.dim, {size:10, s:2})); b.appendChild(tx);
  var co = document.createElement('span'); co.className = 'co'; if(opt.r1) co.appendChild(mk(opt.r1, opt.r1c||C.gd2, {s:2, size:12})); if(opt.r2) co.appendChild(mk(opt.r2, C.dim, {s:2, size:10})); b.appendChild(co); return b; }
function iconCanvas(fn, w, h){ var c = document.createElement('canvas'); c.width = w||16; c.height = h||16; c.style.width = (w||16)*3+'px'; c.style.height = (h||16)*3+'px'; var x = c.getContext('2d'); fn(x); return c; }
function renderWin(){ var L = $('list'); L.innerHTML = '';
  if(mode==='up'){ UPS.forEach(function(u){ var c = cost(u), can = st.g >= c, lv = st.lv[u.id];
      var sub = u.tap ? '每下 +'+fmt(breadNow().p*(1+lv+1)*(1+.1*(st.br-1)))+'G' : '每個 +'+fmtR(u.r*(1+.25*(st.br-1)))+'/s';
      L.appendChild(row({no:!can, data:{u:u.id}, aria:u.n+' 等級 '+lv+'，花費 '+fmt(c)+' 金幣', icon:iconCanvas(function(x){ upIcon(x, u.id); }), name:u.n+(lv?' x'+lv:''), sub:sub, r1:fmtG(c), r1c:can?C.gd2:C.dim})); }); }
  else if(mode==='bread'){ BREADS.forEach(function(b, i){ var owned = i < st.br, next = i === st.br, can = next && st.g >= b.u;
      L.appendChild(row({no:!owned && !can, data:{b:i}, aria:b.n+(owned?' 已解鎖':' 解鎖需要 '+fmt(b.u)+' 金幣'), icon:iconCanvas(function(x){ bread(x, owned||next ? b : {t:b.t, k:'none', c:['#4a2c16','#4a2c16','#3a200e']}, 4, 5); }), name: owned || next ? b.n : '？？？', sub: owned ? '每個 '+fmt(b.p)+'G'+(i===st.br-1?'・主打':'') : next ? '每個 '+fmt(b.p)+'G・全店收入 +25%' : '先解鎖上一款', r1: owned ? '已上架' : fmtG(b.u), r1c: owned ? C.grn : can ? C.gd2 : C.dim})); }); }
  else if(mode==='book'){ var secs = Math.floor(st.play), hh = Math.floor(secs/3600), mm = Math.floor(secs%3600/60);
    [['總收入', fmt(st.tot)+'G'], ['出爐', fmt(st.baked)+' 個'], ['點擊', fmt(st.taps)+' 次'], ['每秒', fmtR(rate())+'G'], ['每下', fmt(tapVal())+'G'], ['營業', hh+'時'+mm+'分']].forEach(function(p){ var r = document.createElement('div'); r.className = 'it'; r.style.minHeight = '44px'; r.appendChild(mk(p[0], C.dim, {size:12, s:2})); var sp = document.createElement('span'); sp.style.flex = '1'; r.appendChild(sp); r.appendChild(mk(p[1], C.cr, {size:12, s:2})); L.appendChild(r); });
    L.appendChild(row({data:{t:'snd'}, icon:iconCanvas(function(x){ x.fillStyle=C.cr; x.fillRect(3,6,3,4); x.fillRect(6,4,2,8); x.fillRect(8,2,1,12); if(st.snd){ x.fillStyle=C.gd2; x.fillRect(11,5,1,6); x.fillRect(13,3,1,10); } }), aria:'音效 '+(st.snd?'開':'關'), name:'音效', sub:'8-bit 方波', r1: st.snd ? '開' : '關', r1c: st.snd ? C.grn : C.dim}));
    L.appendChild(row({data:{t:'hap'}, icon:iconCanvas(function(x){ x.fillStyle=C.cr; x.fillRect(5,2,6,12); x.fillStyle=C.dk2; x.fillRect(6,3,4,9); x.fillStyle=C.cr; x.fillRect(7,12,2,1); if(st.hap){ x.fillStyle=C.gd2; x.fillRect(2,5,1,6); x.fillRect(13,5,1,6); } }), aria:'震動 '+(st.hap?'開':'關'), name:'震動', sub:'點擊時輕震', r1: st.hap ? '開' : '關', r1c: st.hap ? C.grn : C.dim}));
    L.appendChild(row({data:{t:'reset'}, icon:iconCanvas(function(x){ x.fillStyle='#9c6334'; x.fillRect(4,3,8,12); x.fillStyle='#3a200e'; x.fillRect(5,4,6,11); x.fillStyle=C.rd; x.fillRect(9,9,1,2); }), aria:resetArm?'再按一次確定重新開店':'重新開店', name: resetArm ? '再按一次確定' : '重新開店', sub:'所有進度歸零', r1:'', r1c:C.rd})); }
  else if(mode==='away'){ var a = away; var r1 = document.createElement('div'); r1.style.padding = '4px 8px 12px'; r1.appendChild(mk('你離開了 '+a.txt+'。', C.cr, {size:12, s:2})); var r2 = mk('學徒們烤了 '+fmt(a.n)+' 個麵包，', C.cr, {size:12, s:2}); r2.style.marginTop = '8px'; r1.appendChild(r2); var r3 = mk('賺進 '+fmt(a.g)+' G！', C.gd2, {size:12, s:2}); r3.style.marginTop = '8px'; r1.appendChild(r3); L.appendChild(r1);
    L.appendChild(row({data:{t:'take'}, aria:'收下 '+fmt(a.g)+' 金幣', icon:iconCanvas(function(x){ coin(x, 5, 5, 0); coin(x, 9, 8, 0); }), name:'收下', sub:'放進錢箱', r1:'+'+fmt(a.g)+'G'})); }
}
$('list').addEventListener('click', function(e){ var b = e.target.closest('.it'); if(!b || b.tagName!=='BUTTON') return;
  if(b.dataset.u){ var u = UPS.filter(function(x){ return x.id===b.dataset.u; })[0], c = cost(u); if(st.g < c){ deny(b); return; } st.g -= c; st.lv[u.id]++; sfx.buy(); haptic([8,20,8]); say(u.n+' 升到 '+st.lv[u.id]+' 級！'); flashAfter(b.dataset.u, 'u'); }
  else if(b.dataset.b){ var i = +b.dataset.b, br = BREADS[i]; if(i < st.br){ sfx.menu(); say(br.n+'，每個 '+fmt(br.p)+' G。'); return; } if(i !== st.br || st.g < br.u){ deny(b); return; } st.g -= br.u; st.br++; sfx.fan(); haptic([10,30,10,30,20]); say('新品上架：'+br.n+'！'); flashAfter(String(i), 'b'); }
  else if(b.dataset.t==='snd'){ st.snd = !st.snd; if(st.snd) sfx.menu(); haptic(5); renderWin(); }
  else if(b.dataset.t==='hap'){ st.hap = !st.hap; haptic(12); renderWin(); }
  else if(b.dataset.t==='reset'){ if(!resetArm){ resetArm = true; sfx.no(); haptic([20,40,20]); renderWin(); return; } var s = st.snd, h = st.hap; st = fresh(); st.snd = s; st.hap = h; st.lv.app = 0; st.lv.mix = 0; st.br = 1; st.g = 0; st.tot = 0; st.baked = 0; st.taps = 0; st.play = 0; custs = []; persist(); closeWin(); say('新店開張！從一個菠蘿麵包開始。'); }
  else if(b.dataset.t==='take'){ st.g += away.g; st.tot += away.g; st.baked += away.n; away = null; sfx.fan(); haptic([10,30,10]); closeWin(); say('收下了離線營收，繼續開店！'); }
  hud(true); persist(); });
function deny(b){ sfx.no(); haptic([30,30,30]); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); say('金幣不夠……再多烤幾個吧。'); }
function flashAfter(v, k){ renderWin(); var n = $('list').querySelector('[data-'+k+'="'+v+'"]'); if(n){ n.classList.add('flash'); setTimeout(function(){ n.classList.remove('flash'); }, 300); n.focus({preventScroll:true}); } }

/* ================= loop ================= */
var last = performance.now(), saveT = 0, raf = 0;
function loop(t){ var d = Math.min(.1, (t - last)/1000); last = t; var r = rate(); st.g += r*d; st.tot += r*d; st.play += d; saveT += d;
  step(d); draw(); if(frame % 6 === 0) hud(false); if(saveT > 5){ saveT = 0; persist(); if(mode==='up'||mode==='bread') renderWin(); }
  raf = requestAnimationFrame(loop); }
document.addEventListener('visibilitychange', function(){ if(document.hidden){ cancelAnimationFrame(raf); persist(); } else { var gap = (Date.now() - st.t)/1000; if(gap > 30) grantAway(gap); last = performance.now(); raf = requestAnimationFrame(loop); } });
window.addEventListener('pagehide', persist);

/* ================= offline ================= */
var away = null;
function grantAway(sec){ sec = Math.min(sec, 8*3600); var r = rate(); if(r <= 0) return; var g = r*sec, n = Math.max(1, Math.round(g/breadNow().p)), h = Math.floor(sec/3600), m = Math.floor(sec%3600/60);
  away = {g:g, n:n, txt: h ? h+' 時 '+m+' 分' : m ? m+' 分' : Math.floor(sec)+' 秒'}; st.t = Date.now(); openWin('away'); }

/* ================= status clock ================= */
function tick(){ var d = new Date(); label($('clk'), String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'), C.cr, {bs:2, s:1}); }
tick(); setInterval(tick, 20000);
label($('coinIc'), ' ', C.cr); (function(){ var c = $('coinIc'); c.width = 7; c.height = 7; var x = c.getContext('2d'); x.fillStyle = '#b0702a'; x.fillRect(1,0,5,7); x.fillRect(0,1,7,5); x.fillStyle = C.gd2; x.fillRect(1,1,4,5); x.fillRect(2,0,3,1); x.fillStyle = '#b0702a'; x.fillRect(3,2,1,3); c.style.width = '28px'; c.style.height = '28px'; })();
label($('more'), 'v2', C.gd2, {s:2}); (function(){ var c = $('more'); c.width = 7; c.height = 4; var x = c.getContext('2d'); x.fillStyle = C.gd2; BM.v2.forEach(function(r, y){ for(var q=0;q<r.length;q++) if(r[q]==='#') x.fillRect(q,y,1,1); }); c.style.width = '14px'; c.style.height = '8px'; })();

/* ================= backdrop + caption (wide screens) ================= */
function backdrop(){ if(innerWidth < 521) return; var c = $('bd'), w = 320, h = Math.round(320*innerHeight/innerWidth); c.width = w; c.height = h; var x = c.getContext('2d'), f = function(col,a,b,cw,ch){ x.fillStyle = col; x.fillRect(a,b,cw,ch); };
  var bands = ['#2b1a2e','#3e2233','#5a2c36','#7a3a38','#a04e3a','#c9693e','#e8904a']; var bh = Math.ceil(h*.62/bands.length);
  bands.forEach(function(col, i){ f(col, 0, i*bh, w, bh+1); if(i){ x.fillStyle = bands[i-1]; for(var q=0;q<w;q+=2) x.fillRect(q+(i%2), i*bh, 1, 1); } });
  var r = 7; function rnd(){ r = (r*16807)%2147483647; return r/2147483647; }
  var gy = Math.round(h*.78);
  for(var bx=-4; bx<w; ){ var bw = 26+Math.floor(rnd()*22), bhh = 40+Math.floor(rnd()*60), top = gy-bhh; f('#1f1216', bx, top, bw, bhh); f('#2a1a1c', bx, top, bw, 2);
    for(var wy=top+6; wy<gy-16; wy+=9) for(var wx=bx+4; wx<bx+bw-5; wx+=8) f(rnd()<.45?'#f2b35a':'#3a2426', wx, wy, 4, 5);
    f('#2a1a1c', bx, gy-14, bw, 3); if(rnd()<.5){ f(['#d9502a','#e9a93a','#6fa83a'][Math.floor(rnd()*3)], bx+3, gy-24, 3, 8); } bx += bw + 1; }
  f('#140b0c', 0, gy, w, h-gy); for(var q=0;q<w;q+=12) f('#2a1a1c', q, gy+6, 6, 1);
  c.style.width = '100%'; c.style.height = '100%'; }
function caption(){ var w = $('capWin'); if(w.children.length) return; w.appendChild(mk('像素烘焙坊', C.gd2, {size:14, s:2})); ['放置類遊戲。點窯出爐，', '雇學徒、添石窯，', '關掉之後也會一直烤。'].forEach(function(t){ var c = mk(t, C.cr, {size:10, s:2}); c.style.marginBottom = '6px'; w.appendChild(c); }); }
addEventListener('resize', function(){ backdrop(); caption(); });

/* ================= boot ================= */
resize(); hud(true); backdrop(); caption();
var gap0 = (Date.now() - (st.t||Date.now()))/1000;
if(load('state', null) && gap0 > 30) grantAway(gap0); else say('歡迎光臨！點窯口就能烤出'+breadNow().n+'。');
persist(); raf = requestAnimationFrame(loop);
})();
</script>
