<style>
:root{
  --prus:#1f3b5c;
  --prus-2:#35618a;
  --prus-3:#8fb0c4;
  --paper:#d8d3c4;
  --paper-2:#e6e2d6;
  --verm:#c8452c;
  --ink:#16222e;
  --bao:"Baoli TC","Baoli SC","Libian TC","Songti TC",serif;
  --sans:"PingFang TC",system-ui,-apple-system,sans-serif;
  --out:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.4,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.5 var(--sans);color:var(--ink);background:var(--paper);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--verm);outline-offset:2px}
svg{display:block}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:var(--paper)}
@media (min-width:521px){
  body{background:#cfc9b8}
  .stage{display:flex;align-items:center;justify-content:center;gap:60px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop canvas{width:100%;height:100%;display:block}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:48px;padding:8px;z-index:1;
    background:#16222e;box-shadow:inset 0 0 0 1px #3a4d60,3px 4px 0 rgba(22,34,46,.25)}
  .screen{inset:8px;border-radius:40px}
  .caption{display:flex;position:relative;z-index:1;gap:14px;align-items:flex-start}
  .caption h1{writing-mode:vertical-rl;font:400 46px/1 var(--bao);letter-spacing:.14em;background:var(--paper-2);color:var(--ink);padding:18px 12px;box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 5px var(--paper-2),inset 0 0 0 6px var(--ink)}
  .caption p{writing-mode:vertical-rl;font:16px/1.9 var(--bao);color:var(--paper-2);background:rgba(22,34,46,.78);padding:14px 8px;letter-spacing:.1em;max-height:360px}
}
@media (min-width:521px) and (max-width:860px){.caption{display:none}}

.status{position:absolute;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;height:calc(50px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 28px 0 32px;font:600 16px/1 var(--sans);color:var(--paper-2);pointer-events:none;transition:color .3s}
.status .g{display:flex;gap:6px;align-items:center}
.screen.dex .status{color:var(--ink)}
@media (display-mode:standalone){.status{display:none}}

/* ---------- nav: two print cartouches ---------- */
.nav{position:absolute;right:14px;top:calc(56px + env(safe-area-inset-top));z-index:30;display:flex;gap:6px}
.cart{writing-mode:vertical-rl;width:44px;height:92px;display:flex;align-items:center;justify-content:center;font:400 20px/1 var(--bao);letter-spacing:.2em;
  background:var(--paper-2);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink),inset 0 0 0 4px var(--paper-2),inset 0 0 0 5px var(--ink);transition:background-color .25s,color .25s,transform .2s var(--out)}
.cart:active{transform:translateY(2px)}
.cart[aria-selected=true]{background:var(--verm);color:var(--paper-2);box-shadow:inset 0 0 0 1.5px var(--ink),inset 0 0 0 4px var(--verm),inset 0 0 0 5px var(--paper-2)}
.spot{position:absolute;left:14px;top:calc(56px + env(safe-area-inset-top));z-index:30;display:flex;align-items:flex-start;gap:8px;text-align:left;padding:4px;min-height:44px}
.spot .seal{flex:none;width:40px;height:40px;background:var(--verm);color:var(--paper-2);display:grid;place-items:center;font:400 18px/1 var(--bao)}
.spot .seal span{display:block;transform:translateY(1px)}
.spot b{display:block;font:400 21px/1.15 var(--bao);color:var(--paper-2)}
.spot small{font:12px/1.4 var(--sans);color:rgba(230,226,214,.82)}
.screen.dex .spot{display:none}

/* ---------- fishing ---------- */
#sea{position:absolute;inset:0;z-index:1;touch-action:none;cursor:pointer}
#sea canvas{width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:12px 18px calc(28px + env(safe-area-inset-bottom));background:var(--paper-2);
  box-shadow:0 -2px 0 var(--ink),0 -5px 0 var(--paper-2),0 -6px 0 var(--ink)}
.hud .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hud .say{font:400 22px/1.2 var(--bao);min-height:28px}
.hud .say.hot{color:var(--verm)}
.hud .meta{font:13px/1.3 var(--sans);color:#4c5967;text-align:right;white-space:nowrap}
.hud .meta b{font:400 18px/1 var(--bao);color:var(--ink)}
.gauge{position:relative;height:26px;margin-top:10px;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--ink)}
.gauge .z{position:absolute;top:0;bottom:0}
.gauge .z.slack{left:0;width:12%;background:repeating-linear-gradient(135deg,transparent 0 4px,rgba(22,34,46,.18) 4px 5px)}
.gauge .z.good{left:30%;width:52%;background:rgba(53,97,138,.22)}
.gauge .z.bad{left:88%;right:0;background:var(--verm)}
.gauge .fill{position:absolute;left:0;top:4px;bottom:4px;background:var(--prus);width:0}
.gauge .nd{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--ink);left:0}
.gauge .lab{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:12px/1 var(--sans);color:var(--paper-2);mix-blend-mode:normal}
.gauge.power .fill{background:var(--verm)}
.gauge.power .z{display:none}
.act{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;height:52px;font:400 21px/1 var(--bao);background:var(--prus);color:var(--paper-2);display:flex;align-items:center;justify-content:center;gap:10px;transition:background-color .15s,transform .15s var(--out);touch-action:none}
.btn:active,.btn.down{background:var(--ink);transform:scale(.98)}
.btn.v{background:var(--verm)}
.btn.v:active{background:#9e3420}
.btn svg{width:26px;height:26px}
.btn.sq{flex:none;width:52px;background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}

/* ---------- dex ---------- */
#dex{position:absolute;inset:0;z-index:25;background:var(--paper);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  padding:calc(58px + env(safe-area-inset-top)) 16px calc(34px + env(safe-area-inset-bottom));transition:transform .5s var(--out)}
#dex::-webkit-scrollbar{display:none}
#dex.off{transform:translateY(100%)}
#dex[hidden]{display:none}
.dhead{padding:4px 110px 10px 4px}
.dhead h2{font:400 34px/1.1 var(--bao)}
.dhead p{font:13px/1.5 var(--sans);color:#4c5967;margin-top:4px}
.dhead p b{font:400 18px/1 var(--bao);color:var(--verm)}
.filt{display:flex;gap:4px;margin:6px 0 12px;overflow-x:auto;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.filt button{flex:none;height:44px;padding:0 10px;font:400 17px/1 var(--bao);color:#4c5967}
.filt button[aria-pressed=true]{color:var(--verm)}
.filt button[aria-pressed=true] span{border-bottom:2px solid var(--verm);padding-bottom:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.print{position:relative;background:var(--paper-2);box-shadow:inset 0 0 0 1.5px var(--ink);padding:10px 10px 10px;text-align:left;display:flex;flex-direction:column;min-height:150px;transition:transform .2s var(--out)}
.print:active{transform:scale(.97)}
.print .band{position:absolute;left:1.5px;right:1.5px;top:1.5px;height:44px;background:linear-gradient(180deg,rgba(31,59,92,.55),rgba(31,59,92,0))}
.print svg{position:relative;width:100%;height:78px;margin-top:10px}
.print .nm{position:relative;font:400 19px/1.2 var(--bao);margin-top:4px}
.print .st{position:relative;font:12px/1.4 var(--sans);color:#4c5967}
.print .rar{position:absolute;right:8px;top:8px;display:flex;gap:2px}
.print .rar i{width:8px;height:8px;background:var(--verm)}
.print .rar i.o{background:none;box-shadow:inset 0 0 0 1.5px var(--verm)}
.print.unk .nm{color:#6f7a84}
.recent{margin-top:22px}
.recent h3{font:400 22px/1 var(--bao);margin-bottom:6px}
.recent li{list-style:none;display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;min-height:56px;border-bottom:1px solid rgba(22,34,46,.2)}
.recent li svg{width:52px;height:30px}
.recent li b{font:400 17px/1.2 var(--bao);display:block}
.recent li span{font:12px/1.3 var(--sans);color:#4c5967}
.recent li em{font:400 18px/1 var(--bao);font-style:normal}

/* sheet */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(22,34,46,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;z-index:51;max-height:86%;display:flex;flex-direction:column;background:var(--paper-2);
  box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 6px var(--paper-2),inset 0 0 0 7px var(--ink);padding:12px 0 calc(16px + env(safe-area-inset-bottom) * .5);
  transform:translateY(110%);transition:transform .5s var(--spring);touch-action:none}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.grab{flex:none;width:44px;height:5px;background:var(--ink);opacity:.35;margin:2px auto 10px}
.sbody{overflow-y:auto;padding:0 22px 6px;touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}
.big{position:relative;margin:4px -8px 0;background:linear-gradient(180deg,rgba(31,59,92,.65),rgba(31,59,92,.05) 55%,transparent);padding:18px 8px 6px}
.big svg{width:100%;height:150px}
.big .title{position:absolute;right:10px;top:12px;writing-mode:vertical-rl;background:var(--paper-2);padding:10px 6px;font:400 24px/1 var(--bao);letter-spacing:.14em;box-shadow:inset 0 0 0 1.5px var(--ink)}
.big .new{position:absolute;left:12px;top:14px;width:54px;height:54px;background:var(--verm);color:var(--paper-2);display:grid;place-items:center;font:400 20px/1.05 var(--bao);text-align:center;transform:rotate(-6deg)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.facts div{text-align:center;padding:10px 0}
.facts div+div{border-left:1px solid rgba(22,34,46,.3)}
.facts b{display:block;font:400 26px/1.1 var(--bao)}
.facts span{font:12px/1.3 var(--sans);color:#4c5967}
.desc{margin-top:12px;font:15px/1.7 var(--sans);color:#2b3845}
.desc b{font:400 17px var(--bao);color:var(--verm);margin-right:6px}
.srow{display:flex;gap:10px;margin-top:16px}
.map svg{width:100%;height:auto;margin-top:6px}
.spots{margin-top:6px}
.spots button{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;min-height:62px;text-align:left;border-bottom:1px solid rgba(22,34,46,.2)}
.spots .n{width:40px;height:40px;display:grid;place-items:center;font:400 18px/1 var(--bao);box-shadow:inset 0 0 0 1.5px var(--ink)}
.spots button[aria-pressed=true] .n{background:var(--verm);color:var(--paper-2);box-shadow:none}
.spots b{display:block;font:400 19px/1.2 var(--bao)}
.spots span{font:12px/1.4 var(--sans);color:#4c5967}
.spots em{font:400 15px/1 var(--bao);font-style:normal;color:#4c5967}
.sheet h3{font:400 26px/1.2 var(--bao)}

.toast{position:absolute;left:50%;top:calc(160px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-30px) scale(.9);opacity:0;visibility:hidden;
  background:var(--ink);color:var(--paper-2);font:400 18px/1 var(--bao);padding:12px 18px;white-space:nowrap;transition:transform .35s var(--spring),opacity .2s,visibility 0s .35s}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .35s var(--spring),opacity .2s}
.home-ind{position:absolute;left:50%;bottom:calc(8px + env(safe-area-inset-bottom) * .3);width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(22,34,46,.7);z-index:45;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  #dex,.sheet,.toast,.cart{transition-duration:.01s}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><canvas id="bdc"></canvas></div>
  <div class="caption"><h1>浮世釣</h1><p>拋竿入浪，收線看緣</p></div>

  <div class="device">
    <div class="screen" id="screen">
      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="g">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4"/><rect x="5" y="5.5" width="3" height="6.5"/><rect x="10" y="3" width="3" height="9"/><rect x="15" y="0" width="3" height="12"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 4.5c4-3.6 10-3.6 14 0M3.8 7.4c2.4-2 6-2 8.4 0"/><rect x="6.8" y="9" width="2.4" height="2.4" fill="currentColor" stroke="none"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".75" y=".75" width="22.5" height="11.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect id="batt" x="3" y="3" width="15" height="7" fill="currentColor"/><rect x="24.5" y="4" width="2" height="5" fill="currentColor"/></svg>
        </span>
      </div>

      <div id="sea" role="application" aria-label="釣場：按住蓄力，放開拋竿"><canvas id="cv"></canvas></div>

      <button class="spot" id="spotBtn" aria-label="換釣場"><span class="seal"><span id="spotSeal">龜</span></span><span><b id="spotName">龜山島外海</b><small id="spotSub">黃昏・東北風 3 級</small></span></button>
      <nav class="nav" role="tablist" aria-label="主要分頁">
        <button class="cart" role="tab" data-v="sea" aria-selected="true">釣場</button>
        <button class="cart" role="tab" data-v="dex" aria-selected="false">圖鑑</button>
      </nav>

      <div class="hud" id="hud">
        <div class="row"><div class="say" id="say">按住水面蓄力</div><div class="meta" id="meta">今日 <b id="today">0</b> 尾</div></div>
        <div class="gauge power" id="gauge" aria-hidden="true"><span class="z slack"></span><span class="z good"></span><span class="z bad"></span><span class="fill" id="gfill"></span><span class="nd" id="gnd"></span><span class="lab" id="glab"></span></div>
        <div class="act">
          <button class="btn sq" id="sndBtn" aria-label="聲音" aria-pressed="true"><svg viewBox="0 0 26 26" id="sndIc"></svg></button>
          <button class="btn" id="mainBtn"><svg viewBox="0 0 26 26" id="mainIc"></svg><span id="mainLbl">按住拋竿</span></button>
        </div>
      </div>

      <section id="dex" class="off" hidden aria-label="圖鑑">
        <div class="dhead"><h2>魚譜</h2><p>已收 <b id="dexN">0</b>／<span id="dexT">13</span> 種・共釣 <span id="dexC">0</span> 尾</p></div>
        <div class="filt" id="filt"></div>
        <div class="grid" id="grid"></div>
        <div class="recent"><h3>最近漁獲</h3><ul id="recent"></ul></div>
      </section>

      <div class="home-ind" aria-hidden="true"></div>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="詳細"><div class="grab"></div><div class="sbody" id="sbody"></div></div>
      <div class="toast" id="toast" role="status"></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var KEY = 'app058:';
function load(k, d){ try { var v = localStorage.getItem(KEY + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch(e){} }
var settings = load('settings', {sound:true});
function haptic(p){ try { navigator.vibrate && navigator.vibrate(p || 8); } catch(e){} }
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var C = {prus:'#1f3b5c', prus2:'#35618a', prus3:'#8fb0c4', paper:'#d8d3c4', paper2:'#e6e2d6', verm:'#c8452c', ink:'#16222e'};

/* ---------- fish ---------- */
// shape: [bodyHeight, tail(f/r/l/n), dorsal(n/long/sail/rib), pattern, back, belly, accent]
var FISH = [
  {id:'mahi', n:'鬼頭刀', tw:'萬魚', r:2, sz:[60,120], sp:[0], t:'day', str:3.2, sh:[26,'f','long','dots','#6f8f3a','#e3c24a','#2f6f8a'], d:'東北角夏天最常見的大魚，上鉤後會躍出水面，頭部方鈍。'},
  {id:'fly', n:'飛魚', tw:'飛烏', r:1, sz:[20,35], sp:[0], t:'day', str:1.2, sh:[14,'f','n','wing','#2f5f8a','#dfe3e2','#35618a'], d:'胸鰭展開像翅膀，能貼著海面滑翔上百公尺。'},
  {id:'cutlass', n:'白帶魚', tw:'白魚', r:2, sz:[60,110], sp:[0,1], t:'night', str:2.2, sh:[9,'n','rib','none','#b9c4c9','#eef0ee','#8fa3ad'], d:'夜裡才靠岸覓食，身體銀白如刀，沒有尾鰭。'},
  {id:'marlin', n:'旗魚', tw:'旗魚', r:4, sz:[150,280], sp:[0], t:'any', str:5.4, sh:[22,'l','sail','none','#1f3b5c','#c9d4d8','#35618a'], d:'東海岸的鏢旗魚是百年技藝。力氣極大，要一收一放。'},
  {id:'mack', n:'鯖魚', tw:'花飛', r:1, sz:[25,40], sp:[0,1], t:'any', str:1.4, sh:[16,'f','n','wave','#2c6a73','#e1e4dc','#1f3b5c'], d:'南方澳的名產，背上有藍黑色波紋，成群洄游。'},
  {id:'porgy', n:'黑鯛', tw:'烏格', r:2, sz:[25,50], sp:[1], t:'any', str:2.4, sh:[30,'f','spiny','none','#3b4652','#9aa3a8','#1f2a33'], d:'礁岩磯釣的頭號目標，警覺心高，咬餌很輕。'},
  {id:'grouper', n:'石斑', tw:'過魚', r:3, sz:[30,80], sp:[1,2], t:'any', str:3.4, sh:[28,'r','spiny','spots','#7a5a3c','#c9a47a','#4a3222'], d:'躲在礁洞裡，一上鉤就往洞裡鑽，要立刻收線。'},

(function(){
  var sy = 0, dy = 0, t0 = 0, on = false;
  sheet.addEventListener('pointerdown', function(e){ if (e.target.closest('button') || ($('sbody').scrollTop > 0 && e.target.closest('.sbody'))) return; on = true; sy = e.clientY; dy = 0; t0 = e.timeStamp; sheet.classList.add('drag'); sheet.setPointerCapture(e.pointerId); });
  sheet.addEventListener('pointermove', function(e){ if (!on) return; dy = e.clientY - sy; sheet.style.transform = 'translateY(' + (dy > 0 ? dy : dy / 6).toFixed(1) + 'px)'; scrim.style.opacity = Math.max(0, 1 - dy / sheet.offsetHeight).toFixed(2); });
  function end(e){ if (!on) return; on = false; sheet.classList.remove('drag'); scrim.style.opacity = ''; if (dy > sheet.offsetHeight * .35 || dy / Math.max(1, e.timeStamp - t0) > .6) closeSheet(); else sheet.style.transform = ''; }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });

var toastT = null;
function toast(m){ var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 1800); }

/* ---------- desktop backdrop: the same print, wide ---------- */
function drawBackdrop(){
  var bc = $('bdc'); if (!bc || getComputedStyle(bc.parentNode).display === 'none') return;
  var r = bc.getBoundingClientRect(); bc.width = Math.round(r.width); bc.height = Math.round(r.height);
  var sW = W, sH = H, sD = DPR, sc = cx, sHud = hudTop;
  W = bc.width; H = bc.height; DPR = 1; cx = bc.getContext('2d'); hudTop = function(){ return H + W * .06; };
  var saveMode = G.mode; G.mode = 'none';
  draw(9000);
  G.mode = saveMode; W = sW; H = sH; DPR = sD; cx = sc; hudTop = sHud;
}

/* ---------- boot ---------- */
function clock(){ var d = new Date(); $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
clock(); setInterval(function(){ clock(); renderSpot(); }, 30000);
if (navigator.getBattery) navigator.getBattery().then(function(b){ $('batt').setAttribute('width', Math.max(2, 15 * b.level).toFixed(1)); }).catch(function(){});
document.addEventListener('visibilitychange', function(){ if (!document.hidden) kick(); else G.charging = false; });
window.addEventListener('resize', function(){ resize(); drawBackdrop(); });
sndIcon(); resize(); renderSpot(); reset(); drawBackdrop(); kick();
})();
</script>
