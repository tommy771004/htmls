<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#56574f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="房貸格局">
<title>房貸格局 · 房貸試算</title>
<meta name="description" content="把物件畫成日式間取り格局圖的房貸試算：逐房描繪平面圖、點房間看它值多少、滑桿試算月付、攤還圖與三組方案比較。收錄於 100 Creative HTML Works（App 029・日式不動產格局圖）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/029-madori-mortgage.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fbfbf9'/%3E%3Cpath d='M12 12h40v40H12z M12 30h22 M34 12v40 M34 38h18' fill='none' stroke='%23262624' stroke-width='3.5'/%3E%3Ccircle cx='46' cy='22' r='7' fill='%23d8432b'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#fbfbf9;--ink:#262624;--ink2:#5d5d58;--line:#9a9a93;--hair:#d5d5cf;--wet:#ecece6;
  --shu:#d8432b;--shu2:#b8341f;--shut:#f8dcd3;--ground:#56574f;--ground2:#4a4b44;
  --font:"YuGothic","Yu Gothic","Hiragino Sans","PingFang TC","Heiti TC",sans-serif;
  --out:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.3,.5,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:500 14px/1.5 var(--font);color:var(--ink);background:var(--ground);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-feature-settings:"palt" 1}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--ground);isolation:isolate}
@media (min-width:521px){
  body{background:var(--paper)}
  .stage{display:flex;align-items:center;justify-content:center;gap:60px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0;background:var(--paper)}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:58px;padding:9px;z-index:1;background:#d6d6d0;
    box-shadow:inset 0 0 0 1px #bdbdb6,inset 0 0 0 3px #e9e9e4,inset 0 0 0 9px #cfcfc9,0 18px 30px -22px rgba(40,40,35,.55)}
  .screen{inset:9px;border-radius:49px}
  .caption{display:block;position:relative;z-index:1;max-width:240px;background:var(--paper);padding:10px 12px 12px}
  .caption h1{font:700 30px/1.15 var(--font);letter-spacing:.04em}
  .caption h1 b{color:var(--shu)}
  .caption p{margin-top:10px;font-size:14px;line-height:1.75;color:var(--ink2)}
}
@media (min-width:521px) and (max-width:860px){.caption{display:none}}

/* ---------- status + top ---------- */
.sb{position:absolute;top:0;left:0;right:0;z-index:30;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 34px;display:flex;align-items:center;justify-content:space-between;color:#fbfbf9;font:700 15px/1 var(--font);pointer-events:none}
.sb .gl{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.sb{display:none}}
.top{position:absolute;left:0;right:0;top:calc(48px + env(safe-area-inset-top));height:52px;display:flex;align-items:center;gap:6px;padding:0 10px 0 20px;color:#fbfbf9;z-index:5}
.top h2{font:700 19px/1 var(--font);letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.top .cnt{font-size:13px;color:#d8d8d1;margin-left:4px;letter-spacing:.02em}
.top .sp{flex:1}
.tbtn{height:44px;min-width:44px;display:grid;place-items:center;padding:0 8px;border-radius:10px;color:#fbfbf9;font-size:14px;transition:background-color .2s}
.tbtn:active{background:rgba(255,255,255,.14)}
.tbtn[aria-pressed=true]{color:#ffd9cf}
.tbtn[aria-pressed=true] .seal{fill:var(--shu)}

/* ---------- flyer pager ---------- */
.pager{position:absolute;left:0;right:0;top:calc(100px + env(safe-area-inset-top));bottom:calc(164px + env(safe-area-inset-bottom));display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:4px 7% 14px;scrollbar-width:none;overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
.flyer{position:relative;flex:0 0 86%;scroll-snap-align:center;background:var(--paper);border-radius:4px;display:flex;flex-direction:column;padding:14px 14px 12px;transition:transform .35s var(--out)}
.flyer.dim{transform:scale(.965)}
.flyer::before,.flyer::after{content:"";position:absolute;width:10px;height:10px;border:solid var(--line);pointer-events:none}
.flyer::before{right:5px;top:5px;border-width:1px 1px 0 0}
.flyer::after{left:5px;bottom:5px;border-width:0 0 1px 1px}
.fhead,.rinfo,.spec,.price{flex:none}
.fhead{display:flex;align-items:flex-start;gap:8px}
.fhead .t{flex:1;min-width:0}
.fhead b{display:block;font-size:16px;font-weight:700;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fhead span{display:block;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{width:44px;height:44px;margin:-8px -8px 0 0;display:grid;place-items:center;border-radius:8px;flex:none}
.more:active{background:var(--wet)}
.plan{position:relative;flex:none;height:220px;margin-top:6px;touch-action:pan-x pan-y}
.ledger{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:44px;column-gap:14px;align-content:start;margin-top:4px}
.ledger button{display:flex;align-items:center;gap:6px;height:44px;font-size:13px;color:var(--ink2);box-shadow:inset 0 -1px 0 var(--hair);text-align:left;white-space:nowrap;overflow:hidden}
.ledger button b{color:var(--ink);font-weight:700;font-size:14px}
.ledger button .v{margin-left:auto;color:var(--ink);font-weight:700}
.ledger button:active{background:var(--wet)}
.ledger button.on b,.ledger button.on .v{color:var(--shu2)}
.plan .pw,.plan .pw svg{position:absolute;inset:0;width:100%;height:100%}
#bd .bw{fill:none;stroke:#6d6d68}
.room{cursor:pointer}
.room .f{transition:fill .25s}
.room.on .f{fill:url(#hs)}
.room.on text{fill:var(--shu2)}
.wall{fill:none;stroke:var(--ink);stroke-linejoin:miter}
.flyer.draw .wall{animation:draw .5s var(--out) backwards;animation-delay:var(--d)}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.stamp{flex:none;width:52px;height:52px;margin:-8px -4px -6px auto;display:grid;place-items:center;border-radius:50%;align-self:center}
.stamp svg{width:50px;height:50px}
.stamp .ink{transition:opacity .2s}
.stamp.on .ink{opacity:1}
.stamp:not(.on) .ink{opacity:0}
.stamp.on .hint{opacity:0}
.stamp.thump svg{animation:thump .42s var(--spring)}
@keyframes thump{0%{transform:scale(1.35) rotate(-14deg)}60%{transform:scale(.94) rotate(-9deg)}100%{transform:scale(1) rotate(-8deg)}}
.stamp svg{transform:rotate(-8deg)}
.rinfo{min-height:22px;font-size:13px;color:var(--ink2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rinfo b{color:var(--shu2);font-weight:700}
.spec{display:flex;gap:12px;margin-top:6px;padding-top:8px;box-shadow:inset 0 1px 0 var(--hair);font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.spec i{font-style:normal;color:var(--ink);font-weight:700}
.price{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.price small{font-size:13px;color:var(--ink2)}
.price strong{font:700 34px/1.1 var(--font);color:var(--shu);letter-spacing:.01em}
.price .u{margin-left:auto;font-size:13px;color:var(--ink2)}
.pnum{position:absolute;left:0;right:0;bottom:calc(166px + env(safe-area-inset-bottom));height:0;display:none}
.empty{flex:0 0 86%;scroll-snap-align:center;display:grid;place-items:center;text-align:center;color:#e8e8e2;font-size:15px;line-height:1.8}

/* ---------- drawer ---------- */
.drawer{position:absolute;left:0;right:0;bottom:0;height:88%;z-index:20;background:var(--paper);border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  transform:translateY(calc(100% - 164px - env(safe-area-inset-bottom)));transition:transform .45s var(--spring);box-shadow:0 -1px 0 rgba(0,0,0,.08)}
.drawer.drag{transition:none}
.dgrip{flex:none;touch-action:none;cursor:grab;padding:8px 20px 0}
.dgrip .h{width:38px;height:5px;border-radius:3px;background:var(--hair);margin:0 auto 8px}
.peek{display:flex;align-items:flex-end;gap:10px}
.peek .l{font-size:13px;color:var(--ink2)}
.peek strong{display:block;font:700 34px/1.05 var(--font);letter-spacing:.01em}
.peek strong small{font-size:15px;margin-left:3px;font-weight:600}
.peek .r{margin-left:auto;text-align:right;font-size:13px;color:var(--ink2);line-height:1.55}
.peek .r b{color:var(--ink)}
.ratio{display:inline-block;font-weight:700}
.ratio.warn{color:var(--shu)}
.tabs{flex:none;display:flex;gap:4px;padding:8px 12px 0}
.tabs button{height:44px;padding:0 12px;font-size:15px;color:var(--line);font-weight:600;border-radius:8px;transition:color .2s}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:700}
.tabs button:active{background:var(--wet)}
.dbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px calc(30px + env(safe-area-inset-bottom));overscroll-behavior:contain;scrollbar-width:none}
.dbody::-webkit-scrollbar{display:none}
.panel[hidden]{display:none}
.panel.in{animation:pin .3s var(--out)}
@keyframes pin{from{transform:translateX(14px)}}
.presets{display:flex;gap:8px;margin:6px 0 4px;overflow-x:auto;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.presets button{flex:none;height:44px;padding:0 14px;border-radius:8px;background:var(--wet);font-size:14px;font-weight:600;color:var(--ink2);transition:background-color .2s,color .2s}
.presets button:active{background:var(--hair)}
.presets button.on{background:var(--ink);color:var(--paper)}
.fld{margin-top:14px}
.fld .lab{display:flex;align-items:baseline;justify-content:space-between;font-size:14px;color:var(--ink2)}
.fld .lab b{font:700 17px/1 var(--font);color:var(--ink)}
.fld .lab b small{font-size:13px;font-weight:600;color:var(--ink2);margin-left:4px}
.rng{position:relative;height:40px}
.rng input{position:absolute;inset:0;width:100%;height:40px;-webkit-appearance:none;appearance:none;background:none;touch-action:none;cursor:pointer;margin:0}
.rng input::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--shu) var(--p,50%),var(--line) var(--p,50%))}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-10px;background:var(--paper);border:2.5px solid var(--shu);border-radius:3px;transform:rotate(45deg)}
.rng input::-moz-range-track{height:2px;background:var(--line)}
.rng input::-moz-range-progress{height:2px;background:var(--shu)}
.rng input::-moz-range-thumb{width:16px;height:16px;background:var(--paper);border:2.5px solid var(--shu);border-radius:3px;transform:rotate(45deg)}
.rng .ticks{position:absolute;left:11px;right:11px;top:26px;height:6px;display:flex;justify-content:space-between;pointer-events:none}
.rng .ticks i{width:1px;height:6px;background:var(--line)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;margin-top:8px;border-radius:8px;background:var(--wet);padding:3px}
.seg button{height:40px;border-radius:6px;font-weight:600;color:var(--ink2);font-size:14px;transition:background-color .2s,color .2s}
.seg button[aria-pressed=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(40,40,35,.18)}
.act{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;margin-top:20px;border-radius:10px;background:var(--ink);color:var(--paper);font-weight:700;font-size:16px;letter-spacing:.04em;transition:background-color .2s}
.act:active{background:#000}
.act.shu{background:var(--shu)}
.act.shu:active{background:var(--shu2)}
.note{margin-top:10px;font-size:13px;color:var(--ink2);line-height:1.7}

.chart{position:relative;margin-top:6px;touch-action:none}
.chart svg{width:100%;height:190px;overflow:visible}
.chart text{font-size:11px;fill:var(--ink2);font-family:var(--font)}
.scrub{min-height:44px;font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.6}
.scrub b{color:var(--ink)}
.scrub i{font-style:normal;color:var(--shu2);font-weight:700}
.tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tot div{background:var(--wet);border-radius:8px;padding:10px 10px 8px}
.tot b{display:block;font:700 18px/1.2 var(--font)}
.tot span{font-size:13px;color:var(--ink2)}
.ms{margin-top:14px}
.ms div{display:flex;justify-content:space-between;align-items:center;min-height:40px;font-size:14px;box-shadow:inset 0 -1px 0 var(--hair)}
.ms div span{color:var(--ink2)}

.cmp{display:grid;margin-top:8px;column-gap:8px}
.cmp .c{display:grid;grid-template-rows:auto;align-content:start}
.cmp .cell{min-height:40px;display:flex;align-items:center;font-size:14px;box-shadow:inset 0 -1px 0 var(--hair);white-space:nowrap;overflow:hidden}
.cmp .hd{min-height:96px;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:4px;padding-top:4px;white-space:normal}
.cmp .hd svg{width:52px;height:44px}
.cmp .hd b{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmp .lb .cell{color:var(--ink2);font-size:13px}
.cmp .best{color:var(--shu2);font-weight:700}
.cmp .del{height:44px;width:100%;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2);border-radius:6px}
.cmp .del:active{background:var(--wet)}
.cmpEmpty{margin-top:20px;font-size:14px;color:var(--ink2);line-height:1.8}

/* ---------- modal sheet ---------- */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(30,30,26,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:86%;display:flex;flex-direction:column;background:var(--paper);border-radius:22px 22px 0 0;
  transform:translateY(calc(100% + 30px));transition:transform .45s var(--spring);touch-action:none}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.sheet .grip{flex:none;padding:8px 0 4px;cursor:grab}
.sheet .grip i{display:block;width:38px;height:5px;border-radius:3px;background:var(--hair);margin:0 auto}
.sheet .sb2{overflow-y:auto;padding:6px 20px calc(24px + env(safe-area-inset-bottom));touch-action:pan-y}
.sheet h4{font:700 19px/1.3 var(--font);letter-spacing:.03em}
.sheet .sub{font-size:13px;color:var(--ink2);margin-top:2px}
.txt{width:100%;height:48px;margin-top:8px;border:0;border-radius:8px;background:var(--wet);padding:0 14px;font-size:16px;outline:0}
.txt:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;font-size:16px;text-align:left;box-shadow:inset 0 -1px 0 var(--hair)}
.row:active{background:var(--wet)}
.row.red{color:var(--shu2);font-weight:700}
.tmpl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.tmpl button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:8px;font-size:13px;color:var(--ink2);transition:background-color .2s}
.tmpl button svg{width:54px;height:46px}
.tmpl button[aria-pressed=true]{background:var(--wet);color:var(--ink);font-weight:700}

.toast{position:absolute;left:14px;right:14px;top:calc(54px + env(safe-area-inset-top));z-index:60;display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 8px 6px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:14px;
  transform:translateY(-150%);visibility:hidden;transition:transform .4s var(--spring),visibility 0s .4s}
.toast.on{transform:none;visibility:visible;transition:transform .4s var(--spring)}
.toast span{flex:1}
.toast button{height:40px;padding:0 12px;border-radius:8px;color:#ffc9bb;font-weight:700}
.toast button:active{background:rgba(255,255,255,.12)}
.homeind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);z-index:70;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .flyer,.drawer,.sheet,.toast{transition:none}
  .flyer.draw .wall,.stamp.thump svg,.panel.in{animation:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hw" width=".22" height=".22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width=".22" height=".22" fill="#ecece6"/><line x1="0" y1="0" x2="0" y2=".22" stroke="#cfcfc8" stroke-width=".04"/></pattern>
    <pattern id="hs" width=".26" height=".26" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width=".26" height=".26" fill="#fbe7e1"/><line x1="0" y1="0" x2="0" y2=".26" stroke="#eea796" stroke-width=".07"/></pattern>
    <pattern id="hb" width=".24" height=".24" patternUnits="userSpaceOnUse"><rect width=".24" height=".24" fill="#f5f5f1"/><circle cx=".12" cy=".12" r=".028" fill="#b9b9b1"/></pattern>
  </defs>
</svg>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><svg id="bd" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"></svg></div>

  <div class="device">
    <div class="screen" id="screen">
      <header class="sb">
        <span id="clock">9:41</span>
        <span class="gl" aria-hidden="true">
          <svg width="18" height="12" viewBox="0 0 18 12"><path d="M1 11h3M6 11V8M11 11V5M16 11V1" stroke="#fbfbf9" stroke-width="2.4" stroke-linecap="square"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M1 4.5a10 10 0 0 1 14 0M3.6 7.2a6.3 6.3 0 0 1 8.8 0" fill="none" stroke="#fbfbf9" stroke-width="1.8"/><rect x="6.5" y="9" width="3" height="3" fill="#fbfbf9"/></svg>
          <svg width="27" height="12" viewBox="0 0 27 12"><rect x=".8" y=".8" width="22.4" height="10.4" rx="2" fill="none" stroke="#fbfbf9" stroke-width="1.4"/><rect x="24" y="4" width="2" height="4" fill="#fbfbf9"/><rect id="batt" x="2.6" y="2.6" width="15" height="6.8" fill="#fbfbf9"/></svg>
        </span>
      </header>
      <div class="top">
        <h2><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M2 2h18v18H2z M2 11h10 M12 2v18 M12 14h8" fill="none" stroke="#fbfbf9" stroke-width="2"/><rect x="14.5" y="4.5" width="3.4" height="3.4" fill="#f08a73"/></svg>房貸格局<span class="cnt num" id="cnt">4 件</span></h2>
        <span class="sp"></span>
        <button class="tbtn" id="favBtn" aria-pressed="false" aria-label="只看蓋了候補章的物件"><svg width="24" height="24" viewBox="0 0 24 24"><circle class="seal" cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="5.6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button class="tbtn" id="addBtn" aria-label="新增物件"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 3h18v18H3z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.5v9M7.5 12h9" stroke="currentColor" stroke-width="2"/></svg></button>
      </div>

      <div class="pager" id="pager" aria-label="物件"></div>

      <section class="drawer" id="drawer" aria-label="房貸試算">
        <div class="dgrip" id="dgrip">
          <div class="h"></div>
          <div class="peek">
            <div><div class="l" id="peekL">每月應繳</div><strong class="num" id="pay">0<small>元</small></strong></div>
            <div class="r" id="peekR"></div>

// drawer detents
var drawer = $('drawer'), detent = 0;
function detentY(d){ var H = drawer.offsetHeight, peek = 164 + safeB(); return d === 0 ? H - peek : d === 1 ? H * .42 : 0; }
function safeB(){ var t = document.createElement('div'); t.style.cssText = 'position:absolute;height:env(safe-area-inset-bottom)'; document.body.appendChild(t); var v = t.offsetHeight; t.remove(); return v; }
function snap(d){ detent = d; drawer.style.transform = 'translateY(' + detentY(d) + 'px)'; }
(function(){
  var grip = $('dgrip'), sy = 0, y0 = 0, dy = 0, t0 = 0, drag = false, moved = false;
  function down(e){ drag = true; moved = false; sy = e.clientY; y0 = detentY(detent); dy = 0; t0 = e.timeStamp; drawer.classList.add('drag'); try { grip.setPointerCapture(e.pointerId); } catch(x){} }
  grip.addEventListener('pointerdown', down);
  grip.addEventListener('pointermove', function(e){ if (!drag) return; dy = e.clientY - sy; if (Math.abs(dy) > 4) moved = true; var y = Math.max(-20, y0 + dy); drawer.style.transform = 'translateY(' + y + 'px)'; });
  function up(e){
    if (!drag) return; drag = false; drawer.classList.remove('drag');
    if (!moved){ snap(detent === 0 ? 1 : detent === 1 ? 2 : 0); haptic(5); return; }
    var v = dy / Math.max(1, e.timeStamp - t0), y = y0 + dy, best = 0, bd = 1e9;
    if (Math.abs(v) > .5) best = v > 0 ? Math.max(0, detent - 1) : Math.min(2, detent + 1);
    else [0, 1, 2].forEach(function(d){ var dd = Math.abs(detentY(d) - y); if (dd < bd){ bd = dd; best = d; } });
    snap(best); haptic(5);
  }
  grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
})();

// ---------- modal sheet ----------
var sheet = $('sheet'), scrim = $('scrim'), lastFocus = null;
function openSheet(html){
  lastFocus = document.activeElement; $('sheetBody').innerHTML = html; sheet.style.transform = '';
  sheet.classList.add('on'); scrim.classList.add('on'); haptic(6);
  var f = sheet.querySelector('button,input'); if (f) f.focus({preventScroll:true});
}
function closeSheet(){ if (!sheet.classList.contains('on')) return; sheet.classList.remove('on', 'drag'); sheet.style.transform = ''; scrim.classList.remove('on'); if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); }
scrim.addEventListener('click', closeSheet);
(function(){
  var sy = 0, dy = 0, t0 = 0, dragging = false;
  sheet.addEventListener('pointerdown', function(e){ if (e.target.closest('button,input,select,.rng')) return; if ($('sheetBody').scrollTop > 0 && e.target.closest('.sb2')) return; dragging = true; sy = e.clientY; dy = 0; t0 = e.timeStamp; sheet.classList.add('drag'); try { sheet.setPointerCapture(e.pointerId); } catch(x){} });
  sheet.addEventListener('pointermove', function(e){ if (!dragging) return; dy = e.clientY - sy; var y = dy > 0 ? dy : dy / 6; sheet.style.transform = 'translateY(' + y + 'px)'; scrim.style.opacity = Math.max(0, 1 - dy / sheet.offsetHeight); });
  function end(e){ if (!dragging) return; dragging = false; sheet.classList.remove('drag'); scrim.style.opacity = ''; var v = dy / Math.max(1, e.timeStamp - t0); if (dy > sheet.offsetHeight * .35 || v > .6) closeSheet(); else sheet.style.transform = ''; }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();

// ---------- toast ----------
var toastT = null, undoFn = null;
function toast(msg, undo){
  $('toastT').textContent = msg; undoFn = undo || null; $('toastU').hidden = !undo;
  $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ $('toast').classList.remove('on'); undoFn = null; }, undo ? 4200 : 2200);
}
$('toastU').addEventListener('click', function(){ if (undoFn){ undoFn(); undoFn = null; haptic(8); } $('toast').classList.remove('on'); });

// mouse drag-to-scroll for horizontal snap rails (touch scrolls natively)
function dragRail(el, itemSel){
  var on = false, sx = 0, sl = 0, moved = false;
  el.addEventListener('pointerdown', function(e){ if (e.pointerType !== 'mouse' || e.button !== 0) return; on = true; moved = false; sx = e.clientX; sl = el.scrollLeft; });
  window.addEventListener('pointermove', function(e){ if (!on) return; var dx = e.clientX - sx; if (!moved && Math.abs(dx) > 6){ moved = true; el.style.scrollSnapType = 'none'; } if (moved) el.scrollLeft = sl - dx; });
  window.addEventListener('pointerup', function(e){
    if (!on) return; on = false; if (!moved) return;
    var dx = e.clientX - sx, items = el.querySelectorAll(itemSel), mid = el.scrollLeft + el.clientWidth / 2, best = null, bd = 1e9, dir = dx < -30 ? 1 : dx > 30 ? -1 : 0, curI = 0;
    items.forEach(function(it, i){ var c = it.offsetLeft + it.offsetWidth / 2, d = Math.abs(c - (sl + el.clientWidth / 2)); if (d < bd){ bd = d; curI = i; } });
    var target = items[Math.max(0, Math.min(items.length - 1, curI + dir))];
    el.style.scrollSnapType = '';
    if (target) el.scrollTo({left:target.offsetLeft + target.offsetWidth / 2 - el.clientWidth / 2, behavior:reduce ? 'auto' : 'smooth'});
    el.addEventListener('click', function kill(ev){ ev.stopPropagation(); ev.preventDefault(); }, {capture:true, once:true});
    setTimeout(function(){ moved = false; }, 0);
  });
}
