<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cdc7bb">

<meta name="mobile-web-app-capable" content="yes">

<title>數獨 · SD 81</title>
<meta name="description" content="做成 Dieter Rams 計算機的數獨：液晶窗裡的九宮格、圓形按鍵、鉛筆標記、即時錯誤提示、提示與三段難度滑鍵。收錄於 100 Creative HTML Works（App 059・Dieter Rams 計算機）。">

<style>
:root{
  --body:#cdc7bb;
  --body-2:#c3bcaf;
  --plate:#2c2925;
  --key:#37332e;
  --key-hi:#4a453f;
  --fkey:#e4dfd5;
  --fkey-2:#d6d0c4;
  --orange:#e2682b;
  --orange-2:#c9561d;
  --green:#6b8f47;
  --lcd:#c3c8b0;
  --lcd-2:#b4b99f;
  --lcd-ink:#23261d;
  --lcd-user:#3a6a3e;
  --lcd-err:#c4501a;
  --ink:#2a2723;
  --ink-2:#5b554c;
  --hn:"Helvetica Neue","Helvetica","PingFang TC",system-ui,sans-serif;
  --din:"DIN Alternate","DIN Condensed","Helvetica Neue",system-ui,sans-serif;
  --out:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.3,.5,1);
  --D:350px; --K:64px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.4 var(--hn);color:var(--ink);background:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
svg{display:block}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--body);isolation:isolate}
@media (min-width:521px){
  body{background:#b3ad9f}
  .stage{display:flex;align-items:center;justify-content:center;gap:70px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:48px;padding:8px;z-index:1;background:#2c2925;box-shadow:inset 0 0 0 1px #4d4943,0 12px 22px -12px rgba(50,40,28,.7)}
  .screen{inset:8px;border-radius:40px}
  .caption{display:block;position:relative;z-index:1;max-width:250px}
  .caption h1{font:700 44px/1 var(--hn);letter-spacing:-.01em;color:var(--ink)}
  .caption h1 span{font:700 20px/1 var(--din);color:var(--orange);margin-left:10px;letter-spacing:.04em}
  .caption p{margin-top:16px;font:16px/1.65 var(--hn);color:#3d3933}
}
@media (min-width:521px) and (max-width:880px){.caption{display:none}}

/* body texture: fine brushed lines behind everything */
.brush{position:absolute;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,.018) 1px 3px)}

.status{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;height:calc(46px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 32px;font:600 15px/1 var(--hn);color:var(--ink);pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}

.app{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;padding:calc(46px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom))}

/* top strip */
.top{width:100%;padding:0 4px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;height:62px}
.brand b{display:block;font:700 22px/1 var(--hn);letter-spacing:-.01em;white-space:nowrap}
.brand span{display:block;margin-top:4px;font:700 12px/1 var(--din);color:var(--ink-2);letter-spacing:.08em}
.mini{justify-self:center;height:40px;min-width:118px;border-radius:5px;background:#231f1b;padding:4px;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.mini .in{height:100%;border-radius:3px;background:linear-gradient(180deg,var(--lcd),var(--lcd-2));display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 9px;font:700 18px/1 var(--din);color:var(--lcd-ink);font-variant-numeric:tabular-nums}
.mini .in small{font:600 11px/1 var(--hn);color:#4b4f3d;margin-right:3px}
.slide{position:relative;width:118px;height:48px}
.slide .lab{position:absolute;top:2px;left:0;right:0;display:flex;justify-content:space-between;padding:0 8px;font:600 12px/1 var(--hn);color:var(--ink-2)}
.slide .lab span[aria-current=true]{color:var(--ink)}
.slide .trk{position:absolute;left:4px;right:4px;bottom:6px;height:22px;border-radius:11px;background:#2c2925;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.slide .kn{position:absolute;bottom:8px;left:6px;width:38px;height:18px;border-radius:9px;background:var(--fkey);box-shadow:0 1px 1px rgba(0,0,0,.4),inset 0 1px 0 #fff;transition:transform .35s var(--spring)}
.slide .kn::after{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:2px;margin-left:-1px;border-radius:1px;background:var(--orange)}
.slide button{position:absolute;bottom:0;height:48px;width:33.3%}
.slide button:nth-of-type(1){left:0}.slide button:nth-of-type(2){left:33.3%}.slide button:nth-of-type(3){left:66.6%}

/* display */
.win{margin-top:6px;width:var(--D);height:var(--D);padding:9px;border-radius:12px;background:#231f1b;box-shadow:inset 0 2px 3px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.45)}
.lcd{position:relative;width:100%;height:100%;border-radius:4px;background:linear-gradient(170deg,#c8cdb5,var(--lcd) 40%,var(--lcd-2));overflow:hidden;touch-action:none}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.18),rgba(255,255,255,0) 36%)}
.board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr)}
.c{position:relative;display:grid;place-items:center;font:700 calc(var(--D) / 14.5)/1 var(--din);color:var(--lcd-ink);font-variant-numeric:tabular-nums;border-right:1px solid rgba(35,38,29,.22);border-bottom:1px solid rgba(35,38,29,.22)}
.c:nth-child(9n){border-right:0}
.c:nth-child(n+73){border-bottom:0}
.c:nth-child(9n+3),.c:nth-child(9n+6){border-right:2px solid var(--lcd-ink)}
.c:nth-child(n+19):nth-child(-n+27),.c:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--lcd-ink)}
.c.u{color:var(--lcd-user);font-weight:400}
.c.peer{background:rgba(35,38,29,.07)}
.c.same{background:rgba(35,38,29,.17)}
.c.sel{background:var(--lcd-ink);color:var(--lcd)}
.c.sel.u{color:#d6dcc0}
.c.err{color:var(--lcd-err)}
.c.sel.err{color:#ff9a62}
.c.hint::before{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:var(--orange)}
.c .n{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font:700 calc(var(--D) / 36)/1 var(--din);color:#3e4433}
.c .n i{font-style:normal;display:grid;place-items:center}
.c.sel .n{color:#cfd5b8}
.c.pop{animation:pop .35s var(--out)}
@keyframes pop{from{transform:scale(.7)}}
.lcd.flash .board{animation:flash .9s steps(2) 2}
@keyframes flash{50%{opacity:.25}}
.done{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(195,200,176,.94);text-align:center;color:var(--lcd-ink)}
.lcd.won .done{display:flex}
.done b{font:700 calc(var(--D) / 5.4)/1 var(--din);letter-spacing:.02em}
.done span{font:600 15px/1.5 var(--hn)}

/* keypad */
.pad{margin-top:auto;width:var(--D);display:grid;grid-template-columns:repeat(4,var(--K));justify-content:space-between;row-gap:calc(var(--K) * .2);padding:0 calc(var(--K) * .08)}
.k{position:relative;width:var(--K);height:var(--K);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,var(--key-hi),var(--key) 62%);color:#efe9dd;
  box-shadow:0 2px 2px rgba(40,30,20,.45),inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 3px rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
.k:active,.k.down{transform:translateY(1.5px);box-shadow:0 .5px .5px rgba(40,30,20,.5),inset 0 2px 4px rgba(0,0,0,.4)}
.k .d{font:700 calc(var(--K) * .42)/1 var(--din);margin-top:2px}
.k .r{position:absolute;bottom:calc(var(--K) * .13);left:0;right:0;display:flex;justify-content:center;gap:2px}
.k .r i{width:3px;height:3px;border-radius:50%;background:rgba(239,233,221,.5)}
.k.full .d{color:rgba(239,233,221,.32)}
.k.f{background:radial-gradient(circle at 50% 38%,#f1ede5,var(--fkey) 64%);color:var(--ink);box-shadow:0 2px 2px rgba(40,30,20,.35),inset 0 1px 0 #fff,inset 0 -2px 3px rgba(80,70,55,.18)}
.k.f:active,.k.f.down{box-shadow:0 .5px .5px rgba(40,30,20,.4),inset 0 2px 4px rgba(80,70,55,.35)}
.k.o{background:radial-gradient(circle at 50% 38%,#ee7c43,var(--orange) 64%);color:#fff7ee}
.k .ic{width:calc(var(--K) * .42);height:calc(var(--K) * .42)}
.k.f,.k.o{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--K) * .05)}
.k .lb{white-space:nowrap;font:600 max(11px,calc(var(--K) * .17))/1 var(--hn);color:var(--ink-2)}
.k.o .lb{color:#fff1e4}
.k.pen.on .lb{color:#eef4df}
.k.f .ic,.k.o .ic{width:calc(var(--K) * .36);height:calc(var(--K) * .36)}
.k.pen.on{background:radial-gradient(circle at 50% 38%,#7fa35a,var(--green) 64%);color:#f4f7ea}
.k.pen .led{position:absolute;top:calc(var(--K) * .14);right:calc(var(--K) * .2);width:6px;height:6px;border-radius:50%;background:#8a8478}
.k.pen.on .led{background:#d8f0a8}
.pad .row4{display:contents}

/* sheet */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(40,34,26,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:var(--fkey);border-radius:24px 24px 0 0;padding:8px 22px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .5s var(--spring),visibility 0s .5s;touch-action:none;box-shadow:0 -1px 0 #fff inset}
.sheet.on{transform:none;visibility:visible;transition:transform .5s var(--spring)} /* visibility waits for the slide-out, so closing animates too */
.sheet.drag{transition:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:rgba(42,39,35,.22);margin:4px auto 16px}
.sheet h4{font:700 22px/1.2 var(--hn)}
.sheet .sub{margin-top:4px;color:var(--ink-2);font-size:14px}
.tbl{margin-top:16px;display:grid;grid-template-columns:1.1fr repeat(3,1fr);border-radius:10px;overflow:hidden;background:#d8d2c6}
.tbl div{padding:11px 8px;font-size:14px;color:var(--ink-2)}
.tbl div.v{font:700 19px/1 var(--din);color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
.tbl div.h{font-weight:700;color:var(--ink);text-align:center}
.tbl div:nth-child(8n+5),.tbl div:nth-child(8n+6),.tbl div:nth-child(8n+7),.tbl div:nth-child(8n+8){background:#cfc9bc}
.opt{display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:12px;margin-top:4px}
.opt small{display:block;font-size:13px;color:var(--ink-2)}
.tog{position:relative;width:64px;height:32px;border-radius:16px;background:#2c2925;flex:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:30px;height:26px;border-radius:13px;background:var(--fkey);box-shadow:0 1px 1px rgba(0,0,0,.4),inset 0 1px 0 #fff;transition:transform .35s var(--spring)}
.tog::before{content:"";position:absolute;right:12px;top:12px;width:8px;height:8px;border-radius:50%;background:#5c574f;transition:background-color .3s}
.tog[aria-checked=true]::after{transform:translateX(28px)}
.tog[aria-checked=true]::before{left:12px;right:auto;background:#9fd06a}
.bar{display:flex;gap:12px;margin-top:18px}
.bar button{flex:1;height:52px;border-radius:26px;font:700 16px/1 var(--hn);transition:transform .1s}
.bar button:active{transform:translateY(1px)}
.bar .go{background:var(--orange);color:#fff7ee}
.bar .go:active{background:var(--orange-2)}
.bar .plain{flex:.7;color:#a3451a}
.bar .plain:active{background:rgba(226,104,43,.1)}

.toast{position:absolute;left:50%;top:calc(52px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-150px);transition:transform .4s var(--spring);background:#2c2925;color:#efe9dd;padding:12px 18px;border-radius:12px;font:600 14px/1.3 var(--hn);white-space:nowrap;display:flex;align-items:center;gap:12px}
.toast.on{transform:translate(-50%,0)}
.homebar{position:absolute;left:50%;bottom:calc(7px + env(safe-area-inset-bottom)*.3);width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(42,39,35,.55);z-index:55;pointer-events:none}
@media (display-mode:standalone){.homebar{display:none}}
.toast button{color:#f39a64;font-weight:700;min-height:32px}
.toast button[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  .c.pop,.lcd.flash .board{animation:none}
  .k,.slide .kn,.sheet,.toast,.tog::after{transition-duration:.01s}
  .k:active,.k.down{transform:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><svg id="bd" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"></svg></div>
  <div class="caption"><h1>數獨<span>SD 81</span></h1><p>九宮格裝進計算機的液晶窗。圓鍵按下去會陷一點，綠鍵是鉛筆，橙鍵是檢查。</p></div>
  <div class="device">
    <div class="screen" id="screen">
      <div class="brush"></div>
      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="g">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><circle cx="2" cy="10" r="2"/><circle cx="7" cy="8" r="2" /><circle cx="12" cy="6" r="2"/><circle cx="16.5" cy="4" r="1.5" opacity=".35"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><circle cx="8" cy="10" r="2"/><circle cx="3" cy="5.5" r="1.6"/><circle cx="8" cy="3.5" r="1.6"/><circle cx="13" cy="5.5" r="1.6"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".7" y=".7" width="22" height="10.6" rx="5.3" fill="none" stroke="currentColor" stroke-width="1.4"/><rect id="batt" x="3" y="3" width="16" height="6" rx="3" fill="#6b8f47"/><circle cx="24.8" cy="6" r="1.2" fill="currentColor"/></svg>
        </span>
      </div>

      <main class="app" id="app">
        <div class="top">
          <div class="brand"><b>數獨</b><span>SD 81</span></div>
          <div class="mini" aria-live="off"><div class="in"><span id="timer">00:00</span><span><small>錯</small><span id="miss">0</span></span></div></div>
          <div class="slide" id="slide" role="radiogroup" aria-label="難度">
            <div class="lab"><span data-l="0">易</span><span data-l="1">中</span><span data-l="2">難</span></div>
            <div class="trk"></div><div class="kn" id="kn"></div>
            <button role="radio" data-d="0" aria-label="易"></button><button role="radio" data-d="1" aria-label="中"></button><button role="radio" data-d="2" aria-label="難"></button>
          </div>
        </div>

        <div class="win"><div class="lcd" id="lcd"><div class="board" id="board" role="grid" aria-label="數獨盤面"></div><div class="done" id="done"><b id="doneT">00:00</b><span id="doneS"></span></div></div></div>

        <div class="pad" id="pad"></div>
      </main>

      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sT"><div class="grab"></div><div id="sheetBody"></div></div>
      <div class="toast" id="toast" role="status"><span id="toastT"></span><button id="toastB" hidden>復原</button></div>
      <div class="homebar" aria-hidden="true"></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var KEY = 'app059:';
function load(k, d){ try { var v = localStorage.getItem(KEY + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v){ try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var prefs = load('prefs', {live:true, sound:true, hap:true, diff:1});
function haptic(p){ if (!prefs.hap) return; try { navigator.vibrate && navigator.vibrate(p || 8); } catch (e) {} }
function tick(){ var d = new Date(); $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
tick(); setInterval(tick, 15000);
if (navigator.getBattery) navigator.getBattery().then(function(b){ $('batt').setAttribute('width', Math.max(6, 16 * b.level).toFixed(1)); }).catch(function(){});

/* ---------- audio: calculator clicks and beeps ---------- */
var AC = null;
function ac(){ if (!prefs.sound) return null; if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (AC.state === 'suspended') AC.resume(); return AC; }
function click(heavy){
  var a = ac(); if (!a) return; var t = a.currentTime;
  var n = a.sampleRate * .03, b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0); for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 6);
  var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.value = heavy ? 1400 : 2600; f.Q.value = 2; g.gain.value = heavy ? .5 : .35;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
}
function beep(freqs, len, type){
  var a = ac(); if (!a) return; var t = a.currentTime;
  freqs.forEach(function(fq, i){ var o = a.createOscillator(), g = a.createGain(); o.type = type || 'square'; o.frequency.value = fq; g.gain.setValueAtTime(.0001, t + i * len); g.gain.exponentialRampToValueAtTime(.05, t + i * len + .01); g.gain.exponentialRampToValueAtTime(.0001, t + (i + .9) * len); o.connect(g); g.connect(a.destination); o.start(t + i * len); o.stop(t + (i + 1) * len); });
}

/* ---------- sudoku core ---------- */
var BOX = []; for (var i = 0; i < 81; i++) BOX[i] = Math.floor(Math.floor(i / 9) / 3) * 3 + Math.floor(i % 9 / 3);
var PEERS = [];
for (var p = 0; p < 81; p++){ var s = []; for (var q = 0; q < 81; q++) if (q !== p && (Math.floor(q / 9) === Math.floor(p / 9) || q % 9 === p % 9 || BOX[q] === BOX[p])) s.push(q); PEERS.push(s); }
function bits(n){ var c = 0; while (n){ n &= n - 1; c++; } return c; }
function countSol(g0, limit){
  var g = g0.slice(), R = [0,0,0,0,0,0,0,0,0], C = R.slice(), B = R.slice(), cnt = 0;
