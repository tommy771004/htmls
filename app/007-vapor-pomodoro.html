<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9468f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FOCUS.EXE">
<title>ＦＯＣＵＳ．ＥＸＥ · 專注蕃茄鐘</title>
<meta name="description" content="一台跑在九八年桌面上的蕃茄鐘：卡帶轉盤就是進度條，專注聽 A 面、休息翻到 B 面，還有即時合成的 lofi 和弦、任務清單與統計表。收錄於 100 Creative HTML Works（App 007・蒸汽波 Win98 卡帶）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/007-vapor-pomodoro.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' shape-rendering='crispEdges'%3E%3Crect width='64' height='64' fill='%23d9468f'/%3E%3Crect y='40' width='64' height='24' fill='%231f9e97'/%3E%3Crect x='6' y='14' width='52' height='34' fill='%23c0c0c0'/%3E%3Crect x='6' y='14' width='52' height='2' fill='%23fff'/%3E%3Crect x='10' y='18' width='44' height='12' fill='%23ff9ecf'/%3E%3Crect x='14' y='33' width='36' height='11' fill='%23202020'/%3E%3Crect x='18' y='35' width='7' height='7' fill='%23fff'/%3E%3Crect x='39' y='35' width='7' height='7' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --grey:#c0c0c0;--hi:#ffffff;--lo:#808080;--dk:#1e1e1e;
  --pink:#ff6fb5;--pink2:#ff9ecf;--rose:#d9468f;--teal:#2ec4b6;--teal2:#008080;--deep:#0b3d40;
  --serif:"Times New Roman",Times,"Songti TC",serif;
  --ui:Tahoma,"PingFang TC","Heiti TC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.4 var(--ui);color:#000;background:var(--rose);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:1px dotted #000;outline-offset:-4px}
svg{display:block}
.px{shape-rendering:crispEdges}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;overflow:clip;isolation:isolate;background:var(--rose)}
@media (min-width:521px){
  .stage{display:flex;align-items:center;justify-content:center;gap:64px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:44px;padding:13px;z-index:1;
    background:linear-gradient(135deg,#e9e6df 0%,#c9c5bb 40%,#b5b0a4 100%);
    box-shadow:inset 2px 2px 0 #fff,inset -2px -2px 0 #8a857a,4px 14px 20px -12px rgba(60,10,40,.55)}
  .device::before{content:"FOCUS 98";position:absolute;left:0;right:0;bottom:-2px;text-align:center;font:italic 700 9px/1 var(--serif);letter-spacing:.3em;color:#8a857a}
  .screen{inset:13px;border-radius:32px}
  .caption{display:block;position:relative;z-index:1;max-width:280px;color:#fff}
  .caption h1{font:italic 400 44px/1 var(--serif);letter-spacing:.06em;text-shadow:3px 0 0 var(--teal2)}
  .caption p{margin-top:16px;font-size:15px;line-height:1.7;color:#fff}
}
@media (min-width:521px) and (max-width:880px){.caption{display:none}}

/* wallpaper */
.wall{position:absolute;inset:0;z-index:0}
.wall svg{width:100%;height:100%}
.track{position:absolute;left:0;right:0;height:26px;top:-30px;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.12),rgba(255,255,255,0));animation:trk 9s linear infinite}
@keyframes trk{to{transform:translateY(900px)}}

.status{position:absolute;top:0;left:0;right:0;z-index:30;height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 26px 0 30px;display:flex;align-items:center;justify-content:space-between;font:700 15px/1 var(--ui);color:#fff;pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}

/* desktop icons */
.icons{display:none;position:absolute;left:10px;top:calc(56px + env(safe-area-inset-top));z-index:2;display:grid;grid-template-columns:repeat(4,78px);gap:6px}
.dicon{width:78px;min-height:76px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:12px;text-align:center;padding:4px 2px}
.dicon svg{width:36px;height:36px}
.dicon span{padding:1px 3px;text-shadow:1px 1px 0 #000}
.dicon:active span,.dicon:focus-visible span{background:var(--teal2);text-shadow:none}

/* bevels */
.bev{background:var(--grey);box-shadow:inset -1px -1px 0 #000,inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--lo),inset 2px 2px 0 #dfdfdf}
.sunk{box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi),inset 2px 2px 0 #000,inset -2px -2px 0 #dfdfdf}
.btn{min-height:44px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.btn:active,.btn[aria-pressed=true]{box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--lo),inset -2px -2px 0 #dfdfdf;padding-top:2px}
.btn svg{width:16px;height:16px}

/* windows */
.win{position:absolute;left:8px;right:8px;top:var(--wt,150px);bottom:calc(58px + env(safe-area-inset-bottom));z-index:5;display:none;flex-direction:column;padding:3px}
.win.on{display:flex}
.win.restore{animation:restore .32s steps(6,end)}
@keyframes restore{from{transform:translate(var(--ox,0),var(--oy,300px)) scale(.15)}}
.win.vhs{animation:vhs .42s steps(1)}
@keyframes vhs{0%{transform:translateX(3px);filter:drop-shadow(2px 0 0 #ff4fb0) drop-shadow(-2px 0 0 #2ec4b6)}25%{transform:translateX(-4px) skewX(2deg)}50%{transform:translateX(2px);filter:drop-shadow(-2px 0 0 #ff4fb0) drop-shadow(2px 0 0 #2ec4b6)}75%{transform:translateX(-1px)}100%{transform:none;filter:none}}
.tbar{flex:none;height:34px;display:flex;align-items:center;gap:6px;padding:0 3px 0 6px;color:#fff;font:700 14px/1 var(--ui);background:linear-gradient(90deg,#7a1f5c,#d9468f 60%,#ff9ecf)}
.win:not(.front) .tbar{background:linear-gradient(90deg,#808080,#b5b5b5)}
.tbar svg.ti{width:18px;height:18px;flex:none}
.tbar .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.wb{position:relative;width:30px;height:26px;display:grid;place-items:center;color:#000}
.wb::after{content:"";position:absolute;inset:-9px -3px}
.wb svg{width:12px;height:12px}
.wb:active{box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--lo)}
.menu{flex:none;display:flex;gap:2px;padding:2px 4px;font-size:13px}
.menu span{padding:4px 7px}
.menu u{text-decoration:underline}
.client{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin:2px;background:var(--grey);scrollbar-width:none}
.client::-webkit-scrollbar{display:none}

/* focus window */
.deck{padding:12px 12px 10px;display:flex;flex-direction:column;gap:10px;min-height:100%;justify-content:space-between}
.today{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;background:#fff;font-size:13px;min-height:44px}
.today .rolls{display:flex;gap:3px;flex-wrap:wrap}
.today svg{width:22px;height:14px}
.tape{position:relative;perspective:900px}
.tape .flip{position:relative;transition:transform .7s cubic-bezier(.5,0,.3,1);transform-style:preserve-3d}
.tape.b .flip{transform:rotateY(180deg)}
.tape svg.cas{width:100%;height:auto;backface-visibility:hidden}
.tape svg.back{position:absolute;inset:0;transform:rotateY(180deg)}
.cas text{font-family:var(--serif)}
.lcd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:#111}
.time{font:italic 400 58px/1 var(--serif);color:var(--pink2);letter-spacing:.04em;font-variant-numeric:tabular-nums;text-shadow:2px 0 0 rgba(46,196,182,.85)}
.lcdr{text-align:right;color:#bdbdbd;font-size:12px;line-height:1.5}
.lcdr b{display:block;font:italic 700 17px/1.2 var(--serif);color:var(--teal);letter-spacing:.06em}
.cyc{display:flex;gap:3px;justify-content:flex-end;margin-top:4px}
.cyc svg{width:18px;height:12px}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.key{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#222}
.key svg{width:18px;height:18px}
.key:active,.key[aria-pressed=true]{box-shadow:inset 1px 1px 0 #000,inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--lo),inset -2px -2px 0 #dfdfdf;background:#b4b4b4}
.key[aria-pressed=true]{color:var(--rose)}
.nowtask{display:flex;align-items:center;gap:8px;padding:0 2px;font-size:13px;min-height:44px}
.nowtask .l{color:#444;flex:none}
.nowtask button{flex:1;min-width:0;text-align:left;min-height:34px;padding:0 8px;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* tasks window */
.tools{display:flex;gap:4px;padding:6px}
.lv{margin:0 6px 8px;background:#fff}
.lvh{display:grid;grid-template-columns:44px 1fr 84px;font-size:12px}
.lvh span{padding:6px 6px;background:var(--grey);box-shadow:inset -1px -1px 0 #000,inset 1px 1px 0 var(--hi)}
.item{position:relative;overflow:hidden;touch-action:pan-y}
.row{position:relative;display:grid;grid-template-columns:44px 1fr 84px;align-items:center;min-height:48px;background:#fff;transition:transform .25s steps(4,end)}
.item.drag .row{transition:none}
.row.sel{background:var(--teal2);color:#fff}
.chk{width:44px;height:48px;display:grid;place-items:center}
.chk i{display:block;width:16px;height:16px;background:#fff;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi),inset 2px 2px 0 #000}
.chk svg{width:10px;height:10px;margin:3px}
.nm{min-height:48px;display:flex;align-items:center;gap:6px;text-align:left;font-size:14px;padding-right:4px;min-width:0}
.nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm .play{width:10px;height:10px;flex:none}
.done .nm span{text-decoration:line-through;text-decoration-thickness:1px;color:#777}
.row.sel.done .nm span{color:#cfe}
.est{display:flex;gap:2px;flex-wrap:wrap;padding-right:6px}
.est svg{width:15px;height:10px}
.del{position:absolute;right:0;top:0;bottom:0;width:84px;background:var(--pink);color:#000;font-size:13px;display:flex;align-items:center;justify-content:center}
.empty{padding:22px 12px;text-align:center;color:#444;font-size:13px}
.note{margin:0 8px 10px;font-size:12px;color:#333}

/* stats window */
.fx{display:flex;align-items:center;gap:6px;margin:6px;font-size:13px}
.fx .nb{width:48px;padding:4px 6px;background:#fff}
.fx .fv{flex:1;padding:4px 8px;background:#fff;min-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheetgrid{margin:0 6px;background:#fff;display:grid;grid-template-columns:28px 1fr 1fr;font-size:13px}
.sheetgrid>*{padding:6px 6px;border-right:1px solid #c8c8c8;border-bottom:1px solid #c8c8c8;min-height:30px}
.sheetgrid .h{background:var(--grey);text-align:center;border-color:#808080;font-size:12px}
.sheetgrid .v{text-align:right;font-variant-numeric:tabular-nums}
.sheetgrid .v.big{font:italic 700 18px/1 var(--serif);color:var(--rose)}
.chart{margin:8px 6px 10px;background:#fff;padding:8px 6px 4px}
.chart svg{width:100%;height:150px}
.chart .bar{cursor:pointer}

/* bin */
.binrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;background:#fff;margin:0 6px;border-bottom:1px solid #ddd;font-size:14px}

/* taskbar */
.taskbar{position:absolute;left:0;right:0;bottom:0;z-index:20;height:calc(52px + env(safe-area-inset-bottom));padding:4px 4px env(safe-area-inset-bottom);display:flex;gap:4px;align-items:flex-start}
.taskbar::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:#fff}
.start{height:44px;padding:0 10px;display:flex;align-items:center;gap:6px;font:700 14px/1 var(--ui);flex:none}
.start svg{width:20px;height:20px}
.tasks{flex:1;min-width:0;display:flex;gap:3px}
.tb{flex:1;min-width:0;height:44px;padding:0 5px;display:flex;align-items:center;gap:4px;font-size:12px;overflow:hidden}
.tb svg{width:16px;height:16px;flex:none}
.tb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb[aria-pressed=true]{background:#dcdcdc;font-weight:700}
.tray{flex:none;height:44px;display:flex;align-items:center;gap:2px;padding:0 4px}
.tray button{height:40px;min-width:34px;display:grid;place-items:center}
.tray svg{width:18px;height:18px}
.tray .cnt{font-size:12px;display:flex;align-items:center;gap:3px;padding:0 3px}
.tray .cnt svg{width:12px;height:12px}
.home-ind{position:absolute;left:50%;bottom:calc(4px + env(safe-area-inset-bottom)*.3);width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(0,0,0,.55);z-index:25;pointer-events:none}

/* start menu drawer */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.smenu{position:absolute;left:4px;bottom:calc(52px + env(safe-area-inset-bottom));z-index:41;width:min(300px,calc(100% - 8px));display:flex;padding:3px;
  transform:translateY(calc(100% + 60px));visibility:hidden;transition:transform .32s steps(5,end),visibility 0s .32s;touch-action:none}
.smenu.on{transform:none;visibility:visible;transition:transform .32s steps(5,end)}
.smenu.drag{transition:none}
.banner{flex:none;width:34px;background:linear-gradient(0deg,#7a1f5c,#d9468f 55%,#2ec4b6);position:relative}
.banner span{position:absolute;left:50%;bottom:10px;transform:translateX(-50%) rotate(-90deg);transform-origin:center;white-space:nowrap;font:italic 700 22px/1 var(--serif);color:#fff;letter-spacing:.08em;width:0;display:flex;justify-content:center}
.banner span b{display:inline-block;transform:translateX(0);white-space:nowrap;font-weight:700}
.mlist{flex:1;min-width:0;padding:2px 0}
.mi{width:100%;min-height:46px;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:14px;text-align:left}
.mi svg{width:26px;height:26px;flex:none}
.mi small{margin-left:auto;color:#555;font-size:12px}
.mi:active,.mi:focus-visible{background:var(--teal2);color:#fff}
.mi:active small{color:#fff}
.sep{height:2px;margin:3px 4px;box-shadow:inset 0 1px 0 var(--lo),inset 0 -1px 0 var(--hi)}
.sub{padding:0 6px 6px 46px;display:none}
.sub.on{display:block}
.radio{width:100%;min-height:40px;display:flex;align-items:center;gap:8px;font-size:13px;text-align:left;padding:0 4px}
.radio i{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi),inset 2px 2px 0 #000;display:grid;place-items:center}
.radio[aria-checked=true] i::after{content:"";width:4px;height:4px;background:#000;border-radius:50%}
.radio:active{background:#dcdcdc}

/* dialog sheet */
.dlg{position:absolute;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:51;padding:3px;transform:translateY(130%);visibility:hidden;transition:transform .34s steps(5,end),visibility 0s .34s;touch-action:none}
.dlg.on{transform:none;visibility:visible;transition:transform .34s steps(5,end)}
.dlg.drag{transition:none}
.dlg .tbar{cursor:grab}
.dbody{padding:14px 12px 12px;font-size:14px}
.dbody label{display:block;margin-bottom:6px}
.dbody input{width:100%;height:40px;border:0;padding:0 8px;background:#fff;font:15px var(--ui);outline:none}
.estpick{display:flex;gap:2px;margin-top:6px}
.estpick button{width:40px;height:44px;display:grid;place-items:center}
.estpick svg{width:26px;height:18px}
.drow{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.drow .btn{min-width:92px}
.gag{position:absolute;inset:0;z-index:90;background:#000;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:#ff9a3c;font:italic 400 26px/1.5 var(--serif)}
.gag.on{display:flex}

/* balloon tooltip toast */
.balloon{position:absolute;right:8px;bottom:calc(62px + env(safe-area-inset-bottom));z-index:60;max-width:260px;padding:8px 10px;background:#ffffe1;color:#000;font-size:13px;border:1px solid #000;
  transform:translateY(12px);visibility:hidden;transition:transform .2s steps(3,end),visibility 0s .2s}
.balloon.on{transform:none;visibility:visible;transition:transform .2s steps(3,end)}
.balloon::after{content:"";position:absolute;right:30px;bottom:-9px;border:8px solid transparent;border-top-color:#000;border-bottom:0}
.balloon b{display:block;font-size:13px;margin-bottom:2px}
.balloon button{margin-left:8px;text-decoration:underline;color:#00007a;min-height:28px}

@media (prefers-reduced-motion:reduce){
  .track{animation:none;display:none}
  .win.restore,.win.vhs{animation:none}
  .tape .flip{transition:none}
  .smenu,.dlg,.balloon{transition-duration:.01s!important}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><svg id="bdSvg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"></svg></div>
  <div class="device">
    <div class="screen" id="screen">
      <div class="wall" aria-hidden="true"><svg id="wallSvg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg></div>
      <div class="track" aria-hidden="true"></div>
      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="g">
          <svg class="px" width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="9" width="3" height="3"/><rect x="5" y="6" width="3" height="6"/><rect x="10" y="3" width="3" height="9"/><rect x="15" y="0" width="3" height="12"/></svg>
          <svg class="px" width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="7" y="9" width="2" height="3"/><rect x="4" y="6" width="8" height="2"/><rect x="1" y="3" width="14" height="2"/><rect x="0" y="1" width="2" height="2"/><rect x="14" y="1" width="2" height="2"/></svg>
          <svg class="px" width="26" height="12" viewBox="0 0 26 12"><path d="M0 0h23v12H0zM2 2v8h19V2z" fill="currentColor"/><rect x="4" y="4" width="12" height="4" fill="currentColor"/><rect x="23" y="4" width="3" height="4" fill="currentColor"/></svg>
        </span>
      </div>

      <div class="icons" id="icons"></div>

      <!-- FOCUS.EXE -->
      <section class="win bev" id="w-focus" data-w="focus" aria-label="FOCUS.EXE">
        <div class="tbar"><svg class="ti px" data-ic="cas"></svg><span class="tt">ＦＯＣＵＳ．ＥＸＥ</span>
          <button class="wb bev" data-min aria-label="最小化"><svg class="px" viewBox="0 0 12 12"><rect x="2" y="9" width="7" height="2"/></svg></button>
          <button class="wb bev" data-min aria-label="關閉"><svg class="px" viewBox="0 0 12 12"><path d="M2 2h2v1h1v1h2V3h1V2h2v2H9v1H8v2h1v1h1v2H8V9H7V8H5v1H4v1H2V8h1V7h1V5H3V4H2z"/></svg></button>
        </div>
        <div class="client">
          <div class="deck">
            <div class="tape" id="tape"><div class="flip">
              <svg class="cas" id="casA" viewBox="0 0 320 200"></svg>
              <svg class="cas back" id="casB" viewBox="0 0 320 200"></svg>
            </div></div>
            <div class="lcd sunk">
              <p class="time" id="time">25:00</p>
              <div class="lcdr"><b id="side">SIDE A</b><span id="modeL">專注 25 分</span><div class="cyc" id="cyc"></div></div>
            </div>

var AC=null,master=null,music=load('music',true),loopT=null,nextT=0,ci=0,crackle=null;

function openMenu(){renderMenu();sm.style.transform='';sm.classList.add('on');$('scrim').classList.add('on');$('startBtn').setAttribute('aria-pressed','true');haptic(6);clunk();}
function closeMenu(){if(!sm.classList.contains('on'))return;sm.classList.remove('on','drag');sm.style.transform='';$('startBtn').setAttribute('aria-pressed','false');if(!dlg.classList.contains('on'))$('scrim').classList.remove('on');}
$('startBtn').addEventListener('click',function(){sm.classList.contains('on')?closeMenu():openMenu();});
$('scrim').addEventListener('click',function(){closeMenu();closeDlg();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeMenu();closeDlg();$('gag').classList.remove('on');}});
function renderMenu(){$('timerL').textContent=P()[0]+'/'+P()[1];$('musicL').textContent=music?'開':'關';$('autoL').textContent=cfg.auto?'開':'關';
  $('timerSub').innerHTML=PRESETS.map(function(p,i){return '<button class="radio" role="radio" data-pre="'+i+'" aria-checked="'+(i===cfg.p)+'"><i></i>專注 '+p[0]+'・休息 '+p[1]+'・長休 '+p[2]+'</button>';}).join('');}
sm.addEventListener('click',function(e){var r=e.target.closest('[data-pre]');if(r){cfg.p=+r.dataset.pre;if(st.status!=='run'){st.remain=durOf(st.mode);}persist();renderMenu();renderFocus();renderStats();haptic(5);clunk();return;}
  var b=e.target.closest('.mi');if(!b)return;var m=b.dataset.m;
  if(m==='timer'){$('timerSub').classList.toggle('on');haptic(4);return;}
  if(m==='music'){music=!music;save('music',music);paintSnd();renderMenu();if(!music)stopMusic();else if(st.status==='run'&&st.mode==='focus')startMusic();haptic(5);return;}
  if(m==='auto'){cfg.auto=!cfg.auto;persist();renderMenu();haptic(5);return;}
  if(m==='add'){openDlg();return;}
  if(m==='off'){closeMenu();stopMusic();if(st.status==='run')pause();$('gag').classList.add('on');haptic([20,60,20]);return;}
  if(m.indexOf('w-')===0){closeMenu();openWin(m.slice(2));}});
$('gag').addEventListener('click',function(){this.classList.remove('on');haptic(6);clunk();});
(function(){var sy=0,dy=0,t0=0,on=false,moved=false,pid=0;
  sm.addEventListener('pointerdown',function(e){on=true;moved=false;sy=e.clientY;dy=0;t0=e.timeStamp;pid=e.pointerId;});
  sm.addEventListener('pointermove',function(e){if(!on)return;dy=e.clientY-sy;if(!moved&&Math.abs(dy)<8)return;if(!moved){moved=true;sm.classList.add('drag');try{sm.setPointerCapture(pid);}catch(x){}}sm.style.transform='translateY('+Math.max(-10,dy)+'px)';});
  function end(e){if(!on)return;on=false;if(!moved)return;sm.classList.remove('drag');if(dy>sm.offsetHeight*.3||dy/Math.max(1,e.timeStamp-t0)>.6)closeMenu();else sm.style.transform='';
    sm.addEventListener('click',kill,true);setTimeout(function(){sm.removeEventListener('click',kill,true);},50);}
  function kill(e){e.stopPropagation();e.preventDefault();}
  sm.addEventListener('pointerup',end);sm.addEventListener('pointercancel',end);})();
function paintSnd(){var p=pxSVG(music?'spk':'mute');$('sndIc').setAttribute('viewBox',p.vb);$('sndIc').innerHTML=p.h;$('sndBtn').setAttribute('aria-pressed',String(music));}
$('sndBtn').addEventListener('click',function(){music=!music;save('music',music);paintSnd();if(!music)stopMusic();else if(st.status==='run'&&st.mode==='focus')startMusic();haptic(5);balloon('Lofi 和弦',music?'專注時會播放。':'已靜音。');});

/* ---------- balloon ---------- */
var bT=null,undoFn=null;
function balloon(t,m,undo){$('bT').textContent=t;$('bM').textContent=m;undoFn=undo||null;$('bU').style.display=undo?'':'none';var b=$('balloon');b.classList.add('on');clearTimeout(bT);bT=setTimeout(function(){b.classList.remove('on');undoFn=null;},undo?4200:2400);}
$('bU').addEventListener('click',function(){if(undoFn){var f=undoFn;undoFn=null;f();haptic(6);}$('balloon').classList.remove('on');});

/* ---------- layout + clock ---------- */
function fit(){var h=$('screen').clientHeight;var wt=Math.round(Math.max(52,Math.min(160,h*.17)));$('screen').style.setProperty('--wt',wt+'px');var ws=document.querySelectorAll('.win');for(var i=0;i<ws.length;i++)ws[i].style.setProperty('--wt',wt+'px');}
window.addEventListener('resize',fit);
function tick(){var d=new Date();$('clock').textContent=d.getHours()+':'+pad(d.getMinutes());}
tick();setTimeout(function(){tick();setInterval(tick,60000);},(60-new Date().getSeconds())*1000);
var sl=pxSVG('logo');$('startLogo').setAttribute('viewBox',sl.vb);$('startLogo').innerHTML=sl.h;
fillIcons();paintSnd();fit();
if(st.status==='run'&&left()<=0){st.status='idle';st.remain=durOf(st.mode);}

persist();renderBar();renderFocus();renderTasks();renderStats();renderMenu();loop();
})();
</script>
</body>
</html>
