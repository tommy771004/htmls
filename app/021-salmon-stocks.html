<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff1e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="盤後">
<title>盤後 · 股票看盤</title>
<meta name="description" content="印在鮭魚粉財經報紙上的台股看盤 App：自選股分版、K 線十字線與縮放、持股損益、盤後定價下單抽屜。收錄於 100 Creative HTML Works（App 021・財經報紙鮭魚粉紙）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/021-salmon-stocks.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff1e5'/%3E%3Cpath d='M10 15h44M10 19h44' stroke='%231b2a44' stroke-width='2'/%3E%3Cpath d='M18 28v22M30 24v20M42 32v18' stroke='%231b2a44' stroke-width='2'/%3E%3Crect x='14' y='32' width='8' height='12' fill='%23c0202e'/%3E%3Crect x='26' y='28' width='8' height='9' fill='%2312784a'/%3E%3Crect x='38' y='36' width='8' height='10' fill='%23c0202e'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#fff1e5;
  --paper-2:#f8e2cf;
  --paper-3:#f1d6c0;
  --rule:#dcc1aa;
  --ink:#1b2a44;
  --ink-2:#46526a;
  --ink-3:#636a7a;
  --up:#bf1e2d;
  --down:#12784a;
  --ochre:#9a6b3f;
  --serif:"Baskerville","Songti TC","Noto Serif TC","Source Han Serif TC",Georgia,serif;
  --song:"Songti TC","Noto Serif TC","Source Han Serif TC","PMingLiU",serif;
  --num:Menlo,"SF Mono",Consolas,"Liberation Mono",monospace;
  --out:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.32,1.28,.52,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.5 var(--song);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{display:block}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)}.dn{color:var(--down)}

/* ---------- stage ---------- */
.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--paper);isolation:isolate}
@media (min-width:521px){
  body{background:#efd9c6}
  .stage{display:flex;align-items:center;justify-content:center;gap:60px;padding:24px}
  .backdrop{display:block;position:fixed;inset:-40px;z-index:0;overflow:hidden;background:#f6e1ce}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:54px;padding:9px;z-index:1;
    background:linear-gradient(150deg,#4a4540,#262321 40%,#1b1917 75%,#3b3632);
    box-shadow:inset 0 0 0 1px rgba(255,241,229,.16),0 30px 36px -26px rgba(60,30,10,.7)}
  .screen{inset:9px;border-radius:45px}
  .caption{display:block;position:relative;z-index:1;width:290px;transform:rotate(2deg);filter:drop-shadow(0 8px 7px rgba(90,45,15,.28))}
  .caption .clipping{background:var(--paper);padding:26px 28px 30px;clip-path:polygon(0 1%,22% 0,51% .8%,78% 0,100% 1.2%,99.4% 36%,100% 71%,99.2% 100%,64% 99.1%,31% 100%,.6% 99.3%,0 64%,.8% 31%)}
  .caption h1{font:700 48px/1 var(--song);letter-spacing:.06em;color:var(--ink);padding-bottom:12px;border-bottom:4px double var(--ink)}
  .caption p{margin-top:14px;font:16px/1.75 var(--song);color:var(--ink-2)}
}
@media (min-width:521px) and (max-width:860px){.caption{display:none}}
.news{position:absolute;inset:0;transform:rotate(-4deg) scale(1.12);transform-origin:50% 40%;padding:40px 60px;color:rgba(27,42,68,.22)}
.news .plate{display:flex;align-items:baseline;gap:40px;border-bottom:5px double rgba(27,42,68,.4);padding-bottom:10px}
.news .plate b{font:900 120px/1 var(--song);letter-spacing:.1em;color:rgba(27,42,68,.34)}
.news .plate span{font:18px/1.5 var(--song)}
.news .cols{margin-top:22px;column-count:6;column-gap:34px;font:14px/1.9 var(--song);text-align:justify;column-rule:1px solid rgba(27,42,68,.12)}
.news .cols h3{font:700 26px/1.3 var(--song);margin:0 0 8px;color:rgba(27,42,68,.3);break-inside:avoid}
.news .cols p{margin-bottom:14px}
.news .fold{position:absolute;top:0;bottom:0;left:50%;width:120px;margin-left:-60px;background:linear-gradient(90deg,rgba(120,70,40,0),rgba(120,70,40,.08) 48%,rgba(255,255,255,.18) 52%,rgba(120,70,40,0))}

/* ---------- grain (behind content) ---------- */
.grain{position:absolute;inset:0;z-index:0;pointer-events:none}
.grain svg{width:100%;height:100%}

/* ---------- status ---------- */
.status{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 32px;font:600 15px/1 var(--num);color:var(--ink);pointer-events:none}
.status .glyphs{display:flex;align-items:center;gap:7px}
@media (display-mode:standalone){.status{display:none}}

/* ---------- main page ---------- */
.page{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding-top:calc(44px + env(safe-area-inset-top))}
@media (display-mode:standalone){.page{padding-top:env(safe-area-inset-top)}}
.mast{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;padding:6px 18px 8px}
.ear{font:13px/1.35 var(--song);color:var(--ink-2)}
.ear b{display:block;font:600 14px/1.2 var(--num);color:var(--ink)}
.ear.r{text-align:right}
.plate{font:900 40px/1 var(--song);letter-spacing:.14em;margin-right:-.14em;color:var(--ink);text-align:center}
.rules{margin:0 18px;height:6px;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink)}
.tape{position:relative;overflow:hidden;height:30px;margin:0 18px;border-bottom:1px solid var(--rule);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.tape .run{position:absolute;top:0;left:0;display:flex;white-space:nowrap;height:30px;align-items:center;animation:tape 60s linear infinite}
.tape .run span{padding-right:22px;font:13px/1 var(--num);color:var(--ink-2)}
.tape .run span i{font-style:normal;font-family:var(--song);color:var(--ink);margin-right:6px}
@keyframes tape{to{transform:translateX(-50%)}}

.tabs{position:relative;display:flex;margin:10px 18px 0;height:44px;flex:none}
.tabs button{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font:600 15px/1 var(--song);color:var(--ink-2);transition:color .3s}
.tabs button sup{font:600 11px/1 var(--num);color:var(--ink-3);transform:translateY(-3px);transition:color .3s}
.tabs button[aria-selected=true]{color:var(--paper)}
.tabs button[aria-selected=true] sup{color:#f3c9a9}
.tabs .flag{position:absolute;top:4px;bottom:4px;left:0;width:20%;background:var(--ink);transition:transform .45s var(--spring),width .45s var(--spring);
  clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px))}
.tabline{margin:0 18px;height:2px;background:var(--ink);flex:none}

.scroll{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:0 18px calc(40px + env(safe-area-inset-bottom));scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pane.in-l{animation:inL .38s var(--out)}.pane.in-r{animation:inR .38s var(--out)}
@keyframes inL{from{transform:translateX(-28px)}}@keyframes inR{from{transform:translateX(28px)}}

.lead{display:grid;grid-template-columns:1fr 112px;gap:14px;padding:16px 0 14px;border-bottom:1px solid var(--rule);text-align:left;width:100%}
.lead h2{font:700 22px/1.3 var(--song);letter-spacing:.01em}
.lead p{margin-top:6px;font:14px/1.6 var(--song);color:var(--ink-2)}
.lead .by{margin-top:8px;font-size:13px;color:var(--ink-3)}
.lead svg{width:112px;height:86px;align-self:center}
.lead:active h2{color:var(--ink-2)}

.thead{display:grid;grid-template-columns:1fr 78px 76px 58px;gap:8px;padding:12px 0 6px;font:13px/1 var(--song);color:var(--ink-3);border-bottom:2px solid var(--ink)}
.thead span:nth-child(n+2){text-align:right}
.rowwrap{position:relative;overflow:hidden;border-bottom:1px dotted #c7a78f;transition:height .3s var(--out)}
.rowwrap .kill{position:absolute;top:0;bottom:0;right:0;width:88px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--up);color:var(--paper);font:600 15px/1 var(--song)}
.row{position:relative;display:grid;grid-template-columns:1fr 78px 76px 58px;gap:8px;align-items:center;width:100%;min-height:62px;padding:8px 0;background:var(--paper);text-align:left;touch-action:pan-y;transition:transform .35s var(--out)}
.row.drag{transition:none}
.row:active{background:var(--paper-2)}
.row .nm b{display:block;font:600 17px/1.25 var(--song)}
.row .nm b.long{font-size:14.5px;letter-spacing:-.02em}
.row .nm small{display:block;margin-top:2px;font:12.5px/1 var(--num);color:var(--ink-3)}
.row .px{text-align:right;font:600 16px/1 var(--num)}
.row .ch{text-align:right;font:13.5px/1.25 var(--num)}
.row .ch em{display:block;font-style:normal;font-size:12.5px;opacity:.85}
.row svg{width:58px;height:26px}
.addrow{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:0 2px;color:var(--ink);font:600 15px/1 var(--song)}
.addrow svg{width:20px;height:20px}
.addrow:active{color:var(--ink-2)}
.empty{padding:28px 4px 8px;font:15px/1.7 var(--song);color:var(--ink-2)}

.box{margin-top:16px;padding:14px 0 12px;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center}
.box div+div{border-left:1px dotted #c7a78f}
.box small{display:block;font:13px/1 var(--song);color:var(--ink-3)}
.box b{display:block;margin-top:8px;font:600 18px/1 var(--num)}
.sub{margin-top:22px;font:700 17px/1 var(--song);padding-bottom:8px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.sub span{font:13px/1 var(--song);color:var(--ink-3);font-weight:400}
.hold{display:grid;grid-template-columns:1fr 64px 92px;gap:8px}
.ord{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px dotted #c7a78f;font-size:14px}
.ord .side{font:700 14px/1 var(--song);width:40px;height:40px;display:grid;place-items:center;border:1.5px solid currentColor;border-radius:50%}
.ord b{font-weight:600}
.ord small{display:block;font:12.5px/1.3 var(--num);color:var(--ink-3);margin-top:2px}
.ord .amt{font:13px/1.3 var(--num);text-align:right}

/* ---------- detail page ---------- */
.detail{position:absolute;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;padding-top:calc(44px + env(safe-area-inset-top));
  transform:translateX(104%);transition:transform .46s var(--out);visibility:hidden}
.detail.on{transform:none;visibility:visible}
.detail.closing{visibility:visible}
@media (display-mode:standalone){.detail{padding-top:env(safe-area-inset-top)}}
.dhead{display:flex;align-items:center;gap:6px;padding:0 10px 0 6px;height:48px;flex:none;border-bottom:1px solid var(--rule)}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn:active{background:var(--paper-2)}
.iconbtn svg{width:24px;height:24px}
.dhead h3{flex:1;font:600 16px/1 var(--song);text-align:center}
.dhead h3 small{font:13px/1 var(--num);color:var(--ink-3);margin-left:6px}
.dscroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 18px 110px;scrollbar-width:none}
.dscroll::-webkit-scrollbar{display:none}
.quote{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 0 10px}
.quote .big{font:600 40px/1 var(--num);letter-spacing:-.02em}
.quote .chg{margin-top:8px;font:15px/1 var(--num)}
.quote .meta{text-align:right;font:13px/1.55 var(--song);color:var(--ink-3)}
.quote .meta b{color:var(--ink);font:600 13px/1 var(--num)}
.cbar{display:flex;align-items:center;gap:8px;min-height:40px;border-top:2px solid var(--ink);padding-top:4px}
.legend{flex:1;min-width:0;font:12.5px/1.35 var(--num);color:var(--ink-2);white-space:nowrap;overflow:hidden}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin:0 4px 2px 0}
.legend .ma5{color:var(--ink)}.legend .ma20{color:var(--ochre)}
.zoom{display:flex;align-items:center}
.zoom button{width:44px;height:40px;display:grid;place-items:center}
.zoom button:active{background:var(--paper-2)}
.zoom svg{width:18px;height:18px}
.zoom span{font:13px/1 var(--num);color:var(--ink-3);min-width:34px;text-align:center}
.chart{position:relative;height:270px;touch-action:none;cursor:crosshair}
.chart canvas,.brush canvas{position:absolute;inset:0;width:100%;height:100%}
.brush{position:relative;height:44px;margin-top:6px;touch-action:none;cursor:grab}
.brush:active{cursor:grabbing}
.stats{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;column-gap:22px;border-top:2px solid var(--ink)}
.stats div{display:flex;align-items:baseline;gap:6px;padding:9px 0;border-bottom:1px dotted #c7a78f;font-size:14px}
.stats div span{color:var(--ink-3);white-space:nowrap}
.stats div i{flex:1;border-bottom:1px dotted #d8bba3;transform:translateY(-4px);min-width:6px}
.stats div b{font:600 14px/1 var(--num)}
.story{padding:14px 0;border-bottom:1px dotted #c7a78f}
.story b{display:block;font:600 16px/1.45 var(--song)}
.story p{margin-top:4px;font:14px/1.65 var(--song);color:var(--ink-2)}
.story small{display:block;margin-top:6px;font:12.5px/1 var(--num);color:var(--ink-3)}
.dfoot{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:10px 18px calc(22px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--rule)}
.clip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:62px;height:52px;flex:none;font:12.5px/1 var(--song);color:var(--ink)}
.clip svg{width:24px;height:24px}
.clip[aria-pressed=true] svg .cut{fill:var(--ink)}
.clip:active{background:var(--paper-2)}
.trade{flex:1;height:52px;background:var(--ink);color:var(--paper);font:700 17px/1 var(--song);letter-spacing:.2em;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);transition:background-color .15s}
.trade:active{background:#2c3d5c}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(27,42,68,.34);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:88%;display:flex;flex-direction:column;background:var(--paper);
  border-top:3px solid var(--ink);padding:8px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .5s var(--spring),visibility 0s .5s;touch-action:none;
  box-shadow:0 -6px 14px -10px rgba(60,30,10,.45)}
.sheet.on{transform:translateY(0);visibility:visible;transition:transform .5s var(--spring)}
.sheet.drag{transition:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--rule);margin:2px auto 12px;flex:none}
.sheet h4{font:700 20px/1.2 var(--song);display:flex;align-items:baseline;gap:8px}
.sheet h4 small{font:13px/1 var(--num);color:var(--ink-3);font-weight:400}
.search{display:flex;align-items:center;gap:8px;margin-top:12px;border-bottom:2px solid var(--ink);flex:none}
.search svg{width:20px;height:20px;flex:none}
.search input{flex:1;min-width:0;height:46px;border:0;background:none;font:16px/1 var(--song);outline:none}
.search input::placeholder{color:var(--ink-3)}
.pick{margin-top:4px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;flex:1;min-height:0}
.pick button{display:grid;grid-template-columns:1fr 80px 44px;align-items:center;gap:8px;width:100%;min-height:54px;border-bottom:1px dotted #c7a78f;text-align:left}
.pick button:active{background:var(--paper-2)}
.pick b{font:600 16px/1.2 var(--song)}
.pick small{font:12.5px/1 var(--num);color:var(--ink-3);margin-left:6px}
.pick .px{text-align:right;font:14px/1 var(--num)}
.pick .st{justify-self:end;width:30px;height:30px;display:grid;place-items:center}
.pick .st svg{width:20px;height:20px}

.seg{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;border:2px solid var(--ink);height:46px;flex:none}
.seg button{font:700 16px/1 var(--song);letter-spacing:.3em;transition:background-color .2s,color .2s}
.seg button[aria-pressed=true].b{background:var(--up);color:var(--paper)}
.seg button[aria-pressed=true].s{background:var(--down);color:var(--paper)}
.sess{display:flex;gap:18px;margin-top:12px;font-size:14px}
.sess button{height:40px;color:var(--ink-3);font:600 14.5px/1 var(--song);border-bottom:2px solid transparent}
.sess button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink)}
.ordgrid{display:grid;grid-template-columns:1fr 132px;gap:14px;margin-top:8px}
.ladder{font:13px/1 var(--num)}
.ladder button{display:grid;grid-template-columns:1fr auto;width:100%;height:24px;align-items:center;padding:0 6px}
.ladder button:active{background:var(--paper-2)}
.ladder button span:last-child{color:var(--ink-3)}
.ladder .mid{height:2px;background:var(--ink);margin:3px 0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:13px/1 var(--song);color:var(--ink-3)}
.step{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:48px;border-bottom:2px solid var(--ink)}
.step button{height:44px;display:grid;place-items:center}
.step button:active{background:var(--paper-2)}
.step button:disabled{opacity:.3}
.step svg{width:16px;height:16px}
.step output{text-align:center;font:600 18px/1 var(--num)}
.calc{margin-top:12px;font-size:14px}
.calc div{display:flex;justify-content:space-between;padding:5px 0}
.calc div b{font:600 14px/1 var(--num)}
.calc .tot{border-top:2px solid var(--ink);margin-top:4px;padding-top:9px;font-weight:700}
.calc .tot b{font-size:17px}
.hold-btn{position:relative;margin-top:14px;height:56px;width:100%;flex:none;overflow:hidden;background:var(--paper-3);color:var(--ink);font:700 16px/1 var(--song);letter-spacing:.08em}
.hold-btn .fill{position:absolute;inset:0;background:var(--c,var(--up));clip-path:inset(0 100% 0 0);transition:clip-path .25s var(--out)}
.hold-btn.hold .fill{clip-path:inset(0 0 0 0);transition:clip-path 1s linear}
.hold-btn span{position:relative;z-index:1;display:block;transition:color .3s}
.hold-btn.hold span{color:var(--paper)}
.hint{margin-top:8px;font-size:13px;color:var(--ink-3);text-align:center}

.toast{position:absolute;left:18px;right:18px;top:calc(50px + env(safe-area-inset-top));z-index:70;display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 8px 6px 16px;
  background:var(--ink);color:var(--paper);font:600 14.5px/1.4 var(--song);transform:translateY(-150%);visibility:hidden;transition:transform .42s var(--spring),visibility 0s .42s}
.toast.on{transform:none;visibility:visible;transition:transform .42s var(--spring)}
.toast span{flex:1}
.toast button{height:40px;padding:0 14px;color:#f7c9a6;font-weight:700}
.toast button[hidden]{display:none}
.home{position:absolute;left:50%;bottom:7px;width:132px;height:5px;margin-left:-66px;border-radius:3px;background:var(--ink);opacity:.8;z-index:80;pointer-events:none}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

@media (prefers-reduced-motion:reduce){
  .tape .run{animation:none}
  .pane.in-l,.pane.in-r,.shake{animation:none}

function drawBrush(){

  bx.strokeStyle = 'rgba(27,42,68,.7)'; bx.lineWidth = 1.2; bx.stroke();

function clampView(){ view.n = Math.max(15, Math.min(N, Math.round(view.n))); view.end = Math.max(view.n - 1, Math.min(N - 1, Math.round(view.end))); if (view.cross !== null && (view.cross < view.end - view.n + 1 || view.cross > view.end)) view.cross = null; }

$('zIn').addEventListener('click', function(){ zoomBy(1 / 1.5); });
$('zOut').addEventListener('click', function(){ zoomBy(1.5); });
(function(){

/* ================= order drawer ================= */
var O = {side:'b', sess:'fix', p:0, q:1};
function lot(){ return O.sess === 'odd' ? 1 : 1000; }
function openOrder(){
  var b = last(cur);
  O = {side:'b', sess:'fix', p:b.c, q:1};
  $('ordS').textContent = DB[cur].n + ' ' + cur;
  syncOrder(); openSheet($('ordSheet'));
}
$('tradeBtn').addEventListener('click', openOrder);
function ladder(){
  var c = last(cur).c, etf = DB[cur].etf, r = rng(hash(cur + 'lad')), h = '', p, i, asks = [], bids = [];
  p = c; for (i = 0; i < 5; i++){ p = rt(p + tickSize(p, etf), etf); asks.push(p); }
  p = c; for (i = 0; i < 5; i++){ bids.push(p); p = rt(p - tickSize(p, etf), etf); }
  asks.reverse().forEach(function(v){ h += '<button data-p="' + v + '"><span class="up">' + fpx(cur, v) + '</span><span>' + (20 + (r() * 480 | 0)) + '</span></button>'; });
  h += '<div class="mid"></div>';
  bids.forEach(function(v){ h += '<button data-p="' + v + '"><span class="' + (v < c ? 'dn' : '') + '">' + fpx(cur, v) + '</span><span>' + (20 + (r() * 480 | 0)) + '</span></button>'; });
  return h;
}
function syncOrder(){
  if (!cur) return;
  var buy = O.side === 'b';
  $('sideB').setAttribute('aria-pressed', buy); $('sideS').setAttribute('aria-pressed', !buy);
  $('sess').querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.s === O.sess); });

  if (fixed) O.p = last(cur).c;
  $('pV').textContent = fpx(cur, O.p); $('pDn').disabled = fixed; $('pUp').disabled = fixed;
  $('pLbl').textContent = fixed ? '價格（收盤價）' : '限價';
  $('qLbl').textContent = O.sess === 'odd' ? '數量（股）' : '數量（張）';
  $('qV').textContent = fp(O.q, 0);
  $('ladder').innerHTML = ladder();
  var shares = O.q * lot(), amt = shares * O.p, fee = Math.max(20, Math.floor(amt * .001425)), tax = buy ? 0 : Math.floor(amt * (DB[cur].etf ? .001 : .003));

$('sideB').addEventListener('click', function(){ O.side = 'b'; haptic(6); syncOrder(); });

var holdT = null;
