<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8c6c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="聲道">
<title>聲道 · Podcast</title>
<meta name="description" content="一台 70 年代日系收音機造型的 Podcast 播放器：轉動調頻刻度選節目，琥珀色 VU 表跟著聲音擺動，還有章節、倍速、睡眠計時與訂閱。收錄於 100 Creative HTML Works（App 031・70 年代日系 Hi-Fi）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/031-hifi-podcast.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23c8c6c0'/%3E%3Crect x='6' y='14' width='52' height='24' rx='3' fill='%230e0d0b'/%3E%3Cpath d='M10 30h44' stroke='%23ffb547' stroke-width='2'/%3E%3Cpath d='M14 26v4M22 24v6M30 26v4M38 24v6M46 26v4' stroke='%23ffb547' stroke-width='2'/%3E%3Crect x='33' y='16' width='3' height='20' fill='%23ffe2b0'/%3E%3Ccircle cx='20' cy='49' r='7' fill='%238e8c86'/%3E%3Ccircle cx='44' cy='49' r='7' fill='%238e8c86'/%3E%3C/svg%3E">
<style>
:root{
  --alu:#c8c6c0;
  --alu-hi:#e4e2dc;
  --alu-lo:#9d9b95;
  --engr:#262521;
  --engr-2:#4a4843;
  --blk:#0e0d0b;
  --amber:#ffb547;
  --amber-hi:#ffe2b0;
  --amber-lo:#6b4410;
  --din:"DIN Alternate","DIN Condensed","Helvetica Neue","PingFang TC",sans-serif;
  --zh:"PingFang TC","Heiti TC",system-ui,sans-serif;
  --out:cubic-bezier(.2,.8,.25,1);
  --spring:cubic-bezier(.3,1.3,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.4 var(--zh);color:var(--engr);background:#1b1a17;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:6px}
svg{display:block}
ul,ol{list-style:none}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:var(--alu)}
/* brushed aluminium: fine horizontal hairlines + a soft horizontal sheen, grain underneath everything */
.brushed{background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.035) 1px 2px,rgba(255,255,255,0) 2px 3px),
  linear-gradient(100deg,#b9b7b1 0%,#d8d6d0 22%,#c3c1bb 45%,#dcdad4 68%,#bdbbb5 100%)}
@media (min-width:521px){
  .stage{display:flex;align-items:center;justify-content:center;gap:72px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:52px;padding:12px;z-index:1;
    background:linear-gradient(160deg,#3a3935,#121110 40%,#23221f);box-shadow:inset 0 0 0 1px #5d5b55,inset 0 2px 0 rgba(255,255,255,.12),0 24px 30px -22px #000}
  .screen{inset:12px;border-radius:40px}
  .caption{display:block;position:relative;z-index:1;width:250px;color:var(--engr)}
  .caption h1{font:700 44px/1 var(--zh);letter-spacing:.12em}
  .caption .m{font:700 15px/1 var(--din);letter-spacing:.24em;margin-top:12px;color:var(--engr-2)}
  .caption p{margin-top:18px;font-size:15px;line-height:1.7;color:#34332f}
}
@media (min-width:521px) and (max-width:900px){.caption{display:none}}

.status{position:absolute;top:0;left:0;right:0;z-index:30;height:calc(46px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 32px;display:flex;align-items:center;justify-content:space-between;font:700 16px/1 var(--din);color:var(--engr);pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
/* status bar gets its own brushed panel so scrolled content never runs under the clock */
.status{background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.035) 1px 2px,rgba(255,255,255,0) 2px 3px),linear-gradient(100deg,#b9b7b1 0%,#d8d6d0 22%,#c3c1bb 45%,#dcdad4 68%,#bdbbb5 100%);box-shadow:0 1px 0 rgba(0,0,0,0);transition:box-shadow .25s var(--out)}
.status.sc{box-shadow:0 1px 0 rgba(0,0,0,.18),0 2px 0 rgba(255,255,255,.45)}
@media (display-mode:standalone){.status{display:none}}

.body{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(46px + env(safe-area-inset-top)) 0 calc(30px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.body::-webkit-scrollbar{display:none}

/* brand row */
.brand{display:flex;align-items:center;gap:12px;padding:6px 20px 12px}
.brand h1{font:700 22px/1 var(--zh);letter-spacing:.18em;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.brand .m{font:700 11px/1.25 var(--din);letter-spacing:.16em;color:var(--engr-2);text-shadow:0 1px 0 rgba(255,255,255,.5)}
.pwr{margin-left:auto;display:flex;align-items:center;gap:8px;font:700 12px var(--din);letter-spacing:.14em;color:var(--engr-2)}
.lamp{width:10px;height:10px;border-radius:50%;background:#5a4a33;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.lamp.on{background:var(--amber);box-shadow:inset 0 -1px 1px rgba(120,60,0,.5),inset 0 1px 1px rgba(255,255,255,.7)}

/* dial window (signature, part 1) */
.dial{position:relative;margin:0 14px;height:156px;border-radius:9px;background:#0b0a08;overflow:hidden;touch-action:none;cursor:grab;
  box-shadow:inset 0 2px 0 rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.6),0 -1px 0 rgba(0,0,0,.25)}
.dial:active{cursor:grabbing}
.dial .glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,236,200,.08),rgba(255,236,200,0) 38%),linear-gradient(90deg,rgba(0,0,0,.75),rgba(0,0,0,0) 16%,rgba(0,0,0,0) 84%,rgba(0,0,0,.75));z-index:3}
.scale{position:absolute;left:0;top:0;height:100%;will-change:transform}
.scale text{font-family:var(--din);font-weight:700}
.needle{position:absolute;left:50%;top:10px;bottom:10px;width:3px;margin-left:-1.5px;background:#ff7a2a;border-radius:2px;z-index:2}
.dhud{position:absolute;left:14px;right:14px;top:8px;display:flex;justify-content:space-between;z-index:4;pointer-events:none;font:700 11px var(--din);letter-spacing:.16em;color:#5d4520}
.dhud .on{color:var(--amber)}
.sig{display:flex;gap:2px;align-items:flex-end;margin-left:6px}
.sig i{width:3px;background:#3d2c12}
.sig i.on{background:var(--amber)}
.dhud .l{display:flex;align-items:flex-end}

/* VU meters (signature, part 2) */
.vus{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 14px 0}
.vu{position:relative;height:118px;border-radius:7px;overflow:hidden;background:#0b0a08;padding:5px;box-shadow:0 1px 0 rgba(255,255,255,.6),inset 0 2px 0 rgba(0,0,0,.6)}
.vu .face{position:relative;height:100%;border-radius:3px;overflow:hidden;background:linear-gradient(180deg,#f7d08a 0%,#f2b85c 60%,#e39c3a 100%)}
.vu svg{width:100%;height:100%}

/* now playing */
.now{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:16px 20px 0;align-items:start}
.now .show{font:700 13px/1 var(--din);letter-spacing:.18em;color:var(--engr-2)}
.now .show b{font:700 13px var(--zh);letter-spacing:.1em;color:var(--engr)}
.now h2{grid-column:1;font:700 22px/1.25 var(--zh);letter-spacing:.02em;text-shadow:0 1px 0 rgba(255,255,255,.45);min-height:55px}
.now .meta{grid-column:1;font-size:13px;color:var(--engr-2)}
.lever{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;padding-top:2px}
.lever .sw{position:relative;width:26px;height:46px;border-radius:13px;background:#1a1916;box-shadow:inset 0 2px 3px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.6)}
.lever .sw i{position:absolute;left:3px;right:3px;height:22px;top:3px;border-radius:10px;background:linear-gradient(180deg,#f2f0ea,#a9a7a1);box-shadow:0 2px 0 #5c5a55;transition:transform .28s var(--spring)}
.lever[aria-pressed=true] .sw i{transform:translateY(18px);box-shadow:0 -2px 0 #5c5a55}
.lever span{font:700 12px var(--zh);letter-spacing:.1em;display:flex;gap:6px;align-items:center}

.tape{display:flex;align-items:center;gap:12px;padding:14px 20px 0}
.ctr{display:flex;align-items:center;gap:2px;padding:4px 5px;border-radius:5px;background:#0b0a08;box-shadow:0 1px 0 rgba(255,255,255,.6)}
.whl{width:17px;height:26px;overflow:hidden;border-radius:2px;background:linear-gradient(180deg,#2a2824,#0e0d0b 30%,#0e0d0b 70%,#2a2824)}
.whl div{transition:transform .35s var(--out)}
.whl span{display:block;height:26px;font:700 20px/26px var(--din);color:#f1ede3;text-align:center}
.ctr .c{color:#f1ede3;font:700 18px var(--din);width:6px;text-align:center}
.dur{font:700 13px var(--din);letter-spacing:.1em;color:var(--engr-2)}
.fader{position:relative;flex:1;height:44px;touch-action:none;cursor:pointer}
.fader .slot{position:absolute;left:0;right:0;top:19px;height:6px;border-radius:3px;background:#161512;box-shadow:0 1px 0 rgba(255,255,255,.6)}
.fader .ticks i{position:absolute;top:10px;width:2px;height:6px;background:var(--engr-2);margin-left:-1px}
.fader .cap{position:absolute;top:8px;width:18px;height:28px;margin-left:-9px;border-radius:3px;background:linear-gradient(90deg,#8f8d87,#efede7 35%,#cfcdc7 65%,#8a8882);box-shadow:0 2px 0 #4c4a45}
.fader .cap::after{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:#1b1a17}

/* piano keys */
.keys{display:grid;grid-template-columns:1fr 1.35fr 1fr 1fr 1fr;gap:5px;margin:16px 14px 0;padding:6px;border-radius:8px;background:#141310;box-shadow:0 1px 0 rgba(255,255,255,.6)}
.key{position:relative;height:66px;border-radius:3px 3px 5px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  background:linear-gradient(180deg,#eeece6,#c9c7c1 70%,#b3b1ab);box-shadow:0 5px 0 #6f6d68,0 6px 0 #0a0908;margin-bottom:6px;transition:transform .09s,box-shadow .09s;font:700 12px/1 var(--zh);letter-spacing:.06em;color:var(--engr)}
.key svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:butt;stroke-linejoin:miter}
.key:active,.key.down{transform:translateY(4px);box-shadow:0 1px 0 #6f6d68,0 2px 0 #0a0908}
.key.down{background:linear-gradient(180deg,#dcdad4,#b8b6b0)}
.key .led{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:#5a4a33}
.key.down .led{background:var(--amber)}

/* knobs */
.knobs{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 8px 0}
.kn{display:flex;flex-direction:column;align-items:center}
.kwrap{position:relative;width:118px;height:108px;touch-action:none}
.kwrap .lbl{position:absolute;font:700 13px/1 var(--din);color:var(--engr-2);transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none}
.kwrap .lbl.on{color:var(--engr)}
.knob{position:absolute;left:50%;top:54px;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;
  background:repeating-conic-gradient(#8d8b85 0 4deg,#d9d7d1 4deg 8deg);box-shadow:0 3px 0 #4f4d48,0 4px 3px -1px rgba(0,0,0,.35);transition:transform .3s var(--spring)}
.knob::before{content:"";position:absolute;inset:6px;border-radius:50%;background:conic-gradient(from 20deg,#f4f2ec,#a6a49e 25%,#eeece6 50%,#9c9a94 75%,#f4f2ec)}
.knob::after{content:"";position:absolute;left:50%;top:9px;width:3px;height:14px;margin-left:-1.5px;border-radius:1.5px;background:#1b1a17}
.kn .nm{font:700 13px/1 var(--zh);letter-spacing:.14em;margin-top:2px}
.kn .rd{font:700 13px/1 var(--din);color:var(--engr-2);margin-top:5px;height:14px;letter-spacing:.08em}
.foot{padding:22px 20px 8px;font:700 11px/1.5 var(--din);letter-spacing:.2em;color:var(--engr-2);text-align:center}

.home-ind{position:absolute;left:50%;bottom:calc(7px + env(safe-area-inset-bottom)*.3);width:130px;height:5px;margin-left:-65px;border-radius:3px;background:#2a2925;z-index:25;pointer-events:none}

/* sheet: black anodised panel */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(10,9,8,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;z-index:51;max-height:78%;display:flex;flex-direction:column;border-radius:22px;background:#161512;color:#e9e5da;
  transform:translateY(calc(100% + 20px));visibility:hidden;transition:transform .5s var(--spring),visibility 0s .5s;touch-action:none;padding-bottom:env(safe-area-inset-bottom);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.sheet.on{transform:none;visibility:visible;transition:transform .5s var(--spring)}
.sheet.drag{transition:none}
.grab{flex:none;height:28px;display:grid;place-items:center;cursor:grab}
.grab i{width:40px;height:4px;border-radius:2px;background:#5d5a52}
.sb{overflow-y:auto;padding:0 18px 20px;touch-action:pan-y;overscroll-behavior:contain}
.sb h4{font:700 13px/1 var(--din);letter-spacing:.22em;color:var(--amber)}
.sb h3{font:700 22px/1.25 var(--zh);margin-top:8px}
.sb .sub{font-size:13px;color:#a8a396;margin-top:4px}
.eps{margin-top:14px}
.eps li button,.chs li button{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;padding:12px 4px;border-top:1px solid #2c2a25;align-items:center}
.eps li button:active,.chs li button:active{background:#221f1a}
.eps b{font:600 16px/1.35 var(--zh)}
.eps small,.chs small{font:700 13px var(--din);color:#a8a396;letter-spacing:.06em}
.eps .bar{grid-column:1/-1;height:3px;border-radius:2px;background:#2c2a25;margin-top:6px;overflow:hidden}
.eps .bar i{display:block;height:100%;background:var(--amber)}
.eps .cur b,.chs .cur b{color:var(--amber)}
.eps .dn{font:600 12px var(--zh);color:#a8a396}
.chs{margin-top:12px}
.chs b{font:600 16px/1.35 var(--zh)}
.chs li button{grid-template-columns:62px 1fr auto}
.chs em{font:700 12px var(--din);font-style:normal;color:#a8a396;letter-spacing:.06em}
.chs .cur em{color:var(--amber)}
.eps .cnt,.chs .cnt{font:700 12px var(--din);letter-spacing:.16em;color:#a8a396;margin-top:14px}
.eps .np{display:inline-block;font:700 11px var(--zh);letter-spacing:.08em;color:#161512;background:var(--amber);border-radius:3px;padding:2px 5px;margin-right:6px;vertical-align:2px}
.chs small{font-size:15px;color:#e9e5da}
.chs .cur small{color:var(--amber)}
.sacts{display:flex;gap:10px;margin-top:16px}
.sacts button{flex:1;height:48px;border-radius:8px;background:#2a2824;color:#e9e5da;font:700 15px var(--zh);letter-spacing:.06em}
.sacts button:active{background:#37342e}

.toast{position:absolute;left:50%;top:calc(54px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-160%);visibility:hidden;transition:transform .4s var(--spring),visibility 0s .4s;
  padding:0 16px;height:40px;display:flex;align-items:center;border-radius:6px;background:#0e0d0b;color:var(--amber);font:700 14px var(--zh);letter-spacing:.08em;white-space:nowrap}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .4s var(--spring)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){
  .knob,.lever .sw i,.whl div,.sheet,.toast,.key,.status{transition:none!important}
  .key:active{transform:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true">
    <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <pattern id="brush" width="1600" height="3" patternUnits="userSpaceOnUse"><rect width="1600" height="1" fill="#fff" opacity=".08"/><rect y="1" width="1600" height="1" fill="#000" opacity=".04"/></pattern>
        <linearGradient id="alu" x1="0" y1="0" x2="1" y2=".1"><stop offset="0" stop-color="#b3b1ab"/><stop offset=".3" stop-color="#d6d4ce"/><stop offset=".55" stop-color="#bfbdb7"/><stop offset=".8" stop-color="#d9d7d1"/><stop offset="1" stop-color="#b1afa9"/></linearGradient>
        <linearGradient id="amb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1209"/><stop offset=".5" stop-color="#0d0a07"/><stop offset="1" stop-color="#1a1209"/></linearGradient>
        <filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .48  0 0 0 .4 0"/></filter>
        <radialGradient id="kb" cx=".5" cy=".5" r=".5"><stop offset=".78" stop-color="#e2e0da"/><stop offset=".8" stop-color="#8a8882"/><stop offset="1" stop-color="#5d5b56"/></radialGradient>
      </defs>
      <rect width="1600" height="1000" fill="url(#alu)"/>
      <rect width="1600" height="1000" fill="url(#brush)"/>
      <rect x="-20" y="70" width="1640" height="240" rx="14" fill="url(#amb)"/>
      <g id="bscale"></g>
      <rect x="1180" y="76" width="6" height="228" fill="#ff7a2a"/>
      <g font-family="DIN Alternate,Helvetica Neue,sans-serif" font-weight="700" fill="#4a4843" letter-spacing="10" font-size="22">
        <text x="120" y="370">SR-770  FM STEREO RECEIVER</text>
        <text x="1336" y="580">TUNING</text>
      </g>
      <g><circle cx="240" cy="740" r="120" fill="#4f4d48"/><circle cx="240" cy="734" r="116" fill="url(#kb)"/><rect x="236" y="628" width="8" height="40" rx="4" fill="#1b1a17"/></g>
      <g><circle cx="1420" cy="740" r="120" fill="#4f4d48"/><circle cx="1420" cy="734" r="116" fill="url(#kb)"/><rect x="1416" y="628" width="8" height="40" rx="4" fill="#1b1a17" transform="rotate(38 1420 734)"/></g>
      <rect width="1600" height="1000" filter="url(#gr)" opacity=".18"/>
    </svg>
  </div>

  <div class="caption">
    <h1>聲道</h1>
    <div class="m">FM · PODCAST RECEIVER</div>
    <p>轉動調頻刻度找節目，雜訊散去就是對上了。兩只琥珀色 VU 表，跟著主持人的聲音擺動。</p>
  </div>

  <div class="device">
    <div class="screen brushed" id="screen">
      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="g">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="#262521" stroke-width="2"><path d="M2 12V8M7 12V6M12 12V3.5M17 12V1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#262521" stroke-width="1.8"><path d="M1.5 4.6a9.5 9.5 0 0 1 13 0M4 7.3a6 6 0 0 1 8 0M6.4 9.9a2.4 2.4 0 0 1 3.2 0"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x="1" y="1" width="21" height="10" rx="2" fill="none" stroke="#262521" stroke-width="1.6"/><rect id="batt" x="3" y="3" width="14" height="6" fill="#262521"/><path d="M23.5 4.5v3" stroke="#262521" stroke-width="2"/></svg>
        </span>
      </div>

      <div class="body" id="body">
        <div class="brand">
          <div><h1>聲道</h1><div class="m">SR-770 · FM PODCAST</div></div>
          <div class="pwr"><i class="lamp" id="pwrLamp"></i>ON AIR</div>
        </div>

        <div class="dial" id="dial" role="slider" tabindex="0" aria-label="調頻選節目" aria-valuemin="87.5" aria-valuemax="108" aria-valuenow="88.5">

  bedG = ac.createGain(); bedG.gain.setValueAtTime(0, t); bedG.gain.linearRampToValueAtTime(.05, t + 1.2);
  var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(bedG);
  bedOscs = (CHORDS[show().id] || CHORDS.bf).map(function(f, k){
    var o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = f * (S.speed > 1.2 ? 1.02 : 1);
    var p = ac.createStereoPanner ? ac.createStereoPanner() : null;
    if (p){ p.pan.value = [-.7, .7, 0][k]; o.connect(p); p.connect(lp); } else o.connect(lp);
    o.start(t); return o;
  });
  bedG.connect(master);
  voiceSrc.start(t);
}
function stopVoice(){
  if (!ac) return;
  var t = ac.currentTime;
  try{ if (voiceSrc){ voiceG.gain.setTargetAtTime(0, t, .05); voiceSrc.stop(t + .3); } }catch(e){}
  try{ if (bedG){ bedG.gain.setTargetAtTime(0, t, .1); } bedOscs.forEach(function(o){ o.stop(t + .6); }); }catch(e){}
  voiceSrc = null; bedOscs = [];
}
function restartVoice(){ if (playing){ stopVoice(); startVoice(); } }
// speech envelope: phrases with syllables and pauses, rate follows speed
var env = 0, phrase = 0, syl = 0;
setInterval(function(){
  if (!playing) { env = 0; return; }
  var r = S.speed;
  if (phrase <= 0){ phrase = Math.random() < .22 ? -(3 + Math.random() * 6) : 18 + Math.random() * 30; }
  if (phrase < 0){ phrase += r; env = 0; }
  else { phrase -= r; syl += (.9 + Math.random() * .8) * r; env = Math.max(0, Math.sin(syl)) * (.55 + Math.random() * .45); }
  if (ac && voiceG){
    voiceG.gain.setTargetAtTime(env * .55, ac.currentTime, .025);
    bandF.frequency.setTargetAtTime(500 + Math.random() * 700 * r, ac.currentTime, .04);
  }
}, 70);

// ---------- VU needles (read the analyser; ballistic smoothing) ----------
var silentFor = 0, buf = new Float32Array(1024), vuL = -20, vuR = -20, ndL = $('ndL'), ndR = $('ndR');
function level(an){ if (!an) return 0; an.getFloatTimeDomainData(buf); var s = 0; for (var i = 0; i < buf.length; i += 2) s += buf[i] * buf[i]; return Math.sqrt(s / 512); }
function vuFrame(){
  var tl, tr;
  var ll = ac && ac.state === 'running' && anL ? level(anL) : 0, lr = ll ? level(anR) : 0;
  if (ll > 1e-4){ silentFor = 0; tl = 20 * Math.log10(ll * 24 + 1e-5); tr = 20 * Math.log10(lr * 24 + 1e-5); }
  else if (playing && ++silentFor < 40){ tl = tr = -20; }
  else { tl = playing ? -9 + env * 10 : -20; tr = playing ? -10 + env * 10 + Math.random() : -20; }
  tl = Math.max(-20, Math.min(3, tl)); tr = Math.max(-20, Math.min(3, tr));
  vuL += (tl - vuL) * .18; vuR += (tr - vuR) * .18;
  ndL.setAttribute('transform', 'rotate(' + vuAngle(vuL).toFixed(2) + ' 85 118)');
  ndR.setAttribute('transform', 'rotate(' + vuAngle(vuR).toFixed(2) + ' 85 118)');
}

// ---------- now playing ----------
var W = [];
function buildCounter(){
  var h = ''; for (var k = 0; k < 4; k++){ if (k === 2) h += '<span class="c">:</span>'; h += '<div class="whl"><div>' + '0123456789'.split('').map(function(d){ return '<span>'+d+'</span>'; }).join('') + '</div></div>'; }
  $('ctr').innerHTML = h; W = [].slice.call($('ctr').querySelectorAll('.whl div'));
}
function setCounter(s){ var t = fmt(s).replace(':', ''); for (var k = 0; k < 4; k++) W[k].style.transform = 'translateY(' + (-26 * +t[k]) + 'px)'; }
function renderNow(){
  var s = show(), e = ep(), sub = S.subs.indexOf(s.id) >= 0;
  $('nShow').innerHTML = s.f.toFixed(1) + ' · <b>' + s.n + '</b>';
  $('nTitle').textContent = e.t;
  $('nMeta').textContent = s.host + ' · ' + e.date + ' · ' + s.g;
  $('subBtn').setAttribute('aria-pressed', sub); $('subLamp').classList.toggle('on', sub);
  $('dur').textContent = fmt(e.dur);
  $('ticks').innerHTML = e.chap.slice(1).map(function(c){ return '<i style="left:' + (c[0] / e.dur * 100).toFixed(2) + '%"></i>'; }).join('');
  updatePos();
}
function updatePos(){
  var e = ep(), p = posOf(e);
  setCounter(p);
  $('cap').style.left = (p / e.dur * 100).toFixed(2) + '%';
  $('fader').setAttribute('aria-valuenow', Math.round(p));
}
function savePos(){ save('pos', S.pos); }
function seek(p){ var e = ep(); S.pos[e.key] = Math.max(0, Math.min(e.dur - 1, p)); updatePos(); savePos(); }
function setPlaying(v){
  playing = v;
  $('kPlay').classList.toggle('down', v); $('pwrLamp').classList.toggle('on', v);
  $('playLbl').textContent = v ? '暫停' : '播放'; $('kPlay').setAttribute('aria-label', v ? '暫停' : '播放');
  $('playIc').innerHTML = v ? '<path d="M7.5 5v14M16.5 5v14"/>' : '<path d="M7 4.5v15L19 12z"/>';
  if (v) startVoice(); else stopVoice();
  if (typeof kick === 'function') kick();
}
$('kPlay').addEventListener('click', function(){ audio(); click(.08); haptic(!playing ? [10, 20, 10] : 10); setPlaying(!playing); savePos(); });
$('kBack').addEventListener('click', function(){ audio(); click(.06); haptic(8); seek(posOf(ep()) - 15); });
$('kFwd').addEventListener('click', function(){ audio(); click(.06); haptic(8); seek(posOf(ep()) + 30); });
$('subBtn').addEventListener('click', function(){
  var s = show(), k = S.subs.indexOf(s.id); audio(); click(.1);
  if (k >= 0) S.subs.splice(k, 1); else S.subs.push(s.id);
  save('subs', S.subs); haptic([8, 40, 8]); buildScale(); placeScale(); renderNow();
  toast(k >= 0 ? '已取消訂閱 ' + s.n : '已訂閱，刻度上會亮起 ' + s.n);
});
// fader seek
(function(){
  var f = $('fader'), on = false;
  function at(e){ var r = f.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); }
  f.addEventListener('pointerdown', function(e){ on = true; try{ f.setPointerCapture(e.pointerId); }catch(er){} seek(at(e) * ep().dur); haptic(5); });
  f.addEventListener('pointermove', function(e){ if (on) seek(at(e) * ep().dur); });
  f.addEventListener('pointerup', function(){ on = false; }); f.addEventListener('pointercancel', function(){ on = false; });
  f.addEventListener('keydown', function(e){ if (e.key === 'ArrowRight'){ seek(posOf(ep()) + 10); e.preventDefault(); } if (e.key === 'ArrowLeft'){ seek(posOf(ep()) - 10); e.preventDefault(); } });
})();

// ---------- knobs ----------
function makeKnob(el, opts){
  // opts: labels [text], idx(), set(i), fmt()
  var n = opts.labels.length, span = 250, a0 = -125, h = '';
  opts.labels.forEach(function(t, i){
    var a = (a0 + span * i / (n - 1) - 90) * Math.PI / 180, x = 59 + 46 * Math.cos(a), y = 54 + 44 * Math.sin(a);
    h += '<span class="lbl" style="left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px">' + t + '</span>';
  });
  h += '<button class="knob" aria-hidden="true" tabindex="-1"></button>';
  el.innerHTML = h;
  var knob = el.querySelector('.knob'), lbls = el.querySelectorAll('.lbl');
  function paint(){ var i = opts.idx(); knob.style.transform = 'rotate(' + (a0 + span * i / (n - 1)) + 'deg)'; lbls.forEach(function(l, k){ l.classList.toggle('on', k === i); }); el.setAttribute('aria-valuenow', i); el.setAttribute('aria-valuetext', opts.labels[i]); opts.after && opts.after(); }
  function set(i){ i = Math.max(0, Math.min(n - 1, i)); if (i === opts.idx()) return; opts.set(i); paint(); click(.07); haptic(6); }
  var on = false, sy = 0, sx = 0, si = 0, mv = 0;
  el.addEventListener('pointerdown', function(e){ audio(); on = true; sy = e.clientY; sx = e.clientX; si = opts.idx(); mv = 0; try{ el.setPointerCapture(e.pointerId); }catch(er){} });
  el.addEventListener('pointermove', function(e){ if (!on) return; var d = (sy - e.clientY) + (e.clientX - sx); mv = Math.max(mv, Math.abs(d)); set(si + Math.round(d / 26)); });
  function up(){ if (!on) return; on = false; if (mv < 6){ var i = opts.idx() + 1; if (i >= n) i = 0; opts.set(i); paint(); click(.07); haptic(6); } }
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', function(){ on = false; });
  el.addEventListener('keydown', function(e){ if (e.key === 'ArrowUp' || e.key === 'ArrowRight'){ set(opts.idx() + 1); e.preventDefault(); } if (e.key === 'ArrowDown' || e.key === 'ArrowLeft'){ set(opts.idx() - 1); e.preventDefault(); } });
  paint();
  return paint;
}
makeKnob($('kSpeed'), {labels:['0.8','1','1.25','1.5','2'], idx:function(){ return Math.max(0, SPEEDS.indexOf(S.speed)); },
  set:function(i){ S.speed = SPEEDS[i]; save('speed', S.speed); restartVoice(); }, after:function(){ $('rdSpeed').textContent = S.speed + '×'; }});
makeKnob($('kSleep'), {labels:['OFF','15','30','45','60'], idx:function(){ return Math.max(0, SLEEPS.indexOf(S.sleep)); },
  set:function(i){ S.sleep = SLEEPS[i]; S.sleepEnd = S.sleep ? Date.now() + S.sleep * 60000 : 0; save('sleep', S.sleep); save('sleepEnd', S.sleepEnd); kick(); if (S.sleep) toast(S.sleep + ' 分鐘後自動停止'); },
  after:function(){ sleepRead(); }});
var VOLS = [0, .25, .5, .7, .85, 1];
makeKnob($('kVol'), {labels:['0','2','4','6','8','10'], idx:function(){ var b = 0; VOLS.forEach(function(v, i){ if (Math.abs(v - S.vol) < Math.abs(VOLS[b] - S.vol)) b = i; }); return b; },
  set:function(i){ S.vol = VOLS[i]; save('vol', S.vol); if (ac && master) master.gain.setTargetAtTime(S.vol * .9, ac.currentTime, .05); }, after:function(){ $('rdVol').textContent = Math.round(S.vol * 10); }});
function sleepRead(){ $('rdSleep').textContent = S.sleep && S.sleepEnd ? fmt((S.sleepEnd - Date.now()) / 1000) : 'OFF'; }
if (S.sleepEnd && S.sleepEnd < Date.now()){ S.sleep = 0; S.sleepEnd = 0; }

// ---------- sheets ----------
var sheet = $('sheet'), scrim = $('scrim'), lastFocus = null, mode = '';
function openSheet(html, m){ lastFocus = document.activeElement; mode = m; $('sb').innerHTML = html; $('sb').scrollTop = 0; sheet.style.transform = ''; sheet.classList.add('on'); scrim.classList.add('on'); haptic(6); }
function closeSheet(){ if (!sheet.classList.contains('on')) return; sheet.classList.remove('on', 'drag'); sheet.style.transform = ''; scrim.classList.remove('on'); mode = ''; if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); }
scrim.addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeSheet();
  if (e.key === ' ' && e.target === document.body){ e.preventDefault(); $('kPlay').click(); }
});
(function(){
  var sy = 0, dy = 0, t0 = 0, drag = false;
  sheet.addEventListener('pointerdown', function(e){ if (e.target.closest('button')) return; if (e.target.closest('.sb') && $('sb').scrollTop > 0) return; drag = true; sy = e.clientY; dy = 0; t0 = e.timeStamp; sheet.classList.add('drag'); try{ sheet.setPointerCapture(e.pointerId); }catch(er){} });
  sheet.addEventListener('pointermove', function(e){ if (!drag) return; dy = e.clientY - sy; sheet.style.transform = 'translateY(' + (dy > 0 ? dy : dy / 6).toFixed(1) + 'px)'; scrim.style.opacity = Math.max(0, 1 - dy / sheet.offsetHeight).toFixed(2); });
  function end(e){ if (!drag) return; drag = false; sheet.classList.remove('drag'); scrim.style.opacity = ''; var vv = dy / Math.max(1, e.timeStamp - t0); if (dy > sheet.offsetHeight * .35 || (vv > .6 && dy > 20)) closeSheet(); else sheet.style.transform = ''; }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();
function epsHtml(){
  var s = show(), cur = S.epOf[s.id] || 0, sub = S.subs.indexOf(s.id) >= 0;
  return '<h4>' + s.f.toFixed(1) + ' MHz · 節目單</h4><h3>' + s.n + '</h3><p class="sub">' + s.host + ' 主持 · 每週更新 · ' + (sub ? '已訂閱' : '尚未訂閱') + '</p><div class="cnt">最新 ' + s.eps.length + ' 集 · 已聽完 ' + s.eps.filter(function(x){ return S.done[x.key]; }).length + ' 集</div><ul class="eps">' +
    s.eps.map(function(e, i){ var p = posOf(e), dn = S.done[e.key];
      return '<li><button data-ep="' + i + '" class="' + (i === cur ? 'cur' : '') + '"><b>' + (i === cur ? '<span class="np">' + (playing ? '播放中' : '目前') + '</span>' : '') + e.t + '</b><small>' + fmt(e.dur) + '</small><span class="dn">' + e.date + (dn ? ' · 已聽完' : p > 0 ? ' · 剩 ' + fmt(e.dur - p) : '') + '</span><span></span><span class="bar"><i style="width:' + (dn ? 100 : p / e.dur * 100).toFixed(1) + '%"></i></span></button></li>'; }).join('') +
    '</ul><div class="sacts"><button data-act="mark">' + (S.done[ep().key] ? '標為未聽' : '本集標為已聽完') + '</button><button data-act="sub">' + (sub ? '取消訂閱' : '訂閱節目') + '</button></div>';
}
function chHtml(){
  var e = ep(), p = posOf(e), ci = 0; e.chap.forEach(function(c, i){ if (p >= c[0]) ci = i; });
  return '<h4>章節 · CHAPTERS</h4><h3>' + e.t + '</h3><div class="cnt">' + e.chap.length + ' 個章節 · 全長 ' + fmt(e.dur) + ' · 已播 ' + fmt(p) + '</div><ol class="chs">' + e.chap.map(function(c, i){ return '<li><button data-ch="' + c[0] + '" class="' + (i === ci ? 'cur' : '') + '"><small>' + fmt(c[0]) + '</small><b>' + c[1] + '</b><em>' + (i === ci ? '播放中' : fmt(((e.chap[i + 1] || [e.dur])[0]) - c[0])) + '</em></button></li>'; }).join('') + '</ol>';
}
$('kEp').addEventListener('click', function(){ audio(); click(.06); openSheet(epsHtml(), 'ep'); });
$('kCh').addEventListener('click', function(){ audio(); click(.06); openSheet(chHtml(), 'ch'); });
sheet.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return; haptic(8);
  if (b.dataset.ep != null){ savePos(); S.epOf[show().id] = +b.dataset.ep; save('epOf', S.epOf); renderNow(); closeSheet(); if (!playing) setPlaying(true); else restartVoice(); toast('播放：' + ep().t.slice(0, 14)); }
  else if (b.dataset.ch != null){ seek(+b.dataset.ch); closeSheet(); toast('跳到 ' + fmt(+b.dataset.ch)); }
  else if (b.dataset.act === 'mark'){ var k = ep().key; if (S.done[k]) delete S.done[k]; else S.done[k] = true; save('done', S.done); $('sb').innerHTML = epsHtml(); }
  else if (b.dataset.act === 'sub'){ $('subBtn').click(); $('sb').innerHTML = epsHtml(); }
});

// ---------- main loop ----------
var lastT0 = performance.now(), raf = 0, lastSec = -1;
function loop(t){
  raf = requestAnimationFrame(loop);
  // park the loop once nothing is moving: paused, needles at rest, no sleep timer
  if (!playing && !(S.sleep && S.sleepEnd) && vuL < -19.95 && vuR < -19.95){ cancelAnimationFrame(raf); raf = 0; vuFrame(); return; }
  var dt = Math.min(.1, (t - lastT0) / 1000); lastT0 = t;
  if (playing){
    var e = ep(), p = posOf(e) + dt * S.speed;
    if (p >= e.dur - 1){ p = e.dur - 1; S.done[e.key] = true; save('done', S.done); setPlaying(false); toast('本集播完了'); }
    S.pos[e.key] = p;
    if (Math.floor(p) !== lastSec){ lastSec = Math.floor(p); updatePos(); if (lastSec % 5 === 0) savePos(); }
  }
  if (S.sleep && S.sleepEnd){
    if (Date.now() >= S.sleepEnd){ S.sleep = 0; S.sleepEnd = 0; save('sleep', 0); save('sleepEnd', 0); if (playing) setPlaying(false); toast('睡眠計時到，晚安'); kSleepPaint(); }
    else if (Math.floor(t / 500) % 2 === 0) sleepRead();
  }
  vuFrame();
}
var kSleepPaint = function(){ sleepRead(); var el = $('kSleep'); el.querySelector('.knob').style.transform = 'rotate(-125deg)'; el.querySelectorAll('.lbl').forEach(function(l, k){ l.classList.toggle('on', k === 0); }); };
function kick(){ if (!raf && !document.hidden){ lastT0 = performance.now(); raf = requestAnimationFrame(loop); } }
document.addEventListener('visibilitychange', function(){ cancelAnimationFrame(raf); raf = 0; if (!document.hidden) kick(); });
$('body').addEventListener('scroll', function(){ document.querySelector('.status').classList.toggle('sc', this.scrollTop > 4); }, {passive:true});
window.addEventListener('resize', placeScale);

buildScale(); buildVU(); buildCounter(); renderNow(); placeScale();
raf = requestAnimationFrame(loop);
// backdrop scale (desktop frame only)
(function(){
  var g = document.getElementById('bscale'), h = '';
  for (var f = 88; f <= 108; f += .5){ var x = -120 + (f - 88) * 90, big = f % 2 === 0;
    h += '<rect x="' + x + '" y="' + (big ? 136 : 146) + '" width="3" height="' + (big ? 34 : 20) + '" fill="#c78a33"/>';
    if (big) h += '<text x="' + x + '" y="122" text-anchor="middle" fill="#ffb547" style="font:700 34px DIN Alternate,sans-serif">' + f + '</text>'; }
  SHOWS.forEach(function(s){ var x = -120 + (s.f - 88) * 90; h += '<text x="' + x + '" y="250" text-anchor="middle" fill="#a8752b" style="font:600 26px PingFang TC,sans-serif">' + s.n + '</text>'; });
  h += '<rect x="-120" y="170" width="1900" height="3" fill="#c78a33"/>';
  g.innerHTML = h;
})();
})();
</script>
