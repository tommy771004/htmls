:transparent;border:0;color:#302821;font-size:14px;line-height:1.4}.inputWrap textarea:focus{outline:0}.fieldnote{font:11px/1.4 ui-monospace,monospace;color:#8b735f;margin:7px 0 14px}.fieldnote.error{color:#b0392d}.inks{display:flex;align-items:center;gap:12px;margin:4px 0 17px}.ink{width:44px;height:44px;border-radius:50%;border:5px solid #eadcc4;box-shadow:0 0 0 1px #aa8d6b,inset 0 0 0 2px #ffffff77;cursor:pointer}.ink[aria-pressed=true]{box-shadow:0 0 0 2px #352a20,0 0 0 5px #eadcc4,inset 0 0 0 2px #ffffff77}.ink.red{background:#ad4238}.ink.blue{background:#214a61}.ink.black{background:#222321}.inkname{font-size:11px;color:#745c4b}.printArea{display:flex;justify-content:center;position:relative;padding:10px 0 16px;background:repeating-linear-gradient(45deg,#b48b5a18 0 1px,transparent 1px 10px);border-top:1px solid #c9ae8b;border-bottom:1px solid #c9ae8b}.paper{width:min(100%,295px);background:#fffbf1;padding:15px;box-shadow:2px 5px 0 #c9b69a,4px 8px 14px #54372144;transform:rotate(-1deg);position:relative}.paper:before{content:"印章實驗室 · STAMP 086";display:block;text-align:center;font:10px ui-monospace,monospace;letter-spacing:.11em;color:var(--ink,#ad4238);border-top:2px solid currentColor;padding-top:5px}.paper canvas{display:block;width:100%;height:auto;image-rendering:pixelated;margin:7px auto 0}.paper:after{content:"SCAN ME  •  MADE OFFLINE";display:block;text-align:center;border-bottom:2px solid var(--ink,#ad4238);padding-bottom:6px;color:var(--ink,#ad4238);font:10px ui-monospace,monospace;letter-spacing:.12em}.paper.stamp{animation:stamp .38s cubic-bezier(.1,1,.4,1)}@keyframes stamp{0%{transform:translateY(-50px) rotate(-8deg) scale(1.25);opacity:.1}45%{transform:translateY(4px) rotate(0) scale(.96);opacity:1}100%{transform:rotate(-1deg)}}.actions{display:flex;gap:10px;margin:17px 0}.actions button{min-height:45px;flex:1;border:1px solid #694d39;background:#fff7e6;box-shadow:2px 3px 0 #b59a7b;font:bold 12px ui-monospace,monospace;color:#382e26}.actions button.primary{background:#ad4238;border-color:#87342b;color:#fff8e9;flex:1.3}.actions button:active{transform:translate(2px,3px);box-shadow:0 0}.tip{font:11px/1.5 ui-monospace,monospace;color:#8d745d}.history{min-height:370px}.history h2{font:28px Georgia,serif;margin:0 0 8px}.history p{font:12px/1.6 ui-monospace,monospace;color:#755e4b}.record{display:flex;align-items:center;gap:10px;width:100%;padding:12px 4px;text-align:left;border:0;border-bottom:1px dashed #aa9278;background:transparent;color:#36291e}.record .swatch{width:22px;height:22px;border-radius:50%;flex:none}.record strong{display:block;max-width:310px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:13px ui-monospace,monospace}.record small{color:#8b715d}.clear{border:0;background:transparent;text-decoration:underline;margin-top:16px;padding:5px 0;color:#ad4238}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#302821;color:#fff8e8;padding:10px 15px;font:12px ui-monospace,monospace;z-index:3;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}[hidden]{display:none!important}@media(min-width:700px){.workshop{margin:25px auto;min-height:calc(100dvh - 50px);border:9px solid #6a482d;border-radius:15px}.status{height:30px}}@media(prefers-reduced-motion:reduce){.paper.stamp{animation:none}.toast{transition:none}}
</style></head><body><main class="workshop"><div class="status"><span>09:41</span><span>INK / 100% ▰▰▰</span></div><header class="header"><div class="kicker">STAMP WORKSHOP / POCKET EDITION</div><h1>印 QR</h1><p>自己的訊息，自己蓋章。</p><div class="serial">86<br>APP</div></header><nav class="tabs" aria-label="頁面"><button class="active" data-tab="make">01 製作</button><button data-tab="history">02 印跡 <span id="count">0</span></button></nav><section class="pane" id="make"><label class="fieldlabel" for="content">01 / 要印什麼？</label><div class="inputWrap"><textarea id="content" spellcheck="false" placeholder="網址、短句、聯絡資訊…">https://htmls-ruddy.vercel.app/</textarea></div><p class="fieldnote" id="bytes">0 / 106 UTF-8 bytes</p><span class="fieldlabel">02 / 選印泥</span><div class="inks" role="group" aria-label="印泥顏色"><button class="ink red" data-ink="#ad4238" aria-label="朱紅" aria-pressed="true"></button><button class="ink blue" data-ink="#214a61" aria-label="海軍藍" aria-pressed="false"></button><button class="ink black" data-ink="#222321" aria-label="黑墨" aria-pressed="false"></button><span class="inkname" id="inkname">朱紅印泥</span></div><div class="printArea"><div class="paper" id="paper"><canvas id="qr" aria-label="可掃描的 QR Code"></canvas></div></div><div class="actions"><button class="primary" id="stamp">蓋章 / 產生</button><button id="download">下載 PNG</button></div><p class="tip">QR 採標準低容錯等級編碼，離線也可掃描。<br>短文會使用較疏朗的版面；最多 106 bytes。</p></section><section class="pane history" id="history" hidden><h2>留下的印跡</h2><p>點一枚印跡，即可再次蓋上同樣的內容。</p><div id="records"></div><button class="clear" id="clear">清空歷史</button></section></main><div class="toast" id="toast" role="status"></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s), encoder=new TextEncoder();let color='#ad4238',history;try{history=JSON.parse(localStorage.getItem('stamp-qr:history')||'[]')}catch{history=[]}let matrix=null,toastTimer;function note(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2500)}function mul(a,b){let v=0;for(let i=7;i>=0;i--){v=(v<<1)^((v&128)?0x11d:0);v^=((b>>>i)&1)?a:0}return v&255}function encode(value){const bytes=Array.from(encoder.encode(value));if(bytes.length>106)throw Error('內容超過 106 bytes');const v=bytes.length<=53?3:5,n=v*4+17,dataLen=v===3?55:108,eccLen=v===3?15:26,center=v===3?22:30;let bits=[];function add(val,num){for(let i=num-1;i>=0;i--)bits.push((val>>>i)&1)}add(4,4);add(bytes.length,8);bytes.forEach(b=>add(b,8));for(let i=0;i<Math.min(4,dataLen*8-bits.length);i++)bits.push(0);while(bits.length%8)bits.push(0);let data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(''),2));let pad=0;while(data.length<dataLen)data.push((pad++%2)===0?0xec:0x11);let div=[1];for(let i=0,p=1;i<eccLen;i++,p=mul(p,2)){let next=Array(div.length+1).fill(0);div.forEach((c,j)=>{next[j]^=c;next[j+1]^=mul(c,p)});div=next}let ecc=Array(eccLen).fill(0);data.forEach(b=>{let factor=b^ecc.shift();ecc.push(0);for(let j=0;j<eccLen;j++)ecc[j]^=mul(div[j+1],factor)});let all=data.concat(ecc),stream=[];all.forEach(b=>addBits(b,stream));function addBits(b,out){for(let i=7;i>=0;i--)out.push((b>>>i)&1)}let m=Array.from({length:n},()=>Array(n).fill(false)),fn=Array.from({length:n},()=>Array(n).fill(false));function set(x,y,dark){if(x>=0&&y>=0&&x<n&&y<n){m[y][x]=!!dark;fn[y][x]=true}}function finder(cx,cy){for(let y=-4;y<=4;y++)for(let x=-4;x<=4;x++){let d=Math.max(Math.abs(x),Math.abs(y));set(cx+x,cy+y,d!==2&&d!==4)}}for(let i=8;i<n-8;i++){set(6,i,i%2===0);set(i,6,i%2===0)}finder(3,3);finder(n-4,3);finder(3,n-4);for(let y=-2;y<=2;y++)for(let x=-2;x<=2;x++)set(center+x,center+y,Math.max(Math.abs(x),Math.abs(y))!==1);function format(mask){let val=(1<<3)|mask,rem=val;for(let i=0;i<10;i++)rem=(rem<<1)^(((rem>>>9)&1)*0x537);let b=((val<<10)|rem)^0x5412;let bit=i=>((b>>>i)&1)!==0;for(let i=0;i<=5;i++)set(8,i,bit(i));set(8,7,bit(6));set(8,8,bit(7));set(7,8,bit(8));for(let i=9;i<15;i++)set(14-i,8,bit(i));for(let i=0;i<8;i++)set(n-1-i,8,bit(i));for(let i=8;i<15;i++)set(8,n-15+i,bit(i));set(8,n-8,true)}format(0);let pos=0;for(let right=n-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<n;vert++){let y=(((right+1)&2)===0)?n-1-vert:vert;for(let j=0;j<2;j++){let x=right-j;if(fn[y][x])continue;let b=pos<stream.length?stream[pos]:0;pos++;m[y][x]=!!(b^(((x+y)%2===0)?1:0))}}}format(0);return m}function paint(canvas,scale=8){if(!matrix)return;let n=matrix.length,q=4;canvas.width=(n+q*2)*scale;canvas.height=canvas.width;let c=canvas.getContext('2d');c.fillStyle='#fffbf1';c.fillRect(0,0,canvas.width,canvas.height);c.fillStyle=color;for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(matrix[y][x])c.fillRect((x+q)*scale,(y+q)*scale,scale,scale)}function saveHistory(value){history=history.filter(r=>r.value!==value);history.unshift({value,color,date:new Date().toLocaleDateString('zh-TW')});history=history.slice(0,12);localStorage.setItem('stamp-qr:history',JSON.stringify(history));renderHistory()}function generate(save=true){let value=$('#content').value.trim();if(!value){note('先寫一點內容再蓋章');return false}try{matrix=encode(value)}catch(e){note(e.message);return false}paint($('#qr'));let p=$('#paper');p.style.setProperty('--ink',color);p.classList.remove('stamp');void p.offsetWidth;p.classList.add('stamp');if(save)saveHistory(value);return true}function renderHistory(){$('#count').textContent=history.length;let root=$('#records');root.replaceChildren();history.forEach((r,i)=>{let b=document.createElement('button');b.className='record';let sw=document.createElement('span');sw.className='swatch';sw.style.background=r.color;let info=document.createElement('span');let strong=document.createElement('strong');strong.textContent=r.value;let small=document.createElement('small');small.textContent='NO. '+String(history.length-i).padStart(2,'0')+'  /  '+r.date;info.append(strong,small);b.append(sw,info);b.onclick=()=>{$('#content').value=r.value;color=r.color;setInk();show('make');updateBytes();generate(false)};root.append(b)});if(!history.length){let p=document.createElement('p');p.textContent='還沒有印跡。從第一枚開始吧。';root.append(p)}}function show(name){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));$('#make').hidden=name!=='make';$('#history').hidden=name!=='history'}function setInk(){document.querySelectorAll('[data-ink]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ink===color)));$('#inkname').textContent=color==='#ad4238'?'朱紅印泥':color==='#214a61'?'海軍藍印泥':'黑墨印泥';$('#paper').style.setProperty('--ink',color);paint($('#qr'))}function updateBytes(){let n=encoder.encode($('#content').value.trim()).length;$('#bytes').textContent=n+' / 106 UTF-8 bytes';$('#bytes').classList.toggle('error',n>106)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));document.querySelectorAll('[data-ink]').forEach(b=>b.onclick=()=>{color=b.dataset.ink;setInk()});$('#content').oninput=updateBytes;$('#stamp').onclick=()=>{if(generate())note('印好了 · 已存到印跡')};$('#download').onclick=()=>{if(!matrix&&!generate(false))return;let hi=document.createElement('canvas');paint(hi,24);let a=document.createElement('a');a.download='stamp-qr.png';a.href=hi.toDataURL('image/png');a.click();note('PNG 已下載')};$('#clear').onclick=()=>{history=[];localStorage.removeItem('stamp-qr:history');renderHistory();note('印跡已清空')};updateBytes();renderHistory();generate(false)})();
</script></body></html>
