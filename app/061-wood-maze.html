</style></head><body><main class="world"><section class="shell"><header class="top"><div><span class="edition">HANDMADE POCKET GAMES · NO. 061</span><h1>木迷宮</h1></div><i class="screw"></i></header><div class="meter"><div><small>LEVEL</small><strong id="levelNo">01 / 03</strong><span class="pips" id="pips" aria-hidden="true"><i></i><i></i><i></i></span></div><div><small>TIME</small><strong id="time">00:00</strong></div><div><small>BEST</small><strong id="best">—</strong></div></div><div class="boardArea" id="boardArea"><div class="boardWrap"><canvas class="board" id="board" width="320" height="400" tabindex="0" aria-label="木迷宮遊戲板，拖曳或使用方向鍵傾斜"></canvas><div class="tilt" aria-hidden="true"><i id="bubble"></i></div><div class="status" id="status">拖曳木盤，移動鋼珠</div><div class="toast" id="toast" role="status"><b id="toastTitle"></b><span id="toastText"></span></div></div></div><p class="plate">傾斜木盤 · 避開黑洞 · 抵達銅環<br>也可使用鍵盤方向鍵；手機可啟用陀螺儀</p><nav class="controls"><button id="prev" aria-label="上一關">◀</button><button id="reset">重置本關</button><button class="primary" id="gyro">啟用傾斜</button><button id="next" aria-label="下一關">▶</button></nav></section></main><script>
(()=>{'use strict';const W=320,H=400,canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),el=id=>document.getElementById(id);const levels=[{start:[32,34],goal:[285,364],holes:[[155,93],[246,166],[86,242],[216,292]],walls:[[76,55,9,100],[76,146,152,9],[219,74,9,81],[38,207,140,9],[178,207,9,116],[64,314,124,9]]},{start:[32,365],goal:[287,35],holes:[[65,290],[145,315],[270,268],[106,175],[235,111]],walls:[[40,79,9,158],[40,79,210,9],[113,134,9,163],[113,288,149,9],[216,133,9,112],[216,133,56,9]]},{start:[34,36],goal:[286,364],holes:[[93,88],[195,48],[261,119],[154,168],[75,249],[246,238],[180,320]],walls:[[46,127,172,9],[113,52,9,75],[219,127,9,105],[42,229,137,9],[170,229,9,97],[170,317,103,9],[57,325,9,47]]}];let level=0,ball={x:32,y:34,vx:0,vy:0},tilt={x:0,y:0},keys=new Set(),running=false,won=false,failed=false,elapsed=0,last=performance.now(),pointer=false,gyro=false,toastTimer,rafId=0,fall=null,winFx=null,dpr=1;const reduce=matchMedia('(prefers-reduced-motion: reduce)');const bests=JSON.parse(localStorage.getItem('wood-maze:bests')||'[null,null,null]');function setToast(title,message){el('toastTitle').textContent=title;el('toastText').textContent=message;el('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el('toast').classList.remove('show'),2400)}function reset(){let s=levels[level].start;ball={x:s[0],y:s[1],vx:0,vy:0};elapsed=0;running=false;won=false;failed=false;tilt={x:0,y:0};el('levelNo').textContent=String(level+1).padStart(2,'0')+' / 03';el('time').textContent='00:00';el('best').textContent=bests[level]?format(bests[level]):'—';el('status').textContent='拖曳木盤，移動鋼珠';fall=null;winFx=null;el('bubble').style.setProperty('--tx','0px');el('bubble').style.setProperty('--ty','0px');[...el('pips').children].forEach((p,i)=>{p.classList.toggle('done',!!bests[i]);p.classList.toggle('cur',i===level)});draw()}function fit(){let a=el('boardArea'),aw=a.clientWidth-18,ah=a.clientHeight-18,w=Math.max(120,Math.floor(Math.min(aw,ah*W/H)));canvas.style.width=w+'px';canvas.style.height=Math.round(w*H/W)+'px';dpr=Math.min(3,Math.max(1,(w/W)*(window.devicePixelRatio||1)));canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);draw()}function active(){return pointer||keys.size>0||gyro||(running&&!won&&!failed)||(fall&&fall.t<1)||(winFx&&winFx.t<1)}function kick(){if(!rafId&&!document.hidden){last=performance.now();rafId=requestAnimationFrame(frame)}}function format(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')}function rectBall(r){let px=Math.max(r[0],Math.min(ball.x,r[0]+r[2])),py=Math.max(r[1],Math.min(ball.y,r[1]+r[3])),dx=ball.x-px,dy=ball.y-py,d=Math.hypot(dx,dy);if(d<9){if(d<.001){if(ball.vx||ball.vy){dx=-ball.vx;dy=-ball.vy;d=Math.hypot(dx,dy)}else{dx=1;d=1}}let nx=dx/d,ny=dy/d;ball.x+=nx*(9-d);ball.y+=ny*(9-d);let dot=ball.vx*nx+ball.vy*ny;if(dot<0){ball.vx-=1.55*dot*nx;ball.vy-=1.55*dot*ny}}}function step(dt){if(fall&&fall.t<1)fall.t=Math.min(1,fall.t+dt/.38);if(winFx&&winFx.t<1)winFx.t=Math.min(1,winFx.t+dt/.7);if(won||failed)return;let kx=(keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0),ky=(keys.has('ArrowDown')?1:0)-(keys.has('ArrowUp')?1:0),ax=Math.max(-1,Math.min(1,tilt.x+kx)),ay=Math.max(-1,Math.min(1,tilt.y+ky));if(Math.abs(ax)+Math.abs(ay)>.03)running=true;if(!running)return;elapsed+=dt;ball.vx=(ball.vx+ax*300*dt)*Math.pow(.986,dt*60);ball.vy=(ball.vy+ay*300*dt)*Math.pow(.986,dt*60);let speed=Math.hypot(ball.vx,ball.vy),limit=180;if(speed>limit){ball.vx*=limit/speed;ball.vy*=limit/speed}let parts=Math.max(1,Math.ceil(speed*dt/4));for(let i=0;i<parts;i++){ball.x+=ball.vx*dt/parts;ball.y+=ball.vy*dt/parts;ball.x=Math.max(9,Math.min(W-9,ball.x));ball.y=Math.max(9,Math.min(H-9,ball.y));for(let r of levels[level].walls)rectBall(r);for(let h of levels[level].holes)if(Math.hypot(ball.x-h[0],ball.y-h[1])<11){failed=true;fall={x:ball.x,y:ball.y,h,t:reduce.matches?1:0};el('status').textContent='點木盤重新開始';setToast('掉進洞裡','點木盤或「重置本關」再試一次');return}let g=levels[level].goal;if(Math.hypot(ball.x-g[0],ball.y-g[1])<13){won=true;winFx={t:reduce.matches?1:0};el('status').textContent='成功抵達銅環';if(!bests[level]||elapsed<bests[level]){bests[level]=elapsed;localStorage.setItem('wood-maze:bests',JSON.stringify(bests))}el('best').textContent=format(bests[level]);el('pips').children[level].classList.add('done');setToast('漂亮的一球',level===2?'三關全部完成！':'按 ▶ 前往下一關');return}}el('time').textContent=format(elapsed)}function draw(){ctx.clearRect(0,0,W,H);let wood=ctx.createLinearGradient(0,0,320,400);wood.addColorStop(0,'#e5c494');wood.addColorStop(.46,'#c99e68');wood.addColorStop(1,'#deb985');ctx.fillStyle=wood;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.11;for(let i=0;i<85;i++){let y=(i*73)%H;ctx.strokeStyle=i%3?'#754b28':'#fff0cc';ctx.lineWidth=(i%4)/4+.4;ctx.beginPath();ctx.moveTo(0,y);ctx.bezierCurveTo(80,y+7*Math.sin(i),210,y-8*Math.cos(i*2),320,y+4*Math.sin(i));ctx.stroke()}ctx.globalAlpha=1;ctx.strokeStyle='#7e5833';ctx.lineWidth=3;ctx.strokeRect(2,2,W-4,H-4);let g=levels[level].goal;ctx.fillStyle='#69502e';ctx.beginPath();ctx.arc(...g,17,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e9c464';ctx.lineWidth=5;ctx.beginPath();ctx.arc(...g,14,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#b88a45';ctx.font='13px Georgia';ctx.textAlign='center';ctx.fillText('◎',g[0],g[1]+5);for(let h of levels[level].holes){let grad=ctx.createRadialGradient(h[0]-3,h[1]-4,1,h[0],h[1],16);grad.addColorStop(0,'#030303');grad.addColorStop(.72,'#201810');grad.addColorStop(1,'#78512f');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(h[0],h[1],15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f6d6a2';ctx.lineWidth=1;ctx.stroke()}for(let r of levels[level].walls){ctx.fillStyle='#694225';ctx.fillRect(r[0]+3,r[1]+4,r[2],r[3]);let wg=ctx.createLinearGradient(r[0],r[1],r[0]+r[2],r[1]+r[3]);wg.addColorStop(0,'#d7ae77');wg.addColorStop(.5,'#b78955');wg.addColorStop(1,'#e6bf87');ctx.fillStyle=wg;ctx.fillRect(...r);ctx.strokeStyle='#8f6138';ctx.lineWidth=1;ctx.strokeRect(...r)}if(winFx&&winFx.t<1){ctx.strokeStyle='rgba(233,196,100,'+(1-winFx.t)+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(g[0],g[1],17+winFx.t*26,0,7);ctx.stroke()}let bx=ball.x,by=ball.y,br=9;if(fall){let e=fall.t*fall.t*(3-2*fall.t);bx=fall.x+(fall.h[0]-fall.x)*e;by=fall.y+(fall.h[1]-fall.y)*e;br=9*(1-.72*e);ctx.globalAlpha=1-.55*e}ctx.save();ctx.translate(bx,by);ctx.scale(br/9,br/9);ctx.translate(-ball.x,-ball.y);if(!fall){ctx.fillStyle='#20191455';ctx.beginPath();ctx.ellipse(ball.x+3,ball.y+6,9,6,0,0,7);ctx.fill()}let metal=ctx.createRadialGradient(ball.x-4,ball.y-5,1,ball.x,ball.y,10);metal.addColorStop(0,'#fff');metal.addColorStop(.22,'#e9e8e3');metal.addColorStop(.65,'#898f90');metal.addColorStop(1,'#3b4142');ctx.fillStyle=metal;ctx.beginPath();ctx.arc(ball.x,ball.y,9,0,7);ctx.fill();ctx.strokeStyle='#353a3b';ctx.lineWidth=1;ctx.stroke();ctx.restore();ctx.globalAlpha=1}function frame(now){rafId=0;let dt=Math.min(.033,(now-last)/1000);last=now;step(dt);draw();if(active())kick()}canvas.addEventListener('pointerdown',e=>{if(failed&&(!fall||fall.t>=1)){reset();return}pointer=true;kick();canvas.setPointerCapture(e.pointerId);move(e)});canvas.addEventListener('pointermove',e=>{if(pointer)move(e)});function move(e){let r=canvas.getBoundingClientRect();tilt.x=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-.5)*2.2));tilt.y=Math.max(-1,Math.min(1,((e.clientY-r.top)/r.height-.5)*2.2));el('bubble').style.setProperty('--tx',(tilt.x*13)+'px');el('bubble').style.setProperty('--ty',(tilt.y*13)+'px')}function release(){pointer=false;if(!gyro){tilt={x:0,y:0};el('bubble').style.setProperty('--tx','0px');el('bubble').style.setProperty('--ty','0px')}}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);window.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){e.preventDefault();keys.add(e.key);kick()}});window.addEventListener('keyup',e=>keys.delete(e.key));el('reset').onclick=reset;el('prev').onclick=()=>{level=(level+2)%3;reset()};el('next').onclick=()=>{level=(level+1)%3;reset()};el('gyro').onclick=async()=>{if(!('DeviceOrientationEvent'in window)){setToast('此裝置不支援','請拖曳木盤或使用方向鍵');return}try{if(typeof DeviceOrientationEvent.requestPermission==='function'&&(await DeviceOrientationEvent.requestPermission())!=='granted')return;gyro=!gyro;kick();el('gyro').textContent=gyro?'關閉傾斜':'啟用傾斜';setToast(gyro?'陀螺儀已啟用':'陀螺儀已關閉',gyro?'輕輕傾斜手機移動鋼珠':'可拖曳木盤繼續遊玩')}catch{setToast('無法啟用','請拖曳木盤或使用方向鍵')}};window.addEventListener('deviceorientation',e=>{if(!gyro||pointer)return;tilt.x=Math.max(-1,Math.min(1,(e.gamma||0)/22));tilt.y=Math.max(-1,Math.min(1,(e.beta||0)/22));el('bubble').style.setProperty('--tx',(tilt.x*13)+'px');el('bubble').style.setProperty('--ty',(tilt.y*13)+'px');kick()});document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(rafId);rafId=0}else kick()});new ResizeObserver(fit).observe(el('boardArea'));reset();fit()})();
