<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c140f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="水景">
<title>水景 · 水族箱控制</title>
<meta name="description" content="自然水景缸的控制台：魚群在程式繪製的石組造景裡游動，點水面餵食、拖曳光照排程環、記錄水質與換水。收錄於 100 Creative HTML Works（App 067・天野自然水景）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/067-nature-aquarium.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2386a86f'/%3E%3Cpath d='M0 44c10-6 20-4 30 0s22 4 34-2v22H0z' fill='%233b2c22'/%3E%3Cpath d='M18 46l6-16 10 3 6 13z' fill='%238a8676'/%3E%3Cpath d='M4 50c6-5 14-5 20-2' stroke='%236fae4d' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M38 22l8-3 4 3-4 3z' fill='%23d6453a'/%3E%3Cpath d='M38 21.5l10-1.5' stroke='%2348c9d6' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
:root{
  --deep:#0c140f;
  --panel:#122018;
  --panel2:#1a2b20;
  --sand:#e6d6b0;
  --ink:#efe7d4;
  --ink2:#b2bda6;
  --ink3:#86937c;
  --light:#fff3d2;
  --leaf:#8cc06a;
  --warn:#e8a37a;
  --sans:"Hiragino Sans","PingFang TC",system-ui,sans-serif;
  --spring:cubic-bezier(.3,1.3,.5,1);
  --out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.5 var(--sans);color:var(--ink);background:var(--deep);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--sand);outline-offset:2px;border-radius:8px}
svg{display:block}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;overflow:clip;background:var(--deep);isolation:isolate}
@media (min-width:521px){
  .stage{display:flex;align-items:center;justify-content:center;gap:64px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:52px;padding:7px;z-index:1;
    background:linear-gradient(160deg,rgba(214,236,210,.55),rgba(120,160,120,.22) 30%,rgba(214,236,210,.4) 60%,rgba(90,130,95,.3));
    box-shadow:inset 0 0 0 1px rgba(230,245,225,.45),inset 0 1px 0 rgba(255,255,255,.6),0 18px 30px -18px rgba(0,0,0,.8)}
  .screen{inset:7px;border-radius:45px}
  .caption{display:block;position:relative;z-index:1;max-width:260px}
  .caption h1{font:200 60px/1 var(--sans);letter-spacing:.18em;color:var(--light)}
  .caption p{margin-top:16px;font-size:15px;line-height:1.75;color:var(--ink2)}
}
@media (min-width:521px) and (max-width:880px){.caption{display:none}}

canvas#tank{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
.status{position:absolute;top:0;left:0;right:0;z-index:30;height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 32px;display:flex;align-items:center;justify-content:space-between;font:600 15px/1 var(--sans);color:var(--ink);pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}

/* ---------- drawer ---------- */
.drawer{position:absolute;left:0;right:0;top:0;height:100%;z-index:10;background:var(--panel);border-radius:26px 26px 0 0;
  transform:translateY(var(--y,420px));transition:transform .5s var(--spring);display:flex;flex-direction:column;
  box-shadow:inset 0 1px 0 rgba(239,231,212,.12),0 -6px 14px -10px rgba(0,0,0,.6)}
.drawer.drag{transition:none}
.dhead{flex:none;padding:8px 20px 0;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.grip{width:40px;height:5px;border-radius:3px;background:rgba(239,231,212,.25);margin:0 auto 10px}
.ttl{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ttl h1{font:300 24px/1 var(--sans);letter-spacing:.2em}
.ttl .meta{font-size:13px;color:var(--ink2);white-space:nowrap}
.tabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin-top:8px}
.tab{height:46px;font-size:15px;color:var(--ink3);transition:color .2s}
.tab[aria-selected=true]{color:var(--ink);font-weight:600}
.tabs .leaf{position:absolute;bottom:4px;left:0;width:25%;height:10px;pointer-events:none;transition:transform .45s var(--spring)}
.tabs .leaf svg{width:34px;height:10px;margin:0 auto}
.panes{flex:1;min-height:0;position:relative;overflow:hidden;overflow:clip;touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .45s var(--out)}
.track.drag{transition:none}
.pane{flex:0 0 100%;height:100%;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px);mask-image:linear-gradient(to bottom,transparent 0,#000 14px);overflow-y:auto;overflow-x:hidden;padding:14px 20px calc(var(--pad,440px) + 30px + env(safe-area-inset-bottom));scrollbar-width:none;overscroll-behavior:contain}
.pane::-webkit-scrollbar{display:none}

/* light */
.lightrow{display:flex;align-items:center;gap:14px}
.dial{position:relative;flex:none;width:196px;height:196px;touch-action:none}
.dial svg{width:100%;height:100%}
.dial .hnd{cursor:grab}
.dial text{font-family:var(--sans)}
.dcent{position:absolute;inset:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.dcent b{font:300 30px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.dcent span{margin-top:6px;font-size:12px;color:var(--ink2)}
.linfo{flex:1;min-width:0}
.linfo .k{font-size:13px;color:var(--ink3)}
.linfo .v{font:400 19px/1.2 var(--sans);font-variant-numeric:tabular-nums;margin-bottom:10px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.setrow+.setrow{box-shadow:0 -1px 0 rgba(239,231,212,.07)}
.setrow .l{font-size:15px}
.setrow .l small{display:block;font-size:13px;color:var(--ink3)}
.range{-webkit-appearance:none;appearance:none;width:150px;height:44px;background:transparent;touch-action:none}
.range::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--sand) var(--p,50%),rgba(239,231,212,.14) var(--p,50%))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;margin-top:-9px;background:var(--light);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.range::-moz-range-track{height:6px;border-radius:3px;background:rgba(239,231,212,.14)}
.range::-moz-range-progress{height:6px;border-radius:3px;background:var(--sand)}
.range::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:var(--light)}
.sw{position:relative;width:52px;height:32px;border-radius:16px;background:rgba(239,231,212,.14);flex:none;transition:background-color .25s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:var(--ink2);transition:transform .35s var(--spring),background-color .25s}
.sw[aria-checked=true]{background:#5f8a4a}
.sw[aria-checked=true]::after{transform:translateX(20px);background:var(--light)}
.swwrap{min-height:44px;min-width:60px;display:flex;align-items:center;justify-content:flex-end}
.act{height:50px;padding:0 20px;border-radius:14px;background:var(--sand);color:#1c2a1f;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background-color .15s,transform .15s}
.act:active{background:#d5c395;transform:scale(.97)}
.act svg{width:20px;height:20px}
.act.wide{width:100%;margin-top:14px}
.quiet{height:44px;padding:0 4px;color:var(--sand);font-size:15px;display:inline-flex;align-items:center;gap:6px}
.quiet:active{opacity:.6}
.quiet svg{width:18px;height:18px}

/* water */
.wq{display:grid;grid-template-columns:1fr 112px 58px;align-items:center;gap:10px;width:100%;min-height:62px;text-align:left;padding:6px 0}
.wq+.wq{box-shadow:0 -1px 0 rgba(239,231,212,.07)}
.wq:active{background:rgba(239,231,212,.04)}
.wq .n{font-size:13px;color:var(--ink3)}
.wq .v{font:300 24px/1.1 var(--sans);font-variant-numeric:tabular-nums}
.wq .v small{font-size:13px;color:var(--ink2);margin-left:3px}
.wq svg{width:112px;height:34px}
.wq .s{font-size:13px;text-align:right;color:var(--leaf)}
.wq .s.hi{color:var(--warn)}
.hint{font-size:13px;color:var(--ink3);margin-top:10px;line-height:1.6}

/* feed */
.feedtop{display:flex;align-items:center;gap:16px}
.bowl{flex:none;width:92px;height:92px}
.bowl svg{width:100%;height:100%}
.feedtop .big{font:300 40px/1 var(--sans);font-variant-numeric:tabular-nums}
.feedtop .big small{font-size:16px;color:var(--ink2);margin-left:4px}
.feedtop p{font-size:13px;color:var(--ink2);margin-top:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-radius:14px;background:rgba(239,231,212,.06);padding:3px;position:relative}
.seg button{position:relative;z-index:1;height:44px;border-radius:11px;font-size:15px;color:var(--ink2);transition:color .2s}
.seg button[aria-checked=true]{color:#1c2a1f;font-weight:600}
.seg .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:11px;background:var(--sand);transition:transform .4s var(--spring)}
.day{margin-top:18px}
.day svg{width:100%;height:46px}
.log{margin-top:6px}
.log li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:11px 0;font-size:15px}
.log li+li{box-shadow:0 -1px 0 rgba(239,231,212,.07)}
.log li span{color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--ink3);margin-top:18px}

/* change */
.chg{display:flex;align-items:flex-end;gap:16px}
.chg .big{font:200 64px/.9 var(--sans);font-variant-numeric:tabular-nums}
.chg .big small{font-size:18px;font-weight:300;color:var(--ink2);margin-left:4px}
.chg p{font-size:13px;color:var(--ink2);padding-bottom:6px}
.minitank{width:100%;height:84px;margin-top:16px}
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:100%;background:#cbb582;transform:scaleX(0);transform-origin:left;pointer-events:none}
.hold.on .fill{transform:scaleX(1);transition:transform 1.1s linear}
.hold span,.hold svg{position:relative}
.bars svg{width:100%;height:70px;margin-top:8px}

/* sheet + toast */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(6,10,7,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:var(--panel2);border-radius:26px 26px 0 0;padding:10px 22px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(105%);visibility:hidden;transition:transform .5s var(--spring),visibility 0s .5s;touch-action:none;box-shadow:inset 0 1px 0 rgba(239,231,212,.14)}
.sheet.on{transform:translateY(0);visibility:visible;transition:transform .5s var(--spring)}
.sheet.drag{transition:none}
.sheet .grip{margin-bottom:16px}
.sheet h2{font:400 19px/1.2 var(--sans);text-align:center}
.sheet .r{text-align:center;font-size:13px;color:var(--ink3);margin-top:4px}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:22px}
.stepper button{width:60px;height:60px;border-radius:50%;background:rgba(239,231,212,.08);display:grid;place-items:center;transition:background-color .15s,transform .15s}
.stepper button:active{background:rgba(239,231,212,.18);transform:scale(.93)}
.stepper button svg{width:24px;height:24px}
.stepper output{min-width:140px;text-align:center;font:200 54px/1 var(--sans);font-variant-numeric:tabular-nums}
.stepper output small{font-size:16px;color:var(--ink2);margin-left:3px}
.toast{position:absolute;left:50%;top:calc(52px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-180%);visibility:hidden;transition:transform .45s var(--spring),visibility 0s .45s;
  padding:11px 18px;border-radius:14px;background:rgba(18,32,24,.94);font-size:14px;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(239,231,212,.14)}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .45s var(--spring)}
.home-ind{position:absolute;left:50%;bottom:calc(7px + env(safe-area-inset-bottom)*.3);width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(239,231,212,.7);z-index:40;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .drawer,.track,.tabs .leaf,.seg .knob,.sheet,.toast,.sw::after{transition-duration:.01s!important}
  .hold.on .fill{transition-duration:.01s}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true">
    <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="bw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c4230"/><stop offset=".55" stop-color="#172419"/><stop offset="1" stop-color="#0b120d"/></linearGradient>
        <linearGradient id="br" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3d2" stop-opacity=".16"/><stop offset="1" stop-color="#fff3d2" stop-opacity="0"/></linearGradient>
        <filter id="bg"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .9  0 0 0 0 .95  0 0 0 0 .85  0 0 0 .5 0"/></filter>
      </defs>
      <rect width="1600" height="1000" fill="url(#bw)"/>
      <path d="M180 -20 L520 -20 L980 1020 L560 1020Z" fill="url(#br)"/>
      <path d="M760 -20 L880 -20 L1300 1020 L1130 1020Z" fill="url(#br)" opacity=".6"/>
      <g fill="#1f3322">
        <path d="M0 1000V760c80-20 160-10 240 30s180 40 280 10 220-30 300 20 200 60 330 20 260-50 450-10v230z"/>
      </g>
      <path d="M560 1000l60-150 110 30 60 120z" fill="#3a3d36"/><path d="M620 850l110 30-40 30z" fill="#55584d"/>
      <g id="bdPlants"></g><rect width="1600" height="1000" filter="url(#bg)" opacity=".08"/>
    </svg>
  </div>

  <div class="device">
    <div class="screen" id="screen">
      <canvas id="tank" aria-label="水族箱：點水面餵食，點燈具看光照，點溫度計看水質，點出水管換水" role="img"></canvas>
      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="g">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><path d="M1 12a1 1 0 0 1-1-1V9.5a1 1 0 0 1 2 0V11a1 1 0 0 1-1 1zM6 12a1 1 0 0 1-1-1V7a1 1 0 0 1 2 0v4a1 1 0 0 1-1 1zM11 12a1 1 0 0 1-1-1V4.5a1 1 0 0 1 2 0V11a1 1 0 0 1-1 1zM16 12a1 1 0 0 1-1-1V2a1 1 0 0 1 2 0v9a1 1 0 0 1-1 1z"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M1.2 4.4C5 1 11 1 14.8 4.4M3.8 7.2c2.4-2 6-2 8.4 0"/><circle cx="8" cy="10" r="1.3" fill="currentColor" stroke="none"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><path d="M3 .7h17A2.3 2.3 0 0 1 22.3 3v6A2.3 2.3 0 0 1 20 11.3H3A2.3 2.3 0 0 1 .7 9V3A2.3 2.3 0 0 1 3 .7z" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width="1.1"/><path d="M3.4 2.6h11c.6 0 1 .4 1 1v4.8c0 .6-.4 1-1 1h-11c-.6 0-1-.4-1-1V3.6c0-.6.4-1 1-1z" fill="currentColor"/><path d="M24 4.3c.8.3 1.2.9 1.2 1.7s-.4 1.4-1.2 1.7z" fill="currentColor" opacity=".55"/></svg>
        </span>
      </div>

      <section class="drawer" id="drawer" aria-label="控制台">
        <div class="dhead" id="dhead">
          <div class="grip" aria-hidden="true"></div>
          <div class="ttl"><h1>水景</h1><span class="meta" id="tankMeta">60P 石組・第 142 天</span></div>
          <div class="tabs" role="tablist" id="tabs">
            <button class="tab" role="tab" aria-selected="true" data-i="0">光照</button>
            <button class="tab" role="tab" aria-selected="false" data-i="1">水質</button>
            <button class="tab" role="tab" aria-selected="false" data-i="2">餵食</button>
            <button class="tab" role="tab" aria-selected="false" data-i="3">換水</button>
            <div class="leaf" id="leaf" aria-hidden="true"><svg viewBox="0 0 34 10"><path d="M2 6c8-6 22-6 30 0-8 4-22 4-30 0z" fill="#8cc06a"/><path d="M4 6c8-1.4 18-1.4 26 0" stroke="#122018" stroke-width="1" fill="none"/></svg></div>
          </div>
        </div>
        <div class="panes" id="panes">
          <div class="track" id="track">
            <!-- LIGHT -->
            <div class="pane" role="tabpanel" aria-label="光照">
              <div class="lightrow">
                <div class="dial" id="dial">
                  <svg viewBox="0 0 220 220" id="dialSvg"></svg>
                  <div class="dcent"><b id="dNow">--:--</b><span id="dState">照明中</span></div>
                </div>
                <div class="linfo">
                  <p class="k">開燈</p><p class="v" id="onT">13:00</p>
                  <p class="k">關燈</p><p class="v" id="offT">20:00</p>
                  <p class="k">光週期</p><p class="v" id="perT">7 小時</p>
                </div>
              </div>
              <div class="setrow" style="margin-top:8px"><div class="l">亮度<small id="intL">80%</small></div><input class="range" id="intR" type="range" min="30" max="100" step="5" value="80" aria-label="亮度"></div>
              <div class="setrow"><div class="l">CO₂ 跟著燈<small>開燈前一小時開始打氣</small></div><div class="swwrap"><button class="sw" id="co2Sw" role="switch" aria-checked="true" aria-label="CO2"></button></div></div>
              <div class="setrow"><div class="l">手動模式<small id="manL">依排程自動</small></div><button class="quiet" id="manBtn"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 2.5v3M10 14.5v3M4.2 10H1.8M18.2 10h-2.4"/><circle cx="10" cy="10" r="3.4"/></svg><span id="manT">開燈 1 小時</span></button></div>
              <p class="hint">拖曳環上的兩個把手調整開關燈時間，缸裡的光會跟著變。</p>
            </div>
            <!-- WATER -->
            <div class="pane" role="tabpanel" aria-label="水質" id="wqPane"></div>
            <!-- FEED -->
            <div class="pane" role="tabpanel" aria-label="餵食">
              <div class="feedtop">
                <div class="bowl"><svg viewBox="0 0 92 92" id="feedRing"></svg></div>
                <div><p class="big" id="feedN">1<small>/ 2 次</small></p><p id="feedHint">每次兩分鐘內吃完的量</p></div>
              </div>
              <div class="seg" role="radiogroup" aria-label="飼料" id="foodSeg"><span class="knob" id="foodKnob"></span>
                <button role="radio" data-f="0" aria-checked="true">薄片</button><button role="radio" data-f="1" aria-checked="false">豐年蝦</button><button role="radio" data-f="2" aria-checked="false">藻片</button></div>
              <button class="act wide" id="feedBtn"><svg viewBox="0 0 20 20" fill="currentColor"><circle cx="6" cy="6" r="1.6"/><circle cx="11" cy="4" r="1.3"/><circle cx="14.5" cy="8" r="1.6"/><circle cx="8.5" cy="10" r="1.3"/><circle cx="12" cy="13.5" r="1.5"/><circle cx="6" cy="15" r="1.2"/></svg>撒一撮</button>
              <div class="day"><svg viewBox="0 0 350 46" id="daySvg" preserveAspectRatio="none"></svg></div>
              <p class="sub">最近</p>
              <ul class="log" id="feedLog"></ul>

  function doChange(){b.classList.remove('on');if(busy)return;busy=true;haptic([10,40,10]);var p=st.pct;$('holdT').textContent='抽水中…';pour(true);levelTarget=1-p/100*1.6;
    setTimeout(function(){$('holdT').textContent='補水中…';levelTarget=1;},2600);
    setTimeout(function(){pour(false);busy=false;$('holdT').textContent='按住開始換水';st.changes.unshift({t:Date.now(),p:p});st.changes=st.changes.slice(0,20);
      var no3=st.wq.no3,tds=st.wq.tds;no3.push(Math.round(no3[no3.length-1]*(1-p/100)+2*p/100));tds.push(Math.round(tds[tds.length-1]*(1-p/100)+90*p/100));if(no3.length>14)no3.shift();if(tds.length>14)tds.shift();
      persist();renderChange();renderWQ();toast('換了 '+p+'%・硝酸鹽降到 '+no3[no3.length-1]+' ppm');haptic(12);},5200);}})();

/* ---------- sheet ---------- */
var sheet=$('sheet'),scrim=$('scrim'),lastFocus=null;
function openSheet(h){lastFocus=document.activeElement;$('sheetBody').innerHTML=h;sheet.style.transform='';sheet.classList.add('on');scrim.classList.add('on');haptic(6);}
function closeSheet(){if(!sheet.classList.contains('on'))return;sheet.classList.remove('on','drag');sheet.style.transform='';scrim.classList.remove('on');edit=null;if(lastFocus&&lastFocus.focus)try{lastFocus.focus({preventScroll:true});}catch(e){}}
scrim.addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
(function(){var sy=0,dy=0,t0=0,on=false;
  sheet.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;on=true;sy=e.clientY;dy=0;t0=e.timeStamp;sheet.classList.add('drag');try{sheet.setPointerCapture(e.pointerId);}catch(x){}});
  sheet.addEventListener('pointermove',function(e){if(!on)return;dy=e.clientY-sy;sheet.style.transform='translateY('+(dy>0?dy:dy/6).toFixed(1)+'px)';scrim.style.opacity=Math.max(0,1-dy/sheet.offsetHeight).toFixed(2);});
  function end(e){if(!on)return;on=false;sheet.classList.remove('drag');scrim.style.opacity='';if(dy>sheet.offsetHeight*.35||dy/Math.max(1,e.timeStamp-t0)>.6)closeSheet();else sheet.style.transform='';}
  sheet.addEventListener('pointerup',end);sheet.addEventListener('pointercancel',end);})();
var rep=null;
function bump(dir){if(!edit)return;var m=edit.m;edit.v=Math.max(m.min,Math.min(m.max,+(edit.v+dir*m.step).toFixed(2)));var o=$('ev');if(o)o.innerHTML=fmt(edit.v,m)+'<small>'+m.u+'</small>';haptic(3);}
sheet.addEventListener('pointerdown',function(e){var b=e.target.closest('#mn,#pl');if(!b)return;var d=b.id==='pl'?1:-1;bump(d);clearInterval(rep);var n=0;rep=setInterval(function(){if(++n>4)bump(d);},90);});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){sheet.addEventListener(ev,function(){clearInterval(rep);});});
sheet.addEventListener('keydown',function(e){var b=e.target.closest('#mn,#pl');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();bump(b.id==='pl'?1:-1);}});
sheet.addEventListener('click',function(e){if(e.target.closest('#saveWQ')&&edit){var m=edit.m,arr=st.wq[m.k];arr.push(+fmt(edit.v,m));if(arr.length>14)arr.shift();if(m.k==='temp')tempNow=edit.v;persist();renderWQ();closeSheet();toast('記下 '+m.n+' '+fmt(arr[arr.length-1],m)+' '+m.u);haptic(10);}});

/* ---------- toast + clock ---------- */
var toastT=null;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2000);}
function tick(){var d=new Date();$('clock').textContent=d.getHours()+':'+pad(d.getMinutes());var days=Math.floor((Date.now()-st.start)/864e5);$('tankMeta').textContent='60P 石組・第 '+days+' 天';}
function renderAll(){renderDial();renderWQ();renderFeed();renderChange();}
tick();setInterval(function(){tick();renderDial();},30000);
setInterval(function(){if(document.hidden)return;var set=st.wq.temp[st.wq.temp.length-1];tempNow+=(set-tempNow)*.2+(Math.random()-.5)*.08;},4000);
tempNow=st.wq.temp[st.wq.temp.length-1];
size();snap(snapName);goTab(tab);renderAll();
(function(){var g=$('bdPlants');if(!g)return;var R=rnd(99),h='';for(var i=0;i<34;i++){var side=i%2,x=side?1240+R()*360:R()*340,base=1000,ht=240+R()*420,bend=(R()-.5)*60,col=['#24402a','#2d4d30','#1d3522','#3a5a2e'][i%4];
  h+='<path d="M'+x.toFixed(0)+' '+base+'Q'+(x+bend*.3).toFixed(0)+' '+(base-ht/2).toFixed(0)+' '+(x+bend).toFixed(0)+' '+(base-ht).toFixed(0)+'" stroke="'+col+'" stroke-width="4" fill="none" stroke-linecap="round"/>';
  for(var y=30;y<ht;y+=22){var t=y/ht,lx=x+bend*t*t,ly=base-y,lw=15-t*6;h+='<ellipse cx="'+(lx-lw).toFixed(0)+'" cy="'+ly.toFixed(0)+'" rx="'+lw.toFixed(0)+'" ry="4" fill="'+col+'" transform="rotate(-18 '+(lx-lw).toFixed(0)+' '+ly.toFixed(0)+')"/><ellipse cx="'+(lx+lw).toFixed(0)+'" cy="'+(ly-6).toFixed(0)+'" rx="'+lw.toFixed(0)+'" ry="4" fill="'+col+'" transform="rotate(18 '+(lx+lw).toFixed(0)+' '+(ly-6).toFixed(0)+')"/>';}}g.innerHTML=h;})();
light=lightTarget(nowMin())*st.intensity/100;
window.addEventListener('resize',function(){size();snap(snapName);});
loop();
})();
</script>
