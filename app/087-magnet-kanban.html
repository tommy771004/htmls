<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9ccca">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="白板">
<title>白板 · 看板待辦</title>
<meta name="description" content="一面會吸磁鐵的白板：便利貼寫待辦、拖曳換欄、磁鐵分人篩選、到期用紅筆圈起來。收錄於 100 Creative HTML Works（App 087・白板便利貼磁鐵）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/087-magnet-kanban.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23bfc3c2'/%3E%3Crect x='5' y='5' width='54' height='54' rx='9' fill='%23f4f6f3'/%3E%3Crect x='14' y='17' width='30' height='30' fill='%23ffe36e' transform='rotate(-6 29 32)'/%3E%3Ccircle cx='29' cy='17' r='6' fill='%23d6453d'/%3E%3Cpath d='M20 33c5 1 11 0 16-1M21 39c4 0 8 0 11-1' stroke='%2322262a' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --board:#f4f6f3;
  --ink:#22262a;
  --ink2:#5b6064;
  --red:#c8372d;
  --blue:#1f4fa0;
  --green:#2f7d4a;
  --y:#ffe36e; --p:#ffa7ba; --b:#a6d6f2;
  --alu1:#dfe2e1; --alu2:#a9aeae;
  --hand:"Hannotate TC","HanziPen TC","PingFang TC",sans-serif;
  --latin:"Bradley Hand","Hannotate TC","PingFang TC",cursive;
  --ui:system-ui,-apple-system,"PingFang TC",sans-serif;
  --spring:cubic-bezier(.3,1.4,.5,1);
  --out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.45 var(--hand);color:var(--ink);background:#c9ccca;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,[tabindex]:focus-visible,textarea:focus-visible,input:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- stage ---------- */
.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;overflow:clip;isolation:isolate;
  background:linear-gradient(180deg,#e4e7e6,#b7bcbc 3%,#d7dad9 7%,#c3c7c6 100%)}
@media (min-width:521px){
  body{background:#d5d9d6}
  .stage{display:flex;align-items:center;justify-content:center;gap:64px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:54px;padding:12px;z-index:1;
    background:linear-gradient(115deg,#eef0ef 0%,#b4b9b9 22%,#dfe2e1 48%,#9ea3a3 74%,#d6d9d8 100%);
    box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(80,86,88,.35),3px 14px 22px -12px rgba(52,58,60,.55)}
  .screen{inset:12px;border-radius:43px}
  .caption{display:block;position:relative;z-index:1;max-width:250px;color:var(--ink)}
  .caption h1{font:400 64px/1 var(--hand);letter-spacing:.04em}
  .caption p{margin-top:14px;font:17px/1.6 var(--hand);color:var(--ink2)}
  .caption .sig{margin-top:18px;font:26px/1 var(--latin);color:var(--red);transform:rotate(-4deg);display:inline-block}
}
@media (min-width:521px) and (max-width:880px){.caption{display:none}}

/* ---------- board ---------- */
.board{position:absolute;left:8px;right:8px;top:calc(40px + env(safe-area-inset-top));bottom:calc(92px + env(safe-area-inset-bottom));
  border-radius:10px;background:var(--board);overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(60,66,68,.35),inset 0 -1px 0 rgba(255,255,255,.6)}
.board::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(112deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.75) 38%,rgba(255,255,255,0) 47%)}
.ghost-ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.status{position:absolute;top:0;left:0;right:0;z-index:30;height:calc(40px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 26px 0 30px;
  display:flex;align-items:center;justify-content:space-between;font:600 15px/1 var(--ui);color:#2c3033;pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}.board{top:calc(8px + env(safe-area-inset-top))}}

/* ---------- head ---------- */
.head{position:absolute;left:8px;right:8px;top:calc(40px + env(safe-area-inset-top));z-index:5;padding:14px 12px 0 18px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
@media (display-mode:standalone){.head{top:calc(8px + env(safe-area-inset-top))}}
.head h1{font:400 34px/1 var(--hand);letter-spacing:.06em}
.head .sub{margin-top:6px;font-size:14px;color:var(--ink2)}
.head .sub b{font-weight:400;color:var(--red)}
.tools{display:flex;gap:2px;align-items:center}
.tbtn{min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px;border-radius:10px;font-size:14px;color:var(--ink);transition:background-color .15s}
.tbtn:active{background:rgba(34,38,42,.07)}
.tbtn svg{width:24px;height:24px}
.tbtn[aria-pressed=true]{color:var(--red)}
.tbtn .box{width:20px;height:20px}
.tbtn .tick{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .3s var(--out)}
.tbtn[aria-pressed=true] .tick{stroke-dashoffset:0}

/* ---------- column nav ---------- */
.colnav{position:absolute;left:8px;right:8px;top:calc(112px + env(safe-area-inset-top));z-index:5;display:grid;grid-template-columns:repeat(4,1fr);padding:0 8px}
@media (display-mode:standalone){.colnav{top:calc(80px + env(safe-area-inset-top))}}
.ctab{position:relative;height:48px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:17px;color:var(--ink2);transition:color .2s}
.ctab .n{font:20px/1 var(--latin);color:var(--ink2)}
.ctab[aria-selected=true]{color:var(--ink)}
.ctab[aria-selected=true] .n{color:var(--blue)}
.ctab .loop{position:absolute;inset:3px -2px;width:calc(100% + 4px);height:42px;pointer-events:none;overflow:visible}
.ctab .loop path{fill:none;stroke:var(--blue);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
/* 圓頭線段在 dashoffset:1 時仍會留下一個小點，未選取時直接隱藏 */
.ctab[aria-selected=true] .loop path,.ctab.hot .loop path{opacity:1}
.ctab[aria-selected=true] .loop path{stroke-dashoffset:0;animation:draw .45s var(--out)}
.ctab.hot{color:var(--red)}
.ctab.hot .loop path{stroke:var(--red);stroke-dashoffset:0;animation:none}
@keyframes draw{from{stroke-dashoffset:1}}

/* ---------- columns ---------- */
.cols{position:absolute;left:8px;right:8px;top:calc(162px + env(safe-area-inset-top));bottom:calc(92px + env(safe-area-inset-bottom));z-index:4;
  display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
@media (display-mode:standalone){.cols{top:calc(130px + env(safe-area-inset-top))}}
.cols::-webkit-scrollbar{display:none}
.col{flex:0 0 100%;height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-align:start;scroll-snap-stop:always;scrollbar-width:none;padding:18px 16px 28px}
.col::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 14px;align-items:start}
.grid>.note:nth-child(even),.grid>.slot:nth-child(even){margin-top:20px}

.note{position:relative;min-height:138px;padding:22px 13px 12px;transform:rotate(var(--r,0deg));touch-action:pan-x pan-y;cursor:grab;
  background:var(--y);color:var(--ink);transition:transform .35s var(--spring);-webkit-user-select:none;user-select:none;
  box-shadow:0 1px 1px rgba(90,70,10,.22),3px 7px 7px -6px rgba(70,60,30,.45)}
.note::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;background:linear-gradient(0deg,rgba(120,90,0,.08),rgba(120,90,0,0))}
.note.p{background:var(--p);box-shadow:0 1px 1px rgba(110,40,50,.22),3px 7px 7px -6px rgba(90,40,50,.45)}
.note.b{background:var(--b);box-shadow:0 1px 1px rgba(30,70,100,.22),3px 7px 7px -6px rgba(30,60,90,.45)}
.note:active{transform:rotate(var(--r,0deg)) scale(.98)}
.note.lift{opacity:.28;transform:rotate(0) scale(.96)}
.note.slap{animation:slap .42s var(--spring)}
@keyframes slap{0%{transform:rotate(0) scale(1.08)}100%{transform:rotate(var(--r,0deg)) scale(1)}}
.note .txt{font-size:16px;line-height:1.42;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.note .meta{margin-top:10px;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;font-size:13px;color:#4a4632}
.note .due{position:relative;font:15px/1.1 var(--latin);white-space:nowrap}
.note .due .cj{font:13px/1 var(--hand)}
.note .due.over,.note .due.soon{color:var(--red)}
.note .due.over{padding:0 3px 0 6px}
.note .due .ring{position:absolute;left:-5px;top:-8px;width:calc(100% + 10px);height:calc(100% + 16px);overflow:visible;pointer-events:none}
.note .due .ring path{fill:none;stroke:var(--red);stroke-width:1.8;stroke-linecap:round}
.note .who{font-size:13px;color:#4a4632}
.note .check{position:absolute;right:7px;top:10px;width:30px;height:26px;pointer-events:none;overflow:visible}
.note .check path{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
.note.justdone .check path{animation:draw .5s .1s var(--out) backwards}
.col[data-c=done] .note .txt{color:rgba(34,38,42,.62);padding-right:22px}

.mag{position:absolute;left:50%;top:-9px;width:24px;height:24px;margin-left:-12px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85) 0 2px,rgba(255,255,255,0) 6px),var(--m,#d6453d);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.28),1px 3px 3px -1px rgba(40,20,10,.45)}
.m-me{--m:#d6453d}.m-zhe{--m:#2d3134}.m-ting{--m:#3a8a57}.m-none{--m:#9aa0a2}

.slot{min-height:120px;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink2);font-size:15px;transition:background-color .15s}
.slot svg{width:100%;height:100%;position:absolute;inset:0;overflow:visible;pointer-events:none}
.slot{position:relative}
.slot .pl{width:28px;height:28px;position:static}
.slot:active{background:rgba(34,38,42,.05)}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;padding:26px 0 8px;color:var(--ink2);text-align:center;font-size:16px}
.empty svg{width:120px;height:92px;margin-bottom:10px}

/* ---------- tray ---------- */
.tray{position:absolute;left:0;right:0;bottom:0;z-index:8;height:calc(92px + env(safe-area-inset-bottom));padding:0 14px env(safe-area-inset-bottom);display:flex;align-items:flex-start;justify-content:space-between}
.tray::before{content:"";position:absolute;left:4px;right:4px;top:6px;height:26px;border-radius:4px 4px 12px 12px;
  background:linear-gradient(180deg,#f3f5f4 0%,#c3c8c8 30%,#9ea4a4 62%,#c7cbcb 100%);box-shadow:inset 0 1px 0 #fff,0 2px 2px -1px rgba(60,66,68,.35)}
.tray>*{position:relative}
.pad{width:78px;height:64px;display:flex;align-items:flex-start;justify-content:center;padding-top:0}
.pad svg{width:66px;height:54px;transition:transform .25s var(--spring)}
.pad:active svg{transform:rotate(-5deg) scale(.94)}
.mags{display:flex;gap:4px;align-items:flex-start;padding-top:4px}
.mbtn{width:52px;height:60px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#3a3f42}
.mbtn i{display:block;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85) 0 2px,rgba(255,255,255,0) 7px),var(--m);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.3),1px 3px 3px -1px rgba(40,30,20,.45);transition:transform .3s var(--spring)}
.mbtn:active i{transform:scale(.88)}
.mbtn[aria-pressed=true] i{transform:translateY(-6px)}
.mbtn[aria-pressed=true]{color:var(--ink);font-weight:700}
.mags.filtering .mbtn[aria-pressed=false] i{filter:saturate(.25) brightness(1.15)}
.eraser{width:78px;height:64px;display:flex;justify-content:center;transition:transform .2s}
.eraser svg{width:70px;height:40px;margin-top:0;transition:transform .25s var(--spring)}
.eraser:active svg{transform:translateX(-6px)}
.eraser.over svg{transform:rotate(-8deg) scale(1.12)}
.home-ind{position:absolute;left:50%;bottom:calc(7px + env(safe-area-inset-bottom)*.3);width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(34,38,42,.55);z-index:9;pointer-events:none}
.edge{position:absolute;top:calc(162px + env(safe-area-inset-top));bottom:calc(92px + env(safe-area-inset-bottom));width:30px;z-index:6;pointer-events:none;opacity:0;transition:opacity .2s}
.edge.l{left:8px;background:linear-gradient(90deg,rgba(31,79,160,.18),rgba(31,79,160,0))}
.edge.r{right:8px;background:linear-gradient(270deg,rgba(31,79,160,.18),rgba(31,79,160,0))}
.edge.on{opacity:1}

/* drag ghost */
#ghost{position:absolute;left:0;top:0;z-index:40;pointer-events:none;display:none}
#ghost .note{transform:rotate(2deg) scale(1.06);box-shadow:0 2px 2px rgba(90,70,10,.2),6px 16px 14px -10px rgba(60,50,20,.5);transition:none}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(34,38,42,.32);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;background:var(--board);padding:10px 20px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(105%);visibility:hidden;transition:transform .5s var(--spring),visibility 0s .5s;touch-action:none;box-shadow:0 -2px 0 #fff inset}
.sheet.on{transform:translateY(0);visibility:visible;transition:transform .5s var(--spring)}
.sheet.drag{transition:none}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(34,38,42,.25);margin:0 auto 14px}
.sheet h2{font:400 24px/1.2 var(--hand);text-align:center}
.paper{position:relative;margin:16px auto 0;width:240px;min-height:170px;padding:26px 16px 14px;background:var(--y);transform:rotate(-1.5deg);transition:background-color .25s;
  box-shadow:0 1px 1px rgba(90,70,10,.22),3px 8px 8px -6px rgba(70,60,30,.45)}
.paper.p{background:var(--p)}.paper.b{background:var(--b)}
.paper textarea{width:100%;min-height:110px;border:0;background:transparent;resize:none;font:18px/1.45 var(--hand);color:var(--ink);outline:none;touch-action:auto}
.paper textarea::placeholder{color:rgba(34,38,42,.45)}
.paper .count{position:absolute;right:10px;bottom:6px;font:13px var(--latin);color:rgba(34,38,42,.5)}
.row{margin-top:16px}
.row .lb{font-size:14px;color:var(--ink2);margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{min-height:44px;padding:0 12px;border-radius:8px;font-size:16px;display:flex;align-items:center;gap:6px;color:var(--ink);position:relative}
.opt:active{background:rgba(34,38,42,.06)}
.opt[aria-checked=true]{color:var(--blue)}
.opt[aria-checked=true]::after{content:"";position:absolute;left:8px;right:8px;bottom:6px;height:3px;border-radius:2px;background:var(--blue);transform:rotate(-1.2deg)}
.opt .sw{width:26px;height:26px;background:var(--y);box-shadow:1px 2px 2px -1px rgba(60,50,20,.4)}
.opt .sw.p{background:var(--p)}.opt .sw.b{background:var(--b)}
.opt i.mg{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.8) 0 1.5px,rgba(255,255,255,0) 5px),var(--m);box-shadow:inset 0 -2px 2px rgba(0,0,0,.28)}
.datein{height:44px;border:0;border-radius:8px;background:rgba(34,38,42,.05);padding:0 10px;font:15px var(--ui);color:var(--ink)}
.actions{display:flex;align-items:center;justify-content:space-between;margin-top:20px;gap:12px}
.go{flex:1;height:52px;border-radius:8px;background:var(--ink);color:#fff;font:400 19px/1 var(--hand);letter-spacing:.08em;transition:background-color .15s}
.go:active{background:#000}
.tear{height:52px;padding:0 10px;color:var(--red);font-size:17px;display:flex;align-items:center;gap:6px}
.tear svg{width:22px;height:22px}
.tear:active{opacity:.6}
.sheet p.msg{margin-top:10px;text-align:center;color:var(--ink2);font-size:16px}

.toast{position:absolute;left:50%;bottom:calc(118px + env(safe-area-inset-bottom));z-index:60;transform:translate(-50%,calc(100% + 120px)) rotate(-1deg);visibility:hidden;
  transition:transform .45s var(--spring),visibility 0s .45s;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;background:var(--y);font-size:16px;white-space:nowrap;
  box-shadow:0 1px 1px rgba(90,70,10,.22),3px 7px 7px -6px rgba(70,60,30,.45)}
.toast.on{transform:translate(-50%,0) rotate(-1deg);visibility:visible;transition:transform .45s var(--spring)}
.toast button{min-height:40px;padding:0 10px;color:var(--blue);font-size:16px}

@media (prefers-reduced-motion:reduce){
  .note,.sheet,.toast,.mbtn i,.pad svg,.eraser svg{transition-duration:.01s!important}
  .note.slap,.ctab[aria-selected=true] .loop path,.note.justdone .check path{animation:none}
  .grid>.note:nth-child(even){margin-top:20px}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true">
    <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
      <rect width="1600" height="1000" fill="#d3d7d4"/>
      <rect x="-20" y="70" width="1640" height="800" rx="8" fill="#b2b7b7"/>
      <rect x="-10" y="82" width="1620" height="776" rx="4" fill="#f1f3f0"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".13" stroke-width="5">
        <path d="M120 200c60-6 150-4 210 2M130 250c50 2 90-2 130 0" stroke="#1f4fa0"/>
        <path d="M110 330h230v120H110zM340 390c70 0 100 0 150 0m-18-16 20 16-20 16" stroke="#22262a"/>
        <path d="M500 330c40-10 160-10 200 0 12 40 12 80 0 120-60 8-150 8-200 0-12-40-12-80 0-120z" stroke="#22262a"/>
        <path d="M1150 230c30 60 90 90 160 60M1180 520c80-40 150-20 200 20" stroke="#c8372d"/>
        <path d="M1120 650c30-10 70-10 100 0m40 0c30-10 70-10 100 0m40 0c30-8 70-8 90 0" stroke="#2f7d4a"/>
        <path d="M150 640c90 20 190 10 300-20" stroke="#1f4fa0" stroke-width="18" opacity=".6"/>
      </g>
      <g opacity=".55">
        <rect x="140" y="520" width="120" height="120" fill="#ffe36e" transform="rotate(-5 200 580)"/>
        <rect x="1330" y="330" width="120" height="120" fill="#ffa7ba" transform="rotate(6 1390 390)"/>
        <rect x="1250" y="690" width="110" height="110" fill="#a6d6f2" transform="rotate(-3 1305 745)"/>
        <circle cx="200" cy="522" r="12" fill="#d6453d"/><circle cx="1390" cy="332" r="12" fill="#2d3134"/><circle cx="1305" cy="690" r="11" fill="#3a8a57"/>
      </g>
      <rect x="-10" y="856" width="1620" height="30" rx="6" fill="#a2a8a8"/>
      <rect x="-10" y="856" width="1620" height="8" fill="#e8ebea"/>
      <rect x="1180" y="838" width="130" height="20" rx="9" fill="#22262a"/><rect x="1300" y="840" width="26" height="16" rx="6" fill="#1f4fa0"/>
      <rect x="1350" y="840" width="120" height="18" rx="8" fill="#c8372d"/>
    </svg>
  </div>

  <div class="device">
    <div class="screen" id="screen">
      <div class="board" aria-hidden="true">
        <svg class="ghost-ink" viewBox="0 0 374 700" preserveAspectRatio="none">
          <g fill="none" stroke-linecap="round" stroke-width="3" opacity=".05">

<script>
(function(){

function swish(){var c=ac();if(!c)return;try{var t=c.currentTime,n=noise(c,.35),f=c.createBiquadFilter(),g=c.createGain();f.type='lowpass';f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(3200,t+.3);

/* ---------- dates ---------- */

var justMoved=null;

  var h='<h2 id="sheetT">'+(edit?'改這張':'寫一張新的')+'</h2>'+
  '<div class="paper '+(form.c==='y'?'':form.c)+'" id="paper"><span class="mag m-'+form.who+'" id="pmag"></span><textarea id="txt" maxlength="60" placeholder="要做什麼？" aria-label="便利貼內容">'+esc(form.t)+'</textarea><span class="count" id="cnt">'+form.t.length+'/60</span></div>'+
  '<div class="row"><p class="lb">紙</p><div class="opts" role="radiogroup" aria-label="便利貼顏色">'+['y','p','b'].map(function(c,i){return '<button class="opt" role="radio" data-c="'+c+'" aria-checked="'+(form.c===c)+'"><span class="sw '+(c==='y'?'':c)+'"></span>'+['黃','粉','藍'][i]+'</button>';}).join('')+'</div></div>'+
  '<div class="row"><p class="lb">磁鐵</p><div class="opts" role="radiogroup" aria-label="負責人">'+['me','zhe','ting','none'].map(function(w){return '<button class="opt" role="radio" data-who="'+w+'" aria-checked="'+(form.who===w)+'"><i class="mg" style="--m:'+WHO[w].c+'"></i>'+WHO[w].n+'</button>';}).join('')+'</div></div>'+
  '<div class="row"><p class="lb">到期</p><div class="opts" role="radiogroup" aria-label="到期日" id="dues">'+dueOpts(form.due)+'</div></div>'+
  '<div class="row"><p class="lb">欄位</p><div class="opts" role="radiogroup" aria-label="欄位">'+COLS.map(function(c){return '<button class="opt" role="radio" data-col="'+c.k+'" aria-checked="'+(form.col===c.k)+'">'+c.t+'</button>';}).join('')+'</div></div>'+
  '<div class="actions">'+(edit?'<button class="tear" id="tearBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7c4.6-.4 9.4-.4 14 0M9.5 7V4.8c1.7-.3 3.3-.3 5 0V7M6.6 7.5l1 12c3 .5 5.8.5 8.8 0l1-12"/><path d="M10.4 11l.3 5.4M13.7 11l-.3 5.4"/></svg>撕掉</button>':'')+'<button class="go" id="goBtn">'+(edit?'貼回去':'貼上白板')+'</button></div>';
  openSheet(h);
  if(!edit)setTimeout(function(){var t=$('txt');if(t&&form)try{t.focus({preventScroll:true});}catch(e){}},380);
}
sheet.addEventListener('input',function(e){if(!form)return;if(e.target.id==='txt'){form.t=e.target.value;$('cnt').textContent=form.t.length+'/60';}
  if(e.target.id==='dueIn'&&e.target.value){form.due=e.target.value;markRadios('[data-due]',null);}});
function markRadios(sel,val,attr){var b=sheet.querySelectorAll(sel);for(var i=0;i<b.length;i++)b[i].setAttribute('aria-checked',attr&&b[i].dataset[attr]===val?'true':'false');}
sheet.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.id==='confirmWipe'){wipeDone();return;}
  if(!form)return;
  if(b.dataset.c){form.c=b.dataset.c;markRadios('[data-c]',form.c,'c');var p=$('paper');p.className='paper '+(form.c==='y'?'':form.c);haptic(5);return;}
  if(b.dataset.who){form.who=b.dataset.who;markRadios('.opt[data-who]',form.who,'who');$('pmag').className='mag m-'+form.who;haptic(5);clack();return;}
  if(b.dataset.due!==undefined){form.due=b.dataset.due;markRadios('[data-due]',form.due,'due');var di=$('dueIn');if(di)di.value='';haptic(5);return;}
  if(b.dataset.col){form.col=b.dataset.col;markRadios('[data-col]',form.col,'col');haptic(5);return;}
  if(b.id==='goBtn'){commit();return;}
  if(b.id==='tearBtn'){var id=form.id;closeSheet();removeNote(id);return;}
});
function commit(){var t=(form.t||'').trim();if(!t){var p=$('paper');haptic([20,40,20]);if(p&&!reduce){p.animate([{transform:'rotate(-1.5deg) translateX(0)'},{transform:'rotate(-1.5deg) translateX(-8px)'},{transform:'rotate(-1.5deg) translateX(8px)'},{transform:'rotate(-1.5deg) translateX(0)'}],{duration:280});}return;}
  var n;if(form.id){n=byId(form.id);if(!n){closeSheet();return;}var was=n.col;n.t=t;n.c=form.c;n.who=form.who;n.due=form.due;n.col=form.col;if(was!==n.col)justMoved=n.id;}
  else{n={id:uid(),t:t,c:form.c,who:form.who,due:form.due,col:form.col};notes.unshift(n);justMoved=n.id;}
  persist();var ci=COLS.map(function(c){return c.k;}).indexOf(n.col);closeSheet();clack();haptic(12);
  if(filt.who&&n.who!==filt.who){filt.who='';save('filt',filt);}
  if(filt.week&&!visible(n)){filt.week=false;save('filt',filt);}
  render();goCol(ci,true);}
function removeNote(id){var i=-1;for(var k=0;k<notes.length;k++)if(notes[k].id===id)i=k;if(i<0)return;var n=notes.splice(i,1)[0];persist();render();swish();haptic([10,30,10]);
  toast('撕掉了「'+(n.t.length>8?n.t.slice(0,8)+'…':n.t)+'」',function(){notes.splice(Math.min(i,notes.length),0,n);persist();justMoved=n.id;render();clack();});}
function wipeDone(){var gone=notes.filter(function(n){return n.col==='done';});closeSheet();if(!gone.length)return;notes=notes.filter(function(n){return n.col!=='done';});persist();render();swish();haptic([10,40,10]);
  toast('擦掉 '+gone.length+' 張完成的',function(){notes=notes.concat(gone);persist();render();clack();});}
$('padBtn').addEventListener('click',function(){haptic(8);openForm(null,COLS[cur].k);});
$('eraser').addEventListener('click',function(){haptic(8);var k=notes.filter(function(n){return n.col==='done';}).length;
  openSheet('<h2 id="sheetT">用板擦</h2><p class="msg">'+(k?'把「完成」欄的 '+k+' 張便利貼擦掉？<br>可以從提示復原。':'「完成」欄是空的，沒東西可擦。<br>也可以把任何一張拖到板擦上撕掉。')+'</p><div class="actions">'+(k?'<button class="go" id="confirmWipe">擦掉 '+k+' 張</button>':'<button class="go" id="closeX">知道了</button>')+'</div>');
  var cx=$('closeX');if(cx)cx.addEventListener('click',closeSheet);});
colsEl.addEventListener('click',function(e){if(suppress){suppress=false;return;}var a=e.target.closest('[data-add]');if(a){haptic(8);openForm(null,a.dataset.add);return;}
  var n=e.target.closest('.note');if(n){var o=byId(n.dataset.id);if(o){haptic(6);openForm(o);}}});
colsEl.addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var n=e.target.closest('.note');if(!n)return;e.preventDefault();var o=byId(n.dataset.id);if(o)openForm(o);});

/* ---------- drag a note ---------- */
var drag=null,suppress=false,ghost=$('ghost'),screenEl=$('screen'),edgeT=null,edgeDir=0;
colsEl.addEventListener('pointerdown',function(e){var n=e.target.closest('.note');if(!n||e.button>0||drag)return;
  var r=n.getBoundingClientRect();drag={id:n.dataset.id,el:n,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,started:false,pid:e.pointerId,touch:e.pointerType!=='mouse',x:e.clientX,y:e.clientY};
  if(drag.touch){drag.lp=setTimeout(function(){if(drag&&!drag.started)startDrag();},300);}});
function startDrag(){if(!drag)return;var o=byId(drag.id);if(!o){drag=null;return;}drag.started=true;haptic(14);
  ghost.innerHTML=noteHTML(o);var g=ghost.firstChild;g.style.width=drag.w+'px';ghost.style.display='block';drag.el.classList.add('lift');placeGhost();}
function placeGhost(){var s=screenEl.getBoundingClientRect(),sc=s.width/screenEl.offsetWidth||1;var x=(drag.x-s.left)/sc-drag.ox,y=(drag.y-s.top)/sc-drag.oy;ghost.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';
  var tgt=hitTarget();$('eraser').classList.toggle('over',tgt.type==='erase');
  var tabs=navEl.querySelectorAll('.ctab');for(var i=0;i<tabs.length;i++)tabs[i].classList.toggle('hot',tgt.type==='col'&&tgt.i===i&&i!==cur);
  var ex=(drag.x-s.left)/sc,W=screenEl.offsetWidth,dir=ex<40?-1:ex>W-40?1:0;
  if(tgt.type==='erase'||tgt.type==='col')dir=0;
  $('edgeL').classList.toggle('on',dir<0&&cur>0);$('edgeR').classList.toggle('on',dir>0&&cur<COLS.length-1);
  if(dir!==edgeDir){edgeDir=dir;clearTimeout(edgeT);if(dir)edgeT=setTimeout(edgeFlip,480);}}
function edgeFlip(){if(!drag||!drag.started||!edgeDir)return;var n=cur+edgeDir;if(n<0||n>=COLS.length)return;goCol(n,true);haptic(10);edgeT=setTimeout(edgeFlip,900);}
function hitTarget(){var el=document.elementFromPoint(drag.x,drag.y);if(!el)return{type:'none'};
  if(el.closest('#eraser'))return{type:'erase'};var t=el.closest('.ctab');if(t)return{type:'col',i:+t.dataset.i};
  var n=el.closest('.cols .note');if(n&&n.dataset.id!==drag.id)return{type:'before',id:n.dataset.id,after:false};
  if(el.closest('.cols'))return{type:'here'};return{type:'none'};}
window.addEventListener('pointermove',function(e){if(!drag||e.pointerId!==drag.pid)return;drag.x=e.clientX;drag.y=e.clientY;var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.started){if(drag.touch){if(Math.hypot(dx,dy)>9){clearTimeout(drag.lp);drag=null;}return;}if(Math.hypot(dx,dy)>6)startDrag();else return;}
  placeGhost();});
document.addEventListener('touchmove',function(e){if(drag&&drag.started)e.preventDefault();},{passive:false});
window.addEventListener('pointerup',function(e){if(!drag||e.pointerId!==drag.pid)return;clearTimeout(drag.lp);if(!drag.started){drag=null;return;}
  var tgt=hitTarget(),o=byId(drag.id),id=drag.id;endVisual();suppress=true;setTimeout(function(){suppress=false;},60);
  if(!o)return;
  if(tgt.type==='erase'){removeNote(id);return;}
  var col=tgt.type==='col'?COLS[tgt.i].k:COLS[cur].k,was=o.col;
  var i=notes.indexOf(o);notes.splice(i,1);o.col=col;
  if(tgt.type==='before'){var j=-1;for(var k=0;k<notes.length;k++)if(notes[k].id===tgt.id)j=k;if(j<0)notes.push(o);else notes.splice(j,0,o);}
  else if(tgt.type==='col'){var first=-1;for(var m=0;m<notes.length;m++)if(notes[m].col===col){first=m;break;}if(first<0)notes.push(o);else notes.splice(first,0,o);}
  else notes.push(o);
  justMoved=o.id;persist();render();if(col==='done'&&was!=='done')squeak();clack();haptic(was!==col?[8,20,14]:10);
  if(tgt.type==='col'&&tgt.i!==cur)goCol(tgt.i,true);
  if(was!==col)toast('移到「'+COLS[COLS.map(function(c){return c.k;}).indexOf(col)].t+'」',null);
});
window.addEventListener('pointercancel',function(e){if(drag&&e.pointerId===drag.pid)cancelDrag();});
function endVisual(){clearTimeout(edgeT);edgeDir=0;ghost.style.display='none';ghost.innerHTML='';$('eraser').classList.remove('over');$('edgeL').classList.remove('on');$('edgeR').classList.remove('on');
  var t=navEl.querySelectorAll('.ctab.hot');for(var i=0;i<t.length;i++)t[i].classList.remove('hot');if(drag&&drag.el)drag.el.classList.remove('lift');drag=null;}
function cancelDrag(){if(!drag)return;clearTimeout(drag.lp);endVisual();}
colsEl.addEventListener('contextmenu',function(e){if(e.target.closest('.note'))e.preventDefault();});

/* ---------- clock ---------- */
function tick(){var d=new Date();$('clock').textContent=d.getHours()+':'+('0'+d.getMinutes()).slice(-2);}
tick();setTimeout(function(){tick();setInterval(tick,60000);},(60-new Date().getSeconds())*1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){tick();render();}});
})();
</script>
</body>
</html>
