<style>*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Avenir Next","Avenir","PingFang TC","Heiti TC",system-ui,sans-serif;background:var(--surface,#f6faee);color:var(--on-surface,#1a1c17);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
svg{display:block}
input{font:inherit;color:inherit}
:root{--emph:cubic-bezier(.2,0,0,1);--decel:cubic-bezier(.05,.7,.1,1);--accel:cubic-bezier(.3,0,.8,.15);--num:"Avenir Next","Avenir","Helvetica Neue",sans-serif}
.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption,.punch{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--surface);color:var(--on-surface);isolation:isolate;transition:background-color .45s var(--emph),color .45s var(--emph)}
@media (min-width:521px){.stage{display:flex;align-items:center;justify-content:center;gap:64px;padding:24px}
.backdrop{display:block;position:fixed;inset:0;z-index:0}
.backdrop svg{width:100%;height:100%}
.device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:46px;padding:9px;background:var(--dev);z-index:1;box-shadow:inset 0 0 0 1.5px var(--dev-edge),0 18px 30px -20px rgba(0,0,0,.55);transition:background-color .45s}
.screen{inset:9px;border-radius:37px}
.punch{display:block;position:absolute;top:21px;left:50%;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:#0b0b0a;z-index:90;box-shadow:inset 0 0 0 2px #1d1d1b}
.caption{display:block;position:relative;z-index:1;max-width:250px;color:var(--cap)}
.caption b{display:block;font-size:34px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.caption span{display:block;margin-top:12px;font-size:15px;line-height:1.65;opacity:.8}
}
@media (min-width:521px) and (max-width:860px){.caption{display:none}}
.status{position:absolute;top:0;left:0;right:0;z-index:96;height:calc(38px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 22px 0 26px;display:flex;align-items:center;justify-content:space-between;font:600 14px/1 var(--num);color:var(--on-surface);pointer-events:none;letter-spacing:.02em}
.status .g{display:flex;gap:5px;align-items:center}
.status svg{fill:currentColor}
@media (display-mode:standalone){.status{display:none}}
.gesture{position:absolute;left:50%;bottom:calc(6px + env(safe-area-inset-bottom)*.4);width:108px;height:4px;margin-left:-54px;border-radius:2px;background:var(--on-surface);opacity:.55;z-index:95;pointer-events:none}
.pages{position:absolute;left:0;right:0;top:calc(38px + env(safe-area-inset-top));bottom:calc(84px + env(safe-area-inset-bottom))}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 0 110px;display:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.page.on{display:block;animation:through .34s var(--decel)}
@keyframes through{from{opacity:.35;transform:scale(.965)}to{opacity:1;transform:none}}
.page::-webkit-scrollbar{display:none}
.appbar{display:flex;align-items:center;gap:4px;padding:8px 8px 4px 20px;min-height:64px}
.appbar h1{flex:1;font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.appbar h1 small{display:block;font-size:13px;font-weight:500;color:var(--on-surface-variant);letter-spacing:.01em;margin-bottom:2px}
.ib{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;color:var(--on-surface-variant);transition:background-color .2s}
.ib:active{background:color-mix(in srgb,var(--on-surface) 12%,transparent)}
.ib svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:disabled{opacity:.3;pointer-events:none}
.hero{margin:6px 16px 0;padding:20px 20px 18px;border-radius:28px;background:var(--primary-container);color:var(--on-primary-container);transition:background-color .45s var(--emph),color .45s}
.hero .lbl{font-size:14px;font-weight:500;opacity:.8}
.hero .bal{font:600 44px/1.05 var(--num);letter-spacing:-.01em;margin-top:6px;font-variant-numeric:tabular-nums}
.hero .bal i{font-style:normal;font-size:20px;font-weight:500;margin-right:6px;opacity:.7}
.hero .io{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;gap:12px}
.hero .io div{font-size:13px;opacity:.85}
.hero .io b{display:block;font:600 18px/1.3 var(--num);font-variant-numeric:tabular-nums;opacity:1;margin-top:2px}
.wave{margin-top:16px}
.wave svg{width:100%;height:22px;overflow:visible}
.wave .meta{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;opacity:.85}
.hero.over .wave .meta b{color:var(--error)}
.chips{display:flex;gap:8px;padding:16px 16px 6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px 0 12px;border-radius:8px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--on-surface-variant);box-shadow:inset 0 0 0 1px var(--outline-variant);transition:background-color .2s,color .2s,box-shadow .2s}
.chip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-left:-2px;display:none}
.chip[aria-pressed=true]{background:var(--secondary-container);color:var(--on-secondary-container);box-shadow:none;padding-left:8px}
.chip[aria-pressed=true] svg{display:block}
.chip:active{background:color-mix(in srgb,var(--secondary-container) 70%,var(--on-surface) 10%)}
.day{padding:18px 20px 6px;display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--on-surface-variant)}
.day span:last-child{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:500}
.row{position:relative;overflow:hidden;touch-action:pan-y;transition:height .32s var(--emph)}
.row .bin{position:absolute;inset:0;background:var(--error-container);color:var(--on-error-container);display:flex;align-items:center;justify-content:flex-end;padding-right:28px}
.row .bin svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s var(--emph)}
.row.armed .bin svg{transform:scale(1.25) rotate(-8deg)}
.item{position:relative;display:flex;align-items:center;gap:16px;width:100%;min-height:68px;padding:10px 20px;text-align:left;background:var(--surface);transition:background-color .2s}
.item.slide{transition:transform .32s var(--emph),background-color .2s}
.item:active{background:color-mix(in srgb,var(--surface) 88%,var(--on-surface))}
.item .ic{width:28px;height:28px;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx span{display:block;font-size:13px;color:var(--on-surface-variant);margin-top:2px}
.item .amt{font:600 16px/1 var(--num);font-variant-numeric:tabular-nums}
.item .amt.in{color:var(--tertiary)}
.item.fresh{animation:fresh 1.4s var(--emph)}
@keyframes fresh{0%,30%{background:var(--tertiary-container)}100%{background:var(--surface)}}
.empty{padding:48px 32px;text-align:center;color:var(--on-surface-variant);font-size:15px;line-height:1.6}
.empty svg{width:120px;height:90px;margin:0 auto 12px}
.cat{stroke:var(--on-surface-variant);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cat .t{fill:var(--c,var(--primary));stroke:none;opacity:.9}
.seg{display:inline-flex;margin:4px 16px 0;border-radius:20px;box-shadow:inset 0 0 0 1px var(--outline);overflow:hidden}
.seg button{height:40px;padding:0 18px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--on-surface)}
.seg button+button{box-shadow:inset 1px 0 0 var(--outline)}
.seg button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;display:none}
.seg button[aria-pressed=true]{background:var(--secondary-container);color:var(--on-secondary-container)}
.seg button[aria-pressed=true] svg{display:block}
.donutwrap{position:relative;width:250px;height:250px;margin:14px auto 4px}
.donutwrap svg{width:100%;height:100%;overflow:visible}
.donutwrap circle.s{cursor:pointer;transition:stroke-width .3s var(--emph),opacity .3s}
.dcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.dcenter span{font-size:14px;color:var(--on-surface-variant);font-weight:500}
.dcenter b{font:600 30px/1.15 var(--num);font-variant-numeric:tabular-nums;margin-top:2px}
.dcenter em{font-style:normal;font-size:13px;color:var(--on-surface-variant);margin-top:2px}
.legend{padding:6px 8px 0}
.leg{display:grid;grid-template-columns:28px 1fr auto;gap:4px 14px;align-items:center;width:100%;padding:10px 12px;border-radius:16px;text-align:left;transition:background-color .2s}
.leg[aria-pressed=true]{background:var(--surface-container-high)}
.leg:active{background:var(--surface-container-highest)}
.leg .ic{width:28px;height:28px;grid-row:span 2}
.leg b{font-size:15px;font-weight:500}
.leg .v{font:600 15px/1 var(--num);font-variant-numeric:tabular-nums;text-align:right}
.leg .bar{grid-column:2/4;height:6px;border-radius:3px;background:var(--surface-container-highest);position:relative;overflow:hidden}
.leg .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--c)}
.leg .p{font-size:13px;color:var(--on-surface-variant);font-weight:500;margin-left:6px}
.card{margin:18px 16px 0;padding:18px 16px 14px;border-radius:24px;background:var(--surface-container-low);transition:background-color .45s}
.card h3{font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.card h3 span{font-size:13px;font-weight:500;color:var(--on-surface-variant)}
.bars{margin-top:12px;height:120px;position:relative;touch-action:pan-y}
.bars svg{width:100%;height:100%}
.tip{position:absolute;top:-6px;transform:translateX(-50%);padding:6px 10px;border-radius:8px;background:var(--inverse-surface);color:var(--inverse-on-surface);font:600 13px/1.2 var(--num);white-space:nowrap;pointer-events:none;visibility:hidden}
.tip.on{visibility:visible}
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:8px 16px 0}
.wall{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;transition:border-radius .45s var(--emph)}
.wall svg{width:100%;height:100%}
.wall[aria-pressed=true]{border-radius:48px 48px 22px 22px}
.wall .nm{position:absolute;left:0;right:0;bottom:0;padding:18px 0 9px;text-align:center;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.wall::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 0 var(--primary);transition:box-shadow .3s var(--emph)}
.wall[aria-pressed=true]::after{box-shadow:inset 0 0 0 4px var(--primary),inset 0 0 0 7px var(--surface)}
.sec{padding:24px 20px 8px;font-size:14px;font-weight:600;color:var(--primary)}
.tones{padding:0 16px}
.tones .r{display:grid;grid-template-columns:52px repeat(11,1fr);align-items:center;margin-bottom:4px}
.tones .r span{font-size:12px;color:var(--on-surface-variant);font-weight:500}
.tones .r i{height:28px;display:block;transition:background-color .45s var(--emph)}
.tones .r i:nth-child(2){border-radius:10px 0 0 10px}
.tones .r i:last-child{border-radius:0 10px 10px 0}
.tones .scale{display:grid;grid-template-columns:52px repeat(11,1fr);font:500 10px/1 var(--num);color:var(--on-surface-variant);text-align:center;margin-top:6px}
.lrow{display:flex;align-items:center;gap:16px;width:100%;min-height:72px;padding:8px 20px;text-align:left}
.lrow:active{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.lrow .tx{flex:1}
.lrow .tx b{display:block;font-size:16px;font-weight:500}
.lrow .tx span{display:block;font-size:13px;color:var(--on-surface-variant);margin-top:2px}
.sw{position:relative;width:52px;height:32px;border-radius:16px;background:var(--surface-container-highest);box-shadow:inset 0 0 0 2px var(--outline);flex:none;transition:background-color .25s}
.sw i{position:absolute;left:8px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:transform .3s var(--emph),width .3s var(--emph),height .3s var(--emph),left .3s var(--emph),top .3s var(--emph),background-color .25s;display:grid;place-items:center}
.sw i svg{width:16px;height:16px;stroke:var(--on-primary-container);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .2s}
.lrow[aria-checked=true] .sw{background:var(--primary);box-shadow:none}
.lrow[aria-checked=true] .sw i{left:24px;top:4px;width:24px;height:24px;background:var(--on-primary)}
.lrow[aria-checked=true] .sw i svg{opacity:1}
.slider{position:relative;height:48px;margin:0 20px;touch-action:none;cursor:pointer}
.slider .trk{position:absolute;left:0;right:0;top:16px;height:16px}
.slider .a,.slider .b{position:absolute;top:0;bottom:0}
.slider .a{left:0;border-radius:8px 3px 3px 8px;background:var(--primary)}
.slider .b{right:0;border-radius:3px 8px 8px 3px;background:var(--secondary-container)}
.slider .h{position:absolute;top:2px;width:4px;height:44px;margin-left:-2px;border-radius:2px;background:var(--primary);transition:width .15s,margin .15s}
.slider.drag .h{width:2px;margin-left:-1px}
.slider .vl{position:absolute;top:-34px;transform:translateX(-50%);padding:6px 12px;border-radius:16px;background:var(--inverse-surface);color:var(--inverse-on-surface);font:600 13px/1.2 var(--num);white-space:nowrap;visibility:hidden}
.slider.drag .vl{visibility:visible}
.budgetv{display:flex;justify-content:space-between;padding:0 20px 6px;font-size:13px;color:var(--on-surface-variant)}
.budgetv b{font:600 16px/1 var(--num);color:var(--on-surface)}
.textbtn{height:44px;padding:0 14px;margin:14px 12px 0;border-radius:22px;font-size:14px;font-weight:600;color:var(--error);display:inline-flex;align-items:center;gap:8px}
.textbtn:active{background:color-mix(in srgb,var(--error) 12%,transparent)}
.textbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:absolute;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:40;height:56px;min-width:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;box-shadow:0 3px 4px -2px color-mix(in srgb,var(--primary) 45%,transparent);transition:padding .3s var(--emph),background-color .45s,transform .3s var(--emph),border-radius .2s}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;flex:none}
.fab span{white-space:nowrap;overflow:hidden;max-width:80px;transition:max-width .3s var(--emph)}
.fab.mini{padding:0 16px}
.fab.mini span{max-width:0}
.fab:active{border-radius:22px;background:color-mix(in srgb,var(--primary-container) 85%,var(--on-primary-container))}
.screen.snacking .fab:not(.away){transform:translateY(-58px)}
.fab.away{transform:translateX(calc(100% + 40px))}
.nav{position:absolute;left:0;right:0;bottom:0;z-index:45;height:calc(84px + env(safe-area-inset-bottom));padding:12px 8px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-container);transition:background-color .45s}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;height:60px;font-size:12px;font-weight:600;color:var(--on-surface-variant)}
.nav .pill{position:relative;width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
.nav .pill::before{content:"";position:absolute;inset:0;border-radius:16px;background:var(--secondary-container);transform:scaleX(.3);opacity:0;transition:transform .35s var(--emph),opacity .2s}
.nav .pill svg{position:relative;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav .pill svg .f{fill:none;transition:fill .2s}
.nav button[aria-selected=true]{color:var(--on-surface)}
.nav button[aria-selected=true] .pill{color:var(--on-secondary-container)}
.nav button[aria-selected=true] .pill::before{transform:none;opacity:1}
.nav button[aria-selected=true] .pill svg .f{fill:currentColor}
.nav button:active .pill{background:color-mix(in srgb,var(--on-surface) 10%,transparent)}
.add{position:absolute;inset:0;z-index:80;background:var(--surface);visibility:hidden;display:flex;flex-direction:column;padding-top:calc(38px + env(safe-area-inset-top));clip-path:inset(0 0 0 0 round 0px)}
.add.open{visibility:visible}
.add::before{content:"";position:absolute;inset:0;background:var(--primary-container);opacity:0;pointer-events:none;z-index:5;transition:opacity .28s var(--emph)}
.add.fromfab::before{opacity:1;transition:none}
.add .top{display:flex;align-items:center;padding:4px 8px}
.add .tabs{flex:1;display:flex;justify-content:center;position:relative;gap:4px}
.add .tabs button{height:48px;padding:0 18px;font-size:15px;font-weight:600;color:var(--on-surface-variant)}
.add .tabs button[aria-selected=true]{color:var(--primary)}
.add .tabs .ind{position:absolute;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--primary);transition:transform .35s var(--emph),width .35s var(--emph)}
.add .save{height:40px;padding:0 18px;border-radius:20px;background:var(--primary);color:var(--on-primary);font-size:14px;font-weight:600;margin-right:6px}
.add .save:active{border-radius:10px}
.add .save:disabled{background:color-mix(in srgb,var(--on-surface) 12%,transparent);color:color-mix(in srgb,var(--on-surface) 40%,transparent)}
.amtbox{padding:10px 24px 0;text-align:right}
.amtbox .cur{font-size:15px;font-weight:600;color:var(--on-surface-variant)}
.amtbox .big{font:600 56px/1.1 var(--num);letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--on-surface);white-space:nowrap}
.amtbox .big.zero{color:var(--outline)}
.amtbox .big::after{content:"";display:inline-block;width:3px;height:44px;margin-left:4px;vertical-align:-4px;background:var(--primary);border-radius:2px;animation:caret 1.1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.amtbox .big.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(8px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:2px 0;padding:10px 8px 0}
.cats button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:600;color:var(--on-surface-variant);min-height:64px}
.cats .sh{position:relative;width:48px;height:40px;display:grid;place-items:center}
.cats .sh .ck{position:absolute;inset:-2px 2px;width:44px;height:44px;fill:var(--primary-container);transform:scale(.2) rotate(-60deg);opacity:0;transition:transform .45s var(--emph),opacity .2s;margin:auto}
.cats .sh .ic{position:relative;width:26px;height:26px}
.cats button[aria-pressed=true]{color:var(--on-surface)}
.cats button[aria-pressed=true] .ck{transform:none;opacity:1;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fields{display:flex;gap:8px;padding:8px 16px 0;align-items:stretch}
.tf{flex:1;position:relative;height:52px;border-radius:12px 12px 0 0;background:var(--surface-container-highest);box-shadow:inset 0 -1px 0 var(--on-surface-variant)}
.tf:focus-within{box-shadow:inset 0 -2px 0 var(--primary)}
.tf input{width:100%;height:100%;border:0;background:none;padding:18px 14px 4px;font-size:16px;outline:none}

$('legend').innerHTML = cats.length ? cats.map(x => `<button class="leg" data-k="${x.c.k}" aria-pressed="${statSel === x.c.k}" style="--c:${catColor(statType, x.c.k)}">${icon(statType, x.c.k)}<b>${x.c.n}<span class="p">${Math.round(x.v / total * 100)}%</span></b><span class="v">${fmt(x.v)}</span><span class="bar"><i style="width:${(x.v / cats[0].v * 100).toFixed(1)}%"></i></span></button>`).join('')
: `<div class="empty">這個月沒有${statType === 'out' ? '支出' : '收入'}。</div>`;
// daily bars
const dim = new Date(viewY, viewM + 1, 0).getDate();
const days = Array.from({length: dim}, (_, i) => tx.filter(t => inMonth(t) && t.type === 'out' && parse(t.d).getDate() === i + 1).reduce((a, t) => a + t.amt, 0));
const cap = Math.max(1, ...days.map(v => Math.min(v, 6000)));
const w = 330 / dim, isNow = viewY === today.getFullYear() && viewM === today.getMonth();
let b = '';
days.forEach((v, i) => {
const hgt = v ? Math.max(4, Math.min(v, 6000) / cap * 104) : 2, isT = isNow && i + 1 === today.getDate();
b += `<rect data-i="${i}" x="${(i * w + w * .18).toFixed(2)}" y="${(112 - hgt).toFixed(2)}" width="${(w * .64).toFixed(2)}" height="${hgt.toFixed(2)}" rx="${Math.min(w * .32, 4).toFixed(2)}" fill="${isT ? 'var(--tertiary)' : v > 6000 ? 'var(--error)' : 'var(--primary)'}" opacity="${v ? 1 : .25}"/>`;
});
b += `<path d="M0 116H330" stroke="var(--outline-variant)" stroke-width="1.5" stroke-linecap="round"/>`;
$('barSvg').innerHTML = b; barDays = days;
const used = isNow ? today.getDate() : dim;
$('avgDay').textContent = '日均 ' + fmt(days.reduce((a, v) => a + v, 0) / used);
}
let barDays = [];
document.querySelector('#p-stats .seg').addEventListener('click', e => {
const b = e.target.closest('button'); if (!b) return;
statType = b.dataset.k; statSel = null; haptic(6);
b.parentNode.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
renderStats();
});
$('donut').addEventListener('click', e => { const s = e.target.closest('.s'); if (!s) return; toggleSel(s.dataset.k); });
$('legend').addEventListener('click', e => { const b = e.target.closest('.leg'); if (!b) return; toggleSel(b.dataset.k); });
function toggleSel(k){ statSel = statSel === k ? null : k; haptic(8); renderStats(); }
function barTip(e){
const r = $('bars').getBoundingClientRect(), i = Math.max(0, Math.min(barDays.length - 1, Math.floor((e.clientX - r.left) / r.width * barDays.length)));
const tip = $('tip');
tip.textContent = `${viewM + 1}/${i + 1}・NT$ ${fmt(barDays[i])}`;
tip.style.left = Math.max(60, Math.min(r.width - 60, (i + .5) / barDays.length * r.width)) + 'px';
tip.classList.add('on');
$('barSvg').querySelectorAll('rect').forEach(x => x.style.opacity = +x.dataset.i === i ? 1 : '');
}
$('bars').addEventListener('pointerdown', e => { barTip(e); haptic(4); });
$('bars').addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') barTip(e); });
$('bars').addEventListener('pointerleave', () => { $('tip').classList.remove('on'); $('barSvg').querySelectorAll('rect').forEach(x => x.style.opacity = ''); });
$('walls').addEventListener('click', e => {
const b = e.target.closest('.wall'); if (!b) return;
state.seed = +b.dataset.i; save('seed', state.seed); haptic([6, 30, 6]);
$('walls').querySelectorAll('.wall').forEach(w => w.setAttribute('aria-pressed', w === b));
applyTheme(); renderAll();
snack('主題已從「' + SEEDS[state.seed].n + '」重新取色');
});
$('darkRow').addEventListener('click', () => {
state.dark = !state.dark; save('dark', state.dark); haptic(10);
$('darkRow').setAttribute('aria-checked', state.dark);
applyTheme(); renderAll();
});
const SMIN = 5000, SMAX = 60000, SSTEP = 1000;
function setSlider(v, commit){
v = Math.round(Math.max(SMIN, Math.min(SMAX, v)) / SSTEP) * SSTEP;
const p = (v - SMIN) / (SMAX - SMIN), sl = $('slider'), W = sl.offsetWidth || 350, x = p * W;
$('sa').style.width = Math.max(0, x - 6) + 'px'; $('sb').style.width = Math.max(0, W - x - 6) + 'px';
$('sh').style.left = x + 'px'; $('svl').style.left = x + 'px'; $('svl').textContent = fmt(v);
sl.setAttribute('aria-valuenow', v); sl.setAttribute('aria-valuetext', 'NT$ ' + fmt(v));
$('bgtV').textContent = fmt(v);
if (v !== state.budget){ state.budget = v; haptic(3); }
if (commit){ save('budget', state.budget); renderHero(); }
}
(function(){
const sl = $('slider'); let on = false;
const at = e => { const r = sl.getBoundingClientRect(); return SMIN + (e.clientX - r.left) / r.width * (SMAX - SMIN); };
sl.addEventListener('pointerdown', e => { on = true; sl.classList.add('drag'); try { sl.setPointerCapture(e.pointerId); } catch (_) {} setSlider(at(e)); });
sl.addEventListener('pointermove', e => { if (on) setSlider(at(e)); });
const up = () => { if (!on) return; on = false; sl.classList.remove('drag'); setSlider(state.budget, true); };
sl.addEventListener('pointerup', up); sl.addEventListener('pointercancel', up);
sl.addEventListener('keydown', e => {
const d = {ArrowLeft: -SSTEP, ArrowDown: -SSTEP, ArrowRight: SSTEP, ArrowUp: SSTEP}[e.key];
if (d){ e.preventDefault(); setSlider(state.budget + d, true); }
});
})();
$('resetBtn').addEventListener('click', () => {
haptic(10);
openSheet(`<div class="sh-h"><h2 id="shT">重設示範帳目？</h2></div><p class="note">目前 ${tx.length} 筆帳目會被換成兩個月的示範資料。主題與預算會保留。</p><button class="fill err" data-act="reset">重設</button>`);
});
function go(pid){
document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.p === pid));
document.querySelectorAll('.page').forEach(p => { const on = p.id === pid; if (on && !p.classList.contains('on')){ p.classList.add('on'); p.scrollTop = 0; } else if (!on) p.classList.remove('on'); });
$('fab').classList.toggle('away', pid === 'p-theme');
$('fab').classList.remove('mini');
if (pid === 'p-stats') renderStats();
if (pid === 'p-theme') requestAnimationFrame(() => setSlider(state.budget));
}
document.querySelector('.nav').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; haptic(6); go(b.dataset.p); });
document.querySelectorAll('.page').forEach(p => { let ly = 0; p.addEventListener('scroll', () => { const y = p.scrollTop; if (Math.abs(y - ly) > 6){ $('fab').classList.toggle('mini', y > ly && y > 40); ly = y; } }, {passive: true}); });
let entry = {type: 'out', cat: 'food', amt: '', ago: 0};
function renderCats(){
$('cats').innerHTML = CATS[entry.type].map(c => `<button data-k="${c.k}" aria-pressed="${entry.cat === c.k}"><span class="sh"><svg class="ck" viewBox="0 0 44 44"><path d="${COOKIE}"/></svg>${icon(entry.type, c.k)}</span>${c.n}</button>`).join('');
$('addCat').textContent = catOf(entry.type, entry.cat).n;
}
function renderAmt(){
const v = entry.amt ? +entry.amt : 0;
$('amt').textContent = fmt(v); $('amt').classList.toggle('zero', !v);
$('saveBtn').disabled = !v;
}
function placeInd(){
const b = $('typeTabs').querySelector('[aria-selected=true]'), ind = $('tabInd');
ind.style.width = (b.offsetWidth - 20) + 'px'; ind.style.left = '0px';
ind.style.transform = `translateX(${b.offsetLeft + 10}px)`;
}
let lastFocusAdd = null;
function openAdd(){
entry = {type: 'out', cat: 'food', amt: '', ago: 0};
$('noteIn').value = '';
$('typeTabs').querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === 'out'));
$('dsel').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === '0'));
renderCats(); renderAmt();
const add = $('add'), s = screen.getBoundingClientRect(), f = $('fab').getBoundingClientRect();
const ins = `inset(${f.top - s.top}px ${s.right - f.right}px ${s.bottom - f.bottom}px ${f.left - s.left}px round 16px)`;
lastFocusAdd = document.activeElement;
add.style.transition = 'none'; add.style.clipPath = ins; add.classList.add('open', 'fromfab');
add.offsetWidth; placeInd();
add.style.transition = reduce ? 'none' : 'clip-path .5s var(--emph)';
add.style.clipPath = 'inset(0px 0px 0px 0px round 0px)';
requestAnimationFrame(() => add.classList.remove('fromfab'));
haptic(10);
setTimeout(() => $('addClose').focus({preventScroll: true}), 60);
}
function closeAdd(){
const add = $('add'); if (!add.classList.contains('open')) return;
const s = screen.getBoundingClientRect(), f = $('fab').getBoundingClientRect();
add.style.transition = reduce ? 'none' : 'clip-path .38s var(--accel)';
add.style.clipPath = `inset(${f.top - s.top}px ${s.right - f.right}px ${s.bottom - f.bottom}px ${f.left - s.left}px round 16px)`;
add.classList.add('fromfab');
setTimeout(() => { add.classList.remove('open', 'fromfab'); add.style.clipPath = ''; }, reduce ? 0 : 380);
if (lastFocusAdd) try { lastFocusAdd.focus({preventScroll: true}); } catch (_) {}
}
$('fab').addEventListener('click', openAdd);
$('addClose').addEventListener('click', () => { haptic(6); closeAdd(); });
$('typeTabs').addEventListener('click', e => {
const b = e.target.closest('button'); if (!b) return;
entry.type = b.dataset.t; entry.cat = CATS[entry.type][0].k; haptic(6);
$('typeTabs').querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', x === b));
placeInd(); renderCats();
});
$('cats').addEventListener('click', e => {
const b = e.target.closest('button'); if (!b) return;
entry.cat = b.dataset.k; haptic(5);
$('cats').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
$('addCat').textContent = catOf(entry.type, entry.cat).n;
});
$('dsel').addEventListener('click', e => {
const b = e.target.closest('button'); if (!b) return;
entry.ago = +b.dataset.d; haptic(5);
$('dsel').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
});
function key(k){
if (k === 'bk'){ entry.amt = entry.amt.slice(0, -1); haptic(4); }
else {
const n = entry.amt + k;
if (n.replace(/^0+/, '').length > 7){ const a = $('amt'); a.classList.remove('shake'); a.offsetWidth; a.classList.add('shake'); haptic([20, 30, 20]); return; }
entry.amt = n.replace(/^0+/, ''); haptic(4);
}
renderAmt();
}
$('pad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) key(b.dataset.k); });
document.addEventListener('keydown', e => {
if (!$('add').classList.contains('open') || document.activeElement === $('noteIn')) return;
if (/^[0-9]$/.test(e.key)) key(e.key);
else if (e.key === 'Backspace') key('bk');
else if (e.key === 'Enter' && !$('saveBtn').disabled) $('saveBtn').click();
});
$('saveBtn').addEventListener('click', () => {
const v = +entry.amt; if (!v) return;
const d = new Date(today); d.setDate(d.getDate() - entry.ago);
const t = {id: nextId++, d: dk(d), type: entry.type, cat: entry.cat, amt: v, note: $('noteIn').value.trim()};
tx.push(t); persist(); haptic([8, 40, 14]);
viewY = d.getFullYear(); viewM = d.getMonth();
if (filter !== 'all' && !passes(t)){ filter = 'all'; renderChips(); }
closeAdd(); go('p-list');
setTimeout(() => {
renderAll(t.id);
snack(`已記下 NT$ ${fmt(v)}・${catOf(t.type, t.cat).n}`);
const row = $('list').querySelector(`.row[data-id="${t.id}"]`); if (row) row.scrollIntoView({block: 'center', behavior: reduce ? 'auto' : 'smooth'});
}, reduce ? 0 : 300);
});
function openDetail(id){
const t = tx.find(x => x.id === id); if (!t) return;
const c = catOf(t.type, t.cat), d = parse(t.d);
openSheet(`<div class="sh-h"><h2 id="shT">${esc(t.note || c.n)}</h2><button class="ib" data-del="${t.id}" aria-label="刪除這筆"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 4h4M7 7l1 13h8l1-13M10.5 11v5M13.5 11v5"/></svg></button></div>
<div class="sh-amt">${icon(t.type, t.cat)}<b>${t.type === 'in' ? '+' : '−'}${fmt(t.amt)}</b></div>
<div class="kv"><div><span>日期</span>${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${WD[d.getDay()]}</div><div><span>類型</span>${t.type === 'in' ? '收入' : '支出'}</div></div>
<div class="sec" style="padding-top:8px">改分類</div>
<div class="recat">${CATS[t.type].map(x => `<button data-re="${x.k}" data-id="${t.id}" aria-pressed="${x.k === t.cat}">${icon(t.type, x.k)}${x.n}</button>`).join('')}</div>
<button class="fill" data-act="close">完成</button>`);
}
const sheet = $('sheet'), scrim = $('scrim');
let sheetFocus = null;
function openSheet(html){
sheetFocus = document.activeElement;
$('sheetBody').innerHTML = html;
sheet.style.transform = ''; sheet.scrollTop = 0;
sheet.classList.add('on'); scrim.classList.add('on');
const f = sheet.querySelector('#sheetBody button'); if (f) setTimeout(() => f.focus({preventScroll: true}), 30);
}
function closeSheet(){
if (!sheet.classList.contains('on')) return;
sheet.classList.remove('on', 'drag'); scrim.classList.remove('on'); sheet.style.transform = ''; scrim.style.opacity = '';
if (sheetFocus) try { sheetFocus.focus({preventScroll: true}); } catch (_) {}
}
scrim.addEventListener('click', closeSheet);
sheet.addEventListener('click', e => {
const b = e.target.closest('button'); if (!b) return;
if (b.dataset.act === 'close'){ haptic(6); closeSheet(); }
else if (b.dataset.act === 'reset'){ tx = seedData(); nextId = tx.reduce((m, t) => Math.max(m, t.id), 0) + 1; persist(); viewY = today.getFullYear(); viewM = today.getMonth(); filter = 'all'; renderChips(); renderAll(); closeSheet(); haptic([10, 30, 10]); snack('示範帳目已重設'); }
else if (b.dataset.del){ const id = +b.dataset.del; closeSheet(); setTimeout(() => removeTx(id), 200); }
else if (b.dataset.re){
const t = tx.find(x => x.id === +b.dataset.id); if (!t) return;
t.cat = b.dataset.re; persist(); haptic(6);
sheet.querySelectorAll('[data-re]').forEach(x => x.setAttribute('aria-pressed', x === b));
const ic = sheet.querySelector('.sh-amt .ic'); if (ic) ic.outerHTML = icon(t.type, t.cat);
renderAll();
}
else if (b.dataset.yr){ pickY += +b.dataset.yr; haptic(4); $('sheetBody').innerHTML = monthsHTML(); }
else if (b.dataset.mo != null){ viewY = pickY; viewM = +b.dataset.mo; statSel = null; haptic(8); closeSheet(); renderAll(); }
});
(function(){
let y0 = 0, dy = 0, on = false, t0 = 0, h = 1;
sheet.addEventListener('pointerdown', e => {
if (e.target.closest('button') && !e.target.closest('.grab')) { if (sheet.scrollTop > 0) return; }
if (sheet.scrollTop > 0) return;
on = true; y0 = e.clientY; dy = 0; t0 = e.timeStamp; h = sheet.offsetHeight;
});
sheet.addEventListener('pointermove', e => {
if (!on) return;
dy = Math.max(0, e.clientY - y0);
if (dy > 4){ sheet.classList.add('drag'); try { sheet.setPointerCapture(e.pointerId); } catch (_) {} }
sheet.style.transform = `translateY(${dy}px)`; scrim.style.opacity = String(1 - dy / h * .8);
});
const end = e => {
if (!on) return; on = false; sheet.classList.remove('drag');
const v = dy / Math.max(1, e.timeStamp - t0);
if (dy > h * .35 || (v > .6 && dy > 30)){ haptic(6); closeSheet(); }
else { sheet.style.transform = ''; scrim.style.opacity = ''; }
};
sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();
document.addEventListener('keydown', e => {
if (e.key !== 'Escape') return;
if (sheet.classList.contains('on')) closeSheet(); else if ($('add').classList.contains('open')) closeAdd();
});
let snackT = 0, snackFn = null;
function snack(msg, act, fn){
const s = $('snack');
$('snackT').textContent = msg;
$('snackB').style.display = act ? '' : 'none'; $('snackB').textContent = act || '';
snackFn = fn || null;
s.classList.add('on'); screen.classList.add('snacking'); clearTimeout(snackT);
snackT = setTimeout(() => { s.classList.remove('on'); screen.classList.remove('snacking'); }, act ? 5000 : 2600);
}
$('snackB').addEventListener('click', () => { if (snackFn) snackFn(); snackFn = null; $('snack').classList.remove('on'); screen.classList.remove('snacking'); });
function tick(){ const d = new Date(); $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
tick(); setTimeout(function t(){ tick(); setTimeout(t, 60000 - Date.now() % 60000); }, 60000 - Date.now() % 60000);
try { navigator.getBattery && navigator.getBattery().then(b => { $('batt').textContent = Math.round(b.level * 100) + '%'; }).catch(() => {}); } catch (_) {}
function renderAll(fresh){ renderHeader(); renderHero(); renderList(fresh); if ($('p-stats').classList.contains('on')) renderStats(); }
applyTheme(); renderWalls(); renderChips(); renderAll();
$('darkRow').setAttribute('aria-checked', state.dark);
addEventListener('resize', () => { if ($('p-theme').classList.contains('on')) setSlider(state.budget); if ($('add').classList.contains('open')) placeInd(); });
})();
</script>
</body>
</html>
