<!doctype html>

<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<title>館藏 · 博物館導覽</title>
<meta name="description" content="臺灣日常器物館的隨身導覽：三層樓平面圖點房間縮放，展品以展牆標籤排版呈現，語音導覽可刮擦逐句聆聽，喜歡的收進收藏。收錄於 100 Creative HTML Works（App 080・展品標籤排版）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/080-museum-guide.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f3f2ee'/%3E%3Cpath d='M8 8h30v26H8z' fill='%236e2f2b'/%3E%3Cpath d='M38 8h18v40H38z' fill='%238e9b80'/%3E%3Cpath d='M8 34h30v22H8z' fill='%23c69a4b'/%3E%3Cpath d='M8 8h48v48H8z' fill='none' stroke='%23151515' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#f3f2ee; --ink:#151515; --ink2:#5b5a56; --ink3:#8c8a84; --rule:#d9d7d1;
  --op:Optima,"Optima nova","Candara","Segoe UI",sans-serif;
  --cjk:"PingFang TC","Heiti TC",system-ui,sans-serif;
  --mix:Optima,"PingFang TC","Heiti TC",sans-serif;
  --out:cubic-bezier(.2,1,.3,1); --spring:cubic-bezier(.3,1.3,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.55 var(--mix);color:var(--ink);background:var(--paper);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;text-align:inherit}
button:focus-visible,[tabindex]:focus-visible,.mk:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
svg{display:block}
.num{font-family:var(--op);font-variant-numeric:lining-nums}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--paper);isolation:isolate;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
@media (min-width:521px){
  body{background:#4b2522}
  .stage{display:flex;align-items:center;justify-content:center;gap:80px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#6a3531 0%,#5a2c29 30%,#46221f 70%,#3a1c1a 100%)}
  .backdrop::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9vh;background:#2a1715;box-shadow:0 -3px 0 #1e100f}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:52px;padding:8px;z-index:1;background:#141414;box-shadow:inset 0 0 0 1px #3b3b3b,0 26px 30px -24px rgba(0,0,0,.9)}
  .screen{inset:8px;border-radius:44px}
  .caption{display:block;position:relative;z-index:1;width:230px;background:#f3f2ee;color:var(--ink);padding:22px 22px 20px;align-self:center;margin-top:120px;box-shadow:0 8px 10px -8px rgba(0,0,0,.6)}
  .caption h1{font:400 26px/1.2 var(--cjk);letter-spacing:.06em}
  .caption .by{font:italic 14px/1.4 var(--op);margin-top:4px;color:var(--ink2)}
  .caption .md{font:13px/1.6 var(--mix);color:var(--ink2);margin-top:10px}
  .caption p{font:13.5px/1.75 var(--cjk);margin-top:12px}
  .caption .acc{font:12px/1 var(--op);color:var(--ink3);margin-top:14px;letter-spacing:.06em}
}
@media (min-width:521px) and (max-width:900px){.caption{display:none}}

.status{flex:none;display:flex;align-items:center;justify-content:space-between;height:calc(46px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 32px;font:600 15px/1 var(--op)}
.status .gl{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}

.head{flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:6px 20px 12px}
.head .nm{font:500 17px/1.2 var(--cjk);letter-spacing:.08em}
.head .en{font:italic 13px/1.3 var(--op);color:var(--ink2);margin-top:2px}
.tabs{display:flex;gap:16px}
.tabs button{font:400 15px/1 var(--cjk);color:var(--ink3);min-height:44px;display:flex;align-items:center;gap:4px}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:600}
.tabs .c{font:600 15px/1 var(--op)}

.views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.view[hidden]{display:none}
.view.enter{animation:vin .4s var(--out)}
@keyframes vin{from{transform:translateY(14px)}to{transform:none}}

.fbar{flex:none;display:flex;align-items:flex-end;gap:12px;padding:0 20px 10px;min-height:62px}
.fbar .fl{font:400 52px/.9 var(--op);letter-spacing:-.01em}
.fbar .fl small{font-size:22px;margin-left:2px}
.fbar .fn{flex:1;min-width:0;padding-bottom:4px}
.fbar .fn b{display:block;font:500 17px/1.3 var(--cjk);letter-spacing:.06em}
.fbar .fn span{font:13px/1.3 var(--mix);color:var(--ink2)}
.fbar .seen{text-align:right;padding-bottom:4px;font:13px/1.3 var(--mix);color:var(--ink2)}
.fbar .seen b{display:block;font:400 22px/1 var(--op);color:var(--ink)}
.back{display:none;align-items:center;gap:6px;min-height:44px;font:500 15px/1 var(--cjk);padding-right:8px;margin-bottom:-4px}
.zoomed .back{display:flex}
.zoomed .fl{display:none}
.back:active{opacity:.6}

.planwrap{flex:1;position:relative;min-height:0;margin:0 12px 0 8px;touch-action:manipulation}
.strip{flex:none;display:flex;gap:12px;overflow-x:auto;padding:12px 20px calc(30px + env(safe-area-inset-bottom));scrollbar-width:none;overscroll-behavior-x:contain}
.strip::-webkit-scrollbar{display:none}
.tile{flex:none;width:92px;text-align:left}
.tile .art{display:grid;place-items:center;width:92px;height:92px}
.tile .art svg{width:66px;height:66px}
.tile b{display:block;font:500 13px/1.3 var(--cjk);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font:12px/1.2 var(--op);color:var(--ink2)}
.tile:active .art{filter:brightness(.92)}

.plan{position:absolute;inset:0;width:calc(100% - 52px);height:100%}
.plan.swap{animation:lift .45s var(--out)}
@keyframes lift{from{transform:translateY(var(--fy,30px))}to{transform:none}}
.room{cursor:pointer;transition:opacity .4s}
.plan.focus .room:not(.on),.plan.focus .ex{opacity:.3}
.plan.focus .mk.off{opacity:.3}
.room rect.fillr{transition:filter .2s}
.room:active rect.fillr{filter:brightness(.92)}
.rl{font-family:var(--op);pointer-events:none}
.rn{font-family:var(--cjk);pointer-events:none}
.mk{cursor:pointer}
.mk circle{transition:r .2s}
.mk text{font:600 12px var(--op);pointer-events:none}
.floors{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.floors button{width:44px;height:52px;display:flex;align-items:center;justify-content:center;font:400 22px/1 var(--op);color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--rule)}
.floors button[aria-pressed=true]{background:var(--ink);color:var(--paper);box-shadow:none}
.floors button:active{background:#e4e2dc}
.floors button[aria-pressed=true]:active{background:#333}
.floors .ico{height:28px;box-shadow:none;color:var(--ink3)}

/* collection */
.coll{flex:1;overflow-y:auto;padding:4px 16px 110px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start;overscroll-behavior:contain}
.coll{gap:22px 12px}
.card{display:flex;flex-direction:column;text-align:left;min-width:0}
.card .fr{display:block;background:#e7e5df;padding:9%}
.card .art{aspect-ratio:1/1;display:grid;place-items:center}
.card .art svg{width:70%;height:70%}
.card .cap{padding:9px 2px 0}
/* newest postcard leads the table, the way a gallery index opens on its latest entry */
.card.wide{grid-column:1/-1}
.card.wide .fr{padding:18px}
.card.wide .art{aspect-ratio:16/10}
.card.wide .art svg{width:auto;height:72%}
.card.wide .cap{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card.first .cap b{font-size:17px}
.card.wide .cap b{display:inline}
.card .cap b{display:block;font:500 15px/1.3 var(--cjk)}
.card .cap span{font:12.5px/1.4 var(--mix);color:var(--ink2)}
.card:active .art{filter:brightness(.94)}
.collhead{grid-column:1/-1;font:13.5px/1.6 var(--cjk);color:var(--ink2);padding:0 2px 4px}
.collempty{grid-column:1/-1;padding:30px 4px;font:15px/1.8 var(--cjk);color:var(--ink2)}

/* mini player */
.mini{position:absolute;left:10px;right:10px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:20;background:var(--ink);color:var(--paper);display:flex;align-items:center;min-height:60px;padding:0 4px 0 14px;gap:10px;transform:translateY(140%);transition:transform .4s var(--spring)}
.mini.on{transform:none}
.mini .mt{flex:1;min-width:0;cursor:pointer}
.mini .mt b{display:block;font:500 14px/1.3 var(--cjk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mt span{font:12px/1.3 var(--op);color:#b5b3ad}
.mini .pb{position:absolute;left:0;bottom:0;height:3px;background:var(--paper);border-radius:0 2px 2px 0}
.mini button.ib{width:44px;height:44px;display:grid;place-items:center}
.mini button.ib:active{opacity:.6}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(21,21,21,.8);z-index:30;pointer-events:none}

/* sheet = wall label */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(21,21,21,.42);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;height:92%;background:var(--paper);display:flex;flex-direction:column;transform:translateY(calc(100% + 30px));transition:transform .5s var(--spring);touch-action:none;border-radius:16px 16px 0 0;overflow:hidden}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.sb{flex:1;overflow-y:auto;overscroll-behavior:contain}
.wall{position:relative;height:250px;display:grid;place-items:center}
.wall svg.obj{width:170px;height:170px}
.wall .grab{position:absolute;top:8px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:currentColor;opacity:.45}
.wall .nav{position:absolute;bottom:10px;display:flex;gap:4px}
.wall .nav.l{left:8px}.wall .nav.r{right:8px}
.wall .nav button{width:44px;height:44px;display:grid;place-items:center;color:inherit}
.wall .nav button:active{opacity:.6}
.wall .roomtag{position:absolute;top:22px;left:20px;font:13px/1.3 var(--mix);opacity:.85}
.lbl{padding:22px 24px 8px;max-width:420px}
.lbl .no{font:400 15px/1 var(--op);color:var(--ink2)}
.lbl h2{font:300 30px/1.2 var(--cjk);letter-spacing:.04em;margin-top:10px}
.lbl .mk2{font:500 15px/1.5 var(--mix);margin-top:10px}
.lbl .meta{font:14px/1.6 var(--mix);color:var(--ink2);margin-top:2px}
.lbl p{font:15.5px/1.85 var(--cjk);margin-top:14px}
.lbl .acc{font:12.5px/1 var(--op);color:var(--ink3);margin-top:16px;letter-spacing:.04em}
.guide{margin:18px 24px 0;padding-top:16px;box-shadow:0 -2px 0 var(--ink)}
.guide .gh{display:flex;align-items:center;gap:12px}
.guide .play{width:52px;height:52px;display:grid;place-items:center;flex:none}
.guide .play:active{opacity:.6}
.guide .gt{flex:1;font:500 15px/1.3 var(--cjk)}
.guide .gt span{display:block;font:13px/1.3 var(--op);color:var(--ink2);margin-top:2px}
.guide .say{font:13px/1 var(--cjk);color:var(--ink2);min-height:44px;display:flex;align-items:center;gap:6px}
.guide .say[aria-pressed=true]{color:var(--ink);font-weight:600}
.scrub{position:relative;height:48px;margin-top:6px;cursor:pointer;touch-action:none}
.scrub svg{width:100%;height:100%}
.scrub .head2{position:absolute;top:6px;bottom:6px;width:2px;margin-left:-1px;background:var(--ink);pointer-events:none}
.tr{margin-top:8px;padding-bottom:6px}
.tr button{display:flex;gap:12px;width:100%;padding:8px 0;font:15px/1.7 var(--cjk);color:var(--ink3);transition:color .25s}
.tr button .ts{flex:none;width:34px;font:13px/1.9 var(--op);color:var(--ink3)}
.tr button.cur{color:var(--ink)}
.tr button.cur .ts{color:var(--ink)}
.acts{margin:10px 24px calc(30px + env(safe-area-inset-bottom))}
.act{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;box-shadow:0 -1px 0 var(--rule);font:500 15px/1.3 var(--cjk)}
.act:active{background:#e7e5df}
.act svg{flex:none}
.act .st{margin-left:auto;font:13px/1 var(--mix);color:var(--ink2)}

.toast{position:absolute;left:50%;top:calc(54px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-140px);background:var(--ink);color:var(--paper);padding:11px 16px;font:500 14px/1.3 var(--cjk);white-space:nowrap;visibility:hidden;transition:transform .45s var(--spring),visibility 0s .45s}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .45s var(--spring)}

@media (prefers-reduced-motion:reduce){
  .view.enter,.plan.swap{animation:none}
  .sheet,.toast,.mini{transition-duration:.01s}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true"></div>
  <aside class="caption">
    <h1>館藏</h1>
    <div class="by">Museum Guide, 2026</div>
    <div class="md">HTML、SVG、Web Audio<br>手機一支</div>
    <p>示範展館的隨身導覽。點房間放大，讀展牆標籤，拖動頁內導覽逐句聽。</p>
    <div class="acc">App 080</div>
  </aside>
  <div class="device">
    <div class="screen" id="screen">
      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="gl">
          <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx=".6" fill="currentColor"/><rect x="4.6" y="5" width="3" height="6" rx=".6" fill="currentColor"/><rect x="9.2" y="2.5" width="3" height="8.5" rx=".6" fill="currentColor"/><rect x="13.8" y="0" width="3" height="11" rx=".6" fill="currentColor"/></svg>
          <svg width="15" height="11" viewBox="0 0 15 11"><path d="M7.5 10.5 5 7.8a3.6 3.6 0 0 1 5 0z" fill="currentColor"/><path d="M2.8 5.3a6.7 6.7 0 0 1 9.4 0M.6 2.9a10 10 0 0 1 13.8 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17" height="8" rx="1.6" fill="currentColor"/><path d="M24 4v4c.8-.3 1.3-1 1.3-2S24.8 4.3 24 4z" fill="currentColor" opacity=".45"/></svg>
        </span>
      </div>
      <header class="head">
        <div><div class="nm">臺灣日常器物館</div><div class="en">Museum of Everyday Taiwan</div></div>
        <div class="tabs" role="tablist">
          <button role="tab" data-v="plan" aria-selected="true">平面圖</button>
          <button role="tab" data-v="coll" aria-selected="false">收藏 <span class="c" id="collN">0</span></button>
        </div>
      </header>
      <main class="views">
        <section class="view" id="v-plan" aria-label="平面圖">
          <div class="fbar" id="fbar">
            <button class="back" id="back" aria-label="回到全層"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M10 2 4 8l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>全層</button>
            <div class="fl num" id="flNum">1<small>F</small></div>
            <div class="fn"><b id="flName">廚房與餐桌</b><span id="flSub">3 間展間 · 4 件展品</span></div>
            <div class="seen"><b class="num" id="seenN">0/12</b>已看</div>
          </div>
          <div class="planwrap" id="planwrap">
            <svg class="plan" id="plan" viewBox="8 8 344 440" preserveAspectRatio="xMidYMid meet" role="group" aria-label="樓層平面圖"></svg>
            <div class="floors" role="group" aria-label="樓層">
              <span class="ico floors-ico" aria-hidden="true"><svg width="22" height="26" viewBox="0 0 22 26"><path d="M3 2h16v22H3zM11 2v22" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6.5 10l2-2.5 2 2.5M11.5 16l2 2.5 2-2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              <button data-f="3" aria-pressed="false" aria-label="3 樓">3</button>
              <button data-f="2" aria-pressed="false" aria-label="2 樓">2</button>
              <button data-f="1" aria-pressed="true" aria-label="1 樓">1</button>
            </div>
          </div>
          <div class="strip" id="strip" aria-label="本層展品"></div>
        </section>
        <section class="view" id="v-coll" aria-label="收藏" hidden>
          <div class="coll" id="coll"></div>
        </section>
      </main>
      <div class="mini" id="mini" aria-hidden="true">
        <div class="mt" id="miniOpen" role="button" tabindex="-1" aria-label="打開正在播放的展品"><b id="miniT"></b><span id="miniS"></span></div>
        <button class="ib" id="miniPlay" aria-label="播放或暫停" tabindex="-1"></button>
        <button class="ib" id="miniX" aria-label="停止導覽" tabindex="-1"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <i class="pb" id="miniPb"></i>
      </div>
      <div class="home" aria-hidden="true"></div>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="展品標籤"><div class="sb" id="sb"></div></div>
      <div class="toast" id="toast" role="status"></div>
    </div>
  </div>
</div>
<script>
(function(){

var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
var K = 'app080:';

/* ---------- rooms + floors ---------- */

 G:{f:3,r:[20,20,160,210],c:'#66704f',t:'#f3f2ee',n:'窗'}, H:{f:3,r:[180,20,160,210],c:'#a8634a',t:'#f3f2ee',n:'客廳'}, I:{f:3,r:[20,230,320,100],c:'#cfc6b2',t:'#151515',n:'燈'}
};
var FLOORS = {

document.querySelectorAll('.floors button').forEach(function(b){ b.addEventListener('click', function(){ var f = +b.dataset.f; if(f===floor){ zoomOut(); return; } var up = f > floor; floor = f; zoomRoom = null; cancelAnimationFrame(anim); vb = FULL.slice(); renderPlan(); persist(); ding(up); haptic([6,40,6]);
  var p = $('plan'); p.style.setProperty('--fy', (up ? -40 : 40)+'px'); p.classList.remove('swap'); void p.getBoundingClientRect(); p.classList.add('swap'); }); });

/* ---------- audio: elevator ding, room tone, narration ---------- */
var ac = null, tone = null;
function actx(){ try{ if(!ac){ var A = window.AudioContext||window.webkitAudioContext; if(!A) return null; ac = new A(); } if(ac.state==='suspended') ac.resume(); }catch(e){ return null; } return ac; }
function beep(f, t, d, g){ var a = actx(); if(!a) return; var o = a.createOscillator(), v = a.createGain(), s = a.currentTime+t; o.type='sine'; o.frequency.value=f; v.gain.setValueAtTime(0,s); v.gain.linearRampToValueAtTime(g,s+.01); v.gain.exponentialRampToValueAtTime(.0001,s+d); o.connect(v); v.connect(a.destination); o.start(s); o.stop(s+d+.05); }
function ding(up){ beep(up?988:1175, 0, 1.1, .06); beep(up?1175:988, .22, 1.3, .05); }
function tick2(){ beep(1760, 0, .05, .02); }
function roomTone(on){ var a = actx(); if(!a) return;
  if(on && !tone){ var n = a.sampleRate*2, b = a.createBuffer(1,n,a.sampleRate), d = b.getChannelData(0), last = 0; for(var i=0;i<n;i++){ last = (last + .02*(Math.random()*2-1))/1.02; d[i] = last*3.2; }
    var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = b; s.loop = true; f.type='lowpass'; f.frequency.value = 380; g.gain.value = 0; g.gain.linearRampToValueAtTime(.05, a.currentTime+.6); s.connect(f); f.connect(g); g.connect(a.destination); s.start(); tone = {s:s, g:g}; }
  else if(!on && tone){ var tt = tone; tone = null; try{ tt.g.gain.cancelScheduledValues(a.currentTime); tt.g.gain.setValueAtTime(tt.g.gain.value, a.currentTime); tt.g.gain.linearRampToValueAtTime(0, a.currentTime+.3); tt.s.stop(a.currentTime+.35); }catch(e){} } }
var voice = null;
function pickVoice(){ try{ var vs = speechSynthesis.getVoices(); voice = vs.filter(function(v){ return /zh[-_]TW/i.test(v.lang); })[0] || vs.filter(function(v){ return /^zh/i.test(v.lang); })[0] || null; }catch(e){} }
try{ if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } }catch(e){}
function say(txt){ if(!speak) return; try{ if(!window.speechSynthesis) return; speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(txt); u.lang = 'zh-TW'; if(voice) u.voice = voice; u.rate = .95; speechSynthesis.speak(u); }catch(e){} }
function hush(){ try{ window.speechSynthesis && speechSynthesis.cancel(); }catch(e){} }

var pl = {id:null, t:0, on:false, cue:-1}, plT = 0, plLast = 0;
function cueAt(t){ var c = 0; CUES.forEach(function(s,i){ if(t >= s) c = i; }); return c; }
function play(id){ if(pl.id !== id){ pl = {id:id, t:0, on:false, cue:-1}; } if(pl.t >= T) pl.t = 0; pl.on = true; roomTone(true); plLast = performance.now(); loopPl(); updPl(true); }
function pause(){ pl.on = false; roomTone(false); hush(); cancelAnimationFrame(plT); updPl(); }
function stop(){ pause(); pl = {id:null, t:0, on:false, cue:-1}; updPl(); }
function loopPl(){ cancelAnimationFrame(plT); plT = requestAnimationFrame(function f(now){ if(!pl.on) return; if(document.hidden){ plLast = now; plT = requestAnimationFrame(f); return; } pl.t += (now - plLast)/1000; plLast = now;
  if(pl.t >= T){ pl.t = T; pause(); if(!seenHas(pl.id)){ seen.push(pl.id); persist(); } return; } updPl(); plT = requestAnimationFrame(f); }); }
function seenHas(id){ return seen.indexOf(id) >= 0; }
function fmtT(t){ t = Math.floor(t); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
function updPl(forceSay){ var c = cueAt(pl.t);
  if(pl.on && (c !== pl.cue || forceSay)){ pl.cue = c; say(BY[pl.id].tr[c]); } else if(!pl.on) pl.cue = c;
  // sheet
  if(cur && pl.id === cur){ var h = $('sheadH'); if(h) h.style.left = (pl.t/T*100).toFixed(2)+'%'; var pf = $('scrubFill'); if(pf) pf.setAttribute('width', (pl.t/T*100).toFixed(2)+'%');
    var tt = $('gtT'); if(tt) tt.textContent = fmtT(pl.t)+' / '+fmtT(T); var pb = $('playBtn'); if(pb) pb.innerHTML = pl.on ? PAUSE : PLAY, pb.setAttribute('aria-label', pl.on ? '暫停導覽' : '播放導覽');
    document.querySelectorAll('.tr button').forEach(function(b, i){ b.classList.toggle('cur', i === c); }); }
  // mini
  var mini = $('mini'), show = !!pl.id && !(sheet.classList.contains('on') && cur === pl.id);
  mini.classList.toggle('on', show); mini.setAttribute('aria-hidden', !show); mini.querySelectorAll('[tabindex]').forEach(function(x){ x.tabIndex = show ? 0 : -1; });
  if(pl.id){ $('miniT').textContent = pl.id+'　'+BY[pl.id].t; $('miniS').textContent = (pl.on?'導覽中 ':'已暫停 ')+fmtT(pl.t)+' / '+fmtT(T); $('miniPb').style.width = (pl.t/T*100).toFixed(1)+'%'; $('miniPlay').innerHTML = pl.on ? PAUSE_S : PLAY_S; }
}
var PLAY = '<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 9.5v11l9-5.5z" fill="currentColor"/></svg>';
var PAUSE = '<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11.5 10v10M18.5 10v10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
var PLAY_S = '<svg width="18" height="18" viewBox="0 0 18 18"><path d="M5 3.5v11l9-5.5z" fill="currentColor"/></svg>';
var PAUSE_S = '<svg width="18" height="18" viewBox="0 0 18 18"><path d="M5.5 4v10M12.5 4v10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
$('miniPlay').addEventListener('click', function(){ haptic(5); pl.on ? pause() : play(pl.id); });
$('miniX').addEventListener('click', function(){ haptic(5); stop(); });
$('miniOpen').addEventListener('click', function(){ if(pl.id) openEx(pl.id); });
$('miniOpen').addEventListener('keydown', function(e){ if(e.key==='Enter' && pl.id) openEx(pl.id); });

/* ---------- label sheet ---------- */
var sheet = $('sheet'), scrim = $('scrim'), cur = null, lastFocus = null;
function bars(){ var s = '', r = 5; function rnd(){ r = (r*16807)%2147483647; return r/2147483647; } for(var i=0;i<60;i++){ var h = 6 + Math.abs(Math.sin(i*.37)*14) + rnd()*10; s += '<rect x="'+(i*100/60+.3).toFixed(2)+'%" y="'+(24-h/2).toFixed(1)+'" width="0.9%" height="'+h.toFixed(1)+'" rx="1"/>'; } return s; }
var BARS = bars();
function openEx(id){ var e = BY[id], r = ROOMS[e.room]; cur = id; if(!seenHas(id)){ seen.push(id); persist(); }
  var ids = EX.map(function(x){ return x.id; }), i = ids.indexOf(id), prev = EX[(i-1+EX.length)%EX.length], next = EX[(i+1)%EX.length], fav = favs.indexOf(id) >= 0;
  var h = '<div class="wall" style="background:'+r.c+';color:'+r.t+'"><i class="grab"></i><div class="roomtag">'+r.f+' 樓 · 展間 '+e.room+' '+r.n+'</div>'+obj(id, r.t)+
    '<div class="nav l"><button data-go="'+prev.id+'" aria-label="上一件：'+prev.t+'"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M12.5 3.5 6 10l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>'+
    '<div class="nav r"><button data-go="'+next.id+'" aria-label="下一件：'+next.t+'"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M7.5 3.5 14 10l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>'+
    '<div class="lbl"><div class="no">'+String(id).padStart(2,'0')+'</div><h2>'+e.t+'</h2><div class="mk2">'+e.mk+'</div><div class="meta">'+e.yr+'<br>'+e.mat+'<br>'+e.dim+'</div><p>'+e.d+'</p><div class="acc">館藏號 '+e.acc+'</div></div>'+
    '<div class="guide"><div class="gh"><button class="play" id="playBtn" aria-label="播放導覽">'+(pl.id===id && pl.on ? PAUSE : PLAY)+'</button><div class="gt">示範導覽<span id="gtT">0:00 / 0:40</span></div><button class="say" id="sayBtn" aria-pressed="'+!!speak+'">'+
      '<svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 7v4h3l4 3.5v-11L6 7z" fill="currentColor"/>'+(speak?'<path d="M12.5 6.5c1.2 1.4 1.2 3.6 0 5M14.6 4.6c2.3 2.5 2.3 6.3 0 8.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>':'<path d="M12.5 7l4 4M16.5 7l-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>')+'</svg>朗讀</button></div>'+
    '<div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="導覽進度" aria-valuemin="0" aria-valuemax="40"><svg aria-hidden="true"><defs><clipPath id="cf"><rect id="scrubFill" x="0" y="0" width="0%" height="48"/></clipPath></defs><g fill="#c9c7c1">'+BARS+'</g><g fill="#151515" clip-path="url(#cf)">'+BARS+'</g></svg><i class="head2" id="sheadH"></i></div>'+
    '<div class="tr">'+e.tr.map(function(l, k){ return '<button data-cue="'+k+'"><span class="ts">'+fmtT(CUES[k])+'</span>'+l+'</button>'; }).join('')+'</div></div>'+
    '<div class="acts"><button class="act" id="favBtn" aria-pressed="'+fav+'"><svg width="20" height="22" viewBox="0 0 20 22"><path d="M4 2h12v18l-6-4.5L4 20z" fill="'+(fav?RED:'none')+'" stroke="'+(fav?RED:'currentColor')+'" stroke-width="1.7" stroke-linejoin="round"/></svg>'+(fav?'已收藏':'收進收藏')+'<span class="st">'+(fav?'取消':favs.length+' 件')+'</span></button>'+
    '<button class="act" id="goRoom"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M2 2h16v16H2zM2 10h7M11 2v7" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="14.5" cy="14" r="2" fill="currentColor"/></svg>在平面圖上看<span class="st">'+r.f+'F · '+e.room+'</span></button></div>';
  $('sb').innerHTML = h;
  if(!sheet.classList.contains('on')){ lastFocus = document.activeElement; sheet.style.transform = ''; sheet.classList.add('on'); scrim.classList.add('on'); haptic(6); }
  $('sb').scrollTop = 0; updPl(); renderPlan(); if(view==='coll') renderColl();
  setTimeout(function(){ var p = $('playBtn'); if(p) p.focus({preventScroll:true}); }, 40);
}
function closeSheet(){ if(!sheet.classList.contains('on')) return; sheet.classList.remove('on','drag'); sheet.style.transform=''; scrim.classList.remove('on'); scrim.style.opacity=''; var was = cur; cur = null; updPl(); if(lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true}); }
scrim.addEventListener('click', closeSheet);
$('sb').addEventListener('click', function(e){ var b = e.target.closest('button'); if(!b) return;
  if(b.id==='playBtn'){ haptic(6); actx(); if(pl.id===cur && pl.on) pause(); else play(cur); }
  else if(b.id==='sayBtn'){ speak = !speak; persist(); haptic(5); if(!speak) hush(); else if(pl.on && pl.id===cur) say(BY[cur].tr[cueAt(pl.t)]); openEx(cur); }
  else if(b.dataset.cue != null){ haptic(4); if(pl.id !== cur){ pl = {id:cur, t:0, on:false, cue:-1}; } pl.t = CUES[+b.dataset.cue] + .01; if(!pl.on) play(cur); else updPl(true); }
  else if(b.dataset.go){ haptic(5); tick2(); var n = BY[+b.dataset.go]; if(ROOMS[n.room].f !== floor){ floor = ROOMS[n.room].f; zoomRoom = null; vb = FULL.slice(); } openEx(n.id); }
  else if(b.id==='favBtn'){ var i = favs.indexOf(cur); if(i>=0){ favs.splice(i,1); toast('已從收藏移除'); } else { favs.push(cur); toast('收進收藏：'+BY[cur].t); beep(1318,0,.4,.04); } persist(); haptic([6,30,6]); openEx(cur); }
  else if(b.id==='goRoom'){ var ex = BY[cur]; closeSheet(); go('plan'); if(ROOMS[ex.room].f !== floor){ floor = ROOMS[ex.room].f; zoomRoom = null; vb = FULL.slice(); renderPlan(); } zoomTo(ex.room); }
});
// scrub
(function(){ var on = false;
  function at(e){ var s = $('scrub'); if(!s) return 0; var r = s.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left)/r.width)); }
  $('sb').addEventListener('pointerdown', function(e){ if(!e.target.closest('#scrub')) return; on = true; if(pl.id !== cur) pl = {id:cur, t:0, on:false, cue:-1}; try{ e.target.closest('#scrub').setPointerCapture(e.pointerId); }catch(_){} pl.t = at(e)*T; hush(); var was = pl.on; pl.on = false; pl.resume = was; updPl(); haptic(3); e.stopPropagation(); });
  $('sb').addEventListener('pointermove', function(e){ if(!on) return; var c0 = cueAt(pl.t); pl.t = at(e)*T; if(cueAt(pl.t) !== c0){ haptic(3); tick2(); } updPl(); });
  function end(){ if(!on) return; on = false; if(pl.resume) play(cur); else updPl(); }
  $('sb').addEventListener('pointerup', end); $('sb').addEventListener('pointercancel', end);
  $('sb').addEventListener('keydown', function(e){ if(!e.target.closest('#scrub')) return; if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); if(pl.id !== cur) pl = {id:cur, t:0, on:false, cue:-1}; pl.t = Math.max(0, Math.min(T, pl.t + (e.key==='ArrowRight'?5:-5))); updPl(true); } });
})();
// drag to dismiss (from the wall panel, or anywhere when scrolled to top)
(function(){ var sy=0, dy=0, t0=0, on=false;
  sheet.addEventListener('pointerdown', function(e){ if(e.target.closest('button,#scrub')) return; if($('sb').scrollTop > 0) return; on=true; sy=e.clientY; dy=0; t0=e.timeStamp; });
  sheet.addEventListener('pointermove', function(e){ if(!on) return; dy = e.clientY-sy; if(dy > 6 && !sheet.classList.contains('drag')){ sheet.classList.add('drag'); try{ sheet.setPointerCapture(e.pointerId); }catch(_){} } if(sheet.classList.contains('drag')){ sheet.style.transform = 'translateY('+Math.max(dy/6, dy).toFixed(1)+'px)'; scrim.style.opacity = Math.max(0,1-dy/sheet.offsetHeight).toFixed(2); } });
  function end(e){ if(!on) return; on=false; if(!sheet.classList.contains('drag')) return; sheet.classList.remove('drag'); scrim.style.opacity=''; if(dy > sheet.offsetHeight*.35 || dy/Math.max(1,e.timeStamp-t0) > .6) closeSheet(); else sheet.style.transform=''; }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end); })();

/* ---------- collection ---------- */
function renderColl(){ var c = $('coll');
  if(!favs.length){ c.innerHTML = '<p class="collempty">還沒有收藏。<br>在展品標籤下方點「收進收藏」，它會像明信片一樣收在這裡。</p>'; return; }
  c.innerHTML = '<p class="collhead">'+favs.length+' 張明信片 · 點開重讀標籤</p>' + favs.slice().reverse().map(function(id, i, all){ var e = BY[id], r = ROOMS[e.room], wide = i===0 || (i===all.length-1 && all.length%2===0); return '<button class="card'+(i===0?' first':'')+(wide?' wide':'')+'" data-id="'+id+'" aria-label="'+e.t+'"><span class="fr"><span class="art" style="background:'+r.c+'">'+obj(id, r.t, 'o2')+'</span></span><span class="cap"><b>'+e.t+'</b><span>'+e.yr+' · '+r.f+'F 展間 '+e.room+'</span></span></button>'; }).join(''); }
$('strip').addEventListener('click', function(e){ var b = e.target.closest('.tile'); if(b){ haptic(5); openEx(+b.dataset.id); } });
$('coll').addEventListener('click', function(e){ var b = e.target.closest('.card'); if(b){ haptic(5); openEx(+b.dataset.id); } });

/* ---------- views ---------- */
var view = 'plan';
function go(v){ if(v===view) return; $('v-'+view).hidden = true; var el = $('v-'+v); el.hidden = false; el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); view = v;
  document.querySelectorAll('.tabs [role=tab]').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.v===v); }); if(v==='coll') renderColl(); haptic(5); }
document.querySelectorAll('.tabs [role=tab]').forEach(function(t){ t.addEventListener('click', function(){ go(t.dataset.v); }); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if(sheet.classList.contains('on')) closeSheet(); else zoomOut(); } });

var tT = null; function toast(m){ var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(function(){ t.classList.remove('on'); }, 2200); }
function clock(){ var d = new Date(); $('clock').textContent = d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
clock(); setInterval(clock, 20000);
document.addEventListener('visibilitychange', function(){ if(document.hidden && pl.on){ pause(); } });
renderPlan(); updPl(); persist();
})();
</script>
