<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7fb9e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="航跡">
<title>航跡 · 航班追蹤</title>
<meta name="description" content="六〇年代航空海報風的航班追蹤：拖曳旋轉地球儀看大圓航線與飛機即時位置，延誤動態，登機證翻面、線上報到與選位。收錄於 100 Creative HTML Works（App 074・60 年代航空公司）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/074-panam-flights.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237fb9e2'/%3E%3Ccircle cx='32' cy='34' r='20' fill='%233a86c8'/%3E%3Cpath d='M16 42C24 22 40 18 50 22' fill='none' stroke='%23d7282f' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M44 16l10 6-11 3z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --sky:#7fb9e2;--sky2:#a9d0ec;--ocean:#2f7cc0;--land:#f7f6f1;--red:#d7282f;--navy:#13263f;--navy2:#44576f;--navy3:#6d7f94;--white:#fff;--paper:#f4f7f9;
  --hel:"Helvetica Neue",Helvetica,"PingFang TC","Heiti TC",Arial,sans-serif;
  --out:cubic-bezier(.2,.9,.3,1);--spring:cubic-bezier(.3,1.35,.5,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.45 var(--hel);color:var(--navy);background:var(--sky);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit;background:none;border:0;padding:0}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--red);outline-offset:2px;border-radius:6px}
svg{display:block}
[hidden]{display:none!important}
.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--sky);isolation:isolate}
@media (min-width:521px){
  body{background:#e9eef1}
  .stage{display:flex;align-items:center;justify-content:center;gap:72px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:48px;padding:10px;z-index:1;background:#f2f4f5;
    box-shadow:inset 0 0 0 1px #c9d1d7,inset 0 0 0 4px #fff,2px 10px 16px -10px rgba(19,38,63,.45)}
  .screen{inset:10px;border-radius:38px}
  .caption{display:block;position:relative;z-index:1;width:260px}
  .caption b{display:block;font:700 72px/.95 var(--hel);letter-spacing:-.03em;color:var(--navy)}
  .caption i{display:block;width:170px;height:6px;margin:16px 0 18px;border-radius:3px;background:var(--red)}
  .caption p{font-size:15px;line-height:1.7;color:var(--navy2)}
}
@media (min-width:521px) and (max-width:900px){.caption{display:none}}

.status{position:absolute;top:0;left:0;right:0;z-index:40;height:calc(46px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 32px;display:flex;align-items:center;justify-content:space-between;font:700 15px/1 var(--hel);pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-top:calc(46px + env(safe-area-inset-top));padding-bottom:calc(100px + env(safe-area-inset-bottom));scrollbar-width:none;overscroll-behavior:contain}
.view::-webkit-scrollbar{display:none}
.view.enter{animation:vin .45s var(--out)}
@keyframes vin{from{transform:translateY(18px)}}

.top{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 0 20px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font:700 30px/1 var(--hel);letter-spacing:-.02em}
.brand svg{width:44px;height:20px}
.brand span{display:block;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--navy2);margin-top:3px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;transition:background-color .15s}
.ib:active{background:rgba(19,38,63,.1)}
.ib svg{width:26px;height:26px}

.globeWrap{position:relative;height:360px;margin-top:2px}
#globe{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.zoom{position:absolute;right:14px;bottom:20px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;display:grid;place-items:center;background:var(--white);border-radius:10px;color:var(--navy);transition:background-color .15s}
.zoom button:active{background:#dce9f3}
.zoom svg{width:18px;height:18px}
.utc{position:absolute;left:20px;bottom:20px;font:700 13px var(--hel);color:var(--navy2);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.utc b{display:block;font-size:22px;color:var(--navy);letter-spacing:0}

.panel{position:relative;background:var(--white);border-radius:26px 26px 0 0;padding:16px 16px 20px;min-height:360px}
.phead{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.phead h2{font:700 22px var(--hel);letter-spacing:-.01em}
.phead h2 small{font-size:15px;color:var(--navy3);margin-left:6px}
.filt{display:flex;gap:18px;margin:8px 4px 6px}
.filt button{min-height:40px;font-size:15px;font-weight:700;color:var(--navy3);transition:color .2s}
.filt button[aria-pressed=true]{color:var(--red)}
.fl{position:relative;overflow:hidden;border-radius:16px}
.fl+.fl{margin-top:4px}
.fl .del{position:absolute;right:0;top:0;bottom:0;width:96px;background:var(--red);color:#fff;font-weight:700}
.fl .fr{position:relative;background:var(--white);padding:12px 10px 12px 6px;display:block;width:100%;text-align:left;touch-action:pan-y;transition:transform .35s var(--out),background-color .2s}
.fl.drag .fr{transition:none}
.fl.sel .fr{background:#eef5fb}
.fr .l1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.fr .code{font:700 20px var(--hel);letter-spacing:.01em}
.fr .st{font-size:14px;font-weight:700;color:var(--navy2);white-space:nowrap}
.fr .st.late{color:var(--red)}
.fr .st.air{color:var(--ocean)}
.fr .rt{font-size:14px;color:var(--navy2);margin-top:2px}
.track{position:relative;height:22px;margin-top:8px}
.track svg{width:100%;height:22px;overflow:visible}
.tt{display:flex;justify-content:space-between;font:700 13px var(--hel);color:var(--navy3);font-variant-numeric:tabular-nums}
.more{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;gap:6px}
.more div{font-size:13px;color:var(--navy3)}
.more b{display:block;font:700 17px var(--hel);color:var(--navy)}
.empty{text-align:center;color:var(--navy3);padding:30px 0}

/* passes */
#passView{background:linear-gradient(180deg,#7fb9e2,#a9d0ec)}
.phd{padding:6px 22px 0;display:flex;justify-content:space-between;align-items:flex-end}
.phd h2{font:700 30px/1.05 var(--hel);letter-spacing:-.02em}
.phd span{font:700 15px var(--hel);color:var(--navy2);font-variant-numeric:tabular-nums}
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px 30px 10px;scrollbar-width:none;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.pass{flex:0 0 100%;max-width:330px;height:486px;scroll-snap-align:center;perspective:1200px;cursor:pointer}
.pin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s var(--spring)}
.pass.flip .pin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;overflow:hidden;background:var(--white);
  -webkit-mask:radial-gradient(circle 13px at 0 72%,transparent 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 72%,transparent 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 13px at 0 72%,transparent 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 72%,transparent 97%,#000) right/51% 100% no-repeat}
.back{transform:rotateY(180deg);background:var(--navy);color:#fff}
.band{height:66px;background:var(--ocean);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.band b{font:700 24px var(--hel);letter-spacing:-.01em}
.band span{font-size:11px;font-weight:700;letter-spacing:.16em;text-align:right;line-height:1.35}
.swoosh{display:block;width:100%;height:14px}
.od{display:flex;align-items:center;justify-content:space-between;padding:8px 20px 0}
.od b{display:block;font:700 50px/1 var(--hel);letter-spacing:-.03em}
.od small{display:block;font-size:13px;color:var(--navy2);margin-top:3px}
.od .r{text-align:right}
.od svg{width:54px;height:30px;color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px;padding:16px 20px 0}
.grid div{font-size:12px;color:var(--navy3);font-weight:700;letter-spacing:.04em}
.grid b{display:block;font:700 19px/1.2 var(--hel);color:var(--navy);letter-spacing:0;margin-top:2px}
.grid .big b{font-size:24px;color:var(--red)}
.perf{position:absolute;left:18px;right:18px;top:72%;border-top:2px dashed #c9d6e1}
.stub{position:absolute;left:0;right:0;bottom:0;height:26%;display:flex;align-items:center;gap:14px;padding:12px 20px 14px}
.stub svg.bc{flex:1;height:64px}
.stub .sn{font:700 13px var(--hel);color:var(--navy2);writing-mode:vertical-rl;letter-spacing:.1em}
.stamp{position:absolute;right:18px;top:196px;padding:6px 10px;border:3px solid var(--red);border-radius:8px;color:var(--red);font:700 17px/1.1 var(--hel);letter-spacing:.06em;text-align:center;transform:rotate(-12deg);opacity:.88}
.stamp small{display:block;font-size:10px;letter-spacing:.2em}
.back .bin{padding:22px 20px}
.back h3{font:700 22px var(--hel)}
.back p{font-size:14px;color:#b9c8d8;margin-top:4px;line-height:1.6}
.back .map{margin-top:14px;height:120px;border-radius:12px;background:#1d3656}
.back .map svg{width:100%;height:100%}
.bacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.bact{height:54px;border-radius:12px;background:#fff;color:var(--navy);font-weight:700;font-size:16px;transition:background-color .15s}
.bact:active{background:#dbe7f1}
.bact.red{background:var(--red);color:#fff}
.bact.red:active{background:#b51f25}
.bact:disabled{background:#2b4566;color:#9fb3c9}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kv div{font-size:12px;color:#9fb3c9;font-weight:700;letter-spacing:.04em}
.kv b{display:block;font:700 17px var(--hel);color:#fff;letter-spacing:0;margin-top:2px}
.fliphint{text-align:center;font-size:13px;font-weight:700;color:var(--navy2);margin-top:4px}

/* nav switch */
.sw{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;width:272px;height:58px;margin-left:-136px;display:grid;grid-template-columns:1fr 1fr;background:var(--white);border-radius:10px;
  -webkit-mask:radial-gradient(circle 8px at 50% 0,transparent 96%,#000) top/100% 51% no-repeat,radial-gradient(circle 8px at 50% 100%,transparent 96%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 8px at 50% 0,transparent 96%,#000) top/100% 51% no-repeat,radial-gradient(circle 8px at 50% 100%,transparent 96%,#000) bottom/100% 51% no-repeat;
  box-shadow:0 2px 0 #c5d3de}
.sw::after{content:"";position:absolute;left:50%;top:14px;bottom:14px;border-left:2px dashed #c9d6e1}
.sw button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;color:var(--navy3);transition:color .2s}
.sw button svg{width:22px;height:22px}
.sw button[aria-selected=true]{color:var(--red)}
.homeind{position:absolute;left:50%;bottom:calc(6px + env(safe-area-inset-bottom)*.3);width:132px;height:5px;margin-left:-66px;border-radius:3px;background:rgba(19,38,63,.55);z-index:45;pointer-events:none}

/* sheet */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(19,38,63,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:88%;display:flex;flex-direction:column;background:var(--white);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .5s var(--spring)}
.sheet.on{transform:none}.sheet.drag{transition:none}
.shead{flex:none;padding:10px 20px 6px;touch-action:none;cursor:grab}
.grab{width:40px;height:5px;border-radius:3px;background:#cfd9e2;margin:0 auto 12px}
.shead h3{font:700 24px var(--hel);letter-spacing:-.01em}
.shead p{font-size:14px;color:var(--navy3)}
.sbody{flex:1;overflow-y:auto;padding:4px 20px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:12px;background:#edf3f7;margin-top:8px}
.search svg{width:20px;height:20px;color:var(--navy3);flex:none}
.search input{flex:1;min-width:0;height:100%;outline:none;font-size:16px}
.cat{display:flex;align-items:center;gap:10px;min-height:64px}
.cat+.cat{box-shadow:inset 0 1px 0 #e6edf2}
.cat .i{flex:1;min-width:0}
.cat b{font:700 17px var(--hel)}
.cat small{display:block;font-size:13px;color:var(--navy3)}
.addb{height:40px;min-width:64px;padding:0 12px;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:14px}
.addb:disabled{background:#e6edf2;color:var(--navy3)}
.seats{display:grid;grid-template-columns:22px repeat(3,1fr) 10px repeat(4,1fr) 10px repeat(3,1fr);gap:5px;align-items:center;margin-top:10px}
.seats span{font:700 12px var(--hel);color:var(--navy3);text-align:center}
.seat{height:30px;border-radius:6px 6px 3px 3px;background:#dde8f1;transition:background-color .15s}
.seat.taken{background:#9fb0c0;cursor:not-allowed}
.seat[aria-pressed=true]{background:var(--red)}
.seatsel{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.seatsel b{font:700 28px var(--hel)}
.go{height:54px;padding:0 26px;border-radius:12px;background:var(--red);color:#fff;font-weight:700;font-size:17px}
.go:active{background:#b51f25}
.toast{position:absolute;left:50%;top:calc(52px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-180%);visibility:hidden;padding:11px 18px;border-radius:10px;background:var(--navy);color:#fff;font-size:14px;font-weight:700;white-space:nowrap;transition:transform .45s var(--spring),visibility 0s .45s}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .45s var(--spring)}
@media (prefers-reduced-motion:reduce){.view.enter{animation:none}.pin,.sheet,.toast,.fl .fr{transition-duration:.01s}}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true">
    <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
      <rect width="1600" height="1000" fill="#7fb9e2"/>
      <rect y="620" width="1600" height="380" fill="#a9d0ec"/>
      <path d="M-40 760C300 520 700 470 1000 520S1500 640 1660 560" fill="none" stroke="#d7282f" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 16"/>
      <g fill="#fff"><path d="M120 180h220a40 40 0 0 0-70-30 55 55 0 0 0-100 5 30 30 0 0 0-50 25z"/><path d="M1240 300h260a44 44 0 0 0-78-34 62 62 0 0 0-112 6 34 34 0 0 0-70 28z"/><path d="M980 120h150a30 30 0 0 0-52-22 40 40 0 0 0-72 4 22 22 0 0 0-26 18z"/></g>
      <g transform="translate(1270 640) rotate(-14)"><path d="M0 0l120-6 30-14h14l-16 20 40 2 12-10h10l-6 14 6 14h-10l-12-10-40 2 16 20h-14l-30-14-120-6z" fill="#fff"/><path d="M150 0h40" stroke="#d7282f" stroke-width="3"/></g>
      <text x="1560" y="960" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial" font-weight="700" font-size="180" fill="#fff" opacity=".35" letter-spacing="-6">JET AGE</text>
    </svg>
  </div>
  <div class="caption"><b>航跡</b><i></i><p>六〇年代航空海報風的航班追蹤。轉動地球儀看每一班飛機在大圓航線上的位置，登機證翻過來就能報到選位。</p></div>
  <div class="device">
    <div class="screen" id="screen">
      <div class="status" aria-hidden="true"><span id="clock">00:00</span>
        <span class="g">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect y="8" width="3" height="4" rx=".6"/><rect x="5" y="5.5" width="3" height="6.5" rx=".6"/><rect x="10" y="3" width="3" height="9" rx=".6"/><rect x="15" width="3" height="12" rx=".6"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 12 1 5a10 10 0 0 1 14 0z"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".75" y=".75" width="21.5" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="3" width="14" height="6" fill="#d7282f"/><rect x="23.5" y="4" width="2" height="4" fill="currentColor"/></svg>
        </span>
      </div>

      <section class="view" id="mapView" aria-label="航線地球">
        <div class="top">
          <div class="brand"><svg viewBox="0 0 44 20" aria-hidden="true"><path d="M2 16C12 6 26 3 40 6" fill="none" stroke="#d7282f" stroke-width="3.5" stroke-linecap="round"/><path d="M34 1l9 5-10 3z" fill="#13263f"/></svg><div><b>航跡</b><span>FLIGHT TRACKS</span></div></div>
          <button class="ib" id="addBtn" aria-label="追蹤航班"><svg viewBox="0 0 26 26" fill="#13263f"><path d="M11 3h4v8h8v4h-8v8h-4v-8H3v-4h8z"/><path d="M17 23l6-6v6z" fill="#d7282f"/></svg></button>
        </div>
        <div class="globeWrap">
          <canvas id="globe" aria-label="地球儀：拖曳旋轉，點飛機查看航班"></canvas>
          <div class="utc"><span>台北時間</span><b id="tpe">00:00</b></div>
          <div class="zoom"><button id="zin" aria-label="放大"><svg viewBox="0 0 18 18" fill="currentColor"><path d="M7.5 2h3v5.5H16v3h-5.5V16h-3v-5.5H2v-3h5.5z"/></svg></button><button id="zout" aria-label="縮小"><svg viewBox="0 0 18 18" fill="currentColor"><path d="M2 7.5h14v3H2z"/></svg></button></div>
        </div>
        <div class="panel">
          <div class="phead"><h2>追蹤中<small id="cnt">0 班</small></h2><button class="ib" id="refresh" aria-label="更新動態"><svg viewBox="0 0 26 26" fill="#13263f"><path d="M13 4a9 9 0 0 1 8.5 6h-3.4A6 6 0 0 0 7 13H4a9 9 0 0 1 9-9z"/><path d="M22 3v8h-8z" fill="#d7282f"/><path d="M13 22a9 9 0 0 1-8.5-6h3.4A6 6 0 0 0 19 13h3a9 9 0 0 1-9 9z"/></svg></button></div>
          <div class="filt" id="filt"><button data-f="all" aria-pressed="true">全部</button><button data-f="air" aria-pressed="false">飛行中</button><button data-f="late" aria-pressed="false">延誤</button><button data-f="done" aria-pressed="false">已抵達</button></div>
          <div id="list"></div>
        </div>
      </section>

      <section class="view" id="passView" aria-label="登機證" hidden>
        <div class="phd"><h2>登機證</h2><span id="pcount">1 / 3</span></div>
        <div class="car" id="car"></div>
        <p class="fliphint">點一下翻面，左右滑換下一張</p>
      </section>

$('list').addEventListener('pointermove',function(e){if(!row)return;var mx=e.clientX-sx,my=e.clientY-sy;if(!lock){if(Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)){lock=1;row.classList.add('drag');try{row.setPointerCapture(e.pointerId)}catch(_){}}else if(Math.abs(my)>8){row=null;return}else return}dx=Math.min(0,Math.max(-150,base+mx));row.querySelector('.fr').style.transform='translateX('+dx+'px)'});
function up(){if(!row)return;var r=row;row=null;if(!lock)return;r.classList.remove('drag');var fr=r.querySelector('.fr');if(dx<-130){fr.style.transform='translateX(-100%)';var c=r.dataset.c;setTimeout(function(){untrack(c)},200)}else if(dx<-48){fr.style.transform='translateX(-96px)';r.classList.add('open');haptic(5)}else{fr.style.transform='';r.classList.remove('open')}swiped=true;setTimeout(function(){swiped=false},60)}
$('list').addEventListener('pointerup',up);$('list').addEventListener('pointercancel',up)})();
$('refresh').addEventListener('click',function(){var n=0;tracked.forEach(function(c){var f=F(c);if(prog(f)<0){var r=Math.random();delays[c]=r<.35?[10,15,25,40,55][Math.floor(Math.random()*5)]:0;n++}});save('delays',delays);renderList();draw();haptic(6);toast(n?'已更新 '+n+' 班未起飛航班的動態':'追蹤的航班都已起飛')});

/* ---------- sheet ---------- */
var sheet=$('sheet'),scrim=$('scrim'),lastFocus=null;
function openSheet(head,body,bind){lastFocus=document.activeElement;$('sheadIn').innerHTML=head;$('sbody').innerHTML=body;$('sbody').scrollTop=0;sheet.style.transform='';sheet.classList.add('on');scrim.classList.add('on');haptic(6);if(bind)bind(sheet)}
function closeSheet(){if(!sheet.classList.contains('on'))return;sheet.classList.remove('on','drag');sheet.style.transform='';scrim.classList.remove('on');if(document.activeElement&&sheet.contains(document.activeElement))document.activeElement.blur();if(lastFocus&&lastFocus.focus&&document.contains(lastFocus))lastFocus.focus({preventScroll:true})}
scrim.addEventListener('click',closeSheet);
(function(){var sy=0,dy=0,t0=0,on=false,h=$('shead');
h.addEventListener('pointerdown',function(e){on=true;sy=e.clientY;dy=0;t0=e.timeStamp;sheet.classList.add('drag');try{h.setPointerCapture(e.pointerId)}catch(_){}});
h.addEventListener('pointermove',function(e){if(!on)return;dy=e.clientY-sy;sheet.style.transform='translateY('+(dy>0?dy:dy/6).toFixed(1)+'px)';scrim.style.opacity=Math.max(0,1-dy/sheet.offsetHeight).toFixed(2)});
function end(e){if(!on)return;on=false;sheet.classList.remove('drag');scrim.style.opacity='';var v=dy/Math.max(1,e.timeStamp-t0);if(dy>sheet.offsetHeight*.35||(v>.6&&dy>30))closeSheet();else sheet.style.transform=''}
h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end)})();
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

var q='';
function catBody(){var list=CAT.filter(function(f){var s=(f.c+f.f+f.t+AP[f.f][2]+AP[f.t][2]+f.r).toLowerCase().replace(/ /g,'');return !q||s.indexOf(q.toLowerCase().replace(/ /g,''))>=0});
  return list.length?list.map(function(f){var on=tracked.indexOf(f.c)>=0,st=status(f);return '<div class="cat"><div class="i"><b>'+f.c+'</b>　'+f.f+' → '+f.t+'<small>'+AP[f.t][2]+'　'+st.tx+'</small></div><button class="addb" data-add="'+f.c+'" '+(on?'disabled':'')+'>'+(on?'追蹤中':'追蹤')+'</button></div>'}).join(''):'<p class="empty">找不到「'+q+'」</p>'}
$('addBtn').addEventListener('click',function(){q='';openSheet('<h3>追蹤航班</h3><p>輸入航班號碼、機場代碼或城市</p><label class="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg><input id="qIn" type="search" placeholder="例如 CI 100、東京、SIN" aria-label="搜尋航班"></label>',catBody())});
sheet.addEventListener('input',function(e){if(e.target.id==='qIn'){q=e.target.value.trim();$('sbody').innerHTML=catBody()}});
sheet.addEventListener('click',function(e){var a=e.target.closest('[data-add]');if(a&&!a.disabled){tracked.unshift(a.dataset.add);save('tracked',tracked);a.disabled=true;a.textContent='追蹤中';renderList();haptic([6,30,6]);toast('開始追蹤 '+a.dataset.add);sel=a.dataset.add;save('sel',sel);var f=F(sel),ll=gc(AP[f.f],AP[f.t],Math.max(0,Math.min(1,prog(f))));flyTo(ll[0],ll[1])}
  var s=e.target.closest('.seat');if(s&&!s.classList.contains('taken')){sheet.querySelectorAll('.seat[aria-pressed=true]').forEach(function(x){x.setAttribute('aria-pressed','false')});s.setAttribute('aria-pressed','true');$('seatNow').textContent=s.dataset.s;haptic(4)}
  if(e.target.closest('#seatOk')){var ps=passes[curPass],ns=$('seatNow').textContent;ps.seat=ns;save('passes',passes);renderPasses(curPass);closeSheet();haptic([6,30,6]);toast('座位改為 '+ns)}});

/* ---------- boarding passes ---------- */
var passes=load('passes',[{c:'BR 132',f:'TPE',t:'KIX',date:'9/26',wd:'五',time:'07:25',board:'06:45',gate:'B6',seat:'32K',cls:'經濟艙',grp:'4',ck:false,bag:'23 公斤 × 1'},
 {c:'JX 12',f:'TPE',t:'LAX',date:'10/03',wd:'五',time:'23:40',board:'22:55',gate:'A9',seat:'5A',cls:'商務艙',grp:'1',ck:true,bag:'32 公斤 × 2'},
 {c:'IT 230',f:'KHH',t:'OKA',date:'10/18',wd:'六',time:'13:10',board:'12:30',gate:'12',seat:'21C',cls:'經濟艙',grp:'3',ck:false,bag:'20 公斤 × 1'}]);
var curPass=0;
function barcode(seed){var s='',x=0,r=seed;for(var i=0;i<70&&x<230;i++){r=(r*16807)%2147483647;var w=1+(r%3);if(i%2===0)s+='<rect x="'+x+'" y="0" width="'+w+'" height="64" fill="#13263f"/>';x+=w+(r>>3)%2+1}return '<svg class="bc" viewBox="0 0 '+x+' 64" preserveAspectRatio="none" aria-hidden="true">'+s+'</svg>'}
function miniMap(p){var a=AP[p.f],b=AP[p.t],pts=[],minx=180,maxx=-180,miny=90,maxy=-90;for(var i=0;i<=40;i++){var ll=gc(a,b,i/40);pts.push(ll);minx=Math.min(minx,ll[0]);maxx=Math.max(maxx,ll[0]);miny=Math.min(miny,ll[1]);maxy=Math.max(maxy,ll[1])}
  var pad2=Math.max(6,(maxx-minx)*.2),w=maxx-minx+pad2*2,h=Math.max(maxy-miny+pad2*2,w*.4),x0=minx-pad2,y0=(miny+maxy)/2+h/2,sx=290/w,sy=120/h,sc=Math.min(sx,sy);
  var tr=function(ll){return[(ll[0]-x0)*sx,(y0-ll[1])*sy]},land='';
  LAND.forEach(function(poly){var d='';for(var i=0;i<poly.length;i+=2){var q=tr([poly[i],poly[i+1]]);d+=(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)}land+='<path d="'+d+'Z" fill="#2c4a70"/>'});
  var path=pts.map(function(ll,i){var q=tr(ll);return(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)}).join(''),A=tr(a),B=tr(b);
  return '<svg viewBox="0 0 290 120" preserveAspectRatio="xMidYMid slice">'+land+'<path d="'+path+'" fill="none" stroke="#d7282f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 5"/><circle cx="'+A[0].toFixed(1)+'" cy="'+A[1].toFixed(1)+'" r="4" fill="#fff"/><circle cx="'+B[0].toFixed(1)+'" cy="'+B[1].toFixed(1)+'" r="4" fill="#d7282f"/></svg>'}
function passHtml(p,i){var km=distKm(AP[p.f],AP[p.t]);
  return '<div class="pass" data-i="'+i+'" role="button" tabindex="0" aria-label="'+p.c+' 登機證，點一下翻面"><div class="pin">'+
  '<div class="face front"><div class="band"><b>航跡</b><span>登機證<br>BOARDING PASS</span></div><svg class="swoosh" viewBox="0 0 330 14" preserveAspectRatio="none"><path d="M0 3C110 12 220 12 330 2V0H0z" fill="#d7282f"/></svg>'+
  '<div class="od"><div><b>'+p.f+'</b><small>'+AP[p.f][2]+'</small></div><svg viewBox="0 0 54 30" fill="currentColor"><path d="M2 22c14-10 30-14 44-12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 5"/><path d="M53 10l-9-5-2 2 4 4-5 2-4-2-2 1 3 3-2 3 2 1 4-3 5 1-2 5 2 1 5-7z"/></svg><div class="r"><b>'+p.t+'</b><small>'+AP[p.t][2]+'</small></div></div>'+
  '<div class="grid"><div>航班<b>'+p.c+'</b></div><div>日期<b>'+p.date+'（'+p.wd+'）</b></div><div>起飛<b>'+p.time+'</b></div><div class="big">登機<b>'+p.board+'</b></div><div class="big">登機門<b>'+p.gate+'</b></div><div class="big">座位<b>'+p.seat+'</b></div><div>旅客<b>林宜蓁</b></div><div>艙等<b>'+p.cls+'</b></div><div>組別<b>'+p.grp+'</b></div></div>'+
  (p.ck?'<div class="stamp">已報到<small>CHECKED IN</small></div>':'')+
  '<div class="perf"></div><div class="stub">'+barcode(i*7919+p.seat.charCodeAt(0)*31+3)+'<span class="sn">LIN/YICHEN</span></div></div>'+
  '<div class="face back"><div class="bin"><h3>'+AP[p.f][2]+' 飛往 '+AP[p.t][2]+'</h3><p>大圓航線 '+km.toLocaleString()+' 公里，托運行李 '+p.bag+'。登機門於起飛前 20 分鐘關閉。</p><div class="map">'+miniMap(p)+'</div>'+
  '<div class="kv"><div>報到狀態<b>'+(p.ck?'已完成報到':'尚未報到')+'</b></div><div>座位<b>'+p.seat+'　'+(/[AK]$/.test(p.seat)?'靠窗':/[CDGH]$/.test(p.seat)?'靠走道':'中間')+'</b></div></div>'+
  '<div class="bacts"><button class="bact" data-seat="'+i+'">選位</button><button class="bact red" data-ck="'+i+'" '+(p.ck?'disabled':'')+'>'+(p.ck?'已報到':'線上報到')+'</button></div></div></div></div></div>'}
function renderPasses(keep){var car=$('car');car.innerHTML=passes.map(passHtml).join('');if(keep!=null){var el=car.children[keep];if(el){car.scrollLeft=el.offsetLeft-car.offsetLeft-30;if(keep===curPass&&flipped[keep])el.classList.add('flip')}}updCount()}
var flipped={};
function updCount(){var car=$('car'),w=car.children[0]?car.children[0].offsetWidth+14:1;curPass=Math.max(0,Math.min(passes.length-1,Math.round(car.scrollLeft/w)));$('pcount').textContent=(curPass+1)+' / '+passes.length}
$('car').addEventListener('scroll',updCount,{passive:true});
$('car').addEventListener('click',function(e){var s=e.target.closest('[data-seat]');if(s){e.stopPropagation();curPass=+s.dataset.seat;openSeats();return}
  var c=e.target.closest('[data-ck]');if(c){e.stopPropagation();var i=+c.dataset.ck;passes[i].ck=true;save('passes',passes);flipped[i]=false;renderPasses(i);haptic([10,40,10,40,20]);toast(passes[i].c+' 報到完成');return}
  var p=e.target.closest('.pass');if(p){var i2=+p.dataset.i;p.classList.toggle('flip');flipped[i2]=p.classList.contains('flip');haptic(6)}});
$('car').addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('pass')){e.preventDefault();e.target.click()}});
function openSeats(){var p=passes[curPass],cols=['A','B','C','','D','E','F','G','','H','J','K'],r=(curPass*97+13),html='<div class="seats"><span></span>'+cols.map(function(c){return '<span>'+c+'</span>'}).join('');
  var r0=p.cls==='商務艙'?1:20;for(var row=r0;row<r0+12;row++){html+='<span>'+row+'</span>';cols.forEach(function(c){if(!c){html+='<span></span>';return}r=(r*16807)%2147483647;var id=row+c,taken=id!==p.seat&&r%10<4;html+='<button class="seat'+(taken?' taken':'')+'" data-s="'+id+'" aria-pressed="'+(id===p.seat)+'" aria-label="座位 '+id+(taken?' 已被選':'')+'" '+(taken?'aria-disabled="true"':'')+'></button>'})}
  html+='</div><div class="seatsel"><div><span style="font-size:13px;color:#6d7f94;font-weight:700">已選座位</span><br><b id="seatNow">'+p.seat+'</b></div><button class="go" id="seatOk">確認座位</button></div>';
  openSheet('<h3>'+p.c+' 選位</h3><p>'+p.f+' → '+p.t+'　'+p.cls+'　紅色是你的位置</p>',html)}

/* ---------- views ---------- */
var curView='map';
function show(v){if(v===curView)return;curView=v;$('mapView').hidden=v!=='map';$('passView').hidden=v!=='pass';var el=v==='map'?$('mapView'):$('passView');el.classList.remove('enter');void el.offsetWidth;el.classList.add('enter');
  document.querySelectorAll('.sw button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.v===v)});haptic(5);save('view',v);if(v==='pass'){renderPasses(curPass)}else{size()}}
document.querySelectorAll('.sw button').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.v)})});

setInterval(function(){tick();if(document.hidden)return;if(curView==='map'){draw();renderList()}},30000);
setInterval(function(){if(!document.hidden&&curView==='map'&&!raf)draw()},4000);
window.addEventListener('resize',function(){size()});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&curView==='map')draw()});
if(sel&&F(sel)){var f0=F(sel),l0=gc(AP[f0.f],AP[f0.t],Math.max(0,Math.min(1,prog(f0))));view.lon=l0[0];view.lat=Math.max(-50,Math.min(50,l0[1]))}
renderList();size();
if(load('view','map')==='pass')show('pass');
})();
</script>
