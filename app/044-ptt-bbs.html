<style>
:root{
  --bg:#0000aa;
  --deep:#00007a;
  --w:#ffffff;
  --g:#aaaaaa;
  --y:#ffff55;
  --yl:#ffffaa;
  --c:#55ffff;
  --cy:#00aaaa;
  --r:#ff5555;
  --gr:#55ff55;
  --m:#ff55ff;
  --k:#000000;
  --f:Menlo,"Heiti TC","PingFang TC",monospace;
  --rowh:58px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.4 var(--f);color:var(--g);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation;text-align:left}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px dashed var(--y);outline-offset:-2px}
input,textarea{font:inherit;color:inherit}
svg{display:block}
.w{color:var(--w)}.y{color:var(--y)}.c{color:var(--c)}.r{color:var(--r)}.gr{color:var(--gr)}.m{color:var(--m)}.g{color:var(--g)}
b{font-weight:700}

/* ---------- stage ---------- */
.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--bg);isolation:isolate}
@media (min-width:521px){
  body{background:var(--bg)}
  .stage{display:flex;align-items:center;justify-content:center;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--bg)}
  .backdrop .logo{position:absolute;top:50%;right:calc(50% + 250px);transform:translateY(-58%);font:22px/1 var(--f);white-space:pre;letter-spacing:0}
  .backdrop .login{position:absolute;top:50%;left:calc(50% + 250px);transform:translateY(-50%);font:17px/2 var(--f);white-space:pre;color:var(--g)}
  .backdrop .hdl{position:absolute;left:0;right:0;top:0;height:34px;background:var(--g);color:var(--k);font:700 15px/34px var(--f);padding:0 20px;white-space:nowrap;overflow:hidden}
  .backdrop .ftl{position:absolute;left:0;right:0;bottom:0;height:30px;background:var(--cy);color:var(--k);font:14px/30px var(--f);padding:0 20px;white-space:nowrap;overflow:hidden}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:44px;padding:13px;background:#bdbab0;z-index:1;

  .screen{inset:13px;border-radius:32px;box-shadow:0 0 0 3px #2a2a2a}
  .caption{display:block;position:fixed;left:40px;bottom:54px;z-index:1;max-width:300px;background:var(--bg);color:var(--w);padding:12px 14px;font-size:14px;line-height:1.5}
  .caption h1{font:700 18px/1.2 var(--f);color:var(--y)}
}
@media (min-width:521px) and (max-width:960px){.caption{display:none}}
@media (min-width:521px) and (max-width:1180px){.backdrop .logo,.backdrop .login{display:none}}

/* ---------- status ---------- */
.status{position:absolute;top:0;left:0;right:0;z-index:30;height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 24px 0 28px;
  display:flex;align-items:center;justify-content:space-between;font:700 15px/1 var(--f);color:var(--w);pointer-events:none;background:var(--bg)}
.status .gl{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}

/* ---------- screens ---------- */
.scr{position:absolute;left:0;right:0;top:calc(44px + env(safe-area-inset-top));bottom:0;display:flex;flex-direction:column;background:var(--bg)}
@media (display-mode:standalone){.scr{top:env(safe-area-inset-top)}}
.scr[hidden]{display:none}
.scr.in{animation:redraw .18s steps(3,jump-none)}
@keyframes redraw{from{transform:translateY(10px)}to{transform:none}}
.hd{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;height:40px;padding:0 12px;background:var(--g);color:var(--k);font-weight:700;white-space:nowrap;overflow:hidden}
.hd .t{overflow:hidden;text-overflow:ellipsis}
.hd .bl{color:var(--bg)}
.sub{flex:none;display:flex;align-items:center;gap:0;height:44px;padding:0 6px;color:var(--g);font-size:13px;white-space:nowrap}
.sub button{height:44px;padding:0 10px;font-size:14px;color:var(--g)}
.sub button[aria-pressed=true]{color:var(--y);font-weight:700}
.sub button[aria-pressed=true]::before{content:"[";color:var(--w)}
.sub button[aria-pressed=true]::after{content:"]";color:var(--w)}
.sub .sp{flex:1}
.sub .clr{color:var(--c)}
.list{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.bar{position:absolute;left:0;right:0;top:0;height:var(--rowh);background:var(--cy);pointer-events:none;transition:transform .12s steps(2,jump-end)}
.row{position:relative;z-index:1;display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:4px;width:100%;height:var(--rowh);padding:0 12px 0 6px}
.row .cur{color:var(--y);font-weight:700;visibility:hidden}
.row.on .cur{visibility:visible;color:var(--k)}
.row.on,.row.on *{color:var(--k)!important}
.row .l1{display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
.row .l2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;margin-top:2px}
.row .main{min-width:0}
.row .nm{color:var(--w);font-weight:700}
.row .cl{font-size:13px}
.row .pop{font-weight:700;text-align:right;min-width:40px}
.row .tt{overflow:hidden;text-overflow:ellipsis;color:var(--w)}
.row .tt.re{color:var(--g)}
.row .meta{font-size:13px}
.row .pc{font-weight:700;min-width:26px;text-align:right;align-self:start;margin-top:10px}
.art .row{grid-template-columns:22px 28px 1fr}
.pin .row .tt{color:var(--y)}
.empty{padding:26px 16px;color:var(--w);line-height:1.6}

.foot{flex:none;padding-bottom:env(safe-area-inset-bottom)}
.line{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:var(--cy);color:var(--k);font-size:13px;white-space:nowrap;overflow:hidden}
.line b{color:var(--bg)}
.keys{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:64px;padding-bottom:18px;background:var(--g)}
.key{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--k);font-size:13px;line-height:1.1;height:46px}
.key kbd{font:700 15px/1 var(--f);color:var(--bg)}
.key:active{background:var(--k);color:var(--g)}
.key:active kbd{color:var(--y)}
.key[disabled]{opacity:.45}

/* article */
.read{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y;padding-bottom:14px}
.read::-webkit-scrollbar{display:none}
.ah{display:grid;grid-template-columns:auto 1fr;row-gap:2px;padding:0 0 10px;color:var(--w)}
.ah .k{background:var(--g);color:var(--bg);padding:3px 8px;font-weight:700}
.ah .v{padding:3px 10px;background:var(--deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rule{height:2px;background:var(--g);opacity:.55;margin:0 0 12px}
.body{padding:0 14px;color:var(--w);white-space:pre-wrap;word-break:break-word;line-height:1.65}
.sig{padding:12px 14px 6px;color:var(--gr);font-size:13px;white-space:pre-wrap;word-break:break-all;line-height:1.55}
.cm{display:grid;grid-template-columns:22px 1fr;gap:0 4px;padding:3px 14px;font-size:14px;line-height:1.5}
.cm .tg{font-weight:700}
.cm .tg.p{color:var(--w)}
.cm .tg.b,.cm .tg.a{color:var(--r)}
.cm .id{color:var(--y);font-weight:700}
.cm .tx{color:var(--yl)}
.cm .tm{color:var(--g);font-size:12px;margin-left:6px;white-space:nowrap}
.cm.me{background:var(--deep)}
.flash{animation:flash .5s steps(2,jump-none) 2}
@keyframes flash{50%{background:var(--cy)}}

/* editor */
.ed{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;color:var(--w)}
.ed .cats{display:flex;flex-wrap:wrap;gap:0 2px}
.ed .cats button{height:44px;padding:0 8px;color:var(--g)}
.ed .cats button[aria-pressed=true]{background:var(--g);color:var(--k)}
.fld{display:flex;align-items:center;gap:8px;min-height:44px}
.fld span{color:var(--y);flex:none}
.fld input{flex:1;min-width:0;height:40px;border:0;background:var(--deep);color:var(--w);padding:0 8px;outline:none;border-radius:0}
.ed textarea{flex:1;min-height:200px;border:0;background:var(--deep);color:var(--w);padding:8px;outline:none;resize:none;line-height:1.6;border-radius:0}
.ed .note{font-size:13px;color:var(--g)}
.caret{display:inline-block;width:.6em;height:1.05em;vertical-align:-2px;background:var(--w);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* sheet (terminal prompt) */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(0,0,40,.5);opacity:0;pointer-events:none;transition:opacity .2s steps(2)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:var(--k);color:var(--w);border-top:3px solid var(--cy);padding:0 14px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .3s cubic-bezier(.3,1.25,.5,1);touch-action:none}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.grab{height:28px;display:grid;place-items:center;cursor:grab}
.grab i{width:44px;height:6px;background:var(--cy)}
.sheet h3{font-size:15px;color:var(--c);font-weight:700;margin-bottom:6px}
.opts{display:grid;gap:0}
.opts button{height:44px;padding:0 8px;color:var(--g)}
.opts button[aria-pressed=true]{background:var(--cy);color:var(--k)}
.prompt{display:flex;align-items:center;gap:6px;margin-top:10px;min-height:44px;border-bottom:2px solid var(--g)}
.prompt label{flex:none;white-space:nowrap}
.prompt input{flex:1;min-width:0;height:44px;border:0;background:none;outline:none;color:var(--yl)}
.srow{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.srow .hint{font-size:13px;color:var(--g)}
.srow .hint.bad{color:var(--r)}
.ok{height:46px;padding:0 18px;background:var(--g);color:var(--k);font-weight:700}
.ok:active{background:var(--w)}

.toast{position:absolute;left:0;right:0;top:calc(84px + env(safe-area-inset-top));z-index:60;background:var(--k);color:var(--y);padding:10px 14px;font-size:14px;border-bottom:2px solid var(--y);display:none}
.toast.on{display:block}
.home-ind{position:absolute;left:50%;bottom:calc(5px + env(safe-area-inset-bottom) * .3);width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--k);z-index:70;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .scr.in,.flash{animation:none}
  .bar,.sheet{transition-duration:.01s}
  .caret{animation:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><div class="hdl">【 批踢踢實業坊 】　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　telnet ptt.cc</div><div class="logo" id="ansi"></div><div class="login" id="login"></div><div class="ftl" id="ftl"></div></div>
  <div class="caption"><h1>批踢踢 BBS</h1>藍底白字、游標一格一格跳，推一下再走。</div>

  <div class="device">
    <div class="screen" id="screen">
      <div class="status" aria-hidden="true">
        <span id="clock">09:41</span>
        <span class="gl">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect y="9" width="3" height="3"/><rect x="5" y="6" width="3" height="6"/><rect x="10" y="3" width="3" height="9"/><rect x="15" width="3" height="12" fill="#5555ff"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><rect x="6" y="9" width="4" height="3"/><rect x="3" y="5" width="10" height="2"/><rect x="0" y="1" width="16" height="2"/></svg>
          <svg width="27" height="12" viewBox="0 0 27 12"><rect x="1" y="1" width="22" height="10" fill="none" stroke="#fff" stroke-width="2"/><rect id="batt" x="3" y="3" width="14" height="6" fill="#55ff55"/><rect x="24" y="4" width="3" height="4" fill="#fff"/></svg>
        </span>
      </div>

      <!-- BOARDS -->
      <section class="scr" id="sBoards" aria-label="看板列表">
        <div class="hd"><span class="t">【看板列表】</span><span class="bl">批踢踢實業坊</span></div>
        <div class="sub">
          <button id="mHot" aria-pressed="true">熱門看板</button>
          <button id="mFav" aria-pressed="false">我的最愛</button>
          <span class="sp"></span><span id="bCount" style="padding-right:8px">14 板</span>
        </div>
        <div class="list" id="bList" role="listbox" aria-label="看板"></div>
        <div class="foot">
          <div class="line"><span id="lineB">《09/23 週三 14:05》</span><span>線上 <b id="online">132,451</b> 人</span></div>
          <div class="keys">
            <button class="key" data-k="up" aria-label="游標上移"><kbd>↑</kbd>上</button>
            <button class="key" data-k="down" aria-label="游標下移"><kbd>↓</kbd>下</button>
            <button class="key" data-k="enter" aria-label="進入看板"><kbd>→</kbd>進入</button>
            <button class="key" data-k="search" aria-label="搜尋看板"><kbd>/</kbd>搜尋</button>
            <button class="key" data-k="fav" aria-label="加入或移除最愛"><kbd>F</kbd>最愛</button>
          </div>
        </div>
      </section>

      <!-- ARTICLES -->
      <section class="scr art" id="sList" aria-label="文章列表" hidden>
        <div class="hd"><span class="t" id="lHead">【板主:】</span><span class="bl" id="lBoard">看板《》</span></div>
        <div class="sub"><span id="lInfo" style="padding:0 10px">共 0 篇</span><span class="sp"></span><button class="clr" id="lClear" hidden>清除搜尋</button></div>
        <div class="list" id="aList" role="listbox" aria-label="文章"></div>
        <div class="foot">
          <div class="line"><span id="lineL">文章選讀</span><span id="lineL2"></span></div>
          <div class="keys">
            <button class="key" data-k="back" aria-label="返回看板列表"><kbd>←</kbd>返回</button>
            <button class="key" data-k="up" aria-label="游標上移"><kbd>↑</kbd>上</button>
            <button class="key" data-k="down" aria-label="游標下移"><kbd>↓</kbd>下</button>
            <button class="key" data-k="search" aria-label="搜尋文章"><kbd>/</kbd>搜尋</button>
            <button class="key" data-k="post" aria-label="發表文章"><kbd>P</kbd>發文</button>
          </div>
        </div>
      </section>

      <!-- READ -->
      <section class="scr" id="sRead" aria-label="文章" hidden>
        <div class="read" id="read"></div>
        <div class="foot">
          <div class="line"><span id="lineR">瀏覽 第 1/1 頁 (100%)</span><span id="lineR2"></span></div>
          <div class="keys">
            <button class="key" data-k="back" aria-label="返回文章列表"><kbd>←</kbd>返回</button>
            <button class="key" data-k="push" aria-label="推文"><kbd>X</kbd>推文</button>
            <button class="key" data-k="prev" aria-label="上一篇"><kbd>[</kbd>上篇</button>
            <button class="key" data-k="next" aria-label="下一篇"><kbd>]</kbd>下篇</button>
          </div>
        </div>
      </section>

      <!-- EDITOR -->
      <section class="scr" id="sEdit" aria-label="發表文章" hidden>
        <div class="hd"><span class="t">發表文章於【 <span id="eBoard">Gossiping</span> 】看板</span></div>
        <div class="ed">
          <div class="cats" id="eCats" role="group" aria-label="文章種類"></div>
          <div class="fld"><span>標題：</span><input id="eTitle" maxlength="40" placeholder="請輸入標題" autocomplete="off"></div>
          <textarea id="eBody" aria-label="內文" placeholder="內文。按下方 ^X 發表。"></textarea>
          <div class="note" id="eNote">簽名檔會自動附上。放棄會丟掉目前的內容。</div>
        </div>
        <div class="foot">
          <div class="line"><span>編輯文章</span><span id="eCount">0 字</span></div>
          <div class="keys">
            <button class="key" data-k="cancelpost" aria-label="放棄"><kbd>Esc</kbd>放棄</button>
            <button class="key" data-k="sendpost" aria-label="發表"><kbd>^X</kbd>發表</button>
          </div>
        </div>
      </section>

      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="指令">
        <div class="grab"><i></i></div>
        <div id="sbody"></div>
      </div>
      <div class="toast" id="toast" role="status"></div>
      <div class="home-ind" aria-hidden="true"></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var K = 'app044:';
function load(k, d){ try { var v = localStorage.getItem(K + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(K + k, JSON.stringify(v)); } catch(e){} }
function haptic(p){ try { navigator.vibrate && navigator.vibrate(p || 8); } catch(e){} }
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function p2(n){ return String(n).padStart(2, '0'); }
var ME = 'nightowl23';
var NOW = new Date();
var WD = ['日','一','二','三','四','五','六'];
function md(d){ return (d.getMonth() + 1) + '/' + p2(d.getDate()); }
function daysAgo(n){ var d = new Date(NOW); d.setDate(d.getDate() - n); return d; }

// ---------- bell (the only sound, like a terminal) ----------
var AC = null;
function bell(){
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square'; o.frequency.value = 880; g.gain.setValueAtTime(.05, t); g.gain.setValueAtTime(0, t + .09);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .1);
  } catch(e){}
}

// ---------- data ----------
var BOARDS = [
  {n:'Gossiping', c:'綜合', t:'◎[八卦] 平平是鄉民，為什麼差這麼多', p:8912, bm:'nekoapple/Kay731'},
  {n:'Stock', c:'學術', t:'◎[股票] 買在起漲點，賣在起跌點', p:3406, bm:'eyespot/andyjy12'},
  {n:'Baseball', c:'棒球', t:'◎[棒球] 季後賽倒數，應援不要停', p:2251, bm:'SuperC/iamshiba'},
  {n:'C_Chat', c:'閒談', t:'◎[希洽] 動漫 ACG 閒聊', p:1877, bm:'erisiss/nh60211as'},

  if (k === 'push') return openPush();
  if (k === 'prev' || k === 'next'){
    var idx = rowsA.indexOf(reading) + (k === 'prev' ? -1 : 1);
    if (idx < 0 || idx >= rowsA.length){ bell(); toast(k === 'prev' ? '已經是第一篇' : '已經是最後一篇'); return; }
    cur.list = idx; haptic(5); openArticle(rowsA[idx]); return;
  }
  if (k === 'cancelpost'){ show('list'); renderList(); haptic(5); toast('已放棄編輯'); return; }
  if (k === 'sendpost') return sendPost();
}
function scrollCursor(){
  var listEl = view === 'boards' ? $('bList') : $('aList'), n = view === 'boards' ? cur.boards : cur.list;
  listEl.scrollTop = Math.max(0, n * rowH() - listEl.clientHeight / 2);
}
document.querySelectorAll('.key').forEach(function(k){ k.addEventListener('click', function(){ act(this.dataset.k); }); });

// rows: tap = cursor jumps there, then opens
function rowTap(listId, key){
  $(listId).addEventListener('click', function(e){
    var r = e.target.closest('.row'); if (!r) return;
    var i = +r.dataset.i;
    if (i !== cur[key]){ moveCursor(0, i); setTimeout(function(){ if (cur[key] === i && view === (key === 'boards' ? 'boards' : 'list')) act('enter'); }, reduce ? 0 : 170); }
    else act('enter');
  });
}
rowTap('bList', 'boards'); rowTap('aList', 'list');
$('mHot').addEventListener('click', function(){ mode = 'hot'; cur.boards = 0; haptic(5); renderBoards(); });
$('mFav').addEventListener('click', function(){ mode = 'fav'; cur.boards = 0; haptic(5); renderBoards(); });
$('lClear').addEventListener('click', function(){ query = ''; haptic(5); renderList(); });

// swipe right on article = back
(function(){
  var r = $('read'), sx = 0, sy = 0, on = false;
  r.addEventListener('pointerdown', function(e){ sx = e.clientX; sy = e.clientY; on = true; });
  r.addEventListener('pointerup', function(e){
    if (!on) return; on = false;
    if (e.clientX - sx > 90 && Math.abs(e.clientY - sy) < 60) act('back');
  });
  r.addEventListener('pointercancel', function(){ on = false; });
})();

document.addEventListener('keydown', function(e){
  if (e.target.closest && e.target.closest('input,textarea')){
    if (e.key === 'Escape'){ e.target.blur(); if (!sheet.classList.contains('on') && view === 'edit') act('cancelpost'); else closeSheet(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x' && view === 'edit'){ e.preventDefault(); sendPost(); }
    return;
  }
  if (sheet.classList.contains('on')){ if (e.key === 'Escape') closeSheet(); return; }
  var k = e.key;
  if (k === 'ArrowUp' || k === 'k'){ e.preventDefault(); act('up'); }
  else if (k === 'ArrowDown' || k === 'j'){ e.preventDefault(); act('down'); }
  else if (k === 'ArrowRight' || k === 'Enter'){ if (view === 'boards' || view === 'list'){ e.preventDefault(); act('enter'); } }
  else if (k === 'ArrowLeft' || k === 'q' || k === 'Escape'){ if (view !== 'boards'){ e.preventDefault(); act('back'); } }
  else if (k === '/'){ e.preventDefault(); if (view !== 'read') act('search'); }
  else if (k === 'p' || k === 'P'){ if (view === 'list') act('post'); }
  else if (k === 'x' || k === 'X'){ if (view === 'read') act('push'); }
  else if (k === 'f' || k === 'F'){ if (view === 'boards') act('fav'); }
  else if (k === '[' || k === ']'){ if (view === 'read') act(k === '[' ? 'prev' : 'next'); }
});

// ---------- sheet ----------
var sheet = $('sheet'), scrim = $('scrim'), lastFocus = null;
function openSheet(html){
  lastFocus = document.activeElement; $('sbody').innerHTML = html;
  sheet.style.transform = ''; sheet.classList.add('on'); scrim.classList.add('on'); haptic(6);
}
function closeSheet(){
  if (!sheet.classList.contains('on')) return;
  sheet.classList.remove('on', 'drag'); sheet.style.transform = ''; scrim.classList.remove('on');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (lastFocus && lastFocus.focus) try { lastFocus.focus({preventScroll:true}); } catch(e){}
}
scrim.addEventListener('click', closeSheet);
(function(){
  var sy = 0, dy = 0, t0 = 0, dragging = false;
  sheet.addEventListener('pointerdown', function(e){
    if (e.target.closest('button,input')) return;
    dragging = true; sy = e.clientY; dy = 0; t0 = e.timeStamp; sheet.classList.add('drag');
    try { sheet.setPointerCapture(e.pointerId); } catch(err){}
  });
  sheet.addEventListener('pointermove', function(e){ if (!dragging) return; dy = e.clientY - sy; sheet.style.transform = 'translateY(' + (dy > 0 ? dy : dy / 6).toFixed(1) + 'px)'; });
  function end(e){
    if (!dragging) return; dragging = false; sheet.classList.remove('drag');
    var v = dy / Math.max(1, e.timeStamp - t0);
    if (dy > sheet.offsetHeight * .35 || v > .6) closeSheet(); else sheet.style.transform = '';
  }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();

// search prompt
function openSearch(){
  if (view === 'boards'){
    openSheet('<h3>搜尋看板</h3><div class="prompt"><label for="sq" class="y">看板名稱或中文:</label><input id="sq" autocomplete="off" value="' + esc(bQuery) + '" placeholder="例如 美食"></div>' +
      '<div class="srow"><span class="hint">清空再按確定就顯示全部</span><button class="ok" id="sgo">確定</button></div>');
    var go = function(){ bQuery = $('sq').value.trim().toLowerCase(); cur.boards = 0; mode = 'hot'; closeSheet(); renderBoards(); haptic(5); };
    $('sgo').addEventListener('click', go);
    $('sq').addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
    return;
  }
  if (view !== 'list'){ bell(); return; }
  var authorMode = qAuthor;
  openSheet('<h3>搜尋' + board + '</h3><div class="opts" id="sm"><button data-m="0" aria-pressed="' + !authorMode + '">/ 標題關鍵字</button><button data-m="1" aria-pressed="' + authorMode + '">a 作者</button></div>' +
    '<div class="prompt"><label for="sq" class="y" id="sql">' + (authorMode ? '[搜尋作者]' : '[搜尋標題]') + ' 關鍵字:</label><input id="sq" autocomplete="off" value="' + esc(query) + '"></div>' +
    '<div class="srow"><span class="hint" id="shint">例如 颱風、台南、kaorumi</span><button class="ok" id="sgo">確定</button></div>');
  $('sm').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return; authorMode = b.dataset.m === '1'; haptic(4);
    this.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x === b); });
    $('sql').textContent = (authorMode ? '[搜尋作者]' : '[搜尋標題]') + ' 關鍵字:';
  });
  var go2 = function(){
    var v = $('sq').value.trim().toLowerCase();
    qAuthor = authorMode; query = v; cur.list = 0; closeSheet(); renderList(); haptic(5);
    if (v && !rowsA.length){ bell(); }
  };
  $('sgo').addEventListener('click', go2);
  $('sq').addEventListener('keydown', function(e){ if (e.key === 'Enter') go2(); });
}

// push prompt
function openPush(){
  if (!reading){ bell(); return; }
  var g = 'p';
  openSheet('<h3>您覺得這篇文章</h3><div class="opts" id="pm"><button data-g="p" aria-pressed="true"><span class="w">1.</span> 值得推薦</button><button data-g="b" aria-pressed="false"><span class="r">2.</span> 給它噓聲</button><button data-g="a" aria-pressed="false"><span class="r">3.</span> 只加→註解</button></div>' +
    '<div class="prompt"><label for="pq" id="pl"><span class="w">推</span> <span class="y">' + ME + '</span>:</label><input id="pq" maxlength="36" autocomplete="off"></div>' +
    '<div class="srow"><span class="hint" id="phint">最多 36 字</span><button class="ok" id="pgo">確定</button></div>');
  $('pm').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return; g = b.dataset.g; haptic(4);
    this.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x === b); });
    $('pl').innerHTML = '<span class="' + (g === 'p' ? 'w' : 'r') + '">' + (g === 'p' ? '推' : g === 'b' ? '噓' : '→') + '</span> <span class="y">' + ME + '</span>:';
  });
  var go = function(){
    var v = $('pq').value.trim();
    if (!v){ $('phint').textContent = '請輸入內容'; $('phint').className = 'hint bad'; bell(); haptic([20, 30, 20]); return; }
    var note = '';
    if (g !== 'a' && Date.now() - lastPush < 60000){ g = 'a'; note = '一分鐘內連續推文，改為 → 註解'; }
    if (g !== 'a') lastPush = Date.now();
    var d = new Date(), before = score(reading);
    var c = {g:g, id:ME, t:v, tm:md(d) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes())};
    (myCm[reading.id] = myCm[reading.id] || []).push(c); save('cm', myCm);
    closeSheet(); renderRead();
    var r = $('read'); r.scrollTop = r.scrollHeight;
    var last = $('cms').lastElementChild; if (last){ last.classList.add('flash'); }
    haptic(g === 'b' ? [30, 40, 30] : [8, 20, 8]);
    if (g === 'b') bell();
    if (before < 100 && score(reading) >= 100) toast('這篇爆了！');
    else if (note) toast(note);
  };
  $('pgo').addEventListener('click', go);
  $('pq').addEventListener('keydown', function(e){ if (e.key === 'Enter') go(); });
}

// editor
var CATS = ['問卦','新聞','心得','請益','閒聊','情報'], eCat = '問卦';
function openEditor(){
  if (view !== 'list'){ bell(); return; }
  $('eBoard').textContent = board;
  $('eCats').innerHTML = CATS.map(function(c, i){ return '<button data-c="' + c + '" aria-pressed="' + (c === eCat) + '">' + (i + 1) + '.' + c + '</button>'; }).join('');
  $('eTitle').value = ''; $('eBody').value = ''; $('eCount').textContent = '0 字'; $('eNote').textContent = '簽名檔會自動附上。放棄會丟掉目前的內容。'; $('eNote').style.color = '';
  show('edit'); haptic(6);
}
$('eCats').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return; eCat = b.dataset.c; haptic(4);
  this.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x === b); });
});
$('eBody').addEventListener('input', function(){ $('eCount').textContent = this.value.length + ' 字'; });
function sendPost(){
  var t = $('eTitle').value.trim(), body = $('eBody').value.trim();
  if (!t){ $('eNote').textContent = '標題不能空白'; $('eNote').style.color = '#ff5555'; bell(); haptic([20, 30, 20]); $('eTitle').focus(); return; }
  var d = new Date();
  var p = {id:board + '-me-' + d.getTime(), cat:eCat, t:t, body:body || '如題', base:0, au:ME, d:md(d), ts:d.getTime(), time:d, cm:[]};
  (myPosts[board] = myPosts[board] || []).push(p); save('posts', myPosts);
  show('list'); query = ''; renderList();
  cur.list = rowsA.indexOf(rowsA.filter(function(x){ return x.id === p.id; })[0]);
  renderList(); scrollCursor();
  haptic([10, 30, 10]); toast('文章發表成功，你的文章在第 ' + (cur.list + 1) + ' 篇');
}

// ---------- toast ----------
var toastT = null;
function toast(m){ var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 2000); }

// ---------- clock / footer ----------
function tick(){
  var d = new Date();
  $('clock').textContent = p2(d.getHours()) + ':' + p2(d.getMinutes());
  $('lineB').textContent = '《' + p2(d.getMonth() + 1) + '/' + p2(d.getDate()) + ' 週' + WD[d.getDay()] + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + '》';
  $('online').textContent = (128000 + Math.floor(Math.random() * 9000)).toLocaleString('en-US');
}
tick(); setInterval(tick, 20000);
try { if (navigator.getBattery) navigator.getBattery().then(function(b){ $('batt').setAttribute('width', Math.max(2, 14 * b.level).toFixed(1)); }).catch(function(){}); } catch(e){}

// ---------- backdrop: login screen in ANSI blocks ----------
(function(){
  if (!matchMedia('(min-width:521px)').matches) return;
  var F = {P:['11110','10001','11110','10000','10000'], T:['11111','00100','00100','00100','00100']};
  var cols = ['#ffff55','#ffff55','#55ffff','#55ffff','#ff5555'], px = 20, svg = '';
  ['P','T','T'].forEach(function(ch, li){
    F[ch].forEach(function(row, y){ row.split('').forEach(function(v, x){ if (v === '1') svg += '<rect x="' + ((li * 6 + x) * px) + '" y="' + (y * px) + '" width="' + px + '" height="' + px + '" fill="' + cols[y] + '"/>'; }); });
  });
  $('ansi').innerHTML = '<svg width="340" height="100" viewBox="0 0 340 100">' + svg + '</svg>\n<span style="color:#aaaaaa;font-size:16px">批踢踢實業坊 · ptt.cc</span>';
  $('login').innerHTML = '<span style="color:#ffffff">歡迎來到 批踢踢實業坊</span>\n本站目前上線人數 <span style="color:#ffff55">132,451</span>\n\n請輸入代號，或以 guest 參觀\n或以 new 註冊: <span style="color:#ffffff">' + ME + '</span><span class="caret"></span>';
  $('ftl').textContent = '《' + (NOW.getMonth() + 1) + '/' + NOW.getDate() + ' 星期' + WD[NOW.getDay()] + '》　按任意鍵繼續　（手機版請點看板）';
})();

renderBoards();
})();
</script>
