<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1d1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="金庫">
<title>金庫 · 密碼庫</title>
<meta name="description" content="銀行金庫鋼材與黃銅質感的密碼庫：轉動密碼轉盤開門、保管箱清單、長按顯示密碼、機械滾輪產生器與密碼健檢。收錄於 100 Creative HTML Works（App 088・銀行金庫鋼與黃銅）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/088-vault-passwords.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a2926'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%23c9a24a'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%235a5854'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23e3c27a'/%3E%3Cpath d='M32 6l4 7h-8z' fill='%23efe6cf'/%3E%3Cpath d='M32 17v6M32 41v6M17 32h6M41 32h6' stroke='%23e3c27a' stroke-width='2.4'/%3E%3C/svg%3E">
<style>
:root{
  --steel-0:#1a1917;
  --steel-1:#23221f;
  --steel-2:#2e2d29;
  --steel-3:#3c3a36;
  --steel-4:#5a5854;
  --steel-5:#8d8a83;
  --brass:#c9a24a;
  --brass-l:#e6c882;
  --brass-d:#8a6a26;
  --ivory:#efe6cf;
  --ivory-2:#bdb49f;
  --ivory-3:#8f8877;
  --rust:#d0764a;
  --disp:Copperplate,"Copperplate Gothic","Songti TC","PingFang TC",serif;
  --cjk:"Songti TC","PingFang TC",serif;
  --mono:Menlo,"SF Mono",monospace;
  --text:"PingFang TC","Heiti TC",system-ui,-apple-system,sans-serif;
  --out:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.3,1.3,.5,1);
  --brushed:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,rgba(0,0,0,.03) 1px 3px,rgba(255,255,255,.012) 3px 4px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.45 var(--text);color:var(--ivory);background:var(--steel-0);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass-l);outline-offset:2px}
svg{display:block}
.mono{font-family:var(--mono)}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption,.screw{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--steel-1);isolation:isolate}
@media (min-width:521px){
  body{background:#141311}
  .stage{display:flex;align-items:center;justify-content:center;gap:76px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:54px;padding:13px;z-index:1;
    background:linear-gradient(160deg,#6f6c66,#3b3935 35%,#2a2926 65%,#57544f);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 0 0 2px #1b1a18,0 16px 24px -16px rgba(0,0,0,.85)}
  .screen{inset:13px;border-radius:42px}
  .screw{display:block;position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3dca0,#a8842f 60%,#6e5420);z-index:2}
  .screw::after{content:"";position:absolute;left:1px;right:1px;top:4px;height:1px;background:#5a4418;transform:rotate(35deg)}
  .screw.a{left:22px;top:22px}.screw.b{right:22px;top:22px}.screw.c{left:22px;bottom:22px}.screw.d{right:22px;bottom:22px}
  .caption{display:block;position:relative;z-index:1;width:250px}
  .caption h1{font:700 60px/1 var(--cjk);color:var(--brass-l);letter-spacing:.08em}
  .caption p{margin-top:16px;font-size:16px;line-height:1.7;color:var(--ivory-2)}
}
@media (min-width:521px) and (max-width:900px){.caption{display:none}}

.status{position:absolute;top:0;left:0;right:0;z-index:95;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 30px 0 34px;
  display:flex;align-items:center;justify-content:space-between;font:600 16px/1 var(--text);color:var(--ivory);pointer-events:none}
.status .gl{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}

/* ---------- vault interior (list) ---------- */
.inside{position:absolute;inset:0;z-index:5;background:var(--steel-1);background-image:var(--brushed);display:flex;flex-direction:column}
.ihd{flex:none;padding:calc(54px + env(safe-area-inset-top)) 18px 0;display:flex;align-items:flex-end;justify-content:space-between}
.ihd h1{font:700 32px/1 var(--cjk);color:var(--brass-l);letter-spacing:.1em}
.ihd .sub{font-size:13px;color:var(--ivory-3);margin-top:6px}
.lockbtn{width:52px;height:52px;display:grid;place-items:center;border-radius:12px;margin-right:-6px}
.lockbtn:active{background:var(--steel-2)}
.lockbtn svg{width:30px;height:30px}
.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;padding:10px 18px calc(118px + env(safe-area-inset-bottom))}
.view::-webkit-scrollbar{display:none}
.view[hidden]{display:none}
.view.enter{animation:vin .4s var(--out)}
@keyframes vin{from{transform:translateY(16px)}}

.health{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:10px;background:var(--steel-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 -1px 0 rgba(0,0,0,.35)}
.health:active{background:var(--steel-3)}
.health svg{width:40px;height:40px;flex:none}
.health .t{font:600 15px/1.3 var(--text)}
.health .s{font-size:12px;color:var(--ivory-3);margin-top:2px}
.search{display:flex;align-items:center;gap:10px;height:48px;margin-top:12px;padding:0 14px;border-radius:10px;background:var(--steel-0);box-shadow:inset 0 2px 3px rgba(0,0,0,.55),inset 0 -1px 0 rgba(255,255,255,.05)}
.search svg{width:18px;height:18px;flex:none}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;color:var(--ivory);font:15px var(--text);outline:none}
.search input::placeholder{color:var(--ivory-3)}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:10px -18px 0;padding:0 14px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;height:44px;padding:0 12px;font:600 15px/44px var(--cjk);color:var(--ivory-3);border-radius:8px;transition:color .2s,background-color .2s}
.cat.on{color:var(--steel-0);background:linear-gradient(180deg,var(--brass-l),var(--brass) 60%,#b08a38)}
.cat .n{font:11px var(--mono);margin-left:4px;opacity:.8}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.box{position:relative;text-align:left;min-height:124px;padding:30px 12px 12px;border-radius:6px;background:linear-gradient(180deg,#3a3834,#2c2b28);background-image:var(--brushed),linear-gradient(180deg,#3a3834,#2c2b28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 0 rgba(0,0,0,.4),0 2px 3px -1px rgba(0,0,0,.5);transition:transform .15s var(--out)}
.box:active{transform:scale(.97)}
.box .plate{position:absolute;left:12px;top:9px;height:16px;padding:0 6px;border-radius:2px;background:linear-gradient(180deg,var(--brass-l),var(--brass-d));color:#2a2006;font:700 10px/16px var(--mono);letter-spacing:.06em}
.box .kh{position:absolute;right:10px;top:8px;width:14px;height:20px}
.box .rv{position:absolute;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9cf8c,#8a6a26)}
.box .rv.a{left:4px;bottom:4px}.box .rv.b{right:4px;bottom:4px}
.box .nm{display:block;font:700 16px/1.25 var(--cjk);color:var(--ivory);margin-top:4px}
.box .us{display:block;font:11px/1.4 var(--mono);color:var(--ivory-3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .str{position:absolute;left:12px;bottom:12px;display:flex;gap:3px}
.box .str i{width:14px;height:4px;border-radius:1px;background:var(--steel-4)}
.box .str i.on{background:var(--brass)}
.box .str.weak i.on{background:var(--rust)}
.box .warn{position:absolute;right:12px;bottom:9px;font:11px/1 var(--text);color:var(--rust)}
.empty{grid-column:1/-1;text-align:center;padding:40px 0;color:var(--ivory-3)}

/* generator */
.gtitle{font:700 22px/1.2 var(--cjk);color:var(--ivory);margin-top:2px}
.gsub{font-size:13px;color:var(--ivory-3);margin-top:4px}
.tumbler{display:flex;flex-wrap:wrap;gap:3px;margin-top:16px;padding:12px;border-radius:10px;background:var(--steel-0);box-shadow:inset 0 3px 5px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,255,255,.05);min-height:70px}
.cell{width:calc((100% - 15*3px)/16);height:34px;overflow:hidden;border-radius:2px;background:linear-gradient(180deg,#141311,#26241f 50%,#141311)}
.cell span{display:block;height:34px;font:600 16px/34px var(--mono);text-align:center;color:var(--brass-l)}
.cell.roll span{animation:roll .5s cubic-bezier(.2,.7,.3,1.2) backwards}
@keyframes roll{from{transform:translateY(-120%)}}
.meter{display:flex;align-items:center;gap:14px;margin-top:14px}
.meter svg{width:92px;height:56px;flex:none}
.meter .needle{transition:transform .7s var(--spring);transform-origin:46px 50px}
.meter .t{font:700 18px/1.2 var(--cjk)}
.meter .s{font-size:12px;color:var(--ivory-3);margin-top:3px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:16px;padding:4px;border-radius:10px;background:var(--steel-0);box-shadow:inset 0 2px 3px rgba(0,0,0,.5)}
.modes button{height:44px;border-radius:7px;font:600 15px/44px var(--cjk);color:var(--ivory-3)}
.modes button.on{background:var(--steel-3);color:var(--ivory);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 2px rgba(0,0,0,.4)}
.lenrow{margin-top:18px}
.lenrow .lb{display:flex;justify-content:space-between;font-size:13px;color:var(--ivory-2)}
.lenrow .lb b{font:600 16px/1 var(--mono);color:var(--brass-l)}
.slider{position:relative;height:48px;margin-top:4px;touch-action:none;cursor:pointer}
.slider .tr{position:absolute;left:0;right:0;top:21px;height:6px;border-radius:3px;background:var(--steel-0);box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
.slider .fl{position:absolute;left:0;top:21px;height:6px;border-radius:3px;background:var(--brass-d)}
.slider .th{position:absolute;top:8px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:repeating-conic-gradient(from 0deg,#e6c882 0 6deg,#b08a38 6deg 12deg);box-shadow:inset 0 0 0 6px rgba(201,162,74,.95),0 2px 3px rgba(0,0,0,.5)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.tog{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 10px;border-radius:10px;background:var(--steel-2);text-align:left;font-size:14px;color:var(--ivory-2)}
.tog svg{width:22px;height:38px;flex:none}
.tog .lv{transition:transform .25s var(--spring);transform-origin:11px 25px}
.tog[aria-checked=true]{color:var(--ivory)}
.tog[aria-checked=false] .lv{transform:rotate(180deg)}
.gacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.knob{position:relative;height:60px;border-radius:12px;font:700 17px/60px var(--cjk);color:#2a2006;background:linear-gradient(180deg,var(--brass-l),var(--brass) 55%,#a8842f);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 3px rgba(0,0,0,.45);transition:filter .15s,transform .12s}
.knob:active{filter:brightness(.9);transform:translateY(1px)}
.steelbtn{height:60px;border-radius:12px;font:700 17px/60px var(--cjk);color:var(--ivory);background:linear-gradient(180deg,#4a4844,#35332f);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 3px rgba(0,0,0,.45)}
.steelbtn:active{filter:brightness(.88)}
.spinner{display:grid;place-items:center;margin-top:18px}
.spinner button{width:120px;height:120px;border-radius:50%;touch-action:none}
.spinner svg{width:120px;height:120px}
.spinner p{font-size:12px;color:var(--ivory-3);margin-top:6px}

/* bottom plate nav */
.plate-nav{position:absolute;left:14px;right:14px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:20;height:66px;display:grid;grid-template-columns:1fr 1fr 66px;gap:6px;padding:6px;border-radius:16px;
  background:linear-gradient(180deg,#46443f,#2d2c29);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 4px 8px -4px rgba(0,0,0,.7)}
.plate-nav .tb{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;font:700 16px/1 var(--cjk);color:var(--ivory-3);transition:color .2s,background-color .2s}
.plate-nav .tb svg{width:22px;height:22px}
.plate-nav .tb.on{color:var(--brass-l);background:var(--steel-0);box-shadow:inset 0 2px 4px rgba(0,0,0,.7),inset 0 -1px 0 rgba(255,255,255,.06)}
.plate-nav .add{border-radius:11px;background:linear-gradient(180deg,var(--brass-l),var(--brass) 60%,#a8842f);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.plate-nav .add svg{width:22px;height:22px}
.plate-nav .add:active{filter:brightness(.88)}
.home-ind{position:absolute;left:50%;bottom:calc(7px + env(safe-area-inset-bottom) * .3);width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ivory);opacity:.85;z-index:96;pointer-events:none}

/* ---------- the vault door (lock screen) ---------- */
.door{position:absolute;inset:0;z-index:40;background:#2b2a27;background-image:var(--brushed),radial-gradient(120% 70% at 20% 0%,#4a4843,#2b2a27 60%,#1f1e1c);
  transform-origin:0 50%;transition:transform .9s cubic-bezier(.6,0,.3,1),visibility 0s .9s;display:flex;flex-direction:column;align-items:center}
.door.open{transform:perspective(1100px) rotateY(-100deg);visibility:hidden}
.door.closing{transition:transform .7s cubic-bezier(.3,0,.2,1),visibility 0s 0s}
.door .dh{margin-top:calc(70px + env(safe-area-inset-top));text-align:center}
.door .dh h2{font:700 30px/1 var(--cjk);color:var(--brass-l);letter-spacing:.24em;margin-right:-.24em}
.door .dh p{font-size:13px;color:var(--ivory-2);margin-top:10px}
.combo{display:flex;gap:12px;margin-top:18px}
.slot{width:62px;height:48px;border-radius:6px;background:var(--steel-0);box-shadow:inset 0 2px 4px rgba(0,0,0,.7),inset 0 -1px 0 rgba(255,255,255,.07);display:grid;place-items:center;font:700 24px/1 var(--mono);color:var(--ivory-3)}
.slot.set{color:var(--brass-l)}
.slot.cur{box-shadow:inset 0 2px 4px rgba(0,0,0,.7),inset 0 0 0 2px var(--brass-d)}
.combo.bad{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
.dialwrap{position:relative;width:330px;height:330px;margin-top:22px;flex:none}
.dialwrap .ring,.dialwrap .face{position:absolute;inset:0}
.dialwrap svg{width:100%;height:100%}
#dialRot{transform-origin:165px 165px}
.dial-hit{position:absolute;inset:0;border-radius:50%;touch-action:none;cursor:grab}
.center{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;z-index:3;display:grid;place-items:center;font:700 15px/1.2 var(--cjk);color:#2a2006;
  background:radial-gradient(circle at 38% 32%,#f4dfa4,#c9a24a 55%,#8a6a26);box-shadow:inset 0 -2px 3px rgba(0,0,0,.35),inset 0 2px 2px rgba(255,255,255,.4),0 3px 5px rgba(0,0,0,.5)}
.center:active{filter:brightness(.92)}
.center small{display:block;font:600 11px/1 var(--mono);color:#4a3a10;margin-top:3px}
.readout{margin-top:12px;font:700 40px/1 var(--mono);color:var(--ivory);letter-spacing:.04em}
/* 下方門閂會伸出轉盤 22px，說明文字要讓開 */
.dhint{margin-top:28px;font-size:12px;color:var(--ivory-3);text-align:center;line-height:1.6}
.demo{margin-top:6px;height:44px;padding:0 16px;font:600 14px/44px var(--text);color:var(--brass-l);border-radius:10px}
.demo:active{background:rgba(201,162,74,.12)}
@media (max-height:700px){.door .dh{margin-top:calc(54px + env(safe-area-inset-top))}.door .dh p{margin-top:8px}.combo{margin-top:14px}.dialwrap{margin-top:14px}.demo{margin-top:2px}}
.bolt{position:absolute;width:44px;height:16px;border-radius:3px;background:linear-gradient(180deg,#f0d796,#b28a35 60%,#7d5f22);transition:transform .45s var(--out);z-index:2}
.bolts.back .bolt{transform:translateX(var(--bx,0)) translateY(var(--by,0))}

/* ---------- drawer sheet ---------- */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(10,9,8,.6);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:8px;right:8px;bottom:0;z-index:51;max-height:calc(100% - 56px);display:flex;flex-direction:column;border-radius:18px 18px 0 0;overflow:hidden;
  background:#34322e;background-image:var(--brushed),linear-gradient(180deg,#403e39,#2e2d29);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
  transform:translateY(calc(100% + 20px));transition:transform .5s var(--spring);touch-action:none}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.handle{flex:none;height:34px;display:grid;place-items:center}
.handle i{width:120px;height:12px;border-radius:6px;background:linear-gradient(180deg,#f0d796,#b28a35 60%,#7d5f22);box-shadow:0 2px 2px rgba(0,0,0,.4)}
.sbody{flex:1;overflow-y:auto;scrollbar-width:none;padding:4px 18px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sbody::-webkit-scrollbar{display:none}
.sbody h3{font:700 26px/1.2 var(--cjk);color:var(--ivory)}
.sbody .lead{font-size:13px;color:var(--ivory-3);margin-top:4px}
.field{margin-top:14px}
.field .lb{font-size:12px;color:var(--ivory-3);margin-bottom:6px}
.fplate{display:flex;align-items:center;gap:8px;min-height:54px;padding:0 6px 0 14px;border-radius:10px;background:var(--steel-0);box-shadow:inset 0 2px 4px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,255,255,.06)}
.fplate .v{flex:1;min-width:0;font:600 16px/1.3 var(--mono);color:var(--ivory);word-break:break-all;padding:10px 0}
.fplate .v.masked{letter-spacing:.12em;color:var(--ivory-2)}
.fplate button{width:44px;height:44px;display:grid;place-items:center;border-radius:8px;flex:none}
.fplate button:active{background:var(--steel-2)}
.fplate button svg{width:20px;height:20px}
.reveal{position:relative;touch-action:none;cursor:pointer}
.reveal .ringp{position:absolute;right:10px;top:50%;width:30px;height:30px;margin-top:-15px;pointer-events:none}
.reveal .ringp circle{transition:stroke-dashoffset .35s linear}
.fin{width:100%;height:52px;border:0;border-radius:10px;padding:0 14px;background:var(--steel-0);box-shadow:inset 0 2px 4px rgba(0,0,0,.6);color:var(--ivory);font:600 16px var(--mono);outline:none}
.fin::placeholder{color:var(--ivory-3);font-family:var(--text);font-weight:400}
.gauge{display:flex;align-items:center;gap:14px;margin-top:16px}
.gauge svg{width:110px;height:64px;flex:none}
.gauge .needle{transition:transform .8s var(--spring);transform-origin:55px 58px}
.gauge .t{font:700 18px/1.2 var(--cjk)}
.gauge .s{font-size:12px;color:var(--ivory-3);margin-top:3px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.textbtn{display:block;margin:14px auto 0;height:44px;padding:0 14px;color:var(--rust);font:600 15px/44px var(--text)}
.catpick{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- strength ---------- */
function bits(pw){
  var s = 0; if (/[a-z]/.test(pw)) s += 26; if (/[A-Z]/.test(pw)) s += 26; if (/\d/.test(pw)) s += 10; if (/[^a-zA-Z0-9]/.test(pw)) s += 33;

/* ---------- dial ---------- */
var dialAngle = load('ang', 0), slots = [], lastDir = 0, travel = 0, locked = true;
(function buildDial(){

/* dial drag */
(function(){
  var hit = $('dialHit'), on = false, lastA = 0, lastN = numAt(dialAngle);

    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown'){ e.preventDefault(); ac(); setAngle(dialAngle + 3.6); tick(); }

  });

/* demo: the dial opens itself */

var sheet = $('sheet'), scrim = $('scrim'), lastFocus = null, mode = null;
function openSheet(html, m){ lastFocus = document.activeElement; mode = m || 'item'; $('sbody').innerHTML = html; $('sbody').scrollTop = 0; sheet.style.transform = ''; sheet.classList.add('on'); scrim.classList.add('on'); var f = sheet.querySelector('input,button'); if (f) try{ f.focus({ preventScroll:true }); }catch(e){} }
function closeSheet(){ if (!sheet.classList.contains('on')) return; sheet.classList.remove('on','drag'); sheet.style.transform = ''; scrim.classList.remove('on'); scrim.style.opacity = ''; mode = null; if (lastFocus && lastFocus.focus) try{ lastFocus.focus({ preventScroll:true }); }catch(e){} }
scrim.addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });
(function(){
  var sy = 0, dy = 0, t0 = 0, on = false;
  sheet.addEventListener('pointerdown', function(e){ if (e.target.closest('button,input,.reveal')) return; if ($('sbody').scrollTop > 2 && e.target.closest('.sbody')) return; on = true; sy = e.clientY; dy = 0; t0 = e.timeStamp; sheet.classList.add('drag'); try{ sheet.setPointerCapture(e.pointerId); }catch(err){} });
  sheet.addEventListener('pointermove', function(e){ if (!on) return; dy = e.clientY - sy; sheet.style.transform = 'translateY('+(dy > 0 ? dy : dy/6).toFixed(1)+'px)'; scrim.style.opacity = Math.max(0, 1 - dy/sheet.offsetHeight).toFixed(2); });
  function end(e){ if (!on) return; on = false; sheet.classList.remove('drag'); scrim.style.opacity = ''; var v = dy/Math.max(1, e.timeStamp - t0); if (dy > sheet.offsetHeight*.35 || v > .6){ haptic(5); closeSheet(); } else sheet.style.transform = ''; }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();

/* ---------- auto lock ---------- */
var idle = Date.now();
document.addEventListener('pointerdown', function(){ idle = Date.now(); }, true);
document.addEventListener('keydown', function(){ idle = Date.now(); }, true);
setInterval(function(){ if (!locked && Date.now() - idle > cfg.autolock*1000) lock('閒置太久，金庫自動上鎖了'); }, 5000);
document.addEventListener('visibilitychange', function(){ if (document.hidden && !locked) lock('離開時已自動上鎖'); });

/* ---------- toast ---------- */
var tT = null;
function toast(msg, act, fn){ var t = $('toast'); t.innerHTML = '<span>'+esc(msg)+'</span>' + (act ? '<button>'+act+'</button>' : ''); if (act) t.querySelector('button').onclick = function(){ fn(); t.classList.remove('on'); haptic(6); }; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(function(){ t.classList.remove('on'); }, act ? 4000 : 2000); }
function bump(){ toast('歡迎回來，'+items.length+' 件保管物都在'); }

/* ---------- clock ---------- */
function tickClock(){ var d = new Date(); $('clock').textContent = d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
tickClock(); setInterval(tickClock, 15000);

/* ---------- backdrop: deposit-box wall + a giant vault door ---------- */
(function(){
  var s = '<defs><linearGradient id="bw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4741"/><stop offset=".55" stop-color="#26241f"/><stop offset="1" stop-color="#171614"/></linearGradient>'+
    '<radialGradient id="vd" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#6d6a64"/><stop offset=".7" stop-color="#3a3834"/><stop offset="1" stop-color="#222120"/></radialGradient>'+
    '<radialGradient id="vb" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#f3dca0"/><stop offset=".5" stop-color="#c9a24a"/><stop offset="1" stop-color="#6e5420"/></radialGradient></defs>';
  s += '<rect width="1600" height="1000" fill="url(#bw)"/>';
  for (var r = 0; r < 9; r++) for (var c = 0; c < 7; c++){
    var x = 20 + c*62, y = 20 + r*108;
    s += '<rect x="'+x+'" y="'+y+'" width="56" height="100" rx="3" fill="#34322e" stroke="#1a1917" stroke-width="2"/><rect x="'+(x+14)+'" y="'+(y+10)+'" width="28" height="9" rx="1" fill="#b08a38" opacity=".85"/><circle cx="'+(x+28)+'" cy="'+(y+62)+'" r="4" fill="#141311"/>';
  }
  s += '<rect width="470" height="1000" fill="#000" opacity=".25"/>';
  s += '<circle cx="1500" cy="560" r="420" fill="url(#vd)"/><circle cx="1500" cy="560" r="420" fill="none" stroke="#141311" stroke-width="10"/><circle cx="1500" cy="560" r="360" fill="none" stroke="#5a5854" stroke-width="3" stroke-dasharray="4 14"/>';
  for (var b = 0; b < 10; b++){ var a = b*36*Math.PI/180; s += '<rect x="-30" y="-14" width="60" height="28" rx="4" fill="url(#vb)" transform="translate('+(1500 + Math.cos(a)*392).toFixed(0)+' '+(560 + Math.sin(a)*392).toFixed(0)+') rotate('+(b*36)+')"/>'; }
  s += '<circle cx="1500" cy="560" r="150" fill="url(#vb)"/><circle cx="1500" cy="560" r="96" fill="#3a3834"/>';
  for (var k = 0; k < 6; k++) s += '<rect x="1492" y="400" width="16" height="130" rx="6" fill="#8d8a83" transform="rotate('+(k*60)+' 1500 560)"/>';
  s += '<circle cx="1500" cy="560" r="36" fill="url(#vb)"/>';
  $('bd').innerHTML = s;
})();

/* ---------- boot ---------- */
setAngle(dialAngle); renderSlots(); renderList(); renderGenCtl(); regen(false);
})();
