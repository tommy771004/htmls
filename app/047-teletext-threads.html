<style>

/* ---------- teletext display ---------- */
.tv{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:none}
.pagewrap{position:relative;width:calc(var(--cw)*40);height:calc(var(--rh)*24);font-size:calc(var(--cw)/.6);line-height:var(--rh)}
#page,#old{position:absolute;inset:0;background:#000}
#old{pointer-events:none;z-index:2}
#old:empty{display:none}
#old.wipe{animation:wipe .62s steps(24,end) forwards}
@keyframes wipe{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(100% 0 0 0)}}
.r{position:relative;height:var(--rh);line-height:var(--rh);white-space:pre;overflow:hidden;display:block}
.r.x2{height:calc(var(--rh)*2);line-height:calc(var(--rh)*2)}
.r>span,.r>button{vertical-align:top}
.r i{font-style:normal;display:inline-block;width:calc(var(--cw)*2);text-align:center}
.r .s{display:inline-block;width:var(--cw)}
.f-r{color:var(--r)}.f-g{color:var(--g)}.f-y{color:var(--y)}.f-b{color:var(--b)}.f-m{color:var(--m)}.f-c{color:var(--c)}.f-w{color:var(--w)}.f-k{color:#000}
.b-r{background:var(--r)}.b-g{background:var(--g)}.b-y{background:var(--y)}.b-b{background:var(--b)}.b-m{background:var(--m)}.b-c{background:var(--c)}.b-w{background:var(--w)}

.cc{color:transparent!important}
.reveal .cc{color:inherit!important;background:rgba(255,61,255,.0)}
.reveal .cc.f-m,.cc{}
.flash{animation:flash 1.1s steps(1) infinite}
@keyframes flash{50%{visibility:hidden}}
.lnk,.blk{display:block;width:100%;text-align:left;cursor:pointer}
.lnk:active .r,.blk:active .r{background:#1a1a1a}
.lnk:active .r.b-b{background:var(--b)}
.blk{position:relative}
.av{position:absolute;left:0;top:0;width:calc(var(--cw)*3);height:calc(var(--rh)*2)}

@keyframes pop{0%{transform:translate(-50%,-50%) scale(.5)}40%{transform:translate(-50%,-50%) scale(1.15)}100%{transform:translate(-50%,-50%) scale(1)}}
.act{display:inline-block;height:calc(var(--rh)*2);line-height:calc(var(--rh)*2);padding:0 calc(var(--cw)*1);cursor:pointer;white-space:pre;vertical-align:top}

/* ---------- remote ---------- */
.remote{flex:none;position:relative;z-index:3;padding:10px 14px calc(18px + env(safe-area-inset-bottom));background:#0f0e0d;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}

.fk{height:44px;border-radius:5px;position:relative;transition:filter .1s,transform .1s}

.fk:active{transform:translateY(1px);filter:brightness(.75)}
.fk.r0{background:#d8261c}.fk.g0{background:#17b817}.fk.y0{background:#e2d414}.fk.c0{background:#15c2c2}

.kb:active{background:#34322f}

.lcd{height:46px;border-radius:5px;background:#000;display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;color:var(--y);letter-spacing:.14em;box-shadow:inset 0 0 0 1px #2c2a27}
.lcd small{font-size:12px;letter-spacing:0;color:#8f8a80}
.home-ind{position:absolute;left:50%;bottom:calc(6px + env(safe-area-inset-bottom)*.3);width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(255,255,255,.7);pointer-events:none;z-index:4}

/* ---------- keypad sheet ---------- */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:#141312;border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(105%);visibility:hidden;transition:transform .42s cubic-bezier(.3,1.25,.5,1),visibility 0s .42s;touch-action:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.sheet.on{transform:translateY(0);visibility:visible;transition:transform .42s cubic-bezier(.3,1.25,.5,1)}
.sheet.drag{transition:none}
.grip{width:40px;height:5px;border-radius:3px;background:#3a3834;margin:0 auto 14px}
.pd{height:64px;display:flex;align-items:center;justify-content:center;gap:6px;background:#000;font-size:36px;color:var(--y);letter-spacing:.2em}
.pd .cur{animation:flash 1s steps(1) infinite}
.pd .lab{font-size:14px;letter-spacing:0;color:var(--c);margin-right:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pad button{height:56px;border-radius:6px;background:#222120;font-size:24px;color:#f1eee6;box-shadow:inset 0 1px 0 rgba(255,255,255,.1);transition:background-color .1s}
.pad button:active{background:#3a3834}
.pad button.sm{font-size:14px;color:#b9b4a9}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.quick button{min-height:44px;text-align:left;padding:0 10px;font-size:13px;color:var(--c);background:#000;border-radius:4px}
.quick button b{color:var(--y);font-weight:400;margin-right:6px}
.quick button:active{background:#1a1a1a}

@media (prefers-reduced-motion:reduce){
  #old.wipe{animation:none;display:none}
  .sheet,.scrim{transition-duration:.01s!important}
  .heart{animation:none}
  .flash,.pd .cur{animation:none}
}
</style>

<script>
(function(){
'use strict';
var KEY='app047:';
function $(id){return document.getElementById(id);}
function load(k,d){try{var v=localStorage.getItem(KEY+k);return v===null?d:JSON.parse(v);}catch(e){return d;}}

var RM=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:false};

var AC=null;

/* ---------- data ---------- */
var U={me:{h:'台北小魚',c:'c'},a:{h:'捷運觀察員',c:'y'},b:{h:'阿嬤的滷肉飯',c:'r'},c:{h:'台中晴天',c:'g'},d:{h:'貓奴小林',c:'m'},e:{h:'高雄港邊',c:'c'},f:{h:'夜市王',c:'y'},g:{h:'颱風觀測站',c:'g'}};

  {id:501,u:'a',t:ago(6),x:'板南線又延誤 7 分鐘，市政府站月台擠到像罐頭。#通勤',l:12,rp:[{u:'c',x:'文湖線也卡住，今天是水逆吧',t:ago(4)},{u:'me',x:'我在忠孝復興，已經放棄了',t:ago(2)}]},

];
var posts=load('posts',null);if(!Array.isArray(posts))posts=SEED;

/* ---------- cell layout ---------- */
function isW(ch){return !/[\u0000-˿ -⁯]/.test(ch);}
function esc(c){return c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':c==='"'?'&quot;':c;}
/* text -> [[{ch,cc,hash}]] lines within width cells */
function lay(text,width){var out=[],line=[],w=0,conceal=false,hash=false,i=0,tokens=[];
  for(i=0;i<text.length;i++){var ch=text[i];if(ch==='['&&text[i+1]==='['){conceal=true;i++;continue;}if(ch===']'&&text[i+1]===']'){conceal=false;i++;continue;}
    if(ch==='#')hash=true;else if(ch===' '||ch==='。'||ch==='，')hash=false;
    tokens.push({ch:ch,cc:conceal,h:hash});}
  /* group ascii words */
  var words=[],cur=[];tokens.forEach(function(t){if(!isW(t.ch)&&t.ch!==' '){cur.push(t);}else{if(cur.length){words.push(cur);cur=[];}words.push([t]);}});if(cur.length)words.push(cur);
  words.forEach(function(wd){var ww=0;wd.forEach(function(t){ww+=isW(t.ch)?2:1;});
    if(w+ww>width){if(ww<=12||w>0){out.push(line);line=[];w=0;if(wd.length===1&&wd[0].ch===' ')return;}}
    wd.forEach(function(t){var cw=isW(t.ch)?2:1;if(w+cw>width){out.push(line);line=[];w=0;}line.push(t);w+=cw;});});
  if(line.length)out.push(line);return out;}
function cellsHTML(line,fg){var h='',cls=null,buf='';
  function flush(){if(buf){h+='<span class="'+cls+'">'+buf+'</span>';buf='';}}

$('fast').addEventListener('click',function(e){var b=e.target.closest('.fk');if(!b)return;var f=fastNow[+b.dataset.k];if(!f)return;haptic(8);beep(1100,.03);
  if(f[1]===-1){send();return;}if(f[1]===-2){clearDraft();return;}
  if(f[1]===-3||f[1]===-4){var p=byId(cur);if(!p)return;if(f[1]===-3)toggleLike(p.id);else{replyTo=p.id;save('replyTo',replyTo);go(300);}return;}
  go(f[1]);});
$('prevB').addEventListener('click',function(){haptic(6);stepSub(-1);});
$('nextB').addEventListener('click',function(){haptic(6);stepSub(1);});
$('revB').addEventListener('click',function(){reveal=!reveal;this.setAttribute('aria-pressed',String(reveal));pageEl.classList.toggle('reveal',reveal);haptic(8);beep(reveal?1800:900,.04);});
$('holdB').addEventListener('click',function(){held=!held;this.setAttribute('aria-pressed',String(held));haptic(8);beep(held?600:1200,.04);draw();});
/* swipe on the tv for subpages */
(function(){var tv=$('tv'),sx=0,sy=0,on=false;
  tv.addEventListener('pointerdown',function(e){if(e.target.closest('textarea'))return;on=true;sx=e.clientX;sy=e.clientY;});
  tv.addEventListener('pointerup',function(e){if(!on)return;on=false;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4){stepSub(dx<0?1:-1);}});
  tv.addEventListener('pointercancel',function(){on=false;});})();

/* ---------- keypad sheet ---------- */
var sheet=$('sheet'),scrim=$('scrim'),kbuf='',lastFocus=null;
(function(){var h='';['1','2','3','4','5','6','7','8','9'].forEach(function(d){h+='<button data-d="'+d+'">'+d+'</button>';});h+='<button class="sm" data-d="del">刪除</button><button data-d="0">0</button><button class="sm" data-d="x">取消</button>';$('pad').innerHTML=h;
  var q='';[[100,'索引'],[101,'時間線'],[102,'熱門'],[200,'我的'],[300,'發文'],[888,'說明']].forEach(function(x){q+='<button data-q="'+x[0]+'"><b>'+x[0]+'</b>'+x[1]+'</button>';});$('quick').innerHTML=q;})();
function pd(){var s=(kbuf+'___').slice(0,3),h='<span class="lab">跳到</span>P';for(var i=0;i<3;i++)h+=i===kbuf.length?'<span class="cur">_</span>':'<span>'+s[i]+'</span>';$('pd').innerHTML=h;typed=kbuf;$('lcdN').textContent=kbuf?padTyped():String(cur);var hd=pageEl.firstChild;if(hd&&!rolling)hd.outerHTML=header(cur);}
function openPad(){lastFocus=document.activeElement;kbuf='';pd();sheet.style.transform='';sheet.classList.add('on');scrim.classList.add('on');haptic(6);}
function closePad(){if(!sheet.classList.contains('on'))return;sheet.classList.remove('on','drag');sheet.style.transform='';scrim.classList.remove('on');kbuf='';typed='';$('lcdN').textContent=String(cur);var hd=pageEl.firstChild;if(hd&&!rolling)hd.outerHTML=header(cur);if(lastFocus&&lastFocus.focus)try{lastFocus.focus({preventScroll:true});}catch(e){}}
function digit(d){if(kbuf.length===0&&(d==='0'||d==='9')){haptic([20,30,20]);beep(300,.1);return;}kbuf+=d;beep(1300,.025);haptic(4);pd();if(kbuf.length===3){var n=+kbuf;setTimeout(function(){closePad();go(n);},160);}}
$('lcd').addEventListener('click',openPad);
scrim.addEventListener('click',closePad);
$('pad').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var d=b.dataset.d;if(d==='x'){closePad();return;}if(d==='del'){kbuf=kbuf.slice(0,-1);pd();haptic(4);return;}digit(d);});
$('quick').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;closePad();go(+b.dataset.q);});
(function(){var sy=0,dy=0,t0=0,on=false;
  sheet.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;on=true;sy=e.clientY;dy=0;t0=e.timeStamp;sheet.classList.add('drag');try{sheet.setPointerCapture(e.pointerId);}catch(x){}});
  sheet.addEventListener('pointermove',function(e){if(!on)return;dy=e.clientY-sy;sheet.style.transform='translateY('+(dy>0?dy:dy/6).toFixed(1)+'px)';scrim.style.opacity=Math.max(0,1-dy/sheet.offsetHeight).toFixed(2);});
  function end(e){if(!on)return;on=false;sheet.classList.remove('drag');scrim.style.opacity='';if(dy>sheet.offsetHeight*.35||dy/Math.max(1,e.timeStamp-t0)>.6)closePad();else sheet.style.transform='';}
  sheet.addEventListener('pointerup',end);sheet.addEventListener('pointercancel',end);})();
document.addEventListener('keydown',function(e){if(e.target.tagName==='TEXTAREA'){if(e.key==='Escape')e.target.blur();return;}
  if(e.key==='Escape'){closePad();return;}
  if(/^[0-9]$/.test(e.key)){if(!sheet.classList.contains('on'))openPad();digit(e.key);}
  else if(e.key==='ArrowRight')stepSub(1);else if(e.key==='ArrowLeft')stepSub(-1);});

/* ---------- sizing ---------- */
function fit(){var tv=$('tv'),w=tv.clientWidth-16,h=tv.clientHeight-8;var cw=Math.floor(w/40*100)/100,rh=Math.max(18,Math.min(27,Math.floor(h/24)));
  document.documentElement.style.setProperty('--cw',cw+'px');document.documentElement.style.setProperty('--rh',rh+'px');}
window.addEventListener('resize',fit);

/* ---------- clocks ---------- */
function tick(){var d=new Date();$('clock').textContent=d.getHours()+':'+pad2(d.getMinutes());}
tick();setTimeout(function(){tick();setInterval(tick,60000);},(60-new Date().getSeconds())*1000);
setInterval(function(){if(document.hidden)return;var c=$('hclock');if(c){var d=new Date();c.textContent=pad2(d.getHours())+':'+pad2(d.getMinutes())+'/'+pad2(d.getSeconds());}},1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){tick();}});

/* ---------- backdrop: a giant dim teletext page ---------- */
(function(){var g='',R2=function(s){return function(){s=(s*16807)%2147483647;return s/2147483647;};}(5),cols=['#1a2cff','#ff2a1f','#19e619','#ffef1a','#19f0f0','#ff3dff'];
  for(var y=0;y<90;y+=3)for(var x=0;x<160;x+=2){var r=R2();if(y<12&&y>=3){if(r<.9)g+='<rect x="'+x+'" y="'+y+'" width="2" height="3" fill="#1a2cff" opacity=".35"/>';continue;}
    if(r<.05)g+='<rect x="'+x+'" y="'+y+'" width="2" height="3" fill="'+cols[Math.floor(R2()*6)]+'" opacity=".22"/>';}
  for(var i=0;i<4;i++)g+='<rect x="'+(i*40)+'" y="84" width="40" height="3" fill="'+['#ff2a1f','#19e619','#ffef1a','#19f0f0'][i]+'" opacity=".4"/>';
  $('bd').innerHTML='<rect width="160" height="90" fill="#050505"/>'+g;})();

fit();built=build(cur);draw();restartRotate();
})();
</script>
</body>
</html>
