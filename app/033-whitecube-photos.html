<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="白廳">
<title>白廳 · 相簿</title>
<meta name="description" content="把相簿做成美術館白盒子的照片 App：時刻瀑布流、雙指縮放、共享元素放大的燈箱，相簿是一間間可以走進去的展間。收錄於 100 Creative HTML Works（App 033・美術館白盒）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/033-whitecube-photos.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff'/%3E%3Cpath d='M8 50 22 36v28M56 50 42 36v28M22 36h20M8 50h48' stroke='%23111' stroke-width='1.6' fill='none'/%3E%3Crect x='26' y='18' width='12' height='14' fill='%23111'/%3E%3Ccircle cx='44' cy='30' r='2.2' fill='%23d0021b'/%3E%3C/svg%3E">
<style>
:root{
  --white:#ffffff;
  --ink:#111111;
  --mid:#6b6b6b;
  --faint:#c9c9c7;
  --wash:#f6f6f4;
  --red:#d0021b;
  --out:cubic-bezier(.2,.9,.25,1);
  --soft:cubic-bezier(.4,0,.2,1);
  --hel:"Helvetica Neue","Helvetica","PingFang TC","Heiti TC",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:300 15px/1.5 var(--hel);color:var(--ink);background:var(--white);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:1.5px solid var(--ink);outline-offset:4px}
svg{display:block}
img{display:block;-webkit-user-drag:none;user-select:none}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.gallery,.label{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--white);isolation:isolate}
@media (min-width:521px){
  body{background:#f4f4f2}
  .stage{display:flex;align-items:center;justify-content:center;gap:72px;padding:24px}
  .gallery{display:block;position:fixed;inset:0;z-index:0;background:linear-gradient(#e9e9e6 0,#f7f7f5 16%,#fbfbfa 60%,#f1f1ee 78%);}
  .gallery::before{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(#c9c8c3,#d8d7d2 30%,#cfcdc7);}
  .gallery::after{content:"";position:absolute;left:0;right:0;bottom:22%;height:9px;background:#fdfdfc;box-shadow:0 1px 0 #d9d8d3}
  .gallery i{position:absolute;top:0;width:34%;height:62%;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);opacity:.8}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:52px;padding:9px;background:#141414;
    box-shadow:0 1px 0 #3a3a3a inset,0 18px 26px -18px rgba(40,36,30,.45);z-index:1}
  .screen{inset:9px;border-radius:43px}
  .label{display:block;position:relative;z-index:1;width:236px;align-self:center;margin-top:120px;padding:18px 20px 20px;background:#fff;box-shadow:0 1px 2px rgba(60,55,45,.12)}
  .label h1{font:400 20px/1.25 var(--hel)}
  .label p{margin-top:6px;font-size:13px;line-height:1.55;color:#555}
  .label .red{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-top:12px}
}
@media (min-width:521px) and (max-width:860px){.label{display:none}}

.status{position:absolute;top:0;left:0;right:0;z-index:45;background:#fff;display:flex;align-items:center;justify-content:space-between;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 30px 0 34px;font:500 16px/1 var(--hel);color:var(--ink);pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}
.home{position:absolute;left:50%;bottom:calc(7px + env(safe-area-inset-bottom)*.3);width:130px;height:5px;margin-left:-65px;border-radius:3px;background:var(--ink);z-index:80;pointer-events:none}

/* ---------- head: the two words are the navigation ---------- */
.head{position:absolute;top:0;left:0;right:0;z-index:20;padding:calc(52px + env(safe-area-inset-top)) 16px 28px 24px;display:flex;align-items:center;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,0);transition:box-shadow .3s var(--soft)}
.head.sc{box-shadow:0 1px 0 #ececea}
.words{position:relative;display:flex;gap:6px;flex:1}
.words button{height:48px;padding:0 6px;margin-left:-6px;font:300 30px/48px var(--hel);letter-spacing:.02em;color:var(--faint);transition:color .35s var(--soft)}
.words button + button{margin-left:10px}
.words button[aria-selected=true]{color:var(--ink)}
.words button:active{color:var(--mid)}
.tools{display:flex}
.tools button{width:44px;height:44px;display:grid;place-items:center}
.tools button svg{width:24px;height:24px;transition:transform .25s var(--out)}
.tools button:active svg{transform:scale(.86)}
.count{position:absolute;left:24px;top:calc(104px + env(safe-area-inset-top));font-size:13px;color:var(--mid);z-index:21;pointer-events:none}

.views{position:absolute;inset:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:calc(128px + env(safe-area-inset-top)) 0 calc(56px + env(safe-area-inset-bottom));visibility:hidden;overscroll-behavior:contain}
.view.on{visibility:visible;animation:settle .5s var(--out)}
@keyframes settle{from{transform:translateX(var(--from,18px));opacity:0}to{transform:none;opacity:1}}

/* ---------- moments ---------- */
.day{padding:0 24px;margin-top:34px}
.day:first-child{margin-top:8px}
.day h2{display:flex;align-items:baseline;gap:12px;font:300 22px/1.2 var(--hel);margin-bottom:14px}
.day h2 span{font-size:13px;color:var(--mid)}
.mason{display:flex;gap:var(--gap,14px);align-items:flex-start}
.mason .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--vgap,14px)}
.ph{position:relative;display:block;width:100%;text-align:left}
.ph .fr{position:relative;display:block;width:100%;background:var(--tone,#ddd);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:filter 1.6s var(--soft)}
.ph img.dev{filter:contrast(.35) brightness(1.55) saturate(.2)}
.ph:active .fr{transform:scale(.985)}
.ph .fr{transition:transform .2s var(--out)}
.ph .dot{position:absolute;right:-4px;bottom:-4px;width:9px;height:9px;border-radius:50%;background:var(--red)}
.ph .cap{display:none;margin-top:12px;font-size:13px;line-height:1.45;color:var(--mid);padding-right:30%}
.ph .cap b{display:block;font-weight:400;font-size:15px;color:var(--ink)}
.c1 .ph .cap{display:block}
.c1{--vgap:44px}
.c3{--gap:5px;--vgap:5px}
.c3 .day{padding:0 12px}
.c3 .ph .dot{right:4px;bottom:4px;width:7px;height:7px}
.endnote{text-align:center;font-size:13px;color:var(--mid);margin:48px 0 10px}

/* ---------- albums: rooms ---------- */
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x pan-y}
.pager::-webkit-scrollbar{display:none}
.roomcell{flex:none;width:100%;scroll-snap-align:center;padding:0 24px}
.room{position:relative;display:block;width:100%;height:300px;perspective:430px;perspective-origin:50% 44%;overflow:hidden;background:#fbfbfa}
.cube{position:absolute;left:50%;top:44%;width:0;height:0;transform-style:preserve-3d;transition:transform .2s linear}
.wall{position:absolute;left:0;top:0;transform-style:preserve-3d;backface-visibility:hidden}
.w-back{width:250px;height:176px;margin:-88px 0 0 -125px;transform:translateZ(-210px);background:#ffffff}
.w-l{width:440px;height:176px;margin:-88px 0 0 -220px;transform:translateX(-125px) rotateY(90deg);background:linear-gradient(90deg,#f2f2ef,#fafaf8)}
.w-r{width:440px;height:176px;margin:-88px 0 0 -220px;transform:translateX(125px) rotateY(-90deg);background:linear-gradient(-90deg,#f2f2ef,#fafaf8)}
.w-f{width:250px;height:440px;margin:-220px 0 0 -125px;transform:translateY(88px) rotateX(90deg);background:linear-gradient(#cfcdc7,#e2e1dc)}
.w-c{width:250px;height:440px;margin:-220px 0 0 -125px;transform:translateY(-88px) rotateX(-90deg);background:#f7f7f5}
.w-c::before,.w-c::after{content:"";position:absolute;top:30px;bottom:30px;width:3px;background:#d8d8d4;left:70px}
.w-c::after{left:auto;right:70px}
.hang{position:absolute;background:var(--tone,#ccc);outline:1px solid rgba(0,0,0,.08)}
.hang img{width:100%;height:100%;object-fit:cover}
.w-back .hang,.w-l .hang,.w-r .hang{box-shadow:0 2px 3px -1px rgba(60,55,45,.28)}
.room .emptyroom{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;font-size:15px;color:var(--mid)}
.roomtx{padding-top:18px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.roomtx h3{font:300 28px/1.15 var(--hel);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roomtx span{flex:none;font-size:13px;color:var(--mid)}
.roommeta{font-size:13px;color:var(--mid);margin-top:4px}
.pagerpos{padding:14px 24px 0;font-size:13px;color:var(--mid);font-variant-numeric:tabular-nums}
.directory{margin:34px 24px 0}
.directory h4{font:400 15px/1.3 var(--hel);margin-bottom:6px}
.dirrow{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;text-align:left}
.dirrow + .dirrow{border-top:1px solid #efefed}
.dirrow .fl{width:28px;font-size:13px;color:var(--mid);font-variant-numeric:tabular-nums}
.dirrow .nm{flex:1;font-size:18px}
.dirrow .n{font-size:13px;color:var(--mid)}
.dirrow .thumb{width:40px;height:40px;background:var(--tone,#ddd);overflow:hidden}
.dirrow .thumb img{width:100%;height:100%;object-fit:cover}
.dirrow:active{background:var(--wash)}

/* ---------- album page ---------- */
.apage{position:absolute;inset:0;z-index:25;background:#fff;transform:translateX(102%);visibility:hidden;transition:transform .5s var(--out),visibility 0s .5s;overflow-y:auto;overflow-x:hidden;padding:calc(48px + env(safe-area-inset-top)) 0 calc(56px + env(safe-area-inset-bottom))}
.abar{position:sticky;top:0;z-index:3;display:flex;align-items:center;height:48px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,0);transition:box-shadow .3s var(--soft)}
.abar .at{position:absolute;left:96px;right:96px;text-align:center;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(6px);transition:opacity .25s var(--soft),transform .25s var(--out);pointer-events:none}
.abar.sc{box-shadow:0 1px 0 #ececea}
.abar.sc .at{opacity:1;transform:none}
.apage.on{transform:none;visibility:visible;transition:transform .5s var(--out)}
.back{display:flex;align-items:center;gap:2px;height:44px;margin-left:12px;padding:0 10px 0 4px;font-size:16px}
.back svg{width:22px;height:22px}
.back:active{color:var(--mid)}
.ahead{padding:10px 24px 22px}
.ahead h2{font:300 36px/1.1 var(--hel)}
.ahead p{font-size:13px;color:var(--mid);margin-top:8px}
.aacts{display:flex;gap:22px;margin-top:10px}
.txtbtn{height:44px;font-size:15px;font-weight:400;color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px;text-decoration-color:var(--faint)}
.txtbtn:active{color:var(--mid)}
.txtbtn.arm{color:var(--red);text-decoration-color:var(--red)}
.apage .mason{padding:0 24px}

/* ---------- lightbox ---------- */
.lb{position:absolute;inset:0;z-index:40;visibility:hidden;pointer-events:none}
.lb.on{visibility:visible;pointer-events:auto}
.lbbg{position:absolute;inset:0;background:#fff;opacity:0;transition:opacity .38s var(--soft)}
.lb.on .lbbg{opacity:1}
.lbtop{position:absolute;top:calc(48px + env(safe-area-inset-top));left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 12px;z-index:3;transition:transform .3s var(--out)}
.lbtop .idx{font-size:13px;color:var(--mid);font-variant-numeric:tabular-nums;padding-right:8px}
.lbstage{position:absolute;left:0;right:0;top:calc(100px + env(safe-area-inset-top));height:var(--sh,470px);touch-action:none;overflow:hidden;z-index:2}
.lbimg{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;background:var(--tone,#ddd)}
.lbimg img{width:100%;height:100%}
.lbimg.anim{transition:transform .46s var(--out)}
.lblabel{position:absolute;left:24px;right:24px;top:calc(100px + env(safe-area-inset-top) + var(--sh,470px) + 18px);z-index:2;transition:transform .35s var(--out);padding-right:24%}
.lblabel b{display:block;font:400 17px/1.3 var(--hel)}
.lblabel p{font-size:13px;color:var(--mid);margin-top:3px;line-height:1.5}
.lblabel .red{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-left:8px;vertical-align:1px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.lblabel .red.on{transform:scale(1)}
.lbbar{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);padding:0 12px;z-index:3}
.lbbar button{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--ink)}
.lbbar button svg{width:24px;height:24px;transition:transform .25s var(--out)}
.lbbar button:active svg{transform:scale(.85)}
.lb.bare .lbtop{transform:translateY(-120px)}
.lb.bare .lblabel,.lb.bare .lbbar{transform:translateY(240px)}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(17,17,17,.18);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:#fff;padding:10px 24px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .48s var(--out),visibility 0s .48s;touch-action:none;max-height:82%;overflow-y:auto;box-shadow:0 -1px 0 #ececea}
.sheet.on{transform:none;visibility:visible;transition:transform .48s var(--out)}
.sheet.drag{transition:none}
.grab{width:38px;height:4px;border-radius:2px;background:#d6d6d3;margin:4px auto 16px}
.sheet h3{font:300 26px/1.2 var(--hel);margin-bottom:10px}
.pick{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;text-align:left}
.pick + .pick{border-top:1px solid #efefed}
.pick .nm{flex:1;font-size:17px}
.pick .n{font-size:13px;color:var(--mid)}
.pick svg{width:22px;height:22px;flex:none}
.pick .ck{opacity:0;transition:opacity .2s}
.pick[aria-checked=true] .ck{opacity:1}
.newrow{display:flex;gap:10px;margin-top:14px;align-items:center}
.newrow input{flex:1;height:48px;border:0;border-bottom:1px solid var(--ink);background:transparent;font-size:17px;outline:none;padding:0 2px;border-radius:0}
.newrow input::placeholder{color:#8d8d8a}
.newrow button{height:48px;padding:0 6px;font-size:15px;font-weight:400}
.newrow button:active{color:var(--mid)}

.flash{position:absolute;inset:0;z-index:70;background:#111;opacity:0;pointer-events:none}
.flash.go{animation:shut .32s var(--soft)}
@keyframes shut{0%{opacity:0}30%{opacity:.9}100%{opacity:0}}

.toast{position:absolute;left:24px;right:24px;bottom:calc(30px + env(safe-area-inset-bottom));z-index:75;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:0 6px 0 18px;background:var(--ink);color:#fff;font-size:15px;transform:translateY(130px);visibility:hidden;transition:transform .45s var(--out),visibility 0s .45s}
.toast.on{transform:none;visibility:visible;transition:transform .45s var(--out)}
.toast button{height:44px;padding:0 12px;font-weight:400;text-decoration:underline;text-underline-offset:4px}

@media (prefers-reduced-motion:reduce){
  .view.on{animation:none}
  .lbimg.anim,.apage,.sheet,.toast,.cube,.lbtop,.lblabel,.lbbar,.ph img,.head,.abar,.abar .at{transition-duration:.01s}
  .flash.go{animation-duration:.01s}
}
</style>
</head>
<body>
<div class="stage">
  <div class="gallery" aria-hidden="true"><i style="left:8%"></i><i style="left:58%"></i></div>
  <div class="device">
    <div class="screen" id="screen">
      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="g">
          <svg width="18" height="12" viewBox="0 0 18 12"><path d="M1.5 11V9M6 11V7M10.5 11V4.5M15 11V1.5" stroke="#111" stroke-width="1.6" stroke-linecap="square"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.2 6.4 9.4a2.3 2.3 0 0 1 3.2 0zM3.6 6.6a6.3 6.3 0 0 1 8.8 0M1 3.9a10 10 0 0 1 14 0" stroke="#111" stroke-width="1.4" fill="none"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".7" y=".7" width="21.6" height="10.6" stroke="#111" stroke-width="1.2" fill="none"/><rect id="batt" x="2.5" y="2.5" width="16" height="7" fill="#111"/><path d="M24 4.2v3.6" stroke="#111" stroke-width="1.4"/></svg>
        </span>
      </div>

      <header class="head">
        <div class="words" role="tablist" aria-label="檢視">
          <button role="tab" aria-selected="true" data-tab="moments">時刻</button>
          <button role="tab" aria-selected="false" data-tab="albums">相簿</button>
        </div>
        <div class="tools">
          <button id="densBtn" aria-label="切換欄數"><svg viewBox="0 0 24 24" id="densIc"></svg></button>
          <button id="camBtn" aria-label="拍一張"><svg viewBox="0 0 24 24"><path d="M3.5 7.5h4l1.6-2.2h5.8l1.6 2.2h4v11h-17z" stroke="#111" stroke-width="1.1" fill="none" stroke-linejoin="miter"/><circle cx="12" cy="12.8" r="3.6" stroke="#111" stroke-width="1.1" fill="none"/><circle cx="17.6" cy="10" r=".9" fill="#d0021b"/></svg></button>
        </div>
      </header>
      <div class="count" id="count"></div>

      <main class="views">
        <section class="view on" id="v-moments" aria-label="時刻"><div id="moments"></div><p class="endnote" id="endnote"></p></section>
        <section class="view" id="v-albums" aria-label="相簿">
          <div class="pager" id="pager"></div>
          <p class="pagerpos" id="pagerpos"></p>
          <div class="directory"><h4>展覽目錄</h4><div id="dir"></div></div>
        </section>
      </main>

      <section class="apage" id="apage" aria-hidden="true" aria-label="展間"></section>

      <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="照片">
        <div class="lbbg"></div>
        <div class="lbtop"><button class="back" id="lbClose"><svg viewBox="0 0 22 22"><path d="M13.5 4.5 7 11l6.5 6.5" stroke="#111" stroke-width="1.3" fill="none"/></svg><span id="lbFrom">時刻</span></button><span class="idx" id="lbIdx"></span></div>
        <div class="lbstage" id="lbStage"><div class="lbimg" id="lbImg"><img alt="" id="lbPic"></div></div>
        <div class="lblabel" id="lbLabel"></div>
        <div class="lbbar">
          <button id="lbFav" aria-label="貼紅點收藏"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" stroke="#111" stroke-width="1.1" fill="none" id="favRing"/><circle cx="12" cy="12" r="4" fill="#d0021b" id="favDot" style="opacity:0"/></svg><span id="favTx">紅點</span></button>
          <button id="lbAlbum" aria-label="加入展間"><svg viewBox="0 0 24 24"><path d="M3 18 8 13v8M21 18l-5-5v8M8 13h8M3 18h18" stroke="#111" stroke-width="1.1" fill="none"/><path d="M12 3.5v6M9 6.5h6" stroke="#111" stroke-width="1.1"/></svg>展間</button>
          <button id="lbInfo" aria-label="隱藏標籤"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="10" stroke="#111" stroke-width="1.1" fill="none"/><path d="M7 10.5h7M7 13.5h4" stroke="#111" stroke-width="1.1"/></svg><span id="infoTx">標籤</span></button>
          <button id="lbDel" aria-label="刪除"><svg viewBox="0 0 24 24"><path d="M5 7h14M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13" stroke="#111" stroke-width="1.1" fill="none"/></svg><span id="delTx">刪除</span></button>
        </div>
      </div>

      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="展間">
        <div class="grab"></div>

      var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), ns = Math.max(.6, Math.min(5, start.s*d/start.d)), mx = (p[0].x + p[1].x)/2, my = (p[0].y + p[1].y)/2;
      var r = st.getBoundingClientRect(), ox = start.mx - r.left - box.x - start.zx, oy = start.my - r.top - box.y - start.zy;
      zs = ns; zx = start.zx + ox - ox*ns/start.s + (mx - start.mx); zy = start.zy + oy - oy*ns/start.s + (my - start.my); applyZ(false);
    } else if (mode === 'pan'){ zx = start.zx + e.clientX - start.x; zy = start.zy + e.clientY - start.y; applyZ(false); }
    else if (mode === 'swipe'){
      var dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (dy > 10 && Math.abs(dy) > Math.abs(dx)){ var k = Math.max(.6, 1 - dy/900); zs = k; zx = dx*.5 + box.w*(1-k)/2; zy = dy; applyZ(false); $('lb').querySelector('.lbbg').style.opacity = Math.max(.2, 1 - dy/400); }

    if (mode === 'pan'){ mode = null; clampPan(); return; }

      mode = null; $('lb').querySelector('.lbbg').style.opacity = '';
      var dx = e.clientX - start.x, dy = e.clientY - start.y, dt = e.timeStamp - start.t;
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8){
        if (e.timeStamp - lastTap < 300){ // double tap zoom

          applyZ(true); clampPan(true); haptic(6); lastTap = 0; return;
        }

      }
      if (dy > 110 || (dy > 40 && dy/dt > .5)){ zs = 1; zx = zy = 0; closeLb(); return; }
      if (dx < -70 || (dx < -30 && dx/dt < -.4)) go(1);

  }

function clampPan(anim){

$('lbClose').addEventListener('click', closeLb);
$('lbFav').addEventListener('click', function(){ if (!lbP) return; lbP.fav = !lbP.fav; persist(); haptic(lbP.fav ? [6,20,10] : 6); tick(); $('favDot').style.opacity = lbP.fav ? 1 : 0; $('favTx').textContent = lbP.fav ? '已貼' : '紅點'; var r = $('lbRed'); if (r) r.classList.toggle('on', lbP.fav); refresh(); });
$('lbInfo').addEventListener('click', function(){ var on = $('lb').classList.toggle('bare'); $('infoTx').textContent = on ? '顯示' : '標籤'; haptic(5); });
$('lbDel').addEventListener('click', function(){
  if (!lbP) return; var p = lbP;
  if (p.del){ p.del = false; persist(); haptic(8); toast('「'+p.title+'」回到牆上'); refresh(); closeLb(); return; }
  p.del = true; persist(); haptic([10,30,10]); click(0, .12, 700, .3);
  var wasI = lbI; lbList.splice(lbI, 1); refresh();
  toast('「'+p.title+'」移到最近刪除', function(){ p.del = false; persist(); refresh(); });
  if (!lbList.length){ closeLb(); return; }
  lbI = Math.min(wasI, lbList.length - 1); setLb(lbList[lbI]); zx = 0; applyZ(false);

$('lbAlbum').addEventListener('click', function(){ if (lbP) openPick(lbP); });

  var t = e.target.closest('.ph'); if (!t) return;

// ---------- sheets ----------
var sheet = $('sheet'), scrim = $('scrim'), lastFocus = null;
function openSheet(html){ lastFocus = document.activeElement; $('sheetBody').innerHTML = html; sheet.style.transform = ''; sheet.classList.add('on'); scrim.classList.add('on'); haptic(6); }
function closeSheet(){ if (!sheet.classList.contains('on')) return; sheet.classList.remove('on','drag'); sheet.style.transform = ''; scrim.classList.remove('on'); if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); }
scrim.addEventListener('click', closeSheet);
var ck = '<svg viewBox="0 0 22 22"><rect x="2.5" y="2.5" width="17" height="17" stroke="#111" stroke-width="1.1" fill="none"/><path class="ck" d="M6 11.5 9.5 15 16.5 7" stroke="#111" stroke-width="1.4" fill="none"/></svg>';
function openPick(p){
  openSheet('<h3>掛進哪一間</h3><div id="picks">'+db.albums.map(function(a){ return '<button class="pick" role="checkbox" aria-checked="'+(a.ids.indexOf(p.id) >= 0)+'" data-pick="'+a.id+'">'+ck+'<span class="nm">'+esc(a.name)+'</span><span class="n">'+a.ids.length+' 件</span></button>'; }).join('')+'</div>'+
    '<div class="newrow"><input id="newName" maxlength="12" placeholder="新展間的名字" autocomplete="off"><button id="newGo">開展</button></div>');
  $('picks').addEventListener('click', function(e){ var b = e.target.closest('[data-pick]'); if (!b) return; var a = db.albums.filter(function(x){ return x.id === b.dataset.pick; })[0]; var i = a.ids.indexOf(p.id);
    if (i >= 0) a.ids.splice(i, 1); else a.ids.unshift(p.id); persist(); haptic(6); tick(); b.setAttribute('aria-checked', i < 0); b.querySelector('.n').textContent = a.ids.length+' 件'; setLb(p); applyZ(false); refresh(); });
  $('newGo').addEventListener('click', function(){ var n = $('newName').value.trim(); if (!n){ $('newName').focus(); haptic([6,30,6]); return; } db.albums.push({id:'a'+Date.now(), name:n, ids:[p.id]}); persist(); haptic([8,30,8]); closeSheet(); setLb(p); applyZ(false); refresh(); toast('「'+n+'」開展，掛上第一件'); });
}
function openNewAlbum(){
  openSheet('<h3>開一間新展間</h3><div class="newrow"><input id="newName" maxlength="12" placeholder="例如：十月的花蓮" autocomplete="off"><button id="newGo">開展</button></div>');
  $('newGo').addEventListener('click', function(){ var n = $('newName').value.trim(); if (!n){ $('newName').focus(); haptic([6,30,6]); return; } db.albums.push({id:'a'+Date.now(), name:n, ids:[]}); persist(); haptic([8,30,8]); closeSheet(); refresh(); toast('「'+n+'」開展了，去照片裡按「展間」'); });
}
function openRename(id){
  var a = db.albums.filter(function(x){ return x.id === id; })[0]; if (!a) return;
  openSheet('<h3>改展名</h3><div class="newrow"><input id="newName" maxlength="12" value="'+esc(a.name)+'" autocomplete="off"><button id="newGo">好了</button></div>');
  $('newGo').addEventListener('click', function(){ var n = $('newName').value.trim(); if (!n) return; a.name = n; persist(); haptic(8); closeSheet(); refresh(); renderAlbumPage(); });
}
sheet.addEventListener('keydown', function(e){ if (e.key === 'Enter' && e.target.id === 'newName'){ var g = $('newGo'); if (g) g.click(); } });
(function(){
  var sy = 0, dy = 0, t0 = 0, dragging = false;
  sheet.addEventListener('pointerdown', function(e){ if (e.target.closest('button,input')) return; dragging = true; sy = e.clientY; dy = 0; t0 = e.timeStamp; sheet.classList.add('drag'); try { sheet.setPointerCapture(e.pointerId); } catch(x){} });
  sheet.addEventListener('pointermove', function(e){ if (!dragging) return; dy = e.clientY - sy; var y = dy > 0 ? dy : dy/6; sheet.style.transform = 'translateY('+y.toFixed(1)+'px)'; scrim.style.opacity = Math.max(0, 1 - dy/sheet.offsetHeight).toFixed(2); });
  function end(e){ if (!dragging) return; dragging = false; sheet.classList.remove('drag'); scrim.style.opacity = ''; var v = dy/Math.max(1, e.timeStamp - t0); if (dy > sheet.offsetHeight*.35 || v > .6) closeSheet(); else sheet.style.transform = ''; }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ if (sheet.classList.contains('on')) closeSheet(); else if ($('lb').classList.contains('on')) closeLb(); else if (curAlbum) closeAlbum(); }
  if ($('lb').classList.contains('on') && !sheet.classList.contains('on')){ if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); }
});

// ---------- camera ----------
var PLACES = [['台北 大稻埕','night'],['台北 大稻埕','cafe'],['台北 大稻埕','rain'],['新北 淡水','river'],['台東 都蘭','sea'],['新北 坪林','tea'],['台東 池上','field']];
$('camBtn').addEventListener('click', function(){
  var q = PLACES[Math.floor(Math.random()*PLACES.length)], ars = ['p','l','s','t'];
  var p = {id:'c'+Date.now(), t:Date.now(), place:q[0], gen:q[1], title:'剛剛', ar:AR[ars[Math.floor(Math.random()*4)]], seed:Math.floor(Math.random()*1e6), fav:false, del:false};
  db.photos.push(p); persist();

  shutter(); haptic([4,20,14]);

  toast('顯影中：'+q[0], function(){ db.photos = db.photos.filter(function(x){ return x !== p; }); persist(); refresh(); });
});

// ---------- tabs ----------
var tab = 'moments';
function switchTab(t){
  if (t === tab){ $('v-'+t).scrollTo({top:0, behavior: reduce ? 'auto' : 'smooth'}); return; }
  var dir = t === 'albums' ? 1 : -1; tab = t; haptic(6);
  document.querySelectorAll('.words [role=tab]').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.tab === t); });
  document.querySelectorAll('.view').forEach(function(v){ var on = v.id === 'v-'+t; v.classList.toggle('on', on); if (on) v.style.setProperty('--from', (dir*22)+'px'); });
  $('densBtn').style.visibility = t === 'moments' ? '' : 'hidden';
  document.querySelector('.head').classList.toggle('sc', $('v-'+t).scrollTop > 4);
