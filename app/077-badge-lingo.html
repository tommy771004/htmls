<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cdbf94">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="徽章語">
<title>徽章語 · 台語學習</title>
<meta name="description" content="用童軍刺繡徽章學台語：沿著縫線關卡路徑上課，選擇題與點字造句、生命線與經驗值，每過一關就把徽章縫上肩帶。收錄於 100 Creative HTML Works（App 077・童軍刺繡徽章）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/077-badge-lingo.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23cdbf94'/%3E%3Cpath d='M32 6 56 14v17c0 15-11 24-24 29C19 55 8 46 8 31V14z' fill='%2327405e' stroke='%23d9a22a' stroke-width='4'/%3E%3Cpath d='M20 30h24M20 38h16' stroke='%23f4ecd4' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --kh:#cdbf94;--kh2:#bfb083;--kh3:#a4966a;--khl:#ddd2ae;
  --ol:#4d5530;--ol2:#3a4125;--ink:#2c311d;--ink2:#4f5536;
  --red:#b3342b;--gold:#d9a22a;--cream:#f4ecd4;--navy:#27405e;--grn:#3f6b3a;--brn:#8a3b2a;
  --cond:"Avenir Next Condensed","Avenir Next","PingFang TC",sans-serif;
  --sans:"PingFang TC","Heiti TC",system-ui,sans-serif;
  --bounce:cubic-bezier(.34,1.56,.5,1);--out:cubic-bezier(.2,.85,.25,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.45 var(--sans);color:var(--ink);background:var(--kh);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--navy);outline-offset:3px;border-radius:8px}
svg{display:block}
.c{font-family:var(--cond);font-weight:700}
.tl{font-family:"Helvetica Neue","Lucida Grande",sans-serif;font-weight:500;letter-spacing:0}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:var(--kh)}
.twill{position:absolute;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(55deg,rgba(80,70,40,.075) 0 1.5px,transparent 1.5px 4px),repeating-linear-gradient(-35deg,rgba(255,250,230,.08) 0 1px,transparent 1px 6px)}
@media (min-width:521px){
  body{background:#b9aa7c}
  .stage{display:flex;align-items:center;justify-content:center;gap:60px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:54px;padding:12px;z-index:1;background:var(--ol);box-shadow:inset 0 0 0 1px #5d6640,0 14px 26px -12px rgba(40,36,15,.7)}
  .device::before{content:"";position:absolute;inset:5px;border-radius:49px;border:2px dashed rgba(244,236,212,.55);pointer-events:none}
  .screen{inset:12px;border-radius:42px}
  .caption{display:block;position:relative;z-index:1;width:260px;color:var(--ink)}
  .caption b{display:block;font:700 56px/1.05 var(--sans);color:var(--ol2)}
  .caption b span{display:block;font:700 22px/1.4 var(--cond);color:var(--red);letter-spacing:.04em}
  .caption p{margin-top:12px;font-size:15px;line-height:1.65;color:var(--ink2)}
}
@media (min-width:521px) and (max-width:900px){.caption{display:none}}

.status{position:absolute;top:0;left:0;right:0;z-index:40;height:calc(46px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 32px;display:flex;align-items:center;justify-content:space-between;font:700 16px/1 var(--cond);color:var(--ink);pointer-events:none}
.status .gl{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}

/* top bar */
.hdbg{position:absolute;top:0;left:0;right:0;z-index:19;height:calc(100px + env(safe-area-inset-top));background:var(--kh);box-shadow:0 3px 0 var(--kh2)}
.hdbg::after{content:"";position:absolute;left:10px;right:10px;bottom:5px;border-top:2px dashed rgba(58,65,37,.3)}
.top{position:absolute;top:calc(46px + env(safe-area-inset-top));left:0;right:0;z-index:20;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.top button{height:44px;display:flex;align-items:center;gap:6px;padding:0 6px;border-radius:10px;transition:transform .15s}
.top button:active{transform:scale(.92)}
.hearts{display:flex;gap:1px}
.hearts svg{width:24px;height:22px}
.xp b,.fire b{font:700 20px/1 var(--cond)}
.xp svg,.fire svg{width:24px;height:24px}

/* pages */
.pages{position:absolute;inset:0;z-index:2}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;padding:calc(112px + env(safe-area-inset-top)) 0 calc(110px + env(safe-area-inset-bottom))}
.page::-webkit-scrollbar{display:none}
.page[hidden]{display:none}
.page.in{animation:pin .4s var(--out)}
@keyframes pin{from{transform:translateY(18px)}}

/* path */
.unit{position:relative;width:100%;aspect-ratio:390/560}
.unit>svg{position:absolute;inset:0;width:100%;height:100%}
.tape{position:absolute;left:50%;top:2.5%;transform:translateX(-50%);min-width:220px;height:46px;padding:0 22px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--ol);color:var(--cream);white-space:nowrap}
.tape::before{content:"";position:absolute;inset:4px 3px;border-top:1.5px dashed rgba(244,236,212,.6);border-bottom:1.5px dashed rgba(244,236,212,.6)}
.tape b{font:700 15px/1 var(--cond);color:var(--gold);letter-spacing:.06em}
.tape span{font-size:16px;font-weight:600}
.unit.locked .tape{background:var(--kh3);color:#3d4228}
.unit.locked .tape b{color:#4a4f32}
.knot{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;display:grid;place-items:center;transition:transform .2s var(--bounce)}
.knot:active{transform:scale(.9)}
.knot svg{width:64px;height:64px}
.knot .n{position:absolute;inset:0;display:grid;place-items:center;font:700 24px/1 var(--cond);color:var(--cream);padding-top:1px}
.knot.lock .n{color:#6d6443}
.knot.cur{width:78px;height:78px;margin:-39px 0 0 -39px}
.knot.cur svg{width:78px;height:78px}
.knot.cur .run{animation:sew 1.6s linear infinite}
@keyframes sew{to{stroke-dashoffset:-24}}
.go{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);padding:7px 12px 8px;background:var(--cream);color:var(--red);font-weight:700;font-size:14px;white-space:nowrap;border-radius:4px;box-shadow:0 2px 0 var(--kh3);pointer-events:none}
.go::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--cream)}
.bigb{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;transition:transform .25s var(--bounce)}
.bigb:active{transform:scale(.94) rotate(-3deg)}
.bigb svg{width:100%;height:100%}
.bigb .lbl{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:6px;font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}

/* sash */
.sashwrap{position:relative;min-height:100%;padding:0 0 30px}
.sashh{text-align:center;padding:6px 20px 14px}
.sashh h2{font:700 30px/1.1 var(--cond);color:var(--ol2)}
.sashh h2 span{font-family:var(--sans);font-size:24px}
.sashh p{font-size:14px;color:var(--ink2);margin-top:2px}
.sash{position:relative;margin:0 auto;width:262px;padding:18px 12px 26px;background:var(--ol);display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;box-shadow:inset 0 0 0 5px var(--ol),inset 0 0 0 7px rgba(244,236,212,.35)}
.sash::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(55deg,rgba(0,0,0,.08) 0 1.5px,transparent 1.5px 4px);pointer-events:none}
.sb{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;border-radius:10px;transition:transform .2s var(--bounce)}
.sb:active{transform:scale(.94)}
.sb svg{width:104px;height:104px}
.sb span{font-size:13px;font-weight:600;color:var(--cream)}
.sb.no span{color:rgba(244,236,212,.6)}
.sb.new svg .edge{animation:stitch 1.8s var(--out)}
.sb.new svg .body{animation:fillin 1.8s var(--out)}
@keyframes stitch{from{stroke-dashoffset:100}}
@keyframes fillin{0%,55%{opacity:0}}

/* word bag */
.bagh{padding:6px 20px 8px}
.bagh h2{font:700 30px/1.1 var(--sans);color:var(--ol2)}
.bagh p{font-size:14px;color:var(--ink2)}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);margin:10px 20px 6px;height:44px;background:var(--kh2);border-radius:10px;padding:3px}
.seg .k{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:8px;background:var(--cream);transition:transform .4s var(--bounce);box-shadow:inset 0 0 0 1.5px var(--kh3)}
.seg button{position:relative;font-weight:600;font-size:14px;color:var(--ink2)}
.seg button[aria-pressed=true]{color:var(--ink)}
.ugrp{margin:18px 20px 6px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--ol2)}
.ugrp svg{width:30px;height:30px;flex:none}
.word{display:grid;grid-template-columns:1fr auto 48px;align-items:center;gap:10px;margin:0 14px;padding:10px 6px 10px 10px;min-height:62px;border-radius:10px;transition:background-color .2s}
.word:nth-of-type(odd){background:rgba(255,250,230,.22)}
.word .hz{font-size:21px;font-weight:600;color:var(--ink)}
.word .tl{display:block;font-size:16px;color:var(--navy);margin-top:1px}
.word .zh{font-size:14px;color:var(--ink2);text-align:right}
.star{width:44px;height:44px;display:grid;place-items:center;border-radius:22px;transition:transform .25s var(--bounce)}
.star:active{transform:scale(.8)}
.star svg{width:26px;height:26px}
.empty{text-align:center;padding:40px 30px;color:var(--ink2)}

/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:20;height:calc(84px + env(safe-area-inset-bottom));padding:6px 12px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(3,1fr);background:var(--kh2);box-shadow:0 -3px 0 var(--kh3)}
.nav::before{content:"";position:absolute;left:10px;right:10px;top:6px;border-top:2px dashed rgba(58,65,37,.35)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:600;color:#5a5f40;height:64px;transition:color .2s}
.nav button svg{width:32px;height:32px;transition:transform .3s var(--bounce)}
.nav button[aria-selected=true]{color:var(--ink)}
.nav button[aria-selected=true] svg{transform:translateY(-2px) rotate(-4deg)}
.nav button:active svg{transform:scale(.86)}
.nav .dim{fill:none;stroke:currentColor}
.nav button[aria-selected=true] .fill{fill:var(--red)}
.nav .fill{fill:none;stroke:currentColor}

/* lesson overlay */
.lesson{position:absolute;inset:0;z-index:30;background:var(--khl);display:flex;flex-direction:column;padding:calc(50px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(103%);visibility:hidden;transition:transform .5s var(--out),visibility 0s .5s}
.lesson.on{transform:none;visibility:visible;transition:transform .5s var(--out)}
.lh{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center}
.x{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}
.x:active{background:rgba(0,0,0,.06)}
.prog{position:relative;height:16px}
.prog i{position:absolute;left:0;right:0;top:7px;border-top:2.5px dashed #a79a70}
.prog b{position:absolute;left:0;top:4px;height:8px;border-radius:4px;background:var(--grn);transition:width .5s var(--out)}
.lh .hc{display:flex;align-items:center;gap:4px;font:700 20px/1 var(--cond);color:var(--red)}
.lh .hc svg{width:26px;height:24px}
.qwrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-top:18px;scrollbar-width:none}
.qwrap::-webkit-scrollbar{display:none}
.qk{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;color:var(--ol)}
.qk svg{width:44px;height:44px;transition:transform .4s var(--bounce)}
.qk svg.hop{animation:hop .6s var(--bounce)}
@keyframes hop{30%{transform:translateY(-14px) rotate(-8deg) scale(1.1)}60%{transform:translateY(0) rotate(4deg)}}
.qt{font-size:23px;font-weight:700;line-height:1.35;margin-top:10px;color:var(--ink)}
.qt em{font-style:normal;color:var(--red)}
.qbig{margin:12px 0 4px;padding:14px 16px;background:var(--cream);border-radius:12px;box-shadow:inset 0 0 0 2px var(--kh2)}
.qbig b{display:block;font-size:30px;font-weight:700}
.qbig .tl{font-size:20px;color:var(--navy)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{position:relative;display:flex;align-items:center;gap:12px;min-height:62px;padding:10px 16px;text-align:left;background:var(--cream);border-radius:12px;box-shadow:inset 0 0 0 2px var(--kh2),0 3px 0 var(--kh2);transition:box-shadow .15s,transform .15s,background-color .2s}
.opt:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--kh2),0 1px 0 var(--kh2)}
.opt .k{font:700 16px/1 var(--cond);color:var(--kh3);width:16px}
.opt b{font-size:20px;font-weight:600}
.opt .tl{margin-left:auto;font-size:17px;color:var(--navy)}
.opt[aria-pressed=true]{box-shadow:inset 0 0 0 3px var(--navy),0 3px 0 var(--navy);background:#fff9e8}
.opt[aria-pressed=true]::after{content:"";position:absolute;inset:6px;border-radius:8px;border:1.5px dashed rgba(39,64,94,.45);pointer-events:none}
.opt.right{box-shadow:inset 0 0 0 3px var(--grn),0 3px 0 var(--grn);background:#eef3e0}
.opt.wrong{box-shadow:inset 0 0 0 3px var(--red),0 3px 0 var(--red);background:#f8e3dc}
.line{min-height:122px;margin-top:18px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:8px 0;background:repeating-linear-gradient(transparent 0 54px,#a79a70 54px 55.5px,transparent 55.5px 58px)}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px}
.tile{position:relative;min-height:48px;min-width:48px;padding:5px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cream);border-radius:8px;box-shadow:inset 0 0 0 2px var(--kh2),0 3px 0 var(--kh3);transition:transform .2s var(--bounce)}
.tile b{font-size:19px;font-weight:600;line-height:1.1}
.tile .tl{font-size:12px;color:var(--navy);line-height:1.2}
.tile:active{transform:translateY(2px)}
.tile.ghost{visibility:hidden}
.tile.pop{animation:tpop .3s var(--bounce)}
@keyframes tpop{from{transform:scale(.7)}}
.check{flex:none;height:56px;margin-top:12px;border-radius:12px;background:var(--ol);color:var(--cream);font-weight:700;font-size:18px;letter-spacing:.1em;box-shadow:0 4px 0 var(--ol2);transition:transform .12s,box-shadow .12s,background-color .2s;position:relative}
.check::after{content:"";position:absolute;inset:5px;border-radius:8px;border:1.5px dashed rgba(244,236,212,.45);pointer-events:none}
.check:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ol2)}
.check[disabled]{background:#a79a70;color:#efe7cf;box-shadow:0 4px 0 #8e8260;cursor:default}
.fb{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:18px 18px calc(18px + env(safe-area-inset-bottom));color:var(--cream);transform:translateY(105%);visibility:hidden;transition:transform .42s var(--bounce),visibility 0s .42s}
.fb.on{transform:none;visibility:visible;transition:transform .42s var(--bounce)}
.fb.ok{background:var(--grn)}
.fb.bad{background:var(--red)}
.fb h3{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
.fb h3 svg{width:34px;height:34px}
.fb p{margin-top:6px;font-size:16px}
.fb p .tl{font-size:18px}
.fb button{display:block;width:100%;height:56px;margin-top:14px;border-radius:12px;background:var(--cream);font-weight:700;font-size:18px;letter-spacing:.1em;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .12s}
.fb.ok button{color:var(--grn)}.fb.bad button{color:var(--red)}
.fb button:active{transform:translateY(3px)}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:10px}
.done svg.bb{width:170px;height:170px;animation:hop .9s var(--bounce)}
.done h2{font-size:28px;font-weight:700;margin-top:12px}
.done .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:20px}
.done .row div{padding:12px 4px;background:var(--cream);border-radius:12px;box-shadow:inset 0 0 0 2px var(--kh2)}
.done .row b{display:block;font:700 30px/1.1 var(--cond)}
.done .row span{font-size:13px;color:var(--ink2)}

/* sheet */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(44,49,29,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:86%;overflow-y:auto;background:var(--khl);padding:10px 22px calc(24px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .5s var(--bounce);touch-action:none;scrollbar-width:none}
.sheet::before{content:"";position:absolute;left:10px;right:10px;top:8px;height:calc(100% - 8px);border:2px dashed rgba(77,85,48,.3);border-bottom:0;border-radius:18px 18px 0 0;pointer-events:none}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--kh3);margin:6px auto 12px}
.sheet h4{font-size:22px;font-weight:700;text-align:center}
.sheet .sub{text-align:center;font-size:14px;color:var(--ink2);margin-top:3px}
.sheet .bd{display:grid;place-items:center;margin:12px 0 4px}
.sheet .bd svg{width:150px;height:150px}
.wl{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.wl div{font-size:15px}
.wl .tl{display:block;font-size:14px;color:var(--navy)}
.sbtn{display:block;width:100%;height:54px;margin-top:18px;border-radius:12px;background:var(--ol);color:var(--cream);font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--ol2)}
.sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ol2)}
.sbtn[disabled]{background:#a79a70;box-shadow:0 4px 0 #8e8260}
.hbig{display:flex;justify-content:center;gap:6px;margin:16px 0 6px}
.hbig svg{width:40px;height:36px}
.toast{position:absolute;left:50%;top:calc(104px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-170px);visibility:hidden;padding:10px 18px;background:var(--ol2);color:var(--cream);font-weight:600;font-size:14px;border-radius:10px;white-space:nowrap;transition:transform .45s var(--bounce),visibility 0s .45s}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .45s var(--bounce)}
.homebar{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);opacity:.75;z-index:70;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .page.in,.qk svg.hop,.done svg.bb,.tile.pop,.sb.new svg .edge,.sb.new svg .body{animation:none}
  .knot.cur .run{animation:none}
  .lesson,.fb,.sheet,.toast,.seg .k{transition-duration:.01s}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="sat" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(38)"><path d="M0 0v5" stroke="rgba(255,255,255,.2)" stroke-width="1.8"/><path d="M2.5 0v5" stroke="rgba(0,0,0,.08)" stroke-width="1"/></pattern>
    <pattern id="sat2" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(-50)"><path d="M0 0v4" stroke="rgba(255,255,255,.28)" stroke-width="1.4"/></pattern>
  </defs>

function openSheet(html){ lastFocus=document.activeElement; $('shBody').innerHTML=html; sheet.scrollTop=0; sheet.style.transform=''; sheet.classList.add('on'); scrim.classList.add('on'); haptic(6); var f=sheet.querySelector('button:not([disabled])'); if(f) f.focus({preventScroll:true}); }
function closeSheet(){ if(!sheet.classList.contains('on')) return; sheet.classList.remove('on','drag'); sheet.style.transform=''; scrim.classList.remove('on'); scrim.style.opacity=''; if(lastFocus&&lastFocus.focus) lastFocus.focus({preventScroll:true}); }
scrim.addEventListener('click', closeSheet);
(function(){
  var sy=0,dy=0,t0=0,on=false;
  sheet.addEventListener('pointerdown', function(e){ if(e.target.closest('button')||sheet.scrollTop>0) return; on=true; sy=e.clientY; dy=0; t0=e.timeStamp; sheet.classList.add('drag'); try{ sheet.setPointerCapture(e.pointerId); }catch(er){} });
  sheet.addEventListener('pointermove', function(e){ if(!on) return; dy=e.clientY-sy; sheet.style.transform='translateY('+(dy>0?dy:dy/6)+'px)'; scrim.style.opacity=Math.max(0,1-dy/sheet.offsetHeight); });
  function end(e){ if(!on) return; on=false; sheet.classList.remove('drag'); scrim.style.opacity=''; var v=dy/Math.max(1,e.timeStamp-t0); if(dy>sheet.offsetHeight*.35||v>.6){ closeSheet(); haptic(5); } else sheet.style.transform=''; }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();
var tt=null;
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove('on'); }, 1900); }

/* clock */
function clk(){ var d=new Date(); $('clk').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
clk(); setInterval(clk, 20000); setInterval(renderTop, 60000);

/* backdrop: khaki shirt with a diagonal sash of badges */
(function(){
  var h='<defs><pattern id="tw" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(55)"><rect width="6" height="6" fill="#bfae80"/><path d="M0 0v6" stroke="#b0a072" stroke-width="2"/></pattern><pattern id="tw2" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(55)"><rect width="6" height="6" fill="#4d5530"/><path d="M0 0v6" stroke="#434a2a" stroke-width="2"/></pattern></defs><rect width="1440" height="900" fill="url(#tw)"/>';
  h+='<path d="M1060 -40 1220 -40 1440 360 1440 560z" fill="none"/>';
  h+='<g transform="rotate(28 220 450)"><rect x="80" y="-300" width="250" height="1500" fill="url(#tw2)"/><rect x="88" y="-300" width="234" height="1500" fill="none" stroke="rgba(244,236,212,.4)" stroke-width="2" stroke-dasharray="8 6"/>';
  for(var i=0;i<6;i++){ h+='<g transform="translate('+(i%2?210:100)+' '+(i*150-40)+') scale(.9)">'+unitBadge(i,'full').replace(/<\/?svg[^>]*>/g,'')+'</g>'; }
  h+='</g><path d="M1180 0v900" stroke="#b0a072" stroke-width="3"/><path d="M1190 0v900" stroke="rgba(58,65,37,.35)" stroke-width="2" stroke-dasharray="7 6"/><circle cx="1260" cy="210" r="16" fill="#8e7f55"/><circle cx="1260" cy="210" r="16" fill="none" stroke="#6f6342" stroke-width="2"/><path d="M1254 210h12M1260 204v12" stroke="#6f6342" stroke-width="2"/>';
  $('bd').innerHTML=h;
})();

/* boot */
renderTop(); renderPath(); requestAnimationFrame(function(){ scrollToCur(false); });
})();
