<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151412">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3D 列印">
<title>3D 列印 · 3D 列印監控</title>
<meta name="description" content="工業安全黃黑風格的 3D 列印監控：看台北 101 模型逐層擠出、暫停與繼續、調整噴嘴熱床溫度、拖曳排序列印佇列。收錄於 100 Creative HTML Works（App 068・工業安全黃黑）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/068-hazard-printer.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3Cpattern id='h' width='12' height='12' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'%3E%3Crect width='6' height='12' fill='%23f5c400'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%23151412'/%3E%3Crect y='52' width='64' height='12' fill='url(%23h)'/%3E%3Cpath d='M22 48h20v-6H22zM24 42h16v-6H24zM26 36h12v-6H26zM28 30h8v-6h-8z' fill='%23e9e4d8'/%3E%3Cpath d='M26 8h12v10H26z' fill='%23f5c400'/%3E%3Cpath d='M30 18h4l-2 4z' fill='%23ff6b1a'/%3E%3C/svg%3E">
<style>
:root{
  --blk:#151412;
  --blk-2:#1f1d1a;
  --blk-3:#2b2925;
  --yel:#f5c400;
  --yel-d:#c99f00;
  --org:#ff6b1a;
  --wht:#f2eee4;
  --wht-2:#b9b3a6;
  --wht-3:#8a8478;
  --din:"DIN Condensed","DIN Alternate","Avenir Next Condensed","PingFang TC",sans-serif;
  --mono:Menlo,"SF Mono",monospace;
  --text:"PingFang TC","Heiti TC",system-ui,-apple-system,sans-serif;
  --out:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.3,1.3,.5,1);
  --haz:repeating-linear-gradient(-45deg,var(--yel) 0 10px,var(--blk) 10px 20px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.45 var(--text);color:var(--wht);background:var(--blk);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
svg{display:block}
.din{font-family:var(--din);font-weight:700;letter-spacing:.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption,.bumper{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--blk);isolation:isolate}
@media (min-width:521px){
  body{background:#121110}
  .stage{display:flex;align-items:center;justify-content:center;gap:76px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:50px;padding:12px;background:#262420;z-index:1;
    box-shadow:inset 0 0 0 2px #3b3833,0 16px 24px -16px rgba(0,0,0,.8)}
  .screen{inset:12px;border-radius:38px}
  .bumper{display:block;position:absolute;width:74px;height:74px;z-index:2;pointer-events:none;border:10px solid var(--yel);}
  .bumper.tl{left:-4px;top:-4px;border-right:0;border-bottom:0;border-radius:54px 0 0 0}
  .bumper.tr{right:-4px;top:-4px;border-left:0;border-bottom:0;border-radius:0 54px 0 0}
  .bumper.bl{left:-4px;bottom:-4px;border-right:0;border-top:0;border-radius:0 0 0 54px}
  .bumper.br{right:-4px;bottom:-4px;border-left:0;border-top:0;border-radius:0 0 54px 0}
  .caption{display:block;position:relative;z-index:1;width:260px}
  .caption h1{font:700 64px/.9 var(--din);color:var(--yel)}
  .caption p{margin-top:16px;font-size:16px;line-height:1.65;color:var(--wht-2)}
}
@media (min-width:521px) and (max-width:900px){.caption{display:none}}

.status{position:absolute;top:0;left:0;right:0;z-index:30;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 30px 0 34px;
  display:flex;align-items:center;justify-content:space-between;font:700 19px/1 var(--din);color:var(--wht);pointer-events:none;background:var(--blk)}
.status .gl{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}

/* pages */
.pages{position:absolute;inset:0;z-index:5;display:flex;width:200%;transition:transform .5s var(--out)}
.pages.q{transform:translateX(-50%)}
.page{position:relative;width:50%;height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;padding:calc(54px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom))}
.page::-webkit-scrollbar{display:none}

.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.pbtn{display:flex;align-items:baseline;gap:8px;text-align:left;min-height:48px;border-radius:6px;padding:2px 0}
.pbtn .id{font:700 46px/.9 var(--din);color:var(--yel)}
.pbtn svg{width:14px;height:14px;align-self:center}
.pbtn .nm{display:block;font-size:13px;color:var(--wht-2);margin-top:4px}
.state{font:700 26px/1 var(--din);text-align:right}
.state small{display:block;font:12px/1.3 var(--mono);color:var(--wht-3);margin-top:3px;letter-spacing:0}
.state.print{color:var(--yel)} .state.pause{color:var(--org)} .state.heat{color:var(--org)} .state.done{color:#9fd36b} .state.idle,.state.maint{color:var(--wht-3)}

.chamber{position:relative;margin:12px 0 0;background:var(--blk-2);border-radius:4px;overflow:hidden}
.chamber::before,.chamber::after{content:"";position:absolute;left:0;right:0;height:8px;background:var(--haz);z-index:2}
.chamber::before{top:0}.chamber::after{bottom:0}
.chamber canvas{display:block;width:100%;height:292px}
.chamber .tag{position:absolute;left:8px;top:14px;z-index:3;padding:5px 8px;border-radius:3px;background:rgba(21,20,18,.86);max-width:calc(100% - 70px);font:12px/1.4 var(--mono);color:var(--wht-2);text-shadow:0 1px 2px #151412,0 0 3px #151412}
.chamber .tag b{display:block;font:700 18px/1.1 var(--din);color:var(--wht);letter-spacing:.02em}
.lamp{position:absolute;right:6px;top:12px;z-index:3;width:48px;height:48px;display:grid;place-items:center;border-radius:6px}
.lamp svg{width:24px;height:24px}
.lamp:active{background:rgba(245,196,0,.14)}
.idlebox{position:absolute;left:0;right:0;bottom:22px;z-index:3;display:flex;justify-content:center}

.prog{margin-top:14px}
.prog .row{display:flex;align-items:flex-end;justify-content:space-between}
.prog .lay{font:700 40px/.9 var(--din)}
.prog .lay small{font-size:22px;color:var(--wht-3)}
.prog .eta{text-align:right;font:13px/1.3 var(--text);color:var(--wht-2)}
.prog .eta b{display:block;font:600 22px/1.1 var(--mono);color:var(--wht)}
.bar{position:relative;height:16px;margin-top:10px;background:var(--blk-3);border-radius:2px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--haz);background-size:28.28px 28.28px;transition:width .6s var(--out)}
.bar.run i{animation:crawl 1.2s linear infinite}
@keyframes crawl{to{background-position:28.28px 0}}
.bar .pc{position:absolute;right:6px;top:0;bottom:0;display:flex;align-items:center;font:700 13px/1 var(--din);color:var(--wht)}

.temps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tbox{position:relative;text-align:left;background:var(--blk-2);border-radius:4px;padding:12px 12px 40px;min-height:132px;overflow:hidden}
.tbox:active{background:var(--blk-3)}
.tbox .l{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--wht-2)}
.tbox .l svg{width:18px;height:18px}
.tbox .v{font:700 44px/1 var(--din);margin-top:8px}
.tbox .v small{font-size:20px;color:var(--wht-3)}
.tbox .tg{font:12px/1.2 var(--mono);color:var(--wht-3);margin-top:2px}
.tbox canvas{position:absolute;left:0;right:0;bottom:0;width:100%;height:34px;opacity:.9}
.tbox.hot .v{color:var(--org)}

.ctl{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin-top:10px}
.big{height:70px;border-radius:4px;background:var(--yel);color:var(--blk);font:700 26px/1 var(--din);display:flex;align-items:center;justify-content:center;gap:10px;transition:background-color .15s,transform .1s}
.big svg{width:22px;height:22px}
.big:active{background:var(--yel-d);transform:scale(.98)}
.big[disabled]{background:var(--blk-3);color:var(--wht-3);cursor:default}
.hold{position:relative;height:70px;border-radius:4px;background:var(--blk-2);color:var(--org);font:700 22px/1 var(--din);overflow:hidden;box-shadow:inset 0 0 0 2px var(--org)}
.hold .f{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--org);transform:scaleX(0);transform-origin:left}
.hold span{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
.hold span small{font:11px/1 var(--text);color:var(--wht-2)}
.hold.arm span,.hold.arm span small{color:var(--blk)}
.hold[disabled]{opacity:.35;cursor:default}
.speeds{margin-top:10px;display:grid;grid-template-columns:repeat(4,1fr);background:var(--blk-2);border-radius:4px;padding:4px;gap:4px}
.speeds button{height:52px;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:14px/1 var(--text);color:var(--wht-2);transition:background-color .15s,color .15s}
.speeds button b{font:700 18px/1 var(--din);color:var(--wht)}
.speeds button.on{background:var(--wht);color:var(--blk)}
.speeds button.on b{color:var(--blk)}
.fanrow{display:flex;align-items:center;justify-content:space-between;margin-top:10px;background:var(--blk-2);border-radius:4px;padding:6px 6px 6px 12px}
.fanrow .l{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--wht-2)}
.fanrow .l svg{width:22px;height:22px}
.fanrow .l svg.spin{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fanrow .st{display:flex;align-items:center}
.fanrow .st button{width:48px;height:44px;display:grid;place-items:center;border-radius:3px}
.fanrow .st button:active{background:var(--blk-3)}
.fanrow .st svg{width:16px;height:16px}
.fanrow .st b{min-width:54px;text-align:center;font:700 22px/1 var(--din)}
.log{margin-top:16px;font:12px/1.7 var(--mono);color:var(--wht-3)}
.log b{color:var(--wht-2);font-weight:400}

/* queue */
.qhd{display:flex;align-items:flex-end;justify-content:space-between}
.qhd h2{font:700 46px/.9 var(--din);color:var(--yel)}
.qhd .sum{text-align:right;font-size:13px;color:var(--wht-2)}
.qhd .sum b{display:block;font:700 22px/1.1 var(--din);color:var(--wht)}
.qlist{position:relative;margin-top:16px}
.qrow{position:relative;height:84px;touch-action:pan-y}
.qrow .del{position:absolute;right:0;top:0;bottom:8px;width:92px;background:var(--org);color:var(--blk);font:700 18px/1 var(--din);display:grid;place-items:center;border-radius:4px;visibility:hidden}
.qrow.sw .del,.qrow[data-open] .del{visibility:visible}
.qrow .face{position:relative;height:76px;display:grid;grid-template-columns:44px 58px 1fr auto;align-items:center;gap:8px;background:var(--blk-2);border-radius:4px;padding-right:12px;transition:transform .3s var(--out)}
.qrow.sw .face,.qrow.lift .face{transition:none}
.qrow.lift{z-index:5}
.qrow.lift .face{background:var(--blk-3);box-shadow:0 8px 12px -8px rgba(0,0,0,.8)}
.qrow.shift{transition:transform .25s var(--out)}
.handle{height:76px;display:grid;place-items:center;touch-action:none;cursor:grab;border-radius:4px 0 0 4px}
.handle svg{width:18px;height:24px}
.qrow canvas{width:58px;height:58px}
.qrow .nm{font:600 15px/1.25 var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .fn{font:11px/1.3 var(--mono);color:var(--wht-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .mt{display:flex;align-items:center;gap:5px;font:11px/1.3 var(--mono);letter-spacing:-.02em;color:var(--wht-2);margin-top:3px}
.qrow .mt i{width:10px;height:10px;border-radius:2px;flex:none}
.qrow .mt span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .ix{font:700 30px/1 var(--din);color:var(--wht-3);text-align:right}
.qrow .ix small{display:block;margin-top:3px;font:600 11px/1 var(--text);color:var(--yel);letter-spacing:.08em}
.qrow:first-child .ix{color:var(--yel)}
.addq{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:64px;margin-top:6px;border-radius:4px;background:var(--blk);color:var(--yel);font:700 22px/1 var(--din);box-shadow:inset 0 0 0 2px var(--blk-3)}
.addq:active{background:var(--blk-2)}
.addq svg{width:20px;height:20px}
.empty{padding:40px 10px;text-align:center;color:var(--wht-3)}

/* rocker nav */
.navfade{position:absolute;left:0;right:0;bottom:0;z-index:19;height:calc(104px + env(safe-area-inset-bottom));pointer-events:none;background:linear-gradient(rgba(21,20,18,0),var(--blk) 34px)}
.rocker{position:absolute;left:14px;right:14px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:20;height:66px;display:grid;grid-template-columns:1fr 1fr;background:var(--blk-3);border-radius:6px;padding:4px;overflow:hidden}
.rocker .knob{position:absolute;left:4px;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:3px;background:var(--yel);transition:transform .45s var(--spring)}
.rocker.q .knob{transform:translateX(100%)}
.rocker button{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;font:700 24px/1 var(--din);color:var(--wht-2);transition:color .25s}
.rocker button.on{color:var(--blk)}
.rocker button svg{width:22px;height:22px}
.rocker .cnt{font:12px/1 var(--mono);margin-left:2px}
.home-ind{position:absolute;left:50%;bottom:calc(7px + env(safe-area-inset-bottom) * .3);width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--wht);z-index:80;pointer-events:none}

/* sheet */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:calc(100% - 60px);display:flex;flex-direction:column;background:var(--blk-2);border-radius:10px 10px 0 0;overflow:hidden;
  transform:translateY(calc(100% + 20px));transition:transform .5s var(--spring);touch-action:none}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.sheet .hz{flex:none;height:10px;background:var(--haz)}
.sheet .grab{flex:none;height:24px;display:grid;place-items:center}
.sheet .grab i{width:42px;height:5px;border-radius:3px;background:var(--wht-3)}
.sbody{flex:1;overflow-y:auto;scrollbar-width:none;padding:0 18px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sbody::-webkit-scrollbar{display:none}
.sbody h3{font:700 34px/1 var(--din);color:var(--yel)}
.sbody .lead{font-size:13px;color:var(--wht-2);margin-top:6px}
.tset{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;margin-top:18px}
.tset button{height:72px;border-radius:4px;background:var(--blk-3);font:700 30px/1 var(--din);color:var(--wht)}
.tset button:active{background:#3a3732}
.tset .n{text-align:center;font:700 84px/1 var(--din);color:var(--wht)}
.tset .n small{font-size:30px;color:var(--wht-3)}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.presets button{height:60px;border-radius:4px;background:var(--blk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 18px/1 var(--din);color:var(--wht)}
.presets button small{font:11px/1 var(--mono);color:var(--wht-3)}
.presets button.on{background:var(--wht);color:var(--blk)}
.presets button.on small{color:#555}
.tchart{margin-top:16px;height:110px;background:var(--blk);border-radius:4px}
.tchart canvas{width:100%;height:110px;display:block}
.okbtn{margin-top:16px;width:100%;height:62px;border-radius:4px;background:var(--yel);color:var(--blk);font:700 24px/1 var(--din)}
.okbtn:active{background:var(--yel-d)}
.lib{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;min-height:76px;padding:8px 0}
.lib + .lib{box-shadow:0 -1px 0 var(--blk-3)}
.lib canvas{width:58px;height:58px}
.lib .nm{font:600 15px/1.25 var(--text)}
.lib .fn{font:11px/1.3 var(--mono);color:var(--wht-3)}
.lib .mt{font:12px/1.3 var(--mono);color:var(--wht-2);margin-top:2px}
.lib button{height:48px;padding:0 14px;border-radius:4px;background:var(--yel);color:var(--blk);font:700 18px/1 var(--din)}
.lib button:active{background:var(--yel-d)}
.prn{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;min-height:74px;text-align:left;padding:8px 10px;border-radius:4px}
.prn.on{background:var(--blk-3)}
.prn:active{background:#34312c}
.prn .id{font:700 36px/1 var(--din);color:var(--yel)}
.prn .nm{font:600 15px/1.3 var(--text)}
.prn .s{font:12px/1.3 var(--mono);color:var(--wht-3)}
.prn .pct{font:700 24px/1 var(--din)}

.toast{position:absolute;left:50%;top:calc(56px + env(safe-area-inset-top));z-index:90;transform:translate(-50%,-150px);visibility:hidden;transition:transform .45s var(--spring),visibility 0s .45s;
  display:flex;align-items:center;gap:12px;padding:12px 16px 12px 14px;background:var(--yel);color:var(--blk);font:600 15px/1.2 var(--text);white-space:nowrap;border-radius:4px;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .45s var(--spring)}
.toast button{font:700 18px/1 var(--din);height:36px;padding:0 6px;margin:-8px -6px;text-decoration:none;color:var(--blk);box-shadow:inset 0 -2px 0 var(--blk)}

@media (prefers-reduced-motion:reduce){
  .pages,.rocker .knob,.sheet,.toast,.qrow .face,.qrow.shift{transition-duration:.01s}
  .bar.run i,.fanrow .l svg.spin{animation:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" id="bd"></svg></div>
  <div class="device">
    <span class="bumper tl"></span><span class="bumper tr"></span><span class="bumper bl"></span><span class="bumper br"></span>
    <div class="screen" id="screen">
      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="gl">
          <svg width="19" height="12" viewBox="0 0 19 12"><path d="M0 12h3.5V8H0zM5 12h3.5V5.5H5zM10 12h3.5V3H10zM15 12h4V0h-4z" fill="#f2eee4"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 12 5 8.5l1.3-1.3a3.1 3.1 0 0 1 4.4 0L12 8.5zM2.3 5.8l1.5 1.5a6.7 6.7 0 0 1 9.4 0l1.5-1.5a8.8 8.8 0 0 0-12.4 0z" fill="#f2eee4"/></svg>
          <svg width="27" height="12" viewBox="0 0 27 12"><rect x=".8" y=".8" width="22.4" height="10.4" fill="none" stroke="#f2eee4" stroke-width="1.6"/><rect x="3" y="3" width="15" height="6" fill="#f5c400"/><rect x="24" y="4" width="2.4" height="4" fill="#f2eee4"/></svg>
        </span>
      </div>

      <div class="pages" id="pages">
        <!-- status page -->
        <section class="page" id="pStatus" aria-label="印表機狀態">
          <div class="hd">

    { id:'P-01', nm:'工作室左', st:'print', job:{ key:'t101' }, layer:142, t:.3, paused:false, spd:1, fan:100, noz:[214.6,215], bed:[60,60], lamp:true },
    { id:'P-02', nm:'工作室右', st:'idle', job:null, layer:0, t:0, paused:false, spd:1, fan:80, noz:[27,0], bed:[26,0], lamp:true },

/* ---------- simulation ---------- */
var last = performance.now(), raf = 0, lastUi = 0, pagesEl = $('pages');

document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });
(function(){
  var sy = 0, dy = 0, t0 = 0, on = false;
  sheet.addEventListener('pointerdown', function(e){ if (e.target.closest('button,canvas')) return; if ($('sbody').scrollTop > 2 && e.target.closest('.sbody')) return; on = true; sy = e.clientY; dy = 0; t0 = e.timeStamp; sheet.classList.add('drag'); try{ sheet.setPointerCapture(e.pointerId); }catch(err){} });
  sheet.addEventListener('pointermove', function(e){ if (!on) return; dy = e.clientY - sy; sheet.style.transform = 'translateY('+(dy > 0 ? dy : dy/6).toFixed(1)+'px)'; scrim.style.opacity = Math.max(0, 1 - dy/sheet.offsetHeight).toFixed(2); });
  function end(e){ if (!on) return; on = false; sheet.classList.remove('drag'); scrim.style.opacity = ''; var v = dy/Math.max(1, e.timeStamp - t0); if (dy > sheet.offsetHeight*.35 || v > .6){ haptic(5); closeSheet(); } else sheet.style.transform = ''; }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();

/* ---------- toast ---------- */
var tT = null;
function toast(msg, act, fn){ var t = $('toast'); t.innerHTML = '<span>'+esc(msg)+'</span>' + (act ? '<button>'+act+'</button>' : ''); if (act) t.querySelector('button').onclick = function(){ fn(); t.classList.remove('on'); haptic(6); }; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(function(){ t.classList.remove('on'); }, act ? 4000 : 1900); }

/* ---------- clock ---------- */
function tickClock(){ var d = new Date(); $('clock').textContent = d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
tickClock(); setInterval(tickClock, 15000);

/* ---------- backdrop: tread plate + hazard tape ---------- */
(function(){
  var s = '<defs><pattern id="tp" width="36" height="36" patternUnits="userSpaceOnUse"><rect width="36" height="36" fill="#1b1a17"/><path d="M4 12l8-8 3 3-8 8z" fill="#2a2824"/><path d="M22 14l8 8-3 3-8-8z" fill="#2a2824"/><path d="M5 12.5l7.5-7.5" stroke="#35322d" stroke-width="1"/><path d="M22.5 14.5l7.5 7.5" stroke="#35322d" stroke-width="1"/></pattern>'+
    '<pattern id="hz" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="30" height="60" fill="#f5c400"/><rect x="30" width="30" height="60" fill="#151412"/></pattern>'+
    '<linearGradient id="lt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5c400" stop-opacity=".08"/><stop offset=".6" stop-color="#000" stop-opacity="0"/></linearGradient></defs>';
  s += '<rect width="1600" height="1000" fill="url(#tp)"/><rect width="1600" height="1000" fill="url(#lt)"/>';
  s += '<g transform="rotate(-18 800 500)"><rect x="-300" y="80" width="2200" height="70" fill="url(#hz)"/><rect x="-300" y="860" width="2200" height="70" fill="url(#hz)"/></g>';
  $('bd').innerHTML = s;
})();

/* ---------- boot ---------- */
goPage(load('pg', 's'));
renderQueue(); ui();
requestAnimationFrame(function(){ sizeCanvas(); noz.x = W/2; noz.y = 60; raf = requestAnimationFrame(frame); });
window.addEventListener('resize', function(){ sizeCanvas(); });
})();
</script>
