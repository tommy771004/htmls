<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="食記">
<title>食記 · 飲食營養紀錄</title>
<meta name="description" content="像超商包裝一樣的飲食紀錄：掃包裝條碼、搜尋超商食品，便當格隨三餐填滿，營養標示裡的三大營養素環即時更新。收錄於 100 Creative HTML Works（App 020・日本超商包裝）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/020-konbini-nutrition.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23fff'/%3E%3Crect y='0' width='64' height='26' fill='%230b7a47'/%3E%3Crect y='26' width='64' height='7' fill='%23f07d1a'/%3E%3Cpath d='M32 36 45 56H19z' fill='%23111'/%3E%3Crect x='22' y='48' width='20' height='8' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --g:#0b7a47; --g2:#075c35; --g3:#e4f0e7; --o:#f07d1a; --o2:#c95f07;
  --ink:#13201a; --ink2:#46564d; --paper:#ffffff; --line:#13201a;
  --disp:"Toppan Bunkyu Midashi Gothic","Hiragino Sans","PingFang TC","Heiti TC",system-ui,sans-serif;
  --sans:"PingFang TC","Hiragino Sans",system-ui,-apple-system,sans-serif;
  --spring:cubic-bezier(.3,1.4,.5,1); --out:cubic-bezier(.2,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.45 var(--sans);color:var(--ink);background:#fff;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--o);outline-offset:2px}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--paper);isolation:isolate;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
.screen input{-webkit-user-select:text;user-select:text}
@media (min-width:521px){
  body{background:#0b7a47}
  .stage{display:flex;align-items:center;justify-content:center;gap:64px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:54px;padding:10px;z-index:1;
    background:#f6f6f1;box-shadow:inset 0 0 0 2px #d9ddd3,inset 0 0 0 9px #f6f6f1,inset 0 0 0 10px #1d2a22,0 16px 30px -18px rgba(3,40,20,.8)}
  .screen{inset:10px;border-radius:44px}
  .caption{display:block;position:relative;z-index:1;width:250px;background:#fff;color:var(--ink);padding:0 0 18px;box-shadow:0 10px 20px -16px rgba(0,0,0,.6)}
  .caption .cb{background:var(--g);color:#fff;padding:18px 20px 14px;font:800 44px/1 var(--disp);letter-spacing:.04em}
  .caption .cs{height:8px;background:var(--o);border-top:3px solid #fff}
  .caption p{padding:14px 20px 0;font-size:14px;line-height:1.7;color:var(--ink2)}
  .caption .bc{margin:14px 20px 0}
}
@media (min-width:521px) and (max-width:900px){.caption{display:none}}

/* status */
.status{flex:none;display:flex;align-items:center;justify-content:space-between;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 32px;background:var(--g);color:#fff;font:700 15px/1 var(--sans);position:relative;z-index:5}
.status .gl{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}

/* header band */
.band{flex:none;background:var(--g);color:#fff;position:relative;z-index:4;padding:6px 20px 14px;display:flex;align-items:flex-end;justify-content:space-between}
.band h1{font:800 34px/1 var(--disp);letter-spacing:.06em}
.band .dt{font:700 14px/1.3 var(--disp);text-align:right;opacity:.92}
.band .dt b{display:block;font-size:22px;letter-spacing:.02em}
.stripes{flex:none;height:14px;background:linear-gradient(#fff 0 3px,var(--o) 3px 11px,#fff 11px);position:relative;z-index:4}

.views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 16px 128px;overscroll-behavior:contain}
.view[hidden]{display:none}
.view.enter{animation:vin .38s var(--out)}
@keyframes vin{from{transform:translateX(var(--dx,24px))}to{transform:none}}

/* today */
.hero{display:flex;align-items:flex-end;justify-content:space-between;padding:4px 2px 10px}
.hero .k{font:800 13px/1 var(--disp);color:var(--ink2);letter-spacing:.1em}
.hero .big{font:800 58px/1 var(--disp);letter-spacing:.01em;margin-top:6px}
.hero .big small{font-size:18px;margin-left:4px;letter-spacing:.04em}
.hero .of{font:700 13px/1.2 var(--sans);color:var(--ink2);margin-top:4px}
.sticker{flex:none;width:112px;height:76px;background:var(--o);color:var(--ink);transform:rotate(-5deg);display:flex;flex-direction:column;align-items:center;justify-content:center;
  clip-path:polygon(8% 0,92% 0,100% 12%,100% 88%,92% 100%,8% 100%,0 88%,0 12%);margin-bottom:6px}
.sticker span{font:800 12px/1 var(--disp);letter-spacing:.14em}
.sticker b{font:800 32px/1 var(--disp);margin-top:4px}
.sticker.over{background:var(--ink);color:#fff}

.bento{margin:4px 0 16px;touch-action:manipulation}
.bento svg{width:100%;height:auto;overflow:visible}
.bento .cell{cursor:pointer}
.bento .fill{transition:transform .9s var(--spring)}
.bento .cell:active .pad{fill:#d3e6d8}
.bento text{font-family:var(--disp);font-weight:800}

.label{border:3px solid var(--line);padding:10px 12px 12px;margin-bottom:18px}
.label h3{font:800 20px/1 var(--disp);letter-spacing:.08em;padding-bottom:8px;border-bottom:6px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.label h3 small{font:600 12px/1 var(--sans);letter-spacing:0;color:var(--ink2)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 0 8px;border-bottom:2px solid var(--line)}
.ring{text-align:center}
.ring svg{width:84px;height:84px;margin:0 auto}
.ring .arc{transition:stroke-dashoffset 1s var(--out)}
.ring .n{font:800 22px/1 var(--disp)}
.ring .u{font:700 11px/1 var(--sans)}
.ring .t{font:800 13px/1 var(--disp);margin-top:6px;letter-spacing:.06em}
.ring .s{font-size:12px;color:var(--ink2);margin-top:2px}
.facts{width:100%;border-collapse:collapse;font-size:14px}
.facts td{padding:6px 0;border-bottom:1px solid #9aa79f}
.facts td+td{text-align:right;font-weight:700}
.facts tr:last-child td{border-bottom:0}

.meal{margin-bottom:14px}
.meal h4{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:0 6px 0 12px;height:44px;font:800 16px/1 var(--disp);letter-spacing:.1em}
.meal h4 .mk{font:700 13px/1 var(--sans);letter-spacing:0;opacity:.8;margin-left:auto;margin-right:6px}
.meal h4 button{width:44px;height:44px;display:grid;place-items:center;color:var(--o)}
.meal h4 button:active{background:#2c3a32}
.row{position:relative;overflow:hidden;border-bottom:2px solid var(--g3)}
.row .del{position:absolute;inset:0 0 0 auto;width:96px;background:var(--o);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px;font:800 14px/1 var(--disp);letter-spacing:.08em}
.row .del:active{background:var(--o2)}
.row .fr{position:relative;background:#fff;display:flex;align-items:center;gap:12px;padding:10px 4px 10px 2px;min-height:62px;touch-action:pan-y;transition:transform .35s var(--out);cursor:pointer}
.row .fr.drag{transition:none}
.row .ic{flex:none;width:34px;height:34px;color:var(--g)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font:800 16px/1.2 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:12.5px;color:var(--ink2)}
.row .kc{font:800 22px/1 var(--disp);text-align:right}
.row .kc small{display:block;font:600 11px/1.4 var(--sans);color:var(--ink2)}
.empty{padding:16px 12px;color:var(--ink2);font-size:13.5px;border-bottom:2px solid var(--g3)}

/* library */
.search{display:flex;align-items:center;border:3px solid var(--line);height:52px;padding:0 6px 0 12px;gap:8px;background:#fff}
.search input{flex:1;min-width:0;border:0;font:700 17px/1 var(--sans);color:var(--ink);background:none;height:100%;outline:none}
.search input::placeholder{color:#7c8a82}
.search button{width:44px;height:44px;display:grid;place-items:center}
.cats{display:flex;overflow-x:auto;margin:12px -16px 8px;padding:0 16px;gap:0;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;height:44px;padding:0 14px;font:800 15px/1 var(--disp);letter-spacing:.06em;color:var(--ink2);border-bottom:4px solid var(--g3)}
.cats button[aria-pressed=true]{background:var(--g);color:#fff;border-bottom-color:var(--o)}
.cats button:active{background:var(--g3)}
.lib .item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 2px;min-height:64px;border-bottom:2px solid var(--g3)}
.lib .item:active{background:var(--g3)}
.lib .item .nm{flex:1;min-width:0}
.lib .item b{display:block;font:800 16px/1.25 var(--disp)}
.lib .item .nm span{display:block;font-size:12.5px;color:var(--ink2)}
.lib .item .nm .mc{font-size:12px;color:var(--g);font-weight:700}
.lib .item .kc{font:800 20px/1 var(--disp)}
.lib .item .kc small{font:600 11px/1 var(--sans);margin-left:2px;color:var(--ink2)}
.lib .item svg.ic{width:34px;height:34px;color:var(--g);flex:none}
.count{font:700 12.5px/1 var(--sans);color:var(--ink2);margin:4px 2px 2px}

/* week */
.wk{border:3px solid var(--line);padding:12px 10px 8px}
.wk h3{font:800 18px/1 var(--disp);letter-spacing:.08em;display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px}
.wk h3 small{font:600 12px/1 var(--sans);letter-spacing:0;color:var(--ink2)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);align-items:end;height:200px;position:relative;gap:6px;padding:0 2px}
.bars .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--o2);pointer-events:none}
.bars .goal span{position:absolute;right:0;top:-18px;font:800 11px/1 var(--disp);color:var(--o2);background:#fff;padding:2px 0 2px 4px}
.bar{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;cursor:pointer;min-height:44px}
.bar .stk{display:flex;flex-direction:column-reverse;transition:height .6s var(--out)}
.bar .stk i{display:block}
.bar .d{font:800 13px/1 var(--disp);text-align:center;padding-top:8px;color:var(--ink2)}
.bar[aria-pressed=true] .d{color:var(--ink)}
.bar[aria-pressed=true] .stk{outline:3px solid var(--ink);outline-offset:2px}
.legend{display:flex;gap:16px;justify-content:center;font-size:12.5px;margin:12px 0 2px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;margin-right:5px;vertical-align:-1px}
.daycard{margin-top:14px;border-top:6px solid var(--line);padding-top:10px}
.daycard .dh{display:flex;justify-content:space-between;align-items:baseline}
.daycard .dh b{font:800 22px/1 var(--disp)}
.daycard .dh span{font:800 22px/1 var(--disp)}
.minibento{display:grid;grid-template-columns:1fr 1.4fr 1.4fr 1fr;gap:4px;margin-top:10px;height:66px;background:var(--ink);padding:4px}
.minibento div{background:var(--g3);position:relative;overflow:hidden}
.minibento i{position:absolute;left:0;right:0;bottom:0;background:var(--g)}
.minibento span{position:absolute;left:5px;top:4px;font:800 11px/1 var(--disp);color:var(--ink);z-index:1}
.avg{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:3px solid var(--line)}
.avg div{padding:10px 4px 0}
.avg div+div{border-left:2px solid var(--g3);padding-left:10px}
.avg b{display:block;font:800 26px/1 var(--disp)}
.avg span{font-size:12px;color:var(--ink2)}

/* goals */
.gset{border:3px solid var(--line);margin-bottom:16px}
.gset h3{background:var(--g);color:#fff;font:800 16px/1 var(--disp);letter-spacing:.1em;padding:12px}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:14px 10px}
.stepper button{width:56px;height:56px;border:3px solid var(--line);display:grid;place-items:center}
.stepper button:active{background:var(--g3)}
.stepper .v{font:800 44px/1 var(--disp);text-align:center}
.stepper .v small{display:block;font:700 12px/1.6 var(--sans);color:var(--ink2)}
.splits{display:grid;grid-template-columns:repeat(3,1fr);border-top:3px solid var(--line)}
.splits button{padding:12px 4px;min-height:64px;text-align:center}
.splits button+button{border-left:2px solid var(--g3)}
.splits button b{display:block;font:800 16px/1.2 var(--disp)}
.splits button span{font-size:12px;color:var(--ink2)}
.splits button[aria-pressed=true]{background:var(--o);}
.splits button[aria-pressed=true] span{color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 12px;min-height:56px;text-align:left;font:800 16px/1 var(--disp);letter-spacing:.04em}
.toggle+.toggle{border-top:2px solid var(--g3)}
.toggle .sw{width:58px;height:30px;border:3px solid var(--line);position:relative;background:#fff;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;background:var(--ink);transition:transform .3s var(--spring)}
.toggle[aria-checked=true] .sw{background:var(--g)}
.toggle[aria-checked=true] .sw::after{transform:translateX(28px);background:#fff}
.reset{width:100%;height:52px;font:800 15px/1 var(--disp);letter-spacing:.1em;color:var(--o2);border:3px dashed var(--o2)}
.reset:active{background:#fff1e4}

/* tabbar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--g);padding:0 6px env(safe-area-inset-bottom);display:grid;grid-template-columns:1fr 1fr 96px 1fr 1fr;height:calc(86px + env(safe-area-inset-bottom));border-top:6px solid var(--o)}
.tabbar::before{content:"";position:absolute;left:0;right:0;top:-12px;height:6px;background:#fff}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:rgba(255,255,255,.62);font:800 12px/1 var(--disp);letter-spacing:.08em;padding-bottom:18px}
.tab svg{width:26px;height:26px}
.tab[aria-selected=true]{color:#fff}
.tab[aria-selected=true] .off{display:none}
.tab:not([aria-selected=true]) .on{display:none}
.tab:active{background:var(--g2)}
.scanbtn{position:relative;top:-24px;height:88px;background:var(--o);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:800 13px/1 var(--disp);letter-spacing:.14em;
  clip-path:polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);transition:background .15s}
.scanbtn:active{background:var(--o2)}
.scanbtn svg{width:40px;height:28px}
.home{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(255,255,255,.75);z-index:21;pointer-events:none}

/* scan overlay */
.scan{position:absolute;inset:0;z-index:40;background:#0c1510;color:#fff;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .45s var(--out);visibility:hidden}
.scan.on{transform:none;visibility:visible}
.scan .top{display:flex;justify-content:space-between;align-items:center;padding:calc(56px + env(safe-area-inset-top)) 12px 0}
.scan .top button{width:48px;height:48px;display:grid;place-items:center;color:#fff}
.scan .top button:active{background:#1d2b23}
.scan .top b{font:800 18px/1 var(--disp);letter-spacing:.1em}
.vf{position:relative;margin:22px 26px 0;flex:1;max-height:420px;min-height:250px;overflow:hidden;background:#233129}
.vf .pkg{position:absolute;inset:0;transition:filter .3s}
.vf .pkg svg{width:100%;height:100%}
.vf.dim .pkg{filter:brightness(.55) saturate(.8)}
.vf .laser{position:absolute;left:8%;right:8%;height:3px;background:#ff3b2f;top:20%;animation:laser 1.5s ease-in-out infinite alternate}
@keyframes laser{from{top:22%}to{top:78%}}
.vf .corner{position:absolute;width:34px;height:34px;border:5px solid #fff}
.vf .c1{left:10px;top:10px;border-right:0;border-bottom:0}.vf .c2{right:10px;top:10px;border-left:0;border-bottom:0}
.vf .c3{left:10px;bottom:10px;border-right:0;border-top:0}.vf .c4{right:10px;bottom:10px;border-left:0;border-top:0}
.vf.hit .laser{animation:none;top:50%;background:var(--o)}
.scan .hint{text-align:center;font:700 14px/1.5 var(--sans);margin:16px 20px 0;color:#cfe0d5;min-height:42px}
.scan .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 20px calc(30px + env(safe-area-inset-bottom))}
.scan .acts button{height:54px;font:800 15px/1 var(--disp);letter-spacing:.1em}
.scan .acts .a1{background:var(--o);color:var(--ink)}
.scan .acts .a1:active{background:var(--o2)}
.scan .acts .a2{color:#fff;background:#1f2e25}
.scan .acts .a2:active{background:#2b3d32}

/* sheet */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(10,24,16,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:#fff;max-height:88%;display:flex;flex-direction:column;transform:translateY(calc(100% + 40px));transition:transform .5s var(--spring);touch-action:none}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.pull{position:absolute;top:-22px;left:50%;width:120px;margin-left:-60px;height:24px;background:var(--o);display:flex;align-items:center;justify-content:center;font:800 12px/1 var(--disp);letter-spacing:.3em;color:var(--ink);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 100%,0 100%);cursor:grab}
.sheet .pk{background:var(--g);color:#fff;padding:16px 18px 12px}
.sheet .pk .cat{font:800 12px/1 var(--disp);letter-spacing:.2em;opacity:.85}
.sheet .pk h2{font:800 28px/1.15 var(--disp);letter-spacing:.03em;margin-top:6px}
.sheet .pk .mk{font-size:13px;opacity:.85;margin-top:4px}
.sheet .st{height:12px;background:linear-gradient(#fff 0 3px,var(--o) 3px 12px)}
.sheet .body{overflow-y:auto;padding:14px 18px calc(22px + env(safe-area-inset-bottom))}
.qty{display:flex;align-items:center;gap:0;border:3px solid var(--line);margin-top:12px}
.qty button{width:56px;height:52px;display:grid;place-items:center}
.qty button:active{background:var(--g3)}
.qty .q{flex:1;text-align:center;font:800 22px/1 var(--disp);border-left:3px solid var(--line);border-right:3px solid var(--line);height:52px;display:flex;align-items:center;justify-content:center;gap:4px}
.qty .q small{font:700 12px/1 var(--sans);color:var(--ink2)}
.meals{display:grid;grid-template-columns:repeat(4,1fr);margin-top:10px;border:3px solid var(--line)}
.meals button{height:48px;font:800 15px/1 var(--disp);letter-spacing:.06em}
.meals button+button{border-left:2px solid var(--g3)}
.meals button[aria-pressed=true]{background:var(--ink);color:#fff}
.add{margin-top:14px;width:100%;height:58px;background:var(--o);color:var(--ink);font:800 19px/1 var(--disp);letter-spacing:.14em;display:flex;align-items:center;justify-content:center;gap:10px}
.add:active{background:var(--o2)}
.add .p{font:800 15px/1 var(--disp);letter-spacing:0;background:var(--ink);color:#fff;padding:6px 8px}
.bcbox{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--ink2);font-size:12px}
.bcbox svg{height:44px;width:auto}

.toast{position:absolute;left:12px;right:12px;bottom:calc(104px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:#fff;display:flex;align-items:center;min-height:52px;padding:0 6px 0 16px;font:700 14px/1.3 var(--sans);transform:translateY(160px);transition:transform .4s var(--spring);visibility:hidden}
.toast.on{transform:none;visibility:visible}
.toast span{flex:1}

/* ---------- bento ---------- */
var BW = 358, BH = 206;
var CELLS = { b:[10,10,108,90], s:[10,106,108,90], l:[124,10,224,90], d:[124,106,224,90] };
function buildBento(){
  var h = '<svg viewBox="0 0 '+BW+' '+BH+'" role="group" aria-label="今日便當格"><defs>'+
    '<pattern id="grain" width="14" height="12" patternUnits="userSpaceOnUse"><ellipse cx="4" cy="4" rx="2.6" ry="1.3" fill="#fff" opacity=".22" transform="rotate(25 4 4)"/><ellipse cx="11" cy="9" rx="2.6" ry="1.3" fill="#fff" opacity=".22" transform="rotate(-30 11 9)"/></pattern>'+
    '<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#13201a"/><rect width="2.4" height="8" fill="#f07d1a" opacity=".75"/></pattern>';
  MEALS.forEach(function(m){ var c = CELLS[m[0]]; h += '<clipPath id="cp'+m[0]+'"><rect x="'+c[0]+'" y="'+c[1]+'" width="'+c[2]+'" height="'+c[3]+'"/></clipPath><clipPath id="cf'+m[0]+'"><rect class="fill" id="fc'+m[0]+'" x="'+c[0]+'" y="'+c[1]+'" width="'+c[2]+'" height="'+c[3]+'" style="transform-box:fill-box;transform-origin:bottom"/></clipPath>'; });
  h += '</defs><rect x="0" y="0" width="'+BW+'" height="'+BH+'" rx="10" fill="#13201a"/>';
  MEALS.forEach(function(m){ var c = CELLS[m[0]], k = m[0];
    var tx = c[0]+10, ty = c[1]+22;
    var txt = '<text x="'+tx+'" y="'+ty+'" font-size="15" letter-spacing="2">'+m[1]+'</text><text x="'+tx+'" y="'+(c[1]+c[3]-12)+'" font-size="'+(c[2]>150?24:20)+'" id="bt'+k+'">0</text><text x="'+(c[0]+c[2]-10)+'" y="'+ty+'" font-size="11" text-anchor="end" id="bp'+k+'">0%</text>';
    h += '<g class="cell" data-meal="'+k+'" role="button" tabindex="0" aria-label="'+m[1]+'"><rect class="pad" x="'+c[0]+'" y="'+c[1]+'" width="'+c[2]+'" height="'+c[3]+'" fill="#e4f0e7"/>'+
      '<g clip-path="url(#cp'+k+')"><g clip-path="url(#cf'+k+')"><rect x="'+c[0]+'" y="'+c[1]+'" width="'+c[2]+'" height="'+c[3]+'" fill="#0b7a47" id="fl'+k+'"/><rect x="'+c[0]+'" y="'+c[1]+'" width="'+c[2]+'" height="'+c[3]+'" fill="url(#grain)"/></g></g>'+
      '<g fill="#13201a">'+txt+'</g><g fill="#fff" clip-path="url(#cf'+k+')">'+txt.replace(/ id="b[tp]\w"/g,function(s){ return s.replace('id="','class="'); })+'</g>'+
      '<rect class="sel" x="'+(c[0]+1.5)+'" y="'+(c[1]+1.5)+'" width="'+(c[2]-3)+'" height="'+(c[3]-3)+'" fill="none" stroke="#f07d1a" stroke-width="3" opacity="0"/></g>';
  });
  $('bento').innerHTML = h + '</svg>';
  $('bento').addEventListener('click', function(e){ var g = e.target.closest('.cell'); if(!g) return; pickMeal(g.dataset.meal); });
  $('bento').addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ var g = e.target.closest('.cell'); if(g){ e.preventDefault(); pickMeal(g.dataset.meal); } } });
}
function pickMeal(k){ curMeal = k; haptic(6); blip(); renderBento(); var el = $('meal-'+k); if(el) el.scrollIntoView({behavior: reduce?'auto':'smooth', block:'start'}); }
function renderBento(){
  var items = dayItems(TK);
  MEALS.forEach(function(m){ var k = m[0], kc = sum(items.filter(function(e){return e.meal===k;})).kcal, bud = goal*m[2], r = kc/bud;
    var fc = $('fc'+k); fc.style.transform = 'scaleY('+Math.min(1, r).toFixed(3)+')';
    $('fl'+k).setAttribute('fill', r > 1.05 ? 'url(#hatch)' : '#0b7a47');
    var t = fmt(kc), p = r > 1.05 ? '超出 '+fmt(kc-bud) : Math.round(r*100)+'%';
    $('bt'+k).textContent = t; $('bp'+k).textContent = p;
    var g = document.querySelector('.cell[data-meal="'+k+'"]');
    g.querySelectorAll('.bt'+k).forEach(function(n){ n.textContent = t; }); g.querySelectorAll('.bp'+k).forEach(function(n){ n.textContent = p; });
    g.querySelector('.sel').setAttribute('opacity', k===curMeal ? 1 : 0);
    g.setAttribute('aria-label', m[1]+' '+t+' 大卡，'+p);
  });
}

/* ---------- rings ---------- */
var RC = 2*Math.PI*34;
function renderRings(){
  var t = sum(dayItems(TK)), sp = SPLITS[split];
  var tg = { p: goal*sp[1]/4, c: goal*sp[2]/4, f: goal*sp[3]/9 };
  var defs = [['p','蛋白質','#f07d1a'],['c','碳水','#0b7a47'],['f','脂肪','#13201a']];
  if(!$('rings').children.length){
    $('rings').innerHTML = defs.map(function(d){ return '<div class="ring"><svg viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="34" fill="none" stroke="#e4f0e7" stroke-width="10"/><circle class="arc" id="ra'+d[0]+'" cx="42" cy="42" r="34" fill="none" stroke="'+d[2]+'" stroke-width="10" stroke-dasharray="'+RC.toFixed(1)+'" stroke-dashoffset="'+RC.toFixed(1)+'" transform="rotate(-90 42 42)"/><text x="42" y="37" text-anchor="middle" dominant-baseline="central" class="n" id="rn'+d[0]+'" fill="#13201a">0</text><text x="42" y="59" text-anchor="middle" class="u" fill="#46564d">公克</text></svg><div class="t">'+d[1]+'</div><div class="s" id="rs'+d[0]+'"></div></div>'; }).join('');
  }
  defs.forEach(function(d){ var k = d[0], r = t[k]/tg[k];
    $('ra'+k).style.strokeDashoffset = (RC*(1-Math.min(1,r))).toFixed(1);
    $('rn'+k).textContent = Math.round(t[k]);
    $('rs'+k).textContent = '目標 '+Math.round(tg[k])+'g';
  });
  $('facts').innerHTML = '<tr><td>熱量</td><td>'+fmt(t.kcal)+' 大卡</td></tr><tr><td>蛋白質</td><td>'+t.p.toFixed(1)+' 公克</td></tr><tr><td>脂肪</td><td>'+t.f.toFixed(1)+' 公克</td></tr><tr><td>碳水化合物</td><td>'+t.c.toFixed(1)+' 公克</td></tr><tr><td>鈉</td><td>'+fmt(t.na)+' 毫克</td></tr>';
  $('splitLbl').textContent = sp[0];
}

/* ---------- today ---------- */
function renderToday(){
  var items = dayItems(TK), t = sum(items), left = goal - t.kcal;
  $('eaten').textContent = fmt(t.kcal); $('goalLbl').textContent = fmt(goal);
  $('left').textContent = fmt(Math.abs(left)); $('stkT').textContent = left >= 0 ? '還可以吃' : '已超過';
  $('sticker').classList.toggle('over', left < 0);
  renderBento(); renderRings();
  $('meals').innerHTML = MEALS.map(function(m){ var its = items.filter(function(e){ return e.meal===m[0]; }), kc = sum(its).kcal;
    return '<div class="meal" id="meal-'+m[0]+'"><h4>'+m[1]+'<span class="mk num">'+fmt(kc)+' 大卡</span><button data-add="'+m[0]+'" aria-label="加入'+m[1]+'"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="1" y="8" width="18" height="4" fill="currentColor"/><rect x="8" y="1" width="4" height="18" fill="currentColor"/></svg></button></h4>'+
      (its.length ? its.map(rowHTML).join('') : '<div class="empty">還空著。掃描包裝或從食品庫加入。</div>')+'</div>';
  }).join('');
}
function rowHTML(e){ var f = FOOD[e.food];
  return '<div class="row" data-id="'+e.id+'"><button class="del" data-del="'+e.id+'" aria-label="刪除 '+f.name+'" tabindex="-1"><svg width="16" height="18" viewBox="0 0 16 18"><path d="M1 4h14M5 4V1h6v3M3 4l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>刪除</button>'+
    '<div class="fr" role="button" tabindex="0" data-open="'+e.id+'" aria-label="'+f.name+' '+f.kcal*e.qty+' 大卡，左滑刪除">'+icon(f.cat)+'<div class="nm"><b>'+f.name+(e.qty>1?' ×'+e.qty:'')+'</b><span>'+f.mk+'</span></div><div class="kc num">'+fmt(f.kcal*e.qty)+'<small>P '+Math.round(f.p*e.qty)+' · C '+Math.round(f.c*e.qty)+' · F '+Math.round(f.f*e.qty)+'</small></div></div></div>';
}
$('meals').addEventListener('click', function(e){
  var a = e.target.closest('[data-add]'); if(a){ curMeal = a.dataset.add; haptic(6); renderBento(); go('lib'); return; }
  var d = e.target.closest('[data-del]'); if(d){ removeEntry(d.dataset.del); return; }
  var o = e.target.closest('[data-open]'); if(o && !o.dataset.swiped){ var en = log.find(function(x){ return x.id===o.dataset.open; }); if(en) openFood(en.food, en); }
});
$('meals').addEventListener('keydown', function(e){ var o = e.target.closest('[data-open]'); if(!o) return;
  if(e.key==='Enter'){ o.click(); } if(e.key==='Delete'||e.key==='Backspace'){ removeEntry(o.dataset.open); } });
/* swipe to delete */
(function(){
  var fr = null, sx = 0, sy = 0, dx = 0, base = 0, axis = null;
  $('meals').addEventListener('pointerdown', function(e){ var f = e.target.closest('.fr'); if(!f) return; closeOpenRows(f); fr = f; sx = e.clientX; sy = e.clientY; dx = 0; axis = null; base = f.classList.contains('open') ? -96 : 0; delete f.dataset.swiped; });
  $('meals').addEventListener('pointermove', function(e){ if(!fr) return; var mx = e.clientX - sx, my = e.clientY - sy;
    if(!axis){ if(Math.abs(mx) > 8 || Math.abs(my) > 8){ axis = Math.abs(mx) > Math.abs(my) ? 'x' : 'y'; if(axis==='x'){ fr.classList.add('drag'); try{ fr.setPointerCapture(e.pointerId); }catch(_){} } } }
    if(axis==='x'){ dx = mx; var x = Math.min(0, Math.max(-150, base + dx)); fr.style.transform = 'translateX('+x+'px)'; fr.dataset.swiped = 1; } });
  function end(){ if(!fr) return; var f = fr; fr = null; f.classList.remove('drag'); if(axis!=='x'){ return; }
    var x = base + dx; if(x < -130){ removeEntry(f.dataset.open); return; }
    if(x < -48){ f.classList.add('open'); f.style.transform = 'translateX(-96px)'; haptic(10); var b = f.parentNode.querySelector('.del'); if(b) b.tabIndex = 0; }
    else { f.classList.remove('open'); f.style.transform = ''; }
    setTimeout(function(){ delete f.dataset.swiped; }, 60); }
  $('meals').addEventListener('pointerup', end); $('meals').addEventListener('pointercancel', end);
})();
function closeOpenRows(except){ document.querySelectorAll('.fr.open').forEach(function(f){ if(f!==except){ f.classList.remove('open'); f.style.transform=''; } }); }
var undoBuf = null;
function removeEntry(id){ var i = log.findIndex(function(e){ return e.id===id; }); if(i<0) return; var en = log[i];
  var row = document.querySelector('.row[data-id="'+id+'"]');
  log.splice(i,1); undoBuf = {en:en, i:i}; persist(); haptic([12,40,12]);
  var done = function(){ renderAll(); toast('已刪除 '+FOOD[en.food].name, true); };
  if(row && !reduce){ row.style.transition = 'height .25s ease'; row.style.height = row.offsetHeight+'px'; requestAnimationFrame(function(){ row.style.height = '0px'; }); setTimeout(done, 240); } else done();
}

/* ---------- barcode ---------- */
var LC = ['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
var PAR = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function eanBits(s){ var p = PAR[+s[0]], b = '101';
  for(var i=1;i<=6;i++){ var l = LC[+s[i]]; b += p[i-1]==='L' ? l : l.split('').reverse().map(function(x){ return x==='1'?'0':'1'; }).join(''); }
  b += '01010'; for(i=7;i<=12;i++){ b += LC[+s[i]].split('').map(function(x){ return x==='1'?'0':'1'; }).join(''); } return b + '101'; }
function barcodeSVG(s, h){ var b = eanBits(s), r = '', x = 0, W = b.length + 14;
  for(var i=0;i<b.length;i++){ if(b[i]==='1'){ var j = i; while(b[j+1]==='1') j++; var guard = i<3 || (i>=45&&i<50) || i>=92; r += '<rect x="'+(i+7)+'" y="0" width="'+(j-i+1)+'" height="'+(guard?h+5:h)+'"/>'; i = j; } }
  var t = '<text x="3" y="'+(h+11)+'" font-size="10">'+s[0]+'</text><text x="30" y="'+(h+11)+'" font-size="10" text-anchor="middle" letter-spacing="1.5">'+s.slice(1,7)+'</text><text x="76" y="'+(h+11)+'" font-size="10" text-anchor="middle" letter-spacing="1.5">'+s.slice(7)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+(h+13)+'" aria-label="條碼 '+s+'"><g fill="#13201a">'+r+'</g><g fill="#13201a" font-family="Menlo,monospace">'+t+'</g></svg>'; }

/* ---------- food sheet ---------- */

    '<tr><td>熱量</td><td>'+f.kcal+' 大卡</td></tr><tr><td>蛋白質</td><td>'+f.p+' 公克</td></tr><tr><td>脂肪</td><td>'+f.f+' 公克</td></tr><tr><td>碳水化合物</td><td>'+f.c+' 公克</td></tr><tr><td>鈉</td><td>'+f.na+' 毫克</td></tr></tbody></table></div>'+
    '<div class="qty"><button data-q="-1" aria-label="減少份量"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="1" y="8" width="18" height="4" fill="currentColor"/></svg></button><div class="q num"><span id="sq">'+sheetQty+'</span><small>'+f.unit+'</small></div><button data-q="1" aria-label="增加份量"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="1" y="8" width="18" height="4" fill="currentColor"/><rect x="8" y="1" width="4" height="18" fill="currentColor"/></svg></button></div>'+
    '<div class="meals" role="group" aria-label="餐別">'+MEALS.map(function(m){ return '<button data-m="'+m[0]+'" aria-pressed="'+(m[0]===sheetMeal)+'">'+m[1]+'</button>'; }).join('')+'</div>'+
    '<button class="add" id="addBtn">'+(entry?'更新紀錄':'放進便當')+'<span class="p num" id="addK">'+fmt(f.kcal*sheetQty)+' 大卡</span></button>'+
    '<div class="bcbox">'+barcodeSVG(f.bc, 34)+'<span>台灣商品條碼<br>前綴 471</span></div></div>';
  openSheet();

$('sheetBody').addEventListener('click', function(e){
  var q = e.target.closest('[data-q]'); if(q){ sheetQty = Math.max(1, Math.min(9, sheetQty + (+q.dataset.q))); $('sq').textContent = sheetQty; $('addK').textContent = fmt(sheetFood.kcal*sheetQty)+' 大卡'; haptic(5); blip(); return; }
  var m = e.target.closest('[data-m]'); if(m){ sheetMeal = m.dataset.m; document.querySelectorAll('[data-m]').forEach(function(x){ x.setAttribute('aria-pressed', x===m); }); haptic(5); return; }
  if(e.target.closest('#addBtn')){
    if(sheetEntry){ sheetEntry.qty = sheetQty; sheetEntry.meal = sheetMeal; }
    else log.push({id:'e'+Date.now().toString(36), day:TK, meal:sheetMeal, food:sheetFood.id, qty:sheetQty});
    curMeal = sheetMeal; persist(); haptic([8,30,16]); chime(); closeSheet(); closeScan();
    var name = sheetFood.name; go('today'); renderAll(); toast((sheetEntry?'已更新 ':'放進'+mealName(sheetMeal)+'：')+name, false);
  }
});

/* ---------- sheet mechanics ---------- */
var sheet = $('sheet'), scrim = $('scrim'), lastFocus = null;
function openSheet(){ lastFocus = document.activeElement; sheet.style.transform = ''; sheet.classList.add('on'); scrim.classList.add('on'); haptic(6);
  var b = sheet.querySelector('.body'); if(b) b.scrollTop = 0; var f = sheet.querySelector('#addBtn'); if(f) f.focus({preventScroll:true}); }
function closeSheet(){ if(!sheet.classList.contains('on')) return; sheet.classList.remove('on','drag'); sheet.style.transform = ''; scrim.classList.remove('on'); scrim.style.opacity = '';
  if(lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true}); }
scrim.addEventListener('click', closeSheet);
(function(){ var sy = 0, dy = 0, t0 = 0, on = false;
  sheet.addEventListener('pointerdown', function(e){ if(e.target.closest('button')) return; var b = sheet.querySelector('.body'); if(b && b.contains(e.target) && b.scrollTop > 0) return;
    on = true; sy = e.clientY; dy = 0; t0 = e.timeStamp; sheet.classList.add('drag'); try{ sheet.setPointerCapture(e.pointerId); }catch(_){} });
  sheet.addEventListener('pointermove', function(e){ if(!on) return; dy = e.clientY - sy; var y = dy > 0 ? dy : dy/6; sheet.style.transform = 'translateY('+y.toFixed(1)+'px)'; scrim.style.opacity = Math.max(0, 1 - dy/sheet.offsetHeight).toFixed(2); });
  function end(e){ if(!on) return; on = false; sheet.classList.remove('drag'); scrim.style.opacity = ''; var v = dy/Math.max(1, e.timeStamp - t0);
    if(dy > sheet.offsetHeight*.35 || v > .6){ closeSheet(); haptic(4); } else sheet.style.transform = ''; }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end); })();

    '<g transform="rotate(-6 150 190)"><rect x="40" y="36" width="220" height="310" fill="#fff"/><rect x="40" y="36" width="220" height="96" fill="'+c[0]+'"/><rect x="40" y="132" width="220" height="14" fill="#f07d1a"/><rect x="40" y="146" width="220" height="4" fill="#fff"/>'+
    '<text x="56" y="76" font-family="Toppan Bunkyu Midashi Gothic,PingFang TC" font-weight="800" font-size="13" fill="'+c[1]+'" letter-spacing="4">'+f.cat+'</text>'+
    '<text x="56" y="112" font-family="Toppan Bunkyu Midashi Gothic,PingFang TC" font-weight="800" font-size="'+(f.name.length>6?21:26)+'" fill="'+c[1]+'">'+f.name+'</text>'+
    '<text x="56" y="182" font-family="PingFang TC" font-size="12" fill="#46564d">'+f.mk+'</text>'+
    '<text x="244" y="226" font-family="Toppan Bunkyu Midashi Gothic,PingFang TC" font-weight="800" font-size="30" fill="#13201a" text-anchor="end">'+f.kcal+'<tspan font-size="13"> 大卡</tspan></text>'+
    '<g transform="translate(92 250) scale(1.2)">'+barcodeSVG(f.bc, 50).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')+'</g></g></svg>';
}
function openScan(){ var s = $('scan'); s.classList.add('on'); s.setAttribute('aria-hidden','false'); haptic(8); newScanTarget(); setTimeout(function(){ $('scanClose').focus({preventScroll:true}); }, 60); }
function newScanTarget(){ clearTimeout(scanT); scanIdx = (scanIdx + 1 + Math.floor(Math.random()*5)) % F.length; scanFood = FOOD[F[scanIdx][0]];
  drawPkg(scanFood); var vf = $('vf'); vf.classList.remove('hit'); vf.classList.toggle('dim', $('torch').getAttribute('aria-pressed')!=='true');
  $('scanHint').textContent = '對準條碼，保持不動…';
  scanT = setTimeout(function(){ if(!$('scan').classList.contains('on')) return; vf.classList.add('hit'); beep(); haptic([6,20,6]);
    $('scanHint').textContent = '讀到 '+scanFood.bc+' · '+scanFood.name; setTimeout(function(){ if($('scan').classList.contains('on')) openFood(scanFood.id); }, 380); }, reduce ? 500 : 1500); }
function closeScan(){ var s = $('scan'); if(!s.classList.contains('on')) return; clearTimeout(scanT); s.classList.remove('on'); s.setAttribute('aria-hidden','true'); }
$('scanBtn').addEventListener('click', function(){ audio(); openScan(); });
$('scanClose').addEventListener('click', function(){ closeScan(); haptic(5); $('scanBtn').focus({preventScroll:true}); });
$('scanNext').addEventListener('click', function(){ closeSheet(); newScanTarget(); haptic(5); });
$('scanManual').addEventListener('click', function(){ closeSheet(); closeScan(); go('lib'); setTimeout(function(){ $('q').focus(); }, 300); });
$('torch').addEventListener('click', function(){ var on = this.getAttribute('aria-pressed')!=='true'; this.setAttribute('aria-pressed', on); $('vf').classList.toggle('dim', !on); haptic(6); });

/* ---------- week ---------- */
var selDay = TK;
var DOW = ['日','一','二','三','四','五','六'];
function renderWeek(){
  var days = []; for(var k=6;k>=0;k--){ var d = new Date(today); d.setDate(d.getDate()-k); days.push(d); }
  var tots = days.map(function(d){ return sum(dayItems(dkey(d))); });
  var max = Math.max(goal*1.25, Math.max.apply(null, tots.map(function(t){ return t.kcal; })));
  var h = '<div class="goal" style="bottom:calc(30px + (100% - 30px) * '+(goal/max).toFixed(3)+')"><span>'+fmt(goal)+'</span></div>';
  days.forEach(function(d, i){ var t = tots[i], key = dkey(d), H = (t.kcal/max*100).toFixed(1), kc = t.kcal || 1;
    h += '<button class="bar" data-d="'+key+'" aria-pressed="'+(key===selDay)+'" aria-label="'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+fmt(t.kcal)+' 大卡"><div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end"><div class="stk" style="height:'+H+'%">'+
      '<i style="flex:'+(t.c*4/kc).toFixed(3)+';background:#0b7a47"></i><i style="flex:'+(t.p*4/kc).toFixed(3)+';background:#f07d1a"></i><i style="flex:'+(t.f*9/kc).toFixed(3)+';background:#13201a"></i></div></div><div class="d">'+(key===TK?'今':DOW[d.getDay()])+'</div></button>';
  });
  $('bars').innerHTML = h;
  var avg = tots.reduce(function(a,t){ a.k += t.kcal; a.p += t.p; a.o += (t.kcal <= goal ? 1 : 0); return a; }, {k:0,p:0,o:0});
  $('avg').innerHTML = '<div><b class="num">'+fmt(avg.k/7)+'</b><span>日均大卡</span></div><div><b class="num">'+Math.round(avg.p/7)+'g</b><span>日均蛋白質</span></div><div><b class="num">'+avg.o+'/7</b><span>達標天數</span></div>';
  renderDay();
}
function renderDay(){
  var parts = selDay.split('-'), d = new Date(+parts[0], +parts[1]-1, +parts[2]), items = dayItems(selDay), t = sum(items);
  $('daycard').innerHTML = '<div class="dh"><b>'+(d.getMonth()+1)+'/'+d.getDate()+' 週'+DOW[d.getDay()]+'</b><span class="num">'+fmt(t.kcal)+' 大卡</span></div><div class="minibento">'+
    MEALS.map(function(m){ var kc = sum(items.filter(function(e){ return e.meal===m[0]; })).kcal, r = Math.min(1, kc/(goal*m[2])); return '<div><i style="height:'+(r*100).toFixed(0)+'%"></i><span style="color:'+(r>.72?'#fff':'#13201a')+'">'+m[1]+'</span></div>'; }).join('')+'</div>';
}
$('bars').addEventListener('click', function(e){ var b = e.target.closest('.bar'); if(!b) return; selDay = b.dataset.d; haptic(5); blip();
  document.querySelectorAll('.bar').forEach(function(x){ x.setAttribute('aria-pressed', x===b); }); renderDay(); });

/* ---------- goals ---------- */
function renderGoal(){ $('gVal').textContent = fmt(goal);
  $('splits').innerHTML = Object.keys(SPLITS).map(function(k){ var s = SPLITS[k]; return '<button data-s="'+k+'" aria-pressed="'+(k===split)+'"><b>'+s[0]+'</b><span>'+Math.round(s[1]*100)+' / '+Math.round(s[2]*100)+' / '+Math.round(s[3]*100)+'</span></button>'; }).join('');
  $('tSound').setAttribute('aria-checked', !!settings.sound); $('tHap').setAttribute('aria-checked', !!settings.hap); }
function stepGoal(d){ goal = Math.max(1200, Math.min(3600, goal + d)); persist(); renderGoal(); haptic(4); blip(); }
(function(){ [['gMinus',-50],['gPlus',50]].forEach(function(p){ var b = $(p[0]), t = null, iv = null;
  b.addEventListener('click', function(e){ if(e.detail === 0 || !b.dataset.held) stepGoal(p[1]); delete b.dataset.held; });
  b.addEventListener('pointerdown', function(){ t = setTimeout(function(){ b.dataset.held = 1; iv = setInterval(function(){ stepGoal(p[1]); }, 90); }, 420); });
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ b.addEventListener(ev, function(){ clearTimeout(t); clearInterval(iv); }); }); }); })();
$('splits').addEventListener('click', function(e){ var b = e.target.closest('[data-s]'); if(!b) return; split = b.dataset.s; persist(); renderGoal(); haptic(6); blip(); });
$('tSound').addEventListener('click', function(){ settings.sound = !settings.sound; persist(); renderGoal(); if(settings.sound) chime(); haptic(6); });
$('tHap').addEventListener('click', function(){ settings.hap = !settings.hap; persist(); renderGoal(); haptic(12); });
$('reset').addEventListener('click', function(){ var prev = log.slice(); log = seed(); goal = 1900; split = 'bal'; persist(); renderAll(); renderGoal(); haptic([10,30,10]); toast('已重置為示範資料', false); undoBuf = {all:prev}; $('toastU').hidden = false; });

/* ---------- toast ---------- */
var toastT = null;
function toast(msg, undo){ $('toastT').textContent = msg; $('toastU').hidden = !undo; $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ $('toast').classList.remove('on'); }, 3600); }
$('toastU').addEventListener('click', function(){ if(!undoBuf) return; if(undoBuf.all) log = undoBuf.all; else log.splice(undoBuf.i, 0, undoBuf.en); undoBuf = null; persist(); renderAll(); haptic(8); $('toast').classList.remove('on'); });

/* ---------- navigation ---------- */
var ORDER = ['today','lib','week','goal'], TITLES = {today:'今日',lib:'食品庫',week:'一週',goal:'目標'}, cur = 'today';
function go(v){ if(v===cur){ $('v-'+v).scrollTo({top:0, behavior: reduce?'auto':'smooth'}); return; }
  var from = ORDER.indexOf(cur), to = ORDER.indexOf(v);
  $('v-'+cur).hidden = true; var el = $('v-'+v); el.hidden = false; el.style.setProperty('--dx', (to > from ? 28 : -28)+'px');
  el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter');
  cur = v; $('title').textContent = TITLES[v];
  document.querySelectorAll('.tab').forEach(function(t){ t.setAttribute('aria-selected', t.dataset.v===v); });
  if(v==='lib') renderLib(); if(v==='week') renderWeek(); if(v==='goal') renderGoal(); if(v==='today') renderToday();
  haptic(5);
}
document.querySelectorAll('.tab').forEach(function(t){ t.addEventListener('click', function(){ go(t.dataset.v); }); });

document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if(sheet.classList.contains('on')) closeSheet(); else closeScan(); } });

function renderAll(){ renderToday(); if(cur==='week') renderWeek(); if(cur==='lib') renderLib(); }
function tickClock(){ var d = new Date(); $('clock').textContent = d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
tickClock(); setInterval(tickClock, 15000);
$('dDate').textContent = (today.getMonth()+1)+'/'+today.getDate(); $('dDow').textContent = '星期'+DOW[today.getDay()];
buildBento(); renderToday(); renderGoal(); persist();
})();
</script>
