<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="暗房">
<title>暗房 · 照片調色</title>
<meta name="description" content="石墨暖黑的專業調色工具：曝光、對比、亮暗部、白平衡、分離色調、顆粒與暗角即時渲染，前後對比拖曳、預設與整卷套用。收錄於 100 Creative HTML Works（App 038・專業工具石墨暖黑）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/038-darkroom-edit.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b1a18'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23e9e5dc' stroke-width='3'/%3E%3Cpath d='M32 15a17 17 0 0 1 0 34z' fill='%23e9e5dc'/%3E%3Crect x='30.5' y='6' width='3' height='7' fill='%23e8c547'/%3E%3C/svg%3E">
<style>
:root{
  --g0:#1b1a18;
  --g1:#22211e;
  --g2:#2b2926;
  --g3:#3a3834;
  --line:#44413c;
  --t1:#ebe7de;
  --t2:#a8a298;
  --t3:#78736a;
  --chrome:#e8c547;
  --chrome-d:#b8962a;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"PingFang TC",sans-serif;
  --out:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.3,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.45 var(--sans);color:var(--t1);background:var(--g0);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:1.5px solid var(--chrome);outline-offset:2px;border-radius:4px}
svg{display:block}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:var(--g0)}
@media (min-width:521px){
  body{background:#161513}
  .stage{display:flex;align-items:center;justify-content:center;gap:70px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:50px;padding:7px;z-index:1;
    background:linear-gradient(160deg,#4a4640,#262420 40%,#1a1916);box-shadow:inset 0 0 0 1px #5c574f,inset 0 0 0 2px #0e0d0c,0 2px 1px rgba(0,0,0,.4)}
  .screen{inset:7px;border-radius:43px}
  .caption{display:block;position:relative;z-index:1;max-width:230px}
  .caption h1{font:600 40px/1 var(--sans);letter-spacing:.06em;color:var(--t1)}
  .caption p{margin-top:14px;font-size:14px;line-height:1.8;color:var(--t2)}
  .caption .mono{display:block;margin-top:18px;font-size:12px;color:var(--chrome)}
}
@media (min-width:521px) and (max-width:860px){.caption{display:none}}

.status{position:absolute;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;height:calc(50px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 28px 0 32px;font:600 16px/1 var(--sans);color:var(--t1);pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}

.view{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:calc(50px + env(safe-area-inset-top));transition:transform .45s var(--out),opacity .3s}
.view[hidden]{display:none}
#roll.away{transform:translateX(-30%)}
#edit.away{transform:translateX(100%)}

/* ---------- editor ---------- */
.bar{flex:none;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:4px;height:50px;padding:0 8px}
.ib{width:46px;height:46px;display:grid;place-items:center;border-radius:10px;color:var(--t1);transition:background-color .15s,color .15s}
.ib:active{background:var(--g2)}
.ib svg{width:24px;height:24px}
.ib[aria-pressed=true]{color:var(--chrome)}
.fname{min-width:0;text-align:center}
.fname b{display:block;font:600 15px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fname span{font:11px/1.3 var(--mono);color:var(--t3)}
.tr{display:flex}
.photo{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 12px 6px;touch-action:none}
.frame{position:relative;max-width:100%;max-height:100%;aspect-ratio:4/5;height:100%}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:2px;background:#0f0e0d}
.split{position:absolute;top:0;bottom:0;left:50%;width:44px;margin-left:-22px;cursor:ew-resize;display:none;touch-action:none}
.split.on{display:block}
.split::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:2px;background:var(--chrome)}
.split svg{position:absolute;left:4px;top:50%;margin-top:-18px;width:36px;height:36px}
.tag{position:absolute;top:10px;font:600 11px/1 var(--mono);letter-spacing:.08em;color:var(--g0);background:rgba(235,231,222,.86);padding:4px 6px;display:none}
.tag.l{left:10px}.tag.r{right:10px}
.split.on~.tag{display:block}
.holdtag{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font:12px/1 var(--sans);color:var(--g0);background:rgba(235,231,222,.9);padding:6px 10px;opacity:0;transition:opacity .15s;pointer-events:none}
.holdtag.on{opacity:1}
.hist{position:absolute;left:10px;bottom:10px;width:128px;height:62px;background:rgba(20,19,17,.72);padding:6px 6px 14px;display:none}
.hist.on{display:block}
.frame .hist canvas{position:static;width:100%;height:100%;display:block;background:none}
.hist .clip{position:absolute;left:6px;right:6px;bottom:3px;display:flex;justify-content:space-between;font:10px/1 var(--mono);color:var(--t2)}
.frame.small .hist{transform:scale(.62);transform-origin:0 100%;left:6px;bottom:6px;padding-bottom:6px}
.frame.small .hist .clip{display:none}
.frame.small .tag{top:6px;font-size:10px;padding:3px 4px;letter-spacing:.04em}
.frame.small .tag.l{left:6px}.frame.small .tag.r{right:6px}
.exif{flex:none;text-align:center;font:11px/1 var(--mono);color:var(--t3);padding-bottom:8px}

.panel{flex:none;padding:6px 18px 4px;min-height:112px;background:var(--g1)}
.ph{display:flex;justify-content:space-between;align-items:center;height:32px}
.ph b{font:600 15px/1 var(--sans)}
.ph .val{font:600 15px/1 var(--mono);color:var(--chrome)}
.ph .rs{font:13px/1 var(--sans);color:var(--t2);height:32px;padding:0 4px}
.ph .rs:active{color:var(--t1)}
.ph .rs[disabled]{color:var(--g3)}
.fader{position:relative;height:44px;touch-action:none;cursor:pointer;margin:0 2px}
.fader .trk{position:absolute;left:0;right:0;top:21px;height:2px;background:var(--line)}
.fader .ctr{position:absolute;left:50%;top:12px;width:2px;height:20px;margin-left:-1px;background:var(--t3)}
.fader .fill{position:absolute;top:20px;height:4px;background:var(--chrome)}
.fader .th{position:absolute;top:8px;width:6px;height:28px;margin-left:-3px;background:var(--t1);box-shadow:0 0 0 2px var(--g1)}
.fader.grad .trk{height:4px;top:20px}
.fader .tk{position:absolute;left:0;right:0;top:30px;height:6px;background:repeating-linear-gradient(90deg,var(--g3) 0 1px,transparent 1px 10%)}
.fader + .lab2{margin-top:2px}
.lab2{display:flex;justify-content:space-between;font:12px/1 var(--sans);color:var(--t2);margin-top:6px}
.lab2 .mono{color:var(--t1)}
.presets{display:flex;gap:10px;overflow-x:auto;padding:6px 0 4px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.pre{flex:none;width:64px;text-align:center;font:12px/1.3 var(--sans);color:var(--t2)}
.pre canvas{display:block;width:64px;height:80px;margin-bottom:5px;background:#0f0e0d;outline:2px solid transparent;outline-offset:2px;transition:outline-color .15s}
.pre[aria-pressed=true]{color:var(--chrome)}
.pre[aria-pressed=true] canvas{outline-color:var(--chrome)}

.tools{flex:none;display:flex;overflow-x:auto;gap:2px;padding:6px 8px calc(24px + env(safe-area-inset-bottom));background:var(--g1);scrollbar-width:none;scroll-snap-type:x proximity}
.tools::-webkit-scrollbar{display:none}
.tool{flex:none;width:64px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--t2);font:12px/1 var(--sans);scroll-snap-align:start;border-radius:8px;transition:color .15s,background-color .15s}
.tool:active{background:var(--g2)}
.tool svg{width:24px;height:24px}
.tool[aria-selected=true]{color:var(--t1)}
.tool[aria-selected=true] .nm{color:var(--chrome)}
.tool .v{font:10px/1 var(--mono);color:var(--chrome);height:10px}

/* ---------- roll / contact sheet ---------- */
#roll{background:var(--g0);overflow-y:auto;overflow-x:hidden;display:block;padding-bottom:calc(30px + env(safe-area-inset-bottom));scrollbar-width:none}
#roll::-webkit-scrollbar{display:none}
#roll[hidden],#edit[hidden]{display:none}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 20px 14px}
.rhead h1{font:600 28px/1.1 var(--sans);letter-spacing:.04em}
.rhead p{font:12px/1.5 var(--mono);color:var(--t3);margin-top:4px}
.rbtn{height:40px;padding:0 12px;font:600 13px/1 var(--sans);color:var(--t1);background:var(--g2);border-radius:6px}
.rbtn:active{background:var(--g3)}
.rbtn[disabled]{color:var(--t3)}
.strip{position:relative;margin:0 0 16px;background:#141311;padding:22px 10px;transform:rotate(var(--r))}
.strip .holes{position:absolute;left:0;right:0;height:9px;background:radial-gradient(ellipse 3px 3.4px at 50% 50%,#050504 96%,transparent 100%) 0 0/14px 9px repeat-x;opacity:.9}
.strip .holes.t{top:6px}.strip .holes.b{bottom:6px}
.strip .edge{position:absolute;left:14px;font:600 9px/1 var(--mono);letter-spacing:.14em;color:#b9912f}
.strip .edge.t{top:0}.strip .edge.b{bottom:-1px;left:auto;right:14px}
.strip .fr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{position:relative;aspect-ratio:4/5;background:#0c0b0a}
.cell>button.open{position:absolute;inset:0;width:100%;height:100%}
.cell canvas{position:absolute;inset:0;width:100%;height:100%}
.cell .no{position:absolute;left:4px;bottom:-17px;text-align:center;font:600 9px/1 var(--mono);color:#b9912f;letter-spacing:.1em;pointer-events:none}
.cell .mark{position:absolute;inset:-9px;pointer-events:none;overflow:visible;opacity:0;transition:opacity .2s}
.cell.picked .mark{opacity:1}
.cell .pick{position:absolute;right:0;top:0;width:44px;height:44px;display:grid;place-items:start end;padding:5px;z-index:2}
.cell .pick svg{width:18px;height:18px}
.cell .ed{position:absolute;left:5px;top:5px;font:600 10px/1 var(--mono);color:var(--g0);background:var(--chrome);padding:3px 4px;pointer-events:none}
.rnote{margin:6px 20px 0;font:13px/1.7 var(--sans);color:var(--t2)}
.rnote b{color:var(--t1);font-weight:600}
.racts{display:flex;gap:8px;margin:14px 20px 0}

/* sheet */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(8,7,6,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:var(--g1);border-radius:18px 18px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .45s var(--spring);touch-action:none}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--g3);margin:0 auto 14px}
.sheet h3{font:600 19px/1.2 var(--sans)}
.sheet .sub{font:12px/1.5 var(--mono);color:var(--t3);margin-top:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;background:var(--g0);padding:3px;border-radius:8px}
.seg button{height:42px;border-radius:6px;font:13px/1.2 var(--sans);color:var(--t2)}
.seg button small{display:block;font:10px/1.2 var(--mono);color:var(--t3)}
.seg button[aria-pressed=true]{background:var(--g3);color:var(--t1)}
.srow{display:flex;gap:10px;margin-top:14px}
.act{flex:1;height:50px;border-radius:8px;font:600 15px/1 var(--sans);background:var(--g2);color:var(--t1)}
.act:active{background:var(--g3)}
.act.main{background:var(--chrome);color:#1b1a18}
.act.main:active{background:var(--chrome-d)}
.list2{margin-top:14px}
.list2 button{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:52px;font:15px/1.3 var(--sans);text-align:left;border-bottom:1px solid var(--g2)}
.list2 button span{font:12px/1 var(--mono);color:var(--t3)}
.list2 button:active{color:var(--chrome)}

.toast{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-120px);visibility:hidden;
  background:var(--t1);color:var(--g0);font:600 13px/1 var(--sans);padding:0 6px 0 14px;min-height:40px;border-radius:6px;display:flex;align-items:center;gap:6px;white-space:nowrap;
  transition:transform .4s var(--spring),visibility 0s .4s}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .4s var(--spring)}
.toast button{font-weight:700;color:#7a5d00;min-height:40px;padding:0 8px}
.home-ind{position:absolute;left:50%;bottom:calc(8px + env(safe-area-inset-bottom) * .3);width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(235,231,222,.7);z-index:45;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  .view,.sheet,.toast{transition-duration:.01s}
}
</style>
</head>

      <defs>

        <linearGradient id="neg" x1="0" x2="1"><stop offset="0" stop-color="#b8662c"/><stop offset="1" stop-color="#9c5424"/></linearGradient>
        <g id="negstrip">
          <rect width="720" height="150" fill="url(#neg)" opacity=".86"/>
          <g fill="#161513"><rect x="10" y="8" width="10" height="12" rx="2"/><rect x="34" y="8" width="10" height="12" rx="2"/><rect x="58" y="8" width="10" height="12" rx="2"/><rect x="82" y="8" width="10" height="12" rx="2"/><rect x="106" y="8" width="10" height="12" rx="2"/><rect x="130" y="8" width="10" height="12" rx="2"/><rect x="154" y="8" width="10" height="12" rx="2"/><rect x="178" y="8" width="10" height="12" rx="2"/><rect x="202" y="8" width="10" height="12" rx="2"/><rect x="226" y="8" width="10" height="12" rx="2"/><rect x="250" y="8" width="10" height="12" rx="2"/><rect x="274" y="8" width="10" height="12" rx="2"/><rect x="298" y="8" width="10" height="12" rx="2"/><rect x="322" y="8" width="10" height="12" rx="2"/><rect x="346" y="8" width="10" height="12" rx="2"/><rect x="370" y="8" width="10" height="12" rx="2"/><rect x="394" y="8" width="10" height="12" rx="2"/><rect x="418" y="8" width="10" height="12" rx="2"/><rect x="442" y="8" width="10" height="12" rx="2"/><rect x="466" y="8" width="10" height="12" rx="2"/><rect x="490" y="8" width="10" height="12" rx="2"/><rect x="514" y="8" width="10" height="12" rx="2"/><rect x="538" y="8" width="10" height="12" rx="2"/><rect x="562" y="8" width="10" height="12" rx="2"/><rect x="586" y="8" width="10" height="12" rx="2"/><rect x="610" y="8" width="10" height="12" rx="2"/><rect x="634" y="8" width="10" height="12" rx="2"/><rect x="658" y="8" width="10" height="12" rx="2"/><rect x="682" y="8" width="10" height="12" rx="2"/><rect x="706" y="8" width="10" height="12" rx="2"/></g>
          <use href="#holes2" y="122"/>
          <g fill="#3d2616" opacity=".55"><rect x="16" y="30" width="160" height="90"/><rect x="190" y="30" width="160" height="90"/><rect x="364" y="30" width="160" height="90"/><rect x="538" y="30" width="160" height="90"/></g>
          <g fill="#e9d9c0" opacity=".55"><path d="M16 96C60 80 100 90 176 70V120H16Z"/><path d="M190 110 240 60 290 100 350 80V120H190Z"/><circle cx="440" cy="70" r="20"/><path d="M538 100h160v20H538Z"/></g>
          <text x="20" y="140" font-family="Menlo,monospace" font-size="10" fill="#f3d58a" letter-spacing="3">KODAK 400TX  ▸ 12  ▸ 12A  ▸ 13</text>
        </g>
        <g id="holes2" fill="#161513"><rect x="10" y="0" width="10" height="12" rx="2"/><rect x="34" y="0" width="10" height="12" rx="2"/><rect x="58" y="0" width="10" height="12" rx="2"/><rect x="82" y="0" width="10" height="12" rx="2"/><rect x="106" y="0" width="10" height="12" rx="2"/><rect x="130" y="0" width="10" height="12" rx="2"/><rect x="154" y="0" width="10" height="12" rx="2"/><rect x="178" y="0" width="10" height="12" rx="2"/><rect x="202" y="0" width="10" height="12" rx="2"/><rect x="226" y="0" width="10" height="12" rx="2"/><rect x="250" y="0" width="10" height="12" rx="2"/><rect x="274" y="0" width="10" height="12" rx="2"/><rect x="298" y="0" width="10" height="12" rx="2"/><rect x="322" y="0" width="10" height="12" rx="2"/><rect x="346" y="0" width="10" height="12" rx="2"/><rect x="370" y="0" width="10" height="12" rx="2"/><rect x="394" y="0" width="10" height="12" rx="2"/><rect x="418" y="0" width="10" height="12" rx="2"/><rect x="442" y="0" width="10" height="12" rx="2"/><rect x="466" y="0" width="10" height="12" rx="2"/><rect x="490" y="0" width="10" height="12" rx="2"/><rect x="514" y="0" width="10" height="12" rx="2"/><rect x="538" y="0" width="10" height="12" rx="2"/><rect x="562" y="0" width="10" height="12" rx="2"/><rect x="586" y="0" width="10" height="12" rx="2"/><rect x="610" y="0" width="10" height="12" rx="2"/><rect x="634" y="0" width="10" height="12" rx="2"/><rect x="658" y="0" width="10" height="12" rx="2"/><rect x="682" y="0" width="10" height="12" rx="2"/><rect x="706" y="0" width="10" height="12" rx="2"/></g>
      </defs>
      <rect width="1600" height="1000" fill="#1b1a18"/>
      <use href="#negstrip" transform="translate(-120 120) rotate(-8)"/>
      <use href="#negstrip" transform="translate(1040 690) rotate(6)"/>
      <use href="#negstrip" transform="translate(1100 60) rotate(-3) scale(.8)" opacity=".7"/>
      <g transform="translate(250 730) rotate(-32)"><rect width="190" height="14" rx="3" fill="#e8c547"/><path d="M190 0l30 7-30 7z" fill="#d9b53a"/><path d="M212 5l8 2-8 2z" fill="#2b2926"/><rect x="18" y="0" width="3" height="14" fill="#b8962a"/></g>
      <path d="M210 80c40-40 150-44 190 0 40 44 10 110-70 118-80 8-170-60-120-118z" fill="none" stroke="#e8c547" stroke-width="5" stroke-linecap="round" opacity=".8"/>
      <rect width="1600" height="1000" filter="url(#dust)"/>
    </svg>
  </div>
  <div class="caption"><h1>暗房</h1><p>石墨色的調色台。拖一下就即時重算整張照片，按住看原片，把設定抄到整卷。</p><span class="mono">EXP +0.35 · CON +18 · GRAIN 24</span></div>

  <div class="device">
    <div class="screen" id="screen">
      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>

  $('pasteAll').textContent = '貼到全卷';
  $('rnote').innerHTML = clip ? '剪貼簿裡有 <b>' + clip.src + '</b> 的設定。' : '點格子進暗房。右上角是油性筆，圈起想留的那幾張。';
  setTimeout(function(){
    document.querySelectorAll('.cell').forEach(function(c){ var i = +c.dataset.i; c.querySelector('canvas').getContext('2d').putImageData(process(i, edits[i], 224, 280), 0, 0); });
  }, 20);
}
$('strips').addEventListener('click', function(e){
  var pk = e.target.closest('[data-pick]'), op = e.target.closest('[data-open]');
  if (pk){ var i = +pk.dataset.pick, k = picks.indexOf(i); if (k > -1) picks.splice(k, 1); else picks.push(i); persist(); haptic(k > -1 ? 5 : [6, 20, 10]); tickS(); renderRoll(); return; }
  if (op) openEdit(+op.dataset.open);
});
$('pasteAll').addEventListener('click', function(){
  if (!clip) return;
  var before = JSON.stringify(edits);
  edits = edits.map(function(){ var o = JSON.parse(JSON.stringify(clip.e)); return o; }); persist(); renderRoll(); haptic([8, 30, 8]); tickS();
  toast('已套用到 ' + edits.length + ' 格', function(){ edits = JSON.parse(before); persist(); renderRoll(); });
});
$('toRoll').addEventListener('click', openRoll);
function loadPhoto(){
  $('scName').textContent = SCENES[cur].n; $('fnm').textContent = SCENES[cur].f; $('exif').textContent = SCENES[cur].ex;
  renderTools(); renderPanel(); schedule();
}

/* ---------- export sheet ---------- */
var sheet = $('sheet'), scrim = $('scrim'), lastFocus = null, expSize = 1080;
function openSheet(html){ lastFocus = document.activeElement; $('sbody').innerHTML = html; sheet.style.transform = ''; sheet.classList.add('on'); scrim.classList.add('on'); haptic(6); }
function closeSheet(){ if (!sheet.classList.contains('on')) return; sheet.classList.remove('on', 'drag'); sheet.style.transform = ''; scrim.classList.remove('on'); if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); }
scrim.addEventListener('click', closeSheet);
function expHTML(){
  var e = edits[cur];
  return '<h3>匯出 ' + SCENES[cur].n + '</h3><p class="sub">' + SCENES[cur].f + ' · ' + e.preset + ' · EXP ' + fmtV('exp', e.exp) + ' · CON ' + fmtV('con', e.con) + '</p>' +
    '<div class="seg">' + [[600,'網路','600 px'],[1080,'社群','1080 px'],[1500,'原尺寸','1500 px']].map(function(s){ return '<button data-sz="' + s[0] + '" aria-pressed="' + (expSize === s[0]) + '">' + s[1] + '<small>' + s[2] + '</small></button>'; }).join('') + '</div>' +
    '<div class="list2"><button id="copyE">複製這張的設定<span>' + (clip && clip.i === cur ? 'COPIED' : 'COPY') + '</span></button><button id="resetE">全部重設為原片<span>RESET</span></button></div>' +
    '<div class="srow"><button class="act main" id="saveE">存成 PNG</button></div>';
}
$('expBtn').addEventListener('click', function(){ openSheet(expHTML()); });
$('sbody').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.sz){ expSize = +b.dataset.sz; $('sbody').innerHTML = expHTML(); haptic(5); tickS(); return; }
  if (b.id === 'copyE'){ clip = {i:cur, src:SCENES[cur].n, preset:edits[cur].preset, e:JSON.parse(JSON.stringify(edits[cur]))}; $('sbody').innerHTML = expHTML(); haptic([6, 20, 6]); toast('已複製設定，到膠卷貼上'); return; }
  if (b.id === 'resetE'){ snapshot(); edits[cur] = mk(PRESETS[0]); persist(); renderTools(); renderPanel(); schedule(); closeSheet(); haptic(10); toast('回到原片', undoLast); return; }
  if (b.id === 'saveE'){
    var w = Math.round(expSize * .8), h = expSize, c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').putImageData(process(cur, edits[cur], w, h), 0, 0);
    c.toBlob(function(blob){
      if (!blob) return;
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = SCENES[cur].f.replace('.RAF', '') + '_暗房.png';
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }, 'image/png');
    closeSheet(); haptic([8, 40, 8]); shutter(); toast('已存成 ' + w + '×' + h + ' PNG');
  }
});
(function(){
  var sy = 0, dy = 0, t0 = 0, on = false;
  sheet.addEventListener('pointerdown', function(e){ if (e.target.closest('button')) return; on = true; sy = e.clientY; dy = 0; t0 = e.timeStamp; sheet.classList.add('drag'); sheet.setPointerCapture(e.pointerId); });
  sheet.addEventListener('pointermove', function(e){ if (!on) return; dy = e.clientY - sy; sheet.style.transform = 'translateY(' + (dy > 0 ? dy : dy / 6).toFixed(1) + 'px)'; scrim.style.opacity = Math.max(0, 1 - dy / sheet.offsetHeight).toFixed(2); });
  function end(e){ if (!on) return; on = false; sheet.classList.remove('drag'); scrim.style.opacity = ''; if (dy > sheet.offsetHeight * .35 || dy / Math.max(1, e.timeStamp - t0) > .6) closeSheet(); else sheet.style.transform = ''; }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') closeSheet();
  if ((e.metaKey || e.ctrlKey) && e.key === 'z'){ e.preventDefault(); undoLast(); }
});

/* ---------- audio ---------- */
var ac = null;
function audio(){ if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
function tickS(){
  var a = audio(); if (!a) return;
  var o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = 'square'; o.frequency.value = 2400; g.gain.setValueAtTime(.025, t); g.gain.exponentialRampToValueAtTime(.0005, t + .025);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + .03);
}
function shutter(){
  var a = audio(); if (!a) return;
  [0, .07].forEach(function(dt){
    var n = Math.floor(a.sampleRate * .05), buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
    for (var i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = buf; f.type = 'bandpass'; f.frequency.value = 3200; g.gain.value = .35;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(a.currentTime + dt);
  });
}

/* ---------- toast ---------- */
var toastT = null, undoFn = null;
function toast(msg, undo){ $('toastT').textContent = msg; undoFn = undo || null; $('toastU').hidden = !undo; $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ $('toast').classList.remove('on'); undoFn = null; }, undo ? 3800 : 1900); }
$('toastU').addEventListener('click', function(){ if (undoFn){ undoFn(); undoFn = null; haptic(8); } $('toast').classList.remove('on'); });

/* ---------- boot ---------- */
function clock(){ var d = new Date(); $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
clock(); setInterval(clock, 20000);
if (navigator.getBattery) navigator.getBattery().then(function(b){ $('batt').setAttribute('width', Math.max(2, 15 * b.level).toFixed(1)); }).catch(function(){});
$('hist').classList.toggle('on', showHist); $('histBtn').setAttribute('aria-pressed', showHist);
// when a tall tool panel squeezes the photo, the overlays go compact instead of covering the picture
function fitOverlays(){ var f = $('frame'); f.classList.toggle('small', f.clientHeight < 260); }
var ro = window.ResizeObserver ? new ResizeObserver(function(){ fitOverlays(); schedule(); }) : null;
if (ro) ro.observe($('frame')); else window.addEventListener('resize', function(){ schedule(); });
loadPhoto();
})();
</script>
