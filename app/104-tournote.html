function badge(a){return `<span class="badge ${a.status==='done'?'done':a.status==='missed'?'missed':''}">${statusLabel[a.status]}</span>`;}
function room(){return `<div class="room"><svg viewBox="0 0 360 155" preserveAspectRatio="xMidYMid slice" role="img" aria-label="程序繪製的明亮公寓室內示意"><path fill="#dddcd3" d="M0 0h360v155H0z"/><path fill="#f3f2eb" d="M0 0h360l-63 29H66Z"/><path fill="#eaeae3" d="M66 29h231v86H66Z"/><path fill="#d0d1c6" d="m0 0 66 29v86L0 155Z"/><path fill="#e1e0d7" d="m360 0-63 29v86l63 40Z"/><path fill="#c6bca8" d="m66 115-66 40h360l-63-40Z"/><path fill="#adbba7" d="M159 34h62v81h-62Z"/><path fill="#6d8369" d="M164 80q20-36 51-14v44h-51Z"/><path fill="#83937c" d="M164 60q18-18 31 4l20-15v26l-51 22Z"/><path stroke="#fafaf3" stroke-width="4" d="M159 34h62v81h-62ZM190 34v81"/><path stroke="#adab9b" stroke-width=".6" d="m84 115-38 40m83-40-17 40m61-40v40m45-40 18 40m26-40 35 40M43 130h275M17 145h323"/><path fill="#f7f6ef" d="M72 106h70v12H72Z"/><path fill="#ada990" d="M82 96h12v12H82Z"/><path fill="#778465" d="M86 98q-17-19-3-27 0 10 6 13 10-16 17-13 1 13-18 27Z"/><path fill="#ebe8d7" opacity=".65" d="m165 116-8 39h94l-36-39Z"/></svg><span class="room-tag">空間示意 · 非實景</span></div>`;}
function card(a){const p=properties[a.property];return `<div class="slot"><div class="time">${a.time}<small>${+a.time.slice(0,2)<12?'AM':'PM'}</small></div><button class="appointment" data-open="${esc(a.id)}"><div class="person"><span class="avatar">${icon(['person','key','video'][a.type])}</span><div><strong>${esc(a.name)}</strong><p>${p.unit} 號 · ${p.name}</p></div></div><div class="card-foot">${badge(a)}<span>${a.type===0?'YH 予禾 · 帶看':types[a.type]}</span></div></button></div>`;}
function render(){const head=$('#head'),content=$('#content'),nav=$('#nav');head.className='screen-head';
 if(selected){renderDetail();return;}
 const titles={tours:'帶看行程',homes:'房源小冊',notes:'跟進便條'};
 head.innerHTML=`<h2>${titles[view]}</h2>${view==='tours'?`<button class="pill" data-action="date" aria-label="選擇行程日期">${icon('calendar')}${stamp(date).month} 月 ${stamp(date).year}</button><button class="circle dark" data-action="new" aria-label="新增帶看預約">${icon('plus')}</button>`:`<span class="eyebrow">TOURNOTE</span>`}`;
 nav.innerHTML=[['homes','home','房源'],['tours','calendar','行程'],['notes','chat','跟進']].map(([v,i,n])=>`<button data-view="${v}" aria-label="${n}" ${view===v?'aria-current="page"':''}>${icon(i)}${view===v?n:''}</button>`).join('');
 if(view==='tours'){
 const rows=appointments.filter(a=>a.date===date).sort((a,b)=>a.time.localeCompare(b.time));
 const start=new Date(date+'T12:00:00');if(start.getDay()!==0)start.setDate(start.getDate()-((start.getDay()+6)%7));
 const week=Array.from({length:6},(_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;return `<button class="day" data-date="${key}" aria-label="${pretty(key)}" aria-pressed="${key===date}"><span>週${days[d.getDay()]}</span><strong>${d.getDate()}</strong><small>${appointments.filter(a=>a.date===key).length} 組帶看</small></button>`;}).join('');
 let list=rows.map(a=>({time:a.time,html:card(a)}));if(!rows.some(a=>a.time==='13:00'))list.push({time:'13:00',html:`<div class="slot"><div class="time" style="color:var(--muted)">13:00<small>PM</small></div><button class="open-slot" data-action="open-slot">${icon('plus')}留一點空檔，安排新相遇</button></div>`});list.sort((a,b)=>a.time.localeCompare(b.time));
 content.innerHTML=`<div class="week">${week}</div><div class="section-label"><span>${pretty(date)}</span><span>${rows.filter(a=>a.status==='done').length} / ${rows.length} 已完成</span></div>${rows.length?`<div class="timeline">${list.map(x=>x.html).join('')}</div>`:`<div class="empty"><h3>留白，也是好行程。</h3><p>這天還沒有安排帶看。<br>為下一次見面，留一個時間。</p><button class="pill dark" data-action="new">${icon('plus')}安排帶看</button></div>`}<p class="hint">示範行程 · ${storageOK?'變更會保存在此瀏覽器':'暫存模式，關閉後不保留'}<br>沒有連接真實客戶、簡訊或 AI 服務</p>`;
 }else if(view==='homes'){content.innerHTML=properties.map((p,i)=>`<button class="property" data-property="${i}">${room()}<div class="property-caption"><div><h3>${p.name} · ${p.unit}</h3><p>${p.size} · ${p.rent}</p></div>${icon('arrow')}</div></button>`).join('');}
 else{const rows=appointments.filter(a=>a.saved||a.status==='done');content.innerHTML=`<div class="section-label"><span>讓每段對話，有下一步</span><span>${rows.length} 則便條</span></div>`+rows.map(a=>`<button class="list-card" data-open="${esc(a.id)}"><h3>${esc(a.name)} <span class="badge">${a.saved?'已存草稿':'待跟進'}</span></h3><p>${esc(noteFor(a))}</p><p style="margin-top:12px">${pretty(a.date)} · ${properties[a.property].name}</p></button>`).join('')+`<p class="hint">便條只在本機儲存，不會自動傳送。</p>`;}
}
function renderDetail(){const a=appointments.find(x=>x.id===selected);if(!a){selected=null;render();return;}const p=properties[a.property],d=stamp(a.date),minutes=+a.time.slice(0,2)*60 + +a.time.slice(3)+30,end=`${String(Math.floor(minutes/60)).padStart(2,'0')}:${String(minutes%60).padStart(2,'0')}`;
 $('#head').className='screen-head back-head';$('#head').innerHTML=`<button class="circle" data-action="back" aria-label="返回行程">${icon('back')}</button><div style="flex:1"><div class="sub">帶看預約 · ${statusLabel[a.status]}</div><h2>${esc(a.name)}</h2></div><button class="circle" data-action="edit-note" aria-label="編輯跟進便條">${icon('chat')}</button>`;
 $('#content').innerHTML=`<section class="summary"><div class="date-block"><small>星期${d.week}</small><strong>${d.day}</strong><small>${d.month} 月 ${d.year}</small></div><div><h3>${a.time} — ${end}</h3><p>${icon(['person','key','video'][a.type])}${types[a.type]}${a.type===0?' · 林予禾':''}</p><p>${icon('pin')}${a.type===2?'線上導覽 · 示範預約':'一樓集合 · '+p.name}</p></div></section><button class="property" data-property="${a.property}">${room()}<div class="property-caption"><div><h3>${p.unit} 號 · ${p.name}</h3><p>${p.size} · ${p.rent}</p></div><span class="circle" style="background:var(--soft);width:30px;height:30px">${icon('arrow')}</span></div></button><section class="note"><div class="note-head"><b>✧ 跟進便條</b><span>本機草稿 · 由你決定下一步</span></div><p>${esc(noteFor(a))}</p><div class="actions"><button class="pill dark" data-action="save-note">${icon('check')}${a.saved?'草稿已儲存':'儲存跟進草稿'}</button><button class="pill" data-action="edit-note">編輯</button></div></section><section class="history" aria-label="預約紀錄"><p>${icon('check')}預約已建立<small>示範紀錄</small></p><p>${icon('clock')}行前提醒<small>${a.reminder?'已設定（本機）':'未設定'}</small></p><p>${icon('calendar')}${a.rescheduled?'已重新安排':'帶看時間'}<small>${d.month}/${d.day} ${a.time}</small></p></section><p class="hint">所有客戶、房源與行程皆為示範資料</p>`;
 $('#nav').innerHTML=`<div class="actions"><button data-action="reschedule">${icon('calendar')}重新安排</button><button class="dark" data-action="complete">${icon('check')}${a.status==='done'?'恢復為已確認':'標記已完成'}</button></div>`;
}
function placeSheet(){const r=$('.screen').getBoundingClientRect(),sheet=$('#sheet');Object.assign(sheet.style,{position:'fixed',left:r.left+'px',right:'auto',bottom:(innerHeight-r.bottom)+'px',width:r.width+'px',maxHeight:(r.height*.92)+'px'});}
new ResizeObserver(placeSheet).observe($('.screen'));window.addEventListener('resize',placeSheet);
function openSheet(title,html){placeSheet();returnFocus=document.activeElement;$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=html;$('#sheet').showModal();}
function closeSheet(){ $('#sheet').close();if(returnFocus?.isConnected)returnFocus.focus(); }
$('#closeSheet').onclick=closeSheet;
$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet')){const r=e.target.getBoundingClientRect();if(e.clientY<r.top||e.clientX<r.left||e.clientX>r.right)closeSheet();}});
function booking(edit=false,initialTime='10:30'){
 const a=edit?appointments.find(x=>x.id===selected):null;let draft={name:a?.name||'',property:a?.property??0,type:a?.type??0,date:a?.date||date,time:a?.time||initialTime,reminder:a?.reminder??true};
 openSheet(edit?'重新安排帶看':'安排新的帶看',`<form class="sheet-form" id="booking"><div class="two"><label><span class="field">客戶姓名</span><input name="client" aria-label="客戶姓名" maxlength="30" placeholder="例如：許知夏" required value="${esc(draft.name)}"></label><label><span class="field">帶看房源</span><select name="property" aria-label="帶看房源">${properties.map((p,i)=>`<option value="${i}" ${i===draft.property?'selected':''}>${p.name} · ${p.unit}</option>`).join('')}</select></label></div><span class="field">帶看方式</span><div class="seg" aria-label="帶看方式">${types.map((t,i)=>`<button type="button" data-type="${i}" aria-pressed="${i===draft.type}">${t}</button>`).join('')}</div><label><span class="field">日期</span><input name="date" aria-label="預約日期" type="date" required value="${draft.date}" min="2026-01-01" max="2030-12-31"></label><span class="field">可預約時段 · 每次 30 分鐘</span><div class="times">${[...new Set(['09:00','09:30','10:30','11:30','12:00','13:00','14:00','14:30','15:30','16:30',draft.time])].sort().map(t=>`<button type="button" data-time="${t}" aria-pressed="${t===draft.time}">${t}</button>`).join('')}</div><label class="toggle-row">保留行前提醒設定<input name="reminder" type="checkbox" ${draft.reminder?'checked':''}></label><p class="storage-note">提醒僅為本機設定，這個原型不會發送通知或訊息。</p><p class="error" id="formError" role="alert"></p><button class="pill dark submit" type="submit">${icon('calendar')}${edit?'確認改期':'確認安排'} · <span id="chosenTime">${draft.time}</span></button></form>`);
 const form=$('#booking');
 function availability(){const chosen=form.elements.date.value;form.querySelectorAll('[data-time]').forEach(b=>{const clash=appointments.some(x=>x.id!==a?.id&&x.date===chosen&&x.time===b.dataset.time);b.disabled=clash;b.setAttribute('aria-label',b.dataset.time+(clash?' 已有預約':''));});}
 availability();form.elements.date.onchange=availability;
 form.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{draft.type=+b.dataset.type;form.querySelectorAll('[data-type]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
 form.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{draft.time=b.dataset.time;$('#chosenTime').textContent=draft.time;form.querySelectorAll('[data-time]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#formError').textContent='';});
 form.onsubmit=e=>{e.preventDefault();const name=form.elements.client.value.trim(),newDate=form.elements.date.value;if(!name){$('#formError').textContent='請填寫客戶姓名。';form.elements.client.focus();return;}if(appointments.some(x=>x.id!==a?.id&&x.date===newDate&&x.time===draft.time)){$('#formError').textContent='這個時段已經有預約，請選擇另一個時間。';return;}
 const updated={...draft,name,date:newDate,property:+form.elements.property.value,reminder:form.elements.reminder.checked};if(a){Object.assign(a,updated,{rescheduled:true});}else{const newA={...updated,id:crypto.randomUUID(),status:'confirmed',note:'',saved:false};appointments.push(newA);selected=newA.id;}date=newDate;save();closeSheet();render();$('#content').scrollTop=0;notify(storageOK?(edit?'已更新帶看時間。':'新預約已安排。'):'已安排，僅保留於本次瀏覽。');};
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.view){view=b.dataset.view;selected=null;render();$('#content').scrollTop=0;return;}
 if(b.dataset.date){date=b.dataset.date;render();return;}
 if(b.dataset.open){selected=b.dataset.open;render();$('#content').scrollTop=0;$('#head button').focus();return;}
 if(b.dataset.property!==undefined){const p=properties[+b.dataset.property];openSheet(p.name,`<div class="property-info">${room()}<p><strong>${p.unit} 號 · ${p.size}</strong><br>${p.rent}<br>${p.address}</p><p>${p.desc}</p><p class="storage-note">虛構房源 · 圖像為程式繪製的室內示意，不代表真實物件。</p></div>`);return;}
 const action=b.dataset.action,a=appointments.find(x=>x.id===selected);
 if(action==='new'||action==='open-slot')booking(false,action==='open-slot'?'13:00':'10:30');
 if(action==='reschedule')booking(true);
 if(action==='back'){const id=selected;selected=null;render();const target=document.querySelector(`[data-open="${CSS.escape(id)}"]`);(target||$('#head button'))?.focus();}
 if(action==='complete'&&a){a.status=a.status==='done'?'confirmed':'done';save();render();notify(a.status==='done'?'帶看已完成，記得留下下一步。':'已恢復為已確認。');}
 if(action==='save-note'&&a){a.note=noteFor(a);a.saved=true;save();render();notify(storageOK?'草稿已儲存，沒有傳送訊息。':'草稿暫存於此次瀏覽。');}
 if(action==='edit-note'&&a){openSheet('編輯跟進便條',`<form id="noteForm"><label class="field" for="noteText">想對 ${esc(a.name)} 說的話</label><textarea id="noteText" maxlength="500" required>${esc(noteFor(a))}</textarea><p class="storage-note">只儲存草稿，不會發送給客戶。</p><button class="pill dark submit" type="submit">儲存便條</button></form>`);$('#noteForm').onsubmit=e=>{e.preventDefault();const value=$('#noteText').value.trim();if(!value){$('#noteText').setCustomValidity('請填寫便條內容');$('#noteText').reportValidity();return;}a.note=value;a.saved=true;save();closeSheet();render();notify('便條已更新。');};$('#noteText').oninput=()=>$('#noteText').setCustomValidity('');}
 if(action==='date'){openSheet('跳至指定日期',`<form class="sheet-form" id="dateForm"><label><span class="field">行程日期</span><input type="date" name="day" value="${date}" min="2026-01-01" max="2030-12-31" required aria-label="行程日期"></label><button class="pill dark submit">查看行程</button><p class="storage-note">示範行程從 2026 年 9 月 21 日開始；其他日期也可以新增預約。</p></form>`);$('#dateForm').onsubmit=e=>{e.preventDefault();date=e.target.elements.day.value;closeSheet();render();};}
});
render();
})();
</script>
</body>
</html>
