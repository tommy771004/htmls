}function renderEvents(){let active=events.filter(e=>activeOn(e,selected)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('#agendaTitle').textContent=pad(selected.getMonth()+1)+' / '+pad(selected.getDate())+'  '+weekday(selected)+'曜日';$('#eventCount').textContent=active.length+' EVENTS';let root=$('#events');root.replaceChildren();if(!active.length){let p=document.createElement('p');p.className='empty';p.textContent='這天還沒有安排。留一些空白，也很好。';root.append(p)}active.forEach(e=>{let row=document.createElement('div');row.className='event '+e.category;row.dataset.event=e.id;let bar=document.createElement('i');bar.className='bar';let text=document.createElement('div');let title=document.createElement('strong');title.textContent=e.title;let small=document.createElement('small');small.textContent=(e.time||'09:00')+'–'+clockTime(toMinutes(e.time||'09:00')+(e.duration||60))+' · '+({personal:'私事',work:'工作',life:'生活'}[e.category]||'私事')+(e.start!==e.end?' · 多日':'');text.append(title,small);let del=document.createElement('button');del.type='button';del.setAttribute('aria-label','刪除 '+e.title);del.textContent='×';del.onclick=()=>{events=events.filter(x=>x.id!==e.id);save();render()};row.append(bar,text,del);root.append(row)})}function openSheet(a=key(selected),b=a){$('#start').value=a<b?a:b;$('#end').value=a<b?b:a;$('#scrim').hidden=false;$('#sheet').classList.add('open');$('#sheet').inert=false;setTimeout(()=>$('#title').focus(),120)}function closeSheet(){$('#sheet').classList.remove('open');$('#sheet').inert=true;$('#add').focus();$('#scrim').hidden=true;$('#title').value=''}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('#prev').onclick=()=>{if(view==='month')selected=new Date(selected.getFullYear(),selected.getMonth()-1,Math.min(selected.getDate(),28),12);else selected=add(selected,view==='week'?-7:-1);render()};$('#next').onclick=()=>{if(view==='month')selected=new Date(selected.getFullYear(),selected.getMonth()+1,Math.min(selected.getDate(),28),12);else selected=add(selected,view==='week'?7:1);render()};$('#add').onclick=()=>openSheet();$('#cancel').onclick=closeSheet;$('#scrim').onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});$('#form').onsubmit=e=>{e.preventDefault();let a=$('#start').value,b=$('#end').value;if(b<a){$('#end').setCustomValidity('結束日期不能早於開始日期');$('#end').reportValidity();return}$('#end').setCustomValidity('');let created={id:String(Date.now())+Math.random().toString(36).slice(2,5),title:$('#title').value.trim(),start:a,end:b,time:$('#eventTime').value,category:$('#category').value,duration:Math.min(Number($('#duration').value),1440-toMinutes($('#eventTime').value||'09:00'))};if(!created.title){$('#title').setCustomValidity('請輸入事件名稱');$('#title').reportValidity();return}if(created.duration<15){$('#eventTime').setCustomValidity('開始時間最晚為 23:45');$('#eventTime').reportValidity();return}events.push(created);save();selected=date(a);closeSheet();render();let fresh=Array.from($('#events').querySelectorAll('[data-event]')).find(row=>row.dataset.event===created.id);if(fresh){fresh.classList.add('fresh');setTimeout(()=>fresh.classList.remove('fresh'),200)}};$('#title').oninput=()=>$('#title').setCustomValidity('');$('#eventTime').oninput=()=>$('#eventTime').setCustomValidity('');$('#end').oninput=()=>$('#end').setCustomValidity('');setInterval(()=>{let d=new Date();if(key(d)!==key(today)){today=d;render()}},60000);$('#sheet').inert=true;render()})();
</script></body></html>
