:root{font-family:"Avenir Next",Avenir,"Helvetica Neue","PingFang TC",sans-serif;color:#181818;background:#e7e6e1}*{box-sizing:border-box}body{margin:0;min-height:100dvh}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #d9322e;outline-offset:2px}.app{width:min(100%,480px);min-height:100dvh;margin:auto;background:#f5f4f0;box-shadow:0 20px 40px #27272220;display:flex;flex-direction:column;position:relative;overflow:hidden}.status{height:40px;padding:11px 22px 0;display:flex;justify-content:space-between;font:600 12px/1 "Helvetica Neue",sans-serif}.head{padding:18px 22px 21px;border-bottom:2px solid #181818}.brand{display:flex;align-items:flex-start;justify-content:space-between}.brand h1{font-size:48px;line-height:.9;letter-spacing:-.095em;margin:0;font-weight:800}.brand .issue{text-align:right;font:700 11px/1.35 "Helvetica Neue",sans-serif;letter-spacing:.04em}.brand .issue span{color:#d9322e}.deck{margin:22px 0 0;display:flex;justify-content:space-between;align-items:end}.deck p{margin:0;font-size:12px;color:#5a5a57}.deck strong{font-size:15px}.overview{display:flex;justify-content:space-between;align-items:flex-end;padding:20px 22px 14px}.monthTitle{display:flex;align-items:baseline;gap:12px}.monthTitle strong{font-size:70px;line-height:.85;letter-spacing:-.1em;font-weight:700}.monthTitle span{font-size:19px;font-weight:600;letter-spacing:-.02em}.arrows{display:flex;gap:7px}.arrows button{width:38px;height:38px;background:transparent;border:1px solid #181818;font-size:22px;line-height:1}.arrows button:active{background:#181818;color:white}.views{display:flex;border-bottom:1px solid #181818;margin:0 22px 14px}.views button{background:none;border:0;border-bottom:4px solid transparent;color:#8b8b87;padding:8px 14px 9px;font-size:13px;font-weight:700;letter-spacing:.08em}.views button:first-child{padding-left:0}.views button.active{border-color:#d9322e;color:#181818}.calendar{margin:0 22px;position:relative}.weekdays,.monthGrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays span{text-align:center;font-size:10px;font-weight:700;padding:8px 0;border-top:1px solid #181818}.weekdays span:first-child{color:#d9322e}.monthGrid{border-left:1px solid #d6d5cf;border-top:1px solid #d6d5cf;user-select:none}.day{min-width:0;min-height:clamp(55px,10.8dvh,80px);text-align:left;border:0;border-right:1px solid #d6d5cf;border-bottom:1px solid #d6d5cf;background:transparent;padding:6px 5px;position:relative;color:#181818;touch-action:none}.day.other{color:#aaa9a3}.day.sunday .date{color:#d9322e}.day.selected{background:#ecebe4}.day.today:after{content:"";position:absolute;width:5px;height:5px;background:#d9322e;right:6px;top:8px}.date{font-size:16px;font-weight:600}.dots{display:flex;gap:2px;position:absolute;bottom:7px;left:5px}.dots i{display:block;width:5px;height:5px;background:#d9322e}.dots i.work{background:#181818}.dots i.life{background:#9b9b94}.day.drag{background:#edddd7}.weekView{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #181818;border-bottom:1px solid #181818}.weekDay{min-width:0;background:transparent;border:0;border-right:1px solid #d6d5cf;padding:13px 2px 9px;min-height:114px;display:flex;flex-direction:column;align-items:center;gap:8px}.weekDay:last-child{border:0}.weekDay small{font-size:10px}.weekDay strong{font-size:23px;line-height:1}.weekDay.sel{background:#181818;color:#fff}.weekDay.sun strong{color:#d9322e}.weekDay.sel.sun strong{color:#ffb2ab}.weekDay i{display:block;width:5px;height:5px;background:#d9322e}.dayView{border-top:1px solid #181818;display:grid;grid-template-columns:50px 1fr}.hour{display:contents}.hour span{font:11px "Helvetica Neue",sans-serif;padding:12px 0;border-top:1px solid #d9d7d0}.hour div{border-top:1px solid #d9d7d0;min-height:48px;padding:2px 0}.hour button{border:0;background:#181818;color:white;width:100%;text-align:left;padding:4px 8px;font-size:11px}.hour button.life{background:#aaa9a0;color:#111}.hour button.personal{background:#d9322e}.agenda{padding:22px;flex:1;min-height:150px}.agendaHead{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #181818;padding-top:10px}.agenda h2{font-size:19px;margin:0;font-weight:700}.agendaHead span{font-size:11px;color:#74736e}.event{display:grid;grid-template-columns:5px 1fr auto;gap:11px;align-items:start;border-bottom:1px solid #d6d5cf;padding:13px 0}.event .bar{height:32px;background:#d9322e}.event.work .bar{background:#181818}.event.life .bar{background:#aaa9a0}.event strong{display:block;font-size:14px}.event small{display:block;font-size:11px;color:#6d6b66;margin-top:3px}.event button{background:none;border:0;color:#888;font-size:18px;padding:0 4px}.empty{font-size:13px;color:#797871;padding:20px 0}.fab{position:sticky;bottom:calc(18px + env(safe-area-inset-bottom));align-self:flex-end;margin:0 22px 20px 0;background:#d9322e;color:white;border:0;border-radius:50%;width:56px;height:56px;font-size:30px;box-shadow:4px 5px 0 #1e1e1e}.fab:active{transform:translate(3px,3px);box-shadow:1px 2px 0 #1e1e1e}.scrim{position:fixed;inset:0;background:#1119;z-index:5}.sheet{position:absolute;bottom:0;left:0;right:0;background:#f5f4f0;z-index:6;padding:18px 23px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px #0003;transform:translateY(105%);transition:transform .33s cubic-bezier(.2,1,.3,1)}.sheet.open{transform:translateY(0)}.sheet .handle{width:38px;height:4px;background:#989891;margin:-5px auto 15px}.sheet h2{font-size:27px;margin:0 0 17px;letter-spacing:-.04em}.sheet label{display:block;font-size:11px;font-weight:700;margin:13px 0 5px}.sheet input,.sheet select{width:100%;border:1px solid #777;background:white;padding:11px;color:#181818;border-radius:0}.sheet .row{display:flex;gap:10px}.sheet .row label{flex:1;min-width:0}.sheet .actions{display:flex;gap:10px;margin-top:20px}.sheet button{flex:1;padding:12px 8px;background:white;border:1px solid #181818;font-weight:700}.sheet button.save{background:#181818;color:white}.hint{font-size:11px;color:#777;padding:7px 22px 0}[hidden]{display:none!important}@media(min-width:700px){.app{margin:24px auto;min-height:calc(100dvh - 48px);border-radius:20px}.scrim{position:absolute}.sheet{border-radius:20px 20px 0 0}}@media(max-height:700px){.day{min-height:52px}.overview{padding-top:10px}.monthTitle strong{font-size:54px}.head{padding-bottom:12px}.agenda{padding-top:13px}}@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
</style></head><body><main class="app"><div class="status"><span>09:41</span><span>●●● ▰ 100%</span></div><header class="head"><div class="brand"><h1>曆<span style="color:#d9322e">.</span></h1><div class="issue">A CALENDAR<br>FOR <span>EVERY DAY</span><br>NO. 089</div></div><div class="deck"><p>把日子放大，事情看清楚。</p><strong id="todayLabel"></strong></div></header><div class="overview"><div class="monthTitle"><strong id="bigMonth"></strong><span id="monthLabel"></span></div><div class="arrows"><button id="prev" aria-label="前一個日期範圍">‹</button><button id="next" aria-label="下一個日期範圍">›</button></div></div><nav class="views" aria-label="檢視方式"><button class="active" data-view="month">月 MONTH</button><button data-view="week">週 WEEK</button><button data-view="day">日 DAY</button></nav><div class="calendar" id="calendar"></div><p class="hint" id="hint">長按拖曳日期可建立多日事件。</p><section class="agenda"><div class="agendaHead"><h2 id="agendaTitle">今日安排</h2><span id="eventCount"></span></div><div id="events"></div></section><button class="fab" id="add" aria-label="新增事件">+</button><div class="scrim" id="scrim" hidden></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="新增事件"><div class="handle"></div><h2>新增一件事<span style="color:#d9322e">.</span></h2><form id="form"><label for="title">事件名稱</label><input id="title" required maxlength="48" placeholder="例：散步、開會、買花"><div class="row"><label>開始日期<input id="start" type="date" required></label><label>結束日期<input id="end" type="date" required></label></div><div class="row"><label>時間<input id="eventTime" type="time" value="09:00"></label><label>分類<select id="category"><option value="personal">私事</option><option value="work">工作</option><option value="life">生活</option></select></label></div><div class="actions"><button type="button" id="cancel">取消</button><button class="save" type="submit">儲存事件</button></div></form></section></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),date=s=>new Date(s+'T12:00:00'),add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},today=new Date();let selected=new Date(today),view='month',events;try{events=JSON.parse(localStorage.getItem('swiss-calendar:events')||'[]')}catch{events=[]}function save(){localStorage.setItem('swiss-calendar:events',JSON.stringify(events))}function same(a,b){return key(a)===key(b)}function activeOn(e,d){let k=key(d);return e.start<=k&&k<=e.end}function weekday(d){return '日一二三四五六'[d.getDay()]}function setSelected(d){selected=new Date(d);render()}function render(){const m=selected.getMonth()+1;$('#bigMonth').textContent=pad(m);$('#monthLabel').innerHTML=`${selected.getFullYear()}<br>${['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'][m-1]}`;$('#todayLabel').textContent=pad(today.getMonth()+1)+'.'+pad(today.getDate())+' '+weekday(today);$('#hint').hidden=view!=='month';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const root=$('#calendar');root.replaceChildren();if(view==='month')renderMonth(root);else if(view==='week')renderWeek(root);else renderDay(root);renderEvents()}function renderMonth(root){let hd=document.createElement('div');hd.className='weekdays';'日一二三四五六'.split('').forEach(c=>{let s=document.createElement('span');s.textContent=c;hd.append(s)});root.append(hd);let grid=document.createElement('div');grid.className='monthGrid';let first=new Date(selected.getFullYear(),selected.getMonth(),1,12),start=add(first,-first.getDay());let dragStart=null;for(let i=0;i<42;i++){let d=add(start,i),k=key(d),b=document.createElement('button');b.type='button';b.className='day'+(d.getMonth()!==selected.getMonth()?' other':'')+(d.getDay()===0?' sunday':'')+(same(d,selected)?' selected':'')+(same(d,today)?' today':'');b.dataset.date=k;b.innerHTML='<span class="date">'+d.getDate()+'</span>';let dots=document.createElement('span');dots.className='dots';events.filter(e=>activeOn(e,d)).slice(0,3).forEach(e=>{let dot=document.createElement('i');dot.className=e.category;dots.append(dot)});b.append(dots);b.addEventListener('pointerdown',e=>{dragStart=k;b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',e=>{let under=document.elementFromPoint(e.clientX,e.clientY)?.closest('.day');let end=under?.dataset.date||k;if(dragStart&&end!==dragStart){openSheet(dragStart,end);dragStart=null}else setSelected(date(k))});grid.append(b)}root.append(grid)}function renderWeek(root){let w=document.createElement('div');w.className='weekView';let s=add(selected,-selected.getDay());for(let i=0;i<7;i++){let d=add(s,i),b=document.createElement('button');b.className='weekDay'+(same(d,selected)?' sel':'')+(d.getDay()===0?' sun':'');b.innerHTML='<small>'+weekday(d)+'</small><strong>'+pad(d.getDate())+'</strong>';for(let j=0;j<Math.min(3,events.filter(e=>activeOn(e,d)).length);j++)b.append(document.createElement('i'));b.onclick=()=>setSelected(d);w.append(b)}root.append(w)}function renderDay(root){let d=document.createElement('div');d.className='dayView';for(let h=7;h<=21;h++){let row=document.createElement('div');row.className='hour';let label=document.createElement('span');label.textContent=pad(h)+':00';let slot=document.createElement('div');events.filter(e=>activeOn(e,selected)&&parseInt(e.time||'09',10)===h).forEach(e=>{let b=document.createElement('button');b.className=e.category;b.textContent=e.title;b.onclick=()=>{document.querySelector('[data-event="'+e.id+'"]').scrollIntoView({behavior:'smooth',block:'center'})};slot.append(b)});row.append(label,slot);d.append(row)}root.append(d)}function renderEvents(){let active=events.filter(e=>activeOn(e,selected)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('#agendaTitle').textContent=pad(selected.getMonth()+1)+' / '+pad(selected.getDate())+'  '+weekday(selected)+'曜日';$('#eventCount').textContent=active.length+' EVENTS';let root=$('#events');root.replaceChildren();if(!active.length){let p=document.createElement('p');p.className='empty';p.textContent='這天還沒有安排。留一些空白，也很好。';root.append(p)}active.forEach(e=>{let row=document.createElement('div');row.className='event '+e.category;row.dataset.event=e.id;let bar=document.createElement('i');bar.className='bar';let text=document.createElement('div');let title=document.createElement('strong');title.textContent=e.title;let small=document.createElement('small');small.textContent=(e.time||'全天')+' · '+({personal:'私事',work:'工作',life:'生活'}[e.category]||'私事')+(e.start!==e.end?' · 多日':'');text.append(title,small);let del=document.createElement('button');del.type='button';del.setAttribute('aria-label','刪除 '+e.title);del.textContent='×';del.onclick=()=>{events=events.filter(x=>x.id!==e.id);save();render()};row.append(bar,text,del);root.append(row)})}function openSheet(a=key(selected),b=a){$('#start').value=a<b?a:b;$('#end').value=a<b?b:a;$('#scrim').hidden=false;$('#sheet').classList.add('open');setTimeout(()=>$('#title').focus(),120)}function closeSheet(){$('#sheet').classList.remove('open');$('#scrim').hidden=true;$('#title').value=''}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});$('#prev').onclick=()=>{if(view==='month')selected=new Date(selected.getFullYear(),selected.getMonth()-1,Math.min(selected.getDate(),28),12);else selected=add(selected,view==='week'?-7:-1);render()};$('#next').onclick=()=>{if(view==='month')selected=new Date(selected.getFullYear(),selected.getMonth()+1,Math.min(selected.getDate(),28),12);else selected=add(selected,view==='week'?7:1);render()};$('#add').onclick=()=>openSheet();$('#cancel').onclick=closeSheet;$('#scrim').onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});$('#form').onsubmit=e=>{e.preventDefault();let a=$('#start').value,b=$('#end').value;if(b<a){$('#end').setCustomValidity('結束日期不能早於開始日期');$('#end').reportValidity();return}$('#end').setCustomValidity('');events.push({id:String(Date.now())+Math.random().toString(36).slice(2,5),title:$('#title').value.trim(),start:a,end:b,time:$('#eventTime').value,category:$('#category').value});save();selected=date(a);closeSheet();render()};$('#end').oninput=()=>$('#end').setCustomValidity('');render()})();
</script></body></html>
