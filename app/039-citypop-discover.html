<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1283b3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="夏夜">
<title>夏夜 · 音樂探索</title>
<meta name="description" content="80 年代 City Pop 唱片探索：左右甩唱片封套決定喜歡或略過，唱片滑出封套即時合成試聽，收進你的唱片箱。收錄於 100 Creative HTML Works（App 039・日本 City Pop 平塗插畫）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/039-citypop-discover.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231283b3'/%3E%3Crect y='10' width='64' height='8' fill='%23ff7a63'/%3E%3Crect y='20' width='64' height='6' fill='%23ffa06b'/%3E%3Crect y='28' width='64' height='5' fill='%23ffe45c'/%3E%3Cpath d='M0 40h64v24H0z' fill='%231fa7d8'/%3E%3Cpath d='M44 60c0-14 2-22 6-30' stroke='%230c3a4a' stroke-width='3' fill='none'/%3E%3Cpath d='M50 30c-8-4-16 0-18 4 6-3 12-2 18-4zm0 0c6-6 12-6 16-3-6-1-10 0-16 3zm0 0c2-8 0-12-4-14 4 5 4 9 4 14z' fill='%230c3a4a'/%3E%3C/svg%3E">
<style>
:root{
  --pool:#1283b3;
  --pool-2:#0f76a2;
  --pool-3:#0b5f84;
  --coral:#ff7a63;
  --lemon:#ffe45c;
  --white:#fffdf6;
  --ink:#0c3a4a;
  --dim:rgba(255,253,246,.82);
  --dim2:rgba(255,253,246,.66);
  --fut:"Futura","Futura PT","Avenir Next","PingFang TC",system-ui,sans-serif;
  --sans:-apple-system,"PingFang TC","Heiti TC",system-ui,sans-serif;
  --out:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.3,1.4,.5,1);
  --cs:320px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.45 var(--sans);color:var(--white);background:var(--pool);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lemon);outline-offset:3px;border-radius:8px}
svg{display:block}
.ob{font-family:var(--fut);font-weight:700;font-style:italic}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--pool);isolation:isolate}
@media (min-width:521px){
  body{background:#ff9a6b}
  .stage{display:flex;align-items:center;justify-content:center;gap:60px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:50px;padding:9px;z-index:1;background:#fffdf6;
    box-shadow:inset 0 0 0 1px #e8e2d0,inset 0 -3px 0 #d9d2bd,0 14px 24px -14px rgba(12,58,74,.55)}
  .screen{inset:9px;border-radius:42px}
  .caption{display:block;position:relative;z-index:1;max-width:260px;color:var(--white)}
  .caption h1{font:italic 700 58px/1 var(--fut);letter-spacing:.02em;color:var(--white)}
  .caption h1 small{display:block;font-size:20px;letter-spacing:.14em;color:var(--ink);margin-top:10px}
  .caption p{margin-top:18px;font:600 16px/1.7 var(--sans);color:var(--ink)}
}
@media (min-width:521px) and (max-width:900px){.caption{display:none}}

/* pool caustics */
.water{position:absolute;inset:-60px;z-index:0;pointer-events:none}
.water svg{width:100%;height:100%}
.water g{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(26px,18px)}}

.status{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;height:calc(46px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 32px;font:600 15px/1 var(--sans);pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}

.view{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;padding-top:calc(46px + env(safe-area-inset-top))}
.view[hidden]{display:none}

/* header */
.head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 0 22px;height:58px}
.logo{display:flex;align-items:baseline;gap:10px}
.logo b{font:italic 700 34px/1 var(--fut);letter-spacing:.02em}
.logo span{font:italic 700 13px/1 var(--fut);color:var(--lemon);letter-spacing:.12em}
.crateBtn{display:flex;align-items:center;gap:6px;height:48px;padding:0 8px;border-radius:12px;font:italic 700 18px/1 var(--fut)}
.crateBtn svg{width:34px;height:30px}
.crateBtn:active{transform:scale(.94)}
.times{display:flex;gap:4px;padding:2px 14px 0 16px}
.times button{height:44px;padding:0 10px;font:italic 700 19px/1 var(--fut);color:var(--dim2);transition:color .25s}
.times button[aria-pressed=true]{color:var(--lemon)}
.times button:active{transform:scale(.95)}
.times .n{font-size:13px;margin-left:3px;vertical-align:3px;color:inherit;opacity:.8}

/* deck */
.deckwrap{position:relative;flex:none;height:calc(var(--cs) + 26px);margin-top:10px}
.next{margin:auto 0;display:flex;align-items:center;gap:12px;padding:10px 26px 12px;min-height:76px}
.next .lbl{font:italic 700 14px/1.2 var(--fut);color:var(--dim);flex:none;width:44px}
.next button{width:50px;height:50px;flex:none;border-radius:3px;overflow:hidden;box-shadow:0 3px 6px -3px rgba(6,44,62,.6);transition:transform .2s var(--out)}
.next button:nth-child(odd){transform:rotate(-3deg)}
.next button:nth-child(even){transform:rotate(2deg)}
.next button:active{transform:scale(.9)}
.next button svg{width:100%;height:100%}
.tight .next{display:none}
.tight .ctrl{margin-top:auto}
.next .more{font:italic 700 15px/1 var(--fut);color:var(--dim2)}
.deck{position:absolute;left:50%;top:6px;width:var(--cs);height:var(--cs);margin-left:calc(var(--cs) / -2)}
.card{position:absolute;inset:0;touch-action:none;will-change:transform;transition:transform .5s var(--spring)}
.card.drag{transition:none}
.card.fly{transition:transform .45s cubic-bezier(.4,.1,.8,.6)}
.card .sleeve{position:absolute;inset:0;border-radius:4px;overflow:hidden;background:#fff;transition:transform .6s var(--spring);z-index:2;box-shadow:0 5px 10px -4px rgba(6,44,62,.55)}
.card .sleeve svg{width:100%;height:100%}
.card .rec{position:absolute;inset:3%;border-radius:50%;z-index:1;transition:transform .7s var(--spring)}
.card .rec svg{width:100%;height:100%}
.card .rec .spin{transform-origin:50% 50%;transform-box:fill-box}
.card.playing .sleeve{transform:translateX(-17%) scale(.8)}
.card.playing .rec{transform:translateX(30%) scale(.8)}
.card.playing .rec .spin{animation:spin 1.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stamp{position:absolute;top:22px;z-index:3;font:italic 700 34px/1 var(--fut);padding:6px 12px 4px;border:4px solid currentColor;border-radius:6px;opacity:0;pointer-events:none}
.stamp.like{left:18px;color:var(--lemon);transform:rotate(-12deg)}
.stamp.nope{right:18px;color:var(--coral);transform:rotate(10deg)}
.card .prog{position:absolute;left:10px;right:10px;bottom:-16px;height:6px;z-index:3;transition:opacity .3s}
.card:not(.playing) .prog{opacity:0}
.emptyDeck{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;border:3px dashed rgba(255,253,246,.4);border-radius:6px;padding:24px}
.emptyDeck b{font:italic 700 24px/1.3 var(--fut)}
.emptyDeck p{color:var(--dim)}
.flat{height:50px;padding:0 24px;border-radius:4px;background:var(--lemon);color:var(--ink);font:italic 700 17px/1 var(--fut);transition:background-color .2s,transform .15s}
.flat:active{transform:scale(.96);background:#ffd426}

/* info */
.info{padding:14px 26px 0;min-height:98px}
.info h2{font:italic 700 27px/1.15 var(--fut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px}
.info .who{margin-top:6px;font-size:15px;color:var(--dim)}
.info .meta{margin-top:8px;display:flex;gap:18px;font:italic 700 14px/1 var(--fut);color:var(--lemon)}
.info .meta span{white-space:nowrap}
.hint{font-size:13px;color:var(--dim2);margin-top:8px}

/* controls */
.ctrl{margin-top:0;display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr 1fr;align-items:center;padding:0 12px calc(26px + env(safe-area-inset-bottom))}
.cb{height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:italic 700 13px/1 var(--fut);color:var(--white);transition:transform .15s var(--out)}
.cb svg{width:40px;height:40px}
.cb.sm svg{width:30px;height:30px}
.cb:active{transform:scale(.88)}
.cb:disabled{opacity:.35;cursor:default}
.cb.play svg{width:66px;height:66px}
.cb.play .spin{transform-origin:33px 33px}
.cb.play.on .spin{animation:spin 1.8s linear infinite}

/* crate view */
.crateV{background:var(--pool-2)}
.crateV.enter{animation:slideIn .45s var(--out)}
@keyframes slideIn{from{transform:translateX(40px)}}
.chead{display:flex;align-items:center;gap:6px;height:58px;padding:6px 16px 0 8px}
.back{width:48px;height:48px;display:grid;place-items:center;border-radius:12px}
.back svg{width:26px;height:26px}
.back:active{transform:scale(.9)}
.chead h2{font:italic 700 30px/1 var(--fut);flex:1}
.chead .cnt{font:italic 700 16px/1 var(--fut);color:var(--lemon)}
.sorts{display:flex;gap:2px;padding:4px 14px 8px 18px}
.sorts button{height:44px;padding:0 10px;font:italic 700 16px/1 var(--fut);color:var(--dim2)}
.sorts button[aria-pressed=true]{color:var(--lemon)}
.grid{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 18px calc(40px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:22px 16px;align-content:start;scrollbar-width:none;overscroll-behavior:contain}
.grid::-webkit-scrollbar{display:none}
.tile{text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile .cv{position:relative;aspect-ratio:1;border-radius:3px;overflow:hidden;box-shadow:0 4px 8px -4px rgba(6,44,62,.6);transition:transform .2s var(--out)}
.tile .cv svg{width:100%;height:100%}
.tile:active .cv{transform:scale(.96)}
.tile b{font:italic 700 15px/1.25 var(--fut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font-size:13px;color:var(--dim);display:block;margin-top:2px}
.tile .eq{position:absolute;right:8px;bottom:8px;width:26px;height:20px}
.cempty{grid-column:1/-1;padding:60px 10px;text-align:center;color:var(--dim);font-size:15px;line-height:1.7}
.cempty b{display:block;font:italic 700 22px/1.3 var(--fut);color:var(--white);margin-bottom:6px}

/* sheet */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(6,40,56,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:var(--white);color:var(--ink);border-radius:26px 26px 0 0;padding:8px 22px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .5s var(--spring);touch-action:none}
.sheet.on{transform:none;visibility:visible}
.sheet.drag{transition:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:rgba(12,58,74,.25);margin:4px auto 14px}
.turn{position:relative;height:210px;margin:0 -22px;background:var(--coral);display:flex;align-items:center;justify-content:center;overflow:hidden}
.turn .plat{width:190px;height:190px}
.turn .plat .spin{transform-origin:95px 95px}
.turn.on .plat .spin{animation:spin 1.8s linear infinite}
.turn .arm{position:absolute;left:calc(50% + 70px);top:14px;width:60px;height:150px;transform-origin:40px 16px;transform:rotate(-28deg);transition:transform .8s var(--spring)}
.turn.on .arm{transform:rotate(0)}
.sheet h3{margin-top:16px;font:italic 700 26px/1.2 var(--fut)}
.sheet .who{margin-top:4px;color:#2e5866}
.creds{margin-top:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.creds dt{color:#4d7280}
.creds dd{margin:0;font-weight:600}
.srow{display:flex;align-items:center;gap:10px;margin-top:18px}
.srow .flat{flex:1}
.srow .txt{height:50px;padding:0 16px;font:italic 700 16px/1 var(--fut);color:#b8402c;border-radius:4px}
.srow .txt:active{background:rgba(255,122,99,.12)}
.sheet .flat{background:var(--ink);color:var(--lemon)}
.sheet .flat:active{background:#0a2e3b}

.toast{position:absolute;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));z-index:60;transform:translate(-50%,180px);transition:transform .45s var(--spring);background:var(--lemon);color:var(--ink);padding:0 8px 0 18px;height:48px;border-radius:4px;display:flex;align-items:center;gap:10px;font:italic 700 15px/1 var(--fut);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.toast button{height:40px;padding:0 10px;color:#b8402c;font:italic 700 15px/1 var(--fut)}
.toast button[hidden]{display:none}
.toast.solo{padding-right:18px}

@media (prefers-reduced-motion:reduce){
  .water g,.card.playing .rec .spin,.cb.play.on .spin,.turn.on .plat .spin{animation:none}
  .card,.card .sleeve,.card .rec,.sheet,.toast,.turn .arm{transition-duration:.01s}
  .crateV.enter{animation:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><svg id="bd" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"></svg></div>
  <div class="caption">
    <h1>夏夜<small>SUMMER NIGHT FM</small></h1>
    <p>右甩收進唱片箱，左甩略過。唱片會從封套裡滑出來，放一段即時合成的試聽。</p>
  </div>
  <div class="device">
    <div class="screen" id="screen">
      <div class="water" aria-hidden="true"><svg viewBox="0 0 500 960" preserveAspectRatio="xMidYMid slice"><g id="caus" fill="none" stroke="#bfeaff" stroke-opacity=".16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></g></svg></div>

      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="g">
          <svg width="20" height="12" viewBox="0 0 20 12" fill="currentColor"><path d="M1.5 12 3.2 8H6l-1.7 4zM6.5 12l2.7-6.5H12L9.3 12zM11.5 12 15 3.2h2.8L14.3 12z"/><path d="M16.5 12 21 .6" stroke="currentColor" stroke-width="2.8" opacity=".35"/></svg>
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" transform="skewX(-10)"><path d="M6.4 9.4a4 4 0 0 1 5.2 0M3.6 6.4a8 8 0 0 1 10.8 0M1 3.4a11.6 11.6 0 0 1 16 0"/></svg>
          <svg width="28" height="13" viewBox="0 0 28 13"><path d="M4 1h19l-2.6 11H1.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path id="batt" d="M5.4 3h14.9l-1.7 7H3.7z" fill="var(--lemon)"/><path d="M25 5l-.8 3.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
      </div>

      <!-- DISCOVER -->
      <section class="view" id="vDeck" aria-label="探索">
        <div class="head">
          <div class="logo"><b>夏夜</b><span>FM 88.7</span></div>
          <button class="crateBtn" id="toCrate" aria-label="打開唱片箱"><svg viewBox="0 0 34 30" stroke-linejoin="round"><path d="M9 3.5 19 1l2.6 11-10 2.4z" fill="#ffe45c"/><path d="M16.5 4.2 26 5.6l-1.6 10.6-9.6-1.4z" fill="#fffdf6"/><path d="M4 13h28l-3.6 15.5H.4z" fill="#ff7a63"/><path d="M7.4 18.5h20.6M6.2 23.5h20.6" stroke="#0c3a4a" stroke-width="2.2" stroke-linecap="round"/></svg><span id="crateN">0</span></button>
        </div>
        <div class="times" id="times" role="group" aria-label="時段"></div>
        <div class="deckwrap"><div class="deck" id="deck"></div></div>
        <div class="info" id="info" aria-live="polite"><h2 id="tTitle"></h2><p class="who" id="tWho"></p><div class="meta" id="tMeta"></div></div>
        <div class="next" id="next" aria-label="接下來"></div>
        <div class="ctrl">
          <button class="cb sm" id="bUndo" aria-label="倒帶，回到上一張"><svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9h10.5a6.5 6.5 0 0 1 0 13H10" transform="skewX(-10) translate(3 0)"/><path d="M12 4.5 7.5 9l4.5 4.5" transform="skewX(-10) translate(3 0)"/></svg>倒帶</button>
          <button class="cb" id="bNope" aria-label="略過"><svg viewBox="0 0 40 40" fill="none" stroke="#ff7a63" stroke-width="5.5" stroke-linecap="round"><path d="M13 10 29 30M31 10 11 30"/></svg>略過</button>
          <button class="cb play" id="bPlay" aria-label="試聽"><svg viewBox="0 0 66 66"><g class="spin"><circle cx="33" cy="33" r="31" fill="#0c3a4a"/><circle cx="33" cy="33" r="24" fill="none" stroke="#1f5566" stroke-width="1.4"/><circle cx="33" cy="33" r="19" fill="none" stroke="#1f5566" stroke-width="1.4"/><circle cx="33" cy="33" r="12" fill="#ffe45c"/><path d="M26 29a8 8 0 0 1 6-6" stroke="#fffdf6" stroke-width="2" fill="none" stroke-linecap="round"/></g><g id="playGlyph"><path d="M30 28.5 38.5 33 30 37.5z" fill="#0c3a4a" stroke="#0c3a4a" stroke-width="2" stroke-linejoin="round"/></g></svg><span id="playL">試聽</span></button>
          <button class="cb" id="bLike" aria-label="收進唱片箱"><svg viewBox="0 0 40 40"><circle cx="25" cy="15" r="11" fill="#0c3a4a"/><circle cx="25" cy="15" r="3.6" fill="#ff7a63"/><path d="M10 12h20l-4.4 22H5.6z" fill="#ffe45c" stroke="#ffe45c" stroke-width="2" stroke-linejoin="round"/><path d="M17.4 18v10M12.8 23h9.6" stroke="#0c3a4a" stroke-width="3.2" stroke-linecap="round"/></svg>收藏</button>
          <button class="cb sm" id="bInfo" aria-label="唱片資料"><svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M9 7h15M7.4 15h15M5.8 23h9" transform="skewX(-10) translate(3 0)"/></svg>資料</button>
        </div>
      </section>

      <!-- CRATE -->
      <section class="view crateV" id="vCrate" aria-label="唱片箱" hidden>
        <div class="chead"><button class="back" id="fromCrate" aria-label="回到探索"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5 8 13l8 8" transform="skewX(-10) translate(2 0)"/></svg></button><h2>唱片箱</h2><span class="cnt" id="crateCnt"></span></div>
        <div class="sorts" id="sorts" role="group" aria-label="排序">
          <button data-s="new" aria-pressed="true">最新收進</button><button data-s="year" aria-pressed="false">年份</button><button data-s="bpm" aria-pressed="false">速度</button>
        </div>
        <div class="grid" id="grid"></div>
      </section>

      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sT">
        <div class="grab"></div>
        <div id="sheetBody"></div>
      </div>
      <div class="toast" id="toast" role="status"><span id="toastT"></span><button id="toastB" hidden>復原</button></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var KEY = 'app039:';
function load(k, d){ try { var v = localStorage.getItem(KEY + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v){ try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function haptic(p){ try { navigator.vibrate && navigator.vibrate(p || 8); } catch (e) {} }
function tick(){ var d = new Date(); $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
tick(); setInterval(tick, 15000);
