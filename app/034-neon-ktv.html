<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140c0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="麥霸">
<title>麥霸 · KTV 歌詞</title>
<meta name="description" content="香港霓虹招牌風格的 KTV：即時合成伴奏、逐字卡拉 OK 染色、按住音準條跟唱計分、點歌本抽屜排歌插播。收錄於 100 Creative HTML Works（App 034・香港霓虹燈管）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/034-neon-ktv.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23180e0b'/%3E%3Crect x='20' y='8' width='24' height='48' rx='5' fill='none' stroke='%23ff9a52' stroke-width='3'/%3E%3Cpath d='M26 22h12M32 16v14M26 40q6-8 12 0' fill='none' stroke='%23ff5d8f' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --wall:#140c0a;--ink:#f8e9dc;--ink2:#cdb3a4;--ink3:#9a8174;
  --pink:#ff5d8f;--pinkc:#ffe1ea;--org:#ff9a52;--orgc:#fff0de;--warm:#ffe7c2;
  --panel:#0e0807;--plate:#231613;
  --wei:"Weibei TC","Weibei SC","Kaiti TC","STKaiti","PingFang TC",serif;
  --nar:"Arial Narrow","Helvetica Neue",Arial,"PingFang TC",sans-serif;
  --sans:system-ui,-apple-system,"PingFang TC","Heiti TC",sans-serif;
  --out:cubic-bezier(.2,.9,.3,1);--spring:cubic-bezier(.3,1.35,.5,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.5 var(--sans);color:var(--ink);background:var(--wall);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit;background:none;border:0;padding:0}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--org);outline-offset:3px;border-radius:10px}
svg{display:block}
[hidden]{display:none!important}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--wall);isolation:isolate}
@media (min-width:521px){
  .stage{display:flex;align-items:center;justify-content:center;gap:70px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:50px;padding:10px;z-index:1;
    background:linear-gradient(160deg,#5a3a2c,#2a1a14 22%,#1a100c 60%,#3b261d);box-shadow:inset 0 0 0 1px rgba(255,200,160,.18),inset 0 0 0 2.5px #0b0605,0 16px 26px -18px #000}
  .screen{inset:10px;border-radius:40px}
  .caption{display:block;position:relative;z-index:1;width:250px}
  .caption svg{width:220px;height:100px;overflow:visible}
  .caption p{margin-top:14px;font-size:15px;line-height:1.75;color:var(--ink2)}
}
@media (min-width:521px) and (max-width:900px){.caption{display:none}}

.wall{position:absolute;inset:0;z-index:0;pointer-events:none}
.wall svg{width:100%;height:100%}

.status{position:absolute;top:0;left:0;right:0;z-index:40;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 32px;display:flex;align-items:center;justify-content:space-between;font:700 16px/1 var(--nar);letter-spacing:.04em;pointer-events:none;color:var(--ink)}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}

.main{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;padding:calc(46px + env(safe-area-inset-top)) 0 calc(84px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.main::-webkit-scrollbar{display:none}

/* neon sign */
.sign{position:relative;flex:none;height:206px}
.sign svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tube-text{font-family:var(--wei);font-weight:700}
.nar{font-family:var(--nar);font-weight:700}
.lit{transition:opacity .08s}
.flick{animation:flick 7s steps(1) infinite}
@keyframes flick{0%,100%{opacity:1}61%{opacity:.15}62%{opacity:1}63.5%{opacity:.25}64.5%{opacity:1}88%{opacity:.6}88.6%{opacity:1}}
.cheer .lit{animation:cheer .18s steps(2) 6}
@keyframes cheer{50%{opacity:.35}}
.cuerow{display:flex;align-items:center;justify-content:space-between;margin-right:-8px}
.clap{position:relative;flex:none;width:48px;height:48px;display:grid;place-items:center;border-radius:14px;color:var(--warm);z-index:3}
.clap:active{background:rgba(255,231,194,.1)}
.clap svg{width:28px;height:28px}

/* lyrics */
.lyr{flex:1;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:6px 18px}
.slot{position:relative;max-width:100%;white-space:nowrap;font:700 30px/1.3 var(--wei);letter-spacing:.04em}
.slot.s1{align-self:flex-end}
.slot .base,.slot .hi{padding:4px 6px}
.slot .base{color:var(--ink);-webkit-text-stroke:5px #120907;paint-order:stroke fill}
.slot .hi{position:absolute;inset:0;color:var(--pink);-webkit-text-stroke:5px #2a0714;paint-order:stroke fill;clip-path:inset(0 100% 0 0)}
.slot.next .base{color:var(--ink3)}
.slot .sp{display:inline-block;width:.45em}
.slot.small{font-size:24px}
.cue{height:22px;display:flex;align-items:center;gap:10px;padding-left:6px}
.cue i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--org);transition:background-color .1s}
.cue i.on{background:var(--org)}

/* pitch lane */
.laneWrap{flex:none;margin:6px 14px 0;position:relative}
#lane{display:block;width:100%;height:122px;border-radius:18px;background:var(--panel);touch-action:none;cursor:ns-resize;box-shadow:inset 0 1px 0 rgba(255,154,82,.10),inset 0 0 0 1px rgba(255,154,82,.06)}
.laneTop{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px 6px;font-size:13px;color:var(--ink2)}
.laneTop b{font:700 22px/1 var(--nar);color:var(--warm);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.laneTop .fb{font:700 15px var(--wei);color:var(--pink);min-width:40px;text-align:center}
.prog{display:flex;align-items:center;gap:10px;margin:12px 18px 0;font:700 14px/1 var(--nar);color:var(--ink2);font-variant-numeric:tabular-nums}
.bar{flex:1;height:4px;border-radius:2px;background:#3a2620;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--org);border-radius:2px}

/* controls */
.ctrl{flex:none;display:grid;grid-template-columns:1fr 1fr 88px 1fr 1fr;align-items:center;margin:10px 10px 0}
.cb{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;justify-content:center;border-radius:14px;font-size:12px;color:var(--ink2);transition:background-color .15s}
.cb:active{background:rgba(255,154,82,.1)}
.cb svg{width:28px;height:28px}
.cb[aria-pressed=true]{color:var(--warm)}
.cb[aria-pressed=true] svg{color:var(--pink)}
.cb .k{font:700 12px var(--nar);letter-spacing:.04em}
.bigplay{width:80px;height:80px;margin:0 auto;border-radius:50%;display:grid;place-items:center;transition:transform .15s var(--out)}
.bigplay:active{transform:scale(.93)}
.bigplay svg{width:80px;height:80px;overflow:visible}

/* drawer handle */
.handle{position:absolute;left:0;right:0;bottom:0;z-index:20;height:calc(80px + env(safe-area-inset-bottom));padding:12px 20px env(safe-area-inset-bottom);background:linear-gradient(180deg,#2a1a15,#1c110e);border-radius:24px 24px 0 0;box-shadow:inset 0 1px 0 rgba(255,200,160,.14);display:flex;align-items:flex-start;gap:14px;text-align:left;touch-action:none;width:100%}
.handle .gr{position:absolute;top:7px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:rgba(248,233,220,.25)}
.handle svg{width:30px;height:30px;flex:none;margin-top:10px;color:var(--org)}
.handle b{display:block;font:700 21px/1.3 var(--wei);margin-top:6px}
.handle .tx>span{display:block;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.handle .tx{flex:1;min-width:0}
.handle .n small{display:inline;font:600 13px var(--sans);color:var(--ink2);margin-left:3px}
.handle .n{font:700 34px/1 var(--nar);color:var(--org);margin-top:12px;font-variant-numeric:tabular-nums}
.homeind{position:absolute;left:50%;bottom:calc(6px + env(safe-area-inset-bottom)*.3);width:132px;height:5px;margin-left:-66px;border-radius:3px;background:rgba(248,233,220,.7);z-index:45;pointer-events:none}

/* sheet */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(8,4,3,.62);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;display:flex;flex-direction:column;border-radius:26px 26px 0 0;background:#1d120f;transform:translateY(105%);transition:transform .5s var(--spring);box-shadow:inset 0 1px 0 rgba(255,200,160,.16)}
.sheet.tall{height:88%}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.shead{flex:none;padding:10px 18px 0;touch-action:none;cursor:grab}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(248,233,220,.25);margin:0 auto 10px}
.shead h3{font:700 28px/1.2 var(--wei);letter-spacing:.04em}
.sbody{flex:1;overflow-y:auto;padding:0 18px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.search{display:flex;align-items:center;gap:10px;height:46px;margin-top:12px;padding:0 14px;border-radius:14px;background:#120b09;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.search svg{width:20px;height:20px;color:var(--ink3);flex:none}
.search input{flex:1;min-width:0;height:100%;font-size:16px;outline:none}
.search input::placeholder{color:var(--ink3)}
.stabs{position:relative;display:flex;gap:4px;margin-top:12px}
.stabs button{height:44px;padding:0 14px;font:700 19px var(--wei);color:var(--ink3);transition:color .2s}
.stabs button[aria-selected=true]{color:var(--pink)}
.stabs .mk{position:absolute;bottom:4px;left:0;width:100px;height:3px;border-radius:2px;background:var(--pink);transform-origin:0 50%;transition:transform .4s var(--spring)}
.langs{display:flex;gap:2px;margin:6px 0 4px}
.langs button{min-height:40px;padding:0 12px;border-radius:10px;font-size:14px;color:var(--ink2)}
.langs button[aria-pressed=true]{color:#1d120f;background:var(--warm);font-weight:600}
.song{display:flex;align-items:center;gap:6px;min-height:70px;padding:6px 0}
.song+.song{box-shadow:inset 0 1px 0 rgba(248,233,220,.07)}
.song .i{flex:1;min-width:0}
.song b{display:block;font:700 21px/1.3 var(--wei);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song small{display:block;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song small em{font:700 13px var(--nar);font-style:normal;color:var(--org);letter-spacing:.03em}
.song .num{width:34px;font:700 26px var(--nar);color:var(--ink3);text-align:center;flex:none}
.song.now .num{color:var(--pink)}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink2);flex:none;transition:background-color .15s,color .15s}
.ib:active{background:rgba(255,154,82,.14);color:var(--warm)}
.ib svg{width:24px;height:24px}
.ib.pk{color:var(--pink)}
.ib:disabled{opacity:.3}
.empty{padding:30px 0;text-align:center;color:var(--ink3)}
.qfoot{padding:18px 0 6px;text-align:center;font-size:13px;color:var(--ink3);box-shadow:inset 0 1px 0 rgba(248,233,220,.07)}
.scoreBox{padding:4px 22px calc(26px + env(safe-area-inset-bottom));text-align:center}
.scoreBox svg{width:100%;height:150px;overflow:visible}
.scoreBox p{font-size:15px;color:var(--ink2)}
.go{display:block;width:100%;height:56px;margin-top:18px;border-radius:16px;background:var(--warm);color:#2a140c;font:700 21px var(--wei);letter-spacing:.06em;transition:background-color .15s}
.go:active{background:#f2cfa0}

.toast{position:absolute;left:50%;top:calc(54px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-180%);visibility:hidden;padding:10px 18px;border-radius:14px;background:var(--warm);color:#2a140c;font-size:14px;font-weight:600;white-space:nowrap;transition:transform .45s var(--spring),visibility 0s .45s}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .45s var(--spring)}

@media (max-height:760px){
  .sign{height:150px}
  .lyr{min-height:112px;gap:6px}
  #lane{height:88px}
  .slot{font-size:26px}.slot.small{font-size:21px}
  .ctrl{margin-top:4px}
}
@media (prefers-reduced-motion:reduce){
  .flick,.cheer .lit{animation:none}
  .sheet,.toast,.stabs .mk{transition-duration:.01s}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="gP" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="gW" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="grn"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .35 0 0 0 0 .3 0 0 0 .22 0"/></filter>
  </defs>
</svg>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><svg id="bd" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"></svg></div>
  <div class="caption">
    <svg viewBox="0 0 220 100" aria-label="麥霸"><g id="capSign"></g></svg>
    <p>香港霓虹招牌下的 KTV。伴奏即時合成，歌詞逐字染色，按住音準條跟著唱，分數當場算。</p>
  </div>
  <div class="device">
    <div class="screen" id="screen">
      <div class="wall" aria-hidden="true"><svg id="wall" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg></div>
      <div class="status" aria-hidden="true">
        <span id="clock">00:00</span>
        <span class="g">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 11v-1M7 11V7.5M12 11V5M17 11V1.5"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.5a9 9 0 0 1 13 0M4.3 7.3a5 5 0 0 1 7.4 0"/><circle cx="8" cy="10.2" r="1.2" fill="currentColor" stroke="none"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="21" height="10" rx="3"/><path d="M4 4h12v4H4z" fill="currentColor" stroke="none"/><path d="M24.5 4.5v3" stroke-linecap="round"/></svg>
        </span>
      </div>

      <main class="main" id="main">
        <div class="sign" id="sign">
          <svg viewBox="0 0 390 206" id="signSvg" preserveAspectRatio="xMinYMid meet" aria-hidden="true"></svg>
        </div>
        <div class="lyr" id="lyr" aria-live="off">
          <div class="cuerow"><div class="cue" id="cue" aria-hidden="true"><i></i><i></i><i></i><i></i></div><button class="clap" id="clap" aria-label="鼓掌"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 14l5-8a2 2 0 0 1 3.4 2L13 13l6-7a2 2 0 0 1 3 2.6L17 16l3-2.4a2 2 0 0 1 2.5 3L16 22c-3 2.4-7 2-9-1s-1.6-5 1-7z"/><path d="M4 8l-1.5-1.5M7 5V3M4 12H2"/><circle cx="2.5" cy="6.5" r=".9" fill="currentColor"/><circle cx="7" cy="2.6" r=".9" fill="currentColor"/></svg></button></div>
          <div class="slot s0" id="s0"><div class="base"></div><div class="hi" aria-hidden="true"></div></div>
          <div class="slot s1 next" id="s1"><div class="base"></div><div class="hi" aria-hidden="true"></div></div>
        </div>
        <div class="laneWrap">
          <div class="laneTop"><span>按住音準條跟著唱</span><span class="fb" id="fb"></span><b id="score">0</b></div>
          <canvas id="lane" aria-label="音準條：按住上下移動來唱出音高"></canvas>
        </div>
        <div class="prog"><span id="tNow">0:00</span><div class="bar"><i id="barI"></i></div><span id="tAll">0:00</span></div>
        <div class="ctrl">
          <button class="cb" id="guide" aria-pressed="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M11 20V8.5L21 6v11"/><circle cx="8" cy="20" r="3"/><circle cx="18" cy="17" r="3"/><circle cx="11" cy="8.5" r="1" fill="currentColor"/></svg>原唱</button>
          <button class="cb" id="kDown" aria-label="降 Key"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5v15M8 15l6 6 6-6"/><circle cx="14" cy="5" r="1" fill="currentColor"/></svg><span class="k" id="kLbl">KEY 0</span></button>
          <button class="bigplay" id="play" aria-label="播放"><svg viewBox="0 0 80 80" id="playSvg"></svg></button>
          <button class="cb" id="kUp" aria-label="升 Key"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 23V8M8 13l6-6 6 6"/><circle cx="14" cy="23" r="1" fill="currentColor"/></svg>升 Key</button>
          <button class="cb" id="skip"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l9 7-9 7M14 7l9 7-9 7"/><circle cx="5" cy="21" r="1" fill="currentColor"/></svg>切歌</button>
        </div>
      </main>

      <button class="handle" id="handle" aria-label="打開點歌本"><span class="gr"></span>
        <svg viewBox="0 0 30 30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5h14a3 3 0 0 1 3 3v17H9a3 3 0 0 1-3-3z"/><path d="M6 22a3 3 0 0 1 3-3h14M11 10h7M11 14h5"/><circle cx="23" cy="25" r="1" fill="currentColor"/></svg>
        <span class="tx"><b>點歌本</b><span id="hNext">下一首</span></span><span class="n"><span id="hCount">3</span><small>首</small></span>
      </button>
      <div class="homeind" aria-hidden="true"></div>

      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="點歌本"><div class="shead" id="shead"><div class="grab"></div><div id="sheadIn"></div></div><div class="sbody" id="sbody"></div></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var KEY='app034:';
function load(k,d){try{var v=localStorage.getItem(KEY+k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}
function haptic(p){try{navigator.vibrate&&navigator.vibrate(p||8)}catch(e){}}
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var pad=function(n){return(n<10?'0':'')+n};
var NS='http://www.w3.org/2000/svg';
function tick(){var d=new Date();$('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())}tick();setInterval(tick,15000);
var tT=0;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(function(){t.classList.remove('on')},2000)}

/* ---------- brick wall ---------- */
function bricks(w,h,bw,bh,seed){var s='',r=function(){seed=(seed*16807)%2147483647;return seed/2147483647},C=['#2c1914','#311c16','#27150f','#351f18','#2a1712','#3a2119'];
  s+='<rect width="'+w+'" height="'+h+'" fill="#120a08"/>';

function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+pad(s%60)}
function updateHud(){var t=now();$('tNow').textContent=fmt(t);$('tAll').textContent=fmt(song.sec);$('barI').style.width=(Math.min(1,t/song.sec)*100).toFixed(2)+'%';$('score').textContent=tot>0?Math.round(hit/tot*100):0;$('kLbl').textContent='KEY '+(keyShift>0?'+':'')+keyShift}
function loop(){if(raf)return;lastT=performance.now();raf=requestAnimationFrame(function f(ts){raf=0;if(!playing)return;if(document.hidden){pause();return}var dt=Math.min(.05,(ts-lastT)/1000);lastT=ts;
  var t=now(),b=t*song.bpm/60;
  song.mel.forEach(function(n,i){if(n.t<=b&&n.t+n.d>b){tot+=dt;if(singing&&Math.abs(userM-(n.m+keyShift))<1.05){hit+=dt;noteHit[i]=(noteHit[i]||0)+dt;if(ts-fbT>500){fbT=ts;$('fb').textContent=Math.abs(userM-(n.m+keyShift))<.4?'超準':'不錯'}}}});
  if(ts-fbT>900)$('fb').textContent='';
  trail.push({b:b,m:singing?userM:null});while(trail.length&&trail[0].b<b-2)trail.shift();
  renderLyrics(b);drawLane(b);updateHud();
  if(t>=song.sec){finish();return}
  raf=requestAnimationFrame(f)})}
document.addEventListener('visibilitychange',function(){if(document.hidden&&playing)pause()});

function finish(){pause();pos=0;var sc=tot>0?Math.round(hit/tot*100):0,prev=best[song.id]||0;if(sc>prev){best[song.id]=sc;save('best',best)}
  var words=sc>=85?'麥霸本色，全場起立':sc>=60?'唱得有模有樣':sc>0?'再來一次，會更好':'下次按住音準條一起唱';
  uid=500;var svg=tube(tText(String(sc),195,112,112,'nar','text-anchor="middle"'),'#ff5d8f','#ffe1ea',{w:2.4,core:.9})+tube(tText('分',262,112,30,'tube-text'),'#ff9a52','#fff0de',{w:1.4,core:.5});
  openSheet('<h3>'+song.t+'</h3>','<div class="scoreBox"><svg viewBox="0 0 390 150">'+svg+'</svg><p>'+words+(sc>prev&&sc>0?'，新紀錄':'')+'</p><button class="go" id="goNext">'+(queue.length>1?'下一首：'+BYID[queue[1]].t:'再唱一次')+'</button></div>',false,function(b){b.querySelector('#goNext').addEventListener('click',function(){closeSheet();nextSong(true)})});
  haptic([20,60,20,60,40])}
function nextSong(auto){if(queue.length>1){queue.shift();save('queue',queue)}loadSong(queue[0],auto)}

/* ---------- controls ---------- */
function renderPlay(){uid=900;var inner=playing?'<path d="M33 28v24M47 28v24"/>':'<path d="M33 27v26l20-13z"/>';
  $('playSvg').innerHTML=tube('<circle cx="40" cy="40" r="34"/>','#ff9a52','#fff0de',{w:2.4,core:.8})+tube(inner,'#ff5d8f','#ffe1ea',{w:3,core:1});
  $('play').setAttribute('aria-label',playing?'暫停':'播放')}
$('play').addEventListener('click',function(){haptic(playing?6:[6,30,6]);if(playing)pause();else start()});
$('skip').addEventListener('click',function(){haptic(8);if(queue.length<2){toast('點歌本裡沒有下一首了');return}var was=playing;nextSong(was);toast('切到「'+song.t+'」')});
function setKey(k){keyShift=Math.max(-5,Math.min(5,k));save('key',keyShift);updateHud();drawLane(now()*song.bpm/60);haptic(4);if(playing&&ctx){pos=now();start()}}
$('kUp').addEventListener('click',function(){if(keyShift>=5){toast('已經最高了');return}setKey(keyShift+1)});
$('kDown').addEventListener('click',function(){if(keyShift<=-5){toast('已經最低了');return}setKey(keyShift-1)});
function renderGuide(){$('guide').setAttribute('aria-pressed',guideOn)}
$('guide').addEventListener('click',function(){guideOn=!guideOn;save('guide',guideOn);renderGuide();haptic(5);toast(guideOn?'原唱旋律開':'只留伴奏')});
$('clap').addEventListener('click',function(){clapSound();haptic([6,40,6,40,6]);var s=$('sign');s.classList.remove('cheer');void s.offsetWidth;if(!reduce)s.classList.add('cheer')});

/* ---------- sheet ---------- */
var sheet=$('sheet'),scrim=$('scrim'),lastFocus=null;
function openSheet(head,body,tall,bind){lastFocus=document.activeElement;$('sheadIn').innerHTML=head;$('sbody').innerHTML=body;sheet.classList.toggle('tall',!!tall);sheet.style.transform='';sheet.classList.add('on');scrim.classList.add('on');haptic(6);if(bind)bind(sheet);$('sbody').scrollTop=0}
function closeSheet(){if(!sheet.classList.contains('on'))return;sheet.classList.remove('on','drag');sheet.style.transform='';scrim.classList.remove('on');if(document.activeElement&&sheet.contains(document.activeElement))document.activeElement.blur();if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true})}
scrim.addEventListener('click',closeSheet);
(function(){var sy=0,dy=0,t0=0,on=false,h=$('shead');
h.addEventListener('pointerdown',function(e){if(e.target.closest('button,input'))return;on=true;sy=e.clientY;dy=0;t0=e.timeStamp;sheet.classList.add('drag');try{h.setPointerCapture(e.pointerId)}catch(_){}});
h.addEventListener('pointermove',function(e){if(!on)return;dy=e.clientY-sy;sheet.style.transform='translateY('+(dy>0?dy:dy/6).toFixed(1)+'px)';scrim.style.opacity=Math.max(0,1-dy/sheet.offsetHeight).toFixed(2)});
function end(e){if(!on)return;on=false;sheet.classList.remove('drag');scrim.style.opacity='';var v=dy/Math.max(1,e.timeStamp-t0);if(dy>sheet.offsetHeight*.35||(v>.6&&dy>30))closeSheet();else sheet.style.transform=''}
h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end)})();
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();if(e.key===' '&&e.target===document.body){e.preventDefault();$('play').click()}});

/* ---------- songbook drawer ---------- */
var bookTab='lib',lang='全部',q='';
var IC={
 add:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/><circle cx="12" cy="19" r=".9" fill="currentColor"/></svg>',
 jump:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-7 4-11 12-11M13 4l4 4-4 4"/><circle cx="5" cy="19" r=".9" fill="currentColor"/></svg>',
 up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M7 11l5-5 5 5"/><circle cx="12" cy="19" r=".9" fill="currentColor"/></svg>',
 del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/><circle cx="6" cy="18" r=".9" fill="currentColor"/></svg>',
 play:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg>'
};
function bookHead(){var n=queue.length;return '<h3>點歌本</h3><div class="stabs" role="tablist"><button role="tab" data-bt="lib" aria-selected="'+(bookTab==='lib')+'">歌庫</button><button role="tab" data-bt="q" aria-selected="'+(bookTab==='q')+'">已點 '+n+'</button><span class="mk" id="mk"></span></div>'}
function libBody(){var list=SONGS.filter(function(s){return(lang==='全部'||s.l===lang)&&(!q||(s.t+s.a).indexOf(q)>=0)});
  return '<label class="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg><input id="qIn" type="search" placeholder="歌名或歌手" value="'+q+'" aria-label="搜尋歌曲"></label>'+
  '<div class="langs">'+['全部','國語','台語','粵語'].map(function(x){return '<button data-lang="'+x+'" aria-pressed="'+(x===lang)+'">'+x+'</button>'}).join('')+'</div>'+
  (list.length?list.map(function(s){var b=best[s.id];return '<div class="song"><div class="i"><b>'+s.t+'</b><small>'+s.a+'　'+s.l+'　<em>'+s.bpm+' BPM</em>'+(b?'　最高 <em>'+b+'</em>':'')+'</small></div><button class="ib" data-jump="'+s.id+'" aria-label="插播 '+s.t+'">'+IC.jump+'</button><button class="ib pk" data-add="'+s.id+'" aria-label="點 '+s.t+'">'+IC.add+'</button></div>'}).join(''):'<p class="empty">找不到「'+q+'」，換個關鍵字</p>')}
function qBody(){return queue.map(function(id,i){var s=BYID[id];return '<div class="song'+(i===0?' now':'')+'"><span class="num">'+(i===0?'唱':i)+'</span><div class="i"><b>'+s.t+'</b><small>'+s.a+'　'+s.l+(i===0?'　<em>正在唱</em>':'')+'</small></div>'+
  (i===0?'<button class="ib pk" data-restart="1" aria-label="從頭唱">'+IC.play+'</button>':'<button class="ib" data-up="'+i+'" aria-label="往前移" '+(i<2?'disabled':'')+'>'+IC.up+'</button><button class="ib" data-rm="'+i+'" aria-label="移除 '+s.t+'">'+IC.del+'</button>')+'</div>'}).join('')+(queue.length<2?'<p class="empty">只剩這一首，去歌庫多點幾首</p>':'<p class="qfoot">還有 '+(queue.length-1)+' 首待唱 · 按 ↑ 可以插隊往前</p>')}
function refreshBook(keepFocus){$('sheadIn').innerHTML=bookHead();$('sbody').innerHTML=bookTab==='lib'?libBody():qBody();placeMk();
  if(keepFocus){var i=$('qIn');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}
function placeMk(){var sel=$('sheadIn').querySelector('[aria-selected=true]'),mk=$('mk');if(sel&&mk){mk.style.transform='translateX('+(sel.offsetLeft+14)+'px) scaleX('+((sel.offsetWidth-28)/100).toFixed(3)+')'}}
function openBook(tab){if(tab)bookTab=tab;openSheet(bookHead(),bookTab==='lib'?libBody():qBody(),true);placeMk()}
$('handle').addEventListener('click',function(){if(!hDragged)openBook()});
var hDragged=false;(function(){var sy=0,on=false,h=$('handle');h.addEventListener('pointerdown',function(e){on=true;hDragged=false;sy=e.clientY});h.addEventListener('pointermove',function(e){if(on&&sy-e.clientY>30){on=false;hDragged=true;openBook();setTimeout(function(){hDragged=false},300)}});h.addEventListener('pointerup',function(){on=false});h.addEventListener('pointercancel',function(){on=false})})();
sheet.addEventListener('click',function(e){var x;
  if((x=e.target.closest('[data-bt]'))){bookTab=x.dataset.bt;refreshBook();haptic(4);return}
  if((x=e.target.closest('[data-lang]'))){lang=x.dataset.lang;refreshBook();haptic(4);return}
  if((x=e.target.closest('[data-add]'))){queue.push(x.dataset.add);save('queue',queue);refreshBook();renderHandle();haptic([6,30,6]);toast('已點「'+BYID[x.dataset.add].t+'」，排第 '+(queue.length-1)+' 首');return}
  if((x=e.target.closest('[data-jump]'))){queue.splice(1,0,x.dataset.jump);save('queue',queue);refreshBook();renderHandle();haptic([6,30,6]);toast('插播「'+BYID[x.dataset.jump].t+'」，下一首就唱');return}
  if((x=e.target.closest('[data-up]'))){var i=+x.dataset.up;if(i<2)return;var t=queue[i];queue[i]=queue[i-1];queue[i-1]=t;save('queue',queue);refreshBook();renderHandle();haptic(4);return}
  if((x=e.target.closest('[data-rm]'))){var j=+x.dataset.rm,id=queue.splice(j,1)[0];save('queue',queue);refreshBook();renderHandle();haptic([10,40,10]);toast('已移除「'+BYID[id].t+'」');return}
  if(e.target.closest('[data-restart]')){closeSheet();loadSong(queue[0],true);return}});
sheet.addEventListener('input',function(e){if(e.target.id==='qIn'){q=e.target.value.trim();$('sbody').innerHTML=libBody();var i=$('qIn');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
function renderHandle(){$('hCount').textContent=queue.length-1;$('hNext').textContent=queue.length>1?'下一首　'+BYID[queue[1]].t+'　'+BYID[queue[1]].a:'還沒點下一首，拉上來點歌'}

/* ---------- desktop backdrop ---------- */
function renderBackdrop(){if(innerWidth<521)return;uid=2000;var h=bricks(1600,1000,70,28,5)+'<rect width="1600" height="1000" fill="#0b0504" opacity=".55"/>';
  h+='<g opacity=".9">'+tube('<rect x="150" y="80" width="90" height="360" rx="12"/>','#ff9a52','#fff0de',{w:3})+tube(tText('茶',162,170,64,'tube-text')+tText('餐',162,260,64,'tube-text')+tText('廳',162,350,64,'tube-text'),'#ffe7c2','#ffffff',{w:2,core:.8,flick:true})+'</g>';
  h+='<g opacity=".85">'+tube('<path d="M1270 120h210v130h-210z"/>','#ff5d8f','#ffe1ea',{w:3})+tube(tText('卡拉',1290,200,56,'tube-text'),'#ff5d8f','#ffe1ea',{w:2.2,core:.8})+tube(tText('OK',1410,236,34,'nar'),'#ff9a52','#fff0de',{w:1.8,core:.6})+'</g>';
  h+='<g opacity=".8">'+tube(tText('麻雀',1300,560,70,'tube-text'),'#ff9a52','#fff0de',{w:2.2,core:.8})+tube('<path d="M1290 600h180l-16-12M1470 600l-16 12"/>','#ff9a52','#fff0de',{w:2.4})+'</g>';
  h+='<path d="M195 0v80M1375 0v120" stroke="#231512" stroke-width="4"/><defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0504" stop-opacity="0"/><stop offset=".5" stop-color="#0a0504" stop-opacity=".8"/><stop offset="1" stop-color="#0a0504"/></linearGradient></defs><rect y="760" width="1600" height="240" fill="url(#fl)"/><rect width="1600" height="1000" filter="url(#grn)"/>';
  $('bd').innerHTML=h;renderCaption()}

/* ---------- init ---------- */
renderSign();renderPlay();renderGuide();renderHandle();renderLyrics(0);updateHud();sizeLane();renderBackdrop();
window.addEventListener('resize',function(){sizeLane();var b=now()*song.bpm/60;lastLine=-2;renderLyrics(b);if(innerWidth>=521&&!$('bd').innerHTML)renderBackdrop()});
})();
</script>
</body>
</html>
