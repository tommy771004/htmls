<style>
:root{
  --tea:#c99a6c;
  --tea-2:#b8865a;
  --sugar:#5a3018;
  --sugar-2:#3a200f;
  --pearl:#241309;
  --milk:#f3e4cc;
  --ink:#2e180a;
  --rnd:"Arial Rounded MT Bold","SF Pro Rounded",ui-rounded,"Yuanti TC","PingFang TC",sans-serif;
  --pen:"HanziPen TC","Yuanti TC","PingFang TC",sans-serif;
  --zh:"PingFang TC","Heiti TC",system-ui,sans-serif;
  --boing:cubic-bezier(.3,1.55,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.4 var(--zh);color:var(--ink);background:var(--tea);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sugar-2);outline-offset:3px;border-radius:14px}
svg{display:block}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:var(--tea)}
.syrup{position:absolute;inset:0;z-index:0;pointer-events:none}
.syrup svg{width:100%;height:100%}
@media (min-width:521px){
  body{background:#a8774c}
  .stage{display:flex;align-items:center;justify-content:center;gap:70px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:60px;padding:12px;z-index:1;
    background:#f1e2c9;box-shadow:inset 3px 4px 0 rgba(255,255,255,.6),inset -4px -6px 0 rgba(120,70,30,.25),6px 10px 0 -2px rgba(70,35,12,.35)}
  .screen{inset:12px;border-radius:48px}
  .caption{display:block;position:relative;z-index:1;width:240px;color:var(--sugar-2)}
  .caption h1{font:700 46px/1.05 var(--pen);letter-spacing:.04em}
  .caption p{margin-top:16px;font-size:15px;line-height:1.7;color:#3f2412}
}
@media (min-width:521px) and (max-width:880px){.caption{display:none}}

.status{position:absolute;top:0;left:0;right:0;z-index:30;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 30px 0 34px;display:flex;align-items:center;justify-content:space-between;font:700 16px/1 var(--rnd);color:var(--sugar-2);pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}

.game{position:absolute;inset:calc(48px + env(safe-area-inset-top)) 0 calc(22px + env(safe-area-inset-bottom));z-index:1;display:flex;flex-direction:column;padding:4px 16px 0;overflow-y:auto;overflow-x:hidden}
.game::-webkit-scrollbar{display:none}
.game>.top{margin-top:auto}
.game>.chain{margin-bottom:auto}
.top{display:flex;align-items:center;gap:10px}
.top h1{font:700 32px/1 var(--pen);color:var(--sugar-2);letter-spacing:.02em;margin-right:auto;white-space:nowrap}
.plq{min-width:78px;height:58px;padding:0 10px;border-radius:18px;background:var(--milk);display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:inset 2px 3px 0 rgba(255,255,255,.7),inset -2px -4px 0 rgba(120,70,30,.16),2px 4px 0 rgba(90,48,24,.35)}
.plq small{font:700 12px/1 var(--zh);color:#7a4a28;letter-spacing:.1em}
.plq b{font:700 23px/1.1 var(--rnd);color:var(--sugar-2);margin-top:4px;font-variant-numeric:tabular-nums}
.plq.dark{background:var(--sugar)}
.plq b.bump{animation:bump .3s var(--boing)}
@keyframes bump{40%{transform:scale(1.18)}}
/* short phones (iPhone SE): tighten vertical rhythm so the drink chain clears the home indicator */
@media (max-height:720px){
  .top h1{font-size:28px}
  .plq{height:50px;min-width:72px}
  .plq b{font-size:20px;margin-top:3px}
  .goal{margin-top:6px;min-height:30px}
  .goal svg{width:28px;height:28px}
  .tray{margin-top:6px}
  .ctrls{margin-top:10px}
  .cb{height:52px;gap:3px}
  .cb svg{width:22px;height:22px}
  .chainhd{margin-top:8px}
  .chain svg{width:40px;height:40px}
}
.plq.dark small{color:#e7c9a4}
.plq.dark b{color:var(--milk)}
.plus{position:absolute;font:700 20px var(--rnd);color:var(--sugar-2);pointer-events:none;animation:rise .8s ease-out forwards}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-34px);opacity:0}}
.goal{display:flex;align-items:center;gap:8px;margin:12px 2px 0;font-size:14px;color:#3f2412;min-height:36px}
.goal svg{width:34px;height:34px;flex:none}
.goal b{color:var(--sugar-2)}

.tray{position:relative;margin:12px auto 0;border-radius:30px;background:var(--sugar);touch-action:none;flex:none;
  box-shadow:inset 0 5px 0 rgba(0,0,0,.25),inset 0 -2px 0 rgba(255,220,180,.12),0 3px 0 rgba(255,236,210,.5)}
.cell{position:absolute;border-radius:20px;background:#4a2712;box-shadow:inset 0 3px 0 rgba(0,0,0,.2)}
.tile{position:absolute;left:0;top:0;border-radius:22px;will-change:transform;transition:transform .12s ease-out;z-index:2}
.tile .in{position:absolute;inset:0;border-radius:22px;display:grid;place-items:center;
  box-shadow:inset 3px 4px 0 rgba(255,255,255,.55),inset -3px -5px 0 rgba(90,45,15,.2),2px 4px 0 rgba(30,14,5,.35)}
.tile svg{width:84%;height:84%;transform:translate(-7%,-3%)}
.tile .lv{position:absolute;right:8px;bottom:7px;font:700 13px/1 var(--rnd);color:rgba(46,24,10,.7)}
.tile.dk .lv{color:rgba(255,240,220,.8)}
.tile.new .in{animation:spawn .22s var(--boing)}
.tile.pop .in{animation:squish .34s var(--boing)}
@keyframes spawn{from{transform:scale(.35)}to{transform:scale(1)}}
@keyframes squish{0%{transform:scale(1,1)}30%{transform:scale(1.2,.84)}60%{transform:scale(.92,1.1)}100%{transform:scale(1,1)}}
.tray.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

.ctrls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 0}
.cb{position:relative;height:64px;border-radius:20px;background:var(--milk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 13px/1 var(--zh);color:var(--sugar-2);
  box-shadow:inset 2px 3px 0 rgba(255,255,255,.7),inset -2px -4px 0 rgba(120,70,30,.16),0 5px 0 #8e5a33;margin-bottom:5px;transition:transform .08s,box-shadow .08s}
.cb:active{transform:translateY(4px);box-shadow:inset 2px 3px 0 rgba(255,255,255,.7),inset -2px -4px 0 rgba(120,70,30,.16),0 1px 0 #8e5a33}
.cb svg{width:26px;height:26px;fill:none;stroke:var(--sugar-2);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.cb .n{position:absolute;top:7px;right:10px;font:700 13px/1 var(--rnd);color:#8e5a33}
.cb[disabled]{opacity:.55}

.chainhd{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 6px;font:700 12px/1 var(--zh);color:#6d4323;letter-spacing:.08em;flex:none}
.chainhd b{font:700 12px/1 var(--rnd);color:var(--sugar-2);letter-spacing:0}
.chain{margin:0 -16px 0;padding:0 16px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none}
.chain::-webkit-scrollbar{display:none}
.chain button{flex:none;width:46px;display:flex;flex-direction:column;align-items:center;gap:2px}
.chain svg{width:46px;height:46px}
.chain span{font:700 12px/1 var(--rnd);color:#5d3519}
.chain button{transition:transform .12s ease-out}
.chain button:active{transform:scale(.9)}
.chain .lock svg{opacity:.4;filter:grayscale(1) brightness(.5)}
.chain .cur span{color:var(--milk);background:var(--sugar);border-radius:6px;padding:2px 5px}

.home-ind{position:absolute;left:50%;bottom:calc(7px + env(safe-area-inset-bottom)*.3);width:130px;height:5px;margin-left:-65px;border-radius:3px;background:var(--sugar-2);z-index:25;pointer-events:none}

/* sheet: a clay slab */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(46,24,10,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;z-index:51;max-height:82%;display:flex;flex-direction:column;border-radius:34px;background:var(--milk);
  box-shadow:inset 3px 4px 0 rgba(255,255,255,.7),inset -3px -6px 0 rgba(120,70,30,.18);transform:translateY(calc(100% + 30px));visibility:hidden;transition:transform .5s var(--boing),visibility 0s .5s;touch-action:none}
.sheet.on{transform:none;visibility:visible;transition:transform .5s var(--boing)}
.sheet.drag{transition:none}
.grab{flex:none;height:30px;display:grid;place-items:center;cursor:grab}
.grab i{width:46px;height:6px;border-radius:3px;background:#c9a57f}
.shx{position:absolute;top:10px;right:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#ead6b8;z-index:2;transition:transform .12s ease-out}
.shx:active{transform:scale(.9)}
.shx svg{width:14px;height:14px;stroke:var(--sugar-2);stroke-width:2.6;stroke-linecap:round;fill:none}
.sb{overflow-y:auto;padding:0 20px 24px;touch-action:pan-y;overscroll-behavior:contain;text-align:center}
.sb h2{font:700 30px/1.15 var(--pen);color:var(--sugar-2)}
.sb p{font-size:15px;color:#5d3519;margin-top:6px;line-height:1.55}
.sb .big{display:flex;justify-content:center;gap:12px;margin-top:16px}
.sb .hero{width:130px;height:130px;margin:6px auto 0}
.go{width:100%;height:56px;margin-top:18px;border-radius:20px;background:var(--sugar);color:var(--milk);font:700 18px var(--zh);letter-spacing:.08em;
  box-shadow:inset 2px 3px 0 rgba(255,255,255,.18),0 5px 0 #2a150a;margin-bottom:5px;transition:transform .08s,box-shadow .08s}
.go:active{transform:translateY(4px);box-shadow:inset 2px 3px 0 rgba(255,255,255,.18),0 1px 0 #2a150a}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;text-align:center}
.dex div{border-radius:20px;padding:8px 4px 10px;background:#ead6b8;box-shadow:inset 2px 3px 0 rgba(255,255,255,.6),inset -2px -3px 0 rgba(120,70,30,.12)}
.dex svg{width:64px;height:64px;margin:0 auto}
.dex b{display:block;font:700 14px/1.2 var(--zh);color:var(--sugar-2);margin-top:2px}
.dex small{display:block;font:700 12px var(--rnd);color:#7a4a28;margin-top:2px}
.dex .lk svg{filter:grayscale(1) brightness(.45);opacity:.45}
.dex .lk b{color:#8a6a50}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px}
.stats b{display:block;font:700 22px var(--rnd);color:var(--sugar-2)}
.stats span{font-size:13px;color:#6d4323}

.toast{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-180%);visibility:hidden;transition:transform .45s var(--boing),visibility 0s .45s;
  padding:0 18px;height:44px;display:flex;align-items:center;gap:8px;border-radius:22px;background:var(--sugar-2);color:var(--milk);font:700 15px var(--zh);white-space:nowrap}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .45s var(--boing)}

@media (prefers-reduced-motion:reduce){
  .tile{transition:none}
  .tile.new .in,.tile.pop .in,.tray.shake,.plus,.plq b.bump{animation:none}
  .chain button,.shx{transition:none}
  .sheet,.toast{transition-duration:.01s}
  .cb:active,.go:active{transform:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".35" stop-color="#fff" stop-opacity=".06"/><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#3a1a06" stop-opacity=".28"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d27a"/><stop offset=".5" stop-color="#d9a23a"/><stop offset="1" stop-color="#a8701c"/></linearGradient>
    <radialGradient id="gPearl" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#6b4a33"/><stop offset=".45" stop-color="#2b170b"/><stop offset="1" stop-color="#150a04"/></radialGradient>

</svg>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" id="bdSvg"></svg></div>

    <h1>珍奶合成</h1>
    <p>兩杯一樣的就捏成下一杯。從一杯紅茶開始，往黑糖、芋頭、楊枝甘露一路合，最後合出珍奶之王。</p>

          <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#3a200f"><rect x="0" y="7.5" width="3.4" height="4.5" rx="1.7"/><rect x="4.9" y="5" width="3.4" height="7" rx="1.7"/><rect x="9.8" y="2.5" width="3.4" height="9.5" rx="1.7"/><rect x="14.6" y="0" width="3.4" height="12" rx="1.7"/></g></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#3a200f" stroke-width="2.2" stroke-linecap="round"><path d="M1.6 4.6a9.2 9.2 0 0 1 12.8 0M4.2 7.3a5.6 5.6 0 0 1 7.6 0"/><circle cx="8" cy="10.4" r="1.2" fill="#3a200f" stroke="none"/></svg>
          <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="4" fill="none" stroke="#3a200f" stroke-width="2"/><rect id="batt" x="3.5" y="3.5" width="14" height="6" rx="2" fill="#3a200f"/><path d="M24 5v3" stroke="#3a200f" stroke-width="2.4" stroke-linecap="round"/></svg>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
function haptic(p){ try{ if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return; navigator.vibrate && navigator.vibrate(p||8); }catch(e){} }
var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
var KEY = 'app051:';
function load(k, d){ try{ var v = localStorage.getItem(KEY+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(KEY+k, JSON.stringify(v)); }catch(e){} }

// ---------- the drinks ----------
var D = [null,
 {n:'紅茶', liq:'#a4532a', coast:'#efd9b8', straw:'#2e180a', ice:1, d:'一切的起點。大杯去冰，茶香直接。'},
 {n:'奶茶', liq:'#c89668', coast:'#ecd1ab', straw:'#2e180a', d:'紅茶加鮮奶，顏色像下午四點的陽光。'},
 {n:'珍珠奶茶', liq:'#c89668', coast:'#e7c89c', straw:'#2e180a', pearls:5, d:'台灣人的國民飲料，粗吸管是靈魂。'},
 {n:'黑糖珍奶', liq:'#efe0c8', coast:'#dfba8a', straw:'#5a3018', pearls:5, tiger:1, d:'黑糖虎紋掛在杯壁，搖之前先拍照。'},
 {n:'芋頭鮮奶', liq:'#c3aab2', coast:'#e2cfc9', straw:'#5b4452', taro:1, d:'大甲芋頭手工壓泥，一口吃得到顆粒。'},
 {n:'抹茶拿鐵', liq:'#f1e6d2', coast:'#d9d7b2', straw:'#3e4a26', matcha:1, d:'上層抹茶、下層鮮奶，插下去才混。'},
 {n:'楊枝甘露', liq:'#f0a948', coast:'#f2cf94', straw:'#8a4b12', mango:1, d:'芒果、柚子果粒和西米露，夏天限定。'},

  openSheet('<div class="hero">' + cup(top) + '</div><h2>盤子滿了</h2><p>這局最大杯是 <b>' + D[top].n + '</b>。</p><div class="stats"><div><b>' + score + '</b><span>本局分數</span></div><div><b>' + best + '</b><span>最高分</span></div><div><b>' + undos + '</b><span>剩餘撤銷</span></div></div>' +
    '<button class="go" data-act="again">再搖一局</button>' + (stack.length && undos ? '<button class="go" data-act="undo" style="background:#8e5a33;box-shadow:inset 2px 3px 0 rgba(255,255,255,.2),0 5px 0 #5a3018">撤銷一步，救回來</button>' : ''));
}
function winSheet(){ fanfare(); openSheet('<div class="hero">' + cup(MAX) + '</div><h2>珍奶之王誕生</h2><p>' + D[MAX].d + '</p><button class="go" data-act="close">繼續合，刷分數</button>'); }
function newSheet(){ openSheet('<h2>重新開始？</h2><p>目前 ' + score + ' 分。這局會被收掉，最高分會留著。</p><button class="go" data-act="again">倒掉，重搖一杯</button>'); }
function dexSheet(focus){
  var h = '<h2>飲料圖鑑</h2><p>已解鎖 ' + seen.length + ' / ' + MAX + '</p><div class="stats"><div><b>' + stats.games + '</b><span>局數</span></div><div><b>' + stats.merges + '</b><span>合成次數</span></div><div><b>' + D[stats.top].n.slice(0, 4) + '</b><span>最大杯</span></div></div><div class="dex">';
  for (var i = 1; i <= MAX; i++){ var lk = seen.indexOf(i) < 0; h += '<div class="' + (lk ? 'lk' : '') + '"' + (i === focus ? ' id="dexF"' : '') + '>' + cup(i) + '<b>' + (lk ? '？？？' : D[i].n) + '</b><small>' + Math.pow(2, i) + '</small></div>'; }
  h += '</div>';
  if (focus && seen.indexOf(focus) >= 0) h = '<div class="hero">' + cup(focus) + '</div><h2>' + D[focus].n + '</h2><p>' + D[focus].d + '</p><button class="go" data-act="dex">看全部圖鑑</button>';
  openSheet(h);
}
sheet.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return; var a = b.dataset.act; haptic(8);
  if (a === 'again'){ closeSheet(); newGame(); toast('新的一局，加油'); }
  if (a === 'undo'){ closeSheet(); undo(); }
  if (a === 'close') closeSheet();
  if (a === 'dex') dexSheet();
});
$('undoBtn').addEventListener('click', function(){ audio(); if (!stack.length){ toast('還沒有可以撤銷的步驟'); return; } if (!undos){ toast('這局的撤銷用完了'); return; } undo(); });
$('newBtn').addEventListener('click', function(){ audio(); tok(); newSheet(); });
$('dexBtn').addEventListener('click', function(){ audio(); tok(); dexSheet(); });
$('sndBtn').addEventListener('click', function(){ snd = !snd; save('snd', snd); paintSnd(); if (snd){ audio(); setTimeout(function(){ bloop(4); }, 40); } haptic(6); });
$('chain').addEventListener('click', function(e){ var b = e.target.closest('[data-dex]'); if (!b) return; audio(); tok(); var i = +b.dataset.dex; if (seen.indexOf(i) < 0){ toast('還沒合出來，繼續努力'); haptic([10, 30, 10]); return; } dexSheet(i); });

// ---------- boot ----------
paintSnd(); layout();
var g = load('game', null);
if (g && g.m && g.m.length === 4){ grid = [[null,null,null,null],[null,null,null,null],[null,null,null,null],[null,null,null,null]]; build(g.m); score = g.score || 0; undos = g.undos == null ? 3 : g.undos; stack = g.stack || []; over = !!g.over; won = !!g.won; }
else { // a warm seeded board so the first screen already has a game going
  grid = [[null,null,null,null],[null,null,null,null],[null,null,null,null],[null,null,null,null]];
  build([[1,2,0,0],[3,1,0,1],[4,3,2,0],[5,6,4,2]]); score = 412;
}
hud(); layout(); // second pass: chain + goal now have their real height
window.addEventListener('resize', layout);
})();
</script>
