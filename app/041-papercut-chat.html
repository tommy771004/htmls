<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ede1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="紙訊">
<title>紙訊 · 通訊</title>
<meta name="description" content="像剪紙一樣的通訊 App：柿橘紙泡泡、剪紙貼圖、長按貼上反應章或引用回覆（紙條從輸入列後方滑出、點引用跳回原訊息）、「悄悄送」折角紙不提醒對方、按住錄語音、對方輸入中。收錄於 100 Creative HTML Works（App 041・剪紙貼圖、柿橘與墨）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/041-papercut-chat.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f3ede1'/%3E%3Cpath d='M9 14 L55 11 L57 42 L28 44 L17 53 L19 45 L11 45Z' fill='%23c4521d'/%3E%3Cpath d='M22 26l4 4-4 4-4-4zM34 26l4 4-4 4-4-4zM46 26l4 4-4 4-4-4z' fill='%23f3ede1'/%3E%3C/svg%3E">
<style>
:root{
  --rice:#f3ede1;
  --rice-2:#fbf8f1;
  --rice-3:#e8dfcd;
  --kaki:#c4521d;
  --kaki-2:#df7a3e;
  --kaki-deep:#a3401a;
  --ink:#231f1c;
  --ink-2:#5b534b;
  --ink-3:#7c7268;
  --font:"Yuanti TC","Hiragino Maru Gothic ProN","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --out:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.5,.5,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:16px/1.45 var(--font);color:var(--ink);background:var(--rice);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,.m:focus-visible{outline:2px dashed var(--kaki);outline-offset:3px;border-radius:8px}
svg{display:block}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--rice);isolation:isolate}
@media (min-width:521px){
  body{background:#c9582a}
  .stage{display:flex;align-items:center;justify-content:center;gap:64px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:56px;padding:10px;z-index:1;
    background:linear-gradient(155deg,#3a322c,#231f1c 45%,#171412);box-shadow:inset 0 0 0 1px rgba(243,237,225,.18),0 18px 0 -8px rgba(80,24,4,.35),0 26px 30px -20px rgba(60,18,4,.6)}
  .screen{inset:10px;border-radius:46px}
  .caption{display:block;position:relative;z-index:1;max-width:250px;color:var(--rice)}
  .caption h1{font:700 50px/1.05 var(--font);letter-spacing:.08em}
  .caption p{margin-top:14px;font:17px/1.7 var(--font);color:rgba(251,248,241,.88)}
}
@media (min-width:521px) and (max-width:860px){.caption{display:none}}

.fibre{position:absolute;inset:0;z-index:0;pointer-events:none}
.fibre svg{width:100%;height:100%}

.status{position:absolute;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 32px;font:700 15px/1 var(--font);color:var(--ink);pointer-events:none}
.status .glyphs{display:flex;align-items:center;gap:6px}
@media (display-mode:standalone){.status{display:none}}

.view{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding-top:calc(44px + env(safe-area-inset-top));background:transparent;transition:transform .5s var(--out)}
@media (display-mode:standalone){.view{padding-top:env(safe-area-inset-top)}}
.list-view.pushed{transform:translateX(-28%)}
.chat-view{z-index:10;background:var(--rice);transform:translateX(102%);visibility:hidden;transition:transform .5s var(--out),visibility 0s .5s;box-shadow:-6px 0 10px -8px rgba(35,31,28,.4)}
.chat-view.on{transform:none;visibility:visible;transition:transform .5s var(--out)}
.chat-view.drag{transition:none}

.ic{width:44px;height:44px;display:grid;place-items:center;flex:none;border-radius:12px;color:var(--ink);transition:transform .2s var(--spring)}
.ic:active{transform:scale(.88) rotate(-6deg)}
.ic[hidden]{display:none}
.ic svg{width:26px;height:26px}

/* ---------- list ---------- */
.lhead{display:flex;align-items:center;gap:8px;padding:4px 12px 0 20px}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brand h1{font:700 32px/1 var(--font);letter-spacing:.06em}
.brand svg{width:34px;height:34px}
.find{display:flex;align-items:center;gap:8px;margin:12px 16px 4px;height:44px;padding:0 14px;background:var(--rice-2);
  clip-path:polygon(0 8%,3% 0,40% 4%,72% 0,98% 3%,100% 50%,99% 96%,60% 100%,24% 97%,1% 100%);}
.find svg{width:20px;height:20px;flex:none;color:var(--ink-3)}
.find input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px}
.find input::placeholder{color:var(--ink-3)}
.filters{display:flex;gap:22px;padding:6px 22px 4px}
.filters button{position:relative;height:40px;font:700 15px/1 var(--font);color:var(--ink-3);transition:color .2s}
.filters button[aria-pressed=true]{color:var(--ink)}
.filters button i{position:absolute;left:50%;bottom:4px;width:22px;height:7px;margin-left:-11px;background:var(--kaki);
  clip-path:polygon(0 50%,15% 0,30% 50%,45% 0,60% 50%,75% 0,90% 50%,100% 0,100% 100%,0 100%);transform:scaleX(0);transition:transform .35s var(--spring)}
.filters button[aria-pressed=true] i{transform:scaleX(1)}
.chats{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:4px 0 40px;scrollbar-width:none}
.chats::-webkit-scrollbar{display:none}
.cw{position:relative;overflow:hidden;transition:height .3s var(--out)}
.acts{position:absolute;top:0;bottom:0;right:0;display:flex}
.acts button{width:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 13.5px/1 var(--font);color:var(--rice-2)}
.acts button svg{width:22px;height:22px}
.acts .pin{background:var(--ink)}.acts .del{background:var(--kaki)}
.ci{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:10px 18px 10px 16px;text-align:left;background:var(--rice);touch-action:pan-y;transition:transform .35s var(--out)}
.ci.drag{transition:none}
.ci:active{background:#ece4d4}
.av{position:relative;width:52px;height:52px;flex:none}
.av svg{width:52px;height:52px}
.ci .mid{flex:1;min-width:0}
.ci .top{display:flex;align-items:baseline;gap:8px}
.ci b{flex:1;min-width:0;font:700 17px/1.25 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci time{font:14px/1 var(--font);color:var(--ink-3);flex:none}
.ci .bot{display:flex;align-items:center;gap:8px;margin-top:5px}
.ci .pv{flex:1;min-width:0;font-size:14.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .pv.typing{color:var(--kaki)}
.ci .mk{display:flex;align-items:center;gap:4px;flex:none;color:var(--ink-3)}
.ci .mk svg{width:16px;height:16px}
.badge{position:relative;width:26px;height:26px;flex:none;display:grid;place-items:center}
.badge svg{position:absolute;inset:0;width:26px;height:26px}
.badge span{position:relative;font:700 13px/1 var(--font);color:var(--rice-2);font-variant-numeric:tabular-nums}
.ci.pinned::after{content:"";position:absolute;right:0;top:12px;width:6px;height:18px;background:var(--kaki);clip-path:polygon(0 0,100% 0,100% 100%,0 80%)}
.none{padding:40px 30px;text-align:center;color:var(--ink-2);font-size:15px}
.none svg{width:96px;height:96px;margin:0 auto 12px}

/* ---------- chat ---------- */
.chead{display:flex;align-items:center;gap:6px;padding:2px 8px 8px 6px;border-bottom:0;position:relative;z-index:3;background:var(--rice)}
.chead::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:var(--rice);
  clip-path:polygon(0 0,100% 0,100% 30%,96% 80%,91% 20%,86% 70%,80% 30%,74% 90%,68% 20%,61% 60%,55% 10%,49% 80%,43% 30%,37% 70%,31% 10%,25% 80%,19% 30%,12% 70%,6% 20%,0 60%);filter:drop-shadow(0 1px 0 rgba(35,31,28,.14))}
.chead .av{width:40px;height:40px}.chead .av svg{width:40px;height:40px}
.who{flex:1;min-width:0}
.who b{display:block;font:700 17px/1.2 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;font-size:13px;color:var(--ink-3);height:18px}
.who span.typing{color:var(--kaki)}
.msgs{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:18px 14px 12px;scrollbar-width:none;display:flex;flex-direction:column}
.msgs::-webkit-scrollbar{display:none}
.day{align-self:center;margin:10px 0 14px;padding:6px 20px;background:var(--ink);color:var(--rice-2);font:700 13px/1 var(--font);
  clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)}
.m{position:relative;display:flex;flex-direction:column;max-width:78%;margin-top:4px;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.m.me{align-self:flex-end;align-items:flex-end}
.m.them{align-self:flex-start;align-items:flex-start}
.m.first{margin-top:14px}
.m .from{font:700 13px/1 var(--font);color:var(--kaki-deep);margin:0 0 5px 10px}
.m .paper{position:relative;filter:drop-shadow(1px 2px 0 rgba(35,31,28,.16));transition:transform .15s}
.m.pressing .paper{transform:scale(.97) rotate(-.6deg)}
.bub{position:relative;padding:10px 15px 12px;font-size:16px;line-height:1.5;word-break:break-word;background:var(--rice-2);color:var(--ink)}
.me .bub{background:var(--kaki);color:#fffaf2}
.m .meta{font:12.5px/1 var(--font);color:var(--ink-3);margin:5px 8px 0}
.m.new .paper{animation:pop .5s var(--spring)}
.me.new .paper{transform-origin:100% 100%}.them.new .paper{transform-origin:0 100%}
@keyframes pop{from{transform:translateY(14px) scale(.9) rotate(-3deg)}}
.stk{width:132px;height:132px}
.stk svg{width:132px;height:132px}
.m.stkm .paper{filter:drop-shadow(1.5px 2.5px 0 rgba(35,31,28,.18))}
.react{position:absolute;bottom:-12px;width:34px;height:34px;z-index:2;animation:stamp .45s var(--spring)}
.me .react{left:-14px}.them .react{right:-14px}
.react svg{width:34px;height:34px}
@keyframes stamp{from{transform:scale(1.9) rotate(-30deg)}}
.m.hasr{margin-bottom:14px}
.qt{position:relative;display:flex;align-items:baseline;gap:6px;max-width:calc(100% - 10px);margin:0 10px -8px;padding:7px 12px 14px;background:var(--rice-3);color:var(--ink-2);font-size:13px;line-height:1.4;text-align:left;
  clip-path:polygon(0 4px,8% 1px,17% 4px,29% 0,41% 3px,55% 1px,68% 4px,80% 0,91% 3px,100% 1px,100% calc(100% - 3px),87% 100%,74% calc(100% - 4px),60% calc(100% - 1px),45% calc(100% - 4px),31% 100%,18% calc(100% - 3px),6% 100%,0 calc(100% - 2px))}
.qt b{flex:none;font-weight:700;color:var(--ink)}
.qt span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qt:active{background:#dfd3bd}
.m .fold{position:absolute;top:0;right:0;width:15px;height:15px;background:#f2b88f;clip-path:polygon(0 0,0 100%,100% 100%)}
.them.flash .bub{animation:flashT .9s var(--out)}
.me.flash .bub{animation:flashM .9s var(--out)}
.m.flash .paper{animation:flashP .9s var(--out)}
@keyframes flashT{15%,50%{background-color:#f4cdab}}
@keyframes flashM{15%,50%{background-color:#8a3312}}
@keyframes flashP{15%,50%{filter:drop-shadow(3px 4px 0 rgba(196,82,29,.55))}}
.voice{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 9px;min-width:180px}
.voice .play{width:40px;height:40px;display:grid;place-items:center;flex:none}
.voice .play svg{width:26px;height:26px}
.wave{display:flex;align-items:center;gap:2px;height:30px;flex:1}
.wave i{display:block;width:3px;border-radius:0;background:currentColor;opacity:.4;transform-origin:50% 50%}
.wave i.on{opacity:1}
.voice .dur{font:700 13px/1 var(--font);font-variant-numeric:tabular-nums}
.typingb .bub{display:flex;gap:6px;padding:15px 16px}
.typingb i{width:9px;height:9px;background:var(--kaki);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);animation:bob 1s ease-in-out infinite}
.typingb i:nth-child(2){animation-delay:.15s;background:var(--ink-2)}.typingb i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-5px) rotate(45deg)}}

.picker{position:absolute;z-index:30;display:flex;flex-wrap:wrap;width:292px;gap:2px;padding:6px 8px;background:var(--ink);
  clip-path:polygon(0 6%,5% 0,30% 5%,58% 0,88% 4%,100% 0,98% 50%,100% 95%,70% 100%,40% 95%,12% 100%,0 92%,2% 48%);visibility:hidden;transform:scale(.6);transition:transform .35s var(--spring),visibility 0s .35s}
.picker.on{visibility:visible;transform:none;transition:transform .35s var(--spring)}
.picker button{width:44px;height:44px;display:grid;place-items:center;transition:transform .2s var(--spring)}
.picker button:active{transform:scale(1.25) rotate(-8deg)}
.picker svg{width:32px;height:32px}
.picker .preply{flex:1 0 100%;width:auto;height:42px;display:flex;align-items:center;justify-content:flex-start;gap:10px;padding:0 10px;color:var(--rice-2);font:700 15px/1 var(--font);background:#322c28;
  clip-path:polygon(0 3px,12% 0,30% 3px,52% 0,74% 2px,100% 0,100% 100%,0 100%)}
.picker .preply svg{width:20px;height:20px;color:var(--kaki-2)}
.picker .preply:active{transform:none;background:#3b342f}
.pickscrim{position:absolute;inset:0;z-index:29;display:none}
.pickscrim.on{display:block}

.composer{position:relative;z-index:5;display:flex;align-items:flex-end;gap:4px;padding:8px 8px calc(24px + env(safe-area-inset-bottom));background:var(--rice)}
.composer::before{content:"";position:absolute;left:0;right:0;top:-6px;height:6px;background:var(--rice);
  clip-path:polygon(0 40%,6% 90%,12% 30%,19% 80%,25% 20%,31% 90%,37% 30%,43% 70%,49% 20%,55% 90%,61% 40%,68% 80%,74% 10%,80% 70%,86% 30%,91% 80%,96% 20%,100% 70%,100% 100%,0 100%)}
.field{flex:1;min-width:0;display:flex;align-items:center;min-height:44px;background:var(--rice-2);padding:0 14px;margin-bottom:0;
  clip-path:polygon(0 6%,4% 0,50% 5%,96% 0,100% 8%,99% 50%,100% 94%,60% 100%,3% 96%,0 100%,1% 50%)}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;height:44px}
.field input::placeholder{color:var(--ink-3)}
.rwrap{position:relative;z-index:4;flex:none;height:0;transition:height .38s cubic-bezier(.2,.8,.2,1)}
.rwrap.on{height:62px}
.reply{position:absolute;left:10px;right:10px;bottom:0;height:62px;display:flex;align-items:center;gap:10px;padding:6px 0 8px 14px;background:var(--rice-3);
  clip-path:polygon(0 7px,5% 3px,11% 6px,19% 1px,27% 5px,36% 2px,44% 6px,53% 0,61% 4px,70% 1px,78% 6px,86% 2px,93% 5px,100% 1px,100% 100%,0 100%);
  transform:translateY(100%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s}
.rwrap.on .reply{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.reply>svg{width:20px;height:20px;flex:none;color:var(--kaki)}
.reply .rt{flex:1;min-width:0;line-height:1.35}
.reply .rt b{display:block;font:700 13px/1.35 var(--font);color:var(--ink-2)}
.reply .rt b em{font-style:normal;color:var(--ink)}
.reply .rt span{display:block;font-size:14.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply .ic svg{width:18px;height:18px}
.mode{flex:none;display:flex;align-items:center;gap:5px;height:44px;margin-right:-6px;padding:0 6px;color:var(--ink-2);font:700 13px/1 var(--font)}
.mode svg{width:18px;height:18px;flex:none;overflow:visible;transform:rotate(-7deg)}
.mode .gs{fill:var(--ink-2);transition:fill .3s}
.mode .gc{fill:var(--ink-2);transform-box:view-box;transform-origin:14px 6px;transform:rotate(45deg) scaleY(1) rotate(-45deg);transition:transform .42s cubic-bezier(.2,.8,.2,1),fill .3s}
.mode.quiet{color:var(--kaki-deep)}
.mode.quiet .gs{fill:var(--kaki-deep)}
.mode.quiet .gc{fill:#f2b88f;transform:rotate(45deg) scaleY(-1) rotate(-45deg)}
.ml{position:relative;display:grid;overflow:hidden;height:20px;line-height:20px;transition:width .36s cubic-bezier(.2,.8,.2,1)}
.ml b{grid-area:1/1;justify-self:start;white-space:nowrap;font-weight:700;transition:transform .36s cubic-bezier(.2,.8,.2,1)}
.mode:not(.quiet) .ml b+b{transform:translateY(105%)}
.mode.quiet .ml b:first-child{transform:translateY(-105%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.send{color:var(--kaki)}
.send svg{width:30px;height:30px}
.mic.rec{color:var(--kaki)}
.recbar{position:absolute;inset:0 0 auto 0;height:60px;display:flex;align-items:center;gap:12px;padding:8px 64px 0 18px;background:var(--rice);visibility:hidden}
.recbar.on{visibility:visible}
.recbar .dot{width:12px;height:12px;background:var(--kaki);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:var(--ink)}}
.recbar time{font:700 15px/1 var(--font);font-variant-numeric:tabular-nums;width:40px}
.recwave{flex:1;height:34px;display:flex;align-items:center;justify-content:flex-end;gap:2px;overflow:hidden}
.recwave i{flex:none;width:3px;background:var(--kaki)}
.recbar small{font-size:13px;color:var(--ink-3);white-space:nowrap}
.recbar.cancel small{color:var(--kaki-deep);font-weight:700}

.drawer{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--rice-3);padding:10px 12px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(105%);visibility:hidden;transition:transform .45s var(--spring),visibility 0s .45s;touch-action:none}
.drawer.on{transform:none;visibility:visible;transition:transform .45s var(--spring)}
.drawer::before{content:"";position:absolute;left:0;right:0;top:-8px;height:9px;background:var(--rice-3);
  clip-path:polygon(0 100%,0 50%,4% 0,8% 50%,12% 0,16% 50%,20% 0,24% 50%,28% 0,32% 50%,36% 0,40% 50%,44% 0,48% 50%,52% 0,56% 50%,60% 0,64% 50%,68% 0,72% 50%,76% 0,80% 50%,84% 0,88% 50%,92% 0,96% 50%,100% 0,100% 100%)}
.drawer.drag{transition:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:0 8px 6px}
.drawer header b{font:700 16px/1 var(--font)}
.drawer header span{font-size:13px;color:var(--ink-3)}
.grab{width:42px;height:5px;background:#c6b89f;margin:0 auto 10px;clip-path:polygon(0 0,100% 20%,96% 100%,4% 80%)}
.stks{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.stks button{aspect-ratio:1;display:grid;place-items:center;transition:transform .25s var(--spring)}
.stks button:active{transform:scale(.86) rotate(6deg)}
.stks svg{width:78%;height:78%;filter:drop-shadow(1px 2px 0 rgba(35,31,28,.16))}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(35,31,28,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;max-height:84%;display:flex;flex-direction:column;background:var(--rice);padding:14px 16px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(106%);visibility:hidden;transition:transform .5s var(--spring),visibility 0s .5s;touch-action:none}
.sheet::before{content:"";position:absolute;left:0;right:0;top:-10px;height:11px;background:var(--rice);
