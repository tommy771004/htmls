 16%,#593724 16% 20%,#c19459 20% 22%,transparent 22% 76%,#c19459 76% 78%,#593724 78% 82%,transparent 82%);pointer-events:none}.corner{position:absolute;width:33px;height:33px;background:#573829;border:3px solid #c3955d;z-index:1}.corner.tl{left:0;top:0;border-radius:17px 0 0}.corner.tr{right:0;top:0;border-radius:0 17px 0 0}.corner.bl{left:0;bottom:0;border-radius:0 0 0 17px}.corner.br{right:0;bottom:0;border-radius:0 0 17px}.sticker{position:absolute;z-index:2;display:grid;place-items:center;text-align:center;border:3px solid #f9e9c8;box-shadow:1px 2px 3px #2a1a1055;font-weight:900}.sticker.sun{width:79px;height:79px;left:22%;top:28%;border-radius:50%;background:#f3b04b;color:#8c472d;transform:rotate(-18deg);font:800 9px/1.1 system-ui}.sticker.sun b{font:30px/1 Georgia}.sticker.rail{width:91px;height:56px;right:12%;top:14%;background:#30687a;color:#fff7df;transform:rotate(13deg);font:700 14px/1 Georgia}.sticker.north{width:80px;height:48px;right:25%;bottom:10%;background:#b7573f;color:#fff2d6;transform:rotate(-7deg);font:800 11px/1.2 system-ui}.progressBadge{position:absolute;bottom:12px;left:14px;z-index:3;background:#fff3d8;border:2px solid #8b5a37;padding:5px 9px;font:800 12px system-ui;transform:rotate(4deg)}.fly{position:fixed;z-index:20;background:#f6d457;border:2px solid #513c25;padding:6px 12px;pointer-events:none;animation:fly .45s cubic-bezier(.2,.8,.3,1) forwards}@keyframes fly{to{transform:translate(0,-120px) rotate(18deg) scale(.2);opacity:0}}.bar{height:7px;background:#dcc4a4}.bar i{display:block;height:100%;background:#b35339;width:0;transition:width .35s}.section{padding:19px 22px 0}.sectionHead{display:flex;justify-content:space-between;align-items:baseline}.section h2{font:600 23px Georgia,"Songti TC",serif;margin:0}.section small{font:700 10px system-ui;color:#98775e}.weather{display:flex;gap:5px;margin-top:12px}.weather button{border:1px solid #b99475;background:transparent;flex:1;padding:8px 4px;font-size:11px;color:#70553f}.weather button.active{background:#374f53;border-color:#374f53;color:white}.suggestion{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;border-left:4px solid #d6a348;background:#eee0c8;padding:9px 10px;font-size:11px;line-height:1.4}.suggestion span{flex:1}.suggestion button{border:0;background:#a86141;color:#fff7e5;padding:7px 8px;white-space:nowrap;font-size:10px}.templates{display:flex;gap:8px;overflow:auto;padding:13px 0 3px;scrollbar-width:none}.templates button{flex:none;border:2px dashed #a36348;border-radius:50%;background:#fff5e6;color:#8f4b34;width:67px;height:67px;transform:rotate(-5deg);font:700 10px/1.2 system-ui}.templates button:nth-child(2){transform:rotate(8deg);border-color:#527d83;color:#38616a}.templates button:nth-child(3){transform:rotate(-9deg);border-color:#c8963f;color:#926120}.tabs{display:flex;gap:12px;margin:19px 22px 0;border-bottom:2px solid #3e3227;overflow:auto}.tabs button{background:transparent;border:0;border-bottom:4px solid transparent;padding:7px 2px 8px;white-space:nowrap;color:#89725f;font-size:12px;font-weight:700}.tabs button.active{color:#33271e;border-color:#b35339}.list{padding:0 22px}.item{display:grid;grid-template-columns:35px 1fr auto;align-items:center;gap:9px;min-height:55px;border-bottom:1px solid #d8c5ac}.item .check{width:28px;height:28px;background:#fff8e9;border:2px solid #9c7e65;display:grid;place-items:center;border-radius:4px}.item.packed .check{background:#b35339;color:white;border-color:#b35339}.item strong{display:block;font-size:13px;font-weight:600}.item.packed strong{text-decoration:line-through;color:#a2907d}.item small{font-size:10px;color:#9c8068}.item .delete{background:transparent;border:0;color:#9e816e;font-size:18px;padding:7px}.empty{padding:23px 0;color:#977e66;font-size:12px}.add{position:fixed;bottom:calc(15px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 44px),426px);height:49px;border:2px solid #5f3c2d;background:#b35339;color:#ff </style></head><body><main class="app"><div class="status"><span>09:41</span><span>●●● ▰ 100%</span></div><header class="header"><div><span class="eyebrow">TRAVEL COMPANION · NO. 094</span><h1>行李</h1><p>把要帶的，放進一趟旅行。</p></div><div class="ticket">PACK<br>& GO<br>✈</div></header><div class="hero"><div class="case" id="case"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><div class="sticker sun"><span><b>☀</b><br>SUNNY DAYS</span></div><div class="sticker rail">RAIL<br>JOURNEY</div><div class="sticker north">TAKE THE<br>LONG WAY</div><div class="progressBadge" id="badge">0 / 0 READY</div></div></div><div class="bar"><i id="progress"></i></div><section class="section"><div class="sectionHead"><h2>出發前的檢查</h2><small id="remain">0 ITEMS TO PACK</small></div><div class="weather" role="group" aria-label="目的地天氣"><button class="active" data-weather="sun">☀ 晴天</button><button data-weather="rain">☂ 雨天</button><button data-weather="cold">❄ 寒冷</button></div><div class="suggestion"><span id="suggestion"></span><button id="suggestAdd">加入清單</button></div><div class="templates"><button data-template="weekend">週末<br>小旅行</button><button data-template="city">城市<br>漫遊</button><button data-template="outdoor">山海<br>戶外</button></div></section><nav class="tabs" aria-label="清單篩選"><button class="active" data-filter="all">全部</button><button data-filter="衣物">衣物</button><button data-filter="用品">用品</button><button data-filter="證件">證件</button><button data-filter="其他">其他</button></nav><section class="list" id="list"></section><button class="add" id="add">＋ 放入一件新物品</button><div class="overlay" id="overlay" hidden></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="新增物品"><h2>再放一件進去</h2><form id="form"><label for="name">物品名稱</label><input id="name" maxlength="30" required placeholder="例：相機、充電線、雨傘"><label for="category">分類</label><select id="category"><option>衣物</option><option>用品</option><option>證件</option><option>其他</option></select><div class="actions"><button type="button" id="cancel">稍後</button><button class="save" type="submit">放進清單</button></div></form></section></main><div class="toast" id="toast" role="status"></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),templates={weekend:[['上衣','衣物'],['換洗衣物','衣物'],['牙刷','用品'],['充電線','用品'],['身分證','證件']],city:[['舒適的鞋','衣物'],['輕便外套','衣物'],['交通卡','證件'],['行動電源','用品'],['相機','用品']],outdoor:[['防曬外套','衣物'],['水壺','用品'],['急救包','用品'],['登山鞋','衣物'],['身分證','證件']]},suggest={sun:['太陽眼鏡','用品','晴天別忘記太陽眼鏡。'],rain:['折疊雨傘','用品','預報有雨，帶一把折疊傘。'],cold:['保暖圍巾','衣物','天氣轉冷，圍巾能派上用場。']};let items,weather='sun',filter='all',toastTimer;try{items=JSON.parse(localStorage.getItem('luggage:items')||'null')||templates.weekend.map(([name,category],i)=>({id:String(i),name,category,packed:false}))}catch{items=[]}function save(){localStorage.setItem('luggage:items',JSON.stringify(items))}function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2300)}function render(){let done=items.filter(x=>x.packed).length;$('#badge').textContent=done+' / '+items.length+' READY';$('#remain').textContent=(items.length-done)+' ITEMS TO PACK';$('#progress').style.width=(items.length?Math.round(done/items.length*100):0)+'%';let root=$('#list');root.replaceChildren();let shown=filter==='all'?items:items.filter(x=>x.category===filter);if(!shown.length){let p=document.createElement('p');p.className='empty';p.textContent='這裡空空的，先放進一件物品吧。';root.append(p)}shown.forEach(x=>{let row=document.createElement('div');row.className='item'+(x.packed?' packed':'');let check=document.createElement('button');check.className='check';check.setAttribute('aria-label',(x.packed?'取消打包 ':'標記已打包 ')+x.name);check.textContent=x.packed?'✓':'';check.onclick=()=>{x.packed=!x.packed;save();if(x.packed)fly(check,x.name);render();if(items.length&&items.every(a=>a.packed))toast('行李準備好了，出發！')};let info=document.createElement('div');let name=document.createElement('strong');name.textContent=x.name;let cat=document.createElement('small');cat.textContent=x.category;info.append(name,cat);let del=document.createElement('button');del.className='delete';del.textContent='×';del.setAttribute('aria-label','刪除 '+x.name);del.onclick=()=>{items=items.filter(a=>a.id!==x.id);save();render()};row.append(check,info,del);root.append(row)});$('#suggestion').textContent=suggest[weather][2];$('#suggestAdd').disabled=items.some(x=>x.name===suggest[weather][0]);$('#suggestAdd').textContent=$('#suggestAdd').disabled?'已加入':'加入清單';document.querySelectorAll('[data-weather]').forEach(b=>b.classList.toggle('active',b.dataset.weather===weather));document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter))}function fly(from,name){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;let r=from.getBoundingClientRect(),e=document.createElement('span');e.className='fly';e.textContent=name;e.style.left=r.left+'px';e.style.top=r.top+'px';document.body.append(e);setTimeout(()=>e.remove(),500)}function addItem(name,category){if(items.some(x=>x.name===name)){toast('清單裡已有 '+name);return}items.push({id:String(Date.now())+Math.random(),name,category,packed:false});save();render()}function open(){$('#overlay').hidden=false;$('#sheet').classList.add('open');setTimeout(()=>$('#name').focus(),130)}function close(){$('#overlay').hidden=true;$('#sheet').classList.remove('open');$('#name').value=''}document.querySelectorAll('[data-weather]').forEach(b=>b.onclick=()=>{weather=b.dataset.weather;render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{let added=0;templates[b.dataset.template].forEach(([n,c])=>{if(!items.some(x=>x.name===n)){items.push({id:String(Date.now())+Math.random(),name:n,category:c,packed:false});added++}});save();filter='all';render();toast(added?'已加入 '+added+' 件範本物品':'範本物品都在清單裡了')});$('#suggestAdd').onclick=()=>{let [n,c]=suggest[weather];addItem(n,c);toast('已加入 '+n)};$('#add').onclick=open;$('#cancel').onclick=close;$('#overlay').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('#form').onsubmit=e=>{e.preventDefault();let name=$('#name').value.trim();if(!name)return;addItem(name,$('#category').value);close()};render()})();
</script></body></html>
