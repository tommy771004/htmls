function forecast(){const snap=snapshots[trip.destination],day=snap?.days.find(d=>d[0]===trip.departure),expired=localDay()>'2026-09-26',past=trip.departure<localDay(),valid=!!day&&!expired&&!past;const title=$('#forecastTitle'),detail=$('#forecastDetail');title.textContent=day?`${day[1]}–${day[2]}°C · ${snap.name}`:snap?snap.name+' · 無對應快照':'手動準備這趟旅行';detail.classList.toggle('stale',!valid);detail.textContent=expired?'快照已過期，請參考最新預報並手動選擇天氣。':past?'出發日期已過，請更新日期；目前使用手動建議。':day?day[4]+' · '+day[0]:snap?'此日期不在快照範圍內，請手動選擇天氣。':'此目的地沒有離線快照，請手動選擇天氣。';$('#forecastSource').textContent=snap?'離線預報快照 · 2026-09-24 擷取自 OpenAI 天氣查詢；涵蓋 09/24–09/26，不會自動更新。':'保留晴天、雨天與寒冷三種備援情境。';$('#forecastDays').replaceChildren();if(snap)for(const d of snap.days){const cell=document.createElement('span');cell.textContent=d[0].slice(5)+' '+(d[3]==='rain'?'☂':'☀')+' '+d[1]+'–'+d[2]+'°';$('#forecastDays').append(cell)}$('#useSnapshot').disabled=!valid||trip.auto;$('#useSnapshot').textContent=!valid?'快照不可套用':trip.auto?'已依目的地帶入':'恢復目的地建議';const automatic=trip.auto&&valid;if(automatic)weather=day[3];else weather=trip.manual;$('#weatherMode').textContent=automatic?'目的地快照建議 · 可隨時手動覆寫':'手動備援 · 不受過期或缺漏快照影響';document.querySelector('.sticker.rail').textContent={taipei:'TAIPEI',tokyo:'TOKYO',seoul:'SEOUL',other:'JOURNEY'}[trip.destination];return automatic;}
$('#destination').onchange=()=>{trip.destination=$('#destination').value;trip.auto=true;saveTrip();render()};$('#departure').onchange=()=>{if(!$('#departure').value)return;trip.departure=$('#departure').value;trip.auto=true;saveTrip();render()};$('#useSnapshot').onclick=()=>{trip.auto=true;saveTrip();render()};
function save(){localStorage.setItem('luggage:items',JSON.stringify(items))}function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2300)}function render(){const automatic=forecast();let done=items.filter(x=>x.packed).length;$('#badge').textContent=done+' / '+items.length+' READY';$('#remain').textContent=(items.length-done)+' ITEMS TO PACK';$('#progress').style.width=(items.length?Math.round(done/items.length*100):0)+'%';let root=$('#list');root.replaceChildren();let shown=filter==='all'?items:items.filter(x=>x.category===filter);if(!shown.length){let p=document.createElement('p');p.className='empty';p.textContent='這裡空空的，先放進一件物品吧。';root.append(p)}shown.forEach(x=>{let row=document.createElement('div');row.className='item'+(x.packed?' packed':'');let check=document.createElement('button');check.className='check';check.setAttribute('aria-label',(x.packed?'取消打包 ':'標記已打包 ')+x.name);check.textContent=x.packed?'✓':'';check.onclick=()=>{x.packed=!x.packed;save();if(x.packed)fly(check,x.name);render();if(items.length&&items.every(a=>a.packed))toast('行李準備好了，出發！')};let info=document.createElement('div');let name=document.createElement('strong');name.textContent=x.name;let cat=document.createElement('small');cat.textContent=(x.sample?'範本 · ':'')+x.category;info.append(name,cat);let del=document.createElement('button');del.className='delete';del.textContent='×';del.setAttribute('aria-label','刪除 '+x.name);del.onclick=()=>{items=items.filter(a=>a.id!==x.id);save();render()};row.append(check,info,del);root.append(row)});$('#suggestion').textContent=(automatic?'目的地建議 · ':'手動建議 · ')+suggest[weather][2];$('#suggestAdd').disabled=items.some(x=>x.name===suggest[weather][0]);$('#suggestAdd').textContent=$('#suggestAdd').disabled?'已加入':'加入清單';document.querySelectorAll('[data-weather]').forEach(b=>(b.classList.toggle('active',b.dataset.weather===weather),b.setAttribute('aria-pressed',b.dataset.weather===weather)));document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));if(!busy)renderStack()}let later=[],busy=false;const calm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;function queue(){return items.filter(x=>!x.packed).sort((a,b)=>later.indexOf(a.id)-later.indexOf(b.id))}
function renderStack(){const root=$('#stack'),q=queue();root.replaceChildren();$('#nextLeft').textContent=q.length?q.length+' 件待放 · 往上拖進皮箱':'全部就緒';$('#later').disabled=q.length<2;$('#packTop').disabled=!q.length;if(!q.length){const t=document.createElement('div');t.className='tag top done';t.innerHTML='<small>行李吊牌</small><strong>都放好了</strong>';root.append(t);return}
q.slice(0,3).reverse().forEach((x,i,arr)=>{const depth=arr.length-1-i,t=document.createElement('div');t.className='tag '+(depth?'b'+depth:'top');const c=document.createElement('small'),n=document.createElement('strong'),h=document.createElement('span');c.textContent=(x.sample?'範本 · ':'')+x.category;n.textContent=x.name;h.className='hint';h.innerHTML='<span>↑ 拿住孔往上拖</span><span>No. '+String(items.indexOf(x)+1).padStart(2,'0')+'</span>';t.append(c,n,h);if(!depth){t.dataset.id=x.id;t.setAttribute('role','group');t.setAttribute('aria-label','下一件：'+x.name);t.insertAdjacentHTML('beforeend','<span class="grip" aria-hidden="true"></span><span class="stamp in" aria-hidden="true">PACKED</span>');swipe(t,x)}else t.setAttribute('aria-hidden','true');root.append(t)})}
function settle(card,x,dir){if(busy)return;busy=true;const done=()=>{busy=false;if(dir>0){x.packed=true;save();render();if(items.length&&items.every(a=>a.packed))toast('行李準備好了，出發！')}else{later=later.filter(id=>id!==x.id);later.push(x.id);renderStack()}};if(calm()){done();return}const cur=getComputedStyle(card).transform,m=cur==='none'?{e:0,f:0}:new DOMMatrix(cur),box=card.getBoundingClientRect(),cs=$('#case').getBoundingClientRect();const end=dir>0?`translate(${cs.left+cs.width/2-(box.left+box.width/2-m.e)}px,${cs.top+cs.height/2-(box.top+box.height/2-m.f)}px) rotate(-14deg) scale(.18)`:'translate(0,26px) rotate(-2.4deg) scale(.95)';const back=card.parentNode.querySelector('.b1');back&&back.animate([{transform:'translate(7px,9px) rotate(2.4deg)'},{transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});card.animate([{transform:cur==='none'?'none':cur},{transform:end}],{duration:dir>0?460:260,easing:dir>0?'cubic-bezier(.5,0,.2,1)':'cubic-bezier(.2,.8,.2,1)',fill:'forwards'}).onfinish=()=>{if(dir>0)$('#case').animate([{transform:'rotate(-3deg)'},{transform:'rotate(-1.2deg) translateY(3px)'},{transform:'rotate(-3deg)'}],{duration:260,easing:'cubic-bezier(.2,.8,.2,1)'});done()}}
function swipe(card,x){let st=null;const stamp=card.querySelector('.stamp'),cs=$('#case'),reset=()=>{stamp.style.opacity=0;cs.classList.remove('catch')};card.addEventListener('pointerdown',e=>{if(busy||e.button>0)return;if(e.pointerType!=='mouse'&&!e.target.closest('.grip'))return;st={x:e.clientX,y:e.clientY,id:e.pointerId};card.setPointerCapture(e.pointerId);card.classList.add('dragging')});card.addEventListener('pointermove',e=>{if(!st||e.pointerId!==st.id)return;const dx=e.clientX-st.x,dy=Math.min(24,e.clientY-st.y),k=Math.max(0,Math.min(1,-dy/110));card.style.transform=`translate(${dx*.35}px,${dy}px) rotate(${dx/40}deg) scale(${1-k*.12})`;stamp.style.opacity=k;cs.classList.toggle('catch',k>=1)});const end=e=>{if(!st)return;const dy=e.clientY-st.y;st=null;card.classList.remove('dragging');reset();if(dy<-110)settle(card,x,1);else if(card.style.transform){card.animate([{transform:card.style.transform},{transform:'none'}],{duration:calm()?1:320,easing:'cubic-bezier(.2,.8,.2,1)'});card.style.transform=''}};card.addEventListener('pointerup',end);card.addEventListener('pointercancel',()=>{if(st){st=null;card.classList.remove('dragging');card.style.transform='';reset()}})}
$('#packTop').onclick=()=>{const c=$('#stack .tag.top[data-id]');if(c){const x=items.find(i=>i.id===c.dataset.id);x&&settle(c,x,1)}};$('#later').onclick=()=>{const c=$('#stack .tag.top[data-id]');if(c){const x=items.find(i=>i.id===c.dataset.id);x&&settle(c,x,-1)}};
function fly(from,name){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;let r=from.getBoundingClientRect(),e=document.createElement('span');e.className='fly';e.textContent=name;e.style.left=r.left+'px';e.style.top=r.top+'px';document.body.append(e);setTimeout(()=>e.remove(),500)}function addItem(name,category){if(items.some(x=>x.name===name)){toast('清單裡已有 '+name);return}items.push({id:String(Date.now())+Math.random(),name,category,packed:false});save();render()}function open(){$('#overlay').hidden=false;$('#sheet').classList.add('open');setTimeout(()=>$('#name').focus(),130)}function close(){$('#overlay').hidden=true;$('#sheet').classList.remove('open');$('#name').value=''}document.querySelectorAll('[data-weather]').forEach(b=>b.onclick=()=>{weather=b.dataset.weather;trip.manual=weather;trip.auto=false;saveTrip();render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{let added=0;templates[b.dataset.template].forEach(([n,c])=>{let item=items.find(x=>x.name===n);if(item)item.packed=false;else{items.push({id:String(Date.now())+Math.random(),name:n,category:c,packed:false,sample:true});added++}});save();filter='all';render();toast(added?'已加入 '+added+' 件範本物品，對應項目重新列為未打包':'範本物品已重新列為未打包')});$('#suggestAdd').onclick=()=>{let [n,c]=suggest[weather];addItem(n,c);toast('已加入 '+n)};$('#add').onclick=open;$('#cancel').onclick=close;$('#overlay').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('#form').onsubmit=e=>{e.preventDefault();let name=$('#name').value.trim();if(!name)return;addItem(name,$('#category').value);close()};setInterval(()=>{render()},60000);render()})();
</script></body></html>
