<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="眠">
<title>眠 · 睡眠追蹤＋鬧鐘</title>
<meta name="description" content="深夜墨綠的睡眠追蹤與鬧鐘：逐晚睡眠階段圖、慣性滾筒設定智慧喚醒、雨聲與棕噪音即時合成的白噪音混音器。收錄於 100 Creative HTML Works（App 014・深夜墨綠滾筒）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/014-drum-alarm.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1a17'/%3E%3Cpath d='M40 14a17 17 0 1 0 10 30A14 14 0 0 1 40 14z' fill='%23f3c99a'/%3E%3Cpath d='M12 50h8v-6h8v10h8v-4h8' fill='none' stroke='%237fa596' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f1a17;--bg2:#0b1411;--panel:#14241f;--panel2:#1a2e27;
  --ink:#efe6d8;--ink2:#a9bdb2;--ink3:#7f978c;
  --moon:#f3c99a;--moon2:#d9a877;--moondk:#2a1f14;
  --awake:#f3c99a;--rem:#cf9272;--light:#7fa596;--deep:#3f7061;
  --spring:cubic-bezier(.3,1.4,.5,1);--out:cubic-bezier(.2,.9,.3,1);
  --serif:Optima,"Optima Nova",Candara,"Segoe UI","PingFang TC","Heiti TC",system-ui,sans-serif;
  --sans:system-ui,-apple-system,"PingFang TC","Heiti TC",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.5 var(--sans);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--moon);outline-offset:3px;border-radius:10px}
svg{display:block}
[hidden]{display:none!important}
.num{font-family:var(--serif);font-variant-numeric:tabular-nums}

/* stage */
.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#10201b 0%,#0f1a17 38%,#0c1512 100%);isolation:isolate}
@media (min-width:521px){
  body{background:#0a1210}
  .stage{display:flex;align-items:center;justify-content:center;gap:64px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:54px;padding:9px;background:#091310;
    box-shadow:inset 0 0 0 1.5px #21362e,inset 0 1px 0 2px rgba(243,201,154,.10),0 18px 30px -20px #000;z-index:1}
  .screen{inset:9px;border-radius:45px}
  .caption{display:block;position:relative;z-index:1;width:230px;color:var(--ink)}
  .caption b{display:block;font:400 84px/1 var(--serif);color:var(--moon);letter-spacing:.04em}
  .caption p{margin-top:18px;font-size:15px;line-height:1.75;color:var(--ink2)}
}
@media (min-width:521px) and (max-width:900px){.caption{display:none}}

.grain{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5}
.stars{position:absolute;left:0;right:0;top:0;height:260px;z-index:0;pointer-events:none}

/* status bar */
.status{position:absolute;top:0;left:0;right:0;z-index:40;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 32px;display:flex;align-items:center;justify-content:space-between;font:600 15px/1 var(--sans);letter-spacing:.02em;pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}
.topfade{position:absolute;top:0;left:0;right:0;height:calc(58px + env(safe-area-inset-top));z-index:35;pointer-events:none;background:linear-gradient(180deg,#0f1f1a 55%,rgba(15,31,26,0))}

/* pages */
.pages{position:absolute;inset:0;z-index:5}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:calc(58px + env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom));scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.page[hidden]{display:none}
.page.enter{animation:pin .45s var(--out)}
.page.enter.back{animation-name:pinb}
@keyframes pin{from{transform:translateX(22px)}}
@keyframes pinb{from{transform:translateX(-22px)}}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 2px 0}
.head h1{font:400 36px/1.1 var(--serif);letter-spacing:.02em}
.head .d{font-size:14px;color:var(--ink2);margin-top:4px}
.moonbox{display:flex;align-items:center;gap:10px;text-align:right;font-size:13px;color:var(--ink2)}
.moonbox b{display:block;color:var(--ink);font-weight:500;font-size:14px}

/* score */
.score{display:flex;align-items:center;gap:18px;margin:18px 2px 0}
.score .big{font:300 84px/.9 var(--serif);letter-spacing:.01em;color:var(--moon)}
.score .v{font:400 22px/1.2 var(--serif)}
.score .s{font-size:13px;color:var(--ink2);margin-top:3px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0 0;padding:0 2px}
.facts div{min-width:0}
.facts .n{font:400 21px/1.2 var(--serif);font-variant-numeric:tabular-nums}
.facts .l{font-size:13px;color:var(--ink3);margin-top:2px}

.panel{margin-top:16px;border-radius:24px;background:var(--panel);padding:16px 14px 12px;box-shadow:inset 0 1px 0 rgba(243,201,154,.06)}
.ptop{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px;min-height:22px}
.ptop h2{font:500 15px/1.2 var(--sans)}
.ptop span{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
#hyp{width:100%;height:auto;margin-top:8px;touch-action:pan-y;cursor:crosshair}
#hyp text{font:12px var(--sans);fill:var(--ink3)}
.ribbon{display:flex;gap:3px;height:10px;margin:12px 4px 0}
.ribbon i{height:100%;border-radius:5px;transition:flex-grow .6s var(--out)}
.legend{display:grid;grid-template-columns:repeat(4,1fr);margin:10px 4px 2px}
.legend div{font-size:13px;color:var(--ink2)}
.legend b{display:block;font:400 17px/1.3 var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.legend i{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px;vertical-align:1px}

#week{width:100%;height:auto;margin-top:6px;touch-action:pan-y}
#week text{font:12px var(--sans);fill:var(--ink3)}
#week .col{cursor:pointer}
#week .sel text{fill:var(--ink)}
.rowbtns{display:flex;justify-content:space-between;align-items:center;margin:14px 4px 0}
.txtbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px;font-size:15px;color:var(--moon);transition:color .2s}
.txtbtn:active{color:var(--moon2)}
.txtbtn.dim{color:var(--ink3)}
.txtbtn svg{width:20px;height:20px}
.avg{margin:18px 4px 0;font-size:14px;color:var(--ink2);line-height:1.7}
.avg b{font:400 17px var(--serif);color:var(--ink)}

/* alarm page */
.until{margin:6px 2px 0;font-size:14px;color:var(--ink2)}
.until b{color:var(--moon);font-weight:500}
.drumwrap{position:relative;margin:20px auto 0;width:292px;height:232px;display:flex;justify-content:center;align-items:center}
.lens{position:absolute;left:0;right:0;top:50%;height:52px;margin-top:-26px;border-radius:16px;background:var(--panel2);box-shadow:inset 0 1px 0 rgba(243,201,154,.08)}
.drumcol{position:relative;width:110px;height:100%;perspective:700px;touch-action:none;cursor:grab;outline:none}
.drumcol:focus-visible{outline:2px solid var(--moon);outline-offset:-2px;border-radius:18px}
.drumcol .it{position:absolute;left:0;right:0;top:50%;height:52px;margin-top:-26px;display:flex;align-items:center;justify-content:center;font:300 42px/1 var(--serif);font-variant-numeric:tabular-nums;backface-visibility:hidden;will-change:transform}
.colon{position:relative;font:300 40px/1 var(--serif);color:var(--moon);width:24px;text-align:center;margin-top:-4px}
.drumcol{-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.cycles{text-align:center;font-size:14px;color:var(--ink2);margin-top:10px;min-height:22px}
.cycles b{color:var(--ink);font-weight:500}
.label{font-size:13px;color:var(--ink3);margin:22px 4px 8px}
.seg{position:relative;display:grid;grid-template-columns:repeat(4,1fr);height:46px;border-radius:14px;background:var(--panel);padding:3px}
.seg .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/4);border-radius:11px;background:var(--moon);transition:transform .45s var(--spring)}
.seg button{position:relative;z-index:1;font-size:14px;color:var(--ink2);transition:color .25s;border-radius:11px}
.seg button[aria-pressed=true]{color:var(--moondk);font-weight:600}
.wintxt{font-size:13px;color:var(--ink3);margin:8px 4px 0;min-height:20px}
.tones{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tone{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:72px;padding:12px;border-radius:16px;background:var(--panel);text-align:left;transition:background-color .2s}
.tone svg{width:44px;height:16px}
.tone span{font-size:14px}
.tone[aria-pressed=true]{background:var(--panel2);box-shadow:inset 0 0 0 1.5px var(--moon2)}
.tone:active{background:#20372f}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;margin-top:20px;border-radius:18px;background:var(--moon);color:var(--moondk);font-size:17px;font-weight:600;transition:background-color .2s,transform .2s var(--out)}
.cta:active{background:var(--moon2);transform:scale(.97)}
.cta svg{width:22px;height:22px}
.listhead{display:flex;justify-content:space-between;align-items:center;margin:26px 4px 4px}
.listhead h2{font:500 15px var(--sans)}
.alist{border-radius:22px;overflow:hidden;background:var(--panel)}
.arow{position:relative;overflow:hidden}
.arow+.arow{box-shadow:inset 0 1px 0 rgba(239,230,216,.07)}
.arow .del{position:absolute;right:0;top:0;bottom:0;width:92px;background:#8c3b2c;color:#fbe9dc;font-size:15px;font-weight:600}
.arow .front{position:relative;display:flex;align-items:center;gap:10px;padding:12px 14px 12px 18px;background:var(--panel);touch-action:pan-y;transition:transform .35s var(--out)}
.arow.drag .front{transition:none}
.arow .main{flex:1;min-width:0;text-align:left;min-height:52px}
.arow .t{font:300 36px/1.05 var(--serif);font-variant-numeric:tabular-nums;transition:color .3s}
.arow .m{font-size:13px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .m em{font-style:normal;color:var(--ink3)}
.arow .m em.on{color:var(--moon)}
.arow.off .t{color:var(--ink3)}
.sw{position:relative;width:56px;height:34px;flex:none;border-radius:17px;background:#243a32;transition:background-color .3s}
.sw::before{content:"";position:absolute;inset:-6px}
.sw svg{position:absolute;top:3px;left:3px;width:28px;height:28px;transition:transform .45s var(--spring)}
.sw .shade{transition:transform .45s var(--out)}
.sw[aria-checked=true]{background:#5b4a35}
.sw[aria-checked=true] svg{transform:translateX(22px)}
.sw[aria-checked=true] .shade{transform:translateX(30px)}
.empty{padding:22px;text-align:center;color:var(--ink3);font-size:14px}

/* noise page */
#scene{display:block;width:100%;height:190px;border-radius:24px;margin-top:16px;background:#0c1613}
.player{display:flex;align-items:center;gap:18px;margin-top:18px;padding:0 4px}
.play{position:relative;width:84px;height:84px;flex:none;border-radius:50%;display:grid;place-items:center}
.play svg.ring{position:absolute;inset:0;width:84px;height:84px;transform:rotate(-90deg)}
.play .core{width:64px;height:64px;border-radius:50%;background:var(--moon);display:grid;place-items:center;transition:transform .2s var(--out),background-color .2s}
.play:active .core{transform:scale(.93);background:var(--moon2)}
.play .core svg{width:26px;height:26px}
.ptext b{display:block;font:400 22px/1.2 var(--serif)}
.ptext span{font-size:13px;color:var(--ink2)}
.timers{display:flex;gap:4px;margin-top:8px}
.timers button{min-width:44px;height:44px;padding:0 8px;border-radius:10px;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums;transition:background-color .2s,color .2s}
.timers button[aria-pressed=true]{background:var(--panel2);color:var(--moon)}
.mixer{display:grid;grid-template-columns:repeat(5,1fr);margin-top:14px;border-radius:24px;background:var(--panel);padding:16px 4px 12px}
.ch{display:flex;flex-direction:column;align-items:center;gap:6px}
.ch svg.ic{width:26px;height:26px;color:var(--ink2)}
.ch .nm{font-size:13px;color:var(--ink2)}
.ch .pc{font:400 15px/1 var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.fader{position:relative;width:48px;height:156px;touch-action:none;cursor:ns-resize;outline:none}
.fader:focus-visible{outline:2px solid var(--moon);outline-offset:2px;border-radius:12px}
.fader .groove{position:absolute;left:50%;top:8px;bottom:8px;width:6px;margin-left:-3px;border-radius:3px;background:#223830;overflow:hidden}
.fader .fill{position:absolute;left:0;right:0;bottom:0;border-radius:3px;background:linear-gradient(0deg,var(--light),var(--moon))}
.fader .cap{position:absolute;left:50%;width:30px;height:12px;margin-left:-15px;border-radius:6px;background:var(--ink);box-shadow:0 2px 3px -1px rgba(0,0,0,.6)}
.fader .fill,.fader .cap{transition:height .5s var(--out),bottom .5s var(--out)}
.fader.drag .fill,.fader.drag .cap{transition:none}
.presets{margin-top:10px;border-radius:22px;background:var(--panel);overflow:hidden}
.prow{display:flex;align-items:center}
.prow+.prow{box-shadow:inset 0 1px 0 rgba(239,230,216,.07)}
.pre{flex:1;display:flex;align-items:center;gap:12px;min-width:0;min-height:60px;padding:8px 8px 8px 18px;text-align:left}
.pre:active{background:#1c3129}
.pre .nm{flex:1;font-size:15px}
.pre .nm small{display:block;font-size:13px;color:var(--ink3)}
.pre svg.mix{width:46px;height:24px;flex:none}
.pre .x{width:44px;height:44px;display:grid;place-items:center;color:var(--ink3);flex:none}
.pre .x svg{width:18px;height:18px}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;height:calc(78px + env(safe-area-inset-bottom));padding:6px 22px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(3,1fr);background:linear-gradient(180deg,rgba(12,21,18,0),#0b1411 26%)}
.tabbar .plate{position:absolute;top:8px;left:22px;height:54px;width:calc((100% - 44px)/3);border-radius:18px;background:var(--panel);transition:transform .5s var(--spring)}
.tab{position:relative;z-index:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--ink3);transition:color .25s}
.tab svg{width:26px;height:26px;transition:transform .3s var(--spring)}
.tab .fillp{opacity:0;transition:opacity .25s}
.tab[aria-selected=true]{color:var(--moon)}
.tab[aria-selected=true] .fillp{opacity:1}
.tab:active svg{transform:scale(.86)}
.homeind{position:absolute;left:50%;bottom:calc(6px + env(safe-area-inset-bottom)*.3);width:132px;height:5px;margin-left:-66px;border-radius:3px;background:rgba(239,230,216,.75);z-index:45;pointer-events:none}

/* sheet */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(4,9,7,.6);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:88%;overflow-y:auto;border-radius:30px 30px 0 0;background:#15271f;padding:10px 20px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .5s var(--spring);touch-action:none;box-shadow:inset 0 1px 0 rgba(243,201,154,.12)}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(239,230,216,.28);margin:0 auto 14px}
.sheet h3{font:400 24px/1.2 var(--serif);text-align:center}
.sheet .hint{font-size:13px;color:var(--ink2);text-align:center;margin-top:4px}
.dates{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:16px}
.dates button{height:56px;border-radius:12px;font-size:13px;color:var(--ink2);line-height:1.3;transition:background-color .2s,color .2s}
.dates button b{display:block;font:400 17px var(--serif);color:var(--ink)}
.dates button[aria-pressed=true]{background:var(--moon);color:var(--moondk)}
.dates button[aria-pressed=true] b{color:var(--moondk)}
.minidrums{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.minidrums .cap2{text-align:center;font-size:13px;color:var(--ink2);margin-bottom:2px}
.minidrums .drumwrap{width:100%;height:170px;margin:0}
.minidrums .lens{height:42px;margin-top:-21px;background:#1f372e}
.minidrums .drumcol{width:58px}
.minidrums .drumcol .it{font-size:28px;height:42px;margin-top:-21px}
.minidrums .colon{font-size:26px;width:12px}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.feel button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:14px;font-size:13px;color:var(--ink2);transition:background-color .2s}
.feel button svg{width:30px;height:30px}
.feel button[aria-pressed=true]{background:#1f372e;color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.days button{height:46px;border-radius:12px;font-size:15px;color:var(--ink3);transition:background-color .2s,color .2s}
.days button[aria-pressed=true]{background:#2c4238;color:var(--moon)}
.labels{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.labels button{height:44px;padding:0 14px;border-radius:12px;font-size:14px;color:var(--ink2);background:#1b3029}
.labels button[aria-pressed=true]{color:var(--moondk);background:var(--moon)}
.sheetact{display:flex;gap:10px;margin-top:18px}
.sheetact .cta{margin-top:0;flex:1}
.danger{height:56px;padding:0 18px;border-radius:18px;color:#f0a58f;font-weight:600;background:#2a2019}
.danger:active{background:#3a261d}

.toast{position:absolute;left:16px;right:16px;top:calc(54px + env(safe-area-inset-top));z-index:60;display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 8px 6px 18px;border-radius:16px;background:#e9dccb;color:#1a211d;font-size:14px;font-weight:500;transform:translateY(-160%);visibility:hidden;transition:transform .45s var(--spring),visibility 0s .45s}
.toast.on{transform:none;visibility:visible;transition:transform .45s var(--spring)}
.toast span{flex:1}
.toast button{min-height:40px;padding:0 12px;border-radius:10px;color:#6a3d1c;font-weight:700}

/* wake overlay */
.wake{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;padding:calc(120px + env(safe-area-inset-top)) 28px calc(60px + env(safe-area-inset-bottom));background:#0d1714;visibility:hidden;transform:translateY(100%);transition:transform .6s var(--out),visibility 0s .6s;overflow:hidden}
.wake.on{visibility:visible;transform:none;transition:transform .6s var(--out)}
.wake .dawn{position:absolute;inset:0;z-index:0;opacity:0;transition:opacity 9s linear}
.wake.on .dawn{opacity:1}
.wake>*:not(.dawn){position:relative;z-index:1}
.wake .wt{font:300 96px/1 var(--serif);letter-spacing:.02em;color:#fff4e6;font-variant-numeric:tabular-nums}
.wake .wl{margin-top:10px;font-size:17px;color:#f6dfc6}
.wake .wn{margin-top:4px;font-size:14px;color:rgba(255,236,214,.78)}
.wake .spacer{flex:1}
.slide{position:relative;width:100%;height:64px;border-radius:22px;background:rgba(20,14,10,.34);touch-action:none;user-select:none}
.slide span{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;color:#fff1de;padding-left:40px}
.slide .kn{position:absolute;left:6px;top:6px;width:52px;height:52px;border-radius:17px;background:#fff1de;display:grid;place-items:center;cursor:grab;transition:transform .4s var(--spring)}
.slide.drag .kn{transition:none}
.slide .kn svg{width:24px;height:24px}
.snooze{margin-top:14px;min-height:48px;padding:0 20px;font-size:16px;color:#fff1de;font-weight:500}

@media (prefers-reduced-motion:reduce){
  .page.enter{animation:none}
  .seg .knob,.tabbar .plate,.sheet,.toast,.sw svg,.sw .shade,.arow .front,.fader .fill,.fader .cap,.wake,.slide .kn,.ribbon i{transition-duration:.01s}
  .wake .dawn{transition-duration:.01s}
}
</style>

<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true">
    <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="bw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1916"/><stop offset="1" stop-color="#081210"/></linearGradient>
        <linearGradient id="bsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f231e"/><stop offset="1" stop-color="#1d3a31"/></linearGradient>
        <linearGradient id="moonfall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3c99a" stop-opacity=".16"/><stop offset="1" stop-color="#f3c99a" stop-opacity="0"/></linearGradient>
        <filter id="bgr"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .6 0 0 0 0 .7 0 0 0 0 .6 0 0 0 .35 0"/></filter>
      </defs>

        <circle cx="262" cy="130" r="40" fill="#1a342c"/><path id="bMoon" d="" fill="#f3c99a"/>
        <path d="M0 420c60-30 110-10 170-40s130-10 190-30v170H0z" fill="#0b1714"/>
        <rect x="176" width="8" height="520" fill="#0a1411"/><rect y="256" width="360" height="8" fill="#0a1411"/>
        <rect x="-14" y="-14" width="388" height="548" rx="10" fill="none" stroke="#132520" stroke-width="16"/>
        <path d="M-40 -30c40 150 10 330 30 590h-60V-30z" fill="#16291f"/>
        <path d="M400 -30c-40 160-10 320-30 590h70V-30z" fill="#16291f"/>
        <path d="M-10 -30c20 180 0 380 10 590" stroke="#f3c99a" stroke-opacity=".08" stroke-width="3" fill="none"/>
      </g>
      <path d="M1060 690 L700 1000 H1460 L1450 690z" fill="url(#moonfall)"/>
      <rect y="840" width="1600" height="160" fill="#07100d"/>
      <g transform="translate(160 600)"><rect x="0" y="120" width="260" height="130" rx="6" fill="#0c1714"/><rect x="0" y="112" width="260" height="14" rx="4" fill="#12211c"/><rect x="100" y="60" width="16" height="52" rx="3" fill="#12211c"/><path d="M70 60h76l-14-50h-48z" fill="#1b3029"/></g>
      <rect width="1600" height="1000" filter="url(#bgr)" opacity=".35"/>
    </svg>
  </div>
  <div class="caption"><b>眠</b><p>睡眠追蹤與智慧鬧鐘。每一段淺眠與深眠畫成一條線，鬧鐘用滾筒轉到剛好的淺眠時刻。</p></div>

  <div class="device">
    <div class="screen" id="screen">
      <svg class="grain" aria-hidden="true" width="100%" height="100%"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .7 0 0 0 0 .8 0 0 0 0 .7 0 0 0 .08 0"/></filter><rect width="100%" height="100%" filter="url(#gr)"/></svg>
      <svg class="stars" id="stars" aria-hidden="true" viewBox="0 0 390 260" preserveAspectRatio="xMidYMin slice"></svg>

      <div class="topfade" aria-hidden="true"></div>

        <span class="g">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1.5"/><rect x="5" y="5.5" width="3" height="6.5" rx="1.5"/><rect x="10" y="3" width="3" height="9" rx="1.5"/><rect x="15" y="0" width="3" height="12" rx="1.5"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0"/><path d="M4.2 7a5.6 5.6 0 0 1 7.6 0"/><circle cx="8" cy="10" r="1" fill="currentColor"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".8" y=".8" width="22" height="11.4" rx="4" stroke="currentColor" stroke-opacity=".5" stroke-width="1.4"/><rect x="2.6" y="2.6" width="14" height="7.8" rx="2.4" fill="currentColor"/><path d="M25 4.5v4" stroke="currentColor" stroke-opacity=".5" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span>

      <div class="pages">
        <!-- sleep -->
        <section class="page" id="p-sleep" aria-label="睡眠">
          <div class="head">

            <div class="moonbox"><div><b id="mName">盈凸月</b><span id="mPct">亮 78%</span></div><svg id="mIcon" width="40" height="40" viewBox="0 0 40 40"></svg></div>
          </div>
          <div class="score">
            <div class="big num" id="sc">82</div>
            <div><div class="v" id="scWord">睡得很好</div><div class="s">睡眠分數</div></div>

            <div><div class="n" id="fBed">23:48</div><div class="l">入睡</div></div>

            <div class="ribbon" id="ribbon"></div>
            <div class="legend" id="legend"></div>
          </div>
          <div class="panel">
            <div class="ptop"><h2>這一週</h2><span>虛線是午夜，點一晚查看</span></div>
            <svg id="week" viewBox="0 0 354 160" role="group" aria-label="七晚睡眠時段"></svg>
          </div>
          <div class="rowbtns">
            <button class="txtbtn" id="logBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/><path d="M18.5 3.2a2.2 2.2 0 1 0 2.3 3.1 1.8 1.8 0 0 1-2.3-3.1z" fill="currentColor" stroke="none"/></svg>補記一晚</button>
            <button class="txtbtn dim" id="delNight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>刪除這晚</button>
          </div>

        </section>

        <!-- alarm -->
        <section class="page" id="p-alarm" aria-label="鬧鐘" hidden>

          </div>

          <p class="wintxt" id="winTxt"></p>
          <div class="label">鈴聲（點一下試聽）</div>
          <div class="tones" id="tones"></div>
          <button class="cta" id="addAlarm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="6" rx="7" ry="2.4"/><path d="M5 6v11c0 1.3 3.1 2.4 7 2.4s7-1.1 7-2.4V6"/><path d="M5 11.5c0 1.3 3.1 2.4 7 2.4s7-1.1 7-2.4"/></svg>加入鬧鐘</button>
          <div class="listhead"><h2>我的鬧鐘</h2><button class="txtbtn" id="preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 18h18M6 18a6 6 0 0 1 12 0"/><path d="M12 4v3M4.5 9.5l2 1.5M19.5 9.5l-2 1.5"/></svg>預演喚醒</button></div>
          <div class="alist" id="alist"></div>
        </section>

        <!-- noise -->
        <section class="page" id="p-noise" aria-label="白噪音" hidden>
          <div class="head"><div><h1>白噪音</h1><div class="d">五軌即時合成，推桿調出你的夜</div></div></div>
          <canvas id="scene" aria-label="混音窗景"></canvas>
          <div class="player">
            <button class="play" id="play" aria-label="播放">
              <svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="39" fill="none" stroke="#223830" stroke-width="3"/><circle id="ring" cx="42" cy="42" r="39" fill="none" stroke="#f3c99a" stroke-width="3" stroke-linecap="round" stroke-dasharray="245.04" stroke-dashoffset="0"/></svg>
              <span class="core"><svg id="playIc" viewBox="0 0 24 24" fill="#2a1f14"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5z"/></svg></span>
            </button>

              <div class="timers" id="timers"><button data-t="15">15</button><button data-t="30">30</button><button data-t="60">60</button><button data-t="0">不限</button></div>
            </div>
          </div>
          <div class="mixer" id="mixer"></div>
          <div class="listhead"><h2>混音</h2><button class="txtbtn" id="savePre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>儲存目前</button></div>
          <div class="presets" id="presets"></div>
        </section>
      </div>

      <nav class="tabbar" role="tablist" aria-label="主要分頁">
        <span class="plate" id="plate"></span>
        <button class="tab" role="tab" data-p="sleep" aria-selected="true"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4v5h5v-3h4v7h7"/><path class="fillp" d="M18.6 3.4a3.6 3.6 0 1 0 4 5.1 3 3 0 0 1-4-5.1z" fill="currentColor" stroke="none"/><path d="M18.6 3.4a3.6 3.6 0 1 0 4 5.1 3 3 0 0 1-4-5.1z"/></svg>睡眠</button>
        <button class="tab" role="tab" data-p="alarm" aria-selected="false"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="11" cy="7" rx="7" ry="2.6"/><path d="M4 7v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V7"/><path d="M4 13c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6"/><path class="fillp" d="M21.2 2.6a2.6 2.6 0 1 0 2.9 3.7 2.2 2.2 0 0 1-2.9-3.7z" fill="currentColor" stroke="none"/><path d="M21.2 2.6a2.6 2.6 0 1 0 2.9 3.7 2.2 2.2 0 0 1-2.9-3.7z"/></svg>鬧鐘</button>
        <button class="tab" role="tab" data-p="noise" aria-selected="false"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11c2.5-2 4.5 2 7 0s4.5 2 7 0"/><path d="M3 16c2.5-2 4.5 2 7 0s4.5 2 7 0 4.5 2 6 .5"/><path d="M3 21c2.5-2 4.5 2 7 0s4.5 2 7 0"/><path class="fillp" d="M21.2 2.6a2.6 2.6 0 1 0 2.9 3.7 2.2 2.2 0 0 1-2.9-3.7z" fill="currentColor" stroke="none"/><path d="M21.2 2.6a2.6 2.6 0 1 0 2.9 3.7 2.2 2.2 0 0 1-2.9-3.7z"/></svg>白噪音</button>
      </nav>
      <div class="homeind" aria-hidden="true"></div>

      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="面板"><div class="grab"></div><div id="sheetBody"></div></div>
      <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTx"></span><button id="toastUndo" hidden>復原</button></div>

      <div class="wake" id="wake" role="dialog" aria-label="喚醒預演">
        <svg class="dawn" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23413a"/><stop offset=".45" stop-color="#8f6a52"/><stop offset=".75" stop-color="#e3a67a"/><stop offset="1" stop-color="#f6d2a4"/></linearGradient>
          <filter id="dgr"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .4 0 0 0 0 .3 0 0 0 .18 0"/></filter></defs>
          <rect width="390" height="844" fill="url(#dg)"/>
          <path d="M0 700c60-26 120-30 190-8s140 10 200-6v158H0z" fill="#3f3a2c" opacity=".55"/>
          <path d="M0 760c80-20 150-10 230 4s110 0 160-10v90H0z" fill="#2c2b21" opacity=".7"/>
          <rect width="390" height="844" filter="url(#dgr)"/>
        </svg>
        <div class="wt num" id="wTime">06:45</div>
        <div class="wl" id="wLabel">上班日</div>
        <div class="wn" id="wNote">淺眠中，剛剛好醒來</div>
        <div class="spacer"></div>
        <div class="slide" id="slide"><span>滑動關閉鬧鐘</span><div class="kn" id="knob"><svg viewBox="0 0 24 24" fill="none" stroke="#5a3a20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div></div>
        <button class="snooze" id="snooze">貪睡 9 分鐘</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var KEY='app014:';
function load(k,d){try{var v=localStorage.getItem(KEY+k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}
function haptic(p){try{navigator.vibrate&&navigator.vibrate(p||8)}catch(e){}}
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var pad=function(n){return(n<10?'0':'')+n};
var mod=function(a,n){return((a%n)+n)%n};
var WD='日一二三四五六';
var STAGE=[{n:'清醒',c:'#f3c99a',y:22},{n:'REM',c:'#cf9272',y:58},{n:'淺眠',c:'#7fa596',y:94},{n:'深眠',c:'#3f7061',y:130}];
function hm(min){min=mod(Math.round(min),1440);return pad(Math.floor(min/60))+':'+pad(min%60)}
function dur(min){min=Math.round(min);return Math.floor(min/60)+':'+pad(min%60)}
function durZh(min){min=Math.round(min);var h=Math.floor(min/60),m=min%60;return(h?h+' 小時 ':'')+m+' 分'}

/* clock */
function tick(){var d=new Date();$('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())}
tick();setInterval(tick,15000);

/* stars */
(function(){var s='',seed=7;function r(){seed=(seed*16807)%2147483647;return seed/2147483647}
for(var i=0;i<46;i++){var x=r()*390,y=r()*250,o=(.15+r()*.45)*(1-y/300);s+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(r()<.12?1.3:.7)+'" fill="#f3c99a" opacity="'+o.toFixed(2)+'"/>'}
$('stars').innerHTML=s})();

/* moon phase */
function moonPath(p,cx,cy,r){
  var k=Math.cos(2*Math.PI*p),rx=Math.abs(k*r),top=cx+','+(cy-r),bot=cx+','+(cy+r);
  if(p<.5){return 'M'+top+'A'+r+' '+r+' 0 0 1 '+bot+'A'+rx.toFixed(2)+' '+r+' 0 0 '+(k>0?0:1)+' '+top+'Z'}
  return 'M'+top+'A'+r+' '+r+' 0 0 0 '+bot+'A'+rx.toFixed(2)+' '+r+' 0 0 '+(k>0?1:0)+' '+top+'Z'}
var SYN=29.530588853;
function phaseNow(){var ref=Date.UTC(2000,0,6,18,14);return mod((Date.now()-ref)/864e5/SYN,1)}
var PH=phaseNow();
(function(){
  var names=['新月','眉月','上弦月','盈凸月','滿月','虧凸月','下弦月','殘月'];
  var idx=Math.floor(mod(PH+1/16,1)*8),ill=Math.round((1-Math.cos(2*Math.PI*PH))/2*100);
  $('mName').textContent='今晚 '+names[idx];$('mPct').textContent='亮面 '+ill+'%';
  $('bMoon').setAttribute('d',moonPath(PH,262,130,40));
  $('mIcon').innerHTML='<circle cx="20" cy="20" r="15" fill="#1c302a"/><path d="'+moonPath(PH,20,20,15)+'" fill="#f3c99a"/>';
})();

/* sheet */
var sheet=$('sheet'),scrim=$('scrim'),lastFocus=null,onClose=null;
function openSheet(html,bind,close){lastFocus=document.activeElement;$('sheetBody').innerHTML=html;sheet.style.transform='';sheet.scrollTop=0;sheet.classList.add('on');scrim.classList.add('on');onClose=close||null;haptic(6);if(bind)bind($('sheetBody'));var f=sheet.querySelector('button');if(f)f.focus({preventScroll:true})}
function closeSheet(){if(!sheet.classList.contains('on'))return;sheet.classList.remove('on','drag');sheet.style.transform='';scrim.classList.remove('on');var c=onClose;onClose=null;if(c)c();if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true})}
scrim.addEventListener('click',closeSheet);
(function(){var sy=0,dy=0,t0=0,on=false;
sheet.addEventListener('pointerdown',function(e){if(e.target.closest('button,.drumcol,input'))return;on=true;sy=e.clientY;dy=0;t0=e.timeStamp;sheet.classList.add('drag');try{sheet.setPointerCapture(e.pointerId)}catch(_){}});
sheet.addEventListener('pointermove',function(e){if(!on)return;dy=e.clientY-sy;var y=dy>0?dy:dy/6;sheet.style.transform='translateY('+y.toFixed(1)+'px)';scrim.style.opacity=Math.max(0,1-dy/sheet.offsetHeight).toFixed(2)});
function end(e){if(!on)return;on=false;sheet.classList.remove('drag');scrim.style.opacity='';var v=dy/Math.max(1,e.timeStamp-t0);if(dy>sheet.offsetHeight*.35||(v>.6&&dy>30))closeSheet();else sheet.style.transform=''}
sheet.addEventListener('pointerup',end);sheet.addEventListener('pointercancel',end)})();

/* toast with undo */
var toastT=null,undoFn=null;
function toast(msg,undo){$('toastTx').textContent=msg;undoFn=undo||null;$('toastUndo').hidden=!undo;$('toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){$('toast').classList.remove('on');undoFn=null},undo?4200:2200)}
$('toastUndo').addEventListener('click',function(){if(undoFn){var f=undoFn;undoFn=null;f();haptic(10)}$('toast').classList.remove('on')});

/* ---------------- drum picker ---------------- */
function Drum(el,o){
  var self=this,H=o.h||52,ANG=o.ang||20,R=H/2/Math.tan(ANG/2*Math.PI/180),N=o.count,nodes=[];
  self.p=o.value||0;
  for(var k=-5;k<=5;k++){var d=document.createElement('div');d.className='it';el.appendChild(d);nodes.push(d)}
  function render(){
    var base=Math.round(self.p);
    for(var i=0;i<nodes.length;i++){var idx=base+i-5,off=idx-self.p,a=off*ANG,n=nodes[i];
      if(Math.abs(a)>=88){n.style.visibility='hidden';continue}
      n.style.visibility='';n.textContent=o.format(mod(idx,N));
      n.style.transform='translateZ('+(-R).toFixed(1)+'px) rotateX('+(-a).toFixed(2)+'deg) translateZ('+R.toFixed(1)+'px)';
      var c=Math.cos(a*Math.PI/180);n.style.opacity=(.18+.82*Math.pow(c,3)).toFixed(3);
      n.style.color=Math.abs(off)<.5?'var(--ink)':'var(--ink2)'}
    el.setAttribute('aria-valuenow',self.value());el.setAttribute('aria-valuetext',o.format(self.value()));
  }
  var last=Math.round(self.p),raf=0,v=0,drag=false,ly=0,lt=0,sy=0,moved=0;

  var r=rng(seed),segs=[],t=0;function push(s,m){m=Math.max(1,Math.round(m));if(segs.length&&segs[segs.length-1][0]===s)segs[segs.length-1][1]+=m;else segs.push([s,m]);t+=m}

  while(t<total-8){var deep=Math.max(0,[42,32,16,6,0,0][Math.min(c,5)]*(.7+r()*.6)),rem=[8,16,22,30,34,36][Math.min(c,5)]*(.75+r()*.5);

function sizeScene(){var r=cv.getBoundingClientRect();if(!r.width)return;var dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;Hh=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(Hh*dpr);cx2.setTransform(dpr,0,0,dpr,0,0);
  drops=[];for(var i=0;i<140;i++)drops.push({x:Math.random()*W,y:Math.random()*Hh,v:.5+Math.random()*.6,l:6+Math.random()*10});
  flies=[];for(i=0;i<14;i++)flies.push({x:Math.random()*W,y:Hh*.45+Math.random()*Hh*.3,p:Math.random()*6.28,s:.3+Math.random()*.6});drawScene(performance.now())}
function drawScene(t){if(!W)return;var c=cx2,g=c.createLinearGradient(0,0,0,Hh);g.addColorStop(0,'#0e1d19');g.addColorStop(1,'#16302a');c.fillStyle=g;c.fillRect(0,0,W,Hh);
  c.save();c.translate(W-56,42);c.fillStyle='#1d332c';c.beginPath();c.arc(0,0,16,0,7);c.fill();c.fillStyle='#f3c99a';c.fill(new Path2D(moonPath(PH,0,0,16)));c.restore();
  c.fillStyle='#12261f';c.beginPath();c.moveTo(0,Hh*.62);for(var x=0;x<=W;x+=10)c.lineTo(x,Hh*.62-Math.sin(x*.012+1)*16-Math.sin(x*.031)*6);c.lineTo(W,Hh);c.lineTo(0,Hh);c.fill();
  var fan=mix.fan,sway=Math.sin(t*.002)*fan*6;c.strokeStyle='#2b4a40';c.lineWidth=1.6;c.lineCap='round';
  for(x=6;x<W;x+=9){var hy=Hh*.64-Math.sin(x*.012+1)*16-Math.sin(x*.031)*6+6;c.beginPath();c.moveTo(x,hy+10);c.quadraticCurveTo(x,hy,x+sway+(x%3),hy-6-(x%5))}c.stroke();
  if(mix.brown>0){var fg=c.createLinearGradient(0,Hh*.5,0,Hh*.8);fg.addColorStop(0,'rgba(169,189,178,0)');fg.addColorStop(.5,'rgba(169,189,178,'+(mix.brown*.16).toFixed(3)+')');fg.addColorStop(1,'rgba(169,189,178,0)');c.fillStyle=fg;c.fillRect(0,Hh*.5,W,Hh*.3)}
  var wv=mix.waves,sea=Hh*.8;c.fillStyle='#0d201b';c.beginPath();c.moveTo(0,Hh);for(x=0;x<=W;x+=6)c.lineTo(x,sea+Math.sin(x*.035+t*.0016)*wv*7+Math.sin(x*.09-t*.0022)*wv*3);c.lineTo(W,Hh);c.fill();
  c.strokeStyle='rgba(243,201,154,'+(.15+wv*.4).toFixed(2)+')';c.lineWidth=1.4;c.beginPath();for(x=0;x<=W;x+=6){var yy=sea+Math.sin(x*.035+t*.0016)*wv*7+Math.sin(x*.09-t*.0022)*wv*3;x?c.lineTo(x,yy):c.moveTo(x,yy)}c.stroke();
  var nf=Math.round(mix.cricket*flies.length);for(var i=0;i<nf;i++){var f=flies[i],a=.5+.5*Math.sin(t*.003*f.s+f.p);c.fillStyle='rgba(243,201,154,'+(a*.9).toFixed(2)+')';c.beginPath();c.arc(f.x+Math.sin(t*.0005+f.p)*8,f.y+Math.cos(t*.0007+f.p)*5,1.6,0,7);c.fill()}
  var nd=Math.round(mix.rain*drops.length);c.strokeStyle='rgba(200,220,210,.32)';c.lineWidth=1;c.beginPath();for(i=0;i<nd;i++){var d=drops[i];c.moveTo(d.x,d.y);c.lineTo(d.x-d.l*.25,d.y+d.l)}c.stroke()}
function stepDrops(dt){for(var i=0;i<drops.length;i++){var d=drops[i];d.y+=d.v*dt*.5;d.x-=d.v*dt*.12;if(d.y>Hh){d.y=-12;d.x=Math.random()*(W+30)}}}
function loopScene(){if(sceneRaf)return;var lt=performance.now();(function f(now){sceneRaf=0;if(!playing||document.hidden||current!=='noise'){drawScene(now);return}var dt=Math.min(50,now-lt);lt=now;if(!reduce)stepDrops(dt);drawScene(reduce?0:now);sceneRaf=requestAnimationFrame(f)})(lt)}
document.addEventListener('visibilitychange',function(){if(!document.hidden)loopScene()});
window.addEventListener('resize',function(){if(current==='noise')sizeScene()});

/* ---------------- tabs ---------------- */
var ORDER=['sleep','alarm','noise'],current='sleep';
function switchTab(p,init){if(p===current&&!init){$('p-'+p).scrollTo({top:0,behavior:reduce?'auto':'smooth'});return}
  var from=ORDER.indexOf(current),to=ORDER.indexOf(p);ORDER.forEach(function(x){$('p-'+x).hidden=x!==p});var pg=$('p-'+p);
  if(!init){pg.classList.remove('enter','back');void pg.offsetWidth;pg.classList.add('enter');if(to<from)pg.classList.add('back')}
  current=p;save('tab',p);document.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected',t.dataset.p===p)});
  $('plate').style.transform='translateX('+(to*100)+'%)';if(!init)haptic(5);
  if(p==='noise'){sizeScene();loopScene()}if(p==='alarm'){drumChanged();renderUntil()}}
document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){switchTab(t.dataset.p)})});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if($('wake').classList.contains('on'))closeWake();else closeSheet()}});
setInterval(function(){if(current==='alarm'){renderUntil();drumChanged()}},30000);

renderSleep(false);renderSeg();renderTones();renderAlarms();drumChanged();renderMixer();renderPresets();renderPlay();
switchTab(load('tab','sleep'),true);
})();
</script>
</body>
