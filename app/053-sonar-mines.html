<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>聲納 · 踩地雷</title>
<meta name="description" content="在深海聲納螢幕上掃雷：掃描波掃過時數字才亮起，點擊揭開、長按插浮標，三種水深難度與最佳紀錄。收錄於 100 Creative HTML Works（App 053・深海聲納掃描）。">

<style>
:root{
  --abyss:#03130f;
  --deep:#062219;
  --hull:#0b2d24;
  --phos:#39e6b5;
  --phos-2:#8ff3cf;
  --phos-d:#1d7a60;
  --white:#d8fff0;
  --amber:#ffc46b;
  --out:cubic-bezier(.2,.9,.25,1);
  --spring:cubic-bezier(.3,1.5,.5,1);
  --mono:"PT Mono","Menlo","PingFang TC",monospace;
  --sans:"PingFang TC","Heiti TC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.45 var(--sans);color:var(--white);background:var(--abyss);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,canvas:focus-visible{outline:2px solid var(--phos);outline-offset:3px}
svg{display:block}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.sea,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--abyss);isolation:isolate;display:flex;flex-direction:column}
@media (min-width:521px){
  body{background:#021009}
  .stage{display:flex;align-items:center;justify-content:center;gap:64px;padding:24px}
  .sea{display:block;position:fixed;inset:0;z-index:0}
  .sea svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:54px;padding:12px;
    background:linear-gradient(160deg,#20443a,#0c211b 40%,#081812 70%,#1a3a30);box-shadow:inset 0 0 0 1px rgba(143,243,207,.18),inset 0 0 0 3px #04120d,0 16px 26px -16px rgba(0,0,0,.8);z-index:1}
  .screen{inset:12px;border-radius:42px}
  .caption{display:block;position:relative;z-index:1;max-width:250px}
  .caption h1{font:400 56px/1 var(--mono);color:var(--phos);letter-spacing:.06em}
  .caption p{margin-top:14px;font-size:16px;line-height:1.65;color:#9fd8c3}
}
@media (min-width:521px) and (max-width:880px){.caption{display:none}}

.status{flex:none;position:relative;z-index:30;display:flex;align-items:center;justify-content:space-between;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 30px 0 34px;font:400 16px/1 var(--mono);color:var(--phos-2);pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}
.home{position:absolute;left:50%;bottom:calc(7px + env(safe-area-inset-bottom)*.3);width:130px;height:5px;margin-left:-65px;border-radius:3px;background:var(--phos-2);opacity:.7;z-index:80;pointer-events:none}

/* ---------- HUD ---------- */
.hud{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 20px 12px}
.read{display:flex;flex-direction:column}
.read:last-child{align-items:flex-end;text-align:right}
.read small{font-size:12px;color:#8fc9b4;letter-spacing:.08em}
.read b{font:400 36px/1.05 var(--mono);color:var(--phos);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.read b.warn{color:var(--amber)}
.sub{position:relative;width:76px;height:64px;display:grid;place-items:center}
.sub svg{width:68px;height:52px;transition:transform .6s var(--spring)}
.sub:active svg{transform:scale(.9)}
.sub[data-state=win] svg{transform:translateY(-6px)}
.sub[data-state=lose] svg{transform:rotate(14deg) translateY(4px)}
.sub .bub{opacity:0;transition:opacity .3s}
.sub[data-state=lose] .bub{opacity:1}
.sub .flg{opacity:0;transition:opacity .3s}
.sub[data-state=win] .flg{opacity:1}
.sub[data-state=hold] .per{transform:translateY(-3px)}
.sub .per{transition:transform .2s}

.depth{flex:none;display:flex;justify-content:space-between;align-items:baseline;padding:0 22px 8px;font-size:13px;color:#8fc9b4}
.depth span:last-child{font-family:var(--mono);letter-spacing:.04em}

/* ---------- scope ---------- */
.scope{position:relative;flex:1;min-height:0;margin:0 12px}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;border-radius:18px}
.scope.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,2px)}40%,60%{transform:translate(6px,-1px)}}

/* ---------- controls ---------- */
.ctl{flex:none;display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
.lever{position:relative;display:grid;grid-template-columns:1fr 1fr;height:58px;background:var(--deep);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px)}
.lever::before{content:"";position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);background:var(--phos);clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 7px,100% calc(100% - 7px),calc(100% - 7px) 100%,7px 100%,0 calc(100% - 7px),0 7px);transition:transform .38s var(--spring)}
.lever[data-mode=flag]::before{transform:translateX(100%)}
.lever button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;color:#8fc9b4;transition:color .25s}
.lever button[aria-pressed=true]{color:var(--abyss)}
.lever button svg{width:20px;height:20px}
.cbtn{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--deep);font-size:12px;color:#b8e8d6;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);transition:background-color .2s}
.cbtn:active{background:var(--hull)}
.cbtn:disabled{color:#4f7d6d}
.cbtn svg{width:24px;height:22px}
#pulseBtn{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:6px;row-gap:3px;align-content:center;justify-content:center;justify-items:center}
#pulseBtn svg{grid-column:1/3}
.pips{display:flex;gap:3px;align-items:center}
.pips i{width:5px;height:5px;background:var(--phos);transform:rotate(45deg)}
.pips i.u{background:#244a3f}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(1,8,6,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;max-height:86%;overflow-y:auto;background:#07241c;padding:10px 20px calc(26px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .5s var(--spring),visibility 0s .5s;touch-action:none;box-shadow:inset 0 1px 0 rgba(143,243,207,.16)}
.sheet.on{transform:none;visibility:visible;transition:transform .5s var(--spring)}
.sheet.drag{transition:none}
.grab{width:40px;height:5px;border-radius:3px;background:#2f6a58;margin:2px auto 16px}
.sheet h3{font:400 28px/1.15 var(--mono);color:var(--phos);letter-spacing:.04em}
.sheet .lead{font-size:14px;color:#9fd8c3;margin-top:6px}
.dives{margin-top:16px}
.dive{position:relative;display:grid;grid-template-columns:60px 1fr auto;align-items:center;gap:12px;width:100%;min-height:74px;text-align:left;padding:8px 4px}
.dive + .dive{box-shadow:0 -1px 0 #0f3a2f}
.dive svg{width:56px;height:56px}
.dive b{display:block;font-size:18px;font-weight:600}
.dive span{font-size:13px;color:#8fc9b4}
.dive em{font:400 15px/1.2 var(--mono);font-style:normal;color:var(--phos);text-align:right}
.dive em small{display:block;font-size:12px;color:#8fc9b4;font-family:var(--sans)}
.dive[aria-checked=true] b{color:var(--phos)}
.dive:active{background:rgba(57,230,181,.06)}
.opt{display:flex;align-items:center;justify-content:space-between;min-height:56px}
.opt + .opt{box-shadow:0 -1px 0 #0f3a2f}
.sw{position:relative;width:60px;height:44px}
.sw::before{content:"";position:absolute;left:4px;right:4px;top:11px;height:22px;background:#0c3a2e;clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
.sw::after{content:"";position:absolute;left:8px;top:15px;width:18px;height:14px;background:#4f7d6d;transition:transform .3s var(--spring),background-color .2s;clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px)}
.sw[aria-checked=true]::after{transform:translateX(26px);background:var(--phos)}
.secth{font-size:13px;color:#8fc9b4;margin:22px 0 4px;letter-spacing:.06em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stats div{padding:10px 0}
.stats b{display:block;font:400 26px/1.1 var(--mono);color:var(--phos)}
.stats span{font-size:12px;color:#8fc9b4}
.go{width:100%;height:56px;margin-top:20px;background:var(--phos);color:var(--abyss);font-size:17px;font-weight:700;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px);transition:background-color .2s}
.go:active{background:var(--phos-2)}
.plain{display:block;margin:6px auto 0;height:44px;padding:0 14px;color:#9fd8c3;font-size:15px}
.plain:active{color:var(--phos)}
.bigres{font:400 64px/1 var(--mono);color:var(--phos);margin-top:14px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.bigres small{font-size:18px;margin-left:6px;color:#9fd8c3}
.bigres.lost{color:var(--amber)}

.toast{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top));z-index:70;transform:translate(-50%,-140px);visibility:hidden;padding:10px 16px;background:#0c3a2e;color:var(--white);font-size:14px;white-space:nowrap;transition:transform .45s var(--spring),visibility 0s .45s;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px)}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .45s var(--spring)}

@media (prefers-reduced-motion:reduce){
  .scope.shake{animation:none}
  .sheet,.toast,.lever::before,.sub svg,.sw::after{transition-duration:.01s}
}
</style>
</head>
<body>
<div class="stage">
  <div class="sea" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="wc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d3a2e"/><stop offset=".45" stop-color="#05201a"/><stop offset="1" stop-color="#010a07"/></linearGradient>
        <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ff3cf" stop-opacity=".12"/><stop offset="1" stop-color="#8ff3cf" stop-opacity="0"/></linearGradient>
      </defs>
      <rect width="1440" height="900" fill="url(#wc)"/>
      <path d="M180 0h60L520 900H330z" fill="url(#ray)"/><path d="M430 0h36l250 900H600z" fill="url(#ray)"/><path d="M1020 0h50l60 900h-160z" fill="url(#ray)"/>
      <path d="M0 820c140-30 260-10 380-40s240-60 400-30 300 20 420-20 160-20 240 0V900H0z" fill="#020c09"/>
      <g fill="#8ff3cf" id="snow"></g>
      <g stroke="#39e6b5" fill="none" opacity=".16"><circle cx="1290" cy="770" r="70"/><circle cx="1290" cy="770" r="140"/><circle cx="1290" cy="770" r="210"/></g>
      <path d="M1250 800l18-7h54l12 7-12 7h-54z" fill="#031510"/>
    </svg>
  </div>
  <div class="device">
    <div class="screen" id="screen">
      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="g">
          <svg width="18" height="12" viewBox="0 0 18 12"><path d="M1 11h3V9H1zM5.5 11h3V6.5h-3zM10 11h3V4h-3zM14.5 11h3V1.5h-3z" fill="#8ff3cf"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11 6.2 9a2.6 2.6 0 0 1 3.6 0zM3.5 6.3a6.4 6.4 0 0 1 9 0M.8 3.5a10.2 10.2 0 0 1 14.4 0" stroke="#8ff3cf" stroke-width="1.6" fill="none"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><path d="M3 .8h17l2 2v6.4l-2 2H3l-2-2V2.8z" stroke="#8ff3cf" stroke-width="1.3" fill="none"/><rect id="batt" x="3" y="3" width="15" height="6" fill="#8ff3cf"/><path d="M24 4.3v3.4" stroke="#8ff3cf" stroke-width="1.6"/></svg>
        </span>
      </div>

      <div class="hud">
        <div class="read"><small>水雷</small><b id="mLeft">010</b></div>
        <button class="sub" id="subBtn" data-state="play" aria-label="重新下潛">
          <svg viewBox="0 0 68 52"><g class="per"><path d="M40 16V6h8" stroke="#39e6b5" stroke-width="2.4" fill="none" stroke-linecap="square"/></g><path d="M8 30c0-8 10-12 26-12s26 4 26 12-10 12-26 12S8 38 8 30z" fill="#0f3a2f" stroke="#39e6b5" stroke-width="2.2"/><path d="M28 18v-5h12v5" fill="#0f3a2f" stroke="#39e6b5" stroke-width="2.2"/><path d="M8 30H2M4 24v12" stroke="#39e6b5" stroke-width="2.2"/><circle cx="24" cy="30" r="2.6" fill="#8ff3cf"/><circle cx="34" cy="30" r="2.6" fill="#8ff3cf"/><circle cx="44" cy="30" r="2.6" fill="#8ff3cf"/><g class="bub" fill="none" stroke="#8ff3cf" stroke-width="1.6"><circle cx="56" cy="14" r="3"/><circle cx="62" cy="6" r="2"/></g><g class="flg"><path d="M47 6V-2" stroke="#ffc46b" stroke-width="2"/><path d="M47-2l8 3-8 3z" fill="#ffc46b"/></g></svg>
        </button>
        <div class="read"><small>秒</small><b id="tRead">000</b></div>
      </div>
      <div class="depth"><span id="diffName">淺灘</span><span id="depthTx">−40 m　8×8</span></div>

      <div class="scope" id="scope"><canvas id="cv" tabindex="0" aria-label="聲納棋盤，方向鍵移動、Enter 揭開、F 插浮標"></canvas></div>

      <div class="ctl">
        <div class="lever" id="lever" data-mode="probe" role="group" aria-label="點擊模式">
          <button aria-pressed="true" data-mode="probe"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3" fill="currentColor"/><path d="M4.5 4.5a8 8 0 0 0 0 11M15.5 4.5a8 8 0 0 1 0 11" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>探測</button>
          <button aria-pressed="false" data-mode="flag"><svg viewBox="0 0 20 20"><path d="M10 18V4" stroke="currentColor" stroke-width="2"/><path d="M10 3.5 16 6.5 10 9.5z" fill="currentColor"/><path d="M5 18h10" stroke="currentColor" stroke-width="2"/></svg>浮標</button>
        </div>
        <button class="cbtn" id="pulseBtn" aria-label="聲納脈衝提示"><svg viewBox="0 0 24 22"><path d="M12 11m-2.5 0a2.5 2.5 0 1 0 5 0 2.5 2.5 0 1 0-5 0M6.5 5.5a8 8 0 0 0 0 11M17.5 5.5a8 8 0 0 1 0 11M3 2.5a12.5 12.5 0 0 0 0 17M21 2.5a12.5 12.5 0 0 1 0 17" stroke="currentColor" stroke-width="1.7" fill="none"/></svg><span class="pips" id="pips"></span>脈衝</button>
        <button class="cbtn" id="diveBtn" aria-label="水深與紀錄"><svg viewBox="0 0 24 22"><path d="M3 4h18M3 4v14M7 8h14M7 8v10M11 12h10M11 12v6M3 18h18" stroke="currentColor" stroke-width="1.7" fill="none"/></svg>水深</button>
      </div>

      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="聲納"><div class="grab"></div><div id="sheetBody"></div></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="home"></div>
    </div>
  </div>
  <div class="caption">
    <h1>聲納</h1>
    <p>把踩地雷搬到深海。掃描波掃過時數字才亮，點一下揭開，長按放一顆浮標。</p>
  </div>
</div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var KEY = 'app053:';
function load(k, d){ try { var v = localStorage.getItem(KEY+k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(KEY+k, JSON.stringify(v)); } catch(e){} }
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var settings = load('settings', {sound:true, haptic:true, sweep:true});
function haptic(p){ if (!settings.haptic) return; try { navigator.vibrate && navigator.vibrate(p || 8); } catch(e){} }

// marine snow on the desktop backdrop
(function(){ var g = $('snow'), s = '', r = 53; function rn(){ r = (r*16807) % 2147483647; return r/2147483647; }
  for (var i = 0; i < 140; i++) s += '<circle cx="'+(rn()*1440).toFixed(0)+'" cy="'+(rn()*900).toFixed(0)+'" r="'+(rn()*1.8 + .4).toFixed(1)+'" opacity="'+(rn()*.35 + .05).toFixed(2)+'"/>';
  g.innerHTML = s; })();

// ---------- sound ----------
var ac = null;
function audio(){ if (!settings.sound) return null; try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e){ ac = null; } return ac; }
function ping(f, v, dur, t){ var a = audio(); if (!a) return; var n = a.currentTime + (t||0), o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(f, n); o.frequency.exponentialRampToValueAtTime(f*.96, n + dur);
  g.gain.setValueAtTime(0, n); g.gain.linearRampToValueAtTime(v, n + .008); g.gain.exponentialRampToValueAtTime(.0005, n + dur);
  var dl = a.createDelay(); dl.delayTime.value = .18; var fb = a.createGain(); fb.gain.value = .28; var lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
  o.connect(g); g.connect(a.destination); g.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(a.destination);
  o.start(n); o.stop(n + dur + .05); }
function boom(){ var a = audio(); if (!a) return; var n = a.currentTime, len = a.sampleRate*1.4, b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.2);
  var s = a.createBufferSource(); s.buffer = b; var lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, n); lp.frequency.exponentialRampToValueAtTime(80, n + 1.2);
  var g = a.createGain(); g.gain.value = .8; s.connect(lp); lp.connect(g); g.connect(a.destination); s.start(n);

  var h = '<h3>選水深</h3><p class="lead">越深，水雷越密。換水深會重開一局。</p><div class="dives" role="radiogroup">';
  Object.keys(DIFFS).forEach(function(k){ var d = DIFFS[k], r = records[k];
    h += '<button class="dive" role="radio" aria-checked="'+(G.diff === k)+'" data-dive="'+k+'">'+depthIcon(k)+'<span><b>'+d.n+'</b><span>'+d.c+'×'+d.r+'，'+d.m+' 顆水雷</span></span><em>'+fmt(r.best)+'<small>最佳</small></em></button>'; });
  var tot = Object.keys(records).reduce(function(a, k){ a.w += records[k].w; a.p += records[k].p; return a; }, {w:0, p:0});
  h += '</div><p class="secth">航行日誌</p><div class="stats"><div><b>'+tot.p+'</b><span>下潛次數</span></div><div><b>'+tot.w+'</b><span>成功上浮</span></div><div><b>'+(tot.p ? Math.round(tot.w/tot.p*100) : 0)+'%</b><span>成功率</span></div></div>';
  h += '<p class="secth">設定</p>'+
    '<div class="opt"><span>掃描波</span><button class="sw" role="switch" data-opt="sweep" aria-checked="'+settings.sweep+'" aria-label="掃描波"></button></div>'+
    '<div class="opt"><span>聲納音效</span><button class="sw" role="switch" data-opt="sound" aria-checked="'+settings.sound+'" aria-label="聲納音效"></button></div>'+
    '<div class="opt"><span>觸感回饋</span><button class="sw" role="switch" data-opt="haptic" aria-checked="'+settings.haptic+'" aria-label="觸感回饋"></button></div>'+
    '<button class="plain" data-reset="1">清除紀錄</button>';
  openSheet(h);
}
function resultSheet(win, nb){
  var d = DIFFS[G.diff], safe = G.cells.filter(function(c){ return !c.m; }).length, rev = G.cells.filter(function(c){ return !c.m && c.r; }).length;
  openSheet(win ?
    '<h3>浮上水面</h3><p class="lead">'+d.n+'的 '+d.m+' 顆水雷全部標記。'+(nb ? '新的最佳紀錄。' : '')+'</p><p class="bigres">'+fmt(G.el)+'<small>'+(nb ? '最佳' : '最佳 '+fmt(records[G.diff].best))+'</small></p><button class="go" data-again="1">再下潛一次</button><button class="plain" data-close="1">看看海床</button>'
    : '<h3>觸雷</h3><p class="lead">在'+d.n+'清出 '+rev+' / '+safe+' 格安全水域。</p><p class="bigres lost">'+Math.floor(rev/safe*100)+'<small>% 已探測</small></p><button class="go" data-again="1">再下潛一次</button><button class="plain" data-close="1">看看海床</button>');
}
$('diveBtn').addEventListener('click', function(){ audio(); diveSheet(); });
sheet.addEventListener('click', function(e){
  var t = e.target.closest('button'); if (!t) return;
  if (t.dataset.dive){ haptic(8); var k = t.dataset.dive; closeSheet(); newGame(k); ping(440, .12, .6); toast('下潛到'+DIFFS[k].n+'，−'+DIFFS[k].depth+' m'); }
  else if (t.dataset.opt){ var o = t.dataset.opt; settings[o] = !settings[o]; save('settings', settings); t.setAttribute('aria-checked', settings[o]); haptic(6); if (o === 'sound' && settings.sound) ping(900, .1, .3); }
  else if (t.dataset.again){ closeSheet(); newGame(G.diff); ping(440, .12, .6); }
  else if (t.dataset.close){ closeSheet(); }
  else if (t.dataset.reset){ if (!t.dataset.armed){ t.dataset.armed = 1; t.textContent = '再按一次清除全部紀錄'; haptic([6,30,6]); return; }
    records = {shoal:{best:0, w:0, p:0}, shelf:{best:0, w:0, p:0}, trench:{best:0, w:0, p:0}}; save('records', records); haptic(10); diveSheet(); toast('紀錄已清除'); }
});
(function(){
  var sy = 0, dy = 0, t0 = 0, dragging = false;
  sheet.addEventListener('pointerdown', function(e){ if (e.target.closest('button')) return; dragging = true; sy = e.clientY; dy = 0; t0 = e.timeStamp; sheet.classList.add('drag'); try { sheet.setPointerCapture(e.pointerId); } catch(x){} });
  sheet.addEventListener('pointermove', function(e){ if (!dragging) return; dy = e.clientY - sy; var y = dy > 0 ? dy : dy/6; sheet.style.transform = 'translateY('+y.toFixed(1)+'px)'; scrim.style.opacity = Math.max(0, 1 - dy/sheet.offsetHeight).toFixed(2); });
  function end(e){ if (!dragging) return; dragging = false; sheet.classList.remove('drag'); scrim.style.opacity = ''; var v = dy/Math.max(1, e.timeStamp - t0); if (dy > sheet.offsetHeight*.35 || v > .6) closeSheet(); else sheet.style.transform = ''; }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });

var toastT = null;
function toast(m){ var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 2200); }

function clock(){ var d = new Date(); $('clock').textContent = d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
clock(); setInterval(clock, 15000);

// boot: resume a saved dive, or seed a half-played shoal so the scope is alive
if (!G || !G.cells || G.cells.length !== G.rows*G.cols){
  newGame('shoal');
  G.cells[idx(2,2)].r = 0; plant(idx(3,3)); G.t0 = Date.now() - 37000;
  reveal(idx(3,3), true); fx.reveal = {}; fx.ripples = [];
  var mines = G.cells.map(function(c, i){ return c.m ? i : -1; }).filter(function(i){ return i >= 0; });
  if (mines[0] !== undefined){ var m0 = mines[0]; if (nbrs(m0).some(function(n){ return G.cells[n].r; })) G.cells[m0].f = 1; }
  save('game', G);
}
layout(); hud(); setSub(G.over === 1 ? 'win' : G.over === -1 ? 'lose' : 'play');
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(function(){ layout(); }).observe($('scope')); else addEventListener('resize', layout);
kick();
})();
</script>
</body>
</html>
