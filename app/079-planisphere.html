<style>
:root{

*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.45 var(--cjk);color:var(--ink);background:#21150e;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}

svg{display:block}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}

  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:50px;padding:9px;z-index:1;background:#0f0906;box-shadow:inset 0 0 0 1px #5b4526,inset 0 0 0 3px #0f0906,inset 0 0 0 4px rgba(201,162,78,.35),0 16px 26px -16px #000}
  .screen{inset:9px;border-radius:41px}
  .caption{display:block;position:relative;z-index:1;max-width:250px;color:#ecdcb4}
  .caption h1{font:400 50px/1 var(--hoef);letter-spacing:.14em}
  .caption h1 i{display:block;font-size:20px;letter-spacing:.06em;color:#c9a24e;margin-top:12px}
  .caption p{margin-top:18px;font:16px/1.8 var(--cjk);color:#b89f73}
}
@media (min-width:521px) and (max-width:880px){.caption{display:none}}

/* paper texture behind content */
.tex{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.5}

.app{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:calc(46px + env(safe-area-inset-top)) 0 calc(16px + env(safe-area-inset-bottom))}
.hd{display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 22px;height:52px}
.hd h1{font:400 26px/1 var(--hoef);letter-spacing:.2em}

.redBtn[aria-pressed=true]{color:var(--hl)}

.st{fill:var(--star)}

.lb{fill:var(--ink-2);font:7.4px var(--cjk);text-anchor:middle;dominant-baseline:central}
.lb.hi{fill:var(--hl);font-weight:600}
.sn{fill:var(--ink);font:italic 6.4px var(--hoef);dominant-baseline:central}
.grid{stroke:var(--gold-3);fill:none;stroke-width:.4}
.ecl{stroke:var(--gold-2);fill:none;stroke-width:.55;stroke-dasharray:1.4 2.6}
.mw{stroke:var(--star);stroke-linecap:round;stroke-width:.8;opacity:.2}
.dring{fill:var(--paper-3)}
.dtick{stroke:var(--gold);stroke-linecap:round}
.dtx{fill:var(--ink);font:7.4px var(--cjk);text-anchor:middle;dominant-baseline:central}
.mask{fill:var(--paper)}
.hatch{stroke:var(--gold);stroke-width:.35;opacity:.16}
.rim{stroke:var(--gold);fill:none}
.htx{fill:var(--ink);font:7px var(--hoef);text-anchor:middle;dominant-baseline:central}
.dir{fill:var(--gold);font:600 9px var(--cjk);text-anchor:middle;dominant-baseline:central}
.idx{fill:var(--hl)}

.read{text-align:center;padding:8px 20px 0;min-height:62px;margin-top:auto}

.rulers{display:flex;flex-direction:column;gap:8px;padding:8px 16px 0}
.ruler{position:relative;height:52px;border-radius:8px;background:var(--paper-2);overflow:hidden;touch-action:none;cursor:ew-resize;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.ruler svg{position:absolute;inset:0;width:100%;height:100%}
.ruler .nm{position:absolute;left:0;top:0;bottom:0;z-index:1;display:flex;align-items:center;padding:0 10px 0 12px;background:var(--paper-2);box-shadow:6px 0 8px -2px var(--paper-2);font:13px/1 var(--cjk);color:var(--ink-2);pointer-events:none}
.ruler .nd{position:absolute;left:50%;top:0;bottom:0;width:14px;margin-left:-7px;pointer-events:none}
.rt{stroke:var(--gold);stroke-linecap:round}

.bot{margin-top:auto;display:flex;justify-content:center;gap:14px;padding:10px 16px 0}

.bb svg{width:24px;height:24px}
.bb:active{transform:scale(.96);background:var(--paper-2)}
.bb.live{color:var(--hl)}

/* sheet */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(8,4,2,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:82%;display:flex;flex-direction:column;background:var(--paper-3);color:var(--ink);border-radius:24px 24px 0 0;padding:8px 0 calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .5s var(--spring);box-shadow:inset 0 1px 0 var(--gold-3)}
.sheet.on{transform:none;visibility:visible}
.sheet:focus{outline:none}
.sheet.drag{transition:none}
.sheet .grab{flex:none;width:44px;height:24px;margin:0 auto;display:grid;place-items:center;touch-action:none;cursor:grab}
.sheet .grab i{width:40px;height:4px;border-radius:2px;background:var(--gold-3)}
.sheet .sb{overflow-y:auto;overscroll-behavior:contain;padding:4px 22px 6px;scrollbar-width:none}
.sheet .sb::-webkit-scrollbar{display:none}
.ihead{display:flex;gap:16px;align-items:center}
.ihead svg{width:96px;height:96px;flex:none}
.ihead h3{font:400 28px/1.15 var(--cjk);letter-spacing:.06em}
.ihead p{font:italic 16px/1.3 var(--hoef);color:var(--ink-2);margin-top:4px}
.facts{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.facts div span{display:block;font-size:13px;color:var(--ink-2)}
.facts div b{display:block;margin-top:3px;font:400 18px/1.25 var(--hoef)}
.note{margin-top:16px;font-size:15px;line-height:1.75;color:var(--ink)}
.acts{display:flex;gap:10px;margin-top:18px}
.acts button{flex:1;height:50px;border-radius:25px;font:16px/1 var(--cjk);transition:transform .12s,background-color .2s}
.acts button:active{transform:scale(.97)}
.acts .pri{background:var(--gold);color:var(--paper-2)}
.acts .sec{color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold-3)}
.acts .sec[aria-pressed=true]{color:var(--hl);box-shadow:inset 0 0 0 1px var(--hl)}
.cat h3{font:400 24px/1.2 var(--cjk);letter-spacing:.06em}
.cat .sub{font-size:13px;color:var(--ink-2);margin-top:4px}
.crow{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:8px 0;text-align:left;border-radius:10px}
.crow + .crow{box-shadow:inset 0 1px 0 rgba(201,162,78,.12)}
.crow svg{width:46px;height:46px;flex:none}
.crow svg.seen{width:14px;height:14px;display:inline-block}
.crow .m{flex:1;min-width:0}
.crow .m b{display:block;font:400 17px/1.3 var(--cjk)}
.crow .m span{font-size:13px;color:var(--ink-2)}
.crow .alt{font:400 17px/1 var(--hoef);color:var(--ink);text-align:right;min-width:62px}
.crow .alt small{display:block;font:12px/1.3 var(--cjk);color:var(--ink-2);margin-top:3px}
.crow.below{opacity:.55}
.crow:active{background:rgba(201,162,78,.08)}
.seen{display:inline-block;margin-left:6px;vertical-align:1px}
.sec2{margin:16px 0 4px;font-size:13px;color:var(--ink-2)}

.toast{position:absolute;left:50%;top:calc(54px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-150px);transition:transform .45s var(--spring);background:var(--paper-3);color:var(--ink);padding:12px 18px;border-radius:12px;font:14px/1.3 var(--cjk);white-space:nowrap;box-shadow:inset 0 0 0 1px var(--gold-3)}
.toast.on{transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  .sheet,.toast{transition-duration:.01s}
}
</style>
