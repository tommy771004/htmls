<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b9bcb2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="碼錶">
<title>碼錶 · 單車碼錶</title>
<meta name="description" content="反射式 MIP 液晶風格的單車碼錶：速度、踏頻、心率區間、圈數與風櫃嘴爬坡剖面，左右滑切換資料頁，數字即時跳動。收錄於 100 Creative HTML Works（App 073・反射式 LCD 高對比）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/073-mip-cycling.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b9bcb2'/%3E%3Cpath d='M6 50 22 36l10 6 12-18 14 26z' fill='%23111'/%3E%3Cpath d='M32 42l12-18 6 9z' fill='%23d62518'/%3E%3Crect x='6' y='10' width='22' height='5' fill='%23111'/%3E%3C/svg%3E">
<style>
:root{
  --lcd:#b9bcb2;
  --lcd-hi:#c9ccc2;
  --ink:#111210;
  --red:#d62518;
  --dim:#4a4c46;
  --lit:#e6ead9;
  --din:"DIN Alternate","DIN Condensed","Bahnschrift","PingFang TC",sans-serif;
  --dinc:"DIN Condensed","DIN Alternate","PingFang TC",sans-serif;
  --sans:"PingFang TC","Heiti TC",system-ui,sans-serif;
  --dith:repeating-conic-gradient(var(--ink) 0 25%,transparent 0 50%) 0 0/2px 2px;
  --dith-l:radial-gradient(circle,var(--ink) .6px,transparent .8px) 0 0/3px 3px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:600 15px/1.35 var(--sans);color:var(--ink);background:var(--lcd);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--red);outline-offset:-3px}
svg{display:block}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.road,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--lcd);isolation:isolate;display:flex;flex-direction:column;transition:background-color .35s}
.screen::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(118deg,rgba(255,255,255,.22),rgba(255,255,255,0) 38%,rgba(0,0,0,.05) 70%,rgba(255,255,255,.08)),
  linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px) 0 0/3px 3px,linear-gradient(90deg,rgba(0,0,0,.035) 1px,transparent 1px) 0 0/3px 3px}
.screen.lit{background:var(--lit)}
.screen.lit::before{background:linear-gradient(180deg,rgba(255,250,225,.5),rgba(255,250,225,0) 60%),linear-gradient(rgba(0,0,0,.03) 1px,transparent 1px) 0 0/3px 3px,linear-gradient(90deg,rgba(0,0,0,.03) 1px,transparent 1px) 0 0/3px 3px}
@media (min-width:521px){
  body{background:#2a2b29}
  .stage{display:flex;align-items:center;justify-content:center;gap:60px;padding:24px}
  .road{display:block;position:fixed;inset:0;z-index:0}
  .road svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:50px;padding:12px;background:#1a1b19;
    box-shadow:inset 0 0 0 1.5px #3b3d39,inset 0 2px 0 #4a4c47,0 10px 16px -8px rgba(0,0,0,.6);z-index:2}
  .screen{inset:12px;border-radius:38px}
  .caption{display:block;position:relative;z-index:2;max-width:240px;color:#e8e9e3}
  .caption h1{font:700 60px/1 var(--din);letter-spacing:.02em}
  .caption h1 span{color:var(--red)}
  .caption p{margin-top:14px;font:500 16px/1.65 var(--sans);color:#c3c5bd}
}
@media (min-width:521px) and (max-width:860px){.caption{display:none}}

.status{position:relative;z-index:2;flex:none;display:flex;align-items:center;justify-content:space-between;height:calc(46px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 30px 0 34px;font:700 17px/1 var(--din);pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}
.home{position:absolute;left:50%;bottom:calc(6px + env(safe-area-inset-bottom)*.3);width:130px;height:5px;margin-left:-65px;border-radius:3px;background:#e6e7e1;z-index:80;pointer-events:none}

/* ---------- device header ---------- */
.dhead{position:relative;z-index:2;flex:none;display:flex;align-items:center;justify-content:space-between;height:42px;padding:0 16px;border-bottom:3px solid var(--ink)}
.dhead h1{font:700 17px/1 var(--sans);display:flex;align-items:center;gap:8px}
.dhead h1 i{display:inline-block;width:10px;height:10px;background:var(--ink)}
.dhead h1 i.rec{background:var(--red);animation:blink 1s steps(1) infinite}
.dhead h1 i.pause{width:10px;background:none;border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
@keyframes blink{50%{background:transparent}}
.sensors{display:flex;gap:10px;align-items:center}
.sensors svg{width:20px;height:20px}
.segs{position:relative;z-index:3;flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:0 16px;margin-bottom:-12px}
.segs button{height:44px;padding-top:6px;display:flex;align-items:flex-start}
.segs button::before{content:"";display:block;width:100%;height:6px;background:var(--dith)}
.segs button[aria-selected=true]::before{background:var(--ink)}

/* ---------- pages ---------- */
.viewport{position:relative;z-index:2;flex:1;min-height:0;overflow:hidden;touch-action:pan-y}
.pages{display:flex;width:400%;height:100%;transition:transform .42s cubic-bezier(.2,.9,.3,1.05);will-change:transform}
.pages.drag{transition:none}
.page{width:25%;height:100%;overflow-y:auto;overflow-x:hidden;padding:0 16px 16px;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}

.lab{font:700 13px/1.2 var(--sans);display:flex;justify-content:space-between;align-items:baseline}
.lab em{font:700 14px/1 var(--dinc);font-style:normal;letter-spacing:.04em}
.num{font:700 44px/1 var(--din);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.num small{font-size:.42em;margin-left:3px}

/* roller digits */
.roll{display:inline-flex;overflow:hidden;height:1em;line-height:1;vertical-align:top}
.roll .d{display:inline-block;height:1em;overflow:hidden}
.roll .d b{display:flex;flex-direction:column;font:inherit;transition:transform .28s cubic-bezier(.3,1.4,.5,1)}
.roll .d b span{height:1em;line-height:1}
.roll .p{display:inline-block}

.speed{padding:10px 0 12px;border-bottom:3px solid var(--ink);display:grid;grid-template-columns:1fr auto;align-items:end}
.speed .num{font-size:128px;letter-spacing:-.01em;margin-top:2px}
.trend{width:56px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:12px}
.trend svg{width:30px;height:30px}
.trend span{font:700 13px/1 var(--dinc)}
.grid2{display:grid;grid-template-columns:1fr 1fr}
.cellf{padding:10px 0 12px;min-height:92px}
.grid2 .cellf:nth-child(odd){padding-right:12px;border-right:3px solid var(--ink)}
.grid2 .cellf:nth-child(even){padding-left:12px}
.grid2 .cellf:nth-child(n+3){border-top:3px solid var(--ink)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);border-top:3px solid var(--ink)}
.row3 .cellf{min-height:78px}
.row3 .cellf{padding-right:10px}
.row3 .cellf + .cellf{padding-left:10px;border-left:3px solid var(--ink)}
.route{border-top:3px solid var(--ink);padding-top:10px}
.route svg{width:100%;height:84px;margin-top:6px;overflow:visible}
.lapbars{margin-top:14px;border-top:3px solid var(--ink);padding-top:10px}
.lapbars svg{width:100%;height:120px;margin-top:8px}
.row3 .num{font-size:32px}
.zbox{display:inline-grid;place-items:center;min-width:32px;height:22px;padding:0 5px;background:var(--red);color:#fff;font:700 15px/1 var(--dinc);letter-spacing:.03em;vertical-align:6px;margin-left:6px}

/* hr page */
.hrtop{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 0 12px;border-bottom:3px solid var(--ink)}
.hrtop .num{font-size:96px}
.hrtop .zname{text-align:right}
.hrtop .zname b{display:inline-block;background:var(--ink);color:var(--lcd);font:700 30px/1 var(--din);padding:6px 10px 4px}
.screen.lit .hrtop .zname b{color:var(--lit)}
.hrtop .zname span{display:block;margin-top:8px;font-size:14px}
.zones{padding:12px 0 6px}
.zrow{display:grid;grid-template-columns:34px 1fr 64px;align-items:center;gap:8px;height:34px}
.zrow b{font:700 17px/1 var(--dinc)}
.zrow .bar{height:18px;position:relative}
.zrow .bar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--dith);transform-origin:0 50%;transition:transform .6s cubic-bezier(.2,.9,.3,1)}
.zrow.cur .bar i{background:var(--red)}
.zrow span{font:700 17px/1 var(--din);text-align:right;font-variant-numeric:tabular-nums}
.chart{border-top:3px solid var(--ink);padding-top:8px}
.chart svg{width:100%;height:150px}

/* laps */
.laptop{display:grid;grid-template-columns:1fr 1fr;border-bottom:3px solid var(--ink);padding:10px 0 12px}
.laptop .num{font-size:52px}
.laptop > div:first-child{padding-right:12px}
.laptop > div + div{padding-left:12px;border-left:3px solid var(--ink)}
table{width:100%;border-collapse:collapse;margin-top:6px;font:700 17px/1 var(--din);font-variant-numeric:tabular-nums}
th{font:700 12px/1 var(--sans);text-align:right;padding:10px 0 8px}
th:first-child,td:first-child{text-align:left}
td{text-align:right;height:40px;border-top:2px solid var(--ink)}
tr.live td{background:var(--ink);color:var(--lcd)}
.screen.lit tr.live td{color:var(--lit)}
tr.live td:first-child{padding-left:6px}
tr.live td:last-child{padding-right:6px}
tr.best td:nth-child(4){color:var(--red)}

/* climb */
.cltop{display:grid;grid-template-columns:1.1fr 1fr;border-bottom:3px solid var(--ink);padding:10px 0 12px}
.cltop > div:first-child{padding-right:12px}
.cltop > div + div{padding-left:12px;border-left:3px solid var(--ink)}
.cltop .num{font-size:74px}
.cltop .num.red{color:var(--red)}
.clname{font:700 16px/1.3 var(--sans);padding:10px 0 2px;display:flex;justify-content:space-between;align-items:baseline}
.clname span{font:700 15px/1 var(--dinc)}
.profile{position:relative;height:200px;margin:4px 0 0}
.profile svg{width:100%;height:100%;overflow:visible}
.legend{display:flex;gap:14px;font-size:12px;margin-top:10px;align-items:center}
.legend i{display:inline-block;width:18px;height:12px;vertical-align:-2px;margin-right:4px}
.clrow{display:grid;grid-template-columns:repeat(3,1fr);border-top:3px solid var(--ink);margin-top:10px}
.clrow .cellf{min-height:72px}
.clrow .cellf{padding-right:8px}
.clrow .cellf + .cellf{padding-left:10px;border-left:3px solid var(--ink)}
.clrow .num{font-size:28px}

/* ---------- soft keys ---------- */
.keys{position:relative;z-index:2;flex:none;display:grid;grid-template-columns:1fr 1fr 1fr 1.35fr;background:var(--ink);padding:0 0 calc(20px + env(safe-area-inset-bottom))}
.keys button{height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#e6e7e1;font:700 12px/1 var(--sans);transition:background-color .15s}
.keys button + button{box-shadow:inset 2px 0 0 #2c2d2a}
.keys button:active{background:#2c2d2a}
.keys button svg{width:26px;height:26px}
.keys .go{background:var(--red);color:#fff;font-size:15px}
.keys .go:active{background:#b01c12}
.keys .go svg{width:30px;height:30px}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(17,18,16,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;max-height:86%;overflow-y:auto;background:var(--lcd-hi);border-top:4px solid var(--ink);padding:10px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .45s cubic-bezier(.3,1.3,.5,1),visibility 0s .45s;touch-action:none}
.sheet.on{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.sheet.drag{transition:none}
.grab{width:48px;height:6px;background:var(--dith);margin:2px auto 14px}
.sheet h3{font:700 22px/1.2 var(--sans)}
.sheet .sec{font:700 13px/1 var(--sans);margin:20px 0 6px;display:flex;justify-content:space-between}
.mrow{display:flex;align-items:center;justify-content:space-between;min-height:54px;border-top:2px solid var(--ink)}
.mrow > span{font-size:15px}
.mrow > span small{display:block;font-size:12px;font-weight:500}
.step{display:flex;align-items:center}
.step button{width:44px;height:44px;display:grid;place-items:center}
.step button:active{background:var(--ink);color:var(--lcd)}
.step button svg{width:18px;height:18px}
.step output{min-width:62px;text-align:center;font:700 22px/1 var(--din)}
.tg{width:64px;height:44px;position:relative}
.tg::before{content:"";position:absolute;left:4px;right:4px;top:10px;height:24px;border:3px solid var(--ink)}
.tg::after{content:"";position:absolute;left:10px;top:16px;width:18px;height:12px;background:var(--dith);transition:transform .2s steps(3)}
.tg[aria-checked=true]::after{transform:translateX(26px);background:var(--ink)}
.endbtn{width:100%;height:54px;margin-top:16px;background:var(--ink);color:#e6e7e1;font:700 16px/1 var(--sans);display:flex;align-items:center;justify-content:center;gap:10px}
.endbtn:active{background:#2c2d2a}
.endbtn i{width:14px;height:14px;background:var(--red)}
.hist{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-top:2px solid var(--ink);align-items:baseline;width:100%;text-align:left}
.hist b{font-size:15px}
.hist span{font:700 20px/1 var(--din);text-align:right}
.hist small{grid-column:1/-1;font-size:12px;font-weight:500}
.hist svg{grid-column:1/-1;width:100%;height:28px;margin-top:4px}

.toast{position:absolute;left:16px;right:16px;top:calc(96px + env(safe-area-inset-top));z-index:70;background:var(--ink);color:#e6e7e1;min-height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;font:700 16px/1.2 var(--sans);transform:translateY(-200px);visibility:hidden;transition:transform .3s steps(4),visibility 0s .3s}
.toast.on{transform:none;visibility:visible;transition:transform .3s steps(4)}
.toast i{flex:none;width:12px;height:12px;background:var(--red)}

@media (prefers-reduced-motion:reduce){
  .pages,.roll .d b,.sheet,.toast,.zrow .bar i{transition-duration:.01s}
  .dhead h1 i.rec{animation:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="road" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="asph"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .75 0 0 0 0 .76 0 0 0 0 .72 0 0 0 .22 0"/></filter>
        <pattern id="tape" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><rect width="16" height="16" fill="#161715"/><rect width="16" height="3" fill="#2a2b28"/></pattern>
        <linearGradient id="barsh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
      </defs>
      <rect width="1440" height="900" fill="#2c2d2b"/>
      <rect width="1440" height="900" filter="url(#asph)"/>
      <path d="M1200 -20 1350 920" stroke="#d8d4c2" stroke-width="16" stroke-dasharray="120 110" opacity=".75"/>
      <path d="M170 -20 40 920" stroke="#c9a53a" stroke-width="10" opacity=".55"/>
      <path d="M-40 520C300 500 520 488 720 486s420 14 760 34" stroke="url(#tape)" stroke-width="64" fill="none"/>
      <path d="M-40 520C300 500 520 488 720 486s420 14 760 34" stroke="url(#barsh)" stroke-width="64" fill="none"/>
      <path d="M680 470h80l18 430H662z" fill="#1c1d1b"/>
      <path d="M700 470h40l6 430h-52z" fill="#fff" opacity=".05"/>
    </svg>
  </div>

  <div class="device">
    <div class="screen" id="screen">
      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="g">
          <svg width="18" height="12" viewBox="0 0 18 12"><path d="M0 12h3.5V9H0zM4.8 12h3.5V6.5H4.8zM9.6 12h3.5V3.5H9.6zM14.4 12H18V0h-3.6z" fill="#111210"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 12 5.8 9.6h4.4zM3 6.8h10v-2H3zM0 2.4h16V.4H0z" fill="#111210"/></svg>
          <svg width="27" height="12" viewBox="0 0 27 12"><path d="M0 0h23v12H0zm2 2v8h19V2z" fill="#111210"/><rect id="batt" x="3.5" y="3.5" width="14" height="5" fill="#111210"/><rect x="24" y="3.5" width="3" height="5" fill="#111210"/></svg>
        </span>
      </div>

      <div class="dhead">
        <h1><i id="recDot" class="rec"></i><span id="pageTitle">騎乘</span></h1>
        <div class="sensors" aria-label="感測器已連線">
          <svg viewBox="0 0 20 20" aria-label="GPS"><path d="M4 10l6-6 2 2-6 6zM9 9l6-6 2 2-6 6zM6 12l2 2M3 17c0-2 1-4 3-5M3 17c2 0 4-1 5-3" stroke="#111210" stroke-width="2" fill="none" stroke-linecap="square"/></svg>
          <svg viewBox="0 0 20 20" aria-label="心率帶"><path d="M10 17 3 10V5h3l1-1h2l1 1 1-1h2l1 1h3v5z" fill="#d62518"/></svg>
          <svg viewBox="0 0 20 20" aria-label="踏頻器"><circle cx="10" cy="10" r="7" stroke="#111210" stroke-width="2.4" fill="none"/><path d="M10 10 15 6" stroke="#111210" stroke-width="2.4"/><rect x="8.5" y="8.5" width="3" height="3" fill="#111210"/></svg>
        </div>
      </div>
      <div class="segs" role="tablist" aria-label="資料頁" id="segs">
        <button role="tab" aria-selected="true" aria-label="騎乘" data-p="0"></button>
        <button role="tab" aria-selected="false" aria-label="心率" data-p="1"></button>
        <button role="tab" aria-selected="false" aria-label="圈數" data-p="2"></button>
        <button role="tab" aria-selected="false" aria-label="爬坡" data-p="3"></button>
      </div>

      <div class="viewport" id="vp">
        <div class="pages" id="pages">
          <!-- ride -->
          <section class="page" aria-label="騎乘">
            <div class="speed">
              <div><div class="lab">速度<em>KM/H</em></div><div class="num" id="spd"></div></div>
              <div class="trend"><svg viewBox="0 0 30 30" id="trendIc"></svg><span id="trendTx">均速</span></div>
            </div>
            <div class="grid2">
              <div class="cellf"><div class="lab">距離<em>KM</em></div><div class="num" id="dist"></div></div>
              <div class="cellf"><div class="lab">騎乘時間</div><div class="num" id="time"></div></div>
              <div class="cellf"><div class="lab">踏頻<em>RPM</em></div><div class="num" id="cad"></div></div>
              <div class="cellf"><div class="lab">心率<em>BPM</em></div><div class="num"><span id="hr"></span><span class="zbox" id="hrz">Z3</span></div></div>
            </div>
            <div class="row3">
              <div class="cellf"><div class="lab">均速</div><div class="num" id="avg"></div></div>
              <div class="cellf"><div class="lab">爬升<em>M</em></div><div class="num" id="gain"></div></div>
              <div class="cellf"><div class="lab">坡度<em>%</em></div><div class="num" id="grade"></div></div>
            </div>
            <div class="route"><div class="lab">全程 河濱 → 風櫃嘴 → 汐止<em id="rtTx"></em></div><svg viewBox="0 0 340 84" preserveAspectRatio="none" id="rt"></svg></div>
          </section>
          <!-- heart -->
          <section class="page" aria-label="心率">
            <div class="hrtop">
              <div><div class="lab">心率<em>BPM</em></div><div class="num" id="hr2"></div></div>
              <div class="zname"><b id="zBig">Z3</b><span id="zName">節奏</span></div>
            </div>
            <div class="zones" id="zones"></div>

}
function renderHead(){
  var ic = R.state === 'ride' ? '<rect x="8" y="6" width="5" height="18" fill="#fff"/><rect x="17" y="6" width="5" height="18" fill="#fff"/>' : '<path d="M9 5 25 15 9 25z" fill="#fff"/>';
  $('goIc').innerHTML = ic; $('goTx').textContent = R.state === 'ride' ? '暫停' : '繼續'; $('kGo').setAttribute('aria-label', R.state === 'ride' ? '暫停' : '繼續');
  $('recDot').className = R.state === 'ride' ? 'rec' : 'pause';
}
function renderAll(){ renderHead(); renderRide(); if (page === 1) renderHR(); if (page === 2) renderLaps(); if (page === 3) renderClimb(); }

// ---------- loop ----------
var last = performance.now(), acc = 0, saveAcc = 0;
setInterval(function(){
  var now = performance.now(), dt = Math.min(2, (now - last)/1000); last = now;
  if (document.hidden) return;
  var k = set.ff ? 10 : 1, sim = dt*k;
  while (sim > 0){ var s = Math.min(.5, sim); step(s); sim -= s; }
  saveAcc += dt; if (saveAcc > 5){ saveAcc = 0; persist(); }
  renderAll();
}, 500);

// ---------- pages: swipe ----------
var TITLES = ['騎乘','心率','圈數','爬坡'];
function goPage(p, silent){
  p = Math.max(0, Math.min(3, p)); var ch = p !== page; page = p;
  $('pages').style.transform = 'translateX('+(-p*25)+'%)';
  document.querySelectorAll('#segs button').forEach(function(b){ b.setAttribute('aria-selected', +b.dataset.p === p); });
  $('pageTitle').textContent = TITLES[p]; save('page', p);
  if (ch && !silent){ haptic(6); beep(1, 3400); }
  renderAll();
}
$('segs').addEventListener('click', function(e){ var b = e.target.closest('[data-p]'); if (b) goPage(+b.dataset.p); });
(function(){
  var vp = $('vp'), pg = $('pages'), sx = 0, sy = 0, dx = 0, lock = null, on = false, t0 = 0;
  vp.addEventListener('pointerdown', function(e){ on = true; sx = e.clientX; sy = e.clientY; dx = 0; lock = null; t0 = e.timeStamp; });
  vp.addEventListener('pointermove', function(e){
    if (!on) return; var x = e.clientX - sx, y = e.clientY - sy;
    if (!lock){ if (Math.abs(x) > 8 || Math.abs(y) > 8){ lock = Math.abs(x) > Math.abs(y) ? 'x' : 'y'; if (lock === 'x'){ pg.classList.add('drag'); try { vp.setPointerCapture(e.pointerId); } catch(z){} } } else return; }
    if (lock !== 'x') return;
    dx = x; if ((page === 0 && dx > 0) || (page === 3 && dx < 0)) dx /= 3;
    pg.style.transform = 'translateX(calc('+(-page*25)+'% + '+dx.toFixed(1)+'px))';
  });
  function end(e){ if (!on) return; on = false; if (lock !== 'x') return; pg.classList.remove('drag');
    var v = dx/Math.max(1, e.timeStamp - t0), w = vp.clientWidth;
    if (dx < -w*.22 || v < -.45) goPage(page + 1); else if (dx > w*.22 || v > .45) goPage(page - 1); else goPage(page, true); }
  vp.addEventListener('pointerup', end); vp.addEventListener('pointercancel', end);
})();
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ closeSheet(); return; }
  if ($('sheet').classList.contains('on')) return;
  if (e.key === 'ArrowRight') goPage(page + 1); if (e.key === 'ArrowLeft') goPage(page - 1);
});

// ---------- keys ----------
function applyLit(){ $('screen').classList.toggle('lit', !!set.lit); }
$('kLight').addEventListener('click', function(){ set.lit = !set.lit; save('set', set); applyLit(); haptic(6); beep(1, 3200); });
$('kLap').addEventListener('click', function(){ audio(); if (R.state !== 'ride'){ toast('暫停中不能分圈'); haptic([6,30,6]); return; } lap(false); });
$('kGo').addEventListener('click', function(){ audio(); R.state = R.state === 'ride' ? 'pause' : 'ride'; persist(); haptic(R.state === 'ride' ? [10,30,10] : 20); beep(R.state === 'ride' ? 1 : 2, R.state === 'ride' ? 2900 : 2200); toast(R.state === 'ride' ? '繼續計時' : '計時暫停'); renderAll(); });
$('kMenu').addEventListener('click', function(){ audio(); menu(); });

// ---------- sheet ----------
var sheet = $('sheet'), scrim = $('scrim'), lastFocus = null;
function openSheet(html){ lastFocus = document.activeElement; $('sheetBody').innerHTML = html; sheet.style.transform = ''; sheet.classList.add('on'); scrim.classList.add('on'); haptic(6); }
function closeSheet(){ if (!sheet.classList.contains('on')) return; sheet.classList.remove('on','drag'); sheet.style.transform = ''; scrim.classList.remove('on'); if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); }
scrim.addEventListener('click', closeSheet);
var MI = '<svg viewBox="0 0 18 18"><path d="M3 9h12" stroke="currentColor" stroke-width="3"/></svg>', PL = '<svg viewBox="0 0 18 18"><path d="M3 9h12M9 3v12" stroke="currentColor" stroke-width="3"/></svg>';
function spark(){ var s = '', pts = []; for (var i = 0; i < 40; i++) pts.push((i/39*340).toFixed(0)+','+(26 - Math.random()*20).toFixed(0)); return '<svg viewBox="0 0 340 28" preserveAspectRatio="none"><polyline points="'+pts.join(' ')+'" fill="none" stroke="#111210" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>'; }
function menu(){
  openSheet('<h3>選單</h3>'+
    '<div class="sec"><span>騎乘設定</span></div>'+
    '<div class="mrow"><span>最大心率<small>區間依此計算</small></span><div class="step"><button data-hr="-1" aria-label="減一">'+MI+'</button><output id="mhr">'+set.maxhr+'</output><button data-hr="1" aria-label="加一">'+PL+'</button></div></div>'+
    '<div class="mrow"><span>每 5 公里自動分圈</span><button class="tg" role="switch" data-t="autolap" aria-checked="'+set.autolap+'" aria-label="自動分圈"></button></div>'+
    '<div class="mrow"><span>模擬快轉 ×10<small>看爬坡剖面動起來</small></span><button class="tg" role="switch" data-t="ff" aria-checked="'+set.ff+'" aria-label="快轉"></button></div>'+
    '<div class="mrow"><span>提示音</span><button class="tg" role="switch" data-t="beep" aria-checked="'+set.beep+'" aria-label="提示音"></button></div>'+
    '<button class="endbtn" id="endRide"><i></i>結束並儲存這趟</button>'+
    '<div class="sec"><span>騎乘紀錄</span><span>'+hist.length+' 趟</span></div>'+
    hist.map(function(h, i){ return '<div class="hist"><b>'+h.name+'</b><span>'+h.d.toFixed(1)+' km</span><small>'+h.when+'，'+fmtT(h.t)+'，爬升 '+h.gain+' m，平均心率 '+h.hr+'</small></div>'; }).join(''));
}
sheet.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.hr){ set.maxhr = Math.max(150, Math.min(215, set.maxhr + (+b.dataset.hr))); save('set', set); $('mhr').textContent = set.maxhr; haptic(4); renderAll(); }
  else if (b.dataset.t){ var k = b.dataset.t; set[k] = !set[k]; save('set', set); b.setAttribute('aria-checked', set[k]); haptic(6); if (k === 'beep' && set.beep) beep(1); }
  else if (b.id === 'endRide'){
    if (!b.dataset.arm){ b.dataset.arm = 1; b.lastChild.textContent = '再按一次確定結束'; haptic([6,30,6]); return; }
    var d = new Date(), WD = ['日','一','二','三','四','五','六'];
    var avgHr = Math.round(R.hrs.reduce(function(a, c){ return a + c; }, 0)/Math.max(1, R.hrs.length));
    hist.unshift({when:(d.getMonth()+1)+' 月 '+d.getDate()+' 日 週'+WD[d.getDay()], name:'風櫃嘴 · 汐止', d:R.d/1000, t:R.t, gain:Math.round(R.gain), hr:avgHr});
    save('hist', hist); R = {d:0, t:0, mov:0, gain:0, hr:74, cad:0, v:0, laps:[], lap:{t0:0, d0:0, hrs:0, n:0}, zt:[0,0,0,0,0], hrs:[], state:'pause'}; persist();
    beep(3, 2600); haptic([20,40,20]); closeSheet(); toast('已儲存，按紅鍵出發'); renderAll();
  }
});
(function(){
  var sy = 0, dy = 0, t0 = 0, dragging = false;
  sheet.addEventListener('pointerdown', function(e){ if (e.target.closest('button')) return; if (sheet.scrollTop > 0) return; dragging = true; sy = e.clientY; dy = 0; t0 = e.timeStamp; sheet.classList.add('drag'); try { sheet.setPointerCapture(e.pointerId); } catch(x){} });
  sheet.addEventListener('pointermove', function(e){ if (!dragging) return; dy = e.clientY - sy; var y = dy > 0 ? dy : dy/6; sheet.style.transform = 'translateY('+y.toFixed(1)+'px)'; scrim.style.opacity = Math.max(0, 1 - dy/sheet.offsetHeight).toFixed(2); });
  function end(e){ if (!dragging) return; dragging = false; sheet.classList.remove('drag'); scrim.style.opacity = ''; var v = dy/Math.max(1, e.timeStamp - t0); if (dy > sheet.offsetHeight*.35 || v > .6) closeSheet(); else sheet.style.transform = ''; }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();

var toastT = null;
function toast(m){ $('toastTx').textContent = m; $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ $('toast').classList.remove('on'); }, 2400); }

function clock(){ var d = new Date(); $('clock').textContent = d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
clock(); setInterval(clock, 15000);
applyLit(); goPage(load('page', 0), true); renderLaps(); renderHR(); renderClimb();
})();
</script>
</body>
</html>
