<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="刷刷">
<title>刷刷 · 短影音</title>
<meta name="description" content="全螢幕短影音：往上刷換下一支程式即時生成的影片，雙擊愛心爆開，留言抽屜、收藏、追蹤與聲音開關。收錄於 100 Creative HTML Works（App 035・沉浸全螢幕粗白字）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/035-shorts-feed.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cpath d='M22 44 44 20' stroke='%23fff' stroke-width='9' stroke-linecap='round'/%3E%3Cpath d='M30 50 50 28' stroke='%23c6ff1a' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --lime:#c6ff1a;
  --heavy:"Avenir Next","Avenir","PingFang TC","Heiti TC",system-ui,sans-serif;
  --cjk:"PingFang TC","Heiti TC",system-ui,sans-serif;
  --snap:cubic-bezier(.2,.9,.25,1);
  --pop:cubic-bezier(.3,1.7,.45,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.4 var(--cjk);color:#fff;background:#000;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:10px}
svg{display:block}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:#000;isolation:isolate}
@media (min-width:521px){
  .stage{display:flex;align-items:center;justify-content:center;gap:60px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0;overflow:hidden}
  .backdrop .w{position:absolute;font:900 44vh/.8 var(--heavy);color:#141414;letter-spacing:-.02em;white-space:nowrap;-webkit-user-select:none;user-select:none}
  .backdrop .w1{left:-4vw;top:-6vh}
  .backdrop .w2{right:-6vw;bottom:-10vh;color:#101010}
  .backdrop .ln{position:absolute;left:-5%;right:-5%;top:93%;height:10px;border-radius:5px;background:var(--lime);transform:rotate(-3deg)}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:56px;padding:9px;background:#0d0d0d;z-index:1;
    box-shadow:inset 0 0 0 1.5px #2a2a2a}
  .screen{inset:9px;border-radius:47px}
  .caption{display:block;position:relative;z-index:1;max-width:240px}
  .caption h1{font:900 56px/1 var(--heavy);letter-spacing:.02em}
  .caption p{margin-top:14px;font:600 15px/1.6 var(--cjk);color:#bdbdbd}
  .caption kbd{font:800 13px var(--heavy);color:#000;background:var(--lime);padding:1px 6px;border-radius:4px}
}
@media (min-width:521px) and (max-width:880px){.caption{display:none}}

/* status bar */
.status{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;height:calc(48px + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 28px 0 34px;font:800 16px/1 var(--heavy);pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}

/* top bar over the feed */
.topbar{position:absolute;left:0;right:0;top:calc(46px + env(safe-area-inset-top));z-index:20;height:48px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 10px;pointer-events:none}
.topbar > *{pointer-events:auto}
.tabs{justify-self:center;display:flex;gap:22px;align-items:center}
.tabs button{position:relative;height:44px;font:800 17px/1 var(--heavy);color:rgba(255,255,255,.55);text-shadow:0 1px 3px rgba(0,0,0,.5);transition:color .2s}
.tabs button[aria-selected=true]{color:#fff;font-size:19px}
.tabs .bar{position:absolute;left:0;bottom:4px;height:4px;border-radius:2px;background:#fff;transition:transform .35s var(--snap),width .35s var(--snap)}
.icbtn{width:48px;height:48px;display:grid;place-items:center;border-radius:14px}
.icbtn svg{width:28px;height:28px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.icbtn:active{background:rgba(255,255,255,.12)}

/* feed */
.feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y}
.feed::-webkit-scrollbar{display:none}
.clip{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
.clip canvas{position:absolute;inset:0;width:100%;height:100%}
.shade{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.55) 22%,rgba(0,0,0,.28) 50%,rgba(0,0,0,.08) 78%,rgba(0,0,0,0) 100%)}
.meta{position:absolute;left:16px;right:84px;bottom:calc(34px + env(safe-area-inset-bottom));text-shadow:0 1px 2px rgba(0,0,0,.55)}
.who{display:flex;align-items:center;gap:8px;font:800 17px/1.2 var(--heavy);min-height:32px}
.who .tag{font:800 12px/1 var(--heavy);color:#000;background:var(--lime);padding:3px 6px 2px;border-radius:4px;text-shadow:none}
.cap{margin-top:6px;font:700 15px/1.45 var(--cjk);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap .h{font-weight:800;color:#fff;white-space:nowrap}
.clip.open .cap{-webkit-line-clamp:unset;display:block}
.capmore{font:800 14px var(--heavy);color:rgba(255,255,255,.75);min-height:32px;padding-right:8px}
.music{display:flex;align-items:center;gap:8px;margin-top:6px;height:24px;font:600 14px/1 var(--cjk);overflow:hidden}
.music svg{flex:none;width:18px;height:18px}
.mq{overflow:hidden;white-space:nowrap;flex:1;mask-image:linear-gradient(90deg,#000 80%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent)}
.mq span{display:inline-block;padding-right:40px;animation:mq 9s linear infinite}
.clip:not(.on) .mq span,.paused .mq span{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}

.rail{position:absolute;right:8px;bottom:calc(30px + env(safe-area-inset-bottom));width:64px;display:flex;flex-direction:column;align-items:center;gap:6px}
.rail button{width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;border-radius:14px}
.rail button b{font:800 13px/1 var(--heavy);text-shadow:0 1px 2px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.rail .ic{width:38px;height:38px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));transition:transform .35s var(--pop)}
.rail button:active .ic{transform:scale(.82)}
.rail .pop .ic{animation:pop .45s var(--pop)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.22)}100%{transform:scale(1)}}
.rail [aria-pressed=true] .fillme{fill:var(--lime)}
.rail [aria-pressed=true] b{color:var(--lime)}
.av{position:relative;height:66px;margin-bottom:4px}
.av .mark{width:50px;height:50px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font:900 22px/1 var(--cjk);box-shadow:0 0 0 2px #000,0 0 0 4px #fff}
.av .plus{position:absolute;left:50%;bottom:0;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--lime);display:grid;place-items:center;transition:transform .35s var(--pop)}
.av .plus svg{width:14px;height:14px}
.av[aria-pressed=true] .plus{background:#fff}
.av[aria-pressed=true] .mark{box-shadow:0 0 0 2px #000,0 0 0 4px var(--lime)}
.disc{width:44px;height:44px;border-radius:50%;margin-top:6px;background:#161616;display:grid;place-items:center;box-shadow:inset 0 0 0 7px #262626;animation:spin 5s linear infinite}
.disc span{width:20px;height:20px;border-radius:50%;background:var(--lime);color:#000;font:900 11px/20px var(--cjk);text-align:center}
.clip:not(.on) .disc,.paused .disc{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}

.prog{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));height:26px;touch-action:none;cursor:pointer}
.prog .tr{position:absolute;left:12px;right:12px;top:11px;height:3px;border-radius:2px;background:rgba(255,255,255,.28);transition:height .2s,top .2s}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--lime);width:0}
.prog.scrub .tr,.paused .prog .tr{height:6px;top:10px}
.stamp{position:absolute;left:50%;bottom:calc(46px + env(safe-area-inset-bottom));transform:translateX(-50%);font:800 22px/1 var(--heavy);font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000;display:none;pointer-events:none}
.prog.scrub ~ .stamp{display:block}

.big{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;pointer-events:none;display:none}
.paused .big{display:block}
.speed{position:absolute;left:50%;top:calc(104px + env(safe-area-inset-top));transform:translateX(-50%);height:34px;padding:0 14px;border-radius:17px;background:rgba(0,0,0,.55);font:800 14px/34px var(--heavy);display:none;white-space:nowrap}
.fast .speed{display:block}

.burst{position:absolute;z-index:25;width:0;height:0;pointer-events:none}
.burst svg{position:absolute;left:-54px;top:-54px;width:108px;height:108px}
.burst i{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--lime)}

/* sheets */
.scrim{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:50;background:#fff;color:#111;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .42s var(--snap);display:flex;flex-direction:column;max-height:74%}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.sgrab{flex:none;padding:10px 16px 6px;touch-action:none;cursor:grab;text-align:center}
.handle{width:40px;height:5px;border-radius:3px;background:#d4d4d4;margin:0 auto 10px}
.sgrab h4{font:800 16px/1.2 var(--heavy)}
.sbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:4px 16px 16px}
.cm{display:grid;grid-template-columns:40px 1fr 44px;gap:10px;padding:10px 0}
.cm .mk{width:40px;height:40px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font:800 16px/1 var(--cjk)}
.cm .mk.me{background:var(--lime);color:#000}
.cm .nm{font:700 13px/1.3 var(--cjk);color:#6b6b6b}
.cm .tx{font:500 15px/1.45 var(--cjk);margin-top:2px;color:#111;word-break:break-word}
.cm .tm{font:500 13px/1 var(--cjk);color:#8a8a8a;margin-top:6px}
.cm button{height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 12px/1 var(--heavy);color:#6b6b6b}
.cm button svg{width:20px;height:20px}
.cm button[aria-pressed=true]{color:#111}
.cm button[aria-pressed=true] .fillme{fill:#111}
.composer{flex:none;display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #efefef}
.composer input{flex:1;min-width:0;height:44px;border:0;border-radius:12px;background:#f1f1ef;padding:0 14px;font:500 15px var(--cjk);color:#111}
.composer input::placeholder{color:#8a8a8a}
.composer button{height:44px;padding:0 16px;border-radius:12px;background:#111;color:var(--lime);font:800 15px/1 var(--heavy)}
.composer button:disabled{color:#777;background:#e2e2e2}
.share{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 0 4px}
.share button{height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:700 13px/1.2 var(--cjk);border-radius:14px}
.share button:active{background:#f1f1ef}
.share .mk{width:48px;height:48px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font:800 18px/1 var(--cjk)}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;padding-top:12px;border-top:1px solid #efefef}
.acts button{height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:700 13px/1 var(--cjk);border-radius:14px}
.acts button:active{background:#f1f1ef}
.acts svg{width:30px;height:30px}
.me-head{display:flex;align-items:center;gap:14px;padding:4px 0 14px}
.me-head .mk{width:60px;height:60px;border-radius:50%;background:var(--lime);color:#000;display:grid;place-items:center;font:900 26px/1 var(--cjk)}
.me-head b{font:800 18px/1.2 var(--heavy)}
.me-head p{font:500 13px/1.4 var(--cjk);color:#6b6b6b;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:10px 0 14px}
.stats b{display:block;font:800 22px/1 var(--heavy)}
.stats span{font:600 13px/1 var(--cjk);color:#6b6b6b}
.seg{display:grid;grid-template-columns:1fr 1fr;margin-bottom:10px}
.seg button{height:44px;font:800 15px/1 var(--heavy);color:#8a8a8a;border-bottom:3px solid transparent}
.seg button[aria-selected=true]{color:#111;border-color:#111}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.grid button{position:relative;aspect-ratio:9/14;background:#111;overflow:hidden;border-radius:4px}
.grid canvas{width:100%;height:100%;display:block}
.grid b{position:absolute;left:6px;bottom:5px;font:800 13px/1 var(--heavy);color:#fff;text-shadow:0 1px 2px #000;display:flex;align-items:center;gap:3px}
.grid b svg{width:13px;height:13px}
.none{padding:30px 10px;text-align:center;font:600 14px/1.6 var(--cjk);color:#6b6b6b}

.toast{position:absolute;left:50%;top:calc(104px + env(safe-area-inset-top));z-index:70;display:flex;align-items:center;gap:4px;height:44px;padding:0 6px 0 16px;border-radius:12px;background:#fff;color:#000;font:700 14px/1 var(--cjk);
  transform:translate(-50%,-160px);transition:transform .4s var(--snap);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.toast button{height:36px;padding:0 12px;border-radius:9px;background:#000;color:var(--lime);font:800 13px/1 var(--heavy)}
.toast button[hidden]{display:none}
.hint{position:absolute;left:50%;bottom:calc(236px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:21;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:20px;background:#000;font:800 14px/1 var(--heavy);pointer-events:none;transition:opacity .4s}
.hint svg{width:18px;height:18px;animation:nud 1.4s ease-in-out infinite}
.hint.gone{opacity:0}
@keyframes nud{50%{transform:translateY(-5px)}}
.home{position:absolute;left:50%;bottom:calc(6px + env(safe-area-inset-bottom));width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(255,255,255,.85);z-index:80;pointer-events:none}
@media (prefers-reduced-motion:reduce){
  .mq span,.disc,.hint svg{animation:none}
  .sheet,.toast,.tabs .bar{transition-duration:.01s}
  .rail .pop .ic{animation:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><div class="w w1">刷刷刷</div><div class="ln"></div><div class="w w2">刷刷刷</div></div>
  <div class="caption">
    <h1>刷刷</h1>
    <p>全螢幕短影音。往上刷換一支，雙擊愛心爆開，按住右半邊兩倍速。桌機可用 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>M</kbd>。</p>
  </div>
  <div class="device">
    <div class="screen" id="screen">
      <div class="feed" id="feed" aria-label="影片"></div>

      <div class="status" aria-hidden="true">
        <span id="clock">09:41</span>
        <span class="g">
          <svg width="19" height="12" viewBox="0 0 19 12"><path d="M1 11h3V8H1zM6 11h3V5.5H6zM11 11h3V3h-3zM16 11h2.5V.5H16z" fill="#fff"/></svg>
          <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 11.5 1 4.2a10.6 10.6 0 0 1 15 0z" fill="#fff"/></svg>
          <svg width="27" height="12" viewBox="0 0 27 12"><rect x="0" y="0" width="23" height="12" rx="3" fill="#fff" opacity=".4"/><rect x="0" y="0" width="17" height="12" rx="3" fill="#fff"/><rect x="24" y="4" width="2.5" height="4" rx="1" fill="#fff" opacity=".4"/></svg>
        </span>
      </div>

      <div class="topbar">
        <button class="icbtn" id="meBtn" aria-label="我的收藏與按讚"><svg viewBox="0 0 28 28"><path d="M5 23c1.4-4.6 4.8-7 9-7s7.6 2.4 9 7z" fill="#fff"/><path d="M14 4.5a5 5 0 1 1 0 10 5 5 0 0 1 0-10z" fill="#fff"/><path d="M18.5 5.5 21 3" stroke="#c6ff1a" stroke-width="2.6" stroke-linecap="round"/></svg></button>
        <div class="tabs" role="tablist">
          <button role="tab" id="tFollow" aria-selected="false">追蹤</button>
          <button role="tab" id="tFor" aria-selected="true">推薦</button>
          <span class="bar" id="tabBar"></span>
        </div>
        <button class="icbtn" id="muteBtn" aria-label="開啟聲音" aria-pressed="true"></button>
      </div>

      <div class="hint" id="hint" aria-hidden="true"><svg viewBox="0 0 18 18"><path d="M9 15V3M4 8l5-5 5 5" stroke="#c6ff1a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>往上刷，看下一支</div>

      <div class="scrim" id="scrim"></div>
      <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
        <div class="sgrab" id="sgrab"><div class="handle"></div><h4 id="sheetT">留言</h4></div>
        <div class="sbody" id="sbody"></div>
        <form class="composer" id="composer" autocomplete="off">
          <input id="cmIn" maxlength="80" placeholder="留個言，友善一點" aria-label="輸入留言">
          <button id="cmSend" disabled>送出</button>
        </form>
      </section>

      <div class="toast" id="toast" role="status"><span id="toastT"></span><button id="undoBtn" hidden>復原</button></div>
      <div class="home" aria-hidden="true"></div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var KEY = 'app035:';
function load(k, d){ try { var v = localStorage.getItem(KEY + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch(e){} }
function haptic(p){ try { navigator.vibrate && navigator.vibrate(p || 8); } catch(e){} }
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function hsh(i, k){ var x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); }
function wan(n){ return n >= 10000 ? (n / 10000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, '') + '萬' : String(n); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ---------- icons: solid white, heavy, one lime notch when active ---------- */
var IC = {
  heart:'<svg class="ic" viewBox="0 0 38 38"><path class="fillme" d="M19 33C8 25.6 3.5 20.2 3.5 13.6A8.4 8.4 0 0 1 19 9a8.4 8.4 0 0 1 15.5 4.6c0 6.6-4.5 12-15.5 19.4z" fill="#fff"/></svg>',
  cmt:'<svg class="ic" viewBox="0 0 38 38"><path d="M19 5c8.6 0 15 5.4 15 12.4S27.6 29.8 19 29.8c-1.5 0-3-.2-4.3-.5L7 33.5l1.6-6.6C5.8 24.7 4 21.3 4 17.4 4 10.4 10.4 5 19 5z" fill="#fff"/><circle cx="12.5" cy="17.5" r="2.2" fill="#000"/><circle cx="19" cy="17.5" r="2.2" fill="#000"/><circle cx="25.5" cy="17.5" r="2.2" fill="#000"/></svg>',

    haptic([10, 30, 10]);
  }
});
$('cmIn').addEventListener('input', function(){ $('cmSend').disabled = !this.value.trim(); });
$('composer').addEventListener('submit', function(e){
  e.preventDefault(); var v = $('cmIn').value.trim(); if (!v || !sheetSlide) return;
  var c = sheetSlide.c; (st.cmts[c.id] = st.cmts[c.id] || []).unshift(['我', v, '剛剛', 0]); persist();
  $('cmIn').value = ''; $('cmSend').disabled = true;
  $('sbody').innerHTML = cmHTML(c); $('sbody').scrollTop = 0;
  $('sheetT').textContent = wan(c.cm + st.cmts[c.id].length) + ' 則留言';
  sheetSlide.el.querySelector('[data-a=cmt] b').textContent = wan(c.cm + st.cmts[c.id].length);
  haptic([6, 20, 6]); boop();
});
function openShare(s){
  sheetSlide = s;
  var fr = [['阿哲','哲'],['小芸','芸'],['媽媽','媽'],['同事群組','群']];
  var h = '<div class="share">' + fr.map(function(f){ return '<button data-friend="' + f[0] + '"><span class="mk">' + f[1] + '</span>' + f[0] + '</button>'; }).join('') + '</div>' +
    '<div class="acts">' +
      '<button data-sa="copy"><svg viewBox="0 0 30 30"><path d="M12.5 17.5 17.5 12.5" stroke="#111" stroke-width="3" stroke-linecap="round"/><path d="M14 9.5l2.2-2.2a4.6 4.6 0 0 1 6.5 6.5L20.5 16M16 20.5l-2.2 2.2a4.6 4.6 0 0 1-6.5-6.5L9.5 14" stroke="#111" stroke-width="3" stroke-linecap="round" fill="none"/></svg>複製連結</button>' +
      '<button data-sa="save"><svg viewBox="0 0 30 30"><path d="M8 4.5h14a1.5 1.5 0 0 1 1.5 1.5v20l-8.5-6-8.5 6V6A1.5 1.5 0 0 1 8 4.5z" fill="' + (st.saved[s.c.id] ? '#c6ff1a' : 'none') + '" stroke="#111" stroke-width="2.6" stroke-linejoin="round"/></svg>' + (st.saved[s.c.id] ? '取消收藏' : '收藏') + '</button>' +
      '<button data-sa="hide"><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="10" stroke="#111" stroke-width="2.6" fill="none"/><path d="M8 22 22 8" stroke="#111" stroke-width="2.6" stroke-linecap="round"/></svg>不感興趣</button>' +
    '</div>';
  openSheet('分享給', h, false);
}

/* profile: saved and liked */
var meTab = 'saved';
function meHTML(){
  var ids = Object.keys(meTab === 'saved' ? st.saved : st.liked).filter(function(id){ return clipById(id); });
  var h = '<div class="me-head"><div class="mk">我</div><div><b>@chiayi.scroll</b><p>嘉義人，睡前刷十分鐘就好</p></div></div>' +
    '<div class="stats"><div><b>' + Object.keys(st.follow).length + '</b><span>追蹤中</span></div><div><b>' + Object.keys(st.liked).length + '</b><span>按過讚</span></div><div><b>' + Object.keys(st.saved).length + '</b><span>收藏</span></div></div>' +
    '<div class="seg" role="tablist"><button role="tab" data-me="saved" aria-selected="' + (meTab === 'saved') + '">收藏</button><button role="tab" data-me="liked" aria-selected="' + (meTab === 'liked') + '">按讚</button></div>';
  h += ids.length ? '<div class="grid">' + ids.map(function(id){ var c = clipById(id); return '<button data-open="' + id + '" aria-label="打開 ' + esc(c.u) + ' 的影片"><canvas data-s="' + c.s + '"></canvas><b>' + IC.smallHeart + wan(likes(c)) + '</b></button>'; }).join('') + '</div>' : '<p class="none">' + (meTab === 'saved' ? '還沒收藏影片。按右邊的書籤就會收進來。' : '還沒按讚。雙擊影片試試看。') + '</p>';
  return h;
}
function paintThumbs(){
  [].forEach.call($('sbody').querySelectorAll('canvas[data-s]'), function(cv){ var w = cv.clientWidth || 110, h = cv.clientHeight || 170; cv.width = w * dpr; cv.height = h * dpr; var c = cv.getContext('2d'); c.setTransform(dpr * w / 390, 0, 0, dpr * w / 390, 0, 0); SCENES[cv.dataset.s](c, 390, 390 * h / w, 3.3); });
}
function openMe(){ sheetSlide = null; openSheet('我的', meHTML(), false); requestAnimationFrame(paintThumbs); }
$('meBtn').addEventListener('click', openMe);
$('sbody').addEventListener('click', function(e){
  var t = e.target.closest('[data-me]'); if (t){ meTab = t.dataset.me; $('sbody').innerHTML = meHTML(); requestAnimationFrame(paintThumbs); haptic(5); return; }
  var o = e.target.closest('[data-open]'); if (!o) return;
  var id = o.dataset.open; closeSheet();
  if (feedMode !== 'for'){ feedMode = 'for'; $('tFollow').setAttribute('aria-selected', false); $('tFor').setAttribute('aria-selected', true); moveBar(); }
  delete st.hidden[id]; build(id); haptic(6);
});

/* ---------- toast ---------- */
var toastTm = null, lastUndo = null;
function toast(m, undo){ $('toastT').textContent = m; $('undoBtn').hidden = !undo; if (!undo) lastUndo = null; $('toast').classList.add('on'); clearTimeout(toastTm); toastTm = setTimeout(function(){ $('toast').classList.remove('on'); }, undo ? 3600 : 1900); }
$('undoBtn').addEventListener('click', function(){ if (lastUndo){ lastUndo(); lastUndo = null; } $('toast').classList.remove('on'); haptic(10); });

/* ---------- clock ---------- */
function clock(){ var d = new Date(); $('clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
clock(); setTimeout(function(){ clock(); setInterval(clock, 60000); }, (60 - new Date().getSeconds()) * 1000);

/* ---------- boot ---------- */
renderMute(); build(); moveBar();
if (st.seenHint) $('hint').classList.add('gone');
window.addEventListener('resize', function(){ sizeAll(); feed.scrollTop = cur * feed.clientHeight; moveBar(); });
})();
</script>
</body>
</html>
