<style>
:root{
  --hv:"Helvetica Neue",Helvetica,"PingFang TC","Heiti TC",Arial,sans-serif;
  --out:cubic-bezier(.2,1,.3,1); --spring:cubic-bezier(.3,1.25,.5,1);
  --linen:#5f5e5b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.4 var(--hv);color:#fff;background:#000;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;text-align:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #9ec7ff;outline-offset:2px}
svg{display:block}
.linen{background-color:var(--linen);background-image:var(--linenImg)}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption,.hw{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:#000;isolation:isolate;-webkit-user-select:none;user-select:none}
@media (min-width:521px){
  .stage{display:flex;align-items:center;justify-content:center;gap:70px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:58px;z-index:1;
    background:linear-gradient(90deg,#2b2b2d,#0e0e0f 8%,#0b0b0c 92%,#2b2b2d);box-shadow:inset 0 0 0 2px #6d6e72,inset 0 0 0 4px #1b1b1c,0 22px 30px -20px #000}
  .screen{inset:66px 18px 84px;border-radius:3px}
  .hw{display:block;position:absolute}
  .spk{top:30px;left:50%;width:62px;height:7px;margin-left:-31px;border-radius:4px;background:#1f1f22;box-shadow:inset 0 1px 2px #000,0 1px 0 #333}
  .cam{top:29px;left:calc(50% - 64px);width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#3b4a60,#0a0c12 60%)}
  .homebtn{bottom:12px;left:50%;width:58px;height:58px;margin-left:-29px;border-radius:50%;background:linear-gradient(#0b0b0c,#1d1d1f);box-shadow:inset 0 0 0 2px #2c2c2e,inset 0 2px 3px #000,0 1px 0 #3a3a3c}
  .homebtn::after{content:"";position:absolute;left:50%;top:50%;width:17px;height:17px;margin:-9.5px 0 0 -9.5px;border:1.5px solid #6b6b70;border-radius:4px}
  .homebtn:active{background:linear-gradient(#050505,#141415)}
  .caption{display:block;position:relative;z-index:1;width:240px;color:#d8d7d3}
  .caption h1{font:300 40px/1.1 var(--hv);letter-spacing:.02em;color:#ecebe7;text-shadow:0 -1px 0 rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.12)}
  .caption p{font:14px/1.7 var(--hv);margin-top:14px;color:#c9c8c4;text-shadow:0 1px 0 rgba(0,0,0,.5)}
  .homebar{display:none}
}
@media (min-width:521px) and (max-width:900px){.caption{display:none}}

/* wallpaper + springboard */
.wall{position:absolute;inset:0;transition:transform .45s var(--out),filter .45s}
.wall svg{width:100%;height:100%}
.sb{position:absolute;inset:0;transition:transform .45s var(--out)}
.screen.app-open .sb{transform:scale(1.18)}
.screen.app-open .wall{filter:brightness(.5)}
.status{position:absolute;top:0;left:0;right:0;height:calc(22px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 6px 0;z-index:40;display:flex;align-items:center;font:600 13px/1 var(--hv);background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.4));text-shadow:0 -1px 0 rgba(0,0,0,.6)}
.status .l,.status .r{flex:1;display:flex;align-items:center;gap:5px}
.status .r{justify-content:flex-end}
.status .t{font-weight:700}
.status .bt{font-size:12px}
@media (display-mode:standalone){.status{background:none}.status > *{visibility:hidden}}
.ncpull{position:absolute;top:0;left:15%;right:15%;height:calc(28px + env(safe-area-inset-top));z-index:41;touch-action:none}

.vp{position:absolute;left:0;right:0;top:calc(22px + env(safe-area-inset-top));overflow:hidden;touch-action:pan-y}
.strip{position:absolute;inset:0;will-change:transform}
.strip.snap{transition:transform .38s var(--out)}
.ic{position:absolute;display:flex;flex-direction:column;align-items:center;width:var(--cw);transition:left .3s var(--out),top .3s var(--out),transform .35s var(--out),opacity .3s;touch-action:none}
.ic .art{position:relative;width:var(--is);height:var(--is);border-radius:calc(var(--is) * .2);box-shadow:0 2px 3px rgba(0,0,0,.45)}
.ic .art svg{width:100%;height:100%;border-radius:inherit}
.ic .art::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.18) 48%,rgba(255,255,255,0) 50%);clip-path:ellipse(95% 52% at 50% 0%);pointer-events:none}
.ic.nogloss .art::after{display:none}
.ic .lb{margin-top:5px;font:600 11.5px/1.2 var(--hv);text-shadow:0 1px 2px rgba(0,0,0,.95),0 0 1px #000;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ic:active .art{filter:brightness(.62)}
.ic .x{position:absolute;top:-9px;left:calc(50% - var(--is)/2 - 11px);width:44px;height:44px;display:none;align-items:center;justify-content:center;z-index:2}
.ic .x i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 50% 25%,#6a6a6a,#101010 60%);box-shadow:0 0 0 2px #fff,0 2px 3px rgba(0,0,0,.6);display:grid;place-items:center}
.edit .ic.del .x{display:flex}
.edit .ic{animation:wig .26s ease-in-out infinite alternate}
.edit .ic:nth-child(3n){animation-duration:.24s;animation-delay:-.1s}
.edit .ic:nth-child(3n+1){animation-duration:.28s;animation-delay:-.2s}
@keyframes wig{from{rotate:-1.8deg}to{rotate:1.8deg}}
.ic.dragging{z-index:50;transition:none;animation:none!important;scale:1.18;opacity:.92;will-change:transform}
.ic.ftarget .art{transform:scale(1.25);transition:transform .25s var(--spring)}
.ic.gone{transform:scale(.01)!important;opacity:0}
.ic.shift{transition:transform .38s var(--out)}
.drag-layer{position:absolute;inset:0;z-index:45;pointer-events:none}

/* folder icon */
.fold{background:rgba(20,20,22,.45);box-shadow:inset 0 1px 3px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.35)!important;display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--is)*.06);padding:calc(var(--is)*.12);align-content:start}
.fold svg{border-radius:calc(var(--is)*.05)!important}
.ic.isfold .art::after{display:none}

.dots{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:9px;height:22px;z-index:3;transition:transform .38s var(--out)}
.dots button{width:14px;height:22px;display:grid;place-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots button[aria-current=true] i{background:#fff}
.dots svg{opacity:.45}
.dots button[aria-current=true] svg{opacity:1}
.dock{position:absolute;left:0;right:0;bottom:0;height:calc(96px + env(safe-area-inset-bottom));z-index:2;transition:transform .38s var(--out)}
.dock .shelf{position:absolute;left:-10px;right:-10px;bottom:0;height:calc(58px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(210,215,220,.35) 12%,rgba(120,125,130,.35) 60%,rgba(60,62,66,.55));transform:perspective(160px) rotateX(38deg);transform-origin:50% 100%;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -2px 0 rgba(0,0,0,.3)}
.dock .shelf::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(rgba(255,255,255,.25),rgba(0,0,0,.35))}
.dock .ic .lb{margin-top:4px}
.homebar{position:absolute;left:50%;bottom:0;width:180px;height:24px;margin-left:-90px;z-index:70;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.homebar i{width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.85)}

/* spotlight page */
.spot{position:absolute;top:0;height:100%;padding:14px 12px 0;background:rgba(0,0,0,.62)}
.sfield{display:flex;align-items:center;gap:8px;height:34px;border-radius:17px;background:linear-gradient(#f0f0f0,#fff);box-shadow:inset 0 1px 3px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.3);padding:0 12px;color:#777}
.sfield input{flex:1;min-width:0;border:0;background:none;font:15px var(--hv);color:#111;outline:none;height:100%}
.sres{margin-top:12px;overflow-y:auto;max-height:calc(100% - 70px)}
.sres button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.12);font:600 15px var(--hv)}
.sres button:active{background:rgba(255,255,255,.12)}
.sres .mini{width:34px;height:34px;border-radius:7px;overflow:hidden;flex:none}
.sres .mini svg{width:100%;height:100%}
.sres p{padding:14px 6px;color:#bbb;font-size:14px}

/* folder panel */
.fpanel{position:absolute;left:0;right:0;z-index:30;padding:26px 0 18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:inset 0 10px 10px -8px rgba(0,0,0,.75),inset 0 -10px 10px -8px rgba(0,0,0,.75);transform-origin:50% 0;transition:clip-path .38s var(--out)}
.fpanel .fname{display:block;width:calc(100% - 40px);margin:0 20px 10px;font:700 18px/1.2 var(--hv);color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.7);background:none;border:0;outline:none;padding:6px 8px;border-radius:6px}
.fpanel .fname:read-write:focus{background:rgba(0,0,0,.25)}
.fpanel .fgrid{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.fpanel .fcontent{position:relative}
.fscrim{position:absolute;inset:0;z-index:29}

/* notification centre (linen) */
.nc{position:absolute;left:0;right:0;top:0;height:100%;z-index:60;transform:translateY(-100%);transition:transform .45s var(--out);display:flex;flex-direction:column;touch-action:none;visibility:hidden}
.nc.on{transform:none;visibility:visible}
.nc.drag{transition:none;visibility:visible}
.nc .body{flex:1;overflow-y:auto;padding:calc(30px + env(safe-area-inset-top)) 0 10px}
.nc .wx{margin:0 10px 12px;padding:12px 14px;border-radius:9px;background:linear-gradient(#5e8fd0,#2d5fa8);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 2px rgba(0,0,0,.6);display:flex;align-items:center;gap:12px}
.nc .wx b{font:200 38px/1 var(--hv)}
.nc .wx span{font:13px/1.4 var(--hv)}
.nsec{margin-bottom:8px}
.nsec h3{display:flex;align-items:center;gap:8px;height:34px;padding:0 4px 0 12px;font:700 14px var(--hv);background:linear-gradient(rgba(255,255,255,.12),rgba(0,0,0,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -1px 0 rgba(0,0,0,.4);text-shadow:0 -1px 0 rgba(0,0,0,.6)}
.nsec h3 .mini{width:22px;height:22px;border-radius:5px;overflow:hidden}
.nsec h3 .mini svg{width:100%;height:100%}
.nsec h3 button{margin-left:auto;width:44px;height:34px;display:grid;place-items:center}
.nsec h3 button i{width:20px;height:20px;border-radius:50%;background:linear-gradient(#5b5b5b,#2c2c2c);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);display:grid;place-items:center}
.nsec h3 button:active i{background:#1a1a1a}
.nsec .n{padding:9px 14px 10px 42px;font:13.5px/1.45 var(--hv);text-shadow:0 -1px 0 rgba(0,0,0,.5);box-shadow:inset 0 -1px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.nsec .n b{display:block;font-size:14px}
.nsec .n small{color:#c9c8c4;font-size:12px}
.nc .empty{padding:24px 16px;text-align:center;color:#d7d6d2;font:14px var(--hv);text-shadow:0 -1px 0 rgba(0,0,0,.6)}
.nc .grip{flex:none;height:34px;display:grid;place-items:center;background:linear-gradient(#4b4a48,#2e2d2c);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);cursor:grab}
.nc .grip i{width:38px;height:6px;border-radius:3px;background:linear-gradient(#2a2a2a,#555);box-shadow:inset 0 1px 1px #000,0 1px 0 rgba(255,255,255,.25)}

/* alert + action sheet */
.scrim{position:absolute;inset:0;z-index:80;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.25),rgba(0,0,0,.65));opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.alert{position:absolute;left:50%;top:50%;width:274px;margin-left:-137px;z-index:81;border-radius:11px;padding:16px 12px 12px;text-align:center;
  background:linear-gradient(180deg,rgba(34,52,96,.94),rgba(10,24,62,.94));box-shadow:0 0 0 2px rgba(255,255,255,.85),0 4px 10px rgba(0,0,0,.6);transform:translateY(-50%) scale(.8);opacity:0;visibility:hidden;transition:transform .3s var(--spring),opacity .15s,visibility 0s .3s}
.alert::before{content:"";position:absolute;left:1px;right:1px;top:1px;height:26px;border-radius:10px 10px 50% 50%/10px 10px 12px 12px;background:linear-gradient(rgba(255,255,255,.38),rgba(255,255,255,.08));pointer-events:none}
.alert.on{transform:translateY(-50%) scale(1);opacity:1;visibility:visible;transition:transform .3s var(--spring),opacity .15s}
.alert h4{font:700 17px/1.3 var(--hv);text-shadow:0 -1px 0 rgba(0,0,0,.6)}
.alert p{font:14px/1.4 var(--hv);margin-top:6px;text-shadow:0 -1px 0 rgba(0,0,0,.6)}
.alert .ab{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.gbtn{height:44px;border-radius:6px;font:700 16px var(--hv);text-shadow:0 -1px 0 rgba(0,0,0,.6);background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.1) 50%,rgba(255,255,255,.02) 51%,rgba(255,255,255,.08));box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.45)}
.gbtn.dim{background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.04) 50%,rgba(0,0,0,.1) 51%,rgba(0,0,0,.05))}
.gbtn:active{background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.3))}
.asheet{position:absolute;left:0;right:0;bottom:0;z-index:81;padding:16px 20px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(rgba(60,60,64,.93),rgba(14,14,16,.95));box-shadow:inset 0 1px 0 rgba(255,255,255,.35);transform:translateY(110%);transition:transform .4s var(--out);touch-action:none;visibility:hidden}
.asheet.on{transform:none;visibility:visible}
.asheet.drag{transition:none}
.asheet h4{text-align:center;font:13px var(--hv);color:#d6d6d6;margin-bottom:12px;text-shadow:0 -1px 0 #000}
.asheet .ab2{display:flex;flex-direction:column;gap:10px}
.asheet .wbtn{height:46px;border-radius:7px;font:700 17px var(--hv);color:#222;background:linear-gradient(#fff,#e6e6e6 50%,#d8d8d8 51%,#ececec);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6);display:flex;align-items:center;gap:10px;padding:0 10px}
.asheet .wbtn .sw{width:32px;height:32px;border-radius:5px;overflow:hidden;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.asheet .wbtn .sw svg{width:100%;height:100%}
.asheet .wbtn[aria-pressed=true]::after{content:"";margin-left:auto;width:14px;height:8px;border-left:3px solid #2b5ea8;border-bottom:3px solid #2b5ea8;transform:rotate(-45deg) translateY(-2px)}
.asheet .wbtn:active{background:linear-gradient(#cfd9ec,#b8c6e0)}
.asheet .cbtn{margin-top:6px;height:46px;border-radius:7px;font:700 17px var(--hv);text-shadow:0 -1px 0 #000;background:linear-gradient(#5a5a5e,#2a2a2d 50%,#1c1c1e 51%,#2b2b2e);box-shadow:inset 0 0 0 1px #000,inset 0 1px 0 rgba(255,255,255,.3)}
.asheet .cbtn:active{background:#111}

/* app view */
.appv{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;background:#000;visibility:hidden;transform:scale(.1);opacity:0}
.appv.on{visibility:visible;transform:none;opacity:1;transition:transform .42s var(--out),opacity .2s}
.appv.off{visibility:visible;transition:transform .35s var(--out),opacity .3s}
.nb{flex:none;height:calc(66px + env(safe-area-inset-top));padding:calc(22px + env(safe-area-inset-top)) 8px 0;display:flex;align-items:center;justify-content:center;position:relative;font:700 20px var(--hv);text-shadow:0 -1px 0 rgba(0,0,0,.5);
  background:linear-gradient(#b0bccd,#8699b3 50%,#6d84a2 51%,#7a8fab);box-shadow:inset 0 -1px 0 #2d3642,inset 0 1px 0 rgba(255,255,255,.4)}
.nb .bb{position:absolute;left:8px;bottom:7px;height:30px;padding:0 10px 0 14px;font:700 12.5px var(--hv);border-radius:5px;background:linear-gradient(#8fa2bb,#5a7294 50%,#4b6689 51%,#5b7495);box-shadow:inset 0 0 0 1px #2b3a50,inset 0 1px 0 rgba(255,255,255,.35);clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%)}
.nb .bb:active{background:#3f5575}
.ab_{flex:1;overflow-y:auto;position:relative}
.calc{flex:1;display:flex;flex-direction:column;background:linear-gradient(#3a3a3c,#1b1b1c);padding:10px 10px calc(28px + env(safe-area-inset-bottom))}
.calc .disp{flex:1;min-height:90px;display:flex;align-items:flex-end;justify-content:flex-end;margin-bottom:10px;padding:10px 14px;border-radius:6px;background:linear-gradient(#d9dfcf,#b9c1a9);box-shadow:inset 0 2px 5px rgba(0,0,0,.55);color:#1b1f16;font:300 50px/1 var(--hv);overflow:hidden;white-space:nowrap}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calc .keys button{height:56px;border-radius:7px;font:600 24px var(--hv);text-shadow:0 -1px 0 rgba(0,0,0,.6);background:linear-gradient(#6b6b6f,#434346 50%,#333336 51%,#404043);box-shadow:inset 0 0 0 1px #0a0a0a,inset 0 1px 0 rgba(255,255,255,.3)}
.calc .keys button.op{background:linear-gradient(#8c8c90,#626266 50%,#555559 51%,#626265);font-size:22px}
.calc .keys button.eq{background:linear-gradient(#f5a54a,#e0791a 50%,#d56c0e 51%,#e17d22)}
.calc .keys button.z{grid-column:span 2}
.calc .keys button:active{filter:brightness(.7)}
.notes{flex:1;display:flex;flex-direction:column;background:#fbf09a}
.notes .nb{background:linear-gradient(#a1795a,#7a5236 50%,#6a452b 51%,#77502f);box-shadow:inset 0 -1px 0 #3a2616,inset 0 1px 0 rgba(255,255,255,.3)}
.notes textarea{flex:1;width:100%;border:0;resize:none;outline:none;padding:10px 16px 40px 34px;font:22px/31px "Marker Felt","Chalkboard SE","HanziPen TC","PingFang TC",sans-serif;color:#2a2616;background:linear-gradient(90deg,transparent 26px,#e4b9a1 26px 27px,transparent 27px 29px,#e4b9a1 29px 30px,transparent 30px),repeating-linear-gradient(transparent 0 30px,#b8c8dc 30px 31px);background-attachment:local;-webkit-user-select:text;user-select:text}
.notes .nmeta{flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 16px calc(28px + env(safe-area-inset-bottom));font:13px var(--hv);color:#6b5c3a;background:#f4e78e}
.notes .nmeta button{height:40px;padding:0 10px;font-weight:700;color:#6b4a2b}
.clockv{flex:1;background:linear-gradient(#2a2a2c,#0d0d0e);display:flex;flex-direction:column;align-items:center;padding:24px 16px 30px}

.wl{width:100%;margin-top:20px}
.wl div{display:flex;justify-content:space-between;align-items:center;padding:12px 6px;box-shadow:inset 0 -1px 0 rgba(255,255,255,.1)}
.wl b{font:300 30px var(--hv)}
.wl span{font:15px var(--hv);color:#bbb}
.calv{flex:1;background:#f6f6f6;color:#222}

.calv .mh button{width:44px;height:36px;display:grid;place-items:center;color:#4d5b6f}
.calv .wd{display:grid;grid-template-columns:repeat(7,1fr);font:11px var(--hv);color:#555;text-align:center;padding:4px 0;background:#dfe2e7}
.calv .grid{display:grid;grid-template-columns:repeat(7,1fr)}
.calv .grid button{height:46px;font:700 17px var(--hv);color:#2e3a4b;box-shadow:inset -1px -1px 0 #c9cdd4,inset 1px 1px 0 #fff;background:#e8eaee;position:relative}
.calv .grid button.o{color:#a4abb6}
.calv .grid button.td{background:linear-gradient(#6f8db7,#3e6297);color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.4)}
.calv .grid button.sel{box-shadow:inset 0 0 0 2px #3e6297}
.calv .grid button.ev::after{content:"";position:absolute;left:50%;bottom:6px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#53627a}
.calv .grid button.td.ev::after{background:#fff}
.calv .evs{padding:10px 14px 30px;font:15px/1.5 var(--hv)}
.calv .evs div{padding:10px 0;box-shadow:inset 0 -1px 0 #d6d9de;display:flex;gap:12px}
.calv .evs time{font-weight:700;color:#3e6297;width:48px;flex:none}
.wxv{flex:1;padding:18px 14px 30px}
.wxv .card{border-radius:12px;padding:18px 16px;background:linear-gradient(#6fa3e0,#2f66b5);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 3px 6px rgba(0,0,0,.6)}
.wxv .card h2{font:700 22px var(--hv);text-shadow:0 -1px 0 rgba(0,0,0,.35)}
.wxv .card .tp{font:200 74px/1 var(--hv);margin-top:4px}
.wxv .card .d{display:flex;justify-content:space-between;padding:9px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.2);font:15px var(--hv)}

.splash .big{width:114px;height:114px;border-radius:24px;overflow:hidden;position:relative;box-shadow:0 3px 5px rgba(0,0,0,.6)}
.splash .big svg{width:100%;height:100%}
.splash .big::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.18) 48%,rgba(255,255,255,0) 50%);clip-path:ellipse(95% 52% at 50% 0%)}
.splash h2{margin-top:18px;font:700 22px var(--hv);color:#f2f1ed;text-shadow:0 -1px 0 rgba(0,0,0,.7)}
.splash p{margin-top:10px;font:15px/1.6 var(--hv);color:#e6e5e1;text-shadow:0 -1px 0 rgba(0,0,0,.6)}
.torch{flex:1;display:grid;place-items:center;background:#111;transition:background .25s}
.torch.lit{background:#fffef4}
.torch button{width:120px;height:120px;border-radius:50%;background:linear-gradient(#5c5c5f,#2b2b2d);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 6px #1d1d1f,0 0 0 7px #444;display:grid;place-items:center;font:700 18px var(--hv)}
.torch.lit button{background:linear-gradient(#fff,#e1e1e1);color:#333;box-shadow:inset 0 1px 0 #fff,0 0 0 6px #ddd,0 0 0 7px #aaa}

.toast{position:absolute;left:50%;top:calc(34px + env(safe-area-inset-top));z-index:90;transform:translate(-50%,-120px);padding:9px 14px;border-radius:8px;background:rgba(0,0,0,.78);box-shadow:0 0 0 1px rgba(255,255,255,.25);font:600 13.5px var(--hv);white-space:nowrap;visibility:hidden;transition:transform .4s var(--spring),visibility 0s .4s}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .4s var(--spring)}

};
function iconSVG(id){ return '<svg viewBox="0 0 60 60" aria-hidden="true">'+APPS[id].g()+'</svg>'; }

/* ---------- layout model ---------- */
var DEF = {pages:[['msg','cal','photos','cam','wx','clock','maps','notes','calc','set','stock','mrt','inv','rail','card','f1'],['post','rec','books','torch']], dock:['phone','mail','web','music'], folders:{f1:{name:'生活', apps:['night','boba','bfast','typh']}}};
var L = load('layout', null);
function valid(l){ try{ var seen = {}; var ok = l && Array.isArray(l.pages) && Array.isArray(l.dock) && l.folders; if(!ok) return false; var all = [].concat.apply([], l.pages).concat(l.dock); all.forEach(function(id){ if(id[0]==='f'){ if(!l.folders[id]) ok = false; } else if(!APPS[id]) ok = false; }); return ok; }catch(e){ return false; } }
if(!valid(L)) L = JSON.parse(JSON.stringify(DEF));
var wp = load('wp', 'tamsui'); if(!WP[wp]) wp = 'tamsui';
var notesTxt = load('notes', '買菜：\n空心菜、豆干、雞蛋一盒\n\n週六 10:00 牙醫\n繳電費 NT$ 1,342');
var dismissed = load('nc', []);
function persist(){ save('layout', L); save('wp', wp); save('notes', notesTxt); save('nc', dismissed); }

/* ---------- geometry ---------- */
var W = 390, H = 800, CW, IS, RH, ROWS, TOP = 12, PAD = 8, page = 0, edit = false;
function geo(){ var sc = $('screen'); W = sc.clientWidth; H = sc.clientHeight; CW = (W - PAD*2)/4; IS = Math.min(62, Math.round(CW - 28)); RH = IS + 34;
  var vpH = H - (22) - 96 - 26; ROWS = Math.max(4, Math.min(6, Math.floor((vpH - TOP)/RH)));
  var vp = $('vp'); vp.style.height = vpH+'px'; $('dots').style.top = (22 + vpH)+'px';
  sc.style.setProperty('--cw', CW+'px'); sc.style.setProperty('--is', IS+'px'); }
function cap(){ return ROWS*4; }
function slotXY(p, i){ return {x: PAD + (i%4)*CW + (p+1)*W, y: TOP + Math.floor(i/4)*RH}; }
function dockXY(i, n){ var w = W/4, off = (W - n*w)/2; return {x: off + i*w + (w-CW)/2, y: 96 - 58 - IS + 2 - 6}; }

/* ---------- render ---------- */
var els = {};
function mkIcon(id){ var b = document.createElement('button'); b.className = 'ic'; b.dataset.id = id; var isF = id[0]==='f';
  if(isF){ b.classList.add('isfold'); var f = L.folders[id]; b.innerHTML = '<span class="art fold">'+f.apps.slice(0,9).map(iconSVG).join('')+'</span><span class="lb"></span>'; b.querySelector('.lb').textContent = f.name; b.setAttribute('aria-label', '資料夾 '+f.name); }
  else { var a = APPS[id]; b.innerHTML = '<span class="art">'+iconSVG(id)+'</span><span class="lb">'+a.n+'</span>'; b.setAttribute('aria-label', a.n); if(!a.sys) b.classList.add('del'); }
  if(!isF && !APPS[id].sys || false){ var x = document.createElement('span'); x.className = 'x'; x.setAttribute('role','button'); x.setAttribute('aria-label','刪除 '+APPS[id].n); x.innerHTML = '<i><svg width="11" height="11" viewBox="0 0 11 11"><path d="M2 2l7 7M9 2 2 9" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></i>'; b.appendChild(x); }
  return b; }
function render(){ geo(); var strip = $('strip'), dock = $('dock'), keep = {};
  // spotlight page
  if(!$('spot')){ var sp = document.createElement('div'); sp.className = 'spot'; sp.id = 'spot'; sp.innerHTML = '<label class="sfield"><svg width="15" height="15" viewBox="0 0 15 15"><circle cx="6" cy="6" r="4.6" fill="none" stroke="#888" stroke-width="1.8"/><path d="M9.5 9.5 14 14" stroke="#888" stroke-width="2" stroke-linecap="round"/></svg><input id="sq" type="search" placeholder="搜尋 iPhone" aria-label="搜尋 App"></label><div class="sres" id="sres"></div>'; strip.appendChild(sp);
    $('sq').addEventListener('input', spot); $('sres').addEventListener('click', function(e){ var b = e.target.closest('[data-launch]'); if(b) launch(b.dataset.launch, null); }); }
  $('spot').style.left = '0px'; $('spot').style.width = W+'px';
  L.pages.forEach(function(pg, p){ pg.forEach(function(id, i){ var el = els[id] || (els[id] = mkIcon(id)); if(el.parentNode !== strip && !el.classList.contains('dragging')) strip.appendChild(el); if(!el.classList.contains('dragging')){ var q = slotXY(p, i); el.style.left = q.x+'px'; el.style.top = q.y+'px'; } keep[id] = 1; }); });
  L.dock.forEach(function(id, i){ var el = els[id] || (els[id] = mkIcon(id)); if(el.parentNode !== dock && !el.classList.contains('dragging')) dock.appendChild(el); if(!el.classList.contains('dragging')){ var q = dockXY(i, L.dock.length); el.style.left = q.x+'px'; el.style.top = q.y+'px'; } el.querySelector('.lb').style.display = ''; keep[id] = 1; });
  Object.keys(els).forEach(function(id){ if(!keep[id]){ els[id].remove(); delete els[id]; } });
  // dots
  var d = '<button data-p="-1" aria-label="搜尋頁" aria-current="'+(page===-1)+'"><svg width="11" height="11" viewBox="0 0 11 11"><circle cx="4.5" cy="4.5" r="3.3" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M7 7l3 3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></button>';
  L.pages.forEach(function(_, p){ d += '<button data-p="'+p+'" aria-label="第 '+(p+1)+' 頁" aria-current="'+(p===page)+'"><i></i></button>'; }); $('dots').innerHTML = d;
  setStrip(false); }
function setStrip(anim, dx){ var s = $('strip'); s.classList.toggle('snap', !!anim); s.style.transform = 'translateX('+(-(page+1)*W + (dx||0))+'px)'; }
function goPage(p){ p = Math.max(-1, Math.min(L.pages.length-1, p)); if(p !== page){ click(.2); haptic(4); } page = p; setStrip(true); document.querySelectorAll('#dots button').forEach(function(b){ b.setAttribute('aria-current', +b.dataset.p===page); }); if(page===-1) spot(); }
$('dots').addEventListener('click', function(e){ var b = e.target.closest('[data-p]'); if(b) goPage(+b.dataset.p); });

/* ---------- spotlight ---------- */
function spot(){ var q = ($('sq').value||'').trim(), ids = Object.keys(APPS).filter(function(id){ return !q || APPS[id].n.indexOf(q) >= 0; });
  $('sres').innerHTML = (q ? '' : '<p>最近使用</p>') + (ids.length ? ids.slice(0, q?20:6).map(function(id){ return '<button data-launch="'+id+'"><span class="mini">'+iconSVG(id)+'</span>'+APPS[id].n+'</button>'; }).join('') : '<p>找不到「'+q.replace(/[<>&]/g,'')+'」</p>'); }

/* ---------- gestures: swipe pages, long-press, drag ---------- */
var pd = null, suppressClick = false, drag = null;
function locate(id){ for(var p=0;p<L.pages.length;p++){ var i = L.pages[p].indexOf(id); if(i>=0) return {list:L.pages[p], p:p, i:i}; } var j = L.dock.indexOf(id); if(j>=0) return {list:L.dock, p:'dock', i:j}; return null; }
$('sb').addEventListener('pointerdown', function(e){ if(pd || !e.isPrimary || e.button > 0 || $('screen').classList.contains('app-open') || fOpen) return; var ic = e.target.closest('.ic'), sr = $('screen').getBoundingClientRect();
  if(e.target.closest('.x')) return;
  pd = {x:e.clientX, y:e.clientY, t:e.timeStamp, ic:ic, mode:null, sr:sr, id:e.pointerId};
  if(ic){ pd.lp = setTimeout(function(){ if(!pd || pd.mode) return; if(!edit){ enterEdit(); } pd.mode = 'armed'; haptic(15); }, edit ? 160 : 520); }
  else if(!e.target.closest('.dots,.spot,.dock')) { pd.lp = setTimeout(function(){ if(!pd || pd.mode || edit) return; pd.mode = 'done'; suppressClick = true; openSheet(); }, 700); }
});
$('sb').addEventListener('pointermove', function(e){ if(!pd || e.pointerId !== pd.id) return; var dx = e.clientX - pd.x, dy = e.clientY - pd.y;
  if(!pd.mode){ if(Math.abs(dx) > 9 && Math.abs(dx) > Math.abs(dy)){ clearTimeout(pd.lp); if(edit && pd.ic){ pd.mode = 'armed'; } else { pd.mode = 'swipe'; try{ $('sb').setPointerCapture(e.pointerId); }catch(_){} } } else if(Math.abs(dy) > 12){ clearTimeout(pd.lp); if(edit && pd.ic) pd.mode = 'armed'; else pd.mode = 'none'; } }
  if(pd.mode === 'armed' && (Math.abs(dx) > 4 || Math.abs(dy) > 4)){ startDrag(pd.ic, e); pd.mode = 'drag'; }
  if(pd.mode === 'swipe'){ var rub = (page===-1 && dx>0) || (page===L.pages.length-1 && dx<0) ? dx/3 : dx; setStrip(false, rub); }
  if(pd.mode === 'drag') moveDrag(e); });
function up(e){ if(!pd || e.pointerId !== pd.id) return; clearTimeout(pd.lp); var p = pd; pd = null;
  if(p.mode === 'swipe'){ var dx = e.clientX - p.x, v = dx/Math.max(1, e.timeStamp - p.t); suppressClick = true; setTimeout(function(){ suppressClick = false; }, 50); if(dx < -W*.22 || v < -.45) goPage(page+1); else if(dx > W*.22 || v > .45) goPage(page-1); else setStrip(true); }
  else if(p.mode === 'drag'){ endDrag(); suppressClick = true; setTimeout(function(){ suppressClick = false; }, 50); }
  else if(p.mode === 'armed'){ suppressClick = true; setTimeout(function(){ suppressClick = false; }, 50); }
  else if(p.mode === 'done'){ setTimeout(function(){ suppressClick = false; }, 50); }
  else if(!p.ic && edit && !e.target.closest('.dots,.spot')){ exitEdit(); } }
$('sb').addEventListener('pointerup', up);
function cancelPointer(e){ if(!pd || (e && e.pointerId !== undefined && e.pointerId !== pd.id)) return; if(pd.mode==='drag') endDrag(true); clearTimeout(pd.lp); pd = null; setStrip(true); }
$('sb').addEventListener('pointercancel', cancelPointer);
$('sb').addEventListener('lostpointercapture', cancelPointer);
window.addEventListener('blur', function(){ cancelPointer(); });
$('sb').addEventListener('contextmenu', function(e){ e.preventDefault(); });
$('sb').addEventListener('click', function(e){ if(suppressClick){ e.preventDefault(); return; } var x = e.target.closest('.x'); if(x){ askDelete(x.closest('.ic').dataset.id); return; }
  var ic = e.target.closest('.ic'); if(!ic || edit && !ic.classList.contains('isfold')) return; var id = ic.dataset.id; if(id[0]==='f') openFolder(id); else launch(id, ic); });
$('sb').addEventListener('keydown', function(e){ var ic = e.target.closest('.ic'); if(!ic) return; if(e.key==='Delete' || e.key==='Backspace'){ if(ic.classList.contains('del')) askDelete(ic.dataset.id); } if(e.key==='ArrowRight' && e.altKey) goPage(page+1); });

function enterEdit(){ if(edit) return; edit = true; $('sb').classList.add('edit'); click(.3); toast('按主畫面鍵或點空白處完成'); }
function exitEdit(){ if(!edit) return; edit = false; $('sb').classList.remove('edit'); cleanPages(); render(); persist(); haptic(6); }
function cleanPages(){ L.pages = L.pages.filter(function(p, i){ return p.length || i === 0; }); if(page > L.pages.length-1) page = L.pages.length-1; }

function startDrag(ic, e){ var id = ic.dataset.id, r = ic.getBoundingClientRect(), sr = $('screen').getBoundingClientRect();
  drag = {id:id, el:ic, snapshot:JSON.parse(JSON.stringify(L)), startPage:page, gx:e.clientX - r.left, gy:e.clientY - r.top, ox:r.left - sr.left, oy:r.top - sr.top, dx:0, dy:0, sr:sr, hover:null, hoverT:0, edgeT:0, edgeDir:0, ftarget:null};

  function end(e){ if(!on) return; on = false; s.classList.remove('drag'); if(dy > s.offsetHeight*.35 || dy/Math.max(1, e.timeStamp - t0) > .6) closeSheet(); else s.style.transform = ''; }
  s.addEventListener('pointerup', end); s.addEventListener('pointercancel', end); })();

/* ---------- notification centre ---------- */
var NOTES = [
 {id:'mrt', app:'mrt', items:[['板南線','往南港展覽館 列車因月台門異常，約延誤 5 分鐘。','3 分鐘前'],['淡水信義線','今晚 22:00 起淡水站 2 號出口暫停使用。','1 小時前']]},
 {id:'cal', app:'cal', items:[['回家吃飯','今天 19:30','行事曆']]},
 {id:'inv', app:'inv', items:[['發票開獎','7–8 月統一發票已開獎，你有 2 張載具發票待對獎。','昨天']]},
 {id:'msg', app:'msg', items:[['阿姐','晚上回來吃飯嗎？媽煮了滷肉。','下午 3:40']]}
];
function renderNC(){ var d = new Date(), list = NOTES.filter(function(n){ return dismissed.indexOf(n.id) < 0; });
  $('ncBody').innerHTML = '<div class="wx"><svg width="42" height="42" viewBox="0 0 60 60"><circle cx="24" cy="24" r="10" fill="#ffd23a"/><path d="M18 44a8 8 0 0 1 3-15 10 10 0 0 1 19-1 8 8 0 0 1 3 16z" fill="#fff"/></svg><b>30°</b><span>台北市<br>午後雷陣雨　最高 33° 最低 26°</span></div>'+
    (list.length ? list.map(function(n){ return '<div class="nsec"><h3><span class="mini">'+iconSVG(n.app)+'</span>'+APPS[n.app].n+'<button data-dis="'+n.id+'" aria-label="清除 '+APPS[n.app].n+' 通知"><i><svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 1l6 6M7 1 1 7" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></i></button></h3>'+n.items.map(function(it){ return '<div class="n"><b>'+it[0]+'</b>'+it[1]+'<br><small>'+it[2]+'</small></div>'; }).join('')+'</div>'; }).join('') : '<p class="empty">沒有通知</p>')+
    (dismissed.length ? '<p class="empty"><button data-restore style="min-height:44px;padding:0 12px;font-weight:700">還原示範通知</button></p>' : ''); }
$('ncBody').addEventListener('click', function(e){ var b = e.target.closest('[data-dis]'); if(b){ dismissed.push(b.dataset.dis); persist(); renderNC(); click(.3); haptic(6); return; } if(e.target.closest('[data-restore]')){ dismissed = []; persist(); renderNC(); click(.3); } });
function openNC(){ renderNC(); var n = $('nc'); n.style.transform = ''; n.classList.add('on'); n.setAttribute('aria-hidden','false'); click(.25); haptic(6); }
function closeNC(){ var n = $('nc'); n.classList.remove('on','drag'); n.style.transform = ''; n.setAttribute('aria-hidden','true'); }
(function(){ var pull = $('ncPull'), sy = 0, dy = 0, on = false, t0 = 0, n = $('nc');
  pull.addEventListener('click', function(){ if(!n.classList.contains('on')) openNC(); });
  pull.addEventListener('pointerdown', function(e){ on = true; sy = e.clientY; dy = 0; t0 = e.timeStamp; try{ pull.setPointerCapture(e.pointerId); }catch(_){} });
  pull.addEventListener('pointermove', function(e){ if(!on) return; dy = e.clientY - sy; if(dy > 8){ renderNC(); n.classList.add('drag'); n.style.transform = 'translateY('+Math.min(0, -H + dy)+'px)'; } });
  pull.addEventListener('pointerup', function(e){ if(!on) return; on = false; if(dy > 8){ n.classList.remove('drag'); if(dy > H*.3 || dy/Math.max(1, e.timeStamp - t0) > .6) openNC(); else { n.style.transform = ''; } } });
  var g = $('ncGrip'), gy = 0, gd = 0, gon = false, gt = 0;
  g.addEventListener('pointerdown', function(e){ gon = true; gy = e.clientY; gd = 0; gt = e.timeStamp; n.classList.add('drag'); try{ g.setPointerCapture(e.pointerId); }catch(_){} });
  g.addEventListener('pointermove', function(e){ if(!gon) return; gd = Math.min(0, e.clientY - gy); n.style.transform = 'translateY('+gd+'px)'; });
  g.addEventListener('pointerup', function(e){ if(!gon) return; gon = false; n.classList.remove('drag'); if(gd < -H*.2 || gd/Math.max(1, e.timeStamp - gt) < -.5 || Math.abs(gd) < 4) closeNC(); else n.style.transform = ''; }); })();

/* ---------- misc ---------- */
var tT = null; function toast(m){ var t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(function(){ t.classList.remove('on'); }, 2200); }
function tick(){ var d = new Date(), h = d.getHours(); $('clock').textContent = (h < 12 ? '上午' : '下午')+(h%12||12)+':'+String(d.getMinutes()).padStart(2,'0');
  ['clock','cal'].forEach(function(id){ var el = els[id]; if(el) el.querySelector('.art').innerHTML = iconSVG(id); }); }
try{ navigator.getBattery && navigator.getBattery().then(function(b){ $('batt').textContent = Math.round(b.level*100)+'%'; }).catch(function(){}); }catch(e){}
setInterval(function(){ if(!document.hidden) tick(); }, 15000);
addEventListener('resize', function(){ render(); });
paintWall(); render(); tick(); persist();
})();
</script>
