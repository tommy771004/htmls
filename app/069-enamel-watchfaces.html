<style>
:root{
  --steel:#16295a;--steel2:#1c3370;--steel3:#244089;--enamel:#f6f5ef;--mist:#aebbdc;--dim:#8595c0;
  --gold:#c9a24a;--gold2:#e7cf8c;--gold3:#9c7a2c;
  --serif:"Charter","Bitstream Charter","Iowan Old Style","PingFang TC","Heiti TC",serif;
  --out:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.3,.5,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.5 var(--serif);color:var(--enamel);background:var(--steel);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
svg{display:block}
.num{font-variant-numeric:tabular-nums lining-nums}

/* ---------- stage ---------- */
.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;
  background:repeating-linear-gradient(118deg,rgba(255,255,255,.028) 0 7px,rgba(0,0,0,.035) 7px 14px),linear-gradient(165deg,#1d3677,#16295a 45%,#111f47)}
@media (min-width:521px){
  body{background:#0f1c40}
  .stage{display:flex;align-items:center;justify-content:center;gap:64px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:60px;padding:11px;z-index:1;
    background:linear-gradient(135deg,#efe0b0,#b8923a 26%,#7d5e1e 52%,#d9bf7c 78%,#9c7a2c);box-shadow:inset 0 0 0 1px rgba(255,245,210,.6),inset 0 0 0 3px #5a4212,0 18px 28px -18px rgba(5,10,30,.8)}
  .screen{inset:11px;border-radius:49px}
  .caption{display:block;position:relative;z-index:1;max-width:240px}
  .caption h1{font:700 40px/1 var(--serif);color:var(--enamel);letter-spacing:.06em}
  .caption h1 i{font-style:italic;color:var(--gold2);font-weight:400;font-size:22px;margin-left:8px;letter-spacing:0}
  .caption p{margin-top:14px;font-size:15px;line-height:1.8;color:var(--mist)}
}
@media (min-width:521px) and (max-width:860px){.caption{display:none}}

/* ---------- status + header ---------- */
.sb{flex:none;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 34px;display:flex;align-items:center;justify-content:space-between;font:600 15px/1 var(--serif)}
.sb .gl{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.sb{display:none}}
.hdr{flex:none;display:flex;align-items:center;height:50px;padding:0 10px 0 22px;gap:2px}
.hdr h2{font:700 22px/1 var(--serif);letter-spacing:.08em}
.hdr h2 small{font:italic 400 14px/1 var(--serif);color:var(--gold2);margin-left:8px;letter-spacing:0}
.hdr .sp{flex:1}
.ib{height:44px;min-width:44px;display:grid;place-items:center;border-radius:12px;padding:0 6px;font-size:14px;color:var(--enamel);transition:background-color .2s}
.ib:active{background:rgba(246,245,239,.1)}
.sync{display:flex;align-items:center;gap:6px;padding:0 12px;height:36px;border-radius:18px;background:var(--enamel);color:var(--steel);font-weight:700;font-size:14px;position:relative;overflow:hidden;transition:background-color .2s}
.sync:active{background:#dcdcd2}
.sync .bar{position:absolute;left:0;top:0;bottom:0;width:100%;background:var(--gold2);transform-origin:left;transform:scaleX(0);z-index:0}
.sync span,.sync svg{position:relative;z-index:1}

/* ---------- watch ---------- */
.stageW{position:relative;flex:1;min-height:200px;display:grid;place-items:center;touch-action:pan-y}
.watch{position:relative;height:100%;max-height:360px;aspect-ratio:320/360;max-width:94%}
.watch svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.watch.swap{animation:swap .5s var(--out)}
@keyframes swap{0%{transform:translateX(var(--dx,40px)) rotate(var(--rot,6deg))}100%{transform:none}}
.slot{cursor:pointer}
.slot .ring{fill:none;stroke:transparent}
.editing .slot .ring{stroke:var(--gold);stroke-dasharray:3 3;stroke-width:1.4}
.slot.hot .ring{stroke:var(--gold2);stroke-dasharray:none;stroke-width:2.6}
.crown{cursor:ns-resize}
.meta{flex:none;text-align:center;padding:2px 20px 0}
.meta b{display:block;font:700 21px/1.2 var(--serif);letter-spacing:.06em}
.meta span{display:block;font:italic 14px/1.4 var(--serif);color:var(--mist)}
.thumbs{flex:none;display:flex;gap:10px;overflow-x:auto;padding:10px 18px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.thumbs::-webkit-scrollbar{display:none}
.thumbs button{flex:none;width:58px;height:58px;border-radius:50%;scroll-snap-align:center;position:relative;transition:transform .25s var(--out)}
.thumbs button svg{width:58px;height:58px}
.thumbs button:active{transform:scale(.92)}
.thumbs button[aria-pressed=true] .sel{stroke:var(--gold2)}

/* ---------- editor panel ---------- */
.panel{flex:none;height:228px;display:flex;flex-direction:column;margin-top:8px;background:rgba(8,16,40,.34);border-radius:26px 26px 0 0;box-shadow:inset 0 1px 0 rgba(174,187,220,.12)}
.tabs{flex:none;display:flex;justify-content:center;gap:4px;padding:6px 10px 0}
.tabs button{height:44px;padding:0 14px;font-size:15px;color:var(--dim);letter-spacing:.06em;transition:color .2s}
.tabs button[aria-selected=true]{color:var(--gold2);font-weight:700}
.tabs button:active{color:var(--enamel)}
.pbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px calc(30px + env(safe-area-inset-bottom));scrollbar-width:none;overscroll-behavior:contain}
.pbody::-webkit-scrollbar{display:none}
.pp[hidden]{display:none}
.pp.in{animation:ppin .3s var(--out)}
@keyframes ppin{from{transform:translateY(8px)}}
.lab{font-size:13px;color:var(--mist);margin:8px 0 4px;letter-spacing:.04em}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;padding:4px 0;border-radius:12px;font-size:13px;color:var(--mist)}
.sw button svg{width:34px;height:34px}
.sw button[aria-pressed=true]{color:var(--gold2);font-weight:700}
.sw button[aria-pressed=true] .o{stroke:var(--gold2);stroke-width:2}
.sw button:active{background:rgba(246,245,239,.08)}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tray button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 2px;border-radius:12px;font-size:13px;color:var(--mist);touch-action:none}
.tray button svg{width:44px;height:44px}
.tray button.used{color:var(--gold2)}
.tray button.pick{background:rgba(231,207,140,.14);color:var(--enamel)}
.tray button:active{background:rgba(246,245,239,.08)}
.tip{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.6}
.rowt{display:flex;align-items:center;justify-content:space-between;min-height:48px;box-shadow:inset 0 -1px 0 rgba(174,187,220,.12)}
.rowt span small{display:block;font-size:13px;color:var(--dim)}
.tog{position:relative;width:50px;height:30px;border-radius:15px;background:rgba(174,187,220,.25);flex:none;transition:background-color .25s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--enamel);transition:transform .3s var(--spring)}
.tog[aria-checked=true]{background:var(--gold)}
.tog[aria-checked=true]::after{transform:translateX(20px)}
.ghost{position:absolute;z-index:80;width:54px;height:54px;margin:-27px 0 0 -27px;pointer-events:none;transition:transform .15s}
.ghost svg{width:54px;height:54px;filter:drop-shadow(1px 3px 2px rgba(5,10,30,.45))}
.homeind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--enamel);z-index:90;pointer-events:none}

/* ---------- sheet ---------- */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(6,12,32,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;max-height:82%;display:flex;flex-direction:column;background:#f4f3ec;color:#16295a;border-radius:28px 28px 0 0;transform:translateY(calc(100% + 30px));transition:transform .45s var(--spring);touch-action:none}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.grip{flex:none;padding:9px 0 6px;cursor:grab}
.grip i{display:block;width:40px;height:5px;border-radius:3px;background:rgba(22,41,90,.22);margin:0 auto}
.sbody{overflow-y:auto;padding:4px 22px calc(26px + env(safe-area-inset-bottom));touch-action:pan-y}
.sbody h4{font:700 22px/1.3 var(--serif);letter-spacing:.04em}
.sbody .sub{font-size:14px;color:#5a6a92;margin-top:2px}
.mine{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;margin-top:14px}
.mine .it{display:flex;flex-direction:column;align-items:center;gap:4px}
.mine .it>button:first-child{width:86px;height:86px;border-radius:50%}
.mine .it>button:first-child:active{transform:scale(.95)}
.mine .it svg{width:86px;height:86px}
.mine .it b{font-size:13px;line-height:1.3;text-align:center}
.mine .del{height:32px;padding:0 10px;font-size:13px;color:#9a3b2b;border-radius:10px}
.mine .del:active{background:rgba(154,59,43,.1)}
.addmine{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;margin-top:18px;border-radius:14px;background:#16295a;color:#f6f5ef;font-weight:700;font-size:16px}
.addmine:active{background:#244089}
.empty{grid-column:1/-1;padding:24px 0;text-align:center;color:#5a6a92;line-height:1.8}

.toast{position:absolute;left:50%;top:calc(56px + env(safe-area-inset-top));z-index:95;display:flex;align-items:center;gap:10px;max-width:90%;transform:translate(-50%,-160%);visibility:hidden;padding:10px 8px 10px 18px;min-height:46px;border-radius:14px;background:var(--enamel);color:var(--steel);font:600 14px/1.4 var(--serif);transition:transform .45s var(--spring),visibility 0s .45s;white-space:nowrap}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .45s var(--spring)}
.toast button{height:34px;padding:0 10px;border-radius:10px;color:#9c7a2c;font-weight:700}
.toast button[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  .watch.swap,.pp.in{animation:none}
  .sheet,.toast,.tog::after{transition:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><svg id="bd" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"></svg></div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
var KEY = 'app069:';
function load(k, d){ try { var v = localStorage.getItem(KEY + k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch(e){} }
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var S = load('settings', {tick:false, haptic:true});
function haptic(p){ if (!S.haptic) return; try { navigator.vibrate && navigator.vibrate(p || 8); } catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// ---------- sound: escapement, ratchet, chime ----------
var ac = null;
function audio(){ try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e){ ac = null; } return ac; }
function click(freq, vol, dur){
  var a = audio(); if (!a) return; var t = a.currentTime, n = Math.floor(a.sampleRate * (dur || .018)), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4);
  var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = b; f.type = 'bandpass'; f.frequency.value = freq || 4200; f.Q.value = 3; g.gain.value = vol || .25;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t);
}
function chime(){
  var a = audio(); if (!a) return; var t = a.currentTime;
  [1318.5, 1760, 2637].forEach(function(fq, i){ var o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = fq; g.gain.setValueAtTime(0, t + i * .11); g.gain.linearRampToValueAtTime(.08, t + i * .11 + .005); g.gain.exponentialRampToValueAtTime(.0001, t + i * .11 + 1.4); o.connect(g); g.connect(a.destination); o.start(t + i * .11); o.stop(t + i * .11 + 1.5); });
}

// ---------- catalogue ----------
var STYLES = [
  {id:'feu', name:'大明火', en:'Grand Feu', pat:'plain', dial:'white', hands:'breguet', hc:'blue', nums:'breguet', comps:{top:null, left:null, right:null, bottom:'secs'}},
  {id:'orge', name:'麥穗紋', en:'Grain d’orge', pat:'rose', dial:'blue', hands:'leaf', hc:'gold', nums:'roman', comps:{top:'moon', left:null, right:'date', bottom:null}},
  {id:'soleil', name:'太陽紋', en:'Soleil', pat:'sun', dial:'black', hands:'dauphine', hc:'gold', nums:'index', comps:{top:null, left:'chrono', right:'power', bottom:'secs'}},
  {id:'clous', name:'巴黎釘紋', en:'Clous de Paris', pat:'clous', dial:'white', hands:'dauphine', hc:'blue', nums:'breguet', comps:{top:'date', left:'world', right:null, bottom:null}},
  {id:'vague', name:'海浪紋', en:'Vagues', pat:'wave', dial:'gold', hands:'breguet', hc:'blue', nums:'roman', comps:{top:null, left:'steps', right:'temp', bottom:null}}
];
var DIALS = {white:{n:'琺瑯白', base:'#f7f6f0', edge:'#e4e2d8', line:'rgba(96,104,140,.22)', ink:'#1a2a52', sub:'#ecebe3'},
  blue:{n:'藍鋼琺瑯', base:'#2449a8', edge:'#16307a', line:'rgba(190,210,255,.30)', ink:'#f4f2ea', sub:'#1d3d93'},
  black:{n:'黑琺瑯', base:'#191713', edge:'#0b0a08', line:'rgba(255,248,230,.13)', ink:'#efe7d2', sub:'#221f1a'},
  gold:{n:'金面', base:'#d9ba6c', edge:'#b08c3a', line:'rgba(96,66,10,.28)', ink:'#34260a', sub:'#cfae5c'}};
var HC = {blue:{n:'藍鋼', a:'#1f47b0', b:'#4a72d6'}, gold:{n:'金', a:'#b8923a', b:'#ecd697'}};
var CASES = {gold:{n:'黃金', a:'#f1e2b0', b:'#b8923a', c:'#7d5e1e'}, steel:{n:'精鋼', a:'#f2f3f5', b:'#aeb4c0', c:'#6b7383'}};
var COMPS = {date:'日期', moon:'月相', world:'東京時間', power:'動力儲存', chrono:'計時碼錶', secs:'小秒針', steps:'步數', temp:'台北氣溫'};
var SLOTS = {top:[160, 124], left:[112, 172], right:[208, 172], bottom:[160, 220]};

var cur = load('face', null) || clone(STYLES[0]);
if (!cur.caseM) cur.caseM = 'gold';
var mine = load('mine', null) || [Object.assign(clone(STYLES[1]), {caseM:'steel', label:'週末藍'}), Object.assign(clone(STYLES[2]), {caseM:'gold', label:'會議用'})];
var power = load('power', 58), chrono = load('chrono', {run:false, t0:0, acc:0});
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function persist(){ save('face', cur); save('mine', mine); save('power', power); save('chrono', chrono); save('settings', S); }

// ---------- geometry helpers ----------
function pol(cx, cy, r, deg){ var a = (deg - 90) * Math.PI / 180; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; }
function f(n){ return n.toFixed(2); }

// ---------- guilloché ----------
function guilloche(pat, cx, cy, R, stroke, dense){

    '<div class="lab">時標</div><div class="sw">' + Object.keys(nums).map(function(k){ return '<button data-nums="' + k + '" aria-pressed="' + (cur.nums === k) + '"><svg viewBox="0 0 34 34"><circle class="o" cx="17" cy="17" r="15.5" fill="none" stroke="rgba(174,187,220,.35)"/><text x="17" y="17.5" font-size="' + (k === 'roman' ? 11 : 15) + '" fill="#f6f5ef" text-anchor="middle" dominant-baseline="central" font-family="Charter,serif"' + (k === 'breguet' ? ' font-style="italic"' : '') + '>' + (k === 'breguet' ? '12' : k === 'roman' ? 'XII' : '') + '</text>' + (k === 'index' ? '<rect x="15" y="9" width="4" height="16" rx="1" fill="#c9a24a"/>' : '') + '</svg>' + nums[k] + '</button>'; }).join('') + '</div>' +
    '<div class="rowt"><span>秒針掃動<small>' + (cur.sweep === false ? '石英跳秒' : '機械式每秒八跳') + '</small></span><button class="tog" id="tSweep" role="switch" aria-checked="' + (cur.sweep !== false) + '" aria-label="秒針掃動"></button></div>' +
    '<div class="rowt"><span>擒縱聲<small>聽得到擺輪的滴答</small></span><button class="tog" id="tTick" role="switch" aria-checked="' + S.tick + '" aria-label="擒縱聲"></button></div>' +
    '<div class="rowt"><span>觸覺回饋</span><button class="tog" id="tHap" role="switch" aria-checked="' + S.haptic + '" aria-label="觸覺回饋"></button></div>';
  $('tSweep').addEventListener('click', function(){ cur.sweep = cur.sweep === false; persist(); this.setAttribute('aria-checked', cur.sweep); this.previousElementSibling.querySelector('small').textContent = cur.sweep ? '機械式每秒八跳' : '石英跳秒'; haptic(6); click(3000, .2); });

var tab = 'color', pick = null;

function applyStyle(i, dir){

function styleIndex(){ for (var i = 0; i < STYLES.length; i++) if (STYLES[i].pat === cur.pat) return i; return 0; }
// swipe the watch to flip through the gallery
(function(){

// ---------- slots: tap (chrono / pick placement) ----------
var lpT = null, lpDone = false;
$('wsvg').addEventListener('pointerdown', function(e){

  if (t === 'chrono'){ lpDone = false; clearTimeout(lpT); lpT = setTimeout(function(){ lpDone = true; chrono = {run:false, t0:0, acc:0}; persist(); haptic([10, 30, 10]); click(1800, .3); toast('計時歸零'); }, 600); }
});
$('wsvg').addEventListener('pointerup', function(e){

    persist(); haptic(12); click(1500, .35, .03);
  } else if (t === 'moon' && tab !== 'comp'){ var age = moonAge(new Date()); toast('月齡 ' + age.toFixed(1) + ' 天・' + (age < 1.5 || age > 28 ? '新月' : age < 7 ? '眉月' : age < 8.8 ? '上弦' : age < 14 ? '盈凸' : age < 16 ? '滿月' : age < 22 ? '虧凸' : age < 23.8 ? '下弦' : '殘月')); haptic(5); }

function place(t, k){
  Object.keys(cur.comps).forEach(function(s){ if (cur.comps[s] === t) cur.comps[s] = null; });
  cur.comps[k] = t; delete cur.label; persist(); haptic([8, 20, 8]); click(2000, .3, .03); renderWatch(false); renderComp();

// ---------- drag complications ----------
var dragging = null, dragMoved = false, ghost = null;
function startDrag(e, type, fromSlot){
  dragging = {type:type, from:fromSlot || null, sx:e.clientX, sy:e.clientY}; dragMoved = false;
  try { e.target.setPointerCapture && e.target.releasePointerCapture && e.target.releasePointerCapture(e.pointerId); } catch(x){}
}
$('p-comp').addEventListener('pointerdown', function(e){ var b = e.target.closest('[data-comp]'); if (!b) return; startDrag(e, b.dataset.comp, null); });
function slotAt(x, y){
  var hit = null;
  document.querySelectorAll('#wsvg .slot').forEach(function(g){ var r = g.querySelector('.ring').getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2; if (Math.hypot(x - cx, y - cy) < r.width * .75) hit = g; });
  return hit;
}
window.addEventListener('pointermove', function(e){
  if (!dragging) return;
  if (!dragMoved && Math.hypot(e.clientX - dragging.sx, e.clientY - dragging.sy) < 8) return;
  var scr = $('screen').getBoundingClientRect();
  if (!dragMoved){ dragMoved = true; ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.innerHTML = compIcon(dragging.type); $('screen').appendChild(ghost); haptic(6); $('watch').classList.add('editing'); }
  ghost.style.left = (e.clientX - scr.left) + 'px'; ghost.style.top = (e.clientY - scr.top) + 'px';
  var hit = slotAt(e.clientX, e.clientY);
  document.querySelectorAll('#wsvg .slot').forEach(function(g){ g.classList.toggle('hot', g === hit); });
});
window.addEventListener('pointerup', function(e){
  if (!dragging) return;
  var d = dragging; dragging = null;
  if (ghost){ ghost.remove(); ghost = null; }
  document.querySelectorAll('#wsvg .slot').forEach(function(g){ g.classList.remove('hot'); });
  if (!dragMoved){ setTimeout(function(){ dragMoved = false; }, 0); return; }
  var hit = slotAt(e.clientX, e.clientY);
  if (hit){ place(d.type, hit.dataset.slot); toast(COMPS[d.type] + ' 放上錶盤'); }
  else if (d.from){
    var wr = $('watch').getBoundingClientRect(), inside = e.clientX > wr.left && e.clientX < wr.right && e.clientY > wr.top && e.clientY < wr.bottom;
    if (!inside){ var prev = clone(cur); cur.comps[d.from] = null; delete cur.label; persist(); haptic([10, 30, 10]); click(1200, .3, .04); renderWatch(false); renderComp(); toast('移除 ' + COMPS[d.type], function(){ cur = prev; persist(); renderWatch(false); renderComp(); }); }
  }
  setTimeout(function(){ dragMoved = false; }, 0);
  if (tab !== 'comp') $('watch').classList.remove('editing');
});

// ---------- crown: wind the power reserve ----------
function wireCrown(){
  var cr = $('crown'); if (!cr) return;
  var on = false, ly = 0, acc = 0;
  cr.addEventListener('pointerdown', function(e){ on = true; ly = e.clientY; acc = 0; e.stopPropagation(); try { cr.setPointerCapture(e.pointerId); } catch(x){} });
  cr.addEventListener('pointermove', function(e){
    if (!on) return; acc += Math.abs(e.clientY - ly); ly = e.clientY;
    while (acc > 9){ acc -= 9; if (power < 100){ power = Math.min(100, power + 1.4); click(5200, .18, .01); haptic(3); } else { haptic([20]); } }
    var hp = $('hPower'); if (hp){ var t = hp.getAttribute('transform').replace(/rotate\([^)]*\)/, 'rotate(' + f(-120 + 240 * power / 100) + ')'); hp.setAttribute('transform', t); }
  });
  function end(){ if (!on) return; on = false; persist(); toast('動力儲存 ' + Math.round(power * .72) + ' 小時'); }
  cr.addEventListener('pointerup', end); cr.addEventListener('pointercancel', end);
  cr.addEventListener('click', function(){ if (acc === 0 && !on){ power = Math.min(100, power + 4); click(5200, .2, .01); haptic(4); persist(); renderWatch(false); } });
}

// ---------- live hands ----------
var lastSec = -1, lastMin = -1;
function tickHands(force){
  var n = new Date(), ms = n.getMilliseconds(), s = n.getSeconds(), m = n.getMinutes(), h = n.getHours() % 12;
  var sweep = cur.sweep !== false, sf = sweep ? s + Math.floor(ms / 125) / 8 : s;
  var set = function(id, deg){ var el = $(id); if (el) el.setAttribute('transform', el.getAttribute('transform').replace(/ ?rotate\([^)]*\)/, '') + ' rotate(' + f(deg) + ')'); };
  set('hS', sf * 6); set('hM', (m + sf / 60) * 6); set('hH', (h + m / 60 + s / 3600) * 30); set('hSecs', sf * 6);
  var cr = chrono.acc + (chrono.run ? Date.now() - chrono.t0 : 0), cs = cr / 1000;
  set('hChrono', (sweep ? Math.floor(cs * 8) / 8 : Math.floor(cs)) * 6);
  var tc = $('tChrono'); if (tc) tc.textContent = Math.floor(cs / 60) + ':' + String(Math.floor(cs) % 60).padStart(2, '0');

}
var raf = 0;
function loop(){ raf = 0; if (document.hidden) return; tickHands(false); raf = requestAnimationFrame(loop); }
document.addEventListener('visibilitychange', function(){ if (!document.hidden && !raf) raf = requestAnimationFrame(loop); });

// ---------- my faces sheet ----------
var sheet = $('sheet'), scrim = $('scrim'), lastFocus = null;

(function(){

function mineHTML(){

function openMine(){ openSheet(mineHTML()); }
$('sbody').addEventListener('click', function(e){

// ---------- sync ----------

// ---------- toast ----------

// ---------- backdrop: a huge rose-engine dial, cropped ----------
(function(){
