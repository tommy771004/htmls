<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a74c2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="天色">
<title>天色 · 天氣</title>
<meta name="description" content="用不透明水彩畫出的天氣：拖曳時間軸，太陽移動、雲飄過、整片天空一格一格換上顏料，還有十日預報與城市翻頁。收錄於 100 Creative HTML Works（App 012・不透明水彩天空）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/012-gouache-weather.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a74c2'/%3E%3Cpath d='M0 30c10-3 20 2 32-1s22 1 32-2v37H0z' fill='%23f6b654'/%3E%3Ccircle cx='40' cy='27' r='9' fill='%23fff3cf'/%3E%3Cpath d='M0 46c12-8 22-4 30-9s18-2 34-6v33H0z' fill='%23223f26'/%3E%3C/svg%3E">
<style>
:root{
  --cond:"Avenir Next Condensed","AvenirNextCondensed-Medium","Avenir Next","PingFang TC",sans-serif;
  --sans:"PingFang TC",-apple-system,"Helvetica Neue",system-ui,sans-serif;
  --spring:cubic-bezier(.3,1.35,.5,1);
  --out:cubic-bezier(.2,.9,.3,1);
  --s0:#2a74c2;--s1:#63a6de;--s2:#c3e2ec;--sun:#fff;--far:#86aeba;--mid:#4f8048;--near:#223f26;--water:#3f8fc4;--cloud:#fff;
  --gh:212px;--ink:#10222c;--ink2:rgba(16,34,44,.72);--slab:#16303c;--lit:0;--stars:0;--rain:0;--sunop:1;--moonop:0;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.45 var(--sans);background:#231c17;color:#fffaf0;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:10px}
svg{display:block}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--s0);isolation:isolate}
@media (min-width:521px){
  .stage{display:flex;align-items:center;justify-content:center;gap:64px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop canvas{width:100%;height:100%;display:block}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:54px;padding:9px;z-index:1;
    background:#15100d;box-shadow:inset 0 0 0 1.5px #3a2e26,0 18px 30px -20px rgba(0,0,0,.8)}
  .screen{inset:9px;border-radius:45px}
  .caption{display:block;position:relative;z-index:1;max-width:250px;color:#f3e6d6;align-self:flex-end;margin-bottom:8vh}
  .caption h1{font:600 52px/1 var(--cond);letter-spacing:.02em}
  .caption p{margin-top:14px;font-size:15px;line-height:1.7;color:rgba(243,230,214,.74)}
}
@media (min-width:521px) and (max-width:900px){.caption{display:none}}

/* painted layers */
.sky{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.sky .s0{fill:var(--s0)} .sky .s1{fill:var(--s1)} .sky .s2{fill:var(--s2)}
.sky .streak{fill:var(--s1);opacity:.42} .sky .streak.b{fill:var(--s2);opacity:.38} .sky .streak.c{fill:var(--s0);opacity:.35}
#sunG{opacity:var(--sunop)} #sunG .disc{fill:var(--sun)}
#moonG{opacity:var(--moonop)}
#stars{opacity:var(--stars)}
#clouds .cl{fill:var(--cloud);transition:opacity 1.2s}
#rainG{opacity:var(--rain)}
#rainG line{stroke:rgba(230,240,245,.55);stroke-width:1.6;stroke-linecap:round}
.rainfall{animation:fall .55s linear infinite}
@keyframes fall{from{transform:translate(0,-120px)}to{transform:translate(-28px,0)}}

.land{position:absolute;left:0;right:0;bottom:0;top:0;z-index:1;pointer-events:none;overflow:hidden}
.ground{position:absolute;left:0;right:0;bottom:0;height:calc(var(--gh) + 2px);background:var(--near)}
.track{position:absolute;inset:0;will-change:transform}
.track.anim{transition:transform .55s var(--spring)}
.lp{position:absolute;top:0;bottom:0;width:100%}
.lp svg{position:absolute;left:0;right:0;bottom:var(--gh);width:100%;height:auto}
.lp .far{fill:var(--far)} .lp .mid{fill:var(--mid)} .lp .near{fill:var(--near)} .lp .water{fill:var(--water)}
.lp .lit{fill:#ffd98a;opacity:var(--lit)}
.lp .wave{fill:none;stroke:var(--s2);stroke-width:2;stroke-linecap:round;opacity:.45}
.blades{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.lp .pad{fill:var(--near)}

.grain{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.55;background-size:160px 160px}

.status{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  height:calc(50px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 32px;font:600 16px/1 var(--cond);letter-spacing:.03em;color:var(--ink);pointer-events:none;transition:color .6s}
.status .g{display:flex;gap:6px;align-items:center}
.status svg *{fill:currentColor}
@media (display-mode:standalone){.status{display:none}}

.pages{position:absolute;left:0;right:0;top:calc(52px + env(safe-area-inset-top));height:360px;z-index:5;overflow:hidden;touch-action:pan-y}
.tp{position:absolute;top:0;bottom:0;width:100%;padding:18px 26px 0;color:var(--ink);transition:color .6s}
.where{display:flex;align-items:baseline;gap:10px;padding-right:56px}
.where b{font-size:26px;font-weight:600;letter-spacing:.02em}
.where span{font:500 15px/1 var(--cond);letter-spacing:.14em;color:var(--ink2)}
.tempRow{display:flex;align-items:flex-start;margin-top:4px;margin-left:-6px}
.tempRow .n{font:500 150px/.92 var(--cond);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tempRow .u{width:30px;height:30px;margin-top:18px;margin-left:6px}
.tempRow .u path{fill:currentColor}
.cond{margin-top:8px;font-size:20px;font-weight:600;letter-spacing:.04em}
.hl{margin-top:4px;font:500 18px/1.3 var(--cond);color:var(--ink2);letter-spacing:.04em}
.hl i{font-style:normal;margin:0 8px}

.topbtn{position:absolute;z-index:8;top:calc(62px + env(safe-area-inset-top));right:14px;width:48px;height:48px;display:grid;place-items:center;color:var(--ink);transition:color .6s,transform .18s}
.topbtn:active{transform:scale(.88)}
.topbtn svg *{fill:currentColor}

.dots{position:absolute;z-index:8;left:0;right:0;bottom:calc(206px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px}
.dots button{width:26px;height:30px;display:grid;place-items:center}
.dots i{display:block;width:8px;height:7px;border-radius:50% 45% 55% 48%;background:#fffaf0;opacity:.45;transition:width .35s var(--spring),opacity .3s}
.dots button.on i{width:22px;opacity:1;border-radius:6px 4px 5px 7px}

/* scrubber */
.scrub{position:absolute;z-index:8;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));height:126px;padding:0 22px;touch-action:none;cursor:ew-resize;color:#fffaf0}
.scrub svg{width:100%;height:100%;overflow:visible}
.scrub .curve{fill:none;stroke:#fffaf0;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.scrub .past{fill:none;stroke:#f6b654;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.scrub .tick{font:500 13px var(--cond);fill:rgba(255,250,240,.8);letter-spacing:.04em}
.scrub .drop{fill:#8fc6e6}
.scrub .stem{stroke:#fffaf0;stroke-width:2;stroke-linecap:round}
.scrub .knob{fill:#fffaf0}
.scrub .knobIn{fill:#f6b654}
.readout{position:absolute;top:-6px;transform:translateX(-50%);white-space:nowrap;font:600 15px/1 var(--cond);letter-spacing:.06em;pointer-events:none}
.readout b{font-weight:600;font-family:var(--sans);font-size:13px;margin-right:6px;letter-spacing:.02em}

.foot{position:absolute;z-index:8;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 12px}
.foot button{height:48px;padding:0 14px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:#fffaf0;border-radius:14px;transition:background-color .2s,transform .18s}
.foot button:active{transform:scale(.95);background:rgba(255,250,240,.12)}
.foot svg *{fill:#fffaf0}
#nowBtn{transition:opacity .3s}
#nowBtn[hidden]{display:flex;opacity:0;pointer-events:none}

.flash{position:absolute;inset:0;z-index:3;background:#fffaf0;opacity:0;pointer-events:none}
.flash.on{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:0}10%{opacity:.55}25%{opacity:.1}35%{opacity:.4}100%{opacity:0}}

.homebar{position:absolute;z-index:70;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#fffaf0;opacity:.8;pointer-events:none}

/* sheet: an opaque gouache slab with a torn painted top edge */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(14,10,8,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:86%;display:flex;flex-direction:column;background:var(--slab);color:#fffaf0;
  transform:translateY(calc(100% + 30px));transition:transform .5s var(--spring);touch-action:none;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.sheet .edge{position:absolute;left:0;right:0;bottom:calc(100% - 1px);height:22px;width:100%}
.sheet .edge path{fill:var(--slab)}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(255,250,240,.45);margin:4px auto 10px;flex:none}
.sbody{overflow:auto;padding:0 22px 30px;overscroll-behavior:contain;touch-action:pan-y}
.sheet h3{font:600 30px/1.1 var(--cond);letter-spacing:.03em;margin:4px 0 12px;display:flex;align-items:baseline;gap:10px}
.sheet h3 small{font:500 15px/1 var(--sans);color:rgba(255,250,240,.66)}

.day{display:grid;grid-template-columns:62px 34px 40px 1fr 40px 42px;align-items:center;height:50px;gap:6px}
.day .d{font-size:15px;font-weight:600}
.day .d span{display:block;font:500 13px/1 var(--cond);color:rgba(255,250,240,.6);letter-spacing:.05em;margin-top:2px}
.day .lo,.day .hi{font:600 18px/1 var(--cond);text-align:right}
.day .lo{color:rgba(255,250,240,.66)}
.day .bar{position:relative;height:10px}
.day .bar svg{width:100%;height:10px;overflow:visible}
.day .pr{font:500 14px/1 var(--cond);text-align:right;color:#9fd0ec}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px;margin-top:22px}
.facts div{font-size:13px;color:rgba(255,250,240,.66)}
.facts b{display:block;font:600 24px/1.1 var(--cond);color:#fffaf0;letter-spacing:.03em;margin-top:2px}

.crow{display:grid;grid-template-columns:40px 1fr auto 48px;align-items:center;gap:10px;height:62px;transition:transform .35s var(--out),opacity .3s}
.crow .nm{font-size:18px;font-weight:600}
.crow .nm span{display:block;font:500 13px/1.2 var(--cond);letter-spacing:.12em;color:rgba(255,250,240,.6)}
.crow .t{font:500 28px/1 var(--cond)}
.crow .x{width:48px;height:48px;display:grid;place-items:center;border-radius:12px;transition:background-color .2s}
.crow .x:active{background:rgba(255,250,240,.14)}
.crow .x svg *{fill:rgba(255,250,240,.8)}
.crow.cur .nm{color:#f6c86a}
.units{display:flex;gap:4px;margin:0 0 6px}
.units button{height:44px;min-width:64px;padding:0 12px;font:600 20px/1 var(--cond);color:rgba(255,250,240,.55);border-radius:12px;transition:color .2s,background-color .2s}
.units button[aria-pressed=true]{color:#16303c;background:#fffaf0}
.subh{font-size:14px;color:rgba(255,250,240,.6);margin:22px 0 8px}
.addgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.addgrid button{height:56px;border-radius:14px;background:rgba(255,250,240,.08);text-align:left;padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600;transition:background-color .2s,transform .15s}
.addgrid button:active{transform:scale(.96);background:rgba(255,250,240,.16)}
.addgrid button span{font:500 13px/1 var(--cond);letter-spacing:.1em;color:rgba(255,250,240,.55)}
.addgrid svg *{fill:#f6c86a}
.empty{font-size:14px;color:rgba(255,250,240,.55);padding:8px 0}

.toast{position:absolute;left:50%;top:calc(60px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-160px);transition:transform .45s var(--spring);
  display:flex;align-items:center;gap:14px;padding:0 8px 0 18px;height:50px;border-radius:14px;background:#16303c;color:#fffaf0;font-size:14px;font-weight:600;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.toast button{height:40px;padding:0 12px;color:#f6c86a;border-radius:10px}

@media (max-height:760px){
  .screen{--gh:196px}
  .tempRow .n{font-size:118px}
  .pages{height:300px}
  .scrub{height:112px;bottom:calc(66px + env(safe-area-inset-bottom))}
  .dots{bottom:calc(180px + env(safe-area-inset-bottom))}
  .foot{bottom:calc(8px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){
  .rainfall,.blades{animation:none}
  .track.anim,.sheet,.toast,.dots i{transition-duration:.01s}
  .flash.on{animation:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><canvas id="bd"></canvas></div>
  <div class="device">
    <div class="screen" id="screen">
      <svg class="sky" id="sky" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
      <div class="land" aria-hidden="true"><div class="ground"></div><div class="track" id="landTrack"></div></div>
      <div class="grain" id="grain"></div>
      <div class="flash" id="flash"></div>

      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="g">
          <svg width="18" height="12" viewBox="0 0 18 12"><path d="M1 9.5c0-1 .6-1.6 1.5-1.6S4 8.5 4 9.5v1c0 .8-.6 1.3-1.5 1.3S1 11.3 1 10.5z"/><path d="M5.6 7c0-1 .6-1.7 1.5-1.7s1.5.7 1.5 1.7v3.6c0 .8-.6 1.3-1.5 1.3s-1.5-.5-1.5-1.3z"/><path d="M10.2 4.3c0-1 .6-1.7 1.5-1.7s1.5.7 1.5 1.7v6.3c0 .8-.6 1.3-1.5 1.3s-1.5-.5-1.5-1.3z"/><path d="M14.8 1.8c0-1 .6-1.7 1.5-1.7s1.5.7 1.5 1.7v8.8c0 .8-.6 1.3-1.5 1.3s-1.5-.5-1.5-1.3z"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 1.2c2.9 0 5.4 1 7.3 2.7.4.4.4.9 0 1.3l-.3.3c-.4.3-.9.3-1.3 0A8.6 8.6 0 0 0 8 3.6 8.6 8.6 0 0 0 2.3 5.5c-.4.3-.9.3-1.3 0l-.3-.3c-.4-.4-.4-.9 0-1.3C2.6 2.2 5.1 1.2 8 1.2z"/><path d="M8 5.2c1.7 0 3.2.6 4.3 1.6.4.4.4.9 0 1.2l-.4.3c-.3.3-.8.3-1.2 0A4.3 4.3 0 0 0 8 7.4c-1 0-2 .3-2.7.9-.4.3-.9.3-1.2 0l-.4-.3c-.4-.3-.4-.8 0-1.2C4.8 5.8 6.3 5.2 8 5.2z"/><path d="M8 9c.8 0 1.4.6 1.4 1.3S8.8 11.8 8 11.8s-1.4-.7-1.4-1.5S7.2 9 8 9z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><path d="M3.5.8h18c1.6 0 2.7 1.2 2.7 2.8v5.8c0 1.6-1.1 2.8-2.7 2.8h-18C1.9 12.2.8 11 .8 9.4V3.6C.8 2 1.9.8 3.5.8zm0 1.6c-.8 0-1.1.5-1.1 1.2v5.8c0 .7.3 1.2 1.1 1.2h18c.8 0 1.1-.5 1.1-1.2V3.6c0-.7-.3-1.2-1.1-1.2z" /><path d="M4.2 3.6h13.4c.5 0 .8.4.8.9v4c0 .5-.3.9-.8.9H4.2c-.5 0-.8-.4-.8-.9v-4c0-.5.3-.9.8-.9z"/><path d="M25.2 4.6c.9.2 1.4.9 1.4 1.9s-.5 1.7-1.4 1.9z"/></svg>
        </span>
      </div>

      <div class="pages" id="pages"><div class="track" id="textTrack"></div></div>
      <button class="topbtn" id="mgrBtn" aria-label="管理城市與單位">
        <svg width="26" height="22" viewBox="0 0 26 22"><path d="M2 3.4c3-1.3 11-1.6 20-.6 1.4.2 1.9 1 1.8 1.8-.1.9-.9 1.3-2 1.2-8-.8-15.6-.4-18.6.4C1.9 6.6 1 6 .9 5.1.8 4.4 1.2 3.8 2 3.4z"/><path d="M3 10c4-1 10-1.3 15.3-.5 1.2.2 1.7 1 1.6 1.8-.1.8-.9 1.2-2 1.1-5.2-.6-10.6-.3-14.4.5-1.2.2-1.9-.3-2-1.1-.1-.8.4-1.5 1.5-1.8z"/><path d="M2.3 16.6c2.6-.9 6.4-1.1 9.8-.6 1.2.2 1.7 1 1.6 1.8-.1.8-.9 1.2-2 1-3.2-.4-6.6-.2-8.6.4-1.1.3-1.9-.2-2-1-.1-.7.3-1.3 1.2-1.6z"/></svg>
      </button>
      <div class="dots" id="dots" role="tablist" aria-label="城市"></div>

      <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="拖曳時間" aria-valuemin="0" aria-valuemax="24" aria-valuenow="0">
        <div class="readout" id="readout"><b>現在</b>--</div>
        <svg id="scrubSvg" viewBox="0 0 346 126" preserveAspectRatio="none"></svg>
      </div>
      <div class="foot">
        <button id="tenBtn" aria-label="打開十日預報">
          <svg width="18" height="18" viewBox="0 0 18 18"><path d="M8.2 3.2c.5-.5 1.2-.5 1.7 0l6 6.3c.5.5.5 1.2 0 1.6-.5.5-1.2.4-1.6 0L9 5.7l-5.3 5.4c-.4.4-1.1.5-1.6 0s-.5-1.1 0-1.6z"/><path d="M8.2 9.6c.5-.5 1.2-.5 1.7 0l4.4 4.6c.5.5.4 1.2 0 1.6-.5.4-1.2.4-1.6 0L9 12.1l-3.7 3.8c-.4.4-1.1.4-1.6 0-.4-.5-.4-1.1 0-1.6z" opacity=".55"/></svg>
          十日預報
        </button>
        <button id="nowBtn" hidden aria-label="回到現在">
          回到現在
          <svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 2.2c3.9 0 6.9 3 6.9 6.8S12.9 15.8 9 15.8 2.1 12.8 2.1 9c0-.6.5-1.1 1.1-1.1s1.1.5 1.1 1.1c0 2.6 2.1 4.6 4.7 4.6s4.7-2 4.7-4.6S11.6 4.4 9 4.4c-1 0-1.8.3-2.6.8l1 .9c.5.5.2 1.3-.5 1.3H3.8c-.5 0-.8-.4-.8-.8V3.4c0-.7.8-1 1.3-.5l.6.7C6.1 2.7 7.5 2.2 9 2.2z"/></svg>
        </button>
      </div>

      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="面板">
        <svg class="edge" viewBox="0 0 390 22" preserveAspectRatio="none" aria-hidden="true"><path id="edgePath"/></svg>
        <div class="grab"></div>
        <div class="sbody" id="sbody"></div>
      </div>
      <div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo" hidden>復原</button></div>
      <div class="homebar"></div>
    </div>
  </div>
  <div class="caption">
    <h1>天色</h1>
    <p>拖曳底下的時間軸，太陽跟著走，整片天空一格一格換上顏料。左右翻頁換城市。</p>
  </div>
</div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };

/* ---------- seeded random ---------- */
function hash(s){ var h = 2166136261; for (var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h>>>0; }
function rng(seed){ var a = typeof seed === 'number' ? seed : hash(seed); return function(){ a|=0; a = a+0x6D2B79F5|0; var t = Math.imul(a^a>>>15, 1|a); t = t+Math.imul(t^t>>>7, 61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- colour ---------- */
function hx(c){ return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]; }
function toHex(a){ return '#'+a.map(function(v){ v = Math.max(0,Math.min(255,Math.round(v))); return (v<16?'0':'')+v.toString(16); }).join(''); }
function lerpA(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function lum(a){ var f = a.map(function(v){ v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); }); return .2126*f[0]+.7152*f[1]+.0722*f[2]; }
function grey(a, warm){ var l = a[0]*.3+a[1]*.59+a[2]*.11; return [l+warm, l+warm*.5, l]; }

].map(function(r){ return [r[0]].concat(r.slice(1).map(hx)); });
function paletteAt(h, cover, rain){
  h = ((h%24)+24)%24;
  var i = 0; while (i < KF.length-2 && KF[i+1][0] <= h) i++;
  var a = KF[i], b = KF[i+1], t = (h-a[0])/(b[0]-a[0]);
  var out = [];
  for (var k=1;k<10;k++){
    var c = lerpA(a[k], b[k], t);
    if (k !== 4 && k !== 9){
      var g = grey(c, 6);
      c = lerpA(c, g, Math.min(.85, cover*.62 + rain*.3));
      if (rain > 0) c = c.map(function(v){ return v*(1-rain*.28); });
    }
    if (k === 9){ c = lerpA(c, grey(c,0).map(function(v){return v*.72;}), rain*.9); }
    out.push(c);
  }
  return out;
}

function genCity(id){
  if (DATA[id]) return DATA[id];
  var c = CATALOG[id], r = rng(id+dayKey), days = [];
  for (var d=0; d<11; d++){
    var x = r(), kind;
    if (x < c.wet*c.storm) kind = 'storm';
    else if (x < c.wet) kind = 'rain';
    else if (x < c.wet + .25) kind = 'cloudy';
    else if (x < c.wet + .55) kind = 'partly';
    else kind = 'clear';
    var shift = Math.round((r()-.5)*4);
    var lo = c.lo + shift + (kind==='rain'?-1:0), hi = c.hi + shift + (kind==='clear'?1:kind==='rain'?-2:0);
    var rs = 6 + Math.floor(r()*12), rl = 2 + Math.floor(r()*6);
    days.push({kind:kind, lo:lo, hi:hi, rs:rs, rl:rl, pop: kind==='storm'?60+Math.floor(r()*30): kind==='rain'?50+Math.floor(r()*40): kind==='cloudy'?20+Math.floor(r()*20): Math.floor(r()*15),
      hum: 62+Math.floor(r()*28), wind: 1+Math.floor(r()*5), uv: kind==='clear'?8+Math.floor(r()*4): kind==='partly'?6+Math.floor(r()*3):2+Math.floor(r()*4)});
  }
  DATA[id] = {days:days};
  return DATA[id];
}
/* per hour weather: temp, cover 0..1, rain 0..1, storm bool */
function wx(id, t){
  var D = genCity(id).days, d = Math.max(0, Math.min(10, Math.floor(t/24))), hh = t - d*24, day = D[d];
  var prev = D[Math.max(0,d-1)];
  var k = (Math.cos((hh-14.5)/24*Math.PI*2)+1)/2;
  var lo = hh < 5 ? prev.lo*(1-hh/5)+day.lo*(hh/5) : day.lo;
  var temp = lo + (day.hi-lo)*Math.pow(k, 1.3);
  var cover = 0, rain = 0, storm = false;
  switch(day.kind){
    case 'clear': cover = .08 + .12*Math.max(0, Math.sin((hh-10)/10*Math.PI)); break;
    case 'partly': cover = .3 + .2*Math.sin(hh/4); break;
    case 'cloudy': cover = .72 + .12*Math.sin(hh/3); break;
    case 'rain':
      cover = .7; var into = hh - day.rs;
      if (into > -1 && into < day.rl+1){ var e = Math.min(1, Math.min(into+1, day.rl+1-into)); rain = .45 + .45*e; cover = .85 + .15*e; }
      break;
    case 'storm':
      cover = .35 + (hh>12 ? .3 : 0);
      if (hh >= 13.5 && hh < 17.5){ var s = Math.min(1, Math.min(hh-13.5, 17.5-hh)*1.5); rain = .95*s; cover = .8 + .2*s; storm = s > .6; }
      break;
  }
  if (rain > .2) temp -= 2*rain;
  return {temp:temp, cover:Math.max(0,Math.min(1,cover)), rain:rain, storm:storm, day:day, d:d, hh:hh};
}
function label(w){
  var night = w.hh < 5.6 || w.hh >= 18.6;
  if (w.storm) return '午後雷陣雨';
  if (w.rain > .7) return '大雨';
  if (w.rain > .2) return '短暫陣雨';
  if (w.cover > .8) return '陰天';
  if (w.cover > .55) return '多雲';
  if (w.cover > .25) return night ? '晴時多雲' : '晴時多雲';
  return night ? '晴朗夜空' : '晴朗';
}
function kindOf(w){
  var night = w.hh < 5.6 || w.hh >= 18.6;
  if (w.storm) return 'storm'; if (w.rain > .2) return 'rain'; if (w.cover > .55) return 'cloudy';
  if (w.cover > .25) return night ? 'moonp' : 'partly'; return night ? 'moon' : 'sun';
}

/* ---------- gouache paths ---------- */
function wobble(x0, x1, y, amp, seed, step){
  var r = rng(seed), pts = [], v = 0;
  for (var x=x0; x<=x1+step; x+=step){ v = v*.55 + (r()-.5)*amp; pts.push([x, y+v]); }
  return pts;
}
function smooth(pts){
  var d = 'M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for (var i=1;i<pts.length-1;i++){ var mx = (pts[i][0]+pts[i+1][0])/2, my = (pts[i][1]+pts[i+1][1])/2; d += 'Q'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1)+' '+mx.toFixed(1)+' '+my.toFixed(1); }
  var l = pts[pts.length-1]; return d + 'L'+l[0].toFixed(1)+' '+l[1].toFixed(1);
}
function band(y, amp, seed, bottom){ return smooth(wobble(-30, 420, y, amp, seed, 14)) + 'L420 '+bottom+'L-30 '+bottom+'Z'; }
function stroke(x, y, w, h, seed){
  var r = rng(seed), top = [], bot = [], n = 10;
  for (var i=0;i<=n;i++){ var t = i/n, taper = Math.sin(t*Math.PI); var xx = x + w*t;
    top.push([xx, y - h*taper*(.7+r()*.5)]); bot.push([xx, y + h*taper*(.6+r()*.5)]); }
  return smooth(top.concat(bot.reverse())) + 'Z';
}
function blob(cx, cy, rx, ry, seed, n, v){
  var r = rng(seed), pts = []; n = n||12; v = v||.26;
  for (var i=0;i<=n+1;i++){ var a = i/n*Math.PI*2, k = 1 - v/2 + r()*v; pts.push([cx+Math.cos(a)*rx*k, cy+Math.sin(a)*ry*k]); }
  return smooth(pts)+'Z';
}
function ridge(base, amp, f1, f2, seed, x0, x1){
  var r = rng(seed), pts = [], p1 = r()*6, p2 = r()*6;
  x0 = x0 === undefined ? -20 : x0; x1 = x1 === undefined ? 410 : x1;
  for (var x=x0;x<=x1;x+=10){ pts.push([x, base - amp*(Math.sin(x*f1+p1)*.6 + Math.sin(x*f2+p2)*.4) + (r()-.5)*3]); }
  return pts;
}
function ridgePath(pts, bottom){ return smooth(pts)+'L'+pts[pts.length-1][0]+' '+bottom+'L'+pts[0][0]+' '+bottom+'Z'; }

/* ---------- time ---------- */

/* ---------- build pages ---------- */
var landTrack = $('landTrack'), textTrack = $('textTrack'), dots = $('dots');

/* ---------- render ---------- */
var screenEl = $('screen'), rootStyle = screenEl.style;
var curW = null, lastStorm = 0;
function render(){
  var id = cities[idx], t = tAbs(), w = wx(id, t);
  curW = w;
  var P = paletteAt(t, w.cover, w.rain);
  var names = ['--s0','--s1','--s2','--sun','--far','--mid','--near','--water','--cloud'];
  for (var i=0;i<9;i++) rootStyle.setProperty(names[i], toHex(P[i]));
  var slab = lerpA(P[0], [14,20,22], .55);
  rootStyle.setProperty('--slab', toHex(slab));
  var L = Math.max(lum(P[0])*.45 + lum(P[1])*.55, 0);
  var dark = L > .22;

    var pc = Math.max(0,Math.min(1,p)), x = 40 + 330*Math.pow(pc,.78) + (p<0?p*200:p>1?(p-1)*200:0), y = 470 - 350*Math.sin(pc*Math.PI);
    sunG.setAttribute('transform', 'translate('+x.toFixed(1)+' '+y.toFixed(1)+')');
    rootStyle.setProperty('--sunop', ((1 - w.cover*.75) * Math.min(1, (1.08 - Math.abs(p-.5)*2 + .08)*6)).toFixed(2));
  } else rootStyle.setProperty('--sunop', 0);
  var mp = ((hh - 18.4 + 24) % 24)/11.5;

  } else rootStyle.setProperty('--moonop', 0);
  var nc = Math.round(w.cover*7);
  clouds.forEach(function(c, i){ c.el.style.opacity = i < nc ? (0.95 - i*.02) : 0; });
  /* text for every page */

  });

/* ---------- scrubber ---------- */
var scrubSvg = $('scrubSvg'), readout = $('readout');
var SW = 346, CY0 = 30, CY1 = 76;
function drawScrub(){
  var id = cities[idx], n0 = nowHour(), temps = [], mn = 99, mx = -99;
  for (var k=0;k<=24;k++){ var w = wx(id, n0+k); temps.push(w); mn = Math.min(mn, w.temp); mx = Math.max(mx, w.temp); }
  var yOf = function(v){ return CY1 - (v - mn)/Math.max(1, mx - mn)*(CY1-CY0); };
  var pts = temps.map(function(w,k){ return [k/24*SW, yOf(w.temp)]; });
  var d = smooth([pts[0]].concat(pts).concat([pts[24]]));
  var h = '<path class="curve" d="'+d+'"/>';
  var cut = scrubOff/24*SW;
  h += '<clipPath id="pc"><rect x="-10" y="0" width="'+(cut+10).toFixed(1)+'" height="126"/></clipPath><path class="past" clip-path="url(#pc)" d="'+d+'"/>';
  for (var j=0;j<=24;j++){
    var x = j/24*SW, hr = Math.floor(n0 + j) % 24;
    if (temps[j].rain > .2) h += '<path class="drop" d="M'+x.toFixed(1)+' 88c-2.6 3.4-3.8 5.4-3.8 7a3.8 3.8 0 0 0 7.6 0c0-1.6-1.2-3.6-3.8-7z"/>';
    if (j % 4 === 2) h += '<text class="tick" x="'+x.toFixed(1)+'" y="120" text-anchor="middle">'+(hr<10?'0':'')+hr+'</text>';
  }
  var hx0 = cut, hy = yOf(wx(id, n0 + scrubOff).temp);
  h += '<line class="stem" x1="'+hx0.toFixed(1)+'" y1="22" x2="'+hx0.toFixed(1)+'" y2="104"/>';
  h += '<circle class="knob" cx="'+hx0.toFixed(1)+'" cy="'+hy.toFixed(1)+'" r="9"/><circle class="knobIn" cx="'+hx0.toFixed(1)+'" cy="'+hy.toFixed(1)+'" r="4.5"/>';
  scrubSvg.innerHTML = h;
  var t = n0 + scrubOff, d0 = Math.floor(t/24), hr2 = Math.floor(t%24), mi = Math.floor((t%1)*60/15)*15;
  var dayLbl = scrubOff < .2 ? '現在' : d0 === 0 ? '今天' : d0 === 1 ? '明天' : '後天';
  var clk = scrubOff < .2 ? '' : (hr2<10?'0':'')+hr2+':'+(mi<10?'0':'')+mi;
  readout.innerHTML = '<b>'+dayLbl+'</b>'+clk;
  var host = $('scrub').clientWidth - 44, px = 22 + cut/SW*host;
  readout.style.left = Math.max(46, Math.min($('scrub').clientWidth - 46, px)) + 'px';
  $('scrub').setAttribute('aria-valuenow', scrubOff.toFixed(1));
  $('scrub').setAttribute('aria-valuetext', dayLbl+' '+clk);
  $('nowBtn').hidden = scrubOff < .2;
}
(function(){
  var el = $('scrub'), on = false, lastTick = -1;
  function setFrom(e){
    var r = el.getBoundingClientRect(), f = (e.clientX - r.left - 22)/(r.width - 44);
    scrubOff = Math.max(0, Math.min(24, f*24));
    var tick = Math.floor(scrubOff);
    if (tick !== lastTick){ lastTick = tick; haptic(3); }
    render();
  }
  el.addEventListener('pointerdown', function(e){ on = true; el.setPointerCapture(e.pointerId); setFrom(e); });
  el.addEventListener('pointermove', function(e){ if (on) setFrom(e); });
  function end(){ if (!on) return; on = false; snapHour(); }
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight'){ scrubOff = Math.min(24, Math.floor(scrubOff)+1); render(); e.preventDefault(); }
    if (e.key === 'ArrowLeft'){ scrubOff = Math.max(0, Math.ceil(scrubOff)-1); render(); e.preventDefault(); }
  });
})();
function animateOff(to){
  var from = scrubOff, t0 = performance.now(), dur = reduce ? 1 : 420;
  (function step(now){
    var k = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1-k, 3);
    scrubOff = from + (to - from)*e; render();
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
function snapHour(){
  if (scrubOff < .35){ animateOff(0); return; }
  var t = nowHour() + scrubOff, target = Math.round(t) - nowHour();
  animateOff(Math.max(0, Math.min(24, target)));
}
$('nowBtn').addEventListener('click', function(){ haptic(10); animateOff(0); });

/* ---------- pager swipe ---------- */
(function(){
  var area = $('pages'), sx = 0, sy = 0, dx = 0, dy = 0, t0 = 0, mode = null, id = null;
  var targets = [area, $('screen').querySelector('.land')];
  function down(e){
    if (e.target.closest('button')) return;
    id = e.pointerId; sx = e.clientX; sy = e.clientY; dx = dy = 0; t0 = e.timeStamp; mode = null;
  }
  function move(e){
    if (e.pointerId !== id) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    if (!mode && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){ mode = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v'; try{ area.setPointerCapture(id); }catch(err){} }
    if (mode === 'h'){
      var edge = (idx === 0 && dx > 0) || (idx === cities.length-1 && dx < 0);
      placeTracks(edge ? dx/3.5 : dx, false);
    }
  }
  function up(e){
    if (e.pointerId !== id) return; id = null;
    var v = dx/Math.max(1, e.timeStamp - t0);
    if (mode === 'h'){
      var w = area.clientWidth, n = idx;
      if ((dx < -w*.22 || v < -.45) && idx < cities.length-1) n++;
      else if ((dx > w*.22 || v > .45) && idx > 0) n--;
      go(n);
    } else if (mode === 'v' && dy < -60){ openTen(); }
    mode = null;
  }
  area.addEventListener('pointerdown', down);
  area.addEventListener('pointermove', move);
  area.addEventListener('pointerup', up); area.addEventListener('pointercancel', up);
})();
function go(n){
  var changed = n !== idx; idx = n; save('idx', idx);
  placeTracks(0, true);
  if (changed){ haptic(6); render(); }
}
dots.addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) go(+b.dataset.i); });
document.addEventListener('keydown', function(e){
  if (sheet.classList.contains('on')) return;
  if (e.target.id === 'scrub') return;
  if (e.key === 'ArrowRight' && idx < cities.length-1) go(idx+1);
  if (e.key === 'ArrowLeft' && idx > 0) go(idx-1);
});

/* ---------- icons: little gouache daubs ---------- */
function icon(kind, s){
  s = s||30;
  var cloud = function(fill, ox, oy){ ox=ox||0; oy=oy||0; return '<path fill="'+fill+'" d="'+blob(15+ox,17+oy,11,6.5,kind+'c1',10)+'"/><path fill="'+fill+'" d="'+blob(12+ox,13+oy,6.5,6,kind+'c2',9)+'"/><path fill="'+fill+'" d="'+blob(18.5+ox,12.5+oy,5,5,kind+'c3',9)+'"/>'; };
  var sun = function(cx,cy,r){ var g = '<path fill="#f2b83c" d="'+blob(cx,cy,r,r,kind+'s',12)+'"/>'; for (var i=0;i<8;i++){ var a = i/8*Math.PI*2; g += '<path fill="#f2b83c" d="'+blob(cx+Math.cos(a)*(r+4.3),cy+Math.sin(a)*(r+4.3),1.8,1.5,kind+'r'+i,6)+'"/>'; } return g; };
  var moon = '<path fill="#efe4c0" d="M17 5c-6 1.2-9.6 6.4-8.7 12.2.9 5.5 6 9.2 11.6 8.3-7.8-2.3-10.6-12-2.9-20.5z"/>';
  var g = '';
  switch(kind){

    case 'cloudy': g = cloud('#dfe3e0',0,1); break;
    case 'rain': g = cloud('#c5cdd0',0,-2) + [8,15,22].map(function(x,i){ return '<path fill="#8fc6e6" d="M'+x+' '+(21+i%2*2)+'c-1.8 2.5-2.7 4-2.7 5.1a2.7 2.7 0 0 0 5.4 0c0-1.1-.9-2.6-2.7-5.1z"/>'; }).join(''); break;
    case 'storm': g = cloud('#9aa4a8',0,-2) + '<path fill="#f6d25a" d="M16.5 17.5l-5.3 7.2h3.8l-2.2 6 6.4-8.3h-3.9l2.4-4.9z"/>'; break;
  }
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 30 30" aria-hidden="true">'+g+'</svg>';
}

/* ---------- sheet ---------- */
var sheet = $('sheet'), scrim = $('scrim'), sbody = $('sbody'), lastFocus = null, sheetKind = '';
$('edgePath').setAttribute('d', smooth(wobble(-10, 400, 10, 9, 'edge', 13)) + 'L400 23L-10 23Z');

document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });
(function(){
  var sy = 0, dy = 0, t0 = 0, on = false;
  sheet.addEventListener('pointerdown', function(e){
    if (e.target.closest('button')) return;
    if (sbody.contains(e.target) && sbody.scrollTop > 0) return;

  });
  sheet.addEventListener('pointermove', function(e){
    if (!on) return; dy = e.clientY - sy;
    if (Math.abs(dy) > 4 && !sheet.hasPointerCapture(e.pointerId)) try{ sheet.setPointerCapture(e.pointerId); }catch(err){}

  });

  }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();

function openTen(){
  var id = cities[idx], c = CATALOG[id], D = genCity(id).days;
  var mn = 99, mx = -99; for (var i=0;i<10;i++){ mn = Math.min(mn, D[i].lo); mx = Math.max(mx, D[i].hi); }
  var h = '<h3>十日預報<small>'+c.name+'</small></h3>';
  for (var d=0; d<10; d++){
    var day = D[d], dt = new Date(today.getTime() + d*864e5);
    var a = (day.lo - mn)/(mx - mn || 1)*100, b = (day.hi - mn)/(mx - mn || 1)*100;
    var warm = toHex(lerpA(hx('#8fc6e6'), hx('#f6b654'), (day.hi - mn)/(mx-mn||1)));
    h += '<div class="day"><div class="d">'+(d===0?'今天':DAYN[dt.getDay()])+'<span>'+(dt.getMonth()+1)+'/'+dt.getDate()+'</span></div>'+icon(dayKind(day), 32)+
      '<div class="lo">'+deg(day.lo)+'°</div><div class="bar"><svg viewBox="0 0 100 10" preserveAspectRatio="none"><path fill="rgba(255,250,240,.14)" d="'+stroke(0,5,100,2.4,'bg'+d)+'"/><path fill="'+warm+'" d="'+stroke(a,5,Math.max(8,b-a),4,'bar'+d)+'"/></svg></div>'+
      '<div class="hi">'+deg(day.hi)+'°</div><div class="pr">'+(day.pop >= 20 ? day.pop+'%' : '')+'</div></div>';
  }

       '<div>濕度<b>'+t.hum+'%</b></div><div>風<b>東北 '+t.wind+' 級</b></div><div>紫外線<b>'+t.uv+'</b></div></div>';

$('tenBtn').addEventListener('click', openTen);

function openMgr(){
  var h = '<h3>城市<small>拖曳時間軸會一起變</small></h3>';
  h += '<div class="units" role="group" aria-label="溫度單位"><button data-u="C" aria-pressed="'+(unit==='C')+'">°C</button><button data-u="F" aria-pressed="'+(unit==='F')+'">°F</button></div>';
  h += '<div id="clist">';
  cities.forEach(function(id, i){
    var c = CATALOG[id], w = wx(id, nowHour());
    h += '<div class="crow'+(i===idx?' cur':'')+'" data-id="'+id+'">'+icon(kindOf(w), 36)+'<button class="nm" data-go="'+i+'" style="text-align:left;height:56px">'+c.name+'<span>'+c.en+' / '+c.area+'</span></button><div class="t">'+deg(w.temp)+'°</div>'+
      '<button class="x" data-del="'+id+'" aria-label="刪除'+c.name+'"'+(cities.length<2?' disabled style="opacity:.3"':'')+'><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3.2 2.4c.5-.4 1.2-.4 1.7.1L9 6.8l4.2-4.3c.5-.5 1.2-.5 1.7-.1.5.5.5 1.2 0 1.7L10.7 8.5l4.3 4.4c.5.5.4 1.2 0 1.7-.5.4-1.2.4-1.7-.1L9 10.2l-4.3 4.3c-.5.5-1.2.5-1.7.1-.4-.5-.4-1.2.1-1.7l4.2-4.4L3.1 4.1c-.4-.5-.4-1.2.1-1.7z"/></svg></button></div>';
  });
  h += '</div><div class="subh">加入城市</div><div class="addgrid">';
  var any = false;
  Object.keys(CATALOG).forEach(function(id){ if (cities.indexOf(id) >= 0) return; any = true; var c = CATALOG[id];
    h += '<button data-add="'+id+'">'+c.name+'<span>'+c.en+'</span></button>'; });
  h += '</div>' + (any ? '' : '<div class="empty">全部城市都在清單裡了。</div>');
  openSheet('mgr', h);
}
$('mgrBtn').addEventListener('click', openMgr);

var undoState = null, toastT = 0;
function toast(msg, undo){
  $('toastMsg').textContent = msg; $('toastUndo').hidden = !undo; undoState = undo || null;
  $('toast').classList.add('on'); clearTimeout(toastT);
  toastT = setTimeout(function(){ $('toast').classList.remove('on'); undoState = null; }, 3200);
}
$('toastUndo').addEventListener('click', function(){
  if (!undoState) return; cities = undoState.cities; idx = undoState.idx; undoState = null;
  persist(); buildPages(); render(); $('toast').classList.remove('on'); haptic(10);
  if (sheet.classList.contains('on') && sheetKind === 'mgr') openMgr();
});
function persist(){ save('cities', cities); save('idx', idx); save('unit', unit); }

sbody.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.u){ unit = b.dataset.u; persist(); haptic(6); render(); openMgr(); return; }
  if (b.dataset.go !== undefined){ closeSheet(); go(+b.dataset.go); return; }
  if (b.dataset.del){
    if (cities.length < 2){ haptic([20,40,20]); return; }
    var id = b.dataset.del, snap = {cities:cities.slice(), idx:idx};
    var row = b.closest('.crow'); row.style.transform = 'translateX(110%)'; row.style.opacity = '0';
    haptic([8,30,8]);
    setTimeout(function(){
      var i = cities.indexOf(id); cities.splice(i, 1);
      if (idx >= cities.length) idx = cities.length-1; else if (i < idx) idx--;
      persist(); buildPages(); render(); openMgr();
      toast('已移除 '+CATALOG[id].name, snap);
    }, reduce ? 0 : 260);
    return;
  }
  if (b.dataset.add){
    cities.push(b.dataset.add); idx = cities.length-1; persist(); buildPages(); render(); haptic(10);
    closeSheet(); toast('加入 '+CATALOG[b.dataset.add].name);
  }
});

/* ---------- grain (behind the text, over the paint) ---------- */
(function(){
  var c = document.createElement('canvas'); c.width = c.height = 160;
  var x = c.getContext('2d'), img = x.createImageData(160,160), r = rng('grain');
  for (var i=0;i<img.data.length;i+=4){ var v = r(); var dark = v < .5; img.data[i] = img.data[i+1] = img.data[i+2] = dark ? 40 : 255; img.data[i+3] = Math.floor(Math.abs(v-.5)*2*22); }
  x.putImageData(img,0,0);
  try{ $('grain').style.backgroundImage = 'url('+c.toDataURL()+')'; }catch(e){}
})();

/* ---------- drifting clouds, rain flashes ---------- */
var lastF = performance.now(), raf = 0;
function frame(now){
  var dt = Math.min(.1, (now - lastF)/1000); lastF = now;
  clouds.forEach(function(c){
    if (!reduce) c.x += c.v*dt*(curW && curW.rain > .3 ? 2 : 1);
    if (c.x > 390 + c.w) c.x = -c.w;
    c.el.setAttribute('transform', 'translate('+c.x.toFixed(1)+' '+c.y+')');
  });
  if (curW && curW.storm && !reduce && now - lastStorm > 5200 + Math.random()*4000){
    lastStorm = now; var f = $('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  }
  raf = requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', function(){
  if (document.hidden) cancelAnimationFrame(raf); else { lastF = performance.now(); raf = requestAnimationFrame(frame); render(); }
});

/* ---------- clock ---------- */
function tick(){
  var n = new Date(); $('clock').textContent = n.getHours()+':'+String(n.getMinutes()).padStart(2,'0');
}
tick();
setInterval(function(){ tick(); if (!document.hidden && !sheet.classList.contains('drag')) render(); }, 30000);

/* ---------- desktop backdrop: the day's sky, painted as swatches ---------- */
function paintBackdrop(){
  var cv = $('bd'); if (!cv || getComputedStyle(cv.parentNode).display === 'none') return;
  var dpr = Math.min(2, devicePixelRatio||1), W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  var x = cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0);
  x.fillStyle = '#231c17'; x.fillRect(0,0,W,H);
  var r = rng('bd'), id = cities[idx];
  var n = 24, sw = W/n, top = H*.08, bot = H*.58;
  function rough(x0, y0, w, h){
    x.beginPath(); var k, st = 7;
    x.moveTo(x0 + (r()-.5)*2, y0 + (r()-.5)*3);
    for (k=st;k<=w;k+=st) x.lineTo(x0+k, y0 + (r()-.5)*3.2);
    for (k=st;k<=h;k+=st) x.lineTo(x0+w + (r()-.5)*3.2, y0+k);
    for (k=w-st;k>=0;k-=st) x.lineTo(x0+k, y0+h + (r()-.5)*3.2);
    for (k=h-st;k>=0;k-=st) x.lineTo(x0 + (r()-.5)*3.2, y0+k);
    x.closePath(); x.fill();
  }
  for (var i=0;i<n;i++){
    var w = wx(id, i), P = paletteAt(i+.5, w.cover*.5, 0);
    var x0 = i*sw + sw*.12, ww = sw*.76, seg = (bot-top)/3;
    for (var k=0;k<3;k++){
      x.fillStyle = toHex(P[k]); x.globalAlpha = 1;
      rough(x0, top + seg*k - (k?2:0), ww, seg + 4);
      x.fillStyle = toHex(P[Math.min(2,k+1)]); x.globalAlpha = .28;
      for (var m=0;m<3;m++){ var yy = top + seg*k + seg*(.2 + r()*.6); rough(x0 + ww*.08, yy, ww*.84, 2 + r()*3); }
    }
    x.globalAlpha = 1;
  }
  x.fillStyle = 'rgba(35,28,23,.22)'; x.fillRect(0,0,W,H);
  x.globalAlpha = .6; x.fillStyle = '#f3e6d6'; x.font = '500 13px "Avenir Next Condensed", sans-serif'; x.textAlign = 'center';
  for (var j=0;j<24;j+=3) x.fillText((j<10?'0':'')+j+':00', j*sw + sw/2, bot + 30);
  x.globalAlpha = 1;
}
var rt = 0; addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){ paintBackdrop(); render(); }, 120); });

buildPages();
render();
paintBackdrop();
raf = requestAnimationFrame(frame);
})();
</script>
