<title>調音 · 樂器調音器</title>
<meta name="description" content="復古頻閃調音器：紅色頻閃盤在音不準時漂移、調準時靜止，搭配鍍鉻指針表；轉動琴頭上的弦鈕調音，支援吉他、烏克麗麗、貝斯、小提琴與二胡，還有參考音與麥克風偵測。收錄於 100 Creative HTML Works（App 091・復古頻閃調音器）。">

<style>
:root{
  --blk:#0a0909;
  --crk:#141312;
  --red:#ff3a24;
  --red-lo:#5a1a12;
  --chrome:linear-gradient(180deg,#f7f7f5 0%,#b9b9b6 22%,#f0f0ee 40%,#6f6f6c 62%,#d6d6d3 82%,#9a9a97 100%);
  --txt:#ecebe7;
  --txt-2:#a19f99;
  --fut:"Futura","Futura PT","Avenir Next","PingFang TC",sans-serif;
  --zh:"PingFang TC","Heiti TC",system-ui,sans-serif;
  --out:cubic-bezier(.2,.8,.25,1);
  --spring:cubic-bezier(.3,1.35,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:15px/1.4 var(--zh);color:var(--txt);background:var(--blk);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:8px}
svg{display:block}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic .dot{fill:var(--red);stroke:none}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;isolation:isolate;background:var(--crk)}
.crinkle{position:absolute;inset:0;z-index:0;pointer-events:none}
.crinkle svg{width:100%;height:100%}
@media (min-width:521px){
  body{background:#050404}
  .stage{display:flex;align-items:center;justify-content:center;gap:72px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0;overflow:hidden}
  .backdrop svg{position:absolute;width:100%;height:100%}
  .disc{transform-origin:800px 1480px;animation:spin 60s linear infinite}
  @keyframes spin{to{transform:rotate(-360deg)}}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:54px;padding:4px;z-index:1;background:var(--chrome)}
  .device::before{content:"";position:absolute;inset:4px;border-radius:50px;background:#050404}
  .screen{inset:12px;border-radius:44px}
  .caption{display:block;position:relative;z-index:1;width:240px;color:var(--txt)}
  .caption h1{font:500 48px/1 var(--fut);letter-spacing:.2em}
  .caption .m{font:500 14px/1 var(--fut);letter-spacing:.3em;color:var(--red);margin-top:14px}
  .caption p{margin-top:18px;font-size:15px;line-height:1.7;color:var(--txt-2)}
}
@media (min-width:521px) and (max-width:880px){.caption{display:none}}
@media (min-width:521px) and (prefers-reduced-motion:reduce){.disc{animation:none}}

.status{position:absolute;top:0;left:0;right:0;z-index:30;height:calc(46px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 30px 0 34px;display:flex;align-items:center;justify-content:space-between;font:500 16px/1 var(--fut);color:var(--txt);pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}
.body{position:absolute;inset:calc(46px + env(safe-area-inset-top)) 0 0;z-index:1;overflow-y:auto;overflow-x:hidden;padding-bottom:calc(26px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.body::-webkit-scrollbar{display:none}

.hdr{display:flex;align-items:center;padding:4px 18px 0}
.hdr h1{font:500 22px/1 var(--fut);letter-spacing:.3em}
.cal{margin-left:auto;display:flex;align-items:center;height:44px;border-radius:22px;background:#1f1d1b;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.cal button{width:40px;height:44px;display:grid;place-items:center;color:var(--txt-2)}
.cal button:active{color:var(--txt)}
.cal span{font:500 14px/1 var(--fut);letter-spacing:.06em;min-width:82px;text-align:center}
.cal span b{font-weight:700;color:var(--txt)}

.readout{display:grid;grid-template-columns:auto 1fr;align-items:end;gap:0 16px;padding:10px 22px 0;min-height:104px}
.note{font:500 88px/.9 var(--fut);letter-spacing:-.01em;display:flex;align-items:flex-start}
.note sup{font-size:30px;margin-left:2px;margin-top:4px;color:var(--txt-2)}
.note sub{font-size:30px;align-self:flex-end;margin-left:2px;color:var(--txt-2)}
.rd2{padding-bottom:6px}
.cents{font:500 34px/1 var(--fut);font-variant-numeric:tabular-nums;color:var(--txt)}
.cents small{font-size:18px;color:var(--txt-2);margin-left:2px}
.hz{font:500 14px/1.4 var(--fut);color:var(--txt-2);margin-top:6px;letter-spacing:.04em}
.lamp{display:inline-flex;align-items:center;gap:7px;font:500 12px/1 var(--fut);letter-spacing:.24em;color:#6d6a64;margin-top:8px}
.lamp i{width:10px;height:10px;border-radius:50%;background:var(--red-lo);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.lamp.on{color:var(--txt)}
.lamp.on i{background:var(--red);box-shadow:inset 0 -1px 1px rgba(120,10,0,.6),inset 0 1px 1px rgba(255,220,210,.7)}

/* strobe window: chrome bezel, the signature */
.bezel{margin:12px 14px 0;padding:5px;border-radius:18px;background:var(--chrome)}
.win{position:relative;height:150px;border-radius:13px;overflow:hidden;background:#000}
.win canvas{position:absolute;inset:0;width:100%;height:100%}
.win::after{content:"";position:absolute;inset:0;border-radius:13px;pointer-events:none;background:linear-gradient(172deg,rgba(255,255,255,.14),rgba(255,255,255,0) 34%),linear-gradient(0deg,rgba(0,0,0,.45),rgba(0,0,0,0) 30%)}
.win .flat{position:absolute;left:10px;bottom:8px;font:500 12px/1 var(--fut);letter-spacing:.22em;color:#8a8780;z-index:2}
.win .sharp{position:absolute;right:10px;bottom:8px;font:500 12px/1 var(--fut);letter-spacing:.22em;color:#8a8780;z-index:2}
.win .idx{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(236,235,231,.4);z-index:2}

/* needle meter */
.meter{position:relative;margin:10px 14px 0;height:92px}
.meter svg{width:100%;height:100%;overflow:visible}
.meter text{font:500 12px var(--fut);fill:var(--txt-2)}

/* instrument + headstock */
.inst{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 0}
.inst button.arr{width:48px;height:48px;display:grid;place-items:center;color:var(--txt-2)}
.inst button.arr:active{color:var(--txt)}
.inst .nm{text-align:center;flex:1;height:48px}
.inst .nm b{display:block;font:600 19px/1.2 var(--zh);letter-spacing:.14em}
.inst .nm span{font:500 13px/1.3 var(--fut);letter-spacing:.14em;color:var(--txt-2)}
.head{position:relative;margin:4px 0 0;touch-action:pan-y}
.head svg{width:100%;height:auto}
.peg{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;touch-action:none;display:grid;place-items:center}
.peg .lb{position:absolute;top:50%;font:500 14px/1 var(--fut);transform:translateY(-50%);white-space:nowrap;display:flex;align-items:center;gap:4px;color:var(--txt-2);pointer-events:none}
.peg.l .lb{right:52px}
.peg.r .lb{left:52px}
.peg.sel .lb{color:var(--txt)}
.peg .lb svg{width:14px;height:14px;fill:none;stroke:var(--red);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.peg .ring{position:absolute;inset:2px;border-radius:50%;border:2px solid transparent;transition:border-color .2s}
.peg.sel .ring{border-color:var(--red)}
.prog{text-align:center;font:500 13px/1 var(--fut);letter-spacing:.14em;color:var(--txt-2);margin-top:4px}

.ctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 14px 0}
.ctl button{height:62px;border-radius:14px;background:#1f1d1b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 13px var(--zh);letter-spacing:.06em;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:background-color .15s,transform .12s}
.ctl button:active{transform:scale(.96)}
.ctl button.on{background:var(--txt);color:var(--blk)}
.ctl button.on .ic{stroke:var(--blk)}
.more{display:block;margin:14px auto 0;height:44px;padding:0 18px;font:600 14px var(--zh);color:var(--txt-2);letter-spacing:.08em}
.more:active{color:var(--txt)}

.home-ind{position:absolute;left:50%;bottom:calc(7px + env(safe-area-inset-bottom)*.3);width:130px;height:5px;margin-left:-65px;border-radius:3px;background:#d9d8d4;z-index:25;pointer-events:none}

.scrim{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;max-height:84%;display:flex;flex-direction:column;border-radius:26px 26px 0 0;background:#1a1817;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);transform:translateY(105%);visibility:hidden;transition:transform .5s var(--spring),visibility 0s .5s;touch-action:none;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none;visibility:visible;transition:transform .5s var(--spring)}
.sheet.drag{transition:none}
.grab{flex:none;height:30px;display:grid;place-items:center;cursor:grab}
.grab i{width:44px;height:5px;border-radius:3px;background:#4a4744}
.sb{overflow-y:auto;padding:0 20px 24px;touch-action:pan-y;overscroll-behavior:contain}
.sb h3{font:500 22px var(--fut);letter-spacing:.16em}
.sb p{font-size:13px;color:var(--txt-2);margin-top:4px}
.opts{margin-top:14px}
.opts button{width:100%;min-height:62px;display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;padding:8px 4px;border-top:1px solid #2a2725}
.opts button:active{background:#22201e}
.opts b{font:600 16px var(--zh)}
.opts span{font:500 14px var(--fut);letter-spacing:.1em;color:var(--txt-2)}
.opts .on b{color:var(--red)}
.wide{width:100%;height:52px;margin-top:16px;border-radius:14px;background:#2a2725;font:600 15px var(--zh);letter-spacing:.08em}
.wide:active{background:#34302d}

.toast{position:absolute;left:50%;top:calc(54px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-170%);visibility:hidden;transition:transform .4s var(--spring),visibility 0s .4s;
  height:42px;padding:0 18px;display:flex;align-items:center;border-radius:21px;background:var(--txt);color:var(--blk);font:600 14px var(--zh);white-space:nowrap}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .4s var(--spring)}
@media (prefers-reduced-motion:reduce){
  .sheet,.toast{transition-duration:.01s}
  .ctl button:active{transform:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="chr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f7f5"/><stop offset=".22" stop-color="#b9b9b6"/><stop offset=".4" stop-color="#f0f0ee"/><stop offset=".62" stop-color="#6f6f6c"/><stop offset=".82" stop-color="#d6d6d3"/><stop offset="1" stop-color="#9a9a97"/></linearGradient>
  <linearGradient id="chrH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8e8e8b"/><stop offset=".3" stop-color="#f4f4f2"/><stop offset=".55" stop-color="#a9a9a6"/><stop offset=".8" stop-color="#e6e6e3"/><stop offset="1" stop-color="#777774"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e1a17"/><stop offset=".5" stop-color="#2d2723"/><stop offset="1" stop-color="#1a1714"/></linearGradient>
  <linearGradient id="wood2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a2e16"/><stop offset=".5" stop-color="#7a4222"/><stop offset="1" stop-color="#4c2612"/></linearGradient>
</defs></svg>
<div class="stage">
  <div class="backdrop" aria-hidden="true">
    <svg viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
      <rect width="1600" height="1000" fill="#050404"/>
      <g class="disc" id="bdDisc"></g>
      <rect x="0" y="0" width="1600" height="1000" fill="url(#bdShade)"/>
      <defs><linearGradient id="bdShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050404" stop-opacity=".2"/><stop offset=".6" stop-color="#050404" stop-opacity=".55"/><stop offset="1" stop-color="#050404" stop-opacity=".92"/></linearGradient></defs>
    </svg>
  </div>
  <div class="caption">
    <h1>調音</h1>
    <div class="m">STROBE · 440</div>
    <p>紅色頻閃盤往右漂是偏高，往左漂是偏低，停住就準了。轉動琴頭上的弦鈕，看著它慢慢停下來。</p>
  </div>
  <div class="device">
    <div class="screen" id="screen">
      <div class="crinkle" aria-hidden="true"><svg><filter id="crk"><feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .48  0 0 0 0 .46  0 0 0 .28 0"/></filter><rect width="100%" height="100%" fill="#141312"/><rect width="100%" height="100%" filter="url(#crk)"/></svg></div>
      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="g">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="#ecebe7"><circle cx="2" cy="10" r="2"/><circle cx="7" cy="7.5" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="16.5" cy="2.5" r="1.5" fill="none" stroke="#ecebe7" stroke-width="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#ecebe7" stroke-width="1.6" stroke-linecap="round"><path d="M1.6 4.8a9 9 0 0 1 12.8 0M4.2 7.6a5.3 5.3 0 0 1 7.6 0"/><circle cx="8" cy="10.3" r="1.3" fill="#ecebe7" stroke="none"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x="1" y="1" width="21" height="10" rx="5" fill="none" stroke="#ecebe7" stroke-width="1.4"/><rect id="batt" x="3" y="3" width="14" height="6" rx="3" fill="#ecebe7"/><circle cx="24" cy="6" r="1.4" fill="#ecebe7"/></svg>
        </span>
      </div>

      <div class="body" id="body">
        <div class="hdr">
          <h1>調音</h1>
          <div class="cal" aria-label="標準音校正">
            <button id="calDn" aria-label="A4 降低 1 赫茲"><svg class="ic" viewBox="0 0 24 24"><path d="M14.5 6 8.5 12l6 6"/></svg></button>
            <span>A4 <b id="calV">440</b> Hz</span>
            <button id="calUp" aria-label="A4 提高 1 赫茲"><svg class="ic" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></svg></button>
          </div>
        </div>

        <div class="readout" aria-live="polite">
          <div class="note" id="note">E<sub>2</sub></div>
          <div class="rd2">
            <div class="cents" id="cents">--<small>¢</small></div>
            <div class="hz" id="hz">82.41 Hz 目標</div>
            <div class="lamp" id="lamp"><i></i>IN TUNE</div>
          </div>
        </div>

        <div class="bezel"><div class="win" id="win"><canvas id="strobe"></canvas><span class="idx"></span><span class="flat">♭ FLAT</span><span class="sharp">SHARP ♯</span></div></div>

        <div class="meter"><svg viewBox="0 0 362 92" id="meter"></svg></div>

        <div class="inst">
          <button class="arr" id="prevI" aria-label="上一種樂器"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button>
          <button class="nm" id="instBtn" aria-label="調音方式"><b id="instN">吉他</b><span id="instP">STANDARD · E A D G B E</span></button>
          <button class="arr" id="nextI" aria-label="下一種樂器"><svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
        <div class="head" id="head"></div>
        <div class="prog" id="prog"></div>

        <div class="ctl">
          <button id="refBtn" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M6 12c1.5-4 3-4 4.5 0s3 4 4.5 0 2.5-3 3-1.5"/><circle class="dot" cx="12" cy="3" r="1.8"/></svg>參考音</button>
          <button id="pluckBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M5 19 12 5l7 14z"/><path d="M3 12h4M17 12h4"/><circle class="dot" cx="12" cy="14" r="1.8"/></svg>撥弦</button>
          <button id="micBtn" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24"><rect x="8.5" y="3" width="7" height="12" rx="3.5"/><path d="M5 11.5a7 7 0 0 0 14 0M12 18.5V21"/><circle class="dot" cx="12" cy="21" r="1.6"/></svg>麥克風</button>

      <div class="toast" id="toast" role="status"></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };
function haptic(p){ try{ if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return; navigator.vibrate && navigator.vibrate(p||8); }catch(e){} }
var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
var KEY = 'app091:';
function load(k, d){ try{ var v = localStorage.getItem(KEY+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(KEY+k, JSON.stringify(v)); }catch(e){} }

// ---------- instruments ----------
var INST = [
 {id:'gt', n:'吉他', en:'GUITAR', presets:[{n:'標準', en:'STANDARD', s:['E2','A2','D3','G3','B3','E4']},{n:'Drop D', en:'DROP D', s:['D2','A2','D3','G3','B3','E4']},{n:'DADGAD', en:'DADGAD', s:['D2','A2','D3','G3','A3','D4']},{n:'Open G', en:'OPEN G', s:['D2','G2','D3','G3','B3','D4']}]},
 {id:'uk', n:'烏克麗麗', en:'UKULELE', presets:[{n:'標準', en:'STANDARD', s:['G4','C4','E4','A4']},{n:'Low G', en:'LOW G', s:['G3','C4','E4','A4']}]},
 {id:'bs', n:'貝斯', en:'BASS', presets:[{n:'標準', en:'STANDARD', s:['E1','A1','D2','G2']},{n:'Drop D', en:'DROP D', s:['D1','A1','D2','G2']}]},
 {id:'vn', n:'小提琴', en:'VIOLIN', presets:[{n:'標準', en:'STANDARD', s:['G3','D4','A4','E5']}]},
 {id:'eh', n:'二胡', en:'ERHU', presets:[{n:'標準', en:'STANDARD · 內 D 外 A', s:['D4','A4']}]}
];
var NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function midi(n){ var m = n.match(/^([A-G]#?)(-?\d)$/); return NAMES.indexOf(m[1]) + (+m[2] + 1) * 12; }
function freqOf(m){ return S.a4 * Math.pow(2, (m - 69) / 12); }

  function end(e){ if (!drag) return; drag = false; sheet.classList.remove('drag'); scrim.style.opacity = ''; var v = dy / Math.max(1, e.timeStamp - t0); if (dy > sheet.offsetHeight * .35 || (v > .6 && dy > 20)) closeSheet(); else sheet.style.transform = ''; }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();
function presetSheet(){
  var i = inst(), cur = S.preset[i.id] || 0;
  var h = '<h3>' + i.en + '</h3><p>' + i.n + '的調音方式</p><div class="opts">' + i.presets.map(function(p, k){ return '<button data-p="' + k + '" class="' + (k === cur ? 'on' : '') + '"><b>' + p.n + '</b><span>' + p.s.join(' ').replace(/#/g, '♯') + '</span></button>'; }).join('') + '</div>';
  h += '<p style="margin-top:18px">換樂器</p><div class="opts">' + INST.map(function(x, k){ return '<button data-i="' + k + '" class="' + (k === S.inst ? 'on' : '') + '"><b>' + x.n + '</b><span>' + x.en + '</span></button>'; }).join('') + '</div>';
  openSheet(h);
}
$('instBtn').addEventListener('click', function(){ audio(); tick(); presetSheet(); });
sheet.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.p != null){ S.preset[inst().id] = +b.dataset.p; save('preset', S.preset); S.sel = 0; delete S.det[inst().id]; dets(); save('det', S.det); renderHead(); closeSheet(); toast(inst().n + '：' + preset().n); }
  if (b.dataset.i != null){ setInst(+b.dataset.i); closeSheet(); }
});

// ---------- loop ----------
var raf = 0, last = performance.now(), wob = 0, shownC = null;
function loop(t){
  raf = requestAnimationFrame(loop);
  var dt = Math.min(50, t - last); last = t;
  var target = midi(strings()[S.sel]);
  if (source === 'mic' && an){
    var r = detectPitch();
    if (r){ var m = 69 + 12 * Math.log2(r.f / S.a4), near = Math.round(m); sigMidi = near; sigCents = (m - near) * 100; sig = Math.min(1, r.rms * 12);
      var k = -1, bd = 99; strings().forEach(function(n, j){ var dd = Math.abs(midi(n) - m); if (dd < bd){ bd = dd; k = j; } }); if (k >= 0 && k !== S.sel && bd < .5) selectString(k, true);
      sigCents = (m - midi(strings()[S.sel])) * 100; }
    else sig *= .9;
  } else if (source === 'ref'){ sig = .9; sigCents = 0; }
  else if (source === 'pluck'){
    wob += dt * .011; sig *= Math.pow(.99972, dt);
    sigCents = dets()[S.sel] + Math.sin(wob) * .6 * sig + (sig > .8 ? (sig - .8) * 18 : 0);
    if (sig < .02){ sig = 0; source = 'none'; }
  } else { sig *= .9; }
  drawStrobe(dt);
  var c = Math.max(-50, Math.min(50, sigCents)), live = sig > .03;
  var ta = live ? c * 1.1 : -58; nAng += (ta - nAng) * Math.min(1, dt * .012);
  if (needle) needle.setAttribute('transform', 'rotate(' + nAng.toFixed(2) + ' 181 150)');
  var txt = live ? (sigCents >= 0 ? '+' : '') + sigCents.toFixed(Math.abs(sigCents) < 10 ? 1 : 0) : '--';
  if (txt !== shownC){ shownC = txt; $('cents').innerHTML = txt + '<small>¢</small>'; }
  var ok = live && Math.abs(sigCents) <= 2 && source !== 'ref';
  $('lamp').classList.toggle('on', ok || (source === 'ref' && live));
  if (ok){ inTuneT += dt; if (inTuneT > 600){ markDone(); inTuneT = -99999; } } else if (inTuneT > 0 || !live) inTuneT = 0;
  if (live && Math.abs(sigCents) > 6){ var dn = doneOf(), ix = dn.indexOf(S.sel); if (ix >= 0 && source === 'pluck'){ dn.splice(ix, 1); save('done', S.done); renderHead(); } }
}
function markDone(){
  var dn = doneOf(); if (dn.indexOf(S.sel) >= 0) return;
  dn.push(S.sel); save('done', S.done); ding(); haptic([10, 50, 18]);
  var s = strings(); renderHead();
  if (dn.length >= s.length) toast('全部調準了，可以開始彈了');
  else { toast(s[S.sel].replace('#', '♯') + ' 調準了'); var nx = -1; for (var k = 1; k <= s.length; k++){ var j = (S.sel + k) % s.length; if (dn.indexOf(j) < 0){ nx = j; break; } } if (nx >= 0) setTimeout(function(){ selectString(nx, true); }, 900); }
}
document.addEventListener('visibilitychange', function(){ cancelAnimationFrame(raf); if (!document.hidden){ last = performance.now(); raf = requestAnimationFrame(loop); } });
window.addEventListener('resize', sizeStrobe);

// backdrop disc (desktop only)
(function(){
  var g = $('bdDisc'), h = '', cxd = 800, cyd = 1480;
  [[1400, 60], [1320, 120], [1240, 240], [1160, 480]].forEach(function(b){
    var r0 = b[0], r1 = r0 - 64, n = b[1], seg = Math.PI * 2 / n;
    for (var k = 0; k < n; k++){ var a = k * seg, a2 = a + seg / 2;
      h += '<path d="M' + (cxd + r0 * Math.cos(a)).toFixed(1) + ' ' + (cyd + r0 * Math.sin(a)).toFixed(1) + 'A' + r0 + ' ' + r0 + ' 0 0 1 ' + (cxd + r0 * Math.cos(a2)).toFixed(1) + ' ' + (cyd + r0 * Math.sin(a2)).toFixed(1) + 'L' + (cxd + r1 * Math.cos(a2)).toFixed(1) + ' ' + (cyd + r1 * Math.sin(a2)).toFixed(1) + 'A' + r1 + ' ' + r1 + ' 0 0 0 ' + (cxd + r1 * Math.cos(a)).toFixed(1) + ' ' + (cyd + r1 * Math.sin(a)).toFixed(1) + 'z" fill="#ff3a24" opacity=".72"/>'; }
  });
  h += '<circle cx="' + cxd + '" cy="' + cyd + '" r="1080" fill="#0c0b0a"/><circle cx="' + cxd + '" cy="' + cyd + '" r="1080" fill="none" stroke="#9a9a97" stroke-width="10"/>';
  g.innerHTML = h;
})();

buildMeter(); renderHead(); sizeStrobe();
sig = .95; source = 'pluck'; // the tuner opens mid-pluck so the strobe is already drifting
raf = requestAnimationFrame(loop);
})();
</script>
