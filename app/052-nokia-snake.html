<style>
:root{
  --shell:#20231a;--shell2:#2b2f22;--shell3:#16180f;--key:#383d2c;--key2:#2c3023;--legend:#d7dcc2;--legend2:#9aa383;--lit:#c6f06a;

html,body{height:100%}
body{font:15px/1.45 var(--cjk);background:#161810;color:var(--legend);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}

svg{display:block}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}

  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));padding:12px;z-index:1;
    border-radius:74px 74px 96px 96px / 60px 60px 130px 130px;background:#2e3325;
    box-shadow:inset 0 2px 0 rgba(230,240,200,.14),inset 0 -3px 0 rgba(0,0,0,.35),0 14px 24px -16px rgba(20,26,8,.8)}
  .screen{inset:12px;border-radius:64px 64px 86px 86px / 52px 52px 122px 122px}
  .caption{display:block;position:relative;z-index:1;max-width:240px;padding:20px 22px;background:#1d2610;color:#b5cf6a}
  .caption h1{font:600 30px/1.1 var(--cjk);letter-spacing:.08em}
  .caption p{margin-top:10px;font-size:15px;line-height:1.7;color:rgba(181,207,106,.78)}
}
@media (min-width:521px) and (max-width:900px){.caption{display:none}}

.phone{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:0 14px calc(22px + env(safe-area-inset-bottom));

.status{flex:none;width:100%;display:flex;align-items:center;justify-content:space-between;height:calc(44px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0 22px;font:600 15px/1 var(--sans);color:var(--legend2);letter-spacing:.04em;pointer-events:none}

.status svg *{fill:currentColor}
@media (display-mode:standalone){.status{display:none}}
.top{flex:1 1 44px;max-height:104px;min-height:34px;position:relative;width:100%;display:flex;align-items:center;justify-content:center}
.ear{width:64px;height:10px;border-radius:5px;background:var(--shell3);box-shadow:inset 0 2px 0 rgba(0,0,0,.5),0 1px 0 rgba(230,240,200,.08)}
.manual{position:absolute;right:0;top:50%;margin-top:-22px;width:48px;height:44px;display:grid;place-items:center;color:var(--legend2);transition:color .2s}
.manual:active{color:var(--lit)}
.manual svg *{fill:currentColor}

/* the lens: flat top, a smile-curved bottom edge */
.lens{flex:none;position:relative;width:100%;padding:16px 16px 34px;background:#0f110b;
  border-radius:26px 26px 50% 50% / 26px 26px 34px 34px;box-shadow:inset 0 1px 0 rgba(230,240,200,.12),0 1px 0 rgba(230,240,200,.06)}
.lcdbox{position:relative;width:100%;aspect-ratio:84/48;background:var(--lcd);border-radius:3px;overflow:hidden;touch-action:none;transition:background-color .6s}
.lcdbox canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.lcdbox::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 3px 0 rgba(29,38,16,.28),inset 3px 0 0 rgba(29,38,16,.12)}
.mark{position:absolute;left:0;right:0;bottom:9px;text-align:center;font:700 11px/1 var(--sans);letter-spacing:.4em;color:#5d6450}

.pad{flex:1 1 auto;width:100%;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-top:18px;min-height:0;max-height:430px}
.navrow{display:grid;grid-template-columns:62px 1fr 62px;gap:14px;align-items:center}
.k{position:relative;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--legend);background:linear-gradient(#41462f,#343826 55%,#2c3023);
  box-shadow:inset 0 1px 0 rgba(230,240,200,.16),0 2px 0 #13150d;transition:transform .06s,background .1s,color .3s}
.k:active,.k.down{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(230,240,200,.08),0 0 0 #13150d;background:#2c3023}
.kc{height:56px;border-radius:50% 40% 40% 50% / 50%;font:700 20px/1 var(--sans)}
.navi{height:60px;border-radius:14px 14px 50% 50% / 14px 14px 30px 30px;background:linear-gradient(#cfd8ae,#b9c393);color:#1d2610;font:600 15px/1 var(--cjk);letter-spacing:.1em;

.rock{height:60px;display:flex;flex-direction:column;border-radius:40% 50% 50% 40% / 50%;overflow:hidden;background:#2c3023;box-shadow:0 2px 0 #13150d}
.rock button{flex:1;display:grid;place-items:center;color:var(--legend);background:linear-gradient(#41462f,#343826);transition:background .1s}
.rock button + button{box-shadow:inset 0 1px 0 #1b1d13;background:linear-gradient(#343826,#2c3023)}
.rock button:active,.rock button.down{background:#262a1d}
.rock svg *{fill:currentColor}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px}
.keys .k{height:clamp(44px,7vh,60px);flex-direction:row;font:600 22px/1 var(--sans)}
.keys .k small{font:500 11px/1.05 var(--cjk);color:var(--legend2);letter-spacing:0;max-width:30px;text-align:left;transition:color .3s}
.keys .k:nth-child(3n+1){border-radius:24px 12px 12px 24px / 24px 12px 12px 24px;transform:translateY(4px)}
.keys .k:nth-child(3n+2){border-radius:12px}
.keys .k:nth-child(3n){border-radius:12px 24px 24px 12px / 12px 24px 24px 12px;transform:translateY(4px)}
.keys .k:nth-child(3n+1):active,.keys .k:nth-child(3n):active,.keys .k:nth-child(3n+1).down,.keys .k:nth-child(3n).down{transform:translateY(6px)}
.keys .k.dir{color:#e3ead0}
.keys .k .ar{position:absolute;top:5px;left:50%;margin-left:-4px}
.keys .k .ar *{fill:var(--legend2);transition:fill .3s}
.screen.lit .k,.screen.lit .rock button{color:var(--lit)}
.screen.lit .navi{color:#1d2610}
.screen.lit .keys .k small{color:#a3c65a}
.screen.lit .keys .k .ar *{fill:var(--lit)}
.homebar{position:absolute;z-index:70;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--legend2);opacity:.6;pointer-events:none}

/* manual sheet: a printed page from the handbook */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(10,12,6,.55);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:10px;right:10px;bottom:0;z-index:51;max-height:88%;display:flex;flex-direction:column;background:var(--paper);color:#1d2610;border-radius:6px 6px 0 0;
  transform:translateY(calc(100% + 20px));transition:transform .5s var(--spring);touch-action:none;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(29,38,16,.3);margin:10px auto 4px;flex:none}
.sbody{overflow:auto;padding:6px 20px 26px;overscroll-behavior:contain;touch-action:pan-y}
.pg{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:rgba(29,38,16,.6)}
.sheet h3{font:600 26px/1.2 var(--cjk);margin:2px 0 12px;letter-spacing:.04em}
.kt{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kt b{font:700 15px/1.45 var(--sans);white-space:nowrap}
.set{margin-top:20px}
.set .l{font-size:13px;font-weight:600;color:rgba(29,38,16,.62);margin-bottom:6px}
.seg{display:flex;border:2px solid #1d2610}
.seg button{flex:1;height:44px;font-weight:600;transition:background-color .15s,color .15s}
.seg button + button{border-left:2px solid #1d2610}
.seg button[aria-pressed=true]{background:#1d2610;color:var(--paper)}
.log{margin-top:22px}
.log .h{display:flex;justify-content:space-between;align-items:center}
.log .h b{font-size:17px}
.log .h button{height:44px;padding:0 4px;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.lr{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;height:42px;font-size:14px;border-top:1px dashed rgba(29,38,16,.3)}
.lr .s{font:700 18px/1 var(--sans);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.lr .m{color:rgba(29,38,16,.62)}
.none{font-size:14px;color:rgba(29,38,16,.6);padding:10px 0}
.toast{position:absolute;left:50%;top:calc(52px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-160px);transition:transform .4s var(--spring);display:flex;align-items:center;gap:12px;height:46px;padding:0 6px 0 16px;background:#1d2610;color:#b5cf6a;font-size:14px;font-weight:600;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.toast button{height:40px;padding:0 12px;color:var(--paper)}

@media (max-height:700px){
  .top{height:30px} .lens{padding:12px 14px 28px} .pad{gap:10px;padding-top:8px} .keys{gap:8px 12px} .navrow .kc,.navi{height:50px}
  .rock{height:60px} /* rocker keeps two 30px halves so each direction stays tappable */
}
@media (prefers-reduced-motion:reduce){
  .sheet,.toast{transition-duration:.01s}
  .k,.keys .k:nth-child(n){transition:none}
}

 ['01110','10001','00001','00110','01000','10000','11111'],['11110','00001','00001','01110','00001','00001','11110'],

  h += '<div class="set"><div class="l">背光</div><div class="seg" data-set="back">'+['自動熄滅','常亮'].map(function(t,i){ return '<button data-v="'+i+'" aria-pressed="'+(backMode===i)+'">'+t+'</button>'; }).join('')+'</div></div>';
  h += '<div class="set"><div class="l">按鍵音</div><div class="seg" data-set="sound">'+['關','開'].map(function(t,i){ return '<button data-v="'+i+'" aria-pressed="'+((sound?1:0)===i)+'">'+t+'</button>'; }).join('')+'</div></div>';
  h += '<div class="log"><div class="h"><b>對局紀錄</b>'+(logs.length ? '<button id="clearLog">清除紀錄</button>' : '')+'</div>';
  if (!logs.length) h += '<div class="none">還沒有紀錄。去吃第一顆點吧。</div>';
  logs.slice(0, 12).forEach(function(g){ h += '<div class="lr"><span>'+fmtT(g.t)+'</span><span class="m">等級 '+g.l+'　'+MAZES[g.m].n+'</span><span class="s">'+g.s+'</span></div>'; });
  h += '</div>';
  sbody.innerHTML = h;
}
function openSheet(){ lastFocus = document.activeElement; renderManual(); sbody.scrollTop = 0; sheet.style.transform = ''; sheet.classList.add('on'); scrim.classList.add('on'); haptic(6); if (state === 'game') setState('pause'); var f = sheet.querySelector('button'); if (f) f.focus({preventScroll:true}); }
function closeSheet(){ if (!sheet.classList.contains('on')) return; sheet.classList.remove('on','drag'); sheet.style.transform = ''; scrim.classList.remove('on'); scrim.style.opacity = ''; if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); }
$('manBtn').addEventListener('click', openSheet);
scrim.addEventListener('click', closeSheet);
var undo = null, toastT = 0;
function toast(msg, u){ $('toastMsg').textContent = msg; $('toastUndo').hidden = !u; undo = u || null; $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ $('toast').classList.remove('on'); undo = null; }, 3200); }
$('toastUndo').addEventListener('click', function(){ if (!undo) return; logs = undo; undo = null; save('log', logs); renderManual(); $('toast').classList.remove('on'); haptic(8); });
sbody.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.id === 'clearLog'){ var snap = logs.slice(); logs = []; save('log', logs); renderManual(); toast('已清除 '+snap.length+' 筆紀錄', snap); haptic([10,30,10]); return; }
  var seg = b.closest('.seg'); if (!seg) return;
  var v = +b.dataset.v;
  if (seg.dataset.set === 'ghost'){ ghost = v; save('ghost', v); }
  if (seg.dataset.set === 'back'){ backMode = v; save('back', v); wake(); }
  if (seg.dataset.set === 'sound'){ sound = v === 1; save('sound', sound); if (sound) keyTone(); }
  [].forEach.call(seg.children, function(x){ x.setAttribute('aria-pressed', x === b); }); haptic(5);
});
(function(){
  var sy = 0, dy = 0, t0 = 0, on = false;
  sheet.addEventListener('pointerdown', function(e){ if (e.target.closest('button')) return; if (sbody.contains(e.target) && sbody.scrollTop > 0) return; on = true; sy = e.clientY; dy = 0; t0 = e.timeStamp; sheet.classList.add('drag'); });
  sheet.addEventListener('pointermove', function(e){ if (!on) return; dy = e.clientY - sy; if (Math.abs(dy) > 4 && !sheet.hasPointerCapture(e.pointerId)) try{ sheet.setPointerCapture(e.pointerId); }catch(er){} sheet.style.transform = 'translateY('+(dy > 0 ? dy : dy/6).toFixed(1)+'px)'; scrim.style.opacity = Math.max(0, 1 - dy/sheet.offsetHeight).toFixed(2); });
  function end(e){ if (!on) return; on = false; sheet.classList.remove('drag'); scrim.style.opacity = ''; var v = dy/Math.max(1, e.timeStamp - t0); if (dy > sheet.offsetHeight*.35 || v > .6) closeSheet(); else sheet.style.transform = ''; }
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();

/* ---------- desktop backdrop: the LCD, magnified, with a slow snake ---------- */
var bd = $('bd'), bx = bd.getContext('2d'), bdSnake = [], bdT = 0;
var bdDirty = true, bdRaf = 0;
function bdSize(){ var d = Math.min(2, devicePixelRatio||1); bd.width = innerWidth*d; bd.height = innerHeight*d; bdDirty = true; bdKick(); }
function drawBackdrop(dt){
  if (!bd.offsetParent && getComputedStyle(bd.parentNode).display === 'none') return;
  var P = 22*Math.min(2, devicePixelRatio||1), cols = Math.ceil(bd.width/P), rows = Math.ceil(bd.height/P);
  bdT += dt;
  if (!bdSnake.length){ for (var i=0;i<26;i++) bdSnake.push([4 - i, Math.floor(rows*.72)]); bdSnake.dir = [1,0]; bdSnake.acc = 0; }
  bdSnake.acc += dt;
  var stepped = false;
  if (!reduce && bdSnake.acc > .16){ stepped = true;
    bdSnake.acc = 0; var h = bdSnake[0], d = bdSnake.dir;
    if (Math.random() < .08) d = Math.random() < .5 ? [d[1], -d[0]] : [-d[1], d[0]];
    var nx = h[0] + d[0], ny = h[1] + d[1];
    if (ny < 2 || ny > rows - 3){ d = [d[1] || 1, 0]; nx = h[0] + d[0]; ny = h[1]; }
    bdSnake.dir = d; bdSnake.unshift([(nx + cols) % cols, ny]); bdSnake.pop();
  }
  // the backdrop only changes when the snake steps (every 160 ms) or after a resize, so skip the ~2700-cell repaint otherwise
  if (!stepped && !bdDirty) return; bdDirty = false;
  bx.fillStyle = '#8f9d57'; bx.fillRect(0,0,bd.width,bd.height);
  bx.fillStyle = 'rgba(29,38,16,.07)';
  for (var y=0;y<rows;y++) for (var x=0;x<cols;x++) bx.fillRect(x*P+2, y*P+2, P-4, P-4);
  bx.fillStyle = 'rgba(29,38,16,.5)';
  bdSnake.forEach(function(s){ bx.fillRect(s[0]*P+2, s[1]*P+2, P-4, P-4); });
}
var bdLast = performance.now();
function bdLoop(now){
  bdRaf = 0;
  var dt = Math.min(.2, (now - bdLast)/1000); bdLast = now;
  if (document.hidden || innerWidth < 521) return; // phone layout / background tab: stop; resize or visibilitychange restarts it
  drawBackdrop(dt);
  if (!reduce) bdRaf = requestAnimationFrame(bdLoop);
}
function bdKick(){ if (!bdRaf && !document.hidden && innerWidth >= 521){ bdLast = performance.now(); bdRaf = requestAnimationFrame(bdLoop); } }
document.addEventListener('visibilitychange', bdKick);

/* ---------- clock & boot ---------- */
function tick(){ var n = new Date(); $('clock').textContent = n.getHours()+':'+String(n.getMinutes()).padStart(2,'0'); }
tick(); setInterval(tick, 20000);
var rt = 0; addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){ sizeLCD(); bdSize(); }, 100); });
sizeLCD(); bdSize(); updateNavi(); wake();
raf = requestAnimationFrame(loop);
})();
</script>
