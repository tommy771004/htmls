<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9dfc6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="野鳥">
<title>野鳥 · 鳥類圖鑑</title>
<meta name="description" content="十二幅手工上色的台灣野鳥版畫圖鑑：依棲地與特有種篩選、聽合成的叫聲與聲譜、打勾已見並寫下觀察紀錄。收錄於 100 Creative HTML Works（App 082・奧杜邦圖鑑版畫）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/app/082-field-birds.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23efe5cc'/%3E%3Cpath d='M8 50c14-6 30-4 48-10' stroke='%236b4a2e' stroke-width='4' fill='none'/%3E%3Cpath d='M18 44l-12 10 16-6z' fill='%234f7fb8'/%3E%3Cellipse cx='32' cy='36' rx='14' ry='9' fill='%234f7fb8' stroke='%232a2118' stroke-width='2'/%3E%3Ccircle cx='44' cy='26' r='7' fill='%232a2118'/%3E%3Cpath d='M50 26l8 2-8 2z' fill='%23c2352a'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
:root{
  --paper:#ece2c9;--plate:#f5eedc;--plate-2:#e3d7ba;--ink:#2a2118;--ink-2:#5d4f3e;--ink-3:#8c7c64;--ox:#8c2b1f;--moss:#5f6b3c;--wash:#c79a4a;
  --bask:"Baskerville","Baskerville Old Face","Songti TC","Hoefler Text",Georgia,serif;
  --song:"Songti TC","Baskerville","STSong",serif;
  --ui:system-ui,-apple-system,"PingFang TC",sans-serif;
  --ease:cubic-bezier(.22,.8,.2,1);
}
body{font-family:var(--song);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--ox);outline-offset:2px}
input{font:inherit;color:inherit}
svg{display:block}
i.it,.lat{font-family:var(--bask);font-style:italic}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--paper);isolation:isolate}
.grain{position:absolute;inset:0;z-index:0;pointer-events:none}
.grain svg{width:100%;height:100%}
@media (min-width:521px){
  body{background:#d9cba8}
  .stage{display:flex;align-items:center;justify-content:center;gap:66px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:52px;padding:11px;z-index:1;background:#3b2a1d;
    box-shadow:inset 0 0 0 1.5px #6b5038,inset 0 0 0 4px #2a1d13,0 3px 3px rgba(60,40,20,.35),0 20px 24px -18px rgba(60,40,20,.7)}
  .screen{inset:11px;border-radius:41px}
  .caption{display:block;position:relative;z-index:1;max-width:260px;color:var(--ink)}
  .caption b{display:block;font:400 52px/1 var(--song)}
  .caption em{display:block;font:italic 22px/1.2 var(--bask);color:var(--ink-2);margin-top:8px}
  .caption span{display:block;margin-top:16px;font:15px/1.8 var(--song);color:var(--ink-2)}
}
@media (min-width:521px) and (max-width:860px){.caption{display:none}}

.status{position:absolute;top:0;left:0;right:0;z-index:70;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 30px 0 34px;display:flex;align-items:center;justify-content:space-between;font:600 16px/1 var(--ui);color:var(--ink);pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
.status svg{fill:currentColor}
@media (display-mode:standalone){.status{display:none}}
.home{position:absolute;left:50%;bottom:calc(7px + env(safe-area-inset-bottom)*.3);width:132px;height:5px;margin-left:-66px;border-radius:3px;background:var(--ink);opacity:.8;z-index:96;pointer-events:none}

/* pages */
.page{position:absolute;left:0;right:0;top:calc(48px + env(safe-area-inset-top));bottom:calc(78px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;z-index:2;scrollbar-width:none;overscroll-behavior:contain;transition:transform .45s var(--ease),opacity .3s}
.page::-webkit-scrollbar{display:none}
#pJournal{transform:translateX(12%);opacity:0;pointer-events:none;visibility:hidden}
.screen.jr #pPlates{transform:translateX(-12%);opacity:0;pointer-events:none}
.screen.jr #pJournal{transform:none;opacity:1;pointer-events:auto;visibility:visible}

.mast{padding:8px 22px 4px;display:flex;align-items:flex-end;justify-content:space-between}
.mast h1{font:700 34px/1 var(--song);letter-spacing:.06em}
.mast h1 .lat{display:block;font-size:17px;font-weight:400;color:var(--ink-2);letter-spacing:0;margin-top:6px}
.mast .count{text-align:right;font:13px/1.4 var(--song);color:var(--ink-2)}
.mast .count b{display:block;font:italic 28px/1 var(--bask);color:var(--ox)}
.filters{display:flex;gap:2px;overflow-x:auto;padding:10px 14px 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fl{position:relative;flex:none;height:44px;padding:0 11px;font:15px/1 var(--song);color:var(--ink-2)}
.fl svg{position:absolute;left:0;top:4px;width:100%;height:36px;opacity:0;transition:opacity .2s}
.fl[aria-pressed=true]{color:var(--ink);font-weight:700}
.fl[aria-pressed=true] svg{opacity:1}
.fl:active{color:var(--ink)}

.plates{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:10px 16px 24px}
.pl{position:relative;display:block;text-align:left;background:var(--plate);padding:8px 8px 10px;box-shadow:inset 0 0 0 1px var(--plate-2);transition:transform .25s var(--ease)}
.pl:active{transform:scale(.97)}
.pl .fr{position:relative;box-shadow:inset 0 0 0 1px var(--ink-2),inset 0 0 0 3px var(--plate),inset 0 0 0 3.6px var(--ink-3)}
.pl .fr svg{width:100%;height:auto;aspect-ratio:1}
.pl .no{position:absolute;left:8px;top:7px;font:italic 11px/1 var(--bask);color:var(--ink-2)}
.pl b{display:block;font:700 16px/1.25 var(--song);margin-top:8px}
.pl .lat{display:block;font-size:13px;color:var(--ink-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .seen{position:absolute;right:10px;bottom:12px;width:30px;height:24px;color:var(--ox)}
.none{grid-column:1/-1;padding:40px 10px;text-align:center;font:16px/1.7 var(--song);color:var(--ink-2)}

/* detail */
.detail{position:absolute;inset:0;z-index:50;background:var(--paper);transform:translateX(100%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s;touch-action:pan-y}
.detail.on{transform:none;visibility:visible;transition:transform .45s var(--ease)}
.detail.drag{transition:none}
.detail .grain{position:absolute}
.dtop{position:absolute;left:0;right:0;top:calc(48px + env(safe-area-inset-top));height:50px;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 6px}
.back{height:44px;padding:0 12px 0 6px;display:flex;align-items:center;gap:2px;font:15px/1 var(--song);color:var(--ink)}
.back svg{width:26px;height:26px}
.back:active{color:var(--ox)}
.dtop .plno{font:italic 16px/1 var(--bask);color:var(--ink-2)}
.dscroll{position:absolute;left:0;right:0;top:calc(98px + env(safe-area-inset-top));bottom:0;overflow-y:auto;padding:0 20px calc(40px + env(safe-area-inset-bottom));scrollbar-width:none;overscroll-behavior:contain}
.dscroll::-webkit-scrollbar{display:none}
.bigplate{background:var(--plate);padding:10px;box-shadow:inset 0 0 0 1px var(--plate-2)}
.bigplate .fr{box-shadow:inset 0 0 0 1.2px var(--ink-2),inset 0 0 0 4px var(--plate),inset 0 0 0 4.8px var(--ink-3)}
.bigplate svg{width:100%;height:auto;aspect-ratio:1}
.bigplate .legend{text-align:center;padding:10px 0 2px}
.bigplate .legend b{display:block;font:700 26px/1.2 var(--song);letter-spacing:.08em}
.bigplate .legend .lat{display:block;font-size:18px;color:var(--ink-2);margin-top:3px}
.facts{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 16px;margin-top:14px;font:14px/1.5 var(--song);color:var(--ink-2)}
.facts b{color:var(--ink);font-weight:700}
.desc{margin-top:12px;font:16px/1.85 var(--song);text-align:justify}
.vox{margin-top:20px}
.voxh{display:flex;align-items:center;justify-content:space-between}
.voxh h3{font:700 16px/1 var(--song)}
.voxh h3 .lat{font-weight:400;color:var(--ink-2);margin-left:6px}
.play{height:44px;padding:0 14px 0 10px;display:flex;align-items:center;gap:8px;font:15px/1 var(--song);color:var(--ox)}
.play svg{width:26px;height:26px}
.play:active{transform:scale(.95)}
.play .stop{display:none}
.play.on .go{display:none}
.play.on .stop{display:block}
.sono{position:relative;margin-top:8px;height:110px;background:var(--plate);box-shadow:inset 0 0 0 1px var(--ink-3)}
.sono canvas{position:absolute;left:28px;right:8px;top:8px;bottom:20px;width:calc(100% - 36px);height:82px}
.sono .ax{position:absolute;left:4px;font:italic 10px/1 var(--bask);color:var(--ink-3)}
.sono .ax.t{bottom:4px;left:28px;right:8px;display:flex;justify-content:space-between}
.rowacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.check{height:54px;display:flex;align-items:center;justify-content:center;gap:10px;font:16px/1 var(--song);color:var(--ink);box-shadow:inset 0 0 0 1.4px var(--ink)}
.check svg{width:26px;height:26px}
.check .tk{stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .35s var(--ease)}
.check[aria-pressed=true] .tk{stroke-dashoffset:0}
.check[aria-pressed=true]{color:var(--ox);box-shadow:inset 0 0 0 1.4px var(--ox)}
.check:active{background:var(--plate)}
.log{height:54px;font:16px/1 var(--song);background:var(--ink);color:var(--plate)}
.log:active{background:#000}
.mylogs{margin-top:22px}
.mylogs h4{font:700 15px/1 var(--song);margin-bottom:6px}
.mylogs p{font:14px/1.7 var(--song);color:var(--ink-2)}
.mylogs .ent{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font:14px/1.5 var(--song)}
.mylogs .ent+.ent{background:linear-gradient(90deg,var(--ink-3) 40%,transparent 0) top/6px 1px repeat-x}
.mylogs .ent span:last-child{color:var(--ink-2);white-space:nowrap}

/* journal */
.jhead{padding:10px 22px 0}
.jhead h2{font:700 30px/1.1 var(--song);letter-spacing:.06em}
.jhead h2 .lat{font-weight:400;font-size:17px;color:var(--ink-2);margin-left:8px;letter-spacing:0}
.tally{display:flex;align-items:flex-end;gap:14px;margin-top:14px}
.tally b{font:italic 56px/.9 var(--bask);color:var(--ox)}
.tally span{font:15px/1.5 var(--song);color:var(--ink-2);padding-bottom:6px}
.tally svg{flex:1;height:40px}
.sech{padding:22px 22px 6px;font:700 16px/1 var(--song);display:flex;justify-content:space-between;align-items:baseline}
.sech span{font:italic 14px/1 var(--bask);color:var(--ink-2);font-weight:400}
.ck{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:0 10px;width:100%;min-height:52px;padding:4px 22px;text-align:left}
.ck:active{background:var(--plate)}
.ck svg.box{width:26px;height:26px}
.ck .tk{stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .35s var(--ease)}
.ck[aria-checked=true] .tk{stroke-dashoffset:0}
.ck b{font:700 16px/1.2 var(--song)}
.ck .lat{font-size:13px;color:var(--ink-2);margin-left:6px;font-weight:400}
.ck small{font:13px/1 var(--song);color:var(--ink-2)}
.ck[aria-checked=true] small{color:var(--ox)}
.entry{position:relative;overflow:hidden;touch-action:pan-y}
.entry .rm{position:absolute;inset:0;background:var(--ox);color:var(--plate);display:flex;align-items:center;justify-content:flex-end;padding-right:24px;font:15px/1 var(--song)}
.entry .in{position:relative;display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:10px 22px;background:var(--paper);transition:transform .3s var(--ease)}
.entry .in.drag{transition:none}
.entry .in svg{width:56px;height:56px;background:var(--plate);box-shadow:inset 0 0 0 1px var(--ink-3)}
.entry b{font:700 15px/1.3 var(--song)}
.entry .when{display:block;font:13px/1.5 var(--song);color:var(--ink-2)}
.entry .note{display:block;font:14px/1.5 var(--song);color:var(--ink);margin-top:2px}
.entry+.entry .in::before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:linear-gradient(90deg,var(--ink-3) 40%,transparent 0) 0 0/6px 1px repeat-x}

/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;z-index:40;height:calc(78px + env(safe-area-inset-bottom));padding:6px 30px env(safe-area-inset-bottom);display:grid;grid-template-columns:1fr 1fr;background:var(--paper)}
.nav::before{content:"";position:absolute;left:22px;right:22px;top:0;height:3px;background:linear-gradient(var(--ink),var(--ink)) 0 0/100% 1px no-repeat,linear-gradient(var(--ink),var(--ink)) 0 2.5px/100% .6px no-repeat;opacity:.7}
.nav .stroke{position:absolute;top:10px;left:30px;width:calc(50% - 30px);height:52px;transition:transform .5s var(--ease);pointer-events:none}
.nav .stroke svg{width:100%;height:100%}
.screen.jr .nav .stroke{transform:translateX(100%)}
.nav button{position:relative;height:58px;display:flex;align-items:center;justify-content:center;gap:10px;font:17px/1 var(--song);color:var(--ink-2)}
.nav button svg{width:28px;height:28px}
.nav button .lat{font-size:14px}
.nav button[aria-selected=true]{color:var(--ink);font-weight:700}

/* sheet */
.scrim{position:absolute;inset:0;z-index:80;background:rgba(42,33,24,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:81;max-height:86%;overflow-y:auto;background:var(--plate);padding:0 22px calc(24px + env(safe-area-inset-bottom));transform:translateY(104%);transition:transform .45s var(--ease);touch-action:none;box-shadow:inset 0 1px 0 var(--ink-3)}
.sheet.on{transform:none}
.sheet.drag{transition:none}
.grab{display:block;height:28px;position:relative}
.grab::before{content:"";position:absolute;left:50%;top:12px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--ink-3)}
.sheet h3{font:700 22px/1.2 var(--song);letter-spacing:.04em}
.sheet h3 .lat{display:block;font-weight:400;font-size:15px;color:var(--ink-2);margin-top:4px;letter-spacing:0}
.lbl{display:block;font:13px/1 var(--song);color:var(--ink-2);margin:18px 0 8px}
.places{display:flex;flex-wrap:wrap;gap:4px 6px}
.places button{min-height:40px;padding:0 10px;font:15px/1 var(--song);color:var(--ink-2);box-shadow:inset 0 -1px 0 transparent}
.places button[aria-pressed=true]{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ox)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:48px;height:44px;font:22px/1 var(--bask);color:var(--ink)}
.stepper button:active{background:var(--plate-2)}
.stepper b{min-width:54px;text-align:center;font:italic 30px/1 var(--bask)}
.nt{width:100%;height:46px;border:0;border-bottom:1.4px solid var(--ink);background:transparent;font:16px/1 var(--song);outline:none;padding:0 2px;border-radius:0}
.nt:focus{border-bottom-color:var(--ox)}
.save{display:block;width:100%;height:54px;margin-top:22px;background:var(--ink);color:var(--plate);font:17px/1 var(--song)}
.save:active{background:#000}

.toast{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));z-index:90;transform:translate(-50%,16px);opacity:0;visibility:hidden;padding:12px 18px;background:var(--ink);color:var(--plate);font:15px/1.2 var(--song);white-space:nowrap;display:flex;gap:14px;align-items:center;transition:transform .3s var(--ease),opacity .2s,visibility 0s .3s}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .3s var(--ease),opacity .2s}
.toast button{color:#e7b9a6;text-decoration:underline;text-underline-offset:3px;min-height:30px}

@media (prefers-reduced-motion:reduce){
  .page,.detail,.sheet,.toast,.nav .stroke,.check .tk,.ck .tk,.entry .in,.pl{transition-duration:.01s!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(38)"><path d="M0 0V2.6" stroke="#2a2118" stroke-width=".55"/></pattern>
    <pattern id="hatch2" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(-50)"><path d="M0 0V3.4" stroke="#2a2118" stroke-width=".45"/></pattern>
    <filter id="wash" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="pgrain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .2  0 0 0 .16 0"/></filter>
  </defs>
</svg>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><svg id="bigplate" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice"></svg></div>
  <div class="caption"><b>野鳥</b><em>Aves Formosanae</em><span>十二幅手工上色的台灣野鳥版畫。聽一段叫聲，在見過的那一頁打個勾。</span></div>
  <div class="device">
    <div class="screen" id="screen">
      <div class="grain" aria-hidden="true"><svg preserveAspectRatio="none"><rect width="100%" height="100%" filter="url(#pgrain)"/></svg></div>
      <div class="status" aria-hidden="true">
        <span id="clock">6:12</span>
        <span class="g">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx=".5"/><rect x="5" y="5.5" width="3" height="6.5" rx=".5"/><rect x="10" y="3" width="3" height="9" rx=".5"/><rect x="15" y="0" width="3" height="12" rx=".5" opacity=".35"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 12 5.4 8.8a4 4 0 0 1 5.2 0zM3.6 6.8a6.8 6.8 0 0 1 8.8 0l1.4-1.6a9 9 0 0 0-11.6 0zM.4 3.2a11.4 11.4 0 0 1 15.2 0L16.8 1.8a13.4 13.4 0 0 0-17.6 0z"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".6" y=".6" width="21.8" height="10.8" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2.4" y="2.4" width="12" height="7.2" rx="1"/><rect x="23.6" y="4" width="1.8" height="4" rx=".6"/></svg>
        </span>
      </div>

      <section class="page" id="pPlates" aria-label="圖鑑">
        <div class="mast"><h1>野鳥<span class="lat">Aves Formosanae</span></h1><div class="count"><b id="seenN">7</b>已見 / 十二種</div></div>
        <div class="filters" id="filters" role="group" aria-label="篩選"></div>
        <div class="plates" id="plates"></div>
      </section>

      <section class="page" id="pJournal" aria-label="觀察清單">
        <div class="jhead"><h2>觀察手記<span class="lat">Diarium</span></h2>
          <div class="tally"><b id="jN">7</b><span>／12 種<br>已見</span><svg id="tallySvg" viewBox="0 0 200 40" preserveAspectRatio="xMaxYMid meet" aria-hidden="true"></svg></div></div>
        <div class="sech">清單<span>Index avium</span></div>
        <div id="checklist"></div>
        <div class="sech">紀錄<span id="logN">9 entries</span></div>
        <div id="journal"></div>
        <div style="height:24px"></div>

  if (b.tip){ const q = tp(.84), ww = w * .96; F(`M${f1(q[0] + nrm[0] * ww)} ${f1(q[1] + nrm[1] * ww)}L${f1(tip[0] + nrm[0] * w)} ${f1(tip[1] + nrm[1] * w)}Q${f1(tip[0] + dir[0] * 3)} ${f1(tip[1] + dir[1] * 3)} ${f1(tip[0] - nrm[0] * w)} ${f1(tip[1] - nrm[1] * w)}L${f1(q[0] - nrm[0] * ww)} ${f1(q[1] - nrm[1] * ww)}Z`, b.tip); }

function drawSono(k, prog){

}

const sheet = $('sheet'), scrim = $('scrim');
let sheetFocus = null;
function openSheet(h){ sheetFocus = document.activeElement; $('sheetBody').innerHTML = h; sheet.style.transform = ''; sheet.scrollTop = 0; sheet.classList.add('on'); scrim.classList.add('on'); }
function closeSheet(){ if (!sheet.classList.contains('on')) return; sheet.classList.remove('on', 'drag'); scrim.classList.remove('on'); sheet.style.transform = ''; scrim.style.opacity = ''; if (sheetFocus) try { sheetFocus.focus({preventScroll: true}); } catch (_) {} }
scrim.addEventListener('click', closeSheet);
sheet.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !draft) return;
  if (b.dataset.p){ draft.p = b.dataset.p; haptic(4); $('lp').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); }
  else if (b.dataset.n){ draft.n = Math.max(1, Math.min(999, draft.n + +b.dataset.n)); $('lnN').textContent = draft.n; haptic(4); }
  else if (b.id === 'lsave'){
    const l = {id: Date.now(), k: draft.k, at: Date.now(), p: draft.p, n: draft.n, note: $('lnote').value.trim()};
    logs.push(l); const first = !seen[draft.k]; if (first) seen[draft.k] = Date.now(); persist();
    haptic([6, 30, 12]); pencil(); closeSheet(); renderPlates(); renderJournal();
    if (cur && cur.k === draft.k){ const y = $('dscroll').scrollTop; $('dscroll').innerHTML = detailHTML(cur); $('dscroll').scrollTop = y; requestAnimationFrame(() => drawSono(cur.k, null)); }
    toast(first ? `新種！${byK(draft.k).n} 記進清單` : '記下來了');
    draft = null;
  }
});
sheet.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'lnote'){ e.preventDefault(); $('lsave').click(); } });
(function(){
  let y0 = 0, dy = 0, on = false, t0 = 0, h = 1;
  sheet.addEventListener('pointerdown', e => { if (e.target.closest('input,button') || sheet.scrollTop > 0) return; on = true; y0 = e.clientY; dy = 0; t0 = e.timeStamp; h = sheet.offsetHeight; });
  sheet.addEventListener('pointermove', e => { if (!on) return; dy = Math.max(0, e.clientY - y0); if (dy > 5){ sheet.classList.add('drag'); try { sheet.setPointerCapture(e.pointerId); } catch (_) {} } sheet.style.transform = `translateY(${dy}px)`; scrim.style.opacity = String(1 - dy / h * .8); });
  const end = e => { if (!on) return; on = false; sheet.classList.remove('drag'); const v = dy / Math.max(1, e.timeStamp - t0); if (dy > h * .35 || (v > .6 && dy > 30)){ haptic(6); closeSheet(); } else { sheet.style.transform = ''; scrim.style.opacity = ''; } };
  sheet.addEventListener('pointerup', end); sheet.addEventListener('pointercancel', end);
})();
function pencil(){ const a = audio(); if (!a) return; const n = a.createBuffer(1, a.sampleRate * .22, a.sampleRate), c = n.getChannelData(0); for (let i = 0; i < c.length; i++){ const t = i / c.length; c[i] = (Math.random() * 2 - 1) * (t < .35 ? t / .35 : 1 - (t - .35) / .65) * .6; } const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(); s.buffer = n; f.type = 'bandpass'; f.frequency.value = 3800; f.Q.value = .8; g.gain.value = .35; s.connect(f).connect(g).connect(a.destination); s.start(); }

/* ---------- journal ---------- */
const BOX = `<svg class="box" viewBox="0 0 26 26" fill="none" stroke="#2a2118" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h18v17H4z"/><path class="tk" d="M7 13.5c2 1.4 3.4 3.4 4.6 5.6 3-6 6.6-10.4 11.4-14" stroke="#8c2b1f" stroke-width="2.2"/></svg>`;
const miniCache = {};
const mini = b => miniCache[b.k] || (miniCache[b.k] = bird(b, {noScene: true, crop: b.pose === 'wade' ? '30 20 140 140' : '40 40 120 120'}));
function renderJournal(){
  const n = Object.keys(seen).length;
  $('jN').textContent = n;
  let t = '';
  for (let i = 0; i < 12; i++){ const g = Math.floor(i / 5), j = i % 5, x = 200 - (Math.floor(11 / 5) + 1) * 44 + g * 44; const on = i < n;
    t += j === 4 ? `<path d="M${x - 2} 30L${x + 30} 10" stroke="${on ? '#8c2b1f' : '#c9b99a'}" stroke-width="2" stroke-linecap="round"/>` : `<path d="M${x + j * 7} 8L${x + j * 7 + 1} 34" stroke="${on ? '#8c2b1f' : '#c9b99a'}" stroke-width="2" stroke-linecap="round"/>`; }
  $('tallySvg').innerHTML = t;
  $('checklist').innerHTML = B.map(b => `<button class="ck" role="checkbox" data-k="${b.k}" aria-checked="${!!seen[b.k]}">${BOX}<span><b>${b.n}</b><span class="lat">${b.l}</span></span><small>${seen[b.k] ? md(seen[b.k]) : b.st}</small></button>`).join('');
  const L = logs.slice().sort((a, b) => b.at - a.at);
  $('logN').textContent = L.length + ' entries';
  $('journal').innerHTML = L.length ? L.map(l => { const b = byK(l.k); return `<div class="entry" data-id="${l.id}"><div class="rm">劃掉</div><div class="in">${mini(b)}<div><b>${b.n}・${l.n} 隻</b><span class="when">${md(l.at)} ${hm(l.at)}・${esc(l.p)}</span>${l.note ? `<span class="note">${esc(l.note)}</span>` : ''}</div></div></div>`; }).join('')
    : `<p class="none">還沒有紀錄。去圖鑑挑一隻吧。</p>`;
}
$('checklist').addEventListener('click', e => { const b = e.target.closest('.ck'); if (!b) return; toggleSeen(b.dataset.k); });
/* swipe a journal entry left to strike it out */
let sw = null, lastGone = null;
$('journal').addEventListener('pointerdown', e => { const r = e.target.closest('.entry'); if (!r) return; sw = {r, in: r.querySelector('.in'), x: e.clientX, y: e.clientY, dx: 0, on: false}; });
$('journal').addEventListener('pointermove', e => {
  if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.on){ if (dx < -10 && Math.abs(dx) > Math.abs(dy) * 1.3){ sw.on = true; sw.in.classList.add('drag'); try { sw.in.setPointerCapture(e.pointerId); } catch (_) {} } else if (Math.abs(dy) > 10){ sw = null; return; } else return; }
  sw.dx = Math.min(0, dx); sw.in.style.transform = `translateX(${sw.dx}px)`;
});
function endSw(){
  if (!sw) return; const s = sw; sw = null; if (!s.on) return; s.in.classList.remove('drag');
  if (s.dx < -s.r.offsetWidth * .35){
    const id = +s.r.dataset.id, i = logs.findIndex(l => l.id === id); s.in.style.transform = 'translateX(-100%)';
    setTimeout(() => { if (i < 0) return; lastGone = logs.splice(i, 1)[0]; persist(); renderJournal(); haptic([10, 30, 10]); toast('劃掉一筆紀錄', () => { if (lastGone){ logs.push(lastGone); lastGone = null; persist(); renderJournal(); } }); }, reduce ? 0 : 220);
  } else s.in.style.transform = '';
}
$('journal').addEventListener('pointerup', endSw); $('journal').addEventListener('pointercancel', endSw);

/* ---------- nav ---------- */
function go(t){
  screen.classList.toggle('jr', t === 'j');
  $('tPlates').setAttribute('aria-selected', t !== 'j'); $('tJournal').setAttribute('aria-selected', t === 'j');
  if (cur) closeDetail();
}
$('tPlates').addEventListener('click', () => { haptic(6); if (!screen.classList.contains('jr') && !cur) $('pPlates').scrollTo({top: 0, behavior: reduce ? 'auto' : 'smooth'}); go('p'); });
$('tJournal').addEventListener('click', () => { haptic(6); go('j'); });

/* ---------- toast ---------- */
let tT = 0, undo = null;
function toast(m, fn){ $('toastT').textContent = m; undo = fn || null; $('toastB').hidden = !fn; $('toast').classList.add('on'); clearTimeout(tT); tT = setTimeout(() => $('toast').classList.remove('on'), fn ? 4000 : 2200); }
$('toastB').addEventListener('click', () => { if (undo) undo(); undo = null; $('toast').classList.remove('on'); haptic(6); });

document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (sheet.classList.contains('on')) closeSheet(); else if (cur) closeDetail(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) stopSong(); });
addEventListener('resize', () => { if (cur) drawSono(cur.k, null); });

/* ---------- desktop backdrop: a loose plate from the folio ---------- */
(function(){
  const b = B[0];
  $('bigplate').innerHTML = `<defs><filter id="fox"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .55 0 0 0 0 .4 0 0 0 0 .2 0 0 0 1.2 -.62"/></filter></defs>
    <rect width="1600" height="1000" fill="#e4d6b4"/><rect width="1600" height="1000" filter="url(#fox)" opacity=".5"/><rect width="1600" height="1000" filter="url(#pgrain)"/>
    <rect x="70" y="60" width="1460" height="880" fill="none" stroke="#5d4f3e" stroke-width="2"/><rect x="82" y="72" width="1436" height="856" fill="none" stroke="#8c7c64" stroke-width="1"/>
    <g opacity=".55" transform="translate(900 60) scale(4.2)">${bird(b).replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '')}</g>
    <text x="1240" y="900" font-family="Baskerville,serif" font-style="italic" font-size="30" fill="#5d4f3e">Pl. I.  Urocissa caerulea</text>`;
})();

function tick(){ const d = new Date(); $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
tick(); setTimeout(function t(){ tick(); setTimeout(t, 60000 - Date.now() % 60000); }, 60000 - Date.now() % 60000);

renderFilters(); renderPlates(); renderJournal();
})();
</script>
</body>
</html>
