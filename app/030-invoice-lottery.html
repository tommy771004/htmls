<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#135a39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="發票對獎">
<title>發票對獎 · 統一發票對獎</title>
<meta name="description" content="輸入發票末三碼即時對獎，可能中獎再補前五碼確認獎別，並把發票收進發票夾自動核對。收錄於 100 Creative HTML Works（App 030・台灣電子發票網紋紙）。">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23135a39'/%3E%3Cpath d='M16 10h32v40l-4-3-4 3-4-3-4 3-4-3-4 3-4-3-4 3z' fill='%23e6f1e4'/%3E%3Cpath d='M22 22h20M22 29h20' stroke='%23135a39' stroke-width='3'/%3E%3Cpath d='M30 38h12' stroke='%23c8322b' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{
  --g0:#0c3f27; --g1:#135a39; --g2:#1b6e47; --g3:#237d53; --gl:#cfe5d3;
  --paper:#e7f2e5; --paper2:#d9eadb; --ink:#153826; --ink2:#4d6b58; --red:#c8322b; --red2:#9f231d;
  --on:#edf7ef; --on2:#a9cdb4;
  --sans:"PingFang TC","Heiti TC",system-ui,sans-serif;
  --mono:Menlo,"SF Mono",monospace;
  --out:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.32,1.3,.45,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--g1);color:var(--on);font:15px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button:focus-visible{outline:2px solid #f3e7a6;outline-offset:2px;border-radius:8px}
svg{display:block}

.stage{position:relative;width:100%;height:100vh;height:100dvh}
.backdrop,.caption{display:none}
.device{position:relative;width:100%;height:100%}
.screen{position:absolute;inset:0;overflow:hidden;isolation:isolate;container-type:size;
  background:linear-gradient(180deg,#16623e 0%,var(--g1) 45%,#105133 100%)}
@media (min-width:521px){
  body{background:#0b2619}
  .stage{display:flex;align-items:center;justify-content:center;gap:70px;padding:24px}
  .backdrop{display:block;position:fixed;inset:0;z-index:0}
  .backdrop svg{width:100%;height:100%}
  .device{flex:none;width:390px;height:min(844px,calc(100dvh - 48px));border-radius:56px;padding:10px;z-index:1;
    background:linear-gradient(150deg,#e9ece6,#b9bdb4 40%,#8d918a 70%,#c9ccc5);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),inset 0 0 0 2px rgba(0,0,0,.25),0 16px 26px -14px rgba(0,0,0,.7)}
  .screen{inset:10px;border-radius:46px}
  .caption{display:block;position:relative;z-index:1;max-width:290px;padding:22px 24px 26px;background:var(--paper);color:var(--ink);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),93.75% 100%,87.5% calc(100% - 8px),81.25% 100%,75% calc(100% - 8px),68.75% 100%,62.5% calc(100% - 8px),56.25% 100%,50% calc(100% - 8px),43.75% 100%,37.5% calc(100% - 8px),31.25% 100%,25% calc(100% - 8px),18.75% 100%,12.5% calc(100% - 8px),6.25% 100%,0 calc(100% - 8px))}
  .caption h1{font:700 30px/1.1 var(--sans);letter-spacing:.06em}
  .caption p{margin-top:10px;font-size:14.5px;line-height:1.7;color:var(--ink2)}
}
@media (min-width:521px) and (max-width:880px){.caption{display:none}}

.status{position:absolute;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 28px 0 32px;font:600 16px/1 var(--sans);color:var(--on);pointer-events:none}
.status .g{display:flex;gap:6px;align-items:center}
@media (display-mode:standalone){.status{display:none}}

.main{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(48px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom))}

/* period switcher */
.period{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:clamp(52px,8cqh,64px);flex:none}
.period button{height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.period button:active{background:rgba(0,0,0,.18)}
.period button[disabled]{opacity:.3;cursor:default}
.period svg{width:22px;height:22px}
.pname{text-align:center;overflow:hidden;position:relative;height:100%}
.pname .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .38s var(--out)}
.pname b{font:600 21px/1.1 var(--sans);letter-spacing:.04em}
.pname small{font:13px/1.3 var(--sans);color:var(--on2);margin-top:3px}

/* receipt: signature */
.receipt{position:relative;flex:1 1 auto;min-height:0;margin-top:4px;color:var(--ink);background:var(--paper);padding:14px 16px 20px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),95% 100%,90% calc(100% - 9px),85% 100%,80% calc(100% - 9px),75% 100%,70% calc(100% - 9px),65% 100%,60% calc(100% - 9px),55% 100%,50% calc(100% - 9px),45% 100%,40% calc(100% - 9px),35% 100%,30% calc(100% - 9px),25% 100%,20% calc(100% - 9px),15% 100%,10% calc(100% - 9px),5% 100%,0 calc(100% - 9px));
  display:flex;flex-direction:column;overflow:hidden}
.receipt .guil{position:absolute;inset:0;z-index:0;pointer-events:none}
.receipt .guil svg{width:100%;height:100%}
.receipt > *:not(.guil){position:relative;z-index:1}
.rhead{display:flex;justify-content:space-between;align-items:baseline;flex:none}
.rhead h2{font:700 15px/1.2 var(--sans);letter-spacing:.24em}
.rhead span{font:12.5px var(--sans);color:var(--ink2)}
.prizes{flex:1;display:flex;flex-direction:column;margin:6px 0 4px;min-height:0;position:relative;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.prizes::-webkit-scrollbar{display:none}
/* auto margins spread the rows like space-around, but never push the first row out of reach when space runs short */
.prizes .pz{margin-block:auto}
.pz{display:grid;grid-template-columns:76px 1fr;align-items:center;column-gap:8px;padding:2px 0}
.pz .lab b{display:block;font:700 15px/1.15 var(--sans)}
.pz .lab small{font:12.5px/1.2 var(--sans);color:var(--ink2)}
.nums{display:flex;flex-direction:column;gap:1px}
.num{font:500 clamp(21px,3.3cqh,26px)/1.2 var(--mono);letter-spacing:.08em;color:var(--ink);white-space:nowrap;text-align:right}
.num i{font-style:normal;transition:color .15s,background-color .15s;border-radius:3px}
.num i.t{color:var(--red);font-weight:700}
.num i.hit{background:var(--red);color:#fff5ef}
.num i.dim{color:rgba(21,56,38,.35)}
.scanline{position:absolute;left:-6px;right:-6px;height:3px;top:0;border-radius:2px;background:var(--red);opacity:0;pointer-events:none}
.scanline.go{animation:scan .62s var(--out)}
@keyframes scan{0%{opacity:.9;transform:translateY(0)}100%{opacity:.9;transform:translateY(var(--h,200px))}}
.rfoot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex:none;padding-top:6px;border-top:1.5px dashed rgba(21,56,38,.25)}
.rfoot .tally{font:13px/1.4 var(--sans);color:var(--ink2)}
.rfoot .tally b{color:var(--ink);font-weight:700}
.rfoot svg{height:26px;width:118px}
.pending{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--ink2)}
.pending b{font:700 40px/1 var(--mono);color:var(--ink);letter-spacing:.04em}
.pending span{font-size:14px}

/* entry display */
.entry{flex:none;display:flex;flex-direction:column;align-items:center;padding:clamp(8px,1.6cqh,14px) 0 clamp(6px,1.2cqh,10px)}
.cells{display:flex;gap:6px;align-items:flex-end;height:clamp(50px,7.4cqh,60px)}
.cell{width:clamp(38px,5.6cqh,46px);height:100%;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font:600 clamp(28px,4.2cqh,34px)/1 var(--mono);color:var(--on);background:var(--g0);box-shadow:inset 0 2px 0 rgba(0,0,0,.25)}
.cell.cur{box-shadow:inset 0 2px 0 rgba(0,0,0,.25),inset 0 -3px 0 #f3e7a6}
.cell.front{width:clamp(24px,4cqh,32px);height:80%;font-size:clamp(20px,3cqh,24px);background:rgba(12,63,39,.7)}
.cell.gap{width:6px;background:none;box-shadow:none}
.cells.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}
.msg{margin-top:8px;min-height:22px;font:600 15px/22px var(--sans);color:var(--on2);text-align:center;white-space:nowrap}
.msg.win{color:#ffe3a8}
.msg.lose{color:var(--on2)}

/* keypad */
.pad{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.k{height:clamp(46px,6.8cqh,60px);border-radius:12px;background:var(--g2);font:500 clamp(24px,3.4cqh,28px)/1 var(--mono);color:var(--on);
  display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -2px 0 rgba(0,0,0,.18);transition:background-color .08s}
.k:active,.k.press{background:var(--g0);box-shadow:inset 0 2px 3px rgba(0,0,0,.3)}
.k.fn{background:transparent;box-shadow:none;font:600 16px var(--sans);color:var(--on2)}
.k.fn:active{background:rgba(0,0,0,.18)}
.k svg{width:26px;height:26px}

/* folder */
.folder{position:absolute;left:0;right:0;bottom:0;z-index:30;height:calc(100% - 112px - env(safe-area-inset-top));
  transform:translateY(calc(100% - 50px - env(safe-area-inset-bottom)));transition:transform .5s var(--spring);touch-action:none;display:flex;flex-direction:column}
.folder.open{transform:translateY(0)}
.folder.drag{transition:none}
.ftab{flex:none;align-self:flex-start;margin-left:16px;height:34px;padding:0 18px 0 16px;border-radius:12px 12px 0 0;background:#e9dcae;color:#3e3417;
  display:flex;align-items:center;gap:8px;font:700 14px var(--sans);letter-spacing:.06em}
.ftab svg{width:18px;height:18px}
.fbody{flex:1;min-height:0;background:#e9dcae;border-radius:0 18px 0 0;display:flex;flex-direction:column;color:#2d2612;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 -2px 6px -2px rgba(0,0,0,.35)}
.fhead{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 16px 8px 18px;min-height:36px}
.fhead .sum{font:14px/1.3 var(--sans);color:#5d5231}
.fhead .sum b{color:var(--red2);font-weight:700}
.fhead .add{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 6px;font:700 15px var(--sans);color:#2d2612}
.fhead .add svg{width:20px;height:20px}
.ffilter{flex:none;display:flex;gap:18px;padding:0 18px 8px}
.ffilter button{min-height:40px;font:600 15px var(--sans);color:#8a7c52;position:relative}
.ffilter button.on{color:#2d2612}
.ffilter button.on::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:3px;border-radius:2px;background:var(--red)}
.flist{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 12px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.grp{font:700 13px var(--sans);color:#7a6c43;letter-spacing:.12em;padding:12px 6px 6px}
.row{position:relative;margin-bottom:6px;border-radius:10px;overflow:hidden;background:#b5321f}
.row .del{position:absolute;right:0;top:0;bottom:0;width:88px;display:flex;align-items:center;justify-content:center;font:700 15px var(--sans);color:#fff2ea}
.row .face{position:relative;background:#f6efd6;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 14px;min-height:64px;touch-action:pan-y;transition:transform .3s var(--out)}
.row.drag .face{transition:none}
.row .no{font:600 17px/1.2 var(--mono);letter-spacing:.04em;color:#2d2612}
.row .no i{font-style:normal;color:var(--red2)}
.row .st{font:13px/1.3 var(--sans);color:#6f6340}
.row .res{grid-row:1/3;grid-column:2;text-align:right;font:600 14px/1.2 var(--sans);color:#8a7c52}
.row .res.w{color:var(--red2)}
.row .res.w b{display:block;font:700 18px/1.1 var(--mono)}
.stamp{display:inline-block;transform:rotate(-8deg);border:2px solid var(--red2);color:var(--red2);border-radius:5px;padding:1px 6px;font:700 13px var(--sans);letter-spacing:.1em;margin-top:2px}
.empty{padding:40px 20px;text-align:center;color:#7a6c43;font-size:14px}

/* sheet */
.scrim{position:absolute;inset:0;z-index:50;background:rgba(5,25,14,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:51;background:var(--paper);color:var(--ink);border-radius:22px 22px 0 0;
  padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .5s var(--spring);touch-action:none;max-height:92%;overflow:auto}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(21,56,38,.28);margin:0 auto 12px}
.sheet h3{font:700 19px/1.2 var(--sans);text-align:center;letter-spacing:.06em}
.sheet .sub{font-size:13.5px;color:var(--ink2);text-align:center;margin-top:4px}
.fullno{display:flex;justify-content:center;gap:4px;margin:14px 0 10px}
.fullno span{width:34px;height:44px;border-bottom:2.5px solid rgba(21,56,38,.3);display:flex;align-items:center;justify-content:center;font:600 26px var(--mono)}
.fullno span.tr{color:var(--ink2);font-size:22px}
.fullno span.cur{border-color:var(--red)}
.fullno .sep{width:10px;border:0}
.spad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.spad .k{height:48px;background:var(--paper2);color:var(--ink);box-shadow:inset 0 -2px 0 rgba(21,56,38,.14)}
.spad .k:active{background:#c4dcc7}
.spad .k.fn{background:transparent;color:var(--ink2)}
.stores{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:4px -16px 0;padding-left:16px;scrollbar-width:none}
.stores::-webkit-scrollbar{display:none}
.stores button{flex:none;min-height:44px;padding:0 12px;border-radius:8px;font:600 14px var(--sans);color:var(--ink2);background:var(--paper2)}
.stores button.on{background:var(--ink);color:var(--paper)}
.go{display:block;width:100%;min-height:52px;margin-top:10px;border-radius:12px;background:var(--g1);color:var(--on);font:700 17px var(--sans);letter-spacing:.14em}
.go:active{background:var(--g0)}
.go[disabled]{opacity:.4}
.win-sheet{text-align:center;padding:6px 0 4px}
.win-sheet .amt{font:700 46px/1.1 var(--mono);color:var(--red);margin:10px 0 2px}
.win-sheet .how{font-size:14px;color:var(--ink2);line-height:1.7;margin-top:8px}

.toast{position:absolute;left:50%;top:calc(54px + env(safe-area-inset-top));z-index:60;transform:translate(-50%,-240%);visibility:hidden;transition:transform .4s var(--spring),visibility 0s .4s;
  background:var(--ink);color:var(--paper);font:600 14px var(--sans);padding:10px 16px;border-radius:10px;white-space:nowrap;display:flex;gap:12px;align-items:center}
.toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .4s var(--spring)}
.toast button{color:#ffd7a0;font-weight:700;min-height:28px}
#confetti{position:absolute;inset:0;z-index:55;pointer-events:none;width:100%;height:100%}
.home-ind{position:absolute;left:50%;bottom:calc(6px + env(safe-area-inset-bottom)*.3);width:130px;height:5px;margin-left:-65px;border-radius:3px;background:rgba(45,38,18,.55);z-index:45;pointer-events:none}
/* short phones (iPhone SE): the draw sheet must not spill under its own footer */
@media (max-height:720px){
  .period{height:46px}
  .nums{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;column-gap:12px}
  .num{font-size:19px}
  .entry{padding:6px 0 4px}
  .cells{height:46px}
  .msg{margin-top:4px}
  .pad{gap:6px}
  .k{height:44px}
}
@media (prefers-reduced-motion:reduce){
  .folder,.sheet,.toast,.pname .in,.row .face{transition:none!important}
  .scanline.go,.cells.shake{animation:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="backdrop" aria-hidden="true"><svg id="desk" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice"></svg></div>
  <div class="device">
    <div class="screen" id="screen">
      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="g">
          <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#edf7ef"><rect y="8" width="3" height="4" rx=".5"/><rect x="5" y="5" width="3" height="7" rx=".5"/><rect x="10" y="2.5" width="3" height="9.5" rx=".5"/><rect x="15" width="3" height="12" rx=".5"/></g></svg>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="#edf7ef"><path d="M8.5 12 0 3.3A12.5 12.5 0 0 1 17 3.3z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><path d="M1 1h21v3l-1.5 1v3L22 9v3H1V9l1.5-1V5L1 4z" fill="none" stroke="#edf7ef" stroke-width="1.4" stroke-linejoin="round"/><rect x="4" y="3.5" width="13" height="6" fill="#edf7ef"/><path d="M24 4.5v4" stroke="#edf7ef" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
      </div>

      <div class="main">
        <div class="period">
          <button id="prevP" aria-label="上一期"><svg viewBox="0 0 24 24" fill="none" stroke="#edf7ef" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg></button>
          <div class="pname" aria-live="polite"><div class="in" id="pIn"><b id="pTitle">115 年 5-6 月</b><small id="pSub">7/25 開獎</small></div></div>
          <button id="nextP" aria-label="下一期"><svg viewBox="0 0 24 24" fill="none" stroke="#edf7ef" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4l8 8-8 8"/></svg></button>
        </div>

        <section class="receipt" id="receipt" aria-label="中獎號碼">
          <div class="guil" id="guil"></div>
          <div class="rhead"><h2>中獎號碼單</h2><span id="rDemo">示範號碼</span></div>
          <div class="prizes" id="prizes"></div>
          <div class="rfoot"><div class="tally" id="tally">本期已對 <b>0</b> 張</div><svg id="bar" viewBox="0 0 118 26" preserveAspectRatio="none"></svg></div>
        </section>

        <div class="entry">
          <div class="cells" id="cells" aria-live="polite"></div>
          <div class="msg" id="msg">輸入發票末三碼</div>
        </div>

        <div class="pad" id="pad">
          <button class="k" data-d="1">1</button><button class="k" data-d="2">2</button><button class="k" data-d="3">3</button>
          <button class="k" data-d="4">4</button><button class="k" data-d="5">5</button><button class="k" data-d="6">6</button>
          <button class="k" data-d="7">7</button><button class="k" data-d="8">8</button><button class="k" data-d="9">9</button>
          <button class="k fn" data-d="c" aria-label="清除">清除</button><button class="k" data-d="0">0</button>
          <button class="k fn" data-d="b" aria-label="退格"><svg viewBox="0 0 26 26" fill="none" stroke="#a9cdb4" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M9 5h13v16H9l-7-8z"/><path d="M12.5 10l5 6M17.5 10l-5 6"/></svg></button>
        </div>
      </div>

      <section class="folder" id="folder" aria-label="發票夾">
        <button class="ftab" id="ftab" aria-expanded="false"><svg viewBox="0 0 20 20" fill="none" stroke="#3e3417" stroke-width="2" stroke-linejoin="round"><path d="M2 5h6l2 2h8v10H2z"/></svg><span id="ftabTxt">發票夾</span></button>
        <div class="fbody">

/* check logic */
function tailEq(a, b, n){ return a.slice(-n) === b.slice(-n); }

  if (P.pending) return null;
  if (no === P.sp) return 0; if (no === P.gr) return 1;
  var best = null;
  P.first.forEach(function(f){ for (var n = 8; n >= 3; n--){ if (tailEq(no, f, n)){ var r = n === 8 ? 2 : 10 - n; if (best === null || r < best) best = r; break; } } });
  return best;
}

  var r = {first:[], sg:[]};
  P.first.forEach(function(f, i){ if (f.slice(-3) === t) r.first.push(i); });
  if (P.sp.slice(-3) === t) r.sg.push('sp'); if (P.gr.slice(-3) === t) r.sg.push('gr');
  return r;
}

/* guilloche */
function guilloche(el, w, h, col, dens){
  var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="' + col + '" stroke-width=".7">';
  for (var k = 0; k < dens; k++){
    var d = '', ph = k * .52, amp = h * .09 + (k % 3) * 4, yb = (k / dens) * h * 1.1 - h * .05;
    for (var x = 0; x <= w; x += 6){ var y = yb + Math.sin(x / 38 + ph) * amp + Math.sin(x / 13 + ph * 2) * 3; d += (x ? 'L' : 'M') + x + ' ' + y.toFixed(1); }
    s += '<path d="' + d + '"/>';
  }
  s += '</g></svg>'; el.innerHTML = s;
}
guilloche($('guil'), 360, 300, 'rgba(38,120,72,.16)', 34);

/* barcode (Code 39-ish stripes from the period id) */
function barcode(txt){
  var s = '', x = 0, seed = 7; for (var i = 0; i < txt.length; i++) seed = (Math.imul(seed, 31) + txt.charCodeAt(i)) & 0x7fffffff;
  while (x < 118){ seed = (Math.imul(seed, 1103515245) + 12345) & 0x7fffffff; var w = 1 + (seed % 3) * .9; if ((seed >> 5) % 2) s += '<rect x="' + x.toFixed(1) + '" y="0" width="' + w.toFixed(1) + '" height="26" fill="#153826"/>'; x += w + .9; }

}

}

function bump(win, amt){

  if (busy) return; var P = PERIODS[pi];

function scan(cb){

  var P = PERIODS[pi];

  });
}

  var P = PERIODS[pi], no = front + digits, r = checkFull(no, P);

$('pad').addEventListener('click', function(e){ var b = e.target.closest('[data-d]'); if (!b) return; press(b.dataset.d); });

  if (sheet.classList.contains('on') || folderOpen) return;

/* confetti */
var cv = $('confetti'), cx = cv.getContext('2d'), bits = [], craf = 0;

  if (reduce) return;
  var r = $('screen').getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = r.width * dpr; cv.height = r.height * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var cols = ['#c8322b', '#e7f2e5', '#f0d27a', '#1b6e47', '#fff'];
  for (var i = 0; i < 140; i++) bits.push({x: r.width / 2 + (Math.random() - .5) * 60, y: r.height * .52, vx: (Math.random() - .5) * 9, vy: -6 - Math.random() * 9, w: 5 + Math.random() * 6, h: 3 + Math.random() * 4, a: Math.random() * 6, va: (Math.random() - .5) * .4, c: cols[i % cols.length], W: r.width, H: r.height});

}

  if (document.hidden){ craf = requestAnimationFrame(fall); return; }
  var W = cv.width, H = cv.height; cx.clearRect(0, 0, W, H);

}
