      }
    } else { // 機器人：金屬外殼（金屬的底色貼圖偏亮，壓暗才像原檔的反光金屬），加上刮痕與鏽
      if (cfg.metal) { const sat = Math.max(...rgb) - Math.min(...rgb); if (sat < 0.18) rgb = rgb.map(x => x * cfg.metal); }
      const rust = fbm(p.x * 12 + 7, p.y * 12, p.z * 12 - cfg.seed);
      if (rust > 0.68) { const r = Math.min(1, (rust - 0.68) * 4); rgb = rgb.map((x, i) => x * (1 - r * 0.6) + [0.22, 0.11, 0.05][i] * r * 0.6); }
      rgb = rgb.map(x => x * (0.88 + fine * 0.24));
    }
    if (n.y > 0.6 && p.y > 1.2) { const s = Math.min(1, (n.y - 0.6) * 2.4) * (0.2 + nz * 0.35); rgb = rgb.map(x => x * (1 - s) + 0.82 * s); } // 肩頭積雪
    return { rgb };
  };
}
async function bakeHumanoid(cfg) {
  const fitted = await fitHumanoid(cfg), acc = Acc(), shade = humanoidShade(cfg);
  for (const m of fitted.meshes) sampleMesh(acc, m, { spacing: cfg.spacing, seed: cfg.seed, shade });
  for (const a of cfg.attach || []) await attachPart(acc, a, fitted, shade);
  return { acc, meta: { n: acc.a.length, body: 'Male', kind: cfg.kind } };
}

/* ---------- 動畫：Universal Animation Library（CC0），只留身體骨頭的旋轉與骨盆位移 ---------- */
const CLIPS = { walk: 'Walk_Loop', idle: 'Idle_Loop', jog: 'Jog_Fwd_Loop', jab: 'Punch_Jab', cross: 'Punch_Cross', hit: 'Hit_Chest', hitHead: 'Hit_Head', die: 'Death01', crouch: 'Crouch_Idle_Loop' };
async function bakeClips() {
  const g = await loader.loadAsync(UAL);
  let pelvis = null; g.scene.traverse(o => { if (o.isBone && o.name === 'pelvis') pelvis = o; });
  const out = {};
  for (const [key, name] of Object.entries(CLIPS)) {
    const clip = g.animations.find(a => a.name === name); if (!clip) { log('缺少動畫', name); continue; }
    const tracks = clip.tracks.filter(t => { const [node, prop] = t.name.split('.'); if (FINGER.test(node) || /leaf/.test(node)) return false; return prop === 'quaternion' || (prop === 'position' && node === 'pelvis'); });
    // 降到 20 fps 並四捨五入，縮小檔案
    const json = tracks.map(t => {
      const sz = t.getValueSize(), times = [], values = [];
      const dur = clip.duration, steps = Math.max(2, Math.round(dur * 20) + 1), interp = t.createInterpolant();
      for (let i = 0; i < steps; i++) { const tt = Math.min(dur, i / 20); times.push(+tt.toFixed(3)); const r = interp.evaluate(tt); for (let c = 0; c < sz; c++) values.push(+r[c].toFixed(4)); }
      return { name: t.name, type: t.ValueTypeName, times, values };
    });
    out[key] = { name, duration: +clip.duration.toFixed(3), tracks: json };
  }
  return { clips: out, pelvis: pelvis.position.toArray().map(x => +x.toFixed(5)) };
}

window.bakeAll = async (which = 'all', only = null) => {
  const files = {}, manifest = { items: {}, scenes: {}, zombies: {}, rigs: {}, clips: null };
  const want = id => !only || only.includes(id);
  if (which === 'all' || which === 'items') for (const it of ITEMS.filter(x => want(x.id))) {
    const { acc, meta } = await bakeItem(it); files[it.id + '.spz'] = b64(await encodeSpz(acc)); (it.scene ? manifest.scenes : manifest.items)[it.id] = meta; log(it.id, meta.n, meta.size);
  }
  if (which === 'all' || which === 'zombies') {
    for (const v of [...VARIANTS, ...HUMANOIDS].filter(x => want(x.id))) {
      const { acc, meta } = v.src ? await bakeHumanoid(v) : await bakeZombie(v, manifest.rigs);
      files[v.id + '.spz'] = b64(await encodeSpz(acc)); files[v.id + '.skin'] = b64(await gzip(skinBytes(acc)));
      manifest.zombies[v.id] = meta; log(v.id, meta.n);
    }
    if (!only) { const c = await bakeClips(); manifest.clips = c.clips; manifest.ualPelvis = c.pelvis; }
  }
  return { files, manifest };
};
log('ready');
