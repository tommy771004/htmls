      }
    }
    return { rgb, offset, grow };
  };
  for (const m of meshes) sampleMesh(acc, m, { spacing: m === skinned ? 0.0072 : 0.004, seed: cfg.seed, shade: shadeBody });
  // 頭髮：Origin at 0 版本已經擺在頭上，全部綁到 Head
  for (const h of cfg.hair) {
    const hg = await loader.loadAsync(`${UBC}Hairstyles/Origin at 0/glTF (Godot)/${h}.gltf`); hg.scene.updateMatrixWorld(true);
    hg.scene.traverse(o => {
      if (!o.isMesh) return;
      const g = o.geometry; g.deleteAttribute('skinIndex'); g.deleteAttribute('skinWeight');
      const mesh = new THREE.Mesh(g, o.material); mesh.matrixWorld.copy(o.matrixWorld);
      sampleMesh(acc, mesh, { spacing: 0.005, seed: cfg.seed + 1, bone: headBone, shade: ({ p }) => ({ rgb: cfg.hairCol.map(x => x * (0.7 + fbm(p.x * 40, p.y * 40, p.z * 40) * 0.6)), offset: 0.002, grow: 1.2 }) });
    });
  }
  return { acc, meta: { n: acc.a.length, body: cfg.body } };
}

/* ---------- 動畫：Universal Animation Library（CC0），只留身體骨頭的旋轉與骨盆位移 ---------- */
const CLIPS = { walk: 'Walk_Loop', idle: 'Idle_Loop', jog: 'Jog_Fwd_Loop', jab: 'Punch_Jab', cross: 'Punch_Cross', hit: 'Hit_Chest', hitHead: 'Hit_Head', die: 'Death01', crouch: 'Crouch_Idle_Loop' };
async function bakeClips() {
  const g = await loader.loadAsync(UAL);
  let pelvis = null; g.scene.traverse(o => { if (o.isBone && o.name === 'pelvis') pelvis = o; });
  const out = {};
  for (const [key, name] of Object.entries(CLIPS)) {
    const clip = g.animations.find(a => a.name === name); if (!clip) { log('缺少動畫', name); continue; }
    const tracks = clip.tracks.filter(t => { const [node, prop] = t.name.split('.'); if (FINGER.test(node) || /leaf/.test(node)) return false; return prop === 'quaternion' || (prop === 'position' && node === 'pelvis'); });
    // 降到 20 fps 並四捨五入，縮小檔案
    const json = tracks.map(t => {
      const sz = t.getValueSize(), times = [], values = [];
      const dur = clip.duration, steps = Math.max(2, Math.round(dur * 20) + 1), interp = t.createInterpolant();
      for (let i = 0; i < steps; i++) { const tt = Math.min(dur, i / 20); times.push(+tt.toFixed(3)); const r = interp.evaluate(tt); for (let c = 0; c < sz; c++) values.push(+r[c].toFixed(4)); }
      return { name: t.name, type: t.ValueTypeName, times, values };
    });
    out[key] = { name, duration: +clip.duration.toFixed(3), tracks: json };
  }
  return { clips: out, pelvis: pelvis.position.toArray().map(x => +x.toFixed(5)) };
}

window.bakeAll = async (which = 'all') => {
  const files = {}, manifest = { items: {}, zombies: {}, rigs: {}, clips: null };
  if (which === 'all' || which === 'items') for (const it of ITEMS) {
    const { acc, meta } = await bakeItem(it); files[it.id + '.spz'] = b64(await encodeSpz(acc)); manifest.items[it.id] = meta; log(it.id, meta.n, meta.size);
  }
  if (which === 'all' || which === 'zombies') {
    for (const v of VARIANTS) {
      const { acc, meta } = await bakeZombie(v, manifest.rigs);
      files[v.id + '.spz'] = b64(await encodeSpz(acc)); files[v.id + '.skin'] = b64(await gzip(skinBytes(acc)));
      manifest.zombies[v.id] = meta; log(v.id, meta.n);
    }
    const c = await bakeClips(); manifest.clips = c.clips; manifest.ualPelvis = c.pelvis;
  }
  return { files, manifest };
};
log('ready');
