<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>266 原檔檢視</title>
<script type="importmap">
{"imports":{"three":"/vendor/three-0.186.0/three.module.js","three/addons/":"/vendor/three-0.186.0/addons/"}}
</script>
<style>html,body{margin:0;background:#2a2d33;color:#ddd;font:12px/1.4 system-ui}canvas{display:block}#info{position:fixed;left:6px;top:4px;white-space:pre;text-shadow:0 1px 2px #000}</style>
</head>
<body>
<div id="info"></div>
<script type="module">
/* 檢查 Sketchfab 原檔：?src=<網站路徑>，四個視角（前、右、上、斜）拼成一張，左上列出尺寸。
   &only=正規式 只顯示名稱符合的節點；&hide=正規式 隱藏；&clip=名稱&t=秒 擺動畫姿勢。 */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const QS = new URLSearchParams(location.search);
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setScissorTest(true); renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.append(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(3, 5, 4); scene.add(sun);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const g = await loader.loadAsync(QS.get('src'));
const root = g.scene;
const only = QS.get('only') && new RegExp(QS.get('only'), 'i'), hide = QS.get('hide') && new RegExp(QS.get('hide'), 'i');
root.traverse(o => {
  if (!o.isMesh) return;
  let name = ''; for (let p = o; p; p = p.parent) name += p.name + '/';
  if ((only && !only.test(name)) || (hide && hide.test(name))) o.visible = false;
});
if (QS.get('clip')) {
  const mixer = new THREE.AnimationMixer(root), clip = g.animations.find(a => a.name === QS.get('clip')) || g.animations[+QS.get('clip')];
  if (clip) { mixer.clipAction(clip).play(); mixer.setTime(+(QS.get('t') || 0)); }
}
scene.add(root); root.updateMatrixWorld(true);
const box = new THREE.Box3(); root.traverse(o => { if (o.isMesh && o.visible) box.expandByObject(o, true); });
const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3()), r = s.length() / 2;
const tris = []; root.traverse(o => { if (o.isMesh && o.visible) tris.push(o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3); });
document.getElementById('info').textContent = `${QS.get('src').split('/').pop()}\nsize ${s.toArray().map(v => v.toFixed(3)).join(' × ')}\nmin ${box.min.toArray().map(v => v.toFixed(2)).join(', ')}\ntris ${tris.reduce((a, b) => a + b, 0)}  anims ${g.animations.map(a => a.name).join(',')}`;
const cam = new THREE.PerspectiveCamera(30, (W / 2) / (H / 2), r / 100, r * 100);
const views = [[0, 0, 1], [1, 0, 0], [0, 1, 0.001], [1, 0.6, 1]];
views.forEach(([x, y, z], i) => {
  const vx = (i % 2) * W / 2, vy = (i < 2 ? 1 : 0) * H / 2;
  renderer.setViewport(vx, vy, W / 2, H / 2); renderer.setScissor(vx, vy, W / 2, H / 2);
  renderer.setClearColor(i % 2 ? 0x30343b : 0x2a2d33);
  cam.position.copy(c).add(new THREE.Vector3(x, y, z).normalize().multiplyScalar(r * 3.9)); cam.up.set(0, y > 0.9 ? 0 : 1, y > 0.9 ? -1 : 0); cam.lookAt(c);
  renderer.render(scene, cam);
});
window.__ready = true;
</script>
</body>
</html>
