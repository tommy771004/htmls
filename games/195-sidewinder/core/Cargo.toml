[package]
name = "sidewinder-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "sidewinder_core"
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2
