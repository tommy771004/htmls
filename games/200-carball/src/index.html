<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>車球碗 · CARBALL BOWL</title>
<meta name="description" content="在清水混凝土大廳裡踢一顆大足球：可以開上曲面牆與天花板的車、甩尾、二段跳、空中翻滾、加速補給點、進球爆炸與慢動作重播，對上電腦，一局五分鐘。">
<meta name="theme-color" content="#25231f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2325231f'/%3E%3Ccircle cx='32' cy='30' r='17' fill='%23e9e2d2'/%3E%3Cpath d='M32 20l8 6-3 9h-10l-3-9z' fill='%2325231f'/%3E%3Crect x='10' y='50' width='44' height='6' fill='%23e2a23b'/%3E%3C/svg%3E">
<style>
:root {
  --ink: #1c1a17;
  --slab: #2a2723;
  --slab-2: #35312c;
  --chalk: #ece6d6;
  --chalk-dim: #b5ad9d;
  --mute: #8d8576;
  --t0: #ece6d6;          /* 白堊隊 */
  --t1: #151311;          /* 煤煙隊 */
  --slab-line: rgba(236,230,214,.035);
  /* 清水模面板：橫向模板縫＋四角繫結孔 */
  --form: radial-gradient(circle at 14px 14px, rgba(10,9,8,.55) 0 2.5px, transparent 3.5px),
          radial-gradient(circle at calc(100% - 14px) 14px, rgba(10,9,8,.55) 0 2.5px, transparent 3.5px),
          radial-gradient(circle at 14px calc(100% - 14px), rgba(10,9,8,.55) 0 2.5px, transparent 3.5px),
          radial-gradient(circle at calc(100% - 14px) calc(100% - 14px), rgba(10,9,8,.55) 0 2.5px, transparent 3.5px),
          repeating-linear-gradient(180deg, transparent 0 21px, var(--slab-line) 21px 22px);
  --amber: #e2a23b;
  --disp: "Futura", "Futura PT", "Century Gothic", "Trebuchet MS", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --body: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  --num: "Futura", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--chalk); overflow: hidden; }
body { font-family: var(--body); -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; }
.hidden { display: none !important; }

/* 比分牌：上緣中央的混凝土牌，兩側斜切 */
#score {
  position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; pointer-events: none;
  filter: drop-shadow(0 2px 0 rgba(0,0,0,.35));
}
#score .team { min-width: 74px; padding: 4px 18px 6px; font: 800 34px/1 var(--num); font-stretch: condensed; letter-spacing: .02em; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
#score .t0 { background: var(--t0); color: var(--ink); }
#score .t1 { background: var(--t1); color: var(--chalk); box-shadow: inset 0 0 0 1px rgba(236,230,214,.12); }
#score .mid { background: var(--form), var(--slab); padding: 4px 18px 6px; display: grid; place-items: center; min-width: 112px; }
#clock { font: 700 26px/1 var(--num); font-variant-numeric: tabular-nums; color: var(--chalk); letter-spacing: .04em; }
#clockSub { font-size: 11px; color: var(--chalk-dim); margin-top: 3px; letter-spacing: .12em; }
#score .name { display: block; font: 600 11px/1 var(--body); letter-spacing: .1em; margin-top: 4px; opacity: .8; }

/* 加速表：右下 */
#boost { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 148px; height: 148px; pointer-events: none; }
#boost svg { width: 100%; height: 100%; overflow: visible; }
#boostNum { font: 700 44px var(--num); fill: var(--chalk); font-variant-numeric: tabular-nums; }
#boostLbl { font: 600 11px var(--body); fill: var(--chalk-dim); letter-spacing: .2em; }

/* 鏡頭模式：左下 */
#cam { position: fixed; left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); pointer-events: none; line-height: 1.25; }
#cam b { display: block; font: 800 20px var(--disp); letter-spacing: .06em; color: var(--chalk); }
#cam span { font-size: 12px; color: var(--chalk); }
#cam b, #cam span, #replayTag span { text-shadow: 0 1px 0 rgba(20,18,16,.9), 0 0 3px rgba(20,18,16,.7); }
#cam.ball b { color: var(--amber); }

/* 中央大字 */
#banner { position: fixed; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; }
#banner .big { font: 800 clamp(64px, 14vw, 168px)/1 var(--disp); letter-spacing: .02em; color: var(--chalk); -webkit-text-stroke: 0; }
#banner .sub { margin-top: 10px; font: 600 clamp(14px, 2vw, 20px)/1.3 var(--body); color: var(--chalk); letter-spacing: .08em; text-shadow: 0 1px 0 rgba(20,18,16,.9), 0 0 4px rgba(20,18,16,.8); }
#banner .big { text-shadow: 0 3px 0 rgba(20,18,16,.55); }
#banner.goal0 .big { color: var(--t0); }
#banner.goal1 .big { color: var(--t1); text-shadow: 0 0 1px var(--chalk), 0 0 2px var(--chalk), 0 3px 0 rgba(236,230,214,.5); }
#banner .big { animation: stamp .42s cubic-bezier(.2,.9,.25,1.2) both; }
@keyframes stamp { from { transform: scale(1.35); } to { transform: scale(1); } }

#replayTag { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(18px, env(safe-area-inset-left)); pointer-events: none; display: flex; gap: 10px; align-items: baseline; }
#replayTag b { font: 800 22px var(--disp); background: var(--chalk); color: var(--ink); padding: 3px 12px 4px; letter-spacing: .1em; }
#replayTag span { font-size: 13px; color: var(--chalk); }
#feed { position: fixed; top: 74px; right: max(18px, env(safe-area-inset-right)); display: grid; gap: 4px; justify-items: end; pointer-events: none; font-size: 13px; }
#feed div { background: rgba(28,26,23,.78); padding: 4px 10px; color: var(--chalk); }

#lockHint { position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(28,26,23,.82); color: var(--chalk); font-size: 13px; padding: 7px 14px; pointer-events: none; }
#pauseBtn { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); width: 42px; height: 42px; border: 0; background: rgba(28,26,23,.6); cursor: pointer; display: grid; place-items: center; }
#pauseBtn svg { width: 18px; height: 18px; }
#pauseBtn:hover { background: rgba(53,49,44,.9); }

/* 標題畫面與選單：斜切的混凝土板 */
.screen { position: fixed; inset: 0; display: grid; overflow-y: auto; }
#title { grid-template-columns: minmax(0, 1fr) minmax(300px, 420px); align-items: end; gap: 28px; padding: clamp(18px, 4vw, 56px); background: linear-gradient(90deg, rgba(20,18,16,.72) 0%, rgba(20,18,16,.2) 55%, rgba(20,18,16,.6) 100%); }
#title .mark { align-self: end; }
#title h1 { margin: 0; font: 800 clamp(66px, 11vw, 168px)/.9 var(--disp); letter-spacing: .01em; color: var(--chalk); }
#title h1 small { display: block; font: 700 clamp(16px, 2vw, 24px)/1 var(--num); letter-spacing: .5em; color: var(--chalk-dim); margin-top: 14px; }
#title .lede { max-width: 30em; margin: 18px 0 0; color: var(--chalk-dim); font-size: 15px; line-height: 1.6; }
.card { background: var(--form), rgba(42,39,35,.95); padding: 26px 26px 22px; box-shadow: 0 1px 0 rgba(236,230,214,.08) inset; }
.card h2 { margin: 0 0 12px; font: 700 13px var(--body); letter-spacing: .14em; color: var(--chalk-dim); }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px; }
.levels button { border: 0; background: var(--slab-2); padding: 12px 6px 10px; cursor: pointer; text-align: center; transition: background var(--t, .16s) ease, color var(--t, .16s) ease; }
.levels button b { display: block; font: 800 19px var(--disp); }
.levels button span { display: block; font-size: 11px; color: var(--mute); margin-top: 4px; }
.levels button:hover { background: #423d36; }
.levels button[aria-pressed="true"] { background: var(--amber); color: var(--ink); }
.levels button[aria-pressed="true"] span { color: #4d3410; }
.go { width: 100%; border: 0; cursor: pointer; background: var(--chalk); color: var(--ink); font: 800 24px var(--disp); letter-spacing: .08em; padding: 14px 18px 15px; display: flex; justify-content: space-between; align-items: center; transition: background .16s ease; }
.go:hover { background: #fff7e6; }
.go svg { width: 26px; height: 26px; transition: transform .2s cubic-bezier(.3,.7,.3,1); }
.go:hover svg { transform: translateX(5px); }
.keys { margin: 16px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; color: var(--chalk-dim); }
.keys dt { color: var(--chalk); font-weight: 600; white-space: nowrap; }
.keys dd { margin: 0; }
.sec { width: 100%; margin-top: 8px; border: 0; background: transparent; color: var(--chalk-dim); padding: 10px; cursor: pointer; font-size: 14px; }
.sec:hover { color: var(--chalk); background: rgba(255,255,255,.04); }

#pause, #over { place-items: center; background: rgba(20,18,16,.62); padding: 18px; }
#pause .card, #over .card { width: min(420px, 100%); }
#over .final { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin: 8px 0 18px; text-align: center; }
#over .final b { font: 800 64px/1 var(--num); }
#over .final .f0 { color: var(--t0); }
#over .final .f1 { color: var(--t1); -webkit-text-stroke: 1.5px var(--chalk); }
#over .final i { font-style: normal; color: var(--mute); font-size: 22px; }
#over h3 { margin: 0; font: 800 34px var(--disp); }
.row { display: grid; grid-template-columns: 6em 1fr 3em; align-items: center; gap: 10px; margin: 10px 0; font-size: 14px; color: var(--chalk-dim); }
.row input { width: 100%; accent-color: var(--amber); }
.row output { text-align: right; font-variant-numeric: tabular-nums; color: var(--chalk); }

#loading { place-items: center; background: var(--ink); z-index: 10; }
#loading p { font: 700 15px var(--body); color: var(--chalk-dim); letter-spacing: .2em; }

/* 觸控 */
#touch { position: fixed; inset: 0; pointer-events: none; }
#stick { position: absolute; left: max(22px, env(safe-area-inset-left)); bottom: max(26px, env(safe-area-inset-bottom)); width: 132px; height: 132px; border-radius: 50%; background: rgba(28,26,23,.35); box-shadow: inset 0 0 0 2px rgba(236,230,214,.25); pointer-events: auto; touch-action: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(236,230,214,.75); }
.tbtn { position: absolute; pointer-events: auto; touch-action: none; border: 0; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--body); color: var(--ink); }
#tJump { right: max(22px, env(safe-area-inset-right)); bottom: max(40px, env(safe-area-inset-bottom)); width: 84px; height: 84px; background: rgba(236,230,214,.85); }
#tBoost { right: max(118px, calc(env(safe-area-inset-right) + 96px)); bottom: max(26px, env(safe-area-inset-bottom)); width: 70px; height: 70px; background: rgba(226,162,59,.88); }
#tSlide { right: max(40px, env(safe-area-inset-right)); bottom: max(140px, calc(env(safe-area-inset-bottom) + 114px)); width: 58px; height: 58px; background: rgba(236,230,214,.55); font-size: 13px; }
#tCam { right: max(118px, calc(env(safe-area-inset-right) + 96px)); bottom: max(118px, calc(env(safe-area-inset-bottom) + 92px)); width: 50px; height: 50px; background: rgba(28,26,23,.6); color: var(--chalk); font-size: 12px; }
.tbtn.on { filter: brightness(1.25); transform: scale(.94); }
body.touch #boost { bottom: auto; top: max(70px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); width: 96px; height: 96px; }
body.touch #cam { display: none; }

@media (max-width: 760px) {
  #title { grid-template-columns: 1fr; align-items: start; align-content: space-between; }
  #title h1 { font-size: 64px; }
  #title .lede { font-size: 14px; }
  #score .team { min-width: 52px; font-size: 26px; padding: 3px 12px 5px; }
  #score .mid { min-width: 84px; padding: 3px 10px 5px; }
  #clock { font-size: 20px; }
  #score .name { display: none; }
  #feed { top: 60px; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #banner .big { animation: none; }
  .go svg { transition: none; }
}
</style>
</head>
<body>
<canvas id="view" aria-label="車球場"></canvas>

<div id="hud" class="hidden">
  <div id="score">
    <div class="team t0"><span id="s0">0</span><span class="name">白堊</span></div>
    <div class="mid"><div id="clock">5:00</div><div id="clockSub">第一局</div></div>
    <div class="team t1"><span id="s1">0</span><span class="name">煤煙</span></div>
  </div>
  <div id="boost">
    <svg viewBox="0 0 148 148" aria-hidden="true">
      <g id="boostTicks"></g>
      <text id="boostNum" x="74" y="84" text-anchor="middle" dominant-baseline="central">33</text>
      <text id="boostLbl" x="74" y="114" text-anchor="middle">加速</text>
    </svg>
  </div>
  <div id="cam" class="ball"><b id="camName">球鎖定</b><span id="camHint">Y 切換鏡頭</span></div>
  <div id="lockHint" class="hidden">點一下球場，滑鼠就能轉視角</div>
  <div id="feed"></div>
  <button id="pauseBtn" aria-label="暫停"><svg viewBox="0 0 18 18"><rect x="3" y="2" width="4" height="14" fill="#ece6d6"/><rect x="11" y="2" width="4" height="14" fill="#ece6d6"/></svg></button>
</div>
<div id="banner" class="hidden"></div>
<div id="replayTag" class="hidden"><b>重播</b><span id="skipHint">按跳躍略過</span></div>

<div id="touch" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <button class="tbtn" id="tJump">跳</button>
  <button class="tbtn" id="tBoost">加速</button>
  <button class="tbtn" id="tSlide">甩尾</button>
  <button class="tbtn" id="tCam">鏡頭</button>
</div>

<section id="title" class="screen hidden">
  <div class="mark">
    <h1>車球碗<small>CARBALL BOWL</small></h1>
    <p class="lede">清水混凝土澆成的室內球場，牆角是彎的，車開得上牆也開得上天花板。把一顆比車還大的球撞進對面的鐵門，五分鐘。</p>
  </div>
  <div class="card">
    <h2>對手</h2>
    <div class="levels" id="levels">
      <button data-l="rookie" aria-pressed="false"><b>新手</b><span>慢、不跳</span></button>
      <button data-l="pro" aria-pressed="true"><b>職業</b><span>會跳會翻</span></button>
      <button data-l="allstar" aria-pressed="false"><b>全明星</b><span>快又準</span></button>
    </div>
    <button class="go" id="start">開球<svg viewBox="0 0 26 26"><path d="M4 22L21 5M9 5h12v12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg></button>
    <dl class="keys">
      <dt>W S</dt><dd>油門、倒車；空中俯仰</dd>
      <dt>A D</dt><dd>轉向；空中偏航</dd>
      <dt>空白鍵 / 右鍵</dt><dd>跳躍、二段跳；帶方向是翻滾</dd>
      <dt>Shift / 左鍵</dt><dd>加速</dd>
      <dt>C</dt><dd>甩尾；空中按住變滾轉</dd>
      <dt>Q E</dt><dd>空中向左、右滾轉</dd>
      <dt>Y</dt><dd>球鎖定 / 車尾 / 自由視角</dd>
      <dt>Esc</dt><dd>暫停</dd>
    </dl>
    <button class="sec" id="practice">自由練習（沒有對手、不計時）</button>
  </div>
</section>

<section id="pause" class="screen hidden">
  <div class="card">
    <h2>暫停</h2>
    <button class="go" id="resume">繼續<svg viewBox="0 0 26 26"><path d="M4 22L21 5M9 5h12v12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg></button>
    <div class="row"><label for="vol">音量</label><input id="vol" type="range" min="0" max="100" value="70"><output id="volOut">70</output></div>
    <div class="row"><label for="fov">視野</label><input id="fov" type="range" min="80" max="120" value="110"><output id="fovOut">110</output></div>
    <div class="row"><label for="dist">鏡頭距離</label><input id="dist" type="range" min="200" max="420" value="270"><output id="distOut">2.7</output></div>
    <button class="sec" id="restart">重新開始這一局</button>
    <button class="sec" id="toTitle">回到標題</button>
  </div>
</section>

<section id="over" class="screen hidden">
  <div class="card">
    <h3 id="overTitle">勝利</h3>
    <div class="final"><b class="f0" id="f0">0</b><i>比</i><b class="f1" id="f1">0</b></div>
    <button class="go" id="again">再來一局<svg viewBox="0 0 26 26"><path d="M4 22L21 5M9 5h12v12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg></button>
    <button class="sec" id="overTitleBtn">回到標題</button>
  </div>
</section>

<section id="loading" class="screen"><p>澆灌混凝土中</p></section>

<script id="rapier-wasm" type="application/octet-stream"><!--WASM--></script>
<!--BUNDLE-->
</body>
</html>
