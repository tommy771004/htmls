# Cloudflare Worker＋Durable Objects（車球聯賽房間、大廳、排行榜）。
# 部署要用你自己的 Cloudflare 帳號：npx wrangler login && npx wrangler deploy（在這個資料夾）。
# 部署完把網址（wss://<名稱>.<帳號>.workers.dev）設給打包：RSA_SERVER=wss://… npm run build
name = "roadster-stunt-arena"
main = "index.js"
compatibility_date = "2026-09-01"

[vars]
# 允許連線的網頁來源，逗號分隔；留空＝不限制
ALLOWED_ORIGINS = "https://htmls-ruddy.vercel.app"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Room"]
