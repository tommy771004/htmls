# Cloudflare Worker＋Durable Objects：282 普隆德拉大廳（所有大廳編號共用一個 Lobby，廣場內分 4 個頻道；走動、外觀、表情、
# 聊天、檢視、密語、好友、離線留言、檢舉與禁言、組隊與合作關卡的轉送）。資料存在 Lobby 內建的 SQLite，不需要資料庫連線；程式更新後再執行一次 npx wrangler deploy。
# 部署要用你自己的 Cloudflare 帳號，在這個資料夾執行（Free 方案即可）：
#   npx wrangler login
#   npx wrangler secret put RO_LOBBY_SECRET     # 和 Vercel 的 RO_LOBBY_SECRET 填同一個長亂數
#   npx wrangler secret put RO_ADMIN_KEY        # 管理頁 /admin 的密鑰（至少 16 字）；不設則管理頁 404
#   npx wrangler deploy
# 部署完把 Vercel 的 RO_LOBBY_URL 設成 wss://ro-lobby.<帳號>.workers.dev/api/ro/lobby，重新部署 Vercel。
# 管理頁：https://ro-lobby.<帳號>.workers.dev/admin（看檢舉、禁言／解除）。
# 交易（線上角色）：Vercel 設 RO_TRADE=1 後，在下面 [vars] 加 RO_TRADE_URL = "https://htmls-ruddy.vercel.app/api/ro/trade/settle" 再 deploy；沒設就不開放交易。
# 合作關卡的行程收據、結算收據與擲骰（server/ro-life/coop.mjs）也在這個 Worker，用同一個 RO_LOBBY_SECRET 簽。
# 部署之後才能在 Vercel 設 RO_COOP_RECEIPT=1（沒有行程收據的關卡憑證當單人算）；順序反了合作關卡的經驗會被砍。
name = "ro-lobby"
main = "index.js"
compatibility_date = "2026-09-01"

[vars]
# 允許連線的網頁來源，逗號分隔；留空＝不限制
ALLOWED_ORIGINS = "https://htmls-ruddy.vercel.app"
RO_TRADE_URL = "https://htmls-ruddy.vercel.app/api/ro/trade/settle"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]
