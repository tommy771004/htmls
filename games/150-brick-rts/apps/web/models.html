<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brick RTS · 模型檢視</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#254b40;font:15px/1.6 system-ui}header,footer{padding:16px 4%;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:23px;margin:0}a{color:inherit}canvas{display:block;width:100%;height:70vh;min-height:320px}button{font:inherit;padding:8px 16px;background:#fffdf7;color:inherit;border:1px solid #9da991;cursor:pointer}canvas[hidden]{display:none}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid #b95d38;outline-offset:2px}#error{padding:20px;color:#972f1d}#stats{font:12px monospace}p{margin:0}</style></head><body><header><a href="150-brick-rts.html">← 指令沙盒</a><h1>積木村落 · 模型檢視</h1><p>原創程序模型 · 開發中 · 不含對局</p></header><p id="error" role="alert" hidden></p><button id="reload" hidden>重新載入模型頁</button><canvas id="scene" aria-label="3D 模型檢視，可用下方按鈕調整視角"></canvas><footer><label>建築模型 <select id="building-kind"><option value="house">住宅</option><option value="lumber-camp">伐木場</option><option value="mining-camp">採礦場</option><option value="mill">磨坊</option><option value="farm">農田</option><option value="town-center">城鎮中心</option><option value="market">市場</option><option value="smithy">鐵匠舖</option><option value="barracks">兵營</option><option value="archery-range">靶場</option><option value="stable">馬廄</option></select></label><label>建築外觀 <select id="building-age"><option value="1">時代 1</option><option value="2" selected>時代 2</option><option value="3">時代 3</option><option value="4">時代 4</option></select></label><label>施工 <select id="building-progress"><option value="0">基座</option><option value="20">牆柱</option><option value="40">屋頂</option><option value="60">機能件</option><option value="100" selected>完成外觀</option></select></label><label>狀況 <select id="building-health"><option value="100">完整</option><option value="35">受損</option><option value="0">殘骸</option></select></label><button id="focus-house">聚焦建築</button><span>只檢查外觀，不執行生產、交易、研究、升級或施工。</span><label>代表輪廓 <select id="unit-role"><option value="villager">村民</option><option value="swordsman">劍盾兵</option><option value="spearman">長矛兵</option><option value="archer">弓兵</option><option value="cavalry">騎兵</option></select></label><label>姿態 <select id="pose"><option value="idle">待命</option><option value="walk">行走</option><option value="work">工作</option><option value="attack">攻擊</option><option value="hit">受擊</option><option value="death">倒下</option><option value="carry">搬運</option></select></label><label>工具 <select id="tool"><option value="none">無</option><option value="axe">斧</option><option value="pick">鎬</option><option value="sickle">鐮刀</option><option value="hammer">槌</option><option value="basket">籃</option><option value="sword">劍</option><option value="spear">長矛</option><option value="bow">弓</option></select></label><label><input id="animate" type="checkbox">播放動作</label><span>模型姿態檢視，不執行採集或傷害；騎乘僅支援待命、行走與攻擊。</span><label>驗收地圖 <select id="layout"><option value="meadow">草甸</option><option value="coast">海岸</option><option value="acceptance">手工淺灘通道</option></select></label><span id="layout-note">草甸：平坦陸地。此頁僅檢視地圖與模型，不執行對局。</span><button id="focus-unit">聚焦人偶</button><button id="turn">轉向 90°</button><button id="near">近看</button><button id="far">遠看</button><button id="reset">全景</button><span id="stats">正在載入模型…</span><p>此版展示十一類村落建築、村民、三種步兵輪廓與七種資源代表模型；採集、狩獵、放牧、捕魚及完整兵種動畫尚未實作。</p></footer><script type="module">
import {createScene} from './assets/150-brick-rts/scene.js';
let failed=false;
const error=m=>{failed=true;document.querySelector('#scene').hidden=true;document.querySelector('#error').hidden=false;document.querySelector('#error').textContent=m;document.querySelector('#stats').textContent='繪圖已停止';for(const control of document.querySelectorAll('footer button,footer select,footer input'))control.disabled=true;document.querySelector('#reload').hidden=false;};
document.querySelector('#reload').onclick=()=>location.reload();
try{const view=await createScene(document.querySelector('#scene'),error,{assetPreview:true});view.update({seed:260925,tick:0,stateHash:'asset-view',units:[{id:1,player:0,x:650,y:950,target:null},{id:2,player:0,x:800,y:950,target:null},{id:3,player:1,x:1150,y:700,target:null}]},1);
document.querySelector('#building-kind').onchange=event=>view.setPreviewBuildingKind(event.target.value);
const building=()=>view.setPreviewBuilding({ageVariant:Number(document.querySelector('#building-age').value),progress:Number(document.querySelector('#building-progress').value),health:Number(document.querySelector('#building-health').value)});for(const id of ['building-age','building-progress','building-health'])document.querySelector('#'+id).onchange=building;document.querySelector('#focus-house').onclick=()=>view.focusPreviewHouse();
document.querySelector('#unit-role').onchange=event=>{view.setPreviewRole(event.target.value);document.querySelector('#pose').value='idle';for(const option of document.querySelector('#pose').options)option.disabled=event.target.value==='cavalry'&&!['idle','walk','attack'].includes(option.value);document.querySelector('#tool').value=({villager:'none',swordsman:'sword',spearman:'spear',archer:'bow',cavalry:'spear'})[event.target.value];};
const motion=()=>view.setPreviewMotion(document.querySelector('#pose').value,document.querySelector('#tool').value,document.querySelector('#animate').checked);for(const id of ['pose','tool','animate'])document.querySelector('#'+id).onchange=motion;
document.querySelector('#layout').onchange=event=>{view.setPreviewLayout(event.target.value);document.querySelector('#layout-note').textContent=({meadow:'草甸：平坦陸地。',coast:'海岸：藍色深水阻擋陸地單位；沙岸可通行。',acceptance:'手工驗收圖：中央河道與淺灘；左側高地僅可沿土色階梯登上（自訂規則）。'})[event.target.value]+' 此頁僅檢視地圖與模型，不執行對局。';};
document.querySelector('#focus-unit').onclick=()=>view.focusPreviewUnit(1);document.querySelector('#turn').onclick=()=>view.rotate();document.querySelector('#near').onclick=()=>view.zoom(.3);document.querySelector('#far').onclick=()=>view.zoom(-.3);document.querySelector('#reset').onclick=()=>view.resetCamera();let last=0;function frame(time){if(failed)return;try{view.draw(time);if(time-last>500){const s=view.stats();document.querySelector('#stats').textContent=`LOD ${s.detail} · Draw calls ${s.drawCalls} · Triangles ${s.triangles} · Geometries ${s.geometries}`;last=time;}requestAnimationFrame(frame);}catch(e){error(`模型繪圖失敗：${e.message}`);}}requestAnimationFrame(frame);}catch(e){error(`模型載入失敗：${e.message}`);}
</script></body></html>
