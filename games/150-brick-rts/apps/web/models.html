<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brick RTS · 模型檢視</title><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#254b40;font:15px/1.6 system-ui}header,footer{padding:16px 4%;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:23px;margin:0}a{color:inherit}canvas{display:block;width:100%;height:70vh;min-height:320px}button{font:inherit;padding:8px 16px;background:#fffdf7;color:inherit;border:1px solid #9da991;cursor:pointer}button:focus-visible{outline:3px solid #b95d38;outline-offset:2px}#error{padding:20px;color:#972f1d}#stats{font:12px monospace}p{margin:0}</style></head><body><header><a href="150-brick-rts.html">← 指令沙盒</a><h1>積木村落 · 模型檢視</h1><p>原創程序模型 · 開發中 · 不含對局</p></header><p id="error" role="alert" hidden></p><canvas id="scene" aria-label="3D 模型檢視，可用下方按鈕調整視角"></canvas><footer><label>驗收地圖 <select id="layout"><option value="meadow">草甸</option><option value="coast">海岸</option><option value="acceptance">手工淺灘通道</option></select></label><span id="layout-note">草甸：平坦陸地。此頁僅檢視地圖與模型，不執行對局。</span><button id="turn">轉向 90°</button><button id="near">近看</button><button id="far">遠看</button><button id="reset">全景</button><span id="stats">正在載入模型…</span><p>此版展示住宅、村民與七種資源代表模型；採集、狩獵、放牧、捕魚及完整兵種動畫尚未實作。</p></footer><script type="module">
import {createScene} from './assets/150-brick-rts/scene.js';
const error=m=>{document.querySelector('#error').hidden=false;document.querySelector('#error').textContent=m;};
try{const view=await createScene(document.querySelector('#scene'),error,{assetPreview:true});view.update({seed:260925,tick:0,stateHash:'asset-view',units:[{id:1,player:0,x:350,y:700,target:null},{id:2,player:0,x:450,y:700,target:null},{id:3,player:1,x:1150,y:700,target:null}]},1);
document.querySelector('#layout').onchange=event=>{view.setPreviewLayout(event.target.value);document.querySelector('#layout-note').textContent=({meadow:'草甸：平坦陸地。',coast:'海岸：藍色深水阻擋陸地單位；沙岸可通行。',acceptance:'手工驗收圖：中央河道，淡藍淺灘同時允許陸地與水域通行（自訂規則）。'})[event.target.value]+' 此頁僅檢視地圖與模型，不執行對局。';};
document.querySelector('#turn').onclick=()=>view.rotate();document.querySelector('#near').onclick=()=>view.zoom(.3);document.querySelector('#far').onclick=()=>view.zoom(-.3);document.querySelector('#reset').onclick=()=>view.resetCamera();let last=0;function frame(time){view.draw(time);if(time-last>500){const s=view.stats();document.querySelector('#stats').textContent=`Draw calls ${s.drawCalls} · Triangles ${s.triangles} · Geometries ${s.geometries}`;last=time;}requestAnimationFrame(frame);}requestAnimationFrame(frame);}catch(e){error(`模型載入失敗：${e.message}`);}
</script></body></html>
