<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HUD 參考</title>
<!-- UI 參考圖：疊在 ref-street-morning.png 上截圖成 ../ref-ui-hud.png。不是遊戲程式，只是規格。 -->
<style>
:root{--ink:#1f2433;--paper:#f6eedb;--mustard:#e5aa35;--mustardDk:#b88220;--navy:#2f4c6e;--red:#d8402c;--mint:#79b8a2;--grass:#5a9440}
*{box-sizing:border-box;margin:0}
body{width:1600px;height:900px;overflow:hidden;background:#000 url(../ref-street-morning.png) center/cover;
  font-family:"PingFang TC","Heiti TC","Noto Sans TC",ui-rounded,system-ui,sans-serif;color:var(--ink)}
/* 紙片：米色紙、墨色細邊、往右下偏的硬陰影，邊角略圓——像剪下來貼在畫面上的送報單 */
.slip{position:absolute;background:var(--paper);border:2.5px solid var(--ink);border-radius:10px;box-shadow:4px 5px 0 rgba(31,36,51,.85)}
.lbl{font-size:13px;font-weight:700;letter-spacing:.12em;color:#6d6a62}
/* 左上：今天＋時間刻度（太陽從左走到右＝路線進度） */
#day{left:28px;top:24px;padding:12px 18px 14px;display:flex;gap:18px;align-items:center}
#day .d{font-size:34px;font-weight:900;line-height:1}
#day .d small{display:block;font-size:13px;font-weight:700;letter-spacing:.14em;color:#6d6a62;margin-top:6px}
#route{left:28px;top:118px;padding:10px 16px 12px;width:520px}
#route .row{display:flex;align-items:center;gap:0;margin-top:18px;position:relative;height:30px}
#route .row:before{content:"";position:absolute;left:6px;right:6px;top:14px;height:3px;background:repeating-linear-gradient(90deg,var(--ink) 0 8px,transparent 8px 13px)}
.h{position:relative;flex:1;display:grid;place-items:center}
.h i{display:block;width:18px;height:18px;border:2.5px solid var(--ink);border-radius:4px 4px 3px 3px;background:var(--paper);clip-path:polygon(50% 0,100% 38%,100% 100%,0 100%,0 38%)}
.h.sub i{background:var(--mustard)}
.h.ok i{background:var(--mint)}
.h.ok:after{content:"✓";position:absolute;top:-15px;font-size:14px;font-weight:900;color:var(--ink)}
.h.miss i{background:#c9c3b4}
.h.miss:after{content:"✕";position:absolute;top:-15px;font-size:13px;font-weight:900;color:var(--red)}
.h.no i{width:12px;height:12px;background:#c9c3b4;border-width:2px;opacity:.8}
.bike{position:absolute;top:-2px;width:30px;height:30px;transform:translateX(-50%)}
/* 右上：分數 */
#score{right:28px;top:24px;padding:10px 22px 12px;text-align:right;min-width:230px}
#score .n{font-size:52px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#combo{right:40px;top:122px;background:var(--red);color:var(--paper);border-color:var(--ink);padding:6px 14px;font-weight:900;font-size:19px;transform:rotate(-4deg)}
#combo b{font-size:24px}
/* 左下：剩幾份報紙 */
#stock{left:28px;bottom:26px;padding:10px 16px 12px;display:flex;align-items:flex-end;gap:14px}
#stock .n{font-size:44px;font-weight:900;line-height:.9}
#stock .rolls{display:flex;gap:4px;align-items:flex-end;padding-bottom:4px}
#stock .rolls svg{width:16px;height:40px}
#stock .rolls .gone{opacity:.22}
/* 右下：操作提示（只在第一天開場前幾秒出現） */
#keys{right:28px;bottom:26px;padding:10px 14px;display:flex;gap:16px;font-size:15px;font-weight:700;align-items:center}
kbd{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 7px;margin-right:6px;border:2px solid var(--ink);border-bottom-width:4px;border-radius:6px;background:#fff;font:800 14px ui-rounded,system-ui,sans-serif}
/* 場景裡的標記：訂戶信箱頭上的倒三角標籤、命中時跳出的分數 */
.tag{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center}
.tag span{background:var(--mustard);border:2.5px solid var(--ink);border-radius:8px;padding:3px 9px;font-weight:900;font-size:15px;box-shadow:3px 3px 0 rgba(31,36,51,.8)}
.tag:after{content:"";width:0;height:0;border:9px solid transparent;border-top:11px solid var(--ink);margin-top:-1px}
.tag.far span{font-size:12px;padding:2px 7px}
.pop{position:absolute;font-weight:900;font-size:30px;color:var(--paper);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);transform:rotate(-6deg)}
.pop small{display:block;font-size:16px;-webkit-text-stroke:2px var(--ink);margin-top:-2px}
/* 準星：投擲方向的拋物線虛點，落點是一個小圓 */
#aim{position:absolute;left:0;top:0;width:1600px;height:900px;pointer-events:none}
</style></head><body>

<div class="slip" id="day">
  <div class="d">週二<small>楓樹巷 · 第 2 天</small></div>
  <svg width="150" height="62" viewBox="0 0 150 62" aria-label="時間：清晨 6:40">
    <path d="M8 54 A67 52 0 0 1 142 54" fill="none" stroke="#1f2433" stroke-width="2.5" stroke-dasharray="5 5"/>
    <line x1="2" y1="54" x2="148" y2="54" stroke="#1f2433" stroke-width="2.5"/>
    <circle cx="40" cy="22" r="10" fill="#e5aa35" stroke="#1f2433" stroke-width="2.5"/>
    <text x="75" y="50" text-anchor="middle" font-size="15" font-weight="900" fill="#1f2433">6:40</text>
  </svg>
</div>

<div class="slip" id="route">
  <div class="lbl">路線　訂戶 9／14 · 剩 520 公尺</div>
  <div class="row">
    <div class="h sub ok"><i></i></div><div class="h no"><i></i></div><div class="h sub ok"><i></i></div><div class="h sub miss"><i></i></div>
    <div class="h no"><i></i></div><div class="h sub ok"><i></i></div><div class="h sub"><i></i></div><div class="h no"><i></i></div>
    <div class="h sub"><i></i></div><div class="h sub"><i></i></div><div class="h no"><i></i></div><div class="h sub"><i></i></div>
    <div class="h no"><i></i></div><div class="h sub"><i></i></div>
    <svg class="bike" style="left:43%" viewBox="0 0 30 30"><circle cx="7" cy="21" r="5.5" fill="none" stroke="#1f2433" stroke-width="2.5"/><circle cx="23" cy="21" r="5.5" fill="none" stroke="#1f2433" stroke-width="2.5"/><path d="M7 21 12 12h9l2 9M12 12l4 9M19 8h4" fill="none" stroke="#d8402c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</div>

<div class="slip" id="score"><div class="lbl">今日分數</div><div class="n">1,850</div></div>
<div class="slip" id="combo">連投 <b>×3</b></div>

<div class="slip" id="stock">
  <div><div class="lbl">報紙</div><div class="n">12</div></div>
  <div class="rolls" id="rolls"></div>
</div>

<div class="slip" id="keys"><span><kbd>←</kbd><kbd>→</kbd>轉向</span><span><kbd>↑</kbd>加速</span><span><kbd>Z</kbd><kbd>X</kbd>往左／右投</span></div>

<div class="tag" style="left:1100px;top:438px"><span>訂戶</span></div>
<div class="tag far" style="left:913px;top:398px"><span>訂戶</span></div>
<div class="pop" style="left:1148px;top:500px">+100<small>正中信箱</small></div>

<svg id="aim" viewBox="0 0 1600 900">
  <g fill="#f6eedb" stroke="#1f2433" stroke-width="2">
    <circle cx="866" cy="566" r="4"/><circle cx="920" cy="540" r="4"/><circle cx="970" cy="522" r="4"/><circle cx="1014" cy="512" r="4"/><circle cx="1052" cy="510" r="4"/><circle cx="1082" cy="516" r="4"/>
  </g>
  <ellipse cx="1100" cy="528" rx="26" ry="9" fill="none" stroke="#f6eedb" stroke-width="3"/>
  <ellipse cx="1100" cy="528" rx="26" ry="9" fill="none" stroke="#1f2433" stroke-width="1.5" stroke-dasharray="4 4"/>
</svg>

<script>
const roll='<svg viewBox="0 0 16 40"><rect x="2" y="2" width="12" height="36" rx="6" fill="#ebe5d5" stroke="#1f2433" stroke-width="2.2"/><rect x="2" y="15" width="12" height="5" fill="#d8402c" stroke="#1f2433" stroke-width="1.6"/></svg>';
document.getElementById('rolls').innerHTML=Array.from({length:20},(_,i)=>i<12?roll:roll.replace('<svg','<svg class="gone"')).join('');
</script>
</body></html>
