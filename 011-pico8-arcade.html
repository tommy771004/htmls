<script>

/* ---------- audio: WebAudio chiptune ---------- */
let AC=null, master=null, musGain=null, musicTimer=null, nextT=0, stepN=0, noiseBuf=null;

function audio(){
  if(!AC){ try{ const A=window.AudioContext||window.webkitAudioContext; if(!A) return; AC=new A();
      master=AC.createGain(); master.gain.value=muted?0:.55; master.connect(AC.destination);

      noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;

const sfx={
  move(){ tone(1175,.035,'square',.025); },
  star(){ [988,1319,1568,1976].forEach((f,i)=>tone(f,.07,'square',.05,0,AC&&AC.currentTime+i*.045)); },

/* ---------- game state ---------- */
const cv=document.getElementById('screen'); const g=cv.getContext('2d'); g.imageSmoothingEnabled=false;
const ZONE_TOP=9, ZONE_BOT=14;

  hz=[];parts=[];warns=[];float=[];score=0;level=1;lives=3;shield=0;inv=60;shake=0;flash=0;spawnT=30;cometT=240;banner=80;newHi=false;frame=0;

/* ---------- input ---------- */
const held={}, rep={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',KeyX:'x',KeyV:'x',Space:'x',Enter:'x',KeyZ:'o',KeyC:'o',KeyN:'o',KeyP:'o',Escape:'o',KeyM:'mute'};

    if(state==='play'){ state='pause'; sfx.pause(); }
    else if(state==='pause'){ state='play'; sfx.pause(); }

  if(k==='left') col--; if(k==='right') col++; if(k==='up') row--; if(k==='down') row++;
  col=Math.max(0,Math.min(15,col)); row=Math.max(ZONE_TOP,Math.min(ZONE_BOT,row));
  if(col!==P.col||row!==P.row){ P.col=col;P.row=row; sfx.move(); }
}
addEventListener('keydown',e=>{ const k=KEYMAP[e.code]; if(!k) return; e.preventDefault(); if(e.repeat) return; press(k); });
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k) release(k); });
const ctr=document.getElementById('controls');
if(ctr){
  ctr.querySelectorAll('[data-k]').forEach(b=>{
    const k=b.dataset.k;
    b.addEventListener('pointerdown',e=>{ e.preventDefault(); try{b.setPointerCapture(e.pointerId);}catch(_){} b.classList.add('pressed'); press(k); });
    const up=()=>{ b.classList.remove('pressed'); release(k); };
    b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('lostpointercapture',up);
    b.addEventListener('contextmenu',e=>e.preventDefault());
    b.addEventListener('keydown',e=>{ if(e.code==='Enter'||e.code==='Space'){ e.stopPropagation(); e.preventDefault(); press(k); setTimeout(()=>release(k),120);} });
  });
}
/* tapping the screen itself: left/right half steps, or starts */
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); cv.focus({preventScroll:true});
  if(state!=='play'){ press('x'); release('x'); return; }
  const r=cv.getBoundingClientRect(); const px=(e.clientX-r.left)/r.width*128, py=(e.clientY-r.top)/r.height*128;
  const sx=P.col*8+4, sy=P.row*8+4; const dx=px-sx, dy=py-sy;
  if(Math.abs(dx)<5&&Math.abs(dy)<5) return;
  const k=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');
  press(k); release(k);
});
addEventListener('blur',()=>{ for(const k in held) held[k]=false; if(state==='play') state='pause'; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(state==='play') state='pause'; if(AC&&AC.state==='running') AC.suspend().catch(()=>{}); } else if(AC&&musicTimer) AC.resume().catch(()=>{}); });

/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
function burst(x,y,n,cols,sp){ for(let i=0;i<n;i++){ const a=Math.random()*6.283, v=rnd(.3,sp||1.8); parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:ri(14,34),c:cols[ri(0,cols.length-1)]}); } }
function pad(n,l){ n=String(n); while(n.length<l) n='0'+n; return n; }

/* ---------- update ---------- */
function spawn(){
  const r=Math.random();
  const sp=.55+level*.11+Math.random()*.45;
  if(r<.07){ hz.push({k:'star',col:ri(0,15),y:-8,sp:.6+level*.05,w:1}); }
  else if(r<.085 && !shield){ hz.push({k:'shield',col:ri(0,15),y:-8,sp:.55,w:1}); }
  else if(level>=3 && r<.23){ hz.push({k:'big',col:ri(0,14),y:-16,sp:sp*.62,w:2,rot:0}); }
  else { hz.push({k:'rock',col:ri(0,15),y:-8,sp,w:1,v:ri(0,2),fl:Math.random()<.5}); }
}
function hurt(){
  if(inv>0) return;
  const cx=P.col*8+4, cy=P.row*8+4;
  if(shield){ shield=0; inv=50; shake=3; burst(cx,cy,18,[12,7,1]); sfx.block(); float.push({x:cx,y:cy-8,t:40,s:'SHIELD POP',c:12}); return; }
  lives--; shake=6; flash=3; inv=100; burst(cx,cy,40,[7,10,9,8,2],2.4); sfx.hit();
  if(lives<=0){ state='over'; dieT=70; if(score>hiscore){ hiscore=score; newHi=true; save('stardodge.hi',hiscore); drawChrome(); } setTimeout(()=>{ if(state==='over') sfx.over(); },400); }
}
function update(){
  t++;
  for(const s of stars){ s.y+=(state==='pause'?0:[.15,.35,.8][s.l]*(state==='play'?1+level*.08:1)); if(s.y>128){ s.y=-1; s.x=Math.random()*128; } }
  parts=parts.filter(p=>{ p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;return --p.l>0; });
  float=float.filter(f=>{ f.y-=.35; return --f.t>0; });
  if(shake>0) shake*=.86; if(shake<.4) shake=0;
  if(flash>0) flash--;

  if(state==='title'){ // attract mode: the ship dodges by itself
    if(t%26===0) spawnAttract();
    for(const h of hz) h.y+=h.sp;
    hz=hz.filter(h=>h.y<136);
    if(--demo.cool<=0){
      const danger=c=>hz.some(h=>h.col<=c&&c<h.col+h.w&&h.y>40&&h.y<104);
      if(danger(P.col)){ const opts=[P.col-1,P.col+1].filter(c=>c>=0&&c<16&&!danger(c)); if(opts.length) P.col=opts[ri(0,opts.length-1)]; }
      else if(Math.random()<.15) P.col=Math.max(1,Math.min(14,P.col+(Math.random()<.5?-1:1)));
      demo.cool=9;
    }
  }
  if(state==='play'){
    frame++;
    // held-key repeat, still cell-by-cell
    for(const k of ['left','right','up','down']) if(held[k]){ rep[k]++; if(rep[k]>11&&rep[k]%5===0) step(k); }
    if(frame%6===0){ score++; }
    const nl=1+Math.floor(score/240);
    if(nl>level){ level=nl; banner=90; sfx.level(); burst(64,60,24,[11,12,10,7],2); }
    if(banner>0) banner--;
    if(--spawnT<=0){ spawn(); spawnT=Math.max(7,26-level*2.4)+ri(0,8); }
    if(level>=2 && --cometT<=0){ warns.push({col:ri(0,15),t:54}); cometT=Math.max(70,220-level*18)+ri(0,60); }
    warns=warns.filter(w=>{ if(w.t%12===0) sfx.warn(); if(--w.t<=0){ hz.push({k:'comet',col:w.col,y:-12,sp:3.6,w:1}); return false;} return true; });
    if(inv>0) inv--;
    const py=P.row*8;
    hz=hz.filter(h=>{
      h.y+=h.sp; if(h.k==='big') h.rot+=.05;
      const hh=h.w*8;
      if(P.col>=h.col&&P.col<h.col+h.w && h.y+hh-2>py+1 && h.y+2<py+7){
        if(h.k==='star'){ score+=50; comboStars++; sfx.star(); burst(P.col*8+4,py+4,12,[10,9,7]); float.push({x:P.col*8+4,y:py-4,t:36,s:'+50',c:10}); return false; }
        if(h.k==='shield'){ shield=1; sfx.shield(); burst(P.col*8+4,py+4,12,[12,7]); float.push({x:P.col*8+4,y:py-4,t:40,s:'SHIELD',c:12}); return false; }
        hurt(); if(h.k!=='comet'){ burst(h.col*8+hh/2,h.y+hh/2,10,[4,9,5]); return false; }
      }
      if(h.k==='comet' && t%2===0) parts.push({x:h.col*8+4+rnd(-1,1),y:h.y,vx:0,vy:-.2,l:14,c:[9,8,2][ri(0,2)]});
      return h.y<136;
    });
  }
  if(state==='over'){ if(dieT>0) dieT--; for(const h of hz) h.y+=h.sp*.3; }
  // visual lerp toward the grid cell (snappy, 3 frames)
  const tx=P.col*8, ty=P.row*8; P.vx+=(tx-P.vx)*.55; P.vy+=(ty-P.vy)*.55; if(Math.abs(tx-P.vx)<.3)P.vx=tx; if(Math.abs(ty-P.vy)<.3)P.vy=ty;
}
function spawnAttract(){ const r=Math.random(); if(r<.12) hz.push({k:'star',col:ri(0,15),y:-8,sp:.8,w:1}); else if(r<.25) hz.push({k:'big',col:ri(0,14),y:-16,sp:.7,w:2,rot:0}); else hz.push({k:'rock',col:ri(0,15),y:-8,sp:rnd(.9,1.6),w:1,v:ri(0,2),fl:Math.random()<.5}); }

/* ---------- draw ---------- */
function drawShip(x,y){
  if(state==='play'&&inv>0&&(inv>>2)%2) return;
  if(state==='over') return;
  g.drawImage(SHIP,Math.round(x),Math.round(y));
  const fl=(t>>1)%3; g.fillStyle=PAL[[10,9,8][fl]]; g.fillRect(Math.round(x)+3,Math.round(y)+7,2,1+(fl===0?1:0));
  g.fillStyle=PAL[8]; if(fl===2) g.fillRect(Math.round(x)+3,Math.round(y)+8,2,1);
  if(shield){ g.strokeStyle=PAL[(t>>2)%2?12:7]; g.lineWidth=1; g.strokeRect(Math.round(x)-1.5,Math.round(y)-1.5,11,11); }
}
function drawHz(h){
  const x=h.col*8, y=Math.round(h.y);
  if(h.k==='rock'){ g.save(); if(h.fl){ g.translate(x+8,y); g.scale(-1,1); g.drawImage(ROCKS[h.v],0,0);} else g.drawImage(ROCKS[h.v],x,y); g.restore(); }
  else if(h.k==='big'){ g.drawImage(BIG,x,y); }
  else if(h.k==='star'){ g.drawImage(STAR,x,y+((t>>3)%2)); if((t>>2)%4===0){ g.fillStyle=PAL[7]; g.fillRect(x+3,y+2,1,1);} }
  else if(h.k==='shield'){ g.drawImage(SHIELD,x,y); }
  else if(h.k==='comet'){ for(let i=0;i<14;i++){ g.fillStyle=PAL[i<3?9:i<8?8:2]; g.fillRect(x+3+(i>5?((i+t)%2):0),y-i*2,2,2);} g.fillStyle=PAL[7]; g.fillRect(x+2,y,4,4); g.fillStyle=PAL[10]; g.fillRect(x+3,y+3,2,2); }
}
function drawStars(){ for(const s of stars){ g.fillStyle=PAL[[1,13,7][s.l]]; g.fillRect(s.x|0,s.y|0,1,s.l===2&&state==='play'?2:1); } }
function drawGrid(){
  g.fillStyle=PAL[1];
  for(let r=ZONE_TOP;r<=ZONE_BOT+1;r++) for(let c=0;c<=16;c++) g.fillRect(c*8,r*8,1,1);
}
function hud(){
  g.fillStyle=PAL[0]; g.fillRect(0,0,128,7); g.fillStyle=PAL[1]; g.fillRect(0,7,128,1);
  pr(g,'SC',1,1,6); pr(g,pad(score,5),10,1,7);
  pr(g,'LV'+level,54,1,12);
  for(let i=0;i<3;i++) pr(g,'♥',98+i*10,1,i<lives?8:5);
  // bottom: progress to next level
  g.fillStyle=PAL[0]; g.fillRect(0,121,128,7);
  const p=(score%240)/240; g.fillStyle=PAL[1]; g.fillRect(24,123,80,3); g.fillStyle=PAL[11]; g.fillRect(24,123,Math.round(80*p),3);
  pr(g,'NXT',2,122,5); pr(g,shield?'SHLD':'----',109,122,shield?12:5);
}
function draw(){
  const sx=shake?Math.round(rnd(-shake,shake)):0, sy=shake?Math.round(rnd(-shake,shake)):0;
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle=PAL[flash?2:0]; g.fillRect(0,0,128,128);
  g.setTransform(1,0,0,1,sx,sy);
  drawStars();
  if(state==='title') drawTitle();
  else {
    drawGrid();
    for(const w of warns){ if((w.t>>2)%2){ g.fillStyle=PAL[2]; g.fillRect(w.col*8,8,8,112); } pr(g,'!',w.col*8+3,10,(w.t>>2)%2?10:8); }
    for(const h of hz) drawHz(h);
    drawShip(P.vx,P.vy);
    for(const p of parts){ g.fillStyle=PAL[p.l<6?5:p.c]; g.fillRect(p.x|0,p.y|0,1,1); }
    for(const f of float) prc(g,f.s,Math.round(f.y),(f.t>>2)%2?f.c:7,1,Math.max(tw(f.s)/2+1,Math.min(127-tw(f.s)/2,f.x)));
    g.setTransform(1,0,0,1,0,0);
    hud();
    if(state==='play'&&banner>0){
      const s='LEVEL '+level; const target=64-tw(s,2)/2; const x=banner>70?Math.round((target-(banner-70)*8)/8)*8:target;
      g.fillStyle=PAL[0]; g.fillRect(0,50,128,17); g.fillStyle=PAL[12]; g.fillRect(0,50,128,1); g.fillRect(0,66,128,1);
      prs(g,s,x,54,[7,7,12,12,1],1,2);
    }
    if(state==='pause'){ g.fillStyle=PAL[0]; g.fillRect(24,46,80,34); g.strokeStyle=PAL[7]; g.strokeRect(24.5,46.5,79,33);
      prc(g,'PAUSED',52,[10,10,9,9,8],2); prc(g,'◎ OR ⊠ RESUME',69,6); }
    if(state==='over') drawOver();
  }
  g.setTransform(1,0,0,1,0,0);
  // CRT-ish: faint scan every other line
}
function drawTitle(){
  for(const h of hz) drawHz(h);
  drawShip(P.vx,P.vy+Math.round(Math.sin(t/10)));
  for(const p of parts){ g.fillStyle=PAL[p.c]; g.fillRect(p.x|0,p.y|0,1,1); }
  pr(g,'NOVA-BIT SOFT PRESENTS',64-tw('NOVA-BIT SOFT PRESENTS')/2,10,13);
  // big logo, stripey per row, hard shadow
  const bob=Math.round(Math.sin(t/18)*1.5);
  const y1=22+bob;
  g.fillStyle=PAL[0];
  prc(g,'STAR',y1+2,2,4); prc(g,'STAR',y1+1,2,4);
  prc(g,'STAR',y1,[7,10,10,9,8],4);
  prc(g,'DODGE',y1+24+2,2,4); prc(g,'DODGE',y1+24+1,2,4);
  prc(g,'DODGE',y1+24,[7,10,10,9,8],4);
  prc(g,'★ A PICO-SIZED PANIC ★',y1+48,12);
  if((t>>4)%2===0) prc(g,'PRESS ⊠ TO LAUNCH',100,7);
  prc(g,'HI '+pad(hiscore,5),111,6);
  pr(g,'V1.1',2,121,5); pr(g,'(C)2026',128-tw('(C)2026')-2,121,5);
}
function drawOver(){
  g.fillStyle=PAL[0]; g.fillRect(14,34,100,62); g.fillStyle=PAL[8]; g.fillRect(14,34,100,2); g.fillRect(14,94,100,2);
  prc(g,'GAME OVER',40,[7,8,8,2,2],2);
  prc(g,'SCORE '+pad(score,5),58,7);
  prc(g,'HI    '+pad(hiscore,5),66,6);
  if(newHi && (t>>3)%2) prc(g,'NEW HI-SCORE!',75,[10,10,9,9,8]);
  else if(!newHi) prc(g,['SPACE IS BIG. YOU WERE NOT.','ROCKS 1, YOU 0.','THE BELT SAYS HI.'][(score>>4)%3],75,13);
  if(dieT<=0 && (t>>4)%2===0) prc(g,'⊠ RETRY  ◎ TITLE',85,7);
}

/* ---------- chrome (HTML side, also pixel type) ---------- */
function drawChrome(){
  mount('brandTxt',textCanvas([{t:'STAR DODGE',c:7,sh:2,s:1}],3));
  mount('modelTxt',textCanvas([{t:'PX-128 · CART #011',c:13}],2));
  mount('pwrTxt',textCanvas([{t:muted?'♪ SOUND OFF':'♪ SOUND ON',c:muted?6:11}],2));
  const led=document.getElementById('led'); if(led) led.classList.toggle('on',!muted&&!!AC);
  const mb=document.getElementById('muteBtn'); if(mb) mb.setAttribute('aria-pressed',String(!muted));
  document.querySelectorAll('[data-k]').forEach(b=>{
    const map={up:'↑',down:'↓',left:'←',right:'→'}; const k=b.dataset.k;
    if(map[k]&&!b.firstChild) b.appendChild(textCanvas([{t:map[k],c:1}],3));
    if(k==='x'&&!b.firstChild) b.appendChild(textCanvas([{t:'X',c:7}],4));
    if(k==='o'&&!b.firstChild) b.appendChild(textCanvas([{t:'O',c:7}],4));
  });
  const table=[['ZIG',4210],['ELF',3080],['KAT',1990],['BOB',1250],['LOU',640]];
  if(hiscore>0) table.push(['YOU',hiscore]); table.sort((a,b)=>b[1]-a[1]);
  const rows=[{t:'HIGH SCORES',c:10,sh:0,s:2},{gap:6}];
  table.slice(0,6).forEach((r,i)=>rows.push({t:(i+1)+'. '+r[0]+'  '+pad(r[1],5),c:r[0]==='YOU'?11:(i===0?10:7),gap:9}));
  rows.push({gap:4},{t:'BEAT ZIG. NOBODY HAS.',c:14});
  mount('hiPanel',textCanvas(rows,2));
  mount('cartPanel',textCanvas([
    {t:'CART INFO',c:12,s:2},{gap:4},
    {t:'SIZE   128 X 128 PX',c:6,gap:9},
    {t:'COLOURS    16, NO MORE',c:6,gap:9},
    {t:'CPU        MOSTLY PANIC',c:6,gap:9},
    {t:'SAVES      HI-SCORE ONLY',c:6,gap:9},
  ],2));
  mount('manPanel',textCanvas([
    {t:'HOW TO FLY',c:10,sh:2,s:2},{gap:6},
    {t:'THE ASTEROID BELT IS',c:7,gap:8},
    {t:'COMING APART. YOUR SHIP',c:7,gap:8},
    {t:'IS SMALL. STAY SMALL.',c:7,gap:12},
    {t:'← → ↑ ↓   STEP ONE CELL',c:12,gap:9},
    {t:'⊠ X       LAUNCH / RETRY',c:8,gap:9},
    {t:'◎ Z       PAUSE',c:12,gap:9},
    {t:'M         MUTE THE TUNE',c:6,gap:12},
    {t:'★  +50 PTS, GRAB THEM',c:10,gap:9},
    {t:'SHIELD EATS ONE HIT',c:12,gap:9},
    {t:'!  COMET LANE: MOVE NOW',c:8,gap:12},
    {t:'TIP: TAP THE SCREEN TO',c:13,gap:8},
    {t:'STEP TOWARD YOUR FINGER.',c:13},
  ],2));
}
drawChrome();

/* ---------- sizing ---------- */
function fit(){
  const vw=document.documentElement.clientWidth, vh=innerHeight;
  const wide=vw>=1100;
  const availW=Math.min(vw-84,560);
  const availH=wide?vh-270:9999;
  let s=Math.min(availW,availH)/128;
  if(s>=3) s=Math.floor(s);
  s=Math.max(1.6,s);
  const px=Math.floor(128*s);
  cv.style.width=px+'px'; cv.style.height=px+'px';
}
fit(); addEventListener('resize',fit);

/* ---------- loop (fixed 60 Hz step) ---------- */
let last=performance.now(), acc=0; let chromeAudio=false;
function loop(now){
  acc+=Math.min(100,now-last); last=now;
  while(acc>=16.667){ update(); acc-=16.667; }
  draw();
  if(!chromeAudio&&AC){ chromeAudio=true; drawChrome(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
