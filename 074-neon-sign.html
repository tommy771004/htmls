<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>霓虹招牌產生器 · Neon Sign Workshop</title>
<meta name="description" content="中英霓虹招牌產生器：逐管閃爍點亮、故障燈管、電工盒面板。收錄於 100 Creative HTML Works（074・霓虹招牌）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/074-neon-sign.html">
<style>
  :root{
    --c:#ff3fa4;        /* main gas colour */
    --c2:#3ec9ff;       /* accent gas colour */
    --script:"Segoe Script","Brush Script MT","Snell Roundhand","Microsoft JhengHei","PingFang TC",cursive;
    --sans:"Microsoft JhengHei UI Light","Microsoft JhengHei Light","Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
    --narrow:"Bahnschrift SemiCondensed","Bahnschrift","Arial Narrow","Microsoft JhengHei","PingFang TC",sans-serif;
    --stencil:"Bahnschrift Condensed","Bahnschrift","Arial Narrow","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;background:#24130f;color:#e9e4dc;font-family:var(--sans);
    background-attachment:fixed;
  }
  .wall{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:clamp(16px,3vw,40px) 16px 28px;isolation:isolate}
  .wall::before{ /* soot + vignette */
    content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(90% 70% at 50% 35%, transparent 30%, rgba(8,4,3,.72) 100%),
      linear-gradient(180deg, rgba(0,0,0,.45), transparent 30%, transparent 70%, rgba(0,0,0,.6));
  }
  .glow{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(42% 34% at 50% 34%, var(--c), transparent 70%),
      radial-gradient(30% 20% at 50% 48%, var(--c2), transparent 70%);
    mix-blend-mode:screen;opacity:0;transition:opacity .08s linear;
  }
  body.lit .glow{opacity:.46}
  body.lit.dim .glow{opacity:.2}

  /* ---------- plate ---------- */
  .tag{
    align-self:flex-start;font-family:var(--stencil);letter-spacing:.24em;font-size:12px;text-transform:uppercase;color:#b9ada0;
    background:linear-gradient(#3b3a38,#2a2927);border:1px solid #111;border-radius:2px;padding:.45em .9em;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 3px 6px rgba(0,0,0,.5);position:relative;max-width:100%
  }
  .tag b{color:#e9e4dc;font-weight:600;letter-spacing:.1em}
  .stage{width:100%;max-width:1100px;flex:1;display:flex;align-items:center;justify-content:center;min-height:min(50vh,500px);position:relative;padding:24px 0 10px}
  .plate{
    position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
    max-width:100%;padding:clamp(22px,3.4vw,46px) clamp(22px,4.4vw,64px) clamp(26px,3.4vw,44px);
    border-radius:18px;
    background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.015) 40%,rgba(255,255,255,.04));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.12), inset 0 1px 0 rgba(255,255,255,.25), 0 30px 50px rgba(0,0,0,.35);
    backdrop-filter:blur(1px);
  }
  .screw{position:absolute;width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#f2f2f2,#9a9a9a 45%,#4d4d4d 75%);box-shadow:0 2px 3px rgba(0,0,0,.6)}
  .screw::after{content:"";position:absolute;left:3px;right:3px;top:6px;height:2px;background:rgba(0,0,0,.35);transform:rotate(35deg)}
  .s1{left:12px;top:12px}.s2{right:12px;top:12px}.s3{left:12px;bottom:12px}.s4{right:12px;bottom:12px}
  .cord{position:absolute;left:50%;top:100%;width:3px;height:40vh;background:linear-gradient(90deg,#0c0c0c,#3a3a3a,#0c0c0c);transform:translateX(-50%);z-index:-1}
  .frameSvg[hidden]{display:none}
  .frameSvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}

  .line1,.line2{display:block;white-space:nowrap;line-height:1.15;text-align:center}
  .line1{font-size:var(--fs1,110px)}
  .line2{font-size:var(--fs2,34px);margin-top:.35em}
  .f-script .line1{font-family:var(--script);font-weight:400}
  .f-script .line2{font-family:var(--narrow);letter-spacing:.32em;text-transform:uppercase;padding-left:.32em}
  .f-sans .line1{font-family:var(--sans);font-weight:300;letter-spacing:.08em}
  .f-sans .line2{font-family:var(--script);letter-spacing:.02em}
  .f-narrow .line1{font-family:var(--narrow);font-weight:400;letter-spacing:.04em;text-transform:uppercase}
  .f-narrow .line2{font-family:var(--script)}

  /* each glyph is its own tube */
  .g{display:inline-block;transition:color .05s linear,text-shadow .05s linear;
     color:color-mix(in srgb, var(--tc) 22%, #2a2020);
     text-shadow:0 0 1px rgba(255,255,255,.18), 0 1px 0 rgba(0,0,0,.6);}
  .g.on{
    color:color-mix(in srgb, var(--tc) 35%, #fff);
    text-shadow:
      0 0 .02em #fff,
      0 0 .06em var(--tc),
      0 0 .12em var(--tc),
      0 0 .28em var(--tc),
      0 0 .5em var(--tc),
      0 0 .9em color-mix(in srgb, var(--tc) 60%, transparent);
  }
  .line1 .g{--tc:var(--c)}
  .line2 .g{--tc:var(--c2)}
  .g.sp{width:.3em}
  .deco{display:inline-block;vertical-align:middle;width:.62em;height:.62em;margin:0 .12em;overflow:visible;--tc:var(--c2)}
  .deco path{fill:none;stroke:color-mix(in srgb, var(--tc) 25%, #2a2020);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .deco.on path{stroke:color-mix(in srgb, var(--tc) 35%, #fff)}
  .deco.on{filter:drop-shadow(0 0 2px var(--tc)) drop-shadow(0 0 8px var(--tc)) drop-shadow(0 0 22px var(--tc))}
  .frameSvg rect{fill:none;stroke:color-mix(in srgb, var(--c2) 25%, #2a2020);stroke-width:4}
  .frameSvg.on rect{stroke:color-mix(in srgb, var(--c2) 35%, #fff)}
  .frameSvg.on{filter:drop-shadow(0 0 2px var(--c2)) drop-shadow(0 0 9px var(--c2)) drop-shadow(0 0 24px var(--c2))}

  /* ---------- control panel: electrician's steel box ---------- */
  .panel{
    width:100%;max-width:1100px;position:relative;
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),
      linear-gradient(180deg,#34363a,#25272a);
    border:1px solid #0b0b0c;border-radius:6px;padding:22px clamp(16px,2.4vw,30px) 18px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 20px 40px rgba(0,0,0,.55);
    display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);gap:16px 26px;align-items:start;
  }
  .panel::before,.panel::after{content:"";position:absolute;top:8px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bbb,#555 60%,#222)}
  .panel::before{left:8px}.panel::after{right:8px}
  .lab{font-family:var(--stencil);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#9d978f;margin:0 0 8px;display:flex;gap:.6em;align-items:baseline}
  .lab i{font-style:normal;font-family:var(--sans);letter-spacing:.1em;color:#d6cfc5}
  .field{display:flex;flex-direction:column;gap:8px}
  .field input[type=text]{
    width:100%;min-height:44px;font-size:17px;font-family:var(--sans);color:#f2ede6;background:#141517;border:1px solid #000;border-radius:3px;
    padding:0 12px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.07);
  }
  .field input[type=text]:focus{outline:1px solid var(--c);outline-offset:1px}
  /* rocker power switch */
  .power{display:flex;flex-direction:column;align-items:center;gap:8px}
  .rocker{width:64px;height:96px;border-radius:8px;border:0;padding:6px;cursor:pointer;background:#111;box-shadow:inset 0 2px 5px #000,0 1px 0 rgba(255,255,255,.1);position:relative}
  .rocker span{position:absolute;left:6px;right:6px;height:42px;border-radius:5px;display:grid;place-items:center;font-family:var(--stencil);font-size:13px;letter-spacing:.14em;transition:all .12s}
  .rocker .i{top:6px;background:linear-gradient(#c62c2c,#8d1717);color:#ffd9d9;box-shadow:0 4px 0 #5a0c0c}
  .rocker .o{bottom:6px;background:linear-gradient(#3b3b3b,#262626);color:#8a8a8a;box-shadow:0 -1px 0 #555 inset}
  .rocker[aria-pressed="false"] .i{background:linear-gradient(#6b2020,#4d1313);color:#b88;box-shadow:0 1px 0 #3a0a0a}
  .rocker[aria-pressed="false"] .o{background:linear-gradient(#4a4a4a,#333);box-shadow:0 -4px 0 #1a1a1a inset}
  .rocker:focus-visible{outline:2px solid var(--c);outline-offset:3px}
  .pilot{width:10px;height:10px;border-radius:50%;background:#3a1212;box-shadow:inset 0 1px 2px #000}
  body.lit .pilot{background:#ff4a3a;box-shadow:0 0 8px #ff4a3a}
  .power small{font-family:var(--stencil);font-size:10px;letter-spacing:.2em;color:#9d978f}

  .gases{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .gas{min-height:52px;border:1px solid #000;border-radius:4px;background:#17181a;cursor:pointer;padding:5px 0 4px;color:#cfc8bf;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--stencil);font-size:12px;letter-spacing:.05em;line-height:1.1;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
  .gas small{font-family:var(--sans);font-size:11px;color:#9d978f}
  .gas i{display:block;width:70%;height:6px;border-radius:3px;background:var(--gc);box-shadow:0 0 6px var(--gc),0 0 1px #fff inset}
  .gas[aria-pressed="true"]{border-color:var(--gc);box-shadow:0 0 0 1px var(--gc),0 0 14px color-mix(in srgb,var(--gc) 50%,transparent)}
  .gas:focus-visible{outline:1px dashed #fff}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{min-height:44px;padding:0 12px;border:1px solid #000;border-radius:4px;background:linear-gradient(#3a3c40,#2a2c2f);color:#d9d2c8;
    font-family:var(--sans);font-size:14px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 2px 0 #111}
  .seg button[aria-pressed="true"]{background:linear-gradient(#1c1d1f,#141516);color:#fff;box-shadow:inset 0 2px 4px #000;border-color:var(--c)}
  .seg button:focus-visible{outline:1px dashed #fff}
  .presets{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px dashed rgba(255,255,255,.12);padding-top:14px}
  .presets .lab{margin:0 6px 0 0}
  .chipbtn{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);color:#e9e4dc;font-family:var(--sans);font-size:14px;cursor:pointer}
  .chipbtn:hover,.chipbtn:focus-visible{border-color:var(--c);color:#fff;outline:none;box-shadow:0 0 10px color-mix(in srgb,var(--c) 40%,transparent)}
  .transformer{position:absolute;right:18px;top:-54px;width:118px;height:50px;border-radius:3px 3px 0 0;
    background:linear-gradient(#5a5c60,#3b3d40);border:1px solid #111;box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
    font-family:var(--stencil);font-size:9px;letter-spacing:.14em;color:#1b1b1b;padding:7px 9px;line-height:1.35}
  .transformer b{display:block;font-size:11px;color:#101010}
  .transformer::after{content:"";position:absolute;right:10px;top:8px;width:8px;height:8px;border-radius:50%;background:#2b1111}
  body.lit .transformer::after{background:#ffae3a;box-shadow:0 0 6px #ffae3a}

  @media (max-width:980px){
    .panel{grid-template-columns:auto minmax(0,1fr)}
    .panel .wide{grid-column:1/-1}
  }
  @media (max-width:560px){
    .gases{grid-template-columns:repeat(4,1fr)}
    .transformer{display:none}
    .stage{min-height:46vh}
    .plate{border-radius:12px}
  }
  @media (prefers-reduced-motion:reduce){ .g,.deco{transition:none} }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main class="wall">
  <div class="tag">霓虹招牌產生器 · <b>Neon Sign Workshop</b> · 老街 3 巷 7 號</div>

  <section class="stage" aria-label="Neon sign preview">
    <div class="plate f-script" id="plate">
      <span class="screw s1"></span><span class="screw s2"></span><span class="screw s3"></span><span class="screw s4"></span>
      <svg class="frameSvg" id="frame" aria-hidden="true" hidden><rect x="10" y="10" rx="14" ry="14" width="100" height="100"/></svg>
      <div class="line1" id="line1"></div>
      <div class="line2" id="line2"></div>
      <div class="cord" aria-hidden="true"></div>
    </div>
  </section>

  <section class="panel" aria-label="Control panel">
    <div class="transformer" aria-hidden="true"><b>變壓器 NST</b>12 kV · 30 mA<br>勿觸摸 KEEP OFF</div>
    <div class="power">
      <p class="lab" style="margin:0">電源 <i>Power</i></p>
      <button class="rocker" id="power" aria-pressed="true" aria-label="電源開關 Power (P)"><span class="i">ON</span><span class="o">OFF</span></button>
      <span class="pilot" aria-hidden="true"></span>
      <small>P 鍵</small>
    </div>
    <div class="field">
      <p class="lab">第一行 <i>Main tube</i></p>
      <input type="text" id="t1" maxlength="16" value="深夜食堂" aria-label="第一行文字">
      <p class="lab" style="margin-top:6px">第二行 <i>Small print</i></p>
      <input type="text" id="t2" maxlength="24" value="open till 3 am" aria-label="第二行文字">
    </div>
    <div class="field wide">
      <p class="lab">主燈管氣體 <i>Main gas</i></p>
      <div class="gases" id="gas1"></div>
      <p class="lab" style="margin-top:6px">副燈管 <i>Accent gas</i></p>
      <div class="gases" id="gas2"></div>
    </div>
    <div class="field wide">
      <p class="lab">字型 <i>Bend style</i></p>
      <div class="seg" id="fonts">
        <button type="button" data-f="script" aria-pressed="true">手寫 Script</button>
        <button type="button" data-f="sans" aria-pressed="false">黑體 Sans</button>
        <button type="button" data-f="narrow" aria-pressed="false">窄體 Narrow</button>
      </div>
      <p class="lab" style="margin-top:6px">裝飾 <i>Ornament</i></p>
      <div class="seg" id="decos">
        <button type="button" data-d="none" aria-pressed="false">無</button>
        <button type="button" data-d="heart" aria-pressed="false">愛心</button>
        <button type="button" data-d="star" aria-pressed="true">星星</button>
        <button type="button" data-d="frame" aria-pressed="false">邊框</button>
      </div>
      <div class="seg" style="margin-top:8px">
        <button type="button" id="broken" aria-pressed="true">故障一根 Bad tube</button>
        <button type="button" id="buzz" aria-pressed="false">嗡嗡聲 Buzz</button>
      </div>
    </div>
    <div class="presets">
      <p class="lab">現成招牌 <i>Presets</i></p>
    </div>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const plate = $('plate'), l1 = $('line1'), l2 = $('line2'), frame = $('frame');
  if (!plate || !l1 || !l2) return;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const root = document.documentElement;

  /* ---------------- brick wall (generated once, used as a tile) ---------------- */
  (function bricks() {
    const bw = 66, bh = 22, m = 4, cols = 8, rows = 16;
    const c = document.createElement('canvas'); c.width = cols * bw; c.height = rows * bh;
    const x = c.getContext('2d');
    x.fillStyle = '#2d2622'; x.fillRect(0, 0, c.width, c.height);
    const shades = [[104, 48, 36], [92, 42, 32], [116, 56, 40], [80, 38, 30], [98, 52, 42], [70, 34, 28]];
    for (let r = 0; r < rows; r++) {
      const off = (r % 2) * bw / 2;
      for (let k = -1; k < cols + 1; k++) {
        const bx = k * bw + off + m / 2, by = r * bh + m / 2, w = bw - m, h = bh - m;
        const s = shades[(Math.random() * shades.length) | 0], v = Math.random() * 18 - 9;
        x.fillStyle = `rgb(${s[0] + v},${s[1] + v * .6},${s[2] + v * .5})`;
        x.fillRect(bx, by, w, h);
        // speckle & wear
        for (let i = 0; i < 26; i++) {
          x.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.18)' : 'rgba(255,220,190,.07)';
          x.fillRect(bx + Math.random() * w, by + Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 1.5);
        }
        const g = x.createLinearGradient(0, by, 0, by + h);
        g.addColorStop(0, 'rgba(255,230,210,.08)'); g.addColorStop(1, 'rgba(0,0,0,.22)');
        x.fillStyle = g; x.fillRect(bx, by, w, h);
        if (Math.random() < .12) { x.fillStyle = 'rgba(40,36,32,.9)'; x.beginPath(); x.arc(bx + Math.random() * w, by + (Math.random() < .5 ? 0 : h), 2 + Math.random() * 3, 0, 7); x.fill(); }
      }
    }
    try { document.body.style.backgroundImage = `url(${c.toDataURL('image/png')})`; document.body.style.backgroundSize = `${c.width}px ${c.height}px`; } catch (_) {}
  })();

  /* ---------------- gases ---------------- */
  const GASES = [
    { k: 'Ne', n: '氖紅', c: '#ff4a2e' }, { k: 'Pk', n: '桃紅', c: '#ff3fa4' }, { k: 'Ar', n: '氬藍', c: '#3ec9ff' },
    { k: 'U', n: '鈾綠', c: '#7dff5a' }, { k: 'Na', n: '鈉黃', c: '#ffcf3a' }, { k: 'UV', n: '紫外', c: '#b25cff' }, { k: 'Xe', n: '氙白', c: '#f3f0ff' }
  ];
  let g1 = 1, g2 = 2;
  function gasRow(el, getter, setter) {
    if (!el) return [];
    return GASES.map((g, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'gas'; b.style.setProperty('--gc', g.c);
      b.innerHTML = `<i></i>${g.k}<small>${g.n}</small>`; b.setAttribute('aria-label', g.n + ' ' + g.k);
      b.setAttribute('aria-pressed', i === getter() ? 'true' : 'false');
      b.addEventListener('click', () => { setter(i); paintGas(); });
      el.appendChild(b); return b;
    });
  }
  const r1 = gasRow($('gas1'), () => g1, i => { g1 = i; });
  const r2 = gasRow($('gas2'), () => g2, i => { g2 = i; });
  function paintGas() {
    root.style.setProperty('--c', GASES[g1].c); root.style.setProperty('--c2', GASES[g2].c);
    r1.forEach((b, i) => b.setAttribute('aria-pressed', i === g1 ? 'true' : 'false'));
    r2.forEach((b, i) => b.setAttribute('aria-pressed', i === g2 ? 'true' : 'false'));
  }

  /* ---------------- build sign ---------------- */
  let font = 'script', deco = 'star', lit = true, brokenOn = true;
  const HEART = '<svg class="deco" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 86 C 18 62, 6 44, 14 28 C 22 12, 44 14, 50 32 C 56 14, 78 12, 86 28 C 94 44, 82 62, 50 86 Z"/></svg>';
  const STAR = '<svg class="deco" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8 L61 38 L93 39 L68 58 L77 90 L50 71 L23 90 L32 58 L7 39 L39 38 Z"/></svg>';
  function glyphs(text) {
    return Array.from(text).map(ch => ch === ' ' ? '<span class="g sp"> </span>' : `<span class="g">${ch.replace(/[&<>"]/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[s]))}</span>`).join('');
  }
  function build() {
    const t1 = ($('t1') && $('t1').value.trim()) || '霓虹';
    const t2 = ($('t2') && $('t2').value.trim()) || '';
    plate.className = 'plate f-' + font;
    let h1 = glyphs(t1);
    if (deco === 'heart') h1 = h1 + HEART;
    if (deco === 'star') h1 = STAR + h1 + STAR;
    l1.innerHTML = h1;
    l2.innerHTML = glyphs(t2);
    l2.hidden = !t2;
    if (frame) { if (deco === 'frame') frame.removeAttribute('hidden'); else frame.setAttribute('hidden', ''); }
    fit();
    tubes = Array.from(plate.querySelectorAll('.g:not(.sp), .deco')).concat(deco === 'frame' && frame ? [frame] : []);
    pickBroken();
    if (lit) tubes.forEach(t => t.classList.add('on'));
  }
  function fit() {
    const stage = plate.parentElement;
    const maxW = Math.min(stage.clientWidth, 1100) - (innerWidth < 560 ? 44 : 120);
    let fs1 = Math.min(innerWidth < 560 ? 76 : 124, innerHeight * .15);
    root.style.setProperty('--fs1', fs1 + 'px');
    root.style.setProperty('--fs2', Math.max(15, fs1 * .3) + 'px');
    for (let i = 0; i < 14; i++) {
      const w = Math.max(l1.scrollWidth, l2.scrollWidth);
      if (w <= maxW) break;
      fs1 *= Math.max(.6, maxW / w * .98);
      root.style.setProperty('--fs1', fs1 + 'px');
      root.style.setProperty('--fs2', Math.max(13, fs1 * .3) + 'px');
    }
    if (frame && !frame.hasAttribute('hidden')) {
      const r = plate.getBoundingClientRect(), rect = frame.querySelector('rect');
      frame.setAttribute('viewBox', `0 0 ${r.width} ${r.height}`);
      if (rect) { rect.setAttribute('x', 30); rect.setAttribute('y', 30); rect.setAttribute('width', Math.max(10, r.width - 60)); rect.setAttribute('height', Math.max(10, r.height - 60)); }
    }
  }

  /* ---------------- power & flicker ---------------- */
  let tubes = [], timers = [], broken = null, brokenTimer = 0;
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  function setLit(v, instant) {
    lit = v;
    const pw = $('power'); if (pw) pw.setAttribute('aria-pressed', v ? 'true' : 'false');
    clearTimers();
    if (!v) { tubes.forEach(t => t.classList.remove('on')); document.body.classList.remove('lit'); hum(false); return; }
    document.body.classList.add('lit');
    hum(true);
    if (instant || reduce) { tubes.forEach(t => t.classList.add('on')); return; }
    // each tube strikes on its own: a few stutters, then holds
    tubes.forEach((t, i) => {
      let at = 40 + Math.random() * 380 + i * 35;
      const n = 1 + ((Math.random() * 4) | 0);
      for (let k = 0; k < n; k++) {
        timers.push(setTimeout(() => { t.classList.add('on'); crackle(.4); }, at)); at += 30 + Math.random() * 90;
        timers.push(setTimeout(() => t.classList.remove('on'), at)); at += 40 + Math.random() * 160;
      }
      timers.push(setTimeout(() => { t.classList.add('on'); crackle(.25); }, at));
    });
    // whole sign dips once as the transformer settles
    timers.push(setTimeout(() => document.body.classList.add('dim'), 900));
    timers.push(setTimeout(() => document.body.classList.remove('dim'), 980));
  }
  function pickBroken() {
    const cand = tubes.filter(t => t.classList.contains('g'));
    broken = brokenOn && cand.length > 2 ? cand[(1 + Math.random() * (cand.length - 2)) | 0] : null;
  }
  function brokenLoop() {
    clearTimeout(brokenTimer);
    const next = 900 + Math.random() * 3200;
    brokenTimer = setTimeout(() => {
      if (lit && broken && brokenOn && !reduce && broken.isConnected) {
        const seq = [0, 60, 110, 190, 240, 420].slice(0, 2 + ((Math.random() * 4) | 0) * 1);
        seq.forEach((ms, i) => setTimeout(() => { if (!lit || !broken) return; broken.classList.toggle('on', i % 2 === 1 || i === seq.length - 1); if (i % 2 === 0) crackle(.6); }, ms));
        setTimeout(() => { if (lit && broken) broken.classList.add('on'); }, 520);
      }
      brokenLoop();
    }, next);
  }

  /* ---------------- sound (WebAudio, only after a click) ---------------- */
  let ac = null, humNodes = null, buzzOn = false;
  function ensureAC() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { ac = null; } }
    if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
    return ac;
  }
  function hum(on) {
    if (!buzzOn || !ac) { if (humNodes && !on) stopHum(); return; }
    if (on && !humNodes) {
      const o = ac.createOscillator(), o2 = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'sawtooth'; o.frequency.value = 120; o2.type = 'square'; o2.frequency.value = 240.7;
      lp.type = 'lowpass'; lp.frequency.value = 520; g.gain.value = 0;
      o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(ac.destination);
      o.start(); o2.start();
      g.gain.setTargetAtTime(.022, ac.currentTime, .15);
      humNodes = { o, o2, g };
    } else if (!on) stopHum();
  }
  function stopHum() {
    if (!humNodes || !ac) return;
    const h = humNodes; humNodes = null;
    h.g.gain.setTargetAtTime(0, ac.currentTime, .05);
    setTimeout(() => { try { h.o.stop(); h.o2.stop(); } catch (_) {} }, 300);
  }
  function crackle(vol) {
    if (!buzzOn || !ac || ac.state !== 'running') return;
    const len = .04, buf = ac.createBuffer(1, Math.floor(ac.sampleRate * len), ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
    const s = ac.createBufferSource(), g = ac.createGain(), hp = ac.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 1800; g.gain.value = .05 * vol;
    s.buffer = buf; s.connect(hp); hp.connect(g); g.connect(ac.destination); s.start();
  }

  /* ---------------- controls ---------------- */
  const pw = $('power');
  if (pw) pw.addEventListener('click', () => { ensureAC(); setLit(!lit); });
  let typeT = 0;
  ['t1', 't2'].forEach(id => { const el = $(id); if (el) el.addEventListener('input', () => { clearTimeout(typeT); typeT = setTimeout(() => { build(); if (lit) flashNew(); }, 160); }); });
  function flashNew() { // retype: the sign re-strikes quickly
    tubes.forEach(t => t.classList.remove('on'));
    setLit(true);
  }
  function segGroup(id, attr, fn) {
    const el = $(id); if (!el) return;
    const btns = Array.from(el.querySelectorAll('button'));
    btns.forEach(b => b.addEventListener('click', () => {
      btns.forEach(o => o.setAttribute('aria-pressed', o === b ? 'true' : 'false'));
      fn(b.dataset[attr]);
    }));
  }
  segGroup('fonts', 'f', v => { font = v; build(); });
  segGroup('decos', 'd', v => { deco = v; build(); if (lit) setLit(true); });
  const br = $('broken');
  if (br) br.addEventListener('click', () => { brokenOn = !brokenOn; br.setAttribute('aria-pressed', brokenOn ? 'true' : 'false'); pickBroken(); if (lit) tubes.forEach(t => t.classList.add('on')); });
  const bz = $('buzz');
  if (bz) bz.addEventListener('click', () => {
    buzzOn = !buzzOn; bz.setAttribute('aria-pressed', buzzOn ? 'true' : 'false');
    if (buzzOn) { ensureAC(); hum(lit); } else stopHum();
  });

  const PRESETS = [
    ['深夜食堂', 'open till 3 am', 1, 2, 'script', 'star'],
    ['營業中', 'OPEN · 歡迎光臨', 0, 3, 'sans', 'frame'],
    ['Good Vibes', '只收現金 cash only', 4, 1, 'script', 'heart'],
    ['拉麵', 'last order 01:30', 0, 6, 'sans', 'none'],
    ['你今天很棒', 'you did great today', 2, 1, 'sans', 'heart'],
    ['NO VACANCY', '本日客滿 · 明天請早', 5, 4, 'narrow', 'frame'],
    ['Stay Weird', '台北 · since 1987', 3, 5, 'script', 'star']
  ];
  const pr = document.querySelector('.presets');
  if (pr) PRESETS.forEach(p => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chipbtn'; b.textContent = p[0];
    b.addEventListener('click', () => {
      if ($('t1')) $('t1').value = p[0];
      if ($('t2')) $('t2').value = p[1];
      g1 = p[2]; g2 = p[3]; font = p[4]; deco = p[5]; paintGas();
      document.querySelectorAll('#fonts button').forEach(o => o.setAttribute('aria-pressed', o.dataset.f === font ? 'true' : 'false'));
      document.querySelectorAll('#decos button').forEach(o => o.setAttribute('aria-pressed', o.dataset.d === deco ? 'true' : 'false'));
      build(); tubes.forEach(t => t.classList.remove('on')); setLit(true);
    });
    pr.appendChild(b);
  });

  document.addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key === 'p' || e.key === 'P') { ensureAC(); setLit(!lit); }
  });
  let rt = 0;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(fit, 120); });

  paintGas();
  build();
  tubes.forEach(t => t.classList.remove('on'));
  const start = () => setLit(true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fit(); start(); }).catch(start); else start();
  brokenLoop();
})();
</script>
</body>
</html>
