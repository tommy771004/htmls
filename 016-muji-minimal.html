<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>余白舍｜生活道具目錄 2026 秋冬</title>
<meta name="description" content="生活道具目錄：12 件純 CSS 器物（掛鐘走真實時間），極慢淡入。收錄於 100 Creative HTML Works（016・日系無印極簡）。">
<link rel="canonical" href="https://htmls-ruddy.vercel.app/016-muji-minimal.html">
<style>
:root{
  --paper:#f6f3ee; --plate:#ece8e1; --plate2:#e6e1d8; --linen:#d9cfbe; --line:#d6d0c6; --line2:#c7c0b4; --ink:#3b3733; --ink2:#7a746b; --ink3:#a39c91; --shu:#a4473a;
  --font:"Yu Gothic Light","YuGothic","Yu Gothic","Microsoft JhengHei Light","Hiragino Sans","PingFang TC","Noto Sans TC","Noto Sans JP",sans-serif;
  --slow:cubic-bezier(.25,.1,.25,1);
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:var(--font);font-weight:300;font-size:15px;line-height:1.9;letter-spacing:.06em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;letter-spacing:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}

/* header */
header{border-bottom:1px solid var(--line)}
.hd{display:flex;justify-content:space-between;align-items:center;height:76px}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}
.logo i{width:30px;height:30px;background:var(--shu);display:grid;place-items:center;color:#f6f3ee;font-style:normal;font-size:13px;letter-spacing:0;line-height:1}
.logo span{font-size:17px;letter-spacing:.3em}
.logo small{font-size:10.5px;color:var(--ink2);letter-spacing:.2em;display:block;line-height:1.2}
nav{display:flex;gap:30px;align-items:center;font-size:13px}
nav a{color:var(--ink2);text-decoration:none}
.listbtn{background:none;border:1px solid var(--line2);padding:0 16px;height:40px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color .8s var(--slow)}
.listbtn:hover{border-color:var(--ink)}
.listbtn b{font-weight:400;min-width:1.4em;height:20px;display:inline-grid;place-items:center;background:var(--ink);color:var(--paper);font-size:11px;letter-spacing:0;padding:0 5px;transition:background .8s}
.listbtn b.zero{background:var(--line2)}

/* hero */
.hero{display:grid;grid-template-columns:repeat(12,1fr);gap:0 24px;padding:120px 0 96px}
.hero h1{grid-column:2/9;margin:0;font-weight:300;font-size:clamp(34px,5.2vw,64px);line-height:1.45;letter-spacing:.14em}
.hero h1 small{display:block;font-size:.3em;letter-spacing:.3em;color:var(--ink2);margin-top:18px}
.hero .side{grid-column:9/13;align-self:end;font-size:13.5px;color:var(--ink2);border-left:1px solid var(--line);padding-left:24px}
.hero .side dl{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;margin:18px 0 0;font-size:12px}
.hero .side dt{color:var(--ink3)}
.hero .side dd{margin:0;color:var(--ink)}

/* filters */
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
.tabs{display:flex;gap:0;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:1px solid transparent;margin-bottom:-1px;padding:14px 22px 13px;min-height:48px;cursor:pointer;font-size:13.5px;color:var(--ink2);transition:color .8s var(--slow),border-color .8s var(--slow)}
.tab small{font-size:10px;color:var(--ink3);margin-left:6px}
.tab[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink)}
.count{font-size:12px;color:var(--ink3);padding:0 4px 14px}

/* catalogue grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid var(--line);margin:0 0 120px}
.item{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 22px 24px;display:flex;flex-direction:column;opacity:0;transform:translateY(10px);transition:opacity 1.8s var(--slow),transform 1.8s var(--slow)}
.item.in{opacity:1;transform:none}
.item[hidden]{display:none}
.no{font-size:10.5px;color:var(--ink3);letter-spacing:.2em;display:flex;justify-content:space-between}
.plate{position:relative;aspect-ratio:1/1;background:var(--plate);margin:12px 0 18px;display:grid;place-items:center;overflow:hidden}
.plate::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 38%,rgba(255,255,255,.55),transparent 70%)}
.obj{position:relative;width:160px;height:160px;transition:transform 1.2s var(--slow)}
.item:hover .obj{transform:translateY(-3px)}
.obj .sh{position:absolute;left:24%;right:24%;bottom:22px;height:10px;border-radius:50%;background:radial-gradient(closest-side,rgba(70,55,40,.2),transparent)}
.obj *{position:absolute}
.nm{font-size:16px;letter-spacing:.12em;margin:0;font-weight:300}
.jp{font-size:11px;color:var(--ink2);letter-spacing:.14em}
.note{font-size:12.5px;color:var(--ink2);margin:10px 0 12px;line-height:1.8;flex:1}
.spec{display:grid;grid-template-columns:auto 1fr;gap:0 14px;font-size:11.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px;margin-bottom:14px}
.spec dt{color:var(--ink3)}.spec dd{margin:0}
.buy{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-size:15px;letter-spacing:.08em}
.price small{font-size:10.5px;color:var(--ink3);margin-left:2px}
.add{background:none;border:1px solid var(--line2);min-height:40px;padding:0 14px;cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:8px;transition:background .9s var(--slow),color .9s var(--slow),border-color .9s var(--slow)}
.add:hover{border-color:var(--ink)}
.add.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.add svg{width:10px;height:10px}

/* ---- CSS objects ---- */
/* mug */
.mug .body{left:38px;top:46px;width:72px;height:80px;border-radius:3px 3px 16px 16px;background:linear-gradient(90deg,#dedad2,#fbfaf6 32%,#f3f0ea 64%,#d7d2c8)}
.mug .rim{left:38px;top:40px;width:72px;height:13px;border-radius:50%;background:radial-gradient(ellipse at 50% 60%,#cfc9be 0 55%,#ebe8e2 56%)}
.mug .handle{left:103px;top:62px;width:30px;height:42px;border:8px solid #e7e3dc;border-left:0;border-radius:0 22px 22px 0}
/* carafe */
.carafe .body{left:46px;top:58px;width:68px;height:76px;border-radius:30px 30px 12px 12px;border:1.5px solid #c9ccc9;background:linear-gradient(90deg,rgba(255,255,255,.15),rgba(255,255,255,.75) 26%,rgba(225,230,230,.3) 60%,rgba(255,255,255,.4));overflow:hidden}
.carafe .water{left:0;right:0;bottom:0;height:52%;background:linear-gradient(180deg,rgba(185,205,210,.55),rgba(170,195,200,.7))}
.carafe .water::before{content:"";position:absolute;left:0;right:0;top:-3px;height:6px;border-radius:50%;background:rgba(210,225,228,.9)}
.carafe .neck{left:67px;top:22px;width:26px;height:40px;border:1.5px solid #c9ccc9;border-bottom:0;background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.8) 40%,rgba(230,232,232,.4))}
.carafe .cap{left:64px;top:16px;width:32px;height:9px;border-radius:3px;background:#cdb592}
/* board */
.board .b{left:26px;top:44px;width:108px;height:80px;border-radius:12px;background:repeating-linear-gradient(94deg,rgba(110,70,30,.07) 0 2px,transparent 2px 9px),linear-gradient(90deg,#d9bc93,#cfae80 60%,#c7a476);box-shadow:0 5px 0 #b38e61}
.board .hole{left:112px;top:56px;width:12px;height:12px;border-radius:50%;background:var(--plate);box-shadow:inset 1px 1px 2px rgba(0,0,0,.2)}
/* tote */
.tote .bag{left:38px;top:64px;width:84px;height:76px;border-radius:2px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px),linear-gradient(90deg,#d3c7b3,#ddd3c3 40%,#d2c6b1)}
.tote .h1,.tote .h2{top:26px;width:26px;height:44px;border:4px solid #cbbfab;border-bottom:0;border-radius:14px 14px 0 0}
.tote .h1{left:50px}.tote .h2{left:84px}
.tote .tag{left:44px;top:120px;width:16px;height:10px;background:#f4f1ea}
/* notebook */
.note-o .cover{left:46px;top:30px;width:70px;height:100px;border-radius:2px 5px 5px 2px;background:linear-gradient(90deg,#b99c73,#caae87 12%,#c8ab83 80%,#bea078)}
.note-o .stitch{left:52px;top:34px;width:1px;height:92px;background:repeating-linear-gradient(180deg,#8a7250 0 4px,transparent 4px 8px)}
.note-o .band{left:104px;top:30px;width:4px;height:100px;background:#3b3733}
.note-o .label{left:64px;top:50px;width:30px;height:14px;background:#f3efe6}
.note-o .pages{left:48px;top:128px;width:66px;height:4px;background:repeating-linear-gradient(90deg,#f1ede4 0 1px,#e2ddd2 1px 2px);border-radius:0 0 3px 3px}
/* clock */
.clock .face{left:28px;top:28px;width:104px;height:104px;border-radius:50%;background:#fbfaf6;box-shadow:0 0 0 4px #dcd7cd,0 6px 14px -6px rgba(60,45,30,.25)}
.clock .ticks{left:28px;top:28px;width:104px;height:104px;border-radius:50%;background:repeating-conic-gradient(from -1deg,#6d675f 0 2deg,transparent 2deg 30deg);-webkit-mask:radial-gradient(circle,transparent 41px,#000 42px 47px,transparent 48px);mask:radial-gradient(circle,transparent 41px,#000 42px 47px,transparent 48px)}
.clock .hh,.clock .mm,.clock .ss{left:79px;transform-origin:50% 100%;border-radius:2px}
.clock .hh{top:52px;width:3px;height:28px;background:#3b3733;margin-left:-.5px}
.clock .mm{top:40px;width:2px;height:40px;background:#3b3733}
.clock .ss{top:36px;width:1px;height:48px;background:var(--shu);transform-origin:50% 44px;margin-left:.5px}
.clock .pin{left:77px;top:78px;width:6px;height:6px;border-radius:50%;background:var(--shu)}
/* lamp */
.lamp .glow{left:18px;top:60px;width:124px;height:84px;background:radial-gradient(ellipse 50% 60% at 50% 10%,rgba(255,226,160,.55),transparent 70%);opacity:.8;transition:opacity 1.6s var(--slow)}
.lamp .shade{left:46px;top:30px;width:68px;height:40px;background:linear-gradient(90deg,#e4e0d8,#fbf9f4 40%,#e8e4dc);clip-path:polygon(24% 0,76% 0,100% 100%,0 100%)}
.lamp .stem{left:79px;top:68px;width:2.5px;height:64px;background:#3b3733}
.lamp .base{left:56px;top:128px;width:48px;height:10px;border-radius:50%;background:#3b3733}
.lamp .bulb{left:72px;top:64px;width:16px;height:8px;border-radius:0 0 8px 8px;background:#fff3cf}
/* bowl */
.bowl .b{left:32px;top:66px;width:96px;height:52px;border-radius:0 0 48px 48px/0 0 52px 52px;background:linear-gradient(90deg,#dcd7ce,#fbfaf6 34%,#f2efe9 66%,#d6d0c5)}
.bowl .rim{left:32px;top:60px;width:96px;height:14px;border-radius:50%;background:radial-gradient(ellipse at 50% 70%,#d9d3c8 0 58%,#efece6 60%)}
.bowl .line{left:38px;top:80px;width:84px;height:2px;background:rgba(80,100,125,.45);border-radius:50%}
.bowl .foot{left:64px;top:116px;width:32px;height:8px;background:#e1dcd3;border-radius:0 0 4px 4px}
/* chopsticks */
.chop .s1,.chop .s2{left:14px;width:132px;height:5px;border-radius:3px 1px 1px 3px;background:linear-gradient(90deg,#c9a06b,#dcc097 70%,#e3cba6)}
.chop .s1{top:74px;transform:rotate(-9deg)}.chop .s2{top:88px;transform:rotate(-7deg)}
.chop .rest{left:28px;top:92px;width:26px;height:12px;border-radius:6px;background:#e9e5de;box-shadow:inset 0 -3px 0 #d4cec3}
/* stool */
.stool .l1,.stool .l2,.stool .l3{top:70px;width:6px;height:70px;background:linear-gradient(90deg,#b8946a,#cfae83);border-radius:2px}
.stool .l1{left:46px;transform:rotate(7deg)}.stool .l2{left:77px;height:62px;top:72px;opacity:.85}.stool .l3{left:108px;transform:rotate(-7deg)}
.stool .seat{left:30px;top:52px;width:100px;height:26px;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#dcc198,#cfb085 70%);box-shadow:0 6px 0 #b8946a}
.stool .ring{left:52px;top:112px;width:56px;height:3px;background:#bf9c71}
/* thermos */
.flask .body{left:60px;top:44px;width:40px;height:92px;border-radius:6px 6px 10px 10px;background:linear-gradient(90deg,#8f9497,#e8eaeb 32%,#bfc3c5 60%,#899093)}
.flask .cap{left:60px;top:24px;width:40px;height:22px;border-radius:7px 7px 2px 2px;background:linear-gradient(90deg,#2f2c29,#55504a 35%,#3b3733)}
.flask .band{left:60px;top:46px;width:40px;height:3px;background:#6c7073}
/* candle */
.candle .glass{left:50px;top:66px;width:60px;height:66px;border-radius:4px 4px 9px 9px;border:1.5px solid #cfd0cb;background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(255,255,255,.7) 30%,rgba(235,235,232,.35));overflow:hidden}
.candle .wax{left:0;right:0;bottom:0;height:72%;background:linear-gradient(180deg,#efe8dc,#f5f0e6)}
.candle .wick{left:79px;top:76px;width:2px;height:8px;background:#3b3733}
.candle .flame{left:74px;top:56px;width:12px;height:22px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 70%,#fffbe8 0 25%,#f6d27e 55%,rgba(240,170,80,0) 72%);transform-origin:50% 90%;animation:flick 3.8s ease-in-out infinite}
.candle .halo{left:40px;top:30px;width:80px;height:80px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,220,150,.35),transparent)}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(.94,1.05) rotate(-2deg)}60%{transform:scale(1.03,.96) rotate(1.5deg)}}

/* list drawer */
.scrim{position:fixed;inset:0;background:rgba(59,55,51,.18);opacity:0;pointer-events:none;transition:opacity 1s var(--slow);z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--paper);border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform 1s var(--slow);display:flex;flex-direction:column;padding:28px 30px}
.drawer.on{transform:none}
.drawer h2{font-weight:300;font-size:18px;letter-spacing:.24em;margin:0;display:flex;justify-content:space-between;align-items:center}
.drawer h2 small{font-size:11px;color:var(--ink2);display:block;letter-spacing:.2em}
.x{background:none;border:0;width:44px;height:44px;cursor:pointer;position:relative}
.x::before,.x::after{content:"";position:absolute;left:12px;right:12px;top:21px;height:1px;background:var(--ink);transform:rotate(45deg)}
.x::after{transform:rotate(-45deg)}
.x:focus{outline:none}.x:focus-visible{outline:1px solid var(--line2);outline-offset:2px}
.lines{list-style:none;margin:24px 0 0;padding:0;flex:1;overflow:auto;border-top:1px solid var(--line)}
.lines li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:16px 0;border-bottom:1px solid var(--line);animation:lin 1.2s var(--slow)}
@keyframes lin{from{opacity:0}to{opacity:1}}
.lines .t{font-size:14px}.lines .t small{display:block;font-size:10.5px;color:var(--ink3)}
.lines .p{text-align:right;font-size:14px}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--line2);width:max-content}
.qty button{background:none;border:0;width:40px;height:36px;cursor:pointer;font-size:15px;color:var(--ink2)}
.qty span{min-width:28px;text-align:center;font-size:13px}
.rm{background:none;border:0;font-size:11.5px;color:var(--ink3);cursor:pointer;text-decoration:underline;text-underline-offset:3px;justify-self:end;min-height:36px}
.empty{color:var(--ink3);font-size:13px;padding:40px 0;text-align:center;line-height:2.2}
.sum{border-top:1px solid var(--ink);padding-top:14px;margin-top:10px;display:flex;justify-content:space-between;font-size:15px}
.sum small{font-size:10.5px;color:var(--ink3)}
.fine{font-size:11px;color:var(--ink3);margin:14px 0 0;line-height:1.8}

footer{border-top:1px solid var(--line);padding:30px 0 60px;font-size:12px;color:var(--ink3);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,12px);background:var(--ink);color:var(--paper);padding:10px 20px;font-size:12.5px;opacity:0;transition:opacity 1s var(--slow),transform 1s var(--slow);pointer-events:none;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1024px){ .grid{grid-template-columns:repeat(3,1fr)} }
@media (max-width:760px){
  .wrap{padding:0 16px}
  nav a{display:none}
  .hero{grid-template-columns:1fr;padding:64px 0 56px;gap:34px}
  .hero h1,.hero .side{grid-column:1}
  .grid{grid-template-columns:repeat(2,1fr)}
  .item{padding:14px 12px 16px}
  .obj{transform:scale(.8)}
  .item:hover .obj{transform:scale(.8) translateY(-3px)}
  .plate{margin:8px 0 12px}
  .nm{font-size:14px;letter-spacing:.06em}
  .note{display:none}
  .spec{font-size:10.5px;gap:0 8px}
  .buy{flex-direction:column;align-items:stretch}
  .add{justify-content:center}
  .tab{padding:12px 12px 11px}
  .tab small{display:none}
  .logo span{letter-spacing:.2em}
}
@media (prefers-reduced-motion:reduce){
  .item{transition-duration:.01s}
  .candle .flame{animation:none}
}
</style>
</head>
<body>
<header>
  <div class="wrap hd">
    <a class="logo" href="#top" aria-label="余白舍 首頁"><i>余</i><span>余白舍<small>YOHAKU-SHA · 生活の道具</small></span></a>
    <nav aria-label="主要導覽">
      <a href="#catalog">目錄</a><a href="#about">關於</a>
      <button class="listbtn" id="openList" type="button" aria-haspopup="dialog">清單 <b id="badge" class="zero">0</b></button>
    </nav>
  </div>
</header>

<main class="wrap" id="top">
  <section class="hero">
    <h1>少一點，<br>剛剛好。<small>これくらいが、ちょうどいい。</small></h1>
    <div class="side" id="about">
      <p style="margin:0">我們只做每天會用到的東西。不印大標誌，不加多餘的顏色——把位置留給您的生活。</p>
      <dl><dt>目錄</dt><dd>2026 秋冬　Vol.12</dd><dt>品項</dt><dd>全 12 品</dd><dt>素材</dt><dd>瓷、木、麻、玻璃、鋼</dd></dl>
    </div>
  </section>

  <section id="catalog" aria-label="商品目錄">
    <div class="bar">
      <div class="tabs" role="group" aria-label="分類">
        <button class="tab" type="button" data-cat="all" aria-pressed="true">全部<small>すべて</small></button>
        <button class="tab" type="button" data-cat="kitchen" aria-pressed="false">廚房<small>台所</small></button>
        <button class="tab" type="button" data-cat="living" aria-pressed="false">生活<small>暮らし</small></button>
        <button class="tab" type="button" data-cat="carry" aria-pressed="false">隨身<small>持ち歩き</small></button>
      </div>
      <div class="count" id="count" aria-live="polite">12 品</div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer class="wrap">
  <span>余白舍　虛構的生活道具店。所有商品皆以 CSS 繪製，不販售任何東西。</span>
  <span>© 2026 YOHAKU-SHA</span>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dt" aria-hidden="true">
  <h2><span id="dt">買い物リスト<small>購物清單</small></span><button class="x" id="closeList" type="button" aria-label="關閉清單"></button></h2>
  <ul class="lines" id="lines"></ul>
  <div class="sum"><span>合計<br><small>含稅・免運門檻 NT$ 1,500</small></span><span id="total">NT$ 0</span></div>
  <p class="fine" id="ship">清單只存在您的瀏覽器裡。慢慢想，不急。</p>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const OBJ={
  mug:'<div class="handle"></div><div class="body"></div><div class="rim"></div>',
  carafe:'<div class="cap"></div><div class="neck"></div><div class="body"><div class="water"></div></div>',
  board:'<div class="b"></div><div class="hole"></div>',
  tote:'<div class="h1"></div><div class="h2"></div><div class="bag"></div><div class="tag"></div>',
  'note-o':'<div class="pages"></div><div class="cover"></div><div class="stitch"></div><div class="label"></div><div class="band"></div>',
  clock:'<div class="face"></div><div class="ticks"></div><div class="hh"></div><div class="mm"></div><div class="ss"></div><div class="pin"></div>',
  lamp:'<div class="glow"></div><div class="stem"></div><div class="base"></div><div class="bulb"></div><div class="shade"></div>',
  bowl:'<div class="foot"></div><div class="b"></div><div class="rim"></div><div class="line"></div>',
  chop:'<div class="rest"></div><div class="s1"></div><div class="s2"></div>',
  stool:'<div class="l2"></div><div class="l1"></div><div class="l3"></div><div class="ring"></div><div class="seat"></div>',
  flask:'<div class="body"></div><div class="cap"></div><div class="band"></div>',
  candle:'<div class="halo"></div><div class="glass"><div class="wax"></div></div><div class="wick"></div><div class="flame"></div>'
};
const ITEMS=[
  {id:1,o:'mug',cat:'kitchen',zh:'白瓷馬克杯',jp:'白磁マグカップ',note:'早上的第一杯，不需要花紋。',mat:'瓷',size:'容量 350ml',price:390,sh:24},
  {id:2,o:'carafe',cat:'kitchen',zh:'玻璃水瓶',jp:'耐熱ガラスピッチャー',note:'看得見水還剩多少，也是一種安心。',mat:'耐熱玻璃',size:'1.0L',price:590,sh:22},
  {id:3,o:'board',cat:'kitchen',zh:'橡木砧板',jp:'オーク材まな板',note:'刀痕，會慢慢變成它的年輪。',mat:'橡木',size:'30 × 24 cm',price:1290,sh:26},
  {id:4,o:'tote',cat:'carry',zh:'亞麻托特包',jp:'麻トートバッグ',note:'裝得下一顆高麗菜和一本書。',mat:'亞麻 100%',size:'38 × 40 cm',price:690,sh:16},
  {id:5,o:'note-o',cat:'carry',zh:'牛皮紙筆記本',jp:'クラフトノート',note:'空白，是最好的內容。',mat:'再生紙',size:'A5・80 頁',price:120,sh:24},
  {id:6,o:'clock',cat:'living',zh:'靜音掛鐘',jp:'掛け時計',note:'秒針很安靜。您也可以。',mat:'鋁、玻璃',size:'直徑 25 cm',price:1490,sh:0},
  {id:7,o:'lamp',cat:'living',zh:'紙罩桌燈',jp:'デスクライト',note:'只照亮需要的那一小塊。',mat:'鋼、和紙',size:'高 42 cm',price:1990,sh:18},
  {id:8,o:'bowl',cat:'kitchen',zh:'白瓷飯碗',jp:'白磁茶碗',note:'一碗飯的份量，剛剛好。',mat:'瓷',size:'直徑 12 cm',price:250,sh:32},
  {id:9,o:'chop',cat:'kitchen',zh:'竹筷與筷架',jp:'竹箸と箸置き',note:'兩根竹子，一塊小陶。',mat:'孟宗竹、陶',size:'23 cm',price:180,sh:44},
  {id:10,o:'stool',cat:'living',zh:'橡木圓凳',jp:'オーク材スツール',note:'坐著，放書，墊腳，都行。',mat:'橡木',size:'高 44 cm',price:2490,sh:14},
  {id:11,o:'flask',cat:'carry',zh:'不鏽鋼保溫瓶',jp:'ステンレス保温ボトル',note:'下午三點，茶還是熱的。',mat:'不鏽鋼',size:'350ml',price:790,sh:20},
  {id:12,o:'candle',cat:'living',zh:'玻璃杯蠟燭',jp:'グラスキャンドル',note:'無香。只有光。',mat:'大豆蠟、玻璃',size:'約燃燒 30 小時',price:450,sh:24}
];
const fmt=n=>'NT$ '+n.toLocaleString('en-US');

let list={};
try{ list=JSON.parse(localStorage.getItem('yohaku.list')||'{}')||{}; }catch(e){ list={}; }
function save(){ try{ localStorage.setItem('yohaku.list',JSON.stringify(list)); }catch(e){} }

/* ---- render catalogue ---- */
const grid=$('grid');
if(grid){
  grid.innerHTML=ITEMS.map((it,i)=>`
    <article class="item" data-cat="${it.cat}" data-id="${it.id}" style="transition-delay:${(i%4)*0.16}s">
      <div class="no"><span>No.${String(it.id).padStart(3,'0')}</span><span>${{kitchen:'台所',living:'暮らし',carry:'持ち歩き'}[it.cat]}</span></div>
      <div class="plate" aria-hidden="true"><div class="obj ${it.o}">${it.sh?`<div class="sh" style="bottom:${it.sh}px"></div>`:''}${OBJ[it.o]}</div></div>
      <h3 class="nm">${it.zh}</h3>
      <div class="jp">${it.jp}</div>
      <p class="note">${it.note}</p>
      <dl class="spec"><dt>素材</dt><dd>${it.mat}</dd><dt>尺寸</dt><dd>${it.size}</dd></dl>
      <div class="buy"><span class="price"><small style="margin:0 4px 0 0">NT$</small>${it.price.toLocaleString('en-US')}<small>含稅</small></span>
        <button class="add" type="button" data-id="${it.id}" aria-label="將${it.zh}加入清單"></button></div>
    </article>`).join('');
}
const PLUS='<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0 V10 M0 5 H10" stroke="currentColor" stroke-width="1"/></svg>';
function syncButtons(){
  document.querySelectorAll('.add').forEach(b=>{ const on=!!list[b.dataset.id]; b.classList.toggle('on',on); b.innerHTML=on?`清單中 × ${list[b.dataset.id]}`:`${PLUS}加入清單`; b.setAttribute('aria-pressed',String(on)); });
  const n=Object.values(list).reduce((a,b)=>a+b,0);
  const bd=$('badge'); if(bd){ bd.textContent=n; bd.classList.toggle('zero',!n); }
}

/* ---- very slow fade-in ---- */
const items=[...document.querySelectorAll('.item')];
if('IntersectionObserver' in window){
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }),{threshold:.08});
  items.forEach(i=>io.observe(i));
} else items.forEach(i=>i.classList.add('in'));

/* ---- filters ---- */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  const c=t.dataset.cat;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',String(x===t)));
  let n=0;
  items.forEach((it,i)=>{ const show=c==='all'||it.dataset.cat===c; it.hidden=!show; if(show){ n++; it.classList.remove('in'); it.style.transitionDelay=((n-1)%4*0.14)+'s'; requestAnimationFrame(()=>requestAnimationFrame(()=>it.classList.add('in'))); } });
  const ct=$('count'); if(ct) ct.textContent=`${n} 品`;
}));

/* ---- list ---- */
let tt=0;
function toast(msg){ const t=$('toast'); if(!t) return; t.textContent=msg; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2200); }
if(grid) grid.addEventListener('click',e=>{
  const b=e.target.closest('.add'); if(!b) return;
  const id=b.dataset.id; const it=ITEMS.find(x=>String(x.id)===id); if(!it) return;
  list[id]=(list[id]||0)+1; save(); syncButtons(); renderList();
  toast(list[id]===1?`「${it.zh}」加入清單。`:`「${it.zh}」× ${list[id]}。也好，多一個備用。`);
});
function renderList(){
  const ul=$('lines'); if(!ul) return;
  const ids=Object.keys(list).filter(k=>list[k]>0);
  if(!ids.length){ ul.innerHTML='<li class="empty" style="display:block;border:0">清單是空的。<br>空著，也很好。</li>'; }
  else ul.innerHTML=ids.map(id=>{ const it=ITEMS.find(x=>String(x.id)===id); if(!it) return ''; return `<li>
      <span class="t">${it.zh}<small>${it.jp}・${it.size}</small></span><span class="p">${fmt(it.price*list[id])}</span>
      <span class="qty"><button type="button" data-q="-1" data-id="${id}" aria-label="減少${it.zh}">−</button><span>${list[id]}</span><button type="button" data-q="1" data-id="${id}" aria-label="增加${it.zh}">+</button></span>
      <button class="rm" type="button" data-rm="${id}">移除</button></li>`; }).join('');
  const total=ids.reduce((a,id)=>{ const it=ITEMS.find(x=>String(x.id)===id); return a+(it?it.price*list[id]:0); },0);
  const tl=$('total'); if(tl) tl.textContent=fmt(total);
  const sp=$('ship'); if(sp) sp.textContent= total===0?'清單只存在您的瀏覽器裡。慢慢想，不急。': total>=1500?'已達免運門檻。清單只存在您的瀏覽器裡。':`再 ${fmt(1500-total)} 即可免運——但不需要為了免運多買。`;
}
const lines=$('lines');
if(lines) lines.addEventListener('click',e=>{
  const q=e.target.closest('[data-q]'), rm=e.target.closest('[data-rm]');
  if(q){ const id=q.dataset.id; list[id]=Math.max(0,(list[id]||0)+(+q.dataset.q)); if(!list[id]) delete list[id]; }
  else if(rm){ delete list[rm.dataset.rm]; } else return;
  save(); syncButtons(); renderList();
});
const drawer=$('drawer'), scrim=$('scrim');
let lastFocus=null;
function openList(){ if(!drawer||!scrim) return; lastFocus=document.activeElement; renderList(); drawer.classList.add('on'); scrim.classList.add('on'); drawer.setAttribute('aria-hidden','false'); const c=$('closeList'); if(c) setTimeout(()=>c.focus(),50); }
function closeList(){ if(!drawer||!scrim) return; drawer.classList.remove('on'); scrim.classList.remove('on'); drawer.setAttribute('aria-hidden','true'); if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
const ob=$('openList'); if(ob) ob.addEventListener('click',openList);
const cb=$('closeList'); if(cb) cb.addEventListener('click',closeList);
if(scrim) scrim.addEventListener('click',closeList);
addEventListener('keydown',e=>{ if(e.key==='Escape'&&drawer&&drawer.classList.contains('on')) closeList(); });

/* ---- the clock tells the real time, slowly ---- */
function clock(){
  const d=new Date(), s=d.getSeconds(), m=d.getMinutes()+s/60, h=(d.getHours()%12)+m/60;
  document.querySelectorAll('.clock').forEach(c=>{
    const hh=c.querySelector('.hh'), mm=c.querySelector('.mm'), ss=c.querySelector('.ss');
    if(hh) hh.style.transform=`rotate(${h*30}deg)`; if(mm) mm.style.transform=`rotate(${m*6}deg)`; if(ss) ss.style.transform=`rotate(${s*6}deg)`;
  });
}
clock(); setInterval(clock,1000);

syncButtons(); renderList();
})();
</script>
</body>
</html>
