<!doctype html>
<!--
可調參數（在下方 CONFIG 修改）：
  buildingDensity  樓房密度，0–1，預設 0.82
  windowLightRatio 夜間亮燈比例，0–1，預設 0.34
  cameraElevation  鏡頭仰角（度），預設 34
  cameraAzimuth    鏡頭方位角（度），預設 42
所有建築、山形、樹木與文字牌都由程式生成；唯一外部依賴為 CDN Three.js。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11171c">
<meta name="description" content="台北市中心的程序化 3D 桌上模型：台北 101、中正紀念堂、國父紀念館、街廓與盆地山系。">
<title>台北・掌心之城｜3D 立體模型</title>
<style>
:root{color-scheme:dark;font-family:ui-sans-serif,system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;background:#11171c;color:#f4f0e6}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:radial-gradient(ellipse at 50% 45%,#26343b 0%,#172229 45%,#0c1116 100%)}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}#scene.dragging{cursor:grabbing}
.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:27px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px}.eyebrow,.edition,.hint,.key{font-size:11px;letter-spacing:.22em;text-transform:uppercase}.eyebrow{color:#d3ad78}.title{font-size:clamp(36px,5.6vw,78px);font-weight:600;letter-spacing:-.075em;line-height:1.08;margin:8px 0 7px;text-shadow:0 2px 18px #0d1517}.subtitle{font-size:13px;line-height:1.6;color:#c8d0cd;letter-spacing:.06em;margin:0}.edition{text-align:right;color:#d3ad78;line-height:1.7;border-top:1px solid #9c7d57;padding-top:10px;white-space:nowrap}
.bottom{position:absolute;bottom:24px;left:32px;right:32px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.legend{display:flex;gap:8px;flex-wrap:wrap;max-width:720px}.landmark{pointer-events:auto;appearance:none;border:1px solid #73837f88;background:#152126c9;color:#e7e8dc;padding:10px 13px;border-radius:3px;font:inherit;font-size:12px;letter-spacing:.04em;cursor:pointer;transition:background .2s,border-color .2s}.landmark:hover,.landmark:focus-visible{background:#284046;border-color:#d4ad78;outline:none}.landmark span{color:#d3ad78;margin-right:8px;font-size:10px}.hint{color:#b4c1bf;text-align:right;line-height:1.7;text-shadow:0 2px 8px #10191b}.notice{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a2a2e;border:1px solid #a9875a;padding:18px 22px;max-width:min(420px,90vw);line-height:1.7;text-align:center;font-size:14px;pointer-events:auto}.notice[hidden]{display:none}.loading{color:#e4c694;letter-spacing:.18em;font-size:12px}
@media(max-width:700px){.top{top:18px;left:18px;right:18px}.title{font-size:41px}.subtitle{font-size:11px;max-width:230px}.edition{font-size:9px;letter-spacing:.1em}.bottom{left:14px;right:14px;bottom:15px;display:block}.legend{gap:5px}.landmark{font-size:11px;padding:8px 9px}.landmark span{margin-right:4px}.hint{text-align:left;margin-top:10px;font-size:9px;letter-spacing:.12em}}
</style>
</head>
<body>
<canvas id="scene" aria-label="台北市中心立體模型，可拖曳環繞並用滾輪縮放"></canvas>
<div class="ui">
  <div class="top"><div><div class="eyebrow">TAIPEI · A CITY IN MINIATURE</div><h1 class="title">掌心之城</h1><p class="subtitle">山環抱著街，街收藏著光。<br>一座可以慢慢轉動的台北。</p></div><div class="edition">TAIPEI BASIN<br>25°02′ N / 121°33′ E<br>DIORAMA № 117</div></div>
  <div class="bottom"><nav class="legend" aria-label="地標定位"><button class="landmark" data-place="101"><span>01</span>台北 101</button><button class="landmark" data-place="cks"><span>02</span>中正紀念堂</button><button class="landmark" data-place="sys"><span>03</span>國父紀念館</button></nav><div class="hint">拖曳環繞 · 滾輪縮放<br>點選地標聚焦</div></div>
  <div class="notice loading" id="loading" role="status">正在搭建台北的夜色…</div><div class="notice" id="error" hidden>無法載入 Three.js。請確認網路連線並使用支援 WebGL 的瀏覽器。</div>
</div>
<script type="module">
const CONFIG={buildingDensity:.82,windowLightRatio:.34,cameraElevation:34,cameraAzimuth:42};
let THREE;
try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js')}
catch(error){document.getElementById('loading').remove();document.getElementById('error').hidden=false;throw error}
const canvas=document.getElementById('scene');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'})}
catch(error){document.getElementById('loading').remove();document.getElementById('error').hidden=false;throw error}
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x11171c);scene.fog=new THREE.FogExp2(0x11171c,.011);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,130);
const ambient=new THREE.HemisphereLight(0xc9def0,0x34432d,1.5);scene.add(ambient);
const key=new THREE.DirectionalLight(0xffd2a0,2.5);key.position.set(-8,17,11);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-16;key.shadow.camera.right=16;key.shadow.camera.top=16;key.shadow.camera.bottom=-16;key.shadow.camera.near=.5;key.shadow.camera.far=50;key.shadow.bias=-.00025;scene.add(key);
const rim=new THREE.DirectionalLight(0x8bb9b9,1.4);rim.position.set(9,8,-10);scene.add(rim);
const stage=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0x182226,roughness:1}));stage.rotation.x=-Math.PI/2;stage.position.y=-.72;stage.receiveShadow=true;scene.add(stage);
const mat=(color,extra={})=>new THREE.MeshStandardMaterial({color,roughness:.85,flatShading:true,...extra});
const m={base:mat(0x273638),edge:mat(0x9c8265),sand:mat(0xb8ae90),terrain:mat(0x52715a),terrain2:mat(0x628464),grass:mat(0x658966),road:mat(0x34494c),lane:mat(0xb5ab8e),walk:mat(0x83918a),tree:mat(0x47775d),tree2:mat(0x618e69),trunk:mat(0x66594b),white:mat(0xe7e9df),stone:mat(0xcbd3c9),blue:mat(0x2c6788,{metalness:.2}),blueDark:mat(0x244b67),orange:mat(0xc77b46),gold:mat(0xf2c775,{metalness:.28}),teal:mat(0x6da8a3,{metalness:.22}),tealDark:mat(0x416d72,{metalness:.28}),water:mat(0x4394a1,{metalness:.2,roughness:.3}),waterLight:mat(0x98c9c5,{emissive:0x2e6b76,emissiveIntensity:.4}),ink:mat(0x344143),warm:mat(0xf2d09a,{emissive:0xe5a95c,emissiveIntensity:1.8}),window:mat(0x9fb3ab,{metalness:.25,roughness:.4})};
const boxGeo=new THREE.BoxGeometry(1,1,1),coneGeo=new THREE.ConeGeometry(1,1,6),trunkGeo=new THREE.CylinderGeometry(1,1,1,6);
function box(parent,material,x,y,z,w,h,d,shadow=true){const o=new THREE.Mesh(boxGeo,material);o.position.set(x,y,z);o.scale.set(w,h,d);o.castShadow=shadow;o.receiveShadow=true;parent.add(o);return o}
function cylinder(parent,material,x,y,z,top,bottom,height,segments=8){const o=new THREE.Mesh(new THREE.CylinderGeometry(top,bottom,height,segments),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cone(parent,material,x,y,z,radius,height,segments=8,rotation=0){const o=new THREE.Mesh(new THREE.ConeGeometry(radius,height,segments),material);o.position.set(x,y,z);o.rotation.y=rotation;o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function rand(seed){const n=Math.sin(seed*127.1+78.233)*43758.5453;return n-Math.floor(n)}
function plaque(text,x,z,w=2.1){const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');g.fillStyle='#e8d6ad';g.fillRect(0,0,512,128);g.strokeStyle='#88785f';g.lineWidth=8;g.strokeRect(5,5,502,118);g.fillStyle='#26393d';g.font='bold 58px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,68,472);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const p=new THREE.Mesh(new THREE.PlaneGeometry(w,w*.25),new THREE.MeshBasicMaterial({map:t}));p.rotation.x=-Math.PI/2;p.position.set(x,.392,z);scene.add(p)}
// A square, layered display plinth makes the model read as a physical object.
box(scene,m.base,0,-.33,0,23,.58,23);box(scene,m.edge,0,-.01,0,22.55,.1,22.55);box(scene,m.sand,0,.11,0,22.1,.19,22.1);box(scene,m.terrain,0,.24,0,21.65,.08,21.65);
for(const z of [-8,-6,-4,-2,0,2,4,6,8]){box(scene,m.road,0,.303,z,18.4,.045,.56,false);box(scene,m.lane,0,.328,z,18.0,.006,.012,false)}
for(const x of [-8,-6,-4,-2,0,2,4,6,8]){box(scene,m.road,x,.304,0,.56,.045,18.4,false);box(scene,m.lane,x,.33,0,.012,.006,18.0,false)}
// The mountains use uneven low-sided cones with an organic green perimeter.
for(let i=0;i<52;i++){const side=Math.floor(i/13),t=(i%13)/12*20-10;let x,z;if(side===0){x=t;z=-10.45}else if(side===1){x=10.45;z=t}else if(side===2){x=t;z=10.45}else{x=-10.45;z=t}const n=rand(i+20),r=.85+rand(i+40)*.65,h=(side===2?.75:1.25)+n*1.1;cone(scene,i%3?m.terrain:m.terrain2,x,.32+h/2,z,r,h,5,rand(i+52)*Math.PI)}
const treeGeo=new THREE.ConeGeometry(1,1,6);
function tree(x,z,s=.18){cylinder(scene,m.trunk,x,.43+s*.6,z,.025,.035,.2,5);const o=new THREE.Mesh(treeGeo,rand(Math.round(x*30+z*13))>.5?m.tree:m.tree2);o.position.set(x,.59+s,z);o.scale.set(s,s*2.1,s);o.castShadow=true;scene.add(o)}
// A dark gridded city: block scale, roof height and warm windows are seeded.
const walls=[mat(0x82918c),mat(0x9da8a0),mat(0x6d8588),mat(0xb5b0a2),mat(0x697879),mat(0x8d9d9c)];
const windowMatrices=[[],[]],windowDummy=new THREE.Object3D();
function windowBox(x,y,z,w,h,d,lit){windowDummy.position.set(x,y,z);windowDummy.scale.set(w,h,d);windowDummy.updateMatrix();windowMatrices[lit?1:0].push(windowDummy.matrix.clone())}
function reserved(x,z){return (x>3.25&&x<7.9&&z>-5.8&&z<-.9)||(x>-7.8&&x<-2.25&&z>1.15&&z<7.4)||(x>.8&&x<6.6&&z>1.2&&z<7.4)}
function building(x,z,id){let w=.48+rand(id+1)*.36,d=.48+rand(id+2)*.36,h=.55+Math.pow(rand(id+3),1.4)*2.0;if(x>1&&z<0)h*=1.35;const body=box(scene,walls[Math.floor(rand(id+4)*walls.length)],x,.35+h/2,z,w,h,d);box(scene,m.ink,x,.36+h+.035,z,w*.94,.07,d*.94);if(rand(id+7)>.7)box(scene,m.window,x,.43+h,z,w*.36,.13,d*.36,false);
  const floors=Math.min(9,Math.floor(h/.22));const cols=2;const ww=.065,wh=.085;
  for(let f=0;f<floors;f++)for(let c=0;c<cols;c++)for(const face of [-1,1]){const lit=rand(id*301+f*31+c*7+face*3)<CONFIG.windowLightRatio;const y=.52+f*.22,xoff=(c-.5)*w*.42;windowBox(x+xoff,y,z+face*(d/2+.006),ww,wh,.012,lit);windowBox(x+face*(w/2+.006),y,z+xoff,.012,wh,ww,lit)}
  return body}
for(let gx=-7;gx<=7;gx+=2)for(let gz=-7;gz<=7;gz+=2){const id=(gx+9)*29+(gz+9)*17;if(reserved(gx,gz))continue;box(scene,m.walk,gx,.348,gz,1.38,.055,1.38,false);for(let dx=-.37;dx<=.37;dx+=.74)for(let dz=-.37;dz<=.37;dz+=.74){const x=gx+dx,z=gz+dz,seed=id+Math.round(dx*10)+Math.round(dz*100);if(rand(seed+9)<CONFIG.buildingDensity&& !reserved(x,z))building(x,z,seed);else tree(x,z,.2)}if(rand(id+99)>.47)for(const d of [-.7,.7])tree(gx+d,gz+.74,.13)}
for(let i=0;i<2;i++){const meshes=windowMatrices[i];const windows=new THREE.InstancedMesh(boxGeo,i?m.warm:m.window,meshes.length);meshes.forEach((matrix,index)=>windows.setMatrixAt(index,matrix));windows.instanceMatrix.needsUpdate=true;windows.frustumCulled=false;scene.add(windows)}
// Sparse street trees keep intersections legible.
for(let x=-8;x<=8;x+=2)for(let z=-8;z<=8;z+=2)if(!reserved(x,z)&&rand((x+11)*97+z)> .77)tree(x+.6,z+.6,.14);
// Taipei 101: tapering bamboo sections, corner fins and the long spire.
function taipei101(){const g=new THREE.Group();g.position.set(5.5,0,-3.7);scene.add(g);box(g,m.walk,0,.4,0,3.1,.13,3.1);box(g,m.ink,0,.59,0,1.45,.3,1.45);for(let i=0;i<8;i++){const y=.83+i*.65,scale=1.18-i*.043;box(g,m.tealDark,0,y+.26,0,scale,.52,scale);box(g,m.teal,0,y+.27,0,scale*.9,.44,scale*.9);box(g,m.gold,0,y+.57,0,scale+ .12,.075,scale+.12);for(const sx of [-1,1])for(const sz of [-1,1])box(g,m.tealDark,sx*scale*.43,y+.27,sz*scale*.43,.09,.55,.09)}box(g,m.ink,0,6.16,0,.76,.32,.76);box(g,m.teal,0,6.45,0,.58,.35,.58);cylinder(g,m.gold,0,6.82,0,.23,.3,.48,8);cylinder(g,m.ink,0,7.35,0,.09,.13,.7,8);cone(g,m.gold,0,7.78,0,.15,.38,8);plaque('台北 101',5.5,-1.76,2.2)}
taipei101();
// Chiang Kai-shek Memorial Hall: axial forecourt, octagonal blue roof, paired halls.
function roof(parent,material,x,y,z,r,h,segments=4){cone(parent,material,x,y,z,r,h,segments,segments===4?Math.PI/4:Math.PI/8)}
function cks(){const g=new THREE.Group();g.position.set(-5,0,4.15);scene.add(g);box(g,m.walk,0,.38,0,5.65,.13,5.3);box(g,m.sand,0,.465,.85,4.9,.03,3.25,false);for(let z=.2;z<=2.05;z+=.36)box(g,m.lane,0,.485,z,2.2,.013,.028,false);
  box(g,m.stone,0,.57,-1.23,2.45,.25,2.1);for(let i=0;i<4;i++)box(g,m.white,0,.735+i*.11,-.32+i*.17,2.1-i*.17,.09,1.03-i*.12);box(g,m.white,0,1.55,-1.23,1.76,1.62,1.5);for(const x of [-.7,.7])for(const z of [-1.88,-.58])cylinder(g,m.white,x,1.4,z,.08,.08,1.25,8);box(g,m.blueDark,0,2.44,-1.23,2.45,.15,2.28);roof(g,m.blue,0,2.88,-1.23,1.65,.77,8);roof(g,m.blueDark,0,3.07,-1.23,1.02,.34,8);cone(g,m.gold,0,3.28,-1.23,.09,.22,8);
  for(const side of [-1,1]){const x=side*1.9;box(g,m.stone,x,.59,.28,1.53,.37,1.47);for(const xx of [-.51,0,.51])box(g,m.white,x+xx,.92,.75,.12,.58,.12);box(g,m.orange,x,1.31,.28,1.85,.11,1.76);roof(g,m.orange,x,1.71,.28,1.43,.72,4);box(g,m.gold,x,1.43,.28,1.9,.05,1.82)}for(const x of [-2.55,2.55])for(const z of [-1.4,-.4,.6,1.55])tree(-5+x,4.15+z,.17);plaque('中正紀念堂',-5,7.02,2.55)}
cks();
// Sun Yat-sen Memorial Hall: broad golden eaves, reflecting pool and lawn.
function sys(){const g=new THREE.Group();g.position.set(3.35,0,4.15);scene.add(g);box(g,m.walk,0,.39,0,5.25,.13,5.25);box(g,m.grass,0,.47,1.13,4.7,.045,2.52);box(g,m.water,0,.5,1.46,2.8,.026,.7);box(g,m.waterLight,0,.519,1.46,2.48,.006,.018,false);box(g,m.stone,0,.59,-.62,3.65,.25,2.67);box(g,m.white,0,1.13,-.62,2.95,.92,2.07);for(const x of [-1.25,-.62,0,.62,1.25])box(g,m.stone,x,1.08,.47,.1,.82,.15);box(g,m.ink,0,1.33,.46,.47,.5,.02);box(g,m.gold,0,1.67,-.62,3.82,.12,2.82);roof(g,m.gold,0,2.23,-.62,2.64,1.04,4);box(g,m.orange,0,1.78,-.62,3.95,.09,2.95);for(const x of [-2.18,2.18])for(const z of [-1.5,-.5,.6,1.85])tree(3.35+x,4.15+z,.17);plaque('國父紀念館',3.35,7.1,2.55)}
sys();
// Small lamp posts mark the promenade without adding large light sources.
for(const [x,z] of [[-8,0],[-6,0],[-4,0],[0,-8],[2,-8],[4,-8],[8,0],[8,2]]){cylinder(scene,m.ink,x,.55,z,.025,.032,.4,6);box(scene,m.warm,x,.77,z,.1,.09,.1,false)}
// Damped orbit, zoom and landmark focus. Default view keeps all three districts in frame.
const focus=new THREE.Vector3(0,.9,0),targetFocus=new THREE.Vector3(0,.9,0);const homeDistance=()=>Math.max(31,31/camera.aspect);let yaw=THREE.MathUtils.degToRad(CONFIG.cameraAzimuth),pitch=THREE.MathUtils.degToRad(CONFIG.cameraElevation),distance=homeDistance(),targetYaw=yaw,targetPitch=pitch,targetDistance=distance;
function positionCamera(){const cp=Math.cos(pitch);camera.position.set(focus.x+Math.sin(yaw)*cp*distance,focus.y+Math.sin(pitch)*distance,focus.z+Math.cos(yaw)*cp*distance);camera.lookAt(focus)}
let dragging=false,px=0,py=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;canvas.classList.add('dragging');canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;targetYaw+=(e.clientX-px)*.003;targetPitch=THREE.MathUtils.clamp(targetPitch-(e.clientY-py)*.003,THREE.MathUtils.degToRad(18),THREE.MathUtils.degToRad(70));px=e.clientX;py=e.clientY});
function stopDrag(){dragging=false;canvas.classList.remove('dragging')}canvas.addEventListener('pointerup',stopDrag);canvas.addEventListener('pointercancel',stopDrag);
canvas.addEventListener('wheel',e=>{e.preventDefault();targetDistance=THREE.MathUtils.clamp(targetDistance+e.deltaY*.018,18,82)},{passive:false});
document.querySelectorAll('[data-place]').forEach(button=>button.addEventListener('click',()=>{const p=button.dataset.place;const point=p==='101'?[5.5,1.5,-3.7]:p==='cks'?[-5,1,4.15]:[3.35,1,4.15];targetFocus.set(...point);targetDistance=Math.max(21,homeDistance()*.62)}));
canvas.addEventListener('dblclick',()=>{targetFocus.set(0,.9,0);targetDistance=homeDistance()});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();targetDistance=homeDistance();renderer.setSize(innerWidth,innerHeight)});
let first=true;function animate(){requestAnimationFrame(animate);yaw+=(targetYaw-yaw)*.09;pitch+=(targetPitch-pitch)*.09;distance+=(targetDistance-distance)*.09;focus.lerp(targetFocus,.09);positionCamera();renderer.render(scene,camera);if(first){document.getElementById('loading').remove();first=false}}animate();
</script>
</body>
</html>
